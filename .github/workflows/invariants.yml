name: invariant-guards

# 구조적 가드 (docs/architecture/structural-guardrails-enforcement.md):
# G1 import 경계, G2 스펙 기본값 스캐너, G4 보호 키 변경 마커.
# + 전체 vitest 스위트(vitest.config include set, ~102 파일)를 머지 게이트로 실행한다.
#   라이브/벤치(npm test=test:e2e, benchmark:*)는 credentialed라 CI에서 제외한다.
on:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: ripgrep (G13이 요구 — grep은 이 트리의 비ASCII 파일을 바이너리로 오인해 매치를 놓친다)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: TS typecheck (M3 benchmark scripts)
        # scripts/ run via tsx → covered by neither the src-only tsconfig nor
        # vitest's transform. Gates the typecheck-clean M3 set (tsconfig.scripts.json).
        run: npm run check:ts-scripts
      - name: G1 import boundary (INV-MOCK-1, repo-layout)
        run: npx tsx scripts/check-import-boundary.ts
      - name: G2 hardcoded spec defaults (INV-AUTH-1, INV-CFG-1)
        run: npx tsx scripts/check-no-hardcoded-spec-defaults.ts
      - name: G3 invariant tests (INV-AUTH-1, INV-SCHEMA-1, INV-TEST-1)
        run: npx vitest run --reporter=dot invariant.test
      - name: G4 protected key change marker (INV-AUTH-1, INV-CFG-1, INV-MATERIAL-1)
        run: npx tsx scripts/check-invariant-change-marker.ts "origin/${{ github.base_ref }}"
      - name: G7 supported-model guard (INV-MODEL-1)
        run: npx tsx scripts/check-supported-models.ts
      - name: G8 prompt-projection parity (INV-SCHEMA-1)
        run: npx tsx scripts/check-prompt-projection-parity.ts
      - name: G9 final-output-sections parity (INV-SCHEMA-1)
        run: npx tsx scripts/check-final-output-sections-parity.ts
      - name: G10 obligation-coverage ratchet (INV-OBLIGATION-COVERAGE-1)
        run: npx tsx scripts/check-obligation-coverage.ts "origin/${{ github.base_ref }}"
      - name: G11 reconstruct terminal-signal rethrow (INV-SCHEMA-1)
        run: npx tsx scripts/check-graceful-signal-rethrow.ts
      - name: G12 Linguist catalog drift (generated == regeneration)
        run: npx tsx scripts/check-linguist-drift.ts
      - name: G13 doc-currency self-test (게이트가 실패할 수 있는지 먼저 증명)
        run: bash scripts/check-doc-currency.sh --self-test
      - name: G13 doc-currency (활성 런타임 → 이력 참조 · dangling 경로)
        run: bash scripts/check-doc-currency.sh
      - name: G14 shipped-links self-test (게이트가 실패할 수 있는지 먼저 증명)
        run: node scripts/check-shipped-links.mjs --self-test
      - name: G14 shipped-links (배포 문서 링크가 설치본에서 풀리는가)
        run: node scripts/check-shipped-links.mjs
      - name: Full vitest suite (unit + integration merge gate)
        # vitest.config include set; superset of the G3 invariant subset above.
        # Live/benchmark scripts (npm test, benchmark:*) stay out — they need credentials.
        run: npm run test:vitest -- --reporter=dot
