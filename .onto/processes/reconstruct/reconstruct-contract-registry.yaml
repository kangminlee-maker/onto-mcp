readiness_projection:
  runtime_authority: reconstruct_runtime_readiness_projection_v1
  authority_rule: This registry declares allowed readiness values and semantic mapping labels; the executable precedence and status folding rule is owned by the runtime readinessProjection implementation until a registry-owned readiness-policy evaluator is promoted.
  canonical_values:
    - ready
    - limited
    - not_ready
    - blocked
  supporting_artifact_applicability_values:
    - applicable
    - not_applicable
  mapping:
    handoff_decision:
      ready_for_next_maturation_iteration: ready
      usable_for_maturation_with_named_limitations: limited
      not_ready_required_seed_gates_failed: not_ready
      blocked_missing_source_or_confirmation: blocked
    ontology_handoff.readiness_claim:
      ready: ready
      limited: limited
      not_ready: not_ready
      blocked: blocked
    competency_question_assessment.downstream_effect:
      ready: ready
      limited: limited
      blocks_handoff: not_ready
      blocked_by_missing_source_or_confirmation: blocked
  projection_rule: Final output and status/result APIs must project one canonical seed iteration readiness value plus the artifact-specific supporting fields that caused it.
  status_result_projection_contract:
    projection_authority_ref: handoff-decision-validation.yaml
    status_surface_refs:
      - core-api.reconstruct_status
      - core-api.reconstruct_result
      - mcp.onto_reconstruct_status
      - mcp.onto_reconstruct_result
      - final-output.md
      - reconstruct-record.yaml
    required_gate_projection_fields:
      - gate_instance_id
      - gate_id
      - source_catalog_id
      - validation_artifact_ref
      - required_when_predicate_id
      - activation_condition
      - activation_status
      - applicability
      - validation_status
      - readiness_effect
      - limitation_refs
      - explanation
    planned_gate_activation_status_values:
      - inactive
      - requested
      - promoted
      - applicable
      - not_applicable
      - blocked_missing_runtime
      - blocked_missing_validation
      - failed_validation
    unknown_or_duplicate_gate_projection: blocked
    hidden_applicable_gate_projection: blocked
    mixed_member_lineage_projection:
      authority_ref: target-material-profile-validation.yaml
      required_when: target-material-profile.yaml.target_material_kind == mixed
      required_fields:
        - member_id
        - target_ref
        - target_material_kind
        - selected_profile_id
        - selected_source_profile_snapshot_ref
        - source_profile_definition_sha256
        - support_state
        - runtime_implementation_status
        - source_refs
        - cross_material_ref_refs
        - purpose_element_refs
        - validation_ref
        - limitation_refs
        - aggregate_readiness_effect
        - next_action
      projection_rule: Status/result/final-output surfaces must expose member lineage for every mixed target when aggregate readiness is ready, limited, not_ready, or blocked. For limited, not_ready, or blocked aggregate readiness, the projection must identify the member that caused the readiness effect. For ready aggregate readiness, the projection must still let callers inspect which member or cross-material ref grounds each modeled purpose element without reopening target-material-profile.yaml or candidate artifacts.
  seed_confirmation_lifecycle_policy:
    seed_confirmation_required_when: seed_validity_or_seed_iteration_readiness_is_projected
    absent_seed_confirmation_artifact: blocked
    missing_seed_confirmation_validation_artifact: blocked
    explicit_limitation_allowed_when: seed-confirmation.yaml exists and seed-confirmation-validation.yaml records a valid confirmation or limitation state against the validated seed. Assessment-aware terminal seed iteration readiness belongs to handoff-decision-validation.yaml.
  handoff_validation_policy:
    gate_membership_authority_ref: [validation_gate_catalog, planned_validation_gate_catalog]
    terminal_gate_id: handoff_gate
    terminal_validation_ref: handoff-decision-validation.yaml
    output_projection_policy: final_output_and_reconstruct_record_are_emitted_after_handoff_validation_passes
    applicability_source: Runtime evaluates active validation_gate_catalog.required_when plus promoted or requested planned_validation_gate_catalog.required_when through required_when_predicate_catalog and records concrete gate instances in handoff-decision-validation.yaml.gate_projection[].
    promoted_planned_gate_policy: A planned gate becomes terminal-readiness-applicable when its activation_condition is implemented and its required_when predicate is true; accepted maturation execution additionally admits maturation_baseline_gate, baseline_actionability_matrix_gate, actionability_matrix_gate, and maturation_question_frontier_gate through their *_required predicates even if the artifacts are missing.
    conditional_absence_policy:
      unmet_required_when: not_applicable
      met_required_when_missing_artifact: blocked
  strictness_order_high_to_low:
    - blocked
    - not_ready
    - limited
    - ready
  missing_supporting_validation_policy:
    missing_applicable_validation_artifact: blocked
    failed_applicable_validation_artifact: not_ready
    non_applicable_conditional_validation_artifact: not_applicable
    skipped_optional_validation_artifact: limited
  conflict_rule: When supporting artifacts project different canonical values, choose the first value in strictness_order_high_to_low that appears among contributing artifacts; lower list index is stricter and wins. Cite every contributing artifact.

validator_records:
  - validator_id: reconstruct-run-control-validator
    gate_ids: [reconstruct_run_control_gate]
    validator_version: 1
    input_authority_refs:
      - reconstruct-run-control.yaml
      - reconstruct-contract-registry.yaml
    validation_obligations:
      - validate_session_root_request_fingerprint_target_signature_runtime_version_and_idempotency_are_replayable
      - reject_conflicting_request_fingerprints_before_semantic_artifacts_are_consumed
      - validate_current_attempt_and_session_root_lock_ownership
      - validate_committed_write_transactions_have_artifact_refs_and_hashes
      - preserve_post_write_hash_observation_without_claiming_atomic_commit_when_writer_did_not_prove_atomic_rename
    output_ref: reconstruct-run-control-validation.yaml
  - validator_id: registry-verification-evidence-validator
    gate_ids: [registry_verification_evidence_gate]
    validator_version: 1
    input_authority_refs:
      - registry-verification-evidence.yaml
      - reconstruct-contract-registry.yaml
    validation_obligations:
      - validate_registry_snapshot_hash_is_recorded
      - validate_registry_snapshot_hash_matches_current_registry_file
      - validate_active_registry_subject_lists_match_current_registry_catalogs
      - validate_active_artifact_gate_validator_predicate_and_source_profile_ids_are_unique
      - validate_every_active_gate_has_a_validator_record
      - validate_every_validator_gate_ref_resolves_to_an_active_gate
      - validate_every_active_gate_required_when_predicate_resolves
      - require_evidence_row_for_each_current_registry_subject_id
    output_ref: registry-verification-evidence-validation.yaml
  - validator_id: target-material-profile-validator
    gate_ids: [material_profile_gate]
    validator_version: 1
    input_authority_refs: [target-material-profile.yaml, reconstruct-contract-registry.yaml]
    validation_obligations:
      - every_selected_source_profile_snapshot_contains_version_policy_required_fields
      - every_selected_source_profile_snapshot_matches_source_profile_records_by_profile_id_and_target_material_kind
      - mixed_targets_preserve_per_member_selected_profile_id_contract_status_runtime_implementation_status_and_support_state
      - mixed_targets_preserve_per_member_source_profile_snapshot_ref_definition_hash_and_source_refs
      - mixed_targets_preserve_member_to_aggregate_purpose_requirement_mapping_or_limitation
      - partial_composite_member_support_limits_aggregate_ready_projection
    output_ref: target-material-profile-validation.yaml
  - validator_id: source-frontier-validator
    gate_ids: [source_frontier_gate]
    validator_version: 1
    input_authority_refs:
      - rounds/<round-id>/source-frontier.yaml
      - source-inventory.yaml
      - source-observations.yaml
      - target-material-profile-validation.yaml
      - reconstruct-contract-registry.yaml
    output_ref: rounds/<round-id>/source-frontier-validation.yaml
  - validator_id: source-observation-delta-validator
    gate_ids: [round_lineage_gate]
    validator_version: 1
    input_authority_refs:
      - rounds/<round-id>/source-observation-delta.yaml
      - rounds/<round-id>/source-frontier.yaml
      - rounds/<round-id>/source-frontier-validation.yaml
      - maturation-closure-frontier.yaml
      - maturation-closure-frontier-validation.yaml
      - source-observations.yaml
      - reconstruct-contract-registry.yaml
    conditional_input_authority_rule: "Use source-frontier refs when source_observation_delta.frontier_kind == source_frontier; use maturation-closure-frontier refs when source_observation_delta.frontier_kind == maturation_closure_frontier."
    validation_obligations:
      - validate_delta_frontier_kind_is_supported
