required_when_predicate_family_catalog:
  - predicate_family_id: frontier_observation_use_by_downstream_artifact
    parameter_names: [gate_instance_scope, downstream_artifact_ref, downstream_validation_ref]
    concept_rule: Generated instances all mean that a validated frontier-triggered observation delta is actually cited by a specific downstream artifact. In the active runtime this family is planning metadata except for answer-support consumption, which is validated by answer-support-ledger-validation after prompt/context re-entry passes.
    instance_naming_rule: <downstream_artifact_key>_uses_frontier_observation
    concept_economy_rule: Add a new generated instance only when a new downstream artifact can cite frontier observation ids; do not invent a new predicate concept for each artifact family.

required_when_predicate_catalog:
  - predicate_id: always
    input_authority_refs: []
    truth_expression: "true"
    unknown_projection: blocked
    explanation_template: "This gate is always required."
  - predicate_id: source_frontier_exists
    gate_instance_scope: per_round
    input_authority_refs: [rounds/<round-id>/source-frontier.yaml]
    truth_expression: "artifact_exists(rounds/<round-id>/source-frontier.yaml)"
    unknown_projection: not_applicable
    explanation_template: "A source frontier artifact exists for this round."
  - predicate_id: source_observations_exist
    input_authority_refs: [source-observations.yaml]
    truth_expression: "artifact_exists(source-observations.yaml) and source_observations.records_count > 0"
    unknown_projection: blocked
    explanation_template: "Observed source records exist and require evidence-ref closure."
  - predicate_id: frontier_observation_occurs
    gate_instance_scope: per_round
    input_authority_refs: [rounds/<round-id>/source-observation-delta.yaml]
    truth_expression: "artifact_exists(rounds/<round-id>/source-observation-delta.yaml) and source_observation_delta.frontier_kind in ['source_frontier', 'maturation_closure_frontier']"
    unknown_projection: blocked
    explanation_template: "A source-frontier or maturation-closure-frontier observation delta exists and requires lineage validation before downstream semantic use."
  - predicate_id: source_observation_lineage_index_exists
    input_authority_refs: [source-observation-lineage-index.yaml]
    truth_expression: "artifact_exists(source-observation-lineage-index.yaml)"
    unknown_projection: blocked
    explanation_template: "A session-level source observation lineage index exists and must be validated before downstream semantic use."
  - predicate_id: source_frontier_observation_delta
    gate_instance_scope: per_round
    input_authority_refs: [rounds/<round-id>/source-observation-delta.yaml]
    truth_expression: "artifact_exists(rounds/<round-id>/source-observation-delta.yaml) and source_observation_delta.frontier_kind == 'source_frontier'"
    unknown_projection: not_applicable
    explanation_template: "The round observation delta was triggered by the seeding source frontier."
  - predicate_id: maturation_closure_frontier_observation_delta
    gate_instance_scope: per_round
    input_authority_refs: [rounds/<round-id>/source-observation-delta.yaml]
    truth_expression: "artifact_exists(rounds/<round-id>/source-observation-delta.yaml) and source_observation_delta.frontier_kind == 'maturation_closure_frontier'"
    unknown_projection: not_applicable
    explanation_template: "The round observation delta was triggered by the maturation closure frontier."
  - predicate_id: frontier_observation_used_downstream
    derived_from_predicate_family_id: frontier_observation_use_by_downstream_artifact
    gate_instance_scope: per_round
    input_authority_refs:
      - <registry:required_when_predicate_catalog[predicate_family_id == frontier_observation_use_by_downstream_artifact].input_authority_refs[]>
    dynamic_input_authority_rule: Evaluate every generated frontier_observation_use_by_downstream_artifact predicate instance for the round from registry input refs; this aggregate predicate is true only when at least one generated instance is true.
    truth_expression: "any_generated_predicate_instance(frontier_observation_use_by_downstream_artifact).truth_value == true"
    unknown_projection: blocked
    explanation_template: "At least one registry-generated downstream artifact predicate cites a frontier-triggered observation delta."
  - predicate_id: lens_judgments_use_frontier_observation
    predicate_family_id: frontier_observation_use_by_downstream_artifact
    gate_instance_scope: per_round
    downstream_artifact_ref: rounds/<round-id>/lens-judgments/*.yaml
    input_authority_refs: [rounds/<round-id>/source-observation-delta.yaml, rounds/<round-id>/source-observation-delta-validation.yaml, rounds/<round-id>/lens-judgments/*.yaml]
    truth_expression: "source_observation_delta_validation.validation_status == valid and any_lens_judgment_refs_delta_observation_ids"
    unknown_projection: not_applicable
    explanation_template: "Round lens judgments cite observation ids from a frontier-triggered observation delta."
  - predicate_id: exploration_synthesis_uses_frontier_observation
    predicate_family_id: frontier_observation_use_by_downstream_artifact
    gate_instance_scope: per_round
    downstream_artifact_ref: rounds/<round-id>/exploration-synthesis.yaml
    input_authority_refs: [rounds/<round-id>/source-observation-delta.yaml, rounds/<round-id>/source-observation-delta-validation.yaml, rounds/<round-id>/exploration-synthesis.yaml]
    truth_expression: "source_observation_delta_validation.validation_status == valid and exploration_synthesis_refs_delta_observation_ids"
