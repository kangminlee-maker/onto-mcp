<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1138" viewBox="0 0 1800 1280" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">commerce-performance-marketing-kr 도메인 문서 전체 구조도</title>
  <desc id="desc">8개 도메인 문서의 역할, 내용 분류, 연결관계, 검증과 확장 흐름을 시각화한 SVG 구조도</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
