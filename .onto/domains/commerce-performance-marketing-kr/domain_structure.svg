      .section-title { font: 800 20px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .doc-title { font: 800 17px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
