  <rect class="bg" x="0" y="0" width="1800" height="1280"/>
  <text class="title" x="64" y="64">commerce-performance-marketing-kr 도메인 문서 전체 구조도</text>
  <text class="subtitle" x="64" y="96">국내 커머스 성과 마케팅 패키지의 8개 문서가 범위 정의, 개념 표준화, 구조화, 판단, 검증, 확장 통제를 어떻게 분담하는지 보여준다.</text>

