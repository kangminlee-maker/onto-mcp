      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .flow-soft { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow-soft); }
      .flow-dash { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 8 7; marker-end: url(#arrow-soft); }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .doc-scope { fill: #dbeafe; stroke: #2563eb; }
      .doc-concept { fill: #dcfce7; stroke: #16a34a; }
