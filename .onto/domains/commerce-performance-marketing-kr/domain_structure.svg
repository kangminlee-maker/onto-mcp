      .axis-pink { fill: #fdf2f8; stroke: #f472b6; }
      .axis-violet { fill: #f5f3ff; stroke: #a78bfa; }
      .axis-teal { fill: #f0fdfa; stroke: #2dd4bf; }
      .axis-red { fill: #fef2f2; stroke: #f87171; }
      .shadow { filter: drop-shadow(0 8px 16px rgba(15, 23, 42, 0.10)); }
