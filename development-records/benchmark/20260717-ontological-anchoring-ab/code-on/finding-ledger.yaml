        - 'Local Node runtime probe: `JSON.stringify(undefined)`,
          `JSON.stringify(() => {})`, and `JSON.stringify(Symbol("x"))` each
          produced `undefined`.'
    causal_path:
      root_cause_candidate: The function exposes the full `unknown` input domain while
        forwarding it directly to an operation whose result is not total over
        strings.
      root_cause_step_id: finding-001.cause-002
      steps:
        - cause_id: finding-001.cause-001
          claim: The observable return can be `undefined` while the signature requires
