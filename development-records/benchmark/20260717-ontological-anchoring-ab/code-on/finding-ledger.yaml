  - finding_id: finding-001
    lens_id: logic
    source_ref: .onto/review/20260717-e87f9480/round1/logic.findings.yaml#logic-candidate-001
    target: target.ts::unstableFormat
    evidence_anchor: .onto/review/20260717-e87f9480/execution-preparation/materialized-input.md:18-19
    claim: The declared `string` return contract is incompatible with the function's
      admitted inputs and observable result.
    lens_rationale_summary: The input type necessarily permits values for which the
      implementation can return a value excluded by the return type. Thus the
      exported signature and runtime behavior cannot be satisfied simultaneously
      across the declared input domain, weakening correctness and making caller
      assumptions unverifiable.
    proposed_action: Either change the return type to `string | undefined`, or
      explicitly handle non-serializable top-level values so every successful
      return is a string; add contrast tests for `undefined`, functions, and
      symbols.
    affected_purpose: "Review target profile goals: correctness, verifiability, and
      regression risk for declared exported API contracts."
    failure_condition: A caller passes a top-level value such as `undefined`, a
      function, or a symbol, all permitted by `unknown`.
    impact: The exported function returns `undefined` despite promising `string`, so
      type-checked callers can receive an impossible value and formatter
      behavior cannot be trusted against its declared contract.
    evidence_refs:
      - .onto/review/20260717-e87f9480/round1/logic.findings.yaml#logic-candidate-001
      - .onto/review/20260717-e87f9480/execution-preparation/materialized-input.md:18-19
      - 'Local Node runtime probe: `JSON.stringify(undefined)`,
        `JSON.stringify(() => {})`, and `JSON.stringify(Symbol("x"))` each
        produced `undefined`.'
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: "Review target profile goals: correctness, verifiability, and
        regression risk for declared exported API contracts."
      failure_condition: A caller passes a top-level value such as `undefined`, a
        function, or a symbol, all permitted by `unknown`.
      impact: The exported function returns `undefined` despite promising `string`, so
