  - finding_id: finding-004
    lens_id: dependency
    source_ref: .onto/review/20260717-e87f9480/round1/dependency.findings.yaml#dependency-candidate-002
    target: target.ts::unstableFormat
    evidence_anchor: target.ts:13-15 — formatting is entirely delegated to
      `JSON.stringify` without canonical key ordering.
    claim: Formatted output has an implicit directional dependency on object
      construction and property insertion order.
    lens_rationale_summary: A formatter used for verification or regression
      comparison should not change solely because an equivalent object's
      construction path changed. The direct dependency on insertion order makes
      output sensitive to an incidental upstream relation rather than only to
      the represented data.
    proposed_action: Use a stable serializer that recursively orders object keys
      before encoding, or explicitly document that the output is non-canonical
      and must not be used for equality, snapshots, hashes, or regression
      comparison.
    affected_purpose: Review target goals `verifiability` and `regression_risk`,
      under the confirmed request to review formatter behavior, especially
      `unstableFormat`.
    failure_condition: Semantically equivalent objects reach the formatter with
      different property insertion orders.
    impact: Snapshot, cache-key, comparison, or regression consumers can observe
      false differences, weakening trust in formatter output as repeatable
      evidence.
