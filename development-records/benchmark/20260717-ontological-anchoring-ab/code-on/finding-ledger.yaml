  - finding_id: finding-002
    lens_id: structure
    source_ref: .onto/review/20260717-e87f9480/round1/structure.findings.yaml#structure-candidate-001
    target: target.ts::unstableFormat
    evidence_anchor: "`export function unstableFormat(value: unknown): string {
      return JSON.stringify(value); }`"
    claim: "`unstableFormat` does not connect every accepted `unknown` input to its
      declared string result."
    lens_rationale_summary: The exported signature accepts these values through
      `unknown` and promises a string on normal return. Direct delegation leaves
      the formatter's required output path incomplete, so callers can receive a
      non-string value and the declared contract is not verifiable across its
      admitted input space.
    proposed_action: Either narrow the parameter to a JSON-serializable input
      contract or normalize the serializer result, for example by returning an
      explicit deterministic fallback when `JSON.stringify(value)` is
      `undefined`. Add tests for `undefined`, functions, and symbols.
    affected_purpose: The review goals of correctness, verifiability, and regression
      risk for formatter behavior, together with the exported `unknown ->
      string` contract.
    failure_condition: A caller supplies a top-level value such as `undefined`, a
      function, or a symbol, for which `JSON.stringify` returns `undefined`.
    impact: The implementation observably violates its declared return type,
      weakening trust that the formatter produces a usable string for its
      accepted inputs.
    evidence_refs:
      - .onto/review/20260717-e87f9480/round1/structure.findings.yaml#structure-candidate-001
      - "materialized-input.md: `unstableFormat(value: unknown): string`"
      - "materialized-input.md: `return JSON.stringify(value);`"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: The review goals of correctness, verifiability, and regression
        risk for formatter behavior, together with the exported `unknown ->
        string` contract.
      failure_condition: A caller supplies a top-level value such as `undefined`, a
        function, or a symbol, for which `JSON.stringify` returns `undefined`.
      impact: The implementation observably violates its declared return type,
        weakening trust that the formatter produces a usable string for its
        accepted inputs.
      evidence_refs:
        - "materialized-input.md: `unstableFormat(value: unknown): string`"
        - "materialized-input.md: `return JSON.stringify(value);`"
    causal_path:
      root_cause_candidate: The formatter directly exposes `JSON.stringify` without
        narrowing its input domain or connecting the serializer's non-string
        outcome to a string fallback.
      root_cause_step_id: finding-002.cause-002
      steps:
