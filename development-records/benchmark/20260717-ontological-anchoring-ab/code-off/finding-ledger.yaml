  - finding_id: finding-009
    lens_id: evolution
    source_ref: .onto/review/20260717-d7b236f4/round1/evolution.findings.yaml#evolution-candidate-001
    target: target.ts — unstableFormat
    evidence_anchor: "target.ts:14-16 (`unstableFormat(value: unknown): string`
      directly returns `JSON.stringify(value)`)"
    claim: The formatter’s `unknown -> string` contract cannot safely absorb new
      JavaScript value categories.
    lens_rationale_summary: Accepting `unknown` advertises broad extensibility, but
      raw `JSON.stringify` has narrower, type-dependent behavior. Adding
      previously unseen values can therefore change the function from returning
      a meaningful string to returning no value, throwing, or losing data,
      weakening correctness, regression safety, and verifiability.
    proposed_action: Define an explicit formatting contract and enforce it with a
      canonical serializer or normalization layer. Either restrict the accepted
      input type to supported JSON values, or specify deterministic handling and
      explicit errors for `undefined`, `BigInt`, cycles, `Map`, `Set`, and other
      non-JSON values; align the return type with the chosen behavior.
    affected_purpose: The exported formatter’s declared ability to convert an
      unknown value into a string while supporting correctness, verifiability,
      regression resistance, and maintainability.
    failure_condition: A caller supplies a top-level non-JSON value, a `BigInt`, a
      cyclic structure, or a collection type such as `Map` or `Set`.
    impact: Future input-type expansion can introduce runtime exceptions, contract
      violations, or silent information loss without changing this API, making
      formatter output unreliable for callers and regression checks.
    evidence_refs:
      - .onto/review/20260717-d7b236f4/round1/evolution.findings.yaml#evolution-candidate-001
