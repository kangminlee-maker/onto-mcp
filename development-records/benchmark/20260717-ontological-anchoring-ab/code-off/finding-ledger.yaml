findings:
  - finding_id: finding-001
    lens_id: logic
    source_ref: .onto/review/20260717-d7b236f4/round1/logic.findings.yaml#logic-candidate-001
    target: target.ts — unstableFormat
    evidence_anchor: "target.ts:13-14 (`unstableFormat(value: unknown): string`
      directly returns `JSON.stringify(value)`)"
    claim: Fail — the admitted `unknown` input domain and unconditional `string`
      return contract are not simultaneously satisfiable.
    lens_rationale_summary: This is an inter-claim, necessary-contract conflict
      between target.ts:13 and target.ts:14. A bounded Node runtime probe
      confirmed `JSON.stringify(undefined)` returns `undefined` and
      `JSON.stringify(1n)` throws `TypeError`. Thus valid inputs admitted by the
      parameter type can violate the declared return and completion behavior,
      weakening correctness and regression trust.
    proposed_action: "Define the intended input and failure contract explicitly:
      either narrow the parameter to supported JSON-serializable values and
      handle serialization failures, or widen the return/error contract and make
      callers handle `undefined` and exceptions."
    affected_purpose: Correctness and verifiability of the exported formatter contract.
    failure_condition: A caller passes an admitted value that JSON.stringify cannot
      serialize to a string, including `undefined`, a function, a symbol,
      `BigInt`, or a cyclic object.
    impact: The function can return a non-string or throw despite its unconditional
      string signature, causing compile-time rejection under strict typing or
      unexpected caller-facing runtime failure.
    evidence_refs:
      - .onto/review/20260717-d7b236f4/round1/logic.findings.yaml#logic-candidate-001
      - target.ts:13
      - target.ts:14
      - "Bounded Node probe: JSON.stringify(undefined) produced undefined;
        JSON.stringify(1n) threw TypeError"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Correctness and verifiability of the exported formatter contract.
      failure_condition: A caller passes an admitted value that JSON.stringify cannot
        serialize to a string, including `undefined`, a function, a symbol,
        `BigInt`, or a cyclic object.
      impact: The function can return a non-string or throw despite its unconditional
        string signature, causing compile-time rejection under strict typing or
        unexpected caller-facing runtime failure.
      evidence_refs:
        - target.ts:13
        - target.ts:14
        - "Bounded Node probe: JSON.stringify(undefined) produced undefined;
          JSON.stringify(1n) threw TypeError"
    causal_path:
      root_cause_candidate: The formatter forwards an unrestricted `unknown` value to
        a partial serialization operation without narrowing the input domain or
        handling non-string and exceptional outcomes.
      root_cause_step_id: finding-001.cause-002
      steps:
        - cause_id: finding-001.cause-001
          claim: The exported signature guarantees a string result for every admitted
            `unknown` input.
          relation_to_previous: null
          evidence_refs:
            - target.ts:13
        - cause_id: finding-001.cause-002
          claim: The implementation directly exposes JSON.stringify outcomes, which
            include undefined and exceptions for members of that input domain.
          relation_to_previous: symptom_of
          evidence_refs:
            - target.ts:14
            - "Bounded Node probe: undefined result and BigInt TypeError"
      unresolved_beyond_evidence: The boundary contains no caller contract specifying
        whether unsupported values should be rejected, represented by a fallback
        string, or exposed through a widened result type.
  - finding_id: finding-002
    lens_id: structure
    source_ref: .onto/review/20260717-d7b236f4/round1/structure.findings.yaml#structure-candidate-001
    target: "target.ts: unstableFormat"
    evidence_anchor: "materialized-input.md :: target.ts :: `return JSON.stringify(value);`"
    claim: The formatter lacks a canonicalization step, so structurally equivalent
      objects can produce different output strings.
    lens_rationale_summary: "Object insertion order is preserved in serialized
      output, so `{a: 1, b: 2}` and `{b: 2, a: 1}` produce different strings
      despite representing the same key/value structure. This makes formatter
      output unreliable for comparisons, snapshots, caching, or regression
      evidence."
    proposed_action: Canonicalize serializable objects by recursively sorting their
      keys before serialization, or use an established stable-stringification
      implementation and test equivalent objects constructed in different
      orders.
    affected_purpose: Verifiable, regression-resistant formatter behavior.
    failure_condition: Two structurally equivalent object values have different
      property insertion orders.
    impact: Output changes without a corresponding semantic data change, weakening
      comparisons and regression signals produced from the formatter.
    evidence_refs:
      - .onto/review/20260717-d7b236f4/round1/structure.findings.yaml#structure-candidate-001
      - "materialized-input.md :: target.ts :: `unstableFormat(value: unknown):
        string`"
      - "materialized-input.md :: target.ts :: `return JSON.stringify(value);`"
      - "prompt packet :: request_summary :: focus on unstableFormat"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Verifiable, regression-resistant formatter behavior.
      failure_condition: Two structurally equivalent object values have different
        property insertion orders.
      impact: Output changes without a corresponding semantic data change, weakening
