  - finding_id: finding-001
    lens_id: logic
    source_ref: .onto/review/20260717-13297536/round1/logic.findings.yaml#logic-candidate-001
    target: budget.xlsx — Summary!B1 grand-total formula
    evidence_anchor: "materialized-input.md: formulas lists Summary!B1 as
      SUM(Data!B2:B4); Data inventory shows five Amount values corresponding to
      Data rows 2–6; Summary contract states “Grand Total (must aggregate ALL
      Data rows)”"
    claim: The declared all-row aggregation rule and the implemented grand-total
      formula cannot both be satisfied.
    lens_rationale_summary: A total over three of five Data amounts is logically
      incompatible with the explicit requirement to aggregate every Data row.
      The resulting total can understate spending and is not trustworthy for the
      declared spending decision.
    proposed_action: Change the formula to include the complete Amount range, at
      minimum SUM(Data!B2:B6), and verify recalculation against all five Data
      records.
    affected_purpose: "Declared contract: Summary sheet totals must faithfully
      aggregate every Data sheet row for a spending decision."
    failure_condition: Whenever Data!B5 or Data!B6 contains an amount, Summary!B1
      omits it from the grand total.
    impact: The decision-facing total is incomplete, directly weakening trust in the
      workbook’s primary result.
    evidence_refs:
      - .onto/review/20260717-13297536/round1/logic.findings.yaml#logic-candidate-001
      - materialized-input.md — Summary!B1 formula SUM(Data!B2:B4)
      - materialized-input.md — Data has five non-empty Amount values across
        rows 2–6
      - materialized-input.md — Summary column contract requires aggregating ALL
        Data rows
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: "Declared contract: Summary sheet totals must faithfully
        aggregate every Data sheet row for a spending decision."
      failure_condition: Whenever Data!B5 or Data!B6 contains an amount, Summary!B1
        omits it from the grand total.
      impact: The decision-facing total is incomplete, directly weakening trust in the
        workbook’s primary result.
      evidence_refs:
        - materialized-input.md — Summary!B1 formula SUM(Data!B2:B4)
        - materialized-input.md — Data has five non-empty Amount values across
          rows 2–6
        - materialized-input.md — Summary column contract requires aggregating
          ALL Data rows
    causal_path:
      root_cause_candidate: The grand-total formula uses a fixed partial source range
        ending at Data!B4 instead of the full Data Amount range ending at B6.
      root_cause_step_id: finding-001.cause-002
      steps:
        - cause_id: finding-001.cause-001
          claim: Summary!B1 omits two populated Data Amount rows from its result.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md — Summary!B1 formula SUM(Data!B2:B4)
