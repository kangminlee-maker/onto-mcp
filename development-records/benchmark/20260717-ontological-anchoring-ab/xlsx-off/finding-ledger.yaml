    target: budget.xlsx — Summary!B1 grand-total formula
    evidence_anchor: ".onto/review/20260717-22cfd504/execution-preparation/material\
      ized-input.md: Summary formula `SUM(Data!B2:B4)`; Data has five Amount
      values across the row span corroborated by `GrandTotalRange →
      Data!$A$2:$A$6`; Summary declares `Grand Total (must aggregate ALL Data
      rows)`"
    claim: The obligatory all-row aggregation rule and the implemented B2:B4 source
      range cannot both be satisfied.
    lens_rationale_summary: "This is an inter-claim conflict under obligatory
      modality: the workbook explicitly requires every Data row to contribute,
      but the formula structurally omits two rows. The Summary total therefore
      cannot faithfully implement its declared contract, regardless of whether
      omitted values happen to cancel numerically."
    proposed_action: Change the formula to cover the complete Amount range,
      currently `SUM(Data!B2:B6)`, or use a table/dynamic range that necessarily
      includes every Data row; then recalculate and verify the result.
    affected_purpose: The Summary sheet totals must faithfully aggregate every Data
      row for a spending decision.
    failure_condition: Whenever Summary!B1 is treated as the grand total, Data rows
      5 and 6 are outside its source range.
    impact: A decision-facing total is computed from an incomplete mandatory input
      set, so the workbook cannot support the declared spending decision with
      trustworthy totals.
