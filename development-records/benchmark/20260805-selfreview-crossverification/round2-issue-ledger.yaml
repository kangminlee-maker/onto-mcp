  - issue_id: issue-002
    root_cause_hypothesis: Terminal validation was inserted only in the
      degradation-summary construction branch instead of dominating every
      state-mutating path at the writer boundary.
    root_confidence: high
    surface_finding_ids:
      - finding-002
    relation_refs: []
    raised_by_lens_ids:
      - structure
    issue_statement: The no-degradation early-return path can remove a degradation
      summary before requireTerminalExecutionResult establishes that the
      execution has terminated.
    proposed_action: Validate terminality at the writer entry before deriving
      degradation kinds or removing or writing the summary, and test that a
      running artifact with no degradation kinds throws without deleting
      existing evidence.
    affected_purpose: The declared terminal-consumer contract and the target goals
      of provenance, evidence preservation, and auditability.
    failure_condition: writeDegradationSummaryArtifact receives a running execution
      result for which degradationKindsFor returns an empty array.
    impact: A terminal-artifact writer can erase audit evidence without
      terminal-state proof, so summary absence no longer reliably represents a
      finished non-degraded run.
    evidence_refs:
      - .onto/review/20260805-1c915648/round1/structure.findings.yaml#structure-candidate-001
