  - issue_id: issue-007
    root_cause_hypothesis: Lens-summary tests are confined to completed-only mid-run
      fixtures and therefore omit both failed-lens derivation and terminal
      trusted-set narrowing.
    root_confidence: medium
    surface_finding_ids:
      - finding-009
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: The new derived lens-summary logic is not tested across failure
      cases or the mid-run-to-terminal transition, so contradictions between
      derived summaries and the terminal writer can remain undetected.
    proposed_action: Use a non-empty mixed completed/failed fixture to verify
      mid-run participating, degraded, and count fields, then finalize the same
      execution and assert terminal trusted, degraded, excluded, and count
      projections with contrast controls.
    affected_purpose: The user-request-intent criterion that derived lens summaries
      remain consistent with the terminal writer, plus the target goals of
      provenance and evidence preservation.
    failure_condition: Failed lenses exist or the mid-run recorded set differs from
      the terminal trusted set, while completed-only tests continue to pass
      despite incorrect summary derivation.
    impact: Participation and degradation evidence can contradict itself across
      lifecycle stages, weakening trust in the execution result as an auditable
      account.
    evidence_refs:
