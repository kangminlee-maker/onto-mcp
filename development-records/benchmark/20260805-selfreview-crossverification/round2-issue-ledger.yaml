  - issue_id: issue-001
    root_cause_hypothesis: A single reliance on TypeScript-declared artifact shape
      instead of fail-closed runtime validation causes both the broad
      terminal-gate weakness and the completion-evidence semantic violation;
      adding complete runtime validation at the gate should eliminate both. /
      The unsupported-status defect is one falsifiable manifestation of the
      broader gate design that trusts the static artifact type and implements
      terminality as merely not running.
    root_confidence: medium
    surface_finding_ids:
      - finding-001
      - finding-004
      - finding-005
    relation_refs:
      - rel-003
      - rel-005
    raised_by_lens_ids:
      - logic
      - semantics
      - pragmatics
    issue_statement: "Shared-root issue across finding-001, finding-004,
      finding-005: A single reliance on TypeScript-declared artifact shape
      instead of fail-closed runtime validation causes both the broad
      terminal-gate weakness and the completion-evidence semantic violation;
      adding complete runtime validation at the gate should eliminate both. /
      The unsupported-status defect is one falsifiable manifestation of the
      broader gate design that trusts the static artifact type and implements
      terminality as merely not running."
    proposed_action: "Make the shared gate validate runtime membership in
      `REVIEW_EXECUTION_STATUS_VALUES`, exclude `running`, and require a
      non-empty string completion timestamp plus a finite numeric duration. Add
      negative tests using omitted fields (`undefined`) and an unsupported
      status, and exercise record assembly so the assertions fail if its real
      terminal path bypasses validation. / Make requireTerminalExecutionResult
      validate runtime semantics: require a non-empty, parseable
      execution_completed_at string and a finite, non-negative total_duration_ms
      number, thereby also rejecting undefined and wrong types. Add contrast
      tests for omitted fields, an unparseable timestamp, and invalid numeric
      durations through at least one direct consumer such as record assembly. /
      Make requireTerminalExecutionResult explicitly accept only completed,
      completed_with_degradation, and halted_partial, rejecting every other
      runtime value. Add a negative test that feeds an unsupported status
      through the record-assembly path and asserts that no ReviewRecord is
      produced."
    affected_purpose: "The confirmed `user-request-intent` criterion that
      `requireTerminalExecutionResult` reach and protect every terminal
      consumer, and the review target's auditability goal. / The confirmed
      user-request-intent criterion that terminal consumers receive
      requireTerminalExecutionResult, new exception paths remain safe, and
      assertions fail when the mechanism is wrong; also the target profile's
      auditability goal. / Confirmed user-request-intent criterion: verify that
      requireTerminalExecutionResult actually protects every terminal consumer
      and that the response preserves provenance, auditability, and an
      unambiguous terminal answer."
    failure_condition: A terminal consumer receives parsed artifact data with a
      non-running but unsupported/missing status or omitted completion fields. /
      A deserialized terminal execution-result omits a completion field or
      contains a syntactically present but semantically invalid timestamp or
      duration. / A persisted execution-result.yaml contains an unsupported
      status plus non-null completion fields and is consumed by record assembly
      without the renderer's separate enum validation.
    impact: The canonical terminal gate can certify an object that does not satisfy
      the terminal artifact contract, weakening consistency and trust in review
      records and terminal metadata; the added tests do not detect this bypass.
      / The shared gate can certify an artifact that does not satisfy its
      advertised terminal-evidence contract, so downstream records or summaries
      may fail later with an unrelated error or preserve invalid audit
      timestamps. / The canonical ReviewRecord can inherit a status outside its
      declared vocabulary, so users and downstream readers cannot derive one
      valid interpretation of whether and how the review terminated.
    evidence_refs:
      - .onto/review/20260805-1c915648/round1/logic.findings.yaml#logic-candidate-001
      - "change.diff: src/core-runtime/review/artifact-types.ts
        requireTerminalExecutionResult implementation"
