  - issue_id: issue-004
    root_cause_hypothesis: Execution-status membership and terminality are
      maintained as separate, non-exhaustive projections rather than being
      derived from one exhaustive status-classification authority.
    root_confidence: medium
    surface_finding_ids:
      - finding-006
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: The status model can classify a future non-terminal state as
      terminal or reject a valid added status when the union, runtime set,
      terminal type, and literal gate branch drift.
    proposed_action: Introduce one exhaustive status-metadata authority and derive
      runtime membership and terminal classification from it, keeping the
      terminal artifact type aligned with explicitly terminal entries.
    affected_purpose: The target goals of evidence preservation and auditability,
      and the user criterion that terminal consumers must not derive terminal
      verdicts from in-flight results.
    failure_condition: A future execution status is added as non-terminal, or a new
      union member is not added consistently to the separately maintained
      runtime set and terminal projections.
    impact: A valid execution artifact can be rejected or an unfinished lifecycle
      can be projected as terminal, weakening continuity and trust in records
      and final outputs.
    evidence_refs:
      - .onto/review/20260805-1c915648/round1/evolution.findings.yaml#evolution-candidate-001
      - "change.diff: src/core-runtime/review/artifact-types.ts additions
        defining `ReviewExecutionStatus`, `ReviewTerminalExecutionStatus`, and
        `REVIEW_EXECUTION_STATUS_VALUES`"
      - "change.diff: `requireTerminalExecutionResult` branch that rejects only
        the literal `running`"
      - "change.diff: terminal consumers in assemble-review-record.ts,
        render-review-final-output.ts, and run-review-prompt-execution.ts"
      - change.diff — `ReviewTerminalExecutionStatus =
        Exclude<ReviewExecutionStatus, "running">`;
        `requireTerminalExecutionResult` rejects only `execution_status ===
        "running"`; `REVIEW_EXECUTION_STATUS_VALUES` is a manually populated
        `Set`
    severity: medium
    domain_threshold_used: null
