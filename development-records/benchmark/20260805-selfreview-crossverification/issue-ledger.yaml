    root_cause_hypothesis: executed_lens_count is derived from the completed-only
      participating subset rather than from all recorded lens execution results.
    root_confidence: high
    surface_finding_ids:
      - finding-001
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: The aggregate execution summary undercounts executed lenses
      when recorded lens results include failures.
    proposed_action: Derive executed_lens_count from all recorded
      lens_execution_results, or explicitly redefine and rename it as a
      completed/participating-lens count, with a failed-lens regression case.
    affected_purpose: The declared provenance, evidence-preservation, and
      auditability goal that execution-result.yaml remain the truthful aggregate
      artifact whose counters track merged per-unit results.
    failure_condition: At least one failed lens execution result is merged before
      any completed lens result, or failed results otherwise outnumber completed
      results.
    impact: Consumers see an internally contradictory progress summary and can
      undercount executed work, recreating the misleading interim-artifact
      behavior this change intends to eliminate.
    evidence_refs:
      - .onto/review/20260805-fdb85e12/round1/logic.findings.yaml#logic-candidate-001
