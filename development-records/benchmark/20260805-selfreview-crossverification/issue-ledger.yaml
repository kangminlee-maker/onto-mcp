    issue_statement: Terminal-result certification and status classification are
      split across incomplete negative checks and independently maintained
      authorities.
    proposed_action: Define one exhaustive terminal-status tuple or predicate,
      derive the terminal type from it, reuse it across the gate and renderer,
      and have the gate separately validate parseable timestamps, finite
      nonnegative duration, and actionable malformed-artifact errors.
    affected_purpose: The confirmed intent to preserve execution-result.yaml truth
      and ensure terminal consumers cannot project an invalid verdict, together
      with the review goals of provenance, evidence preservation, and
      auditability.
    failure_condition: A terminal consumer reads unsupported or temporally malformed
      persisted data, or the execution-status vocabulary evolves without all
      independent classification sites being updated consistently.
    impact: Malformed execution facts can be certified, legitimate terminal states
      can become unrenderable, new nonterminal states can be treated as
      terminal, and operators can receive ineffective polling guidance.
    evidence_refs:
