  - issue_id: issue-007
    root_cause_hypothesis: The host scaffold was converted to a real nonterminal
      state without a bounded-diff-visible finalization path for every declared
      non-success terminal outcome.
    root_confidence: medium
    surface_finding_ids:
      - finding-008
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: Host executions that halt or degrade may remain falsely running
      because only successful completion is visibly finalized.
    proposed_action: Add host termination finalization for halted_partial and
      completed_with_degradation, including completion stamps, duration,
      counters, and halt evidence, with end-to-end halted and degraded tests.
    affected_purpose: The confirmed user-request intent that execution-result.yaml
      truthfully represent running versus terminal review execution and remain
      usable by terminal consumers.
    failure_condition: A host-driven review stops or degrades before the ledger
      reaches the all-trusted completion condition.
    impact: The canonical aggregate artifact can remain falsely running, and
      terminal record or degradation consumers can reject a run that has
      actually ended.
    evidence_refs:
      - .onto/review/20260805-fdb85e12/round1/coverage.findings.yaml#coverage-candidate-001
      - "src/core-runtime/review/review-execution-steps.ts:
        buildInitialExecutionResultScaffold now emits running/null/null"
      - "src/core-runtime/review/review-execution-steps.ts:
        finalizeHostExecutionResultIfComplete only emits completed"
      - "src/core-runtime/review/artifact-types.ts: terminal vocabulary includes
        completed_with_degradation and halted_partial"
      - "src/core-runtime/cli/assemble-review-record.ts: record assembly now
        requires a terminal execution result"
    severity: medium
    domain_threshold_used: null
