    issue_statement: Malformed terminal artifacts are reported as still running,
      producing an untruthful diagnosis and ineffective recovery instruction.
    proposed_action: Report genuinely running artifacts with polling guidance, but
      classify terminal statuses with missing or invalid completion fields as
      malformed results requiring repair or rerun.
    affected_purpose: "Confirmed user-request-intent: make execution-result.yaml
