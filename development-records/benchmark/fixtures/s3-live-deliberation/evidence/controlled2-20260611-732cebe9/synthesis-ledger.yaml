      arriving in the gap that does exist - after window close, before the flush
      poll - are emitted in the closing digest and destroyed by the
      unconditional wholesale clear; C7 and C8 are not jointly satisfiable for
      any item present at flush time, and the declared carry-over category is
      absent from the implementation space. Source finding context:
      notification-batcher.ts Source finding context:
      notification-batcher.ts:37-40, notification-batcher.ts:34-36 Source
      finding context: C7 guarantees that notifications enqueued between the
      window-close check and the reset are carried into the next window, but C8
      emits the entire pending map and clears it unconditionally within one
      synchronous call: under the literal reading the interval admits no
      enqueues (vacuous guarantee), and under the only reachable reading (items
      enqueued after the close instant but before the flush poll) such items are
      emitted in the current digest and destroyed, never carried over. C7 and C8
      are not jointly satisfiable for any item present at flush time. Source
      finding context: Logic lens found a contract-vs-behavior contradiction: C7
      states an obligatory carry-over whose obligated state is unreachable — the
      obligation is quantified over an interval the synchronous execution model
      makes empty, concealing that the guarantee is false under the reachable
      interpretation. The contradiction persists under both disambiguations of
      the interval referent. Source finding context: Reconcile claim and
      behavior in one direction: (a) implement the guarantee — filter the digest
      loop to items with enqueuedAt < windowStartedAt + WINDOW_MS, retain later
      items in pending, re-seed windowStartedAt for the retained set; or (b)
      correct the comment to actual behavior: all notifications pending at flush
