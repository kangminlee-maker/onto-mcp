  - finding_id: finding-012
    lens_id: semantics
    source_ref: round1/semantics.md#sem-2
    target: notification-batcher.ts
    evidence_anchor: "flush comment: 'Notifications enqueued between the window close check and this reset are carried into the next window'; flush body: for (const [userId, items] of this.pending) then clear()"
    claim: "The flush comment asserts carry-over behavior the code does not implement: (1) within a single synchronous flush body no enqueue can interleave between the close check and pending.clear(), so the described interleaving window cannot occur; (2) the gap that actually exists — between window close (windowStartedAt + WINDOW_MS) and the poller's flush call — has the opposite behavior: items enqueued in that gap are included in the closing window's digest, not carried into the next window."
    lens_rationale_summary: "Semantics lens flagged this as a direct contract-vs-behavior inconsistency under the declared review goals: the comment is the only written statement of the batcher's boundary semantics for late-arriving notifications and it states the inverse of observable behavior."
