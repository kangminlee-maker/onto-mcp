    failure_condition: "Reachable no-window state: never enqueued, or immediately after a flush — line 31 returns [] while no window exists."
    impact: "A polling caller cannot distinguish 'still batching' from 'idle' through the documented protocol; behaviorally benign for pure polling loops, but the stated protocol is formally false."
