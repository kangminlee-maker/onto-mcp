    lens_rationale_summary: "Coverage lens recorded the absence of a single time-authority concept as a dimension gap: the window-close judgment (line 32) directly compares an internally stamped value with a caller-injected value, and the same-clock contract is expressed nowhere — squarely against the request focus (time-source semantics) and the review goals (correctness, verifiability)."
    proposed_action: "Designate a single time authority: (i) inject a clock provider (now(): number) so enqueue/flush use the same authority, or (ii) remove the now parameter from flush and unify on the internal clock; also document on the interface that enqueuedAt shares the authoritative clock basis. Closure obligation proposed: must_close_in_target."
    affected_purpose: "Correctness and verifiability of the window-close judgment (request focus: time-source semantics)."
    failure_condition: "Caller drives flush(now) — or fills enqueuedAt — from a clock other than the internal Date.now() source (fake-timer tests, monotonic clock, skewed external clock)."
    impact: "The judgment criterion becomes meaningless across clocks: the window closes prematurely or stays open forever — digest delay/loss (correctness violation) and inability to substitute clocks in tests (verifiability degradation)."
