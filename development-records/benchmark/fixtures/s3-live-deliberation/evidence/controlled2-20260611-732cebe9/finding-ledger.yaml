findings:
  - finding_id: finding-001
    lens_id: logic
    source_ref: round1/logic.md#finding-l1
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:20, notification-batcher.ts:30-32"
    claim: "C3 binds the window-start instant to the ambient clock (Date.now() at enqueue) while C6 evaluates closure against a caller-supplied now; the claim set {C3, C4, C5, C6} is satisfiable only under the undeclared necessary constraint that now is epoch ms from the same clock as Date.now(), so for permitted inputs (any number) C4 'flushes when the window has closed' and C5 'empty means still open' are jointly violated."
    lens_rationale_summary: "Logic lens found inter-claim unsatisfiability: the single subtraction now - windowStartedAt presumes one shared clock that no declared claim establishes; a necessary precondition is granted only possible status by the declared surface (now: number, no time-base documentation). Residual contradiction survives semantic disambiguation, so logic retains primary ownership."
    proposed_action: "Unify time authority over the window lifecycle: (a) make caller time the single authority (accept now at both entry points, or derive window start from item.enqueuedAt), or (b) make ambient time the single authority (drop the now parameter, call Date.now() inside flush, inject a clock dependency for testability). Weakest acceptable: document on flush that now MUST be epoch ms from the same clock as Date.now()."
    affected_purpose: "Time-source semantics and correctness/verifiability of the window-closure contract (review intent: contract-vs-behavior consistency and time-source semantics)."
    failure_condition: "Any caller that drives flush(now) from a non-ambient time source (test/fake clock, monotonic-clock origin, skew-corrected or cached timestamp) — all permitted inputs under the bare number type."
    impact: "The closure predicate stops corresponding to 'the window has closed': with a monotonic-clock now the difference is permanently negative and flush returns [] forever while C5 keeps asserting the window is open; with a fast-skewed now the window closes before 30s of real elapsed time — digest delay or premature emission, silently breaking the documented window semantics."
    evidence_refs: [round1/logic.md#finding-l1]
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: "Time-source semantics and correctness/verifiability of the window-closure contract declared by the review intent."
      failure_condition: "flush(now) driven from any clock other than the Date.now() epoch-ms timeline used at enqueue — a permitted input under the declared surface."
      impact: "C4 and C5 become jointly violated for permitted inputs: flush never closes the window or closes it early, so the documented return protocol and window duration are untrustworthy."
      evidence_refs: [round1/logic.md#finding-l1]
    causal_path:
      root_cause_candidate: "Time authority is split across the two mutating entry points — ambient clock at enqueue (line 20) versus injected clock at flush (line 30) — with no claim anywhere in the bounded target declaring or enforcing the inter-clock identity the subtraction needs."
      root_cause_step_id: finding-001.cause-003
      steps:
        - cause_id: finding-001.cause-001
          claim: "For permitted numeric inputs, flush returns [] forever (monotonic now) or closes the window early (skewed now), violating C4 and C5 jointly."
          relation_to_previous: null
          evidence_refs: [round1/logic.md#finding-l1]
        - cause_id: finding-001.cause-002
          claim: "The closure check now - windowStartedAt subtracts a caller-chosen number from an ambient Date.now() sample, presuming a shared clock that no declared claim establishes."
          relation_to_previous: causes
          evidence_refs: [round1/logic.md#finding-l1]
        - cause_id: finding-001.cause-003
          claim: "Time authority is split between enqueue (ambient Date.now()) and flush (caller-injected now) with no declared or enforced inter-clock identity constraint in the bounded target."
          relation_to_previous: causes
          evidence_refs: [round1/logic.md#finding-l1]
      unresolved_beyond_evidence: null
  - finding_id: finding-002
    lens_id: logic
    source_ref: round1/logic.md#finding-l2
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:37-40, notification-batcher.ts:34-36"
    claim: "C7 guarantees that notifications enqueued between the window-close check and the reset are carried into the next window, but C8 emits the entire pending map and clears it unconditionally within one synchronous call: under the literal reading the interval admits no enqueues (vacuous guarantee), and under the only reachable reading (items enqueued after the close instant but before the flush poll) such items are emitted in the current digest and destroyed, never carried over. C7 and C8 are not jointly satisfiable for any item present at flush time."
    lens_rationale_summary: "Logic lens found a contract-vs-behavior contradiction: C7 states an obligatory carry-over whose obligated state is unreachable — the obligation is quantified over an interval the synchronous execution model makes empty, concealing that the guarantee is false under the reachable interpretation. The contradiction persists under both disambiguations of the interval referent."
    proposed_action: "Reconcile claim and behavior in one direction: (a) implement the guarantee — filter the digest loop to items with enqueuedAt < windowStartedAt + WINDOW_MS, retain later items in pending, re-seed windowStartedAt for the retained set; or (b) correct the comment to actual behavior: all notifications pending at flush time, including any enqueued after the window closed, are emitted in this digest; nothing carries over."
    affected_purpose: "Contract-vs-behavior consistency for late-enqueue boundary semantics (review goals: correctness, maintainability, regression_risk)."
    failure_condition: "Any notification present in pending at flush time — in particular items enqueued after windowStartedAt + WINDOW_MS but before the poller calls flush."
    impact: "The documented loss-safety guarantee is the opposite of actual behavior: late items are emitted into the closing digest and destroyed by clear(); maintainers and consumers reasoning from the comment assume a carry-over mechanism that was never built."
    evidence_refs: [round1/logic.md#finding-l2]
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: "The only documented late-arrival contract of the batcher; trust in doc-level guarantees under the declared review goals."
      failure_condition: "Items enqueued after the window-close instant and before the flush poll; any maintainer change premised on the documented carry-over."
      impact: "A documented guarantee is false for every item it could apply to — no state path lets an item survive into the next window — meaningfully weakening trust and decision quality for maintenance."
      evidence_refs: [round1/logic.md#finding-l2]
    causal_path:
      root_cause_candidate: "Nothing in the bounded target snapshots window membership at the close instant — line 32 gates only when emission happens, while what is emitted is taken wholesale from current state — so the promised carry-over has no mechanism that could implement it; the comment describes a design that was not built."
      root_cause_step_id: finding-002.cause-003
      steps:
        - cause_id: finding-002.cause-001
          claim: "Items enqueued after window close but before the flush poll are emitted in the closing digest and destroyed, never carried into the next window; the literal intra-call reading is vacuous in single-threaded synchronous JS."
          relation_to_previous: null
          evidence_refs: [round1/logic.md#finding-l2]
        - cause_id: finding-002.cause-002
          claim: "The digest loop iterates the whole pending map with no enqueuedAt/timestamp filter, and clear() plus windowStartedAt reset run unconditionally in the same synchronous body."
          relation_to_previous: causes
          evidence_refs: [round1/logic.md#finding-l2]
        - cause_id: finding-002.cause-003
          claim: "No mechanism snapshots window membership at the close instant: closure gates only when emission happens, not what is emitted, so the carry-over obligation has no realizing state path."
          relation_to_previous: causes
          evidence_refs: [round1/logic.md#finding-l2]
      unresolved_beyond_evidence: null
