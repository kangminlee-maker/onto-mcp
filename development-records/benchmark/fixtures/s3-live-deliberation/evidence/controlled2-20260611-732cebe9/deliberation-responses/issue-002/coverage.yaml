accepted_root_hypothesis: "No window-membership attribution mechanism exists
  anywhere in the bounded target: nothing snapshots or attributes window
  membership at the close instant, enqueue has no window-close-aware branch
  and records no per-item attribution, and flush drains and clears pending
  wholesale; implementing window-membership attribution or correcting the
  comment to actual behavior would resolve finding-002, finding-006, and
  finding-012 together. The shared-cause context with issue-004 (dep-001) is
  preserved: no trustworthy per-item timestamp exists on which attribution
  could be built, so a fix establishing one serves both issues without
  merging their distinct roots."
remaining_blocker: "The severity split persists at 2-vs-1 (coverage and
  logic at medium, semantics at high) on principled per-lens grounds rather
  than misunderstanding; resolution requires the synthesizer to decide
  whether a sole-written-contract inversion under the declared review goals
  outranks the reliance-mediated harm classification. No blocker remains on
  root hypothesis or proposed action."
