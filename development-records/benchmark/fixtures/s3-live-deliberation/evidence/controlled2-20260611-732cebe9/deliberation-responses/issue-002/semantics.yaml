accepted_root_hypothesis: "No window-membership attribution mechanism exists
  anywhere in the bounded target - nothing snapshots or attributes window
  membership at the close instant, enqueue records no per-item attribution
  and consumes no enqueuedAt, and flush drains and clears pending wholesale
  - so the carried-into-next-window claim is unimplementable from the state
  the code keeps; implementing attribution or correcting the comment
  resolves finding-002, finding-006, and finding-012. Shared-cause context
  preserved: issue-004's unconsumed caller-filled enqueuedAt (dep-001)
  explains why no trusted per-item time exists for attribution, and
  issue-003's missing collect-vs-commit separation (dep-002) is the
  wholesale-clear mechanism that destroys the promised carry-over items;
  shared cause and shared mechanism respectively, with distinct roots."
remaining_blocker: "The severity classification remains contested 2-vs-1
  (logic and coverage at medium, semantics at high) after genuine
  re-evaluation; the disagreement is a value-frame question - whether
  inversion of the sole written late-arrival contract is failure of
  declared purpose or reliance-mediated trust damage - and must be ruled by
  the synthesizer. Root hypothesis and proposed action are fully agreed and
  unblocked."
