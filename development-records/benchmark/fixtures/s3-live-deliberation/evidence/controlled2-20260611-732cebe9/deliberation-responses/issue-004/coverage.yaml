accepted_root_hypothesis: "A timestamp that should be derived by the component at enqueue time is modeled as an independent caller-supplied input with no consumer: the batcher neither stamps, validates, nor reads enqueuedAt, so the documented meaning 'epoch ms when the notification entered the batch' is unenforced and free to drift."
remaining_blocker: "The low-vs-medium decision cannot be closed inside any single lens: logic scopes its assertion to current consumers and does not contest the dep-001 ground, so resolution must rule whether a ledger-recorded remediation dependency (issue-002's carry-over fix requiring a trustworthy per-item timestamp) is severity-bearing within the bounded target. Coverage's position is that it is, and that the proposed_action (component-stamped timestamp from the issue-001 time authority, or field removal) resolves the issue on either reading."
