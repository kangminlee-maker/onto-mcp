      populated by the caller before enqueue, never set, validated, or read by
      the batcher, and influences no behavior — a value that should be derived
      by the component at enqueue time is modeled as an independent input with
      no consumer. Source finding context: Semantics lens classified this as a
      derived-value-vs-input mismatch with drift risk: the documented meaning is
