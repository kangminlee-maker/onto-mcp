    rationale: "Coverage raised finding-005 as exactly this absence: three parallel time sources (internal Date.now() at enqueue, caller-injected now at flush, caller-filled enqueuedAt) with no concept designating the authoritative clock. The root hypothesis names the missing single-time-authority concept itself, and designating one authority dissolves the dimension gap, so coverage accepts it as the starting cause. High severity holds: the window-close judgment compares values across undeclared clocks, hitting the declared request focus (time-source semantics) and the goals correctness and verifiability inside the bounded target."
    root_hypothesis_position: accepts
    severity_position: keeps
