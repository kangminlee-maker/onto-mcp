issues:
  - issue_id: issue-001
    stances:
      - lens_id: logic
        stance: support
        rationale: "The issue restates the unsatisfiability the logic lens proved in
          finding-l1: the closure predicate now - windowStartedAt presumes an
          inter-clock identity that no claim in the bounded target declares or
          enforces, so {C3, C4, C5, C6} are jointly violated for permitted
          inputs (any number). The root hypothesis matches finding-l1's causal
          trace verbatim — split time authority across the two mutating entry
          points is the starting cause. Logic additionally confirms the
          dissolution claim from its own ledger: the single-time-authority fix
          also collapses logic's unassigned finding-l4 (two unreconciled
          recordings of the batch-entry instant), since one designated clock
          authority leaves no second recording to diverge. The modality error (a
          necessary same-clock precondition granted only possible status by the
          declared surface) survives semantic disambiguation of the now
          parameter, so logic co-owns this issue rather than deferring it to
          semantics."
        root_hypothesis_position: accepts
        severity_position: keeps
        evidence_refs:
          - issue-ledger.yaml#issue-001
          - round1/logic.md#finding-l1
          - round1/logic.md#finding-l4
      - lens_id: coverage
        stance: support
        rationale: "Coverage raised finding-005 as exactly this absence: three parallel
          time sources (internal Date.now() at enqueue, caller-injected now at
          flush, caller-filled enqueuedAt) with no concept designating the
          authoritative clock. The root hypothesis names the missing
          single-time-authority concept itself, and designating one authority
          dissolves the dimension gap, so coverage accepts it as the starting
          cause. High severity holds: the window-close judgment compares values
          across undeclared clocks, hitting the declared request focus
          (time-source semantics) and the goals correctness and verifiability
          inside the bounded target."
        root_hypothesis_position: accepts
        severity_position: keeps
        evidence_refs:
          - issue-ledger.yaml#issue-001
          - round1/coverage.md#f1
          - finding-relation-graph.yaml#rel-001
      - lens_id: semantics
        stance: support
        rationale: "The issue root is verbatim-aligned with this lens's terminal cause
          for SEM-1: one concept (elapsed window time) is measured across two
          undeclared clocks, and the now parameter carries an implicit
          shared-clock promise declared nowhere on the type or doc surface. The
          semantic defect is authority placement, not arithmetic: the window-age
          concept has no designated time authority, so the closure predicate's
          meaning is undefined for permitted inputs. The lens also confirms the
          dissolution claim: a single declared time authority removes the
          semantic mismatch this lens found, and the same authority should be
          named as the clock basis for enqueuedAt (issue-004 coupling)."
        root_hypothesis_position: accepts
        severity_position: keeps
        evidence_refs:
          - issue-ledger.yaml#issue-001
          - round1/semantics.md#sem-1
  - issue_id: issue-002
    stances:
      - lens_id: logic
        stance: support
        rationale: "Logic proved in finding-l2 that C7 and C8 are not jointly
          satisfiable for any item present at flush time: the literal
          interleaving interval is empty under synchronous execution (vacuous
          obligation), and the reachable reading inverts the guarantee — late
          items are emitted into the closing digest and destroyed by the
          unconditional clear. The root hypothesis (no mechanism snapshots or
          attributes window membership at the close instant; the comment
          describes a design that was not built) is exactly finding-l2's
          terminal cause, so logic accepts it. On severity, logic takes its
          round-1 position: medium, not high. The contradiction is formally
          certain, but within the bounded target its harm path is
          reliance-mediated — it requires a maintainer or consumer to act on the
          falsified comment — rather than an unconditional runtime fault; the
          code's actual behavior (emit-all-then-clear) is internally consistent
          absent the comment. Logic does not contest that semantics'
          contract-trust framing can justify high from its own perspective, but
          the formal-consistency assessment is medium."
        root_hypothesis_position: accepts
        severity_position: lowers
        evidence_refs:
          - issue-ledger.yaml#issue-002
          - round1/logic.md#finding-l2
      - lens_id: coverage
        stance: support
        rationale: "The issue is real from the coverage perspective: the declared
          carry-over category has no realizing mechanism anywhere in the
          implementation space (finding-006), so the only written late-arrival
          contract is unbacked by any code path. Coverage accepts the root
          hypothesis (no window-membership attribution; implement attribution or
          correct the comment). On severity, coverage maintains its round-1
          position of medium rather than high: the unexpressed category misleads
          maintainers (maintainability, regression_risk) but the present
          behavior is internally coherent for every represented category, no
          data is lost in normal operation, and the absence is fully closable by
          a one-line contract correction - the cost of this gap is bounded below
          the cross-clock correctness break of issue-001, and two of three
          lens-level findings (logic, coverage) also rated it medium."
        root_hypothesis_position: accepts
        severity_position: lowers
        evidence_refs:
          - issue-ledger.yaml#issue-002
          - round1/coverage.md#f2
          - finding-relation-graph.yaml#rel-003
      - lens_id: semantics
        stance: support
        rationale: "Matches SEM-2 exactly: the flush comment is the only written
          late-arrival contract and asserts the inverse of observable behavior -
          post-close enqueues join the closing digest and are destroyed, never
          carried over, and the described check-to-reset interleave is
          unreachable in synchronous JS. The root (no window-membership
          attribution mechanism anywhere in the target) is the same terminal
          cause this lens traced: enqueue records no per-item attribution and
          uses no enqueuedAt, so the carried-into-next-window claim is
          unimplementable from the state the code keeps. Severity stays high
          from this lens despite the logic lens's medium on finding-002: a sole
          written boundary contract stating the inverse of behavior is a
          first-order contract-vs-behavior failure under the declared review
          goals."
        root_hypothesis_position: accepts
        severity_position: keeps
        evidence_refs:
          - issue-ledger.yaml#issue-002
          - round1/semantics.md#sem-2
  - issue_id: issue-003
    stances:
      - lens_id: logic
        stance: not_applicable
        rationale: "The issue is a pure absence gap: no declared claim in the bounded
          target asserts delivery guarantees, ack/commit semantics, or
          at-least-once behavior, so there is no claim pair for logic to prove
          jointly unsatisfiable — the happy-path claim set remains internally
          consistent on this dimension. Per the Logic <-> Structure boundary
          rule, unsatisfiability arising from structural absence is owned by the
          structure/coverage perspective, and logic returns no verdict where
          present claims alone cannot form a contradiction. Logic neither
          corroborates nor opposes the gap assessment or its medium severity.
          One advisory consistency obligation on the proposed action: if flush
          is split into collect and commit phases, the C5 empty-array return
          protocol and the window-restart rules must be redefined for the new
          uncommitted state, otherwise the fix introduces a fresh contradiction
          adjacent to finding-l3's sentinel overload."
        root_hypothesis_position: not_applicable
        severity_position: not_applicable
        evidence_refs:
          - issue-ledger.yaml#issue-003
          - round1/logic.md#finding-l3
      - lens_id: coverage
        stance: support
        rationale: "Coverage raised this issue (finding-007) and maintains it: the
          error-handling/recovery subdomain standard for a notification batcher
          is entirely unexpressed because flush couples digest collection and
          state erasure into one synchronous step. The collect-vs-commit
          separation absence is the precise missing concept, so coverage accepts
          the root. The singleton reasoning is correct: rel-006 is a shared
          mid-chain mechanism (unconditional wholesale erase) with a root
          distinct from issue-002, so the issues must remain separate. Medium
          severity holds under material_kind_obligations (caller-facing failure
          modes) within the bounded_partial scope; either the two-phase
          collect/commit split or an explicit at-most-once declaration closes
          the absence."
        root_hypothesis_position: accepts
        severity_position: keeps
        evidence_refs:
          - issue-ledger.yaml#issue-003
          - round1/coverage.md#f3
          - finding-relation-graph.yaml#rel-006
      - lens_id: semantics
        stance: support
        rationale: "From the semantics surface the name flush honestly conveys
          destructive emission - emit-and-erase, i.e. at-most-once - so this
          lens found no name-vs-behavior mismatch here in Round 1 and raises no
          objection to coverage's framing as an absence. What this lens can
          independently confirm is the contract-side half of the issue: no
          element of the doc surface declares any delivery guarantee at all, so
          the at-most-once meaning the code actually has is an undeclared
          meaning, invisible to callers. The lens therefore endorses the issue
          and specifically the declare-at-most-once branch of the proposed
          action as the minimal semantic remedy; the collect-vs-commit split is
          a structural decision outside this lens's assertion scope. Medium
          severity is consistent with an undeclared-but-real loss semantics."
        root_hypothesis_position: accepts
        severity_position: keeps
        evidence_refs:
          - issue-ledger.yaml#issue-003
  - issue_id: issue-004
    stances:
      - lens_id: logic
        stance: support
        rationale: "Logic independently observed the same phenomenon in finding-l4: the
          caller-supplied enqueuedAt and the internally sampled windowStartedAt
          are two recordings purporting to denote the same instant with no
          reconciliation rule, so C2's definition is false in permitted states.
          The semantics root hypothesis (a component-derivable timestamp modeled
          as an unconsumed caller input, leaving the documented meaning
          unenforced and free to drift) explains why the divergence logic proved
          is permitted, so logic accepts it as the deeper framing of
          finding-l4's conflict pair. On severity, logic takes its round-1
          position: low, not medium. Within the bounded target the inconsistency
          is latent — the field is read nowhere, so no current behavior depends
          on the false definition; the medium rating rests on semantics'
          forward-looking drift argument about future consumers, which lies
          outside logic's assertion scope and which logic does not contest on
          its own ground. Logic also notes the cross-issue coupling already
          recorded in dep-001: the carry-over fix for issue-002 (option a) would
          make this field load-bearing, at which point the latent divergence
          becomes an active contradiction and the low rating no longer holds."
        root_hypothesis_position: accepts
        severity_position: lowers
        evidence_refs:
          - issue-ledger.yaml#issue-004
          - round1/logic.md#finding-l4
      - lens_id: coverage
        stance: support
        rationale: "Coverage did not raise this finding, but the absence passes
          coverage's own dimension test: a per-item time value managed in
          parallel between caller assertion and component reality has no
          single-authority designation, and the batcher neither stamps nor
          validates it - an enforcement-concept absence, the same dimension
          class as issue-001. Standing alone, a field with no current consumer
          would be surface-level by coverage's round-1 severity discipline
          (compare F6), but dep-001 places the field on the remediation path of
          issue-002: a carry-over fix requires a trustworthy per-item timestamp,
          which this unenforced meaning cannot supply. That dependency makes the
          gap prerequisite-quality rather than dormant, so coverage keeps medium
          and accepts the derived-value-modeled-as-input root."
        root_hypothesis_position: accepts
        severity_position: keeps
        evidence_refs:
          - issue-ledger.yaml#issue-004
          - issue-ledger.yaml#dep-001
          - finding-relation-graph.yaml#rel-005
      - lens_id: semantics
        stance: support
        rationale: "This lens's own SEM-3: enqueuedAt is documented as a fact about an
          event the batcher owns (entry into the batch) but is modeled as an
          unenforced, unconsumed caller input - a derived-value-vs-input
          mismatch in which documented authority and actual authority diverge,
          leaving the field meaning free to drift. The lens also affirms the
          singleton reasoning: the shared cause with issue-002 (per-item enqueue
          time never stamped or read, dep-001) is a common mechanism, not a
          common root - misplaced value authority versus missing
          window-attribution state - so the issues must stay separate, while one
          fix (a component-stamped timestamp from the issue-001 time authority)
          serves both."
        root_hypothesis_position: accepts
        severity_position: keeps
        evidence_refs:
          - issue-ledger.yaml#issue-004
          - round1/semantics.md#sem-3
