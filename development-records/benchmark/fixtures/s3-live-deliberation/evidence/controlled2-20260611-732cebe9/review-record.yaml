per_lens_provenance:
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - "Single-threaded synchronous JavaScript execution model: no enqueue can
        interleave between statements within one flush() invocation."
      - flush(now) callers may pass any numeric value; the type number imposes
        no clock-base or unit restriction.
      - Callers interact with the batcher only through the exported API surface
        (enqueue, flush, pendingUserCount).
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - 단일 스레드 동기 JS 런타임을 가정한다 — flush 본문 실행 중 enqueue 인터리빙은 불가능하다.
      - digest의 하류 전달은 flush 반환값을 받은 호출자가 수행하며, 전달 성공 여부는 배처에 회신되지 않는다고 가정한다.
      - bounded_partial 범위로 호출자 코드는 검토 대상 밖이며, 계약 증거는 타입 표면과 주석으로 한정한다.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - Assumed single-threaded synchronous JavaScript execution semantics when
        judging the interleaving claim in SEM-2.
      - Assumed epoch-milliseconds as the intended unit for all timestamps,
        inferred from Date.now() usage and the enqueuedAt doc comment.
      - Assumed callers poll flush() periodically, as stated in the flush doc
        comment.
