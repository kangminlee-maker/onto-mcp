  - finding_id: finding-004
    lens_id: logic
    source_ref: "round1/logic.md#finding-4"
    target: "notification-batcher.ts"
    evidence_anchor: "notification-batcher.ts:8-9, notification-batcher.ts:2-3, notification-batcher.ts:34-36"
    claim: >-
      No declared claim formalizes which window a notification enqueued after
      windowStartedAt + WINDOW_MS but before the flush poll belongs to; the
      digest includes it in the closing window by flush-call timing, and the
      declared temporal field enqueuedAt is consumed by no rule, so no
      contradiction is derivable within the bounded target.
    lens_rationale_summary: >-
      The logic lens recorded an insufficient-evidence observation: the
      window-membership claim required for a satisfiability judgment is not
      formalized in the target, so neither fail nor pass can be derived.
      Kept surface-only per low severity; handed off to coverage
      (declared-but-unconsumed field) and semantics (underdetermined "batch
      window" boundary).
    proposed_action: >-
      Formalize the membership rule and align the field with it: either
      consume enqueuedAt (or compare against windowStartedAt + WINDOW_MS) to
      bound the closing digest and carry later items into the next window, or
      document the flush-time cutoff explicitly and remove enqueuedAt if it
      remains unconsumed.
    affected_purpose: >-
      verifiability and maintainability of window-membership semantics
      (surface observation; not yet a trust failure)
    failure_condition: >-
      a notification is enqueued after the window factually closed
      (windowStartedAt + WINDOW_MS) but before the next flush poll; which
      window it belongs to is unspecified
    impact: >-
      window membership is decided by flush-call timing rather than any
      declared rule, and the documented temporal field enqueuedAt
