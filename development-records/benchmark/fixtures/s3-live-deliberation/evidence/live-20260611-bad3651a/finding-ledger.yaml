  - finding_id: finding-005
    lens_id: coverage
    source_ref: "round1/coverage.md#finding-1"
    target: "NotificationBatcher window-closure time base (enqueue/flush pair)"
    evidence_anchor: "notification-batcher.ts:20, notification-batcher.ts:30-32"
    claim: >-
      The window lifecycle is governed by two parallel, unreconciled time
      sources — an internal wall clock (Date.now() in enqueue) and a
      caller-injected now (flush) — and the system designates no single time
      authority nor declares any contract that the two share one time base;
      window closure can therefore fail in both directions (never closes, or
      closes immediately).
    lens_rationale_summary: >-
      The coverage lens checked the time-authority dimension of the window
      lifecycle and found a dimension deficit in an element that exists: time
      is managed in two places with no single source of authority designated.
      The request summary explicitly scopes time-source semantics, and the
      review-target-profile obligations classify a visible runtime-contract
      failure inside the bounded target as material against the correctness
      goal; this mismatch is fully visible within the file.
    proposed_action: >-
      Designate a single time authority: (a) inject time everywhere via a
      constructor-injected clock used by both enqueue and flush, or (b) own
      time internally by having flush() take no parameter and use Date.now().
      If the injected-now polling API must stay, document the required time
      base on flush(now) ("epoch ms from the same clock as Date.now()") as a
      minimum stopgap.
    affected_purpose: >-
      correctness review goal — window-closure contract of the
      enqueue/flush pair
    failure_condition: >-
      any caller supplying now from a different time base than Date.now():
      performance.now() (monotonic, starts near 0), seconds instead of ms, or
      a simulated test clock
    impact: >-
      window closure fails in both directions — never closes (notifications
      never delivered) or closes immediately — because the closure
      subtraction mixes two unreconciled time bases
    evidence_refs:
      - "round1/coverage.md#finding-1"
      - "notification-batcher.ts:20"
      - "notification-batcher.ts:30-32"
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: >-
        correctness review goal — window-closure contract of the
        enqueue/flush pair
      failure_condition: >-
        any caller supplying now from a different time base than Date.now():
        performance.now() (monotonic, starts near 0), seconds instead of ms,
        or a simulated test clock
      impact: >-
        window closure fails in both directions — never closes
        (notifications never delivered) or closes immediately — because the
