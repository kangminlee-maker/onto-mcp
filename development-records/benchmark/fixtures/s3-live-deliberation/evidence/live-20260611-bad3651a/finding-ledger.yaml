          relation_to_previous: causes
          evidence_refs:
            - "notification-batcher.ts:32"
      unresolved_beyond_evidence: null
  - finding_id: finding-006
    lens_id: coverage
    source_ref: "round1/coverage.md#finding-2"
    target: "NotificationBatcher.flush reset semantics vs documented carry-over contract"
    evidence_anchor: "notification-batcher.ts:37-39"
    claim: >-
      The comment declares that notifications enqueued between the
      window-close check and the reset "are carried into the next window",
      but no mechanism implementing carry-over exists; the actual reset
      (this.pending.clear()) deletes the entire map, so any such notification
      would be silently dropped — the declared sub-behavior is absent from
      the system.
    lens_rationale_summary: >-
      The coverage lens found a declared sub-behavior with no implementing
      mechanism: the system contains no selective-removal, snapshot-then-diff,
      or re-queue mechanism that could realize the documented carry-over
      guarantee. The review goals explicitly include contract-vs-behavior
      consistency and regression_risk; the comment invites a future
      async/concurrent refactor to rely on a safety property the mechanism
      does not provide.
    proposed_action: >-
      Make behavior and contract converge: (a) implement the guarantee by
      snapshotting the digested keys/items and deleting only those, or
      replacing the map with a fresh one after capturing a reference; or (b)
      retract the contract by rewriting the comment to state the true
      semantics ("the entire pending map is dropped at flush; flush must not
      be interleaved with enqueue").
    affected_purpose: >-
      contract-vs-behavior consistency and regression_risk (declared review
      goals)
    failure_condition: >-
      a future async/concurrent refactor (e.g., awaiting a send inside the
      digest loop) relies on the documented carry-over safety property while
      enqueue can interleave between the close check and the reset
    impact: >-
      silent notification loss while documentation claims the opposite; the
      harm is latent in the current single-threaded synchronous runtime but
      is activated by exactly the refactor the comment invites
    evidence_refs:
      - "round1/coverage.md#finding-2"
      - "notification-batcher.ts:37-39"
      - "notification-batcher.ts:32"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: >-
        contract-vs-behavior consistency and regression_risk (declared
        review goals)
      failure_condition: >-
        a future async/concurrent refactor (e.g., awaiting a send inside the
        digest loop) relies on the documented carry-over safety property
        while enqueue can interleave between the close check and the reset
      impact: >-
        silent notification loss while documentation claims the opposite;
        the harm is latent in the current single-threaded synchronous
        runtime but is activated by exactly the refactor the comment invites
      evidence_refs:
        - "notification-batcher.ts:37-38"
        - "notification-batcher.ts:39"
        - "notification-batcher.ts:32"
    causal_path:
      root_cause_candidate: >-
        the reset mechanism was written at window granularity while the
        documented guarantee is written at item granularity; the
        item-granularity concept ("late-enqueued notification") has no
