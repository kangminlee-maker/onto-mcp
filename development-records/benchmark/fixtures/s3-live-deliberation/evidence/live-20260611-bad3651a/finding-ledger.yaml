  - finding_id: finding-010
    lens_id: semantics
    source_ref: "round1/semantics.md#f2"
    target: "notification-batcher.ts"
    evidence_anchor: "notification-batcher.ts:37-39"
    claim: >-
      The comment states that notifications enqueued between the window-close
      check and the reset "are carried into the next window", but
      this.pending.clear() unconditionally removes every entry; no carry-over
      behavior exists in the code.
    lens_rationale_summary: >-
      The semantics lens found a contract-vs-behavior inconsistency: the
      comment's claim requires that some entries survive the reset, but
      clear() removes all entries present at call time, and the digest loop
      iterates the same live map so a pre-clear entry is digested in the
      current flush — the opposite of "carried into the next window". This
      counts against the declared review goals (correctness, maintainability,
      regression_risk).
    proposed_action: >-
      Either implement the stated semantics (snapshot the keys/entries to
      digest, delete only those keys, leaving later arrivals in place) or
      rewrite the comment to state the actual behavior ("all entries pending
      at flush time are digested and cleared; nothing is carried over").
    affected_purpose: >-
      correctness, maintainability, and regression_risk (declared review
      goals) — contract-vs-behavior consistency of the flush reset
    failure_condition: >-
      a maintainer later makes flush async or re-entrant and relies on the
      documented carry-over invariant; the described interleaving then
      becomes reachable while the code provides no implementing mechanism
    impact: >-
      silent notification loss inherited from a documented invariant the
      code does not provide; today the comment describes a scenario the code
      neither encounters nor handles as stated
