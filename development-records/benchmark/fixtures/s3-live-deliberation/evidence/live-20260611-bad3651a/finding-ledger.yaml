  - finding_id: finding-007
    lens_id: coverage
    source_ref: "round1/coverage.md#finding-3"
    target: "PendingNotification.enqueuedAt entry-time record"
    evidence_anchor: "notification-batcher.ts:8-9, notification-batcher.ts:19-24"
    claim: >-
      The field contract declares enqueuedAt as "epoch ms when the
      notification entered the batch", but the method that owns batch entry
      (enqueue) neither stamps nor validates it; the entry-time record is
      caller-trusted, and entry time is managed in two parallel places
      (per-item enqueuedAt, per-window windowStartedAt via Date.now()) with
      no single authority designated.
    lens_rationale_summary: >-
      The coverage lens found that the temporal audit dimension exists
      nominally on the data shape but lacks the enforcement mechanism: the
      field doc asserts a fact about an event only enqueue can witness, yet
      enqueue never writes or checks the value. This matters under the
      verifiability review goal — any downstream consumer trusting the
      documented semantics builds on a record no component guarantees.
    proposed_action: >-
      Assign stamping authority to the entry owner: have enqueue set
      enqueuedAt itself (from the single clock chosen in the finding-005
      fix), changing the input type to omit the field
      (Omit<PendingNotification, "enqueuedAt">); or, if callers must supply
      it, change the doc to "caller-asserted creation time" and stop claiming
      it records batch entry.
    affected_purpose: >-
      verifiability review goal — trustworthiness of the documented
      entry-time record
    failure_condition: >-
      any caller supplying an inaccurate, stale, or fabricated enqueuedAt;
      divergence between recorded and actual entry time is unbounded and
      undetectable within the target
    impact: >-
      downstream consumers (ordering, age-based expiry, audit) that trust the
      documented semantics build on a record no component guarantees, while a
      second parallel entry-adjacent timestamp (windowStartedAt) coexists
      with no designated canonical source
    evidence_refs:
