  - finding_id: finding-001
    lens_id: logic
    source_ref: "round1/logic.md#finding-1"
    target: "notification-batcher.ts"
    evidence_anchor: "notification-batcher.ts:20, notification-batcher.ts:27-28, notification-batcher.ts:30-32"
    claim: >-
      The claim set {C5 "flushes when the window has closed", C6 "[] means
      window still open", R1 "window start sampled from internal Date.now()",
      R3 "window close judged against caller-supplied now"} is jointly
      satisfiable only under an undeclared necessary premise that the caller's
      now is sampled from the same clock as Date.now(); over the full declared
      input domain of flush(now: number) the set is not satisfiable.
    lens_rationale_summary: >-
      The logic lens found an inter-claim contradiction: enqueue binds the
      window-start time authority to the process wall clock while flush judges
      window close against an arbitrary caller-supplied number, and the
      contract never declares a same-clock precondition. This makes the
      documented flush close obligation (C5/C6) violable with declared-legal
      inputs, directly against the review intent focus on time-source
      semantics and the correctness/verifiability goals.
    proposed_action: >-
      Unify the time authority: (a) parameterize enqueue on the same clock
      (enqueue(item, now)), (b) drop the now parameter and use Date.now() in
      flush, or (c) inject a single clock function at construction used by
      both methods. In all variants, declare the clock-source contract on the
      API doc.
    affected_purpose: >-
      correctness and verifiability of the flush contract (declared review
      goals: correctness, verifiability)
    failure_condition: >-
      any flush caller whose now is not sampled from the same wall clock that
      enqueue used: deterministic-clock tests, monotonic-time-derived values,
      cross-process or skewed clock sources
    impact: >-
      digests are never emitted for the affected window (perpetual [] read as
      "window still open") or are emitted before the window elapses; the 30s
      batching contract is silently broken and the documented [] meaning
      becomes permanently misleading
    evidence_refs:
      - "round1/logic.md#finding-1"
      - "notification-batcher.ts:20"
      - "notification-batcher.ts:27-28"
      - "notification-batcher.ts:30-32"
