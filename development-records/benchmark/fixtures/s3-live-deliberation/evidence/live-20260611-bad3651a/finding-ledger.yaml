  - finding_id: finding-003
    lens_id: logic
    source_ref: "round1/logic.md#finding-3"
    target: "notification-batcher.ts"
    evidence_anchor: "notification-batcher.ts:28, notification-batcher.ts:31"
    claim: >-
      C6 defines the output [] to mean "window still open", but R2 returns []
      in the reachable state windowStartedAt === null, in which no window is
      open; the definition and the producing rule contradict in that state.
    lens_rationale_summary: >-
      The logic lens found a definition-vs-rule contradiction
      (possible-as-necessary modality error): the doc asserts a necessary
      equivalence ([] iff window still open) while the implementation also
      produces [] from the reachable no-window state (initial value and after
      every successful flush). The practical reading coincides today via the
      state invariant, holding severity at medium, but the declared
      definition is false in the null state and the misreading becomes
      persistent under finding-001's clock-skew condition.
    proposed_action: >-
      Widen the documented meaning ("[] means there is nothing to flush yet:
      no window has started, or the window is still open") or make the states
      distinguishable in the signature (e.g. return null for "no window" vs
      [] for "window open"), and keep C6 consistent with whichever is chosen.
    affected_purpose: >-
      verifiability of the caller-facing contract; correctness of caller-side
      state interpretation (declared review goals)
    failure_condition: >-
      a caller or monitor branches on the documented meaning of [] in the
      no-window state, or operates under finding-001's clock-skew condition
      where the misleading reading persists indefinitely
    impact: >-
      misclassification of batcher state by polling callers; tests written
      against the documented meaning validate the wrong semantics
    evidence_refs:
      - "round1/logic.md#finding-3"
      - "notification-batcher.ts:28"
      - "notification-batcher.ts:31"
      - "notification-batcher.ts:40"
    severity: medium
