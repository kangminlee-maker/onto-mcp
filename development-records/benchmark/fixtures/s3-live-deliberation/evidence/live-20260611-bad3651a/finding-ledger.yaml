      evidence_refs:
        - "notification-batcher.ts:20"
        - "notification-batcher.ts:30"
        - "notification-batcher.ts:32"
    causal_path:
      root_cause_candidate: >-
        the design splits time authority across the API boundary
        (testability-style injection in flush, hard-coded Date.now() in
        enqueue) without designating which clock is canonical
      root_cause_step_id: finding-005.cause-001
      steps:
        - cause_id: finding-005.cause-001
          claim: >-
            The design splits time authority across the API boundary:
            testability-style injection in flush, hard-coded Date.now() in
            enqueue, with no canonical clock designated.
          relation_to_previous: null
          evidence_refs:
            - "notification-batcher.ts:20"
            - "notification-batcher.ts:30"
        - cause_id: finding-005.cause-002
          claim: >-
            flush externalizes its time source as a bare number parameter
            with no time-base contract while windowStartedAt is stamped from
            the internal wall clock.
          relation_to_previous: causes
          evidence_refs:
            - "notification-batcher.ts:30"
            - "notification-batcher.ts:20"
        - cause_id: finding-005.cause-003
          claim: >-
            The closure predicate now - windowStartedAt subtracts values from
            two unreconciled time bases, so window closure can fail in both
