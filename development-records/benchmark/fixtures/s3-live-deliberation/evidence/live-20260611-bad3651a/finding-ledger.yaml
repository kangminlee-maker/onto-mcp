  - finding_id: finding-002
    lens_id: logic
    source_ref: "round1/logic.md#finding-2"
    target: "notification-batcher.ts"
    evidence_anchor: "notification-batcher.ts:37-38, notification-batcher.ts:39"
    claim: >-
      C7 ("Notifications enqueued between the window close check and this
      reset are carried into the next window") and R5 (flush reset
      unconditionally clears the entire pending map) cannot both hold in any
      execution where such an enqueue occurs; the code guarantees the
      negation of the comment's guarantee.
    lens_rationale_summary: >-
      The logic lens found a necessary/necessary inter-claim conflict: the
      reset comment declares a preservation guarantee for check-to-reset
      enqueues while pending.clear() makes the complementary property
      (pending becomes empty) necessary at the same program point. Under the
      current synchronous realization the guarantee is vacuous and
      unverifiable; under any async/concurrent realization the actual
      behavior is silent notification loss, the exact failure the comment
      claims to exclude — directly against the contract-vs-behavior
      consistency focus of the review.
    proposed_action: >-
      Make the comment true or make it honest: delete only the flushed
      entries (snapshot digested keys/items, then delete those specific
      entries) so post-check arrivals genuinely persist into the next window,
      or rewrite the comment to state that the reset drops everything
      currently pending and that the implementation relies on synchronous
      execution to keep the check-to-reset interval empty.
    affected_purpose: >-
      correctness (no silent notification loss) and regression_risk (declared
      review goals)
    failure_condition: >-
      any realization in which enqueue can interleave with flush between the
      close check and clear(): an async refactor of flush, concurrent
      callers, or re-entrant enqueue
    impact: >-
      silent notification loss while the in-code documentation asserts the
      opposite guarantee; future maintainers relying on the documented
      invariant will ship the loss without noticing
    evidence_refs:
      - "round1/logic.md#finding-2"
      - "notification-batcher.ts:32"
      - "notification-batcher.ts:34-36"
      - "notification-batcher.ts:37-39"
