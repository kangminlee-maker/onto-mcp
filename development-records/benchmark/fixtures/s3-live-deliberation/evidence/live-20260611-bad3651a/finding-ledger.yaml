  - finding_id: finding-009
    lens_id: semantics
    source_ref: "round1/semantics.md#f1"
    target: "notification-batcher.ts"
    evidence_anchor: "notification-batcher.ts:20,30-32"
    claim: >-
      The expression now - this.windowStartedAt subtracts an internally
      sourced Date.now() wall-clock value from a caller-supplied now whose
      time source is never declared; the name now does not mean "same clock
      as windowStartedAt", so the window-duration semantics are not
      guaranteed by the contract.
    lens_rationale_summary: >-
      The semantics lens found a definition-explicitness failure: two
      distinct time concepts — "internal wall-clock now" and "caller-supplied
      now" — share one name without a unifying contract. The file already
      establishes caller-supplied epoch-ms timestamps (enqueuedAt), so a
      caller-side clock distinct from the batcher's internal clock is an
      in-contract scenario, not a hypothetical; the declared review goal
      (correctness) is violated by a contract gap.
    proposed_action: >-
      Establish a single time authority: (a) drop the parameter and use
      Date.now() inside flush, (b) make both sides caller-supplied
      (enqueue(item, now) or use item.enqueuedAt), or (c) inject a clock
      dependency used by both methods. In all cases, document the required
      time source of now (e.g., "epoch ms from the same clock that produced
      enqueuedAt").
    affected_purpose: >-
      correctness (declared review goal) — window-duration semantics of the
      flush contract
    failure_condition: >-
      a caller supplies now from a different clock than the internal
      Date.now() capture: performance.now() (monotonic, origin near process
      start) or an injected test clock — an in-contract scenario given the
      file's caller-supplied epoch-ms precedent
    impact: >-
      with a monotonic now the subtraction is hugely negative so flush
      returns [] forever, which the doc defines as "window still open" —
      notifications are never delivered; with a skewed or mocked clock the
      window can also close instantly
    evidence_refs:
      - "round1/semantics.md#f1"
      - "notification-batcher.ts:20"
      - "notification-batcher.ts:30-32"
      - "notification-batcher.ts:8"
    severity: high
