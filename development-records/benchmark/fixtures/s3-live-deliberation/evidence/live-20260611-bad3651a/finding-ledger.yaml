  - finding_id: finding-011
    lens_id: semantics
    source_ref: "round1/semantics.md#f3"
    target: "notification-batcher.ts"
    evidence_anchor: "notification-batcher.ts:8-9,20"
    claim: >-
      The meaning "time the notification entered the batch" exists twice — as
      the caller-supplied enqueuedAt field and as the internal Date.now()
      capture in enqueue() — and the two are never unified: the batcher never
      reads enqueuedAt, so the interface advertises a timestamp contract with
      no behavioral meaning while the window anchors to a divergent second
      source.
    lens_rationale_summary: >-
      The semantics lens found a ghost sub-area and an un-unified synonym
      pair: a required, documented field in an exported interface asserts
      behavioral relevance yet is never referenced after declaration, while
      windowStartedAt — semantically "the first pending notification's
      batch-entry time" — is modeled as an independent input from a second
      clock instead of being derived from the field that names the meaning.
    proposed_action: >-
      Pick one source of truth: derive the window anchor from pending items'
      enqueuedAt (e.g., window starts at the first item's enqueuedAt), or
      remove enqueuedAt from the interface (scope permitting) / explicitly
      document that it is payload-only metadata that does not affect
      windowing.
    affected_purpose: >-
      correctness and verifiability (callers misled into believing
      enqueuedAt drives windowing) and regression_risk (duplicate time
      sources enable drift) — declared review goals
    failure_condition: >-
      a caller backfills or replays notifications with enqueuedAt in the
      past — an in-contract use given the field's documentation; the window
      then silently anchors to processing time instead of the declared entry
      time
    impact: >-
      the field's name and the system's behavior diverge: the interface
      advertises a timestamp contract with no behavioral meaning, and the
      duplicate source enables undetected drift between the two timestamps
