    lens_rationale_summary: >-
      The semantics lens found the term "batch window" ambiguous between
      "one window per user's batch" and "one global window"; the
      implementation is global while the doc admits a per-user reading. Kept
      surface-only per low severity.
    proposed_action: >-
      If global windowing is intended, state it in the class doc ("a single
      shared window across all users"); if per-user windowing is intended,
      the model needs per-user window anchors.
    affected_purpose: >-
      verifiability and maintainability of the class-level windowing
      contract (improvement opportunity; not unsafe for the declared
      purpose)
    failure_condition: >-
      a reader adopts the per-user-window reading of the class doc; a user
