      root_cause_step_id: finding-006.cause-001
      steps:
        - cause_id: finding-006.cause-001
          claim: >-
            The reset mechanism was written at window granularity while the
            documented guarantee is written at item granularity; the
            item-granularity concept ("late-enqueued notification") has no
            representation in the code.
          relation_to_previous: null
          evidence_refs:
            - "notification-batcher.ts:37-39"
        - cause_id: finding-006.cause-002
          claim: >-
            The reset is implemented as a whole-map clear() rather than
            removal of only the flushed items, so every entry — including
            any hypothetical late arrival — is removed unconditionally.
          relation_to_previous: causes
          evidence_refs:
            - "notification-batcher.ts:39"
        - cause_id: finding-006.cause-003
          claim: >-
            The declared carry-over guarantee (lines 37-38) is contradicted
            by the reset: no item present but not yet digested can be
            "carried into the next window".
          relation_to_previous: causes
          evidence_refs:
            - "notification-batcher.ts:37-38"
            - "notification-batcher.ts:39"
      unresolved_beyond_evidence: >-
