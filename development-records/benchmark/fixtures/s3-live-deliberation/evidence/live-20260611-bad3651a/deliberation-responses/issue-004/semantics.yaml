  final exchange (the line-20 pivot from semantics, the same-event dual
  representation from coverage) and logic moved from narrow to support,
  recording an evidence-scope annotation on the enqueuedAt leg.
response_to_other_positions: >-
  To logic's movability condition, semantics supplied the line-20 pivot: the
  same undesignated Date.now() re-measurement is simultaneously the divergent
  second authority in both legs — against the caller-supplied now in the
  closure subtraction (lines 30-32, leg 1) and against the declared entry-time
  carrier enqueuedAt (line 8, leg 2: same meaning, never read, re-measured at
  line 20). One program point manifesting both defects is structural
  unification evidence, not mere fix-coupling; logic's own finding-4 phrasing
  ("no declared claim binds windowStartedAt to per-item entry time") is the
  missing designation observed from the logic assertion type. To coverage's
  falsifiability check: no semantic reading survives the fix — one injected
  clock owning every timestamp with entry-owner stamping of enqueuedAt makes
  windowStartedAt derivationally equal to the first item's enqueuedAt, so
  finding-011's dual representation collapses. The merged root therefore holds;
  logic's narrowing should be recorded as an evidence-scope (assertion-type
  reach) annotation, not a root revision.
