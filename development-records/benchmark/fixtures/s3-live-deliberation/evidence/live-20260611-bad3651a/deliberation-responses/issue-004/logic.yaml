change_reason: "Moved from narrow to support: coverage's live rebuttal provided target-internal unification evidence (same-event dual representation at line 20 vs lines 8-9; repeated authority-undeclared caller-time shape across flush(now) and enqueuedAt), the falsifiability test withstood logic's attempt to construct a surviving reading, and logic's finding-4 insufficient-evidence observation was correctly reframed as a manifestation of the missing designation rather than evidence against the merge. The original narrow was an evidence-scope statement, not an opposition, and the evidence gap it pointed at has been filled by peer-lens material the merge contract accepts."
accepted_root_hypothesis: "Full merged root accepted: the design never designates a single canonical time authority for the batcher; the enqueue/flush clock split (internal Date.now() vs caller-supplied now) and the inert, caller-trusted enqueuedAt field beside the internally stamped windowStartedAt are two manifestations of that one missing designation, falsifiable by a fix injecting one clock that owns every timestamp in the file. Evidence-scope annotation: the clock-split leg carries a formal logic contradiction (finding-001); the enqueuedAt leg stands on coverage/semantics observational evidence (finding-007, finding-011) — logic derives no contradiction there (finding-4), which is itself consistent with the designation-absence root."
