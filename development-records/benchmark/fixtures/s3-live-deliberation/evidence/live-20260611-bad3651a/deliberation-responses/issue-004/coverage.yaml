accepted_root_hypothesis: "The design never designates a single canonical time
  authority for the batcher; the enqueue/flush clock split (internal Date.now()
  vs caller-supplied now) and the inert, caller-trusted enqueuedAt field beside
  the internally stamped windowStartedAt are two manifestations of that one
  missing designation. Falsifiable: a fix that injects one clock owning every
  timestamp in the file (including enqueuedAt stamping by the entry owner)
  should dissolve both defects; if either survives such a fix, the common-root
  claim is wrong."
