  enqueuedAt — one meaning, one authority), and the only surviving
  configuration (clock injected but enqueuedAt left caller-supplied and unread)
  falls outside the hypothesis's 'owning every timestamp' condition. Semantics
  also sharpened the shared-cause evidence: line 20 is the shared pivot — the
  same undesignated Date.now() re-measurement is the divergent second authority
  in both legs (vs caller now at lines 30-32, vs enqueuedAt at line 8)."
