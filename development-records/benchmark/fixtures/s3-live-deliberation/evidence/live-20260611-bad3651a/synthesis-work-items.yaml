    severity: high
    material: true
    issue_statement: "The reset comment declares that notifications enqueued between
      the window-close check and the reset are carried into the next window, but
      pending.clear() unconditionally empties the entire map at the same program
      point; the code guarantees the negation of the comment's guarantee, so the
      documented preservation property is vacuous today and becomes silent
      notification loss under any async/concurrent realization. Source finding
      context: notification-batcher.ts Source finding context:
      notification-batcher.ts:37-38, notification-batcher.ts:39 Source finding
      context: C7 (\"Notifications enqueued between the window close check and
      this reset are carried into the next window\") and R5 (flush reset
      unconditionally clears the entire pending map) cannot both hold in any
      execution where such an enqueue occurs; the code guarantees the negation
      of the comment's guarantee. Source finding context: The logic lens found a
      necessary/necessary inter-claim conflict: the reset comment declares a
      preservation guarantee for check-to-reset enqueues while pending.clear()
      makes the complementary property (pending becomes empty) necessary at the
      same program point. Under the current synchronous realization the
      guarantee is vacuous and unverifiable; under any async/concurrent
      realization the actual behavior is silent notification loss, the exact
      failure the comment claims to exclude — directly against the
      contract-vs-behavior consistency focus of the review. Source finding
      context: Make the comment true or make it honest: delete only the flushed
      entries (snapshot digested keys/items, then delete those specific entries)
      so post-check arrivals genuinely persist into the next window, or rewrite
      the comment to state that the reset drops everything currently pending and
      that the implementation relies on synchronous execution to keep the
      check-to-reset interval empty. Source finding context:
      round1/logic.md#finding-2 Source finding context: correctness (no silent
      notification loss) and regression_risk (declared review goals) Source
      finding context: any realization in which enqueue can interleave with
