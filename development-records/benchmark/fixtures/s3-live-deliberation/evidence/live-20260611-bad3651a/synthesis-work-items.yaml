      R1 \"window start sampled from internal Date.now()\", R3 \"window close
      judged against caller-supplied now\"} is jointly satisfiable only under an
      undeclared necessary premise that the caller's now is sampled from the
      same clock as Date.now(); over the full declared input domain of
      flush(now: number) the set is not satisfiable. Source finding context: The
      logic lens found an inter-claim contradiction: enqueue binds the
      window-start time authority to the process wall clock while flush judges
