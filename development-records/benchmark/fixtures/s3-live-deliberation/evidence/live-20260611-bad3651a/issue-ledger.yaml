  - issue_id: issue-008
    root_cause_hypothesis: >-
      A derivable value (windowStartedAt) is modeled as an independent input
      from a second clock while its source field (enqueuedAt) is kept inert,
      leaving two authorities for the one meaning "time the notification
      entered the batch".
    root_confidence: medium
    surface_finding_ids: [finding-011]
    relation_refs: []
    raised_by_lens_ids: [semantics]
    issue_statement: >-
      The meaning "time the notification entered the batch" exists twice —
      as the caller-supplied enqueuedAt field and as the internal Date.now()
      capture in enqueue() — and the two are never unified: the batcher
      never reads enqueuedAt, so the interface advertises a timestamp
      contract with no behavioral meaning while the window anchors to a
      divergent second source.
    proposed_action: >-
      Pick one source of truth: derive the window anchor from pending items'
      enqueuedAt (e.g., window starts at the first item's enqueuedAt), or
      remove enqueuedAt from the interface / explicitly document that it is
      payload-only metadata that does not affect windowing.
    affected_purpose: >-
      correctness and verifiability (callers misled into believing
      enqueuedAt drives windowing) and regression_risk (duplicate time
      sources enable drift) — declared review goals
    failure_condition: >-
      a caller backfills or replays notifications with enqueuedAt in the
      past — an in-contract use given the field's documentation; the window
      then silently anchors to processing time instead of the declared entry
      time
    impact: >-
      the field's name and the system's behavior diverge: the interface
      advertises a timestamp contract with no behavioral meaning, and the
      duplicate source enables undetected drift between the two timestamps
    evidence_refs:
