  - issue_id: issue-006
    root_cause_hypothesis: >-
      Split time authority introduced at line 20 versus line 30: window
      start bound to the internal Date.now() authority while window close is
      decided against an external now with no declared authority, making the
      cross-clock subtraction semantically meaningless.
    root_confidence: medium
    surface_finding_ids: [finding-009]
    relation_refs: []
    raised_by_lens_ids: [semantics]
    issue_statement: >-
      Two distinct time concepts — internal wall-clock now and
      caller-supplied now — share one name without a unifying contract: the
      expression now - windowStartedAt subtracts an internally sourced
      Date.now() value from a caller-supplied number whose time source is
      never declared, so the window-duration semantics are not guaranteed by
      the contract, and the file's caller-supplied epoch-ms precedent
      (enqueuedAt) makes a divergent caller clock an in-contract scenario.
    proposed_action: >-
      Establish a single time authority: drop the parameter and use
      Date.now() inside flush, make both sides caller-supplied, or inject a
      clock dependency used by both methods; in all cases document the
      required time source of now.
    affected_purpose: >-
      correctness (declared review goal) — window-duration semantics of the
      flush contract
    failure_condition: >-
      a caller supplies now from a different clock than the internal
      Date.now() capture: performance.now() (monotonic, origin near process
      start) or an injected test clock — an in-contract scenario given the
      file's caller-supplied epoch-ms precedent
    impact: >-
      with a monotonic now the subtraction is hugely negative so flush
      returns [] forever, which the doc defines as "window still open" —
      notifications are never delivered; with a skewed or mocked clock the
      window can also close instantly
    evidence_refs:
