      enables relation rel-005 toward finding-003; duplicates and enables are
      not same_root_candidate merge evidence under the issue-ledger contract,
      so the finding remains its own root-cause issue.
  - issue_id: issue-002
    root_cause_hypothesis: >-
      The flush reset clears the whole pending map instead of removing only
      the entries that were flushed into the digest, making the documented
      check-to-reset carry-over guarantee unsatisfiable whenever such an
      enqueue occurs.
    root_confidence: medium
    surface_finding_ids: [finding-002]
    relation_refs: []
    raised_by_lens_ids: [logic]
    issue_statement: >-
      The reset comment declares that notifications enqueued between the
      window-close check and the reset are carried into the next window, but
      pending.clear() unconditionally empties the entire map at the same
      program point; the code guarantees the negation of the comment's
      guarantee, so the documented preservation property is vacuous today and
      becomes silent notification loss under any async/concurrent
      realization.
    proposed_action: >-
      Make the comment true or make it honest: delete only the flushed
      entries (snapshot digested keys/items, then delete those specific
      entries) so post-check arrivals genuinely persist, or rewrite the
      comment to state that the reset drops everything currently pending and
      relies on synchronous execution.
    affected_purpose: >-
      correctness (no silent notification loss) and regression_risk (declared
      review goals)
    failure_condition: >-
      any realization in which enqueue can interleave with flush between the
      close check and clear(): an async refactor of flush, concurrent
      callers, or re-entrant enqueue
    impact: >-
      silent notification loss while the in-code documentation asserts the
      opposite guarantee; future maintainers relying on the documented
      invariant will ship the loss without noticing
    evidence_refs:
      - "round1/logic.md#finding-2"
      - "notification-batcher.ts:32"
      - "notification-batcher.ts:34-36"
      - "notification-batcher.ts:37-39"
