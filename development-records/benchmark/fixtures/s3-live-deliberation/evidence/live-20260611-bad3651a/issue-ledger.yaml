  - issue_id: issue-005
    root_cause_hypothesis: >-
      The reset mechanism was written at window granularity while the
      documented guarantee is written at item granularity; the
      item-granularity concept ("late-enqueued notification") has no
      representation in the code.
    root_confidence: medium
    surface_finding_ids: [finding-006]
    relation_refs: []
    raised_by_lens_ids: [coverage]
    issue_statement: >-
      The comment declares that notifications enqueued between the
      window-close check and the reset are carried into the next window, but
      no selective-removal, snapshot-then-diff, or re-queue mechanism exists
      that could realize the guarantee; the whole-map clear() removes every
      entry unconditionally, so the declared sub-behavior is absent from the
      system.
    proposed_action: >-
      Make behavior and contract converge: implement the guarantee by
      snapshotting the digested keys/items and deleting only those (or
      swapping in a fresh map after capturing a reference), or retract the
      contract by rewriting the comment to the true semantics.
    affected_purpose: >-
      contract-vs-behavior consistency and regression_risk (declared review
      goals)
    failure_condition: >-
      a future async/concurrent refactor (e.g., awaiting a send inside the
      digest loop) relies on the documented carry-over safety property while
      enqueue can interleave between the close check and the reset
    impact: >-
      silent notification loss while documentation claims the opposite; the
      harm is latent in the current single-threaded synchronous runtime but
      is activated by exactly the refactor the comment invites
    evidence_refs:
