      issue-ledger contract, so the finding remains its own root-cause issue.
  - issue_id: issue-003
    root_cause_hypothesis: >-
      flush conflates two distinct states ("no window started" and "window
      open, not yet closed") into a single [] output while the doc defines
      only one meaning for it, so the definition contradicts the producing
      rule in the reachable no-window state.
    root_confidence: medium
    surface_finding_ids: [finding-003]
    relation_refs: []
    raised_by_lens_ids: [logic]
    issue_statement: >-
      The doc defines [] to mean "window still open", but flush also returns
      [] in the reachable state windowStartedAt === null in which no window
      is open; one return value carries two undistinguished meanings, and
      under finding-001's clock-skew condition the misreading turns from a
      transient ambiguity into a permanently misleading caller-facing
      reading.
    proposed_action: >-
      Widen the documented meaning ("[] means there is nothing to flush yet:
      no window has started, or the window is still open") or make the
      states distinguishable in the signature (e.g. return null for "no
      window" vs [] for "window open"), keeping C6 consistent with whichever
      is chosen.
    affected_purpose: >-
      verifiability of the caller-facing contract; correctness of caller-side
      state interpretation (declared review goals)
    failure_condition: >-
      a caller or monitor branches on the documented meaning of [] in the
      no-window state, or operates under finding-001's clock-skew condition
      where the misleading reading persists indefinitely
    impact: >-
      misclassification of batcher state by polling callers; tests written
      against the documented meaning validate the wrong semantics
    evidence_refs:
      - "round1/logic.md#finding-3"
      - "notification-batcher.ts:28"
      - "notification-batcher.ts:31"
      - "notification-batcher.ts:40"
    severity: medium
    domain_threshold_used: null
