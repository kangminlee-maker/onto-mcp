      finding-003 is linked only by the enables relation rel-005 from
      finding-001, which records persistence-enablement of an independent
      definition-vs-rule contradiction, not a shared root; no
      same_root_candidate relation supports a merge.
  - issue_id: issue-004
    root_cause_hypothesis: >-
      The design never designates a single canonical time authority for the
      batcher; the enqueue/flush clock split (internal Date.now() vs
      caller-supplied now) and the inert, caller-trusted enqueuedAt field
      beside the internally stamped windowStartedAt are two manifestations of
      that one missing designation. Falsifiable: a fix that injects one clock
      owning every timestamp in the file should dissolve both defects; if
      either survives such a fix, the common-root claim is wrong.
    root_confidence: medium
    surface_finding_ids: [finding-005, finding-007]
    relation_refs: [rel-007]
    raised_by_lens_ids: [coverage]
    issue_statement: >-
      No single time authority is designated anywhere in the batcher: the
      window lifecycle is governed by two parallel, unreconciled clocks
      (Date.now() in enqueue vs caller-injected now in flush), and the
      entry-time record is declared on enqueuedAt yet never stamped or read
      by the entry-owning method, which re-measures entry time from its own
      clock — one undesignated-authority root with two surface
      manifestations whose fixes are coupled.
    proposed_action: >-
      Designate a single time authority owning every timestamp in the file:
      inject a constructor-supplied clock used by both enqueue and flush (or
      have flush own time internally via Date.now()), and assign enqueuedAt
      stamping to the entry owner from that same clock (or re-document it as
      caller-asserted creation time); at minimum document the required time
      base on flush(now).
    affected_purpose: >-
      correctness review goal — window-closure contract of the enqueue/flush
      pair / verifiability review goal — trustworthiness of the documented
      entry-time record
    failure_condition: >-
      any caller supplying now from a different time base than Date.now()
      (performance.now(), seconds instead of ms, or a simulated test clock) /
      any caller supplying an inaccurate, stale, or fabricated enqueuedAt,
      whose divergence from actual entry time is unbounded and undetectable
      within the target
    impact: >-
      window closure fails in both directions — never closes (notifications
      never delivered) or closes immediately — because the closure
      subtraction mixes two unreconciled time bases / downstream consumers
      (ordering, age-based expiry, audit) that trust the documented
      entry-time semantics build on a record no component guarantees, while
      a second parallel entry-adjacent timestamp coexists with no designated
      canonical source
    evidence_refs:
      - "round1/coverage.md#finding-1"
      - "notification-batcher.ts:20"
      - "notification-batcher.ts:30-32"
      - "round1/coverage.md#finding-3"
