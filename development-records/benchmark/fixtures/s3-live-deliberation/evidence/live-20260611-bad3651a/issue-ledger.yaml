  - issue_id: issue-007
    root_cause_hypothesis: >-
      The comment encodes an intended-but-unbuilt behavior: a carry-over
      contract with no implementing mechanism in the code.
    root_confidence: medium
    surface_finding_ids: [finding-010]
    relation_refs: []
    raised_by_lens_ids: [semantics]
    issue_statement: >-
      The reset comment states that notifications enqueued between the
      window-close check and the reset are carried into the next window, but
      pending.clear() removes all entries unconditionally and no snapshot
      distinguishes entries being digested from entries that arrived after
      the check; the comment describes a scenario the current synchronous
      code neither encounters nor handles, and a later async/re-entrant
      refactor relying on the documented invariant inherits silent
      notification loss.
    proposed_action: >-
      Either implement the stated semantics (snapshot the keys/entries to
      digest, delete only those keys, leaving later arrivals in place) or
      rewrite the comment to state the actual behavior ("all entries pending
      at flush time are digested and cleared; nothing is carried over").
    affected_purpose: >-
      correctness, maintainability, and regression_risk (declared review
      goals) — contract-vs-behavior consistency of the flush reset
    failure_condition: >-
      a maintainer later makes flush async or re-entrant and relies on the
      documented carry-over invariant; the described interleaving then
      becomes reachable while the code provides no implementing mechanism
    impact: >-
      silent notification loss inherited from a documented invariant the
      code does not provide; today the comment describes a scenario the code
      neither encounters nor handles as stated
    evidence_refs:
