issues:
  - issue_id: issue-001
    root_cause_hypothesis: >-
      Window-start and window-close use different time authorities (internal
      Date.now() vs caller-supplied now) with no declared same-clock
      precondition, so the flush close obligation is violable with
      declared-legal inputs.
    root_confidence: medium
    surface_finding_ids: [finding-001]
    relation_refs: []
    raised_by_lens_ids: [logic]
    issue_statement: >-
      Window start and window close are judged on two different time
      authorities — enqueue binds windowStartedAt to the internal Date.now()
      wall clock while flush evaluates closure against an arbitrary
      caller-supplied now — and no same-clock precondition is declared, so
      the claim set {C5, C6, R1, R3} is jointly satisfiable only under an
      undeclared premise and the documented flush close obligation is
      violable over the full declared input domain of flush(now).
    proposed_action: >-
      Unify the time authority: parameterize enqueue on the same clock
      (enqueue(item, now)), drop the now parameter and use Date.now() in
      flush, or inject a single clock function at construction used by both
      methods; declare the clock-source contract on the API doc.
    affected_purpose: >-
      correctness and verifiability of the flush contract (declared review
      goals: correctness, verifiability)
    failure_condition: >-
      any flush caller whose now is not sampled from the same wall clock that
      enqueue used: deterministic-clock tests, monotonic-time-derived values,
      cross-process or skewed clock sources
    impact: >-
      digests are never emitted for the affected window (perpetual [] read as
      "window still open") or are emitted before the window elapses; the 30s
      batching contract is silently broken and the documented [] meaning
      becomes permanently misleading
    evidence_refs:
      - "round1/logic.md#finding-1"
      - "notification-batcher.ts:20"
      - "notification-batcher.ts:27-28"
      - "notification-batcher.ts:30-32"
    severity: high
    domain_threshold_used: null
