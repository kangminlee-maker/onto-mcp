classifications:
  - issue_id: issue-001
    problem_definition: Window start and window close are judged on two different
      time authorities — enqueue binds windowStartedAt to the internal
      Date.now() wall clock while flush evaluates closure against an arbitrary
      caller-supplied now — with no declared same-clock precondition, so the
      documented flush close obligation is violable over the full declared
      input domain of flush(now).
    issue_role: symptom
    judgment_state: observed
    impact_kind: correctness
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: All three lenses support with root accepted and high severity kept
      (no-deliberation-needed, consistent_stances); the {C5, C6, R1, R3}
      contradiction is established directly from observed code and doc claims,
      so judgment_state is observed. Classified symptom rather than root_cause
      because the resolved issue-004 root (single undesignated time authority)
      was accepted by all lenses as generalizing this clock-split
      manifestation; rel-005 additionally records that this defect enables
      issue-003's persistent misreading. The failure path is occupiable with
      declared-legal inputs today (the panel's high-severity calibration
      anchor), so it is a current correctness blocker that must close in the
      target via the single-time-authority fix.
    related_surface_finding_ids:
      - finding-001
  - issue_id: issue-002
    problem_definition: The documented check-to-reset preservation property has no
      implementing mechanism — the guarantee is written at item granularity
      while the only reset operates at window granularity (whole-map
      pending.clear()), so the documented invariant is false today and loss
      activation is refactor-conditional, with no target-internal evidence
      locating the defect on the comment side versus the code side.
    issue_role: independent_issue
    judgment_state: observed
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: needs_decision
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: Resolved at medium with the direction-neutral root adopted by all
      three lenses under the impact-reachability calibration. The
      contract-vs-behavior falsity is directly observed (comment versus
      unconditional clear() at the same program point), but the loss
      antecedent is unoccupiable with declared-legal inputs in the bounded
      synchronous target, so it blocks the async/re-entrant refactor stage
      rather than current operation. Independent of the time-authority root;
      duplicate cluster with issue-005/issue-007 (rel-003/rel-004) decided at
