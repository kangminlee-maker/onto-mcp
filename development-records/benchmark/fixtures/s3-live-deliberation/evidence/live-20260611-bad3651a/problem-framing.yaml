  - issue_id: issue-003
    problem_definition: flush conflates two distinct states ("no window started"
      and "window open, not yet closed") into a single [] output while the doc
      defines only one meaning for it, so the documented meaning of [] is
      false on every idle-state flush(now) call with declared-legal inputs — a
      today-exercised, clock-independent contract falsity with
      interpretive-only standalone harm.
    issue_role: independent_issue
    judgment_state: observed
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: Both participating lenses converged at medium after deliberation
      adjudicated the medium-vs-low calibration — a today-exercised contract
      falsity cannot grade below the refactor-conditional cluster held at
      medium. The persistent-misreading escalation under clock skew is priced
      in issue-001/issue-006, not here, so the issue stands as an independent
      definitional defect. The homonym is directly observed from the doc and
      the reachable no-window return path. Standalone harm is interpretive
      (monitors misclassify idle as batching; tests written against the
      documented meaning validate the wrong semantics), so it must close
      before verification-stage work; either widening the documented meaning
