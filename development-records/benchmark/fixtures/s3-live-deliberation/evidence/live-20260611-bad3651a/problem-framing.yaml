  - issue_id: issue-006
    problem_definition: Two distinct time concepts — internal wall-clock now and
      caller-supplied now — share one name without a unifying contract; the
      expression now - windowStartedAt subtracts an internally sourced
      Date.now() value from a caller-supplied number whose time source is
      never declared, so the window-duration semantics are unguaranteed over
      the declared input domain and the file's caller-supplied epoch-ms
      precedent (enqueuedAt) makes a divergent caller clock an in-contract
      scenario.
