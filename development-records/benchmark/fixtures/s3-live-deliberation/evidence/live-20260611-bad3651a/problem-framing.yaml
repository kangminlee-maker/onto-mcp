  - issue_id: issue-008
    problem_definition: A derivable value (windowStartedAt) is modeled as an
      independent input from a second clock while its source field
      (enqueuedAt) is kept inert, leaving two un-unified authorities for the
      one meaning "time the notification entered the batch"; the batcher never
      reads enqueuedAt, so the interface advertises a timestamp contract with
      no behavioral meaning while the window anchors to a divergent second
      source.
    issue_role: symptom
    judgment_state: observed
    impact_kind: consistency
