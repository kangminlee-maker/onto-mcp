classifications:
  - issue_id: issue-001
    problem_definition: Time authority is split across the batcher's two mutating
      entry points — the window anchor is sampled from ambient Date.now() at
      enqueue (line 20) while window closure is computed from the caller-injected
      now at flush (line 30) — with no declared contract binding the two clocks,
      so the window-closed predicate (contract C4) rests on an undeclared
      shared-clock condition and is violated for permitted inputs.
    issue_role: symptom
    judgment_state: inferred
    impact_kind: correctness
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: High-severity material candidate with unanimous
      support/accepts/keeps stances and a no-deliberation-needed resolution.
      Classified symptom rather than root_cause because the closure contradiction
      is the manifestation of the absent inter-clock binding carried as shared
      cause by issue-005 (dep-001) and issue-011 (dep-002). The violation is a
      deductive derivation over permitted inputs rather than a directly observed
      runtime failure (inferred); it breaks the declared correctness goal on the
      core C4 flush contract inside the requested time-source-semantics focus
      (current_blocker), and binding both closure operands to one declared clock
      authority is achievable within the single-file target (fix_now,
      must_close_in_target).
    related_surface_finding_ids:
      - finding-001
  - issue_id: issue-002
