      mechanism: no code path snapshots window membership at the close instant,
      so the guaranteed interval is empty under synchronous execution and the
      only materially reachable behavior is emit-all-then-clear, contradicting
      the written contract at lines 37-38."
    issue_role: independent_issue
    judgment_state: inferred
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: Medium-severity material candidate with unanimous stances,
