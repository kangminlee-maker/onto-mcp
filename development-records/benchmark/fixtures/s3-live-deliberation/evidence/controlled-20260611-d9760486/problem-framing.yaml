  - issue_id: issue-006
    problem_definition: "The pending-notification lifecycle has no termination
      segment: the exported surface contains only enqueue, window-gated flush,
      and pendingUserCount, so no unconditional exit path exists for pending
      items and they are silently lost at shutdown, poller failure, or batcher
      decommission."
    issue_role: independent_issue
    judgment_state: inferred
    impact_kind: completeness
    timing_class: next_step_blocker
    closure_class: needs_decision
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: Medium-severity material candidate, unanimous stances,
      no-deliberation-needed. The silent-loss conclusion is a valid inference
      from the exported surface, not a contradiction of any declared claim
      (inferred); the defect is a missing lifecycle termination segment
      (completeness). dep-004 records a shared mid-path cause with issue-007
      (poll-and-window-gated sole reducer) but the roots and mitigations are
      distinct, so independent_issue. Closure requires choosing and adding a
      terminal operation plus a documented caller shutdown obligation — a
      contract-extension decision (needs_decision) that must land before any
      next stage relies on loss-free delivery (next_step_blocker,
      must_close_before_next_stage).
    related_surface_finding_ids:
      - finding-006
  - issue_id: issue-007
    problem_definition: "No capacity, overflow, or backpressure concept exists
      anywhere in the contract or implementation (absence across lines 14-48):
      enqueue appends unconditionally while the sole reducer (flush) is poll- and
      window-gated, so the pending store grows without bound whenever polling
      stalls or slows while enqueues continue."
    issue_role: independent_issue
    judgment_state: inferred
    impact_kind: completeness
    timing_class: next_step_blocker
    closure_class: needs_decision
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: Medium-severity material candidate, unanimous stances,
      no-deliberation-needed. Unbounded growth follows necessarily from
      unconditional append plus the poll-and-window-gated sole reducer
      (inferred); the defect is an absent capacity/overflow/backpressure concept
      (completeness). Distinct root and mitigation from issue-006 despite the
      shared mid-path cause recorded by dep-004, so independent_issue. Closure
      requires selecting a documented capacity bound and an explicit overflow
      policy — reject, drop-oldest, or force-flush — and surfacing overflow to
      the caller (needs_decision, next_step_blocker,
      must_close_before_next_stage).
    related_surface_finding_ids:
      - finding-007
  - issue_id: issue-008
