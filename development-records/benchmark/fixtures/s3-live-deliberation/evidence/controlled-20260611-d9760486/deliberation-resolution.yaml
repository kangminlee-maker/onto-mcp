  - issue_id: issue-010
    status: no-deliberation-needed
    final_root_cause: >-
      The carry-over comment asserts a behavioral guarantee over a
      hypothetical interleaving window between the close check (line 32) and
      the reset (line 39) that the synchronous execution model makes
      unreachable, while this.pending.clear() inverts the promised outcome if
      it ever became reachable.
    final_claim: >-
      The comment 'Notifications enqueued between the window close check and
      this reset are carried into the next window' (lines 37-38) does not
      match this.pending.clear() (line 39), which would unconditionally
      discard such notifications; the documented contract is false as written
      and inverts the actual failure mode.
