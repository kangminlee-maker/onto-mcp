      emit-all-then-clear behavior (lines 34-36, 39) are not jointly
      satisfiable: the guaranteed interval is empty under synchronous
      execution, and in the only materially reachable reading items are
      emitted in the current digest and cleared, never carried over.
    surface_finding_ids:
