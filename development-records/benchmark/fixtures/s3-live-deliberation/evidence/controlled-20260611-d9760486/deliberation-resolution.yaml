  - issue_id: issue-012
    status: no-deliberation-needed
    final_root_cause: >-
      The flush name and its documentation claim stricter semantics than the
      behavior provides — unconditional flush vs window-gated conditional
      poll, a single documented meaning for [] vs two guard states, and
      window-bounded digest membership vs poll-time membership.
    final_claim: >-
      flush conventionally means 'force out pending content' but the method is
      a conditional poll that usually returns []; the empty-return doc is
      inaccurate for the no-window state, and items enqueued after the window
      elapsed but before the poll are absorbed into the closing digest,
      loosening the documented window semantics.
