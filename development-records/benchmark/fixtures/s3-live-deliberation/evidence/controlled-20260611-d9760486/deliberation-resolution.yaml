  - issue_id: issue-011
    status: no-deliberation-needed
    final_root_cause: >-
      The batcher owns no time fact: the window anchor, the closure input, and
      the documented batch-entry timestamp are all sourced from ambient or
      caller-chosen clocks that the batcher neither establishes nor validates;
      the built-in refutation condition (clock unification alone leaving
      finding-012 intact without the stamping change) is accepted by all
      lenses.
    final_claim: >-
      windowStartedAt is written from the internal wall clock Date.now() (line
      20) but compared against the caller-supplied now (lines 30-32) with no
      contract binding the two clocks, and enqueuedAt's documented batch-entry
      meaning (line 8) is delegated to callers pre-enqueue and never
      established, validated, or read by the batcher — time ownership is
      undesigned in the class, so neither WINDOW_MS nor enqueuedAt denotes
      what its name and documentation assert.
