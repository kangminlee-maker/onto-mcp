  - finding_id: finding-010
    lens_id: semantics
    source_ref: round1/semantics.md#finding-1
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:37-39"
    claim: >-
      The comment 'Notifications enqueued between the window close check and
      this reset are carried into the next window' (lines 37-38) does not
      match the behavior of this.pending.clear() (line 39), which would
      unconditionally discard such notifications; the documented contract is
      false as written and inverts the actual failure mode.
    lens_rationale_summary: >-
      Semantics lens found the documented contract false as written: the
      guarantee describes an interleaving point that synchronous flush makes
      unreachable, and under any future condition where it became reachable
      clear() would silently drop — the opposite of the documented carry-over;
      a regression trap under the declared correctness/regression_risk/
      maintainability goals.
    proposed_action: >-
      Make the comment state the true semantics (flush is synchronous; nothing
      can interleave; if it ever becomes async, interleaved enqueues would be
      dropped by clear() — preserve them explicitly), or implement real
      carry-over by iterating a snapshot and deleting only flushed entries so
      the comment becomes true.
    affected_purpose: >-
      Review goals `correctness`, `regression_risk`, and `maintainability`:
      the truthfulness of the inline reset contract that future maintainers
      will rely on.
    failure_condition: >-
      A maintainer assumes loss-free carry-over per the comment; or a future
      async/re-entrant refactor makes the interleaving point reachable, where
      clear() silently drops the interleaved items.
    impact: >-
      The comment licenses an assumption of loss-free behavior that the code
      inverts — a material regression trap inside the bounded target.
    evidence_refs: [round1/semantics.md#finding-1]
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: >-
        Correctness, regression risk, and maintainability of the documented
        reset/carry-over contract.
      failure_condition: >-
        Maintainer reliance on the carry-over guarantee, or any future
        refactor that makes the described interleaving reachable.
      impact: >-
        Documented guarantee is unexhibitable today and inverted (silent drop)
        under the only conditions where it would matter.
      evidence_refs: [round1/semantics.md#finding-1]
    causal_path:
      root_cause_candidate: >-
        The comment asserts a behavioral guarantee about a hypothetical
        interleaving window between the close check (line 32) and the reset
        (line 39) that the synchronous execution model makes unreachable,
        while clear() inverts the promised outcome if it ever became
        reachable.
      root_cause_step_id: finding-010.cause-002
      steps:
        - cause_id: finding-010.cause-001
          claim: >-
            The carry-over comment does not match this.pending.clear(), which
            unconditionally discards every entry regardless of when it was
            enqueued.
          relation_to_previous: null
          evidence_refs: [round1/semantics.md#finding-1]
        - cause_id: finding-010.cause-002
          claim: >-
            The guarantee was written over an unreachable interleaving point
            (synchronous flush, no await/callback/iterator hand-off between
            lines 32 and 39) with no implementing mechanism, so it is vacuous
            today and inverted under any future reachability.
          relation_to_previous: causes
          evidence_refs: [round1/semantics.md#finding-1]
      unresolved_beyond_evidence: null
