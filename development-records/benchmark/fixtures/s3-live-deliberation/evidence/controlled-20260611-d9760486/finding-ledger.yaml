    source_ref: round1/semantics.md#finding-4
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:26-32"
    claim: >-
      flush conventionally means 'force out pending content', but this method
      is a conditional poll that usually returns []; the doc 'an empty array
      means window still open' (line 28) is also inaccurate because [] is
      equally returned when no window exists at all (line 31), and items
      enqueued after the window elapsed but before the poll are absorbed into
      the closing digest, loosening the documented 'when the batch window
      closes' semantics (lines 2-3).
    lens_rationale_summary: >-
      Semantics lens surface naming/doc finding: the name and docs claim
      stricter semantics than the behavior provides (unconditional flush vs
      conditional poll; single meaning for [] vs two guard states;
      window-bounded membership vs poll-time membership); kept surface-level
      per severity.
    proposed_action: >-
      Rename to poll-style (pollDigests, flushIfWindowClosed) or document the
      conditional behavior; correct the doc to 'an empty array means no closed
      window is ready (no window started, or window still open)'; either state
      that late items ride the closing digest or filter membership by window
      if strict windowing is intended.
    affected_purpose: >-
      Review goal `maintainability`: name-vs-behavior fit of the flush API
      surface and its return-value documentation.
    failure_condition: >-
