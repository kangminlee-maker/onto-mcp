  - finding_id: finding-008
    lens_id: coverage
    source_ref: round1/coverage.md#finding-4
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:8-9,35,37-38"
    claim: >-
      enqueuedAt is a documented contract field but is never read; digests
      carry only bodies and flush leaves no record of what was delivered when,
      so past batch state cannot be reconstructed and the carry-over comment
      is unverifiable.
    lens_rationale_summary: >-
      Coverage lens dimensional-deficit check: the temporal axis is declared
      at input but absent on the output/history side — declared temporality
      with no history/evidence counterpart, bearing on the declared
      verifiability goal; kept surface-level per severity.
    proposed_action: >-
      Either remove enqueuedAt from the contract or use it (order digest lines
      by it, include timestamps in the digest, or expose flushed-batch
      metadata); at minimum have flush return or report enough metadata
      (window start, item counts) that delivered batches are verifiable.
    affected_purpose: >-
      Review goal `verifiability`: reconstructability of past batch state and
      verifiability of the carry-over comment.
    failure_condition: >-
      Any post-hoc attempt to verify what a flushed window contained or when
      items were delivered — state is destroyed at flush with nothing
      persisted.
    impact: >-
      Past windows cannot be reconstructed and the documented carry-over
      assertion can never be checked against evidence.
    evidence_refs: [round1/coverage.md#finding-4]
    severity: low
