findings:
  - finding_id: finding-001
    lens_id: logic
    source_ref: round1/logic.md#finding-l1
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:20, notification-batcher.ts:30-32"
    claim: >-
      The window-closed predicate compares a caller-supplied clock (`now`)
      against an internally sampled ambient clock (`Date.now()`); the rule set
      is jointly satisfiable only under an undeclared necessary condition that
      both values come from the same epoch-ms clock, so C4 ('flushes when the
      window has closed') is violated for permitted inputs.
    lens_rationale_summary: >-
      Logic lens found an inter-claim unsatisfiability (verdict: fail) between
      C3 (windowStartedAt = Date.now() at enqueue) and C4+C6 (closure computed
      from caller-supplied now at flush): a necessary shared-clock constraint
      is treated as merely possible, directly hitting the requested
      time-source-semantics focus and the correctness review goal. Residual
      contradiction persists after semantic disambiguation of `now`, so logic
      holds the primary finding.
    proposed_action: >-
      Use one time authority for the whole window lifecycle: either thread the
      caller clock through both entry points (enqueue(item, now) or use
      item.enqueuedAt to start the window), or drop the now parameter and use
      Date.now() inside flush (providing the test time-injection seam via an
      injected clock). At minimum document that now must be epoch ms from the
      same clock as Date.now().
    affected_purpose: >-
      Declared review goal `correctness` and the flush contract C4 ('flushes
      when the window has closed') under the requested time-source-semantics
      focus.
    failure_condition: >-
      Any permitted caller whose flush(now) value comes from a clock other
      than Date.now() — test clock, monotonic clock, replayed or skewed clock
      — since the signature flush(now: number) carries no time-base
      constraint.
    impact: >-
      With a smaller-magnitude (e.g. monotonic) now the window never closes
      and flush returns [] forever; with a larger-epoch now it flushes
      immediately, violating the 30s window rule — the core batching contract
      cannot be trusted for permitted inputs.
    evidence_refs: [round1/logic.md#finding-l1]
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: >-
        Review goal `correctness` and contract C4 (flush on window close) in
        the declared time-source-semantics focus area.
      failure_condition: >-
        Caller supplies flush(now) from any clock other than the Date.now()
        epoch-ms timeline; the declared contract permits any number.
      impact: >-
        Window closure becomes never, early, or instant; the declared 30s
        digest behavior is unachievable for permitted inputs, breaking trust
        in the primary batching contract.
      evidence_refs: [round1/logic.md#finding-l1]
    causal_path:
      root_cause_candidate: >-
        The design splits time authority across the two mutating entry points
        — window start from the ambient clock at enqueue (line 20), window
        closure from injected time at flush (line 30) — with no claim in the
        target declaring or enforcing the required inter-clock identity.
      root_cause_step_id: finding-001.cause-002
      steps:
        - cause_id: finding-001.cause-001
          claim: >-
            flush's window-closed predicate (now - windowStartedAt >=
            WINDOW_MS) subtracts an internally Date.now()-sampled anchor from
            a caller-supplied now, so closure is wrong whenever the two values
            are not on one shared epoch-ms clock.
          relation_to_previous: null
          evidence_refs: [round1/logic.md#finding-l1]
        - cause_id: finding-001.cause-002
          claim: >-
            Time authority is split across enqueue (ambient Date.now(), line
            20) and flush (caller-injected now, line 30) and no declared
            contract binds the two clocks, so the closure rule's truth depends
            on an undeclared necessary condition.
          relation_to_previous: causes
          evidence_refs: [round1/logic.md#finding-l1]
      unresolved_beyond_evidence: null
  - finding_id: finding-002
    lens_id: logic
    source_ref: round1/logic.md#finding-l2
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:37-40, notification-batcher.ts:34-36"
    claim: >-
      The comment claims notifications enqueued between the window-close check
      and the reset are carried into the next window, but under synchronous
      execution that interval admits no enqueues (the claim is vacuous), and
      under the only materially reachable reading (enqueued after the
      window-close instant, before the flush poll) such items are emitted in
      the current digest and cleared, never carried over. The documented
      guarantee and the implemented behavior are not jointly satisfiable.
    lens_rationale_summary: >-
      Logic lens found C7 (carry-over guarantee, lines 37-38) and C8
      (emit-all-then-clear, lines 34-36,39) jointly unsatisfiable for any item
      present at flush time: an obligation is asserted over an interval the
      execution model makes empty, masking a false guarantee in the reachable
      interpretation — a contract-vs-behavior contradiction under the
      correctness goal.
    proposed_action: >-
      Make the code and the claim agree: either implement the guarantee by
      filtering the digest loop to items with enqueuedAt < windowStartedAt +
      WINDOW_MS and retaining later items in pending, or correct the comment
      to state actual behavior (all pending notifications at flush time are
      emitted in this digest; nothing carries over).
    affected_purpose: >-
      Review goals `correctness` and `regression_risk`: the documented
      loss-safety (carry-over) contract of flush's reset step.
    failure_condition: >-
      Any item present in the pending map at flush time when the window has
      closed — in particular items enqueued after the window-close instant but
      before the caller polls flush.
    impact: >-
      The documented carry-over guarantee has no implementing mechanism;
      maintainers and callers relying on it assume loss-free behavior that the
      code contradicts, weakening trust in the documented contract.
    evidence_refs: [round1/logic.md#finding-l2]
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: >-
        Correctness and regression risk of the documented flush reset
        contract (carry-over guarantee).
      failure_condition: >-
        Items enqueued after the window-close instant but before the flush
        poll; any future async/re-entrant refactor of flush.
      impact: >-
        Documented guarantee is unsatisfiable as implemented — items are
        emitted in the closing digest and wiped by clear(), so the contract
        misleads maintainers about loss behavior.
      evidence_refs: [round1/logic.md#finding-l2]
    causal_path:
      root_cause_candidate: >-
        No code path snapshots window membership at the close instant: the
        close check (line 32) gates timing only while content is taken
        wholesale at emission time, so the promised carry-over has no
        mechanism that could implement it.
      root_cause_step_id: finding-002.cause-002
      steps:
        - cause_id: finding-002.cause-001
          claim: >-
            The comment promises carry-over into the next window, but the
            digest loop emits every pending entry with no timestamp filter and
            clear() unconditionally removes everything, so nothing is ever
            carried over.
          relation_to_previous: null
          evidence_refs: [round1/logic.md#finding-l2]
        - cause_id: finding-002.cause-002
          claim: >-
            No mechanism snapshots window membership at the close instant —
            timing and content are decoupled (close check gates when, the loop
            takes whatever is present) — making the obligated carry-over state
            unreachable.
          relation_to_previous: causes
          evidence_refs: [round1/logic.md#finding-l2]
      unresolved_beyond_evidence: null
  - finding_id: finding-003
    lens_id: logic
    source_ref: round1/logic.md#finding-l3
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:28, notification-batcher.ts:31"
    claim: >-
      The documented interpretation rule 'an empty array means window still
      open' is contradicted by the no-window state: when windowStartedAt is
      null (nothing enqueued, or just flushed), flush returns [] although no
      window exists, so the conditional rule 'empty implies window still open'
      is false in a reachable state.
    lens_rationale_summary: >-
      Logic lens found the doc-level conditional C5 (empty return implies open
      window) violated by the reachable no-window state at line 31 — a formal
      contract-vs-behavior inconsistency in the return-value protocol, kept
      surface-only per severity (behaviorally benign for pure polling loops).
    proposed_action: >-
      Either narrow the doc ('an empty array means there is nothing ready to
      flush — the window is still open or no notifications are pending') or
      split the protocol (e.g. null for no-window vs [] for window-open) if
      callers need to distinguish the states.
    affected_purpose: >-
      Verifiability and maintainability of the flush return-value protocol
      documentation.
    failure_condition: >-
      The no-window state (windowStartedAt === null): nothing enqueued yet, or
      immediately after a flush.
    impact: >-
      A polling caller cannot distinguish 'still batching' from 'idle' via the
      documented protocol; the stated rule is formally false in a reachable
      state, though behaviorally benign for pure polling loops.
    evidence_refs: [round1/logic.md#finding-l3]
    severity: low
    domain_threshold_used: null
    materiality_basis: null
    causal_path: null
  - finding_id: finding-004
    lens_id: logic
    source_ref: round1/logic.md#finding-l4
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:8-9, notification-batcher.ts:20"
    claim: >-
      C2 defines enqueuedAt as 'Epoch ms when the notification entered the
      batch', yet enqueue records the same event instant independently via
      Date.now() and never consults enqueuedAt anywhere; the definition holds
      only under the undeclared necessary condition that callers pass
      Date.now() at call time, so the model permits states in which the
      field's definition is false.
    lens_rationale_summary: >-
      Logic lens found two recordings purporting to denote the first-enqueue
      instant (caller-supplied enqueuedAt vs internally sampled
      windowStartedAt) with no reconciliation rule — a definitional
      inconsistency in time-source semantics; latent rather than active since
      no behavior currently reads the field, kept surface-only per severity.
    proposed_action: >-
      Pick one authority for the batch-entry instant: use item.enqueuedAt to
      start the window (making the field load-bearing, aligning with the
      finding-001 single-authority fix), or remove the field from the required
      interface if the batcher is the time authority; document the chosen
      authority on the interface.
    affected_purpose: >-
      Correctness and maintainability of the PendingNotification interface
      definition under the time-source-semantics focus.
    failure_condition: >-
      Any caller that populates enqueuedAt with a value other than Date.now()
      at the moment of the enqueue call — permitted by the declared contract.
    impact: >-
      Two definitions of one instant may silently diverge; the divergence is
      latent (no current reader of enqueuedAt) but undermines the documented
      meaning of the contract field.
    evidence_refs: [round1/logic.md#finding-l4]
    severity: low
    domain_threshold_used: null
    materiality_basis: null
    causal_path: null
  - finding_id: finding-005
    lens_id: coverage
    source_ref: round1/coverage.md#finding-1
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:20,30-32"
    claim: >-
      Window-closure decisions mix two undeclared time authorities (internal
      Date.now() at enqueue vs caller-supplied now at flush) with no single
      time-source authority concept.
    lens_rationale_summary: >-
      Coverage lens flagged a dimensional deficit: one time-dependent value
      (window age) is parallel-managed across two time sources with no
      single-origin authority designation anywhere in the file; the request
      summary explicitly scopes time-source semantics into this review.
    proposed_action: >-
      Designate a single time authority; smallest in-target fix: stop calling
      Date.now() in enqueue and anchor the window from the same
      caller-supplied time source (enqueue(item, now) or an injected clock
      used by both methods), and document on flush that now must come from
      that same authority.
    affected_purpose: >-
      Declared review goal `correctness` for window-closure decisions under
      the requested time-source-semantics focus.
    failure_condition: >-
      Whenever the caller's now comes from a different epoch or skewed source
      than Date.now() (test clock, monotonic clock, mocked scheduler time),
      the closure predicate becomes a cross-clock subtraction.
    impact: >-
      A cross-clock subtraction makes the window close never, early, or
      instantly, violating the declared correctness goal inside the bounded
      target.
    evidence_refs: [round1/coverage.md#finding-1]
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: >-
        Correctness of window-closure decisions; explicitly in-scope
        time-source semantics.
      failure_condition: >-
        Caller-supplied now from a different epoch or skewed source than the
        Date.now() anchor.
      impact: >-
        Window closes never, early, or instantly — the core window contract
        fails under permitted caller behavior.
      evidence_refs: [round1/coverage.md#finding-1]
    causal_path:
      root_cause_candidate: >-
        The contract lacks any clock-authority concept: no clock parameter on
        enqueue and no documented requirement on now's source (absence across
        lines 18-32).
      root_cause_step_id: finding-005.cause-003
      steps:
        - cause_id: finding-005.cause-001
          claim: >-
            The window closes never, early, or instantly whenever the caller's
            now diverges from the Date.now() timeline, violating the declared
            correctness goal.
          relation_to_previous: null
          evidence_refs: [round1/coverage.md#finding-1]
        - cause_id: finding-005.cause-002
          claim: >-
            The closure predicate (line 32) is a cross-clock subtraction:
            windowStartedAt is anchored to the internal wall clock (line 20)
            while now is caller-supplied (line 30).
          relation_to_previous: causes
          evidence_refs: [round1/coverage.md#finding-1]
        - cause_id: finding-005.cause-003
          claim: >-
            No clock-authority concept exists in the contract — nothing binds
            the caller's time source to the internal anchor's source, so the
            two authorities are free to diverge.
          relation_to_previous: causes
          evidence_refs: [round1/coverage.md#finding-1]
      unresolved_beyond_evidence: null
  - finding_id: finding-006
    lens_id: coverage
    source_ref: round1/coverage.md#finding-2
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:30-32,44-47"
    claim: >-
      The pending-notification lifecycle covers enqueue and window-gated flush
      but has no termination segment (drain/close/dispose); pending items are
      unreachable at shutdown or poller stop and are silently lost.
    lens_rationale_summary: >-
      Coverage lens ghost-sub-area check: lifecycle termination is implied by
      the batching domain but entirely absent — the only exit path for pending
      items is a future poll that satisfies the window predicate, a
      correctness and regression risk inside the declared review goal.
    proposed_action: >-
      Add a terminal operation, e.g. drain(): Array<{ userId: string; digest:
      string }> that emits digests for all pending items regardless of
      WINDOW_MS and resets state; document that callers must invoke it on
      shutdown.
    affected_purpose: >-
      Review goals `correctness` and `regression_risk`: loss-free handling of
      pending notifications across the full lifecycle.
    failure_condition: >-
      Process shutdown, poller failure, or batcher decommission while items
      are pending — the future poll that would release them never happens.
    impact: >-
      Pending notifications are silently dropped with no contract
      acknowledging it; silent loss is unacceptable per the artifact's stated
      delivery purpose.
    evidence_refs: [round1/coverage.md#finding-2]
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: >-
        Correctness and regression risk of notification delivery at
        end-of-life (shutdown/decommission) paths.
      failure_condition: >-
        Shutdown, poller stop, or decommission with non-empty pending state.
      impact: >-
        Silent data loss of pending notifications with no contract surface
        acknowledging or mitigating it.
      evidence_refs: [round1/coverage.md#finding-2]
    causal_path:
      root_cause_candidate: >-
        No terminal-lifecycle concept exists in the API — the exported surface
        contains only enqueue, window-gated flush, and pendingUserCount, with
        no drain/close/force-flush member.
      root_cause_step_id: finding-006.cause-003
      steps:
        - cause_id: finding-006.cause-001
          claim: >-
            At process shutdown, poller failure, or decommission, pending
            notifications are silently dropped because the poll that would
            flush them never happens.
          relation_to_previous: null
          evidence_refs: [round1/coverage.md#finding-2]
        - cause_id: finding-006.cause-002
          claim: >-
            Every pending item's only exit is a future external poll of flush
            that also satisfies the WINDOW_MS predicate (lines 28, 32).
          relation_to_previous: causes
          evidence_refs: [round1/coverage.md#finding-2]
        - cause_id: finding-006.cause-003
          claim: >-
            The API has no terminal-lifecycle operation (drain/close/dispose)
            anywhere in the class body, so no unconditional exit path exists.
          relation_to_previous: causes
          evidence_refs: [round1/coverage.md#finding-2]
      unresolved_beyond_evidence: null
  - finding_id: finding-007
    lens_id: coverage
    source_ref: round1/coverage.md#finding-3
    target: notification-batcher.ts
    evidence_anchor: "notification-batcher.ts:21-23,32"
    claim: >-
      The pending store grows without bound — no max-size, overflow policy, or
      backpressure concept exists, while the only reducer (flush) is poll- and
      window-gated.
    lens_rationale_summary: >-
      Coverage lens ghost-sub-area check: the batching domain implies a
      capacity/overflow sub-area (bounded buffers, drop/force-flush policies)
      that is entirely absent; combined with the unguarded poll dependency
      this is a regression and correctness risk within the declared review
      goal.
    proposed_action: >-
      Add a documented capacity bound (per user and/or total) with an explicit
      overflow policy — reject, drop-oldest, or force-flush on overflow — and
      surface overflow occurrences to the caller.
    affected_purpose: >-
      Review goals `correctness` and `regression_risk`: bounded resource
      behavior of the pending store in a long-lived process.
    failure_condition: >-
      A stalled or slow external poll loop while enqueues continue — memory
      consumption is proportional to enqueue rate times the gap between
      successful polls.
    impact: >-
      Unbounded memory growth in a long-lived process, with no contract
      surface to detect, reject, or shed load.
    evidence_refs: [round1/coverage.md#finding-3]
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: >-
        Correctness and regression risk of resource behavior under sustained
        enqueue with delayed or absent polling.
      failure_condition: >-
        Stalled or slow poller combined with ongoing enqueues in a long-lived
        process.
      impact: >-
        Unbounded pending growth — an operational failure mode with no
        detection or overflow policy in the contract.
      evidence_refs: [round1/coverage.md#finding-3]
    causal_path:
      root_cause_candidate: >-
        No capacity concept exists in the contract or implementation (absence
        across lines 14-48): enqueue has no size check or rejection path and
        nothing in the file mentions a bound.
      root_cause_step_id: finding-007.cause-003
      steps:
        - cause_id: finding-007.cause-001
          claim: >-
            Pending storage grows without bound when the poller stalls while
            enqueues continue.
          relation_to_previous: null
          evidence_refs: [round1/coverage.md#finding-3]
        - cause_id: finding-007.cause-002
          claim: >-
            The sole reducer of pending is flush, which is conditional on
            window age (line 32) and on an external caller polling (line 28).
          relation_to_previous: causes
          evidence_refs: [round1/coverage.md#finding-3]
        - cause_id: finding-007.cause-003
          claim: >-
            No capacity, overflow, or backpressure concept exists anywhere in
