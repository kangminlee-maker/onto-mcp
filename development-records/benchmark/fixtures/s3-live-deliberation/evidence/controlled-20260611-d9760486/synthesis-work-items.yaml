non_material_findings:
  - issue_id: issue-003
    severity: low
    issue_statement: "The documented rule 'an empty array means window still open'
      (line 28) is false in the reachable no-window state (windowStartedAt ===
      null), where flush also returns [] although no window exists. Source
      finding context: notification-batcher.ts Source finding context:
      notification-batcher.ts:28, notification-batcher.ts:31 Source finding
      context: The documented interpretation rule 'an empty array means window
      still open' is contradicted by the no-window state: when windowStartedAt
      is null (nothing enqueued, or just flushed), flush returns [] although no
      window exists, so the conditional rule 'empty implies window still open'
      is false in a reachable state. Source finding context: Logic lens found
      the doc-level conditional C5 (empty return implies open window) violated
      by the reachable no-window state at line 31 — a formal
      contract-vs-behavior inconsistency in the return-value protocol, kept
      surface-only per severity (behaviorally benign for pure polling loops).
      Source finding context: Either narrow the doc ('an empty array means there
      is nothing ready to flush — the window is still open or no notifications
      are pending') or split the protocol (e.g. null for no-window vs [] for
      window-open) if callers need to distinguish the states. Source finding
      context: round1/logic.md#finding-l3"
    affected_purpose: Verifiability and maintainability of the flush return-value
      protocol documentation.
    failure_condition: "The no-window state (windowStartedAt === null): nothing
      enqueued yet, or immediately after a flush."
    impact: A polling caller cannot distinguish 'still batching' from 'idle' via the
      documented protocol; the stated rule is formally false in a reachable
      state, though behaviorally benign for pure polling loops.
    evidence_refs:
      - round1/logic.md#finding-l3
    source_lens_ids:
      - logic
    action_candidates:
      - follow_up
  - issue_id: issue-004
    severity: low
    issue_statement: "enqueuedAt is defined as 'Epoch ms when the notification
      entered the batch' yet enqueue records the same instant independently via
      Date.now() and never consults enqueuedAt, so the model permits states in
      which the field's definition is false. Source finding context:
      notification-batcher.ts Source finding context:
      notification-batcher.ts:8-9, notification-batcher.ts:20 Source finding
      context: C2 defines enqueuedAt as 'Epoch ms when the notification entered
      the batch', yet enqueue records the same event instant independently via
      Date.now() and never consults enqueuedAt anywhere; the definition holds
      only under the undeclared necessary condition that callers pass Date.now()
      at call time, so the model permits states in which the field's definition
      is false. Source finding context: Logic lens found two recordings
      purporting to denote the first-enqueue instant (caller-supplied enqueuedAt
      vs internally sampled windowStartedAt) with no reconciliation rule — a
      definitional inconsistency in time-source semantics; latent rather than
      active since no behavior currently reads the field, kept surface-only per
      severity. Source finding context: Pick one authority for the batch-entry
      instant: use item.enqueuedAt to start the window (making the field
      load-bearing, aligning with the finding-001 single-authority fix), or
      remove the field from the required interface if the batcher is the time
      authority; document the chosen authority on the interface. Source finding
      context: round1/logic.md#finding-l4"
    affected_purpose: Correctness and maintainability of the PendingNotification
      interface definition under the time-source-semantics focus.
    failure_condition: Any caller that populates enqueuedAt with a value other than
      Date.now() at the moment of the enqueue call — permitted by the declared
      contract.
    impact: Two definitions of one instant may silently diverge; the divergence is
      latent (no current reader of enqueuedAt) but undermines the documented
      meaning of the contract field.
    evidence_refs:
      - round1/logic.md#finding-l4
    source_lens_ids:
      - logic
    action_candidates:
      - follow_up
      - accept_risk
  - issue_id: issue-008
    severity: low
    issue_statement: "enqueuedAt is a documented contract field that is never read,
      and flush leaves no record of what was delivered when, so past batch state
      cannot be reconstructed and the carry-over comment cannot be checked
      against evidence. Source finding context: notification-batcher.ts Source
      finding context: notification-batcher.ts:8-9,35,37-38 Source finding
      context: enqueuedAt is a documented contract field but is never read;
      digests carry only bodies and flush leaves no record of what was delivered
      when, so past batch state cannot be reconstructed and the carry-over
      comment is unverifiable. Source finding context: Coverage lens
      dimensional-deficit check: the temporal axis is declared at input but
      absent on the output/history side — declared temporality with no
      history/evidence counterpart, bearing on the declared verifiability goal;
      kept surface-level per severity. Source finding context: Either remove
      enqueuedAt from the contract or use it (order digest lines by it, include
      timestamps in the digest, or expose flushed-batch metadata); at minimum
      have flush return or report enough metadata (window start, item counts)
      that delivered batches are verifiable. Source finding context:
      round1/coverage.md#finding-4"
    affected_purpose: "Review goal `verifiability`: reconstructability of past batch
      state and verifiability of the carry-over comment."
    failure_condition: Any post-hoc attempt to verify what a flushed window
      contained or when items were delivered — state is destroyed at flush with
      nothing persisted.
    impact: Past windows cannot be reconstructed and the documented carry-over
      assertion can never be checked against evidence.
    evidence_refs:
      - round1/coverage.md#finding-4
    source_lens_ids:
      - coverage
    action_candidates:
      - follow_up
      - accept_risk
  - issue_id: issue-009
    severity: low
    issue_statement: "Monitoring covers only the user-count dimension
      (pendingUserCount); there is no pending-item count and no
      oldest-pending-age metric, so a stalled poll loop — the failure mode the
      poll-driven contract makes possible — is undetectable. Source finding
      context: notification-batcher.ts Source finding context:
      notification-batcher.ts:28,44-47 Source finding context: Coverage lens
      observability-dimension check: concept distribution in the monitoring
      sub-area is skewed toward the one dimension (user breadth) that cannot
      detect the characteristic poll-stall failure mode; kept surface-level per
      severity. Source finding context: Add pendingItemCount() and an oldest-age
      accessor (which would also give enqueuedAt a consumer, see finding-008) so
      operators can alert on aging pending notifications. Source finding
      context: round1/coverage.md#finding-5"
    affected_purpose: "Review goals `verifiability` and `regression_risk`:
      operational detectability of the poll-stall failure mode."
    failure_condition: Polling stops or slows while items age in pending — the
      existing metric reports user breadth only and cannot reveal volume or
      staleness.
    impact: The system's characteristic failure mode (items aging indefinitely) is
      invisible to operators through the provided monitoring surface.
    evidence_refs:
      - round1/coverage.md#finding-5
    source_lens_ids:
      - coverage
    action_candidates:
      - follow_up
  - issue_id: issue-012
    severity: low
    issue_statement: "flush conventionally means 'force out pending content' but the
      method is a conditional poll that usually returns []; the empty-return doc
      is inaccurate for the no-window state, and items enqueued after the window
      elapsed but before the poll are absorbed into the closing digest,
      loosening the documented window semantics. Source finding context:
      notification-batcher.ts Source finding context:
      notification-batcher.ts:26-32 Source finding context: flush conventionally
      means 'force out pending content', but this method is a conditional poll
      that usually returns []; the doc 'an empty array means window still open'
      (line 28) is also inaccurate because [] is equally returned when no window
      exists at all (line 31), and items enqueued after the window elapsed but
      before the poll are absorbed into the closing digest, loosening the
      documented 'when the batch window closes' semantics (lines 2-3). Source
      finding context: Semantics lens surface naming/doc finding: the name and
      docs claim stricter semantics than the behavior provides (unconditional
      flush vs conditional poll; single meaning for [] vs two guard states;
      window-bounded membership vs poll-time membership); kept surface-level per
      severity. Source finding context: Rename to poll-style (pollDigests,
      flushIfWindowClosed) or document the conditional behavior; correct the doc
      to 'an empty array means no closed window is ready (no window started, or
      window still open)'; either state that late items ride the closing digest
      or filter membership by window if strict windowing is intended. Source
      finding context: round1/semantics.md#finding-4"
    affected_purpose: "Review goal `maintainability`: name-vs-behavior fit of the
      flush API surface and its return-value documentation."
    failure_condition: Readers or callers relying on the conventional meaning of
      flush, the documented single meaning of [], or strict window-bounded
      digest membership.
    impact: Names and docs overpromise relative to behavior, inviting incorrect
      caller assumptions, though the behavior itself is consistent for polling
      use.
    evidence_refs:
      - round1/semantics.md#finding-4
    source_lens_ids:
      - semantics
    action_candidates:
      - follow_up
