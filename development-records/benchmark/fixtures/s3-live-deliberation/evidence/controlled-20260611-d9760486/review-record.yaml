        truthfully populate it (the batcher, at the enqueue site) does not.
        Source finding context: enqueuedAt is documented as the batch-entry
        instant but is never assigned, validated, or read by the batcher; the
        only entry-time fact recorded is windowStartedAt, a different concept.
        Source finding context: Batch-entry semantics were assigned to a
        caller-constructed pre-enqueue value that the caller cannot truthfully
        populate as documented, and the batcher never stamps it at the enqueue
        site."
    - issue_id: issue-003
      candidates: *a9
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "Low severity, non-material per the material-severity candidate
        boundary; unanimous stances; skipped from deliberation as
        non_material_issue. The doc rule's falsity in the windowStartedAt ===
        null state is directly traceable in the code path (observed) and is a
        doc-protocol inconsistency that is behaviorally benign for pure polling
        callers. No relation connects finding-003 to any other finding
        (independent_issue). Narrowing the documentation to cover both
        empty-return states closes it (document_only) and can ride along the
        material doc corrections (planned_follow_up,
        may_close_during_next_stage). Source finding context:
        notification-batcher.ts Source finding context:
        notification-batcher.ts:28, notification-batcher.ts:31 Source finding
        context: The documented interpretation rule 'an empty array means window
        still open' is contradicted by the no-window state: when windowStartedAt
        is null (nothing enqueued, or just flushed), flush returns [] although
        no window exists, so the conditional rule 'empty implies window still
        open' is false in a reachable state. Source finding context: Logic lens
        found the doc-level conditional C5 (empty return implies open window)
        violated by the reachable no-window state at line 31 — a formal
        contract-vs-behavior inconsistency in the return-value protocol, kept
        surface-only per severity (behaviorally benign for pure polling loops).
        Source finding context: Either narrow the doc ('an empty array means
        there is nothing ready to flush — the window is still open or no
        notifications are pending') or split the protocol (e.g. null for
        no-window vs [] for window-open) if callers need to distinguish the
        states. Source finding context: round1/logic.md#finding-l3"
    - issue_id: issue-004
      candidates: *a10
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "Low severity, non-material, latent — no current reader of enqueuedAt
        exists; unanimous stances; skipped as non_material_issue. The
        definitional failure arises only under permitted-but-unexercised caller
        inputs (inferred) and is a contract-field consistency defect. Classified
        symptom because the recorded semantics stance states the deeper
        time-ownership root is carried separately by issue-011, even though no
        graph relation licenses a merge. The pick-one-authority action is a
        decision (make enqueuedAt load-bearing vs remove it) that resolves
        naturally alongside issue-011's authority designation (needs_decision,
        planned_follow_up, may_close_during_next_stage). Source finding context:
        notification-batcher.ts Source finding context:
        notification-batcher.ts:8-9, notification-batcher.ts:20 Source finding
        context: C2 defines enqueuedAt as 'Epoch ms when the notification
        entered the batch', yet enqueue records the same event instant
        independently via Date.now() and never consults enqueuedAt anywhere; the
        definition holds only under the undeclared necessary condition that
        callers pass Date.now() at call time, so the model permits states in
        which the field's definition is false. Source finding context: Logic
        lens found two recordings purporting to denote the first-enqueue instant
        (caller-supplied enqueuedAt vs internally sampled windowStartedAt) with
        no reconciliation rule — a definitional inconsistency in time-source
        semantics; latent rather than active since no behavior currently reads
        the field, kept surface-only per severity. Source finding context: Pick
        one authority for the batch-entry instant: use item.enqueuedAt to start
        the window (making the field load-bearing, aligning with the finding-001
        single-authority fix), or remove the field from the required interface
        if the batcher is the time authority; document the chosen authority on
        the interface. Source finding context: round1/logic.md#finding-l4"
    - issue_id: issue-008
      candidates: *a11
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "Low severity, non-material; unanimous stances; skipped as
        non_material_issue. Both premises — enqueuedAt is read by nothing and
        flush persists nothing — are directly checkable in the target
        (observed). The deficit is scoped to the declared verifiability goal,
        i.e. reconstructability and auditability of delivered batches
        (governance_value). No relation connects finding-008 to any other
        finding (independent_issue). The remedy admits two distinct paths
        (remove the contract field vs give it a consumer and report flush
        metadata), so needs_decision, scheduled as planned_follow_up with
        planned_later obligation under the bounded_partial closure level. Source
        finding context: notification-batcher.ts Source finding context:
        notification-batcher.ts:8-9,35,37-38 Source finding context: enqueuedAt
        is a documented contract field but is never read; digests carry only
        bodies and flush leaves no record of what was delivered when, so past
        batch state cannot be reconstructed and the carry-over comment is
        unverifiable. Source finding context: Coverage lens dimensional-deficit
        check: the temporal axis is declared at input but absent on the
        output/history side — declared temporality with no history/evidence
        counterpart, bearing on the declared verifiability goal; kept
        surface-level per severity. Source finding context: Either remove
        enqueuedAt from the contract or use it (order digest lines by it,
        include timestamps in the digest, or expose flushed-batch metadata); at
        minimum have flush return or report enough metadata (window start, item
        counts) that delivered batches are verifiable. Source finding context:
        round1/coverage.md#finding-4"
    - issue_id: issue-009
      candidates: *a12
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "Low severity, non-material; unanimous stances; skipped as
        non_material_issue. Undetectability is a valid inference from the
        metric's type — for any fixed pendingUserCount there exist states with
        arbitrarily many or arbitrarily old pending items (inferred). The gap is
        missing monitoring dimensions (pending-item count, oldest-pending-age),
        an operability gap rather than a correctness defect (completeness). No
        relation connects finding-009 to any other finding (independent_issue).
        Adding the accessors is concrete backlog work carried beyond this review
        (carry_forward, planned_follow_up, planned_later). Source finding
        context: notification-batcher.ts Source finding context:
        notification-batcher.ts:28,44-47 Source finding context: Monitoring
        covers only the user-count dimension (pendingUserCount); there is no
        pending-item count and no oldest-pending-age metric, so a stalled poll
        loop — the failure mode the poll-driven contract makes possible — is
        undetectable. Source finding context: Coverage lens
        observability-dimension check: concept distribution in the monitoring
        sub-area is skewed toward the one dimension (user breadth) that cannot
        detect the characteristic poll-stall failure mode; kept surface-level
        per severity. Source finding context: Add pendingItemCount() and an
        oldest-age accessor (which would also give enqueuedAt a consumer, see
        finding-008) so operators can alert on aging pending notifications.
        Source finding context: round1/coverage.md#finding-5"
    - issue_id: issue-012
      candidates: *a13
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "Low severity, non-material; unanimous stances; skipped as
        non_material_issue. The name/doc overpromise is directly readable from
        the surface inventory (observed), and the behavior itself is internally
        consistent for polling use, so the impact is name-vs-behavior fit of the
        API surface (maintainability_evolvability). No relation connects
        finding-013 to any other finding (independent_issue). Re-documenting the
        conditional-poll semantics, the two empty-return guard states, and the
        late-item absorption rule closes it without behavior change
        (document_only) and can ride along the related doc corrections
        (planned_follow_up, may_close_during_next_stage). Source finding
        context: notification-batcher.ts Source finding context:
        notification-batcher.ts:26-32 Source finding context: flush
        conventionally means 'force out pending content', but this method is a
        conditional poll that usually returns []; the doc 'an empty array means
        window still open' (line 28) is also inaccurate because [] is equally
        returned when no window exists at all (line 31), and items enqueued
        after the window elapsed but before the poll are absorbed into the
        closing digest, loosening the documented 'when the batch window closes'
        semantics (lines 2-3). Source finding context: Semantics lens surface
        naming/doc finding: the name and docs claim stricter semantics than the
        behavior provides (unconditional flush vs conditional poll; single
        meaning for [] vs two guard states; window-bounded membership vs
        poll-time membership); kept surface-level per severity. Source finding
        context: Rename to poll-style (pollDigests, flushIfWindowClosed) or
        document the conditional behavior; correct the doc to 'an empty array
        means no closed window is ready (no window started, or window still
        open)'; either state that late items ride the closing digest or filter
        membership by window if strict windowing is intended. Source finding
        context: round1/semantics.md#finding-4"
