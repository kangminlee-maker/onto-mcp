issue_resolution_summary:
  - issue_id: issue-001
    problem_definition: Time authority is split across the batcher's two mutating
      entry points — the window anchor is sampled from ambient Date.now() at
      enqueue (line 20) while window closure is computed from the
      caller-injected now at flush (line 30) — with no declared contract binding
      the two clocks, so the window-closed predicate (contract C4) rests on an
      undeclared shared-clock condition and is violated for permitted inputs.
    issue_role: symptom
    judgment_state: inferred
    impact_kind: correctness
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: High-severity material candidate with unanimous support/accepts/keeps
      stances and a no-deliberation-needed resolution. Classified symptom rather
      than root_cause because the closure contradiction is the manifestation of
      the absent inter-clock binding carried as shared cause by issue-005
      (dep-001) and issue-011 (dep-002). The violation is a deductive derivation
      over permitted inputs rather than a directly observed runtime failure
      (inferred); it breaks the declared correctness goal on the core C4 flush
      contract inside the requested time-source-semantics focus
      (current_blocker), and binding both closure operands to one declared clock
      authority is achievable within the single-file target (fix_now,
      must_close_in_target).
    related_surface_finding_ids:
      - finding-001
  - issue_id: issue-002
    problem_definition: "The documented carry-over guarantee has no implementing
      mechanism: no code path snapshots window membership at the close instant,
      so the guaranteed interval is empty under synchronous execution and the
      only materially reachable behavior is emit-all-then-clear, contradicting
      the written contract at lines 37-38."
    issue_role: independent_issue
    judgment_state: inferred
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: Medium-severity material candidate with unanimous stances, resolved
      no-deliberation-needed. The joint unsatisfiability of C7 and C8 is a
      formal derivation (inferred) over a doc-vs-behavior disagreement
      (consistency). The root (no snapshot mechanism) is self-contained —
      rel-004 records duplication with issue-010, not a shared root, and the
      contract licenses merges only via same_root_candidate — so
      independent_issue. Aligning comment and behavior is local to the target
      (fix_now, must_close_in_target); the happy path still functions, so it
      undermines trust in the documented contract rather than blocking current
      execution (next_step_blocker).
    related_surface_finding_ids:
      - finding-002
  - issue_id: issue-003
    problem_definition: The flush return-value protocol overloads [] across two
      distinct reachable states (no window exists vs window still open) while
      the documentation at line 28 asserts a single meaning, making the
      documented rule false in the reachable no-window state (windowStartedAt
      === null).
    issue_role: independent_issue
    judgment_state: observed
    impact_kind: consistency
    timing_class: planned_follow_up
    closure_class: document_only
    closure_obligation: may_close_during_next_stage
    domain_axes: {}
    rationale: Low severity, non-material per the material-severity candidate
      boundary; unanimous stances; skipped from deliberation as
      non_material_issue. The doc rule's falsity in the windowStartedAt === null
      state is directly traceable in the code path (observed) and is a
      doc-protocol inconsistency that is behaviorally benign for pure polling
      callers. No relation connects finding-003 to any other finding
      (independent_issue). Narrowing the documentation to cover both
      empty-return states closes it (document_only) and can ride along the
      material doc corrections (planned_follow_up, may_close_during_next_stage).
    related_surface_finding_ids:
      - finding-003
  - issue_id: issue-004
    problem_definition: Two recordings purport to denote the batch-entry instant —
      the caller-supplied enqueuedAt field (lines 8-9) and the internally
      sampled windowStartedAt (line 20) — with no reconciliation rule or
      designated authority, so the field's documented definition holds only
      under the undeclared convention that callers pass Date.now() at call time
      and is latently false for permitted inputs.
    issue_role: symptom
    judgment_state: inferred
    impact_kind: consistency
    timing_class: planned_follow_up
    closure_class: needs_decision
    closure_obligation: may_close_during_next_stage
    domain_axes: {}
    rationale: Low severity, non-material, latent — no current reader of enqueuedAt
      exists; unanimous stances; skipped as non_material_issue. The definitional
      failure arises only under permitted-but-unexercised caller inputs
      (inferred) and is a contract-field consistency defect. Classified symptom
      because the recorded semantics stance states the deeper time-ownership
      root is carried separately by issue-011, even though no graph relation
      licenses a merge. The pick-one-authority action is a decision (make
      enqueuedAt load-bearing vs remove it) that resolves naturally alongside
      issue-011's authority designation (needs_decision, planned_follow_up,
      may_close_during_next_stage).
    related_surface_finding_ids:
      - finding-004
  - issue_id: issue-005
    problem_definition: The contract contains no clock-authority concept — no clock
      parameter on enqueue and no documented requirement on the source of
      flush's now (absence across lines 18-32) — so window-closure decisions mix
      two undeclared, free-running time authorities that are free to diverge.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: correctness
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: High-severity material candidate, unanimous stances,
      no-deliberation-needed. Classified root_cause because the absent
      clock-authority concept is the shared cause (dep-001, dep-003) on which
      issue-001's closure contradiction rests and which issue-011 reaches from
      the naming side. The absence is directly verifiable across the file
      (observed). A cross-clock subtraction can make the window close never,
      early, or instantly, breaking the declared correctness goal under the
      requested time-source-semantics focus (current_blocker, correctness);
      designating a single time authority for anchoring and closure is in-target
      work (fix_now, must_close_in_target).
    related_surface_finding_ids:
      - finding-005
  - issue_id: issue-006
    problem_definition: "The pending-notification lifecycle has no termination
      segment: the exported surface contains only enqueue, window-gated flush,
      and pendingUserCount, so no unconditional exit path exists for pending
      items and they are silently lost at shutdown, poller failure, or batcher
      decommission."
    issue_role: independent_issue
    judgment_state: inferred
    impact_kind: completeness
    timing_class: next_step_blocker
    closure_class: needs_decision
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: Medium-severity material candidate, unanimous stances,
      no-deliberation-needed. The silent-loss conclusion is a valid inference
      from the exported surface, not a contradiction of any declared claim
      (inferred); the defect is a missing lifecycle termination segment
      (completeness). dep-004 records a shared mid-path cause with issue-007
      (poll-and-window-gated sole reducer) but the roots and mitigations are
      distinct, so independent_issue. Closure requires choosing and adding a
      terminal operation plus a documented caller shutdown obligation — a
      contract-extension decision (needs_decision) that must land before any
      next stage relies on loss-free delivery (next_step_blocker,
      must_close_before_next_stage).
    related_surface_finding_ids:
      - finding-006
  - issue_id: issue-007
    problem_definition: "No capacity, overflow, or backpressure concept exists
      anywhere in the contract or implementation (absence across lines 14-48):
      enqueue appends unconditionally while the sole reducer (flush) is poll-
      and window-gated, so the pending store grows without bound whenever
      polling stalls or slows while enqueues continue."
    issue_role: independent_issue
    judgment_state: inferred
    impact_kind: completeness
    timing_class: next_step_blocker
    closure_class: needs_decision
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: Medium-severity material candidate, unanimous stances,
      no-deliberation-needed. Unbounded growth follows necessarily from
      unconditional append plus the poll-and-window-gated sole reducer
      (inferred); the defect is an absent capacity/overflow/backpressure concept
      (completeness). Distinct root and mitigation from issue-006 despite the
      shared mid-path cause recorded by dep-004, so independent_issue. Closure
      requires selecting a documented capacity bound and an explicit overflow
      policy — reject, drop-oldest, or force-flush — and surfacing overflow to
      the caller (needs_decision, next_step_blocker,
      must_close_before_next_stage).
    related_surface_finding_ids:
      - finding-007
  - issue_id: issue-008
    problem_definition: The temporal axis is declared on the input side (enqueuedAt)
      but has no output or history counterpart — the field is never read,
      digests carry only bodies, and flush destroys state without persisting any
      record — so past batch state cannot be reconstructed and the carry-over
      comment can never be checked against evidence.
    issue_role: independent_issue
    judgment_state: observed
    impact_kind: governance_value
    timing_class: planned_follow_up
    closure_class: needs_decision
    closure_obligation: planned_later
    domain_axes: {}
    rationale: Low severity, non-material; unanimous stances; skipped as
      non_material_issue. Both premises — enqueuedAt is read by nothing and
      flush persists nothing — are directly checkable in the target (observed).
      The deficit is scoped to the declared verifiability goal, i.e.
      reconstructability and auditability of delivered batches
      (governance_value). No relation connects finding-008 to any other finding
      (independent_issue). The remedy admits two distinct paths (remove the
      contract field vs give it a consumer and report flush metadata), so
      needs_decision, scheduled as planned_follow_up with planned_later
      obligation under the bounded_partial closure level.
    related_surface_finding_ids:
      - finding-008
  - issue_id: issue-009
    problem_definition: Monitoring concept distribution is skewed to the one
      dimension — user breadth via pendingUserCount — that is formally invariant
      to pending-item volume and age, so the contract's characteristic
      poll-stall failure mode (items aging indefinitely) is undetectable through
      the provided monitoring surface.
    issue_role: independent_issue
    judgment_state: inferred
    impact_kind: completeness
    timing_class: planned_follow_up
    closure_class: carry_forward
    closure_obligation: planned_later
    domain_axes: {}
    rationale: Low severity, non-material; unanimous stances; skipped as
      non_material_issue. Undetectability is a valid inference from the metric's
      type — for any fixed pendingUserCount there exist states with arbitrarily
      many or arbitrarily old pending items (inferred). The gap is missing
      monitoring dimensions (pending-item count, oldest-pending-age), an
      operability gap rather than a correctness defect (completeness). No
      relation connects finding-009 to any other finding (independent_issue).
      Adding the accessors is concrete backlog work carried beyond this review
      (carry_forward, planned_follow_up, planned_later).
    related_surface_finding_ids:
      - finding-009
  - issue_id: issue-010
    problem_definition: The carry-over comment (lines 37-38) asserts a behavioral
      guarantee over an interleaving window between the close check (line 32)
      and the reset (line 39) that the synchronous execution model makes
      unreachable, while this.pending.clear() would unconditionally discard such
      items if the point ever became reachable — the documented contract is
      false as written and inverts the actual failure mode.
    issue_role: independent_issue
    judgment_state: observed
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: Medium-severity material candidate, unanimous stances,
      no-deliberation-needed. The comment-vs-clear() mismatch is directly
      readable at lines 37-39 (observed) and is a documented-contract
      consistency defect that licenses a false loss-free assumption — a
      regression trap for maintainers and any future async refactor. rel-004
      records it as a duplicate surface of issue-002 without licensing a merge
      (relation is duplicates, not same_root_candidate), so independent_issue.
      Aligning the comment with the mechanism (or vice versa) is local to the
      target (fix_now, must_close_in_target); it endangers maintenance and
      future change rather than current execution (next_step_blocker).
    related_surface_finding_ids:
      - finding-010
  - issue_id: issue-011
    problem_definition: "The batcher owns no time fact: the window anchor, the
      closure input, and the documented batch-entry timestamp are all sourced
      from ambient or caller-chosen clocks that the batcher neither establishes
      nor validates, so neither WINDOW_MS nor enqueuedAt denotes what its name
      and documentation assert — time ownership is undesigned in the class."
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: correctness
    timing_class: next_step_blocker
    closure_class: needs_decision
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: Medium-severity material candidate, unanimous stances,
      no-deliberation-needed, with medium root confidence and an accepted
      built-in refutation condition — clock unification alone leaving
      finding-012 intact would refute the common root (inferred). Classified
      root_cause because rel-006 pairs findings 011 and 012 under the compound
      batcher-owns-no-time-fact root and dep-002/dep-003 record it as shared
      cause with issue-001 and issue-005. Impact lands on the declared
      correctness goal for the named 30-second window semantics. Closure
      requires the single-time-authority designation plus the
      stamp-enqueuedAt-or-redocument choice (needs_decision); that decision is
      instantiated by the in-target fixes of issues 001/005
      (must_close_in_target), while its own residual bite beyond those highs is
      medium (next_step_blocker).
    related_surface_finding_ids:
      - finding-011
      - finding-012
  - issue_id: issue-012
    problem_definition: The flush name and its documentation claim stricter
      semantics than the behavior provides — unconditional force-out vs
      window-gated conditional poll, a single documented meaning for [] vs two
      guard states, and window-bounded digest membership vs poll-time membership
      — inviting incorrect caller assumptions although the behavior is
      internally consistent for polling use.
    issue_role: independent_issue
    judgment_state: observed
    impact_kind: maintainability_evolvability
    timing_class: planned_follow_up
    closure_class: document_only
    closure_obligation: may_close_during_next_stage
    domain_axes: {}
    rationale: Low severity, non-material; unanimous stances; skipped as
      non_material_issue. The name/doc overpromise is directly readable from the
      surface inventory (observed), and the behavior itself is internally
      consistent for polling use, so the impact is name-vs-behavior fit of the
      API surface (maintainability_evolvability). No relation connects
      finding-013 to any other finding (independent_issue). Re-documenting the
      conditional-poll semantics, the two empty-return guard states, and the
      late-item absorption rule closes it without behavior change
      (document_only) and can ride along the related doc corrections
      (planned_follow_up, may_close_during_next_stage).
    related_surface_finding_ids:
      - finding-013
