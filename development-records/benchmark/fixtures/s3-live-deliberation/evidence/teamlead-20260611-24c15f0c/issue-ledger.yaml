issues:
  - issue_id: issue-001
    root_cause_hypothesis: "The flush() reset was implemented as whole-map pending.clear() plus windowStartedAt nulling with no snapshot/swap step that could realize the documented carry-over, so the comment-declared invariant never had a realizing mechanism."
    root_confidence: medium
    surface_finding_ids: [finding-001]
    relation_refs: []
    raised_by_lens_ids: [logic]
    issue_statement: "The documented invariant 'notifications enqueued between the window close check and this reset are carried into the next window' is logically incompatible with the realized reset semantics: pending.clear() unconditionally removes every entry, digests are built from the same live map that is then cleared, and no path snapshots or re-enqueues, so the claim set is unsatisfiable in every execution where the carry-over antecedent holds."
    proposed_action: "Make exactly one claim true: realize the carry-over by swapping the map before building digests (build from the old map so late enqueues land in the fresh map), or correct the comment to state actual behavior (in-between enqueues are impossible in single-threaded synchronous use and would not be carried)."
    affected_purpose: "Contract-vs-behavior consistency of the documented flush() carry-over invariant (correctness, regression_risk review goals)"
    failure_condition: "Any execution model where the carry-over antecedent becomes reachable — reentrancy, a future await insertion between the close check and the reset, shared-state usage — entered by a maintainer trusting the documented guarantee"
    impact: "The doc asserts a necessary outcome the code makes impossible; maintainers trusting the documented carry-over will introduce silent notification loss when the execution model changes, changing trust in the documented contract for the declared review purpose"
    evidence_refs: [round1/logic.md#finding-l1]
    severity: medium
    domain_threshold_used: null
