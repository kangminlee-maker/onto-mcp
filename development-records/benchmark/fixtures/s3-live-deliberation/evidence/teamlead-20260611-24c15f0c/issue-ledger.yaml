    proposed_action: "Designate one time authority: inject a clock in the constructor and derive windowStartedAt, enqueuedAt defaults, and the flush judgment from it, or pass the same source to enqueue as to flush (enqueue(item, now)); declare the single-time-source contract in the doc comment."
