  - finding_id: finding-011
    lens_id: semantics
    source_ref: round1/semantics.md#semantics-2
    target: "notification-batcher.ts flush() reset comment vs reset behavior"
    evidence_anchor: "notification-batcher.ts lines 112-113 (carry-over comment), lines 109-115 (digest build then this.pending.clear())"
    claim: "The reset comment asserts a carry-over mechanism the code does not implement: pending.clear() unconditionally drops every entry, so if the described interleaving could occur those notifications would be silently lost, not carried over; in synchronous single-threaded JS the interleaving cannot occur at all, so the comment also describes a vacuous scenario as if it were a handled case."
    lens_rationale_summary: "Semantics lens asserted this strictly as a documented-contract-vs-actual-behavior mismatch on exactly the axis the request asks about; the review goal includes regression_risk and maintainability for maintainers trusting the documented guarantee."
    proposed_action: "Either correct the comment to state actual behavior (everything pending at flush time is emitted and cleared; no carry-over path exists; flush is synchronous so no interleaving is possible), or implement the stated contract: snapshot the digested entries and delete only those keys/items, leaving later enqueues in pending."
