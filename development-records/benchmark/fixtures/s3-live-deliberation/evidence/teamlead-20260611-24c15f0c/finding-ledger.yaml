  - finding_id: finding-001
    lens_id: logic
    source_ref: round1/logic.md#finding-l1
    target: "notification-batcher.ts flush() reset block"
    evidence_anchor: "notification-batcher.ts:37-38 (claim C5) vs notification-batcher.ts:39-40 (realized reset)"
    claim: "The documented invariant 'notifications enqueued between the window close check and this reset are carried into the next window' is logically incompatible with the realized reset semantics; the claim set {C5, behavior of lines 39-40} is unsatisfiable in every execution where C5's antecedent holds."
    lens_rationale_summary: "Logic lens found the doc contract and realized behavior not co-satisfiable: pending.clear() unconditionally removes every entry and no path snapshots or re-enqueues, so the asserted carry-over is impossible; contradiction is independent of pragmatic interpretation and hits the session's contract-vs-behavior focus."
    proposed_action: "Make exactly one claim true: (a) realize C5 by swapping the map before building digests (build from the old map, late enqueues land in the fresh map), or (b) correct the comment to state actual behavior (in-between enqueues impossible in single-threaded synchronous use; would be included in the current digest or dropped, not carried)."
    affected_purpose: "Contract-vs-behavior consistency of the documented flush() carry-over invariant (correctness, regression_risk review goals)"
    failure_condition: "Any execution model where enqueue can interleave between the close check and the reset (reentrancy, a future await insertion, shared-state usage); in the current synchronous model the claim is dead, documenting a mechanism that does not exist"
    impact: "The doc asserts a necessary outcome the code makes impossible; maintainers trusting the documented carry-over will introduce silent notification loss when the execution model changes"
    evidence_refs: [round1/logic.md#finding-l1]
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: "Contract-vs-behavior consistency of the documented flush() carry-over invariant (correctness, regression_risk review goals)"
      failure_condition: "Any execution model where the C5 antecedent becomes reachable (reentrancy, future await between check and reset); today the claim is a dead claim describing a nonexistent mechanism"
      impact: "False safety claim in the contract: notifications the doc says are carried are in fact included in the current digest or silently dropped, changing trust in the documented contract for the declared review purpose"
      evidence_refs: [round1/logic.md#finding-l1]
    causal_path:
      root_cause_candidate: "Reset-by-global-clear with no snapshot/swap step that could realize the documented carry-over"
      root_cause_step_id: finding-001.cause-003
      steps:
        - cause_id: finding-001.cause-001
          claim: "The doc claims late enqueues are carried into the next window, but flush executes this.pending.clear() unconditionally, removing every entry including any such enqueue"
          relation_to_previous: null
          evidence_refs: [round1/logic.md#finding-l1]
        - cause_id: finding-001.cause-002
          claim: "Digests are built from the same live map that is then cleared, so no mechanism separates the flushed set from a carry set"
          relation_to_previous: causes
          evidence_refs: [round1/logic.md#finding-l1]
        - cause_id: finding-001.cause-003
          claim: "The reset was implemented as whole-map clear() plus window nulling with no snapshot/swap step that could realize the documented carry-over"
          relation_to_previous: causes
          evidence_refs: [round1/logic.md#finding-l1]
      unresolved_beyond_evidence: "Whether callers can actually drive the check-to-reset interleaving (concurrency/usage model of the poll loop) is pragmatics scope outside this lens boundary; the formal claim-vs-mechanism contradiction is independent of that question."
