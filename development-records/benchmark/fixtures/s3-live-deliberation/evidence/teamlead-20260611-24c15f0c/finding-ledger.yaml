    evidence_anchor: "notification-batcher.ts line 95 (this.windowStartedAt = Date.now()), lines 105-107 (flush(now: number), now - this.windowStartedAt < WINDOW_MS)"
    claim: "Split time authority: the window-close predicate compares values from two different time authorities — windowStartedAt is always stamped from the system clock while now is caller-supplied — and the parameter name and externalized signature assert caller-owned current-time authority while the behavior only holds under an unstated same-epoch-ms-system-clock constraint."
    lens_rationale_summary: "Semantics lens found the visible signature contract ('the caller owns the current-time authority') diverging from actual meaning, which silently changes the close predicate's meaning for any caller exercising the injectable-clock contract literally; the session request explicitly targets time-source semantics and the review goal includes correctness."
    proposed_action: "Unify the time authority: (a) drop the now parameter and use Date.now() in flush as well, or (b) accept the clock externally everywhere (enqueue(item, now) or constructor-injected clock) and stamp windowStartedAt from that same source; document the single clock domain on the class contract."
    affected_purpose: "Correctness of the declared contract 'Flushes when the window has closed' under the session's time-source semantics focus"
    failure_condition: "Any caller that exercises the injectable-clock contract literally (logical clock, simulated time, frozen test clock)"
    impact: "With now far below real epoch ms the window never closes and notifications are never delivered; with now above real time the window closes immediately — the declared contract is violated without any error surfacing to the caller"
    evidence_refs: [round1/semantics.md#semantics-1]
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: "Correctness of the declared flush contract under the session's time-source semantics focus"
      failure_condition: "A supported caller group honoring the visible signature contract with a non-system clock (logical, simulated, frozen test clock)"
      impact: "Never-flush or always-flush behavior with no surfaced error means that caller group cannot achieve the declared batching purpose"
      evidence_refs: [round1/semantics.md#semantics-1]
