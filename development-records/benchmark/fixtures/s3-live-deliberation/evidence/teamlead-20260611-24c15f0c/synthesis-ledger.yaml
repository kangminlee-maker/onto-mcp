      C5's antecedent holds. Source finding context: Logic lens found the doc
      contract and realized behavior not co-satisfiable: pending.clear()
      unconditionally removes every entry and no path snapshots or re-enqueues,
      so the asserted carry-over is impossible; contradiction is independent of
      pragmatic interpretation and hits the session's contract-vs-behavior
