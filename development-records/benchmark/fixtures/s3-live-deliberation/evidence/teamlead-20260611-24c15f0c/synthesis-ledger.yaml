  issue: issue-003 (high) — The window-close predicate now - windowStartedAt <
  WINDOW_MS in notification-batcher.ts mixes two different time origins —
  windowStartedAt stamped from the internal Date.now() wall clock versus
  caller-supplied now, with enqueuedAt as a third unbound origin — and no
  concept expressed in the system designates which time source is the authority.
  Deliberation resolved the issue with severity HIGH confirmed and logic's
  severity abstention discharged from in-session evidence; the required closure
  is to designate exactly one time authority and declare the single-time-source
  contract in the doc comment. Controlled deliberation did not leave a blocking
