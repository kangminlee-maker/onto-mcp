conclusion: "flush() in notification-batcher.ts destroys all pending state — pending.clear() and windowStartedAt = null — before the caller can confirm delivery of the returned digests, making the component structurally at-most-once without declaring it: any delivery failure after flush returns loses the whole window's notifications with no recovery path. Coverage raised it alone, semantics supports the declare-the-contract arm, logic is not_applicable by boundary routing; severity medium is kept, the issue is material, and deliberation status is no-deliberation-needed."
materiality_explanation: "The affected purpose is reliability of notification delivery semantics within the declared correctness and regression_risk goals. The failure condition is any delivery failure after flush returns — a process crash or send API error while the caller delivers the returned digests — because state destruction precedes delivery confirmation. When that fires, whole-window notification loss is unrecoverable and the at-most-once property is undeclared, meaningfully weakening trust and decision quality for the declared purpose; coverage judged the undeclared at-most-once substantive for the regression_risk goal and kept severity medium."
root_cause_explanation: "The accepted root (finding-006.cause-003, medium confidence) is that the notification lifecycle was designed one-way, ending at flushed, with state destruction ahead of delivery confirmation and no post-flushed lifecycle concept — ack, commit, reinjection, or dead-letter — anywhere in the component. It is the starting point because the destructive lines are only the visible expression of that absent lifecycle segment: with no post-flushed concept ever present in the design, there is no place where delivery confirmation or failure recovery could attach, so destruction-before-return follows necessarily rather than being an isolated coding slip."
causal_path_explanation: "The coverage causal path (finding-006, evidence round1/coverage.md#cov-3) runs from the root outward: because the lifecycle was designed one-way with the post-flushed segment concept absent from the start, no ack, reinjection, or dead-letter concept exists to recover when the caller's delivery fails after return; and with no such concept, flush simply destroys state — pending.clear() and windowStartedAt = null — before returning digests to the caller, which is exactly the observed structurally-at-most-once-without-declaration behavior. Delivery itself lies outside the bounded_partial closure, but the destruction-before-return structure closes on in-target evidence; what remains beyond evidence is only whether at-most-once is the intended product semantics, which is a design decision."
action_explanation: "The proposed action keeps both arms offered by the raising lens: introduce a two-phase interface (peek/commit separating digest production from state removal) or a failure-reinjection API to represent lifecycle completion; or, if at-most-once is the intended semantics, declare that contract explicitly in the doc comment — semantics' narrow stance supports this declare-the-contract arm as a documented-meaning gap and defers the lifecycle-design arm to the raising lens. Problem framing classifies this needs_decision with closure obligation must_close_before_next_stage and timing next_step_blocker: the loss path is reachable in current operation but does not block the declared happy path, and the product-semantics decision must be settled before consumers depend on delivery guarantees. Action candidates are fix_before_release or accept_risk. Ordering matters via dep-002 (rel-005): issue-001 shares the destructive in-place reset — pending.clear() plus windowStartedAt = null with no snapshot/swap step and no commit/ack boundary — as a shared_cause_candidate, so decoupling digest construction from wholesale state destruction addresses both issues without making them the same root."
