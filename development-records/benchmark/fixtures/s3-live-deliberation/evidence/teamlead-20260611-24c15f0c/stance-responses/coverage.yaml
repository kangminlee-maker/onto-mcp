    rationale: "메서드 이름과 계약 텍스트의 어휘 정합은 semantics 렌즈의 의미 일치 단언 유형이다. 누락된 도메인 하위 영역이나 차원 결손이 관여하지 않으므로 coverage 관점은 이 issue에 적용되지 않는다. 판정을 제기 렌즈에 위임한다."
    root_hypothesis_position: not_applicable
    severity_position: not_applicable
    evidence_refs: [issue-ledger.yaml#issue-011]
  - issue_id: issue-012
    stance: support
    rationale: "semantics 제기 issue이나 root hypothesis 자체가 부재 진술이다: no-window 상태를 위한 구별 신호 개념이 설계되지 않아 []가 두 상태의 동음이의가 되었다. 상태 신호 개념의 부재는 coverage 단언 유형에 부합하며, 근거 코드(windowStartedAt === null 가드)는 round1에서 검토한 대상 내부 증거로 확인된다. surface-only 성격과 low 유지에 동의한다."
