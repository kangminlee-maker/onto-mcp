        - materialized-input.md:31-34
        - materialized-input.md:48-56
        - materialized-input.md:92-93
        - review-value-alignment-criteria.yaml:criteria[user-request-intent]
    causal_path:
      root_cause_candidate: 공유 권위 문서 안에서 파생 보고 등급과 원천 엔진 등급의 권위 경계를 닫지 않고 수동 조정을 허용한다.
      root_cause_step_id: finding-001.cause-004
      steps:
