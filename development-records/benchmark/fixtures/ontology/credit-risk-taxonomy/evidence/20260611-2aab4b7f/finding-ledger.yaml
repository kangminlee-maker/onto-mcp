    evidence_anchor: credit-risk-ontology.yaml:14, credit-risk-ontology.yaml:25,
      credit-risk-ontology.yaml:28, credit-risk-ontology.yaml:39
    claim: Closed inline enums make classification expansion a schema change instead
      of a versioned taxonomy update.
    lens_rationale_summary: For a taxonomy expected to be shared by operational risk
      and reporting systems, new products, collateral classes, segments, or
      grades are ordinary evolution events. Encoding them only as inline enum
      values means each new category modifies the ontology schema and likely
      requires consumer parser/report updates, instead of allowing a controlled
      dictionary/taxonomy update with compatibility metadata.
    proposed_action: Promote each externally visible enum into a governed
      classification vocabulary with stable codes, labels, status, effective
      dates, aliases, and parent/category grouping. Keep current enum values as
      initial dictionary rows or controlled-code instances, and define how
      unknown, pending, deprecated, and retired codes are handled.
