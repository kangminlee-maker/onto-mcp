  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260611-2aab4b7f/round1/axiology.findings.yaml#axiology-candidate-003
    target: credit-risk-ontology.yaml ExposureAggregate / Limit 소진율 시간 기준
    evidence_anchor: materialized-input.md:69-76,78-83,92-95;
      review-value-alignment-criteria.yaml:criteria[user-request-intent]
    claim: 월말 배치 집계와 당일 환율 사용이 시간성 기준 없이 결합되어 리스크 한도 판단 목적을 약화한다.
    lens_rationale_summary: 요청은 시간성 관점의 개념 결함과 운영 위험을 요구한다. 한도 소진율과 리스크 성향 위반은 운영상
      현재성에 민감한 판단인데, 월말 기준 익스포저와 당일 환율, 각 시스템 환율 권위가 섞이면 보고 시점과 엔진 판단 시점이 달라질 수
      있다. 이는 공유 개념 기준이 시간 기준을 통제한다는 목적에 맞지 않는다.
    proposed_action: 집계값과 비율 계산에 동일한 `as_of`/`effective_at` 기준을 강제하고, 일중 미반영 상태를
      `stale`, `provisional`, `final` 같은 상태로 명시한다. 환율은 단일 권위 또는 명시적
      `fx_rate_source`와 적용 시각을 둬서 Limit 소진율과 RiskAppetite 준수 판단의 시간 기준을 닫는다.
    affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 시간 일관적 리스크/한도 판단 기준 제공.
    failure_condition: 월말 배치 집계값, 일중 신규 여신 미반영, 각 시스템 당일 환율을 함께 사용해 한도 소진율이나
      RiskAppetite 준수 상태를 계산할 때.
    impact: 동일 차주라도 계산 시점과 시스템별 환율 소스에 따라 한도 위반 또는 준수 상태가 달라져 운영 보고와 엔진 판단의 신뢰가 약화된다.
    evidence_refs:
      - .onto/review/20260611-2aab4b7f/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:69-76
      - materialized-input.md:78-83
      - materialized-input.md:92-95
      - review-value-alignment-criteria.yaml:criteria[user-request-intent]
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 시간 일관적 리스크/한도 판단 기준 제공.
      failure_condition: 월말 배치 집계값, 일중 신규 여신 미반영, 각 시스템 당일 환율을 함께 사용해 한도 소진율이나
        RiskAppetite 준수 상태를 계산할 때.
      impact: 동일 차주라도 계산 시점과 시스템별 환율 소스에 따라 한도 위반 또는 준수 상태가 달라져 운영 보고와 엔진 판단의 신뢰가 약화된다.
      evidence_refs:
        - materialized-input.md:69-76
        - materialized-input.md:78-83
        - materialized-input.md:92-95
        - review-value-alignment-criteria.yaml:criteria[user-request-intent]
    causal_path:
      root_cause_candidate: 시간 민감 리스크 판단에 필요한 공통 기준시각과 환율 권위를 온톨로지 내부에서 닫지 않는다.
      root_cause_step_id: finding-003.cause-004
      steps:
        - cause_id: finding-003.cause-001
          claim: "`ExposureAggregate.total_amount`는 월말 배치로 계산되어 일중 신규 여신은 다음 배치까지 미반영된다."
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-76
        - cause_id: finding-003.cause-002
          claim: "`RiskAppetite` 위반 여부는 `ExposureAggregate`가 `RiskAppetite`를 초과하는지로 정의된다."
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:78-83
        - cause_id: finding-003.cause-003
          claim: "`Limit` 소진율은 `ExposureAggregate.total_amount / Limit.approved_amount`이며
            통화가 다르면 각 시스템의 당일 환율 테이블을 사용한다."
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:92-95
        - cause_id: finding-003.cause-004
          claim: 월말 집계, 일중 미반영, 당일 환율, 시스템별 환율 권위가 한 계산 계약 안에 섞여 시간성 기준의 목적 정렬을 약화한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:69-76
            - materialized-input.md:92-95
            - review-value-alignment-criteria.yaml:criteria[user-request-intent]
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260611-2aab4b7f/round1/coverage.findings.yaml#coverage-candidate-001
    target: credit-risk-ontology.yaml rating and risk grade concepts
    evidence_anchor: .onto/review/20260611-2aab4b7f/execution-preparation/materialized-input.md:20-22,31-37,48-57,92-93
    claim: 등급 개념에 유효기간·산출시점·이력 개념이 없어 과거 시점의 등급을 재구성할 수 없다.
    lens_rationale_summary: 이 온톨로지는 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향한다고 선언한다. 등급은
      리스크 엔진 산출과 보고 사용의 핵심 분류값인데 시점 의존성이 모델에 없으면 월말 보고, 사후 검증, 재산출 시 동일 차주·익스포저의
      과거 등급을 권위 있게 복원할 수 없다. ExposureAggregate에는 as_of가 있고 Collateral에는
      appraised_at가 있어 일부 값에는 시점 개념이 있지만, 핵심 등급 축에는 동일한 시간성 차원이 빠져 있다.
    proposed_action: "등급을 단순 속성에서 이력 엔티티나 스냅샷 개념으로 분리한다. 예: RatingAssignment 또는
      RiskGradeSnapshot에 borrower_ref/exposure_ref, source_rating_ref, grade,
      score, effective_from, effective_to, calculated_at, supersedes_ref,
      source_system을 두고 Borrower/Exposure는 현재 등급을 파생 뷰로만 노출한다."
    affected_purpose: 리스크 엔진과 보고서 시스템이 공유하는 여신 리스크 분류 기준 및 보고 재현성
    failure_condition: 동일 차주나 익스포저의 등급이 변경되거나 보고서 팀이 수동 조정한 뒤 과거 기준일의 등급·점수를 재구성해야 하는 경우
    impact: 공유 권위 문서가 현재값만 제공하므로 엔진 산출값과 보고값의 시점별 차이를 설명하거나 재현할 수 없어 보고 신뢰와 사후 감사
      가능성이 약해진다.
    evidence_refs:
      - .onto/review/20260611-2aab4b7f/round1/coverage.findings.yaml#coverage-candidate-001
      - materialized-input.md:7-8
      - materialized-input.md:20-22
      - materialized-input.md:31-37
      - materialized-input.md:48-57
      - materialized-input.md:92-93
    severity: high
    domain_threshold_used: null
    materiality_basis:
