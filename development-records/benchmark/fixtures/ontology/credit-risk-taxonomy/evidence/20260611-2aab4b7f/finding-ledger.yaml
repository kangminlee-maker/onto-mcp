      classification across risk engine and reporting.
    failure_condition: When a new segment, product type, collateral type, or risk
      grade is introduced, the only visible extension path is editing fixed enum
      lists in the target.
    impact: Routine taxonomy growth becomes a schema/version coordination event,
      increasing the chance of integration lag or incompatible interpretations
      across systems.
