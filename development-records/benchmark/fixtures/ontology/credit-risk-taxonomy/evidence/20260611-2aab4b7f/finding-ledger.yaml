          claim: "`RiskRating.grade`는 리스크 엔진이 산출하는 차주 신용등급이고 `Exposure.risk_grade`는 보고서 팀이
            사용하는 익스포저 단위 리스크 등급이다."
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:31-34
            - materialized-input.md:48-56
        - cause_id: finding-001.cause-003
          claim: 분류 규칙은 `Exposure.risk_grade`를 `RiskRating.grade`에서 도출하되 보고서 팀이 수동 조정할 수
            있다고 한다.
          relation_to_previous: enables
