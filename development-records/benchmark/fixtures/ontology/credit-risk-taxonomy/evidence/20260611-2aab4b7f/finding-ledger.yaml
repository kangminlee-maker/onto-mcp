findings:
  - finding_id: finding-001
    lens_id: axiology
    source_ref: .onto/review/20260611-2aab4b7f/round1/axiology.findings.yaml#axiology-candidate-001
    target: credit-risk-ontology.yaml classification_rules / Exposure.risk_grade
      authority
    evidence_anchor: materialized-input.md:6-8,31-34,48-56,92-93;
      review-value-alignment-criteria.yaml:criteria[user-request-intent]
    claim: 보고서 팀의 수동 등급 조정 권한이 공유 개념 권위 목적을 훼손한다.
    lens_rationale_summary: 요청의 가치 기준은 리스크 엔진과 보고 시스템이 공유할 개념 기준의 적절성, 특히 권위 관점의 운영
      위험 검토다. 그런데 엔진 산출 등급과 보고 등급 사이에 별도 권위 경계 없이 보고서 팀 조정이 허용되면 동일 익스포저의 공식 리스크
      등급이 소비자별로 달라질 수 있다. 이는 보고 편의라는 국소 최적화가 공유 기준이라는 선언 목적을 약화시키는 목적 drift다.
    proposed_action: "`RiskRating.grade`를 원천 등급으로 두고 `Exposure.risk_grade`가 파생/보고용
      등급인지 별도 개념으로 명시한다. 수동 조정은 `override_grade`, `override_reason`,
      `override_authority`, `effective_at`, `source_grade`처럼 권위와 이력을 보존하는 필드 또는
      규칙으로 닫아야 한다."
    affected_purpose: 리스크 엔진과 보고서 시스템이 공유할 개념 권위 기준 제공.
    failure_condition: 보고서 팀이 시장 상황을 이유로 `Exposure.risk_grade`를 수동 조정하지만 조정 권위, 원천
      등급과의 우선순위, 이력 기준이 온톨로지 내부에 없을 때.
    impact: 공유 기준 문서가 소비 시스템별 등급 차이를 정당화하는 문서가 되어 엔진 결과와 보고 결과의 대사, 감사, 리스크 의사결정 신뢰가
      약해진다.
    evidence_refs:
      - .onto/review/20260611-2aab4b7f/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:6-8
      - materialized-input.md:31-34
      - materialized-input.md:48-56
      - materialized-input.md:92-93
      - review-value-alignment-criteria.yaml:criteria[user-request-intent]
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고서 시스템이 공유할 개념 권위 기준 제공.
      failure_condition: 보고서 팀이 시장 상황을 이유로 `Exposure.risk_grade`를 수동 조정하지만 조정 권위, 원천
