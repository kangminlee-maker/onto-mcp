  - finding_id: finding-008
    lens_id: evolution
    source_ref: .onto/review/20260611-2aab4b7f/round1/evolution.findings.yaml#evolution-candidate-001
    target: credit-risk-ontology.yaml rating scale model and classification rules
    evidence_anchor: credit-risk-ontology.yaml:15-17,
      credit-risk-ontology.yaml:26-29, credit-risk-ontology.yaml:48-51,
      credit-risk-ontology.yaml:87-93
    claim: Rating-scale evolution is delegated to external consumers instead of
      being versioned in the shared ontology.
    lens_rationale_summary: Because the ontology is intended as the shared concept
      authority for a risk engine and reporting system, grade-scale changes need
      a stable canonical place for mappings, versions, effective dates, and
      override provenance. With mappings outside the target and
      consumer-specific transforms, adding a new grade, changing a cutoff, or
      preserving historical mapping semantics requires coordinated changes in
      each consumer and can break continuity between historical engine results
      and reports.
    proposed_action: Add an explicit canonical rating-scale/mapping model in the
      ontology, such as `RatingScale`, `RatingGrade`, and `GradeMapping` with
      source scale, target scale, valid_from/valid_to or version, derivation
      rule, and manual_override provenance. Make consumers reference that
      authority rather than maintaining independent transforms.
    affected_purpose: The ontology's declared purpose as a shared concept authority
      for the risk engine and reporting system.
    failure_condition: When a grade scale, mapping, or manual-adjustment rule
      changes, the target does not provide an authoritative versioned mapping
      path for existing and future records.
    impact: Historical and current grade interpretation can diverge across
      consumers, weakening the ontology's ability to support stable
      engine-report continuity under change.
    evidence_refs:
      - .onto/review/20260611-2aab4b7f/round1/evolution.findings.yaml#evolution-candidate-001
      - credit-risk-ontology.yaml:2-3
      - credit-risk-ontology.yaml:15-17
      - credit-risk-ontology.yaml:26-29
      - credit-risk-ontology.yaml:48-51
      - credit-risk-ontology.yaml:87-93
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: The ontology's declared purpose as a shared concept authority
        for the risk engine and reporting system.
      failure_condition: When a grade scale, mapping, or manual-adjustment rule
        changes, the target does not provide an authoritative versioned mapping
        path for existing and future records.
      impact: Historical and current grade interpretation can diverge across
        consumers, weakening the ontology's ability to support stable
        engine-report continuity under change.
      evidence_refs:
        - credit-risk-ontology.yaml:2-3
        - credit-risk-ontology.yaml:15-17
        - credit-risk-ontology.yaml:26-29
        - credit-risk-ontology.yaml:48-51
        - credit-risk-ontology.yaml:87-93
    causal_path:
      root_cause_candidate: The ontology models grade scales as separate local
        attributes and places cross-scale mapping authority outside the
        ontology.
      root_cause_step_id: finding-008.cause-004
      steps:
        - cause_id: finding-008.cause-001
          claim: The target contains three grade scales with different representations and
            no internal mapping entity.
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml:15-17
            - credit-risk-ontology.yaml:26-29
            - credit-risk-ontology.yaml:48-51
        - cause_id: finding-008.cause-002
          claim: The derivation and override rule depends on cross-scale conversion, but
            does not define versioned mapping semantics in the target.
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml:87-88
        - cause_id: finding-008.cause-003
          claim: The note assigns transformation responsibility to each consuming system
            and references an external wiki for mapping.
