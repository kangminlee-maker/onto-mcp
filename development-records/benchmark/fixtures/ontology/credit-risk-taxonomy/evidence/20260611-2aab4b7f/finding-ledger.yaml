  - finding_id: finding-010
    lens_id: evolution
    source_ref: .onto/review/20260611-2aab4b7f/round1/evolution.findings.yaml#evolution-candidate-003
    target: credit-risk-ontology.yaml Limit utilization currency-conversion rule
    evidence_anchor: credit-risk-ontology.yaml:59-62, credit-risk-ontology.yaml:87-89
    claim: Currency conversion is left to each system's daily FX table, so FX-source
      changes can break cross-system continuity.
    lens_rationale_summary: When risk and reporting systems share a utilization
      concept, a change in FX vendor, rate cut-off time, holiday handling, or
      table contents should preserve reproducibility of prior calculations.
      Leaving conversion to each system's own table makes future FX-source
      changes and cross-domain integrations produce different utilization values
      for the same exposure and limit data.
    proposed_action: Introduce an explicit `FxRate` or `CurrencyConversion` concept
      with source, rate_date/time, base/quote currency, rate version, and
      calculation provenance. Define `Limit` utilization as depending on that
      canonical conversion input, including historical replay behavior for
      previously reported periods.
    affected_purpose: The shared utilization rule used by risk and reporting consumers.
    failure_condition: When currencies differ or FX tables/rules change, the target
      provides no shared conversion authority or historical replay contract.
    impact: The same limit utilization concept can produce non-reconciled values
      across systems and lose continuity after FX-table changes.
    evidence_refs:
      - .onto/review/20260611-2aab4b7f/round1/evolution.findings.yaml#evolution-candidate-003
      - credit-risk-ontology.yaml:59-62
      - credit-risk-ontology.yaml:87-89
