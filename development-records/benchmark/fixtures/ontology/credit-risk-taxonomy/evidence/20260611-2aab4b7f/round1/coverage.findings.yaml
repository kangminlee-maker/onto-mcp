  - candidate_id: coverage-candidate-002
    target: credit-risk-ontology.yaml authority coverage for rating scales, limits,
      and FX conversion
    evidence_anchor: .onto/review/20260611-2aab4b7f/execution-preparation/materialized-input.md:56,64-66,92-98
    claim: 병행 관리되는 등급·한도·환율 값에 단일 권위 개념이 없어 소비 시스템별 해석 차이를 온톨로지 안에서 닫지 못한다.
    what: 세 등급 스케일은 병존하며 변환을 각 소비 시스템이 수행한다고 되어 있고, RiskRating.grade와
      Borrower.internal_rating의 매핑은 외부 위키를 참조한다. Limit.approved_amount는 승인 시스템이
      기록하지만 CRM의 available_limit과 합산 관리된다고 되어 있으며, 통화 환산은 각 시스템의 당일 환율 테이블을
      사용한다고 되어 있다. 그러나 RatingScaleMapping, FxRateSource, LimitAuthority 같은 단일 원본
      또는 우선순위 개념이 없다.
    why: 리스크 엔진과 보고 시스템이 공유할 개념 기준이라면 병행 스케일과 병행 장부는 어느 값이 권위인지, 충돌 시 어느 값을 우선하는지,
      변환 기준을 누가 소유하는지를 모델 안에서 닫아야 한다. 현재는 핵심 변환과 환산을 각 소비 시스템에 맡기므로 같은 입력에 대해
      엔진과 보고서가 다른 등급, 한도 소진율, 통화 환산 결과를 만들 수 있다.
    how_to_fix: "공유 권위 개념을 추가한다. 예: RatingScale, RatingMappingVersion,
      CanonicalRiskGrade, FxRateTableSource, LimitBook,
      LimitAvailabilityAuthority를 정의하고 각 값에 source_system, authority_rank,
      effective_date/version, conflict_resolution_rule을 부여한다. 외부 위키와 각 시스템 테이블은
      참조 위치가 아니라 권위가 관리되는 개념으로 편입한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 및 분류·환산 기준
      failure_condition: 등급 변환, 한도 소진율 산출, 통화 환산을 둘 이상의 소비 시스템이 독립 수행하거나 장부 값이 충돌하는 경우
      impact: 온톨로지가 공유 기준이 아니라 시스템별 해석의 느슨한 목록이 되어, 같은 차주·익스포저에 대해 보고값과 엔진값이 달라질 운영
        위험이 생긴다.
      evidence_refs:
        - materialized-input.md:7-8
        - materialized-input.md:56
        - materialized-input.md:64-66
        - materialized-input.md:92-98
    causal_path:
      root_cause_candidate: 병행 관리 값을 인정하면서도 단일 원본, 변환 버전, 충돌 우선순위를 나타내는 권위 개념을 모델링하지 않았다.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: 등급 변환은 외부 위키 또는 각 소비 시스템에 맡겨져 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:56
            - materialized-input.md:97-98
        - cause_id: coverage-candidate-002.cause-002
          claim: 한도와 환율도 승인 시스템, CRM, 각 시스템 환율 테이블처럼 복수 원천에 의존한다고 서술되어 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:64-66
            - materialized-input.md:94
        - cause_id: coverage-candidate-002.cause-003
          claim: 공유 권위 문서를 지향하는 대상에서 복수 원천의 우선순위와 버전이 비어 있으면 엔진과 보고 시스템이 서로 다른 기준을 적용할 수
            있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:7-8
            - materialized-input.md:92-98
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: credit-risk-ontology.yaml manual adjustment and review input controls
    evidence_anchor: .onto/review/20260611-2aab4b7f/execution-preparation/materialized-input.md:35-37,92-93
    claim: 수동 입력·수동 조정 행위에 행위자·시각·근거·승인 증거 개념이 없다.
    what: Exposure.ltv는 심사 시점에 심사역이 입력한다고 되어 있고, Exposure.risk_grade는 보고서 팀이 시장 상황에
      따라 수동 조정할 수 있다고 되어 있다. 그러나 ManualAdjustment, Approval, Evidence,
      AdjustmentReason 같은 통제 행위의 감사 추적 개념이 정의되어 있지 않다.
    why: 수동 입력과 수동 등급 조정은 리스크 분류 결과를 바꿀 수 있는 통제 지점이다. 행위자, 시각, 근거, 승인 상태가 없으면 같은
      risk_grade나 ltv 값이 엔진 산출인지, 보고 조정인지, 누가 어떤 근거로 바꾼 것인지 구분할 수 없어 운영 통제와 사후
      설명 가능성이 부족하다.
    how_to_fix: ManualRiskGradeAdjustment와 LtvInputEvidence 같은 감사 엔티티를 추가한다. 최소 필드는
      target_ref, previous_value, new_value, actor_id, acted_at, reason_code,
      evidence_ref, approval_status, approver_id, approved_at, source_system으로
      두고 Exposure.risk_grade/ltv는 해당 이벤트에서 파생되도록 연결한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 분류값의 운영 통제, 보고 조정 설명 가능성, 감사 추적성
      failure_condition: 보고서 팀의 risk_grade 조정 또는 심사역의 ltv 입력이 분류·소진율·담보위험 판단에 영향을 준 뒤
        근거를 확인해야 하는 경우
      impact: 값은 남지만 통제 행위의 원인과 책임이 남지 않아 수동 개입을 검증하거나 오류 조정을 역추적하기 어렵다.
      evidence_refs:
        - materialized-input.md:35-37
        - materialized-input.md:92-93
    causal_path:
      root_cause_candidate: 수동 행위를 값 변경 이벤트가 아니라 값 속성의 주석으로만 표현했다.
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: ltv는 심사역이 입력하는 수동 값이고 risk_grade는 보고서 팀이 수동 조정할 수 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:35-37
            - materialized-input.md:92-93
        - cause_id: coverage-candidate-003.cause-002
          claim: 엔티티 목록에는 수동 입력·조정의 행위자, 시각, 근거, 승인 상태를 담는 감사 증거 개념이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:13-83
        - cause_id: coverage-candidate-003.cause-003
          claim: 수동 행위가 리스크 분류값을 바꿀 수 있는데 감사 증거가 없으면 분류 결과의 책임성과 재검증 가능성이 약해진다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:31-37
            - materialized-input.md:92-93
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: credit-risk-ontology.yaml default/delinquency scope boundary
    evidence_anchor: .onto/review/20260611-2aab4b7f/execution-preparation/materialized-input.md:6-8,97-99
    claim: 연체·부실 상태가 범위 밖으로만 선언되어 공유 분류 기준 안에서 연결할 경계 개념이 없다.
    what: 온톨로지는 여신 리스크 관리의 개념 모델이자 리스크 엔진과 보고서 시스템이 공유하는 문서라고 선언하지만, 연체/부실(default)
      상태는 별도 시스템에서 다루므로 범위 밖이라고만 적는다. DefaultStatus, DelinquencyStatus,
      external_default_ref, status_as_of 같은 최소 연결 개념이 없어 이 온톨로지의 익스포저·등급·보고 분류와
      부실 상태를 결합할 수 없다.
    why: coverage 관점에서 의도적으로 외부 시스템에 둔 하위 영역도 공유 분류 기준에 영향을 주면 경계 개념이 필요하다. 현재 모델은
      연체관리 시스템의 존재만 알리고 해당 상태를 어떻게 참조, 기준일 정렬, 보고 분류에 반영하는지 닫지 않으므로 정상/연체/부실 상태를
      포함한 리스크 보고 분류가 이 파일만으로는 성립하지 않는다.
    how_to_fix: "연체관리 시스템을 완전히 흡수하지 않더라도 경계 엔티티를 둔다. 예: CreditStatusReference 또는
      DefaultStatusSnapshot에 borrower_ref/exposure_ref, status, source_system,
      external_status_id, as_of/effective_from, effective_to를 두고 RiskRating 또는
      Exposure와의 사용 규칙을 명시한다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 여신 리스크 분류 온톨로지의 도메인 포괄성과 리스크 엔진·보고 시스템 공유 기준
      failure_condition: 리스크 보고 또는 엔진 입력이 익스포저 등급과 연체/부실 상태를 함께 사용해야 하는 경우
      impact: 부실 상태가 외부에 있다는 사실만 있고 연결 개념이 없어, 공유 온톨로지가 주요 상태 축을 기준일에 맞춰 결합하는 방법을 제공하지
        못한다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:97-99
    causal_path:
      root_cause_candidate: 범위 밖 도메인에 대한 최소 참조/경계 개념 없이 단순 제외 메모만 두었다.
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: 대상은 여신 리스크 관리 개념 모델과 리스크 엔진·보고서 시스템의 공유 권위 문서를 지향한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:6-8
        - cause_id: coverage-candidate-004.cause-002
          claim: 연체/부실 상태는 별도 시스템에서 다룬다는 이유로 온톨로지 범위 밖이라고 선언되어 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:97-99
        - cause_id: coverage-candidate-004.cause-003
          claim: 외부 상태를 참조하는 경계 개념이 없으면 공유 분류 기준에서 부실 상태를 익스포저·등급·보고 기준일과 결합할 수 없다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:13-99
      unresolved_beyond_evidence: 연체관리 시스템 자체의 상세 모델은 boundary 밖이므로 검토하지 않았고, 이
        finding은 현재 온톨로지 안의 경계 개념 부재에 한정한다.
