  - candidate_id: coverage-candidate-001
    target: credit-risk-ontology.yaml rating and risk grade concepts
    evidence_anchor: .onto/review/20260611-2aab4b7f/execution-preparation/materialized-input.md:20-22,31-37,48-57,92-93
    claim: 등급 개념에 유효기간·산출시점·이력 개념이 없어 과거 시점의 등급을 재구성할 수 없다.
    what: Borrower.internal_rating, Exposure.risk_grade, RiskRating.grade/score가 현재값
      형태로만 정의되어 있고, 등급 산출·적용·만료 시점이나 이전 등급과의 이력 연결이 없다. 특히 Exposure.risk_grade는
      RiskRating.grade에서 도출된 뒤 보고서 팀이 수동 조정할 수 있다고 되어 있어 등급 값이 시간과 행위에 따라 달라질 수
      있는데도 이를 보존할 개념이 없다.
    why: 이 온톨로지는 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향한다고 선언한다. 등급은 리스크 엔진 산출과 보고 사용의
      핵심 분류값인데 시점 의존성이 모델에 없으면 월말 보고, 사후 검증, 재산출 시 동일 차주·익스포저의 과거 등급을 권위 있게 복원할
      수 없다. ExposureAggregate에는 as_of가 있고 Collateral에는 appraised_at가 있어 일부 값에는
      시점 개념이 있지만, 핵심 등급 축에는 동일한 시간성 차원이 빠져 있다.
    how_to_fix: "등급을 단순 속성에서 이력 엔티티나 스냅샷 개념으로 분리한다. 예: RatingAssignment 또는
      RiskGradeSnapshot에 borrower_ref/exposure_ref, source_rating_ref, grade,
      score, effective_from, effective_to, calculated_at, supersedes_ref,
      source_system을 두고 Borrower/Exposure는 현재 등급을 파생 뷰로만 노출한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고서 시스템이 공유하는 여신 리스크 분류 기준 및 보고 재현성
      failure_condition: 동일 차주나 익스포저의 등급이 변경되거나 보고서 팀이 수동 조정한 뒤 과거 기준일의 등급·점수를 재구성해야 하는 경우
      impact: 공유 권위 문서가 현재값만 제공하므로 엔진 산출값과 보고값의 시점별 차이를 설명하거나 재현할 수 없어 보고 신뢰와 사후 감사
        가능성이 약해진다.
      evidence_refs:
        - materialized-input.md:7-8
        - materialized-input.md:20-22
        - materialized-input.md:31-37
        - materialized-input.md:48-57
        - materialized-input.md:92-93
    causal_path:
      root_cause_candidate: 시점 의존 핵심 분류값을 현재 속성으로 모델링하고 등급 이력/유효기간 개념을 별도로 두지 않았다.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: Borrower.internal_rating, Exposure.risk_grade, RiskRating.grade/score가
            유효기간이나 산출시점 없이 속성으로만 정의되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20-22
            - materialized-input.md:31-37
            - materialized-input.md:48-57
        - cause_id: coverage-candidate-001.cause-002
          claim: Exposure.risk_grade는 RiskRating.grade에서 도출된 뒤 보고서 팀이 수동 조정할 수 있어 같은 익스포저의
            등급 값이 시간과 행위에 따라 달라질 수 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:92-93
        - cause_id: coverage-candidate-001.cause-003
          claim: 온톨로지는 리스크 엔진과 보고서 시스템의 공유 권위 문서를 지향하므로, 등급의 과거 시점 재현 실패가 엔진-보고 간 기준 일관성을
            직접 약화한다.
          relation_to_previous: causes
