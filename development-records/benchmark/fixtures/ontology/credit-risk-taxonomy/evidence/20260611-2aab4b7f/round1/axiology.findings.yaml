  - candidate_id: axiology-candidate-002
    target: credit-risk-ontology.yaml rating scale coexistence note
    evidence_anchor: materialized-input.md:20-22,53-56,97-98;
      review-value-alignment-criteria.yaml:criteria[user-request-intent]
    claim: 3개 등급 스케일의 소비자별 변환 위임이 공유 분류 기준 목적과 어긋난다.
    what: "`Borrower.internal_rating`, `RiskRating.grade`, `Exposure.risk_grade`가 서로
      다른 스케일로 병존하며, 변환은 각 소비 시스템이 수행한다고 적혀 있다. 공유 온톨로지 안에 canonical mapping,
      유효시점, 예외 처리, 우선순위가 없다."
    why: 리스크 엔진과 보고 시스템이 공유할 개념 기준이라면 등급 스케일 간 의미 대응은 소비자별 구현 세부가 아니라 공유 권위에 속한다.
      변환을 각 소비 시스템에 맡기면 같은 차주/익스포저에 대해 시스템마다 다른 등급 해석이 생길 수 있고, 분류체계 결함이 운영상
      불일치로 전이된다.
    how_to_fix: 등급 스케일별 역할을 분리하고 canonical mapping table 또는
      `RatingScale`/`RatingMapping` 개념을 온톨로지 안에 둔다. 각 mapping에는 source scale,
      target scale, valid_from/valid_to, owner, unmapped 처리 기준을 포함한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 분류체계 및 개념 기준 제공.
      failure_condition: 3개 등급 스케일 변환을 각 소비 시스템이 독자적으로 수행할 때.
      impact: 공유 온톨로지가 기준을 제공하지 못하고 소비자별 변환 결과를 사후 병존시키므로 보고/엔진 간 등급 비교와 정책 적용의 신뢰가
