findings:
  - candidate_id: semantics-candidate-001
    target: credit-risk-ontology.yaml / entities.Collateral
    evidence_anchor: .onto/review/20260611-2aab4b7f/execution-preparation/materialized-input.md:39-47,85-88
    claim: Collateral이 Exposure의 하위 유형으로 모델링되어 담보 자산과 신용 익스포저의 의미가 뒤섞인다.
    what: "Collateral 정의는 '익스포저를 담보하는 자산'인데 `is_a: Exposure`로 선언되어 있습니다. 같은 파일에는 별도로
      `Exposure -> Collateral`의 `secured_by` 관계도 있어, 담보가 익스포저의 종류인지 익스포저에 연결되는
      자산인지가 동시에 주장됩니다."
    why: 담보 자산은 Exposure의 금액, 상품유형, 익스포저 등급을 본질적으로 갖는 신용 익스포저가 아니라 Exposure를 보전하는 별도
      대상입니다. 공유 개념 권위 문서에서 이 상속이 유지되면 리스크 엔진이나 보고 시스템이 Collateral을 Exposure로 취급해
      익스포저 집계, 등급, 상품 분류에 포함시키는 의미 오류가 발생할 수 있습니다.
    how_to_fix: "`Collateral.is_a: Exposure`를 제거하고 Collateral을 독립 엔터티로 유지한 뒤
      `Exposure secured_by Collateral` 관계만 권위 관계로 사용하세요. 담보가 특정 익스포저에 귀속되어야 한다면
      `exposure_ref` 또는 관계의 cardinality/role을 명시하세요."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 익스포저·담보 개념 기준
      failure_condition: 시스템이 ontology의 `is_a` 의미를 따라 Collateral을 Exposure의 일종으로 해석하거나
        상속 속성/집계 대상으로 취급할 때
      impact: 담보 평가 단위가 신용 익스포저로 오분류되어 총익스포저, 위험등급, 상품유형 보고의 의미적 신뢰가 깨진다.
      evidence_refs:
        - materialized-input.md:24-37
        - materialized-input.md:39-47
        - materialized-input.md:85-88
    causal_path:
      root_cause_candidate: Collateral의 정의는 담보 자산이지만 타입 관계는 Exposure 하위 유형으로 선언되어 있다.
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: Collateral은 '익스포저를 담보하는 자산'으로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:39-40
        - cause_id: semantics-candidate-001.cause-002
          claim: "같은 Collateral에 `is_a: Exposure`가 부여되어 담보 자산을 익스포저 종류로 만든다."
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:41
        - cause_id: semantics-candidate-001.cause-003
          claim: 별도 관계에서는 Exposure가 Collateral에 의해 담보된다고 모델링되어 상속 관계와 역할 관계가 충돌한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:85-88
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: credit-risk-ontology.yaml / entities.Borrower.internal_rating,
      RiskRating.grade, Exposure.risk_grade
    evidence_anchor: .onto/review/20260611-2aab4b7f/execution-preparation/materialized-input.md:20-22,31-34,48-57,92-98
    claim: 세 개의 신용등급 스케일이 같은 '등급' 의미권을 공유하지만 온톨로지 안에서 의미 매핑과 권위가 닫혀 있지 않다.
    what: Borrower의 `internal_rating`은 1~10, RiskRating의 `grade`는 R1~R5, Exposure의
      `risk_grade`는 AAA~CCC이며 모두 신용/리스크 등급을 나타냅니다. 그러나 매핑은 리스크팀 위키나 각 소비 시스템에
      맡겨져 있고, Exposure.risk_grade는 RiskRating.grade에서 도출되면서도 보고서 팀이 수동 조정할 수 있다고
      되어 있습니다.
    why: 이 온톨로지는 리스크 엔진과 보고 시스템이 공유하는 개념 권위 문서가 목적입니다. 그런데 동일한 등급 의미권의 변환 규칙과 원천 권위가
      문서 밖으로 빠져 있으면 '같은 등급인지, 파생 등급인지, 수동 조정 등급인지'를 소비 시스템마다 다르게 해석하게 됩니다.
    how_to_fix: "세 등급을 하나로 합치기보다 각 등급의 의미를 분리해 명명하고, 온톨로지 안에 권위 원천과 매핑 관계를 명시하세요. 예:
      `BorrowerInternalRating`, `EngineBorrowerRating`,
      `ReportExposureRiskGrade`처럼 의미를 구분하고, R1~R5에서 AAA~CCC로 가는 매핑/override
      사유/override authority/as_of를 모델링하세요."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유할 신용등급 분류 기준
      failure_condition: 엔진 산출 등급, 차주 내부 등급, 보고용 익스포저 등급을 서로 변환하거나 비교해야 하는 보고·심사·한도 판단 경로
      impact: 등급 의미와 권위가 시스템별로 갈라져 같은 차주/익스포저의 위험 수준이 서로 다른 기준으로 보고되거나 조정될 수 있다.
      evidence_refs:
        - materialized-input.md:20-22
        - materialized-input.md:31-34
        - materialized-input.md:48-57
        - materialized-input.md:92-98
    causal_path:
      root_cause_candidate: 온톨로지 내부에 병존 등급 스케일의 의미 분리와 매핑 권위가 정의되어 있지 않다.
      root_cause_step_id: semantics-candidate-002.cause-004
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: Borrower.internal_rating, RiskRating.grade, Exposure.risk_grade가 모두 등급 계열
            속성으로 존재한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20-22
            - materialized-input.md:31-34
            - materialized-input.md:53-56
        - cause_id: semantics-candidate-002.cause-002
          claim: RiskRating.grade의 Borrower.internal_rating 매핑은 외부 위키 참조로 남아 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:56
        - cause_id: semantics-candidate-002.cause-003
          claim: Exposure.risk_grade는 RiskRating.grade에서 도출되지만 보고서 팀이 수동 조정할 수 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:92-93
        - cause_id: semantics-candidate-002.cause-004
          claim: 세 스케일의 변환은 각 소비 시스템이 수행한다고 되어 있어 공유 온톨로지가 등급 의미의 기준점이 되지 못한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:97-98
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-003
    target: credit-risk-ontology.yaml / entities.Exposure.attributes.ltv
    evidence_anchor: .onto/review/20260611-2aab4b7f/execution-preparation/materialized-input.md:24-37,39-46
    claim: ltv가 담보와 익스포저 원천값에서 파생되는 비율인데 독립 입력값으로 모델링되어 의미 드리프트 위험이 있다.
    what: Exposure에는 `amount`가 있고 Collateral에는 `appraised_value`가 있는데, Exposure.ltv는
      '담보인정비율'이라는 비율 속성으로 별도 숫자 입력값이며 심사역이 입력한다고 되어 있습니다.
    why: 비율·율 계열 용어는 원천값과 함께 존재할 때 파생값으로 취급되어야 합니다. 현재처럼 독립 입력으로 두면 Exposure.amount나
      Collateral.appraised_value가 바뀌어도 ltv가 같은 의미 기준으로 재계산되었는지 알 수 없어 리스크 엔진과 보고
      시스템이 서로 다른 LTV 의미를 사용할 수 있습니다.
    how_to_fix: "`ltv`를 원천 속성에서 계산되는 파생 속성으로 표시하고 계산식, 기준 담보 선택 방식, 산정 시점, override
      가능 여부를 명시하세요. 사람이 입력해야 한다면 `manual_ltv`, `ltv_source`, `ltv_as_of`처럼 원천과
      입력값의 의미 차이를 분리하세요."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 담보 기반 리스크 분류와 보고 기준의 의미 일관성
      failure_condition: Exposure.amount 또는 Collateral.appraised_value가 변경되거나 복수 시스템이
        LTV를 재계산/입력할 때
      impact: 같은 익스포저의 담보 비율이 원천값과 불일치해 심사·등급·보고 판단의 재현성과 비교 가능성이 약해진다.
      evidence_refs:
        - materialized-input.md:29
        - materialized-input.md:35-37
        - materialized-input.md:39-46
    causal_path:
      root_cause_candidate: 도메인상 비율 이름을 가진 ltv가 원천값과 함께 존재하지만 독립 입력 속성으로 선언되어 있다.
      root_cause_step_id: semantics-candidate-003.cause-003
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: Exposure.amount와 Collateral.appraised_value가 원천 금액으로 모델에 존재한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:29
            - materialized-input.md:45
        - cause_id: semantics-candidate-003.cause-002
          claim: Exposure.ltv는 비율 성격의 숫자 속성으로 심사역 입력값이라고 정의되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:35-37
        - cause_id: semantics-candidate-003.cause-003
          claim: 계산식, 산정 시점, 원천 담보 선택 기준이 없어 원천값과 입력 비율의 의미 일치 여부를 검증할 수 없다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:35-37
            - materialized-input.md:39-46
      unresolved_beyond_evidence: 복수 담보 또는 담보별 인정률 정책은 현재 파일 안에 없으므로, 구체 산식까지는 이 경계 안에서 확정하지 않았다.
  - candidate_id: semantics-candidate-004
    target: credit-risk-ontology.yaml / entities.RiskAppetite
    evidence_anchor: .onto/review/20260611-2aab4b7f/execution-preparation/materialized-input.md:69-83,92-94
    claim: RiskAppetite가 정책 한도와 준수 판정 결과를 한 개념에 섞어 모델링한다.
    what: RiskAppetite는 '리스크 성향 한도'로 정의되지만 같은 정의에서 초과 위반과 준수 상태까지 함께 설명하고, 속성으로
      `threshold`와 `compliance_status`를 모두 가집니다. 비교 대상인 ExposureAggregate는 월말 배치
      저장값입니다.
    why: Risk appetite 자체는 조직이 설정한 허용 기준이고, compliance status는 특정 시점의 익스포저 집계가 그 기준을
      초과했는지에 대한 파생 판정입니다. 둘을 같은 엔터티의 고유 속성처럼 두면 정책 기준이 바뀐 것인지, 특정 차주/시점의 위반 상태가
      바뀐 것인지 의미적으로 구분하기 어렵습니다.
    how_to_fix: "`RiskAppetite`를 정책/threshold 개념으로 좁히고, 준수 판정은
      `RiskAppetiteAssessment` 또는 `AppetiteBreachStatus` 같은 별도 파생 결과로 분리하세요. 평가
      결과에는 borrower/exposure aggregate reference, as_of, used_threshold,
      calculation basis를 포함하세요."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 성향 한도와 위반 보고의 공유 개념 기준
      failure_condition: 보고 시스템이 특정 시점의 위반 여부를 저장하거나 리스크 엔진이 기준 threshold 변경과 상태 변경을 구분해야 할 때
      impact: 정책 기준과 산출 상태가 같은 개념에 섞여 시간별 준수 여부, 재계산, 감사 추적의 의미가 불명확해진다.
      evidence_refs:
        - materialized-input.md:69-83
        - materialized-input.md:92-94
    causal_path:
      root_cause_candidate: RiskAppetite 개념 정의가 정책 기준과 평가 결과를 동시에 포함한다.
      root_cause_step_id: semantics-candidate-004.cause-003
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: RiskAppetite는 threshold를 가진 리스크 성향 한도로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:78-82
        - cause_id: semantics-candidate-004.cause-002
          claim: 같은 정의와 속성에 위반 여부인 compliance_status가 포함된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:78-83
        - cause_id: semantics-candidate-004.cause-003
          claim: 비교 대상 ExposureAggregate는 as_of가 있는 월말 배치 산출값이므로 준수 상태는 특정 시점 산출 결과의 의미를
            갖는다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:69-76
      unresolved_beyond_evidence: null
