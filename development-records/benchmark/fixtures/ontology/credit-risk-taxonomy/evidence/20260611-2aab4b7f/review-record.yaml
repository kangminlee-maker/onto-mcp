        finding context: Rating-scale evolution is delegated to external
        consumers instead of being versioned in the shared ontology. Source
        finding context: Because the ontology is intended as the shared concept
        authority for a risk engine and reporting system, grade-scale changes
        need a stable canonical place for mappings, versions, effective dates,
        and override provenance. With mappings outside the target and
        consumer-specific transforms, adding a new grade, changing a cutoff, or
        preserving historical mapping semantics requires coordinated changes in
        each consumer and can break continuity between historical engine results
        and reports. Source finding context: Add an explicit canonical
        rating-scale/mapping model in the ontology, such as `RatingScale`,
        `RatingGrade`, and `GradeMapping` with source scale, target scale,
        valid_from/valid_to or version, derivation rule, and manual_override
        provenance. Make consumers reference that authority rather than
        maintaining independent transforms. Source finding context:
