        -candidate-001 Source finding context: The ontology's declared purpose
        as a shared concept authority for the risk engine and reporting system.
        Source finding context: When a grade scale, mapping, or
        manual-adjustment rule changes, the target does not provide an
        authoritative versioned mapping path for existing and future records.
        Source finding context: Historical and current grade interpretation can
        diverge across consumers, weakening the ontology's ability to support
        stable engine-report continuity under change. Source finding context:
        The ontology models grade scales as separate local attributes and places
        cross-scale mapping authority outside the ontology. Source finding
        context: The target contains three grade scales with different
        representations and no internal mapping entity. Source finding context:
        The derivation and override rule depends on cross-scale conversion, but
        does not define versioned mapping semantics in the target. Source
        finding context: The note assigns transformation responsibility to each
        consuming system and references an external wiki for mapping. Source
        finding context: Therefore grade-scale evolution requires consumer-local
        changes and can break continuity between risk-engine and reporting
        interpretations. Source finding context: credit-risk-ontology.yaml enum
        classifications for borrower, product, collateral, and risk grade Source
        finding context: credit-risk-ontology.yaml:14,
        credit-risk-ontology.yaml:25, credit-risk-ontology.yaml:28,
        credit-risk-ontology.yaml:39 Source finding context: Closed inline enums
        make classification expansion a schema change instead of a versioned
        taxonomy update. Source finding context: For a taxonomy expected to be
        shared by operational risk and reporting systems, new products,
        collateral classes, segments, or grades are ordinary evolution events.
        Encoding them only as inline enum values means each new category
        modifies the ontology schema and likely requires consumer parser/report
        updates, instead of allowing a controlled dictionary/taxonomy update
        with compatibility metadata. Source finding context: Promote each
        externally visible enum into a governed classification vocabulary with
        stable codes, labels, status, effective dates, aliases, and
        parent/category grouping. Keep current enum values as initial dictionary
        rows or controlled-code instances, and define how unknown, pending,
        deprecated, and retired codes are handled. Source finding context:
        .onto/review/20260611-2aab4b7f/round1/evolution.findings.yaml#evolution\
        -candidate-002 Source finding context: The ontology's role as a shared
        concept basis for classification across risk engine and reporting.
        Source finding context: When a new segment, product type, collateral
        type, or risk grade is introduced, the only visible extension path is
        editing fixed enum lists in the target. Source finding context: Routine
        taxonomy growth becomes a schema/version coordination event, increasing
        the chance of integration lag or incompatible interpretations across
        systems. Source finding context: The taxonomy uses fixed inline enum
        lists for core extensible business classifications without lifecycle or
        extension metadata. Source finding context: Borrower segment, product
        type, risk grade, and collateral type are represented as fixed enum
        values. Source finding context: No adjacent structure in the target
        defines versioning, aliases, deprecation, or unknown/pending handling
        for those classification values. Source finding context: Adding new
        business categories therefore requires changing the ontology surface
        rather than extending a governed classification vocabulary."
