      rationale: "FX version/replay authority 문제로 확정된 medium 이슈다. FX 기준 변경 후에도 같은
        utilization 개념을 재현하려면 versioned conversion authority가 필요하다. Source
        finding context: credit-risk-ontology.yaml Limit utilization
        currency-conversion rule Source finding context:
        credit-risk-ontology.yaml:59-62, credit-risk-ontology.yaml:87-89 Source
        finding context: Currency conversion is left to each system's daily FX
        table, so FX-source changes can break cross-system continuity. Source
        finding context: When risk and reporting systems share a utilization
        concept, a change in FX vendor, rate cut-off time, holiday handling, or
        table contents should preserve reproducibility of prior calculations.
        Leaving conversion to each system's own table makes future FX-source
        changes and cross-domain integrations produce different utilization
        values for the same exposure and limit data. Source finding context:
        Introduce an explicit `FxRate` or `CurrencyConversion` concept with
        source, rate_date/time, base/quote currency, rate version, and
        calculation provenance. Define `Limit` utilization as depending on that
        canonical conversion input, including historical replay behavior for
        previously reported periods. Source finding context:
        .onto/review/20260611-2aab4b7f/round1/evolution.findings.yaml#evolution\
        -candidate-003 Source finding context: The shared utilization rule used
        by risk and reporting consumers. Source finding context: When currencies
        differ or FX tables/rules change, the target provides no shared
        conversion authority or historical replay contract. Source finding
        context: The same limit utilization concept can produce non-reconciled
        values across systems and lose continuity after FX-table changes. Source
        finding context: The ontology references system-local FX tables rather
        than modeling currency conversion as an authoritative versioned concept.
        Source finding context: Limit stores approved amount and a currency
        string, but no conversion source or rate metadata. Source finding
        context: The utilization rule explicitly delegates cross-currency
        conversion to each system's daily FX table. Source finding context:
        System-local conversion authority enables divergent results and weakens
        continuity when FX sources or cut-off rules change."
    - issue_id: issue-009
      candidates: *a11
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "logic finding 기반 medium 이슈로 확정되었다. 같은 필드가 현재 합계와 배치 스냅샷을 함께 의미하면 한도와
        appetite 계산의 일관성이 깨진다. Source finding context: credit-risk-ontology.yaml
        / ExposureAggregate.definition and attributes.total_amount.note Source
        finding context: Embedded Materialized Input,
        ExposureAggregate.definition: \"차주 단위 총익스포저. 모든 Exposure.amount의 합.\";
        total_amount.note: \"월말 배치로 계산해 저장. 일중 신규 여신은 다음 배치까지 미반영.\" Source
        finding context: ExposureAggregate declares `total_amount` as the sum of
        all exposures while also allowing stored values that omit intraday new
        exposures. Source finding context: This is an inter-claim temporal
        satisfiability conflict: the definition uses a necessary universal
        aggregation over all Exposure amounts, while the attribute note permits
        a later operational state where some valid Exposure amounts are
        excluded. The conflict matters because engines and reports using
        `total_amount` can disagree on whether the field is canonical current
        exposure or a dated batch snapshot. Source finding context: Split the
        concepts or qualify the invariant: define `current_total_amount =
        sum(all current Exposure.amount)` separately from
        `batch_total_amount/as_of`, or change the definition to `as_of 기준 배치 산출
        총익스포저` and require consumers to use `as_of` when evaluating limits or
        appetite. Source finding context:
        .onto/review/20260611-2aab4b7f/round1/logic.findings.yaml#logic-candida\
        te-002 Source finding context: The ontology is intended as a shared
        concept authority for risk engines and reporting systems. Source finding
        context: When intraday new exposures exist after the stored month-end
        batch value, `ExposureAggregate.total_amount` cannot simultaneously be
        the sum of all exposures and omit those new exposures until the next
        batch. Source finding context: Consumers can make incompatible
        limit/appetite calculations from the same field because the field's
        declared invariant and permitted temporal state conflict. Source finding
        context: The ontology reuses one `total_amount` concept for both an
        exact current aggregate and a batch snapshot without making the snapshot
        modality explicit. Source finding context:
        `ExposureAggregate.definition` declares borrower-level total exposure as
        the sum of all `Exposure.amount`. Source finding context:
        `total_amount.note` permits stored values that exclude intraday new
        loans until the next batch. Source finding context: A post-batch state
        with a new Exposure makes the exact-sum claim and stale-storage claim
        impossible to satisfy for one unqualified `total_amount` value at the
        same observation time."
