        context: The ontology reuses one `total_amount` concept for both an
        exact current aggregate and a batch snapshot without making the snapshot
        modality explicit. Source finding context:
        `ExposureAggregate.definition` declares borrower-level total exposure as
        the sum of all `Exposure.amount`. Source finding context:
        `total_amount.note` permits stored values that exclude intraday new
        loans until the next batch. Source finding context: A post-batch state
        with a new Exposure makes the exact-sum claim and stale-storage claim
        impossible to satisfy for one unqualified `total_amount` value at the
        same observation time."
