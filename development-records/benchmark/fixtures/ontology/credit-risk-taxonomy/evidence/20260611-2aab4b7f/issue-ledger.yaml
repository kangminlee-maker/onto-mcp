  - issue_id: issue-009
    root_cause_hypothesis: 온톨로지가 하나의 `total_amount` 개념을 정확한 현재 aggregate와 dated
      batch snapshot 양쪽에 재사용하면서 snapshot modality를 명시하지 않았다.
    root_confidence: medium
    surface_finding_ids:
      - finding-012
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: ExposureAggregate.total_amount가 모든 Exposure.amount의 합이라고 선언되면서도
      일중 신규 여신을 다음 배치까지 누락할 수 있어 동일 필드의 invariant와 temporal state가 충돌한다.
    proposed_action: "`current_total_amount = sum(all current Exposure.amount)`와
      `batch_total_amount/as_of`를 분리하거나, 정의를 `as_of` 기준 배치 산출 총익스포저로 바꾸고
      limit/appetite 평가 시 `as_of` 사용을 요구한다."
    affected_purpose: The ontology is intended as a shared concept authority for
      risk engines and reporting systems.
    failure_condition: When intraday new exposures exist after the stored month-end
      batch value, `ExposureAggregate.total_amount` cannot simultaneously be the
      sum of all exposures and omit those new exposures until the next batch.
    impact: Consumers can make incompatible limit/appetite calculations from the
      same field because the field's declared invariant and permitted temporal
      state conflict.
    evidence_refs:
      - .onto/review/20260611-2aab4b7f/round1/logic.findings.yaml#logic-candidate-002
      - Embedded Materialized Input, ExposureAggregate.definition
      - Embedded Materialized Input,
        ExposureAggregate.attributes.total_amount.note
    severity: medium
    domain_threshold_used: null
    singleton_reason: finding-012는 enables relation만 가지며, 같은 issue로 병합할
      same_root_candidate relation이 없다.
