    evidence_refs:
      - .onto/review/20260611-2aab4b7f/round1/logic.findings.yaml#logic-candidate-001
    severity: low
    domain_threshold_used: null
    singleton_reason: finding-011에는 relation graph의 semantic relation이 없고 bounded
