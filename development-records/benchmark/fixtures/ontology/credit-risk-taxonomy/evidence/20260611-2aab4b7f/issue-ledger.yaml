    root_cause_hypothesis: Exposure와 Collateral의 역할 경계 및 관계 의미가 충분히 분리되지 않아 담보 기반 파생
      리스크 값의 의미가 불안정해진다.
    root_confidence: medium
    surface_finding_ids:
