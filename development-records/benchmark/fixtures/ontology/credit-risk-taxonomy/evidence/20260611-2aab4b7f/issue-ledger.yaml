    issue_statement: Collateral을 Exposure 하위 유형으로 두는 타입 오류와 LTV를 원천 담보/익스포저 값에서 독립된
      입력값으로 두는 모델링이 결합되어 담보 기반 리스크 의미가 불안정하다.
    proposed_action: "`Collateral.is_a: Exposure`를 제거하고 `Exposure secured_by
