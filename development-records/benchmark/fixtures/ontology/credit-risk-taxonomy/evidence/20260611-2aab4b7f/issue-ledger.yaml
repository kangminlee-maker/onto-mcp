    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: RiskAppetite definition contains a circular or under-specified
      rule for violation/compliance status.
    proposed_action: Define the rule directly against declared attributes, for
      example `compliance_status = breached if ExposureAggregate.total_amount >
      RiskAppetite.threshold, otherwise compliant`, and specify
      borrower/product/time scope.
    affected_purpose: declared review purpose.
    failure_condition: no material failure condition is shown by the current bounded
      lens evidence.
    impact: Within the logic lens and domain-none boundary, the statement is not
      strictly unsatisfiable, but the shared concept criterion is
      under-specified because the status it should determine is referenced as
