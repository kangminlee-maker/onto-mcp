  - issue_id: issue-007
    root_cause_hypothesis: 온톨로지가 system-local FX table을 참조할 뿐 통화 변환을 권위 있는 versioned
      concept으로 모델링하지 않는다.
    root_confidence: medium
    surface_finding_ids:
      - finding-010
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: 통화 변환이 각 시스템의 일일 FX 테이블에 맡겨져 FX source, cut-off, version 변경 시
      cross-system continuity와 historical replay가 깨질 수 있다.
    proposed_action: "`FxRate` 또는 `CurrencyConversion` 개념을 추가하고 source,
      rate_date/time, base/quote currency, rate version, calculation provenance,
      historical replay behavior를 `Limit` utilization 계산에 연결한다."
    affected_purpose: The shared utilization rule used by risk and reporting consumers.
    failure_condition: When currencies differ or FX tables/rules change, the target
      provides no shared conversion authority or historical replay contract.
    impact: The same limit utilization concept can produce non-reconciled values
      across systems and lose continuity after FX-table changes.
    evidence_refs:
