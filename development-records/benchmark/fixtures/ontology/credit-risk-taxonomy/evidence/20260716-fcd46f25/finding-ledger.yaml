    source_ref: .onto/review/20260716-fcd46f25/round1/semantics.findings.yaml#semantics-candidate-002
    target: credit-risk-ontology.yaml — borrower and exposure credit-grade concepts
    evidence_anchor: materialized-input.md:20-22, 31-34, 48-57, 92-98
    claim: Three incompatible grade scales share the meaning “credit rating,” while
      derivation, mapping authority, and manual adjustment are delegated to
      consumers.
    lens_rationale_summary: The same grade value can mean an engine assessment, a
      historical internal scale, or a reporting adjustment. Because consumers
      perform their own transformations, neither the source grade nor the
      adjusted report grade has a single shared meaning or precedence.
    proposed_action: Define distinct canonical concepts for rating observation,
      scale, and reported/adjusted grade; include a versioned authoritative
      mapping and record source, effective time, derivation, and override
      provenance in the shared contract.
    affected_purpose: Serve as the shared concept authority for risk-engine and
      reporting-system credit classifications.
    failure_condition: The engine and reporting system translate or override a
      borrower or exposure grade independently.
    impact: Identical borrowers or exposures can receive non-comparable grades while
      each consumer remains nominally conformant to the ontology, undermining
      shared classification and reporting trust.
