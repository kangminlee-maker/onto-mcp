  - finding_id: finding-011
    lens_id: semantics
    source_ref: .onto/review/20260716-fcd46f25/round1/semantics.findings.yaml#semantics-candidate-001
    target: credit-risk-ontology.yaml — Collateral entity classification
    evidence_anchor: materialized-input.md:39-46, 85-87
    claim: Collateral is incorrectly modeled as a subtype of Exposure despite being
      defined as an asset that secures an exposure.
    lens_rationale_summary: Subtype inheritance carries identity and meaning, not
      merely association. Consumers sharing this ontology could consequently
      treat collateral as exposure, inherit exposure semantics, or aggregate
      collateral assets into exposure populations.
    proposed_action: "Remove `Collateral.is_a: Exposure`; retain Collateral as an
      independent entity connected through `Exposure secured_by Collateral`."
    affected_purpose: Provide a shared conceptual authority for risk-engine and
      reporting-system exposure and collateral concepts.
    failure_condition: A consumer interprets `is_a` as subtype inheritance when
      validating, querying, or aggregating Exposure instances.
    impact: The authority document then licenses mutually incompatible identity and
      classification behavior across consumers.
    evidence_refs:
      - .onto/review/20260716-fcd46f25/round1/semantics.findings.yaml#semantics-candidate-001
      - materialized-input.md:39-46
