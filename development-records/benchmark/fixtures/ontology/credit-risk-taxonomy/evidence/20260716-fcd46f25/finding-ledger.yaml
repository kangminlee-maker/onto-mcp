    target: credit-risk-ontology.yaml — Exposure.ltv
    evidence_anchor: materialized-input.md:24-46
    claim: The ratio-named `ltv` is modeled as an independent manual input without
      authoritative operands, formula, valuation time, or provenance.
    lens_rationale_summary: A stored input and a value derived from the modeled
      exposure and collateral can diverge without either being identifiable as
      authoritative. Risk and reporting consumers may therefore assign different
      meanings to the same `ltv` field.
    proposed_action: Define the authoritative LTV formula and operand selection,
      including collateral aggregation and valuation timestamp. Either make
      `ltv` a derived projection or rename it as an observed/approved LTV and
      attach source and effective-time provenance.
    affected_purpose: Give risk-engine and reporting consumers one shared meaning
      for exposure and collateral risk measures.
    failure_condition: A consumer recomputes LTV from modeled amounts while another
      uses the manually entered value.
    impact: Both values can conform structurally yet disagree semantically,
      producing inconsistent risk decisions and reports.
