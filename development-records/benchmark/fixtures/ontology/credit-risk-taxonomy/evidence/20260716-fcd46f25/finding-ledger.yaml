    target: credit-risk-ontology.yaml — RiskAppetite and compliance_status
    evidence_anchor: materialized-input.md:69-83
    claim: Risk appetite policy, numeric threshold, and compliance assessment are
      conflated in one entity.
    lens_rationale_summary: A policy threshold and the result of evaluating a
      time-specific aggregate against that threshold have different identity and
      lifecycle. Conflating them makes `compliance_status` appear intrinsic to
      RiskAppetite even though it varies by evaluated population and time.
    proposed_action: Keep RiskAppetite as the scoped, versioned policy threshold and
      model compliance as a derived assessment referencing the appetite and a
      specific ExposureAggregate snapshot, with currency and assessment time.
    affected_purpose: Provide a shared meaning for risk-appetite limits and breach reporting.
    failure_condition: Consumers evaluate different aggregate snapshots or scopes
      but read or write the same appetite-level compliance status.
    impact: The same RiskAppetite instance can be simultaneously compliant and
