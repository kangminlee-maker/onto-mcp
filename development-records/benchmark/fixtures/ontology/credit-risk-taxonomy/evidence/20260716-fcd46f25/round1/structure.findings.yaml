findings:
  - candidate_id: structure-candidate-001
    target: credit-risk-ontology.yaml — RiskAppetite 연결 구조
    evidence_anchor: "entities.RiskAppetite 및 relations 전체: RiskAppetite 정의는
      ExposureAggregate 초과 여부를 준수 상태로 규정하지만, relations의 5개 항목에는 RiskAppetite가 한
      번도 등장하지 않는다."
    claim: RiskAppetite가 관계 그래프에서 완전히 고립되어 핵심 준수 판정 경로가 끊겨 있다.
    what: RiskAppetite는 엔티티로 선언됐지만 ExposureAggregate 또는 적용 대상과 연결하는 관계가 없다.
    why: 정의상 ExposureAggregate와 RiskAppetite.threshold를 비교해야 하는데, 두 개념 사이의 구조적 연결이
      없어 엔진과 보고 시스템이 어떤 집계와 어떤 한도를 결합해야 하는지 온톨로지에서 탐색하거나 검증할 수 없다.
    how_to_fix: "RiskAppetite의 적용 범위를 명시하고 ExposureAggregate와의 비교 관계를 추가한다. 예: 적용
      대상별 `governed_by` 관계와 Aggregate-to-Appetite `evaluated_against` 관계를 선언한다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 개념 권위 및 RiskAppetite 준수 상태의 일관된 판정
      failure_condition: 소비 시스템이 특정 ExposureAggregate의 준수 상태를 산출하거나 보고할 때 적용할
        RiskAppetite를 선택해야 하는 경우
      impact: 공유 그래프가 결합 기준을 제공하지 않아 시스템별 임의 연결이나 판정 불능이 발생하고 동일 준수 상태를 재현하기 어렵다.
      evidence_refs:
        - credit-risk-ontology.yaml#entities.RiskAppetite.definition
        - credit-risk-ontology.yaml#entities.RiskAppetite.attributes
        - credit-risk-ontology.yaml#relations
    causal_path:
      root_cause_candidate: RiskAppetite의 적용 대상과 ExposureAggregate 비교를 표현하는 필수 관계가
        relations에 선언되지 않았다.
      root_cause_step_id: structure-candidate-001.cause-002
      steps:
        - cause_id: structure-candidate-001.cause-001
          claim: RiskAppetite는 relations의 어떤 간선에도 참여하지 않는 고아 엔티티다.
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml#relations
        - cause_id: structure-candidate-001.cause-002
          claim: RiskAppetite 정의가 요구하는 ExposureAggregate와의 비교 연결이 형식 관계로 모델링되지 않았다.
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml#entities.RiskAppetite.definition
            - credit-risk-ontology.yaml#relations
      unresolved_beyond_evidence: null
  - candidate_id: structure-candidate-002
    target: credit-risk-ontology.yaml — Exposure.risk_grade 도출 구조
    evidence_anchor: "classification_rules[0],
      entities.RiskRating.attributes.grade.note 및 relations 전체: rule은
      Exposure.risk_grade가 RiskRating.grade에서 도출된다고 하지만 두 속성 또는 엔티티를 연결하는 도출·매핑
      관계가 없고, 매핑은 외부 위키와 각 소비 시스템에 맡겨져 있다."
    claim: 선언된 등급 도출 규칙을 지탱하는 RiskRating–Exposure 매핑 연결이 누락되어 있다.
    what: RiskRating과 Exposure는 Borrower를 경유해 간접 연결되지만, 어떤 RiskRating.grade가 어떤
      Exposure.risk_grade로 변환되는지를 나타내는 공식 관계나 매핑 개념이 없다.
    why: 분류 규칙이 두 등급 사이의 도출을 설계 의도로 선언하므로 이를 구현·검증할 구조적 연결이 필요하다. 현재 구조에서는 소비자가 단순한
      Borrower 경로만으로 도출 관계, 매핑 버전 또는 수동 조정 후 계보를 식별할 수 없다.
    how_to_fix: RiskRating에서 Exposure 등급으로 이어지는 명시적 도출 관계와 정규 매핑 개념을 온톨로지에 추가하고, 수동
      조정 결과도 원본 등급과 연결되도록 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진의 R1–R5 등급과 보고 시스템의 AAA–CCC 등급을 공유 개념 기준으로 일관되게 연결하는 것
      failure_condition: 보고 시스템이 RiskRating.grade에서 Exposure.risk_grade를 산출하거나 그 결과의 계보를 검증하는 경우
      impact: 도출 연결이 권위 문서에 없으므로 소비 시스템별 변환이 분기되고 동일 차주·익스포저의 보고 등급을 구조적으로 추적하거나 검증할 수
        없다.
      evidence_refs:
        - credit-risk-ontology.yaml#classification_rules[0]
        - credit-risk-ontology.yaml#entities.RiskRating.attributes.grade
        - credit-risk-ontology.yaml#entities.Exposure.attributes.risk_grade
        - credit-risk-ontology.yaml#notes[0]
        - credit-risk-ontology.yaml#relations
    causal_path:
      root_cause_candidate: 서로 다른 등급 체계의 변환을 각 소비 시스템과 외부 매핑 문서에 위임하면서 정규 도출 관계를 온톨로지에 선언하지 않았다.
      root_cause_step_id: structure-candidate-002.cause-002
      steps:
        - cause_id: structure-candidate-002.cause-001
          claim: Exposure.risk_grade의 도출 규칙은 존재하지만 RiskRating과 Exposure 사이의 형식적 도출·매핑 관계는
            없다.
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml#classification_rules[0]
            - credit-risk-ontology.yaml#relations
        - cause_id: structure-candidate-002.cause-002
          claim: 등급 변환의 구조적 권위가 온톨로지가 아니라 외부 위키와 개별 소비 시스템에 분산되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml#entities.RiskRating.attributes.grade.note
            - credit-risk-ontology.yaml#notes[0]
      unresolved_beyond_evidence: 외부 위키 매핑의 실제 내용과 소비 시스템 구현은 경계 밖이므로 평가하지 않았으며, 본
        finding은 대상 파일 내부의 공식 연결 부재에 한정한다.
