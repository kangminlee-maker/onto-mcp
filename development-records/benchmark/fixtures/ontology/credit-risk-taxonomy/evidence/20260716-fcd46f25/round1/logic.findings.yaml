      여신을 다음 배치까지 제외한다고 명시한다.
    claim: ExposureAggregate.total_amount의 완전합 정의와 배치 지연 규칙은 배치 사이 상태에서 동시에 만족될 수 없다.
    what: 일중 신규 Exposure가 존재하는 동안 total_amount는 명시적으로 그 금액을 포함하지 않으므로, 같은 객체를 모든
      Exposure.amount의 합이라고도 할 수 없다.
    why: 충돌 쌍은 credit-risk-ontology.yaml:65와 credit-risk-ontology.yaml:70이다. 이는 두
      claim 사이의 inter-claim 충돌이며, line 65의 necessary한 완전성 조건과 line 70이 허용하는 지연
      상태가 mixed modality에서 충돌한다. 리스크 엔진과 보고 시스템이 어느 claim을 권위로 삼는지에 따라 동일 차주의
      총익스포저가 달라질 수 있다.
    how_to_fix: ExposureAggregate를 명시적인 시점 스냅숏으로 정의해 "as_of 시점까지 배치에 반영된
      Exposure.amount의 합"으로 한정하거나, 반대로 모든 현재 Exposure를 포함해야 한다면 total_amount를
      실시간 갱신하도록 계약을 변경한다. as_of의 기준시각·포함 경계도 함께 명시한다.
