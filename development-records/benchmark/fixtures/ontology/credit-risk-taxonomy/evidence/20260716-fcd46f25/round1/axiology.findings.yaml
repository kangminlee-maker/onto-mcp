      value_type=purpose; alignment_direction=misaligned'
    claim: 소비 시스템별 등급 변환과 보고팀 수동 조정을 허용해 공유 개념 권위라는 목적을 훼손한다.
    what: 차주 등급이 세 스케일로 병존하면서 매핑은 외부 위키와 각 소비 시스템에 위임되고, 보고팀은 도출된
      Exposure.risk_grade를 별도 기준으로 조정할 수 있다. 조정 우선순위·근거·버전·유효시점도 정의되지 않는다.
    why: 동일 차주나 익스포저를 리스크 엔진과 보고 시스템이 서로 다르게 분류할 수 있으며, 어느 값이 canonical한지 이 문서만으로
      결정할 수 없다. 이는 두 시스템이 공유할 개념 기준이라는 명시적 목적과 직접 충돌한다.
    how_to_fix: canonical 등급과 버전된 매핑 규칙을 이 온톨로지 안에 두고, 파생 우선순위와 유효기간을 정의한다. 수동 조정이
      필요하면 원본 등급과 분리된 override 개념으로 모델링하고 승인 주체·사유·시각·적용 범위를 필수화한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 단일 개념 권위 제공
      failure_condition: 소비 시스템이 서로 다른 매핑 버전을 사용하거나 보고팀이 엔진 등급을 수동 조정하는 경우
      impact: 동일 위험이 시스템별로 다르게 분류되어 보고 수치, 한도 판단 및 설명 가능성에 대한 신뢰가 약화된다.
