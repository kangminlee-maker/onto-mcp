  - candidate_id: axiology-candidate-002
    target: credit-risk-ontology.yaml — ExposureAggregate와 RiskAppetite 준수 상태의 시간성
    evidence_anchor: 'materialized-input.md:69-83. value_authority_anchor={source:
      .onto/review/20260716-fcd46f25/execution-preparation/review-value-alignment-criteria.yaml,
      anchor: lines 6-8, excerpt: "분류체계·권위·시간성 관점의 개념 결함과 운영 위험을 중심으로"};
      value_type=commitment; alignment_direction=misaligned'
    claim: 월말 스냅샷을 현재의 RiskAppetite 준수 상태처럼 사용할 수 있어 시간적으로 오도되는 공유 분류를 만든다.
    what: ExposureAggregate.total_amount는 일중 신규 여신을 다음 월말 배치까지 반영하지 않지만,
      RiskAppetite.compliance_status는 이 집계가 임계치를 넘는지만으로 compliant 또는 breached로
      정의된다. 상태의 기준시점, 허용 지연, stale/unknown 상태는 없다.
    why: 월말 이후 신규 여신으로 실제 익스포저가 임계치를 넘더라도 다음 배치까지 compliant로 표현될 수 있다. 리스크 엔진과 보고
      시스템이 서로 다른 갱신 시점의 값을 읽으면 동일한 준수 개념에 대해 상충하는 판단을 공유하게 된다.
    how_to_fix: 준수 판정에 aggregate_as_of와 threshold_effective_at을 명시하고 최대 허용 지연을 정의한다.
      허용 지연을 넘은 경우 compliant 대신 stale 또는 unknown을 반환하거나, 준수 판단용 집계를 필요한 주기로
      갱신하도록 규칙을 닫는다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 시간적으로 일관된 위험·준수 개념을 공유하는 것
      failure_condition: 월말 배치 이후 신규 여신이 발생해 실제 총익스포저가 RiskAppetite 임계치를 초과하지만 집계가 갱신되지 않은 기간
      impact: 위반을 compliant로 보고하거나 시스템별 상태가 달라져 위험 통제와 보고의 신뢰성이 훼손된다.
      evidence_refs:
        - materialized-input.md:69-83
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 준수 상태가 월말 스냅샷에 의존하면서도 freshness 계약과 비현재 상태 표현을 갖지 않는다.
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: 실제 익스포저가 임계치를 초과한 동안에도 준수 상태가 compliant로 남을 수 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-83
        - cause_id: axiology-candidate-002.cause-002
          claim: ExposureAggregate.total_amount가 월말 배치 값이며 일중 신규 여신을 다음 배치까지 반영하지 않는다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:69-76
        - cause_id: axiology-candidate-002.cause-003
          claim: RiskAppetite 준수 상태는 해당 집계와 임계치 비교로 정의되지만 기준시점 정합성, 허용 지연, stale/unknown
            처리가 없다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:69-83
      unresolved_beyond_evidence: 실제 소비 시스템이 별도 freshness 검사를 할 가능성은 있으나 대상 온톨로지에는 그
        공유 계약이 없으며, 허용된 경계 밖 구현은 확인하지 않았다.
