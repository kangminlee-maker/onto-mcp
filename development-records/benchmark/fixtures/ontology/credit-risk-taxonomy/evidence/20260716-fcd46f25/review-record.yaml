        finding context: classification_rules allows the reporting team to
        manually adjust Exposure.risk_grade; Exposure.ltv is entered by an
        examiner; Limit.approved_amount is recorded by an approval system, but
        no actor, action time, reason, approval, or source-record concept
        exists. Source finding context: Manual adjustment, human input, and
        approval actions lack audit-evidence concepts. Source finding context:
        Manual grade overrides and approved limits materially affect
        classifications and utilization. Without provenance, engine-derived
        values cannot be distinguished from overrides, and reports cannot
        evidence controlled decisions. Source finding context: Add a reusable
        DecisionOrAdjustment event linked to the affected fact, with actor,
        occurred_at, reason/evidence, prior/new value, approval status, and
        source-system record identifier. Source finding context:
        .onto/review/20260716-fcd46f25/round1/coverage.findings.yaml#coverage-c\
        andidate-003 Source finding context: Operating the ontology as a
        trustworthy shared authority for risk calculations and reports. Source
        finding context: A grade is manually overridden, LTV is entered or
        corrected, or a limit approval is challenged or reproduced. Source
        finding context: Consumers receive the outcome without evidence needed
        to explain, audit, or reverse the controlled action. Source finding
        context: The model covers controlled-action outputs but omits a general
        provenance/audit-event dimension. Source finding context: No actor,
        action timestamp, reason, prior value, or approval evidence accompanies
        controlled values. Source finding context: This absence is a symptom of
        modeling only current result attributes rather than the actions that
        establish them."
    - issue_id: issue-007
      candidates: *a9
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "비동시 배포와 분류 변경 시 호환성 실패를 만드는 독립적인 진화 계약 결손이다. 현재 계산을 항상 막지는 않지만 안전한
        확장과 점진 배포 전에 해소해야 한다. Source finding context: credit-risk-ontology.yaml
        — extensibility of classification vocabularies Source finding context:
        materialized-input.md:10-11, 15-19, 24-30, 39-46 Source finding context:
        새 고객군·상품·담보 유형을 추가하려면 기존 열거형과 모든 소비자의 검증 로직을 동시에 수정해야 하며 점진적 확장이 불가능하다.
        Source finding context: 새 사업부나 상품 도입 시 온톨로지 자체를 수정해야 하고, 구버전 소비자는 새 값을
        유효하지 않은 입력으로 처리할 수 있다. 생산자와 소비자를 동시에 배포하지 못하면 데이터 거부 또는 임의 치환이 발생하며, 기존
        코드의 이름 변경·폐기 시 역사적 의미도 보존되지 않는다. Source finding context: 분류 코드 목록을 식별자와
        버전을 가진 별도 개념으로 분리하고 각 코드에 stable_id, label, effective_from/to, status,
        superseded_by를 둔다. 소비자 계약에는 알 수 없는 미래 코드의 보존·거부 정책과 호환 가능한 확장 규칙을 명시한다.
        Source finding context:
        .onto/review/20260716-fcd46f25/round1/evolution.findings.yaml#evolution\
        -candidate-003 Source finding context: 새 여신 상품과 분류 범주를 기존 엔진·보고 시스템의
        연속성을 유지하며 수용하는 확장성 Source finding context: 새 segment, product_type 또는
        collateral_type을 추가·개명·폐기하고 생산자와 소비자의 배포 버전이 일시적으로 다를 때 Source finding
        context: 기존 구조와 소비자 검증을 동시 수정해야 하며, 구버전 소비자의 입력 거부나 분류 손실 때문에 안전한 점진 배포가
        어렵다. Source finding context: 확장 가능한 버전 코드 목록 대신 엔티티 속성 안에 닫힌 열거형 값을 직접
        고정했다. Source finding context: 고객군, 상품, 담보 유형이 각각 고정된 인라인 enum 값으로 선언되어
        있다. Source finding context: 코드 목록의 버전, 유효기간, 폐기·대체 또는 미래 값 처리 계약이 정의되지
        않는다. Source finding context: 따라서 새 범주 수용은 기존 enum 정의와 이에 의존하는 소비자 계약의
        변경을 요구한다."
    - issue_id: issue-008
      candidates: *a10
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: '두 규칙은 배치 사이에 동시에 충족될 수 없으며 소비자가 서로 다른 총익스포저를 정당하게 선택하게 한다. 스냅샷 의미와
        실시간 완전합 중 계약 선택이 대상 안에서 확정되어야 한다. Source finding context:
        credit-risk-ontology.yaml — ExposureAggregate 정의 및 total_amount 시간성 계약
        Source finding context: credit-risk-ontology.yaml:64-71 — line 65는
        ExposureAggregate를 "모든 Exposure.amount의 합"으로 정의하지만, line 70은
        total_amount가 월말 배치 값이며 일중 신규 여신을 다음 배치까지 제외한다고 명시한다. Source finding
        context: ExposureAggregate.total_amount의 완전합 정의와 배치 지연 규칙은 배치 사이 상태에서
        동시에 만족될 수 없다. Source finding context: 충돌 쌍은
        credit-risk-ontology.yaml:65와 credit-risk-ontology.yaml:70이다. 이는 두 claim
        사이의 inter-claim 충돌이며, line 65의 necessary한 완전성 조건과 line 70이 허용하는 지연 상태가
        mixed modality에서 충돌한다. 리스크 엔진과 보고 시스템이 어느 claim을 권위로 삼는지에 따라 동일 차주의
        총익스포저가 달라질 수 있다. Source finding context: ExposureAggregate를 명시적인 시점
        스냅숏으로 정의해 "as_of 시점까지 배치에 반영된 Exposure.amount의 합"으로 한정하거나, 반대로 모든 현재
        Exposure를 포함해야 한다면 total_amount를 실시간 갱신하도록 계약을 변경한다. as_of의 기준시각·포함 경계도
        함께 명시한다. Source finding context:
        .onto/review/20260716-fcd46f25/round1/logic.findings.yaml#logic-candidate-001
        Source finding context: 리스크 엔진과 보고 시스템이 공유하는 총익스포저 개념 기준 Source finding
        context: 월말 배치 후 신규 여신이 발생하고 다음 배치가 아직 실행되지 않은 기간 Source finding
        context: 두 소비자가 각각 완전합 정의와 저장값 규칙을 따르면 동일 개념에 서로 다른 값을 산출해 한도 소진율과 리스크
        보고의 일관성을 약화한다. Source finding context: ExposureAggregate의 정체성을 현재의 완전합으로
        선언하면서 동일 필드의 배치 스냅숏 시간 경계를 정의에 반영하지 않았다. Source finding context: 배치 사이에는
        total_amount가 일중 신규 Exposure.amount를 누락할 수 있다. Source finding context: 그
        누락 상태도 모든 Exposure.amount의 합이라는 무조건적 정의를 동시에 적용받는다. Source finding
        context: as_of 속성은 존재하지만 완전합 정의나 배치 포함 경계와 연결되지 않아 두 규칙을 조화시키지 못한다.'
    - issue_id: issue-009
      candidates: *a11
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "명시된 subtype과 연관관계의 구조적 충돌이 직접 관찰되며 검증·질의·집계에서 담보를 익스포저로 오분류할 수 있다.
        다른 이슈에 의존하지 않는 국소적이지만 현재적인 정확성 결함이다. Source finding context:
        credit-risk-ontology.yaml — Collateral entity classification Source
        finding context: materialized-input.md:39-46, 85-87 Source finding
        context: Collateral is incorrectly modeled as a subtype of Exposure
        despite being defined as an asset that secures an exposure. Source
        finding context: Subtype inheritance carries identity and meaning, not
        merely association. Consumers sharing this ontology could consequently
        treat collateral as exposure, inherit exposure semantics, or aggregate
        collateral assets into exposure populations. Source finding context:
        Remove `Collateral.is_a: Exposure`; retain Collateral as an independent
        entity connected through `Exposure secured_by Collateral`. Source
        finding context:
        .onto/review/20260716-fcd46f25/round1/semantics.findings.yaml#semantics\
        -candidate-001 Source finding context: Provide a shared conceptual
        authority for risk-engine and reporting-system exposure and collateral
        concepts. Source finding context: A consumer interprets `is_a` as
        subtype inheritance when validating, querying, or aggregating Exposure
        instances. Source finding context: The authority document then licenses
        mutually incompatible identity and classification behavior across
        consumers. Source finding context: An association between two distinct
        entity types is also encoded as subtype identity. Source finding
        context: Collateral is declared both as an Exposure subtype and as the
        target of Exposure's `secured_by` relation. Source finding context: This
        contradictory classification is caused by using `is_a` to represent the
        collateral–exposure association already represented by `secured_by`."
    - issue_id: issue-011
      candidates: *a12
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "현재 모델에서 LTV의 의미 구성요소와 권위가 누락된 사실이 직접 확인된다. 저장값과 재계산값이 모두 유효해질 수 있어
        현재 위험 판단과 보고의 일관성을 훼손한다. Source finding context:
        credit-risk-ontology.yaml — Exposure.ltv Source finding context:
        materialized-input.md:24-46 Source finding context: The ratio-named
        `ltv` is modeled as an independent manual input without authoritative
        operands, formula, valuation time, or provenance. Source finding
        context: A stored input and a value derived from the modeled exposure
        and collateral can diverge without either being identifiable as
        authoritative. Risk and reporting consumers may therefore assign
        different meanings to the same `ltv` field. Source finding context:
        Define the authoritative LTV formula and operand selection, including
        collateral aggregation and valuation timestamp. Either make `ltv` a
        derived projection or rename it as an observed/approved LTV and attach
        source and effective-time provenance. Source finding context:
        .onto/review/20260716-fcd46f25/round1/semantics.findings.yaml#semantics\
        -candidate-003 Source finding context: Give risk-engine and reporting
        consumers one shared meaning for exposure and collateral risk measures.
        Source finding context: A consumer recomputes LTV from modeled amounts
        while another uses the manually entered value. Source finding context:
        Both values can conform structurally yet disagree semantically,
        producing inconsistent risk decisions and reports. Source finding
        context: A ratio-valued concept is represented without making its
        derivation or observation provenance part of the concept contract.
        Source finding context: `ltv` is an independently entered number
        alongside exposure amount and time-stamped collateral appraisal values.
        Source finding context: The potential divergence is enabled by the
        absence of a canonical formula, operand-selection rule, and authority
        designation."
    - issue_id: issue-012
      candidates: *a13
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "관계 누락은 실재하지만 독립 root가 아니라 issue-010의 하위 구조 표면으로 전 렌즈가 수렴했다. 상위 등급
        계약이 실제 구조와 계보에 투영되었는지 확인하는 필수 완료 조건이다. Source finding context:
        credit-risk-ontology.yaml — Exposure.risk_grade 도출 구조 Source finding
        context: classification_rules[0],
        entities.RiskRating.attributes.grade.note 및 relations 전체: rule은
        Exposure.risk_grade가 RiskRating.grade에서 도출된다고 하지만 두 속성 또는 엔티티를 연결하는
        도출·매핑 관계가 없고, 매핑은 외부 위키와 각 소비 시스템에 맡겨져 있다. Source finding context: 선언된
        등급 도출 규칙을 지탱하는 RiskRating–Exposure 매핑 연결이 누락되어 있다. Source finding
        context: 분류 규칙이 두 등급 사이의 도출을 설계 의도로 선언하므로 이를 구현·검증할 구조적 연결이 필요하다. 현재
        구조에서는 소비자가 단순한 Borrower 경로만으로 도출 관계, 매핑 버전 또는 수동 조정 후 계보를 식별할 수 없다.
        Source finding context: RiskRating에서 Exposure 등급으로 이어지는 명시적 도출 관계와 정규 매핑
        개념을 온톨로지에 추가하고, 수동 조정 결과도 원본 등급과 연결되도록 한다. Source finding context:
        .onto/review/20260716-fcd46f25/round1/structure.findings.yaml#structure\
        -candidate-002 Source finding context: 리스크 엔진의 R1–R5 등급과 보고 시스템의 AAA–CCC
        등급을 공유 개념 기준으로 일관되게 연결하는 것 Source finding context: 보고 시스템이
        RiskRating.grade에서 Exposure.risk_grade를 산출하거나 그 결과의 계보를 검증하는 경우 Source
        finding context: 도출 연결이 권위 문서에 없으므로 소비 시스템별 변환이 분기되고 동일 차주·익스포저의 보고 등급을
        구조적으로 추적하거나 검증할 수 없다. Source finding context: 서로 다른 등급 체계의 변환을 각 소비 시스템과
        외부 매핑 문서에 위임하면서 정규 도출 관계를 온톨로지에 선언하지 않았다. Source finding context:
        Exposure.risk_grade의 도출 규칙은 존재하지만 RiskRating과 Exposure 사이의 형식적 도출·매핑 관계는
        없다. Source finding context: 등급 변환의 구조적 권위가 온톨로지가 아니라 외부 위키와 개별 소비 시스템에
        분산되어 있다."
