findings:
  - candidate_id: evolution-candidate-001
    target: credit-risk-ontology.yaml의 분류 코드 체계
    evidence_anchor: entities.Borrower.attributes.segment,
      entities.Exposure.attributes.product_type 및 risk_grade,
      entities.Collateral.attributes.collateral_type,
      entities.RiskRating.attributes.grade의 인라인 enum values
    claim: 분류값이 버전·유효기간 없는 폐쇄형 enum으로 고정되어 새 범주 도입과 기존 범주 변경의 하위 호환성을 보장하지 못한다.
    what: 차주 세그먼트, 상품, 담보, 등급의 허용값이 엔티티 속성 안에 직접 열거되어 있으며 코드의 식별자, 상태, 유효기간, 대체 관계가
      없다.
    why: 새 상품이나 담보 유형을 추가하려면 온톨로지와 모든 enum 의존 소비자를 동시에 수정해야 한다. 값의 분할·통합·폐기 시 과거
      데이터가 어느 분류 버전을 사용했는지도 판별할 수 없어 리스크 엔진과 보고 시스템의 장기적 공유 기준이 깨진다.
    how_to_fix: 분류체계를 별도 버전형 코드 목록 개념으로 분리하고 각 코드에 안정 식별자, 유효 시작·종료일, 상태 및 대체/상위 코드
      관계를 둔다. 레코드에는 적용된 코드 목록 버전을 보존한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 확장 가능한 개념 권위 문서
      failure_condition: 새 세그먼트·상품·담보·등급을 추가하거나 기존 값을 폐기·분할·통합할 때
      impact: 기존 구조와 소비자 구현의 동시 변경이 필요하고 과거 분류 의미를 재현할 수 없어 시스템 간 연속성과 비교 가능성이 훼손된다.
      evidence_refs:
        - materialized-input.md::entities.Borrower.attributes.segment
        - materialized-input.md::entities.Exposure.attributes.product_type
        - materialized-input.md::entities.Exposure.attributes.risk_grade
        - materialized-input.md::entities.Collateral.attributes.collateral_type
        - materialized-input.md::entities.RiskRating.attributes.grade
    causal_path:
      root_cause_candidate: 분류값을 수명주기가 있는 독립 개념이 아니라 엔티티 내부의 무버전 enum으로 모델링했다.
      root_cause_step_id: evolution-candidate-001.cause-002
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 새 분류값이나 기존 값의 변경은 해당 enum 정의와 이를 소비하는 구현의 수정을 요구한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md::entities.Borrower.attributes.segment
            - materialized-input.md::entities.Exposure.attributes.product_type
            - materialized-input.md::entities.Collateral.attributes.collateral_type
        - cause_id: evolution-candidate-001.cause-002
          claim: 분류 코드에 버전, 유효기간, 상태 또는 대체 관계를 표현하는 구조가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md::entities.*.attributes 내 enum values 정의
            - materialized-input.md::ontology.version
      unresolved_beyond_evidence: 실제 소비자들이 알 수 없는 별도 호환 계층을 운영하는지는 현재 경계에서 확인할 수 없지만, 온톨로지 자체에는 그 계약이 없다.
  - candidate_id: evolution-candidate-002
    target: credit-risk-ontology.yaml의 신용등급 체계 및 변환 계약
    evidence_anchor: Borrower.internal_rating, RiskRating.grade,
      Exposure.risk_grade와 notes의 '3개 스케일은 역사적 이유로 병존한다. 변환은 각 소비 시스템이 수행한다.'
    claim: 세 신용등급 스케일 사이의 변환이 권위 문서 밖의 소비자별 무버전 로직에 맡겨져 등급체계 변경 시 연속성이 끊긴다.
    what: 1~10, R1~R5, AAA~CCC 등급이 병존하지만 정식 매핑 엔티티나 적용 버전·유효기간이 없고, 일부 매핑은 위키를 참조하며
      최종 변환은 각 소비 시스템이 수행한다.
    why: 등급 경계나 매핑이 바뀌면 엔진과 보고 시스템이 서로 다른 시점 또는 규칙으로 변환할 수 있다. 과거 보고서의 등급을 당시 규칙으로
      재현하거나 새 등급체계로 안전하게 이행할 공통 기준도 없다.
    how_to_fix: 원천 등급 체계와 대상 등급 체계를 참조하는 버전형 RatingMapping을 권위 모델에 추가하고, 매핑 행별
      유효기간·승인 권위·변환 버전 및 비매핑 처리 방식을 명시한다. 산출 등급에는 사용한 매핑 버전을 기록한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 단일 등급 개념 기준
      failure_condition: 등급모형, 등급 경계 또는 스케일 간 매핑이 변경되거나 신규 스케일이 도입될 때
      impact: 소비자별 변환 결과가 갈라지고 과거 등급 산출의 재현성과 변경 전후 비교 가능성이 사라진다.
      evidence_refs:
        - materialized-input.md::entities.Borrower.attributes.internal_rating
        - materialized-input.md::entities.RiskRating.attributes.grade.note
        - materialized-input.md::entities.Exposure.attributes.risk_grade
        - materialized-input.md::notes[3개 스케일 변환]
    causal_path:
      root_cause_candidate: 스케일 간 변환을 온톨로지의 버전형 권위 개념으로 모델링하지 않고 외부 위키와 각 소비 시스템에 분산했다.
      root_cause_step_id: evolution-candidate-002.cause-002
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: 등급 변환 결과는 소비 시스템마다 독립적으로 결정될 수 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md::notes[변환은 각 소비 시스템이 수행한다]
            - materialized-input.md::classification_rules[Exposure.risk_grade 도출
              및 수동 조정]
        - cause_id: evolution-candidate-002.cause-002
          claim: 세 등급 스케일의 매핑 정의가 대상 파일에 없고 RiskRating 설명은 외부 위키를 가리킨다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md::entities.RiskRating.attributes.grade.note
            - materialized-input.md::entities.Borrower.attributes.internal_rating
            - materialized-input.md::entities.Exposure.attributes.risk_grade
      unresolved_beyond_evidence: 외부 위키 매핑의 실제 버전 관리 여부는 경계 밖이지만, 공유 온톨로지가 그 버전이나 적용
        계약을 참조하지 않아 연속성을 보장하지 못한다.
  - candidate_id: evolution-candidate-003
    target: credit-risk-ontology.yaml의 시간가변 산출·조정 규칙
    evidence_anchor: classification_rules의 risk_grade 수동 조정 및 시스템별 당일 환율 사용,
      ExposureAggregate의 월말 배치/as_of, RiskAppetite.threshold와 compliance_status
    claim: 시간에 따라 변하는 조정·환산·정책 규칙에 적용 시점과 규칙 버전의 연결이 없어 변경 후 과거 결과를 동일하게 재현할 수 없다.
    what: 보고팀의 등급 수동 조정에는 조정 사유·주체·유효기간이 없고, 한도 소진율은 각 시스템의 당일 환율을 사용한다.
      RiskAppetite 임계치와 준수 상태에도 적용 시점이나 정책 버전이 없다.
    why: 시장 상황, 환율 공급원 또는 리스크 성향 정책이 바뀌면 동일한 익스포저가 소비 시스템과 실행 시점에 따라 다른 등급·소진율·준수
      상태를 낼 수 있다. 새 정책 버전을 도입할 때 과거 결과와 새 결과를 병존시키는 구조가 없어 보고 연속성과 감사 가능성이 약화된다.
    how_to_fix: 조정, 환산, 한도·성향 정책을 유효기간과 버전을 가진 규칙/정책 개념으로 모델링하고 산출 결과에 규칙 버전, 기준시점,
      입력 스냅샷 또는 권위 데이터셋 식별자, 조정 주체와 사유를 기록한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템 사이의 시간적으로 안정적인 공통 산출 기준
      failure_condition: 시장 조정 기준, 환율 데이터, 집계 범위 또는 RiskAppetite 정책이 변경된 뒤 과거 또는 당일 결과를 재계산·비교할 때
      impact: 결과 차이가 업무 변화인지 규칙 버전 차이인지 구분할 수 없고 과거 보고 수치를 재현하기 어렵다.
      evidence_refs:
        - materialized-input.md::classification_rules[Exposure.risk_grade 수동 조정]
        - materialized-input.md::classification_rules[각 시스템의 당일 환율 테이블]
        - materialized-input.md::entities.ExposureAggregate.attributes.total_amount.note
        - materialized-input.md::entities.ExposureAggregate.attributes.as_of
        - materialized-input.md::entities.RiskAppetite.attributes.threshold
        - materialized-input.md::entities.RiskAppetite.attributes.compliance_status
    causal_path:
      root_cause_candidate: 시간가변 규칙과 정책을 버전·유효기간을 가진 권위 개념으로 분리하지 않고 현재값 또는 자유문장 규칙으로 표현했다.
      root_cause_step_id: evolution-candidate-003.cause-002
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 동일한 업무 데이터가 시스템별 환율과 수동 조정, 현재 정책에 따라 다른 결과를 낼 수 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md::classification_rules[보고서 팀 수동 조정]
            - materialized-input.md::classification_rules[각 시스템의 당일 환율 테이블]
            - materialized-input.md::entities.RiskAppetite.attributes.compliance_status
        - cause_id: evolution-candidate-003.cause-002
          claim: 산출 결과에서 사용한 조정·환율·정책 버전으로 연결되는 속성이나 관계가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md::entities.Exposure.attributes.risk_grade
            - materialized-input.md::entities.ExposureAggregate.attributes
            - materialized-input.md::entities.RiskAppetite.attributes
      unresolved_beyond_evidence: 각 운영 시스템이 별도 감사 로그나 정책 이력을 보존하는지는 현재 경계에서 확인할 수 없으나,
        공유 온톨로지는 그 식별자나 연결 계약을 제공하지 않는다.
domain_constraints_used: []
domain_context_assumptions:
  - 공유 개념 권위 문서는 서로 다른 소비 시스템이 같은 분류와 변환 규칙 버전을 식별할 수 있어야 한다.
  - 분류 코드, 등급 매핑, 환산 기준 및 리스크 정책은 운영 중 추가·변경될 수 있으며 과거 결과의 재현이 요구될 수 있다.
validation:
  unaddressable_candidates: []
