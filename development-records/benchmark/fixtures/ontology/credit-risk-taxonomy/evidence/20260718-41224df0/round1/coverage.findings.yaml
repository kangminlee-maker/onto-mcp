    claim: 차주의 정상 여신에서 연체·부실로 이어지는 신용위험 lifecycle 구간이 공유 모델에서 단절되어 있다.
    what: 연체와 default 상태가 의도적으로 제외되었지만 외부 체계의 상태를 참조하거나 등급·익스포저·담보·보고와 연결할 최소 경계 개념도
      없다.
    why: 리스크 엔진이나 보고 시스템이 연체·부실 분류를 필요로 하는 경우 이 온톨로지만으로 차주의 위험 상태 전이를 표현하거나 외부 시스템의
      상태를 공통 의미로 해석할 수 없다. 다만 실제 소비자 범위가 연체 이전 단계로 제한되는지는 현재 경계에서 확인할 수 없다.
    how_to_fix: 범위를 전체 여신 lifecycle로 확장해 Delinquency/DefaultEvent와 상태 전이를 정의하거나, 의도적
      분리를 유지한다면 external_credit_status_ref, authoritative system, 상태 매핑, 기준시각과
      동기화 계약을 최소 경계 개념으로 추가한다.
