  - candidate_id: coverage-candidate-004
    target: credit-risk-ontology.yaml — 한도 소진율과 환율의 권위
    evidence_anchor: Limit.approved_amount의 note는 승인 시스템 기록값과 CRM available_limit을
      합산 관리한다고 하며, classification_rules[1]은 통화가 다르면 각 시스템의 당일 환율 테이블을 사용하도록 한다.
    claim: 복수 시스템에 걸친 한도·환율 값의 단일 원본과 계산 스냅샷 개념이 누락되어 있다.
    what: 승인 한도와 가용 한도가 여러 시스템에 걸쳐 관리되고 환율도 각 시스템의 테이블을 사용하지만, authoritative source,
      우선순위, 환율 제공자·시각·버전과 계산 기준 통화가 정의되지 않는다.
    why: 시스템별 available_limit 또는 환율 테이블이 다르거나 갱신 시각이 어긋나면 동일 ExposureAggregate와
      Limit에서도 소진율이 달라진다. 온톨로지가 어느 결과를 권위 있는 값으로 채택할지 결정하지 못한다.
    how_to_fix: LimitBalance와 FxRateSnapshot 개념을 추가하고 각 값의 source_system, authority,
      as_of, currency pair, rate type/version을 정의한다. 소진율 규칙은 하나의 기준 통화와 동일 스냅샷을
      사용하도록 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 일관된 한도 소진율
      failure_condition: 복수 통화 또는 승인 시스템과 CRM 값이 함께 사용되는 경우
      impact: 시스템별 소진율과 한도 초과 판단이 달라져 운영 조치와 보고가 불일치할 수 있다.
      evidence_refs:
        - Limit.attributes.approved_amount.note
        - Limit.attributes.currency
        - ExposureAggregate.attributes.total_amount
        - ExposureAggregate.attributes.as_of
        - classification_rules[1]
    causal_path:
      root_cause_candidate: 외부 시스템별 값과 환율을 권위·시점이 식별된 공유 입력 개념으로 승격하지 않고 각 소비 시스템의 로컬 데이터에 위임했다.
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: 동일 차주에 대해 시스템별 한도 소진율이 달라질 수 있다.
