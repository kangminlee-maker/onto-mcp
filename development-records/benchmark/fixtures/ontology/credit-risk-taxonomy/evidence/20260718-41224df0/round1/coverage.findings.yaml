  - candidate_id: coverage-candidate-002
    target: credit-risk-ontology.yaml — 신용등급 분류체계와 권위
    evidence_anchor: Borrower.internal_rating은 1~10, RiskRating.grade는 R1~R5,
      Exposure.risk_grade는 AAA~CCC를 사용한다. notes는 변환을 각 소비 시스템이 수행한다고 하고,
      RiskRating.grade의 note는 매핑 테이블을 리스크팀 위키에서 참조하도록 한다.
    claim: 세 개 등급 체계 사이의 단일 권위와 정식 변환 개념이 누락되어 있다.
    what: 동일 신용위험을 나타내는 세 등급 스케일이 병존하지만 기준 스케일, 매핑 규칙, 매핑 버전, 적용 기간과 예외 처리의 권위가
      온톨로지에 없다.
    why: 각 소비 시스템이 자체 변환을 수행하면 리스크 엔진과 보고 시스템이 동일 입력에 서로 다른 등급을 부여할 수 있다. 외부 위키 매핑은
      이 온톨로지가 지향하는 공유 개념 권위의 일부가 아니며 버전 재현성도 제공하지 않는다.
    how_to_fix: 하나의 canonical rating scale과 authoritative source를 지정하고, 다른 스케일을 별도
      RatingScale/RatingMapping 개념으로 모델링하여 source_grade, target_grade,
      mapping_version, effective period, owner를 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템 사이의 공통 등급 분류 및 개념 권위
      failure_condition: 서로 다른 소비 시스템이 동일 차주나 익스포저의 등급을 변환할 때
      impact: 분류 결과가 소비자별로 달라져 집계, 한도 판단과 보고 수치의 비교 가능성이 무너진다.
      evidence_refs:
        - Borrower.attributes.internal_rating
        - Exposure.attributes.risk_grade
        - RiskRating.attributes.grade
        - classification_rules[0]
        - notes[0]
    causal_path:
      root_cause_candidate: 병존 등급 체계를 하나의 권위 있는 분류체계와 버전된 매핑으로 통합하지 않고 소비자별 변환에 위임했다.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
