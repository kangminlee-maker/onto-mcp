  - candidate_id: coverage-candidate-003
    target: credit-risk-ontology.yaml — Exposure.risk_grade 수동 조정
    evidence_anchor: classification_rules[0]은 보고서 팀이 시장 상황에 따라 Exposure.risk_grade를
      수동 조정할 수 있다고 정의하지만, entities에는 조정 사건·행위자·시각·근거·승인·원래 값 속성이 없다.
    claim: 수동 등급 조정을 추적할 감사 증거 개념이 누락되어 있다.
    what: 보고서 팀의 수동 조정 권한은 정의되어 있으나 누가 언제 어떤 근거로 어떤 원래 값을 무엇으로 바꾸었는지 기록할 모델이 없다.
    why: 조정된 보고 등급을 엔진 산출값과 구분하거나 재현할 수 없고, 오류·이의제기·감사 시 변경 책임과 근거를 확인할 수 없다.
    how_to_fix: RatingAdjustment 또는 OverrideEvent를 추가해 original_grade,
      adjusted_grade, actor, adjusted_at, reason/evidence_ref, approval, status,
      effective period를 정의하고 Exposure.risk_grade가 해당 사건에서 도출되도록 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 공유 등급 결과의 추적 가능성과 보고 통제
      failure_condition: 보고서 팀이 엔진 산출 등급을 수동 조정할 때
      impact: 최종 등급의 출처와 정당성을 검증하거나 변경 전 상태를 재현할 수 없어 보고 신뢰가 약화된다.
      evidence_refs:
        - classification_rules[0]
        - Exposure.attributes.risk_grade
        - RiskRating.attributes.grade
    causal_path:
      root_cause_candidate: 통제 행위를 상태 덮어쓰기로만 허용하고 별도의 감사 가능한 조정 사건으로 모델링하지 않았다.
      root_cause_step_id: coverage-candidate-003.cause-002
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: 수동 조정된 등급의 행위자·시각·근거를 추적할 수 없다.
