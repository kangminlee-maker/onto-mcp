    target: credit-risk-ontology.yaml — 시점 의존 개념 전반
    evidence_anchor: Borrower.internal_rating, Exposure.risk_grade,
      RiskRating.grade/score, Limit.approved_amount,
      RiskAppetite.threshold/compliance_status에는 유효기간·기준시각·이력 속성이 없고,
      ExposureAggregate.as_of와 Collateral.appraised_at만 개별 시점을 표현한다.
    claim: 주요 리스크 값의 과거 시점 상태를 재구성할 시간 차원이 누락되어 있다.
    what: 등급, 점수, 승인 한도, 리스크 성향 한도와 준수 상태가 현재값 형태로만 정의되어 변경 이력과 특정 기준일의 값을 표현할 수 없다.
    why: 리스크 엔진과 보고 시스템이 서로 다른 시점의 값을 읽거나 과거 보고서를 재생할 때 당시 적용된 등급·한도·임계값을 온톨로지만으로
      식별할 수 없다. 일부 개념에만 시점 속성이 있어 전체 계산 스냅샷의 시간 일관성도 보장되지 않는다.
    how_to_fix: 시간에 따라 변하는 값을 버전 또는 이력 엔터티로 분리하고 effective_from, effective_to,
      recorded_at, as_of, supersedes와 산출 모델/정책 버전을 공통 규칙으로 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 재현 가능한 개념 권위 문서
      failure_condition: 등급·한도·리스크 성향 값이 변경된 뒤 과거 기준일 계산이나 보고서를 재구성할 때
      impact: 소비 시스템이 당시 적용값을 결정할 수 없어 동일 기준일 결과가 달라지고 보고 감사 가능성이 약화된다.
