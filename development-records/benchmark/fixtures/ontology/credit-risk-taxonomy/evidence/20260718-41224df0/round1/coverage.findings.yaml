    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 여신 리스크 분류 기준
      failure_condition: 소비 시스템이 연체·부실 상태를 포함한 신용위험 분류나 보고를 수행할 때
      impact: 핵심 위험 상태가 공통 모델 밖에서 소비자별 의미로 해석되어 전체 lifecycle 보고와 등급 연계의 일관성이 약화된다.
