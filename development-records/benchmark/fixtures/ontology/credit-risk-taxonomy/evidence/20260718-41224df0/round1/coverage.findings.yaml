        - RiskRating.attributes.grade
        - RiskRating.attributes.score
        - Limit.attributes.approved_amount
        - RiskAppetite.attributes.threshold
        - RiskAppetite.attributes.compliance_status
        - ExposureAggregate.attributes.as_of
        - Collateral.attributes.appraised_at
