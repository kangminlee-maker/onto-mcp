  - candidate_id: coverage-candidate-005
    target: credit-risk-ontology.yaml — 연체·부실 lifecycle 범위
    evidence_anchor: notes[1]은 연체/부실(default) 상태를 별도 연체관리 시스템에서 다루며 이 온톨로지의 범위 밖이라고
