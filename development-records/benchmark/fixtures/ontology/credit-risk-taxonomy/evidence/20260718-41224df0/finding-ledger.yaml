  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260718-41224df0/round1/coverage.findings.yaml#coverage-candidate-002
    target: credit-risk-ontology.yaml — 신용등급 분류체계와 권위
    evidence_anchor: Borrower.internal_rating은 1~10, RiskRating.grade는 R1~R5,
      Exposure.risk_grade는 AAA~CCC를 사용한다. notes는 변환을 각 소비 시스템이 수행한다고 하고,
      RiskRating.grade의 note는 매핑 테이블을 리스크팀 위키에서 참조하도록 한다.
