findings:
  - candidate_id: coverage-candidate-001
    target: credit-risk-ontology.yaml notes — 연체/부실(default) 상태의 범위 제외
    evidence_anchor: 'credit-risk-ontology.yaml: notes[1] "연체/부실(default) 상태는 별도
      시스템(연체관리)에서 다루므로 이 온톨로지의 범위 밖이다."'
    claim: 여신 리스크 분류 온톨로지에 부실/연체(default) 상태 하위 영역이 통째로 부재하여, 등급·익스포저 개념이 가장 중요한 리스크
      상태와 연결될 수 없다.
    what: Borrower와 Exposure 어디에도 연체 일수, 부실 인식, 채무불이행 상태를 표현하는 개념이 없고, notes에서 이를 범위
      밖으로 선언한다. 그러나 같은 문서가 '리스크 엔진과 보고서 시스템이 공유하는 개념 권위'를 지향한다고 선언한다.
    why: "여신 리스크 분류에서 default/연체는 등급 산출(부실 차주 강등), 한도 통제, 보고(부실채권 비율) 모두의 핵심 입력이다.
      공유 개념 권위에서 이 하위 영역이 빠지면 리스크 엔진과 보고 시스템이 각자 연체관리 시스템과의 접합 개념(예: 부실 익스포저, 부실
      인식 시점)을 독자 정의하게 되어 공유 기준이라는 목적이 그 지점에서 실패한다. 범위 제외 자체는 선택일 수 있으나, 최소한 경계
      개념(default 상태 참조, 부실 익스포저 표시)이 있어야 분류체계가 닫힌다."
    how_to_fix: "전체 연체관리를 흡수하지 말고 경계 개념만 추가: Borrower 또는 Exposure에 default_status(또는
      performing/non_performing 표시)와 그 권위가 연체관리 시스템임을 명시하는 참조 개념을 정의하고,
      risk_grade/RiskRating과의 상호작용 규칙(부실 시 등급 처리)을 classification_rules에 1줄로
      명시한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서(헤더 주석 선언)
      failure_condition: 부실/연체 상태가 등급·익스포저·한도 판단에 개입하는 모든 경우(부실 차주 등급, NPL 보고, 부실 익스포저
        한도 차감)에서 두 소비 시스템이 서로 다른 자체 정의를 사용할 때
      impact: 공유 기준의 가장 리스크가 큰 구간(부실)에서 개념 권위가 공백이 되어, 엔진과 보고서의 부실 분류가 어긋나도 이 문서로 판정할
        수 없다.
      evidence_refs:
        - 'credit-risk-ontology.yaml: 헤더 주석 "리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를
          지향한다"'
        - "credit-risk-ontology.yaml: notes[1]"
    causal_path:
      root_cause_candidate: 온톨로지 범위 설계 시 시스템 경계(연체관리 시스템 별도)를 개념 경계로 그대로 전사하면서, 경계를 넘는
        공유 개념(부실 상태)을 정의하지 않은 범위 결정
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: 온톨로지에 default/연체 관련 엔티티·속성·enum 값이 전혀 없다
          relation_to_previous: null
          evidence_refs:
            - "credit-risk-ontology.yaml: entities 전체(부실 상태 속성 부재)"
        - cause_id: coverage-candidate-001.cause-002
          claim: notes[1]이 연체/부실을 별도 시스템 사유로 명시적으로 범위 밖으로 선언한다
          relation_to_previous: causes
          evidence_refs:
            - "credit-risk-ontology.yaml: notes[1]"
        - cause_id: coverage-candidate-001.cause-003
          claim: 시스템 분담 경계를 개념 경계로 동일시한 범위 결정이 경계 개념(부실 표시·참조)까지 함께 배제했다
          relation_to_previous: causes
          evidence_refs:
            - 'credit-risk-ontology.yaml: notes[1] "별도 시스템(연체관리)에서 다루므로"'
      unresolved_beyond_evidence: 연체관리 시스템이 실제로 어떤 부실 개념을 제공하는지는 경계 밖 정보다.
  - candidate_id: coverage-candidate-002
    target: credit-risk-ontology.yaml — 시점 의존 값 전반의 유효기간·이력 차원 부재
    evidence_anchor: "credit-risk-ontology.yaml: Borrower.internal_rating,
      Exposure.risk_grade, Exposure.ltv, RiskRating(grade/score),
      RiskAppetite.compliance_status — 어디에도 valid_from/valid_to 또는 이력 개념 없음"
    claim: 등급·LTV·준수 상태 등 시점 의존 값들이 모두 현재값 단일 슬롯으로만 정의되어 과거 시점의 리스크 상태를 재구성할 수 없다.
    what: internal_rating, risk_grade, RiskRating.grade/score, ltv,
      compliance_status는 모두 시간에 따라 변하는 값인데, 유효기간·산출시점·이력 속성이 전무하다. 시점 개념이 있는 곳은
      Collateral.appraised_at과 ExposureAggregate.as_of 두 곳뿐이다.
    why: 리스크 보고는 본질적으로 시점 보고(월말 기준 등급 분포, 기준일 한도 소진율)이고, 감독 보고·감사에서는 과거 시점 값 재구성이
      요구된다. 현재값만 가진 개념 모델 위에서는 보고 시스템이 자체 스냅샷 체계를 만들게 되고, 그 스냅샷 의미(언제 기준 값인지)가
      온톨로지 밖에서 정의되어 엔진과 보고서 간 '같은 기준일의 등급'이 달라질 수 있다.
    how_to_fix: 등급류(RiskRating, risk_grade, internal_rating)에 최소한
      effective_from/effective_to 또는 rated_at 속성을 추가하고, '현재값은 최신 유효 레코드의 투영'이라는
      규칙을 명시한다. ltv에는 산정 기준일을 추가한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고서 시스템이 공유하는 시점 기준 리스크 값의 개념 권위
      failure_condition: 과거 기준일의 등급·LTV·준수 상태를 조회하거나 재구성해야 하는 모든 보고·감사 시나리오
      impact: 두 소비 시스템이 각자 이력 보존 방식을 임의 설계하게 되어, 같은 기준일 보고 값이 시스템 간 불일치해도 온톨로지로 판정 불가.
      evidence_refs:
        - "credit-risk-ontology.yaml: RiskRating attributes(시점 속성 부재)"
        - 'credit-risk-ontology.yaml: Exposure.risk_grade note "보고서 팀이 사용"'
        - "credit-risk-ontology.yaml: ExposureAggregate.as_of(유일하게 시점이 있는 집계와의
          비대칭)"
    causal_path:
      root_cause_candidate: 엔티티를 '현재 상태 레코드'로만 모델링하고 시점 의존 값과 시불변 식별자를 구분하는 시간성 설계 단계가 생략됨
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: 등급·LTV·준수 상태 속성에 유효기간/이력 개념이 없다
          relation_to_previous: null
          evidence_refs:
            - "credit-risk-ontology.yaml:
              Borrower/Exposure/RiskRating/RiskAppetite attributes"
        - cause_id: coverage-candidate-002.cause-002
          claim: 시점 개념이 Collateral.appraised_at과 ExposureAggregate.as_of에만 산발적으로 존재해, 시간성이
            체계적 차원이 아니라 개별 속성 수준에서만 다뤄졌음을 보여준다
          relation_to_previous: symptom_of
          evidence_refs:
            - "credit-risk-ontology.yaml: Collateral.appraised_at"
            - "credit-risk-ontology.yaml: ExposureAggregate.as_of"
        - cause_id: coverage-candidate-002.cause-003
          claim: 현재값 중심 모델링 관행이 시점 의존 값 전반의 이력 차원 결손의 시작 원인이다
          relation_to_previous: causes
          evidence_refs:
            - "credit-risk-ontology.yaml: entities 전반의 단일 현재값 슬롯 구조"
      unresolved_beyond_evidence: 소비 시스템들이 자체 이력 테이블을 이미 보유했는지는 경계 밖 정보다.
  - candidate_id: coverage-candidate-003
    target: credit-risk-ontology.yaml — Exposure/Limit/Collateral lifecycle 상태 부재
    evidence_anchor: "credit-risk-ontology.yaml: Exposure attributes(상태 속성 없음),
      Limit attributes(만료·해지 없음), Collateral attributes(해지·처분 없음)"
    claim: 상태를 갖는 핵심 엔티티(Exposure, Limit, Collateral)에 도입부터 종료까지의 lifecycle 개념이 전혀 없다.
    what: Exposure에는 활성/상환완료/상각/재조정 같은 상태가 없고, Limit에는 승인·유효기간·만료·해지가 없으며,
      Collateral에는 담보 해지·처분 구간이 없다. 모든 엔티티가 존재 시점부터 영구 활성인 것처럼 정의된다.
    why: lifecycle이 없으면 집계 의미가 무너진다 — ExposureAggregate가 '모든 Exposure.amount의 합'으로
      정의되는데 상환 완료된 익스포저를 제외할 개념적 근거가 없다. Limit 소진율 규칙도 만료된 한도와 유효 한도를 구분하지 못한다.
      종료 구간이 없는 분류체계는 운영 데이터가 쌓일수록 집계·보고 값이 실제와 괴리된다.
    how_to_fix: "Exposure에 status enum(예: active, closed, written_off), Limit에
      effective_from/expires_at과 상태, Collateral에 released/disposed 구간을 추가하고,
      ExposureAggregate 정의를 '활성 Exposure의 합'으로 한정한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: ExposureAggregate·Limit 소진율 등 집계 개념의 정확성과 리스크 엔진의 한도 통제 기준
      failure_condition: 상환 완료·상각·만료된 레코드가 존재하는 정상 운영 상태에서 집계와 소진율을 계산할 때
      impact: 종료된 익스포저·한도가 집계에 포함되는지 여부를 온톨로지가 답하지 못해, 한도 위반 판정과 보고 수치가 시스템별 임의 해석에
        의존하게 된다.
      evidence_refs:
        - 'credit-risk-ontology.yaml: ExposureAggregate.definition "모든
          Exposure.amount의 합"'
        - "credit-risk-ontology.yaml: classification_rules[1] 한도 소진율 정의"
        - "credit-risk-ontology.yaml: Exposure/Limit/Collateral attributes"
    causal_path:
      root_cause_candidate: 엔티티 정의가 신규 취급 시점의 스냅샷 관점에서만 작성되어 종료·소멸 구간이 개념 공간에서 누락됨
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: Exposure/Limit/Collateral에 상태·종료 속성이 없다
          relation_to_previous: null
          evidence_refs:
            - "credit-risk-ontology.yaml: 각 엔티티 attributes"
        - cause_id: coverage-candidate-003.cause-002
          claim: 그 결과 '모든 Exposure.amount의 합'이라는 집계 정의가 종료 레코드 포함 여부에 대해 미정의가 된다
          relation_to_previous: causes
          evidence_refs:
            - "credit-risk-ontology.yaml: ExposureAggregate.definition"
        - cause_id: coverage-candidate-003.cause-003
          claim: 취급(origination) 시점 중심의 모델링이 lifecycle 전 구간 커버리지 결손의 시작 원인이다
          relation_to_previous: causes
          evidence_refs:
            - 'credit-risk-ontology.yaml: Exposure.ltv note "심사 시점에 심사역이
              입력한다"(심사 시점 관점의 흔적)'
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: credit-risk-ontology.yaml classification_rules — risk_grade 수동 조정의 감사 증거
      개념 부재
    evidence_anchor: 'credit-risk-ontology.yaml: classification_rules[0] "보고서 팀이 시장
      상황에 따라 수동 조정할 수 있다"'
    claim: 등급 수동 조정(override)이라는 통제 대상 행위가 허용되어 있으나, 행위자·시각·근거를 추적할 증거 개념이 온톨로지에 없다.
    what: risk_grade는 RiskRating.grade에서 도출되지만 보고서 팀이 수동 조정할 수 있다고 규칙에 명시된다. 그러나 조정
      사실, 조정자, 조정 시각, 조정 사유, 조정 전 값을 담는 개념(override/adjustment 엔티티나 속성)이 어디에도
      없다.
    why: 수동 조정이 기록 개념 없이 허용되면 보고서의 등급과 엔진 산출 등급이 달라진 익스포저를 사후에 식별·소명할 수 없다. 등급
      override는 신용 리스크 관리에서 대표적인 통제·감사 대상 행위이며, 증거 개념이 없는 채로 규칙만 두면 '조정 가능'이 사실상
      '무추적 변경 가능'이 된다.
    how_to_fix: "GradeOverride(또는 risk_grade에 부속된 adjustment 기록) 개념을 추가: 원천 등급, 조정
      등급, 조정자, 조정 시각, 사유, 유효기간을 속성으로 갖게 하고, classification_rules의 수동 조정 문구가 이
      개념을 경유하도록 수정한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 등급의 신뢰 가능성과 엔진-보고서 간 등급 불일치의 소명 가능성
      failure_condition: 보고서 팀이 실제로 등급을 수동 조정한 모든 경우(규칙이 명시적으로 허용하므로 발생이 전제됨)
      impact: 엔진 등급과 보고 등급의 차이가 정당한 조정인지 오류인지 구분할 개념적 수단이 없어, 공유 권위 문서로서의 등급 신뢰가 무너진다.
      evidence_refs:
        - "credit-risk-ontology.yaml: classification_rules[0]"
        - "credit-risk-ontology.yaml: entities(override 기록 개념 부재)"
    causal_path:
      root_cause_candidate: 행위 규칙(수동 조정 허용)을 classification_rules 산문으로만 도입하고, 그 행위가
        요구하는 증거 개념을 entities에 함께 추가하지 않은 규칙-개념 비동기 설계
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: 수동 조정 행위가 규칙으로 허용되어 있다
          relation_to_previous: null
          evidence_refs:
            - "credit-risk-ontology.yaml: classification_rules[0]"
        - cause_id: coverage-candidate-004.cause-002
          claim: 조정을 기록할 엔티티·속성이 entities에 존재하지 않는다
          relation_to_previous: causes
          evidence_refs:
            - "credit-risk-ontology.yaml: entities 전체"
        - cause_id: coverage-candidate-004.cause-003
          claim: 규칙은 산문으로, 개념은 entities로 분리 관리되면서 규칙이 전제하는 개념의 존재 검증이 누락된 것이 시작 원인이다
          relation_to_previous: causes
          evidence_refs:
            - "credit-risk-ontology.yaml: classification_rules 섹션과 entities 섹션의
              구조적 분리"
      unresolved_beyond_evidence: 실제 조정이 외부 시스템에 기록되고 있을 가능성은 경계 밖이다.
  - candidate_id: coverage-candidate-005
    target: credit-risk-ontology.yaml — 복수 시스템 병행 관리 값들의 단일 권위 지정 부재
    evidence_anchor: 'credit-risk-ontology.yaml: Limit.approved_amount note "영업점
