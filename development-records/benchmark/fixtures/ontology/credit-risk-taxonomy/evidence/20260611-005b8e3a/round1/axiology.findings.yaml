  - candidate_id: axiology-candidate-003
    target: credit-risk-ontology.yaml — ExposureAggregate 월말 배치 시차 위에 정의된
      RiskAppetite 위반 개념
    evidence_anchor: 'credit-risk-ontology.yaml
      entities.ExposureAggregate.attributes.total_amount.note: "월말 배치로 계산해 저장.
      일중 신규 여신은 다음 배치까지 미반영." + entities.RiskAppetite.definition:
      "ExposureAggregate가 RiskAppetite를 초과하면 RiskAppetite 위반"'
    claim: 리스크 성향 위반이라는 핵심 통제 개념이 월 단위 지연 데이터 위에 정의되어, 리스크 관리라는 시스템 목적에 비춰 정당화되지 않은
      시간성 트레이드오프를 수용하고 있다.
    what: RiskAppetite 위반 여부는 ExposureAggregate 초과로 정의되는데,
      ExposureAggregate.total_amount는 월말 배치로만 갱신되고 일중 신규 여신은 다음 배치까지 미반영이다. 따라서
      위반은 최대 한 달까지 개념적으로 탐지 불가능하다.
    why: "여신 리스크 온톨로지의 목적상 RiskAppetite는 익스포저 집중을 제때 통제하기 위한 가치 약속이다. 그 위반 개념을 구조적으로
      한 달 지연된 집계 위에 정의한 것은, 배치 운영 편의(국소 최적화)를 위해 통제 적시성(목적)을 희생한 트레이드오프이며 온톨로지
      어디에도 이 수용의 정당화가 없다. 리뷰 의도가 명시한 '시간성 관점의 운영 위험'에 정면으로 해당한다.
      value_type=purpose/tradeoff, alignment_direction=misaligned. (앵커:
      review-value-alignment-criteria criterion user-request-intent; 대상 헤더의 '리스크
      관리의 개념 모델' 자기선언)"
    how_to_fix: RiskAppetite 위반 판정의 기준 시점(as_of 의미)과 허용 지연을 개념 차원에서 명시하고, 일중 통제가
      필요하면 위반 판정을 배치 집계가 아닌 실시간성 있는 익스포저 합산 개념에 바인딩하거나, 최소한 '위반 판정은 월말 기준이며 일중
      위반은 범위 밖'임을 명시적 한계로 선언한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 여신 리스크 관리의 개념 모델로서 리스크 성향 한도 통제의 유효성(헤더 자기선언 + 리뷰 의도의 시간성·운영 위험 축)
      failure_condition: 일중 대규모 신규 여신으로 실제 총익스포저가 threshold를 초과해도 다음 월말 배치까지
        compliance_status가 compliant로 유지된다.
      impact: 위반 탐지가 개념 정의상 최대 1개월 지연되므로, 이 온톨로지를 공유 기준으로 쓰는 엔진·보고서 모두가 같은 맹점을 갖게 된다.
        공유 기준이 오히려 맹점을 표준화한다.
      evidence_refs:
        - credit-risk-ontology.yaml
          entities.ExposureAggregate.attributes.total_amount.note
        - credit-risk-ontology.yaml entities.RiskAppetite.definition
        - credit-risk-ontology.yaml
          entities.RiskAppetite.attributes.compliance_status
        - .onto/review/20260611-005b8e3a/execution-preparation/review-value-alignment-criteria.yaml
          criterion_id=user-request-intent
    causal_path:
      root_cause_candidate: 집계(ExposureAggregate)를 월말 배치 구현 사정에 맞춰 정의하고, 그 위에 통제
        개념(RiskAppetite 위반)을 시간성 검토 없이 쌓은 설계 결정
      root_cause_step_id: axiology-candidate-003.cause-003
      steps:
        - cause_id: axiology-candidate-003.cause-001
