          claim: 보고서 팀이 risk_grade를 수동 조정할 수 있어 엔진 등급과 보고 등급이 분기할 수 있다(표면 관찰).
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml classification_rules[0]
        - cause_id: axiology-candidate-002.cause-002
          claim: 분기 가능성은 조정 조건·승인·기록 개념이 온톨로지에 부재하기 때문에 통제 불가능해진다.
          relation_to_previous: symptom_of
          evidence_refs:
            - credit-risk-ontology.yaml classification_rules[0]
            - credit-risk-ontology.yaml entities.Exposure (override 관련 속성 부재)
        - cause_id: axiology-candidate-002.cause-003
          claim: 이 부재는 risk_grade를 '보고서 팀이 사용'하는 속성으로만 보고 권위·이력 요구를 고려하지 않은 설계 결정에서 비롯된다.
          relation_to_previous: causes
          evidence_refs:
