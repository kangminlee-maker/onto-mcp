  - candidate_id: axiology-candidate-002
    target: credit-risk-ontology.yaml classification_rules[0] — 보고서 팀의 risk_grade 수동
      조정 허용
    evidence_anchor: 'credit-risk-ontology.yaml classification_rules[0]:
      "Exposure.risk_grade는 RiskRating.grade에서 도출하되, 보고서 팀이 시장 상황에 따라 수동 조정할 수
      있다."'
    claim: 단일 소비자(보고서 팀)의 무조건적 수동 조정 권한은 보고 편의라는 국소 최적화로 공유 개념 기준의 진실 단일성을 훼손한다.
    what: 엔진 산출 등급(RiskRating.grade)에서 도출되어야 할 Exposure.risk_grade를 보고서 팀이 '시장 상황에
      따라' 수동 조정할 수 있으며, 조정의 조건·승인·기록·만료에 대한 규정이 전혀 없다.
    why: "공유 개념 기준의 가치는 엔진과 보고서가 같은 등급 진실을 보는 데 있다. 이 규칙은 보고 측의 유연성(국소 최적화)을 위해 도출
      관계를 임의 우회 가능하게 만들어, 두 시스템의 등급이 조용히 분기하는 것을 온톨로지 차원에서 허가한다. '시장 상황'이라는 무한정
      조건과 거버넌스 부재는 명시적 정당화 없이 수용된 트레이드오프다. value_type=tradeoff/authority,
      alignment_direction=misaligned. (앵커: 헤더 주석의 공유 권위 목적;
      review-value-alignment-criteria criterion user-request-intent의 '권위 관점 운영
      위험')"
    how_to_fix: 수동 조정을 override라는 명시적 개념으로 분리하고(조정 사유, 승인 주체, 유효기간, 원 등급 보존 필드), 조정된
      등급과 엔진 도출 등급이 모두 보이도록 한다. 최소 수정으로는 규칙에 조정 조건과 기록 의무를 명문화한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 동일한 등급 개념 진실을 공유한다는 권위 약속
      failure_condition: 보고서 팀이 등급을 조정한 순간부터 보고서의 risk_grade와 엔진의 RiskRating.grade가
        분기하며, 어느 쪽이 권위인지 온톨로지가 답하지 못한다.
      impact: 등급이라는 핵심 리스크 개념에서 진실 위치가 비결정적이 되어, 이 온톨로지를 공유 기준으로 채택하는 목적이 실패한다. 감사·재현
        관점에서도 조정 이력이 개념적으로 존재하지 않는다.
      evidence_refs:
        - credit-risk-ontology.yaml classification_rules[0]
        - credit-risk-ontology.yaml entities.Exposure.attributes.risk_grade.note
        - credit-risk-ontology.yaml header comment
    causal_path:
      root_cause_candidate: 도출 값(risk_grade)에 대한 권위를 도출 원천(RiskRating)이 아닌 소비 팀에게 무조건적으로 부여한 규칙 설계
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
