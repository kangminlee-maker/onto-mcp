    what: 동일한 차주 신용도를 표현하는 3개 등급 스케일(internal_rating 1~10, R1~R5, AAA~CCC)이 병존하는데,
      온톨로지는 스케일 간 매핑을 정의하지 않고 '각 소비 시스템이 수행' 및 '리스크팀 위키 참조'로 권위를 외부화했다.
    why: "이 문서의 선언된 존재 이유(헤더 주석)와 리뷰 요청 의도(review-value-alignment-criteria criterion
      user-request-intent)는 모두 '리스크 엔진과 보고 시스템이 공유할 개념 기준'이다. 두 시스템이 같은 차주를 비교
      가능하게 만드는 핵심이 바로 등급 스케일 매핑인데, 정확히 그 지점에서 권위를 포기했다. '역사적 이유'는 병존의 설명이지 매핑 권위
      부재의 정당화가 아니며, 이는 명시적 정당화 없이 수용된 숨겨진 트레이드오프다. value_type=purpose/authority,
