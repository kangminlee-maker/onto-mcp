        - cause_id: axiology-candidate-001.cause-003
          claim: 보고서 팀이 Exposure.risk_grade를 시장 상황에 따라 수동 조정할 수 있어 엔진 산출 등급과 보고 등급의 우선순위가
            불명확해집니다.
