    what: RiskRating.grade는 Borrower.internal_rating과의 매핑을 외부 위키에 두고, notes는 세 등급
      스케일 변환을 각 소비 시스템이 수행한다고 한다. Limit.approved_amount는 승인 시스템 값이면서 CRM의
      available_limit과 합산 관리된다고 하며, 통화가 다르면 각 시스템의 당일 환율 테이블을 사용한다고 한다. 그러나
      canonical_source, precedence, mapping_version, fx_source 같은 권위 지정 개념이 없다.
    why: 리스크 엔진과 보고 시스템이 공유할 기준이라면 여러 시스템이 같은 의미의 값 또는 파생값을 관리할 때 어느 값이 기준인지, 매핑·환산
      충돌 시 어떤 원본을 따르는지 닫혀 있어야 한다. 현재는 변환과 환산을 각 소비 시스템에 맡기므로 동일 차주와 익스포저에 대해
      시스템별 등급·한도 소진율·통화 환산 결과가 달라질 수 있다.
    how_to_fix: RatingScaleMapping, SourceAuthority, FxRateSource/ConversionPolicy
      같은 개념을 추가한다. 각 병행 값에 canonical_source_system, precedence_order,
      mapping_version/effective_date, conflict_resolution_rule을 붙이고, 소비 시스템별 변환은
      권위 있는 매핑의 projection으로 제한한다.
    upstream_evidence_required: false
