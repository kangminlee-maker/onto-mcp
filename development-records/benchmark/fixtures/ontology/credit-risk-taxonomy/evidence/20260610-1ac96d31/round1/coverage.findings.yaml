    what: 온톨로지는 여신 리스크 관리의 개념 모델이라고 선언하고 RiskAppetite compliance_status만 상태값으로 둔다.
      그러나 notes에서 연체/부실(default) 상태는 별도 시스템에서 다루므로 범위 밖이라고 한다. 그 결과 정상 익스포저가 연체,
      부실, 회수, 상각, 해제 등으로 이동하는 신용 리스크 상태 lifecycle 또는 최소한 외부 상태 참조 경계가 없다.
