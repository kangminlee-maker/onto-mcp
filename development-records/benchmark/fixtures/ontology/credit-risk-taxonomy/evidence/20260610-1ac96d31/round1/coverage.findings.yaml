    claim: 시점 의존 리스크 값에 유효기간과 이력 개념이 빠져 있어 과거 시점 기준 등급을 재구성할 수 없다.
    what: Borrower.internal_rating, Exposure.risk_grade, RiskRating.grade/score는 모두
      변하는 리스크 값이지만 effective_from/effective_to, rating_date, superseded_by,
      revision_reason 같은 이력 차원이 없다. ExposureAggregate만 as_of를 갖고 있어 총익스포저는
      시점화되지만 그 산출·보고에 쓰이는 등급 값은 같은 시간축으로 닫히지 않는다.
    why: 이 온톨로지는 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향한다. 그런데 핵심 분류값인 차주 등급, 엔진 등급, 보고
      등급에 이력 또는 유효기간이 없으면 보고 시스템은 과거 보고일의 등급을 재현할 수 없고, 리스크 엔진 산출과 보고 등급 사이의 시점
      불일치를 설명할 개념도 없다. ExposureAggregate.as_of가 존재한다는 점은 시점 기준 보고가 필요한 모델임을
      보여주지만, 같은 시점성이 등급 쪽에는 누락되어 있다.
    how_to_fix: RatingSnapshot 또는 RatingHistory 같은 개념을 추가하고,
      Borrower.internal_rating, RiskRating.grade/score, Exposure.risk_grade에
      산출시각, 적용시작일, 적용종료일, 원천, 이전/다음 버전 참조를 부여한다. ExposureAggregate.as_of와 동일한
      기준일로 조인 가능한 시점 계약도 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 여신 리스크 분류 기준
      failure_condition: 과거 보고일 또는 월말 배치 기준으로 차주/익스포저 등급을 재현하거나 엔진 산출 등급과 보고 등급을 대조해야 하는 경우
      impact: 핵심 분류값의 시간축이 닫히지 않아 동일 익스포저가 어느 시점에 어떤 등급으로 보고되었는지 검증할 수 없고, 공유 권위 문서로서의
