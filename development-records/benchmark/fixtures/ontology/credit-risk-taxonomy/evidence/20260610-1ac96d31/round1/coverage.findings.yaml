    claim: 수동 조정·심사 입력·승인 행위에 행위자, 시각, 근거를 추적하는 감사 증거 개념이 없다.
    what: Exposure.ltv는 심사 시점에 심사역이 입력한다고 되어 있고, Limit.approved_amount는 승인 시스템이
      기록한다고 되어 있으며, Exposure.risk_grade는 보고서 팀이 시장 상황에 따라 수동 조정할 수 있다. 그러나
      ManualAdjustment, ApprovalEvent, InputEvidence, actor, acted_at,
      reason_code, source_document 같은 행위 증거 개념은 정의되어 있지 않다.
    why: 수동 조정과 승인 입력은 리스크 분류와 한도 사용률에 직접 영향을 주는 통제 행위다. 이 행위들의 증거 개념이 없으면 리스크 엔진
      결과와 보고 등급이 달라졌을 때 누가 언제 어떤 근거로 바꾸었는지 온톨로지 차원에서 추적할 수 없다. 이는 공유 기준 문서가 운영
      통제와 감사 추적까지 포괄해야 하는 범위에서 중요한 결손이다.
    how_to_fix: ManualRiskGradeAdjustment, LtvAssessmentInput, LimitApprovalEvent 같은
      행위 엔티티를 추가하고 actor_ref, acted_at, reason, evidence_ref, source_system,
      previous_value, new_value를 포함한다. Exposure.risk_grade, Exposure.ltv,
      Limit.approved_amount와 해당 행위 엔티티의 관계를 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템 간 수동 조정 및 승인값의 통제 가능한 공유 기준
      failure_condition: 보고서 팀의 등급 수동 조정, 심사역의 LTV 입력, 승인 한도 기록이 리스크 산출이나 보고 수치에 영향을 주는 경우
      impact: 값 변경의 행위자·시각·근거가 개념 모델에서 빠져 감사 추적, 이의 제기, 재처리, 운영 통제가 온톨로지 내부에서 지원되지 않는다.
      evidence_refs:
        - materialized-input.md:35
        - materialized-input.md:64
        - materialized-input.md:92
    causal_path:
