    claim: 시점 의존 리스크 값에 유효기간과 이력 개념이 빠져 있어 과거 시점 기준 등급을 재구성할 수 없다.
    lens_rationale_summary: 이 온톨로지는 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향한다. 그런데 핵심
      분류값인 차주 등급, 엔진 등급, 보고 등급에 이력 또는 유효기간이 없으면 보고 시스템은 과거 보고일의 등급을 재현할 수 없고,
      리스크 엔진 산출과 보고 등급 사이의 시점 불일치를 설명할 개념도 없다. ExposureAggregate.as_of가 존재한다는 점은
      시점 기준 보고가 필요한 모델임을 보여주지만, 같은 시점성이 등급 쪽에는 누락되어 있다.
    proposed_action: RatingSnapshot 또는 RatingHistory 같은 개념을 추가하고,
