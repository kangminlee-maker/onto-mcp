    target: credit-risk-ontology.yaml / rating authority model
    evidence_anchor: review-value-alignment-criteria.yaml:7-8;
      materialized-input.md:6-8,31-34,48-56,92-98
    claim: 등급 권위가 엔진·보고·소비 시스템으로 분산되어 공유 개념 기준이라는 목적에서 벗어납니다.
    lens_rationale_summary: 권위 문서의 목적은 리스크 엔진과 보고 시스템이 같은 개념 기준을 쓰게 하는 것입니다. 그런데 등급
      의미와 변환 권위가 온톨로지 내부에 닫혀 있지 않고 보고서 팀 수동 조정 및 각 소비 시스템 변환으로 흩어져 있어, 동일
      차주·익스포저에 대해 엔진 판단과 보고 판단이 다른 값으로 정당화될 수 있습니다. 이는 단순한 구조 취향 문제가 아니라
      권위·precedence 목적 자체를 약화합니다.
    proposed_action: 등급의 canonical source를 하나로 지정하고,
      internal_rating/RiskRating.grade/Exposure.risk_grade 사이의 변환표·유효일·예외
      승인권자·수동 조정 감사 필드를 온톨로지 안에 닫으십시오. 보고용 조정이 필요하다면 원천 등급과 조정 등급을 분리하고 조정 사유 및
      우선순위를 명시하십시오.
    affected_purpose: 리스크 엔진과 보고 시스템이 공유할 개념 권위 문서로서의 등급 기준과 precedence 제공.
    failure_condition: 엔진 등급, 보고 등급, 내부 등급 또는 소비 시스템별 변환이 서로 다른 결과를 만들 때 어느 값이
      authoritative한지 target 안에서 결정할 수 없습니다.
    impact: 공유 기준을 제공해야 할 온톨로지가 등급 해석과 조정 권한을 외부 소비자에게 넘기므로 보고 수치, 엔진 판단, 운영 의사결정 간
      불일치가 정상 상태로 허용됩니다.
    evidence_refs:
