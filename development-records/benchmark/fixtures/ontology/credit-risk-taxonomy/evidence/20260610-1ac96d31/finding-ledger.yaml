      evidence_refs:
        - review-value-alignment-criteria.yaml:7-8
        - materialized-input.md:59-67
        - materialized-input.md:93-94
    causal_path:
      root_cause_candidate: 한도와 환산 계산의 authoritative source 및 precedence가 온톨로지 내부에 닫혀 있지 않습니다.
      root_cause_step_id: finding-003.cause-003
      steps:
        - cause_id: finding-003.cause-001
          claim: Limit.approved_amount는 승인 시스템이 기록하고 CRM available_limit과 합산 관리된다고 되어
            있습니다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:59-67
        - cause_id: finding-003.cause-002
          claim: Limit 소진율은 ExposureAggregate.total_amount / Limit.approved_amount로 정의됩니다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:93-94
        - cause_id: finding-003.cause-003
          claim: 통화가 다른 경우 각 시스템의 당일 환율 테이블을 사용한다고 하여 동일 지표의 계산 권위가 시스템별로 분산됩니다.
