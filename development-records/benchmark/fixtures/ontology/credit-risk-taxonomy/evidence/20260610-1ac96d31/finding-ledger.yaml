  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260610-1ac96d31/round1/axiology.findings.yaml#axiology-candidate-003
    target: credit-risk-ontology.yaml / Limit.approved_amount and FX conversion
      authority
    evidence_anchor: review-value-alignment-criteria.yaml:7-8; materialized-input.md:59-67,92-94
    claim: 한도 소진율 계산의 외부 권위가 분산되어 보고·엔진 간 공유 기준을 약화합니다.
    lens_rationale_summary: 한도 소진율은 리스크 엔진과 보고 시스템이 모두 사용할 핵심 운영 지표입니다. 그런데 승인 한도와
      available_limit의 관계, 중복/차감 규칙, 환율 테이블 우선순위가 온톨로지 내부에 없습니다. 각 시스템이 자기 환율
      테이블과 합산 규칙을 쓰면 같은 borrower/product 조합에 대해 서로 다른 소진율이 산출될 수 있어 공유 개념 기준이라는
      목적에 맞지 않습니다.
    proposed_action: Limit의 authoritative source, available_limit과의 관계, 합산/차감 규칙, 환율
      기준 테이블, 환율 적용 시각을 온톨로지에 명시하십시오. 시스템별 환율 사용이 불가피하면 report_value와
      engine_value를 별도 projection으로 분리하고 reconcile 규칙을 추가하십시오.
    affected_purpose: 리스크 엔진과 보고 시스템이 동일한 한도 소진율 계산 기준을 공유하게 하는 목적.
    failure_condition: 통화가 다르거나 승인 시스템 한도와 CRM available_limit이 함께 쓰이는 경우, 시스템별 환율
      테이블 또는 합산 방식 차이로 서로 다른 소진율이 계산됩니다.
    impact: 한도 관리 지표가 공유 기준이 아니라 시스템별 계산 결과가 되어 운영 보고와 엔진 판단의 비교 가능성이 낮아집니다.
    evidence_refs:
