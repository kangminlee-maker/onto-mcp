findings:
  - candidate_id: semantics-candidate-001
    target: Collateral entity inheritance
    evidence_anchor: .onto/review/20260610-b4c2568c/execution-preparation/materialized-input.md:39-46,85-88
    claim: Collateral이 Exposure의 하위 유형으로 모델링되어 담보 자산과 여신 익스포저의 의미 유형이 혼동된다.
    what: "Collateral 정의는 '익스포저를 담보하는 자산'인데 `is_a: Exposure`로 선언되어 있습니다. 동시에 관계에서는
      `Exposure secured_by Collateral`로 별도 담보 객체처럼 사용합니다."
    why: 자산 담보는 여신 익스포저의 하위 종류가 아니라 익스포저를 보강하거나 보전하는 별도 자산/계약 객체입니다. 같은 파일 안에서도
      Collateral은 `secured_by`의 대상이므로 Exposure와 동일 유형으로 취급하면 '모든
      Exposure.amount의 합' 같은 익스포저 집계나 리스크 엔진 입력에서 담보 자산이 익스포저처럼 해석될 여지가 생깁니다.
    how_to_fix: "`Collateral.is_a: Exposure`를 제거하고 Collateral을 독립 엔티티로 두십시오. 필요하면
      `Collateral`과 `Exposure` 사이의 `secures/secured_by` 관계에 담보가치, 평가시점, 적용비율 같은
      속성을 명시하십시오."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고서 시스템이 공유하는 여신 리스크 개념 권위 문서
      failure_condition: 소비 시스템이 `is_a` 의미를 따라 Collateral을 Exposure의 일종으로 분류하거나 집계·검증 대상으로 삼는 경우
      impact: 담보 자산과 여신 익스포저의 경계가 무너지면 익스포저 총액, 담보 평가, secured_by 관계 해석이 서로 다른 시스템에서
        달라져 공유 개념 기준으로서 신뢰가 약해집니다.
      evidence_refs:
        - materialized-input.md:39-46
        - materialized-input.md:85-88
    causal_path:
      root_cause_candidate: 담보 자산을 여신 익스포저의 하위 유형으로 둔 존재론적 유형 분류 오류
      root_cause_step_id: semantics-candidate-001.cause-004
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: Collateral은 정의상 '익스포저를 담보하는 자산'이다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:39-40
        - cause_id: semantics-candidate-001.cause-002
          claim: "그런데 Collateral은 `is_a: Exposure`로 선언되어 Exposure의 하위 유형이 된다."
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:39-41
        - cause_id: semantics-candidate-001.cause-003
          claim: 동일 모델은 별도 관계에서 Exposure가 Collateral에 의해 담보된다고 표현한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:85-88
        - cause_id: semantics-candidate-001.cause-004
          claim: 따라서 Collateral은 한편으로 Exposure의 하위 유형이고 다른 한편으로 Exposure를 담보하는 별도 대상이 되어
            의미 유형이 충돌한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:39-46
            - materialized-input.md:85-88
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: Rating scale semantics across Borrower.internal_rating,
      RiskRating.grade, and Exposure.risk_grade
    evidence_anchor: .onto/review/20260610-b4c2568c/execution-preparation/materialized-input.md:20-22,31-34,48-57,92-98
    claim: 세 신용등급 스케일이 같은 '등급' 의미권에 속하지만 권위 있는 의미 매핑 없이 병존한다.
    what: Borrower에는 1~10 내부 신용등급, RiskRating에는 R1~R5 엔진 등급, Exposure에는 AAA~CCC 보고용
      리스크 등급이 있습니다. 규칙은 Exposure.risk_grade가 RiskRating.grade에서 도출된다고 하지만 수동 조정
      가능하고, 실제 변환은 리스크팀 위키 또는 각 소비 시스템에 맡겨져 있습니다.
    why: 이 온톨로지가 공유 개념 권위 문서라면 동일 의미권의 등급 값들이 어떤 신용위험 순서·구간·대상 단위·권위 소스에 해당하는지 온톨로지
      안에서 닫혀야 합니다. 현재는 같은 '신용등급/리스크 등급' 이름이 서로 다른 스케일과 권위를 가리키며, 수동 조정 후
      Exposure.risk_grade가 엔진 산출 등급인지 보고용 오버레이인지 의미가 불명확해집니다.
    how_to_fix: 등급 개념을 `BorrowerCreditRating`, `EngineRiskRating`,
      `ReportingRiskGrade`처럼 대상과 권위가 드러나는 개념으로 구분하고, 각 스케일의 순서·대상
      단위·as_of·source_system·override 여부를 명시하십시오. 변환표가 필수라면 외부 위키가 아니라 이 권위 문서
      안의 참조 가능한 mapping artifact로 선언하십시오.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고서 시스템이 공유하는 등급 분류 기준
      failure_condition: 엔진, 보고서, 소비 시스템이 1~10, R1~R5, AAA~CCC 간 변환 또는 수동 조정 등급의 의미를 각자 해석하는 경우
      impact: 동일 차주 또는 익스포저의 신용위험 등급이 시스템별로 다른 의미와 권위를 갖게 되어 리스크 엔진 결과와 보고 수치의 비교 가능성이
        약해집니다.
      evidence_refs:
        - materialized-input.md:20-22
        - materialized-input.md:31-34
        - materialized-input.md:48-57
        - materialized-input.md:92-98
    causal_path:
      root_cause_candidate: 동일 의미권의 등급 스케일을 권위·대상 단위·변환 의미로 닫지 않고 소비 시스템에 위임한 모델링
      root_cause_step_id: semantics-candidate-002.cause-004
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: Borrower.internal_rating, RiskRating.grade, Exposure.risk_grade가 모두 등급 또는
            신용등급으로 설명된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20-22
            - materialized-input.md:31-34
            - materialized-input.md:48-56
        - cause_id: semantics-candidate-002.cause-002
          claim: 각 등급은 서로 다른 값 체계인 1~10, R1~R5, AAA~CCC를 사용한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:20-22
            - materialized-input.md:31-34
            - materialized-input.md:53-56
        - cause_id: semantics-candidate-002.cause-003
          claim: RiskRating.grade와 Borrower.internal_rating의 매핑은 외부 위키를 참조하고, 세 스케일 변환은 각
            소비 시스템이 수행한다고 되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:53-56
            - materialized-input.md:97-98
        - cause_id: semantics-candidate-002.cause-004
          claim: Exposure.risk_grade는 RiskRating.grade에서 도출되지만 보고서 팀이 시장 상황에 따라 수동 조정할 수
            있어 산출 등급과 보고용 조정 등급의 의미가 섞인다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:31-34
            - materialized-input.md:92-93
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-003
    target: RiskAppetite entity and compliance_status
    evidence_anchor: .onto/review/20260610-b4c2568c/execution-preparation/materialized-input.md:78-83,92-94
    claim: RiskAppetite가 정책 기준과 준수 판정 상태를 같은 개념으로 합쳐 의미상 다른 유형을 혼합한다.
    what: RiskAppetite는 '리스크 성향 한도'와 threshold를 가진 정책/한도 기준으로 정의되지만,
      `compliance_status` 속성으로 compliant/breached 상태도 직접 보유합니다. 정의도 초과 여부를
      RiskAppetite 준수 상태로 정의한다고 서술합니다.
    why: 리스크 성향 또는 한도 기준은 비교 기준이고, compliant/breached는 특정 ExposureAggregate가 특정 기준을
      특정 시점에 비교한 결과입니다. 상태 판정을 RiskAppetite 자체 속성으로 두면 어떤 차주, 어떤 총익스포저, 어떤 시점의
      위반인지 의미가 빠져 공유 보고나 엔진 판정에서 기준 객체와 평가 결과가 혼동됩니다.
    how_to_fix: RiskAppetite는 정책 기준(`threshold`, 적용 범위, 통화, 유효기간)으로 유지하고, 준수 여부는
      `RiskAppetiteAssessment` 또는 `AppetiteBreach` 같은 별도 평가/사건 개념으로 분리하십시오. 해당
      평가에는 borrower/exposure_aggregate_ref, appetite_ref, as_of, amount, status를
      두십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 한도 초과 및 준수 상태 기준
      failure_condition: 여러 차주·시점·집계값이 하나의 RiskAppetite 기준을 공유하거나 보고서가 위반 상태를 기준 객체의 속성으로 읽는 경우
      impact: 정책 기준과 평가 결과가 같은 엔티티에 섞여 위반 상태의 주체와 시점을 잃고, 엔진 판정과 보고 상태가 같은 의미로 재현되기
        어렵습니다.
      evidence_refs:
        - materialized-input.md:78-83
        - materialized-input.md:92-94
    causal_path:
      root_cause_candidate: 기준 개념과 기준 적용 결과 개념을 분리하지 않은 의미 모델링
      root_cause_step_id: semantics-candidate-003.cause-004
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: RiskAppetite는 리스크 성향 한도와 threshold를 가진 기준으로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:78-82
        - cause_id: semantics-candidate-003.cause-002
          claim: 동일 엔티티가 compliant/breached `compliance_status`를 가진다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:80-83
        - cause_id: semantics-candidate-003.cause-003
          claim: 정의는 ExposureAggregate가 RiskAppetite를 초과하는지 여부를 RiskAppetite 준수 상태로 표현한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:78-79
        - cause_id: semantics-candidate-003.cause-004
          claim: 그러나 ExposureAggregate 자체는 borrower_ref, total_amount, as_of를 가진 별도 집계이며
            위반 판정 상태와 직접 연결되지 않는다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:69-76
            - materialized-input.md:78-83
      unresolved_beyond_evidence: null
