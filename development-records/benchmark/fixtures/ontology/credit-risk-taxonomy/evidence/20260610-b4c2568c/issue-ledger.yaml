    issue_statement: 익스포저 집계의 시간성과 포함 범위가 닫히지 않아 한도 소진율과 RiskAppetite 준수 판단이 stale
      또는 논리적으로 모순된 총액을 사용할 수 있다.
    proposed_action: ExposureAggregate를 as-of/batch snapshot 총계로 명확히 하거나
