  - issue_id: issue-002
    root_cause_hypothesis: ExposureAggregate.total_amount를 모든 Exposure.amount의 현재
      총계와 월말 배치 snapshot 저장값으로 동시에 사용하면서 snapshot kind, inclusion policy,
      freshness/as_of 계약을 분리하지 않은 것이 공통 원인이다.
