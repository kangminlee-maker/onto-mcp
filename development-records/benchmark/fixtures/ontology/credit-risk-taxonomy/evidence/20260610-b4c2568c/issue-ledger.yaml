      소진율 또는 RiskAppetite.compliance_status 판단에 쓰이거나, 월말 외 기준시점 산정이 필요한 경우.
    impact: 공유 기준이 실제 시간 상태를 반영하지 않거나 같은 필드가 전체 합계와 일부 제외 snapshot을 동시에 의미해, 소비 시스템이
