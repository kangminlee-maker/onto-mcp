    - issue_id: issue-009
      severity: medium
      material: true
      affected_purpose: The ontology is intended to define shared concepts for
        exposures and collateral used by risk engines and reporting systems.
      failure_condition: When consumers traverse hierarchy or aggregate exposure
        concepts, `Collateral` can be treated as a kind of `Exposure` even
        though the relation model treats collateral as a separate securing
        asset.
      impact: This weakens structural integrity of exposure and collateral categories
        and can lead to incorrect inclusion of collateral records in
        exposure-oriented processing or reports.
      evidence_refs:
        - .onto/review/20260610-b4c2568c/round1/structure.findings.yaml#structure-candidate-002
        - "Embedded Materialized Input: `Collateral.definition` says it is an
          asset securing an exposure"
        - "Embedded Materialized Input: `Collateral.is_a: Exposure`"
        - "Embedded Materialized Input: relation `{ from: Exposure, to:
          Collateral, kind: secured_by }`"
        - "Embedded Materialized Input, `entities.Collateral.is_a: Exposure`;
          `relations` item `{ from: Exposure, to: Collateral, kind: secured_by
          }`"
      source_lens_ids:
        - structure
      action_candidates: &a10
        - follow_up
