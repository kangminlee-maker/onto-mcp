        .md:69-75 Source finding context: ExposureAggregate.total_amount is both
        defined as the sum of all Exposure.amount and as a stored monthly-batch
        value that excludes intraday new exposures until the next batch. Source
        finding context: The definition at lines 69-70 gives ExposureAggregate a
        necessary totality property over all Exposure.amount, while the
        total_amount note at lines 73-75 states a condition where some
        Exposure.amount values are not reflected. Under that condition, the
        stored total_amount is not the sum of all Exposure.amount, so
        risk-engine and reporting consumers cannot rely on the same formal
        meaning for the aggregate. Source finding context: Split the concepts or
        qualify the definition: define ExposureAggregate as an as-of/batch
        snapshot total, and separately define a live/current exposure total if
        needed. Make the inclusion boundary explicit, e.g. 'sum of
        Exposure.amount included in the batch as_of date' rather than 'all
        Exposure.amount'. Source finding context:
