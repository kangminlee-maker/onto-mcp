        Exposure`; `relations` item `{ from: Exposure, to: Collateral, kind:
        secured_by }` Source finding context: Collateral is modeled both as a
        subtype of Exposure and as a secured asset related to Exposure. Source
        finding context: The ontology definition describes `Collateral` as an
        asset securing an exposure, and its attributes are collateral-specific
        (`collateral_id`, `collateral_type`, `appraised_value`, `appraised_at`).
        The `is_a: Exposure` edge makes collateral inherit or occupy the
        exposure classification hierarchy, while the `secured_by` relation
        treats it as a separate connected entity. That structural mismatch can
        create invalid graph paths, such as collateral being counted or
        classified as an exposure, while also serving as security for exposure.
        Source finding context: Remove `is_a: Exposure` from `Collateral`. Keep
        `Collateral` as a separate entity connected through `Exposure secured_by
        Collateral`, or introduce a broader parent concept only if both exposure
        and collateral truly share a common supertype. Source finding context:
        .onto/review/20260610-b4c2568c/round1/structure.findings.yaml#structure\
        -candidate-002 Source finding context: The ontology is intended to
        define shared concepts for exposures and collateral used by risk engines
        and reporting systems. Source finding context: When consumers traverse
        hierarchy or aggregate exposure concepts, `Collateral` can be treated as
        a kind of `Exposure` even though the relation model treats collateral as
        a separate securing asset. Source finding context: This weakens
        structural integrity of exposure and collateral categories and can lead
        to incorrect inclusion of collateral records in exposure-oriented
        processing or reports. Source finding context: The ontology uses `is_a`
        where an association relation is already the appropriate structural
        connection. Source finding context: `Collateral` is declared as a
        subtype of `Exposure`. Source finding context: `Collateral` is also
        connected as the target of `Exposure secured_by Collateral`. Source
        finding context: The collateral definition and attributes describe an
        asset, not a credit exposure. Source finding context: The resulting
        structure permits consumers to interpret collateral as both exposure
        subtype and exposure security, creating ambiguous traversal and
        aggregation behavior."
    - issue_id: issue-010
      candidates: *a11
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "structure와 logic이 직접 지지하며 issue-001의 등급 권위 결핍과 원인을 공유하는 구조적 증상이다. 도출
        dependency를 공식 구조로 검증·감사할 수 없으므로 공유 권위와 추적성에 영향을 주며 대상 안에서 닫아야 한다.
        Source finding context: credit-risk-ontology.yaml / classification_rules
        deriving Exposure.risk_grade from RiskRating.grade Source finding
        context: Embedded Materialized Input, `classification_rules[0]`;
        `relations` list Source finding context: The stated derivation from
        RiskRating.grade to Exposure.risk_grade has no structural path from
        RiskRating to Exposure. Source finding context: The available graph has
        `Borrower has_many Exposure` and `Borrower rated_by RiskRating`. That
        provides a common borrower node but not the required derivation relation
        or cardinality from a specific rating record to a specific exposure
        grade. Because the rule also allows report-team manual adjustment, the
        missing structural link makes it unclear which rating is the source for
        which exposure grade and whether adjusted grades remain traceable.
        Source finding context: Add an explicit derivation relation such as `{
        from: Exposure, to: RiskRating, kind: grade_derived_from }`, or define a
        derivation object that links `Exposure.risk_grade`, source
        `RiskRating.grade`, adjustment authority, and effective/as-of time.
        Source finding context:
        .onto/review/20260610-b4c2568c/round1/structure.findings.yaml#structure\
        -candidate-003 Source finding context: The ontology is meant to provide
        a shared concept basis for risk-engine classification and reporting use
        of grades. Source finding context: When deriving or auditing
        `Exposure.risk_grade`, the ontology lacks a formal relation from
        exposure-level grade to the source risk-rating concept named by the
        rule. Source finding context: Risk engine and reporting consumers may
        derive, override, or trace exposure grades differently because the
        formal structure does not encode the dependency stated in the
        classification rule. Source finding context: The ontology states a
        cross-entity derivation rule without adding the relation needed to
        represent that dependency in the graph. Source finding context:
        `Exposure.risk_grade` and `RiskRating.grade` are separate attributes on
        separate entities. Source finding context: A classification rule says
        the exposure grade is derived from the risk rating grade. Source finding
        context: The relation list lacks a direct derivation or source relation
        between `Exposure` and `RiskRating`. Source finding context: The only
        structural connection is through `Borrower`, which does not identify the
        source rating record or derivation relationship for each exposure
        grade."
