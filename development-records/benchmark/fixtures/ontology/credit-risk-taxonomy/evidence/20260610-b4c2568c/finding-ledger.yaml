      evidence_refs:
        - credit-risk-ontology.yaml Exposure.attributes.amount has no currency
          attribute
        - credit-risk-ontology.yaml Limit.attributes.currency exists only on
          Limit
        - "credit-risk-ontology.yaml classification_rules: '통화가 다른 경우 환산은 각 시스템의
          당일 환율 테이블을 사용한다.'"
    causal_path:
      root_cause_candidate: 금액 값을 독립 숫자로 두고 통화·환산을 공통 온톨로지 개념으로 승격하지 않았다.
      root_cause_step_id: finding-005.cause-003
      steps:
