    target: Collateral entity inheritance
    evidence_anchor: .onto/review/20260610-b4c2568c/execution-preparation/materialized-input.md:39-46,85-88
    claim: Collateral이 Exposure의 하위 유형으로 모델링되어 담보 자산과 여신 익스포저의 의미 유형이 혼동된다.
    lens_rationale_summary: 자산 담보는 여신 익스포저의 하위 종류가 아니라 익스포저를 보강하거나 보전하는 별도 자산/계약
      객체입니다. 같은 파일 안에서도 Collateral은 `secured_by`의 대상이므로 Exposure와 동일 유형으로 취급하면
      '모든 Exposure.amount의 합' 같은 익스포저 집계나 리스크 엔진 입력에서 담보 자산이 익스포저처럼 해석될 여지가
