          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:92-93
      unresolved_beyond_evidence: null
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260610-b4c2568c/round1/axiology.findings.yaml#axiology-candidate-002
    target: credit-risk-ontology.yaml / rating scale mapping authority
    evidence_anchor: .onto/review/20260610-b4c2568c/execution-preparation/materialized-input.md:20-22,31-34,53-56,97-98
    claim: 세 등급 스케일의 변환 책임을 소비 시스템에 분산해 공유 기준 목적에서 벗어난다.
    lens_rationale_summary: 리스크 엔진과 보고 시스템이 공유할 기준을 검토하는 요청에서 등급 변환은 핵심 개념 권위입니다. 이를
      소비 시스템별 구현으로 넘기면 각 시스템이 서로 다른 매핑과 갱신 시점을 가질 수 있고, 온톨로지는 공유 기준이 아니라 역사적 병존을
      설명하는 문서에 머뭅니다. 이는 역사적 호환성을 유지하는 선택이 현재 목적을 약화하는 가치 drift입니다.
    proposed_action: 세 스케일의 canonical 관계를 온톨로지 내부에 명시하십시오. 예를 들어 `RatingScale`,
      `RatingMapping`, `MappingVersion`, `effective_from/effective_to`, `owner`,
      `exception_policy`를 두고 소비 시스템은 이를 참조만 하도록 경계를 정리하십시오.
    affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 차주·익스포저 등급 기준.
    failure_condition: 각 소비 시스템이 `internal_rating`, `RiskRating.grade`,
      `Exposure.risk_grade` 변환을 독자 수행하는 경우.
    impact: 보고, 엔진, 내부 심사 기준이 같은 차주나 익스포저를 서로 다르게 분류할 수 있어 공유 개념 기준으로서의 운영 가치가 훼손됩니다.
    evidence_refs:
      - .onto/review/20260610-b4c2568c/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:20-22
      - materialized-input.md:31-34
      - materialized-input.md:53-56
      - materialized-input.md:97-98
      - review-value-alignment-criteria.yaml:criteria[user-request-intent].statement
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 차주·익스포저 등급 기준.
      failure_condition: 각 소비 시스템이 `internal_rating`, `RiskRating.grade`,
        `Exposure.risk_grade` 변환을 독자 수행하는 경우.
      impact: 보고, 엔진, 내부 심사 기준이 같은 차주나 익스포저를 서로 다르게 분류할 수 있어 공유 개념 기준으로서의 운영 가치가 훼손됩니다.
      evidence_refs:
        - materialized-input.md:20-22
        - materialized-input.md:31-34
        - materialized-input.md:53-56
        - materialized-input.md:97-98
        - review-value-alignment-criteria.yaml:criteria[user-request-intent].statement
    causal_path:
      root_cause_candidate: 역사적으로 병존한 등급 스케일을 온톨로지의 canonical 매핑 개념으로 승격하지 않았다.
      root_cause_step_id: finding-002.cause-003
      steps:
        - cause_id: finding-002.cause-001
          claim: 대상은 `internal_rating`, `RiskRating.grade`, `Exposure.risk_grade` 세 등급
            스케일을 별도 필드와 값 체계로 둔다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20-22
            - materialized-input.md:31-34
            - materialized-input.md:53-56
        - cause_id: finding-002.cause-002
          claim: "`RiskRating.grade`의 매핑 테이블은 리스크팀 위키를 참조한다고 되어 있다."
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:53-56
        - cause_id: finding-002.cause-003
          claim: 세 스케일의 변환은 각 소비 시스템이 수행한다고 명시되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:97-98
      unresolved_beyond_evidence: null
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260610-b4c2568c/round1/axiology.findings.yaml#axiology-candidate-003
    target: credit-risk-ontology.yaml / ExposureAggregate freshness and compliance use
    evidence_anchor: .onto/review/20260610-b4c2568c/execution-preparation/materialized-input.md:69-83,92-95
    claim: 월말 배치 총익스포저를 한도 소진율과 리스크 성향 준수 판단에 쓰면서 시간성 트레이드오프를 닫지 않았다.
    lens_rationale_summary: 리뷰 요청은 시간성 관점의 개념 결함과 운영 위험을 중점으로 합니다. 총익스포저가 stale할 수
      있음을 알면서도 compliance 판단과 한도 소진율 산식에 그대로 사용하면, 월말 배치 편의가 리스크 통제 목적보다 우선하는 숨은
      트레이드오프가 됩니다. 특히 신규 여신 발생 후 다음 배치 전에는 준수 상태가 실제 노출을 반영하지 않을 수 있습니다.
    proposed_action: "`ExposureAggregate`에 `freshness_policy`,
      `calculation_frequency`, `includes_intraday`, `valid_for` 같은 시간성 계약을 추가하고,
      한도 소진율/리스크 성향 준수 판단이 사용할 수 있는 집계 수준을 명시하십시오. 필요하면 보고용 월말 집계와 통제용 실시간 또는
      준실시간 집계를 별도 개념으로 분리하십시오."
    affected_purpose: 여신 리스크 관리에서 한도 소진율과 리스크 성향 준수 상태를 공유 기준으로 판단하는 목적.
    failure_condition: 일중 신규 여신이 발생했으나 월말 배치 전 `ExposureAggregate.total_amount`가 한도
      소진율 또는 `RiskAppetite.compliance_status` 판단에 사용되는 경우.
    impact: 공유 기준이 실제 시간 상태를 반영하지 않아 breached 상태를 compliant로 보고하거나 한도 소진율을 과소 산정할 수
      있습니다.
    evidence_refs:
      - .onto/review/20260610-b4c2568c/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:69-76
      - materialized-input.md:78-83
      - materialized-input.md:92-95
      - review-value-alignment-criteria.yaml:criteria[user-request-intent].statement
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 여신 리스크 관리에서 한도 소진율과 리스크 성향 준수 상태를 공유 기준으로 판단하는 목적.
      failure_condition: 일중 신규 여신이 발생했으나 월말 배치 전 `ExposureAggregate.total_amount`가 한도
        소진율 또는 `RiskAppetite.compliance_status` 판단에 사용되는 경우.
      impact: 공유 기준이 실제 시간 상태를 반영하지 않아 breached 상태를 compliant로 보고하거나 한도 소진율을 과소 산정할 수
        있습니다.
      evidence_refs:
        - materialized-input.md:69-76
        - materialized-input.md:78-83
        - materialized-input.md:92-95
        - review-value-alignment-criteria.yaml:criteria[user-request-intent].statement
    causal_path:
      root_cause_candidate: 월말 배치 산출물의 시간적 유효 범위를 compliance/limit 판단 규칙에서 제한하지 않았다.
      root_cause_step_id: finding-003.cause-004
      steps:
        - cause_id: finding-003.cause-001
          claim: "`ExposureAggregate.total_amount`는 모든 `Exposure.amount`의 합으로 정의된다."
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-74
        - cause_id: finding-003.cause-002
          claim: 동일 필드는 월말 배치로 계산되어 저장되며 일중 신규 여신은 다음 배치까지 미반영된다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:73-76
        - cause_id: finding-003.cause-003
          claim: "`Limit` 소진율은 `ExposureAggregate.total_amount / Limit.approved_amount`로
            정의된다."
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:92-94
        - cause_id: finding-003.cause-004
          claim: "`RiskAppetite` 위반 여부도 `ExposureAggregate`가 임계값을 초과하는지로 정의된다."
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:78-83
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260610-b4c2568c/round1/coverage.findings.yaml#coverage-candidate-001
    target: credit-risk-ontology.yaml / entities
    evidence_anchor: "Embedded Materialized Input: entities include Borrower,
      Exposure, Collateral, RiskRating, Limit, ExposureAggregate, RiskAppetite;
      notes state default status is out of scope"
    claim: 연체/부실(default) 상태 영역이 공유 온톨로지 범위에서 빠져 있어 리스크 엔진과 보고 시스템의 여신 리스크 기준으로는 포괄
      범위가 부족하다.
    lens_rationale_summary: 대상 문서는 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향한다고 선언한다. 그러나
      default 상태를 별도 시스템으로만 밀어내면 같은 차주나 익스포저가 정상/연체/부도/부실 중 어디에 있는지 이 문서의 공통
      기준으로 판정하거나 보고할 수 없다. 이는 포괄 범위 관점에서 주요 하위 영역의 부재이며, 리스크 엔진 산출과 보고 분류가 서로 다른
      외부 상태 정의에 의존하게 만든다.
    proposed_action: DefaultStatus 또는 CreditEvent 같은 공통 상위 개념을 추가하고, 최소한 연체 단계,
      부도/default 여부, 부실/NPL 여부, 상태 기준일, 상태 권위 시스템을 Exposure 또는 Borrower와 연결한다.
      별도 연체관리 시스템이 원천이라도 이 온톨로지에는 공유 참조 개념과 관계를 포함한다.
    affected_purpose: 리스크 엔진과 보고서 시스템이 공유할 여신 리스크 개념 기준 제공
    failure_condition: 차주 또는 익스포저의 연체/default/부실 상태가 리스크 엔진과 보고 시스템 양쪽에서 필요한 경우
    impact: 핵심 여신 리스크 상태가 공통 개념으로 닫히지 않아 엔진 결과와 보고 분류가 외부 시스템별 정의에 흩어지고, 공유 권위 문서로서의
      신뢰가 약해진다.
    evidence_refs:
