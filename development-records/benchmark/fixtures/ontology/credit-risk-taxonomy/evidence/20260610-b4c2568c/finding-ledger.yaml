  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260610-b4c2568c/round1/coverage.findings.yaml#coverage-candidate-002
    target: credit-risk-ontology.yaml / entities and classification_rules
    evidence_anchor: "Embedded Materialized Input: Exposure.amount,
      Limit.approved_amount/currency, ExposureAggregate.total_amount/as_of;
      classification rule uses per-system daily FX tables"
    claim: 통화 및 환산 기준 영역이 별도 개념으로 커버되지 않아 다통화 익스포저와 한도 소진율의 공통 분류 기준이 비어 있다.
    lens_rationale_summary: 한도 소진율은 ExposureAggregate.total_amount /
      Limit.approved_amount로 정의되어 보고와 엔진이 함께 쓰는 핵심 산식이다. 그런데 분자·분모의 통화 권위와 환산
      기준이 온톨로지 안에 포괄되지 않으면 같은 익스포저와 한도도 시스템별 환율 테이블에 따라 서로 다른 소진율과 위반 상태로 분류될 수
      있다. 이는 coverage 관점에서 금액 측정과 환산이라는 필수 하위 영역의 누락이다.
    proposed_action: MoneyAmount 또는 CurrencyConversion 같은 공통 개념을 추가해 amount,
      currency, base_currency, fx_rate_ref, conversion_date, converted_amount를
      모델링한다. Exposure.amount와 ExposureAggregate.total_amount도 통화 속성을 갖도록 하고, 한도
      소진율 산식은 단일 환산 권위 또는 명시적 환율 참조를 사용하게 한다.
    affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 한도 소진율 및 리스크 성향 위반 판단 기준
    failure_condition: ExposureAggregate와 Limit의 통화가 다르거나 Exposure들이 여러 통화로 구성된 경우
    impact: 환산 기준이 시스템별로 갈라져 같은 여신 포트폴리오에 대해 소진율, 한도 초과, RiskAppetite 위반 여부가 다르게 산출될
      수 있다.
    evidence_refs:
      - .onto/review/20260610-b4c2568c/round1/coverage.findings.yaml#coverage-candidate-002
      - credit-risk-ontology.yaml Exposure.attributes.amount has no currency
        attribute
      - credit-risk-ontology.yaml Limit.attributes.currency exists only on Limit
      - "credit-risk-ontology.yaml classification_rules: '통화가 다른 경우 환산은 각 시스템의
        당일 환율 테이블을 사용한다.'"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 한도 소진율 및 리스크 성향 위반 판단 기준
      failure_condition: ExposureAggregate와 Limit의 통화가 다르거나 Exposure들이 여러 통화로 구성된 경우
      impact: 환산 기준이 시스템별로 갈라져 같은 여신 포트폴리오에 대해 소진율, 한도 초과, RiskAppetite 위반 여부가 다르게 산출될
