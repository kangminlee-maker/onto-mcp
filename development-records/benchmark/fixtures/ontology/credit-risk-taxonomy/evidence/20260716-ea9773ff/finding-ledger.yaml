  - finding_id: finding-009
    lens_id: evolution
    source_ref: .onto/review/20260716-ea9773ff/round1/evolution.findings.yaml#evolution-candidate-001
    target: credit-risk-ontology.yaml rating scale model
    evidence_anchor: credit-risk-ontology.yaml:15-17, 26-29, 48-51, 87-93
    claim: Rating scale evolution is not centralized, so future grade changes
      require coordinated consumer rewrites and can break shared continuity.
    lens_rationale_summary: For an ontology intended to be the shared concept
      authority for risk engines and reporting systems, the extensible concept
      should be the rating scale plus versioned mapping rule. Here the mapping
      authority is outside the target and distributed to consumers. If the
      engine adds a grade, reporting changes buckets, or historical mappings are
      revised, continuity depends on every consumer updating its own conversion
      logic consistently rather than on the ontology preserving versioned
      scale/mapping semantics.
    proposed_action: Promote rating scale and mapping into first-class ontology
      concepts, with scale id, scale version/effective dates, source authority,
      mapping table, and manual-override provenance. Keep consumer systems
      reading the same canonical mapping rather than each implementing
      conversion independently.
