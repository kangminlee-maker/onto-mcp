    source_ref: .onto/review/20260716-ea9773ff/round1/semantics.findings.yaml#semantics-candidate-001
    target: credit-risk-ontology.yaml entities.Collateral
    evidence_anchor: materialized-input.md:39-46, materialized-input.md:87
    claim: Collateral is modeled as an Exposure even though its definition gives it
      the meaning of a pledged asset.
    lens_rationale_summary: The target itself distinguishes `Exposure` as the
      loan/credit position and `Collateral` as the securing asset, and the
      relation `Exposure -> Collateral secured_by` already expresses their
      association. Treating the securing asset as a subtype of the secured
      exposure misstates the ontological type and can make inherited exposure
      semantics apply to collateral records.
    proposed_action: "Remove `Collateral.is_a: Exposure`; keep `Collateral` as a
      separate entity and express the link only through a relation such as
      `Exposure secured_by Collateral` or an explicit collateral reference/join
      entity if needed."
