      unresolved_beyond_evidence: null
  - finding_id: finding-018
    lens_id: structure
    source_ref: .onto/review/20260716-ea9773ff/round1/structure.findings.yaml#structure-candidate-002
    target: credit-risk-ontology.yaml Limit utilization rule and relations graph
    evidence_anchor: credit-risk-ontology.yaml:54-71,80-89
    claim: The Limit utilization rule depends on ExposureAggregate and Limit, but
      the relation graph does not connect those concepts.
    lens_rationale_summary: A consumer following the ontology graph can see that
      both concepts refer to Borrower, but cannot identify the intended
      structural dependency for utilization or whether the ratio is
      borrower-level, product-level, or another scoped join. This is a missing
      relation for a declared rule, not merely a semantic preference.
    proposed_action: "Declare the utilization dependency explicitly, for example `{
      from: ExposureAggregate, to: Limit, kind: consumes }` or a named derived
      concept/relationship for `limit_utilization`, with scope keys that align
      aggregate and limit selection."
    affected_purpose: The ontology is intended to give risk and reporting systems a
      shared structural basis for classification and rule consumption.
    failure_condition: When implementing or auditing the declared Limit utilization
      rule, consumers must infer the ExposureAggregate-to-Limit join path from
      parallel Borrower references rather than from an explicit relation.
    impact: The missing structural edge makes a stated rule under-specified as a
      graph contract and can lead consumers to implement divergent joins while
      still appearing to follow the ontology.
    evidence_refs:
      - .onto/review/20260716-ea9773ff/round1/structure.findings.yaml#structure-candidate-002
      - credit-risk-ontology.yaml:54-71
      - credit-risk-ontology.yaml:80-89
