      evidence_refs:
        - credit-risk-ontology.yaml:54-71
        - credit-risk-ontology.yaml:80-89
    causal_path:
      root_cause_candidate: A classification rule introduced a cross-entity dependency
        without adding the matching relation to the ontology graph.
      root_cause_step_id: finding-018.cause-003
      steps:
