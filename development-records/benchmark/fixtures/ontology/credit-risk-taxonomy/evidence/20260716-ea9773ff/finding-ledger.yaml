  - finding_id: finding-012
    lens_id: logic
    source_ref: .onto/review/20260716-ea9773ff/round1/logic.findings.yaml#logic-candidate-001
    target: credit-risk-ontology.yaml / entities.ExposureAggregate
    evidence_anchor: credit-risk-ontology.yaml:64-71
    claim: ExposureAggregate.total_amount is defined as both the sum of all
      Exposure.amount and a month-end batch value that excludes intraday new
      exposures until the next batch.
    lens_rationale_summary: In any state after a new intraday exposure exists and
      before the next batch, the declared definition requires inclusion of that
      Exposure.amount, but the attribute note permits non-inclusion. Both claims
      cannot be true for the same borrower, as_of date, and exposure set. This
      matters because the artifact is intended as a shared authority for risk
      engines and reporting systems; a utilization or appetite calculation using
      this concept can be simultaneously 'correct' and 'incorrect' depending on
      which claim is applied.
    proposed_action: Make the temporal boundary explicit. For example, define
      ExposureAggregate as the sum of Exposure.amount as of a specific batch
      cutoff/as_of timestamp, or split it into CurrentExposureAggregate and
      MonthEndExposureAggregate so the universal 'all Exposure.amount' claim is
      not attached to a lagged stored value.
    affected_purpose: Shared concept authority for risk engines and reporting
      systems using exposure aggregates in risk and utilization calculations.
    failure_condition: A borrower receives an intraday new exposure after the
      month-end batch and before the next batch, while
      ExposureAggregate.total_amount is used as the authoritative total
      exposure.
    impact: The same ontology permits two incompatible truth conditions for the
      aggregate, weakening review trust and making downstream calculations
      non-actionable without an extra unstated temporal convention.
    evidence_refs:
      - .onto/review/20260716-ea9773ff/round1/logic.findings.yaml#logic-candidate-001
      - credit-risk-ontology.yaml:64-71
      - credit-risk-ontology.yaml:89
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Shared concept authority for risk engines and reporting
        systems using exposure aggregates in risk and utilization calculations.
      failure_condition: A borrower receives an intraday new exposure after the
        month-end batch and before the next batch, while
        ExposureAggregate.total_amount is used as the authoritative total
        exposure.
      impact: The same ontology permits two incompatible truth conditions for the
        aggregate, weakening review trust and making downstream calculations
        non-actionable without an extra unstated temporal convention.
      evidence_refs:
        - credit-risk-ontology.yaml:64-71
        - credit-risk-ontology.yaml:89
    causal_path:
      root_cause_candidate: "The aggregate concept lacks a single temporal authority:
        its definition uses an unqualified universal sum, while its attribute
        note authorizes a lagged batch projection."
      root_cause_step_id: finding-012.cause-003
      steps:
        - cause_id: finding-012.cause-001
          claim: ExposureAggregate is defined as borrower-level total exposure and the sum
            of all Exposure.amount.
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml:64-65
        - cause_id: finding-012.cause-002
