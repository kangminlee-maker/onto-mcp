    - issue_id: issue-003
      severity: medium
      material: true
      affected_purpose: "리스크 엔진과 보고 시스템이 limits와 appetite breaches를 공유 graph contract로
        소비하고 감사하는 것. Source finding context: The ontology is intended to
        coordinate risk-engine decisions and reporting concepts for limits and
        appetite breaches. Source finding context: The ontology is intended as
        the shared concept authority for a risk engine and reporting systems.
        Source finding context: The ontology is intended to give risk and
        reporting systems a shared structural basis for classification and rule
        consumption."
      failure_condition: "소비자가 ExposureAggregate에서 RiskAppetite 준수 여부나 Limit
        utilization을 결정·보고·감사해야 할 때 graph상 적용 threshold, compliance result,
        aggregate-to-limit join path를 찾아야 하는 경우. Source finding context: A
        consumer treats `RiskAppetite.compliance_status` as an intrinsic
        property of the appetite policy rather than a time-scoped result of
        evaluating exposure against a threshold. Source finding context: When a
        consumer needs to determine or report RiskAppetite compliance from
        ExposureAggregate, the target has no declared structural path connecting
        the two concepts. Source finding context: When implementing or auditing
        the declared Limit utilization rule, consumers must infer the
        ExposureAggregate-to-Limit join path from parallel Borrower references
        rather than from an explicit relation."
      impact: "중앙 violation/utilization 개념이 prose로만 존재해 consumer별 join과 평가 의미가 갈라질 수
        있으며, stale 또는 scope-ambiguous breach state가 policy fact처럼 사용될 수 있다.
        Source finding context: Reports may present stale or scope-ambiguous
        breach states as policy facts, and engines may lack a stable semantic
        distinction between limit definition and compliance evaluation. Source
        finding context: This weakens actionability and review trust because a
        central violation concept is present but not reachable through the
        ontology's relation graph. Source finding context: The missing
        structural edge makes a stated rule under-specified as a graph contract
        and can lead consumers to implement divergent joins while still
        appearing to follow the ontology."
      evidence_refs:
        - .onto/review/20260716-ea9773ff/round1/semantics.findings.yaml#semantics-candidate-004
        - materialized-input.md:78-83
        - materialized-input.md:69-76
        - materialized-input.md:92-95
        - .onto/review/20260716-ea9773ff/round1/structure.findings.yaml#structure-candidate-001
        - credit-risk-ontology.yaml:2-3
        - credit-risk-ontology.yaml:73-85
        - .onto/review/20260716-ea9773ff/round1/structure.findings.yaml#structure-candidate-002
        - credit-risk-ontology.yaml:54-71
        - credit-risk-ontology.yaml:80-89
      source_lens_ids:
        - semantics
        - structure
      action_candidates: &a6
        - fix_before_release
        - fix_now
      rationale: "Semantics와 structure가 직접 지지하고 다른 렌즈도 평가 결과와 dependency 개념의 결여를 인정한다.
        공유 graph contract로 breach와 utilization을 소비하게 하려면 policy와 evaluated
        result 및 dependency edge의 의미 일관성이 target 안에서 닫혀야 한다. Source finding
        context: credit-risk-ontology.yaml RiskAppetite Source finding context:
        materialized-input.md:78-83, materialized-input.md:94 Source finding
        context: `RiskAppetite` conflates appetite policy, numeric threshold,
        and compliance result in one concept. Source finding context: Risk
        appetite is a policy or constraint, while compliance status is an
        assessment result at a point in time. Combining them blurs whether
        `RiskAppetite` means the policy, its limit value, or the current
        evaluated state, and the classification rule for limit utilization
        separately depends on exposure aggregate and approved amount. Source
        finding context: Separate the policy/limit concept from the evaluation
        result: for example, keep `RiskAppetite` with threshold,
        currency/scope/effective period, and create `RiskAppetiteCompliance`
        with borrower or portfolio scope, aggregate reference, evaluated value,
        status, and as-of time. Source finding context:
        .onto/review/20260716-ea9773ff/round1/semantics.findings.yaml#semantics\
        -candidate-004 Source finding context: The ontology is intended to
        coordinate risk-engine decisions and reporting concepts for limits and
        appetite breaches. Source finding context: A consumer treats
        `RiskAppetite.compliance_status` as an intrinsic property of the
        appetite policy rather than a time-scoped result of evaluating exposure
        against a threshold. Source finding context: Reports may present stale
        or scope-ambiguous breach states as policy facts, and engines may lack a
        stable semantic distinction between limit definition and compliance
        evaluation. Source finding context: The concept boundary between a risk
        appetite constraint and its evaluated compliance state is not separated.
        Source finding context: `RiskAppetite` is defined as a limit and also
        contains `compliance_status`. Source finding context: The definition
        compares `ExposureAggregate` to `RiskAppetite` directly, although the
        comparable numeric attribute is `threshold`. Source finding context:
        `ExposureAggregate` is explicitly time-scoped with `as_of`, but
        `RiskAppetite.compliance_status` has no corresponding evaluation time or
        scope. Source finding context: credit-risk-ontology.yaml RiskAppetite
        entity and relations graph Source finding context:
        credit-risk-ontology.yaml:73-85 Source finding context: RiskAppetite is
        structurally disconnected from the aggregate it governs. Source finding
        context: The definition says ExposureAggregate crossing RiskAppetite
        determines a violation, while the only declared relations connect
        Borrower, Exposure, Collateral, RiskRating, Limit, and
        ExposureAggregate. Without a relation, shared consumers cannot traverse
        from an aggregate to the applicable appetite threshold or compliance
        status. Source finding context: Add an explicit relation such as `{
        from: ExposureAggregate, to: RiskAppetite, kind: measured_against }` or
        `{ from: RiskAppetite, to: ExposureAggregate, kind: applies_to }`, plus
        any key/scope attributes needed to select the applicable appetite.
        Source finding context:
        .onto/review/20260716-ea9773ff/round1/structure.findings.yaml#structure\
        -candidate-001 Source finding context: The ontology is intended as the
        shared concept authority for a risk engine and reporting systems. Source
        finding context: When a consumer needs to determine or report
        RiskAppetite compliance from ExposureAggregate, the target has no
        declared structural path connecting the two concepts. Source finding
        context: This weakens actionability and review trust because a central
        violation concept is present but not reachable through the ontology's
        relation graph. Source finding context: RiskAppetite was added as an
        entity with a definition-level dependency on ExposureAggregate but
        without a corresponding relation edge in the ontology graph. Source
        finding context: RiskAppetite defines compliance by comparing
        ExposureAggregate to RiskAppetite. Source finding context: The relations
        list does not include RiskAppetite in any from/to position. Source
        finding context: Therefore the compliance concept is disconnected from
        the aggregate it depends on. Source finding context:
        credit-risk-ontology.yaml Limit utilization rule and relations graph
        Source finding context: credit-risk-ontology.yaml:54-71,80-89 Source
        finding context: The Limit utilization rule depends on ExposureAggregate
        and Limit, but the relation graph does not connect those concepts.
        Source finding context: A consumer following the ontology graph can see
        that both concepts refer to Borrower, but cannot identify the intended
        structural dependency for utilization or whether the ratio is
        borrower-level, product-level, or another scoped join. This is a missing
        relation for a declared rule, not merely a semantic preference. Source
        finding context: Declare the utilization dependency explicitly, for
        example `{ from: ExposureAggregate, to: Limit, kind: consumes }` or a
        named derived concept/relationship for `limit_utilization`, with scope
        keys that align aggregate and limit selection. Source finding context:
        .onto/review/20260716-ea9773ff/round1/structure.findings.yaml#structure\
        -candidate-002 Source finding context: The ontology is intended to give
        risk and reporting systems a shared structural basis for classification
        and rule consumption. Source finding context: When implementing or
        auditing the declared Limit utilization rule, consumers must infer the
        ExposureAggregate-to-Limit join path from parallel Borrower references
        rather than from an explicit relation. Source finding context: The
        missing structural edge makes a stated rule under-specified as a graph
        contract and can lead consumers to implement divergent joins while still
        appearing to follow the ontology. Source finding context: A
        classification rule introduced a cross-entity dependency without adding
        the matching relation to the ontology graph. Source finding context:
        Limit and ExposureAggregate are separate entities with borrower_ref
        attributes. Source finding context: The declared utilization formula
        combines ExposureAggregate.total_amount with Limit.approved_amount.
        Source finding context: The relations list connects each concept to
        Borrower but does not connect ExposureAggregate to Limit or define a
        utilization relation."
