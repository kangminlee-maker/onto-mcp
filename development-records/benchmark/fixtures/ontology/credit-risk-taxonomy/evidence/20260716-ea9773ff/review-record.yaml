    - issue_id: issue-009
      candidates: *a10
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "semantics와 structure가 직접 지지하는 type-modeling error이며
        coverage/evolution은 lens scope 밖으로 보았을 뿐 반박하지 않았다. consumer가 is_a를 상속으로
        해석하면 collateral asset에 exposure semantics가 적용되므로 target 안에서 바로 수정해야 하는
        correctness 문제다. Source finding context: credit-risk-ontology.yaml
        entities.Collateral Source finding context: materialized-input.md:39-46,
        materialized-input.md:87 Source finding context: Collateral is modeled
        as an Exposure even though its definition gives it the meaning of a
        pledged asset. Source finding context: The target itself distinguishes
        `Exposure` as the loan/credit position and `Collateral` as the securing
        asset, and the relation `Exposure -> Collateral secured_by` already
        expresses their association. Treating the securing asset as a subtype of
        the secured exposure misstates the ontological type and can make
        inherited exposure semantics apply to collateral records. Source finding
        context: Remove `Collateral.is_a: Exposure`; keep `Collateral` as a
        separate entity and express the link only through a relation such as
        `Exposure secured_by Collateral` or an explicit collateral
        reference/join entity if needed. Source finding context:
        .onto/review/20260716-ea9773ff/round1/semantics.findings.yaml#semantics\
        -candidate-001 Source finding context: The ontology is intended as a
        shared concept authority for risk engines and reporting systems. Source
        finding context: Any consumer that interprets `is_a` as inheritance or
        subtype membership will treat collateral assets as exposure instances.
        Source finding context: Risk and reporting consumers may apply exposure
        attributes, aggregation, or classification assumptions to collateral
        assets, weakening trust in the shared concept boundary between credit
        positions and pledged assets. Source finding context: The ontology uses
        subtype inheritance for a semantic association that is already
        represented as a securing relation. Source finding context: `Collateral`
        is declared with `is_a: Exposure`. Source finding context: `Collateral`
        is defined as an asset securing an exposure, while `Exposure` is defined
        as the credit exposure itself. Source finding context: The model also
        declares `Exposure secured_by Collateral`, showing the intended meaning
        is association rather than subtype identity."
    - issue_id: issue-010
      candidates: *a11
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "deliberation은 derived-ratio/manual-input mismatch를 trigger로 유지하면서
        LTV-specific derivation, valuation, override authority 문제로 좁혔다. 같은
        exposure의 LTV 계산과 수동 입력 해석이 갈라질 수 있으므로 target 내에서 의미와 권위를 닫아야 한다. Source
        finding context: credit-risk-ontology.yaml Exposure.ltv Source finding
        context: materialized-input.md:29, materialized-input.md:35-37,
        materialized-input.md:45 Source finding context: `ltv` is named as a
        collateral ratio but modeled as an independent manually entered input
        beside its source quantities. Source finding context: A ratio/percentage
        concept is semantically a derived measure when its source quantities are
        present in the same concept model. Modeling it as an independent input
        without defining its formula, valuation basis, timestamp, or override
        semantics creates a derived-value/input mismatch: the same exposure can
        have an amount, collateral value, and LTV that do not agree. Source
        finding context: Define `ltv` as a derived measure with explicit
        formula, collateral selection rules, valuation date basis, and override
        policy; if manual underwriting overrides must exist, name them
        separately, for example `underwriter_ltv_override`, and preserve
        provenance. Source finding context:
        .onto/review/20260716-ea9773ff/round1/semantics.findings.yaml#semantics\
        -candidate-002 Source finding context: The ontology is meant to give
        risk engines and reports a shared meaning for exposure, limit, and
        collateral concepts. Source finding context: A consumer compares or
        recalculates LTV from `Exposure.amount` and
        `Collateral.appraised_value`, while another consumer trusts the manually
        entered `Exposure.ltv`. Source finding context: Risk classification and
        reporting can diverge on the same exposure because the ratio name
        implies a derived concept but the model gives it independent input
        authority. Source finding context: The ontology does not distinguish
        derived LTV from a manually asserted underwriting value. Source finding
        context: `Exposure.ltv` is a number with a note saying it is manually
        entered by an underwriter. Source finding context: The same ontology
        includes `Exposure.amount` and `Collateral.appraised_value`, which are
        source quantities for a collateral ratio. Source finding context: No
        formula, valuation basis, or override semantics are declared for
        reconciling the manually entered value with those source quantities."
    - issue_id: issue-011
      candidates: *a12
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "resolution은 issue-011을 issue-001에 종속·연결된 focused rating-scale
        mapping issue로 유지했다. Axiology는 broad classification authority issue의
        표현으로 좁혔으므로 contested를 보존한다. rating-specific traceability 때문에 별도
        carry-forward가 필요하지만 broader issue-001 remediation 중 함께 닫을 수 있다. Source
        finding context: credit-risk-ontology.yaml rating concepts Source
        finding context: materialized-input.md:20-22,
        materialized-input.md:31-34, materialized-input.md:48-57,
        materialized-input.md:92-98 Source finding context: Three credit-rating
        scales are presented as shared concepts without an authoritative
        semantic mapping inside the ontology. Source finding context: These
        names all denote credit/risk grade semantics, but their scopes and
        transformations are not made authoritative in the shared ontology. A
        risk engine and a reporting system can therefore use the same ontology
        while assigning different meanings to equivalent grade levels or
        treating a manual reporting adjustment as if it were the engine-derived
        risk grade. Source finding context: Add an explicit canonical rating
        concept or mapping table in the ontology, including scope (`borrower` vs
        `exposure`), scale ownership, effective dates, derivation rules, and
        override/provenance semantics for report-side adjustments. Source
        finding context:
        .onto/review/20260716-ea9773ff/round1/semantics.findings.yaml#semantics\
        -candidate-003 Source finding context: The target says it is a concept
        authority shared by a risk engine and reporting system. Source finding
        context: The risk engine emits `RiskRating.grade`, reports consume or
        adjust `Exposure.risk_grade`, and consumers rely on external or local
        transformations rather than an ontology-owned mapping. Source finding
        context: The central risk-grade concept is not semantically stable
        across systems, so classifications and reports can disagree while both
        appear conformant to the ontology. Source finding context: The ontology
        delegates rating-scale equivalence and conversion semantics to external
        consumer-specific mappings. Source finding context: The ontology defines
        three rating-like fields with distinct scales: 1-10, R1-R5, and AAA-CCC.
        Source finding context: The classification rule says
        `Exposure.risk_grade` is derived from `RiskRating.grade` but can be
        manually adjusted by the reporting team. Source finding context: The
        note says the three scales coexist for historical reasons and conversion
        is performed by each consuming system."
