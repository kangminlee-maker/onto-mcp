    to_finding_id: finding-009
    relation: same_root_candidate
    root_hypothesis: Rating-scale evolution and current reporting drift share the
      root that rating mapping and override authority are delegated to external
      or per-consumer mechanisms instead of a versioned canonical ontology
      concept.
    shared_cause: null
    rationale: finding-001 describes present divergence from consumer conversion and
      manual reporting adjustment; finding-009 describes future continuity
      breakage when rating scales evolve. Both causal paths terminate in
      distributed rating conversion authority.
