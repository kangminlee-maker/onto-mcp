relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-015
    relation: duplicates
    root_hypothesis: The same rating-scale authority defect exists if
      RiskRating.grade, Exposure.risk_grade, and Borrower.internal_rating
      conversion semantics remain outside the ontology or are locally adjusted
      by consumers.
    shared_cause: null
    rationale: Both findings identify that multiple credit rating scales are treated
      as shared concepts while conversion and manual reporting adjustment are
      not governed by an ontology-owned mapping. finding-001 frames the purpose
      drift; finding-015 frames the semantic instability, but the underlying
      defect and affected values are the same.
    confidence: high
