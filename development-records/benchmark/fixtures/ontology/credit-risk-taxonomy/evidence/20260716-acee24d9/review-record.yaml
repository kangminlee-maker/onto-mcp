        reporting systems covering exposure and collateral concepts."
      failure_condition: "A consumer interprets is_a as inheritance/subtyping, or
        collateral coverage expands to pooled collateral, multiple valuations,
        lien priority, guarantees, substitutions, or other collateral-specific
        lifecycles. Source finding context: When collateral coverage expands
        beyond one asset directly attached to one exposure, the inherited
        exposure structure forces collateral records to carry exposure fields or
        requires a breaking remodel. Source finding context: When consumers
        interpret `is_a` as inheritance/subtyping, collateral assets become
        valid Exposure instances while also serving as assets securing
        exposures. Source finding context: Any consumer that interprets `is_a`
        semantically will treat collateral assets as credit exposures despite
        the target also defining them as securing assets."
      impact: "Consumers may apply exposure fields, aggregation, or reporting logic to
        collateral records, corrupting the exposure/collateral boundary and
        forcing disruptive remodels for collateral evolution. Source finding
        context: The current inheritance choice narrows future collateral
        extensions and increases the likelihood of a disruptive schema change in
        a core risk-management concept. Source finding context: This can make
        type-based consumers apply exposure fields, aggregation, or reporting
        logic to collateral records, undermining the declared shared taxonomy
        contract. Source finding context: This can corrupt classification,
        aggregation, and reporting semantics at the boundary between exposure
        records and collateral records."
