      rationale: "All participating lenses accept the root, and the final resolution
        retains high severity because subtype semantics can propagate incorrect
        exposure treatment to collateral assets. This is a current correctness
        blocker for the ontology's core type model. Source finding context:
        credit-risk-ontology.yaml / Collateral entity inheritance Source finding
        context: Embedded Materialized Input: `Collateral.definition` says
        `익스포저를 담보하는 자산. 담보 평가의 기본 단위.` while `Collateral` also declares `is_a:
        Exposure`; relations include `{ from: Exposure, to: Collateral, kind:
        secured_by }`. Source finding context: Collateral is modeled both as a
        subtype of Exposure and as a secured asset related from Exposure,
        limiting future collateral model evolution. Source finding context: From
        an evolution perspective, this conflates credit exposure and securing
        asset lifecycles. Adding collateral-specific extensions such as pooled
        collateral, multiple valuations, guarantees as collateral support, lien
        priority, or asset substitution may require untangling inheritance
        because collateral would inherit exposure attributes like borrower
        reference, amount, product type, risk grade, and LTV even when those are
        not properties of the asset itself. Source finding context: Remove
        `Collateral is_a Exposure` and model collateral as a separate
        asset/support concept related to exposures through a relationship entity
        such as `SecurityAgreement` or `CollateralLink`, carrying allocation,
        priority, valuation, and effective dates. Source finding context:
        .onto/review/20260716-acee24d9/round1/evolution.findings.yaml#evolution\
        -candidate-004 Source finding context: A change-tolerant concept basis
        for exposure and collateral management shared across systems. Source
        finding context: When collateral coverage expands beyond one asset
        directly attached to one exposure, the inherited exposure structure
        forces collateral records to carry exposure fields or requires a
        breaking remodel. Source finding context: The current inheritance choice
        narrows future collateral extensions and increases the likelihood of a
        disruptive schema change in a core risk-management concept. Source
        finding context: The ontology uses inheritance for an
        association/lifecycle relationship between exposure and collateral.
        Source finding context: Collateral is defined as an asset securing an
        exposure. Source finding context: The ontology simultaneously declares
        `Collateral is_a Exposure` and a separate `Exposure secured_by
        Collateral` relation. Source finding context: Inheritance makes
        collateral structurally depend on exposure attributes, constraining
        later collateral-specific lifecycle extensions. Source finding context:
