        risk engine and reporting systems. Source finding context: When
        consumers interpret `is_a` as inheritance/subtyping, collateral assets
        become valid Exposure instances while also serving as assets securing
        exposures. Source finding context: This can make type-based consumers
        apply exposure fields, aggregation, or reporting logic to collateral
        records, undermining the declared shared taxonomy contract. Source
        finding context: The ontology uses `is_a` to connect Collateral to
        Exposure even though Collateral's own definition and relation role
        describe a secured asset, not a credit exposure. Source finding context:
        Collateral is declared as an asset that secures an exposure and as
        `is_a: Exposure`. Source finding context: Exposure is separately defined
        as the credit exposure to a borrower, and the relation declares Exposure
        as secured by Collateral. Source finding context: Together these claims
        require Collateral to be both a kind of Exposure and the asset target
        that secures an Exposure. Source finding context:
        credit-risk-ontology.yaml: Collateral entity Source finding context:
        .onto/review/20260716-acee24d9/execution-preparation/materialized-input\
        .md:39-46,85-88 Source finding context: Collateral is modeled as a
        subtype of Exposure even though its definition makes it a securing
        asset, not a credit exposure. Source finding context: A collateral asset
        and a credit exposure are different ontological kinds: one is the
        pledged asset, the other is the credit position being secured. Treating
        collateral as an Exposure weakens the shared concept standard because a
        risk engine or report can classify collateral records as exposure
        records or apply exposure attributes/aggregation semantics to assets.
        Source finding context: Remove `Collateral.is_a: Exposure`; keep
        Collateral as a separate asset entity connected through `Exposure
        secured_by Collateral`. If a shared superclass is needed, introduce a
        neutral parent such as `RiskObject` only after defining common semantics
        explicitly. Source finding context:
        .onto/review/20260716-acee24d9/round1/semantics.findings.yaml#semantics\
        -candidate-001 Source finding context: A shared concept authority for
        risk engines and reporting systems covering exposure and collateral
        concepts. Source finding context: Any consumer that interprets `is_a`
        semantically will treat collateral assets as credit exposures despite
        the target also defining them as securing assets. Source finding
        context: This can corrupt classification, aggregation, and reporting
        semantics at the boundary between exposure records and collateral
        records. Source finding context: The subtype assertion uses `Exposure`
        as the parent for `Collateral` although the target definition assigns
        Collateral the meaning of a securing asset. Source finding context:
        Collateral is defined as an asset securing an exposure and the base unit
        of collateral appraisal. Source finding context: The same entity is
        declared `is_a: Exposure`. Source finding context: The relation section
        separately models Exposure as `secured_by` Collateral, confirming the
        intended distinction between exposure and collateral asset."
