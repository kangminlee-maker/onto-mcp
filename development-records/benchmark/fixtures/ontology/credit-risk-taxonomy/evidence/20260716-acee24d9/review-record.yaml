    - issue_id: issue-008
      severity: high
      material: true
      affected_purpose: "Shared concept authority for exposure and collateral
        management across risk-engine and reporting systems. Source finding
        context: A change-tolerant concept basis for exposure and collateral
        management shared across systems. Source finding context: Shared
        credit-risk concept authority for risk engine and reporting systems.
