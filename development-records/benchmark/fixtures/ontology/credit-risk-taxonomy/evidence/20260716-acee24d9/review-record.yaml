        compatibility metadata. Source finding context: This creates brittle
        evolution and migration risk in the core classification surface,
        especially for systems that rely on the ontology as a shared validation
        and reporting basis. Source finding context: The ontology encodes
        volatile classification vocabularies as closed attribute-local enums
        instead of first-class extensible taxonomy concepts. Source finding
        context: Multiple core classification axes are closed inline enum lists
        inside attributes. Source finding context: Inline enum expansion
        requires modifying existing attribute schemas rather than adding
        separate taxonomy records. Source finding context: Without lifecycle or
        effective-version metadata, future category changes cannot preserve
        historical meaning or compatibility in the ontology itself."
    - issue_id: issue-009
      candidates: *a10
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "The issue stands independently while preserving its dependency on
        the broader exposure-collateral valuation/link lifecycle. It weakens
        authority and reproducibility for a shared risk measure, so it should be
        closed in the target model. Source finding context:
        credit-risk-ontology.yaml: Exposure.ltv Source finding context:
        .onto/review/20260716-acee24d9/execution-preparation/materialized-input\
        .md:24-37,39-46 Source finding context: `ltv` is named as a collateral
        ratio but modeled as an independent underwriter input while its source
        concepts coexist in the ontology. Source finding context: A ratio field
        stored as an independent input can diverge from the amount and appraisal
        values that define the risk meaning of the ratio. For a shared ontology,
        this makes it unclear whether LTV is authoritative input, derived value,
        or historical snapshot. Source finding context: Define `ltv` as a
        derived or snapshot attribute with explicit formula, denominator source,
        timestamp, and authority. If manual override is allowed, split it from
        calculated LTV, for example `calculated_ltv` and
        `approved_ltv_override`, with override authority and reason. Source
        finding context:
        .onto/review/20260716-acee24d9/round1/semantics.findings.yaml#semantics\
        -candidate-002 Source finding context: Shared semantic basis for
        risk-engine and reporting use of collateralized exposure risk measures.
        Source finding context: When Exposure.amount or
        Collateral.appraised_value changes, the independently entered `ltv` can
        retain a different value without the ontology saying which value is
        authoritative. Source finding context: Risk rules and reports can use
        inconsistent LTV semantics for the same exposure, reducing trust in
        classification and limit monitoring outputs. Source finding context: The
        ontology names `ltv` as a ratio-like risk measure but gives it
        input-field semantics instead of derived/snapshot semantics. Source
        finding context: Exposure contains `amount`, and Collateral contains
        `appraised_value` and `appraised_at`. Source finding context: Exposure
        also contains `ltv` with the note that it is entered by an underwriter
        at review time. Source finding context: Because the target does not
        define formula, timestamp, or override semantics for `ltv`, the ratio
        can drift from its source concepts."
    - issue_id: issue-010
      candidates: *a11
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "Applicable lenses support the semantic rating-scale authority
        problem, and the issue overlaps with but is not eliminated by the
        broader rating conversion issue. It should be fixed in the target
        because grade concept naming and mapping are central to shared
        interpretation. Source finding context: credit-risk-ontology.yaml:
        credit rating concepts Source finding context:
        .onto/review/20260716-acee24d9/execution-preparation/materialized-input\
        .md:20-22,31-34,48-57,92-99 Source finding context: Three non-equivalent
        rating scales are all presented as credit/risk grades without a
        canonical semantic mapping or distinct concept names. Source finding
        context: These are not merely alternate labels; they encode different
        authorities, units, and possibly different subjects: borrower-level
        internal rating, engine-produced borrower rating, and exposure-level
        reporting grade. Leaving them as loosely related grades makes
        same-looking 'rating/grade' semantics depend on the consuming system.
        Source finding context: Name the concepts by subject and authority, such
        as `borrower_internal_rating`, `engine_borrower_rating`, and
        `exposure_reporting_grade`; add an explicit canonical mapping/derivation
        artifact with owner, effective time, and override semantics for
        report-side adjustments. Source finding context:
        .onto/review/20260716-acee24d9/round1/semantics.findings.yaml#semantics\
        -candidate-003 Source finding context: A concept authority shared by the
        risk engine and reporting system for credit-grade classification. Source
        finding context: A consumer must interpret or convert rating scales
        locally because the ontology does not establish one canonical semantic
        mapping or distinguish adjusted report grades from engine grades. Source
        finding context: Risk engine outputs and reporting classifications can
        disagree while both appear valid under the ontology, weakening the
        ontology as the shared concept standard. Source finding context: The
        ontology preserves historically separate rating scales without assigning
        a canonical semantic authority or explicit mapping inside the shared
        concept artifact. Source finding context: Borrower, RiskRating, and
        Exposure each define a grade/rating field with distinct scales and
        subjects. Source finding context: The classification rule says
        Exposure.risk_grade derives from RiskRating.grade but can be manually
        adjusted by the reporting team. Source finding context: The notes say
        the three scales coexist for historical reasons and conversion is
        performed by each consuming system."
    - issue_id: issue-011
      candidates: *a12
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "All participating lenses converge on the evaluation-result framing,
        with logic's earlier narrowing absorbed into the intended
        aggregate-derived compliance scope. The missing semantic and structural
        binding can produce inconsistent breach outputs, so target-level closure
        is required. Source finding context: credit-risk-ontology.yaml:
        RiskAppetite entity Source finding context:
        .onto/review/20260716-acee24d9/execution-preparation/materialized-input\
        .md:69-83,92-94 Source finding context: RiskAppetite conflates a policy
        threshold with a compliance result state. Source finding context: A
        threshold policy and a breach/compliance observation have different
        semantics and lifecycles. Placing the status on RiskAppetite makes the
        appetite object appear to change from compliant to breached, instead of
        producing a status for a specific aggregate evaluated against the
        appetite. Source finding context: Keep RiskAppetite as the
        policy/threshold concept and introduce a separate evaluation concept
        such as `RiskAppetiteCompliance` with references to RiskAppetite and
        ExposureAggregate plus `as_of` and `status`. Source finding context:
        .onto/review/20260716-acee24d9/round1/semantics.findings.yaml#semantics\
        -candidate-004 Source finding context: Shared concept authority for
        limit/appetite compliance across engine and reporting outputs. Source
        finding context: A consumer treats `RiskAppetite.compliance_status` as
        intrinsic to the appetite threshold rather than as an evaluation result
        for a specific exposure aggregate and time. Source finding context:
        Reports or engine checks can lose the subject and time basis of a
        breach, making compliance status ambiguous and hard to reconcile. Source
        finding context: The entity combines the meaning of risk appetite policy
        with the meaning of compliance evaluation result. Source finding
        context: ExposureAggregate is a borrower-level total exposure with an
        `as_of` date. Source finding context: RiskAppetite is defined as a
        threshold and also carries `compliance_status`. Source finding context:
        The definition states breach status is determined when ExposureAggregate
        exceeds RiskAppetite, making status an evaluation result rather than an
        intrinsic property of the appetite threshold. Source finding context:
        credit-risk-ontology.yaml entities.RiskAppetite / relations Source
        finding context:
        .onto/review/20260716-acee24d9/execution-preparation/materialized-input\
        .md:78 and
        .onto/review/20260716-acee24d9/execution-preparation/materialized-input\
        .md:85 Source finding context: RiskAppetite is structurally orphaned
        despite being defined as the compliance target for ExposureAggregate.
        Source finding context: The declared target is a shared concept
        authority for a risk engine and reporting system. With no structural
        connection, consumers cannot traverse from borrower exposure totals to
        the appetite threshold or compliance status using the ontology itself.
        The evidence supports this because RiskAppetite is declared at lines
        78-83, while the complete relations list at lines 85-90 connects
        Borrower, Exposure, Collateral, RiskRating, Limit, and ExposureAggregate
        but omits RiskAppetite entirely. Source finding context: Add explicit
        structural relations and/or ref attributes that connect RiskAppetite to
        the entity it constrains, for example ExposureAggregate -> RiskAppetite
        with a kind such as tested_against or governed_by, plus the required
        scope keys such as borrower segment, product type, currency, and as_of
        if those determine which threshold applies. Source finding context:
        .onto/review/20260716-acee24d9/round1/structure.findings.yaml#structure\
        -candidate-001 Source finding context: The ontology's stated purpose as
        a shared concept authority for risk engine and reporting systems. Source
        finding context: When a consumer needs to compute, audit, or report
        RiskAppetite compliance from ExposureAggregate values, the target
        threshold/status concept is not reachable from the exposure aggregate
        graph. Source finding context: This weakens review trust because a
        central compliance concept is present but disconnected; different
        consumers may invent separate joins or scoping assumptions, producing
        inconsistent compliance outputs from the same ontology. Source finding
        context: RiskAppetite was added as an entity and rule target without
        adding the required graph edge or reference that binds it to
        ExposureAggregate or another scoping authority. Source finding context:
        RiskAppetite is declared as an entity with threshold and
        compliance_status attributes. Source finding context: Its definition
        depends on a comparison between ExposureAggregate and RiskAppetite.
        Source finding context: The ontology's relations section omits any
        relation involving RiskAppetite, leaving that comparison outside the
        navigable structure."
