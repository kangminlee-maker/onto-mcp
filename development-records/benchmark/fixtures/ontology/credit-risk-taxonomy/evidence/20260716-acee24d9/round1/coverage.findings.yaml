  - candidate_id: coverage-candidate-003
    target: credit-risk-ontology.yaml / Limit.approved_amount and
      classification_rules[1]
    evidence_anchor: "Embedded materialized input: Limit.attributes.approved_amount
      note; classification_rules[1]"
    claim: 한도와 환율처럼 복수 시스템에 걸쳐 관리되는 값에 단일 원본 권위와 기준시점 개념이 누락되어 한도 소진율 계산 기준이 분산된다.
    what: Limit.approved_amount는 승인 시스템이 기록하지만 영업점 CRM의 available_limit과 합산 관리된다고 되어
      있고, 통화가 다를 때 환산은 각 시스템의 당일 환율 테이블을 사용한다고 되어 있다. 그러나 approved_amount,
      available_limit, 환율 테이블, 합산 결과 중 어느 시스템 값이 권위 원본인지, 환율의 기준시각과 출처가 무엇인지, 상충
      시 우선순위가 무엇인지 표현하는 개념이 없다.
    why: Limit 소진율은 ExposureAggregate.total_amount / Limit.approved_amount로 정의되어 리스크
      위반 판단과 보고에 직접 쓰일 수 있는 지표다. 그런데 구성 값의 단일 권위와 환산 기준이 없으면 리스크 엔진과 보고 시스템이 같은
      차주·같은 날짜에 서로 다른 소진율을 계산할 수 있으며, 공유 개념 기준으로서의 역할이 약해진다.
    how_to_fix: LimitSourceAuthority 또는 BookOfRecord 개념을 추가해 승인 시스템, CRM, 환율 테이블의
      역할과 우선순위를 명시한다. CurrencyConversionRate에는 rate_source, rate_timestamp,
      effective_date, currency_pair, version을 두고, LimitUtilization 계산에는 사용한 원천값과
      환율 기준을 참조하게 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 한도 소진율 및 통화 환산 기준
      failure_condition: 승인 시스템과 CRM의 한도 값이 다르거나 각 시스템의 당일 환율 테이블이 다른 값을 제공하는 경우
      impact: 소진율 계산의 입력 권위와 환산 기준이 분산되어 동일 익스포저에 대해 시스템별 결과가 달라질 수 있고, RiskAppetite
        위반 판단 또는 보고 숫자의 재현성이 떨어진다.
      evidence_refs:
        - "Limit.approved_amount note: 승인 한도. 승인 시스템이 기록한다. 영업점 CRM의
          available_limit과 합산 관리."
        - "classification_rules[1]: Limit 소진율 = ExposureAggregate.total_amount /
          Limit.approved_amount. 통화가 다른 경우 환산은 각 시스템의 당일 환율 테이블을 사용한다."
        - "ExposureAggregate.total_amount note: 월말 배치로 계산해 저장. 일중 신규 여신은 다음 배치까지
          미반영."
    causal_path:
      root_cause_candidate: 복수 시스템 관리 값과 환산 기준에 대한 권위 원본 및 우선순위 개념이 없는 범위 결손
      root_cause_step_id: coverage-candidate-003.cause-004
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: Limit.approved_amount는 승인 시스템 값이지만 CRM의 available_limit과 합산 관리된다고 설명된다.
          relation_to_previous: null
          evidence_refs:
            - Limit.approved_amount note
        - cause_id: coverage-candidate-003.cause-002
          claim: 통화 환산은 각 시스템의 당일 환율 테이블을 사용한다고 되어 있어 환산 입력도 시스템별로 분산된다.
          relation_to_previous: enables
          evidence_refs:
            - classification_rules[1]
        - cause_id: coverage-candidate-003.cause-003
          claim: 온톨로지에는 source of record, 우선순위, 환율 기준시각/버전 개념이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities list lacks source authority or currency conversion
              entities
            - Limit.attributes includes limit_id, borrower_ref, approved_amount,
              currency only
        - cause_id: coverage-candidate-003.cause-004
          claim: 따라서 Limit 소진율을 공유 계산 기준으로 삼는 데 필요한 권위 범위가 닫혀 있지 않다.
          relation_to_previous: causes
          evidence_refs:
            - classification_rules[1]
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: credit-risk-ontology.yaml / Exposure and notes[1]
    evidence_anchor: "Embedded materialized input: Exposure entity; notes[1]"
    claim: 연체·부실 상태를 범위 밖으로 제외해 여신 리스크 분류의 상태 lifecycle이 정상 익스포저 중심으로만 닫히고, 부실 전이
      이후의 리스크 상태 범주가 누락된다.
    what: Exposure는 amount, product_type, risk_grade, ltv를 갖지만 정상, 연체, 부실, 상각, 회수,
      종료 같은 상태나 상태 이력 개념이 없다. notes는 연체/부실(default) 상태를 별도 시스템에서 다루므로 범위 밖이라고
      명시한다.
    why: 대상은 여신 리스크 관리의 개념 모델로서 익스포저, 등급, 한도, 담보를 정의하고 리스크 엔진과 보고 시스템이 공유할 기준을 지향한다.
      그러나 여신 리스크에서 익스포저 lifecycle의 핵심 상태인 연체·부실을 제외하면, 리스크 엔진 등급과 보고 시스템의 상태 기반
      집계가 같은 차주/익스포저를 어느 단계로 분류해야 하는지 공유할 수 없다. 별도 시스템이 소유하더라도 최소한 외부 권위 상태 참조,
      기준시점, 수신 이벤트 개념은 필요하다.
    how_to_fix: DefaultStatus 또는 ExposureLifecycleStatus를 온톨로지에 최소 참조 개념으로 포함하고,
      source_system, status, status_effective_at, status_received_at,
      status_history_ref를 둔다. 연체관리 시스템이 권위 원본이라면 out-of-scope 배제가 아니라 외부 권위 참조로
      명시해 보고와 엔진이 동일 상태를 사용할 수 있게 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 여신 리스크 분류 온톨로지의 주요 리스크 상태 포괄성과 리스크 엔진·보고 시스템 간 상태 기준 공유
      failure_condition: 익스포저가 연체 또는 부실로 전이되어 등급, 한도 소진, 담보 평가, 보고 집계가 상태에 따라 달라져야 하는 경우
      impact: 온톨로지가 정상/등급/한도 중심 상태만 제공하고 부실 상태 참조를 배제하므로 주요 리스크 lifecycle 구간이 공유 기준 밖에
