  - candidate_id: coverage-candidate-001
    target: credit-risk-ontology.yaml / RiskRating, Borrower.internal_rating,
      Exposure.risk_grade
    evidence_anchor: "Embedded materialized input:
      Borrower.attributes.internal_rating note; RiskRating.attributes.grade
      note; Exposure.attributes.risk_grade note; notes[0];
      classification_rules[0]"
    claim: 병존하는 3개 신용등급 스케일에 대해 유효기간, 이력, 매핑 기준시점 개념이 누락되어 과거 시점의 등급 재구성이 불가능하다.
    what: 온톨로지는 Borrower.internal_rating(1~10), RiskRating.grade(R1~R5),
      Exposure.risk_grade(AAA~CCC)를 모두 신용등급으로 둔다. 하지만 RiskRating에는 산출 시각이나 유효기간이
      없고, Borrower.internal_rating 및 Exposure.risk_grade에도 적용 시작/종료 시각, 변경 이력,
      등급 매핑의 기준일 개념이 없다.
    why: 대상 문서는 리스크 엔진과 보고 시스템이 공유하는 개념 권위 문서를 지향한다고 선언한다. 그러나 보고서 팀이
      Exposure.risk_grade를 사용하고 수동 조정할 수 있으며, 3개 등급 스케일 변환을 각 소비 시스템이 수행한다고 되어
      있어 등급 값은 시스템·시점 의존적이다. 이 상태에서 유효기간과 이력 개념이 없으면 특정 보고 기준일이나 과거 의사결정 시점에 어떤
      등급과 매핑이 권위 있었는지 복원할 수 없어 엔진 산출과 보고 값의 공유 기준이 약해진다.
    how_to_fix: 등급 관련 개념을 RatingScale, RatingAssignment, RatingMappingVersion 같은 별도
      개념으로 분리하고, 각 등급 부여 및 매핑에 effective_from/effective_to, calculated_at 또는
      assigned_at, source_system, superseded_by를 추가한다. Exposure.risk_grade의 수동
      조정도 원등급과 조정등급을 구분해 기준시점별로 보존한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유할 신용등급 개념 기준 및 과거 기준일 보고 재현성
      failure_condition: 등급 스케일 또는 매핑이 변경되거나 보고서 팀이 시장 상황에 따라 Exposure.risk_grade를 수동
        조정한 뒤 과거 기준일의 등급을 재현해야 하는 경우
      impact: 공유 권위 문서가 현재 값만 표현하므로 엔진 산출 등급, 차주 내부등급, 보고용 익스포저 등급 중 어느 값이 특정 시점의 권위
        값인지 판별할 수 없고, 과거 보고·감사·리스크 재계산의 신뢰성이 손상된다.
      evidence_refs:
        - "Borrower.internal_rating note: 내부 신용등급. 1~10 숫자 등급 체계."
        - "RiskRating.grade note: 엔진 등급. Borrower.internal_rating과 매핑 테이블은 리스크팀
          위키 참조."
        - "Exposure.risk_grade note: 익스포저 단위 리스크 등급. 보고서 팀이 사용."
        - "classification_rules[0]: Exposure.risk_grade는 RiskRating.grade에서
          도출하되, 보고서 팀이 시장 상황에 따라 수동 조정할 수 있다."
        - "notes[0]: 차주 등급(internal_rating 1~10, RiskRating R1~R5, Exposure
          risk_grade AAA~CCC)의 3개 스케일은 역사적 이유로 병존한다. 변환은 각 소비 시스템이 수행한다."
    causal_path:
      root_cause_candidate: 등급을 시점 의존 assignment와 versioned mapping으로 모델링하지 않고 여러 엔티티의
