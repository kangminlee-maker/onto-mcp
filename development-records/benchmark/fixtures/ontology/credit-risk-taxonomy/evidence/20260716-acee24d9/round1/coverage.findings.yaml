  - candidate_id: coverage-candidate-002
    target: credit-risk-ontology.yaml / classification_rules[0] and notes[0]
    evidence_anchor: "Embedded materialized input: classification_rules[0];
      notes[0]; RiskRating.grade note"
    claim: 등급 변환과 보고용 수동 조정에 대한 감사 증거 개념이 누락되어 통제 행위의 행위자·시각·근거를 추적할 수 없다.
    what: 분류 규칙은 보고서 팀이 시장 상황에 따라 Exposure.risk_grade를 수동 조정할 수 있다고 하지만, 조정 이벤트,
      조정자, 승인자, 조정 시각, 조정 사유, 근거 자료, 원래 엔진 등급 같은 감사 추적 개념을 제공하지 않는다. 또한 등급 매핑
      테이블이 리스크팀 위키에 있다고만 되어 있어 매핑 변경의 권위·버전·승인 증거도 대상 온톨로지 안에 없다.
    why: 수동 조정은 통제가 필요한 행위이며, 리스크 엔진 산출값과 보고 시스템 표시값을 달라지게 할 수 있다. 공유 개념 기준 문서가 조정의
      감사 증거 범주를 포함하지 않으면 보고 값이 엔진 값과 다른 이유를 사후에 설명하거나 승인된 조정과 임의 변경을 구분하기 어렵다.
    how_to_fix: ManualRatingAdjustment 또는 RatingOverride 엔티티를 추가하고 original_grade,
      adjusted_grade, actor, approver, adjusted_at, reason_code, evidence_ref,
      approval_status, effective_period를 포함한다. 등급 매핑도
      MappingVersion/MappingApproval로 모델링해 위키 참조가 아니라 온톨로지 내 권위 개념으로 편입한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진 산출과 보고 시스템 사용 값 사이의 통제 가능하고 감사 가능한 공유 기준
      failure_condition: 보고서 팀이 Exposure.risk_grade를 수동 조정하거나 리스크팀 매핑 테이블 변경으로 소비 시스템별
        등급 변환 결과가 달라지는 경우
      impact: 수동 조정의 행위자·시각·근거가 개념화되지 않아 보고 등급 변경의 정당성, 승인 여부, 원천 등급 대비 차이를 검증할 수 없고
        운영 리스크와 감사 대응 결함이 발생한다.
      evidence_refs:
        - "classification_rules[0]: Exposure.risk_grade는 RiskRating.grade에서
          도출하되, 보고서 팀이 시장 상황에 따라 수동 조정할 수 있다."
        - "RiskRating.grade note: 엔진 등급. Borrower.internal_rating과 매핑 테이블은 리스크팀
          위키 참조."
        - "notes[0]: 변환은 각 소비 시스템이 수행한다."
    causal_path:
      root_cause_candidate: 통제 행위인 등급 override와 매핑 변경을 독립된 감사 가능한 사건 개념으로 포함하지 않은 범위 결손
      root_cause_step_id: coverage-candidate-002.cause-004
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: 온톨로지는 보고서 팀의 시장 상황 기반 수동 등급 조정을 허용한다.
          relation_to_previous: null
          evidence_refs:
            - classification_rules[0]
        - cause_id: coverage-candidate-002.cause-002
          claim: 등급 변환은 각 소비 시스템이 수행하고 매핑 테이블은 대상 온톨로지 밖의 리스크팀 위키를 참조한다.
          relation_to_previous: enables
          evidence_refs:
            - RiskRating.grade note
            - notes[0]
        - cause_id: coverage-candidate-002.cause-003
          claim: 대상 엔티티에는 수동 조정 이벤트나 매핑 변경 승인·증거를 담는 개념이 없다.
