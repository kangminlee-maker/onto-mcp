  - candidate_id: axiology-candidate-002
    target: credit-risk-ontology.yaml rating scale notes and RiskRating.grade
    evidence_anchor: .onto/review/20260716-acee24d9/execution-preparation/materialized-input.md:20-22,53-56,97-98;
      .onto/review/20260716-acee24d9/execution-preparation/review-value-alignment-criteria.yaml:5-8
    claim: 등급 스케일 변환을 각 소비 시스템에 맡겨 공유 개념 기준 목적을 훼손한다.
    what: Borrower.internal_rating, RiskRating.grade, Exposure.risk_grade 세 스케일이
      병존하며, 변환은 각 소비 시스템이 수행한다고 되어 있다. RiskRating.grade의 매핑도 리스크팀 위키를 참조하라고만 되어
      있어 온톨로지 내부의 권위 규칙으로 닫히지 않는다.
    why: 이 온톨로지의 목적은 엔진과 보고 시스템이 공유할 개념 기준을 제공하는 것이다. 그런데 등급 변환의 의미와 책임을 각 소비 시스템으로
      분산하면 같은 차주/익스포저 등급이 시스템별 변환표, 버전, 적용일에 따라 달라질 수 있다. 이는 역사적 병존이라는 국소 현실을
      보존하는 대신 공유 기준이라는 상위 목적을 양보한 숨은 트레이드오프다.
    how_to_fix: 세 등급 스케일을 인정하되, canonical RatingScale과 RatingMapping 개념을 온톨로지 안에
      추가하라. source_scale, target_scale, source_grade, target_grade,
      mapping_version, owner, effective_from/effective_to, precedence를 정의하고 외부
      위키는 비권위 참고가 아니라 해당 규칙의 출처/운영 절차로만 연결하라.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템 사이의 등급 의미 및 변환 기준 공유.
      failure_condition: 엔진, 보고서, 기타 소비 시스템이 각자 다른 변환표나 다른 시점의 위키 규칙으로
        internal_rating/RiskRating/Exposure risk_grade를 변환하는 경우.
      impact: 공유 온톨로지가 등급 의미의 단일 기준이 되지 못하고, 시스템별 해석 차이를 정당화하는 문서가 되어 보고 및 리스크 판단 간
        불일치를 만든다.
      evidence_refs:
