        - materialized-input.md:92-93 permits report-team manual adjustment
        - review-value-alignment-criteria.yaml:5-8 captures the review purpose
          as shared conceptual standard and authority/time risk review
    causal_path:
      root_cause_candidate: 등급 조정이라는 별도 권위 행위를 원본 등급 개념 안에 무조건 허용하면서 조정 권위와 우선순위를 모델링하지 않았다.
      root_cause_step_id: axiology-candidate-001.cause-003
      steps:
