    claim: "`ltv` is named as a collateral ratio but modeled as an independent
      underwriter input while its source concepts coexist in the ontology."
    lens_rationale_summary: A ratio field stored as an independent input can diverge
      from the amount and appraisal values that define the risk meaning of the
      ratio. For a shared ontology, this makes it unclear whether LTV is
      authoritative input, derived value, or historical snapshot.
    proposed_action: Define `ltv` as a derived or snapshot attribute with explicit
      formula, denominator source, timestamp, and authority. If manual override
