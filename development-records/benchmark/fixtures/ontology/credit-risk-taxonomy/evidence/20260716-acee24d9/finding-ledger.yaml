  - finding_id: finding-012
    lens_id: logic
    source_ref: .onto/review/20260716-acee24d9/round1/logic.findings.yaml#logic-candidate-001
    target: credit-risk-ontology.yaml / entities.Collateral
    evidence_anchor: "Embedded Materialized Input: `Exposure` definition;
