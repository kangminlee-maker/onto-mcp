      Collateral` with `kind: secured_by`."
    claim: "`Collateral` is simultaneously modeled as an `Exposure` subtype and as
      the asset secured by an `Exposure`, creating a type-level conflict for the
      same entity role."
    lens_rationale_summary: "The conflict is formed by explicit claims in the
      artifact: `Exposure` is the credit exposure, `Collateral` is the securing
      asset, `Collateral is_a Exposure`, and the relation `Exposure secured_by
      Collateral` uses Collateral as the secured asset target. These cannot all
      be satisfied without collapsing exposure and collateral asset into the
      same class, which weakens the ontology as a shared concept authority for a
      risk engine and reporting system because systems may inherit exposure
      attributes onto collateral records or count collateral as exposure."
    proposed_action: "Remove `is_a: Exposure` from `Collateral` and keep collateral
      connected through the `Exposure -> Collateral secured_by` relation; if a
      shared parent is needed, introduce a neutral parent such as `RiskObject`
      only with attributes valid for both concepts."
