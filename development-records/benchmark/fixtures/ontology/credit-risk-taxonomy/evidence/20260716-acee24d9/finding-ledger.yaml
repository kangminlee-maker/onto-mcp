  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260716-acee24d9/round1/axiology.findings.yaml#axiology-candidate-003
    target: credit-risk-ontology.yaml Limit utilization and ExposureAggregate
      temporality
    evidence_anchor: .onto/review/20260716-acee24d9/execution-preparation/materialized-input.md:64-76,78-83,92-95;
      .onto/review/20260716-acee24d9/execution-preparation/review-value-alignment-criteria.yaml:5-8
    claim: 한도 소진율과 RiskAppetite 준수 판단이 시스템별 환율표와 월말 배치 집계에 의존해 시간성·권위 목적에서 drift 된다.
    lens_rationale_summary: RiskAppetite 준수 여부는 운영상 민감한 개념인데, 입력 총액은 월말 기준으로 낡을 수 있고
      환산 기준은 시스템별로 달라질 수 있다. 공유 개념 권위 문서의 목적상 같은 시점의 같은 포트폴리오에 대해 엔진과 보고 시스템이 같은
      준수 상태를 재현해야 하지만, 현재 설계는 시간 기준과 환율 권위를 분산시켜 서로 다른 소진율과 위반 여부를 허용한다.
    proposed_action: Limit 소진율과 RiskAppetite 준수 판단에 canonical valuation_time/as_of,
      aggregation_cutoff, freshness_status, fx_rate_source, fx_rate_timestamp,
      currency_basis를 추가하라. 월말 배치 값은 stale 가능성을 명시하고, 일중 판단이 필요한 준수 상태에는 별도
      current exposure source 또는 'not current' 상태를 모델링하라.
    affected_purpose: 리스크 엔진과 보고 시스템이 한도 소진율 및 RiskAppetite 준수 상태를 동일한 권위와 시간 기준으로 공유하는 것.
    failure_condition: 일중 신규 여신이 존재하거나 통화가 다른 한도/익스포저를 다룰 때, 시스템별 환율표와 월말 집계 시점 차이로
      소진율 또는 breached/compliant 상태가 달라지는 경우.
    impact: 위반 상태라는 핵심 운영 신호가 공유 온톨로지에서 재현 가능한 권위 값이 아니게 되어 보고 지연, 한도 초과 미탐지, 엔진-보고
      불일치 위험을 만든다.
    evidence_refs:
      - .onto/review/20260716-acee24d9/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:69-76 defines monthly-batch ExposureAggregate and
        intraday omission
      - materialized-input.md:78-83 defines RiskAppetite compliance_status from
        ExposureAggregate threshold breach
      - materialized-input.md:92-95 defines utilization and system-specific FX
        tables
      - review-value-alignment-criteria.yaml:5-8 highlights shared concept
        standard and temporality concerns
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 한도 소진율 및 RiskAppetite 준수 상태를 동일한 권위와 시간 기준으로 공유하는 것.
      failure_condition: 일중 신규 여신이 존재하거나 통화가 다른 한도/익스포저를 다룰 때, 시스템별 환율표와 월말 집계 시점 차이로
        소진율 또는 breached/compliant 상태가 달라지는 경우.
      impact: 위반 상태라는 핵심 운영 신호가 공유 온톨로지에서 재현 가능한 권위 값이 아니게 되어 보고 지연, 한도 초과 미탐지, 엔진-보고
        불일치 위험을 만든다.
      evidence_refs:
        - materialized-input.md:69-76 defines monthly-batch ExposureAggregate
          and intraday omission
        - materialized-input.md:78-83 defines RiskAppetite compliance_status
          from ExposureAggregate threshold breach
        - materialized-input.md:92-95 defines utilization and system-specific FX
          tables
        - review-value-alignment-criteria.yaml:5-8 highlights shared concept
          standard and temporality concerns
    causal_path:
      root_cause_candidate: 한도/준수 판단에 필요한 시간 기준과 환율 권위를 공유 개념으로 닫지 않고 소비 시스템과 배치 주기에 맡겼다.
      root_cause_step_id: finding-003.cause-004
      steps:
        - cause_id: finding-003.cause-001
          claim: ExposureAggregate.total_amount는 월말 배치 저장 값이며 일중 신규 여신은 다음 배치까지 미반영된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-76
        - cause_id: finding-003.cause-002
          claim: 통화가 다르면 각 시스템의 당일 환율 테이블로 Limit 소진율을 계산한다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:92-95
        - cause_id: finding-003.cause-003
          claim: RiskAppetite 준수 상태는 ExposureAggregate가 threshold를 초과하는지로 정의된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:78-83
        - cause_id: finding-003.cause-004
          claim: 대상은 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향하며, 검토 목적은 시간성·권위의 운영 위험을 포함한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:6-8
            - review-value-alignment-criteria.yaml:5-8
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260716-acee24d9/round1/coverage.findings.yaml#coverage-candidate-001
    target: credit-risk-ontology.yaml / RiskRating, Borrower.internal_rating,
      Exposure.risk_grade
    evidence_anchor: "Embedded materialized input:
      Borrower.attributes.internal_rating note; RiskRating.attributes.grade
      note; Exposure.attributes.risk_grade note; notes[0];
      classification_rules[0]"
    claim: 병존하는 3개 신용등급 스케일에 대해 유효기간, 이력, 매핑 기준시점 개념이 누락되어 과거 시점의 등급 재구성이 불가능하다.
    lens_rationale_summary: 대상 문서는 리스크 엔진과 보고 시스템이 공유하는 개념 권위 문서를 지향한다고 선언한다. 그러나
      보고서 팀이 Exposure.risk_grade를 사용하고 수동 조정할 수 있으며, 3개 등급 스케일 변환을 각 소비 시스템이
      수행한다고 되어 있어 등급 값은 시스템·시점 의존적이다. 이 상태에서 유효기간과 이력 개념이 없으면 특정 보고 기준일이나 과거
      의사결정 시점에 어떤 등급과 매핑이 권위 있었는지 복원할 수 없어 엔진 산출과 보고 값의 공유 기준이 약해진다.
    proposed_action: 등급 관련 개념을 RatingScale, RatingAssignment, RatingMappingVersion
      같은 별도 개념으로 분리하고, 각 등급 부여 및 매핑에 effective_from/effective_to, calculated_at
      또는 assigned_at, source_system, superseded_by를 추가한다. Exposure.risk_grade의
      수동 조정도 원등급과 조정등급을 구분해 기준시점별로 보존한다.
    affected_purpose: 리스크 엔진과 보고 시스템이 공유할 신용등급 개념 기준 및 과거 기준일 보고 재현성
    failure_condition: 등급 스케일 또는 매핑이 변경되거나 보고서 팀이 시장 상황에 따라 Exposure.risk_grade를 수동
