  - finding_id: finding-009
    lens_id: evolution
    source_ref: .onto/review/20260716-acee24d9/round1/evolution.findings.yaml#evolution-candidate-002
    target: credit-risk-ontology.yaml / ExposureAggregate and classification_rules[1]
    evidence_anchor: "Embedded Materialized Input: `ExposureAggregate.total_amount`
      note says `월말 배치로 계산해 저장. 일중 신규 여신은 다음 배치까지 미반영.`; classification rule
      says `Limit 소진율 = ExposureAggregate.total_amount / Limit.approved_amount.
      통화가 다른 경우 환산은 각 시스템의 당일 환율 테이블을 사용한다.`"
    claim: Exposure aggregation and limit-utilization rules are not temporally
      versioned, so adding intraday products, currencies, or reporting cutoffs
      can break continuity of limit calculations.
    lens_rationale_summary: A credit risk taxonomy that must serve both engines and
      reports needs stable temporal semantics for replay, audit, and future
      product/currency expansion. Here, intraday exposures are explicitly
      excluded until the next batch, while limit utilization uses that stale
      aggregate and system-local FX. When new intraday facilities, currencies,
      or reporting frequencies are added, the existing concepts cannot absorb
      them without changing calculation semantics or accepting inconsistent
      utilization outputs.
    proposed_action: "Introduce explicit temporal and valuation concepts:
      `ExposureSnapshot` or `ExposureAggregate` with calculation_frequency,
      included_exposure_cutoff, as_of timestamp, source batch/run id, and FX
      source/rate_time. Define limit utilization against a named snapshot and
      canonical FX policy."
    affected_purpose: Shared risk-engine and reporting basis for limit utilization
      and exposure aggregation.
    failure_condition: When the ontology must support intraday lending, additional
      currencies, or different report cutoffs, the same borrower and limit can
      receive different utilization results depending on batch timing and each
      system's FX table.
    impact: "The ontology is not evolution-resilient for temporal expansion: future
      reporting or engine changes require reworking core aggregate semantics and
      may disrupt comparability with historical stored totals."
    evidence_refs:
      - .onto/review/20260716-acee24d9/round1/evolution.findings.yaml#evolution-candidate-002
      - "Embedded Materialized Input: `ExposureAggregate.definition` says it is
        the borrower-level total of all `Exposure.amount`."
      - "Embedded Materialized Input: `ExposureAggregate.total_amount` note says
        month-end batch storage and intraday omissions."
      - "Embedded Materialized Input: `ExposureAggregate.as_of` is a date, not a
        timestamp or run/version reference."
      - "Embedded Materialized Input: classification rule for limit utilization
        uses each system's same-day exchange-rate table."
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Shared risk-engine and reporting basis for limit utilization
        and exposure aggregation.
      failure_condition: When the ontology must support intraday lending, additional
        currencies, or different report cutoffs, the same borrower and limit can
        receive different utilization results depending on batch timing and each
        system's FX table.
      impact: "The ontology is not evolution-resilient for temporal expansion: future
        reporting or engine changes require reworking core aggregate semantics
        and may disrupt comparability with historical stored totals."
      evidence_refs:
        - "Embedded Materialized Input: `ExposureAggregate.definition` says it
          is the borrower-level total of all `Exposure.amount`."
        - "Embedded Materialized Input: `ExposureAggregate.total_amount` note
          says month-end batch storage and intraday omissions."
        - "Embedded Materialized Input: `ExposureAggregate.as_of` is a date, not
          a timestamp or run/version reference."
        - "Embedded Materialized Input: classification rule for limit
          utilization uses each system's same-day exchange-rate table."
    causal_path:
      root_cause_candidate: The ontology combines stored batch aggregates with
        system-local FX conversion but lacks canonical snapshot/version and
        valuation-time concepts.
      root_cause_step_id: finding-009.cause-004
      steps:
        - cause_id: finding-009.cause-001
          claim: "`ExposureAggregate.total_amount` is defined as the total of all exposure
            amounts but is stored from a month-end batch that omits intraday new
            credit until the next batch."
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `ExposureAggregate.definition`: `차주
              단위 총익스포저. 모든 Exposure.amount의 합.`"
            - "Embedded Materialized Input: `ExposureAggregate.total_amount`
              note: month-end batch and intraday omission."
        - cause_id: finding-009.cause-002
          claim: Limit utilization is computed from that aggregate and approved limit
            amount.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: classification rule `Limit 소진율 =
              ExposureAggregate.total_amount / Limit.approved_amount`."
        - cause_id: finding-009.cause-003
          claim: Currency conversion is delegated to each system's same-day FX table,
            leaving no stable valuation authority in the ontology.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: classification rule says different
              currencies use each system's same-day exchange-rate table."
        - cause_id: finding-009.cause-004
          claim: Future intraday, multi-currency, or higher-frequency reporting changes
            can alter utilization results without a versioned snapshot or FX
            policy preserving continuity.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `ExposureAggregate.as_of` only
              provides a date."
            - "Embedded Materialized Input: month-end aggregate note and
              each-system FX rule."
      unresolved_beyond_evidence: The bounded target does not include actual batch or
        FX table implementations; the finding is about missing ontology-level
        temporal and valuation authority.
  - finding_id: finding-010
    lens_id: evolution
    source_ref: .onto/review/20260716-acee24d9/round1/evolution.findings.yaml#evolution-candidate-003
    target: credit-risk-ontology.yaml / enumerated category attributes
    evidence_anchor: "Embedded Materialized Input: `Borrower.segment` values
      `[retail, sme, corporate]`; `Exposure.product_type` values `[term_loan,
      revolving, guarantee]`; `Collateral.collateral_type` values `[real_estate,
      deposit, securities]`; `Exposure.risk_grade` and `RiskRating.grade` are
      also closed enum lists."
    claim: Core business classifications are modeled as closed inline enums, so new
      borrower segments, products, collateral classes, or grades require schema
      edits rather than additive extension.
    lens_rationale_summary: For an evolving credit-risk concept standard, categories
      such as product type, collateral type, segment, and grade are expected to
      expand as portfolios, regulations, and reporting needs change. Inline
      closed enums force changes directly into existing attribute definitions,
      increasing migration pressure and making it harder to preserve historical
      category meaning or support consumer compatibility.
    proposed_action: Promote volatile classifications to managed taxonomy concepts
      such as `ProductType`, `CollateralType`, `BorrowerSegment`, and
      `GradeCode` with stable ids, labels, active/deprecated status,
      version/effective dates, and parent/category relations. Keep attributes as
      references to those taxonomy entries.
    affected_purpose: Extensible shared classification ontology for credit-risk
      engine and reporting concepts.
    failure_condition: When a new segment, product, collateral class, or grade is
      introduced, the ontology must edit existing enum declarations and
      downstream validators instead of adding a new taxonomy record with
      compatibility metadata.
    impact: This creates brittle evolution and migration risk in the core
      classification surface, especially for systems that rely on the ontology
      as a shared validation and reporting basis.
    evidence_refs:
      - .onto/review/20260716-acee24d9/round1/evolution.findings.yaml#evolution-candidate-003
      - "Embedded Materialized Input: `Borrower.segment` inline enum values."
      - "Embedded Materialized Input: `Exposure.product_type` inline enum
        values."
      - "Embedded Materialized Input: `Collateral.collateral_type` inline enum
        values."
      - "Embedded Materialized Input: `RiskRating.grade` and
        `Exposure.risk_grade` inline enum values."
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Extensible shared classification ontology for credit-risk
        engine and reporting concepts.
      failure_condition: When a new segment, product, collateral class, or grade is
        introduced, the ontology must edit existing enum declarations and
        downstream validators instead of adding a new taxonomy record with
        compatibility metadata.
      impact: This creates brittle evolution and migration risk in the core
        classification surface, especially for systems that rely on the ontology
        as a shared validation and reporting basis.
      evidence_refs:
        - "Embedded Materialized Input: `Borrower.segment` inline enum values."
        - "Embedded Materialized Input: `Exposure.product_type` inline enum
          values."
        - "Embedded Materialized Input: `Collateral.collateral_type` inline enum
          values."
        - "Embedded Materialized Input: `RiskRating.grade` and
          `Exposure.risk_grade` inline enum values."
    causal_path:
      root_cause_candidate: The ontology encodes volatile classification vocabularies
        as closed attribute-local enums instead of first-class extensible
        taxonomy concepts.
      root_cause_step_id: finding-010.cause-003
      steps:
        - cause_id: finding-010.cause-001
          claim: Multiple core classification axes are closed inline enum lists inside
            attributes.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `Borrower.segment`,
              `Exposure.product_type`, `Collateral.collateral_type`,
              `RiskRating.grade`, and `Exposure.risk_grade` enum declarations."
        - cause_id: finding-010.cause-002
          claim: Inline enum expansion requires modifying existing attribute schemas
            rather than adding separate taxonomy records.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: enum values are embedded directly
              under each attribute; no separate taxonomy entities for product,
              collateral, segment, or grade codes are defined."
        - cause_id: finding-010.cause-003
          claim: Without lifecycle or effective-version metadata, future category changes
