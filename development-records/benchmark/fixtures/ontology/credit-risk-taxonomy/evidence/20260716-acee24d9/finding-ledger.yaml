  - finding_id: finding-008
    lens_id: evolution
    source_ref: .onto/review/20260716-acee24d9/round1/evolution.findings.yaml#evolution-candidate-001
    target: credit-risk-ontology.yaml / classification_rules[0] and notes[0]
    evidence_anchor: "Embedded Materialized Input: `classification_rules` states
      `Exposure.risk_grade는 RiskRating.grade에서 도출하되, 보고서 팀이 시장 상황에 따라 수동 조정할 수
      있다.`; `notes` states `차주 등급(internal_rating 1~10, RiskRating R1~R5,
      Exposure risk_grade AAA~CCC)의 3개 스케일은 역사적 이유로 병존한다. 변환은 각 소비 시스템이 수행한다.`"
    claim: Three rating scales are left to consumer-side conversion, so rating-scale
      evolution requires coordinated changes in every consuming system and can
      break continuity between engine and reports.
    lens_rationale_summary: Because the ontology is intended as the shared concept
      authority for a risk engine and reporting system, leaving scale conversion
      outside the ontology means any new grade, rating-model change, or report
      override policy change must be reimplemented across consumers. Historical
      results also cannot be consistently reinterpreted because there is no
      versioned conversion authority tying `RiskRating.grade`,
      `Borrower.internal_rating`, and `Exposure.risk_grade` together over time.
    proposed_action: Add a canonical `RatingScale`/`RatingMapping` concept with
      source scale, target scale, mapping rules, owner, version,
      effective_from/effective_to, and override provenance. Make
      `Exposure.risk_grade` derivation reference that mapping rather than
      consumer-local conversion.
    affected_purpose: The ontology's declared purpose as a shared concept authority
      for risk engine and reporting systems.
    failure_condition: When a rating scale changes, a new grade is introduced, or
      report-side manual adjustment policy changes, consumers must independently
      update conversion logic and may produce inconsistent or non-replayable
      classifications.
    impact: "This weakens review trust in the ontology as an extensible shared
      basis: the central classification concept is not change-tolerant, and
      engine/report continuity depends on undocumented external
      implementations."
    evidence_refs:
      - .onto/review/20260716-acee24d9/round1/evolution.findings.yaml#evolution-candidate-001
      - "Embedded Materialized Input: header comment says the model targets
        shared concept authority for risk engine and report systems."
      - "Embedded Materialized Input: `RiskRating.grade` values `[R1, R2, R3,
        R4, R5]` with note pointing to a risk-team wiki mapping."
      - "Embedded Materialized Input: `Exposure.risk_grade` values `[AAA, AA, A,
        BBB, BB, B, CCC]`."
      - "Embedded Materialized Input: `Borrower.internal_rating` note says `1~10
        숫자 등급 체계`."
      - "Embedded Materialized Input: notes say transformations are performed by
        each consuming system."
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: The ontology's declared purpose as a shared concept authority
        for risk engine and reporting systems.
      failure_condition: When a rating scale changes, a new grade is introduced, or
        report-side manual adjustment policy changes, consumers must
        independently update conversion logic and may produce inconsistent or
        non-replayable classifications.
      impact: "This weakens review trust in the ontology as an extensible shared
        basis: the central classification concept is not change-tolerant, and
        engine/report continuity depends on undocumented external
        implementations."
      evidence_refs:
        - "Embedded Materialized Input: header comment says the model targets
          shared concept authority for risk engine and report systems."
        - "Embedded Materialized Input: `RiskRating.grade` values `[R1, R2, R3,
          R4, R5]` with note pointing to a risk-team wiki mapping."
        - "Embedded Materialized Input: `Exposure.risk_grade` values `[AAA, AA,
          A, BBB, BB, B, CCC]`."
        - "Embedded Materialized Input: `Borrower.internal_rating` note says
          `1~10 숫자 등급 체계`."
        - "Embedded Materialized Input: notes say transformations are performed
          by each consuming system."
    causal_path:
      root_cause_candidate: The ontology does not make rating conversion a versioned,
        owned concept inside the target artifact and instead delegates it to
        external consumer systems.
      root_cause_step_id: finding-008.cause-003
      steps:
        - cause_id: finding-008.cause-001
          claim: The target contains three rating scales for borrower/internal, engine,
            and exposure/report classifications.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `Borrower.internal_rating` note says
              `1~10 숫자 등급 체계`."
            - "Embedded Materialized Input: `RiskRating.grade` values `[R1, R2,
              R3, R4, R5]`."
            - "Embedded Materialized Input: `Exposure.risk_grade` values `[AAA,
              AA, A, BBB, BB, B, CCC]`."
        - cause_id: finding-008.cause-002
          claim: The target does not define the conversion as an ontology entity or
            versioned relation; it points to an external wiki and each consumer
            system.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: `RiskRating.grade` note says mapping
              table is in the risk-team wiki."
            - "Embedded Materialized Input: notes say transformations are
