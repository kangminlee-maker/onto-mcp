  - issue_id: issue-004
    root_cause_hypothesis: External default/delinquency state is excluded from the
      shared ontology instead of modeled as a minimal authoritative
      lifecycle-status reference with source and timing metadata.
    root_confidence: medium
    surface_finding_ids:
      - finding-007
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: The ontology leaves delinquency/default lifecycle states
      outside the shared credit-risk concept standard even though those states
      affect risk classification, reporting, limits, and collateral treatment.
    proposed_action: Add a minimal DefaultStatus or ExposureLifecycleStatus
      reference concept with source_system, status, effective and received
      timestamps, and history reference, while preserving the external system as
      authority if applicable.
    affected_purpose: Completeness of the shared exposure-risk lifecycle basis for
      risk-engine and reporting classification.
    failure_condition: An exposure transitions into delinquent or default state and
      downstream grades, aggregations, collateral handling, or reports depend on
      that state.
    impact: A core risk lifecycle segment remains outside the shared standard,
      allowing engine and reporting consumers to classify the same exposure
      differently after default transition.
    evidence_refs:
      - .onto/review/20260716-acee24d9/round1/coverage.findings.yaml#coverage-candidate-004
      - "Exposure.definition: 차주에 대한 신용 익스포저(대출, 한도성 여신 포함)."
      - "Exposure.attributes: exposure_id, borrower_ref, amount, product_type,
        risk_grade, ltv"
      - "notes[1]: 연체/부실(default) 상태는 별도 시스템(연체관리)에서 다루므로 이 온톨로지의 범위 밖이다."
      - "Embedded materialized input: Exposure entity; notes[1]"
    severity: medium
    domain_threshold_used: null
    singleton_reason: "Runtime projection: no accepted semantic relation covered
      this causal-analysis finding."
  - issue_id: issue-005
    root_cause_hypothesis: The ontology does not make rating conversion a versioned,
      owned concept inside the target artifact and instead delegates it to
      external consumer systems.
    root_confidence: medium
    surface_finding_ids:
      - finding-008
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: Three rating scales are left to consumer-side conversion, so
      rating-scale evolution requires coordinated changes in every consuming
      system and can break continuity between engine and reports.
    proposed_action: Add a canonical `RatingScale`/`RatingMapping` concept with
      source scale, target scale, mapping rules, owner, version,
      effective_from/effective_to, and override provenance. Make
      `Exposure.risk_grade` derivation reference that mapping rather than
      consumer-local conversion.
    affected_purpose: The ontology's declared purpose as a shared concept authority
      for risk engine and reporting systems.
    failure_condition: When a rating scale changes, a new grade is introduced, or
      report-side manual adjustment policy changes, consumers must independently
      update conversion logic and may produce inconsistent or non-replayable
      classifications.
    impact: "This weakens review trust in the ontology as an extensible shared
      basis: the central classification concept is not change-tolerant, and
      engine/report continuity depends on undocumented external
      implementations."
    evidence_refs:
      - .onto/review/20260716-acee24d9/round1/evolution.findings.yaml#evolution-candidate-001
      - "Embedded Materialized Input: header comment says the model targets
        shared concept authority for risk engine and report systems."
