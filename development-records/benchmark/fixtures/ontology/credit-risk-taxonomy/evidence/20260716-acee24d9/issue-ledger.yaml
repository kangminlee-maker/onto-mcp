  - issue_id: issue-007
    root_cause_hypothesis: Volatile business classifications are encoded as closed
      attribute-local enums rather than managed taxonomy concepts with lifecycle
      and compatibility metadata.
    root_confidence: medium
    surface_finding_ids:
      - finding-010
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: The ontology makes core categories such as segment, product
      type, collateral type, and grades brittle under normal portfolio,
      regulatory, or reporting evolution.
    proposed_action: Promote volatile classifications to managed taxonomy concepts
      with stable ids, labels, active/deprecated status, version/effective
      dates, aliases, and parent/category relations; keep attributes as
      references.
    affected_purpose: Extensible shared classification ontology for credit-risk
      engine and reporting concepts.
    failure_condition: A new borrower segment, product type, collateral class, or
      grade must be introduced while preserving historical meaning and
      downstream compatibility.
    impact: Schema edits and consumer validator changes become necessary for
      ordinary category growth, increasing migration pressure and weakening
      continuity of the shared classification surface.
    evidence_refs:
      - .onto/review/20260716-acee24d9/round1/evolution.findings.yaml#evolution-candidate-003
      - "Embedded Materialized Input: `Borrower.segment` inline enum values."
      - "Embedded Materialized Input: `Exposure.product_type` inline enum
        values."
      - "Embedded Materialized Input: `Collateral.collateral_type` inline enum
