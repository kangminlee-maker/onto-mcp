  - issue_id: issue-008
    root_cause_hypothesis: The ontology conflates collateral assets with credit
      exposures by using Exposure inheritance for Collateral while also modeling
      Collateral as the asset that secures an Exposure.
    root_confidence: high
    surface_finding_ids:
      - finding-011
      - finding-012
      - finding-013
    relation_refs:
      - rel-012
      - rel-014
    raised_by_lens_ids:
      - evolution
      - logic
      - semantics
    issue_statement: Collateral is assigned incompatible roles as both an Exposure
      subtype and a securing asset related from Exposure, creating a type-level
      and lifecycle modeling conflict.
    proposed_action: Remove Collateral is_a Exposure and model collateral as a
      separate asset/support concept connected through a relationship entity
      such as SecurityAgreement or CollateralLink with allocation, priority,
      valuation, and effective-date semantics.
    affected_purpose: Shared concept authority for exposure and collateral
      management across risk-engine and reporting systems.
    failure_condition: A consumer interprets is_a as inheritance/subtyping, or
      collateral coverage expands to pooled collateral, multiple valuations,
      lien priority, guarantees, substitutions, or other collateral-specific
      lifecycles.
    impact: Consumers may apply exposure fields, aggregation, or reporting logic to
      collateral records, corrupting the exposure/collateral boundary and
      forcing disruptive remodels for collateral evolution.
    evidence_refs:
      - .onto/review/20260716-acee24d9/round1/evolution.findings.yaml#evolution-candidate-004
      - "Embedded Materialized Input: `Collateral.definition` describes a
        securing asset and valuation unit."
      - "Embedded Materialized Input: `Collateral` declares `is_a: Exposure`."
      - "Embedded Materialized Input: relation `Exposure -> Collateral` with
        kind `secured_by`."
      - "Embedded Materialized Input: `Exposure` attributes include borrower,
