        `Collateral` through `is_a`."
      - "Embedded Materialized Input: `Collateral.definition` says `익스포저를 담보하는
        자산. 담보 평가의 기본 단위.` while `Collateral` also declares `is_a: Exposure`;
        relations include `{ from: Exposure, to: Collateral, kind: secured_by
        }`."
      - .onto/review/20260716-acee24d9/round1/logic.findings.yaml#logic-candidate-001
      - "credit-risk-ontology.yaml: Exposure definition in Embedded Materialized
