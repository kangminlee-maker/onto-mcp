  - issue_id: issue-001
    root_cause_hypothesis: Rating changes and report-side overrides are modeled as
      mutable/current grade attributes rather than time-bound, governed,
      auditable rating events with authority, effective period, approval, and
      replay metadata.
    root_confidence: high
    surface_finding_ids:
      - finding-001
      - finding-005
      - finding-004
    relation_refs:
      - rel-001
      - rel-005
    raised_by_lens_ids:
      - axiology
      - coverage
    issue_statement: The ontology cannot establish a shared authoritative rating
      value when report-side manual adjustments, historical rating assignments,
      and mapping changes are not represented as distinct governed events.
    proposed_action: Separate rating assignment, mapping/version, and manual
      override concepts from current grade attributes, carrying owner, approval,
      reason, source and adjusted grades, effective period, timestamp,
      precedence, and audit evidence.
    affected_purpose: Shared, reproducible credit-rating concept authority for the
      risk engine and reporting system, including past reporting-date replay and
      auditability.
    failure_condition: A report team manually adjusts Exposure.risk_grade, a rating
      mapping changes, or a past reporting date must be reconstructed after
      grade or override activity occurred.
    impact: Engine outputs, reporting grades, and historical reconstructions can
      each appear valid while lacking a common authority trail, weakening
      operational consistency and audit trust.
    evidence_refs:
      - .onto/review/20260716-acee24d9/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:6-8 declares shared authority-document purpose
      - materialized-input.md:31-34 defines Exposure.risk_grade as
        report-team-used grade
