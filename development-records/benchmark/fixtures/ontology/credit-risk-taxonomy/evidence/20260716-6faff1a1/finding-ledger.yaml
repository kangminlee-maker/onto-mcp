  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260716-6faff1a1/round1/axiology.findings.yaml#axiology-candidate-002
    target: credit-risk-ontology.yaml의 집계·한도소진·RiskAppetite 시간 기준
    evidence_anchor: "가치 권위:
      review-value-alignment-criteria.yaml:6-15(user-request-intent: 공유 개념 기준의
      시간성·운영 위험 검토). 대상 증거: materialized-input.md:69-83,92-95(월말 집계와 일중 미반영,
      aggregate 기반 위반 판단, 시스템별 당일 환율)."
    claim: 동일 계산에 월말 집계와 시스템별 당일 환율을 혼합해 공유 시점 의미와 재현 가능한 준수 판단을 제공하지 못한다.
    lens_rationale_summary: 일중에는 실제 익스포저가 임계치를 넘었어도 저장된 월말 집계로 compliant가 될 수 있고,
      엔진과 보고서가 서로 다른 당일 환율을 사용하면 같은 as-of 표기에서도 소진율이나 위반 여부가 달라질 수 있다. 시간성과 권위가
      분리되어 공유 기준의 운영상 신뢰를 훼손한다.
    proposed_action: 모든 계산 입력에 동일한 valuation_as_of와 데이터 완전성 상태를 적용하고, 환율 출처·스냅샷
      시각·통화를 canonical 정책으로 지정한다. RiskAppetite 판정은 동일 시점의 aggregate와 threshold만
      허용하며, 일중 미반영 상태에서는 stale/unknown을 표현해 compliant로 단정하지 않도록 한다.
    affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 시간적으로 일관된 리스크·준수 기준
    failure_condition: 월말 이후 신규 여신이 발생하거나 두 시스템이 서로 다른 당일 환율 스냅샷을 사용하는 경우
    impact: 한도 소진율과 RiskAppetite 준수 상태가 실제 상태를 누락하거나 시스템별로 달라져 운영 의사결정과 보고 신뢰를 직접 약화한다.
    evidence_refs:
