findings:
  - candidate_id: evolution-candidate-001
    target: credit-risk-ontology.yaml의 등급 변환 및 수동 조정 계약
    evidence_anchor: RiskRating.grade.note; classification_rules[0]; notes[0]
    claim: 등급 체계 변경 시 소비 시스템별 변환과 수동 조정이 분기되어 과거 결과의 연속성이 깨질 수 있다.
    what: 세 등급 스케일의 변환은 각 소비 시스템과 리스크팀 위키에 맡겨져 있고, 보고서 팀의 수동 조정에는 적용 규칙 버전·원등급·조정
      사유·시점이 모델링되어 있지 않다.
    why: 새 등급이나 변환 기준이 도입되면 엔진과 보고 시스템이 서로 다른 시점 또는 규칙으로 변환할 수 있다. 동일한 원자료에서 다른 등급이
      생성되고, 나중에 당시 보고 결과를 재현할 canonical 근거도 남지 않으므로 공유 개념 권위라는 목적이 실패한다.
    how_to_fix: 등급 체계와 변환표를 식별자·버전·유효기간을 가진 canonical 개념으로 모델링하고, 산출 등급에 원등급, 변환 규칙
      버전, 조정 전후 값, 조정 사유·주체·시점을 기록하도록 한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 개념 권위 및 등급 결과의 장기적 연속성
      failure_condition: 등급 스케일이나 매핑이 변경되거나 보고서 팀이 수동 조정을 수행할 때
      impact: 소비 시스템별 결과가 분기되고 과거 보고 등급을 동일한 규칙으로 재현하거나 감사할 수 없다.
      evidence_refs:
        - "credit-risk-ontology.yaml: RiskRating.grade.note"
        - "credit-risk-ontology.yaml: classification_rules[0]"
        - "credit-risk-ontology.yaml: notes[0]"
    causal_path:
      root_cause_candidate: 등급 변환과 조정 정책이 온톨로지 안의 버전 관리되는 권위 개념이 아니라 소비자별 외부 로직으로 남아 있다.
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 등급 변환은 각 소비 시스템이 수행하고 매핑표는 외부 위키를 참조한다.
          relation_to_previous: null
          evidence_refs:
            - "credit-risk-ontology.yaml: RiskRating.grade.note"
            - "credit-risk-ontology.yaml: notes[0]"
        - cause_id: evolution-candidate-001.cause-002
          claim: 보고서 팀은 도출된 Exposure.risk_grade를 수동 조정할 수 있지만 조정 provenance 필드가 없다.
          relation_to_previous: enables
          evidence_refs:
            - "credit-risk-ontology.yaml: classification_rules[0]"
            - "credit-risk-ontology.yaml: Exposure.risk_grade"
        - cause_id: evolution-candidate-001.cause-003
          claim: 변환 또는 조정 기준 변경 시 결과를 구분하고 재현할 canonical 버전과 이력이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "credit-risk-ontology.yaml: version"
            - "credit-risk-ontology.yaml: RiskRating attributes"
            - "credit-risk-ontology.yaml: Exposure attributes"
      unresolved_beyond_evidence: 실제 소비 시스템이 별도 이력을 보존하는지는 경계 밖이지만, 해당 이력은 선언된 공유 온톨로지 계약에는 포함되어 있지 않다.
  - candidate_id: evolution-candidate-002
    target: credit-risk-ontology.yaml의 시간에 따라 변하는 리스크 개념
    evidence_anchor: RiskRating.attributes; Limit.attributes;
      RiskAppetite.attributes; ExposureAggregate.total_amount.note 및 as_of
    claim: 등급·한도·리스크 성향의 변경 이력을 표현할 시간 및 버전 축이 없어 새 정책 적용 시 과거 상태와 현재 상태를 연속적으로 구분할
      수 없다.
    what: RiskRating에는 평가 시점과 모델 버전이 없고, Limit과 RiskAppetite에는 유효 시작·종료 시점이나 정책 버전이
      없다. ExposureAggregate만 as_of를 가지며 월말 배치 지연은 설명되지만 입력 스냅샷이나 산출 규칙 버전은 없다.
    why: 등급 모델, 승인 한도, 리스크 성향 또는 집계 규칙이 변경되면 같은 차주와 기준일에 어떤 버전이 적용되었는지 표현할 수 없다. 기존
      값을 덮어쓰거나 시스템별 별도 이력에 의존하게 되어 시점별 리스크 판단과 보고의 연속성이 약화된다.
    how_to_fix: 시간 변동 개념에 valid_from/valid_to 또는 observed_at/as_of를 일관되게 추가하고,
      RiskRating에는 model_version, 집계에는 calculation_version과 input_snapshot_id,
      정책 개념에는 policy_version을 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템 사이의 시점 일치 및 과거 리스크 결과 재현
      failure_condition: 등급 모델, 승인 한도, 리스크 성향 또는 집계 규칙이 변경된 뒤 과거 기준일을 조회하거나 재산출할 때
      impact: 적용 당시 상태와 현재 상태를 구분할 계약이 없어 시스템 간 시점 불일치와 과거 보고 재현 실패가 발생할 수 있다.
      evidence_refs:
        - "credit-risk-ontology.yaml: RiskRating.attributes"
        - "credit-risk-ontology.yaml: Limit.attributes"
        - "credit-risk-ontology.yaml: RiskAppetite.attributes"
        - "credit-risk-ontology.yaml: ExposureAggregate.attributes"
    causal_path:
      root_cause_candidate: 변경 가능한 리스크 개념에 유효기간, 관측 시점 및 산출 버전이 공통 계약으로 모델링되지 않았다.
      root_cause_step_id: evolution-candidate-002.cause-003
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: RiskRating, Limit, RiskAppetite에는 상태가 언제 유효했는지 식별하는 속성이 없다.
          relation_to_previous: null
          evidence_refs:
            - "credit-risk-ontology.yaml: RiskRating.attributes"
            - "credit-risk-ontology.yaml: Limit.attributes"
            - "credit-risk-ontology.yaml: RiskAppetite.attributes"
        - cause_id: evolution-candidate-002.cause-002
          claim: ExposureAggregate의 as_of만으로는 월말 저장값의 입력 스냅샷과 계산 규칙 버전을 식별할 수 없다.
          relation_to_previous: enables
          evidence_refs:
            - "credit-risk-ontology.yaml: ExposureAggregate.total_amount.note"
            - "credit-risk-ontology.yaml: ExposureAggregate.as_of"
        - cause_id: evolution-candidate-002.cause-003
          claim: 정책이나 모델 변경 후 과거 상태를 동일한 의미로 복원할 수 없는 것은 공통 시간·버전 축 부재의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "credit-risk-ontology.yaml: version"
            - "credit-risk-ontology.yaml: RiskRating.attributes"
            - "credit-risk-ontology.yaml: Limit.attributes"
            - "credit-risk-ontology.yaml: RiskAppetite.attributes"
      unresolved_beyond_evidence: 물리 저장소가 자체 이력을 보존하는지는 확인할 수 없으나, 이 파일을 공유 개념 기준으로
        사용할 때 필요한 시간 계약은 대상 안에서 닫히지 않는다.
  - candidate_id: evolution-candidate-003
    target: credit-risk-ontology.yaml의 폐쇄형 분류 코드 목록
    evidence_anchor: Borrower.segment; Exposure.product_type 및 risk_grade;
      Collateral.collateral_type; RiskRating.grade
    claim: 새 세그먼트·상품·담보·등급을 추가할 때 기존 분류 정의와 모든 소비자를 함께 수정해야 한다.
    what: 주요 분류가 인라인 enum으로 고정되어 있으며 코드 목록 식별자, 개별 코드의 버전·유효기간·폐기 상태, 이전 코드와의 대체 관계
      또는 알 수 없는 값 처리 규칙이 없다.
    why: 새 상품이나 담보 유형, 세분화된 차주군, 개정 등급이 생기면 온톨로지 자체를 수정하고 소비 시스템을 동시 배포해야 한다. 구버전
      소비자는 새 값을 거부하거나 임의 처리할 수 있고, 코드가 변경·폐기되면 기존 데이터의 의미를 보존할 명시적 연결이 없다.
    how_to_fix: 분류별 코드 목록을 별도 식별 가능한 개념으로 승격하고 코드별 stable id, label, status,
      valid_from/valid_to, supersedes 관계를 둔다. 소비자 계약에는 미지원 코드의 보존·거부·fallback
      동작을 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 새 리스크 분류를 기존 엔진과 보고 시스템에 안전하게 확장하는 능력
      failure_condition: 기존 enum에 없는 신규 분류를 도입하거나 기존 코드를 개명·분할·폐기할 때
      impact: 스키마와 소비자를 동시 수정해야 하며, 배포 시차 동안 값 거부 또는 의미 단절이 발생할 수 있다.
      evidence_refs:
        - "credit-risk-ontology.yaml: Borrower.segment"
        - "credit-risk-ontology.yaml: Exposure.product_type"
        - "credit-risk-ontology.yaml: Exposure.risk_grade"
        - "credit-risk-ontology.yaml: Collateral.collateral_type"
        - "credit-risk-ontology.yaml: RiskRating.grade"
    causal_path:
      root_cause_candidate: 변화하는 코드 목록이 독립적으로 버전 관리되는 분류 개념이 아니라 속성 내부의 폐쇄형 enum으로 표현되어 있다.
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 세그먼트, 상품, 담보 및 등급 값이 각 속성의 고정 enum 목록으로 선언되어 있다.
          relation_to_previous: null
          evidence_refs:
            - "credit-risk-ontology.yaml: Borrower.segment"
            - "credit-risk-ontology.yaml: Exposure.product_type"
            - "credit-risk-ontology.yaml: Exposure.risk_grade"
            - "credit-risk-ontology.yaml: Collateral.collateral_type"
            - "credit-risk-ontology.yaml: RiskRating.grade"
        - cause_id: evolution-candidate-003.cause-002
          claim: 코드별 수명주기와 구·신 코드 연결을 표현하는 속성 또는 관계가 없다.
          relation_to_previous: enables
          evidence_refs:
            - "credit-risk-ontology.yaml: entities"
            - "credit-risk-ontology.yaml: relations"
        - cause_id: evolution-candidate-003.cause-003
          claim: 신규 값 도입과 기존 값 폐기 시 전체 정의 수정 및 소비자 동기화가 필요한 것은 인라인 폐쇄형 enum 설계의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "credit-risk-ontology.yaml: version"
            - "credit-risk-ontology.yaml: enum declarations"
      unresolved_beyond_evidence: 각 소비자의 실제 미지원 값 처리 방식은 경계 밖이므로 구체적인 실패 형태는 확인할 수 없다.
domain_constraints_used: []
domain_context_assumptions:
  - 등급 체계, 승인 한도, 리스크 성향 및 분류 코드 목록은 운영 중 변경될 수 있다.
  - 공유 개념 기준은 엔진과 보고 시스템이 동일한 기준일의 결과를 재현하고 해석할 수 있어야 한다.
  - 소비 시스템은 이 온톨로지의 enum과 속성 계약을 입력 검증 또는 데이터 교환에 사용한다고 가정한다.
