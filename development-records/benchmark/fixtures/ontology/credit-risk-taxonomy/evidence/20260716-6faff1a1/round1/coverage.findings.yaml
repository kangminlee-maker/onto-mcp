  - candidate_id: coverage-candidate-002
    target: credit-risk-ontology.yaml — approval and manual-adjustment controls
    evidence_anchor: materialized-input.md:35-37, 64-66, 92-95
    claim: 승인·수동 입력·등급 조정에 대한 감사 증거 개념이 누락되어 있다.
    what: 심사역의 LTV 입력, 승인 시스템의 한도 기록, 보고서 팀의 risk_grade 수동 조정이 서술되지만 행위자, 행위 시각,
      승인자, 근거, 이전값/새값을 담는 통제 사건이 없다.
    why: 통제 행위의 결과값만 공유되므로 누가 어떤 근거로 엔진 산출을 변경했는지 검증할 수 없다. 보고서의 수동 등급과 엔진 등급이 다를 때
      정당성 및 책임 추적이 불가능하다.
    how_to_fix: Approval/ManualAdjustment 같은 감사 사건을 추가하고 대상 값, 행위자, 승인자,
      occurred_at, reason/evidence_ref, before/after 값과 연결한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 엔진과 보고 시스템이 공유하는 통제 가능한 분류 기준
      failure_condition: LTV·한도·보고용 등급이 수동 입력 또는 조정되어 원천 산출과 달라질 때
      impact: 차이를 정상 승인된 예외와 오류로 구분할 증거가 없어 보고 신뢰와 사후 감사 가능성이 약화된다.
      evidence_refs:
        - materialized-input.md:35-37
        - materialized-input.md:64-66
        - materialized-input.md:92-95
    causal_path:
      root_cause_candidate: 통제 행위를 일급 감사 사건으로 표현하는 개념 범주가 없다.
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: 온톨로지는 수동 입력·승인·조정을 언급하지만 결과 속성만 정의한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:35-37
            - materialized-input.md:64-66
            - materialized-input.md:92-95
        - cause_id: coverage-candidate-002.cause-002
          claim: 행위자·시각·근거를 담을 엔터티나 속성의 전면적 부재는 감사 사건 모델 부재의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
