    claim: 주요 시점 의존 값에 유효기간과 이력이 없어 과거 리스크 상태를 재구성할 수 없다.
    what: Borrower.internal_rating, Exposure.amount/risk_grade/ltv,
      RiskRating.grade/score, Limit.approved_amount,
      RiskAppetite.threshold/compliance_status에 effective_from/effective_to,
      산출·변경 시각, 버전 또는 변경 사건이 없다.
    why: 월말 집계와 담보 평가에는 일부 시점이 있지만 원천 등급·금액·한도·성향 값의 당시 버전을 식별할 수 없다. 따라서 특정 보고 기준일의
      분류 결과를 재현하거나 엔진 결과와 보고서를 사후 대사할 수 없다.
    how_to_fix: 공통 유효기간·버전 모델 또는 값별 이력 엔터티를 추가하고, 각 값에 기준시점·기록시점·변경 원인을 연결한다. 파생
      결과에도 사용한 원천 버전을 기록한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 개념 권위 문서 및 과거 시점 보고 재현
      failure_condition: 등급, 한도, 익스포저, LTV 또는 리스크 성향 값이 변경된 뒤 과거 기준일 결과를 조회하거나 대사할 때
      impact: 두 소비자가 서로 다른 현재값이나 보존 방식으로 과거 결과를 계산하여 동일 기준일의 분류와 보고가 달라질 수 있다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:20-37
        - materialized-input.md:48-83
    causal_path:
      root_cause_candidate: 온톨로지에 공통 temporal/versioning 개념이 정의되지 않았다.
      root_cause_step_id: coverage-candidate-001.cause-002
      steps:
