findings:
  - candidate_id: coverage-candidate-001
    target: credit-risk-ontology.yaml risk-state coverage
    evidence_anchor: credit-risk-ontology.yaml:92-94; credit-risk-ontology.yaml:1-3
    claim: 연체/부실 상태 영역이 범위 밖으로만 처리되어 공유 리스크 기준의 핵심 상태 범주가 비어 있다.
    what: 온톨로지는 여신 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향한다고 선언하지만, 연체/부실(default) 상태는
      별도 시스템 범위라며 제외한다. 대상 파일 안에는 이를 대체하는 최소 상태 개념, 외부 상태 참조, 보고용 분류 슬롯, 경계 계약이
      없다.
    why: 연체/부실 여부는 익스포저와 차주 리스크를 분류하고 보고하는 데 필요한 상태 축이다. 이를 완전히 제외하면 리스크 엔진과 보고 시스템이
      같은 차주·익스포저를 두고 정상/연체/부실 상태를 공통 기준으로 해석할 수 없으며, 별도 시스템과의 결합 지점도 온톨로지에서 닫히지
      않는다.
    how_to_fix: 연체/부실을 전면 모델링하지 않더라도 `CreditStatus` 또는 `DelinquencyStatus` 같은 최소 경계
      개념을 추가하고, 상태 값 예시, 기준일, 외부 연체관리 시스템의 권위 여부, Borrower/Exposure와의 관계를 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고서 시스템이 공유할 여신 리스크 분류 기준
      failure_condition: 연체/부실 상태가 필요한 차주 또는 익스포저를 엔진·보고 시스템이 공통 개념으로 분류해야 할 때
      impact: 대상 온톨로지 안에서 해당 상태 축이 닫히지 않아 소비 시스템별 해석이나 별도 시스템 의존으로 분류·보고 기준이 갈라질 수 있다.
      evidence_refs:
        - credit-risk-ontology.yaml:1-3
        - credit-risk-ontology.yaml:92-94
    causal_path:
      root_cause_candidate: 연체/부실 상태 영역을 범위 밖으로 선언하면서도 공유 온톨로지 안에 최소 경계 개념이나 외부 권위 참조 개념을 두지 않았다.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: 대상은 리스크 엔진과 보고서 시스템의 공유 개념 권위 문서를 지향한다.
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml:1-3
        - cause_id: coverage-candidate-001.cause-002
          claim: 연체/부실(default) 상태는 별도 시스템에서 다룬다는 이유로 온톨로지 범위 밖으로 선언되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml:92-94
        - cause_id: coverage-candidate-001.cause-003
          claim: 따라서 공유 기준 문서 안에는 연체/부실 상태를 표현하거나 외부 상태 권위를 연결하는 개념 범주가 남아 있지 않다.
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml:8-90
            - credit-risk-ontology.yaml:92-94
      unresolved_beyond_evidence: 별도 연체관리 시스템의 실제 스키마나 인터페이스는 경계 밖이라 확인하지 않았다.
  - candidate_id: coverage-candidate-002
    target: credit-risk-ontology.yaml temporal validity coverage
    evidence_anchor: credit-risk-ontology.yaml:43-78; credit-risk-ontology.yaml:64-71
    claim: 등급·한도·리스크성향에 적용시점/유효기간 범주가 없어 시간 기준 커버리지가 ExposureAggregate에 편중되어 있다.
    what: "`ExposureAggregate`에는 `as_of`가 있지만, `RiskRating`, `Limit`,
      `RiskAppetite`에는 산출일, 승인일, 효력 시작/종료일, 기준일 같은 시간 속성이 없다. 담보에는 평가시점이 있으나
      등급·한도·성향 판단의 시간 축은 개념화되지 않았다."
    why: 리스크 엔진 산출 등급과 보고 시스템의 한도·성향 준수 판단은 어느 시점의 값인지가 함께 닫혀야 한다. 현재 모델은 월말 집계의
      기준일만 표현하므로 보고 시점에서 등급, 한도, 리스크성향 임계값 중 어떤 버전을 적용해야 하는지 공통 기준으로 해석하기 어렵다.
    how_to_fix: "`RiskRating.effective_at` 또는 `rated_at`,
      `Limit.approved_at/effective_from/effective_to`,
      `RiskAppetite.effective_from/effective_to/as_of`처럼 각 판단 기준의 시간 속성을 추가하고,
      소진율·준수 상태 계산이 사용할 기준일 우선순위를 규칙으로 닫는다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 시간 일관적 리스크 분류·보고 기준
      failure_condition: 동일 차주/익스포저에 대해 월말 집계일, 등급 산출일, 한도 승인일, 리스크성향 기준일이 서로 다를 때
      impact: 어느 시점의 등급·한도·임계값을 적용할지 온톨로지에서 표현되지 않아 보고 수치와 엔진 판단의 재현성과 비교 가능성이 약해진다.
      evidence_refs:
        - credit-risk-ontology.yaml:43-52
        - credit-risk-ontology.yaml:54-62
        - credit-risk-ontology.yaml:64-78
        - credit-risk-ontology.yaml:87-90
    causal_path:
      root_cause_candidate: 시간 기준 속성이 집계와 담보 일부에만 있고 등급·한도·리스크성향 개념에는 적용되지 않았다.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: "`ExposureAggregate`는 월말 배치 저장과 `as_of` 기준일을 가진다."
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml:64-71
        - cause_id: coverage-candidate-002.cause-002
          claim: "`RiskRating`, `Limit`, `RiskAppetite`는 엔진 등급, 승인 한도, 준수 상태를 정의하지만 시간 기준
            속성을 포함하지 않는다."
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml:43-62
            - credit-risk-ontology.yaml:73-78
        - cause_id: coverage-candidate-002.cause-003
          claim: 분류 규칙은 소진율과 준수 상태 계산을 요구하지만 어떤 시점의 등급·한도·임계값을 함께 사용할지 표현하지 않는다.
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml:87-90
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: credit-risk-ontology.yaml exposure lifecycle coverage
    evidence_anchor: credit-risk-ontology.yaml:19-32; credit-risk-ontology.yaml:54-62
    claim: 익스포저와 한도의 생애주기 상태 범주가 없어 활성/승인/소진/종료 같은 운영 상태를 분류하지 못한다.
    what: "`Exposure`는 금액, 상품유형, 등급, LTV만 갖고, `Limit`은 승인금액과 통화만 갖는다. 승인됨, 실행됨, 미사용,
      일부사용, 만기, 종료, 취소 같은 상태나 잔액/가용한도 상태 범주가 없다."
    why: 보고 시스템과 리스크 엔진이 공유하는 기준에서는 어떤 익스포저와 한도를 집계·소진율 계산·리스크성향 위반 판단에 포함할지가 필요하다.
      현재 범위는 정적인 금액과 승인한도 중심이라 운영 상태별 포함/제외 기준이 비어 있다.
    how_to_fix: "`Exposure.status`와 `Limit.status`를 최소 enum으로 추가하고, 소진율 및 총익스포저 집계에서
      포함되는 상태와 제외되는 상태를 classification_rules에 명시한다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 익스포저·한도 분류 및 집계 기준
      failure_condition: 승인되었지만 미실행인 한도, 종료된 익스포저, 일중 신규 여신처럼 운영 상태가 다른 항목을 총익스포저나
        소진율에 포함할지 판단해야 할 때
      impact: 상태 범주가 없어 시스템별로 포함 대상을 다르게 잡을 수 있고, 소진율 및 총익스포저 보고의 일관성이 약해진다.
      evidence_refs:
        - credit-risk-ontology.yaml:19-32
        - credit-risk-ontology.yaml:54-62
        - credit-risk-ontology.yaml:87-89
    causal_path:
      root_cause_candidate: 익스포저·한도 개념이 금액과 승인 한도 중심으로 정의되고 운영 생애주기 상태 범주가 추가되지 않았다.
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: "`Exposure`는 금액, 상품유형, 리스크등급, LTV를 정의하지만 운영 상태 속성을 포함하지 않는다."
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml:19-32
        - cause_id: coverage-candidate-003.cause-002
          claim: "`Limit`은 승인금액과 통화를 정의하지만 승인 이후의 사용 가능/종료/취소 같은 상태 속성을 포함하지 않는다."
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml:54-62
        - cause_id: coverage-candidate-003.cause-003
          claim: 그 상태 부재 상태에서 소진율은 총익스포저와 승인한도만으로 정의되어 포함 대상 기준이 닫히지 않는다.
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml:87-89
      unresolved_beyond_evidence: null
