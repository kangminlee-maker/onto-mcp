schema_version: 1
session_id: 20260610-4bfe81da
issues:
  - issue_id: issue-001
    root_cause_hypothesis: The ontology preserves historical rating-scale plurality
      as consumer-owned conversion instead of modeling canonical rating
      authority and governed projections.
    root_confidence: high
    surface_finding_ids:
      - finding-001
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: Rating conversion and report-grade adjustment are delegated to
      consumer systems, weakening the ontology as the shared classification
      authority for risk engine and reporting outputs.
    proposed_action: Make rating authority explicit through a canonical rating scale
      or versioned mapping table, governed override semantics, and separate
      report-only projections.
    affected_purpose: A shared concept standard for risk engine and reporting
      systems, especially classification authority and precedence.
    failure_condition: When engine grades, borrower internal ratings, and reporting
      grades must be reconciled or audited across systems, each consumer can
      apply different mappings or manual adjustments without violating the
      written ontology.
    impact: The ontology no longer provides a single accountable classification
      basis; downstream reports and engine decisions can disagree on the same
      exposure's risk class, reducing trust and operational actionability.
    evidence_refs:
      - .onto/review/20260610-4bfe81da/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:6-8
      - materialized-input.md:48-57
      - materialized-input.md:92-98
      - review-value-alignment-criteria.yaml:criteria[0].statement
    severity: high
    domain_threshold_used: null
    singleton_reason: Related rating findings are connected only by
      shared_cause_candidate relations from this finding, so this finding is not
      merged without a same_root_candidate relation.
  - issue_id: issue-002
    root_cause_hypothesis: The ontology treats FX conversion authority as external
      and per-system instead of a governed concept in the shared model.
    root_confidence: high
    surface_finding_ids:
      - finding-002
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: Limit utilization delegates cross-currency conversion to each
      system's FX table, making a core risk metric locally defined.
    proposed_action: Define a canonical FX conversion concept for limit-utilization
      calculations, including source authority, as-of timestamp, rounding,
      stale-rate handling, and named projections if multiple sources are
      required.
    affected_purpose: Shared concept criteria for risk engine and reporting systems,
      with emphasis on precedence and invalid-input behavior for cross-currency
      limit utilization.
    failure_condition: When exposure and limit currencies differ, engine and
      reporting systems can use different FX tables and produce different
      utilization values while both follow the ontology text.
    impact: A core risk-control metric becomes locally defined, weakening
      auditability and making limit breach/report reconciliation unreliable.
    evidence_refs:
      - .onto/review/20260610-4bfe81da/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:59-67
      - materialized-input.md:69-76
      - materialized-input.md:92-95
      - review-value-alignment-criteria.yaml:criteria[0].statement
    severity: medium
    domain_threshold_used: null
    singleton_reason: The only relation to another finding is symptom_of, not
      same_root_candidate, so it remains a separate root issue.
  - issue_id: issue-003
    root_cause_hypothesis: Temporal and currency bases are treated as incidental
      attributes or external behavior rather than governed, versioned shared
      concepts for reproducible risk calculations.
    root_confidence: medium
    surface_finding_ids:
      - finding-003
      - finding-005
      - finding-009
    relation_refs:
      - rel-007
      - rel-008
    raised_by_lens_ids:
      - axiology
      - coverage
      - evolution
    issue_statement: Aggregate freshness, rating/limit/appetite effective timing,
      and monetary valuation basis are under-modeled, so exposure-derived
      calculations lack a shared temporal and currency contract.
    proposed_action: Add temporal validity and valuation concepts covering
      effective/as-of dates, freshness and partial-data status, event cutoffs,
      refresh cadence, Money/Valuation, and FX conversion policy.
    affected_purpose: A shared concept basis for risk engine and reporting,
      especially temporality, reproducibility, and operational risk in exposure
      aggregation, limit utilization, and appetite compliance.
    failure_condition: When intraday exposures, differing rating/limit/appetite
      dates, multi-currency portfolios, or changed FX providers must be handled
      consistently or historically replayed, the ontology does not close the
      time and valuation basis.
    impact: Risk engine decisions and reports can present stale or locally valued
      exposure-derived states as authoritative, weakening operational control,
      reconciliation, and reproducibility.
    evidence_refs:
      - .onto/review/20260610-4bfe81da/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:69-83
      - materialized-input.md:92-95
      - review-value-alignment-criteria.yaml:criteria[0].statement
      - .onto/review/20260610-4bfe81da/round1/coverage.findings.yaml#coverage-candidate-002
      - credit-risk-ontology.yaml:43-52
      - credit-risk-ontology.yaml:54-62
      - credit-risk-ontology.yaml:64-78
      - credit-risk-ontology.yaml:87-90
      - .onto/review/20260610-4bfe81da/round1/evolution.findings.yaml#evolution-candidate-003
      - Exposure.amount attribute has only type number and note '익스포저 금액'
      - Limit.currency attribute exists only on Limit
      - "ExposureAggregate.total_amount note: month-end batch; intraday new
        loans omitted until next batch"
      - "classification_rules[1]: different currencies use each system's daily
        FX table"
    severity: medium
    domain_threshold_used: null
    singleton_reason: null
  - issue_id: issue-004
    root_cause_hypothesis: The taxonomy lacks governed extensible state, rating, and
      inclusion-boundary concepts, leaving critical classification axes closed,
      omitted, externally maintained, or semantically ambiguous.
    root_confidence: medium
    surface_finding_ids:
      - finding-004
      - finding-006
      - finding-007
      - finding-008
      - finding-011
      - finding-012
    relation_refs:
      - rel-003
      - rel-010
      - rel-013
      - rel-014
      - rel-015
    raised_by_lens_ids:
      - coverage
      - evolution
      - semantics
    issue_statement: Core rating, status, lifecycle, and exposure-total boundaries
      are not modeled as governed first-class concepts, so consumers must
      extend, interpret, or bypass the taxonomy outside the shared ontology.
    proposed_action: Promote classification values and status axes into governed
      vocabularies or boundary concepts, add canonical rating mappings and
      override semantics, define delinquency and lifecycle inclusion states, and
      rename or split aggregate snapshot concepts where timing changes meaning.
    affected_purpose: Risk engine and reporting systems sharing a stable,
      extensible, and semantically clear credit-risk classification standard.
    failure_condition: When new grades or products are introduced,
      delinquency/default or lifecycle states must be classified, rating
      mappings must be replayed, or ExposureAggregate must be interpreted as
      current total versus delayed snapshot, the shared model does not provide
      closed authority.
    impact: The taxonomy cannot reliably absorb business change or enforce common
      meanings; systems can diverge on ratings, operational statuses, and
      exposure totals while appearing compliant with the ontology.
    evidence_refs:
      - .onto/review/20260610-4bfe81da/round1/coverage.findings.yaml#coverage-candidate-001
      - credit-risk-ontology.yaml:1-3
      - credit-risk-ontology.yaml:92-94
