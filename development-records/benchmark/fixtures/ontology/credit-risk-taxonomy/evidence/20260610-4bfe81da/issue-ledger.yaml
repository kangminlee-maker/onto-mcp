  - issue_id: issue-005
    root_cause_hypothesis: Collateral is defined as a secured asset but typed as an
      Exposure subtype, creating an ontology-level type error.
    root_confidence: high
    surface_finding_ids:
      - finding-010
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: Collateral is modeled as a subtype of Exposure even though the
      relations describe it as an asset securing an exposure.
    proposed_action: Remove Collateral as an Exposure subtype, keep it as an
      independent entity, and express the link through a secured_by-style
      relation or a separate collateral agreement/evaluation concept if needed.
    affected_purpose: 리스크 엔진과 보고 시스템이 공유할 여신 리스크 분류 기준
    failure_condition: 담보 레코드가 Exposure의 하위 유형으로 해석되어 익스포저 속성이나 익스포저 집계/분류 대상에 포함되는 경우
    impact: 담보 자산과 신용 익스포저의 경계가 무너지면 엔진과 보고서가 같은 객체를 서로 다른 의미로 처리하거나 담보를 익스포저처럼 집계할
      수 있어 공유 개념 기준의 신뢰가 크게 약화됩니다.
    evidence_refs:
      - .onto/review/20260610-4bfe81da/round1/semantics.findings.yaml#semantics-candidate-001
      - credit-risk-ontology.yaml:34-36
      - credit-risk-ontology.yaml:80-82
    severity: high
    domain_threshold_used: null
    singleton_reason: Related relations are enables links only, so there is no
      same_root_candidate support for merging this finding with another issue.
  - issue_id: issue-006
    root_cause_hypothesis: RiskAppetite combines a policy threshold and a compliance
      result in one concept instead of separating policy authority from
      assessment output.
    root_confidence: high
    surface_finding_ids:
      - finding-013
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: RiskAppetite mixes the risk appetite limit and the compliance
      status result, blurring whether the object is a policy criterion or an
      evaluated state.
    proposed_action: Split the policy threshold from the compliance assessment
      result, and connect the assessment to the appetite policy, evaluated
      aggregate, evaluation time, and status.
    affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 한도/위반 상태의 개념 기준
    failure_condition: 소비 시스템이 RiskAppetite 객체를 정책 한도와 현재 위반 상태 양쪽으로 갱신하거나 해석하는 경우
    impact: 정책 기준과 산출 상태의 권위가 섞이면 보고 시스템은 상태를 기준처럼, 엔진은 기준을 상태처럼 다룰 수 있어 위반 판단의 의미와
      이력이 불명확해집니다.
    evidence_refs:
      - .onto/review/20260610-4bfe81da/round1/semantics.findings.yaml#semantics-candidate-004
      - credit-risk-ontology.yaml:73-78
    severity: medium
    domain_threshold_used: null
    singleton_reason: The only relation involving this finding is
      shared_cause_candidate with finding-014, which is preserved as dependency
      context rather than a merge relation.
  - issue_id: issue-007
    root_cause_hypothesis: The relations block omits any edge involving RiskAppetite
      despite its definition depending on ExposureAggregate.
    root_confidence: high
    surface_finding_ids:
      - finding-014
    relation_refs: []
    raised_by_lens_ids:
      - structure
    issue_statement: RiskAppetite is structurally orphaned from the exposure
      aggregate it is defined to govern.
    proposed_action: Add an explicit relation connecting ExposureAggregate to
      RiskAppetite, including scope keys when thresholds vary by borrower,
      segment, product, or portfolio.
    affected_purpose: The ontology's declared purpose as a shared concept authority
      for risk engines and reporting systems.
    failure_condition: When determining or reporting RiskAppetite compliance from
      ExposureAggregate values, the target model provides no structural path
      linking the aggregate to the appetite threshold and status concept.
    impact: This weakens review trust because a core compliance concept is present
      but disconnected, making implementations rely on external or implicit
      joins rather than the canonical ontology.
    evidence_refs:
      - .onto/review/20260610-4bfe81da/round1/structure.findings.yaml#structure-candidate-001
      - materialized-input.md:78-90
    severity: medium
    domain_threshold_used: null
    singleton_reason: The only relation involving this finding is
      shared_cause_candidate with finding-013 and an enables relation from
      finding-003, neither of which authorizes same-root merging.
