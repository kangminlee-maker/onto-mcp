relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-007
    relation: shared_cause_candidate
    root_hypothesis: If rating conversion authority remains outside the ontology,
      both present classification authority and future rating-scale evolution
      depend on consumer-local mappings rather than a shared canonical model.
    shared_cause:
      cause_claim: The ontology delegates rating-scale conversion to external or
        consumer-local authorities instead of modeling a canonical, versioned
        rating mapping concept.
      from_cause_ref: finding-001.cause-003
      to_cause_ref: finding-007.cause-002
    rationale: finding-001 identifies current shared-authority failure from
      consumer-local rating conversion and reporting overrides; finding-007
      identifies the same delegation as an evolution risk when scales change or
      history must be replayed.
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-001
    to_finding_id: finding-011
    relation: shared_cause_candidate
    root_hypothesis: If the ontology does not close the meaning and authority of the
      three rating scales internally, both governance authority and semantic
      interpretation of credit grades fail across engine and reporting uses.
    shared_cause:
      cause_claim: Three rating scales coexist while canonical conversion meaning and
        authority are left to consuming systems or external references.
      from_cause_ref: finding-001.cause-003
      to_cause_ref: finding-011.cause-003
    rationale: finding-001 frames the problem as weakened shared classification
      authority; finding-011 frames it as semantic ambiguity over the same
      Borrower/RiskRating/Exposure rating scales and conversion authority.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-007
    to_finding_id: finding-011
    relation: same_root_candidate
    root_hypothesis: Both findings would be resolved by modeling rating scales,
      mappings, ownership, effective dates, and override semantics as
      first-class ontology concepts rather than external or local conventions.
    shared_cause: null
    rationale: finding-007 concerns rating-scale change management and replay;
      finding-011 concerns present semantic boundaries. Both causal paths
      identify unmodeled canonical rating mapping/authority as the root
      condition.
    confidence: high
  - relation_id: rel-004
    from_finding_id: finding-002
    to_finding_id: finding-009
    relation: symptom_of
    root_hypothesis: Limit-utilization FX divergence is a concrete symptom of the
      broader absence of shared currency-conversion and temporal valuation
      concepts.
    shared_cause: null
    rationale: finding-002 focuses on per-system FX tables for limit utilization.
      finding-009 generalizes the root to missing Money/Valuation, FX authority,
      and cutoff concepts for multi-currency or intraday risk continuity.
    confidence: high
  - relation_id: rel-005
    from_finding_id: finding-003
    to_finding_id: finding-012
    relation: shared_cause_candidate
    root_hypothesis: If ExposureAggregate remains a month-end stored snapshot
      without explicit freshness semantics, both operational control trust and
      term meaning for total exposure are weakened.
    shared_cause:
      cause_claim: ExposureAggregate is defined as total exposure but implemented as a
        month-end batch value that omits intraday new lending until the next
        batch.
      from_cause_ref: finding-003.cause-002
      to_cause_ref: finding-012.cause-002
    rationale: finding-003 emphasizes the governed timeliness tradeoff for
      limit/appetite checks; finding-012 emphasizes the semantic mismatch
      between 'total exposure' and delayed snapshot. The same batch/freshness
      fact drives both.
    confidence: high
  - relation_id: rel-006
    from_finding_id: finding-003
    to_finding_id: finding-009
    relation: shared_cause_candidate
    root_hypothesis: Both findings arise because temporal basis for exposure-derived
      calculations is not modeled as a governed, replayable concept.
    shared_cause:
      cause_claim: Aggregation freshness is month-end batch based and explicitly
        excludes intraday new exposures until the next batch.
      from_cause_ref: finding-003.cause-002
      to_cause_ref: finding-009.cause-002
    rationale: finding-003 covers stale aggregate use in operational checks;
      finding-009 covers evolution and replay failures when intraday or
      reporting frequency changes. Both depend on the same missing
      temporal/cutoff contract.
    confidence: high
  - relation_id: rel-007
    from_finding_id: finding-005
    to_finding_id: finding-003
    relation: same_root_candidate
    root_hypothesis: The ontology lacks a coherent temporal-validity model for risk
      decisions, leaving aggregate freshness, rating dates, limit dates, and
      appetite threshold dates under-specified.
    shared_cause: null
    rationale: finding-005 identifies missing effective/as-of attributes across
      rating, limit, and appetite concepts; finding-003 identifies the resulting
      hidden freshness problem when aggregate-dependent checks use stale
      month-end data.
    confidence: medium
  - relation_id: rel-008
    from_finding_id: finding-005
    to_finding_id: finding-009
    relation: same_root_candidate
    root_hypothesis: Temporal and currency bases are treated as incidental
      attributes or external behavior rather than versioned shared concepts for
      reproducible calculations.
    shared_cause: null
    rationale: finding-005 covers temporal coverage gaps across core decision
      concepts; finding-009 combines those temporal gaps with currency/FX
