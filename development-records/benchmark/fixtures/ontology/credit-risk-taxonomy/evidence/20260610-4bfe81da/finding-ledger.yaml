  - finding_id: finding-007
    lens_id: evolution
    source_ref: .onto/review/20260610-4bfe81da/round1/evolution.findings.yaml#evolution-candidate-001
    target: credit-risk-ontology.yaml rating concepts and classification_rules
    evidence_anchor: Borrower.internal_rating note; RiskRating.grade values/note;
      Exposure.risk_grade values/note; notes[0]; classification_rules[0]
    claim: Three rating scales are left as consumer-local mappings, so rating-scale
      evolution requires coordinated changes outside the ontology.
    lens_rationale_summary: The stated purpose is to be a shared concept authority
      for the risk engine and reporting systems, but the conversion authority is
      explicitly outside the ontology and duplicated across consumers. When
      rating scales change, historical continuity and engine/report consistency
      depend on each consumer updating its private mapping at the same time and
      in the same way.
    proposed_action: Add a canonical RatingScale/RatingGrade/RatingMapping model in
      the ontology with source and target scales, effective_from/effective_to,
      version, owner, and derivation/override precedence. Make
      Exposure.risk_grade a governed projection from this mapping rather than a
      separately maintained closed enum with consumer-side conversion.
    affected_purpose: Risk engine and reporting system share a stable concept basis
      for ratings and classification.
    failure_condition: A grade scale is revised, a new grade is introduced, or
      historical mappings need replay across engine and reports.
    impact: The shared ontology no longer provides the controlling mapping, so
      consumers can diverge and historical reports may not be reproducible under
      the same conceptual rules.
    evidence_refs:
      - .onto/review/20260610-4bfe81da/round1/evolution.findings.yaml#evolution-candidate-001
      - "Borrower.internal_rating note: internal 1~10 numeric grade"
      - "RiskRating.grade values: R1-R5 and note referencing risk-team wiki
        mapping"
      - "Exposure.risk_grade values: AAA-CCC and note that reporting team uses
        it"
      - "notes[0]: three scales coexist and each consumer performs conversion"
      - "classification_rules[0]: Exposure.risk_grade is derived from
        RiskRating.grade but may be manually adjusted by reporting"
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Risk engine and reporting system share a stable concept basis
        for ratings and classification.
      failure_condition: A grade scale is revised, a new grade is introduced, or
        historical mappings need replay across engine and reports.
      impact: The shared ontology no longer provides the controlling mapping, so
        consumers can diverge and historical reports may not be reproducible
        under the same conceptual rules.
      evidence_refs:
        - "Borrower.internal_rating note: internal 1~10 numeric grade"
        - "RiskRating.grade values: R1-R5 and note referencing risk-team wiki
          mapping"
        - "Exposure.risk_grade values: AAA-CCC and note that reporting team uses
          it"
        - "notes[0]: three scales coexist and each consumer performs conversion"
        - "classification_rules[0]: Exposure.risk_grade is derived from
          RiskRating.grade but may be manually adjusted by reporting"
    causal_path:
      root_cause_candidate: Rating scale mapping is not modeled as a canonical
        versioned ontology concept.
      root_cause_step_id: finding-007.cause-003
      steps:
        - cause_id: finding-007.cause-001
          claim: The target defines three independent rating representations with
            different value spaces.
          relation_to_previous: null
          evidence_refs:
            - Borrower.internal_rating note
            - RiskRating.grade values
            - Exposure.risk_grade values
        - cause_id: finding-007.cause-002
          claim: The ontology delegates conversion to external or consumer-local
            authorities.
          relation_to_previous: causes
          evidence_refs:
            - "RiskRating.grade note: mapping table is in risk-team wiki"
            - "notes[0]: conversion is performed by each consuming system"
        - cause_id: finding-007.cause-003
          claim: Rating changes therefore require multiple consumer updates rather than
            extending one shared concept model.
          relation_to_previous: causes
          evidence_refs:
            - notes[0]
            - classification_rules[0]
      unresolved_beyond_evidence: The packet does not include the external wiki or
        consumer implementations, so the exact number of divergent mappings is
        outside boundary.
  - finding_id: finding-008
    lens_id: evolution
    source_ref: .onto/review/20260610-4bfe81da/round1/evolution.findings.yaml#evolution-candidate-002
    target: credit-risk-ontology.yaml enum-based classification attributes
    evidence_anchor: Borrower.segment values; Exposure.product_type values;
      Exposure.risk_grade values; Collateral.collateral_type values;
      RiskRating.grade values; RiskAppetite.compliance_status values
    claim: Closed inline enums make new segments, products, collateral classes, and
      grade/status values require schema edits instead of controlled extension.
    lens_rationale_summary: For a risk taxonomy expected to support future products
      and reporting changes, fixed inline enums are brittle. Adding a new
      product_type or collateral_type changes the ontology shape and likely
      requires coordinated parser/report updates; unrecognized values have no
      declared acceptance, quarantine, or mapping behavior.
    proposed_action: Promote classification value sets into governed
      vocabulary/code-list concepts with ids, labels, valid_from/valid_to,
      status, parent category, aliases, and explicit unknown/unmapped handling.
      Keep attribute types as references to those vocabularies so additions are
      data extensions rather than schema rewrites.
    affected_purpose: Classification taxonomy remains extensible as credit products,
      collateral types, borrower segments, and reporting states evolve.
    failure_condition: A new product, collateral type, borrower segment, grade, or
      compliance status must be onboarded before all consumers are redeployed.
    impact: The taxonomy cannot absorb common business extensions through controlled
      data updates; consumers face invalid-input behavior or synchronized schema
      changes.
    evidence_refs:
      - .onto/review/20260610-4bfe81da/round1/evolution.findings.yaml#evolution-candidate-002
      - "Borrower.segment values: retail, sme, corporate"
      - "Exposure.product_type values: term_loan, revolving, guarantee"
      - "Collateral.collateral_type values: real_estate, deposit, securities"
      - "RiskRating.grade values: R1-R5"
      - "RiskAppetite.compliance_status values: compliant, breached"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Classification taxonomy remains extensible as credit products,
