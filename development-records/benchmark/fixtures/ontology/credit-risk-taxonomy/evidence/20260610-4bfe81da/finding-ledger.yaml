    claim: 연체/부실 상태 영역이 범위 밖으로만 처리되어 공유 리스크 기준의 핵심 상태 범주가 비어 있다.
    lens_rationale_summary: 연체/부실 여부는 익스포저와 차주 리스크를 분류하고 보고하는 데 필요한 상태 축이다. 이를 완전히
      제외하면 리스크 엔진과 보고 시스템이 같은 차주·익스포저를 두고 정상/연체/부실 상태를 공통 기준으로 해석할 수 없으며, 별도
