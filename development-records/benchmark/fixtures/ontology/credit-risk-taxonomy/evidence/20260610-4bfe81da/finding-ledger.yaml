  - finding_id: finding-009
    lens_id: evolution
    source_ref: .onto/review/20260610-4bfe81da/round1/evolution.findings.yaml#evolution-candidate-003
    target: credit-risk-ontology.yaml exposure aggregation and limit utilization rules
    evidence_anchor: Exposure.amount attribute; Limit.currency attribute;
      ExposureAggregate.total_amount/as_of note; classification_rules[1]
    claim: Currency and time basis are not modeled as shared, versioned concepts, so
      multi-currency or intraday risk evolution breaks continuity across
      systems.
    lens_rationale_summary: If reporting frequency, FX source, or multi-currency
      exposure handling changes, there is no canonical as-of, currency, or
      FX-rate authority for replaying the same calculation across engine and
      reports. The rule therefore evolves by external system behavior rather
      than by extending the ontology.
    proposed_action: Model monetary amounts as a Money/Valuation concept with
      amount, currency, value_as_of, source system, and FX conversion basis. Add
      an FXRate/ConversionPolicy reference with effective dating and make
      ExposureAggregate declare calculation_as_of, included_event_cutoff, and
      refresh cadence.
    affected_purpose: Risk engine and reports share reproducible limit-utilization
      and aggregate-exposure concepts over time.
    failure_condition: Intraday exposures, multi-currency portfolios, or changed FX
      providers/rates must be handled consistently across systems or historical
      reports replayed.
    impact: Different systems can compute different utilization values for the same
      borrower because the ontology delegates conversion to local FX tables and
      stores stale aggregates without a shared cutoff contract.
    evidence_refs:
      - .onto/review/20260610-4bfe81da/round1/evolution.findings.yaml#evolution-candidate-003
      - Exposure.amount attribute has only type number and note '익스포저 금액'
      - Limit.currency attribute exists only on Limit
      - "ExposureAggregate.total_amount note: month-end batch; intraday new
        loans omitted until next batch"
      - "classification_rules[1]: different currencies use each system's daily
        FX table"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Risk engine and reports share reproducible limit-utilization
        and aggregate-exposure concepts over time.
      failure_condition: Intraday exposures, multi-currency portfolios, or changed FX
        providers/rates must be handled consistently across systems or
        historical reports replayed.
      impact: Different systems can compute different utilization values for the same
        borrower because the ontology delegates conversion to local FX tables
        and stores stale aggregates without a shared cutoff contract.
      evidence_refs:
        - Exposure.amount attribute has only type number and note '익스포저 금액'
        - Limit.currency attribute exists only on Limit
        - "ExposureAggregate.total_amount note: month-end batch; intraday new
          loans omitted until next batch"
        - "classification_rules[1]: different currencies use each system's daily
          FX table"
    causal_path:
      root_cause_candidate: The ontology lacks canonical temporal and
        currency-conversion concepts for exposure amounts and utilization
        calculations.
      root_cause_step_id: finding-009.cause-004
      steps:
        - cause_id: finding-009.cause-001
          claim: Exposure monetary value is modeled as a bare number without currency or
            value timestamp.
          relation_to_previous: null
          evidence_refs:
            - Exposure.amount attribute
        - cause_id: finding-009.cause-002
          claim: Aggregation freshness is month-end batch based and explicitly excludes
            intraday new exposures until the next batch.
          relation_to_previous: causes
          evidence_refs:
            - ExposureAggregate.total_amount note
            - ExposureAggregate.as_of attribute
        - cause_id: finding-009.cause-003
          claim: Cross-currency utilization delegates FX conversion to each system's own
            daily table.
          relation_to_previous: causes
          evidence_refs:
            - classification_rules[1]
        - cause_id: finding-009.cause-004
          claim: Changes in frequency or FX authority cannot be represented as a versioned
            ontology extension, weakening continuity between engine and report
            calculations.
          relation_to_previous: causes
          evidence_refs:
            - Exposure.amount attribute
            - ExposureAggregate.total_amount note
            - classification_rules[1]
      unresolved_beyond_evidence: The packet does not include actual FX table
        definitions or batch job contracts, so this finding is limited to the
        ontology's declared concept surface.
