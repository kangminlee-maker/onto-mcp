        .md:78-90 Source finding context: RiskAppetite is structurally orphaned
        from the exposure aggregate it is defined to govern. Source finding
        context: The definition says ExposureAggregate exceeding RiskAppetite
        determines a RiskAppetite breach, so the ontology itself declares a
        required connection. Because RiskAppetite has only scalar attributes and
        no relation entries, risk engines and reporting systems cannot determine
        from this shared concept model which aggregate is evaluated against
        which appetite threshold. Source finding context: Add an explicit
        relation such as ExposureAggregate -> RiskAppetite with a kind like
        evaluated_against or constrained_by, and include the necessary scope key
        if appetite thresholds vary by borrower, segment, product, or portfolio.
