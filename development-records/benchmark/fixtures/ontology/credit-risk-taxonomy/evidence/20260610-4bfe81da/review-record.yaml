        -candidate-001 Source finding context: The ontology's declared purpose
        as a shared concept authority for risk engines and reporting systems.
        Source finding context: When determining or reporting RiskAppetite
        compliance from ExposureAggregate values, the target model provides no
        structural path linking the aggregate to the appetite threshold and
        status concept. Source finding context: This weakens review trust
        because a core compliance concept is present but disconnected, making
        implementations rely on external or implicit joins rather than the
        canonical ontology. Source finding context: The relations block omits
        any edge involving RiskAppetite despite its definition depending on
        ExposureAggregate. Source finding context: RiskAppetite defines
        compliance status using a comparison between ExposureAggregate and
        RiskAppetite. Source finding context: The relations block includes no
