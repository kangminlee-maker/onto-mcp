      unresolved_beyond_evidence: null
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260611-5161a370/round1/axiology.findings.yaml#axiology-candidate-003
    target: credit-risk-ontology.yaml temporal risk appetite and utilization basis
    evidence_anchor: .onto/review/20260611-5161a370/execution-preparation/materialized-input.md:69-79,92-95;
      .onto/review/20260611-5161a370/execution-preparation/review-value-alignment-criteria.yaml
      criterion_id=user-request-intent
    claim: 월말 배치 총익스포저를 준수 판단의 기초로 두는 시간성 결정이 리스크 관리 목적을 약화한다.
    lens_rationale_summary: 시간성 관점의 운영 위험을 검토하라는 요청 기준에서, 준수 상태를 판단하는 값이 일중 신규 여신을
      의도적으로 반영하지 않는 것은 보고 편의나 배치 단순성의 국소 최적화가 리스크 성향 한도 준수라는 목적을 약화하는 트레이드오프다.
      `as_of`는 존재하지만 준수 판단 시 허용 지연, 최신성 요구, stale 값 처리 정책이 없다.
    proposed_action: "`ExposureAggregate`에 산출 주기와 freshness SLA를 명시하고,
      RiskAppetite/Limit 소진율 산식에는 사용할 수 있는 기준시점, 일중 이벤트 반영 여부, stale aggregate일
      때의 invalid/unknown 상태를 추가한다. 운영상 월말 배치가 필요하면 실시간/일중 보정 익스포저와 보고용 월말 익스포저를
      별도 개념으로 분리한다."
    affected_purpose: 여신 리스크 관리 및 리스크 엔진/보고 시스템 간 준수 판단 기준 공유.
    failure_condition: 일중 신규 여신이 있는 기간에 월말 배치 `ExposureAggregate.total_amount`를
      Limit 소진율 또는 RiskAppetite 준수 상태 판단에 사용 할 때.
    impact: 한도 초과나 RiskAppetite 위반을 다음 배치까지 정상 상태로 표시할 수 있어 운영 통제와 보고 신뢰가 약화된다.
    evidence_refs:
      - .onto/review/20260611-5161a370/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:69-79
      - materialized-input.md:92-95
      - review-value-alignment-criteria.yaml:user-request-intent
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 여신 리스크 관리 및 리스크 엔진/보고 시스템 간 준수 판단 기준 공유.
      failure_condition: 일중 신규 여신이 있는 기간에 월말 배치 `ExposureAggregate.total_amount`를
        Limit 소진율 또는 RiskAppetite 준수 상태 판단에 사용 할 때.
      impact: 한도 초과나 RiskAppetite 위반을 다음 배치까지 정상 상태로 표시할 수 있어 운영 통제와 보고 신뢰가 약화된다.
      evidence_refs:
        - materialized-input.md:69-79
        - materialized-input.md:92-95
        - review-value-alignment-criteria.yaml:user-request-intent
    causal_path:
      root_cause_candidate: 준수 판단에 쓰이는 aggregate의 시간적 최신성 요구와 stale 값 처리 정책이 온톨로지에 없다.
      root_cause_step_id: finding-003.cause-004
      steps:
        - cause_id: finding-003.cause-001
          claim: "`ExposureAggregate.total_amount`는 모든 `Exposure.amount`의 합으로 정의된다."
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-75
        - cause_id: finding-003.cause-002
          claim: 그 값은 월말 배치로 계산되어 일중 신규 여신은 다음 배치까지 미반영된다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:73-75
        - cause_id: finding-003.cause-003
          claim: RiskAppetite 위반 및 Limit 소진율은 `ExposureAggregate`를 기준으로 정의된다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:78-79
            - materialized-input.md:92-94
        - cause_id: finding-003.cause-004
          claim: 준수 판단의 입력이 stale일 수 있는데 invalid/unknown 또는 보정 경로가 없어 한도 준수 상태가 실제 노출을
            반영하지 못할 수 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:73-79
            - materialized-input.md:92-94
            - review-value-alignment-criteria.yaml:user-request-intent
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260611-5161a370/round1/coverage.findings.yaml#coverage-candidate-001
    target: credit-risk-ontology.yaml / rating and exposure grade temporal coverage
    evidence_anchor: .onto/review/20260611-5161a370/execution-preparation/materialized-input.md:20,
      .onto/review/20260611-5161a370/execution-preparation/materialized-input.md:31,
      .onto/review/20260611-5161a370/execution-preparation/materialized-input.md:48,
      .onto/review/20260611-5161a370/execution-preparation/materialized-input.md:92,
      .onto/review/20260611-5161a370/execution-preparation/materialized-input.md:97
    claim: 시점 의존 등급 값에 유효기간·이력 개념이 없어 과거 리스크 산출과 보고 값을 재구성할 수 없다.
    lens_rationale_summary: 대상 문서는 리스크 엔진과 보고 시스템이 공유하는 개념 권위 문서를 지향한다고 선언한다. 그러나 등급
      산출·조정·변환은 보고 시점에 따라 결과가 달라지는 값인데, 현재 모델은 현재값만 담을 수 있어 월말 보고서, 재작성 보고서, 과거
      심사 재현, 사후감사에서 당시 사용된 등급과 변환 기준을 식별할 수 없다.
    proposed_action: RatingSnapshot 또는 RatingAssignment 같은 이력 개념을 추가하고
      grade/score/source_scale/target_scale/effective_from/effective_to/as_of/generated_at/supersedes/status를
      포함한다. Exposure.risk_grade도 현재 속성만 두지 말고 RiskRating 및 조정 이벤트에서 파생된 시점별 결과로
      모델링한다.
    affected_purpose: 리스크 엔진과 보고 시스템이 공유할 개념 기준 및 과거 시점 보고/산출 재현 가능성
    failure_condition: 등급, 점수, 변환 기준, 수동 조정이 변경된 뒤 과거 특정 시점의 리스크 등급이나 보고 등급을 재구성해야 하는 경우
    impact: 공유 온톨로지가 현재값 중심으로만 등급을 표현하므로 엔진 결과와 보고 결과의 시점별 차이를 설명하거나 감사할 권위 기준이 약해진다.
    evidence_refs:
