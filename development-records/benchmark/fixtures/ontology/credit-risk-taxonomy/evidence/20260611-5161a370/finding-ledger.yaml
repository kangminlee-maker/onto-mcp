  - finding_id: finding-016
    lens_id: structure
    source_ref: .onto/review/20260611-5161a370/round1/structure.findings.yaml#structure-candidate-001
    target: credit-risk-ontology.yaml entities.RiskAppetite / relations
    evidence_anchor: credit-risk-ontology.yaml:73-85, credit-risk-ontology.yaml:87-90
    claim: RiskAppetite is structurally orphaned despite being used as a compliance
      concept.
    lens_rationale_summary: "The ontology states that it is a shared concept
      authority for risk engine and reporting, and `RiskAppetite` defines a
      compliance status based on `ExposureAggregate` exceeding the appetite
      threshold. Because the required structural connection is absent, consumers
      cannot determine from the ontology which aggregate is evaluated against
      which appetite threshold or traverse from borrower exposure totals to
      appetite compliance. This is a structural completeness defect, not merely
      a naming issue: an entity that participates in a stated rule has no graph
      relation supporting that rule."
    proposed_action: "Add an explicit relation connecting `ExposureAggregate` to
      `RiskAppetite`, for example `{ from: ExposureAggregate, to: RiskAppetite,
      kind: evaluated_against }` or `{ from: RiskAppetite, to:
      ExposureAggregate, kind: applies_to }`, and define any required scope key
      such as segment, borrower group, currency, or product if the appetite is
      not global."
    affected_purpose: A bounded ontology intended as the shared concept authority
      for a risk engine and reporting system.
    failure_condition: When a consumer needs to determine or report `RiskAppetite`
      compliance from borrower-level exposure aggregates, the target graph has
      no relation linking the compliance threshold concept to the aggregate it
