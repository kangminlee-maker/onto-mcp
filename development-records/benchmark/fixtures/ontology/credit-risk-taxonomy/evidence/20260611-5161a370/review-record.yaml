    - issue_id: issue-011
      severity: medium
      material: true
      affected_purpose: A bounded ontology intended as the shared concept authority
        for a risk engine and reporting system.
      failure_condition: When a consumer needs to determine or report `RiskAppetite`
        compliance from borrower-level exposure aggregates, the target graph has
        no relation linking the compliance threshold concept to the aggregate it
        evaluates.
      impact: The risk engine and reporting system can implement different joins or
        assumptions for appetite compliance because the ontology does not close
        the stated compliance path in the target artifact.
      evidence_refs:
        - .onto/review/20260611-5161a370/round1/structure.findings.yaml#structure-candidate-001
        - credit-risk-ontology.yaml:73-78
        - credit-risk-ontology.yaml:80-85
        - credit-risk-ontology.yaml:87-90
      source_lens_ids:
        - structure
      action_candidates: &a12
        - fix_before_release
        - follow_up
      rationale: "구조 finding과 모든 participating lens가 missing evaluation edge root를
        지지했다. 준수 판단 경로가 그래프에서 순회되지 않으면 엔진과 보고 시스템이 다른 join 가정을 만들 수 있으므로 다음 단계
        전에 관계 완전성을 보완해야 한다. Source finding context: credit-risk-ontology.yaml
        entities.RiskAppetite / relations Source finding context:
        credit-risk-ontology.yaml:73-85, credit-risk-ontology.yaml:87-90 Source
        finding context: RiskAppetite is structurally orphaned despite being
        used as a compliance concept. Source finding context: The ontology
        states that it is a shared concept authority for risk engine and
        reporting, and `RiskAppetite` defines a compliance status based on
        `ExposureAggregate` exceeding the appetite threshold. Because the
        required structural connection is absent, consumers cannot determine
        from the ontology which aggregate is evaluated against which appetite
        threshold or traverse from borrower exposure totals to appetite
        compliance. This is a structural completeness defect, not merely a
        naming issue: an entity that participates in a stated rule has no graph
        relation supporting that rule. Source finding context: Add an explicit
        relation connecting `ExposureAggregate` to `RiskAppetite`, for example
        `{ from: ExposureAggregate, to: RiskAppetite, kind: evaluated_against }`
        or `{ from: RiskAppetite, to: ExposureAggregate, kind: applies_to }`,
        and define any required scope key such as segment, borrower group,
        currency, or product if the appetite is not global. Source finding
        context:
        .onto/review/20260611-5161a370/round1/structure.findings.yaml#structure\
        -candidate-001 Source finding context: A bounded ontology intended as
        the shared concept authority for a risk engine and reporting system.
        Source finding context: When a consumer needs to determine or report
        `RiskAppetite` compliance from borrower-level exposure aggregates, the
        target graph has no relation linking the compliance threshold concept to
        the aggregate it evaluates. Source finding context: The risk engine and
        reporting system can implement different joins or assumptions for
        appetite compliance because the ontology does not close the stated
        compliance path in the target artifact. Source finding context: The
        relations section omits a required edge for a rule-bearing entity that
        is defined in terms of another entity. Source finding context:
        `RiskAppetite` is defined through a comparison with `ExposureAggregate`
        and owns the resulting `compliance_status`. Source finding context: The
        `relations` section lists five edges, none of which include
        `RiskAppetite`. Source finding context: The rule-bearing entity is
        therefore disconnected from the graph path used to compute or report its
        stated compliance status."
      problem_definition: "`RiskAppetite` 준수 개념이 `ExposureAggregate`에 의해 정의되지만
        relations에 계산·평가 경로를 닫는 edge가 없다."
