        - problem-framing.yaml
      rationale: "이는 직접 관찰된 타입/관계 모순이며 모든 applicable lens가 제거 action을 지지했다. 소비자가
        `is_a`를 상속으로 구현하면 담보가 익스포저 집계와 검증에 섞일 수 있으므로 target의 정확성 결함이다. Source
        finding context: credit-risk-ontology.yaml / entities.Collateral Source
        finding context: credit-risk-ontology.yaml:35-42
        (`Collateral.definition`: \"익스포저를 담보하는 자산. 담보 평가의 기본 단위.\" and
        `Collateral.is_a: Exposure`); credit-risk-ontology.yaml:63 (`Exposure ->
        Collateral`, `kind: secured_by`) Source finding context: `Collateral` is
        declared both as an `Exposure` subtype and as an asset that secures an
        `Exposure`, creating an intra-model type contradiction. Source finding
        context: The contradiction is visible from the declared claims
        themselves: if `Collateral` is a subtype of `Exposure`, every collateral
        instance is an exposure; but the definition and relation require
        collateral to be the asset on the other side of a secured-by relation
        from exposure. A risk engine or reporting system using subclass
        inheritance would inherit exposure attributes onto collateral assets and
        allow collateral records where exposure records are expected, while the
        relation asserts they are distinct roles. This weakens the ontology's
        declared purpose as a shared concept authority. Source finding context:
        Remove `is_a: Exposure` from `Collateral` and model collateral as a
        separate entity related to `Exposure` through `secured_by`; if a shared
        parent is needed, introduce a neutral parent only when it has properties
        genuinely common to both concepts. Source finding context:
        .onto/review/20260611-5161a370/round1/logic.findings.yaml#logic-candida\
        te-001 Source finding context: The ontology is intended as the shared
        concept authority for risk engines and reporting systems. Source finding
        context: When consumers implement `is_a` as subtype inheritance or type
        membership, collateral assets become valid exposures while the relation
        model still treats them as separate securing assets. Source finding
        context: This can corrupt type checks, inherited attributes, aggregation
        eligibility, and report joins across exposure and collateral concepts,
        making the shared taxonomy unsafe as an operational contract. Source
        finding context: The model uses subtype inheritance (`is_a`) to
        represent a security relationship that is already separately declared as
        `Exposure secured_by Collateral`. Source finding context: `Collateral`
        is defined as an asset that secures an exposure, not as a credit
        exposure itself. Source finding context: The entity declaration
        nevertheless states `Collateral.is_a: Exposure`, making collateral a
        subtype/member of exposure. Source finding context: The relation
        declaration also models `Collateral` as the target of `Exposure
        secured_by Collateral`, which requires collateral to play the secured
        asset role opposite exposure."
