    conflict_summary: Coverage, semantics, and structure support the issue as a
      missing default/delinquency status connection, while axiology, evolution,
      and logic narrow the root to an external boundary-reference contract
      rather than fully modeling default status inside the ontology. The
      conflict is material because the action may either bring DefaultStatus
