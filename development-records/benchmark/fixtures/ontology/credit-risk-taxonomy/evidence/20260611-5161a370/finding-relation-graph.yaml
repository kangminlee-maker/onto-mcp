    to_finding_id: finding-008
    relation: same_root_candidate
    root_hypothesis: The shared root is that the three rating scales are not
      governed by an ontology-owned, versioned mapping authority; instead,
      conversion is delegated to external/wiki or consumer-system
      implementations.
    shared_cause: null
    rationale: Both findings target the same rating-scale transformation gap.
