  - relation_id: rel-001
    from_finding_id: finding-005
    to_finding_id: finding-001
    relation: causes
    root_hypothesis: If manual risk-grade adjustment is modeled as a controlled
      event with original value, actor, reason, timestamp, approval, and
      source-rating reference, the reported authority conflict in
      Exposure.risk_grade should be materially reduced.
    shared_cause: null
    rationale: finding-005 identifies the missing override evidence concept for
      report-team manual adjustment, while finding-001 describes the resulting
      authority failure when adjusted report values and engine-derived grades
      are consumed through the same risk_grade authority field without lineage
      or precedence.
    confidence: high
