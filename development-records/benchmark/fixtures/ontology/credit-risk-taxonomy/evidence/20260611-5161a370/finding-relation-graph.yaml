  - relation_id: rel-005
    from_finding_id: finding-004
    to_finding_id: finding-008
    relation: shared_cause_candidate
    root_hypothesis: Both findings should be mitigated if rating assignments and
      grade mappings are modeled as versioned, effective-dated history concepts
      rather than current attributes plus external conversion practice.
    shared_cause:
      cause_claim: Rating values and their transformations are time-dependent, but the
