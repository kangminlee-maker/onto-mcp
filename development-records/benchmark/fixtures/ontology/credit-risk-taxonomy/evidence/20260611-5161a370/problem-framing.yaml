  - issue_id: issue-001
    problem_definition: "`Exposure.risk_grade`가 원천 엔진 등급과 보고 조정 등급을 하나의 권위값으로 결합해
      lineage와 precedence를 구분하지 못한다."
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: consistency
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 최종 deliberation은 거버넌스 전반이 아니라 단일 등급 필드의 권위·lineage·precedence 결손으로
      root를 좁혔다. 이 결손은 엔진과 보고 시스템의 동일 등급 의미를 갈라 공유 개념 기준의 일관성을 직접 깨므로 target 안에서
      닫아야 한다.
    related_surface_finding_ids:
      - finding-001
  - issue_id: issue-002
    problem_definition: 등급 스케일과 확장 분류값이 온톨로지 소유의 스케일, 매핑, 버전, 유효기간, lifecycle 계약으로 모델링되지 않았다.
    issue_role: root_cause
    judgment_state: contested
    impact_kind: maintainability_evolvability
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 다수 렌즈와 resolution은 rating scale뿐 아니라 code-set authority와 lifecycle까지
      high 범위로 유지했다. semantics의 범위 축소 이견이 남아 contested로 보존하지만, 확장·개정 시 시스템별 의미가
      달라지는 근본 계약 결손이므로 target에서 닫아야 한다.
    related_surface_finding_ids:
      - finding-002
      - finding-008
      - finding-010
      - finding-014
  - issue_id: issue-003
    problem_definition: "`ExposureAggregate.total_amount`가 월말 배치 스냅샷임에도 현재 총익스포저처럼
      명명·정의되어 freshness와 stale 처리 기준이 없다."
