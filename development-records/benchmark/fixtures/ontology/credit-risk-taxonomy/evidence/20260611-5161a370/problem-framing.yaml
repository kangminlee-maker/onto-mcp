    domain_axes: {}
    rationale: 모든 관련 렌즈가 같은 root와 medium severity를 지지했다. 준수 판단 입력의 시간 기준이 닫히지 않으면 한도
      초과나 RiskAppetite 위반 판단이 틀릴 수 있어 다음 운영 사용 전 해결해야 한다.
