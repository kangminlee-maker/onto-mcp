lens_id: evolution
human_output_ref: null
findings:
  - candidate_id: evolution-candidate-001
    target: credit-risk-ontology.yaml / RiskRating.grade, Exposure.risk_grade,
      Borrower.internal_rating
    evidence_anchor: entities.Borrower.attributes.internal_rating note;
      entities.RiskRating.attributes.grade values/note;
      entities.Exposure.attributes.risk_grade values/note; notes[0]
    claim: 등급 스케일 3개가 소비 시스템별 변환으로 방치되어 새 등급·버전 추가 시 연속성이 깨진다.
    what: 온톨로지는 internal_rating(1~10), RiskRating.grade(R1~R5),
      Exposure.risk_grade(AAA~CCC)를 모두 권위 있는 등급처럼 노출하면서, 매핑은 리스크팀 위키 또는 각 소비
      시스템이 수행한다고 둔다. 등급 체계의 버전, 유효기간, 표준 매핑 엔티티, 미매핑 처리 규칙이 온톨로지 안에 없다.
    why: 이 문서는 리스크 엔진과 보고 시스템이 공유할 개념 권위를 지향하지만, 엔진 산출 등급과 보고 등급 사이의 변환 권위가 외부 위키와
      소비 시스템으로 분산되어 있다. 새 엔진 등급, 세분화된 보고 등급, 과거 등급 체계 개정이 생기면 기존 데이터가 어떤 버전의
      매핑으로 해석되어야 하는지 대상 파일만으로 재현할 수 없어 보고 연속성과 규칙 호환성이 약해진다.
    how_to_fix: RatingScale 또는 GradeMapping 같은 권위 엔티티를 추가해 source_scale,
      target_scale, source_grade, target_grade, effective_from/to,
      mapping_status, owner를 정의하고, RiskRating.grade에서 Exposure.risk_grade로의 도출
      규칙이 이 매핑을 참조하도록 고정한다. Borrower.internal_rating도 동일한 스케일/버전 모델에 편입한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 여신 리스크 분류 기준 및 등급 해석 권위
      failure_condition: 등급 체계가 추가·개정되거나 과거 보고를 재현해야 할 때, 소비 시스템별 변환이 서로 달라지거나 어떤 매핑
        버전이 적용됐는지 확인할 수 없는 조건
      impact: 핵심 분류값인 리스크 등급의 변경 내성이 낮아져 엔진 결과와 보고 결과의 비교, 과거 데이터 재처리, 외부 표준 변경 대응이
        신뢰하기 어려워진다.
      evidence_refs:
        - "entities.Borrower.attributes.internal_rating note: 내부 신용등급 1~10"
        - "entities.RiskRating.attributes.grade values [R1..R5] and note: 매핑
          테이블은 리스크팀 위키 참조"
        - "entities.Exposure.attributes.risk_grade values [AAA..CCC] and note:
          보고서 팀이 사용"
        - "notes[0]: 3개 스케일은 병존하며 변환은 각 소비 시스템이 수행"
    causal_path:
      root_cause_candidate: 등급 변환을 온톨로지의 권위 개념으로 모델링하지 않고 외부 위키 및 소비 시스템별 처리로 위임했다.
      root_cause_step_id: evolution-candidate-001.cause-004
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 대상 파일에는 세 가지 등급 스케일이 별도 속성으로 존재한다.
          relation_to_previous: null
          evidence_refs:
            - entities.Borrower.attributes.internal_rating
            - entities.RiskRating.attributes.grade
            - entities.Exposure.attributes.risk_grade
        - cause_id: evolution-candidate-001.cause-002
          claim: RiskRating.grade의 매핑은 리스크팀 위키를 참조하고, notes는 변환을 각 소비 시스템이 수행한다고 명시한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.RiskRating.attributes.grade.note
            - notes[0]
        - cause_id: evolution-candidate-001.cause-003
          claim: classification_rules는 Exposure.risk_grade가 RiskRating.grade에서 도출된다고 하면서도
            보고서 팀의 수동 조정을 허용해 변환 결과의 권위를 더 분산한다.
          relation_to_previous: enables
          evidence_refs:
            - classification_rules[0]
        - cause_id: evolution-candidate-001.cause-004
          claim: 따라서 새 등급이나 매핑 버전이 추가될 때 기존 데이터/보고가 어느 변환 기준으로 유지되어야 하는지 온톨로지 내부에서 닫히지
            않는다.
          relation_to_previous: causes
          evidence_refs:
            - entities.RiskRating.attributes.grade.note
            - classification_rules[0]
            - notes[0]
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-002
    target: credit-risk-ontology.yaml / Limit 소진율 및 ExposureAggregate
    evidence_anchor: entities.Limit.attributes.approved_amount note;
      entities.ExposureAggregate.attributes.total_amount/as_of;
      classification_rules[1]
    claim: 통화 환산과 집계 시점 권위가 시스템별·월말 배치로 분산되어 신규 통화/환율 정책 변경 시 한도 소진율의 연속성이 깨진다.
    what: Limit 소진율은 ExposureAggregate.total_amount / Limit.approved_amount로 정의되지만,
      통화가 다른 경우 각 시스템의 당일 환율 테이블을 사용한다고 되어 있다. 동시에
      ExposureAggregate.total_amount는 월말 배치 저장값이고 일중 신규 여신은 다음 배치까지 미반영된다.
      Limit.approved_amount는 승인 시스템이 기록하고 CRM의 available_limit과 합산 관리한다고만 되어 있어
      통화, 시점, 환율 출처, 합산 기준이 하나의 권위 모델로 닫히지 않는다.
    why: 한도 소진율은 리스크 엔진과 보고 시스템이 공통으로 해석해야 하는 운영 지표인데, 환율 테이블과 집계 갱신 주기가 소비 시스템마다
      다르면 같은 차주/한도라도 시점과 시스템에 따라 다른 소진율이 계산된다. 새 통화, 장중 환율 정책, 신규 상품 익스포저가 추가될수록
      기존 월말 집계와 당일 환율 계산의 호환성이 더 약해진다.
    how_to_fix: ExposureAggregate와 LimitUsage 같은 파생 지표에 valuation_currency,
      fx_rate_source, fx_rate_as_of, aggregation_as_of, inclusion_cutoff,
      calculation_owner를 추가하고, 통화 환산은 단일 ExchangeRateAuthority 또는 명시된 환율 참조 엔티티를
      통하도록 한다. 월말 배치값과 일중 추정값은 별도 status/version으로 구분한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 한도 소진율 및 익스포저 집계 기준
      failure_condition: 다중 통화 익스포저, 새 통화 추가, 환율 정책 변경, 일중 신규 여신 발생 시 시스템별 환율/집계 시점이 달라지는 조건
      impact: 동일한 한도 위반 또는 소진율 판단이 시스템마다 달라질 수 있어 운영 보고와 리스크 규칙의 변경 내성 및 재현성이 저하된다.
      evidence_refs:
        - "classification_rules[1]: 통화가 다른 경우 각 시스템의 당일 환율 테이블 사용"
        - "entities.ExposureAggregate.attributes.total_amount.note: 월말 배치 저장, 일중
          신규 여신 미반영"
        - "entities.Limit.attributes.approved_amount.note: 승인 시스템 기록, CRM
          available_limit과 합산 관리"
    causal_path:
      root_cause_candidate: 한도 소진율 계산에 필요한 환율·집계시점·합산 권위를 온톨로지 내부의 명시적 개념으로 만들지 않고 시스템별 실행에 맡겼다.
      root_cause_step_id: evolution-candidate-002.cause-005
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: Limit 소진율 공식은 ExposureAggregate.total_amount와 Limit.approved_amount의 비율로
            정의되어 있다.
          relation_to_previous: null
          evidence_refs:
            - classification_rules[1]
        - cause_id: evolution-candidate-002.cause-002
          claim: 다중 통화 환산은 각 시스템의 당일 환율 테이블을 사용하도록 되어 있어 단일 환율 권위가 없다.
          relation_to_previous: enables
          evidence_refs:
            - classification_rules[1]
        - cause_id: evolution-candidate-002.cause-003
          claim: ExposureAggregate.total_amount는 월말 배치 저장값이며 일중 신규 여신은 다음 배치까지 반영되지 않는다.
          relation_to_previous: enables
          evidence_refs:
            - entities.ExposureAggregate.attributes.total_amount.note
        - cause_id: evolution-candidate-002.cause-004
          claim: Limit.approved_amount는 승인 시스템과 CRM available_limit 합산 관리가 언급되지만 합산 기준과 시간
            기준은 모델링되어 있지 않다.
          relation_to_previous: enables
          evidence_refs:
            - entities.Limit.attributes.approved_amount.note
        - cause_id: evolution-candidate-002.cause-005
          claim: 그 결과 새 통화나 환율 정책, 일중 반영 요구가 생기면 기존 계산 결과와 새 계산 결과의 연속성을 온톨로지 기준으로 보장하기
            어렵다.
          relation_to_previous: causes
          evidence_refs:
            - classification_rules[1]
            - entities.ExposureAggregate.attributes.total_amount.note
            - entities.Limit.attributes.approved_amount.note
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-003
    target: credit-risk-ontology.yaml / enum attributes for segment, product_type,
      collateral_type, risk_grade, compliance_status
    evidence_anchor: entities.Borrower.attributes.segment;
      entities.Exposure.attributes.product_type/risk_grade;
      entities.Collateral.attributes.collateral_type;
      entities.RiskAppetite.attributes.compliance_status
    claim: 핵심 분류축이 폐쇄 enum으로만 선언되어 새 상품·담보·세그먼트 확장 시 온톨로지 스키마 수정이 필요하다.
    what: segment, product_type, collateral_type, risk_grade, compliance_status가 고정
      values 배열로 직접 선언되어 있고, 코드/표준값의 라이프사이클, 확장 슬롯, deprecated alias, effective
      date, 외부 코드 매핑이 없다.
    why: 여신 리스크 분류체계는 상품, 담보, 차주 세그먼트가 조직·시장·규제 변화에 따라 늘어나는 영역이다. 현재 구조에서는 새 상품 유형이나
      담보 유형을 추가하려면 기존 enum 정의를 직접 변경해야 하며, 과거 값의 유효성이나 소비 시스템 호환 별칭을 표현할 곳이 없다.
    how_to_fix: 빈번히 확장되는 분류축은 CodeSet/ClassificationTerm 형태로 분리하고 code, label,
      parent, status, effective_from/to, replaced_by, external_code_refs를 둔다.
      엄격히 닫힌 상태값만 enum으로 유지하고, product_type·collateral_type·segment 같은 확장축은 참조형
      분류로 전환한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 분류체계의 확장성과 외부 표준 변경 수용
      failure_condition: 신규 여신 상품, 담보 자산군, 차주 세그먼트, 보고 등급 값이 추가되거나 기존 코드가 폐기·대체되는 조건
      impact: 새 분류값 수용이 데이터 추가가 아니라 스키마 변경이 되어 배포 조정, 과거 데이터 해석, 소비 시스템 호환성 유지 비용이 커진다.
      evidence_refs:
        - entities.Borrower.attributes.segment.values [retail, sme, corporate]
        - entities.Exposure.attributes.product_type.values [term_loan,
          revolving, guarantee]
        - entities.Collateral.attributes.collateral_type.values [real_estate,
          deposit, securities]
        - entities.Exposure.attributes.risk_grade.values [AAA, AA, A, BBB, BB,
          B, CCC]
        - entities.RiskAppetite.attributes.compliance_status.values [compliant,
          breached]
    causal_path:
      root_cause_candidate: 확장 가능성이 높은 비즈니스 분류값을 별도 분류 개념이 아니라 속성 내부의 고정 enum 값으로 모델링했다.
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 대상 파일은 여러 핵심 분류축을 속성 내부 values 배열로 직접 고정한다.
          relation_to_previous: null
          evidence_refs:
            - entities.Borrower.attributes.segment
            - entities.Exposure.attributes.product_type
            - entities.Collateral.attributes.collateral_type
            - entities.Exposure.attributes.risk_grade
            - entities.RiskAppetite.attributes.compliance_status
        - cause_id: evolution-candidate-003.cause-002
          claim: 해당 enum들에는 값의 유효기간, 폐기 상태, 대체 코드, 외부 코드 매핑을 담는 속성이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.Borrower.attributes.segment
            - entities.Exposure.attributes.product_type
            - entities.Collateral.attributes.collateral_type
        - cause_id: evolution-candidate-003.cause-003
          claim: 따라서 새 유형이나 표준값을 수용하려면 기존 스키마의 values 배열 자체를 수정해야 한다.
          relation_to_previous: causes
          evidence_refs:
            - entities.Borrower.attributes.segment.values
            - entities.Exposure.attributes.product_type.values
            - entities.Collateral.attributes.collateral_type.values
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - session_domain이 none이므로 별도 도메인 문서 없이 프롬프트에 포함된 온톨로지와 리뷰 목표만 사용했다.
  - 검토 관점은 evolution 렌즈에 맞춰 변경 내성, 확장성, 외부 기준 변경 시 연속성에 한정했다.
  - 요청상 리스크 엔진과 보고 시스템이 공유하는 개념 권위 문서라는 선언을 목적 기준으로 삼았다.
validation:
  unaddressable_candidates: []
