      imported_at, authority_owner, freshness rule을 정의한다. 포함할 수 있다면
      DefaultStatus lifecycle을 정상, 연체, 부실, 회복, 상각/종결 등으로 별도 모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
