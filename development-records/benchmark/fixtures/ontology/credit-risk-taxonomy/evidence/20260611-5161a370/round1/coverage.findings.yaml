      failure_condition: 보고나 엔진 산출이 연체/부실 여부를 등급, 익스포저, 한도 위반과 함께 해석해야 하는 경우
      impact: 상태 하위 영역이 외부 시스템에 있다는 사실만 있고 연결 개념이 없어 공유 온톨로지 안에서 default 상태의 권위, 기준시점,
