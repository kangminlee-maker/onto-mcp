    what: 차주 등급은 internal_rating 1~10, RiskRating R1~R5, Exposure risk_grade
      AAA~CCC의 3개 스케일이 병존하며 변환은 소비 시스템이 수행한다고 되어 있다. Limit.approved_amount는 승인
      시스템 기록과 영업점 CRM의 available_limit과 합산 관리되고, 통화 환산은 각 시스템의 당일 환율 테이블을 사용한다.
      그러나 어느 시스템·테이블·매핑이 기준 권위인지 표현하는
      SourceAuthority/MappingAuthority/FXRateSource 개념이 없다.
    why: 공유 개념 기준 문서가 병행 스케일과 다중 시스템 값을 단일 권위 없이 허용하면, 리스크 엔진과 보고 시스템이 같은 입력에 대해 다른
      등급 변환, 한도 소진율, 통화 환산 결과를 만들 수 있다.
    how_to_fix: 각 값 계열에 canonical_source, source_system, authority_owner,
      precedence, mapping_table_ref, mapping_version, fx_rate_source,
      rate_timestamp를 추가하거나
      SourceAuthority/RatingScaleMapping/ExchangeRateSnapshot 개념을 도입한다. 소비 시스템별
      변환은 허용하더라도 권위 매핑과 예외 우선순위를 온톨로지 안에 둔다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 등급 변환, 한도 소진율, 통화 환산 기준의 일관성
      failure_condition: 복수 시스템이 동일 차주·익스포저에 대해 등급 스케일 변환, CRM 한도 합산, 통화 환산을 수행하는 경우
      impact: 권위와 우선순위가 빠져 시스템별 결과 차이를 정상 변형인지 오류인지 판정할 기준이 약해진다.
      evidence_refs:
        - materialized-input.md:20-22
        - materialized-input.md:53-56
        - materialized-input.md:64-67
        - materialized-input.md:92-98
    causal_path:
