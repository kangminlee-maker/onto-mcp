  - candidate_id: coverage-candidate-002
    target: credit-risk-ontology.yaml / manual risk grade adjustment coverage
    evidence_anchor: .onto/review/20260611-5161a370/execution-preparation/materialized-input.md:31,
      .onto/review/20260611-5161a370/execution-preparation/materialized-input.md:92
    claim: 보고서 팀의 수동 등급 조정 행위에 대한 행위자·시각·근거·승인 증거 개념이 없다.
    what: classification_rules는 Exposure.risk_grade를 보고서 팀이 시장 상황에 따라 수동 조정할 수 있다고
      하지만, Adjustment/Override/Approval/AuditEvidence 같은 행위 개념이 없고 risk_grade
      속성에도 조정자, 조정시각, 조정사유, 원래 등급, 승인 상태가 없다.
    why: 수동 조정은 통제가 필요한 행위다. 현재 범위에서는 조정된 최종 risk_grade만 남길 수 있어 리스크 엔진 산출값과 보고서
      사용값이 달라졌을 때 누가 언제 어떤 근거로 바꾸었는지 공유 기준으로 확인할 수 없다.
    how_to_fix: RiskGradeOverride 또는 ManualAdjustment 엔티티를 추가해 exposure_ref,
      source_rating_ref, original_grade, adjusted_grade, actor, adjusted_at,
      reason_code, evidence_ref, approval_status, approved_by, approved_at,
      effective_period를 모델링한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진 산출 등급과 보고 시스템 사용 등급의 공유 권위 및 통제 가능성
      failure_condition: 보고서 팀이 Exposure.risk_grade를 수동 조정한 뒤 엔진 등급과 보고 등급 차이를 설명하거나 승인·감사해야 하는 경우
      impact: 수동 조정이 권위 문서 안에서 증거화되지 않아 보고 결과의 신뢰성, 재현성, 내부통제 추적성이 약해진다.
      evidence_refs:
        - materialized-input.md:31-34
        - materialized-input.md:92-93
    causal_path:
      root_cause_candidate: 수동 조정을 별도 통제 행위/증거 개념으로 모델링하지 않고 최종 등급 속성 변경 가능성만 규칙 문장에 둔 범위 결손
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: Exposure.risk_grade는 보고서 팀이 사용하는 익스포저 단위 등급으로 정의되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:31-34
        - cause_id: coverage-candidate-002.cause-002
          claim: classification_rules는 해당 등급을 RiskRating.grade에서 도출하되 보고서 팀이 시장 상황에 따라 수동
            조정할 수 있다고 허용한다.
          relation_to_previous: causes
          evidence_refs:
