    claim: 연체/부실(default) 상태가 범위 밖으로만 선언되어 리스크 분류와 보고에 필요한 상태 하위 영역이 온톨로지에 표현되지 않는다.
    what: notes는 연체/부실(default) 상태를 별도 연체관리 시스템에서 다루므로 이 온톨로지 범위 밖이라고 한다. 그러나 현재
      모델에는 해당 외부 상태를 참조하는 DefaultStatus, DelinquencyStatus, external_status_ref,
      status_as_of, ingestion authority, 또는 보고용 연결 규칙이 없다.
    why: 여신 리스크 분류에서 default 여부는 등급, 익스포저 집계, 한도 위반 보고와 함께 소비될 가능성이 큰 상태 축이다. 완전히 외부
      범위로 둘 수는 있어도, 리스크 엔진과 보고 시스템의 공유 기준이라면 최소한 외부 권위·참조키·시점·동기화 상태를 표현해야 시스템 간
