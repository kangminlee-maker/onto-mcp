    claim: 세 등급 스케일 변환을 소비 시스템에 맡기는 결정은 공유 개념 기준 목적과 어긋난다.
    what: "`Borrower.internal_rating`, `RiskRating.grade`, `Exposure.risk_grade`의 세
      스케일이 병존하며 변환은 각 소비 시스템이 수행한다고 적고 있다. 온톨로지 자체는 매핑 테이블, 변환 권위, 버전, 불일치 처리
      규칙을 제공하지 않는다."
    why: 공유 기준이 되어야 할 온톨로지가 핵심 분류 스케일의 변환 책임을 각 소비 시스템으로 밀어내면, 리스크 엔진과 보고 시스템 사이의
      동일성 기준이 외부 구현별 관행에 의존한다. 이는 역사적 호환성을 보존하는 대신 공유 개념 권위와 분류체계 일관성을 희생하는 숨은
      트레이드오프다.
    how_to_fix: 세 등급 스케일의 canonical source와 변환 테이블 버전, 적용 유효기간, 변환 불가/다대일 매핑 처리, 소비
      시스템별 override 금지 또는 허용 조건을 온톨로지에 포함한다. 역사적 병존이 필요하면 각 스케일을 별도 개념으로 유지하되 변환
      권위는 하나로 둔다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 분류체계 및 개념 기준.
      failure_condition: 소비 시스템들이 세 등급 스케일 간 변환을 각자 수행하고, 온톨로지에 canonical 변환 권위와 버전이 없을 때.
      impact: 같은 차주/익스포저가 시스템별로 다른 등급 의미나 bucket에 배치될 수 있어 리스크 판단과 보고 수치의 비교 가능성이 약화된다.
      evidence_refs:
