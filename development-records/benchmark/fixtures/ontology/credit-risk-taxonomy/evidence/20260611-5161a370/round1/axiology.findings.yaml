    claim: 보고서 팀의 수동 조정 권한이 공유 개념 권위 목적을 약화한다.
    what: 대상은 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향한다고 선언하지만, `Exposure.risk_grade`는
      `RiskRating.grade`에서 도출된 뒤 보고서 팀이 시장 상황에 따라 수동 조정할 수 있다고 규정한다. 수동 조정의 승인
      주체, 근거 기록, 우선순위, 엔진 산출값과의 구분 상태가 같은 온톨로지 안에 닫혀 있지 않다.
    why: 사용자 요청의 평가 기준은 '리스크 엔진과 보고 시스템이 공유할 개념 기준'으로 적절한지와 '권위' 관점의 운영 위험이다. 엔진 산출
      등급이 별도 엔티티로 정의되어 있는데 보고서 팀의 조정값이 같은 `risk_grade` 권위값으로 섞이면, 보고 목적의 국소 최적화가
      공유 기준이라는 목적을 벗어나 엔진과 보고서가 서로 다른 진실을 같은 필드명으로 소비하게 만든다.
    how_to_fix: "`RiskRating.grade`에서 산출된 원천 등급과 보고서 조정 등급을 분리하고, 조정 등급에는 조정 주체, 사유,
      적용 시점, 승인/감사 상태, 원천 등급 참조를 명시한다. 또한 공유 산출물에서 어느 등급이 권위값인지 우선순위를 온톨로지 내부
      규칙으로 닫는다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서로서의 목적.
      failure_condition: 보고서 팀이 시장 상황을 이유로 `Exposure.risk_grade`를 수동 조정하고, 엔진 산출 등급과
        조정 등급의 권위 우선순위나 lineage가 온톨로지 안에 없을 때.
      impact: 동일 익스포저의 리스크 등급을 엔진과 보고 시스템이 서로 다른 의미로 해석할 수 있어 공유 개념 기준에 대한 신뢰와 감사 가능성이
        약화된다.
      evidence_refs:
        - materialized-input.md:6-8
