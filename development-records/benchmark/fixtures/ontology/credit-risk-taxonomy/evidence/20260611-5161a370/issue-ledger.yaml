  - issue_id: issue-008
    root_cause_hypothesis: "담보와 익스포저의 secured_by 관계를 이미 선언했음에도 `Collateral.is_a:
      Exposure` 상속 관계로 같은 개념을 다시 표현했다."
    root_confidence: medium
    surface_finding_ids:
      - finding-011
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: "`Collateral`이 익스포저를 담보하는 자산이면서 동시에 `Exposure` 하위 유형으로 선언되어 타입 계약이 모순된다."
    proposed_action: "`Collateral.is_a: Exposure`를 제거하고 담보를 독립 엔티티로 유지하며 `Exposure
      secured_by Collateral` 관계로만 연결한다."
    affected_purpose: The ontology is intended as the shared concept authority for
      risk engines and reporting systems.
    failure_condition: When consumers implement `is_a` as subtype inheritance or
      type membership, collateral assets become valid exposures while the
      relation model still treats them as separate securing assets.
    impact: This can corrupt type checks, inherited attributes, aggregation
      eligibility, and report joins across exposure and collateral concepts,
      making the shared taxonomy unsafe as an operational contract.
    evidence_refs:
      - .onto/review/20260611-5161a370/round1/logic.findings.yaml#logic-candidate-001
      - credit-risk-ontology.yaml:1-3
      - credit-risk-ontology.yaml:35-42
      - credit-risk-ontology.yaml:63
    severity: high
    domain_threshold_used: null
    singleton_reason: The relation graph marks finding-011 and finding-012 as
      duplicates via rel-012, but the issue artifact contract requires
      multi-finding issue relation_refs to connect assigned findings through
      same_root_candidate relations; no such relation was available in-boundary.
