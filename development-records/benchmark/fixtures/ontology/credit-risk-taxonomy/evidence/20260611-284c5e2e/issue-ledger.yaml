      설계 입장'(finding-013.cause-003)이 등급 매핑 위임(finding-001)을 포함한 세
      지점(한도·환율·등급매핑)의 권위 분산을 모두 만들었다. 온톨로지에 authority 지정 차원을 도입하면 finding-001이
      finding-013의 한 사례로 함께 해소되어야 한다. / 환산 권위·기준 시점을 개념의 일부로 포함하지 않고 시스템 구현에 위임한
