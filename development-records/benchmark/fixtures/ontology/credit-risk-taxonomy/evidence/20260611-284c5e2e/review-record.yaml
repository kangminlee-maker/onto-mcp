issue_resolution_summary:
  - issue_id: issue-001
    problem_definition: 단일 원본 권위 지정을 온톨로지 책임으로 보지 않은 설계 입장이 등급 매핑(위키)·환율(시스템별 당일
      테이블)·한도(CRM) 세 지점의 권위 분산을 만들어, 두 소비 시스템이 같은 차주에 대해 다른 소진율·등급을 산출해도 어느 값이
      권위인지 판정할 수 없다.
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: consistency
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 6개 lens 전원이 수용한 공유 root이며 issue-014/024/019 등 다수 표면 결함의 발생 지점이다. 권위
      분산이라는 설계 입장 자체는 세 증거 지점에서 귀납된 추론(root_confidence medium)이므로 inferred. 공유
      개념 권위 문서라는 선언 목적의 핵심(시스템 간 단일 의미)이 현재 상태에서 깨져 있어 high·current_blocker이고,
      매핑·환율·한도 권위의 온톨로지 1급 편입은 대상 문서 안에서 닫혀야 한다.
    related_surface_finding_ids:
      - finding-001
      - finding-019
      - finding-013
      - finding-003
      - finding-037
  - issue_id: issue-002
    problem_definition: ExposureAggregate 정의는 시점 무한정 보편 집계('모든 Exposure.amount의
      합')인데 산출은 월말 배치 스냅숏이어서, 일중 신규 여신 미반영 구간 동안 정의와 실제 값이 모순되고 리스크 성향 한도 통제가 최대
      한 달 지연된 사후 보고로 격하된다.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: correctness
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 정의문(:65)과 운영 주석(:70)의 양상 불일치가 문서 내부 증거만으로 직접 확인된 형식
      모순(root_confidence high)이므로 observed. compliance_status가 사실과 다른 값을 갖는 구간이
      구조적으로 존재해 정확성 손상이 핵심이다. as_of 한정과 신선도 계약 명시는 정의 한 곳의 수정으로 대상 내에서 닫을 수 있고
      high이므로 fix_now·must_close_in_target.
    related_surface_finding_ids:
      - finding-004
      - finding-027
  - issue_id: issue-003
    problem_definition: 조직 경계(연체관리 시스템 소유권)를 개념 경계로 오인해 default 하위 도메인을 정당화 없이 범위
      제외한 boundary 결정으로, 두 소비 시스템 모두가 분류·보고해야 하는 부실 세그먼트 전체에 공유 의미가 부재하다.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: completeness
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 범위 제외 선언(notes[1])이 문서에 직접 존재하고, deliberation에서 치유 비용은 격하 사유가 아니라는
      판단으로 high 확정·issue-007과 단일 클러스터화되었다. 이 issue가 boundary 결정이라는 뿌리와 정본
      치유안(DefaultStatus 외부 권위 참조 개념 + 관계 정의)을 보유하므로 root_cause이며, 경계 개념 선언은 대상
      문서에서 닫혀야 한다. review_goal의 scope_control 축에 직결된다.
    related_surface_finding_ids:
      - finding-006
  - issue_id: issue-004
    problem_definition: Limit.approved_amount의 '영업점 CRM available_limit과 합산 관리' 서술이
      무정의로 남아 한도 개념의 권위 경계가 불완전하다(비고 수준, 핵심 규칙 미참조).
    issue_role: symptom
    judgment_state: observed
    impact_kind: governance_value
    timing_class: planned_follow_up
    closure_class: carry_forward
    closure_obligation: planned_later
    domain_axes: {}
    rationale: issue-001이 명명한 권위 미지정 설계 입장의 한도 지점 표면이다(finding-013의 세 지점 중 하나).
      note가 문서에 직접 존재하므로 observed이나 material failure condition이 경계 증거로 제시되지 않은
      low이므로 비물질 개선 항목으로 이월한다. 참조 개념 선언 또는 note 제거는 issue-026/031과 같은 note를 다루므로
      묶어서 후속 처리하는 것이 적절하다.
    related_surface_finding_ids:
      - finding-007
  - issue_id: issue-005
    problem_definition: 파생 가능한 비율(ltv)을 심사 시점 수동 입력으로 권위화하면서 담보 재평가 규칙과의 시간 정렬 비용을
      문서에 명시하지 않은 조용한 트레이드오프(axiology 고유의 좁은 프레임).
    issue_role: symptom
    judgment_state: observed
    impact_kind: governance_value
    timing_class: planned_follow_up
    closure_class: document_only
    closure_obligation: may_close_during_next_stage
    domain_axes: {}
    rationale: 결함의 의미 본체는 issue-023(high)이 보유하고 이 issue는 '트레이드오프 비용 미명시'라는 좁은 가치
      프레임만 담당한다(low 유지가 결의로 확정). ltv 파생 속성 재정의가 issue-020/023 수정 계열로 진행되면 함께
      소멸하므로 별도 수정 없이 기록 유지가 적절하고, 닫힘은 그 수정 계열에 동반될 수 있다.
    related_surface_finding_ids:
      - finding-008
  - issue_id: issue-006
    problem_definition: 리뷰 실행 경계 내에 canonical authority 파일(core-lexicon,
      principles)이 없어 조직 수준 원칙 인용이 필요한 판단들이 insufficient access로 남은 증거 경계 관찰 —
      대상 결함 주장이 아니다.
    issue_role: evidence_gap
    judgment_state: outside_boundary
    impact_kind: governance_value
    timing_class: defer_watch
    closure_class: needs_evidence
    closure_obligation: out_of_scope
    domain_axes: {}
    rationale: 대상 온톨로지의 결함이 아니라 리뷰 실행 경계의 증거 가용성 기록(info)이다. 필요한 증거가 경계 밖에 있으므로
      outside_boundary·needs_evidence이며, 해소는 대상 수정이 아니라 향후 리뷰 경계에 authority 파일을
      materialize하는 실행 준비 변경이므로 본 대상 기준 out_of_scope다.
    related_surface_finding_ids:
      - finding-009
  - issue_id: issue-007
    problem_definition: default/연체 하위 영역 전체 제외로 등급 스케일이 부실 인접 값(CCC, R5)을 포함함에도 부실
      구간의 등급·익스포저 분류에 공유 의미가 정의되지 않아, 두 시스템이 다른 수치를 산출해도 온톨로지로 판정할 수 없다.
    issue_role: symptom
    judgment_state: observed
    impact_kind: completeness
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: issue-003과 동일 결함의 coverage 측 표면으로 단일 클러스터·단일 high 심각도가 결의되었고, 정본 치유안은
      issue-003이 보유하므로 본 row는 그 결과 결손(부실 세그먼트 커버리지 부재)을 분류한다. notes[1]과 enum 값
      공간에서 직접 확인되는 observed 결손이며, 경계 개념 추가로 대상 내에서 함께 닫힌다.
    related_surface_finding_ids:
      - finding-010
  - issue_id: issue-008
    problem_definition: risk_grade 수동 조정이 규칙 산문으로만 허용되고 행위자·시각·근거를 기록할 일급 사건
      개념(GradeOverride)이 없어 조정이 흔적 없이 일어나며, 도출 규칙 위반과 정당한 조정을 구분할 수 없다.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: governance_value
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: classification_rules[0]의 조정 허용과 entities 목록의 증거 개념 부재가 문서에서 직접
      확인된다(root_confidence high). 이중 권위 문제(issue-017)와 구분되는 별도 뿌리로 유지가 결의되었고,
      우선순위 규칙이 추가되어도 감사 증거 부재는 잔존하므로 root_cause다. 등급 데이터의 출처 신뢰·감사 가능성이라는 거버넌스
      가치가 익스포저 단위로 무너지는 high이므로 대상 내 필수 닫힘이다.
    related_surface_finding_ids:
      - finding-012
  - issue_id: issue-009
    problem_definition: 통화 차원이 Limit에만 부분 도입되고
      Exposure.amount·ExposureAggregate.total_amount에는 없어,
      classification_rules[1]의 '통화가 다른 경우' 조건 자체를 문서 내부에서 판정할 수 없다.
    issue_role: enabler
    judgment_state: observed
    impact_kind: completeness
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: 관계 그래프상 finding-029를 enable하는 결손(rel-019)으로, 환산 권위 결함(issue-001/019)이
      작동하기 위한 더 깊은 전제를 제공하므로 enabler가 정확하다. 속성 부재는 문서에서 직접 관찰된다. medium 물질 결함으로
      통화 차원 일관 도입은 issue-019/030의 피연산자 형식화와 함께 다음 단계 진입 전 닫혀야 한다.
    related_surface_finding_ids:
      - finding-016
  - issue_id: issue-010
