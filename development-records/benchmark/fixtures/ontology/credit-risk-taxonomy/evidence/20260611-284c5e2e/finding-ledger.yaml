      추가가 매번 온톨로지 개정 + 전 소비 시스템 동시 배포를 요구하는 파괴적 변경이 된다.
    lens_rationale_summary: 여신 도메인에서 상품 유형(PF, 할인어음, 파생 거래상대방 익스포저)·세그먼트(공공,
      금융기관)·담보 유형(보증서, 동산, 보험) 추가는 통상적인 변경이다. 공유 권위 문서의 enum이 닫혀 있고 버전 호환 규약이
      없으면, 값 하나 추가가 리스크 엔진과 보고 시스템 양쪽의 동시 수정·배포를 강제하고, 한쪽만 먼저 반영되면 미지의 enum 값으로
      인한 파싱·분류 실패가 발생한다.
    proposed_action: "enum 확장 규약을 온톨로지에 명시한다: (1) 소비 시스템은 미지의 값을 거부 대신
      'other/unknown'으로 격리 처리, (2) 값 추가는 minor 버전, 값 제거·의미 변경은 major 버전, (3)
