      엔티티(RiskAppetite)의 비교라는 타입 오류이며, (c) compliance_status는 가역적·지연 갱신되는
      total_amount에 의존하는 저장된 판정 상태여서 허용된 후속 사건(일중 신규 여신)과 모순을 형성한다 — verdict:
      fail; conflict_pair: credit-risk-ontology.yaml:74 ↔
      credit-risk-ontology.yaml:74(intra) 및 :78 ↔ :70(inter);
      satisfiability_note: intra-claim(정의 자체의 순환·타입 오류) + inter-claim(판정 상태와 입력
      신선도의 시간 전개 충돌); modality_note: mixed — 판정 조건이 necessary invariant처럼 저장되나 그
      입력은 가역(possible) 상태임을 모델 스스로 인정."
    lens_rationale_summary: 순환 정의는 위반 여부의 진리값을 문서 내 어떤 claim으로도 도출 불가능하게 만들어, 리스크
      엔진과 보고서 시스템이 같은 정의에서 다른 판정을 내려도 문서가 중재하지 못한다. 타입 비형식화는 threshold가 어떤 양(통화,
      총액 vs 비율)과 비교되는지 미정으로 남긴다. 시간 전개 관점에서는 판정 상태(종결성 주장)가 가역 입력에 의존하는 본 lens의
      핵심 점검 항목에 해당한다 — 모델이 허용하는 후속 사건이 이미 기록된 compliant 상태와 모순을 만든다.
    proposed_action: "정의를 'compliance_status = (ExposureAggregate.total_amount as_of
      t) > threshold ? breached : compliant, 판정 기준 시점 t를 함께 기록'처럼 비순환·타입 명시 형태로
      재기술하고, compliance_status를 독립 저장값이 아닌 total_amount·threshold로부터의 도출값(파생
      속성)으로 선언하며, 입력 지연(:70)에 따른 판정 유효 구간을 명시한다."
    affected_purpose: 리스크 성향 한도 위반이라는 핵심 통제 개념의 판정 가능성 — 본 문서가 권위를 자임하는 판정 규칙(:1-3)
    failure_condition: "compliance_status를 조회하는 어떤 시점에서든: 순환 정의 때문에 값의 산출 근거를 문서로
