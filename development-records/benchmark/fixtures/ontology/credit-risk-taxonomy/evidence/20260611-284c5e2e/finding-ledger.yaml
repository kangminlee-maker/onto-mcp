      익스포저 금액으로 합산하거나 담보에 리스크 등급을 부여하는 잘못된 추론을 할 수 있다. 같은 문서 안에서 is_a와
      secured_by가 모순되므로 공유 개념 권위 문서로서 두 소비 시스템이 서로 다른 해석을 갖게 된다.
