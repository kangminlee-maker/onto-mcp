    claim: 세 개의 등급 스케일을 병존시키고 변환 권위를 각 소비 시스템과 외부 위키로 위임한 것은 이 문서가 선언한 '공유 개념 권위'
      목적에서 직접 이탈한다 (value_type=purpose, alignment_direction=misaligned).
    lens_rationale_summary: 문서의 선언된 목적은 리스크 엔진과 보고 시스템이 공유하는 개념 권위가 되는 것인데, 등급이라는 핵심
      개념의 동치 관계(변환)를 온톨로지가 소유하지 않으면 두 시스템은 같은 차주에 대해 서로 다른 등급 해석을 가질 수 있고, 권위는
      사실상 위키와 각 시스템 코드로 누수된다. '역사적 이유'는 기술된 사실일 뿐 목적 대비 정당화가 아니어서, 정당화 없이 수용된
      트레이드오프에 해당한다.
    proposed_action: 세 스케일 중 canonical 스케일 하나를 온톨로지가 지정하고, 나머지 두 스케일은 명시적 매핑 테이블(또는
      derivation rule)을 온톨로지 본문에 엔티티/관계로 수용한다. 위키 참조는 제거하거나 비권위적 참고로 강등한다.
    affected_purpose: "헤더 선언 목적: 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서"
    failure_condition: 두 소비 시스템이 동일 차주의 등급을 각자의 변환 규칙(위키 버전 차이 포함)으로 해석하는 모든 경우
    impact: 공유 개념 기준이라는 목적의 핵심 deliverable(등급 개념의 단일 의미)이 문서 밖에 존재하게 되어, 이 온톨로지를
      채택해도 시스템 간 등급 불일치를 막지 못한다
    evidence_refs:
