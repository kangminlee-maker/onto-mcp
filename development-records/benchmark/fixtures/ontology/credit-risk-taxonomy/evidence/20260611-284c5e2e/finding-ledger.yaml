      - credit-risk-ontology.yaml entities.Exposure.attributes.ltv.note
      - credit-risk-ontology.yaml entities.Collateral.attributes.appraised_value
      - credit-risk-ontology.yaml entities.Collateral.attributes.appraised_at
      - credit-risk-ontology.yaml classification_rules[2]
    severity: high
    domain_threshold_used: null
