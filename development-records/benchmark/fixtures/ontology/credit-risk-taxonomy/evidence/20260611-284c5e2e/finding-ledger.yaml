      failure_condition: 담보 재평가 또는 익스포저 금액 변동 이후에도 ltv가 심사 시점 입력값으로 남아 소비되는 경우
      impact: 이름이 '비율'을 약속하지만 실제로는 갱신되지 않는 과거 스냅샷이어서, 담보 충분성 판단과 보고 수치가 체계적으로 왜곡된다.
