      그러나 등급이라는 핵심 개념의 스케일 간 의미 대응을 소비 시스템별 자체 변환에 맡기면, 같은 차주가 엔진과 보고서에서 서로 다른
      등급 의미로 해석될 수 있고 그 불일치를 판정할 기준이 온톨로지 안에 없다. 매핑의 권위가 버전 관리되지 않는 위키에 있어 개념
      기준으로서의 외부 매핑 정확성을 검증할 수 없다.
