  - finding_id: finding-035
    lens_id: semantics
    source_ref: .onto/review/20260611-284c5e2e/round1/semantics.findings.yaml#semantics-candidate-004
    target: credit-risk-ontology.yaml > entities.Exposure.attributes.risk_grade +
      classification_rules[0]
    evidence_anchor: "credit-risk-ontology.yaml: classification_rules[0] '보고서 팀이 시장
      상황에 따라 수동 조정할 수 있다', risk_grade.note '보고서 팀이 사용'"
    claim: risk_grade라는 이름은 리스크 평가 결과를 의미하지만, 실제 규칙상 보고서 팀이 수동 조정 가능한 보고용 값이어서 이름과
      실제 의미·권위가 불일치한다.
    lens_rationale_summary: 이름이 risk_grade인 필드를 리스크 엔진이 자기 산출값과 동일 개념으로 신뢰하면, 보고서 팀의
      수동 조정값이 리스크 판단에 역류하거나, 반대로 보고서가 엔진 등급과 다른 값을 같은 이름으로 공표하게 된다. 조정 사실·사유·시점이
      모델에 없어 두 의미(엔진 도출값 vs 조정된 보고값)가 한 필드명 아래 동음이의어처럼 섞인다.
    proposed_action: "엔진 도출 등급과 조정 가능한 보고 등급을 개념적으로 분리하거나(예: derived_risk_grade vs
      reported_risk_grade), 단일 필드를 유지하려면 조정 여부·사유·원천 등급을 함께 보존하는 속성으로 의미를 명시한다."
