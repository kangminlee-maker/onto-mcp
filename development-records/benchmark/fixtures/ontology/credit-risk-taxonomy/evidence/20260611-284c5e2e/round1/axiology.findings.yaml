    why: 문서의 선언된 목적은 리스크 엔진과 보고 시스템이 공유하는 개념 권위가 되는 것인데, 등급이라는 핵심 개념의 동치 관계(변환)를
      온톨로지가 소유하지 않으면 두 시스템은 같은 차주에 대해 서로 다른 등급 해석을 가질 수 있고, 권위는 사실상 위키와 각 시스템
      코드로 누수된다. '역사적 이유'는 기술된 사실일 뿐 목적 대비 정당화가 아니어서, 정당화 없이 수용된 트레이드오프에 해당한다.
    how_to_fix: 세 스케일 중 canonical 스케일 하나를 온톨로지가 지정하고, 나머지 두 스케일은 명시적 매핑 테이블(또는
      derivation rule)을 온톨로지 본문에 엔티티/관계로 수용한다. 위키 참조는 제거하거나 비권위적 참고로 강등한다.
    upstream_evidence_required: true
    severity_hint: high
    materiality_basis:
