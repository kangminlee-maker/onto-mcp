  - candidate_id: axiology-candidate-002
    target: credit-risk-ontology.yaml — classification_rules[0] + Exposure.risk_grade
    evidence_anchor: 'classification_rules[0]: "Exposure.risk_grade는
      RiskRating.grade에서 도출하되, 보고서 팀이 시장 상황에 따라 수동 조정할 수 있다";
      value_authority_anchor: {source: credit-risk-ontology.yaml, anchor: header
      comment lines 1-3, excerpt: "리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향한다"} +
      {source: review-value-alignment-criteria.yaml, anchor:
      user-request-intent, excerpt: "권위 관점의 개념 결함과 운영 위험을 중심으로"}'
    claim: risk_grade에 대해 엔진 도출과 보고팀 수동 조정이라는 이중 권위를 허용한 것은, 조정 조건·기록·우선순위 없이 수용된
      숨겨진 트레이드오프이며 공유 기준 목적을 훼손한다 (value_type=tradeoff,
      alignment_direction=misaligned).
    what: risk_grade의 권위가 '엔진 도출'과 '보고팀 수동 조정' 둘로 분기되는데, 조정의 발동 조건('시장 상황'), 기록 의무,
      원본 등급과의 관계, 충돌 시 우선순위가 전혀 정의되지 않았다.
    why: 리스크 엔진과 보고 시스템이 공유할 기준을 만든다는 목적 하에서, 두 소비자 중 한쪽(보고팀)에게 무조건적 override 권한을 주면
      동일 익스포저의 등급이 시스템별로 합법적으로 달라진다. 이는 보고 편의라는 국소 최적화가 '공유된 단일 의미'라는 전체 목적을 직접
      훼손하는 패턴이고, 트레이드오프의 정당화와 한계가 명시되지 않았다.
    how_to_fix: "수동 조정을 별도 개념(예: GradeOverride — 사유, 조정자, 유효기간, 원본 grade 보존)으로 분리하고,
      도출값과 조정값의 우선순위 및 두 소비 시스템이 어느 값을 읽는지를 규칙으로 명시한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 동일 익스포저에 대해 같은 등급 의미를 공유한다는 선언 목적
      failure_condition: 보고팀이 수동 조정을 수행한 익스포저에 대해 엔진 경로와 보고 경로가 서로 다른 risk_grade를 사용하는 경우
      impact: 등급이라는 핵심 분류 개념의 단일 진실 위치가 사라져, 이 온톨로지 기반의 리스크 보고와 엔진 산출이 감사 시 상호 검증
        불가능해진다
      evidence_refs:
        - credit-risk-ontology.yaml classification_rules[0]
        - credit-risk-ontology.yaml Exposure.risk_grade note
    causal_path:
      root_cause_candidate: 보고 유연성 요구를 개념 모델 수준에서 무제한 override 권한으로 수용하면서, 도출 권위와 조정
        권위의 관계를 정의하지 않은 규칙 설계
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: classification_rules[0]이 동일 속성에 대해 '엔진 도출'과 '수동 조정' 두 권위 경로를 동시에 허용한다
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml classification_rules[0]
        - cause_id: axiology-candidate-002.cause-002
          claim: 조정의 조건·기록·우선순위가 부재하여 두 경로의 충돌이 해소 불가능한 상태로 남는다
          relation_to_previous: symptom_of
          evidence_refs:
            - credit-risk-ontology.yaml classification_rules[0]
            - credit-risk-ontology.yaml Exposure.risk_grade note
        - cause_id: axiology-candidate-002.cause-003
          claim: 보고 편의라는 국소 요구를 정당화 절차 없이 개념 규칙에 직접 삽입한 결정이 공유 권위 목적과의 충돌을 만든다
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml header comment
            - credit-risk-ontology.yaml classification_rules[0]
      unresolved_beyond_evidence: 수동 조정의 실제 빈도·통제 절차는 경계 밖 운영 증거가 필요하다
  - candidate_id: axiology-candidate-003
    target: credit-risk-ontology.yaml — classification_rules[1] (Limit 소진율 환율 규칙)
    evidence_anchor: 'classification_rules[1]: "통화가 다른 경우 환산은 각 시스템의 당일 환율 테이블을
      사용한다"; value_authority_anchor: {source: credit-risk-ontology.yaml, anchor:
      header comment lines 1-3, excerpt: "리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향한다"}
      + {source: review-value-alignment-criteria.yaml, anchor:
      user-request-intent, excerpt: "권위...관점의 개념 결함과 운영 위험"}'
    claim: 한도 소진율 환산 권위를 '각 시스템의 당일 환율 테이블'로 위임한 것은, 한도 위반 판정이라는 가치-결정적 계산을 시스템별로
      갈라지게 허용하는 정당화 없는 트레이드오프다 (value_type=tradeoff,
      alignment_direction=misaligned).
    what: 동일한 소진율 공식이 시스템마다 다른 환율 소스로 계산되도록 규칙 자체가 허용하고 있어, 같은 차주의 한도 소진율이 리스크 엔진과
      보고 시스템에서 다른 값이 될 수 있다.
    why: 한도 소진율은 한도 위반(여신 중단/승인 거절) 판단의 입력이므로 가치 충돌이 실제 의사결정 차이로 직결된다. 공유 개념 기준을
      표방하는 문서가 계산 규칙의 결정적 입력(환율 소스)을 의도적으로 비단일화한 것은 국소 편의(각 시스템 기존 테이블 재사용)가 전체
      목적(판정의 일관성)을 훼손하는 사례이며, 그 트레이드오프가 명시적으로 정당화되지 않았다.
    how_to_fix: 환산에 사용할 canonical 환율 소스(또는 기준 시점·기준 테이블)를 온톨로지가 지정하고, 시스템별 테이블 사용은
      허용 오차와 함께 예외로만 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 두 시스템이 동일한 한도 소진율·위반 판정 기준을 공유한다는 선언 목적
      failure_condition: 다통화 익스포저에서 두 시스템의 당일 환율 테이블이 다른 값을 가질 때 (상시 발생 가능)
      impact: 한쪽 시스템은 한도 위반, 다른 쪽은 준수로 판정하는 모순이 규칙상 합법이 되어, 한도 통제라는 운영 목적의 신뢰가 깨진다
      evidence_refs:
        - credit-risk-ontology.yaml classification_rules[1]
    causal_path:
      root_cause_candidate: 각 시스템의 기존 환율 인프라를 그대로 두려는 통합 비용 회피 결정을 공유 규칙 본문에 그대로 성문화함
      root_cause_step_id: axiology-candidate-003.cause-003
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: 소진율 규칙이 환산 소스를 '각 시스템의 당일 환율 테이블'로 명시해 시스템별 상이한 결과를 규칙 수준에서 허용한다
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml classification_rules[1]
        - cause_id: axiology-candidate-003.cause-002
          claim: 환율 소스 비단일화는 한도 위반 판정의 시스템 간 불일치를 가능하게 한다
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml classification_rules[1]
            - credit-risk-ontology.yaml RiskAppetite.compliance_status
        - cause_id: axiology-candidate-003.cause-003
          claim: 통합 비용 회피라는 국소 최적화가 정당화 서술 없이 공유 기준 문서에 수용되었다
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml header comment
            - credit-risk-ontology.yaml classification_rules[1]
      unresolved_beyond_evidence: 두 시스템의 환율 테이블이 실제로 얼마나 자주 다른지는 경계 밖 운영 데이터가 필요하다
  - candidate_id: axiology-candidate-004
    target: credit-risk-ontology.yaml — ExposureAggregate.total_amount note +
      RiskAppetite 정의
    evidence_anchor: 'ExposureAggregate.total_amount note: "월말 배치로 계산해 저장. 일중 신규 여신은
      다음 배치까지 미반영"; RiskAppetite.definition: "ExposureAggregate가 RiskAppetite를
      초과하면 RiskAppetite 위반"; value_authority_anchor: {source:
      review-value-alignment-criteria.yaml, anchor: user-request-intent,
      excerpt: "시간성 관점의 개념 결함과 운영 위험을 중심으로"} + {source:
      credit-risk-ontology.yaml, anchor: header comment lines 1-3, excerpt:
      "여신(대출) 리스크 관리의 개념 모델"}'
    claim: 리스크 성향 위반 판정을 월말 배치 기반 집계 위에 정의한 것은, 배치 단순성이라는 국소 최적화가 리스크 통제라는 시스템 목적을
      훼손하는 시간성 트레이드오프다 (value_type=tradeoff, alignment_direction=misaligned).
    what: RiskAppetite 위반은 ExposureAggregate 초과로 정의되는데, ExposureAggregate는 월말 배치값이라
      일중·월중 신규 여신이 반영되지 않는다. 따라서 실제 총익스포저가 appetite를 초과해도 다음 배치까지
      compliance_status는 compliant로 남을 수 있다.
    why: 리스크 성향 한도는 리스크 관리 개념 모델의 존재 이유에 해당하는 통제 장치인데, 그 판정 기준을 알려진 지연을 가진 파생값에 묶으면
      통제가 사후 보고로 격하된다. 이 지연은 note로 인지되어 있으면서도 위반 정의와의 충돌이 다뤄지지 않아, 당연시된 전제(배치
      집계로 충분)가 목적과 정렬되지 않은 채 수용된 사례다.
    how_to_fix: "RiskAppetite 위반 정의에 판정 시점 의미(as_of 기준 사후 점검인지, 실시간 통제인지)를 명시하고, 실시간
      통제가 목적이면 집계 갱신 주기를 분리된 개념(예: 일중 잠정 집계)으로 도입한다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
