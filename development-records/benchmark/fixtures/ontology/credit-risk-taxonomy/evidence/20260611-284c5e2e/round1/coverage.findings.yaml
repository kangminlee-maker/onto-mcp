findings:
  - candidate_id: coverage-candidate-001
    target: credit-risk-ontology.yaml notes (연체/부실 범위 제외 선언)
    evidence_anchor: 'credit-risk-ontology.yaml notes: "연체/부실(default) 상태는 별도
      시스템(연체관리)에서 다루므로 이 온톨로지의 범위 밖이다."'
    claim: 여신 리스크 분류 온톨로지에서 연체/부실(default) 하위 영역이 통째로 제외되어, 리스크 등급 개념 공간이 정상 여신 구간만
      커버한다.
    what: "엔터티와 등급 체계(internal_rating, RiskRating.grade R1~R5, Exposure.risk_grade
      AAA~CCC)가 모두 정상 상태의 등급만 표현하고, 연체·부실·채무불이행 상태, 부실 전이, 회수/상각 같은 신용 리스크의 핵심
      하위 영역이 어떤 개념으로도 표현되지 않는다. 범위 밖 선언은 있으나 외부 시스템의 default 상태와 이 온톨로지의 등급·익스포저
      개념을 잇는 경계 개념(예: default_flag, 부실 전이 사건)이 전무하다."
    why: 이 문서는 '리스크 엔진과 보고서 시스템이 공유하는 개념 권위'를 지향한다고 선언한다. 신용 리스크 보고와 등급 산출은 부실 여부에
      의해 의미가 갈리는데(부실 차주의 R등급/AAA등급은 무의미하거나 다른 의미), 부실 개념이 없으면 두 시스템이 부실 익스포저를 각자
      다른 방식으로 처리하게 되어 공유 기준이라는 목적이 핵심 구간에서 실패한다.
    how_to_fix: "범위 밖 선언을 유지하더라도 경계 개념을 추가한다: Borrower 또는 Exposure에 default/연체 상태
      참조(외부 연체관리 시스템을 권위로 명시)와 부실 시 각 등급 필드의 의미 규칙(동결/무효/별도 등급)을 정의한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 신용 리스크 개념 권위 (파일 헤더 주석)
      failure_condition: 부실 또는 연체 상태에 진입한 차주/익스포저를 두 소비 시스템이 분류·보고해야 하는 모든 경우
      impact: 부실 구간에서 등급·익스포저 분류의 공유 의미가 정의되지 않아 엔진과 보고서가 서로 다른 수치를 산출해도 온톨로지로는 어느 쪽도
        틀렸다고 말할 수 없다
      evidence_refs:
        - credit-risk-ontology.yaml notes[1] (default 범위 밖 선언)
        - credit-risk-ontology.yaml 헤더 주석 (공유 개념 권위 지향)
        - Exposure.risk_grade / RiskRating.grade enum (부실 상태 값 부재)
    causal_path:
      root_cause_candidate: 연체/부실을 '별도 시스템 소관'으로 선언하면서, 시스템 분리(운영 책임)와 개념 분리(의미 정의)를
        동일시해 경계 개념 설계를 생략함
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: 등급 enum과 엔터티 어디에도 부실/연체 상태나 그 참조가 없다
          relation_to_previous: null
          evidence_refs:
            - Exposure.risk_grade values
            - RiskRating.grade values
            - Borrower attributes
        - cause_id: coverage-candidate-001.cause-002
          claim: notes에서 default를 범위 밖으로 선언하며 대체 경계 개념을 제공하지 않았다
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml notes[1]
        - cause_id: coverage-candidate-001.cause-003
          claim: 운영 시스템이 분리되어 있다는 사실로부터 개념도 정의할 필요가 없다고 판단한 것이 출발 원인
          relation_to_previous: causes
          evidence_refs:
            - notes[1]의 '별도 시스템에서 다루므로' 논리 구조
      unresolved_beyond_evidence: 연체관리 시스템 측에 이미 양 시스템이 합의한 부실 개념 정의가 존재하는지는 경계 내 증거로 확인 불가
  - candidate_id: coverage-candidate-002
    target: RiskRating, Borrower.internal_rating, Exposure.risk_grade, Exposure.ltv
      (시점 의존 값 전반)
    evidence_anchor: RiskRating attributes (rating_id, borrower_ref, grade, score만
      존재); Exposure.ltv note "심사 시점에 심사역이 입력한다"
    claim: 시점 의존 값(등급, 점수, LTV)에 유효기간·이력 차원이 전혀 없어 과거 시점의 리스크 상태를 재구성할 수 없다.
    what: RiskRating에는 산출 시각·유효기간·대체(supersede) 개념이 없고, internal_rating과 risk_grade는
      단일 현재값 속성이며, ltv는 심사 시점 입력값으로 고정된 뒤 갱신·이력 개념이 없다. 온톨로지 전체에서 시간 속성은
      Collateral.appraised_at과 ExposureAggregate.as_of 두 곳뿐이다.
    why: 리스크 보고는 본질적으로 '특정 기준일의 등급/익스포저' 진술이다. 등급에 as-of 차원이 없으면 월말 보고 후 등급이 바뀌었을 때
      보고서 재현이 불가능하고, 엔진 재산출 값과 보고서 저장 값이 어긋나도 어느 시점 값이 맞는지 판정할 개념 기반이 없다. 등급 추이
      분석·전이행렬 같은 표준 리스크 산출물도 표현 불가능하다.
    how_to_fix: RiskRating에 effective_from/effective_to(또는 rated_at +
      superseded_by)를 추가하고, internal_rating·risk_grade·ltv를 단일 속성 대신 이력 보유 개념(또는
      최신값 projection임을 명시)으로 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 보고 시스템이 의존할 수 있는 기준일 기반 리스크 상태 정의
      failure_condition: 등급·LTV가 변경된 이후 과거 기준일 보고를 재구성하거나 감사 대응해야 하는 모든 경우
      impact: 과거 시점 재구성이 개념적으로 불가능해 보고 재현성과 엔진-보고서 간 수치 대사가 성립하지 않는다
      evidence_refs:
        - RiskRating attributes (시간 속성 부재)
        - Borrower.internal_rating (단일 문자열)
        - Exposure.ltv note
        - ExposureAggregate.as_of (집계에만 시점 존재)
    causal_path:
      root_cause_candidate: 온톨로지가 엔터티를 '현재 상태 스냅샷'으로만 모델링하고 시점 의존 값과 시점 독립 값을 구분하는 설계 차원을 도입하지 않음
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: 등급·점수·LTV가 유효기간 없는 단일 현재값으로 정의되어 있다
          relation_to_previous: null
          evidence_refs:
            - RiskRating attributes
            - Exposure.ltv
            - Borrower.internal_rating
        - cause_id: coverage-candidate-002.cause-002
          claim: 시간 차원이 집계(as_of)와 담보평가(appraised_at)에만 산발적으로 존재하고 등급 계열에는 누락되었다
          relation_to_previous: symptom_of
          evidence_refs:
            - ExposureAggregate.as_of
            - Collateral.appraised_at
        - cause_id: coverage-candidate-002.cause-003
          claim: 시점 의존성을 모델링 차원으로 다루는 전역 규약이 없는 것이 출발 원인
          relation_to_previous: causes
          evidence_refs:
            - 온톨로지 전체에 temporal validity 규약·패턴 부재
      unresolved_beyond_evidence: 소비 시스템들이 자체 DB에서 이력을 보관하는지는 경계 내 증거로 확인 불가하나, 그 경우에도 공유 개념 기준에는 이력 의미가 없다
  - candidate_id: coverage-candidate-003
    target: classification_rules[0] (risk_grade 수동 조정)
    evidence_anchor: 'classification_rules: "Exposure.risk_grade는 RiskRating.grade에서
      도출하되, 보고서 팀이 시장 상황에 따라 수동 조정할 수 있다."'
    claim: 수동 조정(override)이라는 통제 필요 행위가 허용되어 있으나 행위자·시각·근거를 추적할 증거 개념이 없다.
    what: risk_grade 수동 조정을 규칙으로 허용하면서, 조정 사건을 표현할 엔터티(조정자, 조정 시각, 사유, 원래 도출값)가
      온톨로지에 없다. 조정된 값과 엔진 도출값을 구분할 표지조차 없어, risk_grade만 보고는 도출값인지 수동값인지 알 수 없다.
    why: 등급 수동 조정은 신용 리스크 통제에서 대표적인 감사 대상 행위다. 증거 개념이 없으면 조정이 데이터 위에서 흔적 없이 일어나고,
      엔진(도출 권위)과 보고서 팀(조정 권위)의 권위 충돌이 발생했을 때 어떤 값이 왜 우세한지 재구성할 수 없다. 공유 개념 기준으로서
      도출 규칙의 신뢰가 무너진다.
    how_to_fix: GradeOverride(또는 RatingAdjustment) 개념을 추가해 actor, adjusted_at,
      rationale, original_grade, adjusted_grade를 정의하고, risk_grade에
      derived/overridden 출처 표지를 둔다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: risk_grade 도출 규칙(classification_rules[0])의 신뢰성과 감사 가능성
      failure_condition: 보고서 팀이 수동 조정을 수행한 모든 익스포저에 대해 감사·검증·원인 추적이 필요한 경우
      impact: 조정 행위가 추적 불가능해 도출 규칙 위반과 정당한 조정을 구분할 수 없고, 등급 데이터의 출처 신뢰가 익스포저 단위로 불확정해진다
      evidence_refs:
        - classification_rules[0]
        - entities 목록 (조정/override 관련 개념 부재)
    causal_path:
      root_cause_candidate: 수동 조정을 규칙 문장(프로세스 서술)으로만 도입하고 그 행위를 일급 개념(사건 엔터티)으로 승격하지 않음
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: risk_grade 값만으로는 도출값과 수동 조정값을 구분할 수 없다
          relation_to_previous: null
          evidence_refs:
            - Exposure.risk_grade 정의 (출처 표지 부재)
        - cause_id: coverage-candidate-003.cause-002
          claim: 조정 행위가 규칙 텍스트로만 존재하고 대응 엔터티가 없어 행위 기록 장소가 개념적으로 없다
          relation_to_previous: causes
          evidence_refs:
            - classification_rules[0]
            - entities 목록
        - cause_id: coverage-candidate-003.cause-003
          claim: 통제 행위를 개념화하지 않고 규칙 문장에 둔 설계 선택이 출발 원인
          relation_to_previous: causes
          evidence_refs:
            - classification_rules 섹션의 서술형 구조
      unresolved_beyond_evidence: 보고 시스템이 자체적으로 조정 로그를 남기는지는 경계 밖이나, 공유 개념 기준에는 그 의무가 표현되어 있지 않다
  - candidate_id: coverage-candidate-004
    target: Limit.approved_amount, classification_rules[1] (환율), notes[0] (3중 등급 스케일)
    evidence_anchor: 'Limit.approved_amount note: "영업점 CRM의 available_limit과 합산 관리";
      classification_rules[1]: "환산은 각 시스템의 당일 환율 테이블을 사용"; notes[0]: "변환은 각 소비
      시스템이 수행한다"'
    claim: 복수 시스템에 걸쳐 병행 관리된다고 서술된 값(한도, 환율, 등급 매핑)에 단일 원본(권위) 지정이 일관되게 부재하다.
    what: "세 곳에서 병행 관리가 명시되지만 권위 지정이 없다: (1) 한도가 승인 시스템과 영업점 CRM에 걸쳐 '합산 관리'되는데 어느
      쪽이 원본인지 미지정, (2) 한도 소진율 환산이 '각 시스템의 당일 환율 테이블'을 사용해 시스템마다 다른 환율로 같은 소진율을
      계산, (3) 3개 등급 스케일 간 변환을 '각 소비 시스템이 수행'하고 매핑 권위는 온톨로지 밖 위키에 있다."
    why: 공유 개념 권위 문서의 존재 이유가 '같은 값에 대한 단일 의미와 단일 원본'인데, 정작 시스템 간 분기가 실제로 발생하는 세 지점
      모두에서 권위를 소비자에게 위임한다. 같은 차주의 한도 소진율이 시스템마다 다른 값으로 산출되어도 정합성 위반으로 판정할 기준이
      없으며, 이는 한도 통제라는 운영 목적의 직접 실패 경로다.
    how_to_fix: "각 병행 값에 권위를 명시한다: approved_amount의 원본 시스템 지정과 available_limit의 파생
      관계 정의, 한도 소진율 계산용 단일 환율 출처 지정, 등급 매핑 테이블을 위키 참조 대신 온톨로지 내
      개념(RatingScaleMapping)으로 편입."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 한도 통제(classification_rules[1] 소진율)와 등급 일관성이라는 공유 기준 목적
      failure_condition: 다통화 익스포저의 소진율 계산, 또는 CRM과 승인 시스템의 한도가 불일치하는 모든 경우
      impact: 두 시스템이 같은 차주에 대해 다른 소진율·다른 등급을 산출해도 어느 값이 권위인지 판정 불가하여, 한도 초과가 시스템 선택에
        따라 보였다 안 보였다 한다
      evidence_refs:
        - Limit.approved_amount note
        - classification_rules[1]
        - notes[0]
    causal_path:
      root_cause_candidate: 온톨로지가 개념 정의는 중앙화했지만 값의 원본 권위 지정을 설계 차원으로 포함하지 않아, 권위가 암묵적으로 각 소비 시스템에 분산됨
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: 한도·환율·등급매핑 세 지점에서 시스템별로 다른 값이 산출될 수 있다
          relation_to_previous: null
          evidence_refs:
            - Limit.approved_amount note
            - classification_rules[1]
            - notes[0]
        - cause_id: coverage-candidate-004.cause-002
          claim: 세 지점 모두 '각 시스템이 관리/수행'이라는 동일 패턴으로 권위를 위임한다
          relation_to_previous: symptom_of
          evidence_refs:
            - classification_rules[1]의 '각 시스템의' 표현
            - notes[0]의 '각 소비 시스템이 수행'
        - cause_id: coverage-candidate-004.cause-003
          claim: 단일 원본 지정을 온톨로지의 책임으로 보지 않은 설계 입장이 출발 원인
          relation_to_previous: causes
          evidence_refs:
            - 온톨로지 전체에 authority/source-of-truth 지정 필드 부재
      unresolved_beyond_evidence: 실제 운영에서 시스템 간 대사 절차가 존재하는지는 경계 내 증거로 확인 불가
  - candidate_id: coverage-candidate-005
    target: Exposure, Limit, Collateral (lifecycle 차원)
    evidence_anchor: Exposure/Limit/Collateral attributes (상태·기간·종료 개념 부재);
