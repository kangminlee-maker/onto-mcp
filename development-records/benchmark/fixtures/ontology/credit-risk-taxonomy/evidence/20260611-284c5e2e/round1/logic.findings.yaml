    what: "Collateral은 정의상 '익스포저를 담보하는 자산'(담보물)인데 is_a: Exposure로 선언되어 모든 Collateral
      인스턴스가 동시에 '차주에 대한 신용 익스포저'여야 한다. 또한 relation :82(Exposure secured_by
