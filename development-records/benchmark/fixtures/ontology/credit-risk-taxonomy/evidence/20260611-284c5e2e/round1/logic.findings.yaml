  - candidate_id: logic-candidate-002
    target: credit-risk-ontology.yaml classification_rules[0] (risk_grade 도출 규칙)
    evidence_anchor: credit-risk-ontology.yaml:88, 28, 50
    claim: "'Exposure.risk_grade는 RiskRating.grade에서 도출' 규칙은 (a) 두 enum 값 공간(R1~R5
      vs AAA~CCC)을 잇는 매핑이 문서 내에 없어 문서 내 claim만으로 만족 불가능하고, (b) 도출 의무와 수동 조정 허용이
      우선순위 규칙 없이 공존하여 조정 발생 시점부터 도출 규칙과 모순된다 — verdict: fail; conflict_pair:
      credit-risk-ontology.yaml:88 ↔ credit-risk-ontology.yaml:28+50;
      satisfiability_note: inter-claim(도출 규칙이 서로 disjoint한 두 enum 정의를 연결);
      modality_note: mixed — obligatory(도출하되) modality와 possible(수동 조정할 수 있다)
      modality가 충돌 해소 규칙 없이 동일 속성값에 대해 선언됨."
    what: 규칙 :88은 risk_grade를 RiskRating.grade에서 '도출'하라고 선언하지만, RiskRating.grade의
      치역은 {R1..R5}(:50)이고 Exposure.risk_grade의 치역은 {AAA..CCC}(:28)로 교집합이 없으며 변환
      함수는 문서 밖('리스크팀 위키' :51, '각 소비 시스템이 수행' :93)에 위임되어 있다. 동시에 같은 규칙이 보고서 팀의 수동
      조정을 허용하는데, 조정된 값은 정의상 도출값과 다르므로 조정 시점 이후 도출 규칙은 위반 상태가 되고, 어느 값이 권위인지 판정할
      우선순위·기록 규칙이 없다.
    why: "형식적으로 'risk_grade = f(grade)'라는 함수적 제약과 'risk_grade는 f(grade)와 다를 수 있다'(수동
      조정)는 허용이 동일 속성에 무조건적으로 공존하면, 조정이 1회라도 발생한 상태 전개 경로에서 제약 집합은 만족 불가능하다. 조건부
      우선순위('조정 시 조정값이 우선하며 사유를 기록한다' 등)가 명시되어야 양립 가능해진다. review_goal의 precedence
      항목에 직접 해당한다. 또한 f 자체가 문서 내에 부재하여 규칙 :88은 본 문서의 claim만으로는 평가 불가능한 외부 의존
      제약이다. boundary_handoff_note: 3개 등급 스케일 병존의 명명·의미 혼란은 semantics lens 범위이나,
      모순(도출 의무 vs 조정 허용의 무우선순위 공존)은 스케일 의미가 명확해져도 잔존하므로 logic primary."
    how_to_fix: "규칙을 조건부 우선순위 형태로 재기술한다: (1) 기본값은 합의된 매핑 함수(매핑 테이블을 본 문서나 버전 고정 부속
      문서로 편입)로 도출, (2) 수동 조정 시 조정값이 우선하되 override 플래그·사유·조정자를 기록, (3) 재도출 시
      override 유지/소멸 규칙 명시."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진(RiskRating 산출)과 보고서 시스템(risk_grade 사용)이 같은 등급 개념 기준을
        공유한다는 문서 목적(:1-3) 및 review_goal의 precedence
      failure_condition: 보고서 팀이 risk_grade를 수동 조정한 뒤 리스크 엔진이 RiskRating을 갱신하면, 도출 규칙과
        조정값 중 어느 쪽이 유효한지 문서가 답하지 못한다
      impact: 두 시스템이 동일 익스포저에 서로 다른 등급을 권위로 주장할 수 있고, 매핑이 외부 위키에 있어 문서만으로는 정합 검증이 불가능하다
      evidence_refs:
        - credit-risk-ontology.yaml:88
        - credit-risk-ontology.yaml:28
        - credit-risk-ontology.yaml:50
        - credit-risk-ontology.yaml:51
        - credit-risk-ontology.yaml:93
    causal_path:
      root_cause_candidate: 도출(obligatory)과 수동 조정(possible)이라는 상이한 양상의 제약을 우선순위·기록 규칙
        없이 한 문장에 결합하고, 도출 함수(스케일 매핑)를 문서 권위 밖에 둔 규칙 설계(:88)
      root_cause_step_id: logic-candidate-002.cause-003
      steps:
        - cause_id: logic-candidate-002.cause-001
          claim: risk_grade에 대해 도출 규칙과 조정 허용이 동시에 선언되어 있으나 충돌 해소 규칙이 없다
