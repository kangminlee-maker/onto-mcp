    문서 부재, session_domain=none).
  - LTV(담보인정비율)는 담보 가치를 분모 요소로 갖는 파생 비율이라는 일반 정의를 전제했다.
  - 등급 스케일 R1~R5와 AAA~CCC 사이에 표준 변환이 존재하지 않으며 기관별 매핑 테이블이 필요하다는 일반 관행을 전제했다.
