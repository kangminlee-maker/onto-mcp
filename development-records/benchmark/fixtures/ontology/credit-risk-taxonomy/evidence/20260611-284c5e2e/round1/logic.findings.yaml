          evidence_refs:
            - credit-risk-ontology.yaml:88
        - cause_id: logic-candidate-002.cause-002
          claim: 수동 조정이 발생한 상태에서는 'risk_grade는 grade에서 도출된다'는 제약이 위반되어 제약 집합이 상태 전개 경로상 만족
            불가능해진다
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml:88
        - cause_id: logic-candidate-002.cause-003
          claim: 도출의 치역·정의역이 disjoint enum(R1~R5 vs AAA~CCC)이고 매핑이 문서 외부에 있어, 문서 내
            claim만으로는 도출 규칙의 만족 여부 자체를 판정할 수 없다
          relation_to_previous: enables
          evidence_refs:
            - credit-risk-ontology.yaml:28
            - credit-risk-ontology.yaml:50
            - credit-risk-ontology.yaml:51
      unresolved_beyond_evidence: 리스크팀 위키의 매핑 테이블 내용은 boundary 밖이므로, 매핑 자체의 일관성(전사 함수
        여부, 충돌 여부)은 본 검토에서 판정 불가.
  - candidate_id: logic-candidate-003
    target: credit-risk-ontology.yaml entities.ExposureAggregate (definition vs
      total_amount note)
    evidence_anchor: credit-risk-ontology.yaml:65, 70
    claim: "ExposureAggregate의 정의('모든 Exposure.amount의 합')와 total_amount note('월말 배치
      계산, 일중 신규 여신 미반영')는 모델이 허용하는 사건(일중 신규 여신 발생) 경로에서 동시 만족 불가능하다 — verdict:
      fail; conflict_pair: credit-risk-ontology.yaml:65 ↔
      credit-risk-ontology.yaml:70; satisfiability_note: intra-claim(동일 엔티티 내 정의
      vs 운영 주석); modality_note: necessary(정의의 보편 양화 '모든')를 운영 주석이 부정하는 양상 구분 오류
      — 정의는 필연 invariant로, 주석은 정기 위반을 허용하는 가능 양상으로 기술됨."
    what: 정의는 total_amount가 '모든 Exposure.amount의 합'이라고 보편 양화로 선언하지만, 같은 엔티티의 note는
      일중 신규 Exposure가 다음 배치까지 미포함된다고 명시한다. 신규 여신은 모델이 명시적으로 허용하는 사건이므로, 그 사건이
      발생한 순간부터 다음 월말 배치까지 정의는 항상 거짓이다.
    why: 스냅숏 시점이 아니라 상태 전개 경로 위에서 만족 가능성을 보면, '모든 합' invariant와 '미반영 허용'은 신규 여신 1건
      발생만으로 모순을 형성한다. as_of 속성(:71)이 존재하므로 정의를 'as_of 시점 기준 합'으로 한정하면 모순이 해소되는데
      현재 정의는 무시점 보편 진술이다. 이 모순은 RiskAppetite 위반 판정(:74)이 total_amount에 의존하므로 단순
      표기 문제가 아니라 판정 결과의 진리값에 영향을 준다.
    how_to_fix: 정의를 'as_of 시점 기준, 해당 시점까지 반영된 모든 Exposure.amount의 합(스냅숏)'으로 한정하고,
      실시간 합계가 필요한 소비처(한도 소진율, RiskAppetite 판정)가 이 스냅숏을 써도 되는지의 신선도 계약(staleness
      contract)을 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 차주 단위 총익스포저라는 공유 집계 개념의 정의 정확성과, 이를 입력으로 쓰는 한도
        소진율(:89)·RiskAppetite 위반 판정(:74)의 신뢰성
      failure_condition: 월중 신규 여신 실행 직후부터 다음 월말 배치 전까지의 모든 시점 — 정의를 신뢰한 소비 시스템은 실제보다
        작은 총익스포저로 한도·성향 판정을 수행한다
      impact: 한도 소진율과 RiskAppetite compliance가 체계적으로 과소평가되는 기간이 매월 반복되며, 정의만 읽은 시스템과
        note까지 읽은 시스템의 해석이 갈린다
      evidence_refs:
        - credit-risk-ontology.yaml:65
        - credit-risk-ontology.yaml:70
        - credit-risk-ontology.yaml:89
        - credit-risk-ontology.yaml:74
    causal_path:
      root_cause_candidate: 집계 개념을 시점 한정 없는 보편 invariant로 정의하면서 산출 주기는 월배치로 둔 정의-구현 양상
        불일치(:65 vs :70)
      root_cause_step_id: logic-candidate-003.cause-003
      steps:
        - cause_id: logic-candidate-003.cause-001
          claim: 정의(:65)는 시점 무관 보편 합을 선언하고 note(:70)는 일중 미반영을 허용한다
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml:65
            - credit-risk-ontology.yaml:70
        - cause_id: logic-candidate-003.cause-002
          claim: 모델이 허용하는 신규 여신 사건이 발생하면 다음 배치까지 정의가 거짓인 구간이 필연적으로 생긴다
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml:70
        - cause_id: logic-candidate-003.cause-003
          claim: 이 구간 동안 total_amount를 입력으로 쓰는 한도 소진율·RiskAppetite 판정의 결과가 정의 기준 참값과 달라진다
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml:89
            - credit-risk-ontology.yaml:74
      unresolved_beyond_evidence: 소비 시스템이 실제로 실시간 판정에 total_amount를 쓰는지 또는 자체 재계산하는지는 문서 경계 밖이다.
