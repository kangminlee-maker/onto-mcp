          claim: relations에 두 엔터티를 직접 잇는 관계가 없고, Limit은 차주/상품별·ExposureAggregate는 차주 단위로
            정의되어 단위가 어긋난다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "credit-risk-ontology.yaml: relations"
            - "credit-risk-ontology.yaml: entities.Limit.definition"
            - "credit-risk-ontology.yaml: entities.ExposureAggregate.definition"
        - cause_id: structure-candidate-004.cause-003
          claim: 조인과 단위가 미정의이므로 각 소비 시스템이 독자적 대응 규칙을 구현하게 되어 소진율 불일치를 가능하게 한다.
          relation_to_previous: enables
