  - candidate_id: structure-candidate-001
    target: credit-risk-ontology.yaml entities.RiskAppetite + relations
    evidence_anchor: "credit-risk-ontology.yaml: entities.RiskAppetite (definition,
      attributes) and the relations list (5 entries, none involving
      RiskAppetite)"
    claim: RiskAppetite는 관계 그래프에 전혀 연결되지 않은 고아 엔터티이며, 자신의 정의가 의존하는
      ExposureAggregate와의 비교 관계도 구조적으로 존재하지 않는다.
    what: "RiskAppetite는 relations 목록의 어떤 항목에도 등장하지 않고, 속성에도 borrower_ref나 다른 엔터티를
      가리키는 ref가 하나도 없다. 정의문은 'ExposureAggregate가 RiskAppetite를 초과하면 위반'이라고
      서술하지만, 그 비교를 가능하게 하는 관계(예: applies_to, constrains)나 적용 범위
      속성(차주/세그먼트/포트폴리오)이 없다. threshold가 무엇의 합계와 비교되는지 구조적으로 결정할 수 없다."
    why: 이 온톨로지는 리스크 엔진과 보고 시스템이 공유하는 개념 권위를 지향한다. RiskAppetite 위반 판정은 리스크 관리의 핵심
      산출물인데, 위반 판정에 필요한 피연산자 연결(어떤 ExposureAggregate와 비교하는가)이 그래프에 없으므로 두 소비
      시스템이 각자 임의의 적용 범위를 가정해 서로 다른 위반 판정을 내릴 수 있다. 정의문 안의 산문 서술은 관계 그래프를 대체하지
      못한다.
    how_to_fix: "RiskAppetite에 적용 범위를 명시하는 관계를 추가한다. 최소 수정: relations에 { from:
      RiskAppetite, to: ExposureAggregate, kind: constrains } (또는
      Borrower/segment 수준 적용이면 해당 대상)을 추가하고, RiskAppetite에 scope를 식별하는 ref 속성을
      둔다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유하는 개념 권위 문서로서 RiskAppetite 위반 판정 기준을 단일하게 정의하는 것
      failure_condition: 두 소비 시스템이 RiskAppetite.threshold를 서로 다른 집계 범위(전사/세그먼트/차주)와
        비교하도록 구현하는 순간, 동일 데이터에 대해 compliance_status 판정이 갈린다.
      impact: 위반 판정은 한도 통제·보고의 게이트 역할을 하므로, 판정 불일치는 보고서 오류 또는 한도 초과 미탐지로 직결된다. 온톨로지가
        권위 역할을 수행하지 못한다.
      evidence_refs:
        - "credit-risk-ontology.yaml: entities.RiskAppetite.definition"
        - "credit-risk-ontology.yaml: relations (RiskAppetite 부재)"
