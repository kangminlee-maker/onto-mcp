  - candidate_id: evolution-candidate-001
    target: credit-risk-ontology.yaml — Borrower.internal_rating / RiskRating.grade
      / Exposure.risk_grade 3중 등급 스케일
    evidence_anchor: notes[0] "3개 스케일은 역사적 이유로 병존한다. 변환은 각 소비 시스템이 수행한다";
      RiskRating.grade note "매핑 테이블은 리스크팀 위키 참조"
    claim: 등급 스케일 간 변환 권위가 온톨로지 밖(위키·각 소비 시스템)에 분산되어 있어, 어느 한 스케일의 변경(등급 세분화, 신규 등급
      추가, 방법론 개정) 시 모든 소비 시스템이 독립적으로 수정되어야 하고 기존 데이터의 연속성이 보장되지 않는다.
    what: 차주 등급이 internal_rating(1~10), RiskRating.grade(R1~R5),
      Exposure.risk_grade(AAA~CCC)의 세 스케일로 병존하는데, 스케일 간 매핑이 온톨로지의 개념으로 정의되지 않고
      '리스크팀 위키'와 '각 소비 시스템'에 위임되어 있다.
    why: "이 문서는 '리스크 엔진과 보고서 시스템이 공유하는 개념 권위'를 지향한다고 선언하지만, 공유 개념의 핵심인 등급 동치 관계가 권위
      문서 밖에 있다. 외부 기준 변경(예: 감독 규제로 등급 체계 개편)이나 엔진 등급 체계 변경(R5→R7 확장 등) 시 매핑이 버전
      관리되지 않아 과거 데이터 재해석이 불가능하고, 소비 시스템별 변환 결과가 분기한다. 확장 시나리오마다 N개 시스템 동시 수정이
      필요한 구조다."
    how_to_fix: GradeScale과 GradeMapping(scale_from, scale_to, effective_from,
      mapping_rows)을 온톨로지의 1급 엔티티로 승격하고, 위키 매핑 테이블을 이 엔티티의 인스턴스로 흡수한다. 매핑에
      유효기간(effective_from/to)을 부여해 스케일 개정 시 과거 매핑이 보존되게 한다.
    upstream_evidence_required: true
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서라는 선언된 목적(파일 헤더 주석)
      failure_condition: 어느 한 등급 스케일이 개정되거나 신규 등급이 추가되는 시점에, 매핑이 온톨로지 버전과 독립적으로 위키에서
        변경되어 엔진 산출 등급과 보고서 등급이 서로 다른 매핑 버전으로 변환되는 경우
      impact: 등급은 한도·보고·리스크 판정의 입력이므로, 매핑 분기는 두 소비 시스템 간 수치 불일치로 직결되며 권위 문서로서의 신뢰가
        무너진다. 변경 내성 관점에서 가장 빈번한 변경 지점(등급 체계)이 가장 취약하게 설계되어 있다.
      evidence_refs:
        - credit-risk-ontology.yaml notes[0]
        - credit-risk-ontology.yaml RiskRating.grade.note
        - credit-risk-ontology.yaml 헤더 주석 (개념 권위 문서 지향)
    causal_path:
      root_cause_candidate: 등급 스케일 간 매핑을 온톨로지 개념이 아닌 외부 운영 문서(위키)와 소비 시스템 구현에 위임한 권위 분산 설계
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 세 등급 스케일이 병존하며 변환 책임이 각 소비 시스템에 있다고 명시되어 있다
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml notes[0]
        - cause_id: evolution-candidate-001.cause-002
          claim: 매핑 테이블이 버전 관리되지 않는 위키에 있어 온톨로지 버전(1.1)과 매핑 버전이 분리된다
          relation_to_previous: symptom_of
          evidence_refs:
            - credit-risk-ontology.yaml RiskRating.grade.note
        - cause_id: evolution-candidate-001.cause-003
          claim: 스케일 개정 시 소비 시스템별로 서로 다른 시점·버전의 매핑을 적용하게 되어 기존 데이터의 등급 연속성이 깨진다
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml notes[0] (변환은 각 소비 시스템이 수행)
      unresolved_beyond_evidence: 위키 매핑 테이블의 실제 내용과 버전 관리 여부는 경계 밖이라 확인할 수 없다. 다만 온톨로지
        내부에 매핑 개념이 부재하다는 사실 자체는 파일 내 증거로 닫힌다.
  - candidate_id: evolution-candidate-002
    target: "credit-risk-ontology.yaml — Collateral.is_a: Exposure"
    evidence_anchor: 'entities.Collateral.is_a: Exposure; relations "{ from:
      Exposure, to: Collateral, kind: secured_by }"'
    claim: Collateral이 Exposure의 하위 타입으로 선언되어 있어, 담보 구조 확장(공동담보, 교차담보, 담보 풀, 비여신 자산
      담보) 시 기존 분류 축 자체를 재구축해야 한다.
    what: "Collateral은 '익스포저를 담보하는 자산'으로 정의되면서 동시에 is_a: Exposure로 익스포저의 일종으로 선언되어
      있다. 같은 파일의 relation에서는 Exposure가 Collateral에 의해 secured_by로 담보되는 별개 개체로
      다뤄진다."
    why: "담보는 익스포저가 아니라 익스포저와 독립적으로 존재하는 자산이다. is_a 관계 때문에 Collateral은 amount,
      risk_grade, ltv 등 Exposure 속성을 상속하는데, 이 속성들은 담보에 의미가 없거나 모순된다. 변경 내성 관점에서
      치명적인 이유는 확장 시나리오에 있다: 하나의 담보가 여러 익스포저를 담보하는 공동담보, 차주가 아닌 제3자 제공 담보, 익스포저와
      무관하게 선등록되는 담보 풀은 모두 '담보=익스포저의 하위 타입' 구조에서 표현 불가능하며, 수용하려면 상속 축을 제거하는 파괴적
      마이그레이션이 필요하다."
    how_to_fix: "is_a: Exposure를 제거하고 Collateral을 독립 엔티티로 둔다. 기존 secured_by
      relation이 이미 올바른 연결을 제공하므로, 추가 변경 없이 다대다 확장(CollateralAllocation 등)이 가능한
      형태가 된다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 익스포저·담보를 정의하는 공유 개념 모델로서의 분류 정합성과 향후 담보 구조 확장 수용성
      failure_condition: 공동담보·제3자 담보·담보 풀 등 표준적인 담보 운영 형태를 추가하려는 시점, 또는 소비 시스템이 상속된
        Exposure 속성(amount, risk_grade)을 Collateral 인스턴스에 적용하는 시점
      impact: 분류 축의 오류는 단순 속성 추가로 고칠 수 없고 타입 계층 재구축을 요구한다. 두 소비 시스템이 이미 이 구조를 공유 기준으로
        삼으면 마이그레이션 비용이 시스템 수에 비례해 커진다.
      evidence_refs:
        - credit-risk-ontology.yaml entities.Collateral.is_a
        - credit-risk-ontology.yaml relations(secured_by)
        - credit-risk-ontology.yaml entities.Collateral.definition
    causal_path:
      root_cause_candidate: "'담보는 여신 레코드에 붙은 부속 데이터'라는 구현 관점이 개념 모델에 그대로 들어와
        자산(Collateral)을 채권(Exposure)의 하위 타입으로 오분류한 것"
      root_cause_step_id: evolution-candidate-002.cause-003
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: "Collateral이 is_a: Exposure로 선언되어 Exposure의 모든 속성을 상속한다"
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml entities.Collateral.is_a
        - cause_id: evolution-candidate-002.cause-002
          claim: 같은 문서의 secured_by relation 및 Collateral definition('익스포저를 담보하는 자산')과
            모순되어, 담보가 채권이면서 동시에 채권을 담보하는 자산이 된다
          relation_to_previous: symptom_of
          evidence_refs:
            - credit-risk-ontology.yaml relations(secured_by)
            - credit-risk-ontology.yaml entities.Collateral.definition
        - cause_id: evolution-candidate-002.cause-003
          claim: 이 상속 구조에서는 담보:익스포저 다대다 관계나 익스포저 독립 담보를 추가할 수 없어, 담보 확장 시 타입 계층 재구축이 강제된다
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml entities.Collateral (borrower_ref·amount
              상속 구조)
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-003
    target: credit-risk-ontology.yaml — 닫힌 enum들 (Borrower.segment,
      Exposure.product_type, Collateral.collateral_type, Exposure.risk_grade)
    evidence_anchor: entities.Borrower.segment.values [retail, sme, corporate];
      entities.Exposure.product_type.values [term_loan, revolving, guarantee];
      entities.Collateral.collateral_type.values [real_estate, deposit,
      securities]
    claim: 핵심 분류 축이 모두 닫힌 enum으로 정의되어 있고 확장·폐기(deprecation) 규약이 없어, 새 상품·세그먼트·담보 유형
      추가가 매번 온톨로지 개정 + 전 소비 시스템 동시 배포를 요구하는 파괴적 변경이 된다.
    what: segment, product_type, collateral_type, risk_grade가 모두 고정 값 목록의 enum이며, 값
      추가 시의 호환성 규칙(미지의 값 처리, 기본값, alias, deprecated 표기)이 문서 어디에도 없다.
    why: 여신 도메인에서 상품 유형(PF, 할인어음, 파생 거래상대방 익스포저)·세그먼트(공공, 금융기관)·담보 유형(보증서, 동산, 보험)
      추가는 통상적인 변경이다. 공유 권위 문서의 enum이 닫혀 있고 버전 호환 규약이 없으면, 값 하나 추가가 리스크 엔진과 보고
      시스템 양쪽의 동시 수정·배포를 강제하고, 한쪽만 먼저 반영되면 미지의 enum 값으로 인한 파싱·분류 실패가 발생한다.
    how_to_fix: "enum 확장 규약을 온톨로지에 명시한다: (1) 소비 시스템은 미지의 값을 거부 대신 'other/unknown'으로
      격리 처리, (2) 값 추가는 minor 버전, 값 제거·의미 변경은 major 버전, (3) deprecated 값은 즉시 삭제하지
      않고 alias 매핑을 거쳐 단계적 폐기."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 두 소비 시스템이 동일 분류 기준을 비파괴적으로 따라갈 수 있어야 하는 공유 개념 기준으로서의 역할
      failure_condition: 새 상품·세그먼트·담보 유형이 도입되어 enum 값이 추가되는 시점에 소비 시스템 간 배포 시차가 존재하는 경우
      impact: 배포 시차 동안 한 시스템은 신규 여신을 분류 불가 데이터로 처리하게 되어 집계·보고 누락이 발생하며, 모든 통상적 상품 확장이
        고비용 동시 배포 이벤트가 된다.
      evidence_refs:
        - credit-risk-ontology.yaml entities.Borrower.segment
        - credit-risk-ontology.yaml entities.Exposure.product_type
        - credit-risk-ontology.yaml entities.Collateral.collateral_type
        - 'credit-risk-ontology.yaml version: "1.1" (호환 규약 부재)'
    causal_path:
      root_cause_candidate: 온톨로지에 버전 번호(1.1)만 있고 버전 간 호환성·enum 진화 규약이 정의되지 않은 것
      root_cause_step_id: evolution-candidate-003.cause-002
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 핵심 분류 축 4개가 모두 닫힌 enum이며 미지 값 처리·확장 규칙이 없다
          relation_to_previous: null
          evidence_refs:
            - credit-risk-ontology.yaml entities.Borrower.segment /
              Exposure.product_type / Collateral.collateral_type
        - cause_id: evolution-candidate-003.cause-002
          claim: 호환 규약 부재로 enum 값 추가가 소비 시스템 전체의 동시 수정을 요구하는 파괴적 변경이 된다
          relation_to_previous: causes
          evidence_refs:
            - credit-risk-ontology.yaml (version 필드 외 호환성 규정 부재)
      unresolved_beyond_evidence: 소비 시스템들이 실제로 미지 enum 값을 어떻게 처리하는지는 경계 밖이다.
  - candidate_id: evolution-candidate-004
    target: credit-risk-ontology.yaml —
      RiskRating·Exposure.risk_grade·classification_rules[0]의 시간성 부재
    evidence_anchor: entities.RiskRating (유효기간·이력 속성 없음); classification_rules[0]
      "보고서 팀이 시장 상황에 따라 수동 조정할 수 있다"; entities.Exposure.ltv.note "심사 시점에 심사역이
      입력한다"
    claim: 등급·LTV에 유효기간과 출처(도출 vs 수동 조정) 구분이 없어, 등급 방법론이나 외부 기준이 개정될 때 기존 데이터를 신·구
      기준으로 분리 해석하거나 재산출할 수 있는 연속성 장치가 없다.
    what: RiskRating에는 valid_from/valid_to나 산출 기준 버전이 없고, Exposure.risk_grade는 엔진
      도출값과 보고서 팀 수동 조정값이 같은 필드에 구분 없이 저장되며, ltv는 심사 시점 입력값 이후 갱신 의미가 정의되지 않는다.
    why: evolution 관점에서 등급 방법론 개정·규제 기준 변경은 확실히 일어나는 변경이다. 그 시점에 (1) 어떤 등급이 어느 방법론
      버전으로 산출됐는지, (2) 어떤 risk_grade가 수동 조정된 값인지 구분할 수 없으면, 과거 데이터의 재분류·소급 분석·신구
      기준 병행 운영이 불가능하다. 수동 조정은 특히 위험한데, 방법론을 바꿔 재도출하면 조정 이력이 흔적 없이 덮어써진다.
    how_to_fix: 최소 수정으로 (1) RiskRating에 rated_at 또는 valid_from과 methodology_version
      속성 추가, (2) Exposure.risk_grade에 grade_source(derived|manual_override) 및 조정
      사유·시점 속성 추가, (3) ltv에 평가 기준일(as_of) 추가.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 외부 기준·방법론 변경 시 기존 등급 데이터의 해석 연속성을 유지해야 하는 리스크 관리 개념 모델의 역할
      failure_condition: 등급 방법론 또는 규제 기준이 개정되어 기존 등급의 재산출·소급 비교가 필요해지는 시점
      impact: 산출 기준 버전과 수동 조정 여부가 기록되지 않으면 개정 전후 데이터를 구분할 수 없어 시계열 보고가 단절되고, 수동 조정값이
        재도출로 소실되어 감사 추적이 불가능해진다.
      evidence_refs:
        - credit-risk-ontology.yaml entities.RiskRating (시간 속성 부재)
        - credit-risk-ontology.yaml classification_rules[0]
        - credit-risk-ontology.yaml entities.Exposure.ltv.note
    causal_path:
      root_cause_candidate: 엔티티들을 현재 상태 스냅숏으로만 모델링하고 '산출 기준 버전'과 '값의 출처'를 개념에 포함하지 않은 시간성 설계 누락
