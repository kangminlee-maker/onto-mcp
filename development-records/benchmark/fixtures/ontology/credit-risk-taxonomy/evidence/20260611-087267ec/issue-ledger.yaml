issues:
  - issue_id: issue-001
    root_cause_hypothesis: Mutable risk classification values are modeled as current
      attributes, fixed enums, or external mappings instead of governed
      versioned classification, assignment, and mapping concepts with explicit
      scale, authority, effective time, and override rules.
    root_confidence: high
    surface_finding_ids:
      - finding-001
      - finding-003
      - finding-007
      - finding-008
      - finding-013
    relation_refs:
      - rel-003
      - rel-004
      - rel-005
      - rel-011
    raised_by_lens_ids:
      - axiology
      - coverage
      - evolution
      - semantics
    issue_statement: Rating scales and other business classifications lack versioned
      ontology-level authority, so consumers can perform grade conversion,
      override interpretation, and category evolution outside the shared concept
      standard while still appearing compliant.
    proposed_action: Promote ratings, mappings, assignments, and mutable code sets
      into versioned authoritative concepts with effective periods, scale/source
      authority, mapping versions, override authority, and current-value
      projections only where needed.
    affected_purpose: The ontology's declared purpose as the shared classification
      concept authority for risk engine and reporting systems, including
      historical reconstruction and classification evolution.
    failure_condition: When rating scales, grade mappings, manual adjustment
      policies, product/collateral/segment categories, or historical as-of
      reporting requirements change, consumers can select different conversion
      or category interpretations without a bounded ontology authority.
    impact: The same borrower or exposure can receive different risk meanings,
      historical reports can become non-reproducible, and classification changes
      can force system-specific reinterpretation rather than shared governed
      continuity.
    evidence_refs:
      - .onto/review/20260611-087267ec/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:6-8
      - review-value-alignment-criteria.yaml:6-11
