      AdjustmentEvent/ApprovalEvent/AssessmentInput 또는 공통 ControlAction 엔티티로
      모델링하고 actor_ref, occurred_at, reason, source_value, adjusted_value,
      evidence_ref, approval_status를 포함한다. Exposure.risk_grade,
      Limit.approved_amount, Exposure.ltv에서 해당 이벤트를 참조하게 한다.
    affected_purpose: 리스크 엔진과 보고 시스템이 공유할 조정·승인된 리스크 값의 개념 기준
