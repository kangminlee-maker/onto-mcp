    lens_rationale_summary: 수동 조정과 승인은 리스크 분류 및 한도 산정 결과를 바꾸는 통제 대상 행위다. 행위 증거 개념 없이
      결과 값만 공유하면 리스크 엔진과 보고 시스템은 값이 자동 산출인지, 승인된 값인지, 누가 어떤 근거로 바꾼 값인지 구분할 수 없다.
