    source_ref: .onto/review/20260611-087267ec/round1/structure.findings.yaml#structure-candidate-002
    target: credit-risk-ontology.yaml / Exposure.risk_grade derivation structure
    evidence_anchor: materialized-input.md:31-34 declares Exposure.risk_grade;
      materialized-input.md:48-57 declares RiskRating.grade;
      materialized-input.md:92-93 says Exposure.risk_grade is derived from
      RiskRating.grade; materialized-input.md:85-90 has no
      Exposure-to-RiskRating or derivation relation.
    claim: The derivation path from RiskRating.grade to Exposure.risk_grade is not
      structurally represented.
    lens_rationale_summary: The ontology is meant to be a shared concept basis, and
      the derivation rule is a declared structural dependency between two
      attributes/entities. Without an explicit relation, consumers can see both
      grade concepts but cannot distinguish an intended derivation dependency
      from merely coexisting borrower-linked records.
    proposed_action: "Add a bounded derivation relation or relation metadata, for
      example `{ from: RiskRating, to: Exposure, kind: derives_risk_grade }`, or
      model an explicit grade-mapping concept if derivation needs an auditable
      intermediary."
    affected_purpose: Shared classification structure between the risk engine's
      RiskRating output and the reporting team's Exposure risk grade.
    failure_condition: When consumers need to trace or validate Exposure.risk_grade
      against RiskRating.grade, the ontology gives only a textual rule and no
      graph-level dependency.
    impact: This can lead risk engine and reporting implementations to use different
      linkage assumptions while both appear compliant with the same ontology.
