  - finding_id: finding-013
    lens_id: semantics
    source_ref: .onto/review/20260611-087267ec/round1/semantics.findings.yaml#semantics-candidate-003
    target: credit-risk-ontology.yaml / rating concepts
    evidence_anchor: materialized-input.md:20-22, materialized-input.md:31-34,
      materialized-input.md:48-57, materialized-input.md:92-98
    claim: 세 등급 개념이 모두 신용/리스크 등급으로 불리지만 의미·스케일·권위가 분리되어 있지 않다.
    lens_rationale_summary: 세 속성은 모두 '등급'이라는 같은 도메인 어휘를 쓰지만 대상 단위(차주/익스포저), 산출
