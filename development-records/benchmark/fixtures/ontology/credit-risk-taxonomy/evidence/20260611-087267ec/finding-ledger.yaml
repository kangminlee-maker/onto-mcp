      시간 상태는 신규 Exposure가 생긴 배치 전 구간에서 충돌합니다. 그 시점의 total_amount는 모든
      Exposure.amount를 포함해야 하면서 동시에 일부 Exposure.amount를 제외한 저장값이어야 하므로 형식적으로 양립
      불가능합니다."
