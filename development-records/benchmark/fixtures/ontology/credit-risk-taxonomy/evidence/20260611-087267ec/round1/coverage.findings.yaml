    claim: 시점 의존 등급 값의 유효기간·이력 개념이 누락되어 과거 시점의 공유 분류 기준을 재구성할 수 없다.
    what: Borrower.internal_rating, Exposure.risk_grade, RiskRating.grade/score가 모두
      현재 값처럼만 모델링되어 있고 effective_from/effective_to, assigned_at, superseded_at,
      rating_history 같은 시간성 개념이 없다. 등급 3개 스케일이 병존하고 수동 조정도 허용되지만, 특정 보고 기준일에 어떤
      등급과 변환이 유효했는지 표현하는 하위 영역이 없다.
    why: 이 온톨로지는 리스크 엔진과 보고서 시스템이 공유하는 개념 권위 문서를 지향한다. 그런데 등급은 리스크 산출과 보고의 핵심 분류
      값이고, 본문도 3개 스케일 병존과 수동 조정을 명시한다. 시간 유효성/이력 개념이 없으면 월말·과거 기준일 보고, 등급 변경 전후
      재현, 조정 전 원등급 복원이 온톨로지 안에서 닫히지 않는다.
    how_to_fix: 등급을 단순 속성이 아니라
      RatingAssignment/GradeMappingVersion/ExposureRiskGradeAssignment 같은 이력
      엔티티로 분리하고, 각 값에 effective_from, effective_to 또는 as_of, source_system,
      derivation_version, supersession 관계를 추가한다. 현재값 속성은 최신 projection으로만 두고 원천
      이력 개념을 권위로 삼는다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 리스크 엔진과 보고 시스템이 공유할 여신 리스크 분류 기준
      failure_condition: 등급이나 매핑이 변경된 뒤 과거 보고 기준일의 차주/익스포저 등급을 재계산하거나 설명해야 하는 경우
      impact: 공유 기준 문서가 현재 등급명만 제공하고 유효기간과 이력을 닫지 못해, 엔진 산출과 보고 재현 사이의 신뢰와 감사 가능성이
        약해진다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:20-22
        - materialized-input.md:31-37
        - materialized-input.md:48-57
        - materialized-input.md:93
        - materialized-input.md:98
