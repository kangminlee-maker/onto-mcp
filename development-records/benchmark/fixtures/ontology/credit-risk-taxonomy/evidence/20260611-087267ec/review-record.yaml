      rationale: "The structural orphaning is an independently actionable graph
        symptom of the broader assessment-context need. The final resolution
        favors an assessment/evaluation intermediary or equivalent relation
        pattern, so it should be carried forward with issue-002 rather than
        treated as a separate conceptual root. Source finding context:
        credit-risk-ontology.yaml / entities.RiskAppetite and relations Source
        finding context: materialized-input.md:78-83 defines RiskAppetite in
        terms of ExposureAggregate; materialized-input.md:85-90 lists all
        relations and contains no relation involving RiskAppetite. Source
        finding context: RiskAppetite is structurally orphaned despite depending
        on ExposureAggregate. Source finding context: The definition says
        ExposureAggregate exceeding RiskAppetite determines a RiskAppetite
        breach, so the ontology's own design requires a connection between those
        concepts. Because the relations list omits RiskAppetite entirely,
        consumers cannot traverse or validate the compliance concept from the
        aggregate exposure concept within the bounded ontology. Source finding
        context: Add an explicit relation such as `{ from: ExposureAggregate,
        to: RiskAppetite, kind: evaluated_against }` or `{ from: RiskAppetite,
        to: ExposureAggregate, kind: applies_to }`, choosing one direction and
        naming convention consistently with the ontology. Source finding
        context:
        .onto/review/20260611-087267ec/round1/structure.findings.yaml#structure\
        -candidate-001 Source finding context: Shared concept authority for risk
        engines and reporting systems over credit exposure, limits, and
        compliance state. Source finding context: When a consumer tries to
        determine or report RiskAppetite compliance from ExposureAggregate using
        the ontology graph, there is no modeled path to the RiskAppetite
        concept. Source finding context: This weakens review trust because a
        declared compliance concept is present but unreachable, so systems can
        implement incompatible ad hoc joins or omit the risk appetite check
        entirely. Source finding context: The relation set does not include any
        edge whose `from` or `to` is RiskAppetite. Source finding context:
        RiskAppetite is defined as the concept that determines breach/compliance
        when ExposureAggregate exceeds it. Source finding context: The complete
        visible relation list connects Borrower, Exposure, Collateral,
        RiskRating, Limit, and ExposureAggregate, but not RiskAppetite. Source
        finding context: Therefore RiskAppetite is a graph orphan relative to
        the ontology's own stated compliance relationship."
