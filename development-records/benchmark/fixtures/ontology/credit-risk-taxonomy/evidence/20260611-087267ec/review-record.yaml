        materialized-input.md:92-93 says Exposure.risk_grade is derived from
        RiskRating.grade; materialized-input.md:85-90 has no
        Exposure-to-RiskRating or derivation relation. Source finding context:
        The derivation path from RiskRating.grade to Exposure.risk_grade is not
        structurally represented. Source finding context: The ontology is meant
        to be a shared concept basis, and the derivation rule is a declared
        structural dependency between two attributes/entities. Without an
