      problem_definition: Mutable ratings, mappings, overrides, and code sets lack
        governed versioned authority, leaving shared classification meaning to
        consumer-specific interpretation.
      issue_statement: "Rating scales and other business classifications lack
        versioned ontology-level authority, so consumers can perform grade
        conversion, override interpretation, and category evolution outside the
        shared concept standard while still appearing compliant. Source finding
        context: credit-risk-ontology.yaml classification_rules and rating notes
        Source finding context: materialized-input.md:6-8 declares the ontology
        as a shared concept authority for the risk engine and reporting system;
        review-value-alignment-criteria.yaml:6-11 makes that purpose
        authority_rank 1. Target evidence: materialized-input.md:31-35, 48-56,
        92-98 allow Exposure.risk_grade manual reporting adjustment and leave
        three rating-scale conversions to each consuming system. Source finding
        context: Rating authority is delegated back to consumers despite the
        ontology's declared shared-authority purpose. Source finding context: A
        shared concept authority should give both consumers the same governed
        basis for classification. Here, the engine grade is not the final
        reporting grade, the conversion table is external, and consumers perform
        conversions themselves. That accepts an ungoverned tradeoff: local
        flexibility for reporting/history over a single authoritative
        classification basis. For a risk engine/reporting shared ontology, this
        weakens review trust because materially different ratings can be
        produced without an ontology-level precedence, provenance, or override
        contract. Source finding context: Make one canonical rating concept
        authoritative in the ontology, define versioned mappings among legacy
        scales inside the target or as explicitly governed referenced artifacts,
        and model reporting overrides as controlled records with allowed
        reasons, precedence over engine output, effective time,
        approver/provenance, and downstream visibility. Source finding context:
