      `compliance_status`, but no amount-valued RiskAppetite field."
    claim: The breach rule compares `ExposureAggregate` to `RiskAppetite` as an
      entity, while the comparable numeric attribute is
      `RiskAppetite.threshold`.
    lens_rationale_summary: The present claims declare
      `ExposureAggregate.total_amount` and `RiskAppetite.threshold` as numbers,
      but not `ExposureAggregate` or `RiskAppetite` themselves as numeric
      values. A greater-than comparison between an aggregate entity and an
      appetite entity is not simultaneously satisfiable with the declared
      attribute typing unless an unstated projection is assumed. In a shared
      engine/reporting contract, this makes the compliance rule ambiguous at the
      formal level where the engine needs an executable predicate and reports
      need the same predicate.
    proposed_action: Rewrite the rule as an attribute-level predicate, e.g.
      `RiskAppetite.compliance_status = breached iff
      ExposureAggregate.total_amount > RiskAppetite.threshold` for the
      applicable borrower/scope/as_of, and define the required relation/scope
      between the aggregate and appetite.
