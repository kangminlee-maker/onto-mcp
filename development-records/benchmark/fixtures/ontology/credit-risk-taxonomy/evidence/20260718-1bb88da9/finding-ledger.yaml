    claim: Limit amount semantics mix approved limit, available limit, utilization
      denominator, and cross-system currency conversion without a single
      authoritative meaning.
    lens_rationale_summary: Approved amount, available limit, and utilized/exposure
      amount are distinct credit limit concepts. Treating CRM available_limit as
      summable with approved_amount blurs remaining-capacity semantics with
      approved-capacity semantics. Because utilization depends on both
      denominator meaning and FX basis, allowing each system to use its own FX
      table further changes the semantic value of the same named utilization
      ratio.
    proposed_action: Separate approved limit, available/remaining limit, and
      utilized exposure as distinct concepts; define whether they may be
      aggregated and under what currency/as-of rules. Make the FX source and
      valuation date an ontology-governed authority or explicit input, not a
      per-system semantic choice.
    affected_purpose: Shared concept authority for limits and utilization reporting
      between risk engine and reporting systems.
    failure_condition: When systems calculate or report limit utilization for
      multi-currency or CRM-integrated borrowers, they may use different
      denominator semantics or FX sources under the same rule name.
    impact: Limit breach, utilization, and risk appetite reporting can diverge while
      appearing to follow the ontology because the key terms do not have stable
      meanings.
