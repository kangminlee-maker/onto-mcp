  - finding_id: finding-007
    lens_id: coverage
    source_ref: .onto/review/20260718-1bb88da9/round1/coverage.findings.yaml#coverage-candidate-004
    target: credit-risk-ontology.yaml / credit risk domain scope
    evidence_anchor: "Embedded Materialized Input: notes[1] excludes
      delinquency/default status as outside scope; entity list contains
      Borrower, Exposure, Collateral, RiskRating, Limit, ExposureAggregate,
      RiskAppetite only."
    claim: Default/delinquency risk status is excluded despite being a central
      credit-risk lifecycle area, leaving the ontology under-covered for
      credit-risk reporting.
    lens_rationale_summary: From a coverage perspective, a credit-risk
      classification ontology shared by risk and reporting needs at least a
      conceptual place for adverse credit states, even if operational ownership
      belongs to another system. The target defines exposure, ratings, limits,
      collateral, aggregate exposure, and risk appetite, but omits the
      lifecycle/outcome states that determine whether credit risk has
      materialized. Because the note makes the omission intentional, the gap is
      inside the declared target boundary rather than merely unknown external
      detail.
    proposed_action: Add a minimal externally-owned CreditRiskStatus or
      DelinquencyDefaultStatus projection with borrower/exposure reference,
      status enum, source_system=delinquency management, as_of/effective period,
      and lifecycle states such as current, delinquent, defaulted, cured,
      written_off, closed, or explicitly define why reports and engines must
      never consume that status through this ontology.
    affected_purpose: The ontology presents itself as a credit-risk classification
      model for lending risk management and shared risk/reporting concepts.
    failure_condition: Risk reports or engine classifications that need to combine
      ratings/exposure with delinquency or default status cannot do so through
      the shared ontology.
    impact: The ontology covers pre-default exposure and rating concepts but lacks a
      central outcome/lifecycle dimension, which can fragment credit-risk
      reporting across systems.
