  - finding_id: finding-012
    lens_id: logic
    source_ref: .onto/review/20260718-1bb88da9/round1/logic.findings.yaml#logic-candidate-001
    target: credit-risk-ontology.yaml / entities.Collateral
    evidence_anchor: "Embedded Materialized Input: `Collateral.definition` states
      collateral is an asset securing an exposure, while `Collateral.is_a:
      Exposure` declares Collateral as a subtype of Exposure."
    claim: "`Collateral` is simultaneously defined as a securing asset and declared
      to be an `Exposure`, creating an explicit class-membership conflict."
    lens_rationale_summary: "The contradiction is internal to the present claim set:
      `Exposure` is defined as credit exposure to a borrower, while `Collateral`
      is defined as an asset that secures that exposure. The relation `Exposure
      -> Collateral` (`secured_by`) also treats them as separate roles. For a
      shared concept authority between a risk engine and reporting system, this
      weakens classification because collateral records can be logically
      admitted wherever exposure records are expected."
    proposed_action: "Remove `Collateral.is_a: Exposure` and model collateral only
      as a separate entity related to `Exposure` through `secured_by`, or
      introduce a separate parent such as `RiskMitigant` if inheritance is
      needed."
    affected_purpose: The ontology's purpose as a shared concept authority for risk
      engine and reporting systems.
    failure_condition: When systems interpret `is_a` as subtype inheritance or type
      membership, collateral instances become valid exposure instances despite
      being separately defined as securing assets.
    impact: Risk engines or reports can include collateral objects in
      exposure-oriented logic, aggregations, or validations, undermining the
      shared classification contract.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/logic.findings.yaml#logic-candidate-001
      - "Embedded Materialized Input: `Exposure.definition`: 차주에 대한 신용 익스포저(대출,
        한도성 여신 포함)."
      - "Embedded Materialized Input: `Collateral.definition`: 익스포저를 담보하는 자산. 담보
        평가의 기본 단위."
      - "Embedded Materialized Input: `Collateral.is_a: Exposure`"
      - "Embedded Materialized Input: relation `{ from: Exposure, to:
        Collateral, kind: secured_by }`"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: The ontology's purpose as a shared concept authority for risk
        engine and reporting systems.
      failure_condition: When systems interpret `is_a` as subtype inheritance or type
        membership, collateral instances become valid exposure instances despite
        being separately defined as securing assets.
      impact: Risk engines or reports can include collateral objects in
        exposure-oriented logic, aggregations, or validations, undermining the
        shared classification contract.
      evidence_refs:
        - "Embedded Materialized Input: `Exposure.definition`: 차주에 대한 신용
          익스포저(대출, 한도성 여신 포함)."
        - "Embedded Materialized Input: `Collateral.definition`: 익스포저를 담보하는 자산.
          담보 평가의 기본 단위."
        - "Embedded Materialized Input: `Collateral.is_a: Exposure`"
        - "Embedded Materialized Input: relation `{ from: Exposure, to:
          Collateral, kind: secured_by }`"
    causal_path:
      root_cause_candidate: The ontology uses subtype inheritance (`is_a`) to connect
        a role/entity that is explicitly defined as a separate secured asset
        rather than a credit exposure.
      root_cause_step_id: finding-012.cause-003
      steps:
        - cause_id: finding-012.cause-001
          claim: "`Collateral` is declared as a subtype of `Exposure` through `is_a:
            Exposure`."
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `Collateral.is_a: Exposure`"
        - cause_id: finding-012.cause-002
          claim: "`Collateral` is also defined as an asset that secures an exposure, not
            as the exposure itself."
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `Collateral.definition`: 익스포저를 담보하는
              자산. 담보 평가의 기본 단위."
        - cause_id: finding-012.cause-003
          claim: The relation set separately links `Exposure` to `Collateral` with
            `secured_by`, reinforcing that the claims treat them as distinct
            roles while inheritance collapses them into one type hierarchy.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: relation `{ from: Exposure, to:
              Collateral, kind: secured_by }`"
      unresolved_beyond_evidence: A formal metamodel defining `is_a` is not included,
