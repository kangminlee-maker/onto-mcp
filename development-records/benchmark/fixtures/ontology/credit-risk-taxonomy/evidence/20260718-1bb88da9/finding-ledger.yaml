findings:
  - finding_id: finding-001
    lens_id: axiology
    source_ref: .onto/review/20260718-1bb88da9/round1/axiology.findings.yaml#axiology-candidate-001
    target: credit-risk-ontology.yaml / classification_rules[0] and notes[0]
    evidence_anchor: "Embedded Materialized Input: target header states the ontology
      is a shared authority document for risk engine and reports;
      classification_rules[0] says `Exposure.risk_grade` is derived from
      `RiskRating.grade` but can be manually adjusted by the reporting team;
      notes[0] says the three rating scales coexist and conversion is performed
      by each consuming system."
    claim: Shared concept authority is weakened by delegating rating-scale
      conversion and report-grade override authority to consumers.
    lens_rationale_summary: "For an ontology whose stated purpose is to provide
      shared conceptual authority, the rating concepts are purpose-critical
      because risk engines and reports both depend on them. Letting each
      consumer perform its own conversion, while also allowing one consumer
      group to override a derived grade, creates ungoverned local authority over
      a core risk classification. This is a value/purpose drift: local reporting
      flexibility is accepted without a declared governance seat, precedence
      rule, audit trail, or canonical mapping, so the shared basis can diverge
      exactly where shared meaning is most needed."
    proposed_action: "Make one canonical authority path for rating conversion and
      overrides: define the authoritative mapping among the three grade scales
      in the ontology or a governed referenced artifact, specify precedence
      between engine-derived and manually adjusted grades, and require override
      reason, actor, timestamp/as_of, and audit status if report-grade
      adjustments remain allowed."
    affected_purpose: The ontology's declared purpose as the shared concept
      authority for risk engines and reporting systems.
    failure_condition: When the engine, reporting team, or another consumer maps
      rating scales differently, or when reporting manually adjusts
      `Exposure.risk_grade` without canonical precedence and audit semantics.
    impact: The same borrower or exposure can carry different risk classifications
      across engine and reporting outputs, weakening trust in risk decisions and
      reports produced from the supposedly shared ontology.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/axiology.findings.yaml#axiology-candidate-001
      - "Embedded Materialized Input: target description says the ontology aims
        to be a shared concept authority for risk engine and reporting systems."
      - "Embedded Materialized Input: `classification_rules[0]` permits
        reporting-team manual adjustment of `Exposure.risk_grade`."
      - "Embedded Materialized Input: `notes[0]` leaves conversion among the
        three rating scales to each consuming system."
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: The ontology's declared purpose as the shared concept
        authority for risk engines and reporting systems.
      failure_condition: When the engine, reporting team, or another consumer maps
        rating scales differently, or when reporting manually adjusts
        `Exposure.risk_grade` without canonical precedence and audit semantics.
      impact: The same borrower or exposure can carry different risk classifications
        across engine and reporting outputs, weakening trust in risk decisions
        and reports produced from the supposedly shared ontology.
      evidence_refs:
        - "Embedded Materialized Input: target description says the ontology
          aims to be a shared concept authority for risk engine and reporting
          systems."
        - "Embedded Materialized Input: `classification_rules[0]` permits
          reporting-team manual adjustment of `Exposure.risk_grade`."
        - "Embedded Materialized Input: `notes[0]` leaves conversion among the
          three rating scales to each consuming system."
    causal_path:
      root_cause_candidate: The ontology does not assign canonical authority,
        precedence, or governance for translating and overriding its core rating
        concepts.
      root_cause_step_id: finding-001.cause-004
      steps:
        - cause_id: finding-001.cause-001
          claim: The target states that the ontology is intended to be the shared concept
            authority for risk engine and reporting systems.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: header comment says it defines
              exposure, rating, limit, and collateral and aims to be a shared
              concept authority document for the risk engine and reporting
              system."
        - cause_id: finding-001.cause-002
          claim: The target contains three coexisting grade scales and says conversion is
            performed by each consuming system.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `Borrower.internal_rating` note
              describes a 1-10 scale."
            - "Embedded Materialized Input: `RiskRating.grade` uses R1-R5 and
              points to a risk-team wiki mapping."
            - "Embedded Materialized Input: `Exposure.risk_grade` uses AAA-CCC."
            - "Embedded Materialized Input: `notes[0]` says conversion is
              performed by each consumer system."
        - cause_id: finding-001.cause-003
          claim: The reporting team may manually adjust a grade that is otherwise said to
            be derived from engine output.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: `classification_rules[0]` says
              `Exposure.risk_grade` is derived from `RiskRating.grade` but
              reporting can manually adjust it according to market conditions."
        - cause_id: finding-001.cause-004
          claim: These local conversions and adjustments can produce divergent risk
            classifications under a document whose purpose is shared authority.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: shared-authority header comment."
            - "Embedded Materialized Input: `classification_rules[0]`."
            - "Embedded Materialized Input: `notes[0]`."
      unresolved_beyond_evidence: The bounded target does not show whether the
        referenced risk-team wiki or consumer systems enforce a common mapping,
        so this finding is limited to the ontology's failure to carry that
        authority itself.
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260718-1bb88da9/round1/axiology.findings.yaml#axiology-candidate-002
    target: credit-risk-ontology.yaml / ExposureAggregate and Limit utilization rule
    evidence_anchor: "Embedded Materialized Input: `ExposureAggregate.total_amount`
      is stored from a month-end batch and intraday new loans are excluded until
      the next batch; `classification_rules[1]` defines limit utilization as
      `ExposureAggregate.total_amount / Limit.approved_amount`;
      `Limit.approved_amount` notes CRM available_limit is jointly managed."
    claim: A stale batch aggregate is used as the authoritative numerator for limit
      utilization without temporal freshness boundaries.
    lens_rationale_summary: "The declared purpose is a shared concept basis for risk
      engine and reporting. A limit utilization concept used for credit risk
      control is purpose-critical, but the model bakes in a known temporal lag
      without naming it as a stale snapshot, without defining when it is valid
      for decisions, and without separating reporting snapshot semantics from
      real-time risk-control semantics. This accepts a hidden tradeoff:
      operational convenience of batch storage over timely risk appetite and
      limit visibility."
    proposed_action: Define separate concepts for batch reporting exposure and
      decision-current exposure, require `as_of`/calculation timestamp and
      source freshness on both numerator and denominator, and constrain
      limit-utilization use by context, for example `reporting_utilization`
      versus `decision_utilization`.
    affected_purpose: The ontology's purpose as a shared concept basis for risk
      engine and reporting, especially for limit utilization and risk exposure
      controls.
    failure_condition: When intraday lending or CRM limit changes occur after the
      month-end aggregate but before the next batch, and systems use the
      ontology's limit-utilization formula as if it represented current
      exposure.
    impact: Risk engine or reports can understate utilization and risk appetite
      pressure, making the shared ontology operationally misleading for control
      decisions or cross-system reconciliation.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/axiology.findings.yaml#axiology-candidate-002
      - "Embedded Materialized Input: `ExposureAggregate.definition` says it is
        total borrower exposure and all `Exposure.amount` sum."
      - "Embedded Materialized Input: `ExposureAggregate.total_amount` note says
        it is calculated by month-end batch and intraday new lending is not
        reflected until the next batch."
      - "Embedded Materialized Input: `classification_rules[1]` defines
        utilization as `ExposureAggregate.total_amount /
        Limit.approved_amount`."
      - "Embedded Materialized Input: `Limit.approved_amount` note says CRM
        `available_limit` is jointly managed."
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: The ontology's purpose as a shared concept basis for risk
        engine and reporting, especially for limit utilization and risk exposure
        controls.
      failure_condition: When intraday lending or CRM limit changes occur after the
        month-end aggregate but before the next batch, and systems use the
        ontology's limit-utilization formula as if it represented current
        exposure.
      impact: Risk engine or reports can understate utilization and risk appetite
        pressure, making the shared ontology operationally misleading for
        control decisions or cross-system reconciliation.
      evidence_refs:
        - "Embedded Materialized Input: `ExposureAggregate.definition` says it
          is total borrower exposure and all `Exposure.amount` sum."
        - "Embedded Materialized Input: `ExposureAggregate.total_amount` note
          says it is calculated by month-end batch and intraday new lending is
          not reflected until the next batch."
        - "Embedded Materialized Input: `classification_rules[1]` defines
          utilization as `ExposureAggregate.total_amount /
          Limit.approved_amount`."
        - "Embedded Materialized Input: `Limit.approved_amount` note says CRM
          `available_limit` is jointly managed."
    causal_path:
      root_cause_candidate: The ontology does not separate reporting snapshots from
        decision-current exposure/limit semantics despite using the stale
        aggregate in a control formula.
      root_cause_step_id: finding-002.cause-005
      steps:
        - cause_id: finding-002.cause-001
          claim: The target defines borrower total exposure as an aggregate of all
            exposure amounts.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `ExposureAggregate.definition` says
              borrower-level total exposure is the sum of all
              `Exposure.amount`."
        - cause_id: finding-002.cause-002
          claim: The stored aggregate is only calculated by month-end batch and omits
            intraday new lending until the next batch.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `ExposureAggregate.total_amount`
              note."
        - cause_id: finding-002.cause-003
          claim: The ontology uses that stored aggregate directly as the numerator for
            limit utilization.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `classification_rules[1]`."
        - cause_id: finding-002.cause-004
          claim: The denominator is also cross-system because `Limit.approved_amount` is
            jointly managed with CRM `available_limit`, but no common freshness
            or as-of rule is defined for the utilization calculation.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: `Limit.approved_amount` note."
            - "Embedded Materialized Input: `classification_rules[1]`."
        - cause_id: finding-002.cause-005
          claim: A known-lag aggregate can therefore be interpreted as current utilization
            by the shared risk/reporting ontology.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: shared-authority header comment."
            - "Embedded Materialized Input: `ExposureAggregate.total_amount`
              note."
            - "Embedded Materialized Input: `classification_rules[1]`."
      unresolved_beyond_evidence: The bounded target does not show downstream runtime
        usage, so the finding is about the concept contract permitting
        stale/current ambiguity rather than proving an observed production
        miscalculation.
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260718-1bb88da9/round1/axiology.findings.yaml#axiology-candidate-003
    target: credit-risk-ontology.yaml / scope notes excluding default status
    evidence_anchor: "Embedded Materialized Input: notes[1] says default/delinquency
      status is outside this ontology because a separate delinquency-management
      system handles it; the header says the ontology is for credit-risk
      management and shared risk/reporting concepts."
    claim: Excluding default status from a credit-risk shared ontology leaves a
      purpose-critical stakeholder boundary undefined.
    lens_rationale_summary: "Boundary exclusions can be valid, but for credit risk
      management, default/delinquency status is central to the meaning and
      operational use of risk grades, exposure control, and reports. A shared
      ontology can delegate ownership to another system while still defining the
      boundary concept and relation. Here the exclusion is accepted without a
      compensating interface, which risks purpose drift: the ontology optimizes
      scope neatness over the completeness needed for shared risk
      interpretation."
    proposed_action: Keep delinquency/default ownership outside if needed, but add a
      boundary concept or relation such as `DefaultStatus`/`DelinquencyStatus`
      with source authority, join key, as-of time, and effects on ratings,
      exposure classification, limit compliance, and reporting eligibility.
    affected_purpose: The ontology's declared credit-risk management purpose and its
      role as a shared basis for risk engine and reporting systems.
    failure_condition: When a borrower or exposure has delinquency/default state in
      the external system, but risk engine or reporting consumers rely on this
      ontology without a defined boundary relation to that state.
    impact: Core credit-risk outputs can omit or inconsistently join a
      purpose-critical status, weakening shared interpretation across
      stakeholders even if another system owns the source data.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/axiology.findings.yaml#axiology-candidate-003
      - "Embedded Materialized Input: header comment describes a credit-risk
        management concept model shared by risk engine and report system."
      - "Embedded Materialized Input: `notes[1]` excludes default/delinquency
        status because it is handled by a separate system."
      - "Embedded Materialized Input: entities and relations do not include a
        relation to delinquency/default status in the materialized target."
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: The ontology's declared credit-risk management purpose and its
        role as a shared basis for risk engine and reporting systems.
      failure_condition: When a borrower or exposure has delinquency/default state in
        the external system, but risk engine or reporting consumers rely on this
        ontology without a defined boundary relation to that state.
      impact: Core credit-risk outputs can omit or inconsistently join a
        purpose-critical status, weakening shared interpretation across
        stakeholders even if another system owns the source data.
      evidence_refs:
        - "Embedded Materialized Input: header comment describes a credit-risk
          management concept model shared by risk engine and report system."
        - "Embedded Materialized Input: `notes[1]` excludes default/delinquency
          status because it is handled by a separate system."
        - "Embedded Materialized Input: entities and relations do not include a
          relation to delinquency/default status in the materialized target."
    causal_path:
      root_cause_candidate: The ontology treats an ownership boundary as a scope
        exclusion instead of modeling the boundary relation for a
        purpose-critical risk concept.
      root_cause_step_id: finding-003.cause-004
      steps:
        - cause_id: finding-003.cause-001
          claim: The ontology is scoped as a credit-risk management concept model for
            shared engine/reporting use.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: header comment."
        - cause_id: finding-003.cause-002
          claim: The ontology excludes default/delinquency status entirely because a
            separate system handles it.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `notes[1]`."
        - cause_id: finding-003.cause-003
          claim: No visible entity or relation in the bounded target links borrower,
            exposure, rating, limit, or report concepts to the external
            default/delinquency status.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: visible `entities` list."
            - "Embedded Materialized Input: visible `relations` list."
        - cause_id: finding-003.cause-004
          claim: This leaves a core risk-status boundary undefined for systems expected to
            share concepts through the ontology.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: header comment."
            - "Embedded Materialized Input: `notes[1]`."
      unresolved_beyond_evidence: The bounded target does not show the separate
        delinquency-management ontology or integration layer; if one exists, it
        is not represented in this shared concept authority document.
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260718-1bb88da9/round1/coverage.findings.yaml#coverage-candidate-001
    target: "credit-risk-ontology.yaml / classification_rules: Exposure.risk_grade
      manual adjustment"
    evidence_anchor: "Embedded Materialized Input: classification_rules[0] says
      Exposure.risk_grade is derived from RiskRating.grade but the reporting
      team may manually adjust it based on market conditions;
      Exposure.risk_grade has only the adjusted enum value and no adjustment
      evidence attributes or entity."
    claim: Manual risk-grade overrides are in scope but the ontology lacks audit
      evidence concepts for the override action.
    lens_rationale_summary: A shared concept authority for a risk engine and
      reporting system must let both systems distinguish engine-derived grades
      from manually adjusted reported grades. The target explicitly allows
      manual adjustment, while the only modeled grade-bearing attributes are
      Borrower.internal_rating, RiskRating.grade, and Exposure.risk_grade. None
      of the entities or relations capture an override action, actor, timestamp,
      rationale, approval, or prior/current grade pair, so the reporting value
      cannot be reconstructed or audited from the ontology itself.
    proposed_action: Add a bounded override/audit concept such as
      RiskGradeAdjustment with exposure_ref, source_rating_ref or source_grade,
      adjusted_grade, actor, adjusted_at, reason/market_basis,
      approval_ref/status, and effective period; relate Exposure.risk_grade to
      the latest effective approved adjustment or the derived RiskRating mapping
      when no adjustment exists.
    affected_purpose: The ontology is intended as a shared concept authority for the
      risk engine and reporting system.
    failure_condition: When Exposure.risk_grade is manually changed by the reporting
      team, downstream users cannot tell whether a reported grade is
      engine-derived or adjusted, nor reconstruct the actor, time, and basis for
      the reported value.
    impact: This weakens auditability and cross-system trust for a core risk
      classification value, especially because the target itself authorizes
      manual changes to that value.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/coverage.findings.yaml#coverage-candidate-001
      - "Embedded Materialized Input: header comment states the ontology is a
        shared concept authority for risk engine and reporting systems."
      - "Embedded Materialized Input: Exposure.risk_grade note says it is used
        by the reporting team."
      - "Embedded Materialized Input: classification_rules[0] permits
        reporting-team manual adjustment of Exposure.risk_grade."
      - "Embedded Materialized Input: entities list contains no
        adjustment/audit/approval evidence entity or attributes for risk-grade
        overrides."
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: The ontology is intended as a shared concept authority for the
        risk engine and reporting system.
      failure_condition: When Exposure.risk_grade is manually changed by the reporting
        team, downstream users cannot tell whether a reported grade is
        engine-derived or adjusted, nor reconstruct the actor, time, and basis
        for the reported value.
      impact: This weakens auditability and cross-system trust for a core risk
        classification value, especially because the target itself authorizes
        manual changes to that value.
      evidence_refs:
        - "Embedded Materialized Input: header comment states the ontology is a
          shared concept authority for risk engine and reporting systems."
        - "Embedded Materialized Input: Exposure.risk_grade note says it is used
          by the reporting team."
        - "Embedded Materialized Input: classification_rules[0] permits
          reporting-team manual adjustment of Exposure.risk_grade."
        - "Embedded Materialized Input: entities list contains no
          adjustment/audit/approval evidence entity or attributes for risk-grade
          overrides."
    causal_path:
      root_cause_candidate: The ontology models adjusted risk grade as a bare Exposure
        attribute while placing the manual adjustment rule only in free-text
        classification_rules.
      root_cause_step_id: finding-004.cause-003
      steps:
        - cause_id: finding-004.cause-001
          claim: Exposure.risk_grade is represented as a single enum attribute on
            Exposure.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Exposure.attributes.risk_grade
              values [AAA, AA, A, BBB, BB, B, CCC]."
        - cause_id: finding-004.cause-002
          claim: The classification rule permits the reporting team to manually adjust
            that value based on market conditions.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: classification_rules[0]."
        - cause_id: finding-004.cause-003
          claim: No entity or attribute captures the manual adjustment action, actor,
            timestamp, basis, approval, or source-versus-adjusted value.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: entities Borrower, Exposure,
              Collateral, RiskRating, Limit, ExposureAggregate, RiskAppetite and
              their listed attributes."
      unresolved_beyond_evidence: null
  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260718-1bb88da9/round1/coverage.findings.yaml#coverage-candidate-002
    target: credit-risk-ontology.yaml / rating and exchange-rate dependent values
    evidence_anchor: "Embedded Materialized Input: RiskRating.grade has no effective
      date; Borrower.internal_rating has no time fields; Exposure.risk_grade has
      no effective date; classification_rules[1] uses each system's same-day
      exchange-rate table, but no exchange-rate concept exists."
    claim: Time-dependent classification inputs are modeled without validity periods
      or history, preventing point-in-time reconstruction.
    lens_rationale_summary: The review target is a shared concept basis for risk
      calculation and reporting. For historical reports or replayed risk-engine
      decisions, both systems need the value that was valid at the relevant
      point in time. The target explicitly mentions monthly batch aggregate
      timing and same-day exchange-rate tables, but the ontology lacks
      effective_from/effective_to, as_of, version, or source-table references
      for several time-dependent inputs, so historical utilization and grade
      outputs cannot be reconstructed from the concept model.
    proposed_action: "Introduce temporal validity consistently for time-dependent
      concepts: add effective_from/effective_to or as_of/version fields to
      RiskRating, Borrower rating, Exposure.risk_grade, Limit.approved_amount,
      and any mapping table; add an ExchangeRate or CurrencyConversionRate
      concept with source_system/table authority, currency pair, rate_date/time,
      and rate value."
    affected_purpose: The ontology is meant to support shared risk-engine and
      reporting interpretation of credit-risk values.
    failure_condition: For a prior reporting date or risk decision, the systems need
      to reconstruct the rating, limit, mapping, and exchange-rate values valid
      at that time, but the ontology only stores current or undated values for
      several inputs.
    impact: This can make historical reports non-reproducible and risk calculations
      inconsistent across systems because point-in-time authority is absent for
      core classification inputs.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/coverage.findings.yaml#coverage-candidate-002
      - "Embedded Materialized Input: Borrower.internal_rating has no validity
        or as_of attributes."
      - "Embedded Materialized Input: RiskRating.grade and score have no
        validity or as_of attributes."
      - "Embedded Materialized Input: Exposure.risk_grade and ltv lack validity
        fields; ltv note says it is entered at review time."
      - "Embedded Materialized Input: Limit.approved_amount has no
        approval/effective date."
      - "Embedded Materialized Input: classification_rules[1] says currency
        conversion uses each system's same-day exchange-rate table, but no
        exchange-rate entity is defined."
      - "Embedded Materialized Input: ExposureAggregate.total_amount has as_of
        and a monthly batch note, showing at least one temporal value is
        recognized."
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: The ontology is meant to support shared risk-engine and
        reporting interpretation of credit-risk values.
      failure_condition: For a prior reporting date or risk decision, the systems need
        to reconstruct the rating, limit, mapping, and exchange-rate values
        valid at that time, but the ontology only stores current or undated
        values for several inputs.
      impact: This can make historical reports non-reproducible and risk calculations
        inconsistent across systems because point-in-time authority is absent
        for core classification inputs.
      evidence_refs:
        - "Embedded Materialized Input: Borrower.internal_rating has no validity
          or as_of attributes."
        - "Embedded Materialized Input: RiskRating.grade and score have no
          validity or as_of attributes."
        - "Embedded Materialized Input: Exposure.risk_grade and ltv lack
          validity fields; ltv note says it is entered at review time."
        - "Embedded Materialized Input: Limit.approved_amount has no
          approval/effective date."
        - "Embedded Materialized Input: classification_rules[1] says currency
          conversion uses each system's same-day exchange-rate table, but no
          exchange-rate entity is defined."
        - "Embedded Materialized Input: ExposureAggregate.total_amount has as_of
          and a monthly batch note, showing at least one temporal value is
          recognized."
    causal_path:
      root_cause_candidate: Temporal coverage is applied only selectively rather than
        as a concept dimension for all point-in-time risk inputs.
      root_cause_step_id: finding-005.cause-003
      steps:
        - cause_id: finding-005.cause-001
          claim: Some concepts include point-in-time markers, such as
            Collateral.appraised_at and ExposureAggregate.as_of.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Collateral.attributes.appraised_at."
            - "Embedded Materialized Input: ExposureAggregate.attributes.as_of."
        - cause_id: finding-005.cause-002
          claim: Other time-dependent values, including ratings, risk grades, approved
            limits, and exchange rates, lack equivalent validity/history fields
            or entities.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: Borrower.internal_rating,
              RiskRating.grade/score, Exposure.risk_grade,
              Limit.approved_amount, classification_rules[1]."
        - cause_id: finding-005.cause-003
          claim: Because classification and utilization calculations depend on those
            values, historical outputs cannot be reconstructed from the ontology
            alone.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: classification_rules[0] and
              classification_rules[1]."
      unresolved_beyond_evidence: null
  - finding_id: finding-006
    lens_id: coverage
    source_ref: .onto/review/20260718-1bb88da9/round1/coverage.findings.yaml#coverage-candidate-003
    target: credit-risk-ontology.yaml / multi-system managed values and grade scales
    evidence_anchor: "Embedded Materialized Input: RiskRating.grade note sends
      mapping to a risk-team wiki; Limit.approved_amount note says approval
      system records it and CRM available_limit is managed together;
      classification_rules[1] uses each system's exchange-rate table; notes say
      each consuming system performs grade-scale conversion."
    claim: Values explicitly shared across systems lack a single authority concept,
      leaving consumers to reconcile competing sources themselves.
    lens_rationale_summary: Coverage of single authority is required when values are
      managed across systems. The target's declared purpose is to be a shared
      concept authority, but several fields are explicitly delegated to external
      or per-consumer sources without an authoritative entity, relation, or
      precedence rule. That omission means the risk engine and reporting system
      can legally produce different grade mappings, limit utilization, or
      currency-converted values while still conforming to the ontology text.
    proposed_action: "Add authority-bearing concepts or attributes for each parallel
      value: a canonical RatingScaleMapping with owner/version/effective period;
      a LimitAuthority or LimitSnapshot separating approved_amount from CRM
      available_limit with source_system and precedence; and a governed
      ExchangeRateSource/ExchangeRate table. State which source controls each
