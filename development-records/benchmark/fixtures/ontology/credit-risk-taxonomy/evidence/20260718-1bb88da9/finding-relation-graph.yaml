  - relation_id: rel-010
    from_finding_id: finding-012
    to_finding_id: finding-014
    relation: duplicates
    root_hypothesis: Collateral is incorrectly asserted as an Exposure subtype even
      though the ontology defines it as a separate securing asset and already
      has a secured_by association.
    shared_cause: null
    rationale: "The logic and semantics findings cite the same contradiction:
      Collateral.is_a Exposure conflicts with definitions that distinguish
      exposure from collateral and with the separate Exposure secured_by
      Collateral relation. They differ only by lens emphasis."
    confidence: high
  - relation_id: rel-011
    from_finding_id: finding-013
    to_finding_id: finding-018
    relation: shared_cause_candidate
    root_hypothesis: RiskAppetite is specified in prose without a complete
      attribute-level and graph-level relation to the ExposureAggregate it
      governs.
    shared_cause:
      cause_claim: RiskAppetite compliance depends on comparing ExposureAggregate with
        RiskAppetite, but the ontology lacks both the precise attribute-level
        predicate and a relation linking RiskAppetite into the graph.
      from_cause_ref: finding-013.cause-001
      to_cause_ref: finding-018.cause-001
    rationale: finding-013 identifies the invalid entity-level comparison instead of
      comparing total_amount to threshold. finding-018 identifies the missing
      structural edge involving RiskAppetite. Together they reflect an
      under-modeled compliance concept expressed only in prose.
    confidence: high
  - relation_id: rel-012
    from_finding_id: finding-005
    to_finding_id: finding-008
    relation: shared_cause_candidate
    root_hypothesis: The ontology models stateful risk records primarily as current
      values rather than lifecycle- and history-bearing concepts.
    shared_cause:
      cause_claim: Missing effective periods, history, lifecycle states, or correction
        events prevents consistent reconstruction of past or terminal states for
        risk/reporting objects.
      from_cause_ref: finding-005.cause-002
      to_cause_ref: finding-008.cause-003
    rationale: finding-005 focuses on point-in-time reconstruction for
      time-dependent inputs, while finding-008 focuses on lifecycle states from
      creation through closure and correction. Both point to insufficient
      temporal/lifecycle modeling for shared risk and reporting interpretation.
    confidence: medium
  - relation_id: rel-013
