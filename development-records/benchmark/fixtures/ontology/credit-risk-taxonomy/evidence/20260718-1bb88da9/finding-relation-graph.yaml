relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-015
    relation: duplicates
    root_hypothesis: The ontology lacks an authoritative internal mapping and
      governance boundary for overlapping credit-grade concepts, allowing
      consumer-specific grade meanings.
    shared_cause: null
    rationale: "Both findings target the same rating-grade authority defect: three
      coexisting grade scales, consumer-side conversion, and manual adjustment
      create divergent shared meaning for engine and reporting classifications.
      finding-001 frames the purpose/authority drift; finding-015 frames the
      semantic overlap, but the evidence and proposed fix substantially
      coincide."
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-001
    to_finding_id: finding-009
    relation: same_root_candidate
    root_hypothesis: Rating conversion is not modeled as a governed, versioned
      ontology concept, so grade meaning and continuity are delegated to
      external wiki or consumer implementations.
    shared_cause: null
    rationale: finding-001 identifies ungoverned rating conversion and override
      authority; finding-009 identifies the same missing versioned mapping as an
      evolution risk when rating scales change. Both causal paths point to
      conversion authority outside the ontology rather than a canonical internal
      mapping.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-006
    to_finding_id: finding-015
    relation: shared_cause_candidate
    root_hypothesis: The ontology acknowledges multiple cross-system sources but
      does not promote their authority, precedence, and conflict rules into
      governed concepts.
    shared_cause:
      cause_claim: No canonical source, precedence rule, owner, version, or
        conflict-resolution concept is modeled for shared grade conversion and
        other cross-system values.
      from_cause_ref: finding-006.cause-002
      to_cause_ref: finding-015.cause-003
    rationale: finding-006 generalizes the missing single-authority pattern across
      mappings, limits, and exchange rates; finding-015 is the rating-grade
      semantic instance of that pattern. The findings share the consumer-side
      conversion cause and differ mainly in breadth.
    confidence: high
  - relation_id: rel-004
    from_finding_id: finding-004
    to_finding_id: finding-001
    relation: symptom_of
    root_hypothesis: Manual grade override provenance is a concrete symptom of the
      broader absence of governed rating override authority and precedence in
      the ontology.
    shared_cause: null
    rationale: finding-001 states that manual reporting adjustments lack canonical
      precedence and audit semantics. finding-004 narrows that to the missing
      override action, actor, timestamp, rationale, approval, and
      source-versus-adjusted value needed to audit those adjustments.
    confidence: high
  - relation_id: rel-005
    from_finding_id: finding-019
    to_finding_id: finding-015
    relation: symptom_of
    root_hypothesis: The missing structural derivation edge from RiskRating.grade to
      Exposure.risk_grade is a graph-level symptom of the absent authoritative
      semantic mapping among grade concepts.
    shared_cause: null
    rationale: finding-015 says the grade concepts overlap without ontology-governed
      mapping; finding-019 shows the required derivation is only prose and not
      represented structurally. The structural gap reinforces the same missing
      grade lineage/authority rather than a separate root.
    confidence: medium
  - relation_id: rel-006
    from_finding_id: finding-002
    to_finding_id: finding-010
    relation: same_root_candidate
    root_hypothesis: Limit-utilization is modeled without versioned calculation
      inputs for data cutoff, calculation time, FX source, and external limit
      source authority.
    shared_cause: null
    rationale: finding-002 focuses on stale month-end aggregate use as current
      utilization; finding-010 focuses on evolution fragility from unstated
      calculation time, FX authority, and CRM limit source changes. Both arise
      because utilization inputs are not modeled as governed, time-bound
      calculation inputs.
    confidence: high
  - relation_id: rel-007
    from_finding_id: finding-002
    to_finding_id: finding-017
    relation: shared_cause_candidate
    root_hypothesis: The utilization rule lacks stable authority and semantics for
      its numerator, denominator, and currency basis.
    shared_cause:
      cause_claim: Limit utilization uses ExposureAggregate.total_amount and
        Limit.approved_amount while leaving denominator meaning, CRM
        available-limit contribution, and per-system FX conversion authority
        unresolved.
      from_cause_ref: finding-002.cause-003
      to_cause_ref: finding-017.cause-003
    rationale: finding-002 emphasizes freshness ambiguity in the numerator and
      denominator; finding-017 emphasizes semantic ambiguity in approved versus
      available limit and FX basis. Both are supported by the same utilization
      rule using a cross-system aggregate and limit amount without authoritative
      calculation semantics.
    confidence: high
  - relation_id: rel-008
    from_finding_id: finding-005
    to_finding_id: finding-010
    relation: shared_cause_candidate
    root_hypothesis: Point-in-time reconstruction fails because time-dependent risk
      calculation inputs are not consistently represented with validity, source,
      or version metadata.
    shared_cause:
      cause_claim: Classification and utilization depend on values whose calculation
        time, effective interval, FX source, or external source version are
        absent from the ontology.
      from_cause_ref: finding-005.cause-003
      to_cause_ref: finding-010.cause-005
    rationale: finding-005 covers missing point-in-time validity for ratings,
      limits, mappings, and exchange rates. finding-010 is the evolution-focused
      version for utilization when data cycles, FX policy, or CRM sources
      change. The common defect is missing temporal/versioned authority for
      calculation inputs.
    confidence: high
  - relation_id: rel-009
    from_finding_id: finding-003
    to_finding_id: finding-007
    relation: duplicates
    root_hypothesis: Default/delinquency status is excluded as a separate-system
