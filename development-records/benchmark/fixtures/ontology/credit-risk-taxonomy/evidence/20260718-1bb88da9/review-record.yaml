      problem_definition: Multiple rating scales lack an ontology-owned, versioned
        conversion authority for shared grade meaning.
      issue_statement: "The ontology lets multiple rating scales coexist without an
        ontology-owned conversion authority, weakening shared grade meaning and
        change continuity across risk engine and reporting consumers. Source
        finding context: credit-risk-ontology.yaml / classification_rules[0] and
        notes[0] Source finding context: Embedded Materialized Input: target
        header states the ontology is a shared authority document for risk
        engine and reports; classification_rules[0] says `Exposure.risk_grade`
        is derived from `RiskRating.grade` but can be manually adjusted by the
        reporting team; notes[0] says the three rating scales coexist and
        conversion is performed by each consuming system. Source finding
        context: Shared concept authority is weakened by delegating rating-scale
        conversion and report-grade override authority to consumers. Source
        finding context: For an ontology whose stated purpose is to provide
        shared conceptual authority, the rating concepts are purpose-critical
        because risk engines and reports both depend on them. Letting each
        consumer perform its own conversion, while also allowing one consumer
        group to override a derived grade, creates ungoverned local authority
        over a core risk classification. This is a value/purpose drift: local
        reporting flexibility is accepted without a declared governance seat,
        precedence rule, audit trail, or canonical mapping, so the shared basis
        can diverge exactly where shared meaning is most needed. Source finding
        context: Make one canonical authority path for rating conversion and
        overrides: define the authoritative mapping among the three grade scales
        in the ontology or a governed referenced artifact, specify precedence
        between engine-derived and manually adjusted grades, and require
        override reason, actor, timestamp/as_of, and audit status if
        report-grade adjustments remain allowed. Source finding context:
        .onto/review/20260718-1bb88da9/round1/axiology.findings.yaml#axiology-c\
