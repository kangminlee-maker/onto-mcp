    - issue_id: issue-012
      candidates: *a7
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "This is the semantic form of the Collateral inheritance defect:
        downstream systems could count, filter, validate, or report collateral
        under exposure semantics. Source finding context:
        credit-risk-ontology.yaml entities.Collateral Source finding context:
        Embedded Materialized Input: Collateral.definition = \"익스포저를 담보하는 자산. 담보
        평가의 기본 단위.\" and Collateral.is_a = Exposure Source finding context:
        Collateral is semantically misclassified as an Exposure subtype. Source
        finding context: The embedded target defines Exposure as credit exposure
        to a borrower, while Collateral is defined as an asset that secures an
        exposure. These are different ontological types: a credit
        obligation/position versus a securing asset. Because the artifact is
        intended as a shared concept authority for risk engines and reporting
        systems, this subtype assertion can cause consumers to inherit exposure
        semantics for collateral records and misinterpret collateral assets as
        exposure instances. Source finding context: Remove `Collateral.is_a:
        Exposure`; keep Collateral as a separate entity and express the
        relationship through `Exposure secured_by Collateral` or an equivalent
        association with explicit cardinality/role. Source finding context:
        .onto/review/20260718-1bb88da9/round1/semantics.findings.yaml#semantics\
        -candidate-001 Source finding context: The ontology's declared purpose
        as a shared concept authority for risk engine and reporting systems
        covering exposures, grades, limits, and collateral. Source finding
        context: When a consuming engine or report treats subtype assertions as
        inheritance or classification authority, Collateral becomes an Exposure
        instance despite the definitions distinguishing collateral assets from
        credit exposures. Source finding context: This weakens trust in the
        shared taxonomy because a foundational entity boundary is semantically
        wrong, allowing collateral records to be counted, filtered, validated,
        or reported under exposure semantics. Source finding context: The
        ontology uses subtype inheritance for Collateral even though its own
        definitions only support an associative securing relationship to
        Exposure. Source finding context: Collateral is asserted as a subtype of
        Exposure via `is_a: Exposure`. Source finding context: The definitions
        distinguish Exposure as a credit exposure to a borrower and Collateral
        as an asset that secures an exposure. Source finding context: The same
        model already has an associative relation `Exposure secured_by
        Collateral`, so the subtype assertion is not needed to express the
        securing relationship."
