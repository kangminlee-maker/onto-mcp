      rationale: "The formula can be implemented with different as-of, cutoff, FX, and
        denominator semantics, directly weakening shared risk-control values
        across systems. Source finding context: credit-risk-ontology.yaml /
        ExposureAggregate and Limit utilization rule Source finding context:
        Embedded Materialized Input: `ExposureAggregate.total_amount` is stored
        from a month-end batch and intraday new loans are excluded until the
        next batch; `classification_rules[1]` defines limit utilization as
        `ExposureAggregate.total_amount / Limit.approved_amount`;
        `Limit.approved_amount` notes CRM available_limit is jointly managed.
        Source finding context: A stale batch aggregate is used as the
        authoritative numerator for limit utilization without temporal freshness
        boundaries. Source finding context: The declared purpose is a shared
        concept basis for risk engine and reporting. A limit utilization concept
        used for credit risk control is purpose-critical, but the model bakes in
        a known temporal lag without naming it as a stale snapshot, without
        defining when it is valid for decisions, and without separating
        reporting snapshot semantics from real-time risk-control semantics. This
        accepts a hidden tradeoff: operational convenience of batch storage over
        timely risk appetite and limit visibility. Source finding context:
        Define separate concepts for batch reporting exposure and
        decision-current exposure, require `as_of`/calculation timestamp and
        source freshness on both numerator and denominator, and constrain
        limit-utilization use by context, for example `reporting_utilization`
        versus `decision_utilization`. Source finding context:
        .onto/review/20260718-1bb88da9/round1/axiology.findings.yaml#axiology-c\
        andidate-002 Source finding context: The ontology's purpose as a shared
