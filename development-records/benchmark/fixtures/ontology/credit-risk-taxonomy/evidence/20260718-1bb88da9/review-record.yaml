        finding context: Risk engine or reports can understate utilization and
        risk appetite pressure, making the shared ontology operationally
        misleading for control decisions or cross-system reconciliation. Source
        finding context: The ontology does not separate reporting snapshots from
        decision-current exposure/limit semantics despite using the stale
        aggregate in a control formula. Source finding context: The target
        defines borrower total exposure as an aggregate of all exposure amounts.
        Source finding context: The stored aggregate is only calculated by
        month-end batch and omits intraday new lending until the next batch.
        Source finding context: The ontology uses that stored aggregate directly
        as the numerator for limit utilization. Source finding context: The
        denominator is also cross-system because `Limit.approved_amount` is
        jointly managed with CRM `available_limit`, but no common freshness or
        as-of rule is defined for the utilization calculation. Source finding
