findings:
  - candidate_id: coverage-candidate-001
    target: "credit-risk-ontology.yaml / classification_rules: Exposure.risk_grade
      manual adjustment"
    evidence_anchor: "Embedded Materialized Input: classification_rules[0] says
      Exposure.risk_grade is derived from RiskRating.grade but the reporting
      team may manually adjust it based on market conditions;
      Exposure.risk_grade has only the adjusted enum value and no adjustment
      evidence attributes or entity."
    claim: Manual risk-grade overrides are in scope but the ontology lacks audit
      evidence concepts for the override action.
    what: The ontology permits reporting-team manual adjustment of
      Exposure.risk_grade, but it does not model who adjusted the grade, when,
      from what source value, on what basis, or under what approval/control
      event.
    why: A shared concept authority for a risk engine and reporting system must let
      both systems distinguish engine-derived grades from manually adjusted
      reported grades. The target explicitly allows manual adjustment, while the
      only modeled grade-bearing attributes are Borrower.internal_rating,
      RiskRating.grade, and Exposure.risk_grade. None of the entities or
      relations capture an override action, actor, timestamp, rationale,
      approval, or prior/current grade pair, so the reporting value cannot be
      reconstructed or audited from the ontology itself.
    how_to_fix: Add a bounded override/audit concept such as RiskGradeAdjustment
      with exposure_ref, source_rating_ref or source_grade, adjusted_grade,
      actor, adjusted_at, reason/market_basis, approval_ref/status, and
      effective period; relate Exposure.risk_grade to the latest effective
      approved adjustment or the derived RiskRating mapping when no adjustment
      exists.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: The ontology is intended as a shared concept authority for the
        risk engine and reporting system.
      failure_condition: When Exposure.risk_grade is manually changed by the reporting
        team, downstream users cannot tell whether a reported grade is
        engine-derived or adjusted, nor reconstruct the actor, time, and basis
        for the reported value.
      impact: This weakens auditability and cross-system trust for a core risk
        classification value, especially because the target itself authorizes
        manual changes to that value.
      evidence_refs:
        - "Embedded Materialized Input: header comment states the ontology is a
          shared concept authority for risk engine and reporting systems."
        - "Embedded Materialized Input: Exposure.risk_grade note says it is used
          by the reporting team."
        - "Embedded Materialized Input: classification_rules[0] permits
          reporting-team manual adjustment of Exposure.risk_grade."
        - "Embedded Materialized Input: entities list contains no
          adjustment/audit/approval evidence entity or attributes for risk-grade
          overrides."
    causal_path:
      root_cause_candidate: The ontology models adjusted risk grade as a bare Exposure
        attribute while placing the manual adjustment rule only in free-text
        classification_rules.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: Exposure.risk_grade is represented as a single enum attribute on
            Exposure.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Exposure.attributes.risk_grade
              values [AAA, AA, A, BBB, BB, B, CCC]."
        - cause_id: coverage-candidate-001.cause-002
          claim: The classification rule permits the reporting team to manually adjust
            that value based on market conditions.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: classification_rules[0]."
        - cause_id: coverage-candidate-001.cause-003
          claim: No entity or attribute captures the manual adjustment action, actor,
            timestamp, basis, approval, or source-versus-adjusted value.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: entities Borrower, Exposure,
              Collateral, RiskRating, Limit, ExposureAggregate, RiskAppetite and
              their listed attributes."
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-002
    target: credit-risk-ontology.yaml / rating and exchange-rate dependent values
    evidence_anchor: "Embedded Materialized Input: RiskRating.grade has no effective
      date; Borrower.internal_rating has no time fields; Exposure.risk_grade has
      no effective date; classification_rules[1] uses each system's same-day
      exchange-rate table, but no exchange-rate concept exists."
    claim: Time-dependent classification inputs are modeled without validity periods
      or history, preventing point-in-time reconstruction.
    what: The ontology contains several values whose meaning changes over time,
      including borrower/internal ratings, engine ratings, exposure risk grades,
      LTV/appraisals, limits, aggregates, and exchange-rate conversion inputs.
      Only Collateral.appraised_at and ExposureAggregate.as_of provide
      timestamps; rating scales, grade mappings, approved limits, and currency
      conversion rates have no validity or history concept.
    why: The review target is a shared concept basis for risk calculation and
      reporting. For historical reports or replayed risk-engine decisions, both
      systems need the value that was valid at the relevant point in time. The
      target explicitly mentions monthly batch aggregate timing and same-day
      exchange-rate tables, but the ontology lacks effective_from/effective_to,
      as_of, version, or source-table references for several time-dependent
      inputs, so historical utilization and grade outputs cannot be
      reconstructed from the concept model.
    how_to_fix: "Introduce temporal validity consistently for time-dependent
      concepts: add effective_from/effective_to or as_of/version fields to
      RiskRating, Borrower rating, Exposure.risk_grade, Limit.approved_amount,
      and any mapping table; add an ExchangeRate or CurrencyConversionRate
      concept with source_system/table authority, currency pair, rate_date/time,
      and rate value."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: The ontology is meant to support shared risk-engine and
        reporting interpretation of credit-risk values.
      failure_condition: For a prior reporting date or risk decision, the systems need
        to reconstruct the rating, limit, mapping, and exchange-rate values
        valid at that time, but the ontology only stores current or undated
        values for several inputs.
      impact: This can make historical reports non-reproducible and risk calculations
        inconsistent across systems because point-in-time authority is absent
        for core classification inputs.
      evidence_refs:
        - "Embedded Materialized Input: Borrower.internal_rating has no validity
          or as_of attributes."
        - "Embedded Materialized Input: RiskRating.grade and score have no
          validity or as_of attributes."
        - "Embedded Materialized Input: Exposure.risk_grade and ltv lack
          validity fields; ltv note says it is entered at review time."
        - "Embedded Materialized Input: Limit.approved_amount has no
          approval/effective date."
        - "Embedded Materialized Input: classification_rules[1] says currency
          conversion uses each system's same-day exchange-rate table, but no
          exchange-rate entity is defined."
        - "Embedded Materialized Input: ExposureAggregate.total_amount has as_of
          and a monthly batch note, showing at least one temporal value is
          recognized."
    causal_path:
      root_cause_candidate: Temporal coverage is applied only selectively rather than
        as a concept dimension for all point-in-time risk inputs.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: Some concepts include point-in-time markers, such as
            Collateral.appraised_at and ExposureAggregate.as_of.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Collateral.attributes.appraised_at."
            - "Embedded Materialized Input: ExposureAggregate.attributes.as_of."
        - cause_id: coverage-candidate-002.cause-002
          claim: Other time-dependent values, including ratings, risk grades, approved
            limits, and exchange rates, lack equivalent validity/history fields
            or entities.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: Borrower.internal_rating,
              RiskRating.grade/score, Exposure.risk_grade,
              Limit.approved_amount, classification_rules[1]."
        - cause_id: coverage-candidate-002.cause-003
          claim: Because classification and utilization calculations depend on those
            values, historical outputs cannot be reconstructed from the ontology
            alone.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: classification_rules[0] and
              classification_rules[1]."
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: credit-risk-ontology.yaml / multi-system managed values and grade scales
    evidence_anchor: "Embedded Materialized Input: RiskRating.grade note sends
      mapping to a risk-team wiki; Limit.approved_amount note says approval
      system records it and CRM available_limit is managed together;
      classification_rules[1] uses each system's exchange-rate table; notes say
      each consuming system performs grade-scale conversion."
    claim: Values explicitly shared across systems lack a single authority concept,
      leaving consumers to reconcile competing sources themselves.
    what: "The ontology describes multiple parallel sources or consumers for core
      values: three rating scales with conversion delegated to each consuming
      system, a mapping table outside the ontology in a wiki, approved limits in
      an approval system plus available limits in CRM, and currency conversion
      using each system's own exchange-rate table. It does not model a canonical
      source of truth, authority precedence, or governed mapping/rate source for
      these values."
    why: Coverage of single authority is required when values are managed across
      systems. The target's declared purpose is to be a shared concept
      authority, but several fields are explicitly delegated to external or
      per-consumer sources without an authoritative entity, relation, or
      precedence rule. That omission means the risk engine and reporting system
      can legally produce different grade mappings, limit utilization, or
      currency-converted values while still conforming to the ontology text.
    how_to_fix: "Add authority-bearing concepts or attributes for each parallel
      value: a canonical RatingScaleMapping with owner/version/effective period;
      a LimitAuthority or LimitSnapshot separating approved_amount from CRM
      available_limit with source_system and precedence; and a governed
      ExchangeRateSource/ExchangeRate table. State which source controls each
      calculation and how conflicts are resolved."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: The artifact declares itself the shared concept authority for
        risk engine and reporting systems.
      failure_condition: When systems disagree on grade conversion, available limit,
        or exchange rate, the ontology provides no authoritative source or
        precedence rule to resolve the discrepancy.
      impact: The shared ontology fails its authority purpose for central
        risk/reporting calculations and allows inconsistent but
        ontology-compliant outputs across consuming systems.
      evidence_refs:
        - "Embedded Materialized Input: header comment says the ontology targets
          shared concepts for risk engine and reporting systems."
        - "Embedded Materialized Input: RiskRating.grade note says mapping table
          is in the risk-team wiki."
        - "Embedded Materialized Input: notes say three grade scales coexist and
          each consuming system performs conversion."
        - "Embedded Materialized Input: Limit.approved_amount note says approval
          system records it and CRM available_limit is jointly managed."
        - "Embedded Materialized Input: classification_rules[1] says different
          systems use their own same-day exchange-rate tables."
    causal_path:
      root_cause_candidate: The ontology acknowledges cross-system coexistence but
        does not promote mapping, limit availability, or exchange-rate authority
        into governed ontology concepts.
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: The target declares multiple system-specific sources for grade
            conversion, limits, and exchange rates.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: RiskRating.grade note,
              Limit.approved_amount note, classification_rules[1], notes[0]."
        - cause_id: coverage-candidate-003.cause-002
          claim: No entity or relation names a canonical source, precedence rule, owner,
            version, or conflict-resolution concept for those values.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: complete entities and relations
              list."
        - cause_id: coverage-candidate-003.cause-003
          claim: Therefore the risk engine and reporting system can each use different
            external mappings or rates while remaining inside the documented
            ontology.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: classification_rules[1] and
              notes[0]."
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: credit-risk-ontology.yaml / credit risk domain scope
    evidence_anchor: "Embedded Materialized Input: notes[1] excludes
      delinquency/default status as outside scope; entity list contains
      Borrower, Exposure, Collateral, RiskRating, Limit, ExposureAggregate,
      RiskAppetite only."
    claim: Default/delinquency risk status is excluded despite being a central
      credit-risk lifecycle area, leaving the ontology under-covered for
      credit-risk reporting.
    what: The ontology explicitly excludes delinquency/default status because
      another system handles it, and it does not include a reference, status
      projection, or lifecycle hook for default, delinquency, cure, write-off,
      closure, or similar credit-risk outcome states.
    why: From a coverage perspective, a credit-risk classification ontology shared
      by risk and reporting needs at least a conceptual place for adverse credit
      states, even if operational ownership belongs to another system. The
      target defines exposure, ratings, limits, collateral, aggregate exposure,
      and risk appetite, but omits the lifecycle/outcome states that determine
      whether credit risk has materialized. Because the note makes the omission
      intentional, the gap is inside the declared target boundary rather than
      merely unknown external detail.
    how_to_fix: Add a minimal externally-owned CreditRiskStatus or
      DelinquencyDefaultStatus projection with borrower/exposure reference,
      status enum, source_system=delinquency management, as_of/effective period,
      and lifecycle states such as current, delinquent, defaulted, cured,
      written_off, closed, or explicitly define why reports and engines must
      never consume that status through this ontology.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: The ontology presents itself as a credit-risk classification
        model for lending risk management and shared risk/reporting concepts.
      failure_condition: Risk reports or engine classifications that need to combine
        ratings/exposure with delinquency or default status cannot do so through
        the shared ontology.
      impact: The ontology covers pre-default exposure and rating concepts but lacks a
        central outcome/lifecycle dimension, which can fragment credit-risk
        reporting across systems.
      evidence_refs:
        - "Embedded Materialized Input: header comment describes a credit-risk
          management concept model for exposures, ratings, limits, and
          collateral."
        - "Embedded Materialized Input: notes[1] says delinquency/default status
          is out of scope because a separate delinquency-management system
          handles it."
        - "Embedded Materialized Input: entities list lacks any
          default/delinquency/status lifecycle concept."
    causal_path:
      root_cause_candidate: The ontology treats system ownership of
        delinquency/default handling as a reason to omit the concept from the
        shared classification model.
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: The target explicitly states delinquency/default status is outside the
            ontology scope because another system handles it.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: notes[1]."
        - cause_id: coverage-candidate-004.cause-002
          claim: No replacement projection, reference, or lifecycle status concept is
            modeled in the entity or relation set.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: entities and relations list."
        - cause_id: coverage-candidate-004.cause-003
          claim: As a result, the shared credit-risk model cannot cover materialized
            credit-risk state across the risk/reporting boundary.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: target header and notes[1]."
      unresolved_beyond_evidence: The bounded packet does not provide external domain
        standards, so materiality is based on the artifact's own credit-risk and
        shared reporting purpose rather than an external regulatory taxonomy.
  - candidate_id: coverage-candidate-005
    target: credit-risk-ontology.yaml / lifecycle coverage for limits, exposures,
      collateral, and risk appetite
    evidence_anchor: "Embedded Materialized Input: entities define
      Limit.approved_amount, Exposure.amount/product_type,
      Collateral.appraised_value/appraised_at, RiskAppetite.compliance_status,
      but no lifecycle states or termination/archive/disposal fields."
    claim: Stateful credit-risk objects lack lifecycle coverage from creation
      through closure, expiry, archival, or post-close correction.
    what: The ontology defines current attributes for exposures, limits, collateral,
      and risk appetite compliance, but it does not define lifecycle states such
      as proposed, approved, active, suspended, expired, closed, released,
      revalued, breached, remediated, archived, or corrected/reissued after
      reporting close.
    why: Lifecycle coverage matters for shared risk/reporting concepts because
      calculations and reports often distinguish active exposure from closed
      exposure, approved limit from expired limit, pledged collateral from
      released collateral, and current breach from remediated breach. The target
      has a compliance_status enum for RiskAppetite and an appraised_at
      timestamp for Collateral, but no lifecycle model for the objects whose
      states affect inclusion, aging, and correction behavior.
    how_to_fix: Add lifecycle/status attributes or separate lifecycle event concepts
      for Exposure, Limit, Collateral, and RiskAppetiteCompliance, including
      effective timestamps, terminal states, and correction/reissue events after
      a reporting period closes.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: The ontology is meant to provide shared concepts for risk
        engine calculations and reporting outputs.
      failure_condition: When an exposure closes, a limit expires, collateral is
        released/revalued, or a breach is remediated/corrected after reporting
        close, the ontology has no concept to represent the state transition or
        terminal condition.
      impact: Risk engines and reports may include or exclude objects inconsistently
        because the shared taxonomy does not cover lifecycle state or
        post-terminal corrections.
      evidence_refs:
        - "Embedded Materialized Input: Exposure attributes contain identity,
          borrower, amount, product_type, risk_grade, and ltv but no
          status/lifecycle fields."
        - "Embedded Materialized Input: Limit attributes contain approved_amount
          and currency but no approval date, expiry, active/closed status, or
          lifecycle event."
        - "Embedded Materialized Input: Collateral attributes contain
          appraised_value and appraised_at but no pledged/released/revalued
          lifecycle status."
        - "Embedded Materialized Input: RiskAppetite.compliance_status has
          compliant/breached only, with no remediation, closure, or correction
          states."
    causal_path:
      root_cause_candidate: The ontology represents risk objects as current-value
        records instead of lifecycle-bearing records or event histories.
      root_cause_step_id: coverage-candidate-005.cause-003
      steps:
        - cause_id: coverage-candidate-005.cause-001
          claim: The entity attributes emphasize current values and identifiers for
            Exposure, Limit, Collateral, and RiskAppetite.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: entity attribute lists."
        - cause_id: coverage-candidate-005.cause-002
          claim: Lifecycle states and lifecycle events are absent for those entities,
            except for the narrow compliant/breached status on RiskAppetite.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: RiskAppetite.compliance_status
              values [compliant, breached]; no other lifecycle statuses are
              listed."
        - cause_id: coverage-candidate-005.cause-003
          claim: This absence prevents consistent representation of active versus
            terminal, remediated, released, or corrected records.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: complete entity and relation
              coverage."
      unresolved_beyond_evidence: null
