  - issue_id: issue-008
    root_cause_hypothesis: The ontology represents risk objects as current-value
      records instead of lifecycle-bearing records or event histories.
    root_confidence: high
    surface_finding_ids:
      - finding-008
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: Stateful credit-risk objects lack lifecycle coverage for
      closure, expiry, release, remediation, archival, or post-close correction.
    proposed_action: Add lifecycle/status attributes or lifecycle event concepts for
      Exposure, Limit, Collateral, and RiskAppetiteCompliance with effective
      timestamps and terminal/correction states.
    affected_purpose: Shared concepts for risk-engine calculations and reporting outputs.
    failure_condition: When exposures close, limits expire, collateral is released
      or revalued, or breaches are remediated after reporting close, no ontology
      concept represents the transition or terminal state.
    impact: Risk engines and reports may include, exclude, or correct objects
      inconsistently because lifecycle state is not part of the shared taxonomy.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/coverage.findings.yaml#coverage-candidate-005
      - "Embedded Materialized Input: Exposure attributes contain identity,
        borrower, amount, product_type, risk_grade, and ltv but no
        status/lifecycle fields."
      - "Embedded Materialized Input: Limit attributes contain approved_amount
        and currency but no approval date, expiry, active/closed status, or
        lifecycle event."
      - "Embedded Materialized Input: Collateral attributes contain
        appraised_value and appraised_at but no pledged/released/revalued
        lifecycle status."
      - "Embedded Materialized Input: RiskAppetite.compliance_status has
        compliant/breached only, with no remediation, closure, or correction
        states."
      - "Embedded Materialized Input: entities define Limit.approved_amount,
        Exposure.amount/product_type, Collateral.appraised_value/appraised_at,
        RiskAppetite.compliance_status, but no lifecycle states or
        termination/archive/disposal fields."
    severity: medium
    domain_threshold_used: null
