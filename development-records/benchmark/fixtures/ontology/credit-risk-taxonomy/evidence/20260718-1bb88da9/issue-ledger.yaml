  - issue_id: issue-009
    root_cause_hypothesis: Changeable business classification values are modeled as
      closed enum literals instead of governed, versioned code-set concepts.
    root_confidence: medium
    surface_finding_ids:
      - finding-011
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: Core product, collateral, segment, and grade categories require
      schema changes when business classifications change.
    proposed_action: Separate enums into versioned code-set entities with code,
      label, definition, hierarchy, status, effective period, and source
      authority, then reference those code sets from attributes.
    affected_purpose: The ontology's extensibility and shared classification basis
      for risk engine and reporting systems.
    failure_condition: When new product types, collateral types, borrower segments,
      or grade codes are added or retired, the attribute enum itself must be
      changed.
    impact: Classification change becomes a schema and consumer deployment problem
      rather than governed data/code-set management, increasing compatibility
      risk.
