  - issue_id: issue-005
    root_cause_hypothesis: Temporal coverage is applied only selectively rather than
      as a concept dimension for all point-in-time risk inputs.
    root_confidence: high
    surface_finding_ids:
      - finding-005
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: Time-dependent ratings, limits, mappings, and exchange rates
      lack validity periods or history, preventing point-in-time reconstruction.
    proposed_action: Add effective/as_of/version semantics to all time-dependent
      risk inputs and introduce an authoritative exchange-rate concept with
      source and rate timing.
    affected_purpose: Shared risk-engine and reporting interpretation of historical
      and current credit-risk values.
    failure_condition: For a prior reporting date or risk decision, systems need the
      rating, limit, mapping, or FX value valid at that time, but the ontology
      only provides current or undated values.
    impact: Historical reports and risk calculations can become non-reproducible or
      inconsistent because point-in-time authority is absent for core inputs.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/coverage.findings.yaml#coverage-candidate-002
      - "Embedded Materialized Input: Borrower.internal_rating has no validity
