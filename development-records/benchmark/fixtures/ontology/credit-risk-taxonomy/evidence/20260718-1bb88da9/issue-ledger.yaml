      instead of making the semantic mapping part of the shared concept model.
    root_confidence: high
    surface_finding_ids:
      - finding-015
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: Three credit-grade concepts overlap semantically but lack an
      authoritative ontology-internal mapping.
    proposed_action: Define canonical grade concepts and authority boundaries, or
      split borrower internal rating, engine borrower rating, and report
      exposure grade with governed mappings and override semantics.
    affected_purpose: Shared concept authority for ratings used in risk
      classification and reporting.
    failure_condition: When engine and reporting consumers translate among
      Borrower.internal_rating, RiskRating.grade, and Exposure.risk_grade, each
      may apply different conversion or manual override semantics.
    impact: The ontology cannot prove whether systems are referring to the same
      risk-grade meaning, allowing classification disagreement under an
      apparently shared taxonomy.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/semantics.findings.yaml#semantics-candidate-002
      - "Embedded Materialized Input: Borrower.internal_rating note"
      - "Embedded Materialized Input: RiskRating.grade note"
      - "Embedded Materialized Input: Exposure.risk_grade note"
      - "Embedded Materialized Input: classification_rules first rule"
      - "Embedded Materialized Input: notes first item"
      - "Embedded Materialized Input: Borrower.internal_rating values are
