issues:
  - issue_id: issue-001
    root_cause_hypothesis: Rating conversion is not modeled as a governed, versioned
      ontology concept, so grade meaning and continuity are delegated to
      external wiki or consumer implementations.
    root_confidence: high
    surface_finding_ids:
      - finding-001
      - finding-009
    relation_refs:
      - rel-002
    raised_by_lens_ids:
      - axiology
      - evolution
    issue_statement: The ontology lets multiple rating scales coexist without an
      ontology-owned conversion authority, weakening shared grade meaning and
      change continuity across risk engine and reporting consumers.
    proposed_action: Promote rating scales and mappings into governed, versioned
      ontology concepts with source authority, effective periods, precedence,
      and explicit handling for reporting overrides.
    affected_purpose: The shared concept authority for risk-engine and
      reporting-system credit-risk grades, including continuity after rating
      scale changes.
    failure_condition: When grade scales are converted, manually adjusted, or
      changed, consumers rely on external wiki mappings or local implementations
      instead of an ontology-governed mapping.
    impact: The same borrower or exposure can be classified differently across
      systems while still appearing compliant with the shared ontology,
      weakening risk decisions, reports, and historical comparability.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/axiology.findings.yaml#axiology-candidate-001
      - "Embedded Materialized Input: target description says the ontology aims
        to be a shared concept authority for risk engine and reporting systems."
      - "Embedded Materialized Input: `classification_rules[0]` permits
        reporting-team manual adjustment of `Exposure.risk_grade`."
      - "Embedded Materialized Input: `notes[0]` leaves conversion among the
        three rating scales to each consuming system."
      - "Embedded Materialized Input: target header states the ontology is a
        shared authority document for risk engine and reports;
        classification_rules[0] says `Exposure.risk_grade` is derived from
        `RiskRating.grade` but can be manually adjusted by the reporting team;
        notes[0] says the three rating scales coexist and conversion is
        performed by each consuming system."
      - .onto/review/20260718-1bb88da9/round1/evolution.findings.yaml#evolution-candidate-001
      - "materialized-input.md: Borrower.internal_rating note"
      - "materialized-input.md: RiskRating.grade note"
      - "materialized-input.md: Exposure.risk_grade values and note"
      - "materialized-input.md: notes entry about three scales and
