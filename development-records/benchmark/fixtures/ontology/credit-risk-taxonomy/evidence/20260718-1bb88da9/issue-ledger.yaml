  - issue_id: issue-010
    root_cause_hypothesis: The ontology uses subtype inheritance (`is_a`) to connect
      a role/entity that is explicitly defined as a separate secured asset
      rather than a credit exposure.
    root_confidence: high
    surface_finding_ids:
      - finding-012
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: Collateral is declared as an Exposure subtype even though the
      ontology defines it as a securing asset and separately relates Exposure to
      Collateral through secured_by.
    proposed_action: Remove Collateral.is_a Exposure and model collateral as a
      separate entity related to Exposure through secured_by, or introduce a
      more appropriate parent such as RiskMitigant.
    affected_purpose: The shared concept authority for risk engine and reporting systems.
    failure_condition: When systems interpret `is_a` as subtype inheritance or type
      membership, collateral instances become valid exposure instances despite
      being separately defined as securing assets.
    impact: Collateral objects can be admitted into exposure logic, aggregation, or
      reporting, undermining the shared classification contract.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/logic.findings.yaml#logic-candidate-001
      - "Embedded Materialized Input: `Exposure.definition`: 차주에 대한 신용 익스포저(대출,
        한도성 여신 포함)."
      - "Embedded Materialized Input: `Collateral.definition`: 익스포저를 담보하는 자산. 담보
        평가의 기본 단위."
      - "Embedded Materialized Input: `Collateral.is_a: Exposure`"
      - "Embedded Materialized Input: relation `{ from: Exposure, to:
        Collateral, kind: secured_by }`"
      - "Embedded Materialized Input: `Collateral.definition` states collateral
        is an asset securing an exposure, while `Collateral.is_a: Exposure`
        declares Collateral as a subtype of Exposure."
    severity: medium
    domain_threshold_used: null
    singleton_reason: Related duplicate finding exists, but no same_root_candidate
      relation connects this finding under the artifact merge contract.
  - issue_id: issue-011
    root_cause_hypothesis: The risk-appetite breach rule is stated at entity level
      even though the ontology declares the comparable quantities only as
      attributes.
    root_confidence: high
    surface_finding_ids:
      - finding-013
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: RiskAppetite breach logic compares ExposureAggregate to
      RiskAppetite as entities rather than comparing total_amount to threshold.
    proposed_action: Rewrite the rule as an attribute-level predicate and define the
      applicable aggregate/appetite scope, borrower segment, portfolio, product,
      currency, and as_of basis where needed.
    affected_purpose: Shared definition of risk appetite breach and compliance
      between risk engine and reporting systems.
    failure_condition: When consumers implement the breach predicate from the
