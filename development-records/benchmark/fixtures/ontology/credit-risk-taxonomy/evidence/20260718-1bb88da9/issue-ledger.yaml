  - issue_id: issue-003
    root_cause_hypothesis: The ontology treats an ownership boundary as a scope
      exclusion instead of modeling the boundary relation for a purpose-critical
      risk concept.
    root_confidence: high
    surface_finding_ids:
      - finding-003
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: Default and delinquency status are excluded from the shared
      credit-risk ontology without a compensating boundary concept or relation.
    proposed_action: Add an externally owned default/delinquency status projection
      with source authority, join key, as-of/effective period, and effects on
      ratings, exposure classification, limits, and reports.
    affected_purpose: The declared credit-risk management purpose and shared basis
      for risk-engine and reporting interpretation.
    failure_condition: When a borrower or exposure has delinquency/default state in
      the external system, consumers using this ontology have no defined
      boundary relation to that status.
    impact: Core credit-risk outputs can omit or inconsistently join
      purpose-critical status, weakening shared interpretation across
      stakeholders.
    evidence_refs:
      - .onto/review/20260718-1bb88da9/round1/axiology.findings.yaml#axiology-candidate-003
      - "Embedded Materialized Input: header comment describes a credit-risk
        management concept model shared by risk engine and report system."
      - "Embedded Materialized Input: `notes[1]` excludes default/delinquency
        status because it is handled by a separate system."
      - "Embedded Materialized Input: entities and relations do not include a
        relation to delinquency/default status in the materialized target."
      - "Embedded Materialized Input: notes[1] says default/delinquency status
        is outside this ontology because a separate delinquency-management
