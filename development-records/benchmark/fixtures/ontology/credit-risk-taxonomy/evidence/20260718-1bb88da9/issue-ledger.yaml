  - issue_id: issue-002
    root_cause_hypothesis: Limit-utilization is modeled without versioned
      calculation inputs for data cutoff, calculation time, FX source, and
      external limit source authority.
    root_confidence: high
    surface_finding_ids:
      - finding-002
      - finding-010
    relation_refs:
      - rel-006
    raised_by_lens_ids:
      - axiology
      - evolution
    issue_statement: The utilization formula relies on stale or system-specific
      inputs without making calculation time, freshness, FX authority, and CRM
      limit contribution part of the ontology contract.
    proposed_action: Model exposure aggregate and utilization as calculation outputs
      with calculation_as_of, data_cutoff_at, calculation version, FX
      source/date, and included limit-source components.
    affected_purpose: The shared risk-engine and reporting basis for limit
      utilization, total exposure, and risk exposure controls.
    failure_condition: When intraday lending, FX policy, CRM limit sources, or
      reporting cycles differ, systems interpret the same utilization rule with
      different input timing or authority.
    impact: Limit utilization, breach pressure, and exposure reporting can diverge
      by system or calculation time, undermining trust in the shared
      risk-control concept.
