  - issue_id: issue-004
    root_cause_hypothesis: The ontology models adjusted risk grade as a bare
      Exposure attribute while placing the manual adjustment rule only in
      free-text classification_rules.
    root_confidence: high
    surface_finding_ids:
      - finding-004
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: Manual risk-grade overrides are authorized but lack audit
      evidence concepts for actor, time, reason, approval, and
      source-versus-adjusted values.
    proposed_action: Add a bounded RiskGradeAdjustment or equivalent audit concept
      and define how Exposure.risk_grade resolves to either approved adjustment
      or derived RiskRating mapping.
    affected_purpose: The shared concept authority for risk engine and reporting classifications.
    failure_condition: When reporting manually changes Exposure.risk_grade,
      downstream users cannot reconstruct whether, when, why, or by whom the
      value was adjusted.
    impact: Auditability and cross-system trust weaken for a core risk
      classification value that the ontology itself allows reporting users to
      change.
