# Semantic gate expectations — credit-risk-taxonomy (ground-truth.yaml에서 도출).
# material_terms는 severity_expectation: material인 seeded defect의 스키마 앵커 토큰이다.
# 매칭은 소문자 부분 문자열(JSON 직렬화 + camelCase/구분자 분해 텍스트 대상).
fixture_id: credit-risk-ontology-v1
material_terms: # 전 항목 필수 (textContainsAll)
  - "internal_rating" # CRT-1 등급 스케일 3원화
  - "collateral" # CRT-2 Collateral is_a Exposure 오일반화
  - "ltv" # CRT-3 파생값(LTV) 입력 속성 승격
  # CRT-4/5는 모델이 속성명 없이 개념 수준으로 서술하는 run이 실측됨(추상화-수준 분산)
  # — ground truth의 동일 앵커 개념 표현만 그룹에 허용.
  - ["valid_from", "유효기간", "이력", "temporal", "history", "versioned", "시간 의존"] # CRT-4 등급 유효기간/이력 부재
  - ["available_limit", "합산", "crm", "한도", "limit"] # CRT-5 한도 권위 이원화 (승인 시스템 + CRM)
  - "total_amount" # CRT-7 월말 배치 집계의 구조적 staleness
  # 산문 개념 토큰은 출력 언어 분산에 대비해 동의어 그룹(any-of)로 둔다 — ground truth의 동일 앵커 개념 번역만 허용.
  - ["환율", "통화", "exchange rate", "currency"] # CRT-8 통화 속성 부재 + 시스템별 환율 환산
  - ["부실", "default", "연체"] # CRT-10 default 범위 제외가 본체 의미 파괴
expected_material_truth: >-
  CRT-1 등급 스케일 파편화 + CRT-2 담보 is-a 오류 + CRT-3 LTV 파생값 승격 +
  CRT-4 등급 시간성 부재 + CRT-5 한도 권위 이원화 + CRT-7 집계 staleness +
  CRT-8 통화 단위 무결성 부재 + CRT-10 부실 범위 제외
boundary_uncertainty_terms: [] # 이 fixture에는 seeded non-material decoy가 없다
boundary_context_terms: []
action_material_terms: # any-match
  - "internal_rating"
  - "risk_grade"
  - "등급"
action_remediation_terms: # any-match
  - "권위"
  - "단일"
  - "원본"
  - "정의"
  - "매핑"
  - "통제"
target_anchor: credit-risk-ontology.yaml
target_anchor_terms:
  - "credit-risk-ontology.yaml"
