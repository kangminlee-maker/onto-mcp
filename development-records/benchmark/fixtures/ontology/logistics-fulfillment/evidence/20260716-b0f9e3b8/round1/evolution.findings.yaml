findings:
  - candidate_id: evolution-candidate-001
    target: logistics-fulfillment-ontology.yaml — OrderLine/Shipment fulfillment model
    evidence_anchor: materialized-input.md:25-31, 105-109
    claim: 부분 출하·분할 충족을 추가하려면 기존 주문 단위 fulfills 모델을 재구성해야 한다.
    what: Shipment와 Order 사이의 주문 단위 관계만 존재하며, 어떤 OrderLine 수량이 어느 Shipment 또는
      DeliveryLeg로 충족되었는지 표현하는 확장 지점이 없다.
    why: 대상 자체가 부분 출하를 추적할 수 없다고 명시한다. 부분 출하, 백오더, 다중 창고 출하를 도입하면 단순한 새 유형 추가로 끝나지
      않고 기존 관계의 의미와 소비 로직을 함께 변경해야 하며, 과거 주문의 라인별 충족 내역도 복원할 수 없다.
    how_to_fix: OrderLine과 Shipment(필요하면 DeliveryLeg)를 잇는 FulfillmentAllocation 같은
      연관 개념을 추가하고 할당 수량·단위·유효 시점·상태를 둔다. 기존 주문 단위 fulfills는 이 연관에서 계산되는 호환용 투영으로
      유지한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 통합을 위한 주문→출하 개념 기준과 향후 충족 방식 확장성
      failure_condition: 한 주문 라인이 여러 출하로 나뉘거나 여러 라인이 부분적으로 충족되는 운영이 추가될 때
      impact: 통합 시스템들이 공통 관계를 재사용할 수 없고 기존 스키마와 소비 로직을 동시에 변경해야 하며, 과거 데이터의 의미 연속성도
        확보할 수 없다.
      evidence_refs:
        - materialized-input.md:25-31
        - materialized-input.md:105-109
    causal_path:
      root_cause_candidate: 충족을 수량을 가진 라인-출하 연관이 아니라 주문-출하 이진 관계로만 모델링했다.
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 부분 출하 시 어느 OrderLine이 어느 Shipment로 나갔는지 표현할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:25-31
        - cause_id: evolution-candidate-001.cause-002
          claim: 기존 fulfills 관계가 Shipment→Order의 주문 단위 관계로 고정되어 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:105-109
        - cause_id: evolution-candidate-001.cause-003
          claim: 라인별 충족 수량을 담는 독립 연관 개념이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:25-31
            - materialized-input.md:105-109
      unresolved_beyond_evidence: 기존 운영 데이터에서 라인별 출하 내역을 사후 복원할 수 있는지는 현재 경계의 자료로 확인할 수 없다.
  - candidate_id: evolution-candidate-002
    target: logistics-fulfillment-ontology.yaml — Order/Shipment/TrackingEvent 상태 모델
    evidence_anchor: materialized-input.md:19-22, 44-47, 60-68, 111-113
    claim: 새 캐리어 상태나 내부 상태가 추가되면 온톨로지 열거형과 개별 연동 매핑을 반복 수정해야 한다.
    what: 세 상태 체계가 닫힌 enum으로 고정되어 있고, 캐리어 상태와 Shipment 상태의 매핑은 각 연동이 독자적으로 담당한다. 매핑
      버전, 유효 기간, 미지 상태 처리도 표현되지 않는다.
    why: 외부 캐리어 코드나 OMS/TMS 상태가 변경되면 공통 기준에서 흡수할 확장 계층이 없어 enum과 여러 연동을 동시에 고쳐야 한다.
      서로 다른 시점의 매핑이 구분되지 않아 동일한 과거 이벤트가 새 규칙에서 다른 상태로 해석될 수도 있다.
    how_to_fix: 원천 시스템·원천 코드·정규 상태·매핑 버전·유효 기간을 갖는 버전형 StatusMapping 개념을 두고, 원천 이벤트는
      원래 코드 그대로 보존한다. 정의되지 않은 코드는 명시적인 unknown/unmapped 경로로 수용한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: OMS/TMS/캐리어 간 상태 통합 기준과 외부 상태 체계 변경에 대한 연속성
      failure_condition: 캐리어가 상태 코드를 추가·변경하거나 내부 OMS/TMS 워크플로가 세분화될 때
      impact: 모든 연동이 개별 수정 대상이 되고 매핑 드리프트가 누적되며, 과거 이벤트의 재해석 결과가 안정적으로 유지되지 않는다.
      evidence_refs:
        - materialized-input.md:19-22
        - materialized-input.md:44-47
        - materialized-input.md:60-68
        - materialized-input.md:111-113
    causal_path:
      root_cause_candidate: 상태 상호운용성을 버전 가능한 공통 매핑 개념으로 모델링하지 않고 닫힌 enum과 연동별 구현에 위임했다.
      root_cause_step_id: evolution-candidate-002.cause-003
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: 새 원천 상태를 수용하려면 닫힌 enum 또는 연동별 매핑을 변경해야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:19-22
            - materialized-input.md:44-47
            - materialized-input.md:63-66
        - cause_id: evolution-candidate-002.cause-002
          claim: 각 시스템이 상태를 독립 관리하고 캐리어 매핑은 각 연동이 알아서 수행한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:66
            - materialized-input.md:111-113
        - cause_id: evolution-candidate-002.cause-003
          claim: 원천 코드와 정규 상태 사이의 버전형 매핑 및 유효 시점 개념이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:60-68
            - materialized-input.md:111-113
      unresolved_beyond_evidence: 실제 연동 구현에 별도 매핑 레지스트리가 있는지는 현재 경계에서 확인할 수 없지만, 이 개념 기준 문서에는 그 계약이 없다.
  - candidate_id: evolution-candidate-003
    target: logistics-fulfillment-ontology.yaml — Sku 측정값 모델
    evidence_anchor: materialized-input.md:33-38, 40-49
    claim: 새 창고·국가·운송사를 추가하면 중량과 치수의 의미가 기존 데이터와 충돌한다.
    what: Sku.weight는 숫자만 저장하면서 kg 또는 lb를 소스 관례에 맡기고, dims는 단위 없는 문자열로 저장한다.
      Shipment.total_weight도 단위 없이 이 값들의 합으로 정의된다.
    why: 다른 단위 관례를 쓰는 시스템이 추가되면 같은 값과 문자열이 서로 다른 물리량을 뜻한다. 단위 변환 규칙과 원천 단위가 없어 기존
      데이터를 안정적으로 변환하거나 새 표준으로 이행할 수 없고, 합산 중량의 연속성도 깨진다.
    how_to_fix: 중량과 각 치수를 value+unit 구조의 Measurement로 모델링하고 표준 단위 코드, 변환 규칙, 원천 값·원천
      단위를 보존한다. dims 문자열은 길이 축별 구조로 분리하고 total_weight에는 계산 단위와 계산 버전을 기록한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 사이에서 재사용 가능한 SKU 및 화물 측정 기준
      failure_condition: kg와 lb 또는 서로 다른 길이 단위를 사용하는 창고·운송사·지역을 통합할 때
      impact: 기존 값과 신규 값의 의미를 구분할 수 없어 운송 계산과 제한 검증이 신뢰할 수 없게 되고, 단위 표준화 시 전면 데이터 정제가
        필요하다.
      evidence_refs:
        - materialized-input.md:33-38
        - materialized-input.md:40-49
    causal_path:
      root_cause_candidate: 물리량을 단위와 분리된 숫자 또는 비정형 문자열로 모델링했다.
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 서로 다른 단위 관례의 시스템을 추가하면 동일 필드 값의 의미가 충돌한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37-38
        - cause_id: evolution-candidate-003.cause-002
          claim: Shipment.total_weight가 단위 없는 SKU 중량의 합으로 저장된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:37
            - materialized-input.md:48
        - cause_id: evolution-candidate-003.cause-003
          claim: 측정값에 단위, 변환 기준, 원천 표현을 담는 구조가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:33-38
            - materialized-input.md:48
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-004
    target: logistics-fulfillment-ontology.yaml — InventoryRecord/InventoryAggregate
      시간·권위 모델
    evidence_anchor: materialized-input.md:76-90, 111-116
    claim: 새 재고 원천이나 실시간 이력을 도입하면 기존 현재값 모델로는 데이터 연속성과 원천별 의미를 유지할 수 없다.
    what: InventoryRecord에는 유효 시점과 원천/권위 구분이 없고 WMS와 ERP가 같은 quantity_on_hand 값을 각자
      가진다. InventoryAggregate도 시각이 없는 야간 스냅샷 값이며 일중 할당이 이를 직접 읽는다.
    why: 추가 WMS, 3PL, 예약 재고, 실시간 이벤트를 수용하려면 현재값 필드의 의미를 바꾸거나 별도 모델로 이관해야 한다. 원천과 시점이
      보존되지 않아 과거 값의 재현, 새 계산 규칙의 병행, 단계적 마이그레이션이 불가능하다.
    how_to_fix: 원천 시스템, 재고 의미(실물·회계·가용·예약), 관측 시각, 유효 시각, 단위와 버전을 가진
      InventoryObservation 또는 InventoryLedger를 권위 기록으로 도입한다. InventoryRecord와
      InventoryAggregate는 명시된 시점과 계산 규칙에서 생성되는 투영으로 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS/ERP 재고 통합의 권위·시간 기준 및 새로운 재고 원천에 대한 확장성
      failure_condition: 추가 창고 시스템, 3PL, 실시간 재고 이벤트 또는 새로운 가용재고 계산 규칙을 도입할 때
      impact: 기존 값의 의미와 과거 상태를 보존한 채 점진적으로 확장할 수 없고, 통합 소비자가 어느 시점의 어느 권위 값을 사용했는지 검증할
        수 없다.
      evidence_refs:
        - materialized-input.md:76-90
        - materialized-input.md:111-116
    causal_path:
      root_cause_candidate: 재고를 원천과 시간 차원을 가진 관측/원장으로 모델링하지 않고 덮어쓰는 현재값과 무시점 집계로 모델링했다.
      root_cause_step_id: evolution-candidate-004.cause-003
      steps:
        - cause_id: evolution-candidate-004.cause-001
          claim: 새 재고 원천이나 실시간 이력을 추가하면 기존 quantity 필드만으로 값들을 구분할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:76-90
            - materialized-input.md:115-116
        - cause_id: evolution-candidate-004.cause-002
          claim: WMS와 ERP가 각자 값을 가지지만 야간에 ERP 기준으로 조정한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:81-84
            - materialized-input.md:115-116
        - cause_id: evolution-candidate-004.cause-003
          claim: InventoryRecord와 InventoryAggregate에 원천 및 유효 시점 계약이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:76-90
      unresolved_beyond_evidence: 야간 조정 이전의 원천별 값이 외부 시스템에 별도로 보존되는지는 현재 경계에서 확인할 수 없다.
