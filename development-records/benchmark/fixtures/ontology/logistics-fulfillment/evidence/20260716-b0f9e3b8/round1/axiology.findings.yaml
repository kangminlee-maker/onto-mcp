  - candidate_id: axiology-candidate-002
    target: Sku.weight, Sku.dims 및 Shipment.total_weight
    evidence_anchor: "대상: materialized-input.md:33-38,40-49. 가치 권위:
      review-value-alignment-criteria.yaml:6-8 (`user-request-intent`: 통합 개념 기준의
      단위 정합성 검토). value_type=commitment; alignment_direction=misaligned."
    claim: 소스별 단위 관례를 그대로 보존하는 설계는 시스템 간 비교 가능한 단위 기준을 제공하지 못한다.
    what: 중량은 kg 또는 lb를 단위 표식 없이 숫자로 저장하고, 치수는 소스별 단위의 문자열로 두며, 이 값들로 출하 총중량을 계산한다.
    why: 같은 숫자와 문자열이 시스템마다 다른 물리량을 뜻할 수 있어 총중량, 운임, 용량 판단을 신뢰할 수 없다. 소스 편의성을 선택한 대가로
      통합 문서의 정규화 목적을 훼손한다.
    how_to_fix: 중량과 각 치수를 값·단위의 구조화된 수량으로 모델링하고 canonical 단위와 변환 규칙을 지정한다.
      `total_weight`에는 계산 단위와 구성값의 정규화 조건을 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 간 단위가 일관된 상품·화물 개념 기준 제공
      failure_condition: 서로 다른 계량 관례의 SKU가 동일 Shipment 계산 또는 시스템 간 교환에 포함될 때
      impact: 통합 문서가 값의 비교와 합산을 보장하지 못해 운영·비용 판단의 신뢰가 약화된다.
      evidence_refs:
