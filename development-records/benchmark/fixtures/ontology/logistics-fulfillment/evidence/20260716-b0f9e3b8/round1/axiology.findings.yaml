      alignment_direction=misaligned."
    claim: 분할된 재고 권위와 전일 스냅샷 기반 할당은 통합 기준 문서라는 목적에 정렬되지 않는다.
    what: WMS와 ERP가 서로 다른 현재고를 보유하고 야간에 ERP 기준으로 조정하면서, 유효시점이 없는 일일 가용재고 스냅샷을 일중 주문
      할당에도 사용한다.
    why: 어느 수량이 어떤 목적에서 권위 있는지와 값의 기준시점이 모델에 없으므로, 이 문서를 따르는 시스템도 동일 시점의 가용재고를 일관되게
      해석할 수 없다. 재고 부족, 중복 할당 또는 감사 불가능성을 감수하는 트레이드오프가 정당화되지 않았다.
    how_to_fix: 실물·회계·가용 수량별 권위 시스템을 명시하고 각 값에 `as_of`, 출처, 갱신 시각을 추가한다. 할당에는 예약을
      반영한 최신 가용수량과 허용 신선도 규칙을 사용하도록 계약화한다.
    upstream_evidence_required: false
