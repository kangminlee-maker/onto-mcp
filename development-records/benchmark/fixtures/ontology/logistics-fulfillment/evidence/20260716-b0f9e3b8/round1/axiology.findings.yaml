            - materialized-input.md:113
        - cause_id: axiology-candidate-003.cause-003
          claim: 상태 간 canonical mapping, 전이 및 충돌 권위가 정의되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:19-22
            - materialized-input.md:44-47
            - materialized-input.md:63-66
      unresolved_beyond_evidence: 각 개별 연동이 현재 어떤 매핑을 구현하는지는 경계 내 증거로 확인할 수 없다.
  - candidate_id: axiology-candidate-004
    target: OrderLine과 Shipment의 충족 관계
    evidence_anchor: "대상: materialized-input.md:25-31,105-109. 가치 권위:
      review-value-alignment-criteria.yaml:6-8 (`user-request-intent`: 주문·화물·배송
      정합성을 갖춘 통합 개념 기준). value_type=stakeholder;
      alignment_direction=misaligned."
    claim: 주문 단위 관계만 두는 단순화는 부분출하 추적이라는 핵심 주문충족 목적을 희생한다.
    what: "`fulfills`는 Shipment에서 Order로만 연결되며 어떤 OrderLine의 몇 개가 어떤 Shipment로 출하됐는지
      표현할 수 없다."
    why: 부분출하, 분할배송, 부족수량 상황에서 OMS·WMS·TMS가 동일한 충족 사실을 교환하거나 고객 문의·운영 조사를 수행할 수 없다.
      모델 단순화의 이익보다 추적성과 책임성 손실이 크지만 그 트레이드오프가 정당화되지 않았다.
    how_to_fix: OrderLine과 Shipment를 연결하며 충족 수량을 담는 `FulfillmentAllocation` 또는
      `ShipmentLine` 개념을 추가하고, Order 수준 `fulfills`는 그 합계에서 파생되도록 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문에서 재고 할당·출하·배송까지 일관된 충족 추적 기준 제공
      failure_condition: 한 주문선이 여러 화물로 분할되거나 한 화물이 일부 수량만 출하할 때
      impact: 시스템 간 충족 사실을 재구성할 수 없어 운영 조사와 고객 응대의 실행 가능성이 약화된다.
      evidence_refs:
        - materialized-input.md:25-31
        - materialized-input.md:105-109
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 관계를 주문 수준으로만 단순화하면서 수량을 가진 주문선-화물 대응 개념을 의도적으로 제외했다.
      root_cause_step_id: axiology-candidate-004.cause-002
      steps:
        - cause_id: axiology-candidate-004.cause-001
          claim: 부분출하 시 어느 주문선이 어느 Shipment로 나갔는지 추적할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:30-31
        - cause_id: axiology-candidate-004.cause-002
          claim: 유일한 충족 관계가 Shipment→Order이며 OrderLine 매핑을 두지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:105-109
      unresolved_beyond_evidence: null
  - candidate_id: axiology-candidate-005
    target: Shipment.eta의 권위와 이력
    evidence_anchor: "대상: materialized-input.md:49,115-117. 가치 권위:
      review-value-alignment-criteria.yaml:6-8 (`user-request-intent`: 권위·시간성과
      물류 운영 위험을 다루는 통합 개념 기준). value_type=tradeoff;
      alignment_direction=misaligned."
    claim: 단일 ETA 값에 캐리어 예측과 수기 판단을 혼합하는 설계는 운영 재량을 보존하는 대신 출처와 시간 신뢰성을 잃는다.
    what: ETA에는 캐리어 API 값과 운영팀 수기 조정값이 섞이며 최종 표시값은 운영팀 판단이 우선하지만, 출처·산출시각·수정자·이전값이
      모델링되지 않는다.
    why: 소비자는 ETA가 관측된 캐리어 예측인지 수기 재정의인지 구분하거나 오래된 값을 탐지할 수 없다. 운영팀 재량을 최종 권위로 선택한
      근거와 감사·복구 장치가 없어 통합 기준의 권위 및 시간성 약속을 약화한다.
    how_to_fix: ETA 추정치를 출처, 산출·수신·수정 시각, 수정 주체와 함께 이력으로 보존하고, 캐리어 값과 운영 오버라이드를
      구분한다. 최종 표시 ETA는 명시된 우선순위 규칙에서 파생한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 배송 예상시각의 권위와 시간성을 일관되게 해석하는 통합 기준 제공
      failure_condition: 운영팀이 캐리어 ETA를 수정하거나 여러 시스템이 ETA를 교환·표시할 때
      impact: 표시값의 근거와 신선도를 검증할 수 없어 고객 약속과 운영 판단의 신뢰가 약화된다.
      evidence_refs:
        - materialized-input.md:49
        - materialized-input.md:117
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 서로 다른 ETA 주장과 수기 오버라이드를 출처 있는 추정 이력으로 분리하지 않고 하나의 mutable 값으로 합쳤다.
      root_cause_step_id: axiology-candidate-005.cause-003
      steps:
        - cause_id: axiology-candidate-005.cause-001
          claim: 최종 ETA가 운영팀 판단에 따라 수기로 조정된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:49
            - materialized-input.md:117
        - cause_id: axiology-candidate-005.cause-002
          claim: 캐리어 API 값과 수기 값이 같은 ETA 속성에 혼합된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:117
        - cause_id: axiology-candidate-005.cause-003
          claim: 출처, 기준시각, 오버라이드 이력 및 파생 우선순위가 정의되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
