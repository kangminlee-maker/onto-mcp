findings:
  - candidate_id: semantics-candidate-001
    target: DeliveryLeg의 존재론적 유형과 Shipment 상속
    evidence_anchor: materialized-input.md:40-58, 105-109
    claim: 배송 구간을 전체 화물 이동인 Shipment의 하위유형으로 분류해 부분-전체 관계를 종류-하위종류 관계로 오인한다.
    what: "DeliveryLeg는 경로의 한 구간으로 정의되지만 `is_a: Shipment`로 선언되어 Shipment의 전체 이동 의미와
      속성 및 주문 충족 관계를 상속한다."
    why: 경로 구간은 일반적으로 전체 Shipment를 구성하는 부분이다. 현재 모델에서는 각 구간이 독립적인 shipment_no, 전체
      중량, 최종 배송 상태 및 Order 충족 주체로 해석될 수 있어 TMS 구간과 ERP/OMS 출하의 식별 의미가 충돌한다.
    how_to_fix: DeliveryLeg를 독립 엔티티로 두고 `part_of` 또는 `shipment_ref`로 Shipment에 연결한다.
      구간별 상태·ETA·운송사가 필요하면 구간 속성으로 명시하고 전체 Shipment 속성과 구분한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 통합을 위한 화물·배송 개념 기준
      failure_condition: TMS의 다구간 운송 데이터를 Shipment/DeliveryLeg로 교환하거나 주문 충족 관계를 해석할 때
      impact: 하나의 출하와 그 운송 구간들이 동일 종류로 취급되어 식별, 상태 집계, 주문 충족 판정이 서로 다른 시스템에서 달라질 수 있다.
      evidence_refs:
        - materialized-input.md:40-58
        - materialized-input.md:105-109
    causal_path:
      root_cause_candidate: 운송 구간과 전체 화물 이동 사이의 부분-전체 관계를 하위유형 관계로 모델링했다.
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: DeliveryLeg는 화물 경로의 한 구간으로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:52-58
        - cause_id: semantics-candidate-001.cause-002
          claim: 그 구간이 전체 물리적 화물 이동으로 정의된 Shipment의 하위유형으로 선언된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:40-54
        - cause_id: semantics-candidate-001.cause-003
          claim: Shipment와 DeliveryLeg 사이의 의미적으로 필요한 부분-전체 관계가 하위유형 관계로 대체되었다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:40-58
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: Sku.weight, Sku.dims 및 Shipment.total_weight의 단위 의미
    evidence_anchor: materialized-input.md:33-38, 40-49
    claim: 동일 숫자 속성에 kg와 lb 등 서로 다른 단위를 허용하면서 단위 식별 없이 합산 중량을 저장하므로 중량 의미가 확정되지 않는다.
    what: Sku.weight는 창고 관례에 따라 kg 또는 lb를 그대로 쓰고, dims도 소스별 단위가 다른 문자열이다.
      Shipment.total_weight는 이 중량들의 합으로 정의되지만 단위나 변환 규칙이 없다.
    why: 단위 없는 숫자는 시스템 간 동일한 물리량을 나타낸다고 보장할 수 없다. 서로 다른 단위의 값을 합산하면 total_weight라는
      파생값도 의미적으로 무효가 되어 적재, 운임, 운송사 제한 판단에 잘못 사용될 수 있다.
    how_to_fix: 중량과 각 치수를 값+단위로 모델링하고 통합 기준 단위 및 변환 규칙을 정한다. total_weight에는 계산 기준
      단위, 구성 수량, 계산 시점 또는 원천 계측값을 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 간 SKU 및 화물 물성의 일관된 교환과 출하 중량 계산
      failure_condition: 단위 관례가 다른 창고나 소스 시스템의 SKU를 동일 Shipment에 포함하거나 시스템 간 전송할 때
      impact: 동일 숫자가 다른 물리량으로 해석되고 파생 중량 계산이 틀려 운영 및 비용 판단의 신뢰성이 훼손된다.
      evidence_refs:
        - materialized-input.md:33-38
        - materialized-input.md:40-49
    causal_path:
      root_cause_candidate: 물리량의 값과 측정 단위를 분리하지 않고 숫자 또는 문자열 하나에 소스별 관례를 수용했다.
      root_cause_step_id: semantics-candidate-002.cause-003
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: Shipment.total_weight는 구성 OrderLine 중량의 합으로 저장된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:48
        - cause_id: semantics-candidate-002.cause-002
          claim: 합산 원천인 Sku.weight가 kg 또는 lb 중 어느 단위인지 표현하지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:37
        - cause_id: semantics-candidate-002.cause-003
          claim: 물리량 속성에 명시적 단위와 정규화 규칙이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:37-38
      unresolved_beyond_evidence: OrderLine.qty의 계수 단위와 포장 단위도 대상 안에서 정의되지 않아
        total_weight의 정확한 산식까지는 확정할 수 없다.
  - candidate_id: semantics-candidate-003
    target: InventoryRecord.quantity_on_hand의 의미와 권위
    evidence_anchor: materialized-input.md:76-84, 115-117
    claim: 물리 재고와 회계 재고라는 서로 다른 수량을 하나의 quantity_on_hand 속성으로 합치면서 권위도 WMS와 ERP 사이에서
      충돌한다.
    what: 동일 속성을 WMS와 ERP가 각각 보유한다고 하면서 야간에는 ERP 기준으로 조정한다. 동시에 notes는 WMS가 실물 기준,
      ERP가 회계 수량 기준의 진실이라고 선언한다.
    why: 물리적 보유량과 회계 장부량은 불일치할 수 있는 별도 의미다. 하나의 속성으로 표현하면 사용자는 값이 실물 출고 가능량인지 장부
      수량인지 구분할 수 없고, 야간 조정은 물리적 진실을 회계 값으로 덮는 것으로 해석될 수 있다.
    how_to_fix: "`physical_on_hand`와 `accounting_on_hand`를 분리하거나, 재고 관측값에
      `quantity_kind`, `source_system`, `as_of`를 둔다. 각 사용 사례별 권위와 조정 결과의 의미를
      명시한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS와 ERP 재고 개념의 권위 및 의미를 통합 기준으로 제공
      failure_condition: 양 시스템의 수량이 불일치하거나 출고 가능성과 회계 결산이 서로 다른 값을 요구할 때
      impact: 동일 필드가 상반된 진실 기준을 나타내어 할당, 재고조정, 감사에서 어느 값이 맞는지 판정할 수 없다.
      evidence_refs:
        - materialized-input.md:76-84
        - materialized-input.md:115-117
    causal_path:
      root_cause_candidate: 물리 재고와 회계 재고를 별도 재고 관점으로 모델링하지 않고 하나의 quantity_on_hand 개념에 수용했다.
      root_cause_step_id: semantics-candidate-003.cause-003
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: quantity_on_hand는 현재 보유 수량으로 단일 정의된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:76-83
        - cause_id: semantics-candidate-003.cause-002
          claim: WMS와 ERP가 같은 속성의 값을 각각 가지며 ERP 기준 야간 조정이 수행된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:81-84
        - cause_id: semantics-candidate-003.cause-003
          claim: WMS의 실물 기준과 ERP의 회계 기준이 서로 다른 진실로 별도 선언되어 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:115-117
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-004
    target: InventoryAggregate.available_qty의 시간성과 파생 의미
    evidence_anchor: materialized-input.md:76-90, 111-112
    claim: 매일 밤 생성한 스냅샷을 일중에도 현재 가용 재고로 취급하면서 유효 시점과 가용량 산식을 정의하지 않았다.
    what: available_qty는 일일 스냅샷이지만 재고 할당은 일중 주문까지 이 값을 읽는다. 스냅샷 시각, 예약·할당·안전재고 등
      가용량을 산출하는 원천과 산식이 없다.
    why: 가용 재고는 특정 시점과 예약 상태에 의존하는 파생 의미다. 시점 없는 전일 값을 현재 가용량으로 사용하면 이미 할당된 수량을 다시
      가용하다고 해석할 수 있으며, 시스템마다 available의 계산 의미도 달라진다.
    how_to_fix: "`as_of`와 계산/갱신 시점을 추가하고, available_qty의 권위 시스템 및 산식(예: 물리 보유량에서
      예약·차단 수량 등을 차감)을 명시한다. 일중 할당에는 갱신 가능한 권위 값을 사용한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 재고 할당을 위한 일관된 가용 재고 기준
      failure_condition: 야간 스냅샷 이후 주문, 예약, 입출고 또는 조정이 발생한 상태에서 일중 주문을 할당할 때
      impact: 가용량의 시점과 계산 의미가 불명확해 중복 할당이나 시스템 간 가용 재고 불일치가 발생할 수 있다.
      evidence_refs:
        - materialized-input.md:76-90
        - materialized-input.md:111-112
    causal_path:
      root_cause_candidate: 시간 의존적 파생값인 available_qty를 원천·산식·유효시점 없는 독립 스냅샷 필드로 모델링했다.
      root_cause_step_id: semantics-candidate-004.cause-003
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: 일중 재고 할당이 InventoryAggregate.available_qty를 기준으로 수행된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:111-112
        - cause_id: semantics-candidate-004.cause-002
          claim: available_qty는 매일 밤 저장되는 스냅샷일 뿐 유효 시점이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:86-90
        - cause_id: semantics-candidate-004.cause-003
          claim: 가용량을 구성하는 원천 수량과 산식이 모델에 정의되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:76-90
      unresolved_beyond_evidence: 예약, 안전재고, 차단재고 중 실제 운영에서 어떤 항목을 가용량에 반영하는지는 현재 경계의 자료로 확정할 수 없다.
  - candidate_id: semantics-candidate-005
    target: Order.fulfillment_status와 fulfills 관계의 주문 충족 의미
    evidence_anchor: materialized-input.md:14-31, 105-109
    claim: 주문 단위 상태와 Shipment→Order 관계만으로 부분출하 시 `shipped` 및 `delivered`의 의미를 단일하게
      판정할 수 없다.
    what: Order는 단일 fulfillment_status를 가지지만 OrderLine과 Shipment 사이의 충족 수량 매핑은 의도적으로
      없다. fulfills도 Shipment에서 Order 전체로만 연결된다.
    why: 일부 주문 줄이나 일부 수량만 출하된 경우 `shipped`가 일부 출하인지 전량 출하인지, 한 Shipment가 주문 전체를
      충족하는지 일부만 충족하는지 구분되지 않는다. 동일 상태명이 OMS, WMS, TMS에서 다른 사실을 뜻하게 된다.
    how_to_fix: Shipment와 OrderLine 사이에 충족 수량을 가진 할당/출하명세 관계를 추가한다. 주문 상태는 line 수준
      사실에서 도출하고 `partially_allocated`, `partially_shipped`,
      `partially_delivered` 등 전이 의미와 완료 조건을 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 주문에서 출하와 배송까지의 일관된 충족 상태 기준
      failure_condition: 한 주문이 여러 Shipment로 나뉘거나 주문 줄 일부만 할당·출하·배송될 때
      impact: 주문 완료 여부와 출하별 충족 범위를 재구성할 수 없어 과소·중복 출하 및 고객 상태 표시 오류를 판별하기 어렵다.
      evidence_refs:
        - materialized-input.md:14-31
        - materialized-input.md:105-109
    causal_path:
      root_cause_candidate: 충족 사실의 의미 단위가 OrderLine/수량이 아니라 Order 전체로만 모델링되었다.
      root_cause_step_id: semantics-candidate-005.cause-003
      steps:
        - cause_id: semantics-candidate-005.cause-001
          claim: Order에는 주문 전체를 나타내는 단일 fulfillment_status가 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:14-23
        - cause_id: semantics-candidate-005.cause-002
          claim: Shipment의 fulfills 관계도 Order 전체만 대상으로 한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:105-109
        - cause_id: semantics-candidate-005.cause-003
          claim: OrderLine별 충족 Shipment와 수량을 표현하는 의미 단위가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:25-31
            - materialized-input.md:109
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-006
    target: Shipment.status와 TrackingEvent.event_type의 상태 의미 매핑
    evidence_anchor: materialized-input.md:40-47, 60-68, 111-113
    claim: 캐리어별 이벤트와 자사 화물 상태의 의미 대응을 통합 기준에서 정의하지 않고 각 연동에 위임한다.
    what: TrackingEvent.event_type은 캐리어별 상태 코드라고 설명되지만 고정 enum을 사용하며,
      Shipment.status와의 매핑은 각 연동이 알아서 하도록 한다. 세 상태 모델은 독립 관리된다.
    why: 동일한 `delivered` 또는 이동 관련 이벤트가 캐리어·TMS·OMS에서 서로 다른 완료 조건이나 시점을 가질 수 있다. 매핑
      권위를 연동별로 두면 같은 이벤트가 Shipment.status로 다르게 투영되어 통합 개념 기준 역할을 수행하지 못한다.
    how_to_fix: 원시 `carrier_event_code`와 정규화된 이벤트 의미를 분리하고, 버전이 있는 canonical mapping
      및 미매핑/예외 처리 규칙을 정의한다. Shipment 상태 전이의 판정 조건과 권위 시스템도 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: OMS/TMS/캐리어 상태의 의미적 정합성과 통합 상태 판정
      failure_condition: 여러 캐리어 또는 연동 구현이 동일 원시 이벤트를 Shipment 상태로 변환할 때
      impact: 연동별 매핑 차이로 동일 배송이 서로 다른 상태로 표시되고 최종 배송 판정의 신뢰성이 낮아진다.
      evidence_refs:
        - materialized-input.md:40-47
        - materialized-input.md:60-68
        - materialized-input.md:111-113
    causal_path:
      root_cause_candidate: 원시 제공자 상태와 canonical 상태 사이의 의미 매핑 및 그 권위를 온톨로지 밖의 개별 연동에 위임했다.
      root_cause_step_id: semantics-candidate-006.cause-003
      steps:
        - cause_id: semantics-candidate-006.cause-001
          claim: TrackingEvent.event_type과 Shipment.status는 서로 다른 enum을 사용한다.
          relation_to_previous: null
