          claim: 문서는 창고→허브 및 허브→고객 구간을 DeliveryLeg의 유효한 사례로 허용하면서 DeliveryLeg를 Shipment의
            하위 타입으로 선언한다.
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:47-49
        - cause_id: logic-candidate-001.cause-002
          claim: Shipment의 정의는 모든 Shipment 인스턴스를 창고에서 고객으로 가는 이동으로 한정하므로 위 구간 사례가 상위 타입
            정의를 충족하지 못한다.
          relation_to_previous: symptom_of
