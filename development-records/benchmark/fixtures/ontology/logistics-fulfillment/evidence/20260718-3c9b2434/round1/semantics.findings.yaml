  - candidate_id: semantics-candidate-002
    target: InventoryAggregate.available_qty 및 재고 할당 규칙
    evidence_anchor: materialized-input.md > InventoryAggregate.available_qty,
      integrity_rules[0]
    claim: available_qty가 파생 재고라는 이름과 달리 산식·차감 요소·유효 시점 없이 독립 스냅샷 입력처럼 모델링되었다.
    what: 가용 수량은 매일 밤 저장되는 값으로만 정의되고, 예약·할당·보류·안전재고 등 원천 의미나 as_of가 없다. 그럼에도 일중 주문
      할당이 이 값을 직접 읽는다.
    why: 가용 재고는 특정 시점과 정책에 따라 원천 수량에서 파생되는 값이다. 산식과 시간 기준이 없으면 동일한 available_qty가
      시스템별로 다른 의미를 가질 수 있으며, 일중에는 이미 소비된 야간 값을 여전히 가용하다고 해석할 수 있다.
    how_to_fix: "available_qty의 정식 정의와 산식(예: 권위 있는 on-hand에서 예약·보류 등을 차감), 포함·제외 항목,
      source_system, as_of를 명시한다. 할당 판단에는 최신성과 예약 반영 조건을 계약으로 둔다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 시스템 공통 가용재고 정의와 안전한 주문 할당
      failure_condition: 야간 스냅샷 이후 예약·출고·조정이 발생한 상태에서 일중 주문을 할당할 때
      impact: 가용성의 의미와 시점이 불명확해 중복 할당이나 과판매 판단을 유발할 수 있다.
      evidence_refs:
        - InventoryAggregate.available_qty note
        - integrity_rules[0]
    causal_path:
      root_cause_candidate: 시간·정책 의존 파생값인 가용재고를 원천과 산식이 없는 독립 숫자로 모델링했다.
      root_cause_step_id: semantics-candidate-002.cause-003
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: 일중 할당이 매일 밤 저장된 available_qty를 읽는다.
          relation_to_previous: null
