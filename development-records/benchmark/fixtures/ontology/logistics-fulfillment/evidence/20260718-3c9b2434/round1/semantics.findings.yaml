  - candidate_id: semantics-candidate-001
    target: InventoryRecord.quantity_on_hand
    evidence_anchor: materialized-input.md > InventoryRecord.quantity_on_hand 및 notes의 "재고 진실"
    claim: 하나의 quantity_on_hand가 WMS 실물 수량과 ERP 회계 수량이라는 서로 다른 의미와 권위를 동시에 나타낸다.
    what: 속성은 "현재 보유 수량" 하나로 정의되지만 WMS와 ERP가 각자 값을 가지며, 야간에 ERP 기준으로 조정된다. 별도
      notes에서는 WMS를 실물 기준, ERP를 회계 기준으로 선언한다.
    why: 실물 재고와 회계 재고는 동일 이름의 복제값이 아니라 목적과 권위가 다른 측정치다. 하나의 속성으로 통합하면 시스템 간 불일치가
      오류인지 정상적인 의미 차이인지 판별할 수 없고, 현재값에 유효 시점도 없어 과거 주문 판단을 재현할 수 없다.
    how_to_fix: physical_on_hand와 accounting_on_hand를 별도 개념 또는 명시적 관점별 측정값으로 모델링하고
      각각 source_system, as_of, reconciliation_status를 둔다. allocation용 권위도 별도로
      선언한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 통합의 재고 개념 및 권위 기준
      failure_condition: WMS 실물 수량과 ERP 회계 수량이 다르거나 야간 조정 전후 값을 교환·판단할 때
      impact: 같은 필드가 서로 다른 사실을 뜻해 재고 조회, 대사, 할당의 해석이 시스템마다 달라지고 통합 기준으로 사용할 수 없다.
      evidence_refs:
        - InventoryRecord.quantity_on_hand note
        - notes["재고 진실"]
        - InventoryRecord의 as_of 부재 주석
    causal_path:
      root_cause_candidate: 물리 재고와 회계 재고를 하나의 quantity_on_hand 개념으로 축약하고 관점·권위·유효 시점을 모델링하지 않았다.
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: quantity_on_hand가 WMS 값과 ERP 값을 모두 지칭하며 현재값으로만 표현된다.
          relation_to_previous: null
          evidence_refs:
            - InventoryRecord.quantity_on_hand note
        - cause_id: semantics-candidate-001.cause-002
          claim: WMS 실물 기준과 ERP 회계 기준이라는 의미적으로 다른 수량이 공존한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - notes["재고 진실"]
        - cause_id: semantics-candidate-001.cause-003
          claim: 서로 다른 재고 관점과 시간성을 하나의 속성에 합쳤다.
          relation_to_previous: symptom_of
          evidence_refs:
