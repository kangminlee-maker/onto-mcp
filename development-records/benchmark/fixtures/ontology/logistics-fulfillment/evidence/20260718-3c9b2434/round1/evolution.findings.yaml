  - candidate_id: evolution-candidate-004
    target: Shipment, DeliveryLeg 및 fulfills 관계
    evidence_anchor: "materialized-input.md: Shipment definition, DeliveryLeg is_a
      Shipment, DeliveryLeg attributes, fulfills 관계"
    claim: 다중 구간·분할·합배송·운송사 인계 시나리오를 추가하려면 현재 Shipment 계층을 재구성해야 한다.
    what: DeliveryLeg가 Shipment의 하위 유형이지만 구간을 묶는 상위 운송 계획 또는 parent shipment 참조가 없고,
      leg_seq만 존재한다. Shipment는 단일 carrier_ref를 가지며 fulfills는 주문 전체만 연결한다.
    why: 새 구간을 어느 운송 여정에 배열할지, 구간별 운송사를 어떻게 표현할지, 여러 주문·출하를 어떻게 분할 또는 통합했는지 식별할 수
      없다. 이런 운송 형태를 수용하려면 기존 상속, carrier_ref, 관계 구조를 동시에 변경해야 한다.
    how_to_fix: Shipment와 DeliveryLeg를 구성 관계로 분리하고 명시적 journey/route 또는 parent
      shipment 참조를 둔다. 운송사와 상태는 구간 수준에 배치할 수 있게 하며, 주문 라인과 출하 수량을 연결하는
      fulfillment allocation 개념을 추가한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 확장 가능한 주문-화물-배송 통합 개념 기준
      failure_condition: 다중 구간 운송, 구간별 운송사 인계, 부분 출하 또는 합배송을 도입할 때
      impact: 핵심 Shipment 의미와 관계를 호환성 없이 변경해야 하며, 기존 단일 구간 데이터와 새 복합 운송 데이터의 일관된 질의가
        어려워진다.
      evidence_refs:
        - Shipment definition and carrier_ref
        - DeliveryLeg is_a and attributes
        - fulfills relation note
    causal_path:
      root_cause_candidate: 운송 전체와 운송 구간을 구성 관계가 아니라 is_a 관계로 합치고, 분할·통합을 나타내는 중간 개념을 두지 않았다.
      root_cause_step_id: evolution-candidate-004.cause-003
      steps:
        - cause_id: evolution-candidate-004.cause-001
          claim: 복수 구간을 하나의 운송 여정으로 묶거나 구간별 운송사를 표현할 수 없다.
          relation_to_previous: null
          evidence_refs:
