            - Order and Shipment status enums
        - cause_id: evolution-candidate-003.cause-002
          claim: 매핑이 각 연동에 분산되어 변경 시 일괄 호환성을 보장할 공통 권위가 없다.
          relation_to_previous: symptom_of
