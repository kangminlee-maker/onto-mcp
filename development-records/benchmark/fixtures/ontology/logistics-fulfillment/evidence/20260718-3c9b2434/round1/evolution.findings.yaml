  - candidate_id: evolution-candidate-002
    target: Sku.weight, Sku.dims, Shipment.total_weight
    evidence_anchor: "materialized-input.md: Sku.weight 및 dims의 note,
      Shipment.total_weight의 note"
    claim: 단위 관례가 다른 창고나 외부 시스템을 추가하면 기존 측정값을 안전하게 결합할 수 없다.
    what: weight는 kg 또는 lb를 같은 number 필드에 저장하고, dims는 단위 없는 문자열이며,
      Shipment.total_weight는 이 값들의 합으로 저장된다.
    why: 새 창고·운송사 연동 시 값의 단위와 차원 순서를 데이터만으로 식별할 수 없다. 단위 표준화 정책을 나중에 도입하면 기존 값의 재해석
      또는 전면 변환이 필요하고, 원 단위를 알 수 없는 레코드는 연속성을 복구할 수 없다.
    how_to_fix: 측정값을 value, unit, measurement_kind로 구조화하고 치수 축을 분리한다. 정규화 값과 원본 값·원본
      단위를 함께 보존하며, total_weight에 계산 기준과 단위 또는 구성 측정값 참조를 둔다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 간 상품·화물 측정값의 공통 개념 기준
      failure_condition: kg와 lb 또는 서로 다른 치수 단위를 쓰는 새 창고·운송사를 통합하거나 과거 값을 재계산할 때
      impact: 중량 합계와 적재·운임 판단이 데이터 출처에 따라 달라져 통합 기준으로 신뢰할 수 없고, 이후 단위 표준화 시 손실 없는
        마이그레이션이 불가능할 수 있다.
      evidence_refs:
        - Sku.weight note
        - Sku.dims note
        - Shipment.total_weight note
    causal_path:
      root_cause_candidate: 측정량의 값과 단위를 분리하지 않고 소스별 관례를 동일 필드의 암묵적 의미로 두었다.
      root_cause_step_id: evolution-candidate-002.cause-003
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: 새 소스의 측정값을 기존 값과 비교·합산할 때 단위를 판별할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - Sku.weight note
            - Sku.dims note
        - cause_id: evolution-candidate-002.cause-002
          claim: 단위가 불명확한 SKU 중량을 합산한 total_weight가 저장된다.
