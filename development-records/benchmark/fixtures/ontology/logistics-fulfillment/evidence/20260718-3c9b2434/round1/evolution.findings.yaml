  - candidate_id: evolution-candidate-003
    target: TrackingEvent.event_type 및 Order/Shipment 상태 모델
    evidence_anchor: "materialized-input.md: TrackingEvent.event_type note,
      Order.fulfillment_status, Shipment.status, integrity_rules 두 번째 항목"
    claim: 새 운송사 상태 코드나 상태 체계 버전을 추가할 때 연동별 수정이 반복되고 과거 상태 해석의 연속성이 깨진다.
    what: 세 상태 체계가 닫힌 enum으로 정의되고 독립 관리되며, 캐리어 상태와 Shipment.status의 매핑은 각 연동에 맡겨져
      있다. 매핑의 버전, 유효 기간, 원본 코드 보존 구조가 없다.
    why: 운송사가 코드를 추가·변경하거나 OMS/TMS 상태가 확장되면 enum과 각 연동 매핑을 동시에 수정해야 한다. 같은 원본 코드의
      의미가 변경되어도 당시 적용된 매핑을 식별할 수 없어 과거 배송 상태를 일관되게 재현하기 어렵다.
    how_to_fix: 원본 시스템·원본 코드·발생 시각을 보존하고, canonical 상태로의 매핑을 버전 및 유효 기간이 있는 독립 개념으로
      둔다. canonical enum 확장은 호환 정책과 deprecated/alias 규칙으로 관리한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: OMS/TMS/캐리어 상태를 연결하는 장기적 통합 기준
      failure_condition: 운송사 또는 내부 시스템이 상태 코드를 추가·폐기·재정의할 때
      impact: 연동별 매핑 드리프트가 누적되고 전환 전후 동일 이벤트의 해석이 달라져 상태 기반 운영과 이력 조회의 신뢰가 약화된다.
      evidence_refs:
        - TrackingEvent.event_type values and note
        - Order.fulfillment_status values
        - Shipment.status values
        - integrity_rules[1]
    causal_path:
      root_cause_candidate: 외부 코드 체계를 버전 있는 매핑 자산으로 모델링하지 않고 닫힌 enum과 연동별 구현에 분산했다.
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 새 상태 코드가 등장하면 canonical enum 또는 개별 연동 로직을 수정해야 한다.
          relation_to_previous: null
          evidence_refs:
