    claim: 향후 스키마·코드·규칙 변경 시 기존 데이터의 해석을 유지할 버전 전환 계약이 없다.
    what: 최상위 버전 문자열만 있고, 개체·속성·enum·무결성 규칙의 도입/폐기 시점, 호환 범위, 별칭, 마이그레이션 또는 레코드별 적용
      버전을 표현하지 않는다.
    why: 새 버전에서 상태, 관계 또는 계산 규칙을 변경해도 기존 레코드가 어느 의미 계약으로 생성되었는지 판별할 수 없다. 결과적으로 외부
