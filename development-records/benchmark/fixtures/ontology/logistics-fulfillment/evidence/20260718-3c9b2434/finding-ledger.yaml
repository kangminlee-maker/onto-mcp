    lens_rationale_summary: "`is_a`를 부분형 관계로 적용하면 모든 DeliveryLeg는 Shipment의 정의를 만족해야
      한다. 그러나 문서가 허용하는 중간 구간은 출발점이나 도착점이 각각 창고 또는 고객이 아니므로 반례가 된다. 이 모순은
      WMS/TMS/ERP가 구간 이동과 종단 간 화물을 같은 타입으로 처리하게 만들어 타입 기반 통합 계약의 신뢰를 약화한다.
      Boundary handoff: 용어 의미의 모호성만 제거해도 상위 정의와 하위 타입 예시의 충돌이 남으므로 logic이 주
      소유자이며, 계층 재구성은 structure lens와 연관된다."
    proposed_action: "`DeliveryLeg.is_a: Shipment`를 제거하고 Shipment와 DeliveryLeg 사이에
      `has_leg`/`part_of` 관계를 두는 것이 가장 작고 명확한 수정이다. 대안으로 Shipment를 모든 물리 이동을
      포괄하도록 넓히고, 창고→고객 종단 간 화물을 별도 하위 타입으로 분리한다."
