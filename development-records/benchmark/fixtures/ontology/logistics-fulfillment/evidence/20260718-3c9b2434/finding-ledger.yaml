    proposed_action: 원천 이벤트는 그대로 보존하되 canonical 상태 전이와 매핑 계약을 중앙 정의한다. 상태별 권위 소스,
      유효시점, 파생 규칙, 역행·예외·충돌 처리 및 주문 상태가 화물 상태로부터 계산되는 조건을 명시한다.
