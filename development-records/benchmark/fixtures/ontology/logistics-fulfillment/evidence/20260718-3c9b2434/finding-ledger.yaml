    source_ref: .onto/review/20260718-3c9b2434/round1/logic.findings.yaml#logic-candidate-001
    target: logistics-fulfillment-ontology.yaml — Shipment/DeliveryLeg type hierarchy
    evidence_anchor: logistics-fulfillment-ontology.yaml:35-49
