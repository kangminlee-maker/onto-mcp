    claim: 상태 의미와 매핑을 각 시스템·연동에 위임한 설계는 공통 상태 기준을 제공해야 할 온톨로지의 목적을 포기한다.
    lens_rationale_summary: 각 연동이 동일 사건을 서로 다르게 매핑할 수 있어
      `shipped`·`in_transit`·`delivered`의 시스템 간 의미가 수렴하지 않는다. 소스 자율성을 유지하는 국소
