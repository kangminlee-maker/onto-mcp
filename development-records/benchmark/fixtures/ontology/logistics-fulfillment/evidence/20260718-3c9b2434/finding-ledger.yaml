    target: InventoryRecord / InventoryAggregate / inventory allocation integrity rule
    evidence_anchor: "Target: materialized-input.md lines 76-90 and 111-116. Value
      authority: review-value-alignment-criteria.yaml lines 5-18, criterion
      `user-request-intent`, excerpt: “WMS/TMS/ERP 통합의 개념 기준 문서… 권위·시간성… 물류 운영
      위험을 중심으로.” value_type=purpose; alignment_direction=misaligned."
    claim: 일중 할당에 전일 스냅샷을 사용하면서 재고 권위와 유효시점을 표현하지 않아, 통합 기준이라는 목적보다 배치 편의성을 우선한다.
    lens_rationale_summary: 재고 변동이나 WMS·ERP 불일치가 발생한 일중에는 할당 판단이 어느 시점과 어느 권위의 수량에
      근거했는지 판별할 수 없다. 이는 권위·시간성 정합성과 운영 위험을 다루는 통합 개념 기준이라는 선언 목적을 직접 약화하며, 재고
      부족 또는 중복 약속의 원인을 사후 설명하기 어렵게 한다.
    proposed_action: 재고 수량을 권위별로 분리하고 `as_of`와 갱신 출처를 필수화한다. 할당에는 예약·가용량의 계산식과 실시간
      권위 우선순위를 명시하고, 오래된 스냅샷을 사용할 수 있는 최대 허용 시차와 실패 처리를 정의한다.
    affected_purpose: WMS/TMS/ERP 통합에서 재고 권위·시간성을 일관되게 해석하고 안전한 할당 판단을 지원하는 개념 기준.
    failure_condition: 야간 스냅샷 이후 재고가 변하거나 WMS 실물 수량과 ERP 회계 수량이 불일치한 상태에서 일중 주문이 할당될 때.
    impact: 동일한 온톨로지를 사용하는 시스템도 서로 다른 실제 수량을 전제로 할당할 수 있어 통합 기준에 대한 운영 신뢰와 사후 감사
      가능성이 훼손된다.
