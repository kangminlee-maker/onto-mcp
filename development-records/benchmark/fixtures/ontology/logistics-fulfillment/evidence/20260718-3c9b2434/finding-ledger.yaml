  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260718-3c9b2434/round1/axiology.findings.yaml#axiology-candidate-002
    target: OrderLine–Shipment fulfillment traceability
    evidence_anchor: "Target: materialized-input.md lines 25-31 and 105-109. Value
      authority: review-value-alignment-criteria.yaml lines 5-18, criterion
      `user-request-intent`, excerpt: “주문·재고·화물·배송 개념의 정합성… 물류 운영 위험을 중심으로.”
      value_type=purpose; alignment_direction=misaligned."
    claim: 주문 단위 `fulfills`만 유지해 부분출하의 실제 충족 단위를 버리는 선택은 주문충족 통합 기준의 목적과 어긋난다.
    lens_rationale_summary: 한 주문이 여러 화물로 나뉘거나 일부 수량만 출하되면 주문 상태, 화물 상태, 실제 충족 수량을
      연결할 공통 근거가 없다. 주문 단위 모델의 단순성이 시스템 간 정산·재출하·고객 응대에 필요한 추적 가능성을 희생한다.
    proposed_action: "`FulfillmentAllocation` 같은 연결 개념을 추가해 `OrderLine`, `Shipment`
      또는 출하 품목, 충족 수량, 단위, 확정 시점을 연결하고 부분·취소·대체 충족을 표현한다."
    affected_purpose: 주문에서 출하·배송까지의 충족 관계를 WMS/TMS/ERP가 공통으로 해석하는 개념 기준.
    failure_condition: 한 주문이 둘 이상의 화물로 분할되거나 주문 줄의 일부 수량만 출하·취소·대체될 때.
    impact: 어느 화물이 어떤 주문 수량을 충족했는지 온톨로지로 판정할 수 없어 통합 추적, 상태 산정, 정산의 공통 기준이 사라진다.
    evidence_refs:
      - .onto/review/20260718-3c9b2434/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:25-31
      - materialized-input.md:105-109
      - review-value-alignment-criteria.yaml:5-18
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 주문에서 출하·배송까지의 충족 관계를 WMS/TMS/ERP가 공통으로 해석하는 개념 기준.
      failure_condition: 한 주문이 둘 이상의 화물로 분할되거나 주문 줄의 일부 수량만 출하·취소·대체될 때.
      impact: 어느 화물이 어떤 주문 수량을 충족했는지 온톨로지로 판정할 수 없어 통합 추적, 상태 산정, 정산의 공통 기준이 사라진다.
      evidence_refs:
        - materialized-input.md:25-31
        - materialized-input.md:105-109
        - review-value-alignment-criteria.yaml:5-18
    causal_path:
      root_cause_candidate: 충족 관계의 기준 단위를 주문으로 고정하고 주문 줄·수량 수준의 연결 개념을 의도적으로 제외했다.
      root_cause_step_id: finding-002.cause-002
      steps:
        - cause_id: finding-002.cause-001
          claim: 부분출하 시 주문 줄과 Shipment의 대응을 추적할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:25-31
        - cause_id: finding-002.cause-002
          claim: 유일한 충족 관계는 `Shipment -> Order`이며 주문 줄 매핑을 두지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
