      .onto/review/20260718-4065ab62/execution-preparation/materialized-input.m\
      d:48. Value authority anchor:
      .onto/review/20260718-4065ab62/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6, statement requires a WMS/TMS/ERP integration concept
      standard centered on unit consistency and logistics operating risk."
    claim: Leaving product measurements in source-system units while summing total
      shipment weight is misaligned with the unit-consistency purpose of the
      integration ontology.
    lens_rationale_summary: A concept baseline for WMS/TMS/ERP integration should
      prevent unit ambiguity at integration boundaries. Here, the local
      convenience of preserving source units is accepted without a canonical
      unit or conversion model, while downstream shipment total_weight depends
      on those measurements. That hidden tradeoff can corrupt carrier rating,
      capacity planning, and exception handling.
    proposed_action: Represent weight and dimensions as structured measurements with
      value, unit, source, and conversion policy; define canonical integration
      units for shipment totals; store total_weight with its unit and derivation
      timestamp/source.
    affected_purpose: Use the ontology as the concept baseline for unit-consistent
      WMS/TMS/ERP integration and logistics risk control.
    failure_condition: When SKUs from different warehouses or source systems are
      combined into shipments, total_weight may sum values recorded in
      incompatible or unknown units.
    impact: The model can produce incorrect shipment weight and dimensions,
      weakening carrier integration, cost calculation, load planning, and
      operational trust in the reference ontology.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/axiology.findings.yaml#axiology-candidate-002
      - .onto/review/20260718-4065ab62/execution-preparation/review-value-alignment-criteria.yaml:6
      - .onto/review/20260718-4065ab62/execution-preparation/materialized-input.md:37
      - .onto/review/20260718-4065ab62/execution-preparation/materialized-input.md:38
      - .onto/review/20260718-4065ab62/execution-preparation/materialized-input.md:48
    severity: medium
