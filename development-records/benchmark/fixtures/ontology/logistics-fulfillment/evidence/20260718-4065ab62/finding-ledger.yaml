  - finding_id: finding-020
    lens_id: structure
    source_ref: .onto/review/20260718-4065ab62/round1/structure.findings.yaml#structure-candidate-002
    target: logistics-fulfillment-ontology.yaml / DeliveryLeg 경로 구성 구조
    evidence_anchor: "materialized-input.md: Shipment definition says DeliveryLeg is
      also a kind of Shipment; DeliveryLeg has leg_seq, from_ref, and to_ref;
      relations contains only fulfills from Shipment to Order and no parent
      shipment, route, or next-leg relation."
    claim: DeliveryLeg has no structural link that groups legs into a shipment route.
    lens_rationale_summary: A sequence number is only meaningful within a containing
      route or shipment. Because DeliveryLeg is modeled only as an is_a Shipment
      subtype, each leg inherits shipment-level behavior but lacks a structural
      edge that says which shipment route it belongs to or which legs
      precede/follow it.
    proposed_action: Introduce a parent/composition relation such as Shipment
      has_many DeliveryLeg, DeliveryLeg belongs_to Shipment, or a separate Route
      entity with ordered legs; scope leg_seq to that parent.
    affected_purpose: Concept reference document for shipment and delivery
      integration between WMS/TMS/carrier systems.
    failure_condition: When a delivery has multiple legs, consumers cannot
      reconstruct the end-to-end route or associate leg-level tracking and
      locations with one parent shipment.
    impact: TMS/carrier integration loses a stable structural path for multi-leg
      delivery state, ETA, and exception handling, even though DeliveryLeg is
      declared as part of the shipment model.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/structure.findings.yaml#structure-candidate-002
      - "materialized-input.md: DeliveryLeg definition says it is one segment of
        a cargo route."
      - "materialized-input.md: DeliveryLeg attributes include leg_seq,
        from_ref, and to_ref but no parent shipment or route reference."
      - "materialized-input.md: relations contains only fulfills from Shipment
        to Order."
    severity: medium
    domain_threshold_used: null
    materiality_basis:
