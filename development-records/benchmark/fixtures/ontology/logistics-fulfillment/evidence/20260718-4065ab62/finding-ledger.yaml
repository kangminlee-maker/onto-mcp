  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260718-4065ab62/round1/axiology.findings.yaml#axiology-candidate-002
    target: Sku.weight / Sku.dims and Shipment.total_weight
    evidence_anchor: "Target:
      .onto/review/20260718-4065ab62/execution-preparation/materialized-input.m\
      d:37,
      .onto/review/20260718-4065ab62/execution-preparation/materialized-input.m\
