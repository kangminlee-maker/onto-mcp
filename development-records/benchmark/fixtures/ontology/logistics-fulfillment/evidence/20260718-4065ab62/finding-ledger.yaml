  - finding_id: finding-009
    lens_id: coverage
    source_ref: .onto/review/20260718-4065ab62/round1/coverage.findings.yaml#coverage-candidate-005
    target: Sku measurement and packaging/unit coverage
    evidence_anchor: "Embedded materialized input: Sku `weight` note; Sku `dims`
      note; Shipment `total_weight` note"
    claim: Measurement units and package handling are under-modeled for freight and
      warehouse integration.
    lens_rationale_summary: Weight, dimensions, and packaging drive carrier rating,
      routing, capacity, customs-adjacent documentation, warehouse handling, and
      shipment reconciliation. Even though international/customs is out of
      scope, domestic WMS/TMS integration still needs consistent units and
      packaging hierarchy to avoid incorrect total weights and carrier handoff
      ambiguity.
    proposed_action: Add normalized measurement concepts with unit of measure,
      precision, source, and effective time; represent package/handling-unit
      hierarchy such as carton, pallet, parcel, and shipment container; and
      attach gross/net/dimensional weight and dimensions to the appropriate
      level.
    affected_purpose: Freight, warehouse, and TMS integration concept baseline.
    failure_condition: When SKUs or shipments cross warehouses/carriers using
      different measurement conventions, the ontology cannot determine the unit,
      measurement basis, or package level of weight/dimensions.
    impact: Carrier rating, routing, capacity planning, and reconciliation can be
      wrong because numeric measurements are not semantically comparable across
      systems.
    evidence_refs:
