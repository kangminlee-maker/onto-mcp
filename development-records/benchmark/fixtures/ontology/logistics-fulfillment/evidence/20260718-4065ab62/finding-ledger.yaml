      nt-criteria.yaml:6, statement requires an
      order/inventory/shipment/delivery concept standard focused on logistics
      operating risk."
    claim: Omitting OrderLine-to-shipment fulfillment mapping is misaligned with the
      ontology's fulfillment integration purpose because it sacrifices
      operational traceability for a simpler order-level relation.
    lens_rationale_summary: A logistics fulfillment concept baseline must support
      the operational question of which ordered item moved in which shipment,
      especially for partial shipments and exceptions. The model chooses a
      simpler order-level relation, but that local simplification weakens the
      broader purpose of coordinating orders, freight, and delivery across
      systems.
    proposed_action: Add a fulfillment allocation/detail concept linking OrderLine
      to Shipment or DeliveryLeg with shipped quantity, split/partial flags,
      timestamps, and exception/cancellation state.
    affected_purpose: Use the ontology as a concept standard across order, freight,
      and delivery workflows while controlling logistics operating risk.
    failure_condition: An order is partially shipped, split across shipments, or has
      an exception on one line, but the ontology only records a
      Shipment-to-Order relation.
    impact: The reference model cannot explain which ordered quantities were
      fulfilled by which physical movements, undermining exception resolution,
      customer service, reconciliation, and auditability.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/axiology.findings.yaml#axiology-candidate-004
