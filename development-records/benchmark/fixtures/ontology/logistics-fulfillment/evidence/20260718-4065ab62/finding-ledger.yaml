  - finding_id: finding-007
    lens_id: coverage
    source_ref: .onto/review/20260718-4065ab62/round1/coverage.findings.yaml#coverage-candidate-003
    target: Cross-system quantity and ETA authority coverage
    evidence_anchor: "Embedded materialized input: InventoryRecord
      `quantity_on_hand` note; notes `재고 진실`; Shipment `eta` note; notes `ETA`"
    claim: Parallel WMS/ERP and carrier/manual values are described without
      source-of-truth or provenance concepts.
    lens_rationale_summary: Coverage lens treats single authority and audit evidence
      as required dimensions when values are managed across systems or manually
      controlled. Here, both inventory and ETA are explicitly multi-source.
      Without authority/provenance concepts, downstream integrations cannot know
      which value governs allocation, accounting, display, or audit, and manual
      changes cannot be explained after the fact.
    proposed_action: Add source/provenance and authority concepts, for example
      `SystemOfRecordPolicy`, `QuantityAssertion`, `EtaEstimate`, and
      `ManualOverride` with source system, effective time, actor, reason,
      superseded value, and consuming context.
    affected_purpose: WMS/TMS/ERP integration concept baseline with clear authority
      for order, inventory, shipment, and delivery values.
    failure_condition: When WMS and ERP disagree on inventory, or carrier ETA and
      manual ETA differ, the ontology lacks a concept that identifies the
      governing value and its evidence.
    impact: The integration baseline leaves precedence and audit behavior to
      implementation-specific interpretation, undermining trust in allocation,
      accounting reconciliation, and customer-facing ETA decisions.
