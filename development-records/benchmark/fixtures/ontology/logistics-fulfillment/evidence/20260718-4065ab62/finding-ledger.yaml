  - finding_id: finding-014
    lens_id: logic
    source_ref: .onto/review/20260718-4065ab62/round1/logic.findings.yaml#logic-candidate-001
    target: logistics-fulfillment-ontology.yaml / entities.Shipment and
      entities.DeliveryLeg
    evidence_anchor: .onto/review/20260718-4065ab62/execution-preparation/materialized-input.md:40,
      .onto/review/20260718-4065ab62/execution-preparation/materialized-input.md:52
    claim: DeliveryLeg is declared as a Shipment while its definition allows route
      segments that are not complete warehouse-to-customer shipments.
    lens_rationale_summary: "This is an inter-claim necessary-type conflict: the
      subtype declaration requires all DeliveryLeg instances to be Shipment
      instances, while the DeliveryLeg definition permits instances whose
      origin/destination pattern does not meet the Shipment definition. It
      matters for WMS/TMS/ERP concept integration because code or mappings that
      inherit Shipment obligations onto each DeliveryLeg can treat a partial leg
      as a full customer shipment, weakening status, carrier, and fulfillment
      reasoning."
    proposed_action: Make `Shipment` the whole consignment/order movement and model
      `DeliveryLeg` as a component of Shipment instead of `is_a`, or broaden
      `Shipment` to mean any physical cargo movement and introduce a separate
      whole-shipment concept for warehouse-to-customer fulfillment.
    affected_purpose: Concept baseline for WMS/TMS/ERP integration across order,
      freight, and delivery concepts.
    failure_condition: "When DeliveryLeg instances such as hub-to-customer are
      interpreted through the `is_a: Shipment` declaration, they must also
      satisfy the narrower Shipment definition of warehouse-to-customer
      movement."
    impact: The ontology can classify partial route legs as full shipments, making
      downstream integration rules about shipment status, fulfillment, and
      delivery scope logically unstable.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/logic.findings.yaml#logic-candidate-001
      - .onto/review/20260718-4065ab62/execution-preparation/materialized-input.md:40-49
      - .onto/review/20260718-4065ab62/execution-preparation/materialized-input.md:52-58
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Concept baseline for WMS/TMS/ERP integration across order,
        freight, and delivery concepts.
      failure_condition: "When DeliveryLeg instances such as hub-to-customer are
        interpreted through the `is_a: Shipment` declaration, they must also
        satisfy the narrower Shipment definition of warehouse-to-customer
        movement."
      impact: The ontology can classify partial route legs as full shipments, making
