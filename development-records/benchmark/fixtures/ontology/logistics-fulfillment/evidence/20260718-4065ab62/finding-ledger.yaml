      - "Sku `weight` note: warehouse-specific kg or lb convention is used"
      - "Sku `dims` note: dimensions are a string and units vary by source
        system"
      - "Shipment `total_weight` note: computed sum stored at shipment
        confirmation"
    severity: medium
