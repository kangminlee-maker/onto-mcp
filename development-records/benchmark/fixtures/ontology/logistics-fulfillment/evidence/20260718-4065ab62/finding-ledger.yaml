      .onto/review/20260718-4065ab62/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6, statement requires suitability as an integration
      concept standard centered on status model and authority."
    claim: Delegating shipment/tracking status mapping to each integration is
      misaligned with the ontology's purpose as a status-model authority for
      WMS/TMS/carrier integration.
    lens_rationale_summary: The declared purpose asks whether this is a concept
      standard for integration, especially status model and authority. By
      leaving status correspondence to per-integration decisions, the ontology
      avoids the exact cross-system alignment it is supposed to provide. This
      permits inconsistent delivered/exception/in_transit interpretations across
      consumers.
    proposed_action: Define a canonical lifecycle/status mapping table with source
      status, canonical status, transition rules, terminal-state precedence,
      exception handling, and the authority that may advance or correct each
      state.
    affected_purpose: Use the ontology as the WMS/TMS/ERP integration status-model
      and authority baseline for shipments and delivery tracking.
    failure_condition: Different integrations map carrier TrackingEvent.event_type
      values to Shipment.status independently, while systems manage statuses
      separately.
    impact: Consumers can disagree about shipment state and terminal delivery,
      weakening operational coordination, customer notifications, exception
      management, and auditability.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/axiology.findings.yaml#axiology-candidate-003
