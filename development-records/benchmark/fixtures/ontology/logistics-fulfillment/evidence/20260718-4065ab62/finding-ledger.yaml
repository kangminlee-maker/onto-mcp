  - finding_id: finding-008
    lens_id: coverage
    source_ref: .onto/review/20260718-4065ab62/round1/coverage.findings.yaml#coverage-candidate-004
    target: Order and Shipment lifecycle coverage
    evidence_anchor: "Embedded materialized input: Order `fulfillment_status`
      values; Shipment `status` values and note; TrackingEvent `event_type`
      values"
    claim: Lifecycle states stop at happy-path delivery and omit cancellation,
      exception resolution, return, correction, and archival phases.
    lens_rationale_summary: A logistics fulfillment baseline must cover operational
      endings and post-final corrections. The current state models treat
      `delivered` as final while still having carrier exceptions and
      multi-system updates elsewhere, so real operations such as failed
      delivery, return-to-sender, cancellation after allocation, shipment
      reissue, proof-of-delivery correction, and audit closure are outside the
      conceptual lifecycle.
    proposed_action: "Extend lifecycle coverage with explicit terminal and
      post-terminal concepts: canceled/backordered for orders or lines;
      exception/failed_delivery/returned/reissued for shipments; correction or
      reversal events; and archival/audit-closed states with rules for how
      post-delivery events affect status."
    affected_purpose: Order, freight, and delivery concept consistency for logistics operations.
    failure_condition: When fulfillment leaves the happy path or a delivered
      shipment must be corrected, the ontology has no lifecycle concept to
      represent the condition without overloading existing states.
    impact: Operations risk is hidden because exceptions and reversals cannot be
      represented consistently across OMS, TMS, carrier tracking, and ERP
      reconciliation.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/coverage.findings.yaml#coverage-candidate-004
      - "Order `fulfillment_status` values: received, allocated, picking,
        shipped, delivered"
      - "Shipment `status` values: created, picked, in_transit, delivered; note
        says delivered is final"
      - TrackingEvent `event_type` includes exception
