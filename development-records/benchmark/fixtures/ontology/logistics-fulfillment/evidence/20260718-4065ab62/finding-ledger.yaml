        - .onto/review/20260718-4065ab62/execution-preparation/materialized-input.md:52-58
    causal_path:
      root_cause_candidate: The ontology uses inheritance for a part-of route segment
        relationship while keeping the parent definition narrower than the
        child’s allowed instances.
      root_cause_step_id: finding-014.cause-003
