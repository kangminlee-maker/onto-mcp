  - finding_id: finding-006
    lens_id: coverage
    source_ref: .onto/review/20260718-4065ab62/round1/coverage.findings.yaml#coverage-candidate-002
    target: InventoryRecord / InventoryAggregate temporal inventory coverage
    evidence_anchor: "Embedded materialized input: InventoryRecord
      `quantity_on_hand` note and comment; InventoryAggregate `available_qty`
      note; integrity rule for allocation"
    claim: Inventory quantities lack effective-time and movement-history coverage
      despite being used for allocation.
    lens_rationale_summary: Inventory values are time-dependent. The target itself
      notes that `InventoryRecord` has no `as_of` concept, while allocation
      reads `InventoryAggregate.available_qty` even for intraday orders although
      that aggregate is a nightly snapshot. This leaves a coverage gap for
      historical reconstruction, oversell investigation, reservation accounting,
      and WMS/ERP reconciliation.
    proposed_action: "Introduce temporal inventory concepts: `InventorySnapshot`
      with `as_of`, source system, and scope; `InventoryMovement` or
      `InventoryTransaction` for receipts, picks, shipments, returns,
      adjustments; and `Reservation`/`Allocation` with effective time and
      release/consume events."
    affected_purpose: Inventory and order fulfillment authority for WMS/TMS/ERP integration.
    failure_condition: When an order is accepted or audited at a prior point in
      time, the ontology cannot reconstruct available or on-hand inventory from
      effective timestamps or movement history.
    impact: The concept baseline cannot support allocation correctness, dispute
      analysis, or cross-system reconciliation because only current/nightly
      quantity surfaces are modeled.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/coverage.findings.yaml#coverage-candidate-002
      - "InventoryRecord `quantity_on_hand` note: WMS and ERP each hold values,
        adjusted nightly to ERP"
      - "InventoryRecord comment: no as_of concept for order-time inventory
        queries"
      - "InventoryAggregate `available_qty` note: nightly batch snapshot"
      - "Integrity rule: intraday allocation reads
        InventoryAggregate.available_qty"
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Inventory and order fulfillment authority for WMS/TMS/ERP integration.
      failure_condition: When an order is accepted or audited at a prior point in
        time, the ontology cannot reconstruct available or on-hand inventory
        from effective timestamps or movement history.
      impact: The concept baseline cannot support allocation correctness, dispute
        analysis, or cross-system reconciliation because only current/nightly
        quantity surfaces are modeled.
      evidence_refs:
        - "InventoryRecord `quantity_on_hand` note: WMS and ERP each hold
          values, adjusted nightly to ERP"
        - "InventoryRecord comment: no as_of concept for order-time inventory
