    source_ref: .onto/review/20260718-4065ab62/round1/axiology.findings.yaml#axiology-candidate-001
    target: InventoryRecord / InventoryAggregate inventory authority and allocation
      timing
    evidence_anchor: "Target:
      .onto/review/20260718-4065ab62/execution-preparation/materialized-input.m\
      d:81,
      .onto/review/20260718-4065ab62/execution-preparation/materialized-input.m\
