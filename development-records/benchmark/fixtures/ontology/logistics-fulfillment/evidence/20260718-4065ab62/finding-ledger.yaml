  - finding_id: finding-019
    lens_id: structure
    source_ref: .onto/review/20260718-4065ab62/round1/structure.findings.yaml#structure-candidate-001
    target: logistics-fulfillment-ontology.yaml / OrderLine- Shipment 연결 구조
    evidence_anchor: "materialized-input.md: OrderLine attributes only include
      sku_ref and qty; comment states no reference from the line to the actual
      fulfilling shipment/leg. relations defines only fulfills from Shipment to
      Order with note that OrderLine-level mapping is not included."
    claim: OrderLine fulfillment is structurally disconnected from Shipment and
      DeliveryLeg.
    lens_rationale_summary: The target’s own comments identify partial-shipment
      traceability as impossible, and Shipment.total_weight is defined as the
      sum of constituent OrderLine weights while no structural edge identifies
      those constituent lines. For a WMS/TMS/ERP integration reference, this
      weakens the structural basis for reconciling line-level allocation,
      picking, shipment contents, and delivery evidence.
    proposed_action: Add a line-level fulfillment/allocation structure, such as
      ShipmentLine or FulfillmentAllocation, linking OrderLine to Shipment and
      optionally DeliveryLeg, with shipped/allocated quantity and
      status-relevant timestamps.
    affected_purpose: Concept reference document for WMS/TMS/ERP integration across
      order, inventory, shipment, and delivery concepts.
    failure_condition: When one order is split across multiple shipments or one
      shipment contains selected lines from multiple orders, the ontology cannot
      identify which OrderLine quantity was fulfilled by which physical
      movement.
    impact: Integration consumers cannot reliably reconcile OMS line status, WMS
      pick/pack records, TMS shipment contents, and carrier delivery events at
      the line level, reducing the ontology’s usefulness as a concept standard.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/structure.findings.yaml#structure-candidate-001
      - "materialized-input.md: OrderLine has sku_ref and qty only, plus an
        explicit comment that no reference exists to the shipment/leg that
        fulfilled the line."
      - "materialized-input.md: relations contains only fulfills from Shipment
        to Order and notes that OrderLine-level mapping is omitted."
      - "materialized-input.md: Shipment.total_weight note says it is the sum of
        constituent OrderLine weights."
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Concept reference document for WMS/TMS/ERP integration across
        order, inventory, shipment, and delivery concepts.
      failure_condition: When one order is split across multiple shipments or one
