        the line level, reducing the ontology’s usefulness as a concept
        standard.
      evidence_refs:
        - "materialized-input.md: OrderLine has sku_ref and qty only, plus an
          explicit comment that no reference exists to the shipment/leg that
          fulfilled the line."
        - "materialized-input.md: relations contains only fulfills from Shipment
          to Order and notes that OrderLine-level mapping is omitted."
        - "materialized-input.md: Shipment.total_weight note says it is the sum
          of constituent OrderLine weights."
    causal_path:
      root_cause_candidate: The fulfillment relation is modeled only at order
        granularity even though shipment composition is described in terms of
        order lines.
      root_cause_step_id: finding-019.cause-003
      steps:
        - cause_id: finding-019.cause-001
          claim: OrderLine has no attribute or relation to Shipment or DeliveryLeg.
          relation_to_previous: null
          evidence_refs:
            - "materialized-input.md: OrderLine attributes list only sku_ref and
              qty."
            - "materialized-input.md: OrderLine comment says there is no
              reference to the actual shipment/leg that fulfilled the line."
        - cause_id: finding-019.cause-002
          claim: The only explicit fulfillment edge connects Shipment to Order, not
            Shipment to OrderLine.
          relation_to_previous: symptom_of
          evidence_refs:
            - "materialized-input.md: relations entry name fulfills, from
              Shipment, to Order."
            - "materialized-input.md: fulfills note says it is an order-level
