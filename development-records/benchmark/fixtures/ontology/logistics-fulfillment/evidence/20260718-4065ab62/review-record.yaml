    - issue_id: issue-014
      severity: high
      material: true
      affected_purpose: Concept reference document for WMS/TMS/ERP integration across
        order, inventory, shipment, and delivery concepts.
      failure_condition: When one order is split across multiple shipments or one
        shipment contains selected lines from multiple orders, the ontology
        cannot identify which OrderLine quantity was fulfilled by which physical
        movement.
      impact: Integration consumers cannot reliably reconcile OMS line status, WMS
        pick/pack records, TMS shipment contents, and carrier delivery events at
        the line level, reducing the ontology’s usefulness as a concept
        standard.
      evidence_refs:
        - .onto/review/20260718-4065ab62/round1/structure.findings.yaml#structure-candidate-001
        - "materialized-input.md: OrderLine has sku_ref and qty only, plus an
          explicit comment that no reference exists to the shipment/leg that
          fulfilled the line."
        - "materialized-input.md: relations contains only fulfills from Shipment
          to Order and notes that OrderLine-level mapping is omitted."
        - "materialized-input.md: Shipment.total_weight note says it is the sum
          of constituent OrderLine weights."
        - "materialized-input.md: OrderLine attributes only include sku_ref and
          qty; comment states no reference from the line to the actual
          fulfilling shipment/leg. relations defines only fulfills from Shipment
          to Order with note that OrderLine-level mapping is not included."
      source_lens_ids:
        - structure
      action_candidates: &a6
        - fix_before_release
        - accept_risk
      rationale: "Structure keeps this as a distinct high-severity structural
        line-level traceability defect, while axiology preserves a medium
        value-purpose caveat. The root is accepted, but severity and
        consolidation with the line-level fulfillment cluster remain unresolved
        decisions. Source finding context: logistics-fulfillment-ontology.yaml /
        OrderLine- Shipment 연결 구조 Source finding context: materialized-input.md:
        OrderLine attributes only include sku_ref and qty; comment states no
        reference from the line to the actual fulfilling shipment/leg. relations
        defines only fulfills from Shipment to Order with note that
        OrderLine-level mapping is not included. Source finding context:
        OrderLine fulfillment is structurally disconnected from Shipment and
        DeliveryLeg. Source finding context: The target’s own comments identify
        partial-shipment traceability as impossible, and Shipment.total_weight
        is defined as the sum of constituent OrderLine weights while no
        structural edge identifies those constituent lines. For a WMS/TMS/ERP
        integration reference, this weakens the structural basis for reconciling
        line-level allocation, picking, shipment contents, and delivery
        evidence. Source finding context: Add a line-level
        fulfillment/allocation structure, such as ShipmentLine or
        FulfillmentAllocation, linking OrderLine to Shipment and optionally
        DeliveryLeg, with shipped/allocated quantity and status-relevant
        timestamps. Source finding context:
        .onto/review/20260718-4065ab62/round1/structure.findings.yaml#structure\
        -candidate-001 Source finding context: Concept reference document for
        WMS/TMS/ERP integration across order, inventory, shipment, and delivery
        concepts. Source finding context: When one order is split across
        multiple shipments or one shipment contains selected lines from multiple
        orders, the ontology cannot identify which OrderLine quantity was
        fulfilled by which physical movement. Source finding context:
        Integration consumers cannot reliably reconcile OMS line status, WMS
        pick/pack records, TMS shipment contents, and carrier delivery events at
        the line level, reducing the ontology’s usefulness as a concept
        standard. Source finding context: The fulfillment relation is modeled
        only at order granularity even though shipment composition is described
        in terms of order lines. Source finding context: OrderLine has no
        attribute or relation to Shipment or DeliveryLeg. Source finding
        context: The only explicit fulfillment edge connects Shipment to Order,
        not Shipment to OrderLine. Source finding context: Shipment composition
        nevertheless depends on OrderLine membership."
