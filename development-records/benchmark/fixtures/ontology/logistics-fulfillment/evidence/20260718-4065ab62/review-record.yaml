        배송 완료, 구간 운송과 주문 충족이 같은 의미 계층으로 섞여 상태 매핑과 주문 충족 판단이 부정확해질 수 있다. Source
        finding context: 배송 구간이라는 부분 개념을 전체 출하 이동의 특수한 종류로 분류했다. Source finding
