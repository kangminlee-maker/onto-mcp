        while its definition allows route segments that are not complete
        warehouse-to-customer shipments. Source finding context: This is an
        inter-claim necessary-type conflict: the subtype declaration requires
        all DeliveryLeg instances to be Shipment instances, while the
        DeliveryLeg definition permits instances whose origin/destination
        pattern does not meet the Shipment definition. It matters for
