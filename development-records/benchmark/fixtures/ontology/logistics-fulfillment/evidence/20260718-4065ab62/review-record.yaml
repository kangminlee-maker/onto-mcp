        - problem-framing.yaml
      rationale: "Deliberation resolves the coverage evidence gap and keeps this as a
        material medium route-composition issue. The part-whole structural error
        can make route legs inherit whole-shipment meanings and destabilize
        route/status reasoning, so it must be corrected before the model is used
        as a common route baseline. Source finding context:
        logistics-fulfillment-ontology.yaml / entities.Shipment and
        entities.DeliveryLeg Source finding context:
        .onto/review/20260718-4065ab62/execution-preparation/materialized-input\
        .md:40,
        .onto/review/20260718-4065ab62/execution-preparation/materialized-input\
        .md:52 Source finding context: DeliveryLeg is declared as a Shipment
        while its definition allows route segments that are not complete
        warehouse-to-customer shipments. Source finding context: This is an
        inter-claim necessary-type conflict: the subtype declaration requires
        all DeliveryLeg instances to be Shipment instances, while the
        DeliveryLeg definition permits instances whose origin/destination
        pattern does not meet the Shipment definition. It matters for
        WMS/TMS/ERP concept integration because code or mappings that inherit
        Shipment obligations onto each DeliveryLeg can treat a partial leg as a
        full customer shipment, weakening status, carrier, and fulfillment
        reasoning. Source finding context: Make `Shipment` the whole
        consignment/order movement and model `DeliveryLeg` as a component of
        Shipment instead of `is_a`, or broaden `Shipment` to mean any physical
        cargo movement and introduce a separate whole-shipment concept for
        warehouse-to-customer fulfillment. Source finding context:
        .onto/review/20260718-4065ab62/round1/logic.findings.yaml#logic-candida\
        te-001 Source finding context: Concept baseline for WMS/TMS/ERP
        integration across order, freight, and delivery concepts. Source finding
        context: When DeliveryLeg instances such as hub-to-customer are
        interpreted through the `is_a: Shipment` declaration, they must also
        satisfy the narrower Shipment definition of warehouse-to-customer
        movement. Source finding context: The ontology can classify partial
        route legs as full shipments, making downstream integration rules about
        shipment status, fulfillment, and delivery scope logically unstable.
        Source finding context: The ontology uses inheritance for a part-of
        route segment relationship while keeping the parent definition narrower
        than the child’s allowed instances. Source finding context: `Shipment`
        is defined as movement from warehouse to customer. Source finding
        context: `DeliveryLeg` is declared `is_a: Shipment`. Source finding
        context: `DeliveryLeg` permits route segments such as warehouse-to-hub
        and hub-to-customer, which are not necessarily full
        warehouse-to-customer movements. Source finding context:
        logistics-fulfillment-ontology.yaml / DeliveryLeg 경로 구성 구조 Source
        finding context: materialized-input.md: Shipment definition says
        DeliveryLeg is also a kind of Shipment; DeliveryLeg has leg_seq,
        from_ref, and to_ref; relations contains only fulfills from Shipment to
        Order and no parent shipment, route, or next-leg relation. Source
        finding context: DeliveryLeg has no structural link that groups legs
        into a shipment route. Source finding context: A sequence number is only
        meaningful within a containing route or shipment. Because DeliveryLeg is
        modeled only as an is_a Shipment subtype, each leg inherits
        shipment-level behavior but lacks a structural edge that says which
        shipment route it belongs to or which legs precede/follow it. Source
        finding context: Introduce a parent/composition relation such as
        Shipment has_many DeliveryLeg, DeliveryLeg belongs_to Shipment, or a
        separate Route entity with ordered legs; scope leg_seq to that parent.
        Source finding context:
        .onto/review/20260718-4065ab62/round1/structure.findings.yaml#structure\
        -candidate-002 Source finding context: Concept reference document for
        shipment and delivery integration between WMS/TMS/carrier systems.
        Source finding context: When a delivery has multiple legs, consumers
        cannot reconstruct the end-to-end route or associate leg-level tracking
        and locations with one parent shipment. Source finding context:
        TMS/carrier integration loses a stable structural path for multi-leg
        delivery state, ETA, and exception handling, even though DeliveryLeg is
        declared as part of the shipment model. Source finding context: The
        ontology uses inheritance to relate DeliveryLeg to Shipment but omits
        the composition or ordering relation required for route-level structure.
        Source finding context: DeliveryLeg is a route segment with
        leg_seq/from/to attributes. Source finding context: No explicit relation
        groups DeliveryLeg instances under a parent shipment or route. Source
        finding context: The is_a Shipment link makes each leg a kind of
        shipment but does not provide route containment or adjacency."
