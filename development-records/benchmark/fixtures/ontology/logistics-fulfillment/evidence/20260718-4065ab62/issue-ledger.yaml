  - issue_id: issue-004
    root_cause_hypothesis: The ontology optimizes for order-level fulfillment
      simplicity instead of preserving line-level operational traceability.
    root_confidence: medium
    surface_finding_ids:
      - finding-004
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: Omitting OrderLine-to-shipment fulfillment mapping is
      misaligned with the ontology's fulfillment integration purpose because it
      sacrifices operational traceability for a simpler order-level relation.
    proposed_action: Add a fulfillment allocation/detail concept linking OrderLine
      to Shipment or DeliveryLeg with shipped quantity, split/partial flags,
      timestamps, and exception/cancellation state.
    affected_purpose: Use the ontology as a concept standard across order, freight,
      and delivery workflows while controlling logistics operating risk.
    failure_condition: An order is partially shipped, split across shipments, or has
      an exception on one line, but the ontology only records a
      Shipment-to-Order relation.
    impact: The reference model cannot explain which ordered quantities were
      fulfilled by which physical movements, undermining exception resolution,
      customer service, reconciliation, and auditability.
