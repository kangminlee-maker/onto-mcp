  - issue_id: issue-001
    root_cause_hypothesis: Inventory allocation depends on non-temporal
      current/nightly quantity surfaces rather than a time-scoped,
      source-authoritative availability model.
    root_confidence: medium
    surface_finding_ids:
      - finding-001
      - finding-006
    relation_refs:
      - rel-004
    raised_by_lens_ids:
      - axiology
      - coverage
    issue_statement: "Shared-root issue across finding-001, finding-006: Inventory
      allocation depends on non-temporal current/nightly quantity surfaces
      rather than a time-scoped, source-authoritative availability model."
    proposed_action: "Separate physical, accounting, and allocatable inventory
      concepts; add as_of/effective_at timestamps; define the authority for
      allocation-time availability, and require allocations to reference a
      current WMS-backed or event-sourced availability record rather than a
      daily ERP-aligned snapshot. / Introduce temporal inventory concepts:
      `InventorySnapshot` with `as_of`, source system, and scope;
      `InventoryMovement` or `InventoryTransaction` for receipts, picks,
      shipments, returns, adjustments; and `Reservation`/`Allocation` with
      effective time and release/consume events."
    affected_purpose: Use the ontology as the WMS/TMS/ERP integration concept
      baseline for order, inventory, shipment, and delivery concepts, especially
      authority and temporality. / Inventory and order fulfillment authority for
      WMS/TMS/ERP integration.
    failure_condition: During intraday order allocation, the ontology directs
      consumers to a daily InventoryAggregate snapshot while operational WMS and
      accounting ERP quantities may diverge until nightly reconciliation. / When
      an order is accepted or audited at a prior point in time, the ontology
      cannot reconstruct available or on-hand inventory from effective
      timestamps or movement history.
    impact: The reference model can drive oversell, under-allocation, and audit
      disputes because it does not identify the valid inventory authority or
      validity time for allocation decisions. / The concept baseline cannot
      support allocation correctness, dispute analysis, or cross-system
      reconciliation because only current/nightly quantity surfaces are modeled.
    evidence_refs:
