  - issue_id: issue-005
    root_cause_hypothesis: The ontology's fulfillment relation is scoped to
      `Shipment -> Order` and does not include a line-level
      fulfillment/allocation entity.
    root_confidence: medium
    surface_finding_ids:
      - finding-005
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: OrderLine-level fulfillment allocation is missing, so partial
      shipment coverage is incomplete.
    proposed_action: Add a line-fulfillment concept such as `FulfillmentAllocation`
      or `ShipmentLine` with refs to `OrderLine`, `Shipment` or `DeliveryLeg`,
      fulfilled quantity, allocation/pick/ship timestamps, and lifecycle/status
      for partial, canceled, or backordered quantities.
    affected_purpose: WMS/TMS/ERP integration concept baseline for order, inventory,
      shipment, and delivery concepts.
    failure_condition: When one order has multiple lines or a line is partially
      fulfilled across multiple shipments, the ontology has no concept to bind
      the fulfilled quantity to the actual shipment or leg.
    impact: Operational reconciliation and exception handling become non-actionable
      because order status, inventory movement, and shipment evidence cannot be
      traced at the unit where fulfillment actually occurs.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/coverage.findings.yaml#coverage-candidate-001
      - "OrderLine comment: no reference to actual cargo/segment fulfilling the
        line"
      - "relations `fulfills`: Shipment to Order only; note says no
        OrderLine-level mapping"
      - "Embedded materialized input: OrderLine attributes comment; relations
        `fulfills` note"
    severity: high
    domain_threshold_used: null
    singleton_reason: "Runtime completion: finding is not connected to another issue
      by same_root_candidate relation refs."
  - issue_id: issue-006
    root_cause_hypothesis: Lifecycle enumerations are limited to forward-progress
      delivery states and define delivered as final, leaving non-happy-path and
      post-terminal logistics states outside the model.
    root_confidence: medium
    surface_finding_ids:
      - finding-008
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: Order and Shipment lifecycle coverage omits cancellation,
      failed delivery, return, reissue, correction, reversal, and archival
      phases despite TrackingEvent supporting exceptions.
    proposed_action: Extend lifecycle coverage with explicit non-happy-path,
      terminal, and post-terminal concepts and rules for how exception or
      correction events affect order, shipment, and audit states.
    affected_purpose: Order, freight, and delivery concept consistency for logistics
      operations and WMS/TMS/ERP reconciliation.
    failure_condition: Fulfillment leaves the happy path, a delivered shipment must
      be corrected, or cancellation/return/reissue needs to be represented
      without overloading existing statuses.
    impact: Exceptions and reversals cannot be represented consistently across OMS,
      TMS, carrier tracking, and ERP reconciliation, hiding operational risk.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/coverage.findings.yaml#coverage-candidate-004
      - "Order `fulfillment_status` values: received, allocated, picking,
        shipped, delivered"
      - "Shipment `status` values: created, picked, in_transit, delivered; note
        says delivered is final"
      - TrackingEvent `event_type` includes exception
      - "Embedded materialized input: Order `fulfillment_status` values;
        Shipment `status` values and note; TrackingEvent `event_type` values"
    severity: medium
    domain_threshold_used: null
    singleton_reason: Only finding-008 raises the lifecycle coverage gap; relation
      rel-016 is a shared_cause_candidate with the status-mapping issue and is
      preserved for runtime dependency context rather than used to merge issues.
