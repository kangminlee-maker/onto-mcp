  - issue_id: issue-002
    root_cause_hypothesis: Freight measurement failures stem from representing
      logistics measurements as bare numbers or strings instead of structured
      value/unit/source measurements.
    root_confidence: medium
    surface_finding_ids:
      - finding-002
      - finding-009
    relation_refs:
      - rel-010
    raised_by_lens_ids:
      - axiology
      - coverage
    issue_statement: "Shared-root issue across finding-002, finding-009: Freight
      measurement failures stem from representing logistics measurements as bare
      numbers or strings instead of structured value/unit/source measurements."
    proposed_action: Represent weight and dimensions as structured measurements with
      value, unit, source, and conversion policy; define canonical integration
      units for shipment totals; store total_weight with its unit and derivation
      timestamp/source. / Add normalized measurement concepts with unit of
      measure, precision, source, and effective time; represent
      package/handling-unit hierarchy such as carton, pallet, parcel, and
      shipment container; and attach gross/net/dimensional weight and dimensions
      to the appropriate level.
    affected_purpose: Use the ontology as the concept baseline for unit-consistent
      WMS/TMS/ERP integration and logistics risk control. / Freight, warehouse,
      and TMS integration concept baseline.
    failure_condition: When SKUs from different warehouses or source systems are
      combined into shipments, total_weight may sum values recorded in
      incompatible or unknown units. / When SKUs or shipments cross
      warehouses/carriers using different measurement conventions, the ontology
      cannot determine the unit, measurement basis, or package level of
      weight/dimensions.
    impact: The model can produce incorrect shipment weight and dimensions,
      weakening carrier integration, cost calculation, load planning, and
      operational trust in the reference ontology. / Carrier rating, routing,
      capacity planning, and reconciliation can be wrong because numeric
      measurements are not semantically comparable across systems.
