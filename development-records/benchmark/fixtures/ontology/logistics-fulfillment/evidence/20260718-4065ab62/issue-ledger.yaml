  - issue_id: issue-009
    root_cause_hypothesis: DeliveryLeg route reasoning is unstable because the
      ontology uses inheritance where it needs shipment-route composition and
      ordering.
    root_confidence: medium
    surface_finding_ids:
      - finding-014
      - finding-020
    relation_refs:
      - rel-018
    raised_by_lens_ids:
      - logic
      - structure
    issue_statement: "Shared-root issue across finding-014, finding-020: DeliveryLeg
      route reasoning is unstable because the ontology uses inheritance where it
      needs shipment-route composition and ordering."
    proposed_action: Make `Shipment` the whole consignment/order movement and model
      `DeliveryLeg` as a component of Shipment instead of `is_a`, or broaden
      `Shipment` to mean any physical cargo movement and introduce a separate
      whole-shipment concept for warehouse-to-customer fulfillment. / Introduce
      a parent/composition relation such as Shipment has_many DeliveryLeg,
      DeliveryLeg belongs_to Shipment, or a separate Route entity with ordered
      legs; scope leg_seq to that parent.
    affected_purpose: Concept baseline for WMS/TMS/ERP integration across order,
      freight, and delivery concepts. / Concept reference document for shipment
      and delivery integration between WMS/TMS/carrier systems.
    failure_condition: "When DeliveryLeg instances such as hub-to-customer are
      interpreted through the `is_a: Shipment` declaration, they must also
      satisfy the narrower Shipment definition of warehouse-to-customer
      movement. / When a delivery has multiple legs, consumers cannot
      reconstruct the end-to-end route or associate leg-level tracking and
      locations with one parent shipment."
    impact: The ontology can classify partial route legs as full shipments, making
      downstream integration rules about shipment status, fulfillment, and
      delivery scope logically unstable. / TMS/carrier integration loses a
      stable structural path for multi-leg delivery state, ETA, and exception
      handling, even though DeliveryLeg is declared as part of the shipment
      model.
    evidence_refs:
      - .onto/review/20260718-4065ab62/round1/logic.findings.yaml#logic-candidate-001
      - .onto/review/20260718-4065ab62/execution-preparation/materialized-input.md:40-49
