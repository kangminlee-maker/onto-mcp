        `Shipment`. Source finding context: All `DeliveryLeg` instances inherit
        the `Shipment.status` enum and its unqualified final `delivered` rule.
        Source finding context: The inherited final state must also apply to
        intermediate route legs such as warehouse-to-hub legs."
