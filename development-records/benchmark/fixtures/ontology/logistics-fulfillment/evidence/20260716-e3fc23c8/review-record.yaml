        delivered]`; `Shipment.attributes.status.note`: \"delivered가 최종 상태다.\";
        `DeliveryLeg.is_a: Shipment`; `DeliveryLeg.definition`: \"화물 경로의 한 구간(예:
        창고→허브, 허브→고객).\" Source finding context: `DeliveryLeg` inherits a
        shipment-level final-state rule that is satisfiable for a whole shipment
        but logically over-constrains intermediate route legs. Source finding
        context: The conflict is between the necessary inheritance claim
        (`DeliveryLeg is_a Shipment`) and the necessary status-finality claim
        attached to `Shipment`. Under the explicit example `창고→허브`, the leg's
        completion condition is arrival at a hub, but the inherited final status
        is `delivered`; this forces the same entity type to use one terminal
        state for both leg-complete and shipment/customer-delivered. That
        weakens the document as a WMS/TMS/ERP concept baseline because
        downstream integrations cannot consistently decide whether `delivered`
        closes a route segment or the customer shipment. Source finding context:
        Separate `DeliveryLeg` from `Shipment` inheritance, or split the state
        model into `Shipment.status` and `DeliveryLeg.status` with distinct
        terminal meanings such as `arrived_destination` for a leg and
        `delivered_to_customer` for a shipment. Source finding context:
        .onto/review/20260716-e3fc23c8/round1/logic.findings.yaml#logic-candida\
        te-001 Source finding context: WMS/TMS/ERP integration concept baseline
        for shipment and delivery concepts, especially status model consistency.
        Source finding context: A multi-leg route includes an intermediate leg
        such as warehouse-to-hub and uses inherited `Shipment.status.delivered`
        as the leg's terminal status. Source finding context: The same terminal
        status can represent two different closure events, so integrations may
        close the whole shipment when only a leg has completed, or fail to close
        a leg without implying customer delivery. Source finding context: The
        ontology models route segments as subclasses of whole physical shipments
        while placing an unqualified final delivery state on the parent type.
