        context: logistics-fulfillment-ontology.yaml:43-45;
        logistics-fulfillment-ontology.yaml:76-85;
        logistics-fulfillment-ontology.yaml:110-112 Source finding context: The
        ontology lacks audit evidence and single-authority concepts for values
        managed across systems or manually adjusted. Source finding context:
