      rationale: "The projection consistently supports this medium structural
        provenance issue. It enables the broader inventory audit and temporal
        concerns by disconnecting allocation values from their warehouse-level
        evidence, so it should close before the next stage. Source finding
        context: logistics-fulfillment-ontology.yaml / InventoryAggregate and
        InventoryRecord structure Source finding context: Embedded Materialized
        Input: InventoryRecord references Warehouse and Sku; InventoryAggregate
        references only Sku and has available_qty; integrity rule says
        allocation reads InventoryAggregate.available_qty. Source finding
        context: InventoryAggregate is structurally disconnected from the
        warehouse-level inventory records it summarizes. Source finding context:
        The structure contains InventoryRecord.wh_ref and sku_ref, and
        InventoryAggregate.sku_ref, but no aggregate-of, derived-from, or
        snapshot relation between them. Because allocation is declared to read
        InventoryAggregate.available_qty, the concept used for fulfillment
        decisions has no explicit structural path back to the warehouse records
        or warehouses that would execute the pick/ship flow. Source finding
        context: Add an explicit relation such as InventoryAggregate aggregates
        InventoryRecord, or model InventorySnapshot/AvailabilityByWarehouse with
        source InventoryRecord refs, aggregation time, and scope. If enterprise
        aggregate is intentionally independent, document its authoritative
        source relation explicitly. Source finding context:
        .onto/review/20260716-e3fc23c8/round1/structure.findings.yaml#structure\
        -candidate-002 Source finding context: Concept baseline for inventory
        allocation in WMS/TMS/ERP integration. Source finding context: When
        allocation decisions must be traced from enterprise available_qty to
        specific warehouse stock records for picking or reconciliation, the
        ontology has no connected structural path. Source finding context: This
        makes the allocation concept structurally incomplete: the value used to
        accept orders is disconnected from warehouse-level execution and
        reconciliation records, reducing actionability and auditability for
        integration. Source finding context: InventoryAggregate is modeled as a
        standalone SKU-level entity with no declared aggregate/source relation
        to InventoryRecord. Source finding context: InventoryRecord provides the
        warehouse/SKU inventory structure via wh_ref and sku_ref. Source finding
        context: InventoryAggregate provides SKU-level available_qty but only
