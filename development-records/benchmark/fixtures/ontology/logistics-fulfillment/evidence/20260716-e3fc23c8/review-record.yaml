      rationale: "The issue remains the distinct medium structural expression of the
        broader high-severity line-fulfillment issue-001. It should be tracked
        as the structural connectivity work item under the broader
        fulfillment-allocation fix. Source finding context:
        logistics-fulfillment-ontology.yaml / entities.OrderLine and relation
        fulfills Source finding context: Embedded Materialized Input: OrderLine
        attributes only define sku_ref and qty; relations includes only fulfills
        from Shipment to Order with note \"주문 단위 관계이며 OrderLine 단위 매핑은 두지 않는다.\"
        Source finding context: OrderLine is not structurally connected to
        Shipment at fulfillment granularity. Source finding context: OrderLine
        is reachable from Order and Shipment is connected to Order, but the only
        fulfillment edge is order-level. The target declares itself as a concept
        baseline for WMS/TMS/ERP integration across order, inventory allocation,
        shipment, and delivery. In that declared structure, line-level
        fulfillment is a necessary bridge between order content and physical
        movement; without it, partial shipments or split fulfillment cannot be
        represented as connected paths inside the ontology. Source finding
        context: Add a line-level fulfillment/allocation concept, such as
        ShipmentLine or FulfillmentAllocation, with refs to OrderLine and
        Shipment plus fulfilled quantity and timing/status fields as needed.
        Source finding context:
        .onto/review/20260716-e3fc23c8/round1/structure.findings.yaml#structure\
        -candidate-001 Source finding context: WMS/TMS/ERP integration concept
        baseline for order, inventory allocation, shipment, and delivery. Source
        finding context: When one order has multiple lines, partial shipments,
        split shipments, or multiple delivery legs, the ontology cannot answer
        which OrderLine quantity was fulfilled by which Shipment/DeliveryLeg.
        Source finding context: This weakens structural completeness for
        integration because OMS order lines and TMS/WMS shipment execution
        cannot be reconciled through the model; downstream systems would need
        out-of-model joins or assumptions. Source finding context: The
        fulfillment relation is modeled only at Shipment-to-Order granularity
        while OrderLine has no outgoing or incoming fulfillment relation. Source
        finding context: OrderLine contains sku_ref and qty but no Shipment,
        DeliveryLeg, or fulfillment-allocation reference. Source finding
        context: The ontology's only declared relation connects Shipment to
        Order rather than Shipment to OrderLine. Source finding context: The
        relation note explicitly excludes OrderLine-level mapping."
