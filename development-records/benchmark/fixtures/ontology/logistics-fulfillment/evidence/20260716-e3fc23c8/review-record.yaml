    - issue_id: issue-015
      candidates: *a16
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "The issue is consistently supported as a medium structural
        composition gap and is closely tied to the DeliveryLeg inheritance root
        in issue-006. It should be carried as part of the DeliveryLeg
        composition redesign. Source finding context:
        logistics-fulfillment-ontology.yaml / DeliveryLeg as Shipment subtype
        Source finding context: Embedded Materialized Input: Shipment definition
        says DeliveryLeg is also a kind of Shipment; DeliveryLeg is_a Shipment
        and has leg_seq/from_ref/to_ref; no attribute or relation links
        DeliveryLeg instances to a parent end-to-end Shipment. Source finding
        context: DeliveryLeg lacks a structural parent path to the shipment
        route it composes. Source finding context: The target intends to model
        shipment and delivery, and DeliveryLeg is defined as a route segment. A
        sequence number alone is not structurally meaningful without a parent
        route/shipment scope. Because DeliveryLeg inherits Shipment rather than
        being linked as a component, the model cannot represent which legs
        belong to the same shipment or reconstruct a route as connected
        segments. Source finding context: Model DeliveryLeg as a component of
        Shipment with a required shipment_ref or relation such as Shipment
        has_leg DeliveryLeg, keeping leg_seq scoped to that parent shipment. If
        legs remain subtypes, add a parent_shipment_ref for route composition.
        Source finding context:
        .onto/review/20260716-e3fc23c8/round1/structure.findings.yaml#structure\
        -candidate-003 Source finding context: Concept baseline for shipment and
        delivery path integration. Source finding context: When a Shipment has
        multiple route segments, the ontology cannot determine which
        DeliveryLegs compose that shipment or whether their sequence belongs to
        the same route. Source finding context: This breaks structural route
        completeness for TMS-style shipment execution and tracking because
        segment data cannot be reliably connected into one shipment movement.
        Source finding context: The model uses inheritance for DeliveryLeg but
        omits a composition relation from Shipment to DeliveryLeg. Source
        finding context: DeliveryLeg is defined as a route segment with
        leg_seq/from_ref/to_ref. Source finding context: DeliveryLeg is declared
        as is_a Shipment, making it a Shipment subtype rather than an explicit
        component connected to a parent Shipment. Source finding context: No
        relation or attribute connects DeliveryLeg instances to a parent
        end-to-end Shipment."
