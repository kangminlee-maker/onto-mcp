        composition redesign. Source finding context:
        logistics-fulfillment-ontology.yaml / DeliveryLeg as Shipment subtype
        Source finding context: Embedded Materialized Input: Shipment definition
        says DeliveryLeg is also a kind of Shipment; DeliveryLeg is_a Shipment
        and has leg_seq/from_ref/to_ref; no attribute or relation links
        DeliveryLeg instances to a parent end-to-end Shipment. Source finding
        context: DeliveryLeg lacks a structural parent path to the shipment
        route it composes. Source finding context: The target intends to model
        shipment and delivery, and DeliveryLeg is defined as a route segment. A
        sequence number alone is not structurally meaningful without a parent
        route/shipment scope. Because DeliveryLeg inherits Shipment rather than
        being linked as a component, the model cannot represent which legs
        belong to the same shipment or reconstruct a route as connected
        segments. Source finding context: Model DeliveryLeg as a component of
