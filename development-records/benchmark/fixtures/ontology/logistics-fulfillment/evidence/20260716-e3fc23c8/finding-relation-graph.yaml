  - relation_id: rel-008
    from_finding_id: finding-006
    to_finding_id: finding-013
    relation: same_root_candidate
    root_hypothesis: DeliveryLeg is modeled as a subtype of Shipment even though it
      is semantically a route segment or component of an end-to-end shipment.
    shared_cause: null
    rationale: finding-006 and finding-013 both center on DeliveryLeg is_a Shipment
      as the root modeling error. The evolution lens emphasizes future extension
      pressure on Shipment semantics and status enums; the semantics lens
      emphasizes the part-whole versus subtype category error.
    confidence: high
  - relation_id: rel-009
    from_finding_id: finding-013
    to_finding_id: finding-010
    relation: causes
    root_hypothesis: Treating DeliveryLeg as a Shipment subtype causes route legs to
      inherit Shipment's unqualified delivered final-state rule.
    shared_cause: null
    rationale: "finding-013 identifies the incorrect subtype relationship between
      route segments and whole shipments. finding-010 is the logical downstream
      contradiction: intermediate legs inherit Shipment.status.delivered as a
      final state, making leg completion and customer shipment delivery
      ambiguous."
    confidence: high
  - relation_id: rel-010
    from_finding_id: finding-013
    to_finding_id: finding-018
    relation: causes
    root_hypothesis: Using inheritance instead of composition for DeliveryLeg causes
      the ontology to omit a parent-shipment route-composition path.
    shared_cause: null
    rationale: "finding-018's structural gap, no parent path from DeliveryLeg to the
      shipment route it composes, follows from the same modeling choice
      described in finding-013: DeliveryLeg is represented as is_a Shipment
      rather than part_of/has_leg Shipment."
    confidence: high
  - relation_id: rel-011
    from_finding_id: finding-007
    to_finding_id: finding-014
    relation: shared_cause_candidate
    root_hypothesis: Status semantics are not centralized or namespaced across OMS,
      TMS, and carrier event models, leaving mappings to individual
      integrations.
    shared_cause:
      cause_claim: Carrier TrackingEvent values and internal Shipment/Order statuses
        are independently managed, and mapping authority is delegated outside
        the ontology.
      from_cause_ref: finding-007.cause-002
      to_cause_ref: finding-014.cause-003
    rationale: finding-007 targets the evolution risk from distributed
      carrier-status mapping authority; finding-014 targets the semantic
      ambiguity of identical delivered labels across independently managed
      systems. Both arise because the ontology lacks a shared mapping/namespace
      concept for cross-system statuses.
    confidence: high
  - relation_id: rel-012
    from_finding_id: finding-005
    to_finding_id: finding-007
    relation: shared_cause_candidate
    root_hypothesis: Shipment and tracking lifecycle concepts are success-path and
