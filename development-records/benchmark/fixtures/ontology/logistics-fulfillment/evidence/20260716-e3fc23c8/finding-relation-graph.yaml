    to_finding_id: finding-009
    relation: same_root_candidate
    root_hypothesis: Inventory is modeled as current or nightly aggregate quantities
      without time-qualified snapshots, movements, reservations, or effective
      intervals.
    shared_cause: null
    rationale: Both findings trace inventory audit/allocation weakness to quantity
      concepts that lack as_of/effective-time and event history. finding-002
      emphasizes coverage for audit and allocation decisions; finding-009
      emphasizes future evolution from nightly batch to real-time/event-based
      synchronization.
    confidence: high
  - relation_id: rel-003
