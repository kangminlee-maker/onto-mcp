  - relation_id: rel-004
    from_finding_id: finding-017
    to_finding_id: finding-002
    relation: shared_cause_candidate
    root_hypothesis: Inventory allocation values are modeled as standalone aggregate
      scalars without explicit provenance to the records, timing, or events that
      make them authoritative.
    shared_cause:
      cause_claim: InventoryAggregate.available_qty is a standalone allocation input
        without a declared derivation/provenance path or time-qualified basis.
      from_cause_ref: finding-017.cause-003
      to_cause_ref: finding-002.cause-002
    rationale: finding-017 shows InventoryAggregate is structurally disconnected
      from InventoryRecord; finding-002 shows the same aggregate is a nightly
