    to_finding_id: finding-002
    relation: symptom_of
    root_hypothesis: The semantic mismatch in available_qty arises because inventory
      availability is not modeled as a time-qualified snapshot or event-derived
      availability concept.
    shared_cause: null
    rationale: "finding-012's claim that available_qty reads like current
      availability while being a nightly snapshot is a semantic symptom of
      finding-002's broader root: inventory quantities lack effective time,
