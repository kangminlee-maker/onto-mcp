  - issue_id: issue-012
    root_cause_hypothesis: Shipment.total_weight is a derived aggregate over
      SKU/order-line weights without preserving unit or conversion basis.
    root_confidence: high
    surface_finding_ids:
      - finding-015
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: SKU weight and dimension units may vary by source, but
      Shipment.total_weight stores only a bare numeric total.
    proposed_action: Model weight and dimensions as value-plus-unit structures and
      store total_weight with unit, conversion basis, and calculation time or
      source.
    affected_purpose: Freight and inventory measurement semantics in the WMS/TMS/ERP
      integration baseline.
    failure_condition: SKU weights from different warehouses or source systems with
      different units are combined into one Shipment.total_weight calculation.
    impact: The total weight can lose its measurement meaning and drive incorrect
      freight rating, load-limit, or carrier-integration decisions.
    evidence_refs:
