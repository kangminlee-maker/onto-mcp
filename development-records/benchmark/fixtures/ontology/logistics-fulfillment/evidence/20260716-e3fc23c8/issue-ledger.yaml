    issue_statement: OrderLine is not structurally connected to Shipment at
      fulfillment granularity.
    proposed_action: Add ShipmentLine or FulfillmentAllocation with references to
      OrderLine and Shipment plus fulfilled quantity, timing, and status fields.
    affected_purpose: WMS/TMS/ERP integration concept baseline for order, inventory
