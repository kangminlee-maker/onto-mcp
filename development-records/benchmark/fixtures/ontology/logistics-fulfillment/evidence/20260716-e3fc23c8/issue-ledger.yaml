  - issue_id: issue-011
    root_cause_hypothesis: Identical status labels across OMS, TMS, and carrier
      events are not semantically namespaced or mapped under a shared authority.
    root_confidence: high
    surface_finding_ids:
      - finding-014
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: The label delivered appears in order, shipment, and tracking
      status models with different authorities and completion conditions but no
      ontology-owned disambiguation.
    proposed_action: Namespace or separate status concepts by authority and define
      standard transition/mapping rules among carrier events, shipment
      completion, and order fulfillment completion.
    affected_purpose: Semantic consistency and precedence for order, shipment, and
      delivery status models.
    failure_condition: An OMS, TMS, or carrier delivered value is treated as
      equivalent to another system's delivered state for order completion,
      customer notification, settlement, or SLA decisions.
    impact: Delivery completion timing and responsible authority can differ by
      integration because the same label carries multiple meanings without a
      shared mapping contract.
    evidence_refs:
