    root_cause_hypothesis: TrackingEvent attaches only to Shipment while leg-level
      route composition and event scoping are not modeled.
    root_confidence: medium
    surface_finding_ids:
      - finding-019
    relation_refs: []
    raised_by_lens_ids:
