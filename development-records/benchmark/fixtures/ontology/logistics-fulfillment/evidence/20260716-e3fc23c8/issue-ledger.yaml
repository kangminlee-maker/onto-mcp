  - issue_id: issue-014
    root_cause_hypothesis: InventoryAggregate is modeled as a standalone SKU-level
      entity with no declared aggregate/source relation to InventoryRecord.
    root_confidence: high
    surface_finding_ids:
      - finding-017
    relation_refs: []
    raised_by_lens_ids:
      - structure
    issue_statement: InventoryAggregate is structurally disconnected from the
      warehouse-level inventory records it summarizes.
    proposed_action: Add an explicit aggregates/derived-from relation from
      InventoryAggregate to InventoryRecord, or model
      InventorySnapshot/AvailabilityByWarehouse with source records, aggregation
