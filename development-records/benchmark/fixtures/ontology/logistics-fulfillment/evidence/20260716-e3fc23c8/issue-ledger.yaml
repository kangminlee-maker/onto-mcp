  - issue_id: issue-015
    root_cause_hypothesis: DeliveryLeg is modeled through inheritance but lacks a
      composition relation from Shipment to DeliveryLeg.
    root_confidence: high
    surface_finding_ids:
      - finding-018
    relation_refs: []
    raised_by_lens_ids:
      - structure
    issue_statement: DeliveryLeg instances lack a structural parent path to the
      shipment route they compose.
    proposed_action: Model DeliveryLeg as a component of Shipment with a required
      shipment_ref or has_leg relation, keeping leg_seq scoped to the parent
      shipment.
    affected_purpose: Concept baseline for shipment and delivery path integration.
    failure_condition: When a Shipment has multiple route segments, the ontology
      cannot determine which DeliveryLegs compose that shipment or whether their
      sequence belongs to the same route.
    impact: Segment data cannot be reliably connected into one shipment movement,
      breaking structural route completeness for TMS-style shipment execution
      and tracking.
    evidence_refs:
      - .onto/review/20260716-e3fc23c8/round1/structure.findings.yaml#structure-candidate-003
      - 'Embedded Materialized Input: Shipment definition: "배송 구간(DeliveryLeg)도
