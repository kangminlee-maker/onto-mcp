    target: InventoryAggregate.available_qty and inventory allocation rule
    evidence_anchor: .onto/review/20260716-e3fc23c8/execution-preparation/materialized-input.md:86-90,111-112
    claim: "`available_qty`가 매일 밤 저장되는 스냅샷인데 일중 주문 할당의 가용 재고로 쓰여 시간 의미가 이름과 맞지 않는다."
    lens_rationale_summary: "`available_qty`라는 이름은 할당 시점의 가용 수량을 뜻하지만, 정의상 값은 야간
      스냅샷이다. 시간 기준(`as_of`, snapshot time, reservation cutoff)이 없어서 '현재 가용'과
      '스냅샷 가용'이 같은 개념으로 합쳐진다."
    proposed_action: 속성명을 `available_qty_snapshot`처럼 시간성을 드러내거나, `as_of_at`, 집계 기준,
      예약/할당 반영 범위를 함께 모델링한다. 일중 할당은 실시간 ATP/예약 원장 등 별도 권위 개념을 참조하게 한다.
    affected_purpose: 주문·재고 개념의 시간성과 운영 위험을 통합 기준 문서 안에서 명확히 하는 목적.
