schema_version: 1
session_id: 20260716-e3fc23c8
findings:
  - finding_id: finding-001
    lens_id: coverage
    source_ref: .onto/review/20260716-e3fc23c8/round1/coverage.findings.yaml#coverage-candidate-001
    target: OrderLine fulfillment coverage
    evidence_anchor: logistics-fulfillment-ontology.yaml:20-26;
      logistics-fulfillment-ontology.yaml:100-104
    claim: OrderLine-to-Shipment fulfillment mapping is absent, so partial
      fulfillment coverage stops at the order level.
    lens_rationale_summary: For a WMS/TMS/ERP integration baseline, order
      fulfillment must reconstruct which quantities of which order lines were
      picked, shipped, split, or delayed. An order-level Shipment-to-Order
      relation cannot represent partial shipments, split shipments,
      substitutions, short picks, or line-level proof of fulfillment.
    proposed_action: Add a line-level fulfillment/allocation concept such as
      FulfillmentLine or ShipmentLine with order_line_ref, shipment_ref,
      shipped_qty, picked_qty, fulfilled_at, and status; keep the order-level
      relation as a derived summary if needed.
    affected_purpose: WMS/TMS/ERP integration concept baseline for order, inventory,
      freight, and delivery consistency.
    failure_condition: When an order has multiple lines, partial shipment, split
      shipment, or delayed/backordered lines, the ontology cannot identify which
      line quantity moved in which shipment.
    impact: The model cannot support reconciliation between OMS order promises, WMS
      picking/packing, TMS shipment execution, and customer delivery evidence at
      the operational unit where fulfillment actually happens.
    evidence_refs:
      - .onto/review/20260716-e3fc23c8/round1/coverage.findings.yaml#coverage-candidate-001
      - logistics-fulfillment-ontology.yaml:20-26
      - logistics-fulfillment-ontology.yaml:100-104
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: WMS/TMS/ERP integration concept baseline for order, inventory,
        freight, and delivery consistency.
      failure_condition: When an order has multiple lines, partial shipment, split
        shipment, or delayed/backordered lines, the ontology cannot identify
        which line quantity moved in which shipment.
      impact: The model cannot support reconciliation between OMS order promises, WMS
        picking/packing, TMS shipment execution, and customer delivery evidence
        at the operational unit where fulfillment actually happens.
      evidence_refs:
        - logistics-fulfillment-ontology.yaml:20-26
        - logistics-fulfillment-ontology.yaml:100-104
    causal_path:
      root_cause_candidate: Fulfillment is modeled only as a Shipment-to-Order
        relation, while OrderLine has no fulfillment allocation or shipment-line
        concept.
      root_cause_step_id: finding-001.cause-002
      steps:
        - cause_id: finding-001.cause-001
          claim: OrderLine includes sku_ref and qty but no reference to a fulfillment,
            shipment, shipment line, delivery leg, or fulfilled quantity.
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:20-26
        - cause_id: finding-001.cause-002
          claim: The sole fulfills relation links Shipment to Order and explicitly states
            that OrderLine-level mapping is not included.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:100-104
      unresolved_beyond_evidence: null
  - finding_id: finding-002
    lens_id: coverage
    source_ref: .onto/review/20260716-e3fc23c8/round1/coverage.findings.yaml#coverage-candidate-002
    target: InventoryRecord and InventoryAggregate temporal coverage
    evidence_anchor: logistics-fulfillment-ontology.yaml:71-85;
      logistics-fulfillment-ontology.yaml:106-107
    claim: Inventory quantities lack effective time, event history, and reservation
      lifecycle coverage.
    lens_rationale_summary: Inventory is time-dependent. Without as_of timestamps,
      transaction/reservation events, and allocation lifecycle states, the
      ontology cannot reconstruct inventory at order placement, explain
      oversell/undersell conditions, or reconcile WMS physical stock with ERP
      accounting stock across time.
    proposed_action: Introduce inventory temporal concepts such as
      InventorySnapshot(as_of), InventoryTransaction, Reservation/Allocation
      with lifecycle status, source_system, and quantity deltas. Define whether
      available_qty is derived from these records or an externally authoritative
      snapshot.
    affected_purpose: Inventory consistency and allocation correctness across WMS,
      ERP, OMS, and fulfillment operations.
    failure_condition: When inventory changes between nightly snapshots, or when
      users need to audit the inventory basis for an order accepted earlier in
      the day, the model has no historical or event-level representation to
      answer the question.
    impact: The integration baseline cannot support inventory audit, allocation
      dispute resolution, or reliable reconstruction of past fulfillment
      decisions.
    evidence_refs:
      - .onto/review/20260716-e3fc23c8/round1/coverage.findings.yaml#coverage-candidate-002
      - logistics-fulfillment-ontology.yaml:71-85
      - logistics-fulfillment-ontology.yaml:106-107
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Inventory consistency and allocation correctness across WMS,
        ERP, OMS, and fulfillment operations.
      failure_condition: When inventory changes between nightly snapshots, or when
        users need to audit the inventory basis for an order accepted earlier in
        the day, the model has no historical or event-level representation to
        answer the question.
      impact: The integration baseline cannot support inventory audit, allocation
        dispute resolution, or reliable reconstruction of past fulfillment
        decisions.
      evidence_refs:
        - logistics-fulfillment-ontology.yaml:71-85
        - logistics-fulfillment-ontology.yaml:106-107
    causal_path:
      root_cause_candidate: Inventory is represented as current/snapshot quantities
        rather than as time-qualified records and lifecycle events.
      root_cause_step_id: finding-002.cause-002
      steps:
        - cause_id: finding-002.cause-001
          claim: InventoryRecord.quantity_on_hand is defined as current stock and lacks an
            as_of/effective-time attribute.
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:71-79
        - cause_id: finding-002.cause-002
          claim: InventoryAggregate.available_qty is a nightly snapshot, yet intraday
            allocation reads it for new orders.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:81-85
            - logistics-fulfillment-ontology.yaml:106-107
      unresolved_beyond_evidence: null
  - finding_id: finding-003
    lens_id: coverage
    source_ref: .onto/review/20260716-e3fc23c8/round1/coverage.findings.yaml#coverage-candidate-003
    target: Measurement unit coverage for SKU and shipment quantities
    evidence_anchor: logistics-fulfillment-ontology.yaml:28-33;
      logistics-fulfillment-ontology.yaml:35-44
    claim: Weight and dimension values lack explicit unit-of-measure coverage
      despite cross-system unit variation.
    lens_rationale_summary: Freight rating, carrier selection, packing,
      customs-adjacent data, and warehouse handling depend on comparable units
      and dimensional weight. A WMS/TMS/ERP concept standard that allows raw
      numeric weights and string dimensions from mixed unit systems cannot
      provide a stable integration contract.
    proposed_action: "Add structured measurement concepts: weight_value, weight_uom,
      dimension components, dimension_uom, measurement_source,
      measured_at/effective_at, and conversion rules. Define
      Shipment.total_weight as derived from normalized line or package
      measurements with a declared unit."
    affected_purpose: Freight and shipment consistency across warehouse, transport,
      and ERP integrations.
    failure_condition: When different warehouses or source systems provide kg/lb or
      dimension strings with different units, shipment totals and carrier-facing
      data cannot be compared or safely aggregated.
    impact: The ontology can produce ambiguous or incorrect freight weights,
      dimensions, and downstream transportation decisions despite claiming to be
      an integration baseline.
    evidence_refs:
      - .onto/review/20260716-e3fc23c8/round1/coverage.findings.yaml#coverage-candidate-003
      - logistics-fulfillment-ontology.yaml:28-33
      - logistics-fulfillment-ontology.yaml:35-44
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Freight and shipment consistency across warehouse, transport,
        and ERP integrations.
      failure_condition: When different warehouses or source systems provide kg/lb or
        dimension strings with different units, shipment totals and
        carrier-facing data cannot be compared or safely aggregated.
      impact: The ontology can produce ambiguous or incorrect freight weights,
        dimensions, and downstream transportation decisions despite claiming to
        be an integration baseline.
      evidence_refs:
        - logistics-fulfillment-ontology.yaml:28-33
        - logistics-fulfillment-ontology.yaml:35-44
    causal_path:
      root_cause_candidate: Measurement values are modeled as bare numbers or
        free-form strings rather than unit-qualified measurements.
      root_cause_step_id: finding-003.cause-003
      steps:
        - cause_id: finding-003.cause-001
          claim: Sku.weight is a number and the note says warehouses use kg or lb
            according to local practice.
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:28-33
        - cause_id: finding-003.cause-002
          claim: Sku.dims is a string and the note says units differ by source system.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:28-33
        - cause_id: finding-003.cause-003
          claim: Shipment.total_weight stores the sum of OrderLine weights without
            declaring unit or conversion basis.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:35-44
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260716-e3fc23c8/round1/coverage.findings.yaml#coverage-candidate-004
    target: Manual adjustment and multi-source authority evidence coverage
    evidence_anchor: logistics-fulfillment-ontology.yaml:43-45;
      logistics-fulfillment-ontology.yaml:76-85;
      logistics-fulfillment-ontology.yaml:110-112
    claim: The ontology lacks audit evidence and single-authority concepts for
      values managed across systems or manually adjusted.
    lens_rationale_summary: Coverage for WMS/TMS/ERP integration must include who
      can override operational facts, when, why, and which source wins. Without
      those concepts, the model cannot audit inventory reconciliation or ETA
      overrides, and downstream systems cannot distinguish carrier-reported
      facts from human-edited operational estimates.
    proposed_action: Add SourceAuthority/SourceSystem ownership for shared values
      and an Adjustment or OverrideEvent concept with actor_ref, occurred_at,
      reason_code, source_value, adjusted_value, approved_by, and affected
      field. Use it for ETA and inventory reconciliation at minimum.
    affected_purpose: Authority, auditability, and operational risk control for
      WMS/TMS/ERP integration.
    failure_condition: When WMS and ERP quantities disagree, or when an ETA is
      manually changed after carrier data arrives, the ontology cannot identify
      the authoritative value or preserve evidence of the intervention.
    impact: The concept baseline leaves high-risk operational controls outside the
      model, weakening dispute resolution, SLA explanations, and reconciliation
      audit trails.
    evidence_refs:
      - .onto/review/20260716-e3fc23c8/round1/coverage.findings.yaml#coverage-candidate-004
      - logistics-fulfillment-ontology.yaml:43-45
      - logistics-fulfillment-ontology.yaml:76-85
      - logistics-fulfillment-ontology.yaml:110-112
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Authority, auditability, and operational risk control for
        WMS/TMS/ERP integration.
      failure_condition: When WMS and ERP quantities disagree, or when an ETA is
        manually changed after carrier data arrives, the ontology cannot
        identify the authoritative value or preserve evidence of the
        intervention.
      impact: The concept baseline leaves high-risk operational controls outside the
        model, weakening dispute resolution, SLA explanations, and
        reconciliation audit trails.
      evidence_refs:
        - logistics-fulfillment-ontology.yaml:43-45
        - logistics-fulfillment-ontology.yaml:76-85
        - logistics-fulfillment-ontology.yaml:110-112
    causal_path:
      root_cause_candidate: Shared and manually adjusted operational values are
        represented only as final scalar attributes, without authority or
        adjustment-event concepts.
      root_cause_step_id: finding-004.cause-002
      steps:
        - cause_id: finding-004.cause-001
          claim: InventoryRecord.quantity_on_hand notes that WMS and ERP each hold values
            and are reconciled nightly to ERP, but the model has no authority or
            reconciliation event entity.
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:76-85
            - logistics-fulfillment-ontology.yaml:110-111
        - cause_id: finding-004.cause-002
          claim: Shipment.eta is a scalar datetime manually adjusted by operations, and
            the notes say carrier API values and manual adjustments are mixed
            into a final operations-judgment value.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:43-45
            - logistics-fulfillment-ontology.yaml:112
      unresolved_beyond_evidence: null
  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260716-e3fc23c8/round1/coverage.findings.yaml#coverage-candidate-005
    target: Order, Shipment, and Tracking lifecycle coverage
    evidence_anchor: logistics-fulfillment-ontology.yaml:14-17;
      logistics-fulfillment-ontology.yaml:39-42;
      logistics-fulfillment-ontology.yaml:55-63;
      logistics-fulfillment-ontology.yaml:106-108
    claim: Lifecycle models omit common terminal and exception paths needed for
      fulfillment operations.
    lens_rationale_summary: Coverage is incomplete for operational lifecycle states
      after or instead of successful delivery. Exceptions and post-delivery
      corrections are normal in fulfillment, and independent OMS/TMS/carrier
      status streams need a concept that can absorb them without making
      delivered the only terminal state.
    proposed_action: Extend lifecycle coverage with explicit terminal and exception
      states, plus lifecycle event concepts for cancellation, backorder,
      return/RMA, delivery failure, loss/damage, correction/reissue, and
      closure. Define how carrier TrackingEvent.exception maps into
      shipment/order lifecycle transitions.
    affected_purpose: Status model completeness for order, shipment, and delivery operations.
    failure_condition: When a shipment fails, is returned, corrected after delivery,
      or a carrier reports an exception, the ontology has no first-class
      lifecycle path except successful delivery or independent unmapped tracking
      events.
    impact: The integration baseline cannot consistently represent exception
      handling, reverse logistics, or post-terminal correction, making status
      reconciliation fragile across OMS, TMS, and carriers.
    evidence_refs:
      - .onto/review/20260716-e3fc23c8/round1/coverage.findings.yaml#coverage-candidate-005
      - logistics-fulfillment-ontology.yaml:14-17
      - logistics-fulfillment-ontology.yaml:39-42
      - logistics-fulfillment-ontology.yaml:55-63
      - logistics-fulfillment-ontology.yaml:106-108
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Status model completeness for order, shipment, and delivery operations.
      failure_condition: When a shipment fails, is returned, corrected after delivery,
        or a carrier reports an exception, the ontology has no first-class
        lifecycle path except successful delivery or independent unmapped
        tracking events.
      impact: The integration baseline cannot consistently represent exception
        handling, reverse logistics, or post-terminal correction, making status
        reconciliation fragile across OMS, TMS, and carriers.
      evidence_refs:
        - logistics-fulfillment-ontology.yaml:14-17
        - logistics-fulfillment-ontology.yaml:39-42
        - logistics-fulfillment-ontology.yaml:55-63
        - logistics-fulfillment-ontology.yaml:106-108
    causal_path:
      root_cause_candidate: Lifecycle coverage is success-path oriented and leaves
        exception/post-delivery states outside the core Order and Shipment
        status models.
      root_cause_step_id: finding-005.cause-003
      steps:
        - cause_id: finding-005.cause-001
          claim: Order.fulfillment_status includes received, allocated, picking, shipped,
            delivered only.
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:14-17
        - cause_id: finding-005.cause-002
          claim: Shipment.status includes created, picked, in_transit, delivered only and
            states that delivered is final.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:39-42
        - cause_id: finding-005.cause-003
          claim: TrackingEvent includes exception, but carrier events and internal
            statuses are managed independently and mapped by each integration.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:55-63
            - logistics-fulfillment-ontology.yaml:106-108
      unresolved_beyond_evidence: null
  - finding_id: finding-006
    lens_id: evolution
    source_ref: .onto/review/20260716-e3fc23c8/round1/evolution.findings.yaml#evolution-candidate-001
    target: "logistics-fulfillment-ontology.yaml: Shipment / DeliveryLeg evolution
      model"
    evidence_anchor: 'Embedded Materialized Input: `Shipment` definition says "창고에서
      고객으로 가는 물리적 화물 이동. 배송 구간(DeliveryLeg)도 Shipment의 일종이다."; `DeliveryLeg`
      declares `is_a: Shipment`; `Shipment.status` values are `[created, picked,
      in_transit, delivered]`; `notes` says "국제/통관 배송은 이 온톨로지의 범위 밖으로 둔다."'
    claim: 배송 구간을 Shipment의 하위유형으로 고정해 통관·멀티모달·역물류 같은 새 이동 유형을 추가할 때 기존 Shipment 상태와
      의미를 수정해야 한다.
    lens_rationale_summary: "`DeliveryLeg is_a Shipment`이므로 구간은 Shipment의 속성과 상태 모델을
      그대로 물려받는다. 동시에 `Shipment` 정의는 창고에서 고객으로 가는 전체 물리 이동이고, `DeliveryLeg` 정의는 그
      이동의 한 구간이다. 이 두 개념의 변화 축이 다르기 때문에, 새 배송 도메인을 수용하려면 하위 구간 확장만으로 닫히지 않고 공통
      부모의 상태 enum과 정의를 수정하게 된다. WMS/TMS/ERP 통합 기준 문서에서는 이런 부모 enum 수정이 기존 데이터
      해석과 연동 매핑을 흔들 수 있다."
    proposed_action: "`Shipment`를 주문 충족 화물 단위로 두고, 경로 실행 단위는 별도
      `DeliveryLeg`/`TransportMovement` 엔티티로 분리한다. 상태도 `Shipment.status`와
      `DeliveryLeg.status`를 분리하고, 통관·인계·반송 같은 미래 상태는 구간/이벤트 코드 확장 테이블이나 상태 매핑
      개념으로 수용하게 한다."
    affected_purpose: WMS/TMS/ERP 통합의 개념 기준 문서로서 주문·화물·배송 상태 모델을 장기간 확장 가능하게 유지하는 목적.
    failure_condition: 국제/통관 배송, 허브 간 다중 구간, 반송/교환, 운송사 인계 등 새 이동 유형을 온톨로지에 포함하려 할 때
      `Shipment.status`와 `Shipment` 정의를 기존 데이터와 함께 수정해야 하는 조건.
    impact: 통합 기준의 중심 개념인 Shipment의 의미와 상태 enum이 계속 변하면 기존 TMS/OMS/캐리어 연동 데이터의 상태 해석
      연속성이 깨지고, 새 도메인 추가가 국소 확장이 아니라 전역 재분류 작업이 된다.
    evidence_refs:
      - .onto/review/20260716-e3fc23c8/round1/evolution.findings.yaml#evolution-candidate-001
      - "Embedded Materialized Input: `Shipment` definition and
        attributes.status"
      - "Embedded Materialized Input: `DeliveryLeg` definition and `is_a:
        Shipment`"
      - "Embedded Materialized Input: notes item `국제/통관 배송은 이 온톨로지의 범위 밖으로 둔다.`"
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 통합의 개념 기준 문서로서 주문·화물·배송 상태 모델을 장기간 확장 가능하게 유지하는 목적.
      failure_condition: 국제/통관 배송, 허브 간 다중 구간, 반송/교환, 운송사 인계 등 새 이동 유형을 온톨로지에 포함하려 할 때
        `Shipment.status`와 `Shipment` 정의를 기존 데이터와 함께 수정해야 하는 조건.
      impact: 통합 기준의 중심 개념인 Shipment의 의미와 상태 enum이 계속 변하면 기존 TMS/OMS/캐리어 연동 데이터의 상태 해석
        연속성이 깨지고, 새 도메인 추가가 국소 확장이 아니라 전역 재분류 작업이 된다.
      evidence_refs:
        - "Embedded Materialized Input: `Shipment` definition and
          attributes.status"
        - "Embedded Materialized Input: `DeliveryLeg` definition and `is_a:
          Shipment`"
        - "Embedded Materialized Input: notes item `국제/통관 배송은 이 온톨로지의 범위 밖으로
          둔다.`"
    causal_path:
      root_cause_candidate: 전체 화물 이동과 배송 구간이라는 서로 다른 변화 축의 개념을 상속 관계로 결합했다.
      root_cause_step_id: finding-006.cause-003
      steps:
        - cause_id: finding-006.cause-001
          claim: "`DeliveryLeg` is declared as `is_a: Shipment`, so it inherits the parent
            Shipment contract rather than having an independently evolvable
            execution-state contract."
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `DeliveryLeg: is_a: Shipment`"
        - cause_id: finding-006.cause-002
          claim: "`Shipment.status` is a closed enum with only created, picked,
            in_transit, delivered, and its note says delivered is final."
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `Shipment.status` values and note"
        - cause_id: finding-006.cause-003
          claim: The ontology explicitly excludes international/customs delivery, so
            adding that scope later would need states and meanings not
            represented in the inherited Shipment status set.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: notes item `국제/통관 배송은 이 온톨로지의 범위 밖으로
              둔다.`"
      unresolved_beyond_evidence: The bounded artifact does not show existing
        integration payloads, so the exact migration cost is inferred from the
        ontology contract rather than measured from implementations.
  - finding_id: finding-007
    lens_id: evolution
    source_ref: .onto/review/20260716-e3fc23c8/round1/evolution.findings.yaml#evolution-candidate-002
    target: "logistics-fulfillment-ontology.yaml: TrackingEvent.event_type and
      Shipment.status integration boundary"
    evidence_anchor: 'Embedded Materialized Input: `TrackingEvent.event_type` values
      `[dispatched, arrived_hub, out_for_delivery, delivered, exception]` with
      note "캐리어별 상태 코드. 자사 Shipment.status와의 매핑은 각 연동에서 알아서 한다."; integrity rule
      says `Order.fulfillment_status`, `Shipment.status`, and
      `TrackingEvent.event_type` are independently managed.'
    claim: 캐리어 상태 변경이나 신규 운송사 추가 시 매핑 권위가 온톨로지 밖의 각 연동으로 흩어져 상태 모델의 연속성이 유지되지 않는다.
