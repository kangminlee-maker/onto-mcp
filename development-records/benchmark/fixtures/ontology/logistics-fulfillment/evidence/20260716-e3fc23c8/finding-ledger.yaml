      specific DeliveryLeg or leg sequence."
    claim: TrackingEvent is not structurally connectable to a specific delivery leg.
    lens_rationale_summary: For a route with multiple DeliveryLegs, a carrier event
      such as arrived_hub or exception needs a structural attachment point to a
      leg or stop to preserve delivery-path context. The current single
      shipment_ref can point at the broad Shipment concept while the route
      segments are not composed under it, so event-to-leg connectivity is
      underspecified.
