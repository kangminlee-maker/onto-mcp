  - finding_id: finding-018
    lens_id: structure
    source_ref: .onto/review/20260716-e3fc23c8/round1/structure.findings.yaml#structure-candidate-003
    target: logistics-fulfillment-ontology.yaml / DeliveryLeg as Shipment subtype
    evidence_anchor: "Embedded Materialized Input: Shipment definition says
      DeliveryLeg is also a kind of Shipment; DeliveryLeg is_a Shipment and has
      leg_seq/from_ref/to_ref; no attribute or relation links DeliveryLeg
      instances to a parent end-to-end Shipment."
    claim: DeliveryLeg lacks a structural parent path to the shipment route it
      composes.
    lens_rationale_summary: The target intends to model shipment and delivery, and
      DeliveryLeg is defined as a route segment. A sequence number alone is not
      structurally meaningful without a parent route/shipment scope. Because
      DeliveryLeg inherits Shipment rather than being linked as a component, the
      model cannot represent which legs belong to the same shipment or
      reconstruct a route as connected segments.
    proposed_action: Model DeliveryLeg as a component of Shipment with a required
      shipment_ref or relation such as Shipment has_leg DeliveryLeg, keeping
      leg_seq scoped to that parent shipment. If legs remain subtypes, add a
      parent_shipment_ref for route composition.
    affected_purpose: Concept baseline for shipment and delivery path integration.
    failure_condition: When a Shipment has multiple route segments, the ontology
      cannot determine which DeliveryLegs compose that shipment or whether their
      sequence belongs to the same route.
    impact: This breaks structural route completeness for TMS-style shipment
      execution and tracking because segment data cannot be reliably connected
      into one shipment movement.
    evidence_refs:
      - .onto/review/20260716-e3fc23c8/round1/structure.findings.yaml#structure-candidate-003
      - 'Embedded Materialized Input: Shipment definition: "배송 구간(DeliveryLeg)도
        Shipment의 일종이다."'
      - "Embedded Materialized Input: DeliveryLeg is_a Shipment and attributes
        leg_seq, from_ref, to_ref"
      - "Embedded Materialized Input: relations list contains only fulfills from
        Shipment to Order"
