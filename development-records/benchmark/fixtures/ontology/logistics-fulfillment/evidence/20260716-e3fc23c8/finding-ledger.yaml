    claim: "`DeliveryLeg`를 `Shipment`의 하위 유형으로 둔 것은 경로 구간과 전체 화물 이동의 부분-전체 의미를 하위유형
      의미로 잘못 표현한다."
    lens_rationale_summary: 배송 구간은 shipment의 구성 구간 또는 운송 실행 단위일 수 있지만, 정의상 '창고에서
      고객으로 가는' 전체 물리 이동과 동일한 종류는 아니다. 이 상속은 구간별 상태/ETA/무게와 shipment 전체
      상태/ETA/무게를 같은 의미로 만들 위험이 있다.
    proposed_action: "`DeliveryLeg is_a Shipment`를 제거하고 `Shipment has_leg
      DeliveryLeg` 또는 `DeliveryLeg part_of Shipment` 관계로 바꾼다. 구간별 carrier,
      status, ETA가 필요하면 DeliveryLeg 고유 속성으로 정의한다."
    affected_purpose: 화물·배송 개념의 의미 정합성을 WMS/TMS/ERP 통합 기준으로 제공하는 목적.
    failure_condition: TMS가 shipment 전체와 route leg를 별도 객체로 다루거나 구간별 상태/ETA를 통합할 때,
      leg가 shipment로 상속되어 전체와 부분의 의미가 섞이는 경우.
    impact: 전체 shipment의 delivered/in_transit 의미와 개별 구간의 arrived/departed 의미가 같은 상태
      모델로 오인될 수 있어 운송 추적과 ETA 집계가 부정확해진다.
