findings:
  - candidate_id: evolution-candidate-001
    target: "logistics-fulfillment-ontology.yaml: Shipment / DeliveryLeg evolution
      model"
    evidence_anchor: 'Embedded Materialized Input: `Shipment` definition says "창고에서
      고객으로 가는 물리적 화물 이동. 배송 구간(DeliveryLeg)도 Shipment의 일종이다."; `DeliveryLeg`
      declares `is_a: Shipment`; `Shipment.status` values are `[created, picked,
      in_transit, delivered]`; `notes` says "국제/통관 배송은 이 온톨로지의 범위 밖으로 둔다."'
    claim: 배송 구간을 Shipment의 하위유형으로 고정해 통관·멀티모달·역물류 같은 새 이동 유형을 추가할 때 기존 Shipment 상태와
      의미를 수정해야 한다.
    what: 현재 모델은 전체 화물 이동(`Shipment`)과 경로 구간(`DeliveryLeg`)을 상속 관계로 묶고, 둘이 같은 상태
      enum과 운송사 참조를 공유하게 만든다. 새 이동 유형이 생기면 구간별 상태, 통관 보류, 인계, 반송, 분할/병합 같은 상태를
      `Shipment.status`에 계속 추가하거나 기존 의미를 바꿔야 한다.
    why: "`DeliveryLeg is_a Shipment`이므로 구간은 Shipment의 속성과 상태 모델을 그대로 물려받는다. 동시에
      `Shipment` 정의는 창고에서 고객으로 가는 전체 물리 이동이고, `DeliveryLeg` 정의는 그 이동의 한 구간이다. 이
      두 개념의 변화 축이 다르기 때문에, 새 배송 도메인을 수용하려면 하위 구간 확장만으로 닫히지 않고 공통 부모의 상태 enum과
      정의를 수정하게 된다. WMS/TMS/ERP 통합 기준 문서에서는 이런 부모 enum 수정이 기존 데이터 해석과 연동 매핑을 흔들 수
      있다."
    how_to_fix: "`Shipment`를 주문 충족 화물 단위로 두고, 경로 실행 단위는 별도
      `DeliveryLeg`/`TransportMovement` 엔티티로 분리한다. 상태도 `Shipment.status`와
      `DeliveryLeg.status`를 분리하고, 통관·인계·반송 같은 미래 상태는 구간/이벤트 코드 확장 테이블이나 상태 매핑
      개념으로 수용하게 한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 통합의 개념 기준 문서로서 주문·화물·배송 상태 모델을 장기간 확장 가능하게 유지하는 목적.
      failure_condition: 국제/통관 배송, 허브 간 다중 구간, 반송/교환, 운송사 인계 등 새 이동 유형을 온톨로지에 포함하려 할 때
        `Shipment.status`와 `Shipment` 정의를 기존 데이터와 함께 수정해야 하는 조건.
      impact: 통합 기준의 중심 개념인 Shipment의 의미와 상태 enum이 계속 변하면 기존 TMS/OMS/캐리어 연동 데이터의 상태 해석
        연속성이 깨지고, 새 도메인 추가가 국소 확장이 아니라 전역 재분류 작업이 된다.
      evidence_refs:
        - "Embedded Materialized Input: `Shipment` definition and
          attributes.status"
        - "Embedded Materialized Input: `DeliveryLeg` definition and `is_a:
          Shipment`"
        - "Embedded Materialized Input: notes item `국제/통관 배송은 이 온톨로지의 범위 밖으로
          둔다.`"
    causal_path:
      root_cause_candidate: 전체 화물 이동과 배송 구간이라는 서로 다른 변화 축의 개념을 상속 관계로 결합했다.
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: "`DeliveryLeg` is declared as `is_a: Shipment`, so it inherits the parent
            Shipment contract rather than having an independently evolvable
            execution-state contract."
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `DeliveryLeg: is_a: Shipment`"
        - cause_id: evolution-candidate-001.cause-002
          claim: "`Shipment.status` is a closed enum with only created, picked,
            in_transit, delivered, and its note says delivered is final."
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `Shipment.status` values and note"
        - cause_id: evolution-candidate-001.cause-003
          claim: The ontology explicitly excludes international/customs delivery, so
            adding that scope later would need states and meanings not
            represented in the inherited Shipment status set.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: notes item `국제/통관 배송은 이 온톨로지의 범위 밖으로
              둔다.`"
      unresolved_beyond_evidence: The bounded artifact does not show existing
        integration payloads, so the exact migration cost is inferred from the
        ontology contract rather than measured from implementations.
  - candidate_id: evolution-candidate-002
    target: "logistics-fulfillment-ontology.yaml: TrackingEvent.event_type and
      Shipment.status integration boundary"
    evidence_anchor: 'Embedded Materialized Input: `TrackingEvent.event_type` values
      `[dispatched, arrived_hub, out_for_delivery, delivered, exception]` with
      note "캐리어별 상태 코드. 자사 Shipment.status와의 매핑은 각 연동에서 알아서 한다."; integrity rule
      says `Order.fulfillment_status`, `Shipment.status`, and
      `TrackingEvent.event_type` are independently managed.'
    claim: 캐리어 상태 변경이나 신규 운송사 추가 시 매핑 권위가 온톨로지 밖의 각 연동으로 흩어져 상태 모델의 연속성이 유지되지 않는다.
    what: 온톨로지는 캐리어 이벤트 타입을 enum으로 두지만, 자사 `Shipment.status`와의 매핑을 각 연동 구현에 맡긴다. 새
      캐리어 코드, 신규 예외 상태, 기존 코드 의미 변경이 발생하면 온톨로지 안에 버전 있는 매핑 기준이 없어 연동별로 서로 다른 해석이
      생길 수 있다.
    why: evolution 관점에서 외부 표준 변경에 대한 내성이 핵심인데, 이 모델은 외부 캐리어 코드 변화의 흡수 지점을 공통 개념으로 두지
      않는다. `TrackingEvent.event_type` 자체도 닫힌 enum이고, 매핑은 각 연동의 재량이므로 새 이벤트는 enum
      수정과 여러 연동별 매핑 수정이 동시에 필요하다. 이는 TMS/캐리어 통합에서 가장 자주 변하는 상태 코드 영역의 확장성을 약하게
      만든다.
    how_to_fix: 캐리어 원천 이벤트 코드(`carrier_event_code`, `carrier_code_set_version`)와 내부
      표준 이벤트/상태를 분리하고, 온톨로지에 버전 있는 `TrackingStatusMapping` 또는 상태 전이 규칙 개념을 추가한다.
      신규 캐리어는 매핑 레코드 추가로 수용하고, 내부 `Shipment.status` enum 변경은 최소화한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: TMS와 캐리어 연동을 포함한 물류 통합에서 화물·배송 상태의 공통 해석 기준을 제공하는 목적.
      failure_condition: 신규 운송사 온보딩, 캐리어 상태 코드 개편, 예외 이벤트 세분화가 발생하는 조건.
      impact: 상태 매핑 권위가 각 연동에 분산되면 같은 캐리어 이벤트가 연동마다 다른 Shipment 상태로 해석될 수 있고, 외부 표준 변경
        시 기존 데이터와 규칙의 연속성을 온톨로지로 보장할 수 없다.
      evidence_refs:
        - "Embedded Materialized Input: `TrackingEvent.event_type` note"
        - "Embedded Materialized Input: integrity rule on independent management
          of Order/Shipment/TrackingEvent states"
    causal_path:
      root_cause_candidate: 외부 캐리어 이벤트와 내부 Shipment 상태 사이의 매핑 개념을 온톨로지 권위로 모델링하지 않았다.
      root_cause_step_id: evolution-candidate-002.cause-003
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: "`TrackingEvent.event_type` is modeled as a closed enum while also being
            described as carrier-specific status code."
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `TrackingEvent.event_type` values
              and note"
        - cause_id: evolution-candidate-002.cause-002
          claim: The mapping from carrier events to internal `Shipment.status` is
            delegated to each integration rather than represented as a shared
            ontology concept.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `TrackingEvent.event_type` note `자사
              Shipment.status와의 매핑은 각 연동에서 알아서 한다.`"
        - cause_id: evolution-candidate-002.cause-003
          claim: The integrity rule further states the order, shipment, and tracking
            states are independently managed by OMS, TMS, and carriers.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: integrity_rules second item"
      unresolved_beyond_evidence: The artifact does not include actual connector
        mappings, so this finding is limited to the ontology's absence of a
        shared mapping authority.
  - candidate_id: evolution-candidate-003
    target: "logistics-fulfillment-ontology.yaml: quantity, weight, and dimensions
      attributes"
    evidence_anchor: "Embedded Materialized Input: `Sku.weight` note says
      warehouse-specific measuring conventions, kg or lb, are used as-is;
      `Sku.dims` note says dimensions are a string and units differ by source
      system; `OrderLine.qty`, `InventoryRecord.quantity_on_hand`, and
      `InventoryAggregate.available_qty` are plain numbers without
      unit-of-measure attributes."
    claim: 단위 모델이 값 속성에 붙어 있지 않아 창고·국가·ERP 기준이 추가될수록 기존 숫자 필드의 의미 연속성이 깨진다.
    what: 중량, 치수, 수량이 모두 단위 없는 숫자 또는 문자열로 표현된다. 특히 `weight`는 kg/lb를 창고 관례대로 쓰고,
      `dims`는 소스 시스템마다 단위가 다른 문자열이다. 새 창고, 해외 거점, 포장 단위, 판매 단위가 들어오면 기존 필드가 같은
      숫자라도 서로 다른 의미를 갖게 된다.
    why: 확장 가능한 통합 온톨로지라면 값과 단위를 분리해 새 단위계를 추가해도 기존 데이터를 재해석할 수 있어야 한다. 현재 구조에서는 단위
      권위가 각 소스 시스템 관례에 묻혀 있어, 새 시스템 추가가 필드 추가나 전역 변환 규칙 수정으로 이어진다. 이는 ERP 회계 수량,
      WMS 물리 수량, TMS 중량 계산 간 통합 충돌을 만든다.
    how_to_fix: "`Measurement`/`Quantity` 값 객체를 도입해 `value`, `unit`,
      `uom_authority`, `measured_at` 또는 `basis`를 명시한다. `dims`는 구조화된
      length/width/height와 단위로 분해하고, 주문/재고 수량에는 판매 단위·보관 단위·환산 규칙을 별도 개념으로 둔다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 통합의 단위 기준과 재고·화물 계산의 확장 가능성을 제공하는 목적.
      failure_condition: kg/lb 창고 혼재, 해외 거점 추가, SKU별 포장 단위/판매 단위 차이, ERP와 WMS의 단위 기준
        차이를 통합해야 하는 조건.
      impact: 단위 없는 숫자와 단위가 섞인 문자열은 새 소스가 추가될 때 기존 값의 의미를 보존하지 못하고, 중량 합산·재고 가용성·운임 계산
        같은 핵심 통합 계산을 재구성하게 만든다.
      evidence_refs:
        - "Embedded Materialized Input: `Sku.weight` note"
        - "Embedded Materialized Input: `Sku.dims` note"
        - "Embedded Materialized Input: `OrderLine.qty`,
          `InventoryRecord.quantity_on_hand`, `InventoryAggregate.available_qty`
          definitions"
    causal_path:
      root_cause_candidate: 측정값을 단위와 기준을 가진 독립 개념으로 모델링하지 않고 원천 시스템 관례에 의존했다.
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: "`Sku.weight` stores a number while the note allows either kg or lb
            depending on warehouse measuring convention."
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `Sku.weight` attribute note"
        - cause_id: evolution-candidate-003.cause-002
          claim: "`Sku.dims` stores dimensions as a source-dependent string rather than
            structured dimensions with units."
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `Sku.dims` attribute note"
        - cause_id: evolution-candidate-003.cause-003
          claim: Order and inventory quantities are plain numbers with no explicit
            unit-of-measure or conversion basis.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `OrderLine.qty`,
              `InventoryRecord.quantity_on_hand`,
              `InventoryAggregate.available_qty` attributes"
      unresolved_beyond_evidence: The artifact does not state whether all current SKUs
        are single-unit domestic goods; the extensibility risk is based on the
        declared WMS/TMS/ERP integration purpose.
  - candidate_id: evolution-candidate-004
    target: "logistics-fulfillment-ontology.yaml: InventoryRecord /
      InventoryAggregate temporal evolution"
    evidence_anchor: "Embedded Materialized Input:
      `InventoryRecord.quantity_on_hand` note says WMS and ERP each have values
      and ERP is reconciled by nightly batch; comment says no `as_of` concept;
      `InventoryAggregate.available_qty` note says daily nightly snapshot;
      integrity rule says intraday orders also read
      `InventoryAggregate.available_qty`."
    claim: 재고 시간성 모델이 현재값/야간 스냅샷에 고정되어 이벤트 기반·실시간 할당으로 확장할 때 기존 재고 개념을 재구축해야 한다.
    what: 재고는 현재 보유 수량과 매일 밤 저장되는 SKU별 가용 수량으로 표현되고, 주문 할당도 일중에 이 집계값을 읽는다. `as_of`,
      예약/할당 이력, 재고 변동 이벤트, 스냅샷 버전이 없어 실시간 WMS, 다중 ERP, 이벤트 소싱 같은 변경을 자연스럽게 추가할 수
      없다.
    why: 새로운 주문 채널이나 더 촘촘한 재고 동기화가 필요해지면 기존 `InventoryAggregate.available_qty`의 의미가
      '야간 기준'에서 '실시간 기준'으로 바뀌거나 별도 필드가 추가되어야 한다. 시간 기준이 개념에 포함되어 있지 않기 때문에 과거 주문
      당시 재고, 재처리, 감사, 재고 불일치 조정 규칙을 기존 데이터와 연결해 유지하기 어렵다.
    how_to_fix: "`InventorySnapshot`과 `InventoryMovement`/`Reservation`을 분리하고, 모든 재고
      수량에 `as_of`, `source_system`, `snapshot_type`, `version` 또는
      `effective_interval`을 둔다. 주문 할당은 최신 집계 필드가 아니라 특정 시점의 가용성 계산 또는 예약 이벤트를
      참조하게 한다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: WMS/ERP 재고 권위와 주문 할당 기준을 통합 개념으로 안정적으로 유지하는 목적.
      failure_condition: 야간 배치에서 실시간 또는 이벤트 기반 재고 동기화로 전환하거나, 주문 당시 재고 상태를 감사/재처리해야 하는 조건.
      impact: 시간 기준 없는 재고 숫자는 새 동기화 방식 추가 시 기존 값의 의미가 바뀌며, 주문 할당 로직과 감사 질의가 동일 개념 위에서
        연속적으로 확장되지 않는다.
      evidence_refs:
        - "Embedded Materialized Input: `InventoryRecord.quantity_on_hand` note
          and inline comment"
        - "Embedded Materialized Input: `InventoryAggregate.available_qty` note"
        - "Embedded Materialized Input: integrity rule on allocation reading
          `InventoryAggregate.available_qty`"
    causal_path:
      root_cause_candidate: 재고 수량 개념에 유효 시점과 변동/예약 이력을 포함하지 않았다.
      root_cause_step_id: evolution-candidate-004.cause-003
      steps:
        - cause_id: evolution-candidate-004.cause-001
          claim: "`InventoryRecord.quantity_on_hand` is a current quantity with WMS and
            ERP each holding values and nightly reconciliation to ERP."
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `InventoryRecord.quantity_on_hand`
              note"
        - cause_id: evolution-candidate-004.cause-002
          claim: "`InventoryAggregate.available_qty` is a nightly snapshot, but intraday
            allocation also reads it."
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: `InventoryAggregate.available_qty`
              note"
            - "Embedded Materialized Input: first integrity rule"
        - cause_id: evolution-candidate-004.cause-003
          claim: The target text explicitly notes the absence of an `as_of` concept for
            inventory point-in-time queries.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: inline comment under
              `InventoryRecord.quantity_on_hand`"
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - 검토는 session_domain이 none이므로 별도 도메인 문서 없이 제공된 물류·주문충족 온톨로지 텍스트와 리뷰 목표만 사용했다.
  - WMS/TMS/ERP 통합 기준 문서는 신규 운송사, 신규 창고, 단위계 변경, 배송 범위 확장을 시간이 지나며 수용해야 한다는 일반적인
    통합 문서 기대를 전제로 했다.
