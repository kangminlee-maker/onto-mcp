findings:
  - candidate_id: semantics-candidate-001
    target: DeliveryLeg.is_a Shipment
    evidence_anchor: .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:40,52,54,106
    claim: DeliveryLeg를 Shipment의 하위유형으로 둔 것은 구간과 전체 화물 이동의 의미를 혼동한다.
    what: Shipment는 '창고에서 고객으로 가는 물리적 화물 이동'으로 정의되지만, DeliveryLeg는 '창고→허브, 허브→고객' 같은
      경로의 한 구간으로 정의되면서 Shipment를 상속한다. 이 때문에 각 구간이 shipment_no, status,
      total_weight, eta, carrier_ref와 fulfills(Order) 관계를 가진 완전한 Shipment처럼
      해석된다.
    why: 구간은 전체 출하/화물의 구성 요소이지 동일한 존재론적 유형이 아니다. 특히 허브행 구간은 고객에게 가는 전체 Shipment가
      아니며, Shipment.status의 delivered 최종 상태와 DeliveryLeg의 구간 도착 완료 상태도 같은 의미가
      아니다. WMS/TMS/ERP 통합 기준 문서에서 이 상속은 출하 단위 추적, 구간 상태, 주문 충족 여부의 의미를 섞어 시스템 간
      매핑 오류를 만들 수 있다.
    how_to_fix: DeliveryLeg를 Shipment의 하위유형이 아니라 ShipmentRoute 또는 ShipmentLeg 같은 구성
      요소로 모델링하고, Shipment가 여러 DeliveryLeg를 갖는 관계를 둔다. 구간 상태와 전체 Shipment 상태를 별도
      enum으로 분리하고, fulfills 관계는 전체 Shipment 또는 실제 주문라인 충족 단위에만 붙인다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 통합의 개념 기준 문서로서 주문·화물·배송 개념을 일관되게 구분하는 목적.
      failure_condition: 다구간 배송에서 DeliveryLeg가 Shipment로 취급되어 구간 단위가 주문 충족 단위 또는 전체 출하 단위로 해석될 때.
      impact: TMS의 leg 상태와 OMS/ERP의 shipment fulfillment 상태가 같은 개념처럼 매핑되어 배송 완료, 운임,
        주문 충족 판단의 기준이 흔들린다.
      evidence_refs:
        - materialized-input.md:40-50
        - materialized-input.md:52-58
        - materialized-input.md:105-109
    causal_path:
      root_cause_candidate: DeliveryLeg의 존재론적 유형을 Shipment의 하위유형으로 선언했다.
      root_cause_step_id: semantics-candidate-001.cause-002
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: DeliveryLeg는 경로의 한 구간으로 정의되어 전체 창고-고객 이동인 Shipment와 다른 의미를 가진다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:40-41
            - materialized-input.md:52-54
        - cause_id: semantics-candidate-001.cause-002
          claim: 상속 때문에 DeliveryLeg가 Shipment의 속성과 fulfills(Order) 관계까지 받는 완전한 Shipment처럼
            해석된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:43-50
            - materialized-input.md:105-109
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: InventoryRecord.quantity_on_hand
    evidence_anchor: .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:76,81,83,116
    claim: quantity_on_hand가 실물 재고와 회계 재고라는 서로 다른 의미를 한 속성명에 합친다.
    what: InventoryRecord는 특정 창고·SKU 재고 한 건이고 quantity_on_hand는 현재 보유 수량이라고 되어 있다.
      하지만 주석과 notes는 WMS가 창고 실물 기준, ERP가 회계 수량 기준으로 각자 값을 가지며 야간 배치가 ERP 기준에
      맞춘다고 설명한다.
    why: "'현재 보유 수량'이라는 단일 이름은 물리적으로 창고에 있는 수량과 회계/ERP 기준 수량을 같은 의미로 보이게 만든다. 두 값은
      권위, 사용 목적, 조정 시점이 다르므로 같은 속성으로 두면 통합 기준 문서가 어떤 값을 재고 진실로 삼는지 모호해진다."
    how_to_fix: quantity_on_hand를 physical_on_hand_qty(WMS authority)와
      accounting_inventory_qty 또는 erp_book_qty(ERP authority)처럼 의미와 권위를 분리한다. 각
      속성에 source_system, authority, as_of/reconciled_at을 붙이고 조정 결과는 별도
      reconciliation 개념으로 둔다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 재고 개념의 권위와 상태를 WMS/ERP 통합 기준으로 명확히 하는 목적.
      failure_condition: 재고 조회, 할당, 회계 조정에서 quantity_on_hand 하나를 WMS 실물 수량 또는 ERP 회계
        수량으로 상황별 해석할 때.
      impact: 같은 필드가 서로 다른 재고 의미를 대표하여 가용성 판단과 회계 수량 조정의 기준이 충돌한다.
      evidence_refs:
        - materialized-input.md:76-84
        - materialized-input.md:115-116
    causal_path:
      root_cause_candidate: 서로 다른 권위와 의미를 가진 WMS 실물 재고와 ERP 회계 재고를 quantity_on_hand라는 단일 속성으로 표현했다.
      root_cause_step_id: semantics-candidate-002.cause-002
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: quantity_on_hand는 현재 보유 수량으로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:81-83
        - cause_id: semantics-candidate-002.cause-002
          claim: 동일 설명 안에서 WMS와 ERP가 각자 값을 가지며 기준도 실물과 회계로 다르다고 밝힌다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:83
            - materialized-input.md:116
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-003
    target: Sku.weight, Sku.dims, Shipment.total_weight
    evidence_anchor: .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:33,37,38,48
    claim: 중량·치수 속성이 단위를 의미의 일부로 고정하지 않아 같은 이름이 kg/lb와 소스별 치수 체계를 동시에 뜻한다.
    what: Sku.weight는 창고별 계량 관례에 따라 kg 또는 lb를 그대로 쓰고, dims는 가로x세로x높이 문자열이나 단위가 소스
      시스템마다 다르다. Shipment.total_weight는 OrderLine 중량의 합으로 저장된다고 되어 있지만, 원천 중량
      단위가 통일되지 않는다.
    why: weight와 dims는 수치만으로 의미가 완성되지 않고 단위가 포함되어야 한다. 단위 없는 'weight'와 문자열 'dims'는
      시스템별로 다른 의미를 같은 속성명 아래에 숨기며, total_weight 같은 파생값은 서로 다른 단위가 합산될 위험이 있다.
    how_to_fix: weight_value와 weight_uom, dimension_value 구조(length/width/height)와
      dimension_uom을 분리하거나 표준 단위로 정규화한다. total_weight에는 계산 기준 단위와 계산 시점, 원천
      SKU/OrderLine 단위 변환 규칙을 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 화물·배송 개념의 단위 정합성을 WMS/TMS/ERP 통합 기준으로 제공하는 목적.
      failure_condition: 여러 창고나 소스 시스템의 SKU가 한 Shipment에 포함되거나 total_weight가 운임/적재/배송
        제한 판단에 사용될 때.
      impact: 동일 숫자가 kg 또는 lb로 해석될 수 있어 중량 합계와 치수 기반 운영 판단이 의미적으로 신뢰 불가능해진다.
      evidence_refs:
        - materialized-input.md:33-38
        - materialized-input.md:48
    causal_path:
      root_cause_candidate: 측정값 속성의 의미를 구성하는 단위를 별도 권위 있는 속성이나 표준 단위로 모델링하지 않았다.
      root_cause_step_id: semantics-candidate-003.cause-003
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: Sku.weight는 kg 또는 lb를 창고별 관례대로 사용한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37
        - cause_id: semantics-candidate-003.cause-002
          claim: Sku.dims는 문자열이며 단위가 소스 시스템마다 다르다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:38
        - cause_id: semantics-candidate-003.cause-003
          claim: Shipment.total_weight는 원천 중량들의 합으로 저장되어 단위 혼합이 파생값 의미까지 전파된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:48
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-004
    target: InventoryAggregate.available_qty
    evidence_anchor: .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:86,90,112
    claim: available_qty라는 이름이 현재 가용 재고를 뜻하지만 실제로는 야간 스냅샷 값이다.
    what: InventoryAggregate는 SKU별 전사 가용 재고 집계이고 available_qty는 매일 밤 배치로 저장되는 스냅샷이다.
      그런데 integrity rule은 일중 주문의 재고 할당도 이 available_qty를 읽는다고 한다.
    why: "'available'은 주문 시점의 할당 가능 수량처럼 읽히지만, 모델의 설명은 전일 또는 야간 배치 시점의 스냅샷에 가깝다. 이름과
      시간성이 어긋나면 OMS/WMS/ERP가 같은 값을 현재 가용 재고로 오해할 수 있다."
    how_to_fix: available_qty_snapshot, snapshot_as_of 같은 시간성 있는 이름과 속성으로 바꾸거나, 현재
      할당 가능 수량은 실시간 계산 개념으로 분리한다. 일중 할당 규칙은 어떤 시점의 재고를 권위로 삼는지 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문·재고 통합에서 재고 가용성의 의미와 시간 기준을 명확히 하는 목적.
      failure_condition: 일중 주문 할당이 nightly snapshot available_qty를 현재 가용량으로 사용할 때.
      impact: 재고 할당 기준이 현재 상태인지 스냅샷인지 불분명해 과할당 또는 보수적 미할당 같은 운영 위험을 낳는다.
      evidence_refs:
        - materialized-input.md:86-90
        - materialized-input.md:111-112
    causal_path:
      root_cause_candidate: 시간성 있는 스냅샷 값을 현재성을 암시하는 available_qty 이름으로 모델링했다.
      root_cause_step_id: semantics-candidate-004.cause-002
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: available_qty는 매일 밤 배치로 저장되는 스냅샷으로 설명된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:86-90
        - cause_id: semantics-candidate-004.cause-002
          claim: 동시에 일중 주문 할당도 이 값을 읽는다고 규칙화되어 현재 가용량처럼 사용된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:111-112
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-005
    target: Shipment.eta
    evidence_anchor: .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:49,117
    claim: eta가 캐리어 ETA와 운영팀 조정 ETA를 한 값으로 합쳐 예측값의 출처 의미를 잃는다.
    what: Shipment.eta는 예상 도착 시각이며 현장 운영팀이 수기로 조정한다고 되어 있다. notes는 캐리어 API 값과 운영팀 수기
      조정값이 섞이고 최종 표시값은 운영팀 판단을 따른다고 설명한다.
    why: 캐리어가 제공한 ETA와 운영팀이 표시용으로 조정한 ETA는 출처와 사용 목적이 다르다. 단일 eta 속성은 원천 예측, 운영 보정,
      최종 표시값을 같은 의미로 보이게 하므로 TMS/캐리어/고객 표시 간 의미 매핑이 흐려진다.
    how_to_fix: carrier_eta, ops_adjusted_eta, displayed_eta를 분리하거나 eta 값에 source,
      authority, adjusted_by, adjusted_at을 명시한다. 최종 표시값이 운영팀 판단이라면 그 파생 규칙을 별도
      속성 또는 규칙으로 둔다.
    upstream_evidence_required: false
    severity_hint: low
    materiality_basis: null
    causal_path: null
domain_constraints_used: []
