    target: InventoryRecord / InventoryAggregate 재고 시간성 모델
    evidence_anchor: .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:76,
      .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:81,
