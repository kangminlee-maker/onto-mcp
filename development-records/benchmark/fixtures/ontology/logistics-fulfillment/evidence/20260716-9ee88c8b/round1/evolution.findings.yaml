        - cause_id: evolution-candidate-001.cause-002
          claim: InventoryAggregate.available_qty는 매일 밤 배치로 저장되는 스냅샷인데, 일중 주문 할당도 이 값을 읽도록
            규칙이 고정되어 있다.
          relation_to_previous: causes
          evidence_refs:
