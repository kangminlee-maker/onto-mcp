        - cause_id: evolution-candidate-001.cause-003
          claim: WMS 실물 기준과 ERP 회계 기준의 불일치는 야간 배치 조정으로만 설명되어, 새 재고 출처나 실시간 동기화 주기를 기존 의미와
            병행할 확장 지점이 없다.
          relation_to_previous: causes
          evidence_refs:
