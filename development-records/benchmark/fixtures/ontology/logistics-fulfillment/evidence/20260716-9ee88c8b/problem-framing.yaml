  - issue_id: issue-001
    problem_definition: Inventory availability lacks explicit authority, effective
      time, source qualification, and allocation/reservation event semantics.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: consistency
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: The projection shows strong cross-lens support and no remaining
      disagreement. This is a root modeling defect because downstream
      allocation, reconciliation, audit, and real-time extension all depend on
      knowing which inventory value is authoritative and when it applies.
    related_surface_finding_ids:
