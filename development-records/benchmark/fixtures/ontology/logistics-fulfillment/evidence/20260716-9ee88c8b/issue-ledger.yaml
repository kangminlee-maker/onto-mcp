  - issue_id: issue-005
    root_cause_hypothesis: Physical measurements are stored as source-local
      number/string fields without unit, source, conversion basis, or
      calculation version.
    root_confidence: high
    surface_finding_ids:
      - finding-006
      - finding-010
    relation_refs:
      - rel-008
    raised_by_lens_ids:
      - coverage
      - evolution
    issue_statement: SKU and shipment measurement quantities lack canonical unit
      semantics and are brittle under warehouse or carrier unit changes.
    proposed_action: Model weight and dimensions as quantity value objects with
      value, unit, source/measurement system, measured/calculated time,
      conversion basis, and calculation version for derived shipment totals.
    affected_purpose: WMS/TMS/ERP concept baseline for SKU, freight, shipment,
      carrier rating, routing, and capacity integration.
    failure_condition: Different warehouses, source systems, carriers, or rate rules
      introduce kg/lb or dimension-convention differences while
      Shipment.total_weight is calculated from unitless SKU values.
    impact: Shipment measurements can silently mix incompatible units, and
      historical shipment totals cannot be reliably interpreted, converted, or
      audited after unit standardization.
