  - issue_id: issue-012
    root_cause_hypothesis: InventoryAggregate.available_qty is named as current
      availability while actually representing a nightly snapshot also used for
      intraday allocation.
    root_confidence: medium
    surface_finding_ids:
      - finding-017
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: The available_qty name and use obscure whether allocation reads
      current availability or a stale snapshot.
    proposed_action: Rename and model the value as a time-stamped snapshot or split
      current allocatable quantity into a separately derived real-time concept
      with explicit authority and freshness.
    affected_purpose: Order and inventory integration clarity for availability
      meaning and time basis.
    failure_condition: Intraday order allocation uses nightly snapshot available_qty
