  - issue_id: issue-004
    root_cause_hypothesis: Fulfillment is modeled only at Shipment-to-Order
      granularity, while OrderLine has no shipment, leg, or allocation
      fulfillment edge.
    root_confidence: medium
    surface_finding_ids:
      - finding-004
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: Partial, split, substituted, backordered, or line-level
      shipment fulfillment cannot be represented at the order-line quantity
      grain.
    proposed_action: Add a line-level fulfillment or allocation concept connecting
      OrderLine to Shipment and, if needed, DeliveryLeg/package, with fulfilled
      and shipped quantities and status.
    affected_purpose: WMS/TMS/ERP concept baseline for order, inventory allocation,
      shipment, delivery, reconciliation, and exception handling.
    failure_condition: An order has multiple lines, partial shipment, split
      shipment, substitution, cancellation, backorder, or line-level delivery
      exception.
    impact: The model cannot tie physical movement and delivery evidence back to the
      commercial order line, making reconciliation and exceptions
      non-actionable.
    evidence_refs:
