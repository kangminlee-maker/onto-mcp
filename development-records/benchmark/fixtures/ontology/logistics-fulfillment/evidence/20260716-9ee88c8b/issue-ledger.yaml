  - issue_id: issue-008
    root_cause_hypothesis: A route segment is modeled with subtype inheritance from
      end-to-end Shipment instead of composition, conflating leg lifecycle and
      fulfillment semantics with whole-shipment semantics.
    root_confidence: high
    surface_finding_ids:
      - finding-012
      - finding-013
    relation_refs:
      - rel-014
    raised_by_lens_ids:
      - evolution
      - logic
    issue_statement: DeliveryLeg inherits Shipment meaning even though route
      segments and end-to-end shipments have different classification,
      lifecycle, and fulfillment scopes.
    proposed_action: Separate end-to-end Shipment from DeliveryLeg composition,
      using ShipmentRoute or LegAssignment with ordered legs and leg-specific
      status, ETA, carrier, and location attributes.
    affected_purpose: WMS/TMS/ERP concept baseline for cargo movement, delivery
      routes, shipment status, and order fulfillment relations.
    failure_condition: Multi-leg, hub-transfer, multiple-carrier, leg-specific
      ETA/status, or reverse-logistics routes require DeliveryLeg instances that
      are not themselves warehouse-to-customer shipments.
    impact: Leg-level records can inherit whole-shipment status, carrier, weight,
      and fulfills relations, making classification inconsistent and route
      extension difficult without remodeling.
    evidence_refs:
