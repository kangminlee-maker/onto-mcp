issues:
  - issue_id: issue-001
    root_cause_hypothesis: Inventory availability is modeled as current/nightly
      quantities without first-class authority, effective time, source
      qualification, or allocation/reservation events.
    root_confidence: high
    surface_finding_ids:
      - finding-001
      - finding-005
      - finding-009
    relation_refs:
      - rel-001
      - rel-002
    raised_by_lens_ids:
      - axiology
      - coverage
      - evolution
    issue_statement: Inventory authority and temporality are not closed enough for
      allocation, reconciliation, and later real-time inventory extension.
    proposed_action: Separate inventory quantity concepts by authority, purpose,
      effective/as-of time, snapshot/calculation basis, and
      reservation/allocation events; treat nightly ERP reconciliation as a
      separate reconciliation state rather than the live allocation authority.
    affected_purpose: WMS/TMS/ERP integration concept baseline for inventory
      allocation, WMS/ERP reconciliation, order receipt, and shipment decisions.
    failure_condition: Intraday orders, stock changes, reservations, nightly
      reconciliations, multiple WMS/ERP sources, or historical inventory lookup
      depend on quantity_on_hand or nightly InventoryAggregate.available_qty as
      the allocation basis.
    impact: The ontology cannot state which system and time basis a stock value
      represents, making allocation decisions hard to justify, WMS/ERP
      differences hard to audit, and real-time inventory evolution disruptive.
    evidence_refs:
      - .onto/review/20260716-9ee88c8b/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:81-84
