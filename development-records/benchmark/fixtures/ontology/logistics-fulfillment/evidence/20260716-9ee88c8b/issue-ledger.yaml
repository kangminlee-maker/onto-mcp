  - issue_id: issue-009
    root_cause_hypothesis: DeliveryLeg is declared as a Shipment, so route segment
      meaning is confused with whole cargo movement meaning.
    root_confidence: medium
    surface_finding_ids:
      - finding-014
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: DeliveryLeg as a Shipment makes leg-level TMS states and
      whole-shipment fulfillment semantics appear to be the same concept.
    proposed_action: Model DeliveryLeg as a route component rather than a Shipment
      subtype, split leg status from whole Shipment status, and constrain
      fulfills to the whole shipment or fulfillment allocation grain.
    affected_purpose: WMS/TMS/ERP integration concept baseline for consistently
      distinguishing order, cargo, and delivery concepts.
    failure_condition: Multi-leg delivery treats DeliveryLeg as a shipment, order
      fulfillment unit, or whole cargo movement.
    impact: TMS leg status and OMS/ERP shipment fulfillment status can be mapped as
      if equivalent, weakening delivery completion, freight, and order
      fulfillment judgments.
    evidence_refs:
