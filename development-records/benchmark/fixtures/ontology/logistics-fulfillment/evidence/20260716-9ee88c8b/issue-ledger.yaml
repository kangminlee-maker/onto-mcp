      - evolution
    issue_statement: State interpretation is delegated to independent systems and
      integrations rather than a canonical versioned status model.
    proposed_action: Add canonical fulfillment/shipment states, native carrier
      status preservation, versioned status mappings, precedence/conflict rules,
      freshness rules, and authority for displayed state values.
    affected_purpose: WMS/TMS/ERP integration concept baseline for order, shipment,
      tracking, and external carrier state coordination.
    failure_condition: Carrier events, TMS shipment statuses, OMS order statuses,
      external status-code changes, or operations ETA/state decisions are used
      together in integrated screens or downstream processes.
