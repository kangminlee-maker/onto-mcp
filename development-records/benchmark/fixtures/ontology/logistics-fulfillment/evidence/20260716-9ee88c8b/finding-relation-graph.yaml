    confidence: high
  - relation_id: rel-014
    from_finding_id: finding-012
    to_finding_id: finding-013
    relation: same_root_candidate
    root_hypothesis: A route segment is modeled with subtype inheritance from
      end-to-end Shipment instead of composition, so leg-level lifecycle and
      fulfillment semantics inherit whole-shipment meaning.
    shared_cause: null
    rationale: finding-012 identifies the evolution risk of DeliveryLeg inheriting
      Shipment semantics for multi-leg, transshipment, or reverse-logistics
      extensions. finding-013 identifies the logical inconsistency that a route
      segment can be a Shipment despite not satisfying the warehouse-to-customer
      Shipment definition. Both arise from using is_a for a part-of route
      segment relationship.
    confidence: high
  - relation_id: rel-015
    from_finding_id: finding-013
    to_finding_id: finding-014
    relation: duplicates
    root_hypothesis: DeliveryLeg is incorrectly typed as a Shipment, conflating
      route segments with the whole cargo movement and propagating Shipment
      attributes/fulfillment relations to leg objects.
    shared_cause: null
    rationale: finding-013 and finding-014 target the same DeliveryLeg is_a Shipment
      hierarchy and the same mismatch between partial route segments and
      end-to-end Shipment semantics. The logic lens stresses satisfiability; the
      semantics lens stresses meaning, but the underlying accepted issue is the
      same.
    confidence: high
  - relation_id: rel-016
    from_finding_id: finding-013
    to_finding_id: finding-020
    relation: shared_cause_candidate
    root_hypothesis: DeliveryLeg is represented through inheritance rather than an
      explicit shipment-route composition relation, so the ontology neither
      classifies legs consistently nor connects them to their parent shipment
      route.
    shared_cause:
      cause_claim: The model uses subtype inheritance for a route segment relationship
        and omits a parent shipment/route composition structure.
      from_cause_ref: finding-013.cause-001
      to_cause_ref: finding-020.cause-001
    rationale: finding-013 focuses on the inconsistent type hierarchy created by
      DeliveryLeg is_a Shipment. finding-020 focuses on the missing structure
      that would connect an end-to-end Shipment to ordered legs. The common
      design cause is treating the leg as a subtype instead of modeling
      composition.
    confidence: high
