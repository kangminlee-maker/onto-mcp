      delegated to integrations. finding-011 identifies the evolution failure
      caused by the same absence of versioned status mapping when carrier codes
      or external standards change.
    confidence: high
  - relation_id: rel-011
    from_finding_id: finding-003
    to_finding_id: finding-008
    relation: shared_cause_candidate
    root_hypothesis: The status model is a narrow set of forward happy-path enums
      without canonical transition, exception, precedence, or resolution
      semantics across order, shipment, and tracking events.
    shared_cause:
      cause_claim: Order, Shipment, and TrackingEvent status meanings are
        independently managed and not unified through a canonical
        state/transition model.
      from_cause_ref: finding-003.cause-003
      to_cause_ref: finding-008.cause-003
    rationale: finding-003 focuses on cross-system state drift and mapping
