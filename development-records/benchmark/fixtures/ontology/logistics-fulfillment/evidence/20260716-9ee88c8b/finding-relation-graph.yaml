    confidence: high
  - relation_id: rel-010
    from_finding_id: finding-003
    to_finding_id: finding-011
    relation: same_root_candidate
    root_hypothesis: Carrier-native statuses, canonical shipment/order statuses,
      mapping precedence, and mapping versions are not modeled as first-class
      concepts, leaving state interpretation to independent systems and
      integrations.
    shared_cause: null
    rationale: finding-003 identifies state/authority drift because Order, Shipment,
