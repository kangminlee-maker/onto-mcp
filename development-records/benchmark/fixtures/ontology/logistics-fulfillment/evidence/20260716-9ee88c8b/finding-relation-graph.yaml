      WMS/TMS/ERP freight and carrier integration. The lens framing differs, but
      the underlying issue is the same.
    confidence: high
  - relation_id: rel-008
    from_finding_id: finding-006
    to_finding_id: finding-010
    relation: same_root_candidate
    root_hypothesis: Physical measurements are stored as number/string fields
      without unit, source, conversion basis, or calculation version; adding
      warehouses/carriers with different unit requirements breaks continuity.
    shared_cause: null
    rationale: finding-006 identifies the current coverage gap in units for SKU and
      shipment quantities. finding-010 identifies the evolution consequence when
      kg/lb, dimension conventions, or carrier rules change. Both causal paths
      cite the same root fields and derived shipment total_weight.
    confidence: high
  - relation_id: rel-009
    from_finding_id: finding-006
    to_finding_id: finding-016
    relation: duplicates
    root_hypothesis: Measurement units are not modeled as part of physical quantity
      meaning, so weight, dimensions, and derived shipment totals can silently
      mix incompatible units.
    shared_cause: null
    rationale: finding-006 and finding-016 both target Sku.weight, Sku.dims, and
      Shipment.total_weight and both conclude that missing canonical units make
      derived shipment measurements unreliable. finding-006 frames it as
      coverage; finding-016 frames it as semantics, but the accepted issue is
