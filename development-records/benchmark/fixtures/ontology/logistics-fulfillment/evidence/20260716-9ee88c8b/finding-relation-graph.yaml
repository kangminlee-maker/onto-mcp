  - relation_id: rel-007
    from_finding_id: finding-002
    to_finding_id: finding-006
    relation: duplicates
    root_hypothesis: SKU weight/dimensions and derived shipment weight lack
      canonical units, allowing source-local measurements to be combined as if
      they shared one meaning.
    shared_cause: null
    rationale: Both findings target Sku.weight, Sku.dims, and Shipment.total_weight;
