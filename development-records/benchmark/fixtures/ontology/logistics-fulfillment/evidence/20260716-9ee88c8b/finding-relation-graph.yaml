relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-005
    relation: same_root_candidate
    root_hypothesis: Inventory availability is modeled around current/nightly
      quantities without first-class authority, effective time, or
      allocation/reservation events; if those concepts were added, both the
      value-alignment concern and the coverage gap would be resolved together.
    shared_cause: null
    rationale: "Both findings cite the same inventory facts: WMS/ERP
      quantity_on_hand values lack effective time,
      InventoryAggregate.available_qty is a nightly snapshot, and intraday
      allocation reads that aggregate. finding-001 frames the impact as failure
      of WMS/TMS/ERP authority and temporal alignment, while finding-005 frames
      the same design root as missing inventory temporal/allocation coverage."
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-005
    to_finding_id: finding-009
    relation: same_root_candidate
    root_hypothesis: Inventory quantity semantics are fixed to current values and
      nightly aggregates rather than versioned, source-qualified, time-indexed
      inventory facts; real-time inventory extension would require changing that
      root model.
    shared_cause: null
    rationale: finding-005 identifies missing effective time, history, and
      reservation/allocation events. finding-009 identifies the same inventory
      shape as an evolution problem when adding intraday/real-time inventory,
      multiple sources, or historical lookup. Their causal paths both turn on
      quantity_on_hand/current values and
      InventoryAggregate.available_qty/nightly snapshots.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-001
    to_finding_id: finding-015
    relation: shared_cause_candidate
    root_hypothesis: WMS physical inventory and ERP accounting inventory are
      collapsed into one inventory quantity concept, leaving authority and usage
      semantics unresolved.
    shared_cause:
      cause_claim: InventoryRecord.quantity_on_hand is used for both WMS and ERP
        quantities even though those values have different authorities and
        meanings.
      from_cause_ref: finding-001.cause-001
      to_cause_ref: finding-015.cause-002
    rationale: "finding-001's broader authority/time failure includes the fact that
      WMS and ERP each hold quantity_on_hand and reconcile later. finding-015
      isolates the semantic root: one property name represents both physical and
      accounting inventory. The same cause supports both findings."
    confidence: high
  - relation_id: rel-004
    from_finding_id: finding-005
    to_finding_id: finding-017
    relation: shared_cause_candidate
    root_hypothesis: The ontology treats a nightly inventory snapshot as the
      operational availability value used for intraday allocation, causing both
      missing temporal coverage and misleading availability semantics.
    shared_cause:
      cause_claim: InventoryAggregate.available_qty is a nightly snapshot while
        intraday allocation reads that same value.
      from_cause_ref: finding-005.cause-003
      to_cause_ref: finding-017.cause-002
    rationale: finding-005 says the model lacks time-indexed inventory and
      allocation events because available_qty is a nightly aggregate used for
      allocation. finding-017 says the same value is semantically misnamed as
      current availability. The shared cause is explicit in both causal paths.
    confidence: high
  - relation_id: rel-005
    from_finding_id: finding-005
    to_finding_id: finding-021
    relation: shared_cause_candidate
    root_hypothesis: InventoryAggregate is modeled as a standalone availability
      number rather than a derived, traceable inventory fact connected to source
      records, authorities, and snapshot metadata.
    shared_cause:
      cause_claim: InventoryAggregate.available_qty is relied on for allocation, but
        its derivation from source inventory records and time/snapshot basis is
        not represented.
      from_cause_ref: finding-005.cause-003
      to_cause_ref: finding-021.cause-003
    rationale: finding-005 focuses on the lack of temporal/allocation inventory
      facts; finding-021 focuses on the missing structural derivation from
      InventoryRecord to InventoryAggregate. Both are supported by the aggregate
      being a live allocation dependency without source/time structure.
    confidence: high
  - relation_id: rel-006
    from_finding_id: finding-007
    to_finding_id: finding-001
    relation: shared_cause_candidate
