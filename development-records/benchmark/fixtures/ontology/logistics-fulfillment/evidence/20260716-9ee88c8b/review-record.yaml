      rationale: "The projection narrows this as a structural traceability facet under
        issue-001. It enables the broader inventory authority problem by making
        allocation quantities unreadable as auditable derivations from source
        records and metadata. Source finding context:
        logistics-fulfillment-ontology.yaml / InventoryAggregate source
        structure Source finding context:
        .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input\
        .md:76-90,111-116 Source finding context: InventoryAggregate is not
        structurally connected to the InventoryRecord records it aggregates.
        Source finding context: The ontology declares InventoryAggregate as the
        quantity used for allocation, including intraday orders, and notes that
        WMS and ERP each hold inventory truth that is reconciled by nightly
        batch. Without an explicit aggregate-from/source relation, the inventory
        path from warehouse-level records to enterprise availability is
        structurally incomplete. Source finding context: Add an explicit
        derivation or aggregation relation from InventoryAggregate to its source
        InventoryRecord set, including scope such as warehouse set, source
        system/authority, and snapshot/as_of metadata if the aggregate is
        batch-produced. Source finding context:
        .onto/review/20260716-9ee88c8b/round1/structure.findings.yaml#structure\
        -candidate-003 Source finding context: Using the ontology as the
        inventory concept baseline for WMS/ERP allocation and reconciliation.
        Source finding context: When allocation or reconciliation needs to
        explain available_qty, the model cannot trace the aggregate back to
        warehouse-level inventory records or their source systems. Source
        finding context: Consumers can read the allocation quantity but cannot
        verify, reconcile, or route disputes through the ontology structure,
        weakening trust in cross-system inventory integration. Source finding
        context: The aggregate inventory concept is represented as a standalone
        SKU quantity without a structural derivation path from warehouse
        inventory records or inventory authorities. Source finding context:
        InventoryAggregate has only sku_ref and available_qty; it has no
        reference to InventoryRecord, Warehouse, WMS, ERP, or a source snapshot.
        Source finding context: InventoryRecord is the warehouse/SKU inventory
        record, but no relation connects it to InventoryAggregate. Source
        finding context: The allocation rule relies on
        InventoryAggregate.available_qty, making the disconnected aggregate a
        live structural dependency for order fulfillment."
