        - problem-framing.yaml
      rationale: "Deliberation resolved this as distinct from issue-008: issue-008
        covers wrong inheritance semantics, while issue-015 covers absent
        ordered route composition and traceability for multi-leg reconstruction
        and leg-localized tracking. Source finding context:
        logistics-fulfillment-ontology.yaml / Shipment-DeliveryLeg route
        structure Source finding context:
        .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input\
        .md:40-58,105-109 Source finding context: DeliveryLeg is typed as a
        Shipment but no structure connects an end-to-end Shipment to its legs.
        Source finding context: An is_a link says a DeliveryLeg is a kind of
        Shipment; it does not connect a multi-leg shipment to the ordered
        sequence of legs that compose its route. For a delivery concept model,
        this leaves the physical delivery path disconnected from the shipment it
        is supposed to detail. Source finding context: Introduce an explicit
        composition/sequence relation, for example Shipment has_many DeliveryLeg
        ordered by leg_seq, or a Route entity containing DeliveryLeg instances,
        and define whether TrackingEvent attaches to the whole Shipment, a leg,
        or both. Source finding context:
        .onto/review/20260716-9ee88c8b/round1/structure.findings.yaml#structure\
        -candidate-002 Source finding context: Using the ontology as a concept
        baseline for shipment and delivery integration. Source finding context:
        When a shipment has multiple delivery legs, the model cannot reconstruct
        which legs belong to the shipment or the ordered route for that
        shipment. Source finding context: TMS/carrier integrations cannot
        reliably connect route segments, locations, and tracking events back to
        the end-to-end shipment path using the ontology structure. Source
        finding context: DeliveryLeg is modeled only through inheritance from
        Shipment, without a composition relation from a shipment or route to its
        legs. Source finding context: DeliveryLeg has leg_seq, from_ref, and
        to_ref, indicating a route segment, but no parent shipment or route
        reference. Source finding context: The only structural connection
        involving Shipment in the relations section is fulfills from Shipment to
        Order. Source finding context: TrackingEvent points to Shipment
        generally, so without a shipment-leg composition path events cannot be
        structurally localized to a route segment when needed."
