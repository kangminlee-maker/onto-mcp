  - finding_id: finding-020
    lens_id: structure
    source_ref: .onto/review/20260716-9ee88c8b/round1/structure.findings.yaml#structure-candidate-002
    target: logistics-fulfillment-ontology.yaml / Shipment-DeliveryLeg route structure
    evidence_anchor: .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:40-58,105-109
    claim: DeliveryLeg is typed as a Shipment but no structure connects an
      end-to-end Shipment to its legs.
    lens_rationale_summary: An is_a link says a DeliveryLeg is a kind of Shipment;
      it does not connect a multi-leg shipment to the ordered sequence of legs
      that compose its route. For a delivery concept model, this leaves the
      physical delivery path disconnected from the shipment it is supposed to
      detail.
    proposed_action: Introduce an explicit composition/sequence relation, for
      example Shipment has_many DeliveryLeg ordered by leg_seq, or a Route
      entity containing DeliveryLeg instances, and define whether TrackingEvent
      attaches to the whole Shipment, a leg, or both.
    affected_purpose: Using the ontology as a concept baseline for shipment and
      delivery integration.
    failure_condition: When a shipment has multiple delivery legs, the model cannot
      reconstruct which legs belong to the shipment or the ordered route for
      that shipment.
    impact: TMS/carrier integrations cannot reliably connect route segments,
      locations, and tracking events back to the end-to-end shipment path using
      the ontology structure.
