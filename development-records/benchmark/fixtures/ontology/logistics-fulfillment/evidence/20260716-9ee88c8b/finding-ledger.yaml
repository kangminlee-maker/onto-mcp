  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260716-9ee88c8b/round1/coverage.findings.yaml#coverage-candidate-001
    target: OrderLine fulfillment coverage
    evidence_anchor: logistics-fulfillment-ontology.yaml:18,
      logistics-fulfillment-ontology.yaml:20-26,
      logistics-fulfillment-ontology.yaml:100-104
    claim: OrderLine-level fulfillment mapping is absent, so partial shipments
      cannot be represented at the line level.
    lens_rationale_summary: For a WMS/TMS/ERP integration baseline, fulfillment
      coverage needs to answer which SKU quantity on which order line was
      picked, shipped, split, backordered, or delivered. An order-level
      `fulfills` relation collapses those distinctions and makes line-level
      reconciliation across OMS, WMS, TMS, and ERP unavailable.
    proposed_action: Add a line-level fulfillment/allocation concept such as
      `FulfillmentLine` or `ShipmentLine` with `order_line_ref`, `shipment_ref`,
      fulfilled quantity, shipped quantity, and status; keep the order-level
      relation as a derived aggregate if still needed.
    affected_purpose: Use as a concept baseline for WMS/TMS/ERP integration across
      orders, inventory allocation, shipment, and delivery.
    failure_condition: When an order has multiple lines, partial shipment, split
      shipment, substitution, cancellation, or backorder, the ontology cannot
      state which order-line quantity moved in which shipment or leg.
    impact: Operational reconciliation and exception handling become non-actionable
      because the integration model cannot tie physical movement and delivery
      evidence back to the commercial order line.
    evidence_refs:
      - .onto/review/20260716-9ee88c8b/round1/coverage.findings.yaml#coverage-candidate-001
      - logistics-fulfillment-ontology.yaml:18
      - logistics-fulfillment-ontology.yaml:20-26
      - logistics-fulfillment-ontology.yaml:100-104
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use as a concept baseline for WMS/TMS/ERP integration across
        orders, inventory allocation, shipment, and delivery.
      failure_condition: When an order has multiple lines, partial shipment, split
        shipment, substitution, cancellation, or backorder, the ontology cannot
        state which order-line quantity moved in which shipment or leg.
      impact: Operational reconciliation and exception handling become non-actionable
        because the integration model cannot tie physical movement and delivery
        evidence back to the commercial order line.
      evidence_refs:
        - logistics-fulfillment-ontology.yaml:18
        - logistics-fulfillment-ontology.yaml:20-26
        - logistics-fulfillment-ontology.yaml:100-104
    causal_path:
      root_cause_candidate: The ontology only defines shipment-to-order fulfillment
        and omits a fulfillment concept at the order-line quantity grain.
      root_cause_step_id: finding-004.cause-003
      steps:
        - cause_id: finding-004.cause-001
          claim: "`Order` contains a list of `OrderLine` objects, but `OrderLine` only has
            SKU and quantity attributes."
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:18
            - logistics-fulfillment-ontology.yaml:20-24
        - cause_id: finding-004.cause-002
          claim: The only fulfillment relation is `Shipment -> Order`, explicitly at order
            grain rather than order-line grain.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:100-104
        - cause_id: finding-004.cause-003
          claim: The target comment states that partial-shipment tracing from line to
            shipment is not possible in the ontology.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:25-26
      unresolved_beyond_evidence: null
  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260716-9ee88c8b/round1/coverage.findings.yaml#coverage-candidate-002
    target: Inventory temporal and allocation coverage
    evidence_anchor: logistics-fulfillment-ontology.yaml:71-85,
      logistics-fulfillment-ontology.yaml:106-107
    claim: Inventory is modeled as current and nightly aggregate quantities without
      effective time, history, or reservation/allocation events.
    lens_rationale_summary: Inventory in fulfillment is time-dependent. Without
      temporal validity and allocation events, the model cannot reconstruct
      stock at order placement, explain oversell/short-pick conditions, or
      distinguish physical quantity, available-to-promise, reserved quantity,
      and accounting quantity.
    proposed_action: Introduce inventory event or snapshot concepts with
      `as_of`/effective interval, source system, quantity type, and reason; add
      reservation/allocation records that connect order lines to inventory at a
      specific time and location.
    affected_purpose: Use as a concept baseline for inventory allocation and WMS/ERP
      reconciliation.
    failure_condition: When intraday orders, stock changes, reservations, or nightly
      reconciliations occur, the ontology cannot reconstruct the inventory basis
      used for allocation or audit a later discrepancy.
    impact: Allocation decisions can be impossible to justify after the fact, and
      WMS/ERP quantity differences cannot be traced through a shared conceptual
      model.
    evidence_refs:
      - .onto/review/20260716-9ee88c8b/round1/coverage.findings.yaml#coverage-candidate-002
      - logistics-fulfillment-ontology.yaml:71-85
      - logistics-fulfillment-ontology.yaml:106-107
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use as a concept baseline for inventory allocation and WMS/ERP
        reconciliation.
      failure_condition: When intraday orders, stock changes, reservations, or nightly
        reconciliations occur, the ontology cannot reconstruct the inventory
        basis used for allocation or audit a later discrepancy.
      impact: Allocation decisions can be impossible to justify after the fact, and
        WMS/ERP quantity differences cannot be traced through a shared
        conceptual model.
      evidence_refs:
        - logistics-fulfillment-ontology.yaml:71-85
        - logistics-fulfillment-ontology.yaml:106-107
    causal_path:
      root_cause_candidate: Inventory coverage stops at current quantity and daily
        aggregate values rather than modeling time-indexed inventory facts and
        allocation events.
      root_cause_step_id: finding-005.cause-003
      steps:
        - cause_id: finding-005.cause-001
          claim: "`InventoryRecord.quantity_on_hand` is described as a current value held
            independently by WMS and ERP."
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:71-79
        - cause_id: finding-005.cause-002
          claim: The ontology comment says there is no effective-time concept for
            reconstructing inventory at order receipt.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:79
        - cause_id: finding-005.cause-003
          claim: "`InventoryAggregate.available_qty` is a nightly snapshot, yet intraday
            allocation reads it."
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:81-85
            - logistics-fulfillment-ontology.yaml:106-107
      unresolved_beyond_evidence: null
  - finding_id: finding-006
    lens_id: coverage
    source_ref: .onto/review/20260716-9ee88c8b/round1/coverage.findings.yaml#coverage-candidate-003
    target: Quantity and measurement unit coverage
    evidence_anchor: logistics-fulfillment-ontology.yaml:28-33,
      logistics-fulfillment-ontology.yaml:35-44
    claim: SKU dimensions and weights lack canonical units, while shipment weight is
      derived from them.
    lens_rationale_summary: WMS/TMS/ERP integration depends on consistent physical
      quantities for rating, routing, capacity, labels, and customs-adjacent
      operations even if international shipment is out of scope. Deriving
      shipment weight from unitless or source-local measurements creates a
      coverage gap in the unit dimension of the ontology.
    proposed_action: Add measurement value objects or attributes for numeric value
      plus canonical unit, dimensional components, conversion basis, and source
      unit; require derived shipment totals to specify unit and derivation
      timestamp.
    affected_purpose: Use as a concept baseline for SKU, freight, and carrier integration.
    failure_condition: When different warehouses or systems provide kg/lb or
      dimension strings with different conventions, shipment totals and
      carrier-facing measurements cannot be interpreted reliably from the
      ontology.
    impact: The model can permit silent unit mixing in operational integration
      points such as cartonization, carrier rating, routing, and freight
      reconciliation.
    evidence_refs:
      - .onto/review/20260716-9ee88c8b/round1/coverage.findings.yaml#coverage-candidate-003
      - logistics-fulfillment-ontology.yaml:28-33
      - logistics-fulfillment-ontology.yaml:35-44
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use as a concept baseline for SKU, freight, and carrier integration.
      failure_condition: When different warehouses or systems provide kg/lb or
        dimension strings with different conventions, shipment totals and
        carrier-facing measurements cannot be interpreted reliably from the
        ontology.
      impact: The model can permit silent unit mixing in operational integration
        points such as cartonization, carrier rating, routing, and freight
        reconciliation.
      evidence_refs:
        - logistics-fulfillment-ontology.yaml:28-33
        - logistics-fulfillment-ontology.yaml:35-44
    causal_path:
      root_cause_candidate: Measurement units are not modeled as first-class concepts
        or required attributes for physical quantities.
      root_cause_step_id: finding-006.cause-003
      steps:
        - cause_id: finding-006.cause-001
          claim: SKU weight is a number whose unit follows each warehouse's local
            convention.
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:28-32
        - cause_id: finding-006.cause-002
          claim: SKU dimensions are a free-form string whose units vary by source system.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:33
        - cause_id: finding-006.cause-003
          claim: Shipment total weight is calculated and stored from order-line weights,
            inheriting the missing-unit problem.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:35-44
      unresolved_beyond_evidence: null
  - finding_id: finding-007
    lens_id: coverage
    source_ref: .onto/review/20260716-9ee88c8b/round1/coverage.findings.yaml#coverage-candidate-004
    target: Manual and reconciliation audit evidence coverage
    evidence_anchor: logistics-fulfillment-ontology.yaml:44,
      logistics-fulfillment-ontology.yaml:76-79,
      logistics-fulfillment-ontology.yaml:110-112
    claim: Manual ETA overrides and inventory reconciliation adjustments lack audit
      evidence concepts.
    lens_rationale_summary: The coverage lens asks whether controlled actions have
      evidence for actor, time, and basis. Manual ETA changes and inventory
      reconciliation directly affect customer communication and stock truth, so
      a concept baseline that omits audit evidence cannot support accountability
      or dispute analysis.
    proposed_action: Add audit/control entities such as `ManualOverride`,
      `InventoryAdjustment`, or `OperationalDecision` with actor, occurred_at,
      source value, prior value, new value, reason, approval/reference evidence,
      and affected entity references.
    affected_purpose: Use as an operationally trustworthy WMS/TMS/ERP concept baseline.
    failure_condition: When an ETA or inventory value changes due to manual judgment
      or batch reconciliation, the ontology cannot represent who changed it,
      when, from what evidence, or why.
    impact: Operational risk increases because customer-facing and
      accounting/warehouse reconciliation changes cannot be audited or
      challenged from the shared model.
    evidence_refs:
      - .onto/review/20260716-9ee88c8b/round1/coverage.findings.yaml#coverage-candidate-004
      - logistics-fulfillment-ontology.yaml:44
      - logistics-fulfillment-ontology.yaml:76-79
      - logistics-fulfillment-ontology.yaml:110-112
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use as an operationally trustworthy WMS/TMS/ERP concept baseline.
      failure_condition: When an ETA or inventory value changes due to manual judgment
        or batch reconciliation, the ontology cannot represent who changed it,
        when, from what evidence, or why.
      impact: Operational risk increases because customer-facing and
        accounting/warehouse reconciliation changes cannot be audited or
        challenged from the shared model.
      evidence_refs:
        - logistics-fulfillment-ontology.yaml:44
        - logistics-fulfillment-ontology.yaml:76-79
        - logistics-fulfillment-ontology.yaml:110-112
    causal_path:
      root_cause_candidate: The ontology represents final mutable values but omits
        control-action evidence concepts for manual and batch changes.
      root_cause_step_id: finding-007.cause-003
      steps:
        - cause_id: finding-007.cause-001
          claim: Shipment ETA can be adjusted manually by the field operations team.
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:44
        - cause_id: finding-007.cause-002
          claim: The final displayed ETA mixes carrier API values with manual
            operation-team judgment.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:112
        - cause_id: finding-007.cause-003
          claim: Inventory quantities are held separately by WMS and ERP and adjusted
            through nightly reconciliation, but no adjustment evidence concept
            is modeled.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:76-79
            - logistics-fulfillment-ontology.yaml:110-111
      unresolved_beyond_evidence: null
  - finding_id: finding-008
    lens_id: coverage
    source_ref: .onto/review/20260716-9ee88c8b/round1/coverage.findings.yaml#coverage-candidate-005
    target: Order and shipment lifecycle coverage
    evidence_anchor: logistics-fulfillment-ontology.yaml:14-17,
      logistics-fulfillment-ontology.yaml:39-42,
      logistics-fulfillment-ontology.yaml:55-63
    claim: The lifecycle states cover only the happy path and omit cancellation,
      failure, return, correction, and post-delivery exception handling.
    lens_rationale_summary: "Fulfillment operations require non-happy-path and
      post-terminal coverage: cancellations, failed delivery, loss/damage,
      return-to-sender, returns, redelivery, proof-of-delivery correction, and
      reopened exceptions. Without those categories, the concept model cannot
      express common operational outcomes or distinguish final completion from
      later correction."
    proposed_action: Extend lifecycle models with explicit non-happy-path and
      post-delivery states/events, such as canceled, delivery_failed,
      exception_open, exception_resolved, return_initiated, returned,
      corrected/reissued, and define how tracking events transition or annotate
      shipment/order state.
    affected_purpose: Use as a concept baseline for order, shipment, and delivery state models.
    failure_condition: When an order or shipment is canceled, fails delivery,
      returns, receives a carrier exception, or needs post-delivery correction,
      the ontology has no lifecycle category to represent the outcome without
      overloading `delivered` or external handling.
    impact: Integrations can diverge on state interpretation and cannot consistently
      model operational risk events that materially affect customer service,
      inventory, and settlement.
    evidence_refs:
      - .onto/review/20260716-9ee88c8b/round1/coverage.findings.yaml#coverage-candidate-005
      - logistics-fulfillment-ontology.yaml:14-17
      - logistics-fulfillment-ontology.yaml:39-42
      - logistics-fulfillment-ontology.yaml:55-63
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use as a concept baseline for order, shipment, and delivery state models.
      failure_condition: When an order or shipment is canceled, fails delivery,
        returns, receives a carrier exception, or needs post-delivery
        correction, the ontology has no lifecycle category to represent the
        outcome without overloading `delivered` or external handling.
      impact: Integrations can diverge on state interpretation and cannot consistently
        model operational risk events that materially affect customer service,
        inventory, and settlement.
      evidence_refs:
        - logistics-fulfillment-ontology.yaml:14-17
        - logistics-fulfillment-ontology.yaml:39-42
        - logistics-fulfillment-ontology.yaml:55-63
    causal_path:
      root_cause_candidate: Lifecycle coverage is limited to forward fulfillment
        states and does not include exception resolution or terminal correction
        concepts.
      root_cause_step_id: finding-008.cause-003
      steps:
        - cause_id: finding-008.cause-001
          claim: Order fulfillment status progresses from received to delivered with no
            cancellation, return, failure, or correction states.
          relation_to_previous: null
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:14-17
        - cause_id: finding-008.cause-002
          claim: Shipment status progresses from created to delivered and notes that
            delivered is final.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:39-42
        - cause_id: finding-008.cause-003
          claim: Tracking events can report `exception`, but no shipment/order lifecycle
            state or resolution concept corresponds to that event.
          relation_to_previous: causes
          evidence_refs:
            - logistics-fulfillment-ontology.yaml:55-63
      unresolved_beyond_evidence: null
  - finding_id: finding-009
    lens_id: evolution
    source_ref: .onto/review/20260716-9ee88c8b/round1/evolution.findings.yaml#evolution-candidate-001
    target: InventoryRecord / InventoryAggregate 재고 시간성 모델
    evidence_anchor: .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:76,
      .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:81,
      .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:86,
      .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:90,
      .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:112,
      .onto/review/20260716-9ee88c8b/execution-preparation/materialized-input.md:116
    claim: 일중/실시간 재고 확장 시 기존 재고 구조에 시간·출처·스냅샷 권위 필드 추가가 필요해 기존 데이터 연속성이 깨진다.
    lens_rationale_summary: 변경 내성 관점에서 문제는 단순히 현재 as_of가 없다는 표면 결함이 아니라, 일중 주문 처리라는
      현재 사용 경로가 야간 InventoryAggregate.available_qty에 직접 결합되어 있다는 점이다. 새 재고 소스나 더
      빠른 동기화 주기를 추가하면 같은 available_qty 숫자가 어느 시점·어느 권위·어느 계산 기준의 값인지 구분할 수 없으므로,
      과거 주문의 당시 재고 판단과 신규 실시간 판단을 같은 구조 안에서 함께 유지하기 어렵다. WMS/TMS/ERP 통합의 개념 기준
      문서로 쓰일 경우 재고 할당의 변경 이력이 추적되지 않아 운영상 과할당/미할당 원인 분석과 단계적 마이그레이션이 약해진다.
    proposed_action: InventoryQuantity를 시간·권위·목적이 있는 개념으로 분리하고, 최소한 source_system,
      authority_basis, as_of/effective_at, snapshot_id 또는 calculation_version을
      추가한다. InventoryAggregate.available_qty는 원천 수량이 아니라 특정 계산 시점의 파생 스냅샷으로
      명시하고, 할당 규칙은 읽는 재고 뷰의 freshness/authority 요구를 참조하도록 바꾼다.
    affected_purpose: WMS/TMS/ERP 통합의 개념 기준 문서로서 주문 접수, 재고 할당, 출하 판단의 권위와 시간성을 안정적으로 정의하는 목적.
    failure_condition: 야간 배치 기반 집계에서 일중·실시간 재고 이벤트, 복수 WMS/ERP 출처, 예약 재고 또는 과거 시점 조회를 추가하는 경우.
    impact: 기존 available_qty/quantity_on_hand 값이 어떤 권위와 시점의 값인지 보존하지 못해 기존 데이터와 신규
      데이터의 의미가 갈라지고, 통합 규칙을 기존 구조 수정 없이 확장하기 어렵다.
    evidence_refs:
      - .onto/review/20260716-9ee88c8b/round1/evolution.findings.yaml#evolution-candidate-001
      - materialized-input.md:76
      - materialized-input.md:81
      - materialized-input.md:86
      - materialized-input.md:90
      - materialized-input.md:112
      - materialized-input.md:116
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 통합의 개념 기준 문서로서 주문 접수, 재고 할당, 출하 판단의 권위와 시간성을 안정적으로 정의하는 목적.
      failure_condition: 야간 배치 기반 집계에서 일중·실시간 재고 이벤트, 복수 WMS/ERP 출처, 예약 재고 또는 과거 시점 조회를 추가하는 경우.
      impact: 기존 available_qty/quantity_on_hand 값이 어떤 권위와 시점의 값인지 보존하지 못해 기존 데이터와 신규
        데이터의 의미가 갈라지고, 통합 규칙을 기존 구조 수정 없이 확장하기 어렵다.
      evidence_refs:
        - materialized-input.md:76
        - materialized-input.md:81
        - materialized-input.md:86
        - materialized-input.md:90
        - materialized-input.md:112
        - materialized-input.md:116
    causal_path:
      root_cause_candidate: 재고 수량 개념이 현재 숫자 값과 야간 집계 결과에 고정되어 있고, 시간·출처·계산 버전이 개념 모델의
        일급 속성으로 분리되어 있지 않다.
      root_cause_step_id: finding-009.cause-003
      steps:
