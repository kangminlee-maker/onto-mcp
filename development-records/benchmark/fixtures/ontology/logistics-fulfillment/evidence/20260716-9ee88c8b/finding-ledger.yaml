    claim: 중량과 치수 단위를 소스 시스템 관례에 맡기는 설계가 화물·배송 운영 위험을 줄이는 통합 기준 문서의 목적과 맞지 않는다.
    lens_rationale_summary: 가치 판단의 authority anchor는
      review-value-alignment-criteria.yaml:6-11의 사용자 의도, 특히 단위 정합성과 물류 운영 위험 검토
      요청이다. 총중량, 운임, 적재, 라벨, carrier handoff에 쓰일 수 있는 값을 단위 없는 number/string으로
      합산 가능하게 두면 통합 기준이 운영 위험을 예방하기보다 각 연동의 관례 차이를 그대로 전파한다.
    proposed_action: weight와 dims를 수치 값과 canonical unit으로 분리하고, 원천 단위와 변환 시점/방법을
      보존한다. Shipment.total_weight는 canonical unit 기반의 계산 결과와 계산 기준 시점을 함께 갖도록
      하며, 단위 미확정 값은 출하 확정 계산에 사용할 수 없게 모델링한다.
    affected_purpose: WMS/TMS/ERP 통합의 개념 기준 문서로서 주문·화물·배송 단위 정합성과 물류 운영 위험을 다루는 목적.
    failure_condition: 서로 다른 창고 또는 소스 시스템의 kg/lb, 치수 문자열이 Shipment.total_weight나 배송
      연동 값으로 합산·전달될 때.
    impact: 단위 불일치가 운임 산정, carrier 인계, 적재 계획, 배송 예외 처리의 오류로 이어질 수 있는데, 기준 문서가 이를 막는
      공통 의미를 제공하지 못한다.
    evidence_refs:
