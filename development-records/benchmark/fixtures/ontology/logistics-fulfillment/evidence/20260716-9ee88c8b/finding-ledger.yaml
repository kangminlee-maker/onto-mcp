      .onto/review/20260716-9ee88c8b/execution-preparation/review-value-alignment-criteria.yaml:6-11
    claim: 재고 권위와 시간성을 야간 ERP 정합 및 일별 스냅샷에 맞추는 결정이 WMS/TMS/ERP 통합 기준 문서라는 목적과 어긋난다.
    lens_rationale_summary: 가치 판단의 authority anchor는
      review-value-alignment-criteria.yaml:6-11의 사용자 의도, 즉 이 온톨로지가 WMS/TMS/ERP
      통합의 개념 기준 문서로 적절해야 하며 특히 권위와 시간성을 검토해야 한다는 기준이다. 대상은 여러 시스템의 재고 진실이 갈리는
      지점을 통합 기준으로 닫지 않고, 운영상 빠르게 변하는 주문 할당을 야간 ERP 스냅샷으로 처리하도록 두어 목적상 중요한 재고 가용성
      판단을 약화한다.
    proposed_action: 재고 개념에 system_of_record/source_authority, as_of/effective_at,
      snapshot_generated_at, reservation/allocation 이벤트를 추가하고, 일중 할당은 현재 가용 재고나
      명시된 reservation ledger를 권위로 삼도록 기준을 분리한다. ERP 회계 수량 정합은 별도 reconciliation
      상태와 시점으로 모델링한다.
    affected_purpose: WMS/TMS/ERP 통합의 개념 기준 문서로서 주문·재고 개념의 권위와 시간성 정합성을 제공하는 목적.
    failure_condition: 일중 주문, 부분 재고 변동, WMS/ERP 불일치 상황에서 allocation이 야간
      InventoryAggregate.available_qty나 권위가 불명확한 quantity_on_hand를 기준으로 판단될 때.
