  - candidate_id: semantics-candidate-001
    target: Shipment–Order fulfillment semantics
    evidence_anchor: materialized-input.md:25-31,105-109
    claim: "`fulfills`가 부분출하에서도 주문 전체 충족을 뜻하는 관계로 오해될 수 있다."
    what: 관계는 Shipment에서 Order로 직접 연결되고 이름은 완전한 충족을 뜻하지만, 실제 충족 수량과 OrderLine별 대응은
      표현하지 않는다.
    why: 대상 자체가 부분출하 시 라인별 추적이 불가능하다고 명시한다. 따라서 일부 품목만 실은 Shipment에도 `fulfills`를
      적용하면 주문 전체가 충족되었다는 의미와 실제 행위가 불일치하여 OMS·WMS 간 완료 판정이 왜곡될 수 있다.
    how_to_fix: Shipment와 OrderLine 사이에 충족 수량을 가진 할당/출하 라인 개념을 두고, 주문 단위 관계는
      `contributes_to_fulfillment`처럼 부분 기여 의미로 제한하거나 모든 라인이 충족된 경우에만 파생한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 주문·출하 개념을 WMS/TMS/ERP 통합의 공통 의미 기준으로 제공하는 목적
      failure_condition: 한 주문이 여러 Shipment로 부분출하되거나 한 Shipment가 주문 일부만 포함하는 경우
      impact: 관계의 존재만으로 주문 전체 충족을 추론하면 조기 완료, 미출하 라인 누락, 잘못된 고객 통지가 발생할 수 있다.
      evidence_refs:
        - materialized-input.md:25-31
        - materialized-input.md:105-109
    causal_path:
      root_cause_candidate: 충족의 권위와 단위를 OrderLine·수량이 아니라 Shipment→Order 이진 관계로 정의했다.
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: "`fulfills`는 Shipment가 Order를 충족한다고 선언한다."
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:105-109
        - cause_id: semantics-candidate-001.cause-002
          claim: 부분출하에서 어느 OrderLine이 어느 Shipment로 나갔는지 표현할 수 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:25-31
        - cause_id: semantics-candidate-001.cause-003
          claim: 충족 의미가 라인과 수량 없이 주문 단위 이진 관계로 축약되어 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:105-109
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: InventoryRecord.quantity_on_hand
    evidence_anchor: materialized-input.md:76-84,115-116
    claim: 하나의 `quantity_on_hand`가 WMS 실물 수량과 ERP 회계 수량이라는 서로 다른 의미와 권위를 혼합한다.
    what: 동일한 창고·SKU 재고 레코드에서 WMS와 ERP가 각자 값을 가지지만, 필드에는 출처·수량 종류·유효 시점이 없고 야간에 ERP
      기준으로 맞춘다고 정의한다.
    why: 실물 재고와 회계 재고는 서로 다른 관점의 수량인데 동일 이름으로 구분 없이 표현된다. 현재값이라는 이름도 `as_of`가 없어 시간적
      의미를 확정할 수 없으므로 통합 시스템이 어느 값이 피킹 가능 수량인지 판단할 수 없다.
    how_to_fix: 실물 보유 수량과 회계 장부 수량을 별도 개념 또는 명시적 `quantity_type`으로 구분하고,
      `source_system`, `as_of`, 조정 상태를 추가해 각 권위와 유효 시점을 보존한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS와 ERP 사이 재고 의미·권위·시간성을 일관되게 통합하는 목적
      failure_condition: 야간 조정 전 불일치가 있거나 과거/현재 재고를 구분해야 하는 경우
      impact: 같은 필드가 서로 다른 실재를 가리켜 할당, 피킹, 회계 조정의 기준 수량이 뒤바뀔 수 있다.
      evidence_refs:
        - materialized-input.md:76-84
        - materialized-input.md:115-116
    causal_path:
      root_cause_candidate: 서로 다른 재고 관점과 권위를 하나의 무출처·무시점 수량 속성으로 모델링했다.
      root_cause_step_id: semantics-candidate-002.cause-003
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: "`quantity_on_hand`가 현재 보유 수량이라는 단일 의미로 노출된다."
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:81-83
        - cause_id: semantics-candidate-002.cause-002
          claim: 실제로는 WMS와 ERP가 각각 값을 보유하며 둘의 진실 기준도 실물과 회계로 다르다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:83
            - materialized-input.md:115-116
        - cause_id: semantics-candidate-002.cause-003
          claim: 레코드에는 출처나 유효 시점이 없어 두 의미를 판별할 수 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:76-84
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-003
    target: InventoryAggregate.available_qty
    evidence_anchor: materialized-input.md:86-90,111-112
    claim: "`available_qty`라는 현재 가용성 이름이 야간 스냅샷이라는 실제 시간 의미와 맞지 않는다."
    what: 속성은 가용 수량으로 명명되지만 매일 밤 저장된 스냅샷이며, 일중 주문 할당도 이 값을 직접 읽는다. 스냅샷 시점이나 가용량 산식은
      없다.
    why: 가용 재고는 할당 시점에 사용할 수 있는 수량을 뜻하는데, 전일 스냅샷을 현재값처럼 사용하면 그 사이의 예약·출고를 반영하지 못한다.
      이름이 보장하는 시간성과 실제 데이터 갱신 주기가 달라 과할당 위험이 생긴다.
    how_to_fix: 값을 `available_qty_snapshot`으로 명확히 하고 `as_of`를 추가하거나, 현재 가용량을
      보유량·예약량·보류량 등 권위 있는 원천에서 계산하도록 정의하고 일중 할당 경로는 최신 값을 사용한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 재고 할당에 사용할 공통 가용 재고 의미를 정의하는 목적
      failure_condition: 야간 스냅샷 이후 주문, 예약, 피킹 또는 재고 조정이 발생한 일중 할당
      impact: 오래된 값을 현재 가용량으로 해석해 동일 재고를 중복 할당하거나 품절 주문을 승인할 수 있다.
      evidence_refs:
        - materialized-input.md:86-90
        - materialized-input.md:111-112
    causal_path:
      root_cause_candidate: 시점이 있는 집계 스냅샷과 현재 가용 재고를 동일 개념으로 취급했다.
      root_cause_step_id: semantics-candidate-003.cause-003
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: "`available_qty`가 일중 재고 할당의 판단값으로 사용된다."
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:111-112
        - cause_id: semantics-candidate-003.cause-002
          claim: 해당 값은 실시간 현재값이 아니라 매일 밤 저장되는 스냅샷이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:86-90
        - cause_id: semantics-candidate-003.cause-003
          claim: 스냅샷임을 식별할 `as_of`나 별도 개념이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:86-90
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-004
    target: Sku measurements and Shipment.total_weight
    evidence_anchor: materialized-input.md:27-29,33-38,40-49
    claim: "`total_weight`의 파생 의미가 단위 없는 SKU 중량과 명시되지 않은 계산 원천 때문에 결정적이지 않다."
    what: SKU 중량은 kg 또는 lb를 창고 관례대로 저장하고 치수도 단위가 다른 문자열이다. Shipment의 `total_weight`는
      OrderLine 중량 합으로 정의되지만 OrderLine에는 중량이 없고 수량 적용 및 단위 변환 규칙도 없다.
    why: 서로 다른 단위의 숫자는 그대로 합할 수 없으며, 총중량은 통상 각 라인의 수량과 단위중량을 반영해야 한다. 현재 정의로는 같은
      Shipment가 연동별로 다른 총중량을 갖거나 저장된 파생값이 원천과 드리프트할 수 있다.
    how_to_fix: 중량과 치수를 값+표준 단위 구조로 모델링하고 정규 단위를 지정한다. `total_weight` 산식을 각 출하 라인의
      `shipped_qty × unit_weight` 합으로 명시하며 계량값과 계산값을 구분하고 계산 시점·출처를 기록한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS/TMS가 공유할 화물 중량·치수 및 운송 계산의 공통 의미를 제공하는 목적
      failure_condition: 서로 다른 단위의 SKU가 섞이거나 주문 수량이 1보다 크거나 저장된 총중량을 재계산하는 경우
      impact: 운임, 적재 한도, 서비스 선택 및 라벨 데이터가 잘못될 수 있고 시스템별 재계산 결과가 일치하지 않는다.
      evidence_refs:
        - materialized-input.md:27-29
        - materialized-input.md:33-38
        - materialized-input.md:40-49
    causal_path:
      root_cause_candidate: 측정값의 단위와 총중량의 권위 있는 계산 산식을 모델 계약에 포함하지 않았다.
      root_cause_step_id: semantics-candidate-004.cause-003
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: "`total_weight`는 OrderLine 중량의 합으로 저장되는 파생값이다."
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:48
        - cause_id: semantics-candidate-004.cause-002
          claim: OrderLine에는 SKU 참조와 수량만 있고 자체 중량은 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:25-29
        - cause_id: semantics-candidate-004.cause-003
          claim: 참조되는 SKU 중량은 kg 또는 lb를 구분하는 단위 필드 없이 숫자로 저장된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:33-38
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-005
    target: DeliveryLeg is_a Shipment
    evidence_anchor: materialized-input.md:40-58
    claim: 경로의 부분 구간인 DeliveryLeg를 전체 화물 이동인 Shipment의 하위 유형으로 둔 것은 존재론적 유형이 맞지 않는다.
    what: Shipment는 창고에서 고객까지 가는 물리적 화물 이동으로 정의되지만 DeliveryLeg는 그 이동을 구성하는 한 구간이다.
      그런데 `is_a` 상속으로 구간을 Shipment의 일종으로 선언한다.
    why: 부분-전체 관계를 유형 상속으로 표현하면 모든 DeliveryLeg가 shipment 번호, 전체 중량, 주문 충족 관계 및 최종 배송
      상태의 의미를 상속한다. 구간 도착과 전체 화물 배송 완료 같은 서로 다른 사건이 동일 의미로 처리될 수 있다.
    how_to_fix: DeliveryLeg를 독립 엔터티로 두고 `part_of Shipment` 관계로 연결한다. 구간별 운송사·상태·ETA가
      필요하면 Shipment 속성을 무조건 상속하지 말고 구간 의미에 맞게 별도로 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 화물과 배송 구간의 개념을 TMS 연동 기준으로 일관되게 정의하는 목적
      failure_condition: 다구간 배송에서 구간 상태나 도착을 전체 Shipment 상태와 구분해야 하는 경우
      impact: 구간 완료가 전체 배송 완료로 오인되거나 전체 화물 속성이 개별 구간에 부당하게 적용되어 추적 의미가 왜곡된다.
      evidence_refs:
        - materialized-input.md:40-58
    causal_path:
      root_cause_candidate: 구간과 전체 이동의 부분-전체 관계를 하위유형 관계로 모델링했다.
      root_cause_step_id: semantics-candidate-005.cause-003
      steps:
        - cause_id: semantics-candidate-005.cause-001
          claim: "DeliveryLeg가 `is_a: Shipment`로 선언된다."
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:52-54
        - cause_id: semantics-candidate-005.cause-002
          claim: DeliveryLeg의 정의는 전체 이동이 아니라 경로의 한 구간이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:52-58
        - cause_id: semantics-candidate-005.cause-003
          claim: Shipment는 창고에서 고객까지의 전체 물리적 화물 이동으로 정의된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:40-41
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-006
    target: Shipment.eta authority and provenance
    evidence_anchor: materialized-input.md:48-49,115-117
    claim: 단일 `eta`가 캐리어 예측과 운영팀 수정값을 구분 없이 혼합해 예상 시각의 의미와 권위를 모호하게 한다.
    what: Shipment에는 ETA 한 필드만 있지만 값은 캐리어 API와 운영팀 수기 판단에서 오며 최종 표시값은 운영팀 판단을 따른다.
      출처, 계산 시점, 수정 사유 또는 원래 예측값이 없다.
    why: 캐리어가 계산한 예상 도착과 운영자가 덮어쓴 표시 예상은 서로 다른 주장이다. 둘을 같은 속성으로 취급하면 소비 시스템이 운송사 약속,
      내부 판단, 값의 신선도를 구분할 수 없다.
    how_to_fix: 캐리어 예측 ETA와 운영 조정 ETA를 별도 속성 또는 출처가 있는 ETA 관측값으로 모델링하고,
      `predicted_at`, `source`, `override_reason`과 최종 표시값을 선택하는 명시적 우선순위 규칙을 둔다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: TMS·캐리어·운영 화면 사이 예상 도착 시각의 공통 의미와 권위를 제공하는 목적
      failure_condition: 캐리어 예측이 갱신되거나 운영팀이 수기 조정한 뒤 다른 시스템이 ETA를 소비하는 경우
      impact: 예측 정확도 평가, 지연 판단, 고객 안내에서 값의 출처와 신선도를 판별할 수 없어 서로 다른 ETA가 같은 사실로 취급된다.
      evidence_refs:
        - materialized-input.md:48-49
        - materialized-input.md:115-117
    causal_path:
      root_cause_candidate: 서로 다른 출처의 ETA 주장과 최종 표시값을 하나의 무출처 datetime으로 축약했다.
      root_cause_step_id: semantics-candidate-006.cause-003
      steps:
        - cause_id: semantics-candidate-006.cause-001
          claim: Shipment에는 단일 `eta` datetime만 정의된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:49
        - cause_id: semantics-candidate-006.cause-002
          claim: 그 값에는 캐리어 API 예측과 운영팀 수기 조정값이 섞인다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:117
        - cause_id: semantics-candidate-006.cause-003
          claim: 최종 표시 권위는 운영팀에 있지만 원천별 값을 구분하는 모델이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:49
            - materialized-input.md:117
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-007
