  - candidate_id: axiology-candidate-002
    target: Sku.weight, Sku.dims 및 Shipment.total_weight
    evidence_anchor: ".onto/review/20260716-422472ec/execution-preparation/material\
      ized-input.md:33-38,40-49; value authority:
      .onto/review/20260716-422472ec/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8 — 단위 정합성을 포함한 통합 개념 기준 목적"
    claim: "[principle/misaligned] 소스별 단위를 그대로 허용하면서 합산 중량을 저장하는 결정은 단위 정합성이라는 통합
      목적과 정면으로 충돌한다."
    what: weight는 kg 또는 lb를 구분하지 않는 number이고 dims는 단위 없는 문자열인데,
      Shipment.total_weight는 OrderLine 중량의 합으로 계산된다.
    why: 서로 다른 단위의 값을 동일 수치 공간에서 합산할 수 있어 총중량과 치수가 의미를 잃는다. 운임 산정, 적재 제한, 운송사 연동에서
      조용한 오계산을 유발하므로 공통 기준 문서로 사용할 수 없다.
    how_to_fix: 중량과 각 치수를 value+unit 구조로 모델링하고 canonical unit 및 변환·반올림 규칙을 정한다.
      total_weight에는 계산 시점, 사용 단위, 구성 항목 또는 계산 근거를 보존한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: WMS/TMS/ERP 간 단위가 일관된 SKU·화물 기준 제공
      failure_condition: kg와 lb 또는 서로 다른 길이 단위를 쓰는 소스가 하나의 Shipment에 결합될 때
      impact: 유효하지만 의미가 다른 숫자가 합산되어 운임·용량·운영 판단이 잘못될 수 있다.
      evidence_refs:
        - materialized-input.md:33-38
        - materialized-input.md:40-49
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 측정값의 단위를 값의 필수 의미로 모델링하지 않고 소스 시스템 관례로 남겨 둔다.
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: Shipment.total_weight가 구성 OrderLine 중량 합으로 저장된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:48
        - cause_id: axiology-candidate-002.cause-002
          claim: 합산 원천인 SKU weight는 kg와 lb를 구분하지 않는 number이며 dims도 단위 없는 문자열이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:33-38
        - cause_id: axiology-candidate-002.cause-003
          claim: 공통 단위 계약 없이 소스별 관례를 그대로 수용한다.
          relation_to_previous: symptom_of
          evidence_refs:
