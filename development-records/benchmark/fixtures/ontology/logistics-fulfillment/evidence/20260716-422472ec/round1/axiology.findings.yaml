  - candidate_id: axiology-candidate-004
    target: OrderLine과 Shipment의 fulfillment 관계
    evidence_anchor: ".onto/review/20260716-422472ec/execution-preparation/material\
      ized-input.md:25-31,105-109; value authority:
      .onto/review/20260716-422472ec/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8 — 주문·화물 개념 정합성과 운영 위험을 다루는 통합 기준 목적"
    claim: "[stakeholder/misaligned] 주문 단위 관계만 유지하는 모델 단순화가 부분출하의 고객·운영 추적 가능성을 희생한다."
    what: Shipment가 Order 전체를 fulfills할 뿐, 어느 OrderLine의 몇 개가 어느 Shipment로 출하됐는지 표현할
      수 없다.
    why: 부분출하, 분할배송, 미출고 잔량에서 주문 완료 상태의 근거를 계산하거나 고객 문의와 분실·오배송을 추적할 수 없다. 관계 수를 줄이는
      국소 단순화가 주문충족 기준 문서의 핵심 목적을 훼손한다.
    how_to_fix: OrderLine과 Shipment 사이에 FulfillmentAllocation 또는 ShipmentLine을 두고
      fulfilled_qty, 단위, 할당·출하 시점, 취소·반품 조정을 기록한다. Order 상태는 이 근거로 집계하도록 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문에서 화물까지 추적 가능한 주문충족 개념 기준
      failure_condition: 한 주문이 여러 Shipment로 나뉘거나 한 OrderLine이 부분 수량으로 출하될 때
      impact: 완료 여부와 잔량의 근거가 사라져 고객 응대, 운영 복구, 정산의 신뢰가 약화된다.
      evidence_refs:
        - materialized-input.md:25-31
        - materialized-input.md:105-109
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: fulfillment를 수량을 가진 라인 수준 사실이 아니라 Shipment→Order의 거친 관계로 축약한다.
      root_cause_step_id: axiology-candidate-004.cause-002
      steps:
        - cause_id: axiology-candidate-004.cause-001
          claim: 부분출하 시 어느 OrderLine이 어느 Shipment로 나갔는지 추적할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:25-31
        - cause_id: axiology-candidate-004.cause-002
          claim: 유일한 fulfills 관계가 Shipment에서 Order로만 연결되고 라인 매핑을 명시적으로 배제한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:105-109
      unresolved_beyond_evidence: null
  - candidate_id: axiology-candidate-005
    target: Shipment.eta의 권위와 변경 이력
    evidence_anchor: ".onto/review/20260716-422472ec/execution-preparation/material\
      ized-input.md:40-50,115-117; value authority:
      .onto/review/20260716-422472ec/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8 — 권위·시간성 정합성과 물류 운영 위험을 다루는 목적"
    claim: "[commitment/misaligned] ETA의 최종값만 운영팀 판단에 맡기고 출처·관측시점·대체 이력을 없애 신뢰 가능한
      배송 약속이라는 목적을 약화한다."
    what: 캐리어 API ETA와 운영팀 수기 조정값이 하나의 eta에 섞이며 최종 표시값은 운영팀 판단을 따르지만,
      출처·산출시점·수정자·사유가 모델에 없다.
    why: 소비자는 ETA의 신선도와 신뢰도를 판단하거나 이전 예측과 실제 도착을 비교할 수 없다. 수기 재량을 보존하면서도 책임성과 시간성을
      제공해야 하는데 현재 모델은 그 트레이드오프를 명시적으로 관리하지 않는다.
    how_to_fix: ETA를 시계열 Estimate로 분리해 value, generated_at/as_of, source, method,
      confidence, supersedes, adjustment_reason을 기록하고, 표시 ETA를 선택하는 권위와 우선순위 규칙을
      명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 배송 시간 정보의 권위와 시간성을 일관되게 전달하는 통합 기준
      failure_condition: 캐리어 예측과 운영팀 조정값이 다르거나 ETA가 반복 갱신될 때
      impact: 고객 약속과 운영 의사결정의 근거를 재현·감사할 수 없고 오래된 값이 최종값으로 남을 수 있다.
      evidence_refs:
        - materialized-input.md:40-50
        - materialized-input.md:115-117
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: ETA를 출처와 유효시점을 가진 예측 사실이 아니라 덮어쓰는 단일 표시값으로 모델링한다.
      root_cause_step_id: axiology-candidate-005.cause-002
      steps:
        - cause_id: axiology-candidate-005.cause-001
          claim: 캐리어 API 값과 운영팀 수기 조정값이 동일 ETA에 섞이고 운영팀 판단이 최종 표시를 결정한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:49
            - materialized-input.md:115-117
        - cause_id: axiology-candidate-005.cause-002
          claim: ETA 속성에는 출처, 산출·유효시점, 수정 사유 또는 대체 관계가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:40-50
      unresolved_beyond_evidence: 운영팀의 실제 선택 절차와 감사 로그 존재 여부는 현재 경계의 온톨로지 자료만으로 확인할 수 없다.
