    evidence_anchor: ".onto/review/20260716-422472ec/execution-preparation/material\
      ized-input.md:19-22,44-47,60-68,111-113; value authority:
      .onto/review/20260716-422472ec/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8 — 상태 모델 정합성을 갖춘 통합 기준 목적"
    claim: "[boundary/misaligned] 상태 의미와 매핑을 각 연동에 위임하여, 온톨로지가 통합 경계의 공통 상태 계약 역할을
      스스로 포기한다."
    what: OMS, TMS, 캐리어가 상태를 독립 관리하며 캐리어 상태와 Shipment.status의 매핑은 각 연동이 알아서 하도록 한다.
    why: 동일 이벤트가 연동별로 다른 상태 전이를 만들 수 있고 delivered 같은 동명 상태도 주문·화물·이벤트에서 서로 다른 완료 의미를
      가질 수 있다. 이는 상태 정합성을 위한 기준 문서라는 목적 대신 국소 구현 편의를 우선한 선택이다.
    how_to_fix: 각 상태 체계의 소유권은 유지하되 canonical fulfillment milestone과 명시적 매핑 규칙을 정의한다.
      허용 전이, 예외·취소·반품, 순서 역전·중복 이벤트 처리, 주문 상태 집계 규칙도 계약화한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: OMS/TMS/캐리어 상태를 일관되게 해석하는 통합 개념 기준
      failure_condition: 둘 이상의 연동이 동일 캐리어 이벤트를 Shipment 또는 Order 상태로 변환할 때
      impact: 연동별 상태 drift로 고객 표시, 운영 예외 처리, 완료 판정이 달라질 수 있다.
      evidence_refs:
        - materialized-input.md:19-22
        - materialized-input.md:44-47
        - materialized-input.md:60-68
        - materialized-input.md:111-113
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 온톨로지가 시스템별 상태를 연결하는 canonical milestone과 매핑·전이 권위를 정의하지 않는다.
      root_cause_step_id: axiology-candidate-003.cause-003
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: 캐리어 event_type와 Shipment.status의 매핑을 각 연동이 독자적으로 수행한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:60-68
        - cause_id: axiology-candidate-003.cause-002
          claim: Order, Shipment, TrackingEvent 상태는 각 소유 시스템이 독립 관리한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:111-113
        - cause_id: axiology-candidate-003.cause-003
          claim: 통합 기준이 상태 의미를 중재하지 않고 연동 구현에 위임한다.
          relation_to_previous: symptom_of
          evidence_refs:
