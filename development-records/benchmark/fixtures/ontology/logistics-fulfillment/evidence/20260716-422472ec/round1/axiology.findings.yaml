      nt-criteria.yaml:6-8 — WMS/TMS/ERP 통합의 개념 기준과 권위·시간성 정합성을 검토한다는 확정 목적"
    claim: "[tradeoff/misaligned] 야간 ERP 정합과 일일 스냅샷의 단순성을 우선하여, 통합 기준 문서가 제공해야 할 재고
      권위·유효시점 계약을 포기한다."
    what: WMS 실물 수량과 ERP 회계 수량을 모두 ‘재고 진실’로 두면서 야간에 ERP 기준으로 조정하고, 유효시점 없는 일일
      available_qty를 일중 할당에도 사용한다.
    why: 어느 수량이 어떤 목적과 시점에 권위 있는지 판정할 수 없고, 오래된 집계로 일중 주문을 할당할 수 있다. 이는 권위와 시간성의
      정합성을 제공하려는 선언 목적을 직접 약화하고 과잉할당·결품·사후 감사 불능 위험을 만든다.
    how_to_fix: 재고 측정값에 as_of, source_system, quantity_type을 두고, 실물·회계·가용 수량별 권위자를
      명시한다. 할당은 신선도 기준을 만족하는 가용재고에서만 수행하며 예약·해제 변동을 시간 기록으로 모델링한다.
    upstream_evidence_required: false
    severity_hint: high
