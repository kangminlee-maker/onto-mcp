    failure_condition: 일중 주문이 전일 스냅샷을 읽거나 WMS와 ERP 수량이 불일치할 때
    impact: 통합 소비자가 동일 주문에 서로 다른 재고 판단을 내릴 수 있어 할당 신뢰성과 운영 감사 가능성이 훼손된다.
