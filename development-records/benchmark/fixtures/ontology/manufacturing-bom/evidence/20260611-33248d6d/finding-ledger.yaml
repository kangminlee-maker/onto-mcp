    claim: WorkCenter capacity is a bare number with variable local units, so new
      capacity types cannot be integrated without changing or bypassing the
      model.
    lens_rationale_summary: MES scheduling and routing integration need to compare
      operation times, work-center capacity, and shift availability. If some
      centers are constrained by pieces, minutes, labor hours, machine hours,
