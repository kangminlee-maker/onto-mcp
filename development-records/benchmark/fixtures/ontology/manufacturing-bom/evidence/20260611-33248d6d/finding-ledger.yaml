  - finding_id: finding-007
    lens_id: evolution
    source_ref: .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution-candidate-001
    target: manufacturing-bom-ontology.yaml / ECO, Part revision, BOM/Routing
      effectivity model
    evidence_anchor: manufacturing-bom-ontology.yaml:15-16,64-70,91
    claim: ECO effectivity is date-only and current-state oriented, so future
      revision/effectivity changes cannot preserve PLM/MES continuity.
    lens_rationale_summary: A PLM/MES integration baseline must support overlapping
      design changes, delayed synchronization, in-flight production orders, and
      historical/as-built traceability. With only a current part revision and a
      single effective date, adding common change scenarios such as phased
      cut-in, serial/lot effectivity, plant-specific application, or
      routing-only ECOs would require changing the existing core model rather
      than extending it. During the weekly sync gap, MES could need to decide
      production revision using an ECO state that is not tied to versioned
      BOM/routing structures.
    proposed_action: "Introduce versioned/effective structures: `PartRevision`,
      `BomRevision` or effective `BomLine`, and `RoutingRevision` with validity
      by date/lot/serial/site as needed. Link ECOs to explicit changed artifacts
      and transition rules, and make current revision a derived projection
      rather than the only modeled state."
    affected_purpose: Use the ontology as the concept baseline for PLM/MES
      integration around item, BOM, routing, and change management.
    failure_condition: When an ECO changes a revision, BOM line, or routing with
      nontrivial effectivity or while drawing-ledger synchronization lags, the
      model cannot preserve both old and new manufacturing states inside the
      target concepts.
    impact: The integration contract becomes unsafe for production-order release,
      historical traceability, and change cut-in because consumers must invent
      external rules or overwrite current attributes.
    evidence_refs:
      - .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution-candidate-001
      - manufacturing-bom-ontology.yaml:15-16
      - manufacturing-bom-ontology.yaml:64-70
      - manufacturing-bom-ontology.yaml:91
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology as the concept baseline for PLM/MES
        integration around item, BOM, routing, and change management.
      failure_condition: When an ECO changes a revision, BOM line, or routing with
        nontrivial effectivity or while drawing-ledger synchronization lags, the
        model cannot preserve both old and new manufacturing states inside the
        target concepts.
      impact: The integration contract becomes unsafe for production-order release,
        historical traceability, and change cut-in because consumers must invent
        external rules or overwrite current attributes.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:15-16
        - manufacturing-bom-ontology.yaml:64-70
        - manufacturing-bom-ontology.yaml:91
    causal_path:
      root_cause_candidate: Revision and effectivity are modeled as current attributes
        and a date-only ECO property rather than as versioned/effective artifact
        concepts.
      root_cause_step_id: finding-007.cause-004
      steps:
        - cause_id: finding-007.cause-001
          claim: "`Part.rev` and `current_eco` are current fields whose authorities are
            external systems."
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:15-16
        - cause_id: finding-007.cause-002
          claim: ECO only lists affected parts and an effective date, with no changed
            artifact version or effectivity scope.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml:64-70
        - cause_id: finding-007.cause-003
          claim: The integrity rule makes post-effective-date production follow the new
            rev, while Part.rev updates later through weekly synchronization.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:91
        - cause_id: finding-007.cause-004
          claim: Therefore future change scenarios require modifying the core model or
            relying on out-of-model resolution, weakening PLM/MES continuity.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:2
            - manufacturing-bom-ontology.yaml:91
      unresolved_beyond_evidence: null
  - finding_id: finding-008
    lens_id: evolution
    source_ref: .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution-candidate-002
    target: manufacturing-bom-ontology.yaml / UOM and conversion semantics
    evidence_anchor: manufacturing-bom-ontology.yaml:14,95
    claim: Fixed UOM enum plus manual kg-ea conversion cannot absorb new unit
      categories or deterministic PLM/MES quantity integration.
    lens_rationale_summary: BOM, planning, procurement, and MES consumption all
      depend on stable quantity semantics. If a new material form, packaging
      unit, area/volume unit, or item-specific conversion is introduced, the
      enum must be changed and downstream consumers still lack a canonical
      conversion authority. This is a change-resilience issue because future
      unit expansion and cross-system quantity reconciliation cannot be handled
      as data extension.
    proposed_action: Replace the closed enum with a `UnitOfMeasure` reference and
      add an item/site/effectivity-aware `UomConversion` master where conversion
      is valid. Keep allowed unit families and dimensional compatibility as
      validation data rather than hard-coded enum values.
    affected_purpose: Use the ontology as a PLM/MES integration concept standard for
      BOM quantities and manufacturing operations.
    failure_condition: When parts require units outside `ea/kg/m` or require
      item-specific conversion between purchase, BOM, inventory, and execution
      units, the model cannot represent the conversion canonically.
    impact: Quantity, scrap, cost, and consumption calculations become system- or
      operator-specific, reducing trust in integrated BOM/MES behavior.
    evidence_refs:
      - .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution-candidate-002
      - manufacturing-bom-ontology.yaml:14
      - manufacturing-bom-ontology.yaml:95
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology as a PLM/MES integration concept standard for
        BOM quantities and manufacturing operations.
      failure_condition: When parts require units outside `ea/kg/m` or require
        item-specific conversion between purchase, BOM, inventory, and execution
        units, the model cannot represent the conversion canonically.
      impact: Quantity, scrap, cost, and consumption calculations become system- or
        operator-specific, reducing trust in integrated BOM/MES behavior.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:14
        - manufacturing-bom-ontology.yaml:95
    causal_path:
      root_cause_candidate: Unit identity and unit conversion are not modeled as
        extensible authority concepts.
      root_cause_step_id: finding-008.cause-003
      steps:
        - cause_id: finding-008.cause-001
          claim: The `uom` attribute is a closed enum with only three values.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:14
        - cause_id: finding-008.cause-002
          claim: The ontology explicitly says item-specific conversion factors are absent
            and conversions are performed in the field as needed.
          relation_to_previous: causes
