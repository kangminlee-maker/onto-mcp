  - finding_id: finding-009
    lens_id: evolution
    source_ref: .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution-candidate-003
    target: manufacturing-bom-ontology.yaml / BOM acyclicity exception for scrap
      reinput
    evidence_anchor: manufacturing-bom-ontology.yaml:88-89
    claim: Modeling scrap reinput as a self-child Assembly exception makes future
      recycle/rework flows collide with the core acyclic BOM rule.
    lens_rationale_summary: The base rule and its exception force one process-flow
      concept into the product-structure graph. As soon as additional recycle,
      rework, byproduct, co-product, or yield-return cases appear, graph
      traversal, explosion, costing, and cycle validation need special cases
      around self-cycles. That means extension pressure lands on the existing
      BOM invariant rather than on a separate process/yield model.
    proposed_action: Keep engineering/product BOM acyclic and model scrap reinput
      through a separate process/yield/recovery relation, such as
      `MaterialRecovery`, `ByproductOutput`, or routing operation input/output
      links. Let BOM cycle validation remain strict and handle recycling in
      routing/process semantics.
    affected_purpose: Use the ontology as a stable BOM/routing baseline for
      manufacturing operations and integration.
    failure_condition: When recovery, rework, or byproduct flows expand beyond the
      single named exception, consumers must either weaken acyclic BOM
      validation or add hidden traversal exceptions.
    impact: BOM explosion and integration logic become brittle because product
      structure and manufacturing flow semantics are mixed in one graph
      relation.
    evidence_refs:
      - .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution-candidate-003
      - manufacturing-bom-ontology.yaml:88-89
