            - "Embedded Materialized Input: relations"
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260611-33248d6d/round1/coverage.findings.yaml#coverage-candidate-002
    target: manufacturing-bom-ontology.yaml / entities.Routing.status and ECO.status
    evidence_anchor: "Embedded Materialized Input: Routing.status values [draft,
      released]; ECO.status values [open, approved, applied]; no
      obsolete/archived/superseded/cancelled state or post-release
      correction/reissue event is defined."
    claim: 라우팅과 ECO의 lifecycle이 종료·폐기·정정 구간을 커버하지 않습니다.
    lens_rationale_summary: 상태를 갖는 요소의 lifecycle이 도입부터 종료까지 전 구간을 커버하는지는 coverage
      lens의 명시 질문입니다. 현재 상태 열거는 릴리즈/적용을 끝점처럼 취급하므로, 단종 품목의 라우팅 차단, 잘못 적용된 ECO의
      정정, 과거 기준 보존을 개념적으로 표현하기 어렵습니다. PLM/MES 통합 기준에서는 릴리즈된 라우팅만 생산 오더를 생성할 수
