        - cause_id: finding-003.cause-003
          claim: 온톨로지에서 시점 개념은 ECO.effective_date에 한정되어 있으며 scrap_rate 변경 이력을 BOM 라인에 연결하는
            엔티티나 관계가 없습니다.
          relation_to_previous: causes
          evidence_refs:
