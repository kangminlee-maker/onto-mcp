    evidence_anchor: materialized-input.md:20-21,69-75,95-96;
      review-value-alignment-criteria.yaml criterion_id=user-request-intent
    claim: ECO 적용일 이후의 생산 기준을 선언하면서 Part.rev 동기화를 주간 배치로 늦추는 결정은 PLM/MES 통합 기준 문서라는
      목적과 어긋납니다.
    lens_rationale_summary: "리뷰의 확인된 목적은 이 파일이 'PLM/MES 통합의 개념 기준 문서'로 적절한지, 특히 변경관리
      정합성과 제조 운영 위험을 중심으로 보는 것입니다. 해당 목적 기준에서 ECO 적용일은 생산 실행의 기준점이어야 하는데, 파일은 그
      기준점과 Part.rev 가시성 사이의 주간 지연을 통합 계약으로 닫지 않습니다. 이는 단순 구조 결함을 넘어, 변경관리의 정확성을
      우선해야 하는 PLM/MES 통합 목적보다 기존 도면대장 배치 동기화 편의를 우선하는 숨은 트레이드오프입니다. Value
      authority anchor: {source:
      .onto/review/20260611-33248d6d/execution-preparation/review-value-alignme\
      nt-criteria.yaml, anchor: criterion_id=user-request-intent, excerpt:
      'PLM/MES 통합의 개념 기준 문서로 적절한지... 변경관리 개념의 정합성과 제조 운영 위험을 중심으로.'};
      value_type=purpose; alignment_direction=misaligned."
    proposed_action: ECO effectivity를 생산 실행의 canonical 기준으로 승격하고, Part.rev는 ECO/도면
      rev의 유효기간 projection으로 모델링하십시오. ECO.effective_date 이후 신규 rev가 MES에 동기화되지
      않은 경우 생산 오더 생성을 차단하거나, rev 해석을 ECO 적용 이력에서 직접 결정하도록 Routing release 조건에
      포함시키는 것이 최소 수정입니다.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서 변경관리 정합성과 제조 운영 위험을 판단 가능하게 하는 목적.
    failure_condition: ECO.effective_date가 지났지만 Part.rev가 주간 배치 전이라 구 rev로 남아 있는 생산 시점.
    impact: 적용일 이후 생산분이 신규 rev를 따라야 한다는 운영 약속이 MES 실행 기준에서 닫히지 않아, 통합 기준 문서가 변경관리
      위험을 줄이기보다 정상화합니다.
    evidence_refs:
      - .onto/review/20260611-33248d6d/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:20-21
      - materialized-input.md:69-75
      - materialized-input.md:95-96
      - review-value-alignment-criteria.yaml criterion_id=user-request-intent
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 변경관리 정합성과 제조 운영 위험을 판단 가능하게 하는 목적.
      failure_condition: ECO.effective_date가 지났지만 Part.rev가 주간 배치 전이라 구 rev로 남아 있는 생산 시점.
      impact: 적용일 이후 생산분이 신규 rev를 따라야 한다는 운영 약속이 MES 실행 기준에서 닫히지 않아, 통합 기준 문서가 변경관리
        위험을 줄이기보다 정상화합니다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:69-75
        - materialized-input.md:95-96
        - review-value-alignment-criteria.yaml criterion_id=user-request-intent
    causal_path:
      root_cause_candidate: 파일이 ECO effectivity와 Part.rev 동기화 지연 사이의 우선순위와 차단 조건을 통합 계약으로 닫지 않은 것.
      root_cause_step_id: finding-001.cause-004
      steps:
        - cause_id: finding-001.cause-001
          claim: Part.rev는 도면 관리대장이 원본이고 current_eco는 ECO 시스템이 원본으로 분리되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20-21
        - cause_id: finding-001.cause-002
          claim: ECO는 effective_date와 status를 가지며 Part를 변경하는 엔티티로 정의되어 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:69-75
            - materialized-input.md:90
        - cause_id: finding-001.cause-003
          claim: 무결성 규칙은 effective_date 이후 생산분은 신규 rev를 따른다고 하면서 Part.rev 갱신은 도면 관리대장 반영 후
            주간 배치로 동기화한다고 둔다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:96
        - cause_id: finding-001.cause-004
          claim: 생산 오더 생성 차단 규칙은 Routing.status released 여부만 언급하며 rev 동기화 지연 상태를 닫지 않는다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:95
      unresolved_beyond_evidence: null
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260611-33248d6d/round1/axiology.findings.yaml#axiology-candidate-002
    target: manufacturing-bom-ontology.yaml / operational planning values in BOM,
      capacity, costing, and UOM handling
    evidence_anchor: materialized-input.md:35,67,99-100;
      review-value-alignment-criteria.yaml criterion_id=user-request-intent;
      review-target-profile.yaml review_goal
    claim: 운영 핵심값을 복사·수기 입력·현장 환산으로 남겨 둔 설계는 PLM/MES 통합 기준 문서의 목적을 국소 업무 편의 쪽으로
      드리프트시킵니다.
    lens_rationale_summary: "이 리뷰의 목적은 BOM/공정 온톨로지를 PLM/MES 통합의 개념 기준 문서로 검토하는 것이며,
      target profile의 review_goal에는 precedence와 invalid_input_behavior가 포함됩니다.
      그런데 파일은 계획, 원가, 용량, 단위 변환의 실제 운영값을 권위 있는 통합 개념으로 닫지 않고 외부 엑셀, 수기 필드, 현장
      판단에 맡깁니다. 이는 여러 부서의 기존 로컬 운영을 보존하는 대신 통합 기준 문서가 제공해야 할 우선순위와 입력 실패 기준을
      약화하는 가치상 트레이드오프입니다. Value authority anchor: {source:
      .onto/review/20260611-33248d6d/execution-preparation/review-value-alignme\
      nt-criteria.yaml, anchor: criterion_id=user-request-intent, excerpt:
      'PLM/MES 통합의 개념 기준 문서로 적절한지... 제조 운영 위험을 중심으로.'}; value_type=tradeoff;
      alignment_direction=misaligned."
    proposed_action: scrap_rate, capacity_per_shift, 누적 std_time, UOM 변환을 각각
      canonical source, 단위, 유효기간, 동기화 주기, 충돌 시 우선순위, 누락/불일치 시 차단 또는 예외 처리 규칙으로
      닫으십시오. 최소한 품목별 UOM 환산계수 마스터와 capacity 단위 enum 또는 dimension 모델을 추가하고, 복사값과
      수기값은 derived/projection으로 격하해야 합니다.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM·라우팅·운영값의 우선순위와 입력 실패 조건을 닫는 목적.
    failure_condition: 생산계획 엑셀, MES 계산값, 표준원가 수기값, 현장 UOM 환산값이 서로 다르거나 누락된 상태에서
      계획·원가·생산 실행이 진행되는 경우.
    impact: 통합 기준 문서가 운영 위험을 제거하는 기준이 아니라 부서별 로컬 원천과 수기 보정을 합법화하는 문서가 되어, 제조 운영 위험
      검토 목적의 신뢰성이 낮아집니다.
    evidence_refs:
      - .onto/review/20260611-33248d6d/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:35
      - materialized-input.md:67
      - materialized-input.md:99-100
      - review-target-profile.yaml review_goal
      - review-value-alignment-criteria.yaml criterion_id=user-request-intent
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM·라우팅·운영값의 우선순위와 입력 실패 조건을 닫는 목적.
      failure_condition: 생산계획 엑셀, MES 계산값, 표준원가 수기값, 현장 UOM 환산값이 서로 다르거나 누락된 상태에서
        계획·원가·생산 실행이 진행되는 경우.
      impact: 통합 기준 문서가 운영 위험을 제거하는 기준이 아니라 부서별 로컬 원천과 수기 보정을 합법화하는 문서가 되어, 제조 운영 위험
        검토 목적의 신뢰성이 낮아집니다.
      evidence_refs:
        - materialized-input.md:35
        - materialized-input.md:67
        - materialized-input.md:99-100
        - review-target-profile.yaml review_goal
        - review-value-alignment-criteria.yaml criterion_id=user-request-intent
    causal_path:
      root_cause_candidate: 운영 핵심값의 authority, precedence, invalid input behavior를 대상
        파일 안에서 canonical 개념으로 닫지 않은 것.
      root_cause_step_id: finding-002.cause-005
      steps:
        - cause_id: finding-002.cause-001
          claim: BOM scrap_rate는 생산계획팀 엑셀 값을 복사해 둔다고 되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:35
        - cause_id: finding-002.cause-002
          claim: WorkCenter capacity는 단위가 작업장마다 다르지만 공통 단위 체계나 dimension 기준이 없다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:67
        - cause_id: finding-002.cause-003
          claim: 누적 std_time은 MES 계산값과 표준원가 시스템 수기 입력값이 병존하며 분기 대사에 의존한다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:99
        - cause_id: finding-002.cause-004
          claim: UOM 변환은 품목별 환산계수 마스터 없이 현장 환산에 맡겨져 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:100
        - cause_id: finding-002.cause-005
          claim: 리뷰 목표가 precedence와 invalid_input_behavior를 포함하지만, 이 값들의 충돌·누락·단위 불일치 처리
            기준은 target 안에서 닫히지 않는다.
          relation_to_previous: causes
          evidence_refs:
            - review-target-profile.yaml review_goal
            - materialized-input.md:35,67,99-100
      unresolved_beyond_evidence: null
  - finding_id: finding-003
    lens_id: coverage
    source_ref: .onto/review/20260611-33248d6d/round1/coverage.findings.yaml#coverage-candidate-001
    target: manufacturing-bom-ontology.yaml / entities.BomLine.scrap_rate
    evidence_anchor: 'Embedded Materialized Input: BomLine.attributes.scrap_rate
      note: "공정 불량 감안 계수. 생산계획팀 엑셀로 별도 관리되는 값을 복사해 둔다."; no
      effective-from/effective-to/history entity or relation is defined for
      BomLine or scrap_rate.'
    claim: 시점 의존 BOM 계수인 scrap_rate에 유효기간·이력 개념이 누락되어 있습니다.
    lens_rationale_summary: coverage 관점의 핵심 질문은 시점 의존 값에 유효기간·이력 개념이 있어 과거 시점 값을
      재구성할 수 있는지입니다. 현재 모델은 ECO.effective_date로 설계 변경 시점은 표현하지만, scrap_rate 자체의
      효력기간이나 이력은 표현하지 않습니다. PLM/MES 통합 기준 문서에서 이 결손은 같은 BOM 라인이라도 생산일자별 소요량·스크랩
      보정·계획값을 재현할 수 없게 만들어 생산계획 및 실적/원가 대사 신뢰를 약화합니다.
    proposed_action: BomLine의 시점 의존 속성으로 scrap_rate_effectivity 또는
      BomLineEffectivity/ProcessYieldFactor 같은 개념을 추가하고, value, effective_from,
      effective_to, source_ref, changed_by/changed_at를 포함해 과거 시점 값 조회가 가능하게
      하십시오.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM 수량·공정 불량 계수를 생산계획과 실행 시스템이 일관되게 해석하도록 하는 목적.
    failure_condition: scrap_rate가 변경되었거나 엑셀 값이 주기적으로 복사되는 상황에서 특정 생산일자의 BOM 소요량 또는
      불량 보정 계수를 재구성해야 할 때.
    impact: MES/계획/원가 대사에서 동일 품목·BOM 라인에 대해 어느 시점의 계수를 적용했는지 판단할 수 없어 운영 의사결정과 감사
      가능성이 떨어집니다.
    evidence_refs:
      - .onto/review/20260611-33248d6d/round1/coverage.findings.yaml#coverage-candidate-001
      - "Embedded Materialized Input: BomLine.attributes.scrap_rate note"
      - "Embedded Materialized Input: ECO.attributes.effective_date"
      - "Embedded Materialized Input: notes[0] 표준원가 시스템 수기 입력 및 분기 대사"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM 수량·공정 불량 계수를 생산계획과 실행 시스템이 일관되게 해석하도록 하는 목적.
      failure_condition: scrap_rate가 변경되었거나 엑셀 값이 주기적으로 복사되는 상황에서 특정 생산일자의 BOM 소요량 또는
        불량 보정 계수를 재구성해야 할 때.
      impact: MES/계획/원가 대사에서 동일 품목·BOM 라인에 대해 어느 시점의 계수를 적용했는지 판단할 수 없어 운영 의사결정과 감사
        가능성이 떨어집니다.
      evidence_refs:
        - "Embedded Materialized Input: BomLine.attributes.scrap_rate note"
        - "Embedded Materialized Input: ECO.attributes.effective_date"
        - "Embedded Materialized Input: notes[0] 표준원가 시스템 수기 입력 및 분기 대사"
    causal_path:
      root_cause_candidate: 시점 의존 제조 계수를 독립 값 또는 버전된 개념으로 승격하지 않고 BomLine의 단순 number 속성으로만 모델링했습니다.
      root_cause_step_id: finding-003.cause-003
      steps:
        - cause_id: finding-003.cause-001
          claim: scrap_rate는 공정 불량을 감안하는 계수이며 생산계획팀 엑셀에서 별도 관리되는 값을 복사한 값입니다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: BomLine.attributes.scrap_rate note"
        - cause_id: finding-003.cause-002
          claim: BomLine에는 qty_per와 scrap_rate만 있고 해당 값의 effective_from/effective_to,
