    claim: BOM 비순환 필수 규칙과 자기 하위 포함 모델링 예외가 동일 규칙 안에서 양립 불가능합니다.
    what: 첫 번째 무결성 규칙은 `BOM은 비순환이어야 한다`고 선언하면서, 같은 문장에서 재생 원료 회수 공정은 `Assembly가 자기
      하위에 자신을 포함하는 형태`로 모델링한다고 선언합니다. 자기 자신을 하위로 포함하는 것은 길이 1의 순환이므로, 비순환 필수조건과
      동시에 만족될 수 없습니다.
    why: 도메인 문서가 없는 상태에서도 형식 구조만으로 판정 가능한 intra-claim 모순입니다. `비순환이어야 한다`는
      necessary/obligatory 제약이고, `자기 하위에 자신을 포함`은 동일 대상에 순환을 허용/요구하는
      possible/obligatory 예외입니다. 이 상태에서는 검증기가 BOM acyclic 조건을 적용하면 허용 사례를 거부하고,
      예외를 허용하면 선언된 acyclic 조건을 위반하게 되어 PLM/MES 통합 기준의 무결성 규칙으로 사용할 수 없습니다.
    how_to_fix: "재생 원료 회수 공정을 BOM 계층 순환으로 표현하지 말고 별도 relation/entity(예:
      `RecoveredMaterialInput`, `ProcessYieldReturn`)로 분리하거나, 규칙을 `일반 BOM 구성 관계는
      비순환이며, 스크랩 재투입은 BOM parent-child 관계가 아닌 공정 투입/산출 관계로 모델링한다`처럼 수정하십시오."
    upstream_evidence_required: false
