findings:
  - candidate_id: coverage-candidate-001
    target: manufacturing-bom-ontology.yaml / entities.BomLine.scrap_rate
    evidence_anchor: 'Embedded Materialized Input: BomLine.attributes.scrap_rate
      note: "공정 불량 감안 계수. 생산계획팀 엑셀로 별도 관리되는 값을 복사해 둔다."; no
      effective-from/effective-to/history entity or relation is defined for
      BomLine or scrap_rate.'
    claim: 시점 의존 BOM 계수인 scrap_rate에 유효기간·이력 개념이 누락되어 있습니다.
    what: BOM 수량 산정에 영향을 주는 scrap_rate가 별도 엑셀 원본에서 복사되는 값으로 정의되어 있지만, 값의 적용 시작/종료
      시점, 변경 이력, 과거 생산분 재구성에 필요한 버전 개념이 없습니다.
    why: coverage 관점의 핵심 질문은 시점 의존 값에 유효기간·이력 개념이 있어 과거 시점 값을 재구성할 수 있는지입니다. 현재 모델은
      ECO.effective_date로 설계 변경 시점은 표현하지만, scrap_rate 자체의 효력기간이나 이력은 표현하지 않습니다.
      PLM/MES 통합 기준 문서에서 이 결손은 같은 BOM 라인이라도 생산일자별 소요량·스크랩 보정·계획값을 재현할 수 없게 만들어
      생산계획 및 실적/원가 대사 신뢰를 약화합니다.
    how_to_fix: BomLine의 시점 의존 속성으로 scrap_rate_effectivity 또는
      BomLineEffectivity/ProcessYieldFactor 같은 개념을 추가하고, value, effective_from,
      effective_to, source_ref, changed_by/changed_at를 포함해 과거 시점 값 조회가 가능하게
      하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM 수량·공정 불량 계수를 생산계획과 실행 시스템이 일관되게 해석하도록 하는 목적.
      failure_condition: scrap_rate가 변경되었거나 엑셀 값이 주기적으로 복사되는 상황에서 특정 생산일자의 BOM 소요량 또는
        불량 보정 계수를 재구성해야 할 때.
      impact: MES/계획/원가 대사에서 동일 품목·BOM 라인에 대해 어느 시점의 계수를 적용했는지 판단할 수 없어 운영 의사결정과 감사
        가능성이 떨어집니다.
      evidence_refs:
        - "Embedded Materialized Input: BomLine.attributes.scrap_rate note"
        - "Embedded Materialized Input: ECO.attributes.effective_date"
        - "Embedded Materialized Input: notes[0] 표준원가 시스템 수기 입력 및 분기 대사"
    causal_path:
      root_cause_candidate: 시점 의존 제조 계수를 독립 값 또는 버전된 개념으로 승격하지 않고 BomLine의 단순 number 속성으로만 모델링했습니다.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: scrap_rate는 공정 불량을 감안하는 계수이며 생산계획팀 엑셀에서 별도 관리되는 값을 복사한 값입니다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: BomLine.attributes.scrap_rate note"
        - cause_id: coverage-candidate-001.cause-002
          claim: BomLine에는 qty_per와 scrap_rate만 있고 해당 값의 effective_from/effective_to,
            version, history, approval/audit 속성이 없습니다.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: BomLine.attributes"
        - cause_id: coverage-candidate-001.cause-003
          claim: 온톨로지에서 시점 개념은 ECO.effective_date에 한정되어 있으며 scrap_rate 변경 이력을 BOM 라인에 연결하는
            엔티티나 관계가 없습니다.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: ECO.attributes.effective_date"
            - "Embedded Materialized Input: relations"
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-002
    target: manufacturing-bom-ontology.yaml / entities.Routing.status and ECO.status
    evidence_anchor: "Embedded Materialized Input: Routing.status values [draft,
      released]; ECO.status values [open, approved, applied]; no
      obsolete/archived/superseded/cancelled state or post-release
      correction/reissue event is defined."
    claim: 라우팅과 ECO의 lifecycle이 종료·폐기·정정 구간을 커버하지 않습니다.
    what: Routing은 draft와 released만, ECO는 open/approved/applied만 표현합니다. 라우팅 폐기, 단종,
      보관, ECO 취소/철회, 적용 후 정정·재발행 같은 제조 운영에서 필요한 종결 이후 상태나 사건 개념이 없습니다.
    why: 상태를 갖는 요소의 lifecycle이 도입부터 종료까지 전 구간을 커버하는지는 coverage lens의 명시 질문입니다. 현재 상태
      열거는 릴리즈/적용을 끝점처럼 취급하므로, 단종 품목의 라우팅 차단, 잘못 적용된 ECO의 정정, 과거 기준 보존을 개념적으로
      표현하기 어렵습니다. PLM/MES 통합 기준에서는 릴리즈된 라우팅만 생산 오더를 생성할 수 있다는 규칙까지 있으므로 종료 상태
      부재가 생산 가능 여부 판단에 직접 영향을 줍니다.
    how_to_fix: Routing에 obsolete/archived/superseded 같은 종료 상태와
      superseded_by/effective_to를 추가하고, ECO에 cancelled/revised/superseded 또는
      ECORevision/CorrectionEvent를 추가해 적용 후 정정과 재발행을 상태 의미와 충돌 없이 표현하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 라우팅 릴리즈 상태와 ECO 적용 상태를 기준으로 생산 오더 생성 및 변경 적용 여부를 판단하는 목적.
      failure_condition: 릴리즈된 라우팅이 폐기·대체되었거나 적용된 ECO가 취소/정정/재발행되어야 하는 운영 상황.
      impact: 종결 상태가 없어 오래된 라우팅이 계속 생산 가능 상태로 남거나, 적용 후 변경 사건을 기존 상태 의미를 깨지 않고 기록할 방법이
        부족해 제조 실행 통제가 약화됩니다.
      evidence_refs:
        - "Embedded Materialized Input: Routing.attributes.status"
        - "Embedded Materialized Input: ECO.attributes.status"
        - "Embedded Materialized Input: integrity_rules[1]"
    causal_path:
      root_cause_candidate: 상태 보유 개념을 릴리즈/적용까지의 진행 상태로만 모델링하고 lifecycle 종료 및 사후 정정 사건을
        별도 개념으로 포함하지 않았습니다.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: Routing.status는 draft와 released 두 값만 제공합니다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Routing.attributes.status"
        - cause_id: coverage-candidate-002.cause-002
          claim: ECO.status는 open, approved, applied만 제공합니다.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: ECO.attributes.status"
        - cause_id: coverage-candidate-002.cause-003
          claim: 생산 오더 생성 가능 여부는 released 상태에 의존하지만, released 이후 라우팅 폐기·대체 상태가 없습니다.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: integrity_rules[1]"
            - "Embedded Materialized Input: Routing.attributes.status"
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: manufacturing-bom-ontology.yaml / ECO, Routing, copied external values
    evidence_anchor: "Embedded Materialized Input: ECO.status values [open,
      approved, applied]; Routing.status values [draft, released]; Part.rev note
      says drawing register is source; BomLine.scrap_rate note says copied from
      planning Excel; InspectionPlan.acceptance_criteria note says quality SOP
      is source. No approval/audit evidence entity with actor/time/basis is
      defined."
    claim: 승인·적용·외부값 복사 같은 통제 행위의 감사 증거 개념이 누락되어 있습니다.
    what: ECO 승인/적용, Routing release, 외부 원본에서 복사되는 scrap_rate와 acceptance_criteria
      같은 통제 행위가 모델에 등장하지만, 누가 언제 어떤 근거로 승인·릴리즈·복사·수정했는지 추적하는 Approval,
      ReleaseEvent, SourceSyncEvent, AuditEvidence 등의 개념이 없습니다.
    why: coverage lens는 통제가 필요한 행위에 행위자·시각·근거를 추적할 증거 개념이 있는지 확인합니다. 현재 온톨로지는 상태와 원본
      메모를 제공하지만 통제 행위 자체의 증거 차원을 제공하지 않습니다. PLM/MES 통합에서는 설계 변경과 라우팅 릴리즈가 생산 실행
      권한을 바꾸므로, 감사 증거가 없으면 변경관리 기준 문서로서 승인 책임과 적용 근거를 재구성하기 어렵습니다.
    how_to_fix: ApprovalEvent/ReleaseEvent/SourceSyncEvent 또는 공통 AuditEvidence 개념을
      추가하고 actor, timestamp, action, basis_document/source_system, target_ref,
      previous_value/new_value를 포함해 ECO 승인·적용, Routing release, 외부값 동기화에 연결하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품목·BOM·라우팅·변경관리의 통제 기준을 PLM/MES 사이에서 감사 가능하게 공유하는 목적.
      failure_condition: ECO 승인/적용, 라우팅 릴리즈, 외부 원본 값 복사 결과에 대해 책임자·시각·근거 문서를 확인해야 하는
        변경관리 또는 제조 감사 상황.
      impact: 상태값은 남아도 상태를 만든 통제 행위의 증거가 없어 변경 책임, 적용 근거, 수동 복사값의 신뢰성을 검증하기 어렵습니다.
      evidence_refs:
        - "Embedded Materialized Input: ECO.attributes.status"
        - "Embedded Materialized Input: Routing.attributes.status"
        - "Embedded Materialized Input: BomLine.attributes.scrap_rate note"
        - "Embedded Materialized Input:
          InspectionPlan.attributes.acceptance_criteria note"
    causal_path:
      root_cause_candidate: 통제 행위를 상태 전이 또는 속성 메모로만 표현하고 행위 증거를 별도 엔티티로 모델링하지 않았습니다.
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: ECO와 Routing은 승인/적용/released 등 통제 결과 상태를 갖습니다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: ECO.attributes.status"
            - "Embedded Materialized Input: Routing.attributes.status"
        - cause_id: coverage-candidate-003.cause-002
          claim: scrap_rate와 acceptance_criteria는 외부 원본에서 복사 또는 참조되는 값으로 설명됩니다.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: BomLine.attributes.scrap_rate note"
            - "Embedded Materialized Input:
              InspectionPlan.attributes.acceptance_criteria note"
        - cause_id: coverage-candidate-003.cause-003
          claim: 엔티티와 관계 목록에는 actor, timestamp, basis를 담는 승인/릴리즈/동기화 감사 증거 개념이 없습니다.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: entities list"
            - "Embedded Materialized Input: relations list"
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: manufacturing-bom-ontology.yaml / entities.WorkCenter.capacity_per_shift
      and notes.uom conversion
    evidence_anchor: 'Embedded Materialized Input: WorkCenter.capacity_per_shift
      note: "단위는 작업장마다 다르다(개수 또는 시간)."; notes: "uom 변환(kg↔ea 등)은 품목별 환산계수 마스터가
      없고, 필요 시 현장에서 환산한다."'
    claim: 공정 능력과 UOM 환산을 표준화할 단위/환산 마스터 개념이 누락되어 있습니다.
    what: 품목 UOM은 enum으로 있으나 품목별 kg↔ea 환산계수 마스터가 없다고 명시되어 있고, 작업장
      capacity_per_shift의 단위도 작업장마다 달라질 수 있다고 되어 있습니다. CapacityUnit,
      UomConversionFactor, PartUomConversion 같은 하위 개념이 없습니다.
    why: 도메인 포괄성 관점에서 PLM/MES 통합의 BOM·라우팅 기준 문서는 수량, 시간, 능력 단위가 시스템 간에 일관되게 해석될 수 있는
      개념 범주를 포함해야 합니다. 현재 모델은 단위 차이를 현장 환산과 메모에 맡기므로 BOM 소요량, 작업장 능력, 생산계획 계산이
      같은 기준으로 닫히지 않습니다.
    how_to_fix: "UomConversionFactor 또는 PartUomConversion 엔티티를 추가해 from_uom, to_uom,
      factor, effective period, source authority를 모델링하고,
      WorkCenter.capacity_per_shift에는 capacity_unit 또는 capacity_basis(enum:
      pieces/time 등)와 표준 시간 단위를 명시하십시오."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM 수량과 라우팅/작업장 능력을 PLM/MES가 같은 단위 기준으로 계산하도록 하는 통합 기준 목적.
      failure_condition: kg 단위 원재료를 ea 단위 완제품 BOM에 투입하거나, 작업장별 capacity_per_shift를
        생산계획 계산에 함께 사용하는 상황.
      impact: 단위 환산 기준이 개념적으로 비어 있어 시스템마다 임의 환산하거나 현장 계산에 의존하게 되고, 계획 수량·능력 산정 결과가
        일관되지 않을 수 있습니다.
      evidence_refs:
        - "Embedded Materialized Input: Part.attributes.uom"
        - "Embedded Materialized Input: WorkCenter.attributes.capacity_per_shift
          note"
        - "Embedded Materialized Input: notes[1]"
    causal_path:
      root_cause_candidate: 단위를 속성 enum 또는 설명 메모로만 두고, 품목별 환산과 능력 단위 기준을 독립 관리 개념으로 포함하지 않았습니다.
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: Part.uom은 ea, kg, m enum만 제공합니다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Part.attributes.uom"
        - cause_id: coverage-candidate-004.cause-002
          claim: 품목별 환산계수 마스터가 없고 필요 시 현장에서 환산한다고 명시되어 있습니다.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: notes[1]"
        - cause_id: coverage-candidate-004.cause-003
          claim: WorkCenter.capacity_per_shift의 단위는 작업장마다 개수 또는 시간으로 달라질 수 있지만, 이를 구조적으로
            식별하는 속성이나 엔티티가 없습니다.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input:
              WorkCenter.attributes.capacity_per_shift note"
            - "Embedded Materialized Input: WorkCenter.attributes"
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - session_domain이 none이므로 별도 도메인 문서나 외부 표준을 사용하지 않고, prompt packet의 review
    summary와 materialized input에 포함된 PLM/MES 통합 목적 및 coverage lens 질문만 기준으로
    판단했습니다.
  - 제조 BOM/라우팅 통합에서 scrap_rate, capacity, UOM 환산, release/approval 상태는 운영 계산과
    통제에 직접 사용되는 개념이라고 보았습니다.
validation:
  unaddressable_candidates: []
