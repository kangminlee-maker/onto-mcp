    claim: 운영 핵심값을 복사·수기 입력·현장 환산으로 남겨 둔 설계는 PLM/MES 통합 기준 문서의 목적을 국소 업무 편의 쪽으로
      드리프트시킵니다.
    what: scrap_rate는 생산계획팀 엑셀 값을 복사해 두고, WorkCenter.capacity_per_shift는 작업장마다 단위가
      다르며, 누적 std_time은 MES가 계산하지만 표준원가 시스템에도 수기 입력 필드가 있어 분기마다 대사합니다. 또한 kg↔ea
      등 UOM 변환은 품목별 환산계수 마스터 없이 현장에서 환산한다고 되어 있습니다.
    why: "이 리뷰의 목적은 BOM/공정 온톨로지를 PLM/MES 통합의 개념 기준 문서로 검토하는 것이며, target profile의
      review_goal에는 precedence와 invalid_input_behavior가 포함됩니다. 그런데 파일은 계획, 원가,
      용량, 단위 변환의 실제 운영값을 권위 있는 통합 개념으로 닫지 않고 외부 엑셀, 수기 필드, 현장 판단에 맡깁니다. 이는 여러
      부서의 기존 로컬 운영을 보존하는 대신 통합 기준 문서가 제공해야 할 우선순위와 입력 실패 기준을 약화하는 가치상 트레이드오프입니다.
