      목적과 어긋납니다.
    what: 온톨로지는 Part.rev의 원본을 도면 관리대장으로, current_eco의 원본을 ECO 시스템으로 둡니다. 동시에
      ECO.effective_date 이후 생산분은 신규 rev를 따라야 한다고 하면서 Part.rev 갱신은 도면 관리대장 반영 후
      주간 배치로 동기화한다고 둡니다. 이 조합은 생산 오더 생성 가능 여부가 Routing.status에만 닫혀 있는 상태에서, 적용일
      이후에도 MES가 구 rev 값을 볼 수 있는 운영 공백을 목적상 허용합니다.
    why: "리뷰의 확인된 목적은 이 파일이 'PLM/MES 통합의 개념 기준 문서'로 적절한지, 특히 변경관리 정합성과 제조 운영 위험을
      중심으로 보는 것입니다. 해당 목적 기준에서 ECO 적용일은 생산 실행의 기준점이어야 하는데, 파일은 그 기준점과 Part.rev
      가시성 사이의 주간 지연을 통합 계약으로 닫지 않습니다. 이는 단순 구조 결함을 넘어, 변경관리의 정확성을 우선해야 하는
      PLM/MES 통합 목적보다 기존 도면대장 배치 동기화 편의를 우선하는 숨은 트레이드오프입니다. Value authority
