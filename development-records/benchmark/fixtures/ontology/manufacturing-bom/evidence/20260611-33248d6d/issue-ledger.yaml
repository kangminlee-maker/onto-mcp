  - issue_id: issue-007
    root_cause_hypothesis: Unit identity and unit conversion are not modeled as
      extensible authority concepts.
    root_confidence: medium
    surface_finding_ids:
      - finding-008
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: Fixed UOM enum plus manual kg-ea conversion cannot absorb new
      unit categories or deterministic PLM/MES quantity integration.
    proposed_action: Replace the closed enum with a `UnitOfMeasure` reference and
      add an item/site/effectivity-aware `UomConversion` master where conversion
      is valid. Keep allowed unit families and dimensional compatibility as
      validation data rather than hard-coded enum values.
    affected_purpose: Use the ontology as a PLM/MES integration concept standard for
      BOM quantities and manufacturing operations.
    failure_condition: When parts require units outside `ea/kg/m` or require
      item-specific conversion between purchase, BOM, inventory, and execution
      units, the model cannot represent the conversion canonically.
    impact: Quantity, scrap, cost, and consumption calculations become system- or
      operator-specific, reducing trust in integrated BOM/MES behavior.
    evidence_refs:
      - .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution-candidate-002
      - manufacturing-bom-ontology.yaml:14
      - manufacturing-bom-ontology.yaml:95
      - manufacturing-bom-ontology.yaml:14,95
    severity: medium
    domain_threshold_used: null
    singleton_reason: "Runtime completion: finding is not connected to another issue
      by same_root_candidate relation refs."
  - issue_id: issue-008
    root_cause_hypothesis: Process recovery semantics are encoded as a special-case
      cycle inside the BOM product-structure invariant.
    root_confidence: medium
    surface_finding_ids:
      - finding-009
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: Modeling scrap reinput as a self-child Assembly exception makes
      future recycle/rework flows collide with the core acyclic BOM rule.
    proposed_action: Keep engineering/product BOM acyclic and model scrap reinput
      through a separate process/yield/recovery relation, such as
      `MaterialRecovery`, `ByproductOutput`, or routing operation input/output
      links. Let BOM cycle validation remain strict and handle recycling in
      routing/process semantics.
    affected_purpose: Use the ontology as a stable BOM/routing baseline for
      manufacturing operations and integration.
    failure_condition: When recovery, rework, or byproduct flows expand beyond the
      single named exception, consumers must either weaken acyclic BOM
      validation or add hidden traversal exceptions.
    impact: BOM explosion and integration logic become brittle because product
      structure and manufacturing flow semantics are mixed in one graph
      relation.
    evidence_refs:
      - .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution-candidate-003
      - manufacturing-bom-ontology.yaml:88-89
    severity: medium
    domain_threshold_used: null
    singleton_reason: "Runtime completion: finding is not connected to another issue
      by same_root_candidate relation refs."
  - issue_id: issue-009
    root_cause_hypothesis: Capacity measurement unit and basis are omitted from the
      WorkCenter capacity concept.
    root_confidence: medium
    surface_finding_ids:
      - finding-010
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: WorkCenter capacity is a bare number with variable local units,
      so new capacity types cannot be integrated without changing or bypassing
      the model.
    proposed_action: Split capacity into explicit quantity, unit, basis, and
      calendar/shift scope. For example, add `capacity_value`, `capacity_uom`,
      `capacity_basis`, and optional capability constraints, reusing a canonical
      UOM concept.
    affected_purpose: Use the ontology as a routing/MES integration baseline for
      operations and work-center planning.
    failure_condition: When additional work-center types or capacity bases are
      added, the model cannot express comparable capacity semantics inside the
      ontology.
    impact: Scheduling, order release, and capacity reconciliation become dependent
      on external assumptions, weakening the integration contract.
    evidence_refs:
      - .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution-candidate-004
      - manufacturing-bom-ontology.yaml:58-62
    severity: medium
    domain_threshold_used: null
    singleton_reason: "Runtime completion: finding is not connected to another issue
      by same_root_candidate relation refs."
