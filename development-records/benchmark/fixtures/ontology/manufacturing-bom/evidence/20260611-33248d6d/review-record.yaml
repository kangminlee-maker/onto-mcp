        semantics Source finding context: manufacturing-bom-ontology.yaml:14,95
        Source finding context: Fixed UOM enum plus manual kg-ea conversion
        cannot absorb new unit categories or deterministic PLM/MES quantity
        integration. Source finding context: BOM, planning, procurement, and MES
        consumption all depend on stable quantity semantics. If a new material
        form, packaging unit, area/volume unit, or item-specific conversion is
        introduced, the enum must be changed and downstream consumers still lack
        a canonical conversion authority. This is a change-resilience issue
        because future unit expansion and cross-system quantity reconciliation
        cannot be handled as data extension. Source finding context: Replace the
        closed enum with a `UnitOfMeasure` reference and add an
        item/site/effectivity-aware `UomConversion` master where conversion is
        valid. Keep allowed unit families and dimensional compatibility as
        validation data rather than hard-coded enum values. Source finding
        context:
        .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution\
        -candidate-002 Source finding context: Use the ontology as a PLM/MES
        integration concept standard for BOM quantities and manufacturing
        operations. Source finding context: When parts require units outside
        `ea/kg/m` or require item-specific conversion between purchase, BOM,
        inventory, and execution units, the model cannot represent the
        conversion canonically. Source finding context: Quantity, scrap, cost,
        and consumption calculations become system- or operator-specific,
        reducing trust in integrated BOM/MES behavior. Source finding context:
        Unit identity and unit conversion are not modeled as extensible
        authority concepts. Source finding context: The `uom` attribute is a
        closed enum with only three values. Source finding context: The ontology
        explicitly says item-specific conversion factors are absent and
        conversions are performed in the field as needed. Source finding
        context: Future unit categories or conversion rules therefore require
        schema change and external/manual interpretation instead of data
        extension."
