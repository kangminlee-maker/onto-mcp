        context: manufacturing-bom-ontology.yaml / WorkCenter capacity Source
        finding context: manufacturing-bom-ontology.yaml:58-62 Source finding
        context: WorkCenter capacity is a bare number with variable local units,
        so new capacity types cannot be integrated without changing or bypassing
        the model. Source finding context: MES scheduling and routing
        integration need to compare operation times, work-center capacity, and
        shift availability. If some centers are constrained by pieces, minutes,
        labor hours, machine hours, batch volume, or area, a single number
        without a unit or capacity basis cannot be extended safely. New
        work-center categories will force consumers to infer units from names or
        external configuration. Source finding context: Split capacity into
        explicit quantity, unit, basis, and calendar/shift scope. For example,
        add `capacity_value`, `capacity_uom`, `capacity_basis`, and optional
        capability constraints, reusing a canonical UOM concept. Source finding
        context:
