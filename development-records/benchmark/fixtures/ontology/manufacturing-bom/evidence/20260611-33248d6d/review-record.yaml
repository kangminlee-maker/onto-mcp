        말한다. Source finding context: manufacturing-bom-ontology.yaml / ECO, Part
        revision, BOM/Routing effectivity model Source finding context:
        manufacturing-bom-ontology.yaml:15-16,64-70,91 Source finding context:
        ECO effectivity is date-only and current-state oriented, so future
        revision/effectivity changes cannot preserve PLM/MES continuity. Source
        finding context: A PLM/MES integration baseline must support overlapping
        design changes, delayed synchronization, in-flight production orders,
        and historical/as-built traceability. With only a current part revision
        and a single effective date, adding common change scenarios such as
        phased cut-in, serial/lot effectivity, plant-specific application, or
        routing-only ECOs would require changing the existing core model rather
        than extending it. During the weekly sync gap, MES could need to decide
        production revision using an ECO state that is not tied to versioned
        BOM/routing structures. Source finding context: Introduce
        versioned/effective structures: `PartRevision`, `BomRevision` or
        effective `BomLine`, and `RoutingRevision` with validity by
        date/lot/serial/site as needed. Link ECOs to explicit changed artifacts
        and transition rules, and make current revision a derived projection
        rather than the only modeled state. Source finding context:
        .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution\
        -candidate-001 Source finding context: Use the ontology as the concept
        baseline for PLM/MES integration around item, BOM, routing, and change
        management. Source finding context: When an ECO changes a revision, BOM
        line, or routing with nontrivial effectivity or while drawing-ledger
        synchronization lags, the model cannot preserve both old and new
        manufacturing states inside the target concepts. Source finding context:
        The integration contract becomes unsafe for production-order release,
        historical traceability, and change cut-in because consumers must invent
        external rules or overwrite current attributes. Source finding context:
        Revision and effectivity are modeled as current attributes and a
        date-only ECO property rather than as versioned/effective artifact
        concepts. Source finding context: `Part.rev` and `current_eco` are
        current fields whose authorities are external systems. Source finding
        context: ECO only lists affected parts and an effective date, with no
        changed artifact version or effectivity scope. Source finding context:
        The integrity rule makes post-effective-date production follow the new
        rev, while Part.rev updates later through weekly synchronization. Source
        finding context: Therefore future change scenarios require modifying the
        core model or relying on out-of-model resolution, weakening PLM/MES
        continuity."
