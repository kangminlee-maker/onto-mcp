issue_resolution_summary:
  - issue_id: issue-001
    problem_definition: 변경 적용 기준이 current Part.rev와 date-only ECO에 묶여 생산 적용 리비전과
      BOM/Routing effectivity authority가 닫히지 않는다.
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 여러 렌즈와 deliberation이 broad revision/effectivity authority failure로
      수렴했다. PLM/MES 통합 기준의 변경관리·생산 리비전 판단을 직접 흔드는 중심 원인이므로 target 안에서 닫아야 한다.
    related_surface_finding_ids:
      - finding-001
      - finding-014
      - finding-007
  - issue_id: issue-002
    problem_definition: scrap_rate, capacity, std_time, UOM 변환 같은 운영 핵심값의 canonical
      authority, precedence, invalid-input behavior가 모델 안에서 정의되지 않았다.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: governance_value
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 운영값 권위와 실패 처리 기준 부재는 여러 세부 이슈의 공통 원인으로 보존되어 있다. 통합 기준 문서의 우선순위와 입력 실패
      조건을 닫는 목적에 직접 영향을 준다.
    related_surface_finding_ids:
      - finding-002
  - issue_id: issue-003
    problem_definition: BomLine.scrap_rate가 versioned/effective 제조 계수가 아니라 단순 속성이라
      생산일자별 소요량과 불량 보정 재구성이 불안정하다.
    issue_role: symptom
    judgment_state: observed
    impact_kind: completeness
    timing_class: next_step_blocker
    closure_class: carry_forward
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: issue-002의 운영값 authority 문제와 연결된 구체적 temporal coverage 결손이다. 독립적으로
      감사·대사 가능성을 약화하므로 다음 단계 전에는 effectivity/history 기준을 닫아야 한다.
    related_surface_finding_ids:
      - finding-003
  - issue_id: issue-004
    problem_definition: Routing.status와 ECO.status가 release/applied 이후의 폐기, 대체, 취소,
      정정 lifecycle을 표현하지 못한다.
    issue_role: symptom
    judgment_state: observed
    impact_kind: completeness
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: lifecycle/effectivity를 current status/date 필드로 축소한 원인의 구체 표현이다. 생산 가능
      여부와 변경 적용 판단을 stale status에 묶으므로 target 모델의 lifecycle vocabulary 안에서 바로
      닫아야 한다.
    related_surface_finding_ids:
      - finding-004
  - issue_id: issue-005
    problem_definition: ECO 승인/적용, Routing release, 외부값 복사 같은 통제 행위가 actor,
      timestamp, basis를 가진 audit evidence/event로 모델링되지 않았다.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: governance_value
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 상태 결과와 통제 행위 증거를 분리하지 않은 구조적 결손이다. 변경 책임과 적용 근거를 재구성하는 통합 기준 목적에 직접
      필요하므로 target에서 audit evidence 개념을 닫아야 한다.
    related_surface_finding_ids:
      - finding-005
  - issue_id: issue-006
    problem_definition: 단위와 환산 기준이 enum 또는 메모에 머물러 품목별 UOM 변환과 capacity unit/basis authority가 없다.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: UOM/capacity 관련 세부 이슈의 공통 원인으로 제시되며 BOM 수량과 작업장 능력 계산의 일관성을 직접 좌우한다.
      PLM/MES 통합 기준 안에서 canonical 단위 authority가 필요하다.
    related_surface_finding_ids:
      - finding-006
  - issue_id: issue-007
    problem_definition: 고정 UOM enum과 수동 kg-ea 환산이 새 단위 범주와 결정적 수량 통합을 흡수하지 못한다.
    issue_role: symptom
    judgment_state: observed
    impact_kind: maintainability_evolvability
    timing_class: planned_follow_up
    closure_class: carry_forward
    closure_obligation: may_close_during_next_stage
    domain_axes: {}
    rationale: issue-006과 같은 unit authority 결손의 확장성 표현이다. 현재 기준의 신뢰도에는 의미 있는 영향이
      있으나, 핵심 remediation은 UOM authority 정비와 함께 다음 단계에서 묶어 처리할 수 있다.
    related_surface_finding_ids:
      - finding-008
  - issue_id: issue-008
    problem_definition: scrap reinput을 BOM self-child 예외로 표현해 process recovery 의미가
      acyclic BOM product-structure invariant와 충돌한다.
    issue_role: conflicting_interpretation
    judgment_state: observed
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: deliberation은 미래 확장성 부채뿐 아니라 현재 validation-authority conflict로 확정했다.
      BOM 구조와 공정 회수 의미를 같은 관계에 담는 해석 충돌이므로 target 규칙에서 바로 분리되어야 한다.
