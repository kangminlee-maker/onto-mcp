        operations and work-center planning.
      failure_condition: When additional work-center types or capacity bases are
        added, the model cannot express comparable capacity semantics inside the
        ontology.
      impact: Scheduling, order release, and capacity reconciliation become dependent
        on external assumptions, weakening the integration contract.
      evidence_refs:
