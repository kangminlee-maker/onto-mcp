        When an ECO changes a revision, BOM line, or routing with nontrivial
        effectivity or while drawing-ledger synchronization lags, the model
        cannot preserve both old and new manufacturing states inside the target
        concepts."
      impact: "생산오더가 변경 적용 시점의 리비전 대신 지연 동기화된 current 속성에 의존할 수 있어 변경관리,
        production-order release, historical traceability 기준의 신뢰가 약해진다. Source
        finding context: 적용일 이후 생산분이 신규 rev를 따라야 한다는 운영 약속이 MES 실행 기준에서 닫히지 않아,
        통합 기준 문서가 변경관리 위험을 줄이기보다 정상화합니다. Source finding context: 생산오더가 변경 적용 시점의
        리비전 대신 지연 동기화된 도면 리비전을 참조할 수 있어 변경관리와 제조 실행의 기준 문서로서 위험하다. Source
        finding context: The integration contract becomes unsafe for
        production-order release, historical traceability, and change cut-in
        because consumers must invent external rules or overwrite current
        attributes."
