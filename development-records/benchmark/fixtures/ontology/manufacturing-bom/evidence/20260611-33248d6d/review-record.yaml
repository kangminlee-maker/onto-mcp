      rationale: "deliberation은 미래 확장성 부채뿐 아니라 현재 validation-authority conflict로 확정했다.
        BOM 구조와 공정 회수 의미를 같은 관계에 담는 해석 충돌이므로 target 규칙에서 바로 분리되어야 한다. Source
        finding context: manufacturing-bom-ontology.yaml / BOM acyclicity
        exception for scrap reinput Source finding context:
        manufacturing-bom-ontology.yaml:88-89 Source finding context: Modeling
        scrap reinput as a self-child Assembly exception makes future
        recycle/rework flows collide with the core acyclic BOM rule. Source
        finding context: The base rule and its exception force one process-flow
        concept into the product-structure graph. As soon as additional recycle,
        rework, byproduct, co-product, or yield-return cases appear, graph
        traversal, explosion, costing, and cycle validation need special cases
        around self-cycles. That means extension pressure lands on the existing
        BOM invariant rather than on a separate process/yield model. Source
        finding context: Keep engineering/product BOM acyclic and model scrap
        reinput through a separate process/yield/recovery relation, such as
        `MaterialRecovery`, `ByproductOutput`, or routing operation input/output
        links. Let BOM cycle validation remain strict and handle recycling in
        routing/process semantics. Source finding context:
        .onto/review/20260611-33248d6d/round1/evolution.findings.yaml#evolution\
        -candidate-003 Source finding context: Use the ontology as a stable
        BOM/routing baseline for manufacturing operations and integration.
        Source finding context: When recovery, rework, or byproduct flows expand
        beyond the single named exception, consumers must either weaken acyclic
        BOM validation or add hidden traversal exceptions. Source finding
        context: BOM explosion and integration logic become brittle because
        product structure and manufacturing flow semantics are mixed in one
        graph relation. Source finding context: Process recovery semantics are
        encoded as a special-case cycle inside the BOM product-structure
        invariant. Source finding context: The ontology declares BOMs acyclic as
        an integrity rule. Source finding context: The same rule models scrap
        reinput by allowing an Assembly to include itself as a child. Source
        finding context: Future recovery/rework extensions therefore require
        exceptions to the core BOM graph rule instead of adding process-flow
        data."
