    lens_rationale_summary: BOM의 parent-child 관계는 상위 품목을 만들기 위해 필요한 하위 품목 구성 의미를
      가진다. 스크랩 회수와 재투입은 제조 공정의 산출물 회수 및 투입 흐름에 가깝고, 완제품/조립품이 자기 자신의 구성품이라는 의미와
      다르다. 이 예외는 BOM 구성 의미를 공정 순환 의미로 재사용한다.
    proposed_action: BOM은 구성 관계로 유지하고, 스크랩 재투입은 별도 `Byproduct`, `RecoveredMaterial`,
      `Rework/RecyclingOperation`, 또는 라우팅의 투입/산출 관계로 표현한다. 순환 허용이 필요하면 BOM 자기참조가
      아니라 공정 흐름 모델에서 명시한다.
