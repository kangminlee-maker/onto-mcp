    claim: AlternatePart의 정의가 대체 관계를 항상 양방향으로 설명하지만 속성은 단방향을 기본값으로 둔다.
    lens_rationale_summary: 대체 가능 부품은 한쪽 대체만 허용되는 경우와 상호 대체가 가능한 경우의 의미가 다르다. 현재 정의는
      모든 인스턴스가 양방향 대체라고 읽히는데, 속성은 단방향 인스턴스를 기본으로 허용하므로 개념 이름·정의·속성 의미가 같은 대상을
      가리키지 않는다. PLM/MES 통합 기준 문서에서 이 의미가 불명확하면 구매/생산 대체 허용 범위를 반대로 해석할 수 있다.
