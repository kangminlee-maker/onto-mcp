  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260610-36ef1faa/round1/coverage.findings.yaml#coverage-candidate-001
    target: manufacturing-bom-ontology.yaml / ECO and Part lifecycle coverage
    evidence_anchor: "Embedded Materialized Input: Part.attributes.rev/current_eco;
      ECO.attributes.effective_date/status; integrity_rules: ECO.effective_date
      이후 production follows new rev, but Part.rev updated after drawing ledger
      weekly batch"
    claim: ECO 적용과 품목 revision의 과거 시점 재구성에 필요한 revision/effectivity 이력 개념이 누락되어 있습니다.
    lens_rationale_summary: PLM/MES 통합 기준 문서에서는 ECO 적용일 이후 신규 rev를 따른다고 선언하지만,
      Part.rev는 도면 관리대장 주간 배치로 늦게 동기화됩니다. 현재 모델만으로는 지연 동기화 기간이나 과거 생산분에 대해 당시
      유효한 품목 revision을 안정적으로 재구성할 수 없습니다. 이는 품목·BOM·라우팅·변경관리 정합성 검토 목적을 직접
      약화시킵니다.
    proposed_action: Part의 현재 rev와 별도로 PartRevision 또는 RevisionEffectivity 개념을 추가하고,
      part_ref, rev, effective_from/effective_to, source_eco, applied_at,
      superseded_by를 모델링하십시오. ECO 적용은 현재 값 갱신이 아니라 revision/effectivity 레코드 생성으로
      표현되게 하십시오.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목 revision과 ECO 적용 기준을 일관되게 제공하는 목적
    failure_condition: ECO effective_date와 Part.rev 주간 배치 동기화 사이 또는 과거 생산 시점의 revision을 판정해야 할 때
    impact: MES 생산 오더, 품질 추적, 설계변경 적용 범위가 서로 다른 revision 해석을 할 수 있어 변경관리 기준 문서로서 신뢰가
      약화됩니다.
    evidence_refs:
      - .onto/review/20260610-36ef1faa/round1/coverage.findings.yaml#coverage-candidate-001
      - "Part.attributes.rev note: 도면 리비전. 도면 관리대장이 원본"
      - "Part.attributes.current_eco note: 최신 설계변경. ECO 시스템이 원본"
      - ECO.attributes.effective_date/status
      - "integrity_rules[2]: ECO.effective_date 이후 생산분은 신규 rev를 따른다; Part.rev
        갱신은 도면 관리대장 반영 후 주간 배치로 동기화"
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목 revision과 ECO 적용 기준을 일관되게 제공하는 목적
      failure_condition: ECO effective_date와 Part.rev 주간 배치 동기화 사이 또는 과거 생산 시점의 revision을 판정해야 할 때
      impact: MES 생산 오더, 품질 추적, 설계변경 적용 범위가 서로 다른 revision 해석을 할 수 있어 변경관리 기준 문서로서 신뢰가
        약화됩니다.
      evidence_refs:
        - "Part.attributes.rev note: 도면 리비전. 도면 관리대장이 원본"
        - "Part.attributes.current_eco note: 최신 설계변경. ECO 시스템이 원본"
        - ECO.attributes.effective_date/status
        - "integrity_rules[2]: ECO.effective_date 이후 생산분은 신규 rev를 따른다; Part.rev
          갱신은 도면 관리대장 반영 후 주간 배치로 동기화"
    causal_path:
