findings:
  - candidate_id: axiology-candidate-001
    target: manufacturing-bom-ontology.yaml / ECO-Revision effective-date rule
    evidence_anchor: .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:20-21,93-96;
      .onto/review/20260610-36ef1faa/execution-preparation/review-value-alignment-criteria.yaml:4-8
    claim: ECO 발효일과 Part.rev 주간 동기화의 병존은 PLM/MES 통합 기준 문서라는 목적을 훼손한다.
    what: 온톨로지는 Part.rev의 원본을 도면 관리대장으로 두고, current_eco는 ECO 시스템 원본이라고 정의한다. 동시에 무결성
      규칙은 ECO.effective_date 이후 생산분은 신규 rev를 따라야 하지만 Part.rev 갱신은 도면 관리대장 반영 후
      주간 배치로 동기화한다고 둔다.
    why: 리뷰의 가치 기준은 이 파일이 PLM/MES 통합의 개념 기준 문서로 적절해야 하며 변경관리 정합성과 제조 운영 위험을 중심으로
      검토하는 것이다. 그런데 생산 적용 기준은 ECO 발효일이고 품목 리비전 표시는 주간 배치 후 갱신된다면, 동일 시점의 PLM/MES
      소비자가 서로 다른 변경 상태를 기준으로 생산오더, 라우팅, 검사/품질 판단을 내릴 수 있다. 이는 통합 기준 문서가 제공해야 할
      변경관리 기준성과 운영 위험 감소 목적에서 벗어난다.
    how_to_fix: ECO effective_date 이후 사용할 생산 리비전을 Part.rev의 지연 동기화 값이 아니라 ECO 적용 상태와
      as-of effective revision 관계로 명시한다. 또는 Part.rev 동기화 완료 전 신규 rev 생산오더 생성이
      불가하도록 release/order gate를 추가한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목·BOM·라우팅·변경관리의 정합성과 제조 운영 위험을 줄이는 목적.
      failure_condition: ECO.effective_date가 도래했지만 Part.rev가 도면 관리대장 주간 배치 전이라 구 리비전을 표시하는 기간.
      impact: 생산은 신규 rev를 따라야 한다는 규칙과 품목 마스터의 현재 rev 표시가 갈라져, MES 생산오더와 PLM 변경 기준 간
        신뢰가 약해진다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:93-96
        - review-value-alignment-criteria.yaml:4-8
    causal_path:
      root_cause_candidate: 변경 적용의 운영 권위가 ECO.effective_date와 지연 동기화되는 Part.rev로 분산되어 있다.
      root_cause_step_id: axiology-candidate-001.cause-004
      steps:
        - cause_id: axiology-candidate-001.cause-001
          claim: Part.rev는 도면 관리대장이 원본이고 current_eco는 ECO 시스템이 원본이라고 분리되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20-21
        - cause_id: axiology-candidate-001.cause-002
          claim: 무결성 규칙은 ECO.effective_date 이후 생산분은 신규 rev를 따라야 한다고 선언한다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:96
        - cause_id: axiology-candidate-001.cause-003
          claim: 같은 규칙은 Part.rev 갱신을 도면 관리대장 반영 후 주간 배치로 지연시킨다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:96
        - cause_id: axiology-candidate-001.cause-004
          claim: 따라서 통합 기준 문서의 변경관리 목적이 요구하는 단일한 생산 리비전 판단 기준이 운영 시점에서 약해진다.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:4-8
            - materialized-input.md:96
      unresolved_beyond_evidence: null
  - candidate_id: axiology-candidate-002
    target: manufacturing-bom-ontology.yaml / BomLine.scrap_rate
    evidence_anchor: .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:29-35;
      .onto/review/20260610-36ef1faa/execution-preparation/review-value-alignment-criteria.yaml:4-8
    claim: BOM 라인에 생산계획팀 엑셀 값을 복사해 두는 scrap_rate는 통합 기준 문서의 목적보다 국소 편의성을 우선한다.
    what: BomLine.scrap_rate는 공정 불량 감안 계수인데, note에서 생산계획팀 엑셀로 별도 관리되는 값을 복사해 둔다고
      정의한다.
    why: PLM/MES 통합의 개념 기준 문서는 BOM과 공정/운영 기준의 신뢰 가능한 연결점을 제공해야 한다. 하지만 공정 불량 계수를 별도
      엑셀에서 복사한 값으로 두면 BOM 기준 수량과 생산계획 기준 수율 사이의 권위가 분리되고, 최신성·적용일·대사 실패가 온톨로지
      안에서 닫히지 않는다. 이는 제조 운영 위험을 줄이는 목적과 어긋나는 숨은 트레이드오프다.
    how_to_fix: scrap_rate를 단순 복사 필드로 두지 말고 권위 있는 수율/스크랩 마스터 또는 공정별 effective-dated
      yield concept에 대한 참조로 모델링한다. 임시 복사 필드가 필요하다면 원본, 동기화 시점, 유효기간, 불일치 처리 규칙을
      무결성 규칙에 포함한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM·공정 온톨로지를 PLM/MES 통합 기준으로 사용하고 제조 운영 위험을 검토 가능하게 만드는 목적.
      failure_condition: 생산계획팀 엑셀의 scrap_rate가 변경되었지만 BomLine 복사 값이 지연되거나 누락되어 BOM 기준
        소요량과 운영계획 수율이 달라지는 경우.
      impact: BOM의 수량 기준이 운영 수율과 함께 신뢰되지 않아 생산계획, 자재소요, 원가/능력 판단에서 통합 기준 문서의 가치가 낮아진다.
      evidence_refs:
        - materialized-input.md:29-35
        - review-value-alignment-criteria.yaml:4-8
    causal_path:
      root_cause_candidate: 운영적으로 중요한 scrap_rate의 source of truth를 온톨로지 내부 권위가 아닌 외부 엑셀 복사본으로 둔다.
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: BomLine은 상위 품목이 하위 품목을 얼마나 쓰는지 정의하는 BOM 한 줄이다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:29-35
        - cause_id: axiology-candidate-002.cause-002
          claim: 그 BOM 라인의 scrap_rate는 생산계획팀 엑셀 값을 복사해 둔다고 되어 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:35
        - cause_id: axiology-candidate-002.cause-003
          claim: 복사본 모델은 PLM/MES 통합 기준 문서가 요구하는 운영 기준의 최신성·권위·불일치 처리 목적을 약화한다.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:4-8
            - materialized-input.md:35
      unresolved_beyond_evidence: null
  - candidate_id: axiology-candidate-003
    target: manufacturing-bom-ontology.yaml / UOM and capacity unit governance
    evidence_anchor: .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:19,63-67,98-100;
      .onto/review/20260610-36ef1faa/execution-preparation/review-value-alignment-criteria.yaml:4-8
    claim: 품목별 환산계수 없이 현장 환산에 맡기는 UOM 정책은 PLM/MES 통합의 개념 기준성과 운영 위험 감소 목적에 맞지 않는다.
    what: Part.uom은 ea, kg, m enum으로 정의되지만, notes는 kg↔ea 등 품목별 환산계수 마스터가 없고 필요 시
      현장에서 환산한다고 한다. WorkCenter.capacity_per_shift도 단위가 작업장마다 개수 또는 시간으로 다르다고만
      되어 있다.
    why: 통합 기준 문서에서는 수량, 능력, 작업시간, 자재소요가 시스템 간 같은 의미로 전달되어야 한다. 현장 환산과 작업장별 암묵 단위는
      빠른 운영 편의는 주지만, PLM/MES 간 데이터 해석을 사용자 판단에 맡겨 scope_control과 invalid input
      behavior 관점의 목적을 약화한다.
    how_to_fix: 품목별 UOM conversion master를 명시하고, capacity_per_shift에는 unit 속성 또는
      capacity measure concept을 추가한다. 환산 불가·단위 누락 입력은 생산오더/계획 계산에서 거부하거나 검토 상태로
      남기는 규칙을 둔다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합 기준 문서로서 수량·능력·공정 데이터를 일관되게 해석하게 하는 목적.
      failure_condition: kg 기반 품목을 ea 소요량 또는 작업장별 capacity와 결합해 계획하거나,
        capacity_per_shift의 단위가 소비 시스템에서 암묵적으로 해석되는 경우.
      impact: 현장별 환산 관행이 시스템 기준을 대체해 자재소요, 생산능력, 원가 계산의 비교 가능성과 자동 검증 가능성이 낮아진다.
      evidence_refs:
        - materialized-input.md:19
        - materialized-input.md:63-67
        - materialized-input.md:98-100
        - review-value-alignment-criteria.yaml:4-8
    causal_path:
      root_cause_candidate: 수량과 능력 단위의 표준 변환 권위를 온톨로지에 두지 않고 현장 판단에 남긴다.
      root_cause_step_id: axiology-candidate-003.cause-004
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: Part.uom은 제한된 enum으로 선언되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:19
        - cause_id: axiology-candidate-003.cause-002
          claim: 품목별 환산계수 마스터는 없고 필요 시 현장에서 환산한다고 되어 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:100
        - cause_id: axiology-candidate-003.cause-003
          claim: WorkCenter.capacity_per_shift는 단위가 작업장마다 다르지만 구조화된 unit 필드가 없다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:63-67
        - cause_id: axiology-candidate-003.cause-004
          claim: 이 조합은 통합 기준 문서가 제공해야 할 수량·능력 의미의 일관성을 약화한다.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:4-8
            - materialized-input.md:19
            - materialized-input.md:67
            - materialized-input.md:100
      unresolved_beyond_evidence: null
