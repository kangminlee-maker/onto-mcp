  - candidate_id: logic-candidate-002
    target: manufacturing-bom-ontology.yaml BOM acyclicity integrity rule
    evidence_anchor: .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:23-35,93-94
    claim: BOM은 비순환이어야 한다는 필수 규칙과 Assembly가 자기 하위에 자신을 포함한다는 예외 모델링 규칙이 같은 BOM 구조
      위에서 충돌합니다.
    what: "`BomLine.parent_ref`는 Assembly를, `child_ref`는 Part를 가리키며 Assembly는 Part의
      일종입니다. 이 구조에서 “Assembly가 자기 하위에 자신을 포함”하는 모델은 parent와 child가 같은 Assembly인
      self-loop입니다. 그러나 같은 integrity rule은 BOM이 비순환이어야 한다고 선언합니다."
    why: "self-loop는 형식적으로 순환입니다. 따라서 재생 원료 회수 공정 조건에서는 BOM이 비순환이어야 한다는 necessary
      제약과 Assembly가 자기 자신을 하위 품목으로 포함해야 한다는 obligatory/possible 예외 모델이 같은 그래프에
      동시에 적용됩니다. conflict_pair: materialized-input.md:93-94 /
      materialized-input.md:23-35. satisfiability_note: inter-claim conflict;
      BomLine의 parent/child typing makes the stated self-child exception a BOM
      cycle. modality_note: mixed necessary/possible-obligatory conflict;
      acyclicity is required while an exception permits or requires a cycle
      without a distinct relation type. boundary_handoff_note: 예외 predicate 또는
      별도 relation 부재는 structure lens 인접 사안이지만, 현재 명시 claim만으로 self-loop와
      acyclicity가 직접 충돌하므로 logic fail입니다."
    how_to_fix: 비순환 규칙을 “일반 BOM 라인은 비순환이며, 스크랩 재투입은 별도 ScrapReturn/RecoveryFlow 관계로
      표현한다”처럼 분리하거나, acyclicity 검증에서 제외되는 명시적 예외 타입과 조건을 모델에 추가하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM 구조를 PLM/MES 통합의 기준으로 사용해 구성 전개, 생산 오더 생성, 자재 소요 계산을 안정적으로 수행하는 목적.
      failure_condition: 스크랩 재투입을 Assembly 자기참조 BomLine으로 표현하는 경우, 동일 BOM이 acyclicity
        검증에는 실패해야 하지만 integrity rule의 예외 모델로는 허용되어야 합니다.
      impact: 동일 BOM 그래프에 대해 순환 금지와 자기참조 허용이 동시에 성립해 검증기, 전개 로직, 생산 운영 시스템이 서로 다른 판정을
        내릴 수 있습니다.
      evidence_refs:
        - .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:23-35
        - .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:93-94
    causal_path:
      root_cause_candidate: 스크랩 재투입 흐름을 일반 BomLine의 parent-child 구조로 표현하도록 한 것이 BOM
        비순환 제약과 같은 구조 공간에서 충돌합니다.
      root_cause_step_id: logic-candidate-002.cause-004
      steps:
        - cause_id: logic-candidate-002.cause-001
          claim: Assembly는 Part의 일종이며 BomLine은 parent Assembly와 child Part를 연결합니다.
          relation_to_previous: null
          evidence_refs:
            - .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:23-35
        - cause_id: logic-candidate-002.cause-002
          claim: integrity rule은 BOM이 비순환이어야 한다고 선언합니다.
          relation_to_previous: causes
          evidence_refs:
            - .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:93-94
        - cause_id: logic-candidate-002.cause-003
          claim: 같은 rule은 스크랩 재투입을 Assembly가 자기 하위에 자신을 포함하는 형태로 모델링한다고 선언해 일반 BomLine
            구조에서 self-loop를 만들도록 합니다.
          relation_to_previous: causes
          evidence_refs:
