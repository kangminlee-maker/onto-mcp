  - candidate_id: logic-candidate-001
    target: manufacturing-bom-ontology.yaml AlternatePart definition and direction
      attribute
    evidence_anchor: .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:37-45
    claim: AlternatePart가 항상 대칭 관계로 정의되지만, 같은 엔티티의 direction은 one_way 값을 허용하고 기본값도
      one_way로 둡니다.
    what: "`AlternatePart.definition`은 “A의 대체가 B이면 B의 대체도 A”라고 선언해 대체 관계를 필연적으로
      양방향으로 만듭니다. 그러나 `direction.values`는 `one_way`와 `bidirectional`을 모두 허용하고,
      note는 기본값을 `one_way`라고 선언합니다."
    why: "동일 엔티티 안에서 대체 가능성의 양상에 대해 `bidirectional`이 necessary인 정의와 `one_way`가
      possible/default인 속성 제약이 공존합니다. 한 AlternatePart 인스턴스가 기본값인 `one_way`를 가지면
      정의상의 대칭성 조건과 동시에 만족될 수 없습니다. conflict_pair: materialized-input.md:38 /
      materialized-input.md:42-45. satisfiability_note: intra-entity inter-claim
      conflict; definition claim and enum/default claim impose incompatible
      substitution direction. modality_note: mixed necessary/possible conflict;
      always-symmetric definition conflicts with permitted/default one-way mode.
      boundary_handoff_note: naming ambiguity를 제거해도 `one_way` 값과 대칭 정의의 충돌이 남으므로
      logic 소유입니다."
    how_to_fix: 정의를 “대체 관계는 direction에 따라 단방향 또는 양방향일 수 있다”로 바꾸거나, 항상 대칭 관계가 의도라면
      `direction`에서 `one_way`를 제거하고 기본값을 `bidirectional`으로 정렬하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합의 품목 대체 기준 문서로서 대체 부품 관계의 유효 방향을 일관되게 판정하는 목적.
      failure_condition: AlternatePart가 기본값 또는 허용값인 `one_way`로 생성되는 경우, 같은 인스턴스가 정의상
        양방향이어야 한다는 조건과 충돌합니다.
      impact: 대체품 적용 가능 방향을 기준으로 구매, 생산, 변경 영향 범위를 판단할 때 같은 데이터가 단방향과 양방향으로 동시에 해석되어
        통합 계약의 신뢰성이 약해집니다.
      evidence_refs:
        - .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:38
        - .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:42-45
    causal_path:
      root_cause_candidate: AlternatePart의 관계 방향성을 엔티티 정의에서는 항상 대칭으로 선언하면서, 속성 모델에서는
        단방향 상태를 허용한 것이 시작 원인입니다.
      root_cause_step_id: logic-candidate-001.cause-003
      steps:
        - cause_id: logic-candidate-001.cause-001
          claim: AlternatePart 정의는 A의 대체가 B이면 B의 대체도 A라고 하여 대체 관계를 양방향으로 고정합니다.
          relation_to_previous: null
          evidence_refs:
            - .onto/review/20260610-36ef1faa/execution-preparation/materialized-input.md:38
        - cause_id: logic-candidate-001.cause-002
          claim: 같은 AlternatePart 엔티티의 `direction` 속성은 `one_way`를 허용하고 기본값도 `one_way`라고
            명시합니다.
          relation_to_previous: causes
          evidence_refs:
