  - finding_id: finding-026
    lens_id: logic
    source_ref: .onto/review/20260611-43359fc2/round1/logic.findings.yaml#logic-candidate-001
    target: manufacturing-bom-ontology.yaml integrity_rules[0] (BOM 비순환 규칙)
    evidence_anchor: manufacturing-bom-ontology.yaml:89
    claim: "단일 규칙 내에서 'BOM은 비순환이어야 한다'(necessary 제약)와 '스크랩 재투입은 Assembly가 자기 하위에 자신을
      포함하는 형태로 모델링한다'(자기순환 구조의 처방)가 동시 만족 불가능하다. [conflict_pair:
      integrity_rules[0]:89 ↔ integrity_rules[0]:89 / satisfiability_note:
      intra-claim — 동일 문장의 본문과 단서 조항이 직접 모순 / modality_note: necessary — 필수 불변식에
      대해 그 불변식을 위반하는 구조를 처방(modality 구분 오류: 예외를 '허용(possible)'이 아니라 '모델링
      방식(obligatory)'으로 선언) / boundary_handoff_note: 없음]"
    lens_rationale_summary: 이 모순은 모호성 제거로 해소되지 않는 형식 모순이다. '비순환'의 표준 정의(BomLine
      parent→child 그래프에 사이클 부재) 하에서 self-loop는 사이클이며, 규칙의 단서 조항이 그 사이클 생성을
      의무화한다. PLM/MES 통합 기준 문서로서 이 규칙을 그대로 구현하면 (a) BOM 검증기가 처방된 정상 데이터를 위반으로
