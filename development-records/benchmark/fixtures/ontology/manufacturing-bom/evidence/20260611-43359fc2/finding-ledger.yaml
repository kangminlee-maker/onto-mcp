      동작하는 MES는 구 rev로 생산 지시를 내리게 된다. 이는 '외부 표준 변경 시 기존 데이터/규칙의 연속성이 유지되는가'라는
      질문에 대해 문서 스스로 부정적 답을 명문화한 것으로, 기준 문서가 자신의 무결성 규칙을 자신의 동기화 정책으로 위반한다.
    proposed_action: rev/current_eco를 복사 저장하지 말고 원본 시스템 참조(조회 시점 해석)로 선언하거나, ECO 승인
      이벤트 기반 즉시 동기화로 정책을 바꾸고 주간 배치는 대사 용도로 격하한다.
    affected_purpose: ECO effective_date 이후 생산분이 신규 rev를 따른다는 변경관리 무결성 규칙(integrity_rules[2])
