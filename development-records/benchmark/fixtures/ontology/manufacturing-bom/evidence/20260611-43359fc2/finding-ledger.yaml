    source_ref: .onto/review/20260611-43359fc2/round1/evolution.findings.yaml#evolution-candidate-006
    target: manufacturing-bom-ontology.yaml > Part.current_eco (단일 참조)
    evidence_anchor: 'Part.current_eco: {type: ref, target: ECO, note: "최신 설계변경"} 및
      ECO.status: [open, approved, applied]'
    claim: current_eco가 단일 참조여서 한 품목에 동시 진행되는 복수 ECO(open+approved 병행)를 수용할 수 없고, 변경
      이력도 표현 불가능하다.
    lens_rationale_summary: 복수 ECO 병행은 변경관리의 정상 운영 상태다. 단일 참조 구조는 병행 ECO 발생 즉시 정보
      손실(어느 하나를 버려야 함)을 강제하고, 이를 수용하려면 Part 구조 자체의 수정(리스트화 또는 관계 분리)이 필요하다.
      ECO→Part 방향의 affected_parts와 중복 보유라는 점에서 동기화 불일치 위험도 함께 갖는다.
