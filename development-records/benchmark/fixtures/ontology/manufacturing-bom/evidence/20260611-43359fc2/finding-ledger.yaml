    target: manufacturing-bom-ontology.yaml integrity_rules[0] (BOM 비순환 규칙의 스크랩 재투입 예외)
    evidence_anchor: "manufacturing-bom-ontology.yaml: integrity_rules[0] 'BOM은
      비순환이어야 한다. 단, 재생 원료 회수 공정(스크랩 재투입)은 Assembly가 자기 하위에 자신을 포함하는 형태로 모델링한다.'
      (가치 판단 anchor: review-value-alignment-criteria.yaml user-request-intent의
      'BOM 개념 정합성과 제조 운영 위험', value_type=tradeoff,
      alignment_direction=misaligned)"
    claim: 스크랩 재투입을 자기 포함 BOM으로 모델링하는 국소적 편의가, MES BOM 전개가 의존하는 비순환성 보장이라는 전체 목적 가치를
      정당화 없이 훼손한다.
    lens_rationale_summary: "비순환성은 MRP 소요량 전개·원가 적산·리드타임 계산 등 MES/PLM의 핵심 연산이 종료된다는
      약속이다. 자기 포함을 허용하면 이 약속을 기준 문서 차원에서 포기하는 것이며, 그 트레이드오프(재생 흐름 표현 편의 vs 전개
      안전성)는 어떤 정당화나 보상 규칙(예: 재투입 전용 관계 종류, 전개 시 제외 규칙) 없이 수용되었다. 이는 리뷰 기준이 명시한
      '제조 운영 위험' 한가운데에 있는 비정렬 트레이드오프다."
    proposed_action: "스크랩 재투입을 BomLine 자기 참조가 아닌 별도 관계(예: reclaims_into 또는
      by-product/co-product 개념)로 분리하고, BOM 비순환 규칙은 예외 없이 유지한다. 전개 연산이 재투입 관계를
      어떻게 다루는지(전개 제외 또는 별도 정산)를 규칙으로 명시한다."
    affected_purpose: BOM 개념 정합성과 제조 운영 위험 최소화 (user-request-intent)
    failure_condition: 자기 포함 Assembly를 가진 BOM을 MES/MRP가 전개하는 모든 경우 — 전개 무한루프 또는 시스템별
