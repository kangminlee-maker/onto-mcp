  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260611-43359fc2/round1/axiology.findings.yaml#axiology-candidate-003
    target: manufacturing-bom-ontology.yaml integrity_rules[2] (ECO 발효일 규칙과 주간 배치
      rev 동기화)
    evidence_anchor: "manufacturing-bom-ontology.yaml: integrity_rules[2]
      'ECO.effective_date 이후 생산분은 신규 rev를 따른다. 단 Part.rev 갱신은 도면 관리대장 반영 후 주간
      배치로 동기화한다.' (가치 판단 anchor: review-value-alignment-criteria.yaml
      user-request-intent의 '변경관리 개념 정합성과 제조 운영 위험', value_type=commitment,
      alignment_direction=misaligned)"
    claim: 변경관리의 핵심 약속(발효일 이후 신규 rev 생산)이 같은 규칙의 단서(주간 배치 동기화)에 의해 최대 1주간 체계적으로 위반
      가능하도록 설계되어 있고, 이 트레이드오프가 정당화 없이 수용되었다.
    lens_rationale_summary: 변경관리는 리뷰 기준이 명시적으로 지목한 검토 축이다. 발효일 효력과 주간 배치라는 두 약속의 충돌은
      운영 편의(배치 동기화 비용 절감)를 위해 변경관리 보증을 희생하는 숨은 트레이드오프인데, 문서는 이를 트레이드오프로 인식하거나 보상
      수단(공백 기간 중 ECO 직접 조회 의무, 발효 보류 상태 등)을 제시하지 않는다. 잘못된 리비전 생산은 리콜·폐기로 직결되는
      대표적 제조 운영 위험이다.
    proposed_action: "발효 의미론을 단일화한다: (a) effective_date 효력 판정의 권위를 ECO 엔티티로 명시하고
      Part.rev를 파생 캐시로 선언하며 공백 기간의 판정 규칙(ECO 우선)을 추가하거나, (b) rev 동기화 완료를 ECO
      status=applied의 필요조건으로 정의하여 발효와 동기화의 순서를 강제한다."
    affected_purpose: 변경관리 개념의 정합성 (user-request-intent)
    failure_condition: ECO effective_date와 주간 배치 동기화 시점 사이의 공백 기간에 해당 품목의 생산 오더가 생성·실행되는 경우
    impact: 기준 문서 자체가 구 리비전 생산을 허용하는 창을 내장하므로, 이 문서를 기준으로 통합한 PLM/MES는 변경관리 위반을
      구조적으로 탐지하지 못한다.
    evidence_refs:
