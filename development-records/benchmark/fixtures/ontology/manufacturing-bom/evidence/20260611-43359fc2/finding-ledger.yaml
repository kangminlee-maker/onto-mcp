    lens_rationale_summary: 확정된 리뷰 가치 기준(user-request-intent)은 이 문서가 'PLM/MES 통합의 개념
      기준 문서로 적절한지'를 묻는다. 기준 문서의 목적은 두 시스템이 충돌할 때 어느 개념·값이 진실인지 판정하는 것인데, 본 문서는
      판정 권위를 체계 없이 외부에 분산시키고 복사 시점·갱신 규칙을 미정의로 남겨, 통합 시 양 시스템이 서로 다른 '원본'을 참조하는
      상태를 오히려 공식화한다. 이는 편의(현행 관행 기술)와 목적(권위 있는 기준 수립) 사이의 숨은 트레이드오프를 정당화 없이 수용한
      purpose drift다.
    proposed_action: "각 속성에 대해 authority(원본 시스템)·동기화 방향·갱신 계약을 명시적 1급 개념(예:
      source_of_truth, sync_policy)으로 선언하거나, 복사 속성을 외부 참조로 격하하여 본 온톨로지가 권위를 갖는
      개념 집합을 명확히 경계 짓는다. '기준 문서'가 무엇에 대한 기준인지(개념 구조만인지, 값 권위까지인지)를 헤더에서 선언한다."
    affected_purpose: PLM/MES 통합의 개념 기준 문서라는 선언된 목적
      (review-value-alignment-criteria.yaml user-request-intent)
    failure_condition: PLM과 MES가 rev/ECO/scrap_rate/검사 기준 값에 대해 본 문서를 기준으로 삼으려 할 때,
