  - candidate_id: axiology-candidate-003
    target: manufacturing-bom-ontology.yaml integrity_rules[2] (ECO 발효일 규칙과 주간 배치
      rev 동기화)
    evidence_anchor: "manufacturing-bom-ontology.yaml: integrity_rules[2]
      'ECO.effective_date 이후 생산분은 신규 rev를 따른다. 단 Part.rev 갱신은 도면 관리대장 반영 후 주간
      배치로 동기화한다.' (가치 판단 anchor: review-value-alignment-criteria.yaml
      user-request-intent의 '변경관리 개념 정합성과 제조 운영 위험', value_type=commitment,
      alignment_direction=misaligned)"
    claim: 변경관리의 핵심 약속(발효일 이후 신규 rev 생산)이 같은 규칙의 단서(주간 배치 동기화)에 의해 최대 1주간 체계적으로 위반
      가능하도록 설계되어 있고, 이 트레이드오프가 정당화 없이 수용되었다.
    what: 규칙 본문은 발효일 기준 즉시 효력을 약속하지만, 단서는 온톨로지상 rev가 최대 약 1주 늦게 갱신됨을 인정한다. 그 공백 기간
      동안 MES가 본 문서의 rev를 참조하면 구 리비전으로 생산하면서도 규칙상 위반을 탐지할 수 없다.
    why: 변경관리는 리뷰 기준이 명시적으로 지목한 검토 축이다. 발효일 효력과 주간 배치라는 두 약속의 충돌은 운영 편의(배치 동기화 비용
      절감)를 위해 변경관리 보증을 희생하는 숨은 트레이드오프인데, 문서는 이를 트레이드오프로 인식하거나 보상 수단(공백 기간 중 ECO
      직접 조회 의무, 발효 보류 상태 등)을 제시하지 않는다. 잘못된 리비전 생산은 리콜·폐기로 직결되는 대표적 제조 운영 위험이다.
    how_to_fix: "발효 의미론을 단일화한다: (a) effective_date 효력 판정의 권위를 ECO 엔티티로 명시하고
      Part.rev를 파생 캐시로 선언하며 공백 기간의 판정 규칙(ECO 우선)을 추가하거나, (b) rev 동기화 완료를 ECO
      status=applied의 필요조건으로 정의하여 발효와 동기화의 순서를 강제한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 변경관리 개념의 정합성 (user-request-intent)
      failure_condition: ECO effective_date와 주간 배치 동기화 시점 사이의 공백 기간에 해당 품목의 생산 오더가 생성·실행되는 경우
      impact: 기준 문서 자체가 구 리비전 생산을 허용하는 창을 내장하므로, 이 문서를 기준으로 통합한 PLM/MES는 변경관리 위반을
        구조적으로 탐지하지 못한다.
      evidence_refs:
        - "manufacturing-bom-ontology.yaml: integrity_rules[2]"
        - "manufacturing-bom-ontology.yaml: Part.rev note, Part.current_eco note"
    causal_path:
      root_cause_candidate: rev의 권위를 도면 관리대장에 두고 온톨로지를 지연 복사본으로 설계하면서, 발효일 판정이라는 시간
        의미론을 어느 권위가 소유하는지 정의하지 않음
      root_cause_step_id: axiology-candidate-003.cause-003
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: integrity_rules[2]의 본문(즉시 발효)과 단서(주간 배치 지연)가 동일 규칙 안에서 충돌한다
          relation_to_previous: null
