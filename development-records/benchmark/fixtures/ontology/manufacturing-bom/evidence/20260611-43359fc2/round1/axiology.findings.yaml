      트레이드오프다."
    how_to_fix: "스크랩 재투입을 BomLine 자기 참조가 아닌 별도 관계(예: reclaims_into 또는
      by-product/co-product 개념)로 분리하고, BOM 비순환 규칙은 예외 없이 유지한다. 전개 연산이 재투입 관계를
