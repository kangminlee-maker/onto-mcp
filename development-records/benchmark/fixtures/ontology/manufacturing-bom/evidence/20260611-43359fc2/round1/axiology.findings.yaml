      편의(현행 관행 기술)와 목적(권위 있는 기준 수립) 사이의 숨은 트레이드오프를 정당화 없이 수용한 purpose drift다.
    how_to_fix: "각 속성에 대해 authority(원본 시스템)·동기화 방향·갱신 계약을 명시적 1급 개념(예:
