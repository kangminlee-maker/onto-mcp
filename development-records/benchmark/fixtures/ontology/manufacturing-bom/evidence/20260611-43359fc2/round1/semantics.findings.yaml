findings:
  - candidate_id: semantics-candidate-001
    target: manufacturing-bom-ontology.yaml > entities.AlternatePart
    evidence_anchor: AlternatePart.definition("A의 대체가 B이면 B의 대체도 A다") vs
      AlternatePart.attributes.direction(enum [one_way, bidirectional], note
      "기본은 one_way") 및 relations[alternate_of] note "단축 표기"
    claim: AlternatePart의 정의는 대칭(양방향) 관계를 단언하지만 direction 속성은 기본값 one_way로 비대칭을
      허용하여, 이름·정의와 실제 모델 의미가 정면으로 모순된다.
    what: 정의 문장은 '대체 관계는 항상 대칭'이라고 선언하는데, 같은 엔티티의 direction 속성은 one_way를 기본값으로 두어
      비대칭 대체를 표준 케이스로 만든다. 또한 relations의 alternate_of는 이 방향 정보 없이 Part↔Part 단축
      표기로 선언되어, 단축 표기가 원 관계(one_way 가능)보다 강한 대칭 의미를 암시한다.
    why: PLM/MES 통합의 개념 기준 문서에서 대체부품 의미가 모순되면, 한 시스템은 정의 문장을 따라 양방향 대체(B를 A 자리에 투입)를
      허용하고 다른 시스템은 direction=one_way를 따라 단방향만 허용하는 식으로 구현이 갈린다. 제조 현장에서 단방향
      대체(구형→신형은 가능, 역방향 불가)는 실재하는 제약이므로, 정의가 이를 부정하면 잘못된 자재 투입을 정당화하는 근거 문서가 된다.
    how_to_fix: 정의 문장에서 무조건적 대칭 단언을 제거하고 'direction=bidirectional인 경우에만 대칭'으로 수정한다.
      relations의 alternate_of 단축 표기에도 방향 의미가 보존됨(또는 bidirectional 한정 단축임)을 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 대체부품 의미의 단일 해석 제공
      failure_condition: PLM과 MES가 각각 정의 문장과 direction 속성 중 다른 쪽을 구현 근거로 삼아 대체부품 허용
        범위가 시스템 간 불일치하는 경우
      impact: 단방향 대체만 허용되는 부품이 역방향으로 투입될 수 있어 잘못된 자재 사용·품질 사고로 이어질 수 있고, 기준 문서가 모순을
        내장하므로 어느 구현도 '기준 위반'으로 판정할 수 없게 된다
      evidence_refs:
        - manufacturing-bom-ontology.yaml entities.AlternatePart.definition
        - manufacturing-bom-ontology.yaml
          entities.AlternatePart.attributes.direction
        - manufacturing-bom-ontology.yaml relations alternate_of note
    causal_path:
      root_cause_candidate: 대칭 대체와 단방향 대체라는 두 개의 서로 다른 도메인 개념을 하나의 AlternatePart 엔티티에
        합치면서, 정의 문장은 대칭 사례 기준으로, 속성은 단방향 사례 기준으로 각각 작성됨
      root_cause_step_id: semantics-candidate-001.cause-002
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: AlternatePart 정의는 대칭을 단언하는데 direction 기본값은 one_way로 비대칭을 표준으로 둔다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities.AlternatePart
        - cause_id: semantics-candidate-001.cause-002
          claim: 이 모순은 두 개의 구별되는 도메인 개념(상호 호환 부품 쌍 vs 단방향 승인 대체)을 한 엔티티로 모델링하면서 정의와 속성이 서로
            다른 개념을 기준으로 작성된 데서 비롯된다
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml
              entities.AlternatePart.attributes.direction note
      unresolved_beyond_evidence: 실제 현장에서 단방향 대체가 운영 중인지(one_way가 실사용 값인지)는 이 파일만으로 확인할 수 없다.
  - candidate_id: semantics-candidate-002
    target: manufacturing-bom-ontology.yaml > entities.BomLine.attributes.scrap_rate
    evidence_anchor: 'BomLine.scrap_rate note: "공정 불량 감안 계수. 생산계획팀 엑셀로 별도 관리되는 값을 복사해 둔다."'
    claim: scrap_rate는 이름·의미상 공정(Operation) 수율에서 파생되는 계수인데, 외부 엑셀이 원본인 값을 BOM 라인에 독립
      입력 복사본으로 모델링하여 파생값-입력 불일치와 원천 드리프트를 내장한다.
    what: scrap_rate의 의미('공정 불량 감안')는 공정 품질 실적에 종속된 파생 계수이지만, 모델에서는 BomLine의 일반
      number 속성으로 정의되고 note가 명시적으로 '별도 관리되는 값의 복사'라고 선언한다. 원본(생산계획팀 엑셀)과의 동기화
      규칙·시점·책임은 모델 어디에도 없다.
    why: 이 lens의 핵심 점검 항목인 '산식·파생으로 정의되는 용어가 독립 입력으로 모델링된 경우'에 정확히 해당한다. scrap_rate는
      MRP 소요량 산출(qty_per × 보정계수)에 직접 곱해지는 값이므로, 복사본이 엑셀 원본과 어긋나면 자재 소요량이 조용히
      틀어진다. 개념 기준 문서가 '복사해 둔다'를 정상 패턴으로 명문화하면 통합 후에도 이중 원천이 영속화된다.
    how_to_fix: scrap_rate의 원천 권위를 모델에서 선언한다. 최소 수정으로는 type을 ref 또는 derived로 바꾸고
      원천(생산계획 scrap 마스터)과 동기화 계약(주기·방향·충돌 시 우선순위)을 명시하거나, 공정 귀속 계수라면
      Operation/Routing 쪽 속성으로 이동시킨다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합 시 자재 소요량 계산의 단일 진실 원천 확립
      failure_condition: 생산계획팀 엑셀의 scrap_rate가 갱신되었으나 BomLine 복사본이 갱신되지 않은 상태에서
        MES/MRP가 BomLine 값으로 소요량을 산출하는 경우
      impact: 자재 부족 또는 과잉 발주가 발생하며, 기준 문서 자체가 복사 패턴을 승인하고 있어 통합 설계 단계에서 이 위험이 교정되지 않고
        그대로 이관된다
      evidence_refs:
        - manufacturing-bom-ontology.yaml entities.BomLine.attributes.scrap_rate
          note
    causal_path:
      root_cause_candidate: scrap_rate의 권위 소재(생산계획 엑셀)를 모델 밖에 둔 채, 온톨로지에는 동기화 계약 없는 복사 필드를 정의함
      root_cause_step_id: semantics-candidate-002.cause-003
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: scrap_rate가 외부 엑셀 원본의 복사본으로 BomLine에 독립 입력으로 존재한다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml
              entities.BomLine.attributes.scrap_rate
        - cause_id: semantics-candidate-002.cause-002
          claim: 복사 시점·주기·책임이 미정의이므로 원본 갱신 시 BomLine 값이 침묵 속에 낡는다(원천 드리프트)
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml
              entities.BomLine.attributes.scrap_rate note(동기화 규칙 부재)
        - cause_id: semantics-candidate-002.cause-003
          claim: 개념 기준 문서가 이 복사 패턴을 정상으로 명문화하여 PLM/MES 통합 설계가 이중 원천을 그대로 계승한다
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml 파일 헤더 주석(PLM/MES 통합의 개념 기준 문서)
      unresolved_beyond_evidence: 엑셀 원본의 갱신 빈도와 실제 드리프트 발생 이력은 경계 내 증거로 확인 불가.
  - candidate_id: semantics-candidate-003
    target: manufacturing-bom-ontology.yaml > integrity_rules[0]
    evidence_anchor: 'integrity_rules[0]: "BOM은 비순환이어야 한다. 단, 재생 원료 회수 공정(스크랩 재투입)은
      Assembly가 자기 하위에 자신을 포함하는 형태로 모델링한다."'
    claim: "'BOM 구성 관계'라는 이름으로 '공정 재투입(자재 흐름)'이라는 다른 의미의 개념을 표현하게 하여, BomLine의 의미(상위
      품목이 하위 품목을 얼마나 쓰는지)와 실제 사용(재생 루프)이 불일치하는 동음이의 사용을 제도화한다."
    what: BomLine은 정적 구성 수량 관계로 정의되어 있는데, 예외 규칙은 시간 축을 가진 공정 자재 회수 흐름을 Assembly 자기참조
      BomLine으로 표현하라고 지시한다. 같은 BomLine 구조가 문맥에 따라 '구성'과 '재투입 흐름'이라는 두 의미를 가지게 되며
      이를 구분하는 표지(속성·타입)가 없다.
    why: BOM 전개(explosion), 소요량 계산, 원가 적산은 모두 'BomLine=구성 수량'이라는 의미에 기대어 동작한다. 자기참조
      라인이 섞이면 전개 알고리즘은 무한 루프 또는 임의의 루프 차단 처리를 해야 하고, 그 처리 방식에 따라 소요량·원가가 달라진다.
      이는 같은 이름의 두 의미를 미구분한 전형적 동음이의 문제이며, '비순환이어야 한다'는 규칙 자체의 의미도 무력화한다.
    how_to_fix: "재생 원료 회수는 BomLine이 아닌 별도 개념(예: ByproductRecovery 또는 Operation에 귀속되는
      회수 산출 관계)으로 분리하고, BOM 비순환 규칙은 예외 없이 유지한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: BOM 전개·소요량·원가 계산이 의존하는 'BomLine=정적 구성 관계' 의미의 일관성
      failure_condition: MES/MRP가 자기참조 BomLine을 포함한 BOM을 전개할 때(무한 루프 방어 로직의 유무·방식에 따라
        결과가 달라지는 모든 경우)
      impact: 전개 결과·소요량·원가가 구현마다 달라지거나 시스템이 루프에서 실패하며, 통합 기준 문서가 이 모호성을 규칙으로 승격시켜 두
        시스템이 서로 다른 루프 처리 의미를 갖게 된다
      evidence_refs:
        - manufacturing-bom-ontology.yaml integrity_rules[0]
        - manufacturing-bom-ontology.yaml entities.BomLine.definition
    causal_path:
      root_cause_candidate: 공정 차원의 자재 회수 흐름(시간·공정 종속 개념)을 표현할 별도 개념이 없어, 가장 가까운 기존 구조인
        BomLine 자기참조를 의미 전용(轉用)함
      root_cause_step_id: semantics-candidate-003.cause-003
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: integrity_rules[0]이 스크랩 재투입을 Assembly 자기포함 BomLine으로 모델링하라고 지시한다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml integrity_rules[0]
        - cause_id: semantics-candidate-003.cause-002
          claim: 이로써 BomLine이 '구성 수량'과 '재투입 흐름' 두 의미를 표지 없이 겸하게 된다(동음이의 미구분)
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities.BomLine.definition
        - cause_id: semantics-candidate-003.cause-003
          claim: 회수 흐름을 담을 공정측 개념(부산물/회수 관계)이 온톨로지에 부재한 것이 전용의 출발 원인이다
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities 목록(회수/부산물 개념 부재)
      unresolved_beyond_evidence: 실제 재생 회수 공정의 수율·계량 방식은 경계 내 자료로 확인 불가하나, 의미 모순 판정에는 영향 없다.
  - candidate_id: semantics-candidate-004
    target: manufacturing-bom-ontology.yaml > entities.Part.attributes.rev,
      current_eco 및 integrity_rules[2]
    evidence_anchor: Part.rev note "도면 관리대장이 원본", Part.current_eco note "ECO 시스템이
      원본", integrity_rules[2] "ECO.effective_date 이후 생산분은 신규 rev를 따른다. 단
      Part.rev 갱신은 ... 주간 배치로 동기화한다."
    claim: "'rev'라는 이름은 품목의 현행 유효 리비전을 의미하지만, 실제 의미는 '최대 1주 지연된 마지막 동기화 시점의 리비전'이어서
      이름과 실제 의미가 불일치하며, integrity_rules[2]의 두 문장이 이 불일치를 규칙 내부 모순으로 노출한다."
    what: Part.rev와 current_eco는 모두 외부 시스템이 원본인 복사 속성이다. integrity_rules[2]는
      effective_date 이후 생산분이 신규 rev를 따라야 한다고 하면서, 동시에 Part.rev는 주간 배치로만 갱신된다고
      명시한다. 즉 effective_date와 다음 주간 배치 사이의 기간 동안 Part.rev는 규칙이 요구하는 '따라야 할 rev'와
      다른 값을 가진다.
    why: MES가 생산 오더 생성 시 Part.rev를 참조하면, 갭 기간의 생산분은 구 리비전 도면으로 제조된다. 이는 설계변경 누락이라는
      전형적 제조 품질 사고 경로이며, 이름('현행 rev')을 신뢰한 소비자가 실제 의미('지연 복사본')와 다른 행동을 하게 되는 의미
      불일치가 사고의 직접 원인이 된다.
    how_to_fix: "최소 수정: rev의 의미를 'last_synced_rev'로 정직하게 개명하거나, note에 '유효 rev 판정은
      ECO.effective_date와 결합해 도출해야 하며 Part.rev 단독 참조 금지'를 명시한다. 더 나은 수정: 유효 rev를
      ECO로부터의 파생 투영으로 정의하고 Part.rev 독립 필드를 제거한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: ECO 변경관리 규칙(effective_date 이후 신규 rev 적용)의 실효성과 변경 적용 시점의 정확성
      failure_condition: ECO effective_date와 주간 배치 동기화 사이의 기간에 MES가 Part.rev를 현행 리비전으로
        신뢰하여 생산 오더를 생성하는 경우
      impact: 구 리비전 도면 기준 생산이 최대 1주간 규칙상 '정상'으로 통과하며, 변경관리 개념의 정합성이라는 검토 목적 자체가 충족되지
        않는다
      evidence_refs:
        - manufacturing-bom-ontology.yaml entities.Part.attributes.rev
        - manufacturing-bom-ontology.yaml entities.Part.attributes.current_eco
        - manufacturing-bom-ontology.yaml integrity_rules[2]
    causal_path:
      root_cause_candidate: 유효 리비전이라는 파생 개념(ECO effective_date로부터 도출)을 독립 복사 필드
        Part.rev로 모델링하고, 동기화 지연(주간 배치)을 규칙에 명문화함
      root_cause_step_id: semantics-candidate-004.cause-003
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: integrity_rules[2]가 'effective_date 이후 신규 rev 적용'과 'Part.rev는 주간 배치 동기화'를
            동시에 선언한다
          relation_to_previous: null
