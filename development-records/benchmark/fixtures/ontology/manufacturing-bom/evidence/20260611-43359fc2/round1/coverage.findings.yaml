    claim: BOM 구조와 시점 의존 값(qty_per, scrap_rate, rev)에 유효기간(effectivity)·이력 개념이 전혀 없어
      과거/미래 시점의 BOM을 재구성할 수 없다.
    what: ECO는 effective_date를 갖지만 BomLine에는 유효 시작/종료일이 없고, Part.rev는 단일 현재값만 보유한다.
      scrap_rate·qty_per도 단일 현재값이다. 어떤 시점에 어떤 BOM 구성·리비전·계수가 유효했는지를 표현할 개념
      범주(effectivity, revision history, as-of reconstruction)가 온톨로지에 부재하다.
    why: PLM/MES 통합 기준 문서에서 effectivity는 ECO 적용을 BOM에 전파하는 핵심 메커니즘이다.
      integrity_rules가 'effective_date 이후 생산분은 신규 rev를 따른다'고 선언하지만, BOM/rev에 시점
      축이 없으므로 이 규칙을 데이터로 판정할 수 없다. 생산 시점별 as-planned/as-built 재구성, 소급 원가, 리콜 추적이
      모두 불가능해진다.
    how_to_fix: "BomLine에 effective_from/effective_to(또는 eco_in/eco_out 참조)를 추가하고,
      Part.rev를 단일 값이 아닌 리비전 이력(RevisionRecord: rev, effective_date, eco_ref)으로
      승격한다. scrap_rate 등 계수에도 유효기간을 부여한다."
    upstream_evidence_required: false
