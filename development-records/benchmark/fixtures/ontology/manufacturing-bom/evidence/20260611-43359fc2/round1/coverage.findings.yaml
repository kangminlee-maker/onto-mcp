  - candidate_id: coverage-candidate-002
    target: manufacturing-bom-ontology.yaml — BOM 뷰 범주 (EBOM/MBOM 구분)
    evidence_anchor: "entities: Assembly.bom_lines (단일 BOM 구조만 존재); ontology 헤더
      'PLM/MES 통합의 개념 기준 문서'"
    claim: PLM(설계 BOM)과 MES(제조 BOM)를 잇는 기준 문서임에도 EBOM/MBOM 구분, phantom assembly, 대체
      BOM 등 BOM 뷰 범주가 누락되었다.
    what: BOM이 Assembly당 단일 bom_lines 리스트 하나로만 존재한다. 설계 구조(EBOM)와 제조 구조(MBOM)의 구분,
      공정 중간 단계의 phantom 품목, 공장/라인별 대체 BOM 같은 업계 표준 BOM 뷰 개념이 없다.
    why: "PLM은 설계 관점 BOM을, MES는 제조 관점 BOM을 사용하며 둘은 구조가 다른 것이 일반적이다(예: 설계상 한 모듈이 제조상
      여러 공정 단계로 분해). 두 시스템의 '통합 개념 기준'을 표방하면서 단일 BOM만 정의하면, 양 시스템이 같은 bom_lines를
      서로 다른 의미로 매핑하게 되어 통합 시 의미 충돌이 발생한다."
    how_to_fix: 최소한 BOM에 view/usage 구분(engineering/manufacturing) 개념을 추가하거나, 단일 BOM
      정책을 의도적으로 채택했다면 'EBOM=MBOM 단일 구조' 가정을 명시적 제약으로 문서화한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 두 시스템 간 BOM 개념 매핑의 기준 제공
      failure_condition: 설계 구조와 제조 구조가 다른 품목(현실 제조에서 일반적)을 두 시스템이 본 온톨로지로 매핑하려 할 때
      impact: 기준 문서가 가장 빈번한 통합 충돌 지점(EBOM↔MBOM 변환)에 대해 침묵하므로, 통합 설계가 문서 밖 암묵 합의에 의존하게
        된다.
      evidence_refs:
        - "manufacturing-bom-ontology.yaml: 헤더 주석 'PLM/MES 통합의 개념 기준 문서'"
        - "manufacturing-bom-ontology.yaml: Assembly.bom_lines"
    causal_path:
      root_cause_candidate: 온톨로지가 'BOM은 하나'라는 단일 관점 가정 위에 작성되어, 소비 시스템(PLM vs MES)별
        BOM 관점 차이가 개념 공간에 반영되지 않음
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: BOM 구조가 Assembly.bom_lines 단일 리스트로만 정의되고 뷰/용도 구분 속성이 없다
          relation_to_previous: null
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: Assembly.attributes.bom_lines"
        - cause_id: coverage-candidate-002.cause-002
          claim: 문서 목적이 PLM/MES 통합 기준임에도 두 시스템의 BOM 사용 관점 차이를 표현할 범주가 없어, 목적 대비 개념 범주 결손이
            된다
          relation_to_previous: symptom_of
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: 헤더 주석"
      unresolved_beyond_evidence: 해당 조직의 제품이 실제로 EBOM=MBOM 단일 구조로 운영 가능한 단순 제품군인지는 경계 내 증거로 판단 불가
  - candidate_id: coverage-candidate-003
    target: manufacturing-bom-ontology.yaml — ECO (변경관리 범위와 통제 증거)
    evidence_anchor: "ECO.attributes (affected_parts: list of Part; status: [open,
      approved, applied]); relations '{ from: ECO, to: Part, kind: changes }'"
    claim: 변경관리(ECO)가 Part 단위 영향만 표현하고 BOM 구조·라우팅 변경을 커버하지 못하며, 승인 행위의 행위자·시각·근거를
      추적할 증거 개념과 부결·취소 종결 상태가 없다.
    what: ECO는 affected_parts(Part 목록)만 가리킨다. BOM 라인 추가/삭제/수량 변경, 라우팅 공정 변경은 제조 변경의
      주요 유형인데 이를 표현할 대상 범주가 없다. status는 open→approved→applied만 있고
      rejected/cancelled가 없으며, approved 상태에 승인자·승인일시·근거 속성이 없다.
    why: 요청이 명시한 검토 축이 '변경관리 개념의 정합성'이다. BOM 수량 변경이나 공정 변경을 ECO로 표현할 수 없으면 해당 변경들이
      변경 통제 밖에서 일어나게 되고, 승인 증거가 없으면 'approved' 상태가 감사 가능하지 않다. 부결 상태가 없으면 거부된
      변경이 영원히 open으로 남거나 기록 없이 삭제된다.
    how_to_fix: ECO의 영향 대상을 Part 외에 BomLine·Routing(또는 변경 항목 ChangeItem 개념)으로 확장하고,
      status에 rejected/cancelled를 추가하며, 승인 증거 속성(approved_by, approved_at,
      rationale)을 부여한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 품목·BOM·라우팅 전반에 대한 변경관리 정합성 (요청문이 명시한 검토 목적)
      failure_condition: BOM 구성 변경 또는 라우팅 변경이 발생할 때(품목 자체는 불변), 그리고 ECO가 부결되거나 승인 책임을 추적해야 할 때
      impact: 변경관리 개념이 제조 변경의 상당 부분을 표현하지 못해, 기준 문서를 따르는 시스템에서 통제 밖 변경 경로가 구조적으로 허용된다.
      evidence_refs:
        - "manufacturing-bom-ontology.yaml: ECO.attributes.affected_parts"
        - "manufacturing-bom-ontology.yaml: ECO.attributes.status"
        - "manufacturing-bom-ontology.yaml: relations (ECO→Part changes)"
    causal_path:
      root_cause_candidate: 변경관리 개념이 '도면 리비전 변경' 사용 사례 하나에서 출발해 설계되어, 변경 대상
        일반화(구조·공정)와 통제 행위 증거 차원이 개념화되지 않음
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: ECO의 영향 표현이 affected_parts(Part 목록)뿐이고 BomLine/Routing을 가리킬 수 없다
          relation_to_previous: null
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: ECO.attributes"
            - "manufacturing-bom-ontology.yaml: relations"
        - cause_id: coverage-candidate-003.cause-002
          claim: status enum에 부결·취소가 없고 승인 메타데이터가 없어, 통제 행위(승인)의 증거 차원이 결손이다
          relation_to_previous: symptom_of
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: ECO.attributes.status"
        - cause_id: coverage-candidate-003.cause-003
          claim: integrity_rules와 Part.rev note가 모두 rev(도면) 동기화만 다루는 점이, ECO가 rev 변경 전용으로
            협소하게 개념화되었음을 뒷받침한다
          relation_to_previous: causes
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: integrity_rules[2]"
            - "manufacturing-bom-ontology.yaml: Part.rev note"
      unresolved_beyond_evidence: 승인 증거가 외부 ECO 시스템에 존재할 가능성은 있으나, 기준 문서가 그 권위 위치를 지정하지 않았다는 결손은 그대로 유효
  - candidate_id: coverage-candidate-004
    target: manufacturing-bom-ontology.yaml — scrap_rate, std_time, rev (병행 관리 값의 단일
      권위 미지정)
    evidence_anchor: BomLine.scrap_rate note '생산계획팀 엑셀로 별도 관리되는 값을 복사해 둔다'; notes[0]
      '표준원가 시스템에도 수기 입력 필드가 있어 분기마다 대사한다'; integrity_rules[2] '주간 배치로 동기화'
    claim: 복수 장부에 걸쳐 관리된다고 명시된 값들(scrap_rate, 누적 std_time, rev)에 단일 원본(권위) 지정과 동기화
      실패 시 우선순위 규칙이 없다.
    what: scrap_rate는 엑셀 원본의 '복사본'이라고만 적혀 있고 복사 주기·불일치 시 처리가 없다. 누적 std_time은 MES
      계산값과 표준원가 시스템 수기 입력이 병존하며 분기 대사로만 관리된다. rev는 도면 관리대장이 원본이지만 주간 배치 동기화여서
      ECO effective_date(일 단위)와 최대 일주일 어긋난다. 세 경우 모두 '불일치 구간에서 어느 값이 권위인가'를 정하는
      개념이 없다.
    why: 이 lens 기준으로 병행 관리 값의 단일 권위 지정 부재는 차원 결손이다. 기준 문서가 권위와 동기화 의미론을 정의하지 않으면,
      PLM/MES 통합 시 각 시스템이 자기 사본을 진실로 취급해 자재 소요량(scrap_rate), 원가(std_time), 생산
      리비전(rev)이 시스템 간에 조용히 갈라진다. 특히 rev의 주간 배치는 integrity_rules의 effective_date
      규칙과 구조적으로 충돌하는 무권위 구간을 매주 만든다.
    how_to_fix: "각 병행 관리 값에 authority(원본 시스템) 지정, 동기화 주기·방향, 불일치 구간의 우선 규칙(예: 'rev는
      도면 관리대장이 항상 우선, 온톨로지 값은 캐시')을 속성 또는 integrity_rule로 명시한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 여러 시스템이 참조할 단일 개념 기준으로서의 권위 제공
      failure_condition: "동기화 지연 구간(rev: 최대 1주, std_time: 최대 1분기) 또는 복사 누락 시 두 장부의 값이 다른 모든 경우"
      impact: 기준 문서 자체가 사본/원본 혼재를 내장하고 있어, 통합 시스템이 잘못된 값을 권위로 채택해도 문서상 위반이 아니다 — 자재
        소요·원가·생산 리비전 오류가 정당화된다.
      evidence_refs:
        - "manufacturing-bom-ontology.yaml: BomLine.scrap_rate note"
        - "manufacturing-bom-ontology.yaml: notes[0]"
        - "manufacturing-bom-ontology.yaml: integrity_rules[2]"
    causal_path:
      root_cause_candidate: 기존 운영 현실(엑셀 별도 관리, 수기 입력, 주간 배치)을 권위 재설계 없이 그대로 온톨로지에
        기술하여, '현황 기술'과 '기준 규범'이 분리되지 않음
