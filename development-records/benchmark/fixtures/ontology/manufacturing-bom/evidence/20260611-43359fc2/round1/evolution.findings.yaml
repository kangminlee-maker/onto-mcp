findings:
  - candidate_id: evolution-candidate-001
    target: manufacturing-bom-ontology.yaml > integrity_rules[0] (BOM 비순환 규칙의 자기포함 예외)
    evidence_anchor: 'integrity_rules[0]: "BOM은 비순환이어야 한다. 단, 재생 원료 회수 공정(스크랩 재투입)은
      Assembly가 자기 하위에 자신을 포함하는 형태로 모델링한다."'
    claim: 비순환 원칙에 자기포함 예외를 허용하여, DAG를 전제하는 PLM/MES/MRP 통합 및 향후 재활용 시나리오 확장 시 구조 충돌이
      발생한다.
    what: BOM 무결성 규칙이 '비순환'을 선언하면서 동시에 스크랩 재투입을 Assembly의 자기 자신 포함(자기 순환)으로 모델링하도록
      허용한다. 순환 허용 여부가 케이스별 예외로 처리되어 구조적 불변식이 아니게 된다.
    why: BOM 전개(explosion), MRP 소요량 계산, 원가 적산 등 PLM/MES의 핵심 알고리즘은 BOM이 DAG라는 전제 위에
      구현된다. 자기 순환 예외를 가진 데이터를 이 시스템들에 통합하면 무한 전개 또는 시스템별 임의 예외 처리가 발생하고, 스크랩 재투입
      외의 재활용·부산물 케이스가 추가될 때마다 예외 목록이 늘어나 비순환 규칙 자체가 무력화된다. 외부 시스템과의 통합 충돌과 확장
      한계가 동시에 예고되는 지점이다.
    how_to_fix: "비순환 규칙을 예외 없이 유지하고, 스크랩 재투입은 별도 개념(예: ByProduct/RecoveredMaterial
      산출 관계 또는 co-product 표기)으로 분리하여 BOM 그래프 밖에서 표현한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM 구조 불변식을 제공하는 역할
      failure_condition: DAG 전제의 외부 시스템(MRP, BOM 전개, 원가 적산)에 자기 순환 BOM 데이터가 유입되는 통합 시점
      impact: 기준 문서가 허용한 구조를 통합 대상 시스템이 수용하지 못해, 시스템별 임의 예외 처리 또는 데이터 거부가 발생하고 기준 문서의
        권위가 무너진다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml integrity_rules[0]
    causal_path:
      root_cause_candidate: 스크랩 재투입이라는 물질 흐름 개념을 BOM 구성 관계(BomLine)와 분리하지 않고 같은 그래프에 욱여넣은 개념 설계 결정
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 비순환 규칙에 자기포함 예외가 명시되어 BOM 그래프에 순환이 합법적으로 존재할 수 있다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml integrity_rules[0]
        - cause_id: evolution-candidate-001.cause-002
          claim: 스크랩 재투입을 표현할 별도 개념(부산물/회수 관계)이 엔티티·관계 목록에 없어, 기존 BomLine 구조를 변형하는 것 외의 표현
            수단이 없다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities, relations 섹션에 부산물/회수 개념
              부재
        - cause_id: evolution-candidate-001.cause-003
          claim: 물질 회수 흐름과 구성 관계를 단일 그래프 개념으로 합친 설계가 예외 규칙을 강제했다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml BomLine 정의 및 integrity_rules[0]
      unresolved_beyond_evidence: 실제 현장에서 스크랩 재투입 BOM이 이미 등록되어 있는지, 통합 대상 MES/MRP가 순환을
        어떻게 처리하는지는 본 문서 범위 밖이다.
  - candidate_id: evolution-candidate-002
    target: manufacturing-bom-ontology.yaml > BomLine (effectivity 부재) 및 ECO와의 연결 구조
    evidence_anchor: BomLine.attributes(parent_ref, child_ref, qty_per, scrap_rate만
      존재), ECO.attributes.affected_parts, integrity_rules[2]
    claim: BomLine에 유효기간(effectivity)·리비전 차원이 없어 ECO 기반 변경관리가 BOM 구조 수준에서 표현 불가능하고,
      변경 시 과거 BOM의 연속성이 끊긴다.
    what: ECO는 Part 단위(affected_parts)로만 연결되고, BOM 한 줄(BomLine)에는
      effective_date·rev·ECO 참조 같은 시간/버전 차원이 전혀 없다. 설계 변경으로 구성이 바뀌면 BomLine을
      덮어쓰는 것 외의 모델이 없다.
    why: PLM 변경관리의 핵심은 '어느 시점에 어떤 BOM 구성이 유효했는가'이다. effectivity 없는 BomLine은
      ECO.effective_date 규칙(integrity_rules[2])을 구조적으로 집행할 수 없게 하며, 변경 적용 시 구버전
      BOM이 소실되어 생산 이력 추적·리콜 범위 산정·구버전 정비용 BOM 조회가 불가능해진다. 새 ECO가 적용될 때마다 기존
      구조(BomLine 데이터)의 파괴적 수정이 필요하다는 점에서 전형적인 변경 내성 결함이다.
    how_to_fix: BomLine에 effective_from/effective_to(또는 eco_in/eco_out 참조)를 추가하여 BOM
      변경을 행 추가로 표현하고, ECO가 Part가 아닌 BomLine 변경 집합을 가리키도록 관계를 확장한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 품목·BOM·변경관리 개념 정합성을 보장하는 PLM/MES 통합 기준 문서 역할(요청 요지에 명시)
      failure_condition: ECO가 BOM 구성(qty 변경, 부품 교체)을 변경하는 모든 경우 — 제조업에서 가장 빈번한 변경 유형
      impact: 변경 전후 BOM의 동시 표현이 불가능해 effective_date 기반 생산 규칙이 집행 불가능한 선언으로 남고, MES가
        시점별 BOM을 조회할 수 없어 통합 기준 문서로서의 핵심 용도가 실패한다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml BomLine.attributes
        - manufacturing-bom-ontology.yaml ECO.affected_parts
        - manufacturing-bom-ontology.yaml integrity_rules[2]
    causal_path:
      root_cause_candidate: BOM을 시점 무관한 현재 상태 스냅샷으로 개념화하고, 변경관리(ECO)를 Part 메타데이터로만 부착한 설계 결정
      root_cause_step_id: evolution-candidate-002.cause-003
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: BomLine에 시간/버전 속성이 없어 변경 전후 구성을 동시에 표현할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml BomLine.attributes
        - cause_id: evolution-candidate-002.cause-002
          claim: ECO가 affected_parts로 Part에만 연결되어, ECO가 실제로 바꾸는 대상(BOM 구성·라우팅)과의 관계가 모델에
            없다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml ECO.attributes.affected_parts
            - "relations: {from: ECO, to: Part, kind: changes}"
        - cause_id: evolution-candidate-002.cause-003
          claim: 변경의 대상 단위를 Part로 잡은 개념화가 BOM 수준 effectivity의 필요성을 가려, 현재 상태 스냅샷 모델이
            채택되었다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml ECO 정의 및 integrity_rules[2]
      unresolved_beyond_evidence: 실제 PLM 시스템이 BOM effectivity를 자체 보유하고 본 온톨로지는 단순 참조만
        하는 운영 형태인지 여부는 문서 범위 밖이다.
  - candidate_id: evolution-candidate-003
    target: manufacturing-bom-ontology.yaml > Part.rev / Part.current_eco 동기화 규칙
    evidence_anchor: Part.rev note("도면 관리대장이 원본"), Part.current_eco note("ECO 시스템이
      원본"), integrity_rules[2]("Part.rev 갱신은 ... 주간 배치로 동기화")
    claim: 외부 원본(도면 관리대장, ECO 시스템)의 변경이 주간 배치로만 반영되어, ECO effective_date와 rev 사이에 최대
      1주의 불일치 창이 구조적으로 존재한다.
    what: rev와 current_eco는 외부 시스템이 원본인 복사 값인데, 동기화 주기가 주간 배치로 선언되어 있다. 반면
      integrity_rules[2]는 effective_date 이후 생산분이 신규 rev를 따라야 한다고 요구한다.
    why: 외부 표준(도면 리비전)이 변경되는 순간부터 배치 동기화까지의 기간 동안, 본 온톨로지를 기준으로 동작하는 MES는 구 rev로 생산
      지시를 내리게 된다. 이는 '외부 표준 변경 시 기존 데이터/규칙의 연속성이 유지되는가'라는 질문에 대해 문서 스스로 부정적 답을
      명문화한 것으로, 기준 문서가 자신의 무결성 규칙을 자신의 동기화 정책으로 위반한다.
    how_to_fix: rev/current_eco를 복사 저장하지 말고 원본 시스템 참조(조회 시점 해석)로 선언하거나, ECO 승인 이벤트
      기반 즉시 동기화로 정책을 바꾸고 주간 배치는 대사 용도로 격하한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: ECO effective_date 이후 생산분이 신규 rev를 따른다는 변경관리 무결성 규칙(integrity_rules[2])
      failure_condition: ECO effective_date와 주간 배치 사이 기간에 해당 품목의 생산 오더가 생성되는 경우
      impact: 구 리비전 도면으로 생산이 진행되어 품질·규격 부적합 리스크가 발생하고, 기준 문서의 무결성 규칙이 운영상 거짓이 되어 통합
        시스템 간 신뢰 기준이 사라진다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml Part.rev note
        - manufacturing-bom-ontology.yaml integrity_rules[2]
    causal_path:
      root_cause_candidate: 외부 시스템이 원본인 값을 온톨로지에 복사 속성으로 보유하면서 동기화 지연을 허용한 권위(authority) 설계 결정
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: effective_date 즉시 적용 규칙과 주간 배치 동기화 정책이 같은 문서 안에서 충돌한다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml integrity_rules[2]
        - cause_id: evolution-candidate-003.cause-002
          claim: rev/current_eco가 원본 참조가 아닌 복사 값이기 때문에 동기화 지연이 데이터 불일치로 직결된다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml Part.rev note
            - manufacturing-bom-ontology.yaml Part.current_eco note
        - cause_id: evolution-candidate-003.cause-003
          claim: 외부 원본 값의 보유 방식(복사 vs 참조)에 대한 권위 정책이 정의되지 않아 복사+배치 방식이 기본값이 되었다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml 전반에 원본-사본 동기화 계약 부재(Part.rev,
              scrap_rate, acceptance_criteria 모두 동일 패턴)
      unresolved_beyond_evidence: 주간 배치 외 긴급 수동 갱신 절차가 운영상 존재하는지는 문서 범위 밖이다.
  - candidate_id: evolution-candidate-004
    target: manufacturing-bom-ontology.yaml > BomLine.scrap_rate
    evidence_anchor: 'BomLine.scrap_rate note: "생산계획팀 엑셀로 별도 관리되는 값을 복사해 둔다."'
    claim: scrap_rate가 버전·동기화 계약 없는 엑셀 복사 값이어서, 원본 변경 시 온톨로지 데이터의 연속성과 정확성이 무보장 상태로
      단절된다.
    what: 공정 불량 계수가 외부 엑셀이 원본인 복사 값으로 선언되어 있으나, rev(주간 배치)와 달리 동기화 주기·책임·검증 절차가 전혀
      명시되지 않았다.
    why: MRP 소요량 계산에 직접 쓰이는 계수가 관리되지 않는 사본이면, 원본 엑셀이 갱신될 때마다 온톨로지 값은 조용히 낡는다.
      PLM/MES 통합 기준 문서가 '이 값은 신뢰할 수 없을 수 있다'는 단서 없이 값을 보유하는 것은 외부 변경에 대한 내성이 없는
      구조이며, 통합 시스템이 어느 쪽을 믿어야 하는지 결정할 수 없게 만든다.
    how_to_fix: scrap_rate의 원본 권위를 명시하고(생산계획 마스터로 이관 또는 온톨로지로 일원화), 사본으로 유지할 경우 최소한
      동기화 주기와 대사 절차를 rev와 동일하게 명문화한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM 기반 소요량·원가 계산의 입력 데이터 신뢰성(통합 기준 문서 역할)
      failure_condition: 생산계획팀이 엑셀 원본의 scrap_rate를 갱신했으나 온톨로지 사본이 갱신되지 않은 상태에서
        MES/MRP가 온톨로지 값을 소비하는 경우
      impact: 자재 소요량 과소/과대 산정이 발생하며, 어느 값이 맞는지 판정할 권위 기준이 문서에 없어 통합 시스템 간 분쟁을 해결할 수 없다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml BomLine.scrap_rate note
    causal_path:
      root_cause_candidate: 외부 관리 값의 복사 보유를 허용하면서 동기화 계약을 정의하지 않은 권위 설계 공백(rev 항목과 동일 패턴의 반복)
      root_cause_step_id: evolution-candidate-004.cause-003
      steps:
        - cause_id: evolution-candidate-004.cause-001
          claim: scrap_rate가 엑셀 원본의 비관리 사본으로 선언되어 있다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml BomLine.scrap_rate note
        - cause_id: evolution-candidate-004.cause-002
          claim: 동기화 주기·책임이 미정의되어 원본 변경이 사본에 전파될 보장이 없다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml integrity_rules에 scrap_rate 동기화 규칙
              부재
        - cause_id: evolution-candidate-004.cause-003
          claim: 원본-사본 권위 정책의 부재가 문서 전반(rev, current_eco, acceptance_criteria, std_time)에
            반복되는 공통 원인이다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml notes[0](std_time 수기 입력 분기 대사)
            - manufacturing-bom-ontology.yaml InspectionPlan.acceptance_criteria
              note
      unresolved_beyond_evidence: 엑셀 원본의 갱신 빈도와 실제 불일치 발생 이력은 문서 범위 밖이다.
  - candidate_id: evolution-candidate-005
    target: manufacturing-bom-ontology.yaml > Part.uom enum 및 notes[1] (uom 환산)
    evidence_anchor: 'Part.uom: {type: enum, values: [ea, kg, m]}, notes[1]: "uom
      변환(kg↔ea 등)은 품목별 환산계수 마스터가 없고, 필요 시 현장에서 환산한다."'
