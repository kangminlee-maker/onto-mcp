    target: manufacturing-bom-ontology.yaml integrity_rules[0] (BOM 비순환 규칙)
    evidence_anchor: manufacturing-bom-ontology.yaml:89
    claim: "단일 규칙 내에서 'BOM은 비순환이어야 한다'(necessary 제약)와 '스크랩 재투입은 Assembly가 자기 하위에 자신을
      포함하는 형태로 모델링한다'(자기순환 구조의 처방)가 동시 만족 불가능하다. [conflict_pair:
      integrity_rules[0]:89 ↔ integrity_rules[0]:89 / satisfiability_note:
      intra-claim — 동일 문장의 본문과 단서 조항이 직접 모순 / modality_note: necessary — 필수 불변식에
      대해 그 불변식을 위반하는 구조를 처방(modality 구분 오류: 예외를 '허용(possible)'이 아니라 '모델링
      방식(obligatory)'으로 선언) / boundary_handoff_note: 없음]"
    what: BOM 그래프에 대한 비순환 불변식을 선언하면서, 같은 문장에서 재생 원료 회수 공정을 자기 자신을 하위로 포함하는
      BomLine(길이 1의 순환)으로 모델링하라고 지시한다. 자기 포함은 정의상 순환이므로, 처방된 모델링 패턴을 사용하는 모든 BOM
      인스턴스는 비순환 규칙을 필연적으로 위반한다.
    why: 이 모순은 모호성 제거로 해소되지 않는 형식 모순이다. '비순환'의 표준 정의(BomLine parent→child 그래프에 사이클
      부재) 하에서 self-loop는 사이클이며, 규칙의 단서 조항이 그 사이클 생성을 의무화한다. PLM/MES 통합 기준 문서로서 이
      규칙을 그대로 구현하면 (a) BOM 검증기가 처방된 정상 데이터를 위반으로 거부하거나, (b) 예외를 묵인하면 MRP 전개·원가
      누적 같은 재귀 알고리즘이 self-loop에서 무한 전개되���나 임의의 비표준 종료 조건을 각 시스템이 제각각 구현하게 된다.
    how_to_fix: "비순환 규칙을 예외 없이 BomLine 그래프 전체에 적용하고, 스크랩 재투입은 BOM 구조 밖의 별도 개념(예:
      by-product/recovery flow 관계 또는 음수 산출 라인으로 BOM 전개에서 제외되는 명시 타입)으로 분리 모델링한다.
      가장 작은 수정은 integrity_rules[0]의 단서 조항을 삭제하고 '스크랩 재투입은 BomLine이 아닌 별도 관계로
      표현하며 BOM 전개 대상에서 제외한다'는 규칙으로 대체하는 것이다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM 구조 불변식을 통합 대상 시스템에 일관되게 제공하는 것 (파일
        헤더 2행의 선언 목적)
      failure_condition: 재생 원료 회수(스크랩 재투입)를 포함하는 품목이 하나라도 존재하는 순간, 처방된 모델링과 선언된 불변식이 동시에 성립할 수 없다
      impact: 통합 시스템들이 비순환 검증과 self-loop 허용 중 어느 쪽을 따를지 각자 선택하게 되어 기준 문서의 권위가 무력화되고,
        MRP 전개/원가 롤업의 종료 조건이 시스템별로 갈라진다
      evidence_refs:
        - manufacturing-bom-ontology.yaml:89
        - manufacturing-bom-ontology.yaml:24-30
        - manufacturing-bom-ontology.yaml:2
    causal_path:
