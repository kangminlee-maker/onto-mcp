            - manufacturing-bom-ontology.yaml:79-86
      unresolved_beyond_evidence: 실제 현장에서 스크랩 재투입을 BOM에 어떻게 기록하고 있는지(이미 self-loop 데이터가
        존재하는지)는 본 문서 범위 밖이다. 전용 개념 부재 자체는 structure lens의 1차 소유 범위이며, 본 finding은
        명시 claim 간 직접 모순으로 logic이 소유한다.
  - candidate_id: logic-candidate-002
    target: manufacturing-bom-ontology.yaml AlternatePart 엔티티 (정의 vs direction 속성)
    evidence_anchor: manufacturing-bom-ontology.yaml:33 vs manufacturing-bom-ontology.yaml:37-40
    claim: "AlternatePart 정의는 대체 관계의 대칭성을 무조건적(necessary)으로 선언하는데('A의 대체가 B이면 B의 대체도
      A다'), direction 속성은 one_way를 허용하고 기본값으로 삼아 비대칭 인스턴스를 기본 상태로 만든다. 두 claim은
      one_way 인스턴스에 대해 동시 만족 불가능하다. [conflict_pair: AlternatePart.definition:33
      ↔ AlternatePart.direction:37-40 / satisfiability_note: inter-claim — 동일
      엔티티 내 정의 claim과 속성 스키마 claim의 충돌이며, 관계 단축 표기(relations:86)도 방향성 표기를 따라 충돌에
      연루된다 / modality_note: mixed — 정의는 necessary(보편 함의)로 진술되었으나 속성은 이를
      possible(인스턴스별 선택)로 격하; modality 구분 오류가 충돌의 직접 원인 / boundary_handoff_note:
      정의 문장이 '의도된 기본 동작 설명'인지 '불변식'인지의 자연어 모호가 남아 있어 semantics lens 검토 대상이기도 하나,
      어느 해석을 취해도 one_way 기본값과 보편 대칭 선언 중 하나는 수정이 필요하므로 형식 모순은 모호 제거 후에도 잔존한다 —
      logic 소유 유지]"
    what: 같은 엔티티 안에서 정의 텍스트는 대칭성을 예외 없는 성질로 선언하고, 속성 스키마는 비대칭(one_way)을 기본값으로 선언한다.
      direction=one_way인 인스턴스는 정의를 위반하고, 정의를 따르면 one_way 값은 결코 유효하게 사용될 수 없는 죽은
      enum 값이 된다.
    why: "MES의 자재 대체 로직이 어느 claim을 따르느냐에 따라 실제 투입 가능 판정이 달라진다. 정의를 따르는 구현은 one_way
      레코드를 양방향으로 전개하여 의도하지 않은 역방향 대체(예: 상위 사양 부품 자리에 하위 사양 부품 투입)를 허용하고, 속성을 따르는
      구현은 정의 기반으로 작성된 다른 시스템과 대체 가능 집합이 불일치한다. 개념 기준 문서의 핵심 목적인 시스템 간 동일 해석이
      깨진다."
    how_to_fix: 정의 문장을 'direction=bidirectional인 경우 대칭이며, one_way는 primary→alternate
      방향만 허용한다'로 수정하여 대칭성을 조건부(possible)로 격하하는 것이 최소 수정이다. 대안으로 보편 대칭이 실제 의도라면
      direction 속성과 one_way 값을 제거한다. relations 목록의 alternate_of 단축 표기(86행)에도 선택한
      방향 의미를 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합 시 대체 부품 판정 로직의 단일 기준 제공 (문서 목적 선언 2행, AlternatePart 32-40행)
      failure_condition: direction=one_way인 AlternatePart 인스턴스가 존재하고 둘 이상의 소비 시스템이 각각
        정의와 속성 중 다른 쪽을 기준으로 구현한 경우
      impact: 역방향 대체 투입은 제조 현장에서 품질 부적합·사양 위반으로 직결될 수 있는 운영 위험이며, 어느 구현도 문서 위반이 아니라는
        점에서 기준 문서가 위험을 만들어내는 형태가 된다
      evidence_refs:
        - manufacturing-bom-ontology.yaml:33
        - manufacturing-bom-ontology.yaml:37-40
        - manufacturing-bom-ontology.yaml:86
    causal_path:
      root_cause_candidate: v2.0 작성 시 대칭 관계로 출발한 정의 텍스트와 이후 추가된 방향성 속성(one_way 기본) 사이의
        modality 정합화가 수행되지 않음 — 정의는 necessary 진술로 남고 속성은 그것을 부정하는 기본값을 도입
      root_cause_step_id: logic-candidate-002.cause-002
      steps:
        - cause_id: logic-candidate-002.cause-001
          claim: AlternatePart.definition(33행)은 무조건 대칭을, direction 기본값(40행)은 비대칭을 기본 상태로
            선언하여 one_way 인스턴스에서 두 claim이 충돌한다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:33
            - manufacturing-bom-ontology.yaml:37-40
        - cause_id: logic-candidate-002.cause-002
          claim: 정의 문장이 direction 속성 도입 후에도 무조건 보편 양화 형태로 유지된 것이 충돌의 직접 원인이다(조건부 재서술 누락)
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:33
            - manufacturing-bom-ontology.yaml:40
      unresolved_beyond_evidence: 어느 쪽이 실제 업무 의도인지(보편 대칭 vs 방향별 통제)는 본 문서만으로 판정할 수 없으며 도면/자재 담당의 확인이 필요하다.
  - candidate_id: logic-candidate-003
    target: manufacturing-bom-ontology.yaml integrity_rules[2] (rev 유효일 규칙 vs 주간 배치
      동기화)
    evidence_anchor: "manufacturing-bom-ontology.yaml:91 (참조: 15행 Part.rev note)"
    claim: "'ECO.effective_date 이후 생산분은 신규 rev를 따른다'는 obligatory 규칙이, 같은 문장이 인정하는
      'Part.rev는 주간 배치로만 갱신된다'는 상태 전개 claim과 시간 전개 경로 위에서 충돌한다. effective_date부터
      차주 배치 사이의 구간에서는 모델이 보유한 Part.rev로 이 의무를 만족시키는 것이 불가능하다. [conflict_pair:
      integrity_rules[2] 전반부:91 ↔ integrity_rules[2] 후반부:91 (보조: Part.rev:15) /
      satisfiability_note: intra-claim — 동일 규칙 문장의 의무 조항과 동기화 조항이 충돌하며, 신규 rev의
      실제 보유처(도면 관리대장)가 온톨로지 외부라는 점이 충돌을 비켜갈 수 없게 만든다 / modality_note: obligatory
      — 의무 규칙의 판정 조건이 지연 동기화되는 가역적 스냅숏 상태(Part.rev)에 의존하는 시간 전개 충돌 /
      boundary_handoff_note: Part.rev의 원본 권위가 외부 도면 관리대장에 있다는 의존 방향 문제는
      dependency lens 범위이나, 본 finding은 규칙 문장 내부의 형식 충돌로 logic이 소유한다]"
    what: 규칙이 effective_date 시점부터 신규 rev 준수를 의무화하면서, 그 의무 판정의 유일한 모델 내 근거인 Part.rev는
      최대 1주 지연 갱신됨을 같은 문장에서 선언한다. 지연 구간 동안 모델 상태(구 rev)와 의무(신 rev)가 양립 불가능하며, 신규
      rev 값 자체가 동기화 전에는 온톨로지 안에 존재하지 않는다.
    why: 이 온톨로지를 기준으로 MES가 생산 시점 rev 준수를 검증한다면, 지연 구간의 생산분은 규칙상 신규 rev를 따라야 하지만 시스템이
      아는 rev는 구 버전뿐이므로 (a) 구 rev로 생산을 통과시켜 규칙을 위반하거나 (b) 존재하지 않는 신 rev를 요구하며 생산을
      막는 것 중 하나가 강제된다. 설계변경 유효일 직후 생산분의 rev 추적성 단절은 리콜·품질 이력 관리에서 실질 위험이 되는
      구간이다.
    how_to_fix: 의무 규칙의 판정 근거를 Part.rev 스냅숏에서 분리한다. 최소 수정은 '생산 시점 유효 rev는 Part.rev가
      아니라 ECO(affected_parts, effective_date, status)로부터 도출한다'는 유효성(effectivity)
      해석 규칙을 명시하고, Part.rev를 캐시/투영 값으로 격하하는 것이다. 그렇지 않다면 의무 발효 시점을
      'effective_date와 rev 동기화 완료 중 늦은 시점'으로 재정의해 규칙과 상태 전개를 일치시킨다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 변경관리(ECO)와 생산 실행 간 rev 정합성 보장 — 요청 요지의 '변경관리 개념의 정합성과 제조 운영 위험' 핵심 축
      failure_condition: effective_date가 주간 배치 동기화보다 앞서는 모든 ECO에서 최대 1주의 지연 구간이 구조적으로
        발생한다 (예외가 아니라 규칙 자체가 보장하는 정상 경로)
      impact: 지연 구간 생산분의 rev 추적 기록이 규칙과 모순되거나 부재하게 되어, PLM/MES 통합의 변경관리 계약 자체를 이 문서가
        보증할 수 없다
      evidence_refs:
        - manufacturing-bom-ontology.yaml:91
        - manufacturing-bom-ontology.yaml:15
        - manufacturing-bom-ontology.yaml:64-70
    causal_path:
      root_cause_candidate: rev의 권위 원본(도면 관리대장)과 온톨로지 내 표현(Part.rev)의 비동기 복제를 사실로 수용한
        채, 의무 규칙은 권위 원본 시점 기준으로 작성되어 두 시간 축이 한 규칙 안에서 봉합되지 않음
      root_cause_step_id: logic-candidate-003.cause-003
      steps:
