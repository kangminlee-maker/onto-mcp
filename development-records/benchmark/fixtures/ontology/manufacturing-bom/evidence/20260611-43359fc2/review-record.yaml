      별도 관계로 분리하지 않은 모델링 결정이 016/025/032의 공통 뿌리이므로 이 패밀리의 root_cause로 분류한다. BOM
      전개 종료라는 연산 정확성을 직접 깨므로 correctness, 전 렌즈 high 유지로 대상 내 해소 필수.
