    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 6개 렌즈 전원이 지지하고 high를 유지한 권위 경계 미설계 이슈로, issue-010/019/031/037/043 등
      다수 권위 결함의 공통 상위 원인이다. 문서 notes와 속성 note에 외부 원본·복사 관행이 직접 명문화되어 있어
      observed. 기준 문서의 판정 권위라는 거버넌스 가치를 직접 무너뜨리므로 governance_value이며, 선언된 목적(기준
