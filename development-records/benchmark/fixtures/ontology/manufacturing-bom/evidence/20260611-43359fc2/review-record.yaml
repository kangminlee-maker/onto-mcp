      - finding-001
  - issue_id: issue-002
    problem_definition: 스크랩 재투입을 BomLine 자기 포함으로 모델링하는 국소 편의가 MES/MRP 전개가 의존하는 BOM
      비순환 불변식을 정당화 없이 훼손한다.
