    priority: 10
    conflict_type: root_hypothesis
    participating_lens_ids:
      - logic
      - coverage
    source_stance_refs:
      - issue-stance-matrix.yaml#stances.issue-027.logic
      - issue-stance-matrix.yaml#stances.issue-027.coverage
    conflict_summary: logic locates the root cause in the unreconciled dual time
      axes of integrity_rules[2] (authority copy with sync lag vs obligation
      written against the authoritative source), while coverage narrows the root
      cause upstream to the total absence of an effectivity/history dimension
      (finding-007, rel-012), arguing the intra-rule conflict could not arise if
      a time axis existed. Both keep severity high, but the competing root
      hypotheses imply different primary remediations (rule-level effectivity
      adjudication vs introducing a first-class time dimension).
    resolution_question: Is the root cause of the integrity_rules[2] temporal
      conflict the unsealed dual time axes within the rule itself, or the
      upstream absence of an effectivity/history concept dimension — and which
      proposed remediation (ECO-derived effectivity adjudication rule vs
      first-class effectivity modeling) should be canonical?
  - issue_id: issue-003
