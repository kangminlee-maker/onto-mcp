  - candidate_id: coverage-candidate-003
    target: 시스템 간 병행 관리 값의 권위 지정
    evidence_anchor: materialized-input.md:20-21, 35, 53, 82, 98-100
    claim: scrap_rate와 누적 표준시간 등 병행 관리 값에 단일 원본과 충돌 해결 규칙이 지정되지 않았다.
    what: rev, current_eco, acceptance_criteria에는 원본이 명시되지만 scrap_rate는 엑셀에서 복사한다고만
      되어 있다. 누적 std_time은 MES 계산값과 표준원가 시스템 수기값이 병존하며 분기 대사만 언급되고 어느 값이 권위 있는지
      없다.
    why: 같은 의미의 값이 여러 시스템에 존재하는데 권위, 동기화 방향, 허용 지연, 충돌 처리 기준이 없으면 통합 구현마다 서로 다른 값을
      채택할 수 있다.
    how_to_fix: 각 병행 관리 속성에 authoritative_system, derived_from,
      synchronization_direction, freshness/SLA, reconciliation_rule을 지정한다. 파생값은
      원천 Routing 버전에서 계산되는 내부 투영으로 정의하고 수기 사본의 권위를 제한한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 및 연계 시스템 사이에서 공유할 단일 개념 기준 제공
      failure_condition: 복사본·계산값·수기값이 서로 다르거나 동기화가 지연될 때 생산계획 또는 원가 계산이 값을 선택해야 하는 경우
      impact: 동일 개념에 복수의 사실이 생겨 계획량, 불량 여유, 표준원가가 시스템별로 달라지고 대사만으로는 자동 판정할 수 없다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:35
        - materialized-input.md:53
        - materialized-input.md:82
        - materialized-input.md:98-100
    causal_path:
      root_cause_candidate: 병행 관리 속성에 적용할 공통 데이터 권위·파생·동기화 계약이 부재하다.
      root_cause_step_id: coverage-candidate-003.cause-002
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: 시스템 간 값 불일치 시 어느 값을 채택해야 하는지 온톨로지가 결정하지 못한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:35
            - materialized-input.md:98-100
        - cause_id: coverage-candidate-003.cause-002
          claim: 일부 속성만 원본을 명시하고 scrap_rate와 누적 std_time에는 권위 및 충돌 규칙이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:20-21
            - materialized-input.md:35
            - materialized-input.md:82
            - materialized-input.md:98-100
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: Routing 및 ECO lifecycle
    evidence_anchor: materialized-input.md:55-61, 69-75
    claim: 라우팅과 변경지시의 lifecycle이 발행 이후 종료·무효화·정정 구간을 포괄하지 않는다.
    what: Routing은 draft와 released만, ECO는 open·approved·applied만 가진다. rejected,
      cancelled, superseded, obsolete, archived 같은 종결 상태와 적용 후 정정·재발행 사건이 없다.
    why: 발행된 라우팅의 단종이나 잘못 적용된 ECO의 취소·정정을 기존 상태 의미를 훼손하지 않고 표현할 수 없다. 삭제나 상태 덮어쓰기로
      처리하면 변경 이력이 손실될 수 있다.
    how_to_fix: 공통 LifecycleStatus를 무리하게 공유하기보다 각 개념의 실제 전이를 정의하고, Routing에는
      obsolete/superseded, ECO에는 rejected/cancelled/superseded를 추가한다. 정정 ECO가 원
      ECO를 대체·취소하는 관계와 허용 전이를 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 라우팅과 변경관리 상태를 PLM/MES가 일관되게 해석하도록 하는 개념 기준
      failure_condition: 발행 후 단종, 승인 거절, 적용 취소, 오류 정정 또는 재발행이 발생할 때
      impact: 현 상태값만으로 유효성 및 후속 조치를 판정할 수 없어 폐기된 공정이나 잘못된 변경이 생산에 남을 수 있다.
      evidence_refs:
        - materialized-input.md:55-61
        - materialized-input.md:69-75
    causal_path:
      root_cause_candidate: Routing과 ECO의 lifecycle이 정상 진행 경로까지만 모델링되고 종료·예외·정정 전이가 정의되지 않았다.
      root_cause_step_id: coverage-candidate-004.cause-002
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: 발행·적용 이후 무효화나 정정을 상태 의미와 모순 없이 표현할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:55-61
            - materialized-input.md:69-75
        - cause_id: coverage-candidate-004.cause-002
          claim: 두 상태 열거형 모두 정상 진행 상태만 포함하며 종료·예외 상태와 대체 관계가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:61
            - materialized-input.md:75
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-005
    target: MES 실행과 계획 기준 사이의 연결 범위
    evidence_anchor: materialized-input.md:47-67, 84-96
    claim: 생산오더를 규칙에서 사용하지만 이를 비롯한 MES 실행·실적·추적 개념이 표현되어 있지 않다.
    what: 모델은 계획 객체인 Routing, Operation, WorkCenter만 정의한다. 생산오더 생성 규칙이 있으나
      ProductionOrder 엔티티가 없고, 공정 실행, 자재 투입·소비, 생산 산출, 로트/일련번호, 실제 시간·불량 및
      genealogy 개념도 없다.
    why: PLM의 제품·공정 정의가 MES의 실제 생산 단위와 어떻게 결합되는지 표현할 수 없다. 따라서 어떤 BOM·라우팅·ECO 기준선이
      실제 제품에 적용되었는지 추적할 통합 접점이 없다.
    how_to_fix: 최소 실행 브리지로 ProductionOrder, OperationExecution, MaterialConsumption,
      ProductionOutput 및 Lot/Serial을 추가하고 계획 BOM/라우팅 버전과 실제 투입·산출을 연결한다. 실행 영역이
      의도적으로 범위 밖이면 PLM-MES 통합 기준이라는 목적과 경계를 명시적으로 축소한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서 역할
      failure_condition: released 라우팅으로 생산오더를 생성하고 실제 투입·공정·산출 또는 변경 적용 결과를 추적해야 할 때
      impact: 계획 마스터와 MES 실행 사이의 핵심 계약이 비어 있어 통합 구현과 제조 추적성에 대한 기준 문서 역할을 수행하지 못한다.
      evidence_refs:
        - materialized-input.md:47-67
        - materialized-input.md:84-96
    causal_path:
      root_cause_candidate: 온톨로지의 범위가 제조 계획 마스터에 머물러 있고 MES 실행을 연결하는 최소 경계 개념이 부재하다.
      root_cause_step_id: coverage-candidate-005.cause-002
      steps:
        - cause_id: coverage-candidate-005.cause-001
          claim: 실제 생산 단위가 어떤 계획·변경 기준으로 수행됐는지 표현할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:84-96
        - cause_id: coverage-candidate-005.cause-002
          claim: 생산오더는 무정의 참조로만 등장하고 실행·투입·산출·추적 엔티티가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:12-82
            - materialized-input.md:95
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-006
    target: 품목별 단위 변환
    evidence_anchor: materialized-input.md:14-20, 29-35, 98-100
    claim: 혼합 단위 BOM을 정규화할 품목별 환산계수와 그 적용 범위가 없다.
    what: Part.uom은 ea, kg, m 중 하나만 저장하고 BomLine.qty_per에는 별도 단위나 환산 참조가 없다. 문서는 품목별
      환산계수 마스터가 없고 현장에서 환산한다고 명시한다.
    why: 중량·개수·길이가 섞인 BOM에서 요구량, 소비량과 재고를 결정적으로 변환할 수 없다. 현장별 임의 환산은 생산계획 및 실적 대사의
      불일치를 만든다.
    how_to_fix: PartUnitConversion을 추가해 part_ref, from_uom, to_uom, factor,
      rounding_rule, effective interval 및 권위 시스템을 정의하고 BomLine과 생산 실적이 해당 변환 버전을
      참조하도록 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품목과 BOM 수량을 PLM/MES가 동일하게 해석하도록 하는 개념 기준
      failure_condition: 상·하위 품목 또는 계획·실적이 서로 다른 단위를 사용해 수량 변환이 필요한 경우
      impact: 소요량과 소비량을 재현 가능하게 계산할 수 없어 자재 부족, 과다 투입 및 재고 대사 오류가 발생할 수 있다.
      evidence_refs:
        - materialized-input.md:14-20
        - materialized-input.md:29-35
        - materialized-input.md:98-100
    causal_path:
      root_cause_candidate: 단위 변환을 품목별 관리 개념으로 승격하지 않고 현장 행위에 맡겼다.
      root_cause_step_id: coverage-candidate-006.cause-002
      steps:
