          claim: 특정 과거 생산 시점에 사용된 BOM과 라우팅 버전을 식별할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:55-61
            - materialized-input.md:93-96
        - cause_id: coverage-candidate-001.cause-002
          claim: BomLine과 Routing에는 버전·유효기간이 없고 Part는 현재 rev와 최신 ECO만 보유한다.
          relation_to_previous: symptom_of
          evidence_refs:
