  - candidate_id: coverage-candidate-002
    target: 승인·수동 복사·대사 행위의 감사 증거
    evidence_anchor: materialized-input.md:35, 69-75, 82, 96, 98-100
    claim: 통제 행위의 행위자·시각·근거·원본 스냅샷을 표현하는 감사 개념이 없다.
    what: ECO에는 approved 상태만 있고 승인자, 승인시각, 근거가 없다. scrap_rate 복사, 표준원가 수기 입력·분기 대사,
      현장 단위 환산도 행위와 증거를 기록할 구조가 없다.
    why: 상태값과 현재 수치만으로는 누가 어떤 근거로 승인하거나 수동 조정했는지 검증할 수 없다. PLM/MES 간 불일치나 제조 오류 발생 시
      책임 있는 변경과 비인가 변경을 구분하기 어렵다.
    how_to_fix: Approval 및 AuditEvent/ManualAdjustment 개념을 추가해 actor, occurred_at,
      reason, source_system, source_record/version, before/after value를 보존하고 ECO
      승인·복사·대사·현장 환산에 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 변경관리와 제조 운영 통제에 신뢰 가능한 통합 기준을 제공하는 목적
      failure_condition: ECO 승인 또는 수동 관리값의 오류·불일치를 조사하거나 승인 적법성을 입증해야 할 때
      impact: 통제 행위의 증거가 없어 변경 추적, 원인 분석, 감사 및 책임 판정이 불가능하거나 수작업에 의존한다.
      evidence_refs:
        - materialized-input.md:35
        - materialized-input.md:69-75
        - materialized-input.md:96
        - materialized-input.md:98-100
    causal_path:
      root_cause_candidate: 상태 변경과 수동 데이터 조작을 일급 감사 사건으로 표현하는 공통 증거 모델이 부재하다.
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: 승인과 수동 조정의 행위자·시각·근거를 온톨로지에서 재구성할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-75
            - materialized-input.md:98-100
        - cause_id: coverage-candidate-002.cause-002
          claim: ECO는 승인 상태만 보유하고, 복사·대사·환산은 자유서술 메모로만 존재한다.
          relation_to_previous: symptom_of
