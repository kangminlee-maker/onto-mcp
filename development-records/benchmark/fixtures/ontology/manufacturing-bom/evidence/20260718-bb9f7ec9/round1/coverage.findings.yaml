  - candidate_id: coverage-candidate-001
    target: BOM·라우팅·ECO의 시점별 구성 기준선
    evidence_anchor: materialized-input.md:20-21, 29-35, 55-61, 69-75, 93-96
    claim: 과거 시점에 유효했던 BOM과 라우팅을 재구성할 버전·효력 범위 개념이 없다.
    what: Part에는 현재 rev와 최신 ECO만 있고, BomLine과 Routing에는 revision, 유효 시작·종료, 대체 관계 또는
      구성 기준선이 없다. ECO의 effective_date도 변경 전후 객체 버전을 식별하지 않는다.
    why: 변경 적용일 규칙만으로는 특정 생산일·오더에 사용된 BOM 수량과 공정 순서를 결정할 수 없다. 주간 배치 지연까지 명시되어 있어
      PLM과 MES의 현재값이 달라지는 기간에는 재현성과 추적성이 특히 약해진다.
    how_to_fix: PartRevision, BomRevision, RoutingRevision 또는 통합
      ConfigurationBaseline을 도입하고, released 버전을 불변으로 관리한다. 날짜·로트·일련번호 등 필요한
      effectivity 범위와 선후 버전, ECO 적용 결과를 명시적으로 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 품목·BOM·라우팅·변경관리의 개념 기준을 제공하는 목적
      failure_condition: 변경 적용 전후 또는 PLM-MES 동기화 지연 중 특정 생산 시점의 제품 구조와 공정을 판정해야 할 때
      impact: 생산 기준선과 변경 적용 증거를 재구성할 수 없어 오구성 생산, 감사 실패 및 시스템 간 분쟁 가능성이 생긴다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:29-35
        - materialized-input.md:55-61
        - materialized-input.md:69-75
        - materialized-input.md:93-96
    causal_path:
      root_cause_candidate: Part·BOM·Routing·ECO를 하나의 버전화된 구성 기준선과 effectivity 모델로 묶는 개념이 부재하다.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
