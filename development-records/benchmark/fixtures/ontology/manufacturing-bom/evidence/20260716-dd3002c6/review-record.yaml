        가정을 사용했다.
      - InspectionPlan은 검사 실행 행위 자체가 아니라 실행을 규율하는 계획·규격 객체라는 문서 자체의 표현을 따랐다.
      - 비율(rate), 계수(factor), 처리량, 가용시간은 산식과 차원이 다른 개념이라는 일반 수량 의미론을 사용했다.
