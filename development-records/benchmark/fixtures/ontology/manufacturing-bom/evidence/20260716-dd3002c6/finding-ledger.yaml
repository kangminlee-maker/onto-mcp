        구현을 요구한다는 점은 명시된 모델에서 확인된다.
  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260716-dd3002c6/round1/coverage.findings.yaml#coverage-candidate-001
    target: manufacturing-bom-ontology.yaml의 BOM·라우팅 구성 및 변경 적용 모델
    evidence_anchor: Assembly.attributes.bom_lines, Part.attributes.rev/current_eco,
      Routing.attributes.operations/status, ECO.attributes.effective_date,
      integrity_rules[3]
    claim: BOM과 라우팅의 버전·유효기간·구성 이력이 표현되지 않아 과거 및 적용시점 구성을 재구성할 수 없다.
    lens_rationale_summary: ECO 유효일과 주간 배치 동기화 사이에는 의도된 설계와 동기화된 Part.rev가 달라질 수 있다.
      어느 생산분이 어떤 BOM·라우팅 구성을 사용해야 했는지 온톨로지만으로 판정하거나 사후 재구성할 수 없어 PLM/MES 기준 문서의
      변경 적용 추적성이 약화된다.
    proposed_action: BOM 및 Routing을 식별 가능한 버전 엔티티로 승격하고, 각 버전에 상태와 유효구간, 적용 범위, 선행
      버전, ECO 참조를 둔다. 생산 적용 판단은 변경 가능한 current 필드가 아니라 해당 버전의 effectivity를 참조하도록
