    target: manufacturing-bom-ontology.yaml — AlternatePart connectivity
    evidence_anchor: materialized-input.md:37-45,84-91
    claim: AlternatePart is absent from the explicit relation graph even though
      alternate_of is documented as being represented through it.
    lens_rationale_summary: A consumer traversing the declared relation graph cannot
      reach the association entity that owns substitution direction. This breaks
      the model’s stated representation and weakens its use as a shared PLM/MES
      conceptual baseline.
    proposed_action: Make AlternatePart the canonical relation entity by adding
      explicit Part-to-AlternatePart connections for the primary and alternate
      roles, then define the Part-to-Part alternate_of edge as a derived
      projection rather than the sole graph connection.
    affected_purpose: Provide a structurally coherent conceptual baseline for
      PLM/MES item and substitute-part integration.
    failure_condition: When consumers use the explicit relations section to discover
      alternate-part paths, they cannot reach AlternatePart.direction or
      distinguish the two endpoint roles.
    impact: Integrations can omit or misapply directional substitution constraints
      because the relationship metadata is disconnected from the published
      graph.
