      impact: 동일 품목에 대해 PLM과 MES가 서로 다른 유효 리비전을 사용할 수 있어 잘못된 자재·공정 기준으로 생산될 수 있다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:69-75
        - materialized-input.md:93-96
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 변경 효력의 권위가 ECO, 도면 관리대장, Part.rev로 분산되어 있으나 원자적 유효 구성과 불일치
        처리 규칙이 모델링되지 않았다.
      root_cause_step_id: finding-001.cause-002
      steps:
        - cause_id: finding-001.cause-001
          claim: ECO 효력일 이후 신규 리비전을 요구하면서 Part.rev 갱신은 주간 배치로 지연한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:93-96
        - cause_id: finding-001.cause-002
          claim: Part.rev와 current_eco가 서로 다른 외부 원본을 가리키며 특정 시점의 일관된 구성 관계를 표현하지 않는다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:20-21
            - materialized-input.md:69-75
      unresolved_beyond_evidence: 실제 배치 지연 중 MES의 보완 통제가 있는지는 경계 내 증거로 확인할 수 없지만, 개념 기준 문서 자체에는 해당 통제가 없다.
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260716-dd3002c6/round1/axiology.findings.yaml#axiology-candidate-002
    target: Operational master-data authority for scrap and standard time
    evidence_anchor: "Value authority:
      .onto/review/20260716-dd3002c6/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8 — “PLM/MES 통합의 개념 기준 문서…제조 운영 위험”; target evidence:
      materialized-input.md:29-35,47-53,98-99."
    claim: value_type=tradeoff; alignment_direction=misaligned — 수기 복제와 저빈도 대사를 허용한
      편의성 트레이드오프가 공통 개념 기준의 신뢰성을 약화한다.
    lens_rationale_summary: BOM 소요량, 계획, 원가가 동일 개념에 대해 서로 다른 값을 사용할 수 있다. 온톨로지가 중복
      값을 단순 속성으로 노출하면서 권위와 신선도를 표현하지 않아 통합 기준이 불일치를 해소하지 못하고 오히려 정상 상태처럼 보이게 한다.
    proposed_action: scrap rate와 표준시간을 버전·유효기간·소유 시스템·단위가 있는 권위 개념으로 모델링하고 복사본은 파생
      투영으로 구분한다. 불일치 우선순위, 허용 신선도 및 임계 초과 시 사용 차단 규칙을 정의한다.
    affected_purpose: PLM/MES 간 BOM·라우팅 운영값의 신뢰 가능한 공통 의미 제공
    failure_condition: 복사 또는 수기 입력 이후 원본 값이 변경되고 다음 대사 전 계획·원가 계산이 수행될 때
    impact: 동일 BOM과 라우팅에서 소요량 및 표준원가가 시스템별로 달라져 운영 판단과 대사의 신뢰성이 낮아진다.
    evidence_refs:
      - .onto/review/20260716-dd3002c6/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:29-35
      - materialized-input.md:47-53
      - materialized-input.md:98-99
      - review-value-alignment-criteria.yaml:6-8
