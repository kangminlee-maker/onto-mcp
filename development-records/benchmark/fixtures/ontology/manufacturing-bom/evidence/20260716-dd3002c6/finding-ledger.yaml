      root_cause_candidate: 운영값의 권위·계보·시간 유효성을 모델링하지 않고 수기 복제본을 정규 속성과 동등하게 취급한다.
      root_cause_step_id: finding-002.cause-002
      steps:
        - cause_id: finding-002.cause-001
          claim: scrap_rate가 별도 엑셀에서 복사되고 표준원가의 시간 값은 수기로 중복 입력되어 분기별로만 대사된다.
