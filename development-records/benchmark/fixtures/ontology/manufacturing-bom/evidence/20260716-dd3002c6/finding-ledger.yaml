        기준으로서 그 의미를 제공하지 않는 문제는 경계 내에서 확인된다.
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260716-dd3002c6/round1/axiology.findings.yaml#axiology-candidate-003
    target: Units of measure and capacity semantics
    evidence_anchor: "Value authority:
      .onto/review/20260716-dd3002c6/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8 — “PLM/MES 통합의 개념 기준 문서…제조 운영 위험”; target evidence:
      materialized-input.md:14-19,29-35,63-67,98-100."
    claim: value_type=commitment; alignment_direction=misaligned — 단위가 없는 수량·능력과 현장
      수기 환산은 시스템 간 계산 가능한 공통 기준이라는 목적에 부합하지 않는다.
    lens_rationale_summary: BOM 소요량과 작업장 능력을 시스템이 동일한 방식으로 해석하거나 검증할 수 없다. 사람마다 다른
      환산이 적용될 수 있어 계획 수량, 자재 부족 및 능력 부하 계산이 재현 불가능해진다.
    proposed_action: 수량과 능력을 값+단위의 typed measure로 모델링하고, capacity의 분모와 시간 구간을 명시한다.
      품목별 버전 관리 환산계수와 유효기간을 권위 데이터로 추가하고 환산 불가 시 계산을 실패시키도록 한다.
    affected_purpose: PLM/MES 통합에서 BOM 수량과 제조 능력의 기계 해석 가능하고 재현 가능한 의미 제공
    failure_condition: 서로 다른 단위의 품목 또는 작업장을 포함한 계획·소요량·능력 계산을 수행할 때
    impact: 동일 데이터로도 시스템 또는 현장 담당자마다 다른 계산 결과가 나와 제조계획 신뢰성이 약화된다.
