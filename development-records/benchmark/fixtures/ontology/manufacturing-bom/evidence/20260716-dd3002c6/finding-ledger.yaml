    claim: value_type=tradeoff; alignment_direction=misaligned — 공정 재투입을 BOM 자기포함으로
      표현하는 국소적 편의가 BOM 구조의 안정성과 통합 목적을 훼손한다.
    lens_rationale_summary: 일반적인 BOM 전개, 소요량 계산 및 순환 검증은 자기참조에서 종료 조건을 잃거나 특수 처리에
      의존한다. MES의 재투입 흐름을 표현하려는 편의 때문에 PLM의 제품구조 기준이 불안정해진다.
    proposed_action: BOM 구성 관계는 비순환으로 유지하고, 스크랩 회수·재투입은 수율, 부산물 또는 별도의 공정
      material-flow 관계로 분리한다. 흐름별 수량·단위·회수율과 종료 조건을 명시한다.
    affected_purpose: PLM 제품구조와 MES 공정 흐름을 정합적으로 연결하는 안정된 BOM 개념 기준
    failure_condition: 자기참조 재투입 구조를 일반 BOM 전개나 소요량 계산에 입력할 때
