findings:
  - candidate_id: axiology-candidate-001
    target: ECO effectivity and Part revision synchronization
    evidence_anchor: "Value authority:
      .onto/review/20260716-dd3002c6/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8 — “PLM/MES 통합의 개념 기준 문서…변경관리 개념의 정합성과 제조 운영 위험”;
      target evidence: materialized-input.md:20-21,69-75,93-96."
    claim: value_type=purpose; alignment_direction=misaligned — ECO 효력 발생과 Part 리비전
      반영 사이의 의도된 지연이 통합 기준의 일관성을 훼손한다.
    what: 신규 리비전은 ECO.effective_date부터 적용해야 하지만 Part.rev는 도면 관리대장에서 주간 배치로 갱신된다. 그
      사이 어떤 리비전이 생산에 유효한지 온톨로지 자체로 판정할 수 없다.
    why: PLM의 변경 효력과 MES가 읽는 품목 상태가 시간적으로 어긋날 수 있다. released 라우팅만 확인해 생산 오더를 생성하면 효력
      발생 후에도 구 리비전 기준 생산이 허용될 수 있어, 변경관리 정합성과 제조 위험 통제라는 선언된 목적이 실패한다.
    how_to_fix: ECO, Part revision, BOM 및 Routing 버전을 하나의 효력 구성으로 연결하고 유효 시작 시점과 상태를
      명시한다. 동기화 불일치 시 생산 오더를 차단하거나 원본의 as-of 값을 직접 사용하도록 규칙을 추가한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 변경관리의 단일하고 실행 가능한 개념 기준 제공
      failure_condition: ECO 효력일이 지났지만 주간 배치가 Part.rev를 아직 갱신하지 않은 기간에 생산 오더가 생성될 때
      impact: 동일 품목에 대해 PLM과 MES가 서로 다른 유효 리비전을 사용할 수 있어 잘못된 자재·공정 기준으로 생산될 수 있다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:69-75
        - materialized-input.md:93-96
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 변경 효력의 권위가 ECO, 도면 관리대장, Part.rev로 분산되어 있으나 원자적 유효 구성과 불일치
        처리 규칙이 모델링되지 않았다.
      root_cause_step_id: axiology-candidate-001.cause-002
      steps:
        - cause_id: axiology-candidate-001.cause-001
          claim: ECO 효력일 이후 신규 리비전을 요구하면서 Part.rev 갱신은 주간 배치로 지연한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:93-96
        - cause_id: axiology-candidate-001.cause-002
          claim: Part.rev와 current_eco가 서로 다른 외부 원본을 가리키며 특정 시점의 일관된 구성 관계를 표현하지 않는다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:20-21
            - materialized-input.md:69-75
      unresolved_beyond_evidence: 실제 배치 지연 중 MES의 보완 통제가 있는지는 경계 내 증거로 확인할 수 없지만, 개념 기준 문서 자체에는 해당 통제가 없다.
  - candidate_id: axiology-candidate-002
    target: Operational master-data authority for scrap and standard time
    evidence_anchor: "Value authority:
      .onto/review/20260716-dd3002c6/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8 — “PLM/MES 통합의 개념 기준 문서…제조 운영 위험”; target evidence:
      materialized-input.md:29-35,47-53,98-99."
    claim: value_type=tradeoff; alignment_direction=misaligned — 수기 복제와 저빈도 대사를 허용한
      편의성 트레이드오프가 공통 개념 기준의 신뢰성을 약화한다.
    what: scrap_rate는 생산계획팀 엑셀 값을 복사하고, 누적 std_time은 MES 계산값과 표준원가 시스템의 수기 입력값을 분기마다
      대사한다. 값의 원본 버전, 유효기간, 갱신 상태, 불일치 우선순위가 모델에 없다.
    why: BOM 소요량, 계획, 원가가 동일 개념에 대해 서로 다른 값을 사용할 수 있다. 온톨로지가 중복 값을 단순 속성으로 노출하면서 권위와
      신선도를 표현하지 않아 통합 기준이 불일치를 해소하지 못하고 오히려 정상 상태처럼 보이게 한다.
    how_to_fix: scrap rate와 표준시간을 버전·유효기간·소유 시스템·단위가 있는 권위 개념으로 모델링하고 복사본은 파생 투영으로
      구분한다. 불일치 우선순위, 허용 신선도 및 임계 초과 시 사용 차단 규칙을 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 간 BOM·라우팅 운영값의 신뢰 가능한 공통 의미 제공
      failure_condition: 복사 또는 수기 입력 이후 원본 값이 변경되고 다음 대사 전 계획·원가 계산이 수행될 때
      impact: 동일 BOM과 라우팅에서 소요량 및 표준원가가 시스템별로 달라져 운영 판단과 대사의 신뢰성이 낮아진다.
      evidence_refs:
        - materialized-input.md:29-35
        - materialized-input.md:47-53
        - materialized-input.md:98-99
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 운영값의 권위·계보·시간 유효성을 모델링하지 않고 수기 복제본을 정규 속성과 동등하게 취급한다.
      root_cause_step_id: axiology-candidate-002.cause-002
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: scrap_rate가 별도 엑셀에서 복사되고 표준원가의 시간 값은 수기로 중복 입력되어 분기별로만 대사된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:35
            - materialized-input.md:98-99
        - cause_id: axiology-candidate-002.cause-002
          claim: 해당 속성에는 source, version, valid-time, freshness 또는 conflict-resolution 의미가
            없다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:47-53
      unresolved_beyond_evidence: 외부 시스템에 별도 계보 통제가 존재하는지는 확인되지 않았지만, 이 문서가 통합 개념
        기준으로서 그 의미를 제공하지 않는 문제는 경계 내에서 확인된다.
  - candidate_id: axiology-candidate-003
    target: Units of measure and capacity semantics
    evidence_anchor: "Value authority:
      .onto/review/20260716-dd3002c6/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8 — “PLM/MES 통합의 개념 기준 문서…제조 운영 위험”; target evidence:
      materialized-input.md:14-19,29-35,63-67,98-100."
    claim: value_type=commitment; alignment_direction=misaligned — 단위가 없는 수량·능력과 현장
      수기 환산은 시스템 간 계산 가능한 공통 기준이라는 목적에 부합하지 않는다.
    what: Part.uom은 제한된 열거형이지만 BomLine.qty_per와 WorkCenter.capacity_per_shift에는 단위가
      결합되지 않는다. 작업장별 capacity 단위가 개수 또는 시간으로 달라지고 kg↔ea 환산은 마스터 없이 현장에서 수행된다.
    why: BOM 소요량과 작업장 능력을 시스템이 동일한 방식으로 해석하거나 검증할 수 없다. 사람마다 다른 환산이 적용될 수 있어 계획 수량,
      자재 부족 및 능력 부하 계산이 재현 불가능해진다.
    how_to_fix: 수량과 능력을 값+단위의 typed measure로 모델링하고, capacity의 분모와 시간 구간을 명시한다. 품목별
      버전 관리 환산계수와 유효기간을 권위 데이터로 추가하고 환산 불가 시 계산을 실패시키도록 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 BOM 수량과 제조 능력의 기계 해석 가능하고 재현 가능한 의미 제공
      failure_condition: 서로 다른 단위의 품목 또는 작업장을 포함한 계획·소요량·능력 계산을 수행할 때
      impact: 동일 데이터로도 시스템 또는 현장 담당자마다 다른 계산 결과가 나와 제조계획 신뢰성이 약화된다.
      evidence_refs:
        - materialized-input.md:14-19
        - materialized-input.md:29-35
        - materialized-input.md:63-67
        - materialized-input.md:98-100
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 측정값을 단위가 결합된 개념으로 모델링하지 않고 환산 권위를 현장 판단에 위임했다.
      root_cause_step_id: axiology-candidate-003.cause-002
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: capacity_per_shift의 단위가 작업장마다 다르고 품목별 환산계수 없이 현장 환산을 요구한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:63-67
            - materialized-input.md:98-100
        - cause_id: axiology-candidate-003.cause-002
          claim: qty_per와 capacity_per_shift가 단위 차원 및 환산 규칙을 참조하지 않는 무차원 number로 정의된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:63-67
      unresolved_beyond_evidence: null
  - candidate_id: axiology-candidate-004
    target: BOM acyclicity exception for recycled-material return
    evidence_anchor: "Value authority:
      .onto/review/20260716-dd3002c6/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8 — “BOM/공정 온톨로지가 PLM/MES 통합의 개념 기준 문서로 적절한지”; target
      evidence: materialized-input.md:23-35,93-95."
    claim: value_type=tradeoff; alignment_direction=misaligned — 공정 재투입을 BOM 자기포함으로
      표현하는 국소적 편의가 BOM 구조의 안정성과 통합 목적을 훼손한다.
    what: BOM 비순환 원칙을 선언하면서 재생 원료 회수는 Assembly가 자기 자신을 하위에 포함하는 예외로 모델링한다. 자재 구성과 공정
      물류 흐름이라는 서로 다른 개념을 하나의 BOM 관계에 겹친다.
    why: 일반적인 BOM 전개, 소요량 계산 및 순환 검증은 자기참조에서 종료 조건을 잃거나 특수 처리에 의존한다. MES의 재투입 흐름을
      표현하려는 편의 때문에 PLM의 제품구조 기준이 불안정해진다.
    how_to_fix: BOM 구성 관계는 비순환으로 유지하고, 스크랩 회수·재투입은 수율, 부산물 또는 별도의 공정 material-flow
      관계로 분리한다. 흐름별 수량·단위·회수율과 종료 조건을 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM 제품구조와 MES 공정 흐름을 정합적으로 연결하는 안정된 BOM 개념 기준
      failure_condition: 자기참조 재투입 구조를 일반 BOM 전개나 소요량 계산에 입력할 때
      impact: 통합 소비자가 서로 다른 예외 해석을 구현해야 하며, 무한 전개 또는 잘못된 소요량 계산 위험이 발생한다.
      evidence_refs:
        - materialized-input.md:23-35
        - materialized-input.md:93-95
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 제품 구성과 공정 내 물질 순환을 별도 개념으로 분리하지 않고 BOM containment에 통합했다.
      root_cause_step_id: axiology-candidate-004.cause-002
      steps:
        - cause_id: axiology-candidate-004.cause-001
          claim: 비순환이어야 하는 BOM에 자기포함 예외를 동시에 허용한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:93-95
        - cause_id: axiology-candidate-004.cause-002
          claim: 재생 원료 회수라는 공정 흐름을 Assembly-BomLine-Part 구성 관계로 표현한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:23-35
            - materialized-input.md:93-95
      unresolved_beyond_evidence: 실제 소비자에 순환 전개 방지 로직이 있는지는 확인되지 않지만, 개념 기준이 소비자별 예외
        구현을 요구한다는 점은 명시된 모델에서 확인된다.
