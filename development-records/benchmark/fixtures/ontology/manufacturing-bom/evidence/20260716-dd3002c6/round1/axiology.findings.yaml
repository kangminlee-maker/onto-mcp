    해석할 수 있어야 한다는 목적을 포함한다고 보았다.
  - 생산 오더, 소요량, 표준시간 및 작업장 능력에 관한 명시적 규칙과 주석은 해당 값들이 제조 운영 의사결정에 사용된다는 문맥을 제공한다고
    보았다.
  - session_domain이 none이고 context-candidate-assembly.yaml의 system_purpose_refs와
