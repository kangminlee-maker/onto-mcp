per_lens_provenance:
  axiology:
    domain_constraints_used: []
    domain_context_assumptions:
      - 리뷰 요청에 명시된 ‘PLM/MES 통합의 개념 기준 문서’는 두 시스템이 동일한 운영 개념과 판정 기준을 소비할 수 있어야
        한다는 목적 약속으로 해석했다.
      - 제조 운영 위험 평가는 요청문에 명시된 범위이며, 별도의 제조 도메인 규정이나 외부 표준은 사용하지 않았다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - 선언된 목적에 따라 이 문서는 단순 데이터 사전이 아니라 PLM과 MES가 품목·BOM·라우팅·변경의 의미를 공유하기 위한
        기준으로 사용된다고 보았다.
      - 생산 시점의 적용 구성 재현, 릴리스·변경의 감사 추적, 단위가 다른 수량의 일관된 계산은 제조 운영에서 필요한 개념 차원이라고
        가정했다.
      - 외부 표준이나 세션 도메인 문서는 사용하지 않았으며, 누락 판단은 대상 문서의 선언된 통합 범위와 내부 운영 서술에 한정했다.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합 기준은 과거 생산 오더가 사용한 제품 구조와 라우팅을 재현할 수 있어야 한다.
      - 제조 통합 범위가 확장되면 복수 ECO, 날짜 외 효력 조건, 추가 단위, 다공장 또는 대체 작업장을 수용할 가능성이 있다.
      - 이 가정들은 session_domain이 none이므로 외부 도메인 문서의 규칙이 아니라 변경 내성 시나리오로만 사용했다.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - 문서 자체의 enum 값과 설명에 따라 one_way를 A→B만 성립하고 B→A는 요구하지 않는 방향성으로 해석했다.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - 외부 도메인 문서나 표준은 사용하지 않았으며, 의미 판정은 대상 문서 자체의 정의와 관계에 한정했다.
      - Operation은 실행되는 공정 단계이고 Plan은 그 실행을 규정하는 정보 객체라는 대상 문서의 표현을 구분해 해석했다.
      - 개수와 시간은 서로 다른 측정 차원이며, rate와 multiplier는 적용식이 없으면 상호 대체할 수 없다고 가정했다.
  structure:
    domain_constraints_used: []
    domain_context_assumptions:
