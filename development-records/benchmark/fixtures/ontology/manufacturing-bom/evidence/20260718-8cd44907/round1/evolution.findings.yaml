findings:
  - candidate_id: evolution-candidate-001
    target: BOM·라우팅·변경관리의 버전 및 효력 모델
    evidence_anchor: .onto/review/20260718-8cd44907/execution-preparation/materialized-input.md:20-21,27,55-61,69-75,93-96
    claim: ECO 이후의 BOM과 라우팅 구성을 시점별로 보존·선택할 수 없어 변경 시 데이터 연속성이 깨진다.
    what: Part에 단일 rev와 최신 ECO 포인터만 있고, BomLine과 Routing에는 개정 식별자·효력 구간·대체 관계가 없다.
      ECO의 effective_date도 변경된 BOM 또는 라우팅 버전에 연결되지 않는다.
    why: 새 ECO가 BOM 구성이나 공정 순서를 바꾸면 기존 객체를 덮어쓰거나 별도 객체를 비정형적으로 복제해야 한다. 그러면 MES가 생산
      시점에 유효했던 PLM 구성을 결정하거나 과거 생산 오더의 설계 기준을 재현할 수 없다.
    how_to_fix: PartRevision을 독립 엔티티로 두고, 버전이 있는 BOM 및 Routing을 해당 개정에 연결한다. 각 버전에
      valid_from/valid_to 또는 명시적 effectivity를 두며 ECO가 이전 버전과 후속 버전을 연결하도록 한다.
      released·superseded·obsolete 같은 수명주기도 버전 객체에 적용한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준으로서 설계변경 전후의 제품 구조와 공정 기준을 연속적으로 교환하고 재현하는 목적
      failure_condition: ECO가 품목의 BOM 구성 또는 라우팅을 변경하고 MES가 특정 생산 시점의 유효 구성을 선택하거나 과거 구성을 재현해야 할 때
      impact: 통합 시스템이 유효 구성과 과거 구성을 결정할 공통 키를 갖지 못해 잘못된 자재 투입·공정 적용 또는 변경 이력 상실 위험이
        생긴다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:27
        - materialized-input.md:55-61
        - materialized-input.md:69-75
        - materialized-input.md:93-96
    causal_path:
      root_cause_candidate: 시간에 따라 변하는 제품 구조와 공정 정의를 불변 버전 객체가 아니라 현재 Part 속성과 비버전 참조로 모델링했다.
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 변경 후 특정 시점에 유효한 BOM과 라우팅을 선택할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:27
            - materialized-input.md:55-61
            - materialized-input.md:96
        - cause_id: evolution-candidate-001.cause-002
          claim: BomLine과 Routing에는 개정 또는 효력 구간이 없고 ECO는 affected_parts와 단일
            effective_date만 가진다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:55-61
            - materialized-input.md:69-75
        - cause_id: evolution-candidate-001.cause-003
          claim: 버전 권한이 단일 Part.rev와 current_eco에 집중되어 BOM·라우팅 버전의 정체성과 계보가 존재하지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:20-21
      unresolved_beyond_evidence: 실제 PLM과 MES가 별도 버전 계보를 보유하는지는 경계 내 자료로 확인할 수 없지만, 이
        문서 자체에는 그 계보를 교환할 개념이 없다.
  - candidate_id: evolution-candidate-002
    target: ECO 효력 범위와 동시 변경 수용성
    evidence_anchor: .onto/review/20260718-8cd44907/execution-preparation/materialized-input.md:20-21,69-75,96
    claim: 단일 current_eco와 날짜 하나만으로는 동시·미래·조건부 변경을 확장 수용할 수 없다.
    what: Part.current_eco는 최신 ECO 하나만 참조하고, ECO는 공통 effective_date 하나만 제공한다. 품목별
      효력, 공장별 효력, 로트·시리얼 범위, 선행 변경 의존성 또는 복수의 승인된 미래 변경을 표현할 구조가 없다.
    why: 복수 ECO가 병행되거나 적용 조건이 날짜 이외로 확장되면 기존 필드를 재정의하거나 새 조건 필드를 계속 추가해야 한다. 단일 최신
      포인터 갱신은 승인됐지만 아직 발효되지 않은 변경과 현재 적용 중인 변경의 연속성도 잃게 한다.
    how_to_fix: Part의 단일 current_eco를 권위 모델로 사용하지 말고 ECO-대상 개정 간 ChangeEffectivity
      관계를 둔다. 관계에 적용 대상, valid_from/to, plant, lot/serial 범위와 우선순위 또는 선행 변경을 확장
      가능한 조건 구조로 표현한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM의 변경 승인을 MES 적용 조건으로 안정적으로 전달하는 변경관리 기준
      failure_condition: 한 품목에 여러 ECO가 병행되거나 효력이 품목·공장·로트·시리얼별로 달라질 때
      impact: 새 변경 유형마다 스키마 수정 또는 비정형 예외가 필요해지고, PLM과 MES가 서로 다른 변경을 현재 유효 변경으로 해석할 수
        있다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:69-75
        - materialized-input.md:96
    causal_path:
      root_cause_candidate: 변경의 효력을 독립적이고 확장 가능한 관계가 아니라 Part의 단일 최신 포인터와 ECO의 전역 날짜 속성으로 축약했다.
      root_cause_step_id: evolution-candidate-002.cause-003
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: 복수 또는 조건부 변경을 기존 구조에 추가하면 현재 적용 상태를 일관되게 표현할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20-21
            - materialized-input.md:69-75
        - cause_id: evolution-candidate-002.cause-002
          claim: 각 ECO에는 affected_parts 목록과 effective_date 하나만 있고 대상별 효력 조건이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-75
        - cause_id: evolution-candidate-002.cause-003
          claim: Part가 변경 이력이나 효력 관계 대신 최신 ECO 하나만 참조한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:20-21
      unresolved_beyond_evidence: 날짜 외 효력 조건의 실제 사용 여부는 경계 내에서 확인되지 않으나, 추가될 경우 이를 수용할
        확장 지점이 없는 점은 대상 문서에서 확인된다.
  - candidate_id: evolution-candidate-003
    target: Part.uom 및 단위 변환 모델
    evidence_anchor: .onto/review/20260718-8cd44907/execution-preparation/materialized-input.md:17-20,100
    claim: 폐쇄형 단위 열거와 환산 마스터 부재 때문에 새 단위나 시스템을 추가할 때 스키마와 운영 절차를 함께 수정해야 한다.
    what: uom 값이 ea, kg, m으로 고정되어 있고, 품목별 환산계수는 존재하지 않으며 현장에서 필요할 때 환산하도록 되어 있다.
    why: L, mm, m2, 시간 등 새 단위가 들어오면 열거형 변경과 PLM/MES 매핑 수정이 필요하다. 동일 품목을 구매·재고·생산에서
      서로 다른 단위로 관리하면 결정적인 변환 근거가 없어 기존 데이터와 신규 데이터의 비교 연속성도 보장되지 않는다.
    how_to_fix: UnitOfMeasure를 코드·차원·기준 단위를 가진 참조 마스터로 분리하고 PartUomConversion에 품목,
      원단위, 대상단위, 계수, 유효기간을 둔다. 외부 시스템 코드 매핑은 별도 식별자 관계로 확장한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM과 MES 사이에서 품목 수량과 BOM 소요량을 확장 가능하게 교환하는 기준
      failure_condition: 현재 열거에 없는 단위를 쓰거나 한 품목을 시스템별로 다른 단위로 관리할 때
      impact: 새 범주 추가가 데이터 추가가 아니라 스키마 변경이 되며, 수동 환산으로 BOM 소요량과 생산 실적이 달라질 수 있다.
      evidence_refs:
        - materialized-input.md:17-20
        - materialized-input.md:100
    causal_path:
      root_cause_candidate: 단위 체계를 확장 가능한 참조 데이터와 변환 관계가 아니라 Part의 폐쇄형 문자열 범주로 모델링했다.
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 새 단위 또는 시스템별 단위를 수용하려면 기존 스키마와 매핑을 수정해야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:19
            - materialized-input.md:100
        - cause_id: evolution-candidate-003.cause-002
          claim: 허용 단위가 세 값으로 고정되고 품목별 변환은 현장 수작업에 맡겨져 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:19
            - materialized-input.md:100
        - cause_id: evolution-candidate-003.cause-003
          claim: 단위와 변환 규칙을 독립된 마스터 개념으로 분리하지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:14-21
            - materialized-input.md:100
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-004
    target: Operation·WorkCenter의 공장 및 라우팅별 확장 모델
    evidence_anchor: .onto/review/20260718-8cd44907/execution-preparation/materialized-input.md:47-67,87-89
    claim: 작업장과 표준시간이 Operation에 직접 고정되어 새 공장·대체 설비·라우팅별 실행 조건을 추가할 때 기존 공정을 복제하거나
      구조를 바꿔야 한다.
    what: Operation은 work_center 하나와 std_time_min 하나를 직접 가지며 Routing은 Operation 참조의
      순서만 표현한다. WorkCenter에도 공장·캘린더·능력 단위가 없고 capacity_per_shift의 단위는 작업장마다 다르다.
    why: 같은 공정 정의를 여러 공장이나 대체 작업장에서 수행하거나 라우팅별 준비시간·가공시간을 달리해야 하면 Operation을 복제해야
      한다. 복제된 공정은 기준 정의가 변경될 때 함께 갱신되지 않아 시스템 및 공장 간 연속성이 깨질 수 있다.
    how_to_fix: 공정 정의(OperationDefinition)와 라우팅 단계(RoutingOperation)를 분리한다. 라우팅 단계가
      순서, 표준시간, 작업장 요구조건을 가지게 하고, 실제 WorkCenter 배정과 대체 가능성은 공장·유효기간을 포함한 별도 관계로
      모델링한다. capacity에는 단위와 시간 기준을 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM의 공정 정의를 여러 MES 공장과 설비 구성으로 확장 가능한 공통 기준으로 제공하는 목적
      failure_condition: 동일 공정을 복수 공장, 대체 작업장 또는 서로 다른 라우팅 시간으로 전개할 때
      impact: 기존 Operation 복제나 스키마 변경이 필요하고 복제본 간 기준 드리프트가 발생해 다공장 확장과 공정 변경 전파의 신뢰성이
        낮아진다.
      evidence_refs:
        - materialized-input.md:47-67
        - materialized-input.md:87-89
    causal_path:
      root_cause_candidate: 재사용 가능한 공정 정의와 라우팅·공장별 실행 배치를 하나의 Operation 객체에 결합했다.
      root_cause_step_id: evolution-candidate-004.cause-003
      steps:
        - cause_id: evolution-candidate-004.cause-001
          claim: 새 공장이나 대체 설비를 추가하면 기존 공정을 그대로 재사용하면서 배치 조건만 확장할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:47-60
            - materialized-input.md:87-89
        - cause_id: evolution-candidate-004.cause-002
          claim: Operation이 단일 work_center와 단일 표준시간을 직접 소유하고 Routing은 순서 있는 참조만 가진다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:47-60
        - cause_id: evolution-candidate-004.cause-003
          claim: 공정의 정체성과 라우팅·공장별 실행 사양이 분리되어 있지 않다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:47-67
      unresolved_beyond_evidence: 실제 다공장 운영 여부는 경계 내 자료로 확인되지 않지만, 해당 확장 시 필요한 공장 및 배치 개념이 모델에 없는 점은 확인된다.
domain_constraints_used: []
domain_context_assumptions:
  - PLM/MES 통합 기준은 과거 생산 오더가 사용한 제품 구조와 라우팅을 재현할 수 있어야 한다.
  - 제조 통합 범위가 확장되면 복수 ECO, 날짜 외 효력 조건, 추가 단위, 다공장 또는 대체 작업장을 수용할 가능성이 있다.
  - 이 가정들은 session_domain이 none이므로 외부 도메인 문서의 규칙이 아니라 변경 내성 시나리오로만 사용했다.
validation:
  unaddressable_candidates: []
