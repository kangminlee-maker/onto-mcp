    claim: 단위가 없는 생산능력과 현장 임의 환산을 허용해 통합 기준 문서가 수량 의미를 보장하지 못한다.
    what: Part.uom은 ea/kg/m만 열거하지만 품목별 환산계수가 없고 필요 시 현장에서 환산한다.
      WorkCenter.capacity_per_shift는 작업장별로 개수 또는 시간이라는 서로 다른 차원을 쓰면서 단위 속성이 없다.
    why: PLM과 MES가 수량·능력을 교환해도 값의 차원과 환산 근거를 기계적으로 판정할 수 없다. 현장 판단에 맡긴 단위 변환은 로컬 편의와
      공통 의미의 정확성 사이의 트레이드오프를 정당화 없이 공통 모델에 내장한다.
    how_to_fix: 수량을 value+uom으로 모델링하고, capacity_per_shift에도 명시적 단위와 시간 기준을 둔다. 품목별
      환산계수에는 방향, 유효기간, 조건과 권위 출처를 포함하며 차원이 다른 변환은 검증 없이 허용하지 않는다.
    upstream_evidence_required: false
