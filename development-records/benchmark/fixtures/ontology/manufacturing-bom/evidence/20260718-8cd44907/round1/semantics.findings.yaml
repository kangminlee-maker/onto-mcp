domain_context_assumptions:
  - 외부 도메인 문서나 표준은 사용하지 않았으며, 의미 판정은 대상 문서 자체의 정의와 관계에 한정했다.
  - Operation은 실행되는 공정 단계이고 Plan은 그 실행을 규정하는 정보 객체라는 대상 문서의 표현을 구분해 해석했다.
  - 개수와 시간은 서로 다른 측정 차원이며, rate와 multiplier는 적용식이 없으면 상호 대체할 수 없다고 가정했다.
