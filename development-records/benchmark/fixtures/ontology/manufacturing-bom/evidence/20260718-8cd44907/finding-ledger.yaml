      failure_condition: AlternatePart.direction이 생략되어 기본 one_way가 적용되거나 one_way로 명시된 경우
      impact: 동일 데이터에 대해 한 소비자는 역방향 대체를 의무로, 다른 소비자는 금지 또는 미보장으로 해석할 수 있어 통합 기준의 결정성과
