  - finding_id: finding-022
    lens_id: structure
    source_ref: .onto/review/20260718-8cd44907/round1/structure.findings.yaml#structure-candidate-001
    target: manufacturing-bom-ontology.yaml — ECO effectivity structure
    evidence_anchor: materialized-input.md:20-21, 55-61, 69-75, 84-96
    claim: ECO effectivity is not connected to the revisioned BOM and routing
      configuration it is supposed to activate.
    lens_rationale_summary: The integrity rule requires post-effective-date
      production to follow a new revision, but the ontology provides no
      traversable path from ECO to that revision's BOM and Routing. A PLM/MES
      consumer therefore cannot determine the effective manufacturing
      configuration from this model.
    proposed_action: Introduce a revision/configuration entity, or equivalent
      explicit version references, and connect ECO to the resulting Part
      revision, BOM, and Routing with effectivity. Make the integrity rule
      traversable through those relationships.
    affected_purpose: PLM/MES integration baseline for consistent change-controlled
      BOM and routing selection.
    failure_condition: When an ECO becomes effective and production must select the
      new revision's BOM and routing.
    impact: The model cannot identify the effective manufacturing configuration,
      weakening trust that PLM changes will drive the correct MES execution
      data.
    evidence_refs:
      - .onto/review/20260718-8cd44907/round1/structure.findings.yaml#structure-candidate-001
      - materialized-input.md:20-21
      - materialized-input.md:55-61
      - materialized-input.md:69-75
      - materialized-input.md:84-96
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES integration baseline for consistent change-controlled
        BOM and routing selection.
      failure_condition: When an ECO becomes effective and production must select the
        new revision's BOM and routing.
      impact: The model cannot identify the effective manufacturing configuration,
        weakening trust that PLM changes will drive the correct MES execution
        data.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:55-61
        - materialized-input.md:69-75
        - materialized-input.md:84-96
    causal_path:
      root_cause_candidate: The ontology models revision as an unlinked scalar and
        omits configuration-level relationships from ECO to revisioned BOM and
        Routing.
      root_cause_step_id: finding-022.cause-002
      steps:
