  - finding_id: finding-014
    lens_id: evolution
    source_ref: .onto/review/20260718-8cd44907/round1/evolution.findings.yaml#evolution-candidate-004
    target: Operation·WorkCenter의 공장 및 라우팅별 확장 모델
    evidence_anchor: .onto/review/20260718-8cd44907/execution-preparation/materialized-input.md:47-67,87-89
    claim: 작업장과 표준시간이 Operation에 직접 고정되어 새 공장·대체 설비·라우팅별 실행 조건을 추가할 때 기존 공정을 복제하거나
      구조를 바꿔야 한다.
    lens_rationale_summary: 같은 공정 정의를 여러 공장이나 대체 작업장에서 수행하거나 라우팅별 준비시간·가공시간을 달리해야 하면
      Operation을 복제해야 한다. 복제된 공정은 기준 정의가 변경될 때 함께 갱신되지 않아 시스템 및 공장 간 연속성이 깨질 수
      있다.
    proposed_action: 공정 정의(OperationDefinition)와 라우팅 단계(RoutingOperation)를 분리한다. 라우팅
