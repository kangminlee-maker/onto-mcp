    lens_rationale_summary: 재투입은 수율·공정·물질 흐름의 개념인데 제품구조 관계에 넣으면, BOM 전개·소요량 계산·순환
      검증에서 일반 제품구조와 구별할 수 없다. 한 예외를 편하게 표현하려는 국소 최적화가 BOM을 통합 기준으로 안전하게 소비할 수
      있다는 더 넓은 목적을 약화한다.
    proposed_action: BOM은 비순환 제품구조로 유지하고, 스크랩 발생·회수·재투입을 별도 material-flow 또는
      routing-input/output 관계로 모델링한다. 기존 자기참조가 필요하면 명시적 relation kind와 전개 제외 규칙을
      둔다.
    affected_purpose: BOM 개념의 정합성과 제조 운영 안전성을 보장하는 PLM/MES 공통 기준 역할.
