      식별자·유효기간·동기화 상태·충돌 해결 원칙이 없다. 이는 PLM/MES 간 공통 기준을 제공한다는 목적과 충돌하며 불일치를 정상
      상태로 고착한다.
    proposed_action: 각 운영값의 canonical source, 유효기간, 버전, 동기화 상태와 충돌 해결 규칙을 모델링한다.
      파생값인 누적 std_time은 Routing/Operation에서 계산되는 projection으로 규정하고 수기 필드는 비권위 캐시
      또는 명시적 override로 분리한다.
    affected_purpose: BOM·라우팅 개념을 PLM/MES 통합의 일관된 기준으로 제공하는 목적.
    failure_condition: 복사 시점 이후 scrap_rate가 변경되거나 MES 계산 std_time과 수기 표준원가 값이 분기 대사 전까지 달라질 때.
    impact: 동일 품목의 계획 소요량·능력·원가가 시스템별로 달라져 기준 문서의 의사결정 신뢰성이 약해진다.
