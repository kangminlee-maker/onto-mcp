      alignment_direction=misaligned.'
    claim: ECO 발효 시점과 Part 리비전 가시성 사이의 의도된 지연이 변경관리 기준 문서의 목적을 훼손한다.
    lens_rationale_summary: 같은 문서가 즉시 적용해야 할 제조 기준과 최대 일주일 늦을 수 있는 통합 데이터 상태를 함께
      허용한다. MES가 Part.rev를 생산 기준으로 소비하면 발효 후에도 구 리비전으로 오더를 실행할 수 있어, 변경관리 정합성과
      제조 운영 위험 통제라는 선언 목적을 직접 약화한다.
    proposed_action: ECO 적용 시점의 권위 값을 단일화하고, 생산 오더가 effective_date·ECO 상태·적용 리비전을
      원자적으로 판정하도록 모델링한다. 배치 동기화가 불가피하면 동기화 완료 전 오더 차단 또는 명시적 적용 스냅샷을 계약에 포함한다.
    affected_purpose: PLM/MES 통합에서 변경관리 개념을 일관된 생산 기준으로 제공하고 제조 운영 위험을 통제하는 목적.
    failure_condition: ECO.effective_date가 도래했지만 주간 배치가 아직 Part.rev를 갱신하지 않은 기간에
      MES가 Part.rev로 생산 리비전을 결정할 때.
    impact: 발효된 설계변경과 실제 생산 지시가 불일치하여 구 리비전 생산, 추적성 손실, 재작업 가능성이 생긴다.
    evidence_refs:
