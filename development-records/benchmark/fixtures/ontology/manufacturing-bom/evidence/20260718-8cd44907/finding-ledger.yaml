    claim: 단위가 없는 생산능력과 현장 임의 환산을 허용해 통합 기준 문서가 수량 의미를 보장하지 못한다.
    lens_rationale_summary: PLM과 MES가 수량·능력을 교환해도 값의 차원과 환산 근거를 기계적으로 판정할 수 없다. 현장
      판단에 맡긴 단위 변환은 로컬 편의와 공통 의미의 정확성 사이의 트레이드오프를 정당화 없이 공통 모델에 내장한다.
    proposed_action: 수량을 value+uom으로 모델링하고, capacity_per_shift에도 명시적 단위와 시간 기준을 둔다.
      품목별 환산계수에는 방향, 유효기간, 조건과 권위 출처를 포함하며 차원이 다른 변환은 검증 없이 허용하지 않는다.
    affected_purpose: 품목·라우팅 데이터를 PLM/MES 사이에서 일관된 의미로 공유하고 제조 운영 위험을 줄이는 목적.
    failure_condition: kg 기반 BOM 소요량을 ea 기반 계획으로 바꾸거나 서로 다른 단위의 작업장 능력을 비교·합산할 때.
    impact: 소요량·생산능력 계산이 해석자마다 달라져 과소투입, 과대계획 또는 일정 오류로 이어질 수 있다.
