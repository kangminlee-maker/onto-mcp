per_lens_provenance:
  axiology:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합의 개념 기준 문서는 생산 시점의 유효 구성과 핵심 제조 수치의 의미를 두 시스템이 결정적으로 동일 해석할 수
        있어야 한다.
      - BOM 전개·소요량·원가 계산 소비자는 구조 BOM의 종료 가능한 전개를 필요로 한다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합의 개념 기준은 설계 기준정보뿐 아니라 생산 지시와 실제 실행 결과 사이의 추적 가능한 연결을 표현해야 한다.
      - 변경 또는 릴리스 상태가 생산 가능 여부를 통제한다면 상태 전환의 행위자·시각·근거를 재구성할 수 있어야 한다.
      - 수량과 능력을 시스템 간 계산에 사용하려면 명시적 단위, 환산 근거 및 공유 값의 권위가 필요하다.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합 기준은 생산 기준 시점에 유효한 품목 리비전, BOM 및 라우팅을 함께 식별하고 과거 구성을 재현할 수 있어야
        한다.
      - 라우팅에는 향후 조건 분기, 병렬 작업 또는 재작업 흐름이 추가될 수 있다.
      - 통합 대상 시스템은 현재 열거되지 않은 단위와 단위 환산을 요구할 수 있다.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - direction=one_way는 역방향 대체 가능성을 배제하고 bidirectional과 상호 배타적이라는 enum의 통상적
        의미를 적용했다.
      - Assembly가 자기 자신을 직접 하위 품목으로 포함하면 길이 1의 BOM 순환이 성립한다고 해석했다.
      - integrity_rules는 PLM/MES 통합 구현에서 집행 가능한 제약을 선언하는 구성 계약으로 해석했다.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - 이 산출물은 선언된 목적대로 PLM과 MES가 품목·BOM·라우팅·변경 상태를 동일하게 해석하도록 구속하는 개념 기준 문서로
        사용된다고 가정했다.
      - BOM의 parent-child 관계는 제품 구성 및 구성품 소요를, Routing/Operation은 제조 공정 순서와 실행
        맥락을 표현한다는 문서 자체의 정의를 적용했다.
      - 외부 도메인 문서나 표준은 사용하지 않았으며, 제조 현장의 실제 추가 통제는 경계 내에서 확인할 수 없다.
  structure:
    domain_constraints_used: []
    domain_context_assumptions:
      - The declared `relations` section is intended to be the canonical
        navigable relationship graph for integration consumers.
      - BOM membership/quantity and routing sequence/parameters are
        independently changeable structures because the artifact models BomLine,
        Routing, and Operation as distinct entities.
