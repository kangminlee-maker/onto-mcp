    claim: 현장·스프레드시트의 수기 보정 관행을 정준 단위·출처·동기화 계약 없이 수용해 통합 기준의 결정성과 추적성을 희생한다.
    lens_rationale_summary: 동일 숫자의 단위, 원본, 갱신 시점, 변환 규칙을 PLM과 MES가 공통으로 판정할 수 없다. 이는
      지역 조직의 편의를 유지하는 대신 시스템 간 일관된 소요량·능력·원가 계산이라는 통합 목적을 약화시키는 정당화되지 않은
      트레이드오프다.
    proposed_action: 각 수치에 명시적 UOM과 authority/source, effective period,
      synchronization policy를 부여한다. 품목별 UOM conversion master를 정준화하고, 파생 표준원가는
      Routing에서 계산된 값으로 단일화하거나 수기 override를 별도 승인·이력 개념으로 모델링한다.
