  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260718-3119806d/round1/axiology.findings.yaml#axiology-candidate-003
    target: manufacturing-bom-ontology.yaml BOM 순환성 무결성 규칙
    evidence_anchor: "materialized-input.md:93-96 says the BOM must be acyclic but
      models scrap reintroduction by making an Assembly include itself as its
      own child. Value authority seat:
      review-value-alignment-criteria.yaml:6-18, criterion user-request-intent,
      excerpt='BOM...개념의 정합성과 제조 운영 위험'; value_type=tradeoff;
      alignment_direction=misaligned."
    claim: 스크랩 재투입 공정을 자기참조 BOM으로 표현하는 국소 편의가 BOM의 비순환성 약속과 제조 계획 안정성을 훼손한다.
    lens_rationale_summary: 재투입은 공정·물질 흐름인데 제품 구조인 BOM에 예외로 넣었다. 그 결과 BOM 전개, 소요량
      계산, 원가 롤업 같은 소비자가 비순환이라는 기본 전제를 사용할 수 없고 각 시스템이 별도 예외 처리를 해야 하므로 PLM/MES
      공통 개념 기준이라는 목적에서 벗어난다.
    proposed_action: 구조 BOM은 예외 없이 비순환으로 유지하고, 스크랩 발생·회수·재투입은 Routing/Operation에 연결된
      별도 material-flow 또는 recycle-flow 관계와 수율·투입 비율로 모델링한다.
    affected_purpose: PLM/MES가 공유할 수 있는 정합적인 BOM 개념 기준
    failure_condition: 자기참조 예외가 포함된 BOM을 전개·소요량·원가 계산에 사용할 때
    impact: 공통 소비자가 종료성과 계산 의미를 동일하게 해석할 수 없어 통합 기준의 실행 가능성과 제조 계획 신뢰가 약화된다.
