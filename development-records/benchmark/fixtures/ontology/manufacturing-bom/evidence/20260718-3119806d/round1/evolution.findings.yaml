findings:
  - candidate_id: evolution-candidate-001
    target: Part/ECO/BomLine/Routing의 리비전·효력 모델
    evidence_anchor: "manufacturing-bom-ontology.yaml:
      entities.Part.attributes.rev/current_eco, entities.BomLine,
      entities.Routing, entities.ECO.attributes.effective_date,
      integrity_rules[2]"
    claim: 현재 상태만 보존하는 구조여서 복수 리비전과 시점별 BOM·라우팅의 연속성을 유지할 수 없다.
    what: Part의 리비전은 변경 가능한 문자열이고 ECO도 최신 항목만 가리킨다. BomLine과 Routing에는 적용 리비전, 효력
      시작·종료 시점 또는 ECO 적용 범위가 없다.
    why: 미래 효력 변경이나 동시 유효 리비전이 생기면 특정 생산 시점에 적용할 BOM과 라우팅을 판별하거나 과거 구성을 재현할 수 없다. 특히
      effective_date 이후 신규 rev를 따르지만 rev 동기화는 주간 배치라는 규칙 때문에 PLM과 MES가 서로 다른 현재
      상태를 볼 수 있다.
    how_to_fix: 불변 PartRevision을 도입하고 BomLine과 Routing을 해당 리비전에 연결한다. 각 구조에 유효기간 또는
      ECO 기반 효력 범위를 두고, 생산 오더가 기준 시점으로 정확한 버전을 선택하도록 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준으로서 품목·BOM·라우팅·변경관리의 일관된 시점별 해석
      failure_condition: 미래 효력 ECO, 동시 유효 리비전, 배치 동기화 지연 또는 과거 생산 구성 재현이 필요한 경우
      impact: 두 시스템이 서로 다른 BOM·라우팅 조합을 선택하거나 과거 생산 근거를 복원하지 못해 통합 기준의 신뢰성이 크게 약화된다.
      evidence_refs:
        - entities.Part.attributes.rev/current_eco
        - entities.BomLine
        - entities.Routing
        - entities.ECO.attributes.effective_date
        - integrity_rules[2]
    causal_path:
      root_cause_candidate: 리비전과 효력을 독립된 불변 개념으로 모델링하지 않고 Part의 현재값과 최신 ECO 포인터로 축약했다.
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 특정 시점의 BOM과 라우팅 구성을 온톨로지에서 선택하거나 재현할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - entities.BomLine
            - entities.Routing
        - cause_id: evolution-candidate-001.cause-002
          claim: BomLine과 Routing에 적용 리비전 또는 유효기간이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.BomLine.attributes
            - entities.Routing.attributes
        - cause_id: evolution-candidate-001.cause-003
          claim: 변경 이력 대신 Part.rev와 Part.current_eco가 현재 상태만 표현하며, rev 반영은 주간 배치에 의존한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.Part.attributes.rev/current_eco
            - integrity_rules[2]
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-002
    target: Routing.operations의 선형 ordered_list 모델
    evidence_anchor: "manufacturing-bom-ontology.yaml:
      entities.Routing.attributes.operations; relations Routing→Operation
      kind=has_ordered"
    claim: 라우팅을 선형 목록으로 고정해 분기·병렬·재작업 같은 신규 공정 유형을 기존 구조 수정 없이 수용할 수 없다.
    what: Routing은 Operation 참조의 단일 ordered_list만 제공하며 단계별 전이, 조건, 반복, 대체 경로를 표현하는
      개념이 없다.
    why: 검사 결과에 따른 분기, 병렬 작업, 선택 공정 또는 재작업 루프를 추가하면 ordered_list의 의미와 소비 로직을 변경하거나
      별도 예외 필드를 계속 추가해야 한다. 이는 MES 확장 시 기존 라우팅 해석의 호환성을 깨뜨린다.
    how_to_fix: RoutingStep과 StepTransition을 도입하고 순차 경로는 그 그래프의 단순한 경우로 표현한다. 전이에
      순서, 조건, 대체·병렬·재작업 의미를 명시하되 기존 선형 라우팅을 손실 없이 매핑한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES가 공유할 수 있는 확장 가능한 공정·라우팅 개념 기준
      failure_condition: 조건 분기, 병렬 공정, 대체 경로 또는 재작업 흐름이 도입되는 경우
      impact: 새 제조 흐름마다 핵심 스키마와 기존 소비자의 순서 해석을 수정해야 하므로 통합 확장성과 하위 호환성이 약화된다.
      evidence_refs:
        - entities.Routing.attributes.operations
        - relations[Routing→Operation]
    causal_path:
      root_cause_candidate: 공정 토폴로지를 단계와 전이로 모델링하지 않고 Operation 참조의 선형 목록으로 축약했다.
      root_cause_step_id: evolution-candidate-002.cause-002
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: 비선형 공정 흐름을 기존 Routing 계약으로 표현할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - entities.Routing.attributes.operations
        - cause_id: evolution-candidate-002.cause-002
          claim: Routing이 단일 ordered_list만 가지며 전이와 전이 조건 개념이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.Routing.attributes
            - relations[Routing→Operation]
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-003
    target: 수량·단위 모델(Part.uom, BomLine.qty_per, WorkCenter.capacity_per_shift)
    evidence_anchor: "manufacturing-bom-ontology.yaml: entities.Part.attributes.uom;
      entities.BomLine.attributes.qty_per;
      entities.WorkCenter.attributes.capacity_per_shift; notes[1]"
    claim: 단위를 폐쇄형 열거와 암묵적 필드 의미로 고정해 신규 단위나 시스템 간 환산을 확장할 때 스키마 수정과 현장 해석이 필요하다.
    what: Part.uom은 ea/kg/m만 허용하고 qty_per에는 별도 단위가 없다. capacity_per_shift는 작업장별로 개수
      또는 시간이라는 서로 다른 차원을 한 숫자 필드에 담으며, 환산계수 마스터도 없다.
    why: 부피, 면적, 포장, 배치 단위 같은 범주를 추가하려면 enum과 소비 로직을 바꿔야 한다. 또한 동일 숫자의 차원과 환산 규칙이
      명시되지 않아 PLM과 MES가 수량·능력을 안정적으로 교환하거나 기존 데이터를 새 단위 체계로 이행하기 어렵다.
    how_to_fix: 확장 가능한 UnitOfMeasure 참조와 차원·환산 마스터를 도입하고, qty_per와 capacity를 값·단위
      쌍으로 표현한다. 기존 ea/kg/m 값은 동일한 canonical unit 식별자로 매핑한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 품목 수량, BOM 소요량 및 작업장 능력의 지속 가능한 공통 해석
      failure_condition: 새 단위 범주를 도입하거나 서로 다른 단위·차원의 시스템 데이터를 교환·변환하는 경우
      impact: 스키마 변경 없이는 확장할 수 없고 환산이 현장 판단에 남아 수량 및 능력 데이터의 통합 신뢰성이 저하된다.
      evidence_refs:
        - entities.Part.attributes.uom
        - entities.BomLine.attributes.qty_per
        - entities.WorkCenter.attributes.capacity_per_shift
        - notes[1]
    causal_path:
      root_cause_candidate: 측정값을 값·단위·차원 개념으로 분리하지 않고 제한된 enum과 필드별 암묵적 의미로 표현했다.
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 새 단위 추가와 시스템 간 수량 변환이 기존 구조만으로는 안정적으로 처리되지 않는다.
          relation_to_previous: null
          evidence_refs:
            - entities.Part.attributes.uom
            - notes[1]
        - cause_id: evolution-candidate-003.cause-002
          claim: 수량과 능력 필드가 단위를 직접 참조하지 않으며 capacity는 서로 다른 차원을 허용한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.BomLine.attributes.qty_per
            - entities.WorkCenter.attributes.capacity_per_shift
        - cause_id: evolution-candidate-003.cause-003
          claim: 단위 집합은 폐쇄형 enum이고 품목별 환산계수의 권위 있는 마스터가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.Part.attributes.uom
            - notes[1]
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - PLM/MES 통합 기준은 생산 기준 시점에 유효한 품목 리비전, BOM 및 라우팅을 함께 식별하고 과거 구성을 재현할 수 있어야 한다.
  - 라우팅에는 향후 조건 분기, 병렬 작업 또는 재작업 흐름이 추가될 수 있다.
  - 통합 대상 시스템은 현재 열거되지 않은 단위와 단위 환산을 요구할 수 있다.
validation:
