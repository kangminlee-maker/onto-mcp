      user-request-intent. Axiology role §Authoritative alignment input states
      that ranks 1-3 must always be bound and missing authority requires an
      insufficient-evidence finding. value_type=boundary;
      alignment_direction=indeterminate."
    claim: 정준 가치 권위 체인이 바인딩되지 않아 목적 정렬 판단의 권위가 불완전하다.
    what: 실행 준비 산출물에는 사용자 요청 목적만 있고 core lexicon,
      productization/OaC/LLM-native/product-locality 원칙 및 활성 review contract의
      바인딩 참조가 비어 있다.
    why: Axiology는 개인적 가치 판단이 아니라 정준 권위 체인에 근거해야 한다. 현재 자료로는 사용자가 명시한 PLM/MES 통합 목적에
      대한 제한적 평가는 가능하지만, onto 제품 원칙과의 정렬 여부는 판정할 수 없어 렌즈 결과의 신뢰 범위가 축소된다.
    how_to_fix: 실행 준비 단계에서 필수 순위 1-3 authority 문서의 경로, 안정 anchor, 직접 인용문을
      materialized context에 바인딩하고 읽기 실패 시 dispatch를 제한하거나 해당 판단을 명시적으로
      indeterminate로 유지한다.
    upstream_evidence_required: true
    severity_hint: medium
    materiality_basis:
      affected_purpose: 정준 권위에 근거한 가치·목적 정렬 검토
      failure_condition: core lexicon과 제품·검토 원칙에 기대는 정렬 판단을 수행할 때
      impact: 검토자의 개인 해석과 정준 제품 가치 사이를 구분할 수 없어 axiology 판정의 감사 가능성과 신뢰가 약화된다.
      evidence_refs:
        - .onto/review/20260718-3119806d/execution-preparation/context-candidate-assembly.yaml:1-4
        - .onto/review/20260718-3119806d/execution-preparation/review-value-alignment-criteria.yaml:5-20
        - axiology.prompt.md §Authoritative alignment input
    causal_path:
