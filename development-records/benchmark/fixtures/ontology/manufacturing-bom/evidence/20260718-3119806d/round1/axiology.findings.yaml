  - candidate_id: axiology-candidate-001
    target: .onto/review/20260718-3119806d/execution-preparation/context-candidate-assembly.yaml
    evidence_anchor: "context-candidate-assembly.yaml:1-4 has system_purpose_refs:
      [], role_definition_refs: [], and execution_rule_refs: [];
