  - candidate_id: axiology-candidate-003
    target: manufacturing-bom-ontology.yaml BOM 순환성 무결성 규칙
    evidence_anchor: "materialized-input.md:93-96 says the BOM must be acyclic but
      models scrap reintroduction by making an Assembly include itself as its
      own child. Value authority seat:
      review-value-alignment-criteria.yaml:6-18, criterion user-request-intent,
      excerpt='BOM...개념의 정합성과 제조 운영 위험'; value_type=tradeoff;
      alignment_direction=misaligned."
    claim: 스크랩 재투입 공정을 자기참조 BOM으로 표현하는 국소 편의가 BOM의 비순환성 약속과 제조 계획 안정성을 훼손한다.
    what: 하나의 무결성 규칙이 BOM 비순환을 선언하면서 동일 문장에서 재생 원료 회수 공정에는 직접 자기참조를 허용한다.
    why: 재투입은 공정·물질 흐름인데 제품 구조인 BOM에 예외로 넣었다. 그 결과 BOM 전개, 소요량 계산, 원가 롤업 같은 소비자가
      비순환이라는 기본 전제를 사용할 수 없고 각 시스템이 별도 예외 처리를 해야 하므로 PLM/MES 공통 개념 기준이라는 목적에서
      벗어난다.
    how_to_fix: 구조 BOM은 예외 없이 비순환으로 유지하고, 스크랩 발생·회수·재투입은 Routing/Operation에 연결된 별도
      material-flow 또는 recycle-flow 관계와 수율·투입 비율로 모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES가 공유할 수 있는 정합적인 BOM 개념 기준
      failure_condition: 자기참조 예외가 포함된 BOM을 전개·소요량·원가 계산에 사용할 때
      impact: 공통 소비자가 종료성과 계산 의미를 동일하게 해석할 수 없어 통합 기준의 실행 가능성과 제조 계획 신뢰가 약화된다.
      evidence_refs:
        - .onto/review/20260718-3119806d/execution-preparation/materialized-input.md:93-96
        - .onto/review/20260718-3119806d/execution-preparation/review-value-alignment-criteria.yaml:6-18
    causal_path:
      root_cause_candidate: 제품 구조와 재생 원료의 공정 흐름을 분리하지 않고 하나의 BOM 관계로 표현했다.
      root_cause_step_id: axiology-candidate-003.cause-002
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: BOM 비순환 규칙에 직접 자기참조 예외가 포함되어 있다.
          relation_to_previous: null
          evidence_refs:
            - .onto/review/20260718-3119806d/execution-preparation/materialized-input.md:94
        - cause_id: axiology-candidate-003.cause-002
          claim: 공정인 스크랩 재투입을 Assembly 자식 관계로 표현한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - .onto/review/20260718-3119806d/execution-preparation/materialized-input.md:94
      unresolved_beyond_evidence: null
  - candidate_id: axiology-candidate-004
    target: manufacturing-bom-ontology.yaml 수량·능력·원가 관련 운영 데이터 계약
    evidence_anchor: "materialized-input.md:35 copies scrap_rate from a planning
      spreadsheet; line 67 gives capacity_per_shift different implicit units by
      work center; line 99 maintains a manual duplicate standard-cost value
      reconciled quarterly; line 100 leaves kg↔ea conversion to shop-floor
      judgment without a conversion master. Value authority seat:
      review-value-alignment-criteria.yaml:6-18, criterion user-request-intent,
      excerpt='PLM/MES 통합의 개념 기준 문서...제조 운영 위험'; value_type=purpose;
      alignment_direction=misaligned."
    claim: 현장·스프레드시트의 수기 보정 관행을 정준 단위·출처·동기화 계약 없이 수용해 통합 기준의 결정성과 추적성을 희생한다.
    what: scrap_rate와 표준원가가 복제·수기 관리되고, capacity 단위는 작업장별로 암묵적이며, 품목별 UOM 환산은 현장에서
      수행된다.
    why: 동일 숫자의 단위, 원본, 갱신 시점, 변환 규칙을 PLM과 MES가 공통으로 판정할 수 없다. 이는 지역 조직의 편의를 유지하는 대신
      시스템 간 일관된 소요량·능력·원가 계산이라는 통합 목적을 약화시키는 정당화되지 않은 트레이드오프다.
    how_to_fix: 각 수치에 명시적 UOM과 authority/source, effective period, synchronization
      policy를 부여한다. 품목별 UOM conversion master를 정준화하고, 파생 표준원가는 Routing에서 계산된 값으로
      단일화하거나 수기 override를 별도 승인·이력 개념으로 모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 간 일관된 제조 수량·능력·원가 의미 제공
      failure_condition: 서로 다른 시스템이나 작업장이 scrap, capacity, UOM conversion, 누적 표준시간을 계산·교환할 때
      impact: 같은 데이터가 서로 다른 단위나 시점의 값으로 해석되어 계획, 실행, 원가 결과가 불일치하고 사후 추적도 어려워진다.
      evidence_refs:
