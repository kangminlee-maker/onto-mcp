  - candidate_id: axiology-candidate-002
    target: manufacturing-bom-ontology.yaml 변경관리 및 생산오더 허용 규칙
    evidence_anchor: "materialized-input.md:20-21 defines Part.rev and current_eco
      against separate source systems; lines 61 and 95 allow orders when Routing
      is released; lines 74-75 and 96 require the new revision after
      ECO.effective_date while Part.rev is synchronized weekly. Value authority
      seat: review-value-alignment-criteria.yaml:6-18, criterion
      user-request-intent, excerpt='PLM/MES 통합의 개념 기준 문서...변경관리 개념의 정합성과 제조 운영
      위험'; value_type=purpose; alignment_direction=misaligned."
    claim: 라우팅 release만으로 생산오더를 허용하면서 ECO 효력과 품목 revision 반영은 지연시켜, 통합 기준 문서가 효력 시점의
      생산 구성을 결정하지 못한다.
    what: ECO 효력일부터 신규 revision을 따라야 하지만 Part.rev는 주간 배치로 늦게 갱신될 수 있고, 생산오더 생성 gate는
      Routing.status=released만 검사한다.
    why: 효력일 이후부터 배치 반영 전까지 released routing과 오래된 Part.rev가 동시에 존재할 수 있다. 이때 문서는
      생산오더가 어느 품목 revision, BOM, routing을 고정해야 하는지 규정하지 않아 변경관리 정합성과 제조 운영 안전이라는
      선언 목적을 훼손한다.
    how_to_fix: Part/BOM/Routing의 불변 revision과 effectivity 구간을 모델링하고, 생산오더가 승인·적용된
      ECO에 의해 유효한 구성 revision을 명시적으로 고정하도록 한다. 오더 gate도 routing release뿐 아니라 ECO
      상태와 구성 effectivity 충족을 함께 요구해야 한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 변경관리 정합성과 안전한 생산 구성 결정
      failure_condition: ECO.effective_date가 지났지만 Part.rev 주간 동기화가 아직 실행되지 않은 기간에 생산오더를 생성할 때
      impact: 동일 시점의 PLM 변경 상태와 MES 생산오더가 서로 다른 revision을 가리킬 수 있어 잘못된 사양 생산 위험이 발생한다.
      evidence_refs:
        - .onto/review/20260718-3119806d/execution-preparation/materialized-input.md:20-21
        - .onto/review/20260718-3119806d/execution-preparation/materialized-input.md:61
        - .onto/review/20260718-3119806d/execution-preparation/materialized-input.md:74-75
        - .onto/review/20260718-3119806d/execution-preparation/materialized-input.md:95-96
        - .onto/review/20260718-3119806d/execution-preparation/review-value-alignment-criteria.yaml:6-18
    causal_path:
      root_cause_candidate: 생산 구성의 revision/effectivity를 독립된 정준 개념으로 모델링하지 않고 mutable
        Part.rev와 비동기 복제에 의존한다.
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
