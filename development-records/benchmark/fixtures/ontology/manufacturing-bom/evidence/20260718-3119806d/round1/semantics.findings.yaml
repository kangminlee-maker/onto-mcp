            - materialized-input.md:63-67
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-006
    target: InspectionPlan의 Operation 상속
    evidence_anchor: materialized-input.md:47-60, 77-82 — Operation은 라우팅의 공정 단계이고
      InspectionPlan은 검사 계획·파라미터 확장인데 is_a Operation으로 선언된다.
    claim: 검사 계획이라는 명세 객체를 실제 라우팅 단계인 Operation의 하위 유형으로 잘못 분류한다.
    what: Operation은 수행되는 공정 단계이고 InspectionPlan은 sampling_rule과
      acceptance_criteria를 담는 계획·규격이다. 계획은 단계가 따르는 명세이지 단계 자체가 아니므로 모든
      InspectionPlan을 Operation처럼 라우팅에 배치할 수 있다는 잘못된 is_a 의미가 생긴다.
    why: 상속에 따라 InspectionPlan이 work_center, std_time_min 같은 실행 단계 속성을 물려받고
      Routing.operations에 직접 들어갈 수 있다. 이는 검사 단계와 검사 명세의 식별·개정·재사용 수명주기를 섞어 PLM
      품질 기준과 MES 실행 단계를 잘못 대응시킨다.
    how_to_fix: InspectionOperation을 Operation의 하위 유형으로 두고, 독립적인 InspectionPlan 또는
