  - candidate_id: coverage-candidate-001
    target: manufacturing-bom-ontology.yaml — BOM·라우팅 구성 이력
    evidence_anchor: entities.Part.attributes.rev/current_eco; entities.BomLine;
      entities.Routing; integrity_rules의 ECO.effective_date 규칙
    claim: BOM 행과 라우팅에 개정·유효기간 개념이 없어 과거 또는 미래 시점의 제조 구성을 재구성할 수 없다.
    what: Part에는 현재 도면 리비전만 있지만 BomLine, Routing, Operation에는 버전, 유효 시작·종료일, 대체된 버전
      관계가 없다.
    why: ECO 적용일 전후로 리비전이 달라진다고 규정하면서도 어느 BOM과 라우팅이 각 시점에 유효했는지 표현할 수 없다. PLM 설계 구성과
      MES 생산 구성을 시점 기준으로 일치시키거나 과거 생산분을 재현할 수 없게 된다.
    how_to_fix: BOM과 Routing을 개정 가능한 헤더 개념으로 승격하고 revision, effective_from,
      effective_to, lifecycle status, supersedes를 추가한다. BomLine과 Operation 순서도
      해당 버전에 종속시키고 ECO가 생성한 구성 버전을 명시적으로 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 품목·BOM·라우팅 개념 기준과 ECO 시점 적용
      failure_condition: ECO 전후 구성 조회, 소급 추적 또는 미래 효력 구성을 결정해야 할 때
      impact: 동일 품목 번호에 적용할 BOM·라우팅을 시점별로 결정할 수 없어 생산 지시와 추적 결과의 신뢰가 약화된다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml >
          entities.Part.attributes.rev/current_eco
        - manufacturing-bom-ontology.yaml > entities.BomLine
        - manufacturing-bom-ontology.yaml > entities.Routing
        - manufacturing-bom-ontology.yaml > integrity_rules[2]
    causal_path:
      root_cause_candidate: 온톨로지가 개정 가능한 제조 구성보다 현재 상태의 품목 필드 중심으로 모델링되어 있다.
      root_cause_step_id: coverage-candidate-001.cause-002
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: BomLine과 Routing에는 버전 및 유효기간 속성이 없다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > entities.BomLine
            - manufacturing-bom-ontology.yaml > entities.Routing
        - cause_id: coverage-candidate-001.cause-002
          claim: 시점별 BOM·라우팅 구성을 식별할 수 없는 것은 Part의 현재 rev와 current_eco만 보유한 모델의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              entities.Part.attributes.rev/current_eco
            - manufacturing-bom-ontology.yaml > integrity_rules[2]
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-002
    target: manufacturing-bom-ontology.yaml — 제조 실행 및 실적 추적 범위
    evidence_anchor: entities 전체; integrity_rules[1]의 생산 오더 언급
    claim: 생산 오더와 실행 실적·자재 투입·완료품 계보 개념이 누락되어 PLM 기준정보를 MES 실행 결과와 연결할 수 없다.
    what: 규칙은 생산 오더 생성을 통제하지만 ProductionOrder/WorkOrder, 실행 공정, 실제 투입 수량,
      lot/serial, 생산 결과 또는 as-built BOM 엔티티가 없다.
    why: 라우팅 release가 생산 오더 생성을 허용한다는 규칙의 결과를 담을 개념이 없고, 계획 BOM과 실제 투입·생산 결과 사이의 차이를
      기록할 수 없다. 따라서 변경 영향 추적, 불량 범위 판정, 실제 구성 검증 같은 PLM/MES 통합 목적이 닫히지 않는다.
    how_to_fix: 최소 범위로 ProductionOrder, OperationExecution, MaterialConsumption,
      ProducedUnit/Lot 및 이들의 계획 BOM·Routing revision 참조를 추가해 계획 대비 실적과 as-built
      계보를 표현한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서
      failure_condition: released Routing으로 생성된 생산 오더의 실행과 실제 구성 또는 lot 추적이 필요할 때
      impact: 기준정보에서 실행으로 이어지는 핵심 경계가 비어 있어 MES가 온톨로지 밖의 독자 개념을 만들게 되고 통합 기준의 역할을 수행하지
        못한다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml > entities
        - manufacturing-bom-ontology.yaml > integrity_rules[1]
    causal_path:
      root_cause_candidate: 모델 범위가 제조 기준정보에 머물고 실행 트랜잭션과 계보 하위 영역을 포함하지 않는다.
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: 생산 오더 생성 규칙은 존재하지만 대응 엔티티와 실행 결과 개념이 없다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > integrity_rules[1]
            - manufacturing-bom-ontology.yaml > entities
        - cause_id: coverage-candidate-002.cause-002
          claim: 계획과 실제 제조 구성을 연결할 수 없는 것은 실행·계보 하위 영역 누락의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml > entities.BomLine
            - manufacturing-bom-ontology.yaml > entities.Routing
            - manufacturing-bom-ontology.yaml > entities
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: manufacturing-bom-ontology.yaml — 변경 및 릴리스 통제 증거
    evidence_anchor: entities.ECO.attributes; entities.Routing.attributes.status
    claim: ECO 승인·적용과 Routing 릴리스에 행위자, 시각, 근거 및 결정 기록을 남기는 감사 증거 개념이 없다.
    what: ECO와 Routing에는 상태 값만 있고 누가 언제 어떤 근거로 승인·릴리스·적용했는지를 표현하는 승인 사건이나 감사 이력이 없다.
    why: 상태가 approved, applied 또는 released라는 사실만으로는 통제 행위의 책임과 근거를 검증할 수 없다. 잘못된 변경
      적용이나 수동 상태 조정이 발생해도 원인과 승인 경로를 재구성할 수 없다.
    how_to_fix: 공통 LifecycleEvent 또는 ApprovalRecord를 추가해 대상, 이전·이후 상태, actor,
      occurred_at, rationale/evidence, source_system을 기록하고 ECO 승인·적용 및 Routing
      릴리스가 해당 사건을 통해서만 성립하도록 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 변경관리 정합성과 제조 운영 통제
      failure_condition: ECO 승인·적용 또는 Routing 릴리스의 정당성과 이력을 감사하거나 오류를 조사할 때
      impact: 생산에 직접 영향을 주는 상태 전환의 증거가 없어 변경 통제와 사고 조사 결과를 신뢰할 수 없다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml > entities.ECO.attributes.status
        - manufacturing-bom-ontology.yaml > entities.Routing.attributes.status
    causal_path:
      root_cause_candidate: 상태를 지속되는 값으로만 모델링하고 상태를 만든 통제 사건을 독립 개념으로 모델링하지 않았다.
      root_cause_step_id: coverage-candidate-003.cause-002
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: ECO와 Routing의 상태 전환에 actor, timestamp, rationale 속성 또는 연결 엔티티가 없다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > entities.ECO
            - manufacturing-bom-ontology.yaml > entities.Routing
        - cause_id: coverage-candidate-003.cause-002
          claim: 감사 추적 부재는 상태 중심 모델에서 전환 사건이 누락된 결과다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml > entities.ECO.attributes.status
            - manufacturing-bom-ontology.yaml >
              entities.Routing.attributes.status
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: manufacturing-bom-ontology.yaml — 측정 단위 및 환산
    evidence_anchor: entities.Part.attributes.uom;
      entities.BomLine.attributes.qty_per;
      entities.WorkCenter.attributes.capacity_per_shift; notes[1]
    claim: 수량·능력의 측정 단위와 환산계수 체계가 불완전해 BOM 전개와 능력 계산을 일관되게 수행할 수 없다.
    what: Part.uom은 ea/kg/m만 허용하고 BomLine.qty_per에는 별도 단위가 없으며
      WorkCenter.capacity_per_shift의 단위는 작업장마다 다르다. 문서는 품목별 환산계수 마스터가 없고 현장에서
      환산한다고 명시한다.
    why: 동일 수량 필드가 개수·중량·길이 또는 시간 의미를 가질 수 있지만 단위와 환산 근거를 기계적으로 판정할 수 없다. 현장 수동 환산은
      자재 소요량과 생산능력 계산의 반복성과 검증 가능성을 훼손한다.
    how_to_fix: Measurement/UOM과 품목별 UomConversion을 추가하고 값, 단위, 유효기간, 변환 방향과 근거를
      모델링한다. qty_per, scrap 관련 수량, std_time, capacity에 명시적 단위를 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: BOM 수량 및 제조 운영 능력의 일관된 PLM/MES 해석
      failure_condition: 서로 다른 단위의 품목을 BOM에서 사용하거나 작업장 능력을 비교·계획할 때
      impact: 자재 소요량과 능력 계획이 현장별 수동 해석에 의존해 과소·과다 계획 위험이 발생한다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml > entities.Part.attributes.uom
        - manufacturing-bom-ontology.yaml > entities.BomLine.attributes.qty_per
        - manufacturing-bom-ontology.yaml >
          entities.WorkCenter.attributes.capacity_per_shift
        - manufacturing-bom-ontology.yaml > notes[1]
    causal_path:
      root_cause_candidate: 측정값을 단위가 결합된 개념으로 모델링하지 않고 무차원 number 속성으로 두었다.
      root_cause_step_id: coverage-candidate-004.cause-002
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: qty_per와 capacity_per_shift는 계산에 필요한 단위 의미를 완전하게 표현하지 않는다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              entities.BomLine.attributes.qty_per
            - manufacturing-bom-ontology.yaml >
              entities.WorkCenter.attributes.capacity_per_shift
        - cause_id: coverage-candidate-004.cause-002
          claim: 현장 환산 의존은 품목별 환산계수 마스터가 없는 측정 모델의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml > notes[1]
            - manufacturing-bom-ontology.yaml > entities.Part.attributes.uom
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-005
    target: manufacturing-bom-ontology.yaml — 병행 관리 값의 권위와 이력
    evidence_anchor: entities.BomLine.attributes.scrap_rate.note; notes[0]
    claim: scrap_rate와 표준시간 기반 원가 값이 복수 시스템에서 병행 관리되지만 단일 권위와 대사 이력 개념이 없다.
    what: scrap_rate는 생산계획팀 Excel 값을 복사하며, 누적 std_time은 MES 계산값과 표준원가 시스템 수기 입력값을
      분기마다 대사한다. 어느 값이 충돌 시 권위인지, 복사·대사 시점과 결과를 어디에 남기는지는 정의되지 않는다.
    why: 복사본과 수기 값이 달라질 때 통합 소비자가 사용할 정본을 결정할 수 없다. 또한 시간에 따라 바뀌는 계수와 대사 결과의 이력이 없어
      과거 계획·원가 계산을 재현하기 어렵다.
    how_to_fix: 각 공유 값에 authoritative_source, effective_from/to, captured_at를 지정하고
      ReconciliationRecord로 비교 대상, 차이, 조정 결정, actor와 시각을 기록한다. 가능하면 파생 가능한 누적
      std_time은 Routing revision에서 계산되는 값으로 단일화한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 및 원가 시스템 사이의 기준값 정합성
      failure_condition: Excel, MES와 표준원가 시스템의 값이 불일치하거나 과거 계산 근거를 재현해야 할 때
      impact: 소비 시스템별로 다른 계수와 시간이 적용되어 생산계획·원가 결과가 달라질 수 있고 대사 결과도 감사할 수 없다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml >
          entities.BomLine.attributes.scrap_rate.note
        - manufacturing-bom-ontology.yaml > notes[0]
    causal_path:
      root_cause_candidate: 공유 값을 출처·유효기간·대사 사건을 가진 관리 개념이 아니라 단순 숫자 필드와 설명문으로 표현했다.
      root_cause_step_id: coverage-candidate-005.cause-002
      steps:
        - cause_id: coverage-candidate-005.cause-001
          claim: scrap_rate와 누적 std_time 관련 값은 여러 저장소에서 복사 또는 수기 관리된다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              entities.BomLine.attributes.scrap_rate.note
            - manufacturing-bom-ontology.yaml > notes[0]
        - cause_id: coverage-candidate-005.cause-002
          claim: 충돌 시 정본과 과거 근거를 결정할 수 없는 것은 권위·시간성·대사 기록 차원이 누락된 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              entities.BomLine.attributes.scrap_rate
            - manufacturing-bom-ontology.yaml > notes[0]
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - PLM/MES 통합의 개념 기준은 설계 기준정보뿐 아니라 생산 지시와 실제 실행 결과 사이의 추적 가능한 연결을 표현해야 한다.
  - 변경 또는 릴리스 상태가 생산 가능 여부를 통제한다면 상태 전환의 행위자·시각·근거를 재구성할 수 있어야 한다.
  - 수량과 능력을 시스템 간 계산에 사용하려면 명시적 단위, 환산 근거 및 공유 값의 권위가 필요하다.
validation:
