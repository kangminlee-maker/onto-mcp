  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260718-76a67afe/round1/axiology.findings.yaml#axiology-candidate-003
    target: manufacturing-bom-ontology.yaml — BOM 비순환성과 스크랩 재투입 예외
    evidence_anchor: "Value authority: review-value-alignment-criteria.yaml:6-8 (BOM
      개념 정합성과 제조 운영 위험). Target evidence: materialized-input.md:29-35,93-95."
    claim: 재생 공정 표현의 국소 편의를 위해 BOM의 핵심 비순환 약속을 깨는 예외가 통합 기준의 안정성을 훼손한다.
    lens_rationale_summary: 제품 구성 관계에 공정상의 회수·재투입 흐름을 넣으면 동일 그래프에 상충하는 의미가 공존한다. 일반
      BOM 전개, 소요량 계산 또는 순환 검증이 전역 비순환성을 신뢰할 수 없어 개념 기준으로서의 일관성과 소비자 안전이 약화된다.
    proposed_action: BOM 구성은 비순환 불변식으로 유지하고, 스크랩 회수·재투입은 Routing/Operation과 물질 흐름 또는
      부산물·재투입 관계로 별도 모델링한다. 별도 순환 흐름이 필요한 소비자와 계산 규칙도 명시한다.
    affected_purpose: BOM 개념 정합성을 보장하고 PLM/MES 소비자가 일관된 구성 의미를 공유하게 하는 목적.
    failure_condition: 스크랩 재투입이 있는 Assembly를 일반 BOM 전개나 소요량 계산에 투입하는 경우.
    impact: 비순환이라는 핵심 계약을 소비자가 안전하게 가정할 수 없고, 제품 구성과 공정 물질 흐름이 혼합된다.
    evidence_refs:
      - .onto/review/20260718-76a67afe/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:29-35
      - materialized-input.md:93-95
      - review-value-alignment-criteria.yaml:6-8
    severity: medium
    domain_threshold_used: null
    materiality_basis:
