          claim: 비순환 규칙과 자기 포함 예외가 하나의 integrity rule 안에 함께 선언되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:93-95
        - cause_id: finding-003.cause-002
          claim: BomLine은 상위 조립품이 하위 품목을 얼마나 사용하는지 나타내는 제품 구성 개념으로만 정의되어 있다.
          relation_to_previous: symptom_of
          evidence_refs:
