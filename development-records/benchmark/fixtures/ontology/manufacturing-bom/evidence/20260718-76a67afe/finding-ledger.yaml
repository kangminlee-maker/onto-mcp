      evidence: materialized-input.md:20-21,69-75,93-96."
    claim: ECO 발효 시점과 Part.rev 동기화 시점의 의도적 불일치가 통합 기준 문서의 변경관리 목적에 어긋난다.
    lens_rationale_summary: 동일 문서가 발효일 이후 신규 리비전 사용을 요구하는 동시에 기준 속성이 일정 기간 구버전일 수
      있음을 허용한다. 그 기간에는 생산오더가 어느 리비전을 사용해야 하는지 Part.rev만으로 결정할 수 없어 PLM/MES 간 일관된
      변경 적용과 운영 안전이라는 선언 목적이 실패한다.
    proposed_action: Part.rev의 단일 최신값과 주간 복사를 생산 판단 기준으로 삼지 말고, ECO·품목·리비전의
      effective-dated applicability를 명시적으로 모델링한다. 생산오더 생성 시점·수량 또는 lot/serial
      범위에 따라 적용 리비전을 권위 원천에서 결정하고, 동기화 지연 중에는 생성 차단 또는 명시적 예외 승인을 규정한다.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서 변경 적용과 제조 실행이 동일한 리비전을 결정하게 하는 목적.
    failure_condition: ECO.effective_date가 지났지만 주간 배치가 아직 Part.rev를 갱신하지 않은 기간에 생산오더를 생성하는 경우.
    impact: 서로 다른 리비전으로 설계·생산 판단이 갈릴 수 있어 통합 기준의 신뢰성과 실제 생산 적합성이 직접 약화된다.
