      - Operation은 실행 가능한 라우팅 단계이고 InspectionPlan은 그 실행을 규정하는 사양·계획 객체라고 해석했습니다.
      - rate는 차원 없는 비율이고 factor는 특정 산식에 적용되는 계수이므로 이름과 적용 규칙이 구분되어야 한다고 가정했습니다.
      - 용량 수량과 가용 시간은 서로 다른 측정 차원이므로 단위 또는 측정 유형 없이 동일 숫자 속성으로 교환할 수 없다고 가정했습니다.
