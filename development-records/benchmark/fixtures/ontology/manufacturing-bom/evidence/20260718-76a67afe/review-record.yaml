      - PLM/MES 소비자는 문서에 선언된 integrity rule과 속성 의미를 공통 계약으로 사용할 수 있다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합의 개념 기준은 변경 시점별 설계·공정 정의를 재구성하고 최소한 생산 오더에 적용 기준을 고정할 수 있어야 한다.
      - 온톨로지의 integrity_rules에서 직접 언급한 생산 오더는 선언 범위 안에서 표현되어야 하는 개념으로 보았다.
      - 외부 산업 표준은 session_domain=none 및 웹 조사 금지 경계 때문에 비교 근거로 사용하지 않았다.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합 기준은 여러 설계변경 이후에도 과거 생산 시점의 구성과 공정을 재구성할 수 있어야 한다.
      - 신규 품목·공장·설비를 도입하면 현재 열거되지 않은 단위와 라우팅 또는 자원 변형이 생길 수 있다.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - 엔티티 definition은 해당 엔티티의 모든 인스턴스에 적용되는 선언적 제약으로 해석했다.
      - direction의 one_way는 역방향 관계를 필수로 만들지 않는 허용 상태로 해석했다.
  semantics:
