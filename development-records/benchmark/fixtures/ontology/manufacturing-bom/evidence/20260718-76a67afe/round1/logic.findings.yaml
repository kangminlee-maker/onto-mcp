      failure_condition: direction=one_way인 AlternatePart가 생성되거나 기본값이 적용될 때
      impact: 동일 관계를 한 시스템은 양방향, 다른 시스템은 단방향으로 처리할 수 있어 대체품 선택과 제조 실행 판단의 신뢰성이 약화된다.
