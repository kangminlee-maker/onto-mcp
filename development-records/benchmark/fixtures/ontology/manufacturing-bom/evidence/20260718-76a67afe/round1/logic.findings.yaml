    evidence_anchor: .onto/review/20260718-76a67afe/execution-preparation/materialized-input.md:37-45
    claim: AlternatePart의 필수 대칭성 정의와 기본 one_way 방향 설정은 one_way 인스턴스에서 동시에 만족될 수 없다.
    what: 정의는 모든 대체 관계가 역방향으로도 성립한다고 선언하지만, direction은 one_way를 허용하며 기본값으로 지정한다.
    why: 충돌 쌍은 materialized-input.md:38과 :42-45이다. 이는 inter-claim 충돌이며, one_way 관계에서
      필수 대칭성과 허용된 비대칭 상태가 충돌하는 mixed modality 오류다. PLM과 MES가 서로 다른 선언을 기준으로 대체
      가능 방향을 해석하면 역대체 허용 여부가 일관되지 않게 된다.
    how_to_fix: 방향성을 유지하려면 정의를 `direction=bidirectional일 때만 역관계가 성립한다`로 수정하고
      one_way에는 역관계가 암시되지 않는다는 제약을 명시한다. 모든 대체가 대칭이어야 한다면 direction 속성과 one_way
      값을 제거한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
