    claim: "`AlternatePart`가 명시적 관계 그래프에서 우회되어 관계 엔티티의 구조적 연결이 끊겨 있다."
    what: "`AlternatePart`는 두 Part 참조와 방향 속성을 가진 관계 엔티티로 정의되지만, `relations`에는 이 엔티티를
      시작점이나 종점으로 하는 간선이 없다. 대신 `Part -> Part`의 `alternate_of` 단축 관계만 있으며, 그 주석은
      해당 관계가 `AlternatePart`를 통해 표현된다고 설명한다."
    why: 관계 그래프만 소비하면 `AlternatePart.direction`, `primary_ref`, `alternate_ref`로
      이어지는 경로가 없어 단축 관계를 관계 엔티티의 세부 정보와 결합할 수 없다. PLM/MES 구현이 단축 간선과 관계 엔티티 중 서로
      다른 구조를 기준으로 삼을 수 있어, 대체품 방향 정보가 통합 경로에서 유실될 수 있다.
    how_to_fix: "`AlternatePart`를 정식 관계 노드로 연결하는 명시적 간선을 추가한다. 예를 들어 `Part ->
      AlternatePart`와 `AlternatePart -> Part` 관계를 각각 primary/alternate 역할로 선언하고,
      `Part -> Part alternate_of`는 이 구조에서 파생되는 projection임을 명시하거나 제거한다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
