  - candidate_id: coverage-candidate-002
    target: Routing 및 Operation lifecycle
    evidence_anchor: materialized-input.md:47-61, 93-96
    claim: 라우팅은 draft와 released만 표현하며 버전, 효력 구간, 종료·대체 상태가 누락되어 있다.
    what: Routing에는 revision이나 valid_from/valid_to가 없고 상태도 draft와 released뿐이다.
      Operation의 변경 이력이나 특정 Routing 버전에 귀속되는 스냅샷 개념도 없다.
    why: 공정 순서, 작업장, 표준시간이 변경되면 과거 생산에 사용된 라우팅과 현재 라우팅을 구별하거나 단종·대체된 라우팅의 사용을 통제할 수
      없다.
    how_to_fix: RoutingRevision 또는 동등한 버전 개념과 유효기간을 추가하고 lifecycle에
      obsolete/superseded 등 종료 상태를 포함한다. Operation 사양도 적용 Routing 버전에 고정되도록
      모델링한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM 정의와 MES 생산 공정 간 라우팅 기준의 일관성
      failure_condition: 공정 순서, 작업장 또는 표준시간이 릴리스 후 변경되거나 기존 라우팅이 종료되는 경우
      impact: 생산 시점에 적용해야 할 공정 정의와 과거 실행 기준을 판별할 수 없어 잘못된 공정 투입과 추적성 상실 위험이 생긴다.
      evidence_refs:
        - materialized-input.md:47-61
        - materialized-input.md:93-96
    causal_path:
      root_cause_candidate: 라우팅과 공정 정의에 시간적 버전 및 완결된 lifecycle 모델이 없다.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: 변경 전후 또는 종료된 라우팅을 시점별로 판별할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:55-61
        - cause_id: coverage-candidate-002.cause-002
          claim: Routing은 식별자, 품목, 현재 공정 목록과 draft/released 상태만 보유한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:55-61
        - cause_id: coverage-candidate-002.cause-003
          claim: Operation에도 버전이나 효력 구간이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
