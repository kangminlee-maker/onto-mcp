  - candidate_id: coverage-candidate-001
    target: BomLine 및 ECO 변경 적용 모델
    evidence_anchor: materialized-input.md:29-35, 69-75, 93-96
    claim: BOM 구성의 리비전·유효기간·변경 이력이 표현되지 않아 특정 시점의 적용 BOM을 재구성할 수 없다.
    what: ECO에는 effective_date가 있지만 BomLine에는 BOM 리비전, 유효 시작·종료 시점, 변경 원인 ECO가 없다.
      Assembly도 현재 bom_lines 목록만 보유한다.
    why: ECO 적용 전후의 구성과 수량을 함께 보존할 개념이 없으므로 PLM의 설계 변경을 MES 생산 시점의 정확한 BOM으로 결정하거나
      과거 생산분을 추적할 수 없다.
    how_to_fix: 버전이 식별되는 BOM/BOMRevision 개념을 추가하고 BomLine에 valid_from, valid_to 및
      source_eco_ref를 두어 시점 기준 구성을 조회할 수 있게 한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 품목·BOM·변경관리의 정합성을 제공하는 PLM/MES 통합 개념 기준
      failure_condition: ECO 전후 BOM이 달라지거나 과거 생산 시점의 구성 검증이 필요한 경우
      impact: 동일 품목 번호에 어떤 구성과 수량이 적용되었는지 결정할 수 없어 생산 투입, 변경 준수, 이력 감사의 신뢰가 약화된다.
      evidence_refs:
        - materialized-input.md:29-35
        - materialized-input.md:69-75
        - materialized-input.md:93-96
    causal_path:
      root_cause_candidate: BOM 구성에 독립적인 버전·효력 구간 모델이 없다.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
