  - candidate_id: evolution-candidate-003
    target: manufacturing-bom-ontology.yaml — 라우팅 및 자원 변형 모델
    evidence_anchor: .onto/review/20260718-76a67afe/execution-preparation/materialized-input.md:47-67,87-89
    claim: 신규 공장, 대체 설비 또는 시점별 표준시간을 수용하려면 Routing·Operation 구조를 수정해야 한다.
    what: Routing은 Part와 하나의 순서 목록만 연결하고, Operation은 단일 WorkCenter와 단일 std_time_min을
      직접 보유한다. 사이트, 대체 자원, 적용 조건 또는 시간 유효성 개념이 없다.
    why: 동일 품목을 공장별로 다른 순서로 생산하거나 한 공정을 여러 설비에서 수행하게 되면 기존 속성만으로 변형 간 적용 범위를 구분할 수
      없다. 레코드 복제로 우회하면 어느 라우팅이나 자원이 실제 조건에 유효한지 표현되지 않는다.
    how_to_fix: RoutingVariant 또는 RoutingRevision에 site와 effectivity를 두고,
      OperationStep과 ResourceAssignment를 분리하여 우선순위·대체 가능성·적용 조건·조건별 표준시간을 표현한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: MES가 확장된 생산 환경에서도 품목별 유효 라우팅과 실행 자원을 일관되게 선택하도록 하는 통합 기준
      failure_condition: 동일 품목에 공장별 라우팅, 대체 작업장 또는 시점별 표준시간 변형을 추가할 때
      impact: 기존 구조 수정이나 의미가 불명확한 중복 레코드가 필요해져 확장성과 실행 기준의 결정성이 약화된다.
      evidence_refs:
        - materialized-input.md:47-67
        - materialized-input.md:87-89
    causal_path:
      root_cause_candidate: 공정 단계의 정의와 조건별 자원 배정·시간·라우팅 변형이 분리되지 않았다.
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 공장별 또는 대체 자원별 변형을 기존 필드로 구분하거나 선택할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:47-67
        - cause_id: evolution-candidate-003.cause-002
          claim: Operation이 단일 work_center와 std_time_min을 직접 소유하고 Routing은 조건 없는
            ordered_list만 소유한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:52-53
            - materialized-input.md:55-61
            - materialized-input.md:87-89
        - cause_id: evolution-candidate-003.cause-003
          claim: 공정 단계의 정의와 조건별 자원 배정·시간·라우팅 변형이 분리되지 않았다.
          relation_to_previous: symptom_of
