  - candidate_id: evolution-candidate-002
    target: manufacturing-bom-ontology.yaml — 단위 체계 확장
    evidence_anchor: .onto/review/20260718-76a67afe/execution-preparation/materialized-input.md:19,63-67,100
    claim: 새 측정 단위나 작업장 능력 단위를 추가할 때 기존 스키마 수정 또는 외부 관례가 필요하다.
    what: Part.uom은 ea·kg·m의 폐쇄 enum이며, WorkCenter.capacity_per_shift는 단위를 속성으로 갖지
      않는다. 품목별 환산계수도 모델 밖의 현장 처리로 남아 있다.
    why: 통합 시스템이 다른 단위의 품목이나 작업장을 도입하면 기존 enum을 변경해야 하고, 능력 값은 동일 필드에서 의미가 달라진다. 기존
      값과 신규 값의 비교·변환 연속성도 환산 규칙이 없어서 유지되지 않는다.
    how_to_fix: UnitOfMeasure와 Quantity를 재사용 가능한 개념으로 분리하고 차원·단위 코드·환산 규칙을 모델링한다.
      capacity_per_shift도 값, 단위, 기준 교대 또는 시간 구간을 명시하도록 확장한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 서로 다른 PLM/MES 데이터의 품목 수량 및 생산능력 의미를 지속적으로 통합하는 기준
      failure_condition: ea·kg·m 이외의 단위 또는 기존 작업장과 다른 능력 단위를 가진 품목·작업장을 추가할 때
      impact: 스키마 변경이나 비표준 현장 환산에 의존하게 되어 신규 데이터 수용성과 기존 데이터 비교 가능성이 약화된다.
      evidence_refs:
        - materialized-input.md:19
        - materialized-input.md:63-67
        - materialized-input.md:100
    causal_path:
      root_cause_candidate: 수량의 값·차원·단위·환산 규칙이 공통 확장 개념으로 분리되지 않았다.
      root_cause_step_id: evolution-candidate-002.cause-003
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: 새 단위는 Part.uom enum 수정이 필요하고 작업장 능력 값의 단위는 레코드만으로 판별할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:19
            - materialized-input.md:63-67
        - cause_id: evolution-candidate-002.cause-002
          claim: 환산은 품목별 마스터 없이 현장에서 처리하도록 되어 있다.
          relation_to_previous: symptom_of
          evidence_refs:
