    target: manufacturing-bom-ontology.yaml — revision and effectivity model
    evidence_anchor: .onto/review/20260718-76a67afe/execution-preparation/materialized-input.md:20-21,27-35,55-61,69-75,96
    claim: 후속 ECO가 BOM 또는 라우팅을 변경하면 과거 구성의 연속성을 보존할 수 없다.
    what: Part에는 현재 rev와 current_eco만 있고, BomLine·Routing·Operation에는 개정 식별자나 유효 기간이
      없다. ECO도 단일 effective_date만 제공한다.
    why: 두 번째 이상의 변경이 적용되면 BOM 라인과 라우팅이 어느 품목 개정에 유효했는지 표현할 연결점이 없다. 따라서 과거 생산 시점의
      설계·BOM·공정 구성을 재구성하거나 PLM 변경 이력을 MES 실행 이력과 안정적으로 대응하기 어렵다.
    how_to_fix: PartRevision을 독립 엔티티로 두고 ECO가 생성·승인한 개정을 연결한다. BOM 및 Routing에도
      revision/effectivity를 부여하고 생산 오더가 사용한 확정 개정 참조를 보존한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 품목·BOM·라우팅·변경관리의 PLM/MES 통합 기준과 변경 이후 데이터 연속성
      failure_condition: 동일 품목에 둘 이상의 ECO가 순차 적용되고 BOM 또는 라우팅이 개정될 때
      impact: 과거 생산분의 적용 설계와 공정을 판별할 수 없어 추적성, 변경 영향 분석, 재현 가능한 제조 기준에 대한 신뢰가 훼손된다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:27-35
        - materialized-input.md:55-61
        - materialized-input.md:69-75
        - materialized-input.md:96
    causal_path:
      root_cause_candidate: 개정과 유효성이 독립적인 일급 개념으로 모델링되지 않았다.
      root_cause_step_id: evolution-candidate-001.cause-003
