      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-003
    target: manufacturing-bom-ontology.yaml — BOM 비순환 규칙의 스크랩 재투입 예외
    evidence_anchor: integrity_rules[0]
    claim: 공정의 스크랩 재투입 흐름을 제품 구성 관계인 자기 하위 포함으로 표현해 서로 다른 의미를 혼합했습니다.
    what: BOM은 상위 품목이 하위 품목을 사용하는 제품 구조로 정의되어 있지만, 재생 원료 회수라는 공정 물류 흐름을 Assembly가 자기
      자신을 포함하는 BomLine으로 모델링하도록 합니다.
    why: 자기 포함은 동일 품목의 구성 의미를 만들며 재투입 원료의 발생·회수·수율·투입 흐름을 표현하지 못합니다. BOM 전개 소비자는 이를
      실제 구성 순환으로 해석할 수 있어 수량 전개와 자재 소요 판단이 불명확해집니다.
    how_to_fix: BOM 구성 관계는 비순환으로 유지하고, 스크랩 발생 및 재투입은 Operation 또는 Routing 사이의 별도
      material_flow/rework/recycle 관계와 수량·수율 속성으로 모델링하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 제품 구조와 제조 공정 흐름을 PLM/MES 사이에서 동일하게 해석하는 개념 기준
      failure_condition: 스크랩 재투입을 표현한 자기 참조 BomLine을 일반 BOM 전개 또는 소요량 계산이 소비할 때
      impact: 구성 수량과 공정 회수량이 같은 관계로 해석되어 BOM 전개 및 자재 계획의 의미적 신뢰가 약화됩니다.
      evidence_refs:
        - "manufacturing-bom-ontology.yaml: BomLine.definition"
        - "manufacturing-bom-ontology.yaml: BomLine.parent_ref/child_ref"
        - "manufacturing-bom-ontology.yaml: integrity_rules[0]"
    causal_path:
      root_cause_candidate: 제품 구성과 공정 내 물질 흐름을 별도 관계로 모델링하지 않았습니다.
      root_cause_step_id: semantics-candidate-003.cause-002
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: 비순환 BOM 규칙이 스크랩 재투입에 한해 자기 포함을 요구합니다.
          relation_to_previous: null
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: integrity_rules[0]"
        - cause_id: semantics-candidate-003.cause-002
          claim: 스크랩 재투입이라는 공정 흐름이 BomLine의 상위-하위 구성 관계로 대체 표현된 결과입니다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: BomLine.definition"
            - "manufacturing-bom-ontology.yaml: integrity_rules[0]"
      unresolved_beyond_evidence: 재투입량 계산 방식과 실제 소비자의 순환 처리 방식은 경계 내 자료에 없습니다.
  - candidate_id: semantics-candidate-004
    target: manufacturing-bom-ontology.yaml — BomLine.scrap_rate
    evidence_anchor: BomLine.attributes.scrap_rate
    claim: scrap_rate라는 비율과 ‘공정 불량 감안 계수’를 동일시하고 외부 값을 독립 입력으로 복사해 의미와 권한이 불명확합니다.
    what: 속성명은 비율을 뜻하지만 설명은 계수라고 하며, 값은 생산계획팀 엑셀에서 복사됩니다. 비율의 범위, 단위, 적용 산식과 기준 공정도
      정의되지 않습니다.
    why: 예를 들어 10%를 0.1의 비율로 볼지 1.1 등의 소요계수로 볼지에 따라 자재 소요량이 달라집니다. 또한 공정 성과에서 파생되는
      값과 복사된 계획 입력이 구분되지 않아 원천 변경 시 드리프트할 수 있습니다.
    how_to_fix: 의도에 따라 scrap_fraction 또는 gross_up_factor 중 하나로 명명하고 값 범위·단위·qty_per
      적용 산식을 명시하십시오. 공정별 파생값이면 원천 측정값과 계산 규칙을 모델링하고, 계획 기준값이면 별도 권한·유효기간을 가진
      planning_scrap_factor로 구분하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM 수량과 공정 손실을 일관되게 해석하여 자재 소요를 교환하는 개념 기준
      failure_condition: PLM 또는 MES가 scrap_rate를 서로 다른 비율/계수 산식으로 qty_per에 적용하거나 복사본이 원천과 달라질 때
      impact: 동일 BOM에서 서로 다른 총소요량이 계산될 수 있어 계획 및 실행 데이터의 정합성이 약화됩니다.
      evidence_refs:
        - "manufacturing-bom-ontology.yaml: BomLine.qty_per"
        - "manufacturing-bom-ontology.yaml: BomLine.scrap_rate"
    causal_path:
      root_cause_candidate: 공정 손실의 측정 비율, 계획 계수, BOM 적용 결과를 하나의 독립 숫자 속성으로 합쳤습니다.
      root_cause_step_id: semantics-candidate-004.cause-003
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: scrap_rate가 단위·범위·산식 없는 number로 정의되어 있습니다.
          relation_to_previous: null
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: BomLine.scrap_rate"
        - cause_id: semantics-candidate-004.cause-002
          claim: 설명은 이를 rate가 아닌 ‘공정 불량 감안 계수’라고 부릅니다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: BomLine.scrap_rate note"
        - cause_id: semantics-candidate-004.cause-003
          claim: 외부 엑셀 값을 복사한다는 권한 구조는 측정값과 계획 입력의 미분리를 지속시킵니다.
          relation_to_previous: enables
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: BomLine.scrap_rate note"
      unresolved_beyond_evidence: 생산계획팀 엑셀 값의 실제 정의와 적용 산식은 경계 내 자료에 없습니다.
  - candidate_id: semantics-candidate-005
    target: manufacturing-bom-ontology.yaml — WorkCenter.capacity_per_shift
    evidence_anchor: WorkCenter.attributes.capacity_per_shift
    claim: 서로 차원이 다른 수량과 시간을 하나의 capacity_per_shift 숫자로 표현해 속성명이 일정한 의미를 갖지 못합니다.
    what: 동일 속성이 작업장마다 개수 또는 시간을 뜻한다고 명시되어 있지만 단위나 용량 유형을 함께 보유하지 않습니다.
    why: 처리 가능 수량과 가용 시간은 직접 대체 가능한 값이 아니며 계산식도 다릅니다. PLM/MES 소비자는 숫자만으로 의미를 판별할 수
      없어 작업장 용량 비교나 일정 계산에서 잘못된 해석이 가능합니다.
    how_to_fix: 용량 모델을 quantity_capacity와 available_time처럼 차원별로 분리하거나,
      capacity_value와 필수 capacity_measure_type/uom을 함께 정의하십시오. 교대 길이와 대상 품목·공정별
      처리율이 필요한 경우 별도 속성으로 표현하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 작업장 용량을 MES 계획·스케줄링에 일관되게 전달하는 개념 기준
      failure_condition: 단위 정보 없이 capacity_per_shift를 시스템 간 교환하거나 서로 다른 작업장의 값을 비교·계산할 때
      impact: 수량과 시간의 의미가 뒤바뀌어 용량 계산과 공정 배정 결과의 신뢰가 약화됩니다.
      evidence_refs:
        - "manufacturing-bom-ontology.yaml: WorkCenter.definition"
        - "manufacturing-bom-ontology.yaml: WorkCenter.capacity_per_shift"
    causal_path:
      root_cause_candidate: 용량의 값과 측정 차원·단위를 하나의 무단위 숫자 속성에 결합했습니다.
      root_cause_step_id: semantics-candidate-005.cause-002
      steps:
        - cause_id: semantics-candidate-005.cause-001
          claim: capacity_per_shift는 number 하나로 선언되어 있습니다.
          relation_to_previous: null
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: WorkCenter.capacity_per_shift"
        - cause_id: semantics-candidate-005.cause-002
          claim: 설명에서 그 숫자가 개수일 수도 시간일 수도 있다고 명시한 것은 속성 의미가 인스턴스마다 달라지는 증상입니다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: WorkCenter.capacity_per_shift
              note"
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - BOM의 상위-하위 관계는 제품 구성 및 기준 소요량을 나타내며 공정 내 회수·재투입 흐름과 구별되어야 한다고 가정했습니다.
  - Operation은 실행 가능한 라우팅 단계이고 InspectionPlan은 그 실행을 규정하는 사양·계획 객체라고 해석했습니다.
  - rate는 차원 없는 비율이고 factor는 특정 산식에 적용되는 계수이므로 이름과 적용 규칙이 구분되어야 한다고 가정했습니다.
  - 용량 수량과 가용 시간은 서로 다른 측정 차원이므로 단위 또는 측정 유형 없이 동일 숫자 속성으로 교환할 수 없다고 가정했습니다.
validation:
  unaddressable_candidates: []
