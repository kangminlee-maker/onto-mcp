      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: manufacturing-bom-ontology.yaml — InspectionPlan
    evidence_anchor: InspectionPlan.definition 및 InspectionPlan.is_a
    claim: 검사 계획이라는 정보·규범 객체를 실행 공정 단계인 Operation의 하위 유형으로 분류했습니다.
    what: "InspectionPlan은 sampling_rule과 acceptance_criteria를 보유한 계획/사양이지만 is_a:
      Operation으로 선언되어 라우팅 단계 자체와 동일한 존재론적 유형이 됩니다."
    why: 검사를 수행하는 Operation과 그 수행 방법·합격 기준을 규정하는 InspectionPlan은 서로 다른 개념입니다. 현재
      모델에서는 하나의 계획이 공정 순서 항목, 작업장, 표준시간을 상속하는 것으로 해석되어 PLM 품질 사양과 MES 실행 단계의 식별이
      혼동됩니다.
    how_to_fix: InspectionPlan을 독립된 사양 엔티티로 만들고 검사 Operation이 해당 계획을 references 또는
      governed_by 하도록 연결하십시오. 검사 공정 유형이 필요하면 InspectionOperation을 Operation의 하위
      유형으로 별도 정의하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품질 계획과 제조 실행 단계를 일관되게 교환하는 PLM/MES 개념 기준
      failure_condition: InspectionPlan 인스턴스를 Operation 하위 유형으로 직렬화하거나 라우팅 공정으로 소비할 때
      impact: 계획 문서의 버전·승인 의미와 실행 공정의 순서·자원 의미가 섞여 시스템 간 객체 식별과 변경 영향 판단이 불명확해집니다.
      evidence_refs:
        - "manufacturing-bom-ontology.yaml: Operation.definition"
        - "manufacturing-bom-ontology.yaml: InspectionPlan.definition"
        - "manufacturing-bom-ontology.yaml: InspectionPlan.is_a"
    causal_path:
      root_cause_candidate: 검사 행위와 그 행위를 규정하는 검사 사양을 구분하지 않았습니다.
      root_cause_step_id: semantics-candidate-002.cause-003
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: InspectionPlan이 Operation의 하위 유형으로 선언되어 있습니다.
          relation_to_previous: null
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: InspectionPlan.is_a"
        - cause_id: semantics-candidate-002.cause-002
          claim: 그러나 고유 속성은 샘플링 규칙과 합격 기준으로, 실행 단계가 아니라 규범적 사양의 의미를 가집니다.
          relation_to_previous: symptom_of
          evidence_refs:
