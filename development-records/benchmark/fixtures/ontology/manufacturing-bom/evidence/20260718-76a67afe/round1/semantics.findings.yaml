  - candidate_id: semantics-candidate-001
    target: manufacturing-bom-ontology.yaml — AlternatePart 및 alternate_of 관계
    evidence_anchor: AlternatePart.definition, AlternatePart.direction,
      relations[Part→Part alternate_of]
    claim: 대체품 관계를 대칭 관계와 방향성 관계로 동시에 정의해 의미가 모순됩니다.
    what: 정의는 “A의 대체가 B이면 B의 대체도 A”라고 단정하지만, direction은 one_way를 허용하며 기본값도
      one_way입니다. 단축 관계명 alternate_of도 방향성을 드러내지 않습니다.
    why: 동일한 대체 관계가 소비자에 따라 상호 대체 또는 단방향 대체로 해석될 수 있습니다. PLM의 승인 대체품을 MES가 역방향으로
      사용하면 허용되지 않은 부품 투입으로 이어질 수 있어 개념 기준 문서의 신뢰를 약화합니다.
    how_to_fix: AlternatePart를 방향성 있는 ‘허용 대체’ 관계로 정의하고 primary→alternate 방향을 명시하십시오.
      bidirectional은 두 방향 관계의 축약임을 규정하고, 단축 관계에도 방향 또는 대칭 여부가 보존되게 하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM과 MES가 동일한 부품 대체 가능성 및 방향을 해석하도록 하는 개념 기준
      failure_condition: direction=one_way인 AlternatePart를 정의문이나 alternate_of 단축 관계에
        따라 대칭 관계로 해석할 때
      impact: 승인되지 않은 역방향 대체를 허용할 수 있어 자재 투입 판단과 추적성의 신뢰가 약화됩니다.
      evidence_refs:
        - "manufacturing-bom-ontology.yaml: AlternatePart.definition"
        - "manufacturing-bom-ontology.yaml: AlternatePart.direction"
        - "manufacturing-bom-ontology.yaml: relations alternate_of"
    causal_path:
      root_cause_candidate: 대체 가능성의 방향성을 하나의 관계에서 일관되게 정의하지 않았습니다.
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: 대체 관계의 정의는 대칭성을 필수로 선언합니다.
          relation_to_previous: null
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: AlternatePart.definition"
        - cause_id: semantics-candidate-001.cause-002
          claim: 같은 엔티티가 one_way를 허용하고 이를 기본값으로 둔 것은 정의와 충돌하는 증상입니다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "manufacturing-bom-ontology.yaml: AlternatePart.direction"
        - cause_id: semantics-candidate-001.cause-003
          claim: alternate_of 단축 관계가 방향 정보를 보존하지 않는 것도 동일한 의미 모델 부재의 증상입니다.
          relation_to_previous: symptom_of
          evidence_refs:
