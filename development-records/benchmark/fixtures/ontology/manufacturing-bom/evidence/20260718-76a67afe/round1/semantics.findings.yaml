        - cause_id: semantics-candidate-002.cause-003
          claim: 정의가 ‘Operation의 검사 파라미터 확장’이라고 표현한 것은 두 개념을 한 상속 체계로 합친 원인을 직접 보여줍니다.
          relation_to_previous: symptom_of
          evidence_refs:
