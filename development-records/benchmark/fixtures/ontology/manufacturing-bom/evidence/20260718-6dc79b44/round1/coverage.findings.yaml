findings:
  - candidate_id: coverage-candidate-001
    target: BOM·Routing의 버전 및 유효성 모델
    evidence_anchor: .onto/review/20260718-6dc79b44/execution-preparation/materialized-input.md:20-35,55-61,69-75,93-96
    claim: ECO 적용 시점의 BOM·라우팅 구성을 재구성할 버전 및 유효기간 개념이 없다.
    what: Part에는 현재 도면 rev와 최신 ECO만 있고, Assembly의 bom_lines와 Routing의 operations에는
      개정 식별자, valid_from/valid_to, 변경 전후 이력 또는 ECO별 구성 스냅샷이 없다.
    why: 무엇이 신규 rev인지 적용 규칙은 선언하지만 어느 BOM 라인과 라우팅 버전이 그 rev에 속하는지 표현하지 못한다. 주간 동기화
      지연까지 있으므로 특정 생산 시점에 적용되어야 했던 구성을 PLM/MES가 동일하게 재현할 수 없다.
    how_to_fix: BomRevision과 RoutingRevision 같은 명시적 구성 버전을 추가하고 각 버전에 유효 시작·종료 시점,
      상태, ECO 참조, 불변 라인/공정 목록을 귀속시킨다. Part.rev는 이 구성 버전들과 명시적으로 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 품목·BOM·라우팅 개념 기준 및 변경 적용 일관성
      failure_condition: ECO 전후 생산분, 배치 동기화 지연 구간 또는 과거 생산 기록의 적용 구성을 판정할 때
      impact: 동일 시점의 제조 구성을 양 시스템에서 재현하거나 대사할 수 없어 구버전 부품·공정 적용 위험과 추적성 공백이 생긴다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:27-35
        - materialized-input.md:55-61
        - materialized-input.md:69-75
        - materialized-input.md:96
    causal_path:
      root_cause_candidate: BOM과 Routing이 시간에 따라 변하는 버전된 구성 개념이 아니라 현재 목록으로만 모델링되어 있다.
      root_cause_step_id: coverage-candidate-001.cause-002
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: ECO.effective_date 이후 신규 rev를 따르도록 했지만 해당 rev의 BOM·Routing 구성을 식별할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-75
            - materialized-input.md:96
        - cause_id: coverage-candidate-001.cause-002
          claim: Assembly.bom_lines와 Routing.operations에 개정 및 유효기간 차원이 없다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:23-35
            - materialized-input.md:55-61
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-002
    target: ECO 변경 내용 모델
    evidence_anchor: .onto/review/20260718-6dc79b44/execution-preparation/materialized-input.md:69-75,84-90,96
    claim: ECO가 정확히 무엇을 어떻게 변경하는지 표현하는 변경 항목 개념이 누락되었다.
    what: ECO는 affected_parts만 가리키며 변경 대상 BomLine, Routing, Operation, 속성, 변경 전 값,
      변경 후 값 또는 산출 개정판을 식별하지 않는다.
    why: Part 단위 영향 목록만으로는 승인된 변경을 BOM 및 라우팅에 결정적으로 적용하거나 PLM 변경 결과와 MES 반영 결과를 대사할
      수 없다.
    how_to_fix: ECOChangeItem을 추가하여 대상 객체와 대상 버전, 변경 유형, before/after 값 또는 결과 개정판,
      적용 순서를 표현하고 ECO와 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 설계변경을 PLM에서 MES의 BOM·라우팅으로 정확히 전달하는 개념 기준
      failure_condition: 하나의 품목에서 수량, 부품, 공정 순서 또는 작업 조건 중 일부만 변경될 때
      impact: affected_parts만으로는 승인된 변경 범위를 판정할 수 없어 수기 해석이나 과잉·누락 반영이 필요해진다.
      evidence_refs:
        - materialized-input.md:69-75
        - materialized-input.md:84-90
        - materialized-input.md:96
    causal_path:
      root_cause_candidate: 변경 지시와 구체적인 구성 변경 항목 사이의 개념 계층이 없다.
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: ECO 적용 규칙은 존재하지만 적용할 구체 변경 내용을 모델에서 찾을 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-75
            - materialized-input.md:96
        - cause_id: coverage-candidate-002.cause-002
          claim: ECO의 범위가 affected_parts 및 Part 관계로만 표현된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:73
            - materialized-input.md:90
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: ECO 승인 감사 증거
    evidence_anchor: .onto/review/20260718-6dc79b44/execution-preparation/materialized-input.md:69-75
    claim: 변경 승인과 적용을 입증할 행위자·시각·근거 개념이 없다.
    what: ECO에는 approved와 applied 상태가 있지만 승인자, 승인 시각, 적용자, 적용 시각, 변경 사유, 근거 문서 또는 상태
      전이 기록이 없다.
    why: 상태값만으로는 누가 어떤 근거로 승인·적용했는지 감사하거나 잘못된 상태 변경을 정정할 수 없다. PLM/MES 간 상태 불일치가
      발생해도 권위 있는 사건 기록을 대조할 수 없다.
    how_to_fix: ECOApproval 및 ECOStatusEvent를 추가해 actor, occurred_at, from_status,
      to_status, rationale/evidence_ref를 기록하고 현재 status는 사건 이력에서 도출한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 변경관리의 통제 가능성과 PLM/MES 반영 추적성
      failure_condition: 승인 적법성, 적용 책임 또는 양 시스템의 상태 불일치를 조사할 때
      impact: 승인·적용 상태의 근거를 검증할 수 없어 변경 통제와 사후 원인 분석의 신뢰가 약해진다.
      evidence_refs:
        - materialized-input.md:69-75
    causal_path:
      root_cause_candidate: ECO가 상태 보유 객체로만 정의되고 상태 전이 사건과 승인 증거가 별도 개념으로 모델링되지 않았다.
      root_cause_step_id: coverage-candidate-003.cause-002
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: approved 또는 applied 상태의 행위자·시각·근거를 재구성할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:75
        - cause_id: coverage-candidate-003.cause-002
          claim: ECO 속성에는 식별자, 영향 품목, 유효일, 현재 상태만 존재한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:69-75
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: 병행 관리 값의 원본 권위
    evidence_anchor: .onto/review/20260718-6dc79b44/execution-preparation/materialized-input.md:35,53,98-100
    claim: 복수 시스템에서 관리되는 scrap_rate와 표준시간 계열 값에 단일 권위와 충돌 해결 규칙이 없다.
    what: scrap_rate는 생산계획팀 엑셀 값을 복사하고, 누적 표준시간은 MES 계산값과 표준원가 시스템 수기값을 분기마다 대사하지만
      어느 값이 정본인지 또는 불일치 시 무엇을 우선하는지 정의하지 않는다.
    why: 동일 의미의 값이 복제·수기 관리되는 상황에서 권위 지정이 없으면 생산계획, 자재소요량 및 원가 계산이 서로 다른 값에 기반할 수
      있다.
    how_to_fix: 각 병행 관리 값에 authoritative_system, derivation_rule, synchronization
      cadence, observed_at/version, conflict_resolution을 정의한다. 가능하면 복제 필드는 원본에서
      도출되는 읽기 전용 투영으로 모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 및 계획·원가 시스템 사이의 공통 개념과 값 해석 일관성
      failure_condition: 복사·수기 입력 값과 MES 계산값이 서로 다를 때
      impact: 어느 값으로 계획하거나 원가를 계산해야 하는지 결정할 수 없어 대사 결과가 운영 판단으로 이어지지 않는다.
      evidence_refs:
        - materialized-input.md:35
        - materialized-input.md:53
        - materialized-input.md:99
    causal_path:
      root_cause_candidate: 병행 관리 사실은 서술했지만 값별 원본 권위와 동기화·충돌 계약을 개념화하지 않았다.
      root_cause_step_id: coverage-candidate-004.cause-002
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: 복제 또는 수기 입력 값이 불일치할 때 채택할 값을 판정할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:35
            - materialized-input.md:99
        - cause_id: coverage-candidate-004.cause-002
          claim: scrap_rate와 표준시간 계열 값에 authoritative_system 또는 conflict_resolution 속성이
            없다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:47-53
            - materialized-input.md:98-100
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-005
    target: 품목 단위 변환 개념
    evidence_anchor: .onto/review/20260718-6dc79b44/execution-preparation/materialized-input.md:14-20,29-35,98-100
    claim: 서로 다른 품목 단위를 BOM 수량으로 환산할 품목별 변환계수와 유효성 개념이 없다.
    what: Part.uom과 BomLine.qty_per는 존재하지만 품목별 환산계수 마스터가 없으며 kg↔ea 등의 변환을 현장에서 수행한다고
      명시한다.
    why: 단위가 다른 자재의 BOM 전개와 소요량 계산을 재현 가능한 규칙으로 수행할 수 없다. 수동 환산은 작업자별 결과 차이와 자재
      과소·과다 투입 위험을 만든다.
    how_to_fix: ItemUomConversion을 추가해 품목, 기준 단위, 대체 단위, 계수, 반올림 규칙,
      valid_from/valid_to, 승인 출처를 표현하고 BomLine 수량 계산이 이를 참조하도록 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM 기반 자재소요량과 MES 투입 수량의 일관된 계산
      failure_condition: 상위·하위 품목 또는 계획·현장 단위가 달라 환산이 필요한 경우
      impact: 통합 기준 문서만으로 수량을 결정할 수 없어 수동 판단에 의존하고 생산 및 재고 오차가 발생할 수 있다.
      evidence_refs:
        - materialized-input.md:19
        - materialized-input.md:29-35
        - materialized-input.md:100
    causal_path:
      root_cause_candidate: 단위는 품목 속성으로만 모델링되고 단위 간 변환은 관리 대상 개념에서 제외되었다.
      root_cause_step_id: coverage-candidate-005.cause-002
      steps:
        - cause_id: coverage-candidate-005.cause-001
          claim: kg와 ea 사이 변환이 필요한 BOM 수량을 모델만으로 계산할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:19
            - materialized-input.md:34
            - materialized-input.md:100
        - cause_id: coverage-candidate-005.cause-002
          claim: 품목별 환산계수 마스터가 없고 현장 수동 환산에 맡겨져 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:100
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-006
    target: Routing 및 ECO lifecycle
    evidence_anchor: .onto/review/20260718-6dc79b44/execution-preparation/materialized-input.md:55-61,69-75
    claim: Routing과 ECO의 lifecycle이 도입·활성 상태에만 머물고 종료·정정·재발행 구간을 포괄하지 않는다.
    what: Routing 상태는 draft/released뿐이고 ECO는 open/approved/applied뿐이다. obsolete,
      superseded, cancelled/rejected 같은 종결 상태와 적용 후 정정 또는 재발행 사건이 없다.
    why: 잘못 배포된 라우팅의 사용 중지, 대체 라우팅 전환, 철회된 변경, 적용 후 정정 같은 정상 운영 상황을 기존 상태 의미를 훼손하지
      않고 표현할 수 없다.
    how_to_fix: 각 lifecycle에 허용 전이와 terminal 상태를 추가하고 supersedes/superseded_by,
      cancellation, correction/reissue 사건을 별도 관계 또는 상태 사건으로 모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 라우팅과 변경지시의 전 생애주기 관리 및 안전한 생산 사용 통제
      failure_condition: 배포된 라우팅을 폐기·대체하거나 승인·적용된 ECO를 철회 또는 정정해야 할 때
      impact: 종결 및 정정 상황을 현재 상태 집합에 억지로 덮어써야 하므로 생산 가능 여부와 변경 이력의 의미가 모호해진다.
      evidence_refs:
        - materialized-input.md:55-61
        - materialized-input.md:69-75
    causal_path:
      root_cause_candidate: 상태 집합이 초기 작성과 정상 승인·적용 경로만 포함하고 종료 및 예외 사건을 모델링하지 않았다.
      root_cause_step_id: coverage-candidate-006.cause-002
      steps:
        - cause_id: coverage-candidate-006.cause-001
          claim: 폐기·대체·철회·정정 상황을 유효한 lifecycle 전이로 표현할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:61
            - materialized-input.md:75
        - cause_id: coverage-candidate-006.cause-002
          claim: Routing과 ECO의 enum에 활성 경로 상태만 정의되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:61
            - materialized-input.md:75
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - PLM/MES 통합의 개념 기준은 특정 생산 시점에 적용된 품목·BOM·라우팅 구성을 재구성할 수 있어야 한다.
  - 승인 및 적용 상태는 행위자·시각·근거를 가진 사건 증거로 추적되어야 한다.
  - 복수 시스템에서 같은 운영 값을 관리할 때는 정본과 충돌 해결 규칙이 필요하다.
  - BOM 수량 계산에 서로 다른 품목 단위가 사용될 수 있으며 문서에 명시된 kg↔ea 수동 환산은 통합 범위의 운영 위험이다.
validation:
  unaddressable_candidates: []
