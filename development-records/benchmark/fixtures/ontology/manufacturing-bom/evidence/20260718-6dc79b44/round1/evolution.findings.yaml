domain_context_assumptions:
  - PLM/MES 통합 기준은 변경 전후의 설계·공정 버전과 실제 생산에 사용된 버전을 함께 식별할 수 있어야 한다.
  - 측정 단위와 환산 규칙은 품목 및 연동 시스템이 늘면서 추가되거나 변경될 수 있다.
  - 부품 대체 허용 범위는 리비전, BOM, 사업장 또는 유효기간 같은 제조 문맥에 따라 달라질 수 있다.
