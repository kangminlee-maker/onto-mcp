    to_finding_id: finding-012
    relation: same_root_candidate
    root_hypothesis: 효과성을 독립적이고 확장 가능한 범위 개념으로 승격하지 않은 설계가 구성의 유효구간 부재와 ECO의 단일 날짜 고정을 함께 낳았다.
    shared_cause: null
    rationale: finding-005는 BOM·Routing의 시간별 유효성을, finding-012는 공장·로트·오더 등 비날짜 효과성을
      다룬다. 범위는 다르지만 둘 다 효과성을 현재값 또는 단일 날짜 속성으로 축약한 구조에서 발생한다.
