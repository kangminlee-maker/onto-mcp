relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-017
    relation: shared_cause_candidate
    root_hypothesis: 생산 적용 리비전의 독립 권위를 모델링하지 않고 ECO 날짜와 지연 갱신되는 Part.rev에 압축한 것이 두
      발견의 공통 원인이다. 생산 리비전이 별도 효과성 레코드로 결정됨을 입증하면 이 가설은 기각된다.
    shared_cause:
      cause_claim: 생산 적용 리비전 권위를 독립 모델링하지 않고 ECO 날짜와 Part.rev에 결합했다.
      from_cause_ref: finding-001.cause-003
      to_cause_ref: finding-017.cause-002
    rationale: finding-001은 효력일과 Part.rev 동기화 사이의 운영 공백을, finding-017은 도면 개정과 제조 개정의
      의미 혼합을 지적한다. 둘 다 같은 날짜에 적용할 제조 리비전을 독립적으로 식별하지 못한다.
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-005
    to_finding_id: finding-011
    relation: duplicates
    root_hypothesis: 두 발견은 BOM·Routing에 독립 리비전과 유효구간이 없어 과거 또는 미래 구성을 재구성할 수 없다는 동일
      결함을 서로 다른 렌즈에서 보고한다.
    shared_cause: null
    rationale: 대상, 실패 조건, 영향, 제안 조치가 모두 구성 버전과 effectivity 부재로 일치한다. finding-005는 범위
      완전성, finding-011은 변경 연속성 관점의 동일 문제다.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-005
    to_finding_id: finding-023
    relation: shared_cause_candidate
    root_hypothesis: 구성 버전을 독립 권위로 만들지 않고 변경 모델을 Part의 현재 rev 수준에 한정한 것이 시점별 구성 재구성
      실패와 ECO-to-configuration 경로 단절의 공통 원인이다.
    shared_cause:
      cause_claim: 변경 효력과 구성 식별이 버전 객체가 아니라 Part의 현재값 및 일반 ECO 관계에 축약되어 있다.
      from_cause_ref: finding-005.cause-002
      to_cause_ref: finding-023.cause-003
    rationale: finding-005는 유효 BOM·Routing을 시간축에서 식별하지 못함을, finding-023은 ECO에서 변경된
      구성으로 구조적 경로가 없음을 지적한다. 명시적 구성 버전과 ECO 연결을 추가하면 두 결함이 함께 해소되는지 검증할 수 있다.
    confidence: high
  - relation_id: rel-004
