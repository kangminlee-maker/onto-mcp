  - candidate_id: axiology-candidate-001
    target: manufacturing-bom-ontology.yaml — ECO effective-date and revision
      synchronization policy
    evidence_anchor: "Value authority:
      .onto/review/20260717-aa03f0e2/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-18, criterion user-request-intent — “PLM/MES 통합의 개념 기준
      문서…변경관리 개념의 정합성과 제조 운영 위험”; target:
      materialized-input.md:20-21,69-75,93-96 — ECO.effective_date 이후 신규 rev 적용을
      요구하면서 Part.rev는 주간 배치로 갱신"
    claim: "[commitment][misaligned] 변경 효력일 준수 약속과 주간 동기화 지연을 동시에 규범화해 PLM/MES 변경관리
      기준으로서의 목적을 훼손한다."
    what: ECO 효력일 이후 생산분은 신규 리비전을 따라야 하지만, MES가 참조할 Part.rev는 도면 관리대장 반영 후 주간 배치로만
      갱신된다. 효력일과 배치 사이의 생산 오더가 어떤 리비전을 사용해야 하는지 닫혀 있지 않다.
    why: 온톨로지가 변경 효력과 실행 리비전 사이의 시간차를 정상 상태로 허용하면, 동일 시점의 PLM과 MES가 서로 다른 유효 리비전을
      판단할 수 있다. 이는 변경관리 정합성과 구형 설계 생산 방지라는 제조 운영 목적에 직접 반한다.
    how_to_fix: ECO 적용 시점에 유효 리비전과 관련 BOM·Routing을 원자적으로 식별하는 effective-from 버전 관계를
      모델링하고, 동기화 완료 전에는 해당 생산 오더 발행을 차단하거나 명시적 승인 예외만 허용한다. Part.rev 캐시는 권위가 아닌
      파생값으로 선언한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 변경관리 개념 기준과 제조 운영 위험 통제
      failure_condition: ECO.effective_date가 도래했지만 주간 배치가 아직 Part.rev를 갱신하지 않은 기간에 생산 오더가 생성되는 경우
      impact: 효력일 이후에도 구 리비전으로 생산될 수 있어 변경 기준 문서에 대한 운영 신뢰를 상실한다.
      evidence_refs:
        - review-value-alignment-criteria.yaml:6-18
        - materialized-input.md:20-21
        - materialized-input.md:69-75
        - materialized-input.md:93-96
    causal_path:
      root_cause_candidate: ECO의 유효 리비전 권위와 생산 오더의 리비전 선택을 하나의 시점 기준으로 연결하지 않고, 지연 가능한
        Part.rev 복제값에 의존하도록 선언했다.
      root_cause_step_id: axiology-candidate-001.cause-003
      steps:
        - cause_id: axiology-candidate-001.cause-001
          claim: ECO 효력일 이후 생산분은 신규 rev를 따라야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:93-96
        - cause_id: axiology-candidate-001.cause-002
          claim: Part.rev는 도면 관리대장 반영 후 주간 배치로 동기화되어 효력일보다 늦을 수 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:20-21
            - materialized-input.md:93-96
        - cause_id: axiology-candidate-001.cause-003
          claim: 유효 리비전의 시점별 권위 관계와 동기화 전 생산 차단 규칙이 모델에 없다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:69-75
            - materialized-input.md:93-96
      unresolved_beyond_evidence: 실제 생산 오더 시스템에 별도 차단 장치가 있는지는 경계 내 증거로 확인할 수 없으나, 개념
        기준 문서 자체의 계약은 닫혀 있지 않다.
  - candidate_id: axiology-candidate-002
    target: manufacturing-bom-ontology.yaml — 수량 단위와 환산 정책
    evidence_anchor: "Value authority:
      .onto/review/20260717-aa03f0e2/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-18, criterion user-request-intent — “PLM/MES 통합의 개념 기준
      문서…제조 운영 위험”; target: materialized-input.md:14-20,29-35,98-100 — Part.uom과
      BomLine.qty_per가 있으나 품목별 환산 마스터 없이 현장 환산"
    claim: "[boundary][misaligned] 수량 의미를 현장 판단에 맡기는 편의가 PLM/MES 간 동일 수량 해석이라는 통합
      목적보다 우선되어 있다."
    what: Part.uom은 단일 enum이고 BomLine.qty_per에는 별도 단위나 환산 기준이 없다. kg↔ea 환산계수 마스터도
      없으며 필요 시 현장에서 환산하도록 한다.
    why: 동일 BOM 수량이 시스템과 작업자별로 다르게 해석될 수 있어 자재 소요량, 생산 투입량, 스크랩 및 원가 계산의 공통 기준이 되지
      못한다. 특히 개수와 중량 사이의 환산은 품목·로트·조건에 따라 달라질 수 있으므로 임의 환산을 기준 문서가 정당화해서는 안 된다.
    how_to_fix: BomLine 수량에 명시적 UOM을 연결하고, 품목별 허용 단위·기준 단위·버전/효력일을 가진 권위 있는 환산 개념을
      추가한다. 환산값이 없거나 유효하지 않으면 자동 계획·투입을 거부하고 승인된 예외를 추적한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES가 공유하는 품목·BOM 수량의 개념 기준과 제조 투입 정확성
      failure_condition: BOM 단위와 실행 또는 재고 단위가 달라 kg↔ea 등의 환산이 필요한 경우
      impact: 현장별 임의 환산으로 자재 부족·과투입·원가 왜곡이 발생할 수 있어 통합 기준의 실행 가능성이 사라진다.
      evidence_refs:
        - review-value-alignment-criteria.yaml:6-18
        - materialized-input.md:14-20
        - materialized-input.md:29-35
        - materialized-input.md:98-100
    causal_path:
      root_cause_candidate: 수량과 단위 환산을 권위 있는 버전 관리 개념으로 모델링하지 않고 현장 재량에 맡겼다.
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: BOM의 qty_per는 숫자만 보유하고 해당 수량의 단위를 명시하지 않는다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:29-35
        - cause_id: axiology-candidate-002.cause-002
          claim: 품목별 환산계수 마스터가 없고 필요한 환산은 현장에서 수행된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:98-100
        - cause_id: axiology-candidate-002.cause-003
          claim: 따라서 PLM의 BOM 수량과 MES의 실행 수량을 결정적으로 변환할 공통 권위가 없다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:14-20
            - materialized-input.md:29-35
            - materialized-input.md:98-100
      unresolved_beyond_evidence: 특정 품목의 실제 환산 규칙과 오차 허용치는 경계 밖이므로 확인할 수 없다.
  - candidate_id: axiology-candidate-003
    target: manufacturing-bom-ontology.yaml — 복제·수기 관리되는 운영 기준값
    evidence_anchor: "Value authority:
      .onto/review/20260717-aa03f0e2/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-18, criterion user-request-intent — “PLM/MES 통합의 개념 기준
      문서”; target: materialized-input.md:29-35,47-53,98-100 — scrap_rate는 엑셀 값을
      복사하고 누적 std_time은 MES 계산값과 표준원가 수기값을 분기 대사"
    claim: "[tradeoff][misaligned] 단기적인 기존 업무 유지 편의를 위해 동일 운영 의미의 복수 권위와 장기 대사 지연을
      정상화한다."
    what: scrap_rate는 생산계획팀 엑셀의 값을 복사해 두며, 누적 표준시간은 MES 계산값 외에 표준원가 시스템에 수기로 입력하고
      분기마다 대사한다. 어느 값이 언제 권위인지, 불일치 시 어떤 소비를 막는지 정의하지 않는다.
    why: 개념 기준 문서가 복제·수기 입력을 단순 주석으로 수용하면 PLM/MES와 계획·원가 시스템이 서로 다른 기준값을 합법적으로 사용할 수
      있다. 이는 통합의 공통 의미와 추적 가능성을 희생하면서 그 비용과 위험을 명시적으로 승인하거나 통제하지 않은 트레이드오프다.
    how_to_fix: scrap_rate와 누적 std_time 각각에 하나의 권위 원천과 파생 규칙을 지정하고, 복제값에는
      provenance·version·effective time·동기화 상태를 둔다. 불일치 시 소비 차단 또는 승인된 예외 절차와 대사
      주기를 개념 계약에 포함한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 운영 기준값의 공통 의미와 추적 가능한 권위
      failure_condition: 원본 엑셀/MES 계산값이 복제·수기 입력값과 달라지고 다음 대사 이전에 계획 또는 원가 계산이 수행되는 경우
      impact: 동일 개념이 시스템마다 다른 값으로 소비되어 계획과 원가 결과에 대한 신뢰와 감사 가능성이 약화된다.
      evidence_refs:
        - review-value-alignment-criteria.yaml:6-18
        - materialized-input.md:29-35
        - materialized-input.md:47-53
        - materialized-input.md:98-100
    causal_path:
      root_cause_candidate: 운영 기준값의 단일 권위와 파생·동기화 계약 대신 복제 및 수기 대사를 정상 운영 방식으로 채택했다.
      root_cause_step_id: axiology-candidate-003.cause-003
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: scrap_rate는 외부 엑셀 값을 복사한 값이다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:29-35
        - cause_id: axiology-candidate-003.cause-002
          claim: 누적 표준시간도 MES 계산값과 표준원가 시스템의 수기값으로 중복 관리되며 대사는 분기 단위다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:47-53
            - materialized-input.md:98-100
        - cause_id: axiology-candidate-003.cause-003
          claim: 값 불일치 시 권위 선택과 소비 통제 규칙이 없어 복수의 운영 진실이 유지될 수 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:98-100
      unresolved_beyond_evidence: 실제 인터페이스의 동기화 빈도나 불일치 차단 기능은 경계 내에서 확인할 수 없다.
  - candidate_id: axiology-candidate-004
    target: manufacturing-bom-ontology.yaml — BOM 비순환 원칙과 스크랩 재투입 예외
    evidence_anchor: "Value authority:
      .onto/review/20260717-aa03f0e2/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-18, criterion user-request-intent — “BOM…개념의 정합성과 제조 운영
      위험”; target: materialized-input.md:23-35,93-95 — BOM은 비순환이어야 하지만 스크랩 재투입은
      Assembly 자기 포함으로 모델링"
    claim: "[tradeoff][misaligned] 회수 공정을 기존 BOM 구조에 억지로 수용하는 국소 단순화가 비순환 BOM이라는 운영
      안전 약속을 무력화한다."
    what: 하나의 integrity rule이 BOM 비순환을 요구하면서 재생 원료 회수는 Assembly가 자기 자신을 하위로 포함하는
      순환으로 표현하도록 한다. 예외의 범위, 식별자, 계산 종료 조건은 없다.
    why: 일반 BOM 전개와 계획 계산이 의존하는 비순환 약속을 깨면서도 재투입 흐름을 구별할 경계를 제공하지 않는다. 모델 수를 줄이는 편의가
      무한 전개 방지와 명확한 자재 흐름이라는 전체 목적보다 우선된 상태다.
    how_to_fix: 생산 BOM의 비순환 원칙은 유지하고, 스크랩 발생·회수·재투입을 별도의 material-flow 또는
      by-product/rework 관계로 분리한다. 회수율, 적용 공정, 시간 경계와 종료 조건을 명시해 일반 BOM 전개에서
      제외한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 정합적인 BOM 개념 기준과 안전한 자재 소요량 전개
      failure_condition: 스크랩 재투입을 자기참조 BomLine으로 표현한 BOM을 일반 전개·원가·계획 로직이 소비하는 경우
      impact: 비순환 검증을 우회하거나 무한/중복 전개를 유발해 BOM 기준의 신뢰성과 제조 계획의 실행 가능성을 약화한다.
      evidence_refs:
        - review-value-alignment-criteria.yaml:6-18
        - materialized-input.md:23-35
        - materialized-input.md:93-95
    causal_path:
      root_cause_candidate: 공정 물질흐름인 스크랩 회수를 제품구조인 BOM 포함 관계로 재사용해 서로 다른 목적의 개념 경계를 합쳤다.
      root_cause_step_id: axiology-candidate-004.cause-003
      steps:
        - cause_id: axiology-candidate-004.cause-001
          claim: BOM은 비순환이어야 한다는 운영 불변조건이 선언되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:93-95
        - cause_id: axiology-candidate-004.cause-002
          claim: 스크랩 재투입은 Assembly 자기 포함이라는 순환 BOM으로 모델링하도록 같은 규칙이 예외를 둔다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:93-95
        - cause_id: axiology-candidate-004.cause-003
          claim: 재투입을 일반 BOM과 구분할 별도 관계나 종료 조건이 없어 비순환 불변조건을 결정적으로 적용할 수 없다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:23-35
            - materialized-input.md:93-95
      unresolved_beyond_evidence: 실제 BOM 전개 엔진이 이 예외를 특별 처리하는지는 경계 내 증거로 확인할 수 없다.
