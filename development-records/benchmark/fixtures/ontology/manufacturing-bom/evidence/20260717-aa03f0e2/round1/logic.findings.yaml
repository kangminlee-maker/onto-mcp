    claim: fail — AlternatePart is declared symmetric while the same entity permits
      one-way substitution, so a one_way instance cannot satisfy both claims.
    what: "The definition requires that if A substitutes for B, B also substitutes
      for A. The direction enum and note simultaneously allow one_way as the
      default. Conflict pair: materialized-input.md:38 ↔
      materialized-input.md:42-45; inter-claim conflict; modality: mixed
      necessary/possible."
    why: For any AlternatePart instance whose direction is one_way, the definition
      obligates the reverse substitution while the selected direction denotes
      that only one direction applies. PLM and MES consumers can therefore
      derive incompatible valid substitution sets from the same record,
      weakening this ontology as their shared conceptual contract.
    how_to_fix: "Choose one canonical model: either remove one_way and define
      AlternatePart as always symmetric, or revise the definition to make
      symmetry conditional on direction=bidirectional and explicitly define the
      effective edge for direction=one_way."
