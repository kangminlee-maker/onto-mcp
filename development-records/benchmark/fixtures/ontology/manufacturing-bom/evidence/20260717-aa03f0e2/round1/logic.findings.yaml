        PLM/MES part substitution behavior.
      failure_condition: An AlternatePart record uses the explicitly permitted one_way value.
      impact: The same valid record requires and rejects the reverse substitution
        depending on which declaration a consumer follows, making substitution
        decisions non-interoperable.
      evidence_refs:
