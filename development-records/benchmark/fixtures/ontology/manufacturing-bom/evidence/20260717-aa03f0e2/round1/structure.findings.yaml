            - materialized-input.md:84-91
        - cause_id: structure-candidate-002.cause-002
          claim: 명시적 관계 그래프는 AlternatePart를 우회하는 Part→Part alternate_of만 제공한다.
          relation_to_previous: symptom_of
          evidence_refs:
