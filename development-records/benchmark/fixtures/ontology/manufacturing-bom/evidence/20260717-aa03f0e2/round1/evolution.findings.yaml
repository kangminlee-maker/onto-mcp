findings:
  - candidate_id: evolution-candidate-001
    target: manufacturing-bom-ontology.yaml의 품목·BOM·라우팅 버전 모델
    evidence_anchor: entities.Part.attributes.rev/current_eco;
      entities.Assembly.attributes.bom_lines; entities.Routing.attributes 및
      integrity_rules의 ECO 동기화 규칙
    claim: BOM과 라우팅에 독립적인 리비전·유효기간이 없어 변경 후 과거 제조 구성을 연속적으로 보존할 수 없다.
    what: Part에는 현재 rev와 current_eco만 있고, BomLine과 Routing에는 리비전, 유효 시작·종료, 구성 기준선
      식별자가 없다. released Routing도 새 버전과 구버전을 함께 표현할 구조가 없다.
    why: 신규 설계변경을 반영하면 어느 BOM/라우팅 조합이 특정 시점의 품목 리비전에 적용되었는지 모델 자체로 재구성할 수 없다. PLM의
      설계 기준선과 MES의 생산 당시 구성을 연결하는 개념 기준 문서로 사용하면 과거 생산 이력, 재작업, 품질 추적 및 단계적 전환에서
      연속성이 깨진다.
    how_to_fix: PartRevision, BomRevision, RoutingRevision 같은 불변 버전 개념을 도입하고, 버전 간
      명시적 참조와 유효기간 또는 effectivity를 부여한다. released 버전은 수정하지 않고 후속 버전을 생성하도록 수명주기
      규칙을 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 품목·BOM·라우팅 변경 전후의 제조 구성을 동일한 기준으로 식별하고 추적하는 목적
      failure_condition: 하나의 품목에 새 BOM 또는 라우팅 리비전이 발행되거나 과거 생산분을 재구성해야 할 때
      impact: 설계 기준선과 실제 생산 구성을 결정적으로 연결할 수 없어 변경관리와 제조 추적의 신뢰성이 크게 약화된다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml > entities.Part.attributes.rev
        - manufacturing-bom-ontology.yaml >
          entities.Assembly.attributes.bom_lines
        - manufacturing-bom-ontology.yaml > entities.Routing.attributes
        - manufacturing-bom-ontology.yaml > integrity_rules[2]
    causal_path:
      root_cause_candidate: 구성 객체의 시간적 정체성을 Part의 단일 현재 rev와 현재 ECO 포인터로 축약하고 BOM·라우팅
        자체의 버전 권위를 모델링하지 않았다.
      root_cause_step_id: evolution-candidate-001.cause-002
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 새 BOM 또는 라우팅이 반영된 뒤 과거 released 구성을 모델 내부에서 식별할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              entities.Assembly.attributes.bom_lines
            - manufacturing-bom-ontology.yaml >
              entities.Routing.attributes.status
        - cause_id: evolution-candidate-001.cause-002
          claim: BomLine과 Routing에는 리비전 및 유효기간 속성이 없고 Part에는 단일 rev/current_eco만 존재한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              entities.Part.attributes.rev/current_eco
            - manufacturing-bom-ontology.yaml > entities.BomLine.attributes
            - manufacturing-bom-ontology.yaml > entities.Routing.attributes
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-002
    target: manufacturing-bom-ontology.yaml의 ECO 변경 범위와 효력 모델
    evidence_anchor: entities.ECO.attributes 및 integrity_rules의 effective_date 규칙
    claim: ECO가 날짜와 affected_parts만 표현해 향후 공장·로트·일련번호·생산오더별 단계적 적용을 수용하려면 기존 구조를
      변경해야 한다.
    what: ECO에는 변경 대상 부품 목록, 단일 effective_date, 상태만 있다. 변경 전후 리비전, 변경된 BOM/라우팅 객체,
      적용 공장이나 로트·일련번호 범위, 대체 적용 조건을 표현할 수 없다.
    why: MES 통합이 다공장 운영이나 소진 후 전환, 특정 생산오더 적용 같은 효력 방식을 요구하면 단일 날짜 규칙으로는 적용 대상을 판정할
      수 없다. 이후 effectivity 유형마다 속성과 소비자 분기를 추가하게 되어 기존 데이터와 규칙의 연속성이 약해진다.
    how_to_fix: ECO와 분리된 확장 가능한 ChangeEffectivity 개념을 두고 날짜, 공장, 로트, 일련번호, 생산오더 등의
      범위 유형을 명시한다. ECO 변경항목에는 대상 객체와 변경 전·후 버전을 참조하도록 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM 변경 지시를 MES 생산 적용 범위로 일관되게 전달하는 변경관리 기준
      failure_condition: 날짜 이외의 효력 조건이나 여러 공장에 걸친 단계적 전환이 도입될 때
      impact: MES가 어떤 생산분에 어느 변경을 적용해야 하는지 온톨로지로 판정할 수 없어 시스템별 별도 규칙과 불일치가 발생한다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml > entities.ECO.attributes
        - manufacturing-bom-ontology.yaml > integrity_rules[2]
    causal_path:
      root_cause_candidate: 변경의 효력을 확장 가능한 범위 개념으로 모델링하지 않고 ECO의 단일 effective_date 속성으로 고정했다.
      root_cause_step_id: evolution-candidate-002.cause-002
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: 비날짜 효력 조건이나 단계적 전환을 추가하면 ECO 스키마와 소비 규칙을 함께 수정해야 한다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              entities.ECO.attributes.effective_date
            - manufacturing-bom-ontology.yaml > integrity_rules[2]
        - cause_id: evolution-candidate-002.cause-002
          claim: ECO가 affected_parts와 단일 날짜만 보유하고 변경항목 및 효력 범위 엔티티를 참조하지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml > entities.ECO.attributes
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-003
    target: manufacturing-bom-ontology.yaml의 라우팅 순서 표현
    evidence_anchor: entities.Routing.attributes.operations 및 relations의 Routing
      has_ordered Operation
    claim: 라우팅을 단일 ordered_list로 고정해 병렬, 조건 분기, 선택 공정, 재작업 루프를 추가할 때 기존 구조와 소비자를
      재설계해야 한다.
    what: Routing은 Operation 참조의 선형 순서만 표현한다. 공정 간 전이, 분기 조건, 병렬 합류, 선택 경로, 재작업 반환점을
      나타내는 개념이 없다.
    why: 제조 공정이 선형 경로를 넘어서는 순간 ordered_list를 해석하는 PLM/MES 연계 로직은 새 토폴로지를 수용할 수 없다.
      별도 예외 필드나 특수 Operation으로 확장하면 경로 의미가 소비자마다 달라질 위험이 있다.
    how_to_fix: Operation 자체와 분리된 RoutingStep 및 StepTransition을 도입하고, 전이에
      순서·조건·분기·합류·재작업 의미를 부여한다. 단순 선형 라우팅은 이 그래프 모델의 제한된 형태로 투영해 기존 사용을 유지한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 다양한 제조 공정 구조를 PLM과 MES가 공통 의미로 교환하는 라우팅 기준
      failure_condition: 병렬 공정, 조건부 검사, 선택 설비 경로 또는 재작업 루프가 필요한 품목을 추가할 때
      impact: 현 구조를 유지한 채 새 라우팅 유형을 표현할 수 없어 스키마 변경과 연계 소비자 재작성 범위가 커진다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml >
          entities.Routing.attributes.operations
        - manufacturing-bom-ontology.yaml > relations[3]
    causal_path:
      root_cause_candidate: 라우팅의 순서 의미를 확장 가능한 전이 관계가 아니라 Operation의 단일 선형 목록 컨테이너에 부여했다.
      root_cause_step_id: evolution-candidate-003.cause-002
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 비선형 공정 경로를 추가할 때 기존 ordered_list 해석으로는 경로를 보존할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              entities.Routing.attributes.operations
        - cause_id: evolution-candidate-003.cause-002
          claim: 모델에는 공정 간 전이와 분기 조건 개념이 없고 관계도 has_ordered 하나뿐이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml > relations[3]
            - manufacturing-bom-ontology.yaml > entities.Routing.attributes
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-004
    target: manufacturing-bom-ontology.yaml의 단위 체계
    evidence_anchor: entities.Part.attributes.uom;
      entities.WorkCenter.attributes.capacity_per_shift; notes의 uom 변환 규칙
    claim: 폐쇄형 UOM 열거와 권위 있는 환산 모델 부재로 새 단위·복합 단위를 추가할 때 스키마 및 현장별 변환 규칙 변경이 필요하다.
    what: Part.uom은 ea, kg, m 세 값으로 고정되어 있고 품목별 환산계수 마스터가 없다.
      WorkCenter.capacity_per_shift는 작업장마다 개수 또는 시간이라는 서로 다른 단위를 같은 숫자 속성에 담는다.
    why: 새 품목 단위나 공장별 용량 단위를 도입하면 enum 수정만으로 의미가 완결되지 않으며, PLM과 MES가 동일 수량을 다르게 환산할
      수 있다. 단위 종류가 늘수록 현장 예외가 누적되어 기존 데이터와 신규 데이터의 비교 가능성이 떨어진다.
    how_to_fix: 단위를 식별자·차원·기준단위와 함께 관리하는 UOM 개념으로 분리하고, 품목 및 적용기간별 변환 관계를 권위 데이터로
      둔다. capacity_per_shift도 값과 단위를 결합한 측정값으로 모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM 품목 수량과 MES 자재소요·설비용량을 일관된 단위로 교환하는 통합 기준
      failure_condition: 현재 열거에 없는 단위, 품목별 kg↔ea 변환 또는 서로 다른 용량 차원을 가진 작업장을 추가할 때
      impact: 확장 때마다 스키마와 현장 변환 로직을 함께 바꿔야 하며 수량·소요량·용량 계산의 비교 가능성과 신뢰성이 약화된다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml > entities.Part.attributes.uom
        - manufacturing-bom-ontology.yaml >
          entities.WorkCenter.attributes.capacity_per_shift
        - manufacturing-bom-ontology.yaml > notes[1]
    causal_path:
      root_cause_candidate: 측정 단위와 변환을 독립된 확장 가능 개념으로 만들지 않고 폐쇄형 enum과 문서화되지 않은 현장 환산에 맡겼다.
      root_cause_step_id: evolution-candidate-004.cause-002
      steps:
        - cause_id: evolution-candidate-004.cause-001
          claim: 새 단위나 변환 요구가 생기면 기존 enum과 시스템별 계산 로직을 수정해야 한다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > entities.Part.attributes.uom
            - manufacturing-bom-ontology.yaml > notes[1]
        - cause_id: evolution-candidate-004.cause-002
          claim: 허용 단위가 세 값으로 고정되고 환산계수 마스터가 없으며 capacity 값에는 단위 속성이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml > entities.Part.attributes.uom
            - manufacturing-bom-ontology.yaml >
              entities.WorkCenter.attributes.capacity_per_shift
            - manufacturing-bom-ontology.yaml > notes[1]
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - PLM/MES 통합의 개념 기준은 변경 후에도 과거 released 구성과 실제 생산 당시 구성을 재식별할 수 있어야 한다.
  - 제조 라우팅은 향후 병렬·조건 분기·재작업 경로로 확장될 수 있다.
  - 통합 수량과 설비용량은 시스템 간 동일한 단위 및 환산 권위를 가져야 한다.
validation:
  unaddressable_candidates: []
