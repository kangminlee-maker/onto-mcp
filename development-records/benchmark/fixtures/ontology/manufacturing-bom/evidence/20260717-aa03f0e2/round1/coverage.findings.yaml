      failure_condition: ECO 전후 구성 조회, 과거 생산 재현, 미래 효력 계획이 필요한 경우
      impact: 동일 품목 번호에 대해 PLM과 MES가 서로 다른 BOM·공정을 사용해도 기준 문서로 판별하거나 감사할 수 없다.
      evidence_refs:
