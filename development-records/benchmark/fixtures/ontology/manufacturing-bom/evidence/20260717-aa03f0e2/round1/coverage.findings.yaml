  - candidate_id: coverage-candidate-003
    target: ECO 변경통제와 감사 증거
    evidence_anchor: materialized-input.md:69-75, 90, 96
    claim: ECO 상태는 있으나 승인·적용 행위의 행위자, 시각, 근거와 변경 내용을 보존할 감사 증거 개념이 없다.
    what: ECO에는 번호, 대상 품목, 효력일, 상태만 있고 요청 사유, 승인자, 승인·적용 시각, 변경 전후 개정, 적용 결과, 취소·정정
      사건이 없다.
    why: approved와 applied 상태가 누가 어떤 근거로 언제 부여했는지, 실제 Part.rev 및 BOM·라우팅 변경과 일치하는지
      입증할 수 없다.
    how_to_fix: ChangeRequest/ChangeApproval/ChangeImplementation 또는 공통 AuditEvent를
      추가해 actor, occurred_at, rationale/evidence_ref, from/to revision, affected
      configuration, outcome을 기록하고 ECO 상태 전이와 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 변경관리 개념의 정합성과 PLM/MES 변경 적용 통제
      failure_condition: 승인된 ECO의 책임·근거를 감사하거나 적용 오류와 정정을 조사하는 경우
      impact: 상태값만으로 변경 통제를 입증하게 되어 무승인 변경이나 잘못된 적용을 구별하고 추적할 수 없다.
      evidence_refs:
        - materialized-input.md:69-75
        - materialized-input.md:90
        - materialized-input.md:96
    causal_path:
      root_cause_candidate: 변경을 상태가 있는 문서로만 모델링하고 상태를 발생시킨 통제 행위를 별도 사건·증거 개념으로 모델링하지 않았다.
      root_cause_step_id: coverage-candidate-003.cause-002
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: ECO의 approved/applied 상태에 대응하는 승인 및 적용 사건 속성이 없다.
