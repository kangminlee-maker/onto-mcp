  - candidate_id: coverage-candidate-002
    target: MES 실행 및 생산 추적 개념 범위
    evidence_anchor: materialized-input.md:47-67, 87-89, 95
    claim: 생산 오더를 언급하지만 실행 실적과 자재 계보를 표현하는 MES 측 개념이 없다.
    what: 모델은 계획 라우팅과 작업장까지만 정의하며 ProductionOrder, OperationExecution, 자재 투입·소비, 생산
      수량, lot/serial, 작업자·설비 실적, 불량·재작업 같은 실행 개념을 포함하지 않는다.
    why: 라우팅 release가 생산 오더 생성 조건이라고 선언했지만, 생성 이후 실제로 어떤 개정의 자재와 공정이 사용되었는지 PLM 정의에
      연결할 수 없다.
    how_to_fix: 최소 통합 경계로 ProductionOrder와 OperationExecution을 추가하고 적용
      Part/BOM/Routing 개정, 투입·산출 lot 또는 serial, 수량·단위, 실행 시각, 작업장, 결과 상태를 연결한다.
      불량·재작업은 실행 결과 또는 별도 사건으로 표현한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 제공
      failure_condition: 생산 오더가 생성되어 실제 제조 이력과 설계 기준을 연결해야 하는 경우
      impact: 설계 정의와 제조 실행 사이의 추적 사슬이 끊겨 오투입, 잘못된 공정 사용, 회수 범위 판단을 지원하지 못한다.
      evidence_refs:
        - materialized-input.md:47-67
        - materialized-input.md:87-89
        - materialized-input.md:95
    causal_path:
      root_cause_candidate: 통합 범위가 제조 계획 정의에 편중되고 MES 실행·계보 하위 영역을 포함하지 않았다.
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: ProductionOrder는 무결성 규칙에서만 언급되며 엔티티로 정의되지 않는다.
          relation_to_previous: null
