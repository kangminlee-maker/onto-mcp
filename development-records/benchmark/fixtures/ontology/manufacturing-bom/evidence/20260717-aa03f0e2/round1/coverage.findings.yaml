domain_context_assumptions:
  - PLM/MES 통합의 개념 기준은 설계 정의뿐 아니라 생산 실행이 사용한 구성과의 추적 연결을 포함해야 한다.
  - BOM·라우팅·변경 데이터는 과거 생산 재현과 미래 효력 계획을 위해 시점별 유효 구성을 구분할 수 있어야 한다.
  - 승인·적용 같은 통제 상태는 행위자, 시각, 근거를 보존하는 감사 증거와 연결되어야 한다.
