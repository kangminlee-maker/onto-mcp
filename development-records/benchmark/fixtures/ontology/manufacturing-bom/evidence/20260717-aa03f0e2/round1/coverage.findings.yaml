    target: BOM·라우팅 구성의 버전 및 유효성 모델
    evidence_anchor: materialized-input.md:20-21, 27-35, 53-61, 69-75, 93-96
    claim: 과거 또는 미래 시점의 유효 BOM·라우팅 구성을 재구성할 버전·유효구간 개념이 없다.
    what: Part.rev와 ECO.effective_date는 있으나 BOM, BomLine, Routing, Operation의 개정
      식별자, 유효 시작·종료, 대체 관계, 구성 기준시점이 없다. qty_per, scrap_rate, std_time_min도 시점
      이력을 표현하지 못한다.
    why: ECO 적용 전후에 어떤 BOM 라인과 공정 값이 유효했는지 결정할 수 없어 PLM 설계 구성과 MES 생산 구성의 시점별 일치를
      검증할 수 없다.
    how_to_fix: BOM/Routing 개정 또는 공통 ConfigurationRevision 개념을 추가하고 각 라인·공정 값에
      effective_from/effective_to 또는 개정 귀속을 부여한다. ECO가 생성·종결하는 개정과의 관계도 명시한다.
