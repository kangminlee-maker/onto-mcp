  - candidate_id: coverage-candidate-006
    target: 단위 및 품목별 환산 기준
    evidence_anchor: materialized-input.md:19, 34-35, 67, 100
    claim: 수량·능력 값을 일관되게 해석할 단위 차원과 환산계수 마스터가 없다.
    what: Part.uom은 ea/kg/m만 허용하지만 BomLine.qty_per와 scrap_rate에는 값의 단위·기준량이 없고
      WorkCenter.capacity_per_shift는 작업장마다 개수 또는 시간이라고만 한다. kg↔ea 환산은 현장 판단에
      맡긴다고 명시한다.
    why: BOM 소요량과 작업장 능력을 MES가 계산할 때 서로 다른 단위의 값을 자동 검증하거나 재현 가능한 방식으로 변환할 수 없다.
    how_to_fix: Uom, Quantity, ConversionFactor 개념을 추가하고 환산의 품목, from/to 단위, 계수,
      유효기간, 권위 출처를 정의한다. qty_per와 capacity에는 명시적 단위 및 기준 분모를 부여한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM 수량과 제조 능력의 PLM/MES 공통 해석
      failure_condition: 중량·개수 단위가 혼재하거나 작업장 간 능력을 비교·계획하는 경우
      impact: 현장별 임의 환산으로 자재 소요량과 생산능력 계산이 달라져 계획 및 실행 오류가 발생할 수 있다.
      evidence_refs:
        - materialized-input.md:19
        - materialized-input.md:34-35
        - materialized-input.md:67
        - materialized-input.md:100
    causal_path:
      root_cause_candidate: 수량을 단순 number로 모델링하고 단위·환산을 독립된 기준정보 개념으로 포함하지 않았다.
      root_cause_step_id: coverage-candidate-006.cause-002
      steps:
        - cause_id: coverage-candidate-006.cause-001
          claim: qty_per와 capacity_per_shift가 단위 구조 없는 number로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:34-35
            - materialized-input.md:67
        - cause_id: coverage-candidate-006.cause-002
          claim: 품목별 환산계수 마스터가 없고 변환을 현장에 맡긴다고 명시한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100
      unresolved_beyond_evidence: null
