  - candidate_id: coverage-candidate-005
    target: 품목·라우팅·ECO lifecycle 종결 구간
    evidence_anchor: materialized-input.md:14-21, 55-61, 69-75
    claim: 상태를 갖는 핵심 개념의 폐기·단종·대체·취소·정정 lifecycle 구간이 누락되어 있다.
    what: Part에는 lifecycle 상태가 없고 Routing은 draft/released만, ECO는
      open/approved/applied만 제공한다. obsolete, superseded, discontinued, rejected,
      canceled 및 적용 후 정정·재발행을 표현할 개념이 없다.
    why: 이미 release 또는 apply된 정의가 더 이상 사용 가능하지 않은 상황을 표현할 수 없어 MES가 종료된 라우팅이나 품목을 계속
      유효한 것으로 해석할 수 있다.
    how_to_fix: Part와 Routing에 active/released 이후 superseded·obsolete/discontinued
      상태 및 효력 종료를 추가한다. ECO에는 rejected/canceled와 적용 후 correction/superseding ECO
      관계를 추가하고 허용 전이를 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품목·라우팅·변경관리의 전 lifecycle 개념 기준 제공
      failure_condition: 품목 단종, 라우팅 대체, ECO 취소 또는 적용 후 정정이 발생하는 경우
      impact: 종결된 제조 정의의 사용 가능성을 판별하지 못해 운영 기준과 실제 상태가 불일치한다.
      evidence_refs:
        - materialized-input.md:14-21
        - materialized-input.md:55-61
        - materialized-input.md:69-75
    causal_path:
      root_cause_candidate: lifecycle 모델이 도입·승인·적용 단계까지만 설계되고 종료 및 사후 정정 단계를 포함하지 않았다.
      root_cause_step_id: coverage-candidate-005.cause-002
      steps:
