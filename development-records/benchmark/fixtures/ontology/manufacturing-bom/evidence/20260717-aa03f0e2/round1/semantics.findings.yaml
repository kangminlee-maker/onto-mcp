      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-007
    target: Part 정의와 Assembly 상속
    evidence_anchor: manufacturing-bom-ontology.yaml > entities.Part.definition,
      entities.Assembly.definition, entities.Assembly.is_a
    claim: Part를 “최소 관리 단위”로 정의하면서 하위 Part를 갖는 Assembly도 Part라고 선언해 최소성의 의미가 충돌한다.
    what: Part 정의의 ‘최소’가 더 이상 분해되지 않는다는 뜻이라면 Assembly는 해당 정의를 만족하지 않지만 Part를 상속한다.
      관리 식별 단위라는 뜻이라면 ‘최소’가 불필요하거나 다른 의미다.
    why: PLM과 MES가 Part를 말단 부품으로 볼지 모든 품목을 포괄하는 상위 개념으로 볼지 달라질 수 있어 BOM 및 라우팅 대상의 타입
      판정이 불안정해진다.
    how_to_fix: Part를 구매·제조·식별되는 품목의 상위 개념으로 재정의하고, 말단 부품이 필요하면 LeafPart/Component
      같은 별도 역할 또는 속성으로 표현한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품목과 조립품 타입을 공유하는 PLM/MES 개념 기준
