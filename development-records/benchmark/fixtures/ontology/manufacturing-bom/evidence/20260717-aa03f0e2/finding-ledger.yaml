    target: manufacturing-bom-ontology.yaml — AlternatePart definition and direction
      attribute
    evidence_anchor: .onto/review/20260717-aa03f0e2/execution-preparation/materialized-input.md:37-45
    claim: fail — AlternatePart is declared symmetric while the same entity permits
      one-way substitution, so a one_way instance cannot satisfy both claims.
    lens_rationale_summary: For any AlternatePart instance whose direction is
      one_way, the definition obligates the reverse substitution while the
      selected direction denotes that only one direction applies. PLM and MES
      consumers can therefore derive incompatible valid substitution sets from
      the same record, weakening this ontology as their shared conceptual
      contract.
    proposed_action: "Choose one canonical model: either remove one_way and define
