      복사하고 누적 std_time은 MES 계산값과 표준원가 수기값을 분기 대사"
    claim: "[tradeoff][misaligned] 단기적인 기존 업무 유지 편의를 위해 동일 운영 의미의 복수 권위와 장기 대사 지연을
      정상화한다."
    lens_rationale_summary: 개념 기준 문서가 복제·수기 입력을 단순 주석으로 수용하면 PLM/MES와 계획·원가 시스템이 서로
      다른 기준값을 합법적으로 사용할 수 있다. 이는 통합의 공통 의미와 추적 가능성을 희생하면서 그 비용과 위험을 명시적으로 승인하거나
