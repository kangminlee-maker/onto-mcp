    domain_context_assumptions: []
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - BOM 구성 관계는 제품 구조상 상위 품목이 하위 품목을 소비하는 관계이며, 공정 중 스크랩 회수·재투입 흐름과는 의미가 다르다고
        가정했다.
      - 검사 계획은 검사 행위를 규정하는 정보 객체이고 실제 검사 공정 단계와 동일한 존재론적 유형은 아니라고 가정했다.
      - 비율, 계수 및 용량 값은 PLM/MES 간 계산에 사용될 때 단위·범위·산식이 명시되어야 동일 의미를 유지한다고 가정했다.
  structure:
