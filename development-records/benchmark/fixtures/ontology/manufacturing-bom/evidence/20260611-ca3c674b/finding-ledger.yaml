  - finding_id: finding-001
    lens_id: axiology
    source_ref: .onto/review/20260611-ca3c674b/round1/axiology.findings.yaml#axiology-candidate-001
    target: "manufacturing-bom-ontology.yaml :: BomLine.scrap_rate"
    evidence_anchor: 'manufacturing-bom-ontology.yaml
      entities.BomLine.attributes.scrap_rate note: "생산계획팀 엑셀로 별도 관리되는 값을 복사해
      둔다."; header comment: "PLM/MES 통합의 개념 기준 문서."'
    claim: scrap_rate를 외부 엑셀 값의 사본으로 보유하는 설계는 '개념 기준 문서'라는 선언된 목적과 정면으로 어긋나는 목적
      drift다.
    lens_rationale_summary: 기준 문서의 핵심 가치는 '어디가 진실인지'를 확정하는 것인데, 이 필드는 권위 없는 사본을 기준
      문서 안에 제도화한다. PLM/MES 통합 시 양 시스템이 이 온톨로지의 scrap_rate를 기준으로 소비하면 엑셀 원본과의 괴리가
      자재 소요량(MRP) 계산 오류로 직결되며, 사용자 요청 의도(품목·BOM 개념 정합성과 제조 운영 위험)의 중심 영역을 훼손한다.
      국소 편의(값을 가까이 두기)가 전체 목적(단일 개념 기준)을 깎는 전형적 사례다.
    proposed_action: scrap_rate를 (a) 이 온톨로지가 원본 권위를 갖는 속성으로 승격해 엑셀을 폐기하거나, (b)
      rev/acceptance_criteria처럼 '원본=생산계획 마스터, 본 문서는 참조만'으로 권위 소재와 동기화
      계약(주기·책임자)을 명시하라. '복사해 둔다'는 무권위 사본 상태는 제거한다.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서의 단일 진실 권위 (target 헤더 선언 및
      review-value-alignment-criteria user-request-intent)
    failure_condition: MES/MRP가 온톨로지의 scrap_rate 사본을 소비하는 시점에 생산계획팀 엑셀 원본과 값이 달라져 있는 경우
    impact: 자재 소요량·불량 보정 계산이 비권위 값 기반으로 수행되어 제조 운영 위험(과소/과다 발주)이 발생하고, 기준 문서에 대한 통합
      양측의 신뢰가 깨진다.
    evidence_refs:
      - .onto/review/20260611-ca3c674b/round1/axiology.findings.yaml#axiology-candidate-001
      - manufacturing-bom-ontology.yaml
        entities.BomLine.attributes.scrap_rate.note
      - manufacturing-bom-ontology.yaml header comment 'PLM/MES 통합의 개념 기준 문서'
      - review-value-alignment-criteria.yaml criterion user-request-intent
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서의 단일 진실 권위 (target 헤더 선언 및
        review-value-alignment-criteria user-request-intent)
      failure_condition: MES/MRP가 온톨로지의 scrap_rate 사본을 소비하는 시점에 생산계획팀 엑셀 원본과 값이 달라져 있는 경우
      impact: 자재 소요량·불량 보정 계산이 비권위 값 기반으로 수행되어 제조 운영 위험(과소/과다 발주)이 발생하고, 기준 문서에 대한 통합
        양측의 신뢰가 깨진다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml
          entities.BomLine.attributes.scrap_rate.note
        - manufacturing-bom-ontology.yaml header comment 'PLM/MES 통합의 개념 기준 문서'
        - review-value-alignment-criteria.yaml criterion user-request-intent
    causal_path:
      root_cause_candidate: 필드별 데이터 권위(authority) 소재를 문서 전체에서 일관되게 선언하는 원칙 없이, 운영 편의에
        따라 일부 필드는 참조·일부 필드는 사본으로 임의 채택함
      root_cause_step_id: finding-001.cause-003
      steps:
        - cause_id: finding-001.cause-001
          claim: scrap_rate가 엑셀 원본의 사본으로 온톨로지에 보유된다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml
              entities.BomLine.attributes.scrap_rate.note
        - cause_id: finding-001.cause-002
          claim: 동기화 계약이 없는 사본은 기준 문서와 원본 간 괴리를 허용한다
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml
              entities.BomLine.attributes.scrap_rate.note (동기화 주기·책임 미기재)
        - cause_id: finding-001.cause-003
          claim: 이 괴리 허용은 rev·acceptance_criteria 등 '원본 지시' 패턴과 달리 권위 선언 원칙이 부재함의 증상이다
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities.Part.attributes.rev.note
            - manufacturing-bom-ontology.yaml
              entities.InspectionPlan.attributes.acceptance_criteria.note
      unresolved_beyond_evidence: 생산계획팀 엑셀의 실제 갱신 빈도와 MES가 어느 쪽 값을 실소비하는지는 경계 밖 증거라 확인 불가.
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260611-ca3c674b/round1/axiology.findings.yaml#axiology-candidate-002
    target: "manufacturing-bom-ontology.yaml :: integrity_rules[2] (ECO
      effective_date vs Part.rev 주간 배치 동기화)"
    evidence_anchor: 'integrity_rules: "ECO.effective_date 이후 생산분은 신규 rev를 따른다. 단
      Part.rev 갱신은 도면 관리대장 반영 후 주간 배치로 동기화한다."'
    claim: 변경관리 정확성(즉시 발효)이라는 목적 약속을 주간 배치라는 운영 편의와 맞바꾼 숨겨진 트레이드오프가 정당화 없이 규칙 본문에
      수용되어 있다.
    lens_rationale_summary: "사용자 요청 의도는 변경관리 개념의 정합성과 제조 운영 위험을 명시적으로 묻는다. 이 규칙은
      변경관리의 핵심 가치(어느 rev로 만들어야 하는지의 단일 답)를 주간 배치 비용 절감과 트레이드했으나, 그 창 동안의 책임
      소재·판정 기준(예: ECO.status=applied가 권위인지 Part.rev가 권위인지)을 정의하지 않는다. 정당화도 경계
      조건도 없는 트레이드오프 수용은 목적 drift다."
    proposed_action: "창 구간의 권위를 명시하라: 'rev 판정의 원본은 ECO(approved/applied +
      effective_date)이며 Part.rev는 지연 캐시'라고 선언하고, MES 생산 오더 생성 시 Part.rev가 아닌 ECO
      발효 상태를 조회하도록 규칙을 고치거나, 주간 배치를 발효일 트리거 동기화로 바꾸는 결정을 명문화한다."
    affected_purpose: 변경관리(ECO) 개념 정합성 — 사용자 요청 의도의 명시 검토 축이자 PLM/MES 통합 기준 문서의 핵심 계약
    failure_condition: ECO 발효일과 주간 배치 사이 구간에 생산 오더가 생성되어, 시스템 간(Part.rev vs ECO)에 서로
      다른 rev 판정이 내려지는 경우
    impact: 구버전 도면 생산·혼류 재고라는 직접적 제조 운영 위험을 만들고, 기준 문서가 변경관리 질문에 단일 답을 주지 못해 통합
      기준으로서의 적합성이 약화된다.
    evidence_refs:
      - .onto/review/20260611-ca3c674b/round1/axiology.findings.yaml#axiology-candidate-002
      - manufacturing-bom-ontology.yaml integrity_rules[2]
      - manufacturing-bom-ontology.yaml entities.Part.attributes.rev.note
      - manufacturing-bom-ontology.yaml entities.ECO
      - review-value-alignment-criteria.yaml criterion user-request-intent
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 변경관리(ECO) 개념 정합성 — 사용자 요청 의도의 명시 검토 축이자 PLM/MES 통합 기준 문서의 핵심 계약
      failure_condition: ECO 발효일과 주간 배치 사이 구간에 생산 오더가 생성되어, 시스템 간(Part.rev vs ECO)에 서로
        다른 rev 판정이 내려지는 경우
      impact: 구버전 도면 생산·혼류 재고라는 직접적 제조 운영 위험을 만들고, 기준 문서가 변경관리 질문에 단일 답을 주지 못해 통합
        기준으로서의 적합성이 약화된다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml integrity_rules[2]
        - manufacturing-bom-ontology.yaml entities.Part.attributes.rev.note
        - manufacturing-bom-ontology.yaml entities.ECO
        - review-value-alignment-criteria.yaml criterion user-request-intent
    causal_path:
      root_cause_candidate: rev 권위의 소재(ECO 원본 vs Part.rev 캐시)를 확정하지 않은 채, 기존 수작업 운영
        절차(도면 관리대장 → 주간 배치)를 개념 모델의 무결성 규칙으로 그대로 승격함
      root_cause_step_id: finding-002.cause-003
      steps:
        - cause_id: finding-002.cause-001
          claim: 발효일 이후 신규 rev 적용 약속과 주간 배치 지연이 한 규칙에 공존한다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml integrity_rules[2]
        - cause_id: finding-002.cause-002
          claim: 이 공존은 발효~동기화 사이에 Part.rev가 구버전인 생산 창을 만든다
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml integrity_rules[2] (주간 배치 명시)
        - cause_id: finding-002.cause-003
          claim: 창 구간의 rev 판정 권위가 미정의인 것은 운영 절차를 정당화 없이 개념 규칙으로 수용한 결과다
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities.Part.attributes.rev.note
              (도면 관리대장이 원본)
            - manufacturing-bom-ontology.yaml
              entities.Part.attributes.current_eco.note (ECO 시스템이 원본)
      unresolved_beyond_evidence: 실제 MES가 오더 생성 시 Part.rev와 ECO 중 무엇을 조회하는지는 경계 밖이라 확인 불가.
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260611-ca3c674b/round1/axiology.findings.yaml#axiology-candidate-003
    target: "manufacturing-bom-ontology.yaml :: integrity_rules[0] (BOM 비순환 예외)"
    evidence_anchor: 'integrity_rules: "BOM은 비순환이어야 한다. 단, 재생 원료 회수 공정(스크랩 재투입)은
      Assembly가 자기 하위에 자신을 포함하는 형태로 모델링한다."'
    claim: 스크랩 재투입을 자기참조 BOM으로 모델링하는 국소 편의가 'BOM 비순환'이라는 전체 보증을 무효화하는, 정당화되지 않은
      트레이드오프다.
    lens_rationale_summary: 비순환 보증은 MES/MRP의 BOM 전개(explosion)와 원가 적산이 종료됨을 담보하는
      목적-필수 불변식이다. 예외를 허용하면 통합 소비자는 '비순환'을 신뢰할 수 없고, 모든 전개 로직에 자기참조 특례 처리가 전파된다.
      어떤 조건에서 순환이 허용되는지(깊이, 수량 부호 등) 경계도 없어, 국소 모델링 편의가 기준 문서의 보증 가치를 통째로 깎는다.
    proposed_action: "자기참조 예외를 폐기하고 회수 흐름을 별도 개념(예: ByproductLine 또는 recovery_output
      관계, 음수 소요가 아닌 산출 방향 관계)으로 분리해 BOM 비순환 보증을 무예외로 복원하라."
    affected_purpose: PLM/MES 통합 기준 문서가 제공해야 할 BOM 구조 보증(전개 가능성·종료성) 및 BOM 개념 정합성(사용자 요청 의도 명시 축)
    failure_condition: MES/MRP가 비순환을 전제로 BOM 전개·원가 적산을 수행할 때 자기참조 Assembly를 만나는 경우
    impact: 전개 무한루프 또는 임의 특례 로직의 시스템별 분기를 유발하며, 기준 문서의 무결성 규칙이 '예외 있는 보증'으로 격하되어 통합
      계약으로서의 신뢰가 약화된다.
    evidence_refs:
      - .onto/review/20260611-ca3c674b/round1/axiology.findings.yaml#axiology-candidate-003
      - manufacturing-bom-ontology.yaml integrity_rules[0]
      - manufacturing-bom-ontology.yaml entities.Assembly (is_a Part + bom_lines)
      - review-value-alignment-criteria.yaml criterion user-request-intent
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES 통합 기준 문서가 제공해야 할 BOM 구조 보증(전개 가능성·종료성) 및 BOM 개념
        정합성(사용자 요청 의도 명시 축)
      failure_condition: MES/MRP가 비순환을 전제로 BOM 전개·원가 적산을 수행할 때 자기참조 Assembly를 만나는 경우
      impact: 전개 무한루프 또는 임의 특례 로직의 시스템별 분기를 유발하며, 기준 문서의 무결성 규칙이 '예외 있는 보증'으로 격하되어 통합
        계약으로서의 신뢰가 약화된다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml integrity_rules[0]
        - manufacturing-bom-ontology.yaml entities.Assembly (is_a Part +
          bom_lines)
        - review-value-alignment-criteria.yaml criterion user-request-intent
    causal_path:
      root_cause_candidate: 회수/부산물 흐름이라는 별개 개념을 신설하는 비용을 피하려고 기존 BOM 포함 관계를 재사용한 모델링 결정
      root_cause_step_id: finding-003.cause-003
      steps:
        - cause_id: finding-003.cause-001
          claim: 비순환 원칙과 자기참조 허용 예외가 동일 규칙에 공존한다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml integrity_rules[0]
        - cause_id: finding-003.cause-002
          claim: 예외 허용은 BOM 전개 종료성 보증을 소비자가 신뢰할 수 없게 만든다
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml integrity_rules[0]
            - manufacturing-bom-ontology.yaml relations (Assembly has_many
              BomLine)
        - cause_id: finding-003.cause-003
          claim: 이는 회수 흐름에 적합한 별도 개념 부재의 증상이다 — 온톨로지에 부산물/회수 방향 관계가 존재하지 않는다
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities (ByproductLine 류 부재)
            - manufacturing-bom-ontology.yaml relations 목록
      unresolved_beyond_evidence: 실제 MES 전개 엔진이 자기참조를 어떻게 처리하는지는 경계 밖 증거라 확인 불가.
  - finding_id: finding-004
    lens_id: axiology
    source_ref: .onto/review/20260611-ca3c674b/round1/axiology.findings.yaml#axiology-candidate-004
    target: "manufacturing-bom-ontology.yaml :: notes[0] (누적 std_time 이중 권위)"
    evidence_anchor: 'notes: "원가 계산용 누적 std_time은 MES가 Routing에서 계산하지만, 표준원가 시스템에도
      수기 입력 필드가 있어 분기마다 대사한다."'
    claim: 파생 가능한 값(누적 std_time)에 대해 계산 경로와 수기 입력이라는 이중 권위를 분기별 대사로 봉합하는 운영을 기준 문서가
      정상 상태로 승인하고 있다.
    lens_rationale_summary: 개념 기준 문서의 역할은 이런 이중 권위를 해소할 기준을 제시하는 것이다. 현상을 무비판적으로 기록만
      하면 문서가 이 트레이드오프(수기 유연성 vs 원가 정합성)를 암묵 승인하는 효과를 내며, 분기 단위 괴리 동안 원가가 비권위 값으로
