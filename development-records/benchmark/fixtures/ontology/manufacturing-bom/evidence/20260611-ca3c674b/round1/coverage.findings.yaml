findings:
  - candidate_id: coverage-candidate-001
    target: manufacturing-bom-ontology.yaml — BomLine / Part.rev / ECO
    evidence_anchor: entities.BomLine attributes (parent_ref, child_ref, qty_per,
      scrap_rate only); entities.Part.rev (single string); integrity_rules[2]
      (rev 갱신은 주간 배치 동기화)
    claim: BOM 구조와 품목 리비전에 유효기간·이력(effectivity) 차원이 전혀 없어 과거 시점 BOM을 재구성할 수 없다.
    what: BomLine에는 effective_from/effective_to 또는 ECO 연계 유효성 속성이 없고, Part.rev는 단일
      문자열로 현재값만 보유하며 리비전 이력 개념이 없다. ECO.effective_date가 유일한 시간 개념이지만 BOM 라인 단위와
      연결되지 않는다.
    why: PLM/MES 통합 기준 문서라면 '특정 생산 시점에 어떤 BOM/rev가 유효했는가'가 핵심 질의인데, 현 모델로는 ECO
      effective_date 전후의 BOM 상태 전환을 표현할 수 없다. integrity_rules가 'effective_date
      이후 생산분은 신규 rev를 따른다'고 규정하면서도 그 규칙을 지탱할 시간 차원이 모델에 없어 규칙 자체가 검증 불가능하다.
    how_to_fix: BomLine에 effectivity(effective_from/to 또는 도입·폐기 ECO ref) 속성을 추가하고,
      Part의 리비전을 이력 가능한 하위 개념(PartRevision)으로 분리해 ECO와 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 변경관리(ECO)와 BOM 정합성 보장
      failure_condition: ECO effective_date를 걸친 생산 시점에서 어느 BOM 구성·rev가 유효한지 시스템 간 합의가 필요할 때
      impact: 시점별 BOM 재구성이 불가능하면 PLM과 MES가 서로 다른 BOM 스냅샷으로 동작해도 모델 차원에서 검출할 수 없어, 통합
        기준 문서의 핵심 효용이 무력화된다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml entities.BomLine
        - manufacturing-bom-ontology.yaml entities.Part.rev
        - manufacturing-bom-ontology.yaml integrity_rules[2]
    causal_path:
      root_cause_candidate: 온톨로지가 BOM을 '현재 상태 스냅샷'으로만 개념화하고 변경관리를 별도 엔티티(ECO)로 외부화하면서,
        둘을 잇는 시간 유효성 차원을 설계에서 누락함
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: BomLine과 Part.rev에 유효기간·이력 속성이 존재하지 않는다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities.BomLine
            - manufacturing-bom-ontology.yaml entities.Part.rev
        - cause_id: coverage-candidate-001.cause-002
          claim: 그 결과 integrity_rules[2]의 'effective_date 이후 신규 rev' 규칙을 모델 내부에서 표현·검증할 수
            없다
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml integrity_rules[2]
        - cause_id: coverage-candidate-001.cause-003
          claim: rev 갱신이 주간 배치 동기화로 서술된 것은 시간 차원이 모델 밖(도면 관리대장)에만 존재함을 시인하는 증거다
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities.Part.rev note
            - manufacturing-bom-ontology.yaml integrity_rules[2]
      unresolved_beyond_evidence: 도면 관리대장·ECO 시스템 측에 이력이 충분히 존재하는지는 본 파일 범위 밖이라 확인 불가
  - candidate_id: coverage-candidate-002
    target: manufacturing-bom-ontology.yaml — 전체 엔티티 집합 (EBOM/MBOM 구분)
    evidence_anchor: 헤더 주석 'PLM/MES 통합의 개념 기준 문서'; entities에 BOM 유형/뷰 개념 부재
    claim: PLM/MES 통합 기준 문서를 표방하면서 설계 BOM(EBOM)과 제조 BOM(MBOM)의 구분 개념이 없다.
    what: BomLine/Assembly는 단일 BOM 구조만 표현한다. PLM(설계 구조)과 MES(제조 소비 구조)는 통상 서로 다른 BOM
      뷰를 가지며 그 변환·대응이 통합의 핵심인데, BOM 유형(usage/view) 차원이 어디에도 없다.
    why: EBOM/MBOM 구분이 없으면 두 시스템이 같은 BomLine 개념을 서로 다른 의미(설계 구성 vs 제조 투입)로 해석하게 되고,
      통합 기준 문서가 가장 빈번한 PLM-MES 불일치 원천을 다루지 못한다. scrap_rate(제조 관점 계수)가 설계 구조인
      BomLine에 직접 붙어 있는 것이 두 관점이 이미 한 개념에 뒤섞여 있다는 증거다.
    how_to_fix: BOM 헤더 또는 BomLine에 bom_usage(engineering/manufacturing) 차원을 추가하거나,
      단일 BOM 정책을 채택했다면 그 결정과 적용 조건을 integrity_rules/notes에 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합 시 양 시스템 BOM 의미의 공통 기준 제공
      failure_condition: PLM의 설계 구조와 MES의 제조 투입 구조가 달라지는 품목(공정 분할, 중간 조립 생략, 포장재 추가 등)을 통합할 때
      impact: 기준 문서가 구분을 제공하지 않으면 각 시스템이 자체 해석으로 매핑하여 자재 소요·원가 산출 불일치가 모델 외부에서 발생한다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml 헤더 주석
        - manufacturing-bom-ontology.yaml entities.BomLine.scrap_rate
    causal_path:
      root_cause_candidate: 온톨로지가 BOM을 단일 관점 구조로 가정하고 설계/제조 관점 분리라는 도메인 표준 하위 영역을 개념 공간에서 누락함
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: entities/relations 어디에도 BOM 유형·용도 차원이 없다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities
            - manufacturing-bom-ontology.yaml relations
        - cause_id: coverage-candidate-002.cause-002
          claim: 제조 관점 계수(scrap_rate)가 구분 없이 BomLine에 직접 부착되어 설계/제조 의미가 한 개념에 혼재한다
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities.BomLine.scrap_rate
      unresolved_beyond_evidence: 해당 조직이 의도적으로 단일 BOM 정책을 운영하는지는 본 파일에 서술이 없어 판단 불가
  - candidate_id: coverage-candidate-003
    target: manufacturing-bom-ontology.yaml — Part / Routing.status / ECO.status
    evidence_anchor: entities.Part (lifecycle 상태 속성 없음); entities.Routing.status
      values [draft, released]; entities.ECO.status values [open, approved,
      applied]
    claim: "상태를 갖는 핵심 요소들의 lifecycle이 도입~종료 전 구간을 커버하지 못한다: Part에는 lifecycle 자체가 없고,
      Routing과 ECO는 종결·취소 구간이 없다."
    what: Part에 신규/양산/단종(obsolete) 등 lifecycle 상태가 없다. Routing.status는
      draft/released 두 값뿐으로 폐기·대체(superseded/obsolete) 상태가 없다. ECO.status는
      open/approved/applied뿐으로 반려(rejected)·취소(cancelled) 경로가 없다.
    why: 단종 품목 개념이 없으면 단종 부품이 BOM에 잔존해도 생산 오더 생성을 막을 근거가 모델에 없다. released 이후 상태가 없으면
      신규 라우팅 출시 시 구 라우팅의 의미가 미정의가 된다. ECO에 반려 상태가 없으면 승인 게이트가 실질적으로 단방향 통과 절차가
      되어 변경관리 통제가 약화된다.
    how_to_fix: "Part에 lifecycle_status(예: preliminary/active/phase_out/obsolete)를
      추가하고, Routing.status에 obsolete 또는 superseded를, ECO.status에
      rejected/cancelled를 추가한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 품목·라우팅·변경관리 개념의 정합성(요청 명시 검토 축) 및 생산 오더 생성 게이트의 신뢰성
      failure_condition: 품목 단종, 라우팅 개정 교체, ECO 반려가 실제로 발생하는 통상 운영 시점
      impact: 도입~종료 중 종료 구간이 통째로 비어 있어, 단종품 오발주·구 라우팅 오사용을 모델이 막을 수 없고 ECO 승인 게이트가
        형식화된다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml entities.Part
        - manufacturing-bom-ontology.yaml entities.Routing.status
        - manufacturing-bom-ontology.yaml entities.ECO.status
        - manufacturing-bom-ontology.yaml integrity_rules[1]
    causal_path:
      root_cause_candidate: 모델이 '현재 양산 중' 정상 경로만 개념화하고 종료·예외 경로(단종, 폐기, 반려)를 lifecycle 설계에서 체계적으로 제외함
      root_cause_step_id: coverage-candidate-003.cause-002
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: Part에 lifecycle 상태 속성이 없고 Routing/ECO의 enum에 종결·취소 값이 없다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities.Part
            - manufacturing-bom-ontology.yaml entities.Routing.status
            - manufacturing-bom-ontology.yaml entities.ECO.status
        - cause_id: coverage-candidate-003.cause-002
          claim: released만 게이트로 쓰는 integrity_rules[1]은 출시 이후 라우팅을 무효화할 수단이 모델에 없음을 드러낸다
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml integrity_rules[1]
      unresolved_beyond_evidence: 단종·반려가 외부 시스템(PLM 등)에서 별도 관리되는지는 본 파일 범위 밖
  - candidate_id: coverage-candidate-004
    target: manufacturing-bom-ontology.yaml — scrap_rate / std_time / rev /
      acceptance_criteria의 권위 지정
    evidence_anchor: entities.BomLine.scrap_rate note (엑셀 값을 복사); notes[0] (std_time
      MES 계산 + 표준원가 수기 입력, 분기 대사); entities.Part.rev note + integrity_rules[2]
      (주간 배치 동기화)
    claim: 복수 시스템·장부에 걸쳐 관리된다고 스스로 서술한 값들(scrap_rate, std_time, rev)에 단일 원본(권위) 지정
      개념이 없다.
    what: scrap_rate는 생산계획팀 엑셀이 사실상 원본이고 온톨로지 값은 복사본이다. 누적 std_time은 MES 계산값과 표준원가
      시스템 수기 입력값이 병존하며 분기마다 대사한다. Part.rev는 도면 관리대장이 원본이고 주간 배치로 동기화된다. 그러나 모델에는
      어느 값이 권위이고 사본은 어떤 동기화 보장을 갖는지 표현할 개념(authority/source-of-truth 지정, 동기화
      상태)이 없다.
    why: 기준 문서의 존재 이유가 시스템 간 권위 합의인데, 정작 문서가 열거한 모든 이중 장부 값에 권위 지정이 note 수준 산문으로만
      존재한다. 복사·수기·배치 구간에서 값이 갈라져도 모델 차원에서 어느 쪽이 옳은지 판정할 근거가 없어, 분기 대사·주간 배치 사이의
      불일치 기간이 구조적으로 방치된다.
    how_to_fix: 각 시점 의존 속성에 authoritative_source(시스템/장부 식별)와 sync_policy(주기, 방향)를 일급
      메타 속성으로 추가하고, 사본 속성임을 모델 차원에서 표시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합 시 값 불일치 발생 때 판정 기준 제공이라는 기준 문서의 핵심 역할
      failure_condition: 엑셀 갱신~복사 사이, 수기 입력~분기 대사 사이, 도면대장 반영~주간 배치 사이에 시스템 간 값이 다른 모든 기간
      impact: 권위 미지정 상태에서는 불일치 발견 시 어느 값으로 정정할지가 매번 사람 판단에 맡겨져, 자재
        소요량(scrap_rate)·표준원가(std_time)·생산 rev 적용이 비결정적으로 흔들린다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml entities.BomLine.scrap_rate note
        - manufacturing-bom-ontology.yaml notes[0]
        - manufacturing-bom-ontology.yaml entities.Part.rev note
        - manufacturing-bom-ontology.yaml integrity_rules[2]
    causal_path:
      root_cause_candidate: 기존 분산 장부 운영 관행을 온톨로지가 note 산문으로 기술만 하고, 권위·동기화를 일급 개념으로 승격하지 않음
      root_cause_step_id: coverage-candidate-004.cause-002
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: scrap_rate·std_time·rev 세 값 모두 모델 외부 장부가 원본임이 note/integrity_rules에 명시되어
            있다
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities.BomLine.scrap_rate note
            - manufacturing-bom-ontology.yaml notes[0]
            - manufacturing-bom-ontology.yaml entities.Part.rev note
        - cause_id: coverage-candidate-004.cause-002
          claim: 권위 지정이 산문에만 있고 개념 구조에 없으므로 통합 시스템이 기계적으로 참조할 단일 진실 규칙이 존재하지 않는다
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml entities (authority 관련 속성 부재)
      unresolved_beyond_evidence: 분기 대사·주간 배치에서 실제 불일치가 얼마나 발생하는지는 운영 데이터 없이는 확인 불가
  - candidate_id: coverage-candidate-005
    target: manufacturing-bom-ontology.yaml — uom / 환산계수
    evidence_anchor: entities.Part.uom values [ea, kg, m]; notes[1] '품목별 환산계수 마스터가
      없고, 필요 시 현장에서 환산한다'
    claim: UoM 환산계수라는 필수 하위 영역이 의도적으로 비워져 있고, 그 공백이 현장 임의 환산으로 메워지고 있음을 문서가 자인한다.
    what: uom이 ea/kg/m 세 값으로 존재하고 BomLine.qty_per가 단위 의존 수량인데, 단위 간
      환산계수(UomConversion) 개념이 없다. notes[1]이 환산을 현장 재량에 맡긴다고 명시한다.
    why: kg 관리 원자재를 ea 단위 조립품에 투입하는 BOM 전개·자재 소요 계산은 환산 없이는 정의되지 않는다. 환산이 모델 밖 현장
      재량이면 같은 BOM이 작업자마다 다른 투입량으로 해석될 수 있어, 이는 개념 공백이 직접 제조 운영 위험(요청에서 명시한 검토
      축)으로 이어지는 사례다.
    how_to_fix: 품목별 UomConversion(from_uom, to_uom, factor, 품목 ref) 엔티티를 추가하고
      BomLine 전개 시 환산 규칙 적용을 integrity_rules에 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: BOM 기반 자재 소요·생산 지시 수량의 결정성(제조 운영 위험 축)
      failure_condition: 상위/하위 품목의 uom이 다른 모든 BomLine의 소요량 계산 시
      impact: 환산이 비결정적이면 MES 자재 소요와 실제 투입이 어긋나고, PLM/MES가 같은 BOM에서 다른 수량을 산출해도 기준 문서가
        중재할 수 없다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml entities.Part.uom
        - manufacturing-bom-ontology.yaml notes[1]
    causal_path:
      root_cause_candidate: 환산계수 마스터 부재라는 기존 운영 공백을 온톨로지가 개념으로 보강하지 않고 notes로 현상 기술만 함
