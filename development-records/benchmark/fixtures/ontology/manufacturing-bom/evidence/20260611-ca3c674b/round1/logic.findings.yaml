  - candidate_id: logic-candidate-002
    target: manufacturing-bom-ontology.yaml entities.AlternatePart
    evidence_anchor: 'manufacturing-bom-ontology.yaml
      entities.AlternatePart.definition("A의 대체가 B이면 B의 대체도 A다") vs
      entities.AlternatePart.attributes.direction(values: [one_way,
      bidirectional], note: "기본은 one_way")'
    claim: AlternatePart 정의는 대체 관계를 무조건 대칭(necessary)으로 선언하는데, direction 속성은
      비대칭(one_way)을 허용하고 기본값으로 지정하여 정의와 속성이 동시 만족 불가능하다. verdict=fail;
      conflict_pair=(AlternatePart.definition,
      AlternatePart.attributes.direction); satisfiability_note=inter-claim — 동일
      엔티티의 정의와 속성 스키마가 같은 관계의 대칭성에 대해 상반된 양상을 부여; modality_note=mixed — 정의는 대칭성을
      necessary로, 속성은 비대칭을 possible(이자 default)로 선언하는 modality 충돌.
    what: 정의 문장 'A의 대체가 B이면 B의 대체도 A다'는 모든 AlternatePart 인스턴스에 대해 대칭성을 필수 공리로 선언한다.
      그러나 direction 속성은 one_way 값을 허용하며 note가 이를 기본값으로 지정한다. direction=one_way인
      인스턴스는 정의 공리를 위반하므로, 기본값을 따르는 전형적 인스턴스가 곧 정의 위반 인스턴스가 된다.
    why: "대체부품 대칭성 해석은 자재 가용성 판단에 직결된다. 정의를 따르는 시스템(예: MES 자재 투입 검증)은 B를 A의 대체로 역방향
      허용하고, direction을 따르는 시스템(예: PLM 대체 마스터)은 거부한다. 동일 데이터에 대해 두 소비 시스템이 상반된 자재
      투입 판정을 내릴 수 있어, 잘못된 부품 투입 또는 불필요한 결품이 발생할 수 있다. 이는 naming 모호가 아니라 명시 claim
      간 형식 모순이므로 모호 제거로 해소되지 않는다."
    how_to_fix: "둘 중 하나로 정합화한다: (a) 정의에서 대칭성 문장을 제거하고 '대체 가능 방향은 direction 속성이
      결정한다'로 교체하거나, (b) 대칭성이 실제 비즈니스 공리라면 direction 속성에서 one_way를 제거한다. 현실적으로
      일방향 대체(상위 호환만 허용)가 흔하므로 (a)를 권장하며, 이때 relations의 alternate_of 단축 표기에도 방향성
      의미를 명시한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합 시 대체부품 사용 가능 여부 판정의 단일 기준 제공
      failure_condition: direction=one_way 인스턴스(기본값)가 존재하는 즉시, 정의 공리를 구현한 시스템과
        direction 속성을 구현한 시스템이 역방향 대체 허용 여부에 대해 상반된 판정을 내림
      impact: 개념 기준 문서가 같은 관계에 두 개의 모순된 진리 조건을 제공하므로, 통합 양측이 각자 다른 쪽을 구현하면 자재 투입 검증
        결과가 시스템 간 불일치하고 이는 오투입·결품이라는 제조 운영 위험으로 직결된다
      evidence_refs:
        - manufacturing-bom-ontology.yaml entities.AlternatePart.definition
        - manufacturing-bom-ontology.yaml
          entities.AlternatePart.attributes.direction
    causal_path:
      root_cause_candidate: v2.0 작성 시 대칭 공리를 전제한 정의 문장과 방향성 운영 요구를 반영한 direction 속성이
        각각 도입되면서 한쪽을 폐기·정합화하지 않은 채 같은 엔티티에 병존시킨 것
