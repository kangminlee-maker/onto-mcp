    claim: BOM 비순환 규칙과 자기포함(self-loop) 허용 예외가 단일 규칙 내에서 동시 만족 불가능하다 (intra-claim
      contradiction). verdict=fail; conflict_pair=(integrity_rules[0],
      integrity_rules[0]); satisfiability_note=intra-claim;
      modality_note=necessary 규칙과 possible 예외가 같은 술어(순환 금지)에 대해 부정 관계로 공존하는
      modality 구분 오류.
    what: 동일 문장이 'BOM 그래프는 비순환(acyclic)이어야 한다'를 necessary 제약으로 선언하면서, 동시에 Assembly가
      자기 자신을 하위로 포함하는 형태(길이 1의 순환)를 허용 모델링 패턴으로 명시한다. 자기포함은 정의상 순환이므로 두 서술은
      형식적으로 양립 불가능하다.
    why: "비순환 제약을 검증 게이트로 구현하면(예: BOM 전개·MRP 폭발 시 사이클 검출) 스크랩 재투입 모델은 항상 위반으로 거부되고,
      예외를 허용하도록 검증을 완화하면 비순환 제약 자체가 무력화되어 의도하지 않은 순환 BOM도 통과한다. 어느 구현을 택해도 선언된
      규칙 집합 중 하나를 위반하므로, 이 규칙 집합은 동시 만족 불가능하다. PLM/MES 통합의 개념 기준 문서로서 BOM 전개
      종결성(무한 전개 방지)이라는 핵심 보장을 줄 수 없게 된다."
    how_to_fix: "비순환 제약의 적용 범위를 명시적으로 분리한다: (a) 일반 BOM 관계에는 무조건적 비순환을 유지하고, (b) 스크랩
      재투입은 BomLine의 별도 타입(예: line_type: byproduct_return) 또는 별도 관계(예:
      recovers_into)로 분리하여 비순환 검증 대상 그래프에서 제외되는 부산물 관계로 모델링한다. 예외를 같은 has_many
      BOM 그래프 위의 self-loop로 두지 않는다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM 구조 유효성(전개 종결성) 판정 기준 제공
      failure_condition: 비순환 검증을 구현하는 모든 소비 시스템(PLM BOM 체크, MES/MRP 전개)에서 스크랩 재투입 BOM이
        거부되거나, 예외 수용 시 임의 순환 BOM이 통과하는 두 갈래 중 하나가 반드시 발생
      impact: 통합 기준 문서의 핵심 무결성 규칙이 자기모순이면 PLM과 MES가 서로 다른 해석(엄격 비순환 vs 예외 허용)을 구현할 수
        있고, 동일 BOM이 한 시스템에서는 유효, 다른 시스템에서는 무효가 되어 기준 문서 역할이 무너진다
      evidence_refs:
        - manufacturing-bom-ontology.yaml integrity_rules[0]
    causal_path:
      root_cause_candidate: 스크랩 재투입(부산물 회수)이라는 별개 개념을 신규 관계/타입으로 분리하지 않고 기존 BOM 포함 관계의
        예외로 흡수하면서, necessary 제약(비순환)에 그와 모순되는 possible 예외를 같은 규칙 문장에 병기한 모델링 결정
