      "ECO.effective_date 이후 생산분은 신규 rev를 따른다. 단 Part.rev 갱신은 도면 관리대장 반영 후 주간
      배치로 동기화한다." / integrity_rules[1] / entities.ECO.attributes.effective_date'
    claim: ECO 발효 즉시 신규 rev 적용을 의무화(obligatory)하는 규칙과 Part.rev의 주간 배치 지연 갱신을 허용하는
      규칙이 시간 전개 경로 위에서 동시 만족 불가능하다. verdict=fail;
      conflict_pair=(integrity_rules[2] 전반부, integrity_rules[2] 후반부);
      satisfiability_note=intra-claim — 동일 규칙 문장 내 의무 조항과 단서 조항이
      effective_date~배치 동기화 사이 구간에서 충돌; modality_note=obligatory 의무(신규 rev 준수)와
      possible 상태(rev 필드의 구버전 잔존 허용)를 같은 시구간에 부여한 modality 구분 오류.
    what: 규칙 전반부는 effective_date 이후의 모든 생산분이 신규 rev를 따라야 한다는 의무를 부과한다. 규칙 후반부는 모델 내
      rev의 유일한 표현인 Part.rev가 최대 1주까지 구 rev로 남는 것을 명시적으로 허용한다. effective_date와 주간
      배치 사이 구간에서 생산 오더가 생성되면(integrity_rules[1]은 released routing만 요구하며 이 구간의
      생산을 차단하지 않음), 그 생산분은 '신규 rev를 따라야 한다'와 '모델이 제공하는 rev는 구버전이다'를 동시에 만족해야 하는
      상태에 놓인다. 모델 내부 정보만으로는 이 의무를 이행할 방법이 없어, 상태 전개 경로 위에서 규칙 집합이 만족 불가능하다.
    why: 이 온톨로지를 기준으로 MES가 생산 시점 rev를 결정한다면, 동기화 지연 구간의 생산분은 규칙상 신규 rev 의무 대상이면서 시스템
      조회 결과는 구 rev인 모순 상태로 기록된다. 이는 스냅숏 시점에는 드러나지 않고 ECO 발효라는 허용된 후속 사건 이후의 시간
      전개에서만 나타나는 충돌이며, 구 rev 자재 투입·추적성 오류라는 제조 운영 위험(요청 핵심인 변경관리 정합성)으로 직결된다.
      ECO.status(open/approved/applied) 역시 effective_date와 어떤 시점 관계여야 하는지 규칙이 없어
      모순을 차단하지 못한다.
    how_to_fix: "rev 결정 권위를 시구간별로 명시하여 의무와 상태를 정합화한다: 생산 시점 유효 rev는 'Part.rev가 아니라
      effective_date 기준 ECO(current_eco)에서 도출한다'를 규칙에 명시하거나, 또는
      'effective_date~rev 동기화 완료 구간에는 해당 품목의 생산 오더 생성을 보류한다'는 차단 규칙을 추가한다. 전자가
      운영 중단이 없는 권장안이다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: "변경관리(ECO) 정합성: effective_date 기준으로 생산분의 rev를 일관되게 판정하는 기준 제공"
      failure_condition: ECO 발효 후 주간 배치 동기화 전 구간에 해당 품목 생산 오더가 생성되는 경우(규칙상 차단 장치 없음)마다 발생
      impact: 기준 문서가 의무(신규 rev 준수)의 이행 수단을 모델 내에서 제공하지 않으면서 불이행 상태(구 rev 잔존)를 명시
        허용하므로, MES 구현이 어느 조항을 따르든 다른 조항을 위반한다. 구 rev 기준 자재 투입과 이력 추적성 훼손이라는 사용자가
        명시한 제조 운영 위험에 직결된다
      evidence_refs:
        - manufacturing-bom-ontology.yaml integrity_rules[2]
        - manufacturing-bom-ontology.yaml integrity_rules[1]
        - manufacturing-bom-ontology.yaml entities.Part.attributes.rev
        - manufacturing-bom-ontology.yaml entities.ECO.attributes.effective_date
    causal_path:
