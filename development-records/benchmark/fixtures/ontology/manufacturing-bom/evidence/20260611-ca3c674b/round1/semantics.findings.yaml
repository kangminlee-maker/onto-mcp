    why: "'current'라는 이름은 소비자에게 실시간 현행 값을 약속하지만 모델이 선언한 동작은 지연 사본이다. 이름-의미의 시간적
      불일치이며, 다만 원본 시스템이 노트에 명시되어 있어 표면 수준 경고로 충분하다."
