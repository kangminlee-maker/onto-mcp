  - candidate_id: semantics-candidate-006
    target: manufacturing-bom-ontology.yaml — InspectionPlan inheritance
    evidence_anchor: "materialized-input.md lines 47-53 and 77-82: InspectionPlan is
      defined as a plan/parameter extension but declared is_a Operation"
    claim: 검사 계획이라는 규격·계획 객체를 실제 라우팅 공정 단계인 Operation의 하위 유형으로 분류한다.
    what: InspectionPlan은 sampling_rule과 acceptance_criteria를 담는 계획이지만 Operation을
      상속해 작업장과 표준 작업시간을 가진 공정 단계가 된다.
    why: 계획은 공정을 규정하는 정보 객체이고 Operation은 라우팅에서 수행되는 단계다. 둘을 동일 유형으로 만들면 하나의 검사 계획을
      여러 공정에서 재사용하거나 개정하는 의미와, 특정 공정의 실행 순서·시간·작업장 의미가 뒤섞인다.
    how_to_fix: InspectionOperation을 Operation의 하위 유형으로 두고, 별도의 InspectionPlan 또는
      InspectionSpecification을 그 공정이 참조하도록 모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM 품질 규격과 MES 라우팅 검사 공정의 명확한 통합 매핑
      failure_condition: 검사 기준을 개정·재사용하거나 MES가 InspectionPlan을 실제 라우팅 단계로 실행할 때
      impact: 검사 규격의 생명주기와 공정 단계의 실행 속성이 결합되어 잘못된 라우팅 또는 기준 적용으로 이어질 수 있다.
      evidence_refs:
        - materialized-input.md:47-53
        - materialized-input.md:77-82
    causal_path:
      root_cause_candidate: 검사를 수행하는 사건·단계와 그 검사를 규정하는 계획·명세가 구분되지 않았다.
      root_cause_step_id: semantics-candidate-006.cause-002
      steps:
        - cause_id: semantics-candidate-006.cause-001
          claim: InspectionPlan이 Operation을 상속한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:77-82
        - cause_id: semantics-candidate-006.cause-002
          claim: 검사 단계와 검사 규격의 서로 다른 존재론적 유형이 상속 관계로 결합됐다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:47-53
            - materialized-input.md:77-82
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-007
    target: manufacturing-bom-ontology.yaml — cumulative std_time note
    evidence_anchor: "materialized-input.md lines 47-60 and 98-99: MES derives
      cumulative std_time from Routing, while the standard-cost system stores an
      independently entered copy"
    claim: 누적 표준시간이 파생값이면서 독립 수기 입력값으로도 취급되지만 두 표현의 의미와 권위가 정의되지 않는다.
    what: Operation.std_time_min과 Routing.operations가 원천으로 존재하는데 누적 std_time은 MES
      계산값과 표준원가 시스템의 수기 입력값으로 이중 관리된다. 합산 범위와 대사 시 어느 값이 권위인지 없다.
    why: 라우팅 변경 직후부터 분기 대사 전까지 두 값은 달라질 수 있다. 이때 동일한 '누적 std_time' 명칭이 계산 결과와 독립 입력을
      가리켜 원가와 생산시간 분석이 서로 다른 사실을 사용하게 된다.
    how_to_fix: 누적 표준시간을 Routing 버전과 Operation.std_time_min에서 계산되는 명시적 파생값으로 정의하고
      산식·적용 범위·권위 원천을 고정한다. 표준원가 시스템 값은 필요한 경우 snapshot 또는 override로 별도 명명하고 기준
      시점과 승인 근거를 기록한다.
    upstream_evidence_required: false
    severity_hint: medium
