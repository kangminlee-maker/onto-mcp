    evidence_anchor: materialized-input.md:7,12-82,95
    claim: 생산 오더를 언급하면서도 해당 오더와 실행·실적·추적성 하위 영역을 표현하지 않는다.
    what: 무결성 규칙은 생산 오더 생성 가능 조건을 정의하지만 ProductionOrder 엔티티가 없고, 적용 BOM/Routing 버전,
