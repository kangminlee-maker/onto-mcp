domain_context_assumptions:
  - PLM/MES 통합 개념 기준은 특정 생산 시점에 적용된 BOM·라우팅·변경 상태를 재구성할 수 있어야 한다.
  - BOM 수량 단위가 생산 또는 재고 단위와 다를 수 있으므로 품목별 환산 규칙은 운영상 필요한 개념이다.
  - 승인·적용 같은 변경 통제는 상태값뿐 아니라 행위자·시각·근거를 추적할 수 있어야 한다.
  - 생산 오더를 규칙에서 직접 언급한 경우 온톨로지는 그 소비 개념을 정의하거나 외부 온톨로지와의 경계를 명시해야 한다.
