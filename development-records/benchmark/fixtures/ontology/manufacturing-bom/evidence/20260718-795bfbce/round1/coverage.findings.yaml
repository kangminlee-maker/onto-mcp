  - candidate_id: coverage-candidate-002
    target: Part·Routing·ECO lifecycle
    evidence_anchor: materialized-input.md:14-21,55-61,69-75
    claim: 상태를 갖는 핵심 개념의 종료·철회·대체 및 종결 후 정정 lifecycle이 누락되어 있다.
    what: Routing 상태는 draft/released, ECO 상태는 open/approved/applied까지만 존재하고 Part에는
      lifecycle 상태가 없다. 폐기, 단종, 취소, 반려, superseded와 종결 후 정정·재발행 사건을 표현할 수 없다.
    why: 이미 release 또는 applied된 정의를 폐기하거나 잘못된 변경을 정정해야 할 때 기존 상태 의미를 보존하면서 후속 사건을
      기록할 방법이 없다.
    how_to_fix: Part, BOM/Routing version, ECO별 lifecycle과 허용 전이를 정의하고 rejected,
      cancelled, superseded, obsolete 같은 종결 상태 및 correction/reissue 사건을 별도 이력으로
      모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
