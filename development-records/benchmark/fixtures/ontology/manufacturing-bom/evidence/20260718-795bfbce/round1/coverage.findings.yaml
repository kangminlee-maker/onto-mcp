      failure_condition: 품목 단종, 라우팅 폐기, ECO 취소 또는 적용 완료 후 오류 정정이 발생할 때
      impact: 종결된 객체가 계속 유효한 것으로 해석되거나 기존 기록을 덮어써야 하므로 PLM/MES 간 상태 의미와 감사 가능성이 약화된다.
      evidence_refs:
        - materialized-input.md:14-21
        - materialized-input.md:55-61
        - materialized-input.md:69-75
    causal_path:
      root_cause_candidate: lifecycle을 초기 작성과 적용 단계까지만 모델링하고 종료 및 종결 후 사건을 개념 범위에 포함하지 않았다.
