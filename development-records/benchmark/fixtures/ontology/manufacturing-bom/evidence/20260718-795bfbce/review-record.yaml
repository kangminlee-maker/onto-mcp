        different lifecycle and traversal needs. Conflating them makes cycle
        detection, BOM explosion, quantity roll-up, and integration
        interpretation exception-dependent, undermining the stated
        common-reference purpose. Source finding context: Keep the product BOM
        acyclic and model recovered-material flow with a separate canonical
