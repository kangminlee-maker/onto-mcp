    issue_statement: The model provides quantity and unit labels but omits
      authoritative part-specific conversion rules.
    proposed_action: Add governed UOM conversion rules with factors, rounding,
      validity, and source authority.
    affected_purpose: Provide one shared meaning for BOM quantities across PLM and MES.
    failure_condition: BOM, production, and inventory units differ or require
      part-specific conversions such as kg to each.
    impact: Local conversion choices can cause shortages, overconsumption, and
