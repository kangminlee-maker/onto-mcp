issues:
  - issue_id: issue-001
    root_cause_hypothesis: Separating drawing revision, manufacturing revision, and
      production effectivity and binding them in one authoritative configuration
      would eliminate both the weekly synchronization conflict and
      revision-meaning ambiguity.
    root_confidence: high
    surface_finding_ids:
      - finding-001
      - finding-017
    relation_refs:
      - rel-001
    raised_by_lens_ids:
      - axiology
      - semantics
    issue_statement: Part.rev conflates separately governed revision meanings and
      cannot reliably identify the production-effective configuration.
    proposed_action: Introduce an authoritative effective-configuration concept and
      separate drawing and manufacturing revision projections.
    affected_purpose: Ensure PLM and MES select the same production-effective
      revision under change control.
    failure_condition: An ECO becomes effective before weekly Part.rev
      synchronization completes, or a change affects more than the drawing
      revision.
    impact: Consumers can select an obsolete or semantically wrong revision while
      believing they follow the shared integration baseline.
    evidence_refs:
      - .onto/review/20260718-795bfbce/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:20-21
      - materialized-input.md:93-96
      - review-value-alignment-criteria.yaml:6-18
      - .onto/review/20260718-795bfbce/round1/semantics.findings.yaml#semantics-candidate-003
      - materialized-input.md:14-21
      - materialized-input.md:69-75
    severity: high
    domain_threshold_used: null
    singleton_reason: null
  - issue_id: issue-002
    root_cause_hypothesis: The self-child exception would be unnecessary if
      recovered-material flow were modeled separately from product structure.
    root_confidence: high
    surface_finding_ids:
      - finding-002
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: The ontology overloads the acyclic product BOM to represent
      cyclic material-recovery flow.
    proposed_action: Keep product structure acyclic and introduce a canonical
      recovered-material flow concept.
    affected_purpose: Provide a coherent BOM and routing model usable across PLM and MES.
    failure_condition: Scrap reintroduction or recovered-material processing uses
      the documented self-child BOM pattern.
    impact: Standard BOM consumers cannot distinguish invalid cycles from process
      returns, weakening interoperability and calculation safety.
    evidence_refs:
      - .onto/review/20260718-795bfbce/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:93-94
      - review-value-alignment-criteria.yaml:6-18
    severity: medium
    domain_threshold_used: null
    singleton_reason: Related findings are connected only by duplicate relations,
      not by a same_root_candidate relation permitted for multi-finding
      clustering.
  - issue_id: issue-003
    root_cause_hypothesis: Typed measurements with explicit arithmetic meaning,
      denominator, unit, authority, and validity would eliminate both the broad
      quantitative ambiguity and the scrap-rate interpretation defect.
    root_confidence: medium
    surface_finding_ids:
      - finding-003
      - finding-018
    relation_refs:
      - rel-010
    raised_by_lens_ids:
      - axiology
      - semantics
    issue_statement: Operational scalar fields lack a shared measurement contract,
      with scrap_rate exposing the resulting ambiguity between a rate and a
      multiplier.
    proposed_action: Define canonical typed measurements and give scrap adjustment
      one explicit formula, range, and authority.
    affected_purpose: Provide reliable quantitative semantics for PLM/MES planning,
      costing, capacity, and material calculations.
    failure_condition: Consumers interpret or calculate documented operational
      values across systems, including scrap_rate as either a percentage or
      factor.
    impact: Syntactically valid values can produce materially different operational
      results while appearing contract-compliant.
    evidence_refs:
      - .onto/review/20260718-795bfbce/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:35
      - materialized-input.md:53
      - materialized-input.md:63-67
      - materialized-input.md:98-100
      - review-value-alignment-criteria.yaml:6-18
      - .onto/review/20260718-795bfbce/round1/semantics.findings.yaml#semantics-candidate-004
      - materialized-input.md:29-35
