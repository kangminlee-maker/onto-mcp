  - issue_id: issue-010
    root_cause_hypothesis: An explicit ProductionOrder boundary referencing
      immutable Part, BOM, and Routing configurations would connect design
      definitions to MES execution evidence.
    root_confidence: medium
    surface_finding_ids:
      - finding-010
    relation_refs: []
    raised_by_lens_ids:
