  - issue_id: issue-008
    root_cause_hypothesis: A governed part- and effectivity-specific UOM conversion
      master would make cross-unit BOM quantities deterministic.
    root_confidence: high
    surface_finding_ids:
      - finding-008
    relation_refs: []
    raised_by_lens_ids:
