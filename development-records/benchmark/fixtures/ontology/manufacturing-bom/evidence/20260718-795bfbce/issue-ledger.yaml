  - issue_id: issue-006
    root_cause_hypothesis: A complete lifecycle defined through immutable transition
      events would support terminal, superseding, and corrective outcomes
      without overwriting state.
    root_confidence: high
    surface_finding_ids:
      - finding-006
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: Core lifecycle models stop at current active states and omit
      termination, withdrawal, supersession, and post-completion correction.
    proposed_action: Define complete lifecycles and separate correction or reissue
      events for Part, BOM/Route versions, and ECOs.
    affected_purpose: Provide consistent lifecycle meaning for part, routing, and
      change management.
    failure_condition: A part is obsoleted, a route is retired, an ECO is cancelled,
      or an applied change requires correction.
    impact: Consumers may treat terminated objects as valid or overwrite history,
      weakening state consistency and auditability.
    evidence_refs:
      - .onto/review/20260718-795bfbce/round1/coverage.findings.yaml#coverage-candidate-002
      - materialized-input.md:14-21
      - materialized-input.md:55-61
      - materialized-input.md:69-75
    severity: medium
    domain_threshold_used: null
    singleton_reason: The only relation is shared_cause_candidate, which must remain
      dependency context rather than cause a merge.
  - issue_id: issue-007
    root_cause_hypothesis: Immutable actor-attributed transition and approval events
      would make ECO approval and application independently auditable.
    root_confidence: high
    surface_finding_ids:
      - finding-007
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: ECO current status lacks the event evidence needed to prove
      approval and application controls.
    proposed_action: Model approval and application as immutable transition events
      with actor, time, rationale, evidence, and affected configuration.
    affected_purpose: Ensure conceptual integrity and traceability of PLM/MES change control.
    failure_condition: A reviewer must establish who approved or applied a change,
      when it occurred, and on what evidence.
    impact: Status values cannot prove control execution, making unauthorized or
