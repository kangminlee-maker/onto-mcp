      effectivity model.
    proposed_action: Introduce BOM and Routing version entities with effectivity,
      lifecycle state, and explicit ECO linkage.
    affected_purpose: Provide a trustworthy part, BOM, and routing baseline for
      PLM/MES integration.
    failure_condition: A consumer must query, synchronize, or audit configurations
      before and after an engineering change.
    impact: Systems can use different current snapshots and cannot prove which
      structure governed historical production.
    evidence_refs:
