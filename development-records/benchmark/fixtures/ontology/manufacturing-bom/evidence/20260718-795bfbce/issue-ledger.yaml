  - issue_id: issue-009
    root_cause_hypothesis: Assigning each manufacturing reference value one
      authority, version, synchronization time, validity interval, and
      derivation status would resolve replica conflicts.
    root_confidence: high
    surface_finding_ids:
      - finding-009
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: Parallel manufacturing reference values lack modeled authority,
      provenance, freshness, and precedence.
    proposed_action: Declare authoritative sources and derivation semantics,
      treating manual copies as non-authoritative projections or explicit
      overrides.
    affected_purpose: Establish consistent authority for PLM/MES manufacturing reference values.
    failure_condition: A copied value differs from its source or an MES-derived
