  - issue_id: issue-019
    root_cause_hypothesis: Making AlternatePart the canonical relationship node and
      deriving any Part-to-Part shortcut from it would preserve direction on
      every traversable substitution path.
    root_confidence: high
    surface_finding_ids:
      - finding-022
    relation_refs: []
    raised_by_lens_ids:
      - structure
    issue_statement: The canonical relations graph bypasses the AlternatePart entity
      that carries substitution direction.
    proposed_action: Connect Part through AlternatePart to the substitute Part and
      treat any direct edge as a constrained projection.
    affected_purpose: Provide a structurally complete alternate-part relationship
      contract for PLM/MES integration.
    failure_condition: A consumer traverses the relations graph to determine
      alternate parts and substitution direction.
    impact: Direction cannot be recovered from the canonical path, so systems
      receive incomplete or unsafe substitution semantics.
    evidence_refs:
