  - issue_id: issue-017
    root_cause_hypothesis: Separating an inspection specification from the routing
      operation that applies it would support independent reuse, revision, and
      execution semantics.
    root_confidence: high
    surface_finding_ids:
      - finding-020
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: InspectionPlan conflates a reusable specification object with
      an executable routing operation through inheritance.
    proposed_action: Model InspectionOperation as the executable subtype and have it
      reference a separate InspectionPlan or InspectionSpecification.
    affected_purpose: Map PLM quality specifications clearly to MES inspection operations.
    failure_condition: An inspection standard is revised or reused, or MES executes
      InspectionPlan as a routing step.
    impact: Specification lifecycle and operation execution properties become
      coupled, risking incorrect routing or inspection criteria.
    evidence_refs:
      - .onto/review/20260718-795bfbce/round1/semantics.findings.yaml#semantics-candidate-006
