  - issue_id: issue-013
    root_cause_hypothesis: Separating product structure from material flow would
      allow new recovery and rework scenarios without expanding BOM cycle
      exceptions.
    root_confidence: high
    surface_finding_ids:
      - finding-013
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: Encoding recovered-material flow as BOM self-reference makes
      future recovery scenarios depend on proliferating acyclicity exceptions.
    proposed_action: Keep BOM acyclic and model scrap recovery, reintroduction,
      rework, and co-product flow separately.
    affected_purpose: Provide extensible BOM and process concepts with safe
      manufacturing calculations.
    failure_condition: Multi-stage recovery, rework, co-product, or by-product flows
      are added beyond the current scrap exception.
    impact: Cycle exceptions accumulate and undermine confidence that BOM explosion
      and cost or requirement calculations terminate consistently.
    evidence_refs:
