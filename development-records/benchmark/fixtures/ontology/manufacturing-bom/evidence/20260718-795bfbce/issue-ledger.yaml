  - issue_id: issue-012
    root_cause_hypothesis: A typed capacity measurement that distinguishes available
      time from throughput and requires explicit units would resolve both
      extensibility pressure and dimensional ambiguity.
    root_confidence: high
    surface_finding_ids:
      - finding-012
      - finding-019
    relation_refs:
      - rel-011
    raised_by_lens_ids:
      - evolution
      - semantics
    issue_statement: The closed and implicit measurement model conflates
      dimensionally different capacity meanings and cannot safely accommodate
      new units or sites.
    proposed_action: Introduce extensible Quantity and UOM concepts and distinguish
      available-time capacity from throughput capacity.
    affected_purpose: Provide a common PLM/MES calculation basis across diverse
      materials, work centers, and sites.
    failure_condition: New units, part-specific conversions, or work centers using
      count-based and time-based capacity are integrated or compared.
    impact: Schema changes and local interpretation become necessary, and capacity
      or quantity calculations can differ across systems.
    evidence_refs:
