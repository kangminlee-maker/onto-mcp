  - issue_id: issue-018
    root_cause_hypothesis: Defining cumulative standard time as a version-bound
      routing derivation and separately identifying approved snapshots or
      overrides would eliminate the authority ambiguity.
    root_confidence: high
    surface_finding_ids:
      - finding-021
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: A routing-derived cumulative standard time and an independently
      entered cost-system value share one undefined identity and precedence.
    proposed_action: Make the derived value authoritative and name any snapshot or
      override separately with basis, time, and approval provenance.
    affected_purpose: Align routing standard time with standard-cost time and
      preserve traceability.
    failure_condition: Routing or operation time changes before the next quarterly
      reconciliation and the manual cost value is used.
    impact: Cost and manufacturing-performance analysis can rely on different
      standard times while both appear authoritative.
    evidence_refs:
      - .onto/review/20260718-795bfbce/round1/semantics.findings.yaml#semantics-candidate-007
