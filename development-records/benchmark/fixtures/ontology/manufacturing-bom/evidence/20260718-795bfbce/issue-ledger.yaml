      connecting ECO effectivity to versioned BOM and routing content.
    proposed_action: Introduce versioned BOM and Routing configurations and connect
      ECO, revision, structure, and effectivity through explicit relations.
    affected_purpose: Provide an evolvable and structurally complete PLM/MES
