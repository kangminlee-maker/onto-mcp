  - issue_id: issue-014
    root_cause_hypothesis: Defining AlternatePart as directional and deriving
      reciprocity only for bidirectional instances would remove the logical
      contradiction.
    root_confidence: high
    surface_finding_ids:
      - finding-014
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: AlternatePart's universal symmetry contradicts its allowed and
      default one-way direction.
    proposed_action: Choose directional semantics with conditional reciprocity, or
      remove one-way values if universal symmetry is intended.
    affected_purpose: Provide a logically consistent alternate-part contract for
      PLM/MES integration.
    failure_condition: A one-way AlternatePart is created or receives the default direction.
    impact: Consumers can reach opposite conclusions about reverse substitution,
