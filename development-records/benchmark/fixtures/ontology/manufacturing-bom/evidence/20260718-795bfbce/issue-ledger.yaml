  - issue_id: issue-016
    root_cause_hypothesis: A separate material-flow relation with yield and recovery
      semantics would prevent process flow from being interpreted as product
      composition.
    root_confidence: high
    surface_finding_ids:
      - finding-016
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: The ontology conflates a manufacturing material-flow event with
      a BOM composition relationship.
    proposed_action: Represent scrap generation, recovery, and reintroduction
