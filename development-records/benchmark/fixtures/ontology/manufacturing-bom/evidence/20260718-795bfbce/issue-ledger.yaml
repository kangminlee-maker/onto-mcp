    issue_statement: The ontology invokes production-order rules without modeling
      the orders, execution records, or traceability contract that consume them.
    proposed_action: Define a minimal ProductionOrder integration boundary and
      either model execution traceability or specify an explicit external
      ontology contract.
    affected_purpose: Use BOM and routing definitions as an operational PLM/MES
      integration baseline.
    failure_condition: A released routing must be applied to an actual production
