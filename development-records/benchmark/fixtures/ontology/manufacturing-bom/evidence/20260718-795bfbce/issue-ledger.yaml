    domain_threshold_used: null
    singleton_reason: null
  - issue_id: issue-004
    root_cause_hypothesis: Choosing one authoritative directional substitution
      meaning and treating reciprocity as an instance property would remove the
      conflicting interpretations.
    root_confidence: high
    surface_finding_ids:
      - finding-004
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: AlternatePart conflates reciprocal equivalence with directional
      substitution permission and exposes a lossy shortcut.
    proposed_action: Adopt one canonical substitution relation carrying direction,
      approval, context, and effectivity.
    affected_purpose: Provide coherent and safe alternate-part semantics across PLM and MES.
    failure_condition: One consumer follows the symmetric definition or shortcut
      while another honors the default one-way direction.
    impact: Systems can disagree about reverse substitution, enabling unauthorized
      material use or rejecting an approved substitute.
    evidence_refs:
      - .onto/review/20260718-795bfbce/round1/axiology.findings.yaml#axiology-candidate-004
      - materialized-input.md:37-45
      - materialized-input.md:91
      - review-value-alignment-criteria.yaml:6-18
    severity: medium
    domain_threshold_used: null
    singleton_reason: Duplicate and enables relations exist, but no
      same_root_candidate relation authorizes merging this finding with their
      endpoints.
  - issue_id: issue-005
    root_cause_hypothesis: Independently versioned and effective-dated BOM and
      routing structures would make historical and scheduled configurations
      reconstructable.
    root_confidence: high
    surface_finding_ids:
      - finding-005
    relation_refs: []
    raised_by_lens_ids:
