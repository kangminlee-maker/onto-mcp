    root_confidence: high
    surface_finding_ids:
      - finding-015
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: AlternatePart's prose definition and direction property assign
      incompatible meanings to the same substitution data.
    proposed_action: Define substitution direction canonically and specify
      bidirectionality as an explicit derived or constrained case.
    affected_purpose: Ensure common and safe interpretation of alternate parts
