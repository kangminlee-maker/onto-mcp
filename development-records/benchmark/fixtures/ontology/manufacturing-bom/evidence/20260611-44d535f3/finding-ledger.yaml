    lens_rationale_summary: 도면 리비전은 문서 원본의 버전이고, 생산 적용 rev는 품목 또는 설계 변경의 유효 버전이다. 둘을
      하나의 Part.rev로 합치면 PLM의 설계 변경 적용 기준과 MES의 생산 주문 기준이 같은 속성에 묶여, 도면 관리대장 동기화
      지연이 생산 rev 의미까지 지연시키는 것처럼 해석된다.
