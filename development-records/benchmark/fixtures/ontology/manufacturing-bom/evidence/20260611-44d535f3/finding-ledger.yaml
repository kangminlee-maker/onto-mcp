      revision은 drawing_rev 또는 drawing_ref.rev로 분리한다. ECO 규칙은 어떤 revision 개념을
      갱신하고 MES가 어느 revision authority를 따라야 하는지 명시한다.
    affected_purpose: 품목·BOM·라우팅·변경관리 개념을 PLM/MES 통합 기준으로 정합하게 정의하는 목적.
