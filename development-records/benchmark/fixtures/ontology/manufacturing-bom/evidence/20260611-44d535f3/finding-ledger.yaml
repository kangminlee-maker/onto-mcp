  - finding_id: finding-002
    lens_id: coverage
    source_ref: .onto/review/20260611-44d535f3/round1/coverage.findings.yaml#coverage-candidate-002
    target: manufacturing-bom-ontology.yaml / MES execution coverage
    evidence_anchor: manufacturing-bom-ontology.yaml:50-56, 88-91
    claim: 생산오더 및 실행 기준을 표현하는 하위 영역이 빠져 있다.
    lens_rationale_summary: PLM/MES 통합에서는 릴리즈된 기준정보가 실제 생산 실행 단위에 고정되어야 한다. 현재 모델은
      라우팅이 released인지 여부만 말하고, 어떤 생산오더가 어떤 기준 BOM·Routing으로 생성되었는지 표현하지 않아 통합 기준
      문서로서 운영 접점을 덮지 못한다.
    proposed_action: ProductionOrder 또는 ManufacturingOrder 엔티티를 추가하고 part_ref,
      selected_part_rev, bom_version/routing_version, order_qty, created_at,
      status, release_basis 같은 속성과 Routing/Part/ECO와의 관계를 정의한다.
    affected_purpose: PLM 기준정보와 MES 생산 실행을 연결하는 개념 기준 제공.
    failure_condition: 라우팅 릴리즈 여부를 근거로 생산오더를 생성하거나, 생성된 오더가 어떤 변경 기준을 사용했는지 추적해야 하는 경우.
    impact: 문서 내부 규칙이 언급하는 생산오더 개념이 모델에 없어 PLM 변경 기준이 MES 실행 단위로 어떻게 고정되는지 검증·감사할 수 없다.
    evidence_refs:
      - .onto/review/20260611-44d535f3/round1/coverage.findings.yaml#coverage-candidate-002
      - manufacturing-bom-ontology.yaml:50-56
      - manufacturing-bom-ontology.yaml:88-91
