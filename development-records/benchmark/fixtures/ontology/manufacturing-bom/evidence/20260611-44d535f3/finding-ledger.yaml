    claim: BOM과 라우팅의 시점별 유효성·이력 차원이 누락되어 있다.
    lens_rationale_summary: 문서는 PLM/MES 통합의 개념 기준을 표방하고, ECO.effective_date 이후 생산분이
      신규 rev를 따른다고 규정한다. 그러나 BOM 구성, 라우팅 순서, 표준시간, 스크랩률이 어느 rev 또는 어느 기간에 유효했는지
      표현하지 못하면 ECO 적용 전후 생산분의 기준정보를 구분할 수 없어 변경관리와 제조 실행 기준이 약해진다.
    proposed_action: BomLine, Routing, Operation 또는 별도 Revision/Effectivity 엔티티에
      effective_from, effective_to, revision/version, superseded_by,
      history/audit reference를 추가하고 ECO 적용 결과가 어떤 BOM·Routing 버전을 생성·종료하는지 연결한다.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목·BOM·라우팅·변경관리 기준을 제공하는 목적.
    failure_condition: ECO 적용 전후 또는 과거 생산일 기준으로 어떤 BOM 라인, 라우팅, 표준시간, 스크랩률이 유효했는지 판정해야 하는 경우.
    impact: MES 생산오더와 PLM 변경관리 사이에서 동일 품목의 과거/현재 제조 기준을 재구성할 수 없어 변경 적용, 추적, 원가·품질
