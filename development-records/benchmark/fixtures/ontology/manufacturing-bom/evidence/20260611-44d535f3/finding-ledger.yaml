    lens_rationale_summary: 대체 가능 부품은 제조 실행에서 투입 가능 품목을 결정하는 개념이므로, 대칭 대체와 단방향 대체는
      의미가 다르다. 현재 정의는 사용자가 관계를 대칭으로 해석하게 만들고, 속성은 단방향을 기본으로 하므로 같은 AlternatePart
      인스턴스가 어느 방향으로 유효한지 개념 기준 문서만으로 일관되게 판단할 수 없다.
    proposed_action: AlternatePart 정의를 'primary_ref 품목을 alternate_ref 품목으로 대체할 수 있는
      관계'처럼 방향성을 기본 의미로 고치고, bidirectional일 때만 역방향도 허용한다고 명시한다. 단축 관계
      alternate_of도 directed_alternate_of와 mutual_alternate_of처럼 방향 의미가 보존되도록
      분리하거나 direction을 필수 조건으로 참조하게 한다.
