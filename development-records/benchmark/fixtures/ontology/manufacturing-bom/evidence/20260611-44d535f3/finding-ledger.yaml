    claim: BOM 비순환 필수 규칙과 자기 포함 모델링 허용 예외가 동일 규칙 안에서 충돌한다.
    lens_rationale_summary: "`Assembly -> BomLine -> Part`와 `Assembly is_a Part`
      구조에서는 Assembly가 자기 하위 Part로 자신을 포함하면 BOM 경로상 자기 순환이 됩니다. 따라서 'BOM은 비순환이어야
      한다'는 necessary 제약과 'Assembly가 자기 하위에 자신을 포함하는 형태로 모델링한다'는
      possible/required modeling 예외가 같은 대상 그래프에서 동시에 만족될 수 없습니다. PLM/MES 통합 기준
      문서에서 이 모순은 BOM 검증기가 순환을 오류로 막아야 하는지, 스크랩 재투입을 정상 구조로 받아야 하는지 결정할 수 없게
      만듭니다. conflict_pair: [manufacturing-bom-ontology.yaml:integrity_rules[0],
      manufacturing-bom-ontology.yaml:integrity_rules[0]]. satisfiability_note:
      intra-claim; 단일 규칙 내부에서 전역 비순환 제약과 자기 포함 허용 예외가 충돌한다. modality_note:
      mixed; necessary prohibition of cycles와 possible/exceptional allowance of
      self-inclusion이 같은 BOM 구조에 적용된다. boundary_handoff_note: 구조적으로 스크랩 재투입을 별도
      관계나 공정 투입으로 모델링할 대체 구조가 없다는 점은 structure lens 경계와 맞닿지만, 현재 finding은 명시 규칙
      내부의 동시 만족 불가능성이므로 logic 소유이다."
    proposed_action: 비순환 규칙의 적용 범위를 일반 자재 BOM으로 한정하고, 스크랩 재투입은 BOM parent-child
      자기참조가 아닌 별도 recovery/rework input 관계로 분리하거나, 허용되는 순환 유형과 검증 예외 조건을 명시하세요.
    affected_purpose: PLM/MES 통합의 BOM 및 공정 개념 기준 문서로서 BOM 검증/생산 투입 생성의 기준을 제공하는 목적.
