  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260611-44d535f3/round1/coverage.findings.yaml#coverage-candidate-004
    target: manufacturing-bom-ontology.yaml / UOM and capacity normalization coverage
    evidence_anchor: manufacturing-bom-ontology.yaml:14, 58-62, 93-95
    claim: 단위 환산과 생산능력 단위의 기준 마스터가 누락되어 있다.
    lens_rationale_summary: BOM 수량, 생산능력, 계획·실적 비교는 단위가 맞아야 의미가 있다. 단위 환산을 현장 임의 처리로
      남기면 PLM/MES 간 BOM 수량과 작업장 능력을 공통 기준으로 해석하기 어렵다.
    proposed_action: 품목별 UnitConversionFactor 마스터를 추가하고 from_uom, to_uom, factor,
      valid_from/to, authority/source를 정의한다. WorkCenter.capacity_per_shift에는
      capacity_unit 또는 capacity_basis를 분리해 수량 기반/시간 기반 능력을 명시한다.
    affected_purpose: BOM·라우팅 기준을 MES 계획/실행 계산에 사용할 수 있게 하는 통합 개념 기준.
    failure_condition: kg↔ea 등 단위가 다른 BOM 소요량이나 작업장별 capacity_per_shift를 생산계획·소요량 산정에 사용해야 하는 경우.
    impact: 단위 환산 권위와 능력 단위가 모델에 없어 동일 숫자가 시스템마다 다르게 해석될 수 있고, 수량·능력 계산의 신뢰가 약해진다.
    evidence_refs:
