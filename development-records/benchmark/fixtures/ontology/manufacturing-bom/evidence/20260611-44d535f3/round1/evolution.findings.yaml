lens_id: evolution
human_output_ref: null
findings:
  - candidate_id: evolution-candidate-001
    target: manufacturing-bom-ontology.yaml / BomLine.scrap_rate
    evidence_anchor: 'Embedded Materialized Input > BomLine.attributes.scrap_rate
      note: "공정 불량 감안 계수. 생산계획팀 엑셀로 별도 관리되는 값을 복사해 둔다."'
    claim: 스크랩률을 BOM 라인 속성의 복사값으로 고정해 공정·버전 확장 시 연속성이 깨질 수 있습니다.
    what: scrap_rate가 BomLine에 단일 number로 저장되고, 원본은 생산계획팀 엑셀이라고만 되어 있습니다. 공정, 작업장,
      기간, ECO 적용 시점, 생산 조건별 스크랩률 변화를 수용할 별도 개념이나 유효기간이 없습니다.
    why: PLM/MES 통합 기준 문서에서 BOM은 설계 구조의 기준이고 스크랩률은 제조 운영 조건에 따라 바뀔 수 있는 계획/공정
      파라미터입니다. 현재 모델은 외부 엑셀 값을 BomLine에 복사하므로 스크랩률 기준이 바뀌거나 공정별 스크랩을 도입할 때 기존
      BOM 라인을 직접 수정해야 하고, 과거 생산분이 어떤 스크랩률 기준으로 계획되었는지 추적하기 어렵습니다.
    how_to_fix: scrap_rate를 BomLine의 단순 복사 속성에서 분리해 `ScrapPolicy` 또는
      `ProcessYieldFactor` 같은 별도 개념으로 모델링하고, part/routing/operation/work_center
      적용 범위와 effective_from/effective_to, source_system, revision을 갖게 하십시오.
      BomLine에는 필요 시 현재 적용 정책 참조만 두는 편이 확장에 안전합니다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM과 제조 운영 파라미터의 변경 연속성을 제공하는 목적
      failure_condition: 스크랩률이 품목별 환산, 공정별 수율, 설비별 불량률, 기간별 계획값으로 변경되거나 외부 엑셀 기준이 개정되는 경우
      impact: 기존 BomLine 자체를 수정해야 하며 설계 BOM 변경과 제조 계획 파라미터 변경이 섞여 과거 계획/원가/생산 오더 재현성과
        MES 연계 신뢰가 약해집니다.
      evidence_refs:
        - BomLine.attributes.scrap_rate note
        - "notes[0]: 원가 계산용 누적 std_time은 MES가 Routing에서 계산하지만 표준원가 시스템에도 수기 입력
          필드가 있어 분기마다 대사"
    causal_path:
      root_cause_candidate: 변동성 있는 제조 운영 파라미터를 독립된 유효기간/출처 개념이 아니라 BOM 구조 속성의 복사값으로 배치했습니다.
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: BomLine.scrap_rate는 단일 number이고 생산계획팀 엑셀 값을 복사한다고 정의되어 있습니다.
          relation_to_previous: null
          evidence_refs:
            - BomLine.attributes.scrap_rate note
        - cause_id: evolution-candidate-001.cause-002
          claim: 이 배치는 스크랩률의 원본, 적용 범위, 유효기간, 버전을 ontology 내부 계약으로 표현하지 않습니다.
          relation_to_previous: symptom_of
          evidence_refs:
            - BomLine.attributes.scrap_rate note
            - "BomLine.attributes: parent_ref, child_ref, qty_per, scrap_rate
              only"
        - cause_id: evolution-candidate-001.cause-003
          claim: 스크랩률 기준이 바뀌면 기존 BOM 라인의 값 자체를 바꾸는 방식이 되어 BOM 구조 변경과 운영 파라미터 변경이 결합됩니다.
          relation_to_previous: causes
          evidence_refs:
            - "BomLine.definition: BOM 한 줄"
            - BomLine.attributes.scrap_rate note
      unresolved_beyond_evidence: 실제 엑셀 관리 프로세스의 버전 보존 여부는 경계 밖이지만, ontology 자체에는 이를 수용하는 개념이 보이지 않습니다.
  - candidate_id: evolution-candidate-002
    target: manufacturing-bom-ontology.yaml / WorkCenter.capacity_per_shift
    evidence_anchor: 'Embedded Materialized Input >
      WorkCenter.attributes.capacity_per_shift note: "교대당 처리 능력. 단위는 작업장마다
      다르다(개수 또는 시간)."'
    claim: 작업장 능력의 단위가 속성 계약에 포함되지 않아 작업장 유형 확장과 MES 통합 시 의미가 충돌합니다.
    what: capacity_per_shift는 number 하나로 정의되어 있으나 단위가 작업장마다 개수 또는 시간으로 다르다고 명시되어
      있습니다. 별도 uom, capacity_kind, calendar, shift pattern, effective version이
      없습니다.
    why: 새 WorkCenter 유형이 추가되거나 설비 능력 표현이 시간·수량·중량·배치 단위로 늘어날 때 동일 속성의 숫자가 서로 다른 의미를
      갖습니다. 외부 MES/APS와 통합할 경우 같은 필드가 생산량인지 가용시간인지 구분되지 않아 라우팅 능력 계산 규칙을 안정적으로
      확장하기 어렵습니다.
    how_to_fix: capacity_per_shift를 `CapacityProfile` 같은 별도 개념으로 분리하거나 최소한
      `capacity_value`, `capacity_uom`, `capacity_basis`(units/time/batch 등),
      `shift_calendar_ref`, 유효기간을 추가하십시오. WorkCenter에는 현재 또는 기본 capacity profile
      참조를 두십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합 기준에서 라우팅, 작업장, 생산능력 계산을 일관되게 확장하는 목적
      failure_condition: 새 작업장 유형이나 외부 MES/APS가 서로 다른 능력 단위와 교대 달력을 요구하는 경우
      impact: 동일 number 필드가 서로 다른 물리량을 뜻해 통합 매핑과 능력 계산이 작업장별 예외 규칙으로 증가하고, 새 유형 추가 시
        기존 구조나 해석 로직 수정이 필요해집니다.
      evidence_refs:
        - WorkCenter.attributes.capacity_per_shift note
        - Operation.attributes.work_center
        - Routing.attributes.operations
    causal_path:
      root_cause_candidate: 용량 값과 용량 단위/기준을 같은 속성 계약 안에서 분리하지 않았습니다.
      root_cause_step_id: evolution-candidate-002.cause-003
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: WorkCenter.capacity_per_shift는 number로만 선언되어 있습니다.
          relation_to_previous: null
          evidence_refs:
            - WorkCenter.attributes.capacity_per_shift
        - cause_id: evolution-candidate-002.cause-002
          claim: 동시에 그 단위가 작업장마다 개수 또는 시간으로 다르다고 명시되어 있습니다.
          relation_to_previous: symptom_of
          evidence_refs:
            - WorkCenter.attributes.capacity_per_shift note
        - cause_id: evolution-candidate-002.cause-003
          claim: Operation은 WorkCenter를 참조하고 Routing은 Operation의 ordered_list로 구성되므로, 라우팅
            확장 시 capacity_per_shift 해석이 공정/작업장별로 달라집니다.
          relation_to_previous: causes
          evidence_refs:
            - Operation.attributes.work_center
            - Routing.attributes.operations
      unresolved_beyond_evidence: 실제 MES 매핑에서 별도 단위 마스터가 있을 가능성은 경계 밖이지만, 대상 ontology에는 그 계약이 없습니다.
  - candidate_id: evolution-candidate-003
    target: manufacturing-bom-ontology.yaml / ECO effective change model
    evidence_anchor: 'Embedded Materialized Input > ECO.attributes.effective_date
      and integrity_rules: "ECO.effective_date 이후 생산분은 신규 rev를 따른다. 단 Part.rev
      갱신은 도면 관리대장 반영 후 주간 배치로 동기화한다."'
    claim: ECO 적용성이 단일 날짜와 Part.rev 배치 동기화에 묶여 변경 시나리오 확장성이 부족합니다.
    what: ECO는 affected_parts와 effective_date만 갖고, 적용 범위가 생산분 전체로 표현됩니다. 공장, 라인,
      lot/serial, 재고 소진, 오더 생성/착수 시점, BOM/Routing 동시 변경 같은 적용 조건을 표현할 개념이 없습니다.
      또한 Part.rev는 도면 관리대장 배치 동기화 후 갱신된다고 되어 있어 ECO 적용성과 Part.rev의 시간적 불일치가 모델에
      남습니다.
    why: 제조 변경관리는 날짜만으로 적용되지 않는 경우가 많고, PLM/MES 통합에서는 어떤 생산 오더가 어느 BOM/Routing/Part
      revision을 따라야 하는지가 핵심입니다. 현재 구조는 변경 기준이 늘어날 때 ECO와 Part/Routing/BOM 구조를 직접
      확장하거나 예외 규칙을 추가해야 하며, 배치 동기화 지연 동안 신규 rev 적용 여부를 안정적으로 판단하기 어렵습니다.
    how_to_fix: ECO에 단일 effective_date 대신 `Effectivity` 개념을 두고 date, lot, serial,
      plant, line, order_state, inventory_disposition,
      affected_artifact(BOM/Routing/Part) 범위를 표현하십시오. Part.rev는 도면 원본과 동기화 상태를
      구분하고, 생산 오더는 release 시점의 BOM/Routing/Part revision snapshot 또는 effectivity
      resolution 결과를 참조하게 하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품목·BOM·라우팅·변경관리 개념을 PLM/MES 통합 기준으로 안정적으로 확장하는 목적
      failure_condition: ECO 적용 기준이 날짜 외 lot/serial/plant/order 상태/재고 소진 방식으로 바뀌거나
        BOM과 Routing 변경이 함께 적용되는 경우
      impact: 변경 적용 판단이 Part.rev 배치 동기화 상태와 단일 effective_date에 의존해, 새 변경관리 정책 도입 시 기존
        엔티티와 무결성 규칙을 수정해야 하고 생산 오더의 적용 revision 연속성이 약해집니다.
      evidence_refs:
        - ECO.attributes.effective_date
        - ECO.attributes.affected_parts
        - integrity_rules[2]
        - Routing.attributes.status
    causal_path:
      root_cause_candidate: 변경 적용성을 독립 개념으로 모델링하지 않고 ECO의 단일 날짜 및 Part.rev 동기화 규칙에 내장했습니다.
      root_cause_step_id: evolution-candidate-003.cause-004
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: ECO는 affected_parts, effective_date, status 중심으로 정의되어 있습니다.
          relation_to_previous: null
          evidence_refs:
            - ECO.attributes
        - cause_id: evolution-candidate-003.cause-002
          claim: 무결성 규칙은 effective_date 이후 생산분은 신규 rev를 따르지만 Part.rev 갱신은 도면 관리대장 반영 후 주간
            배치로 동기화한다고 합니다.
          relation_to_previous: symptom_of
          evidence_refs:
            - integrity_rules[2]
        - cause_id: evolution-candidate-003.cause-003
          claim: 따라서 ECO 적용 판단과 Part.rev 값 사이에 배치 동기화 지연 구간이 생깁니다.
          relation_to_previous: causes
          evidence_refs:
            - Part.attributes.rev note
            - Part.attributes.current_eco note
            - integrity_rules[2]
        - cause_id: evolution-candidate-003.cause-004
          claim: 적용 조건이 날짜 외 기준으로 확장되면 현재 ECO 속성과 규칙을 바꿔야 하며 기존 생산분의 적용 기준을 일반화하기 어렵습니다.
          relation_to_previous: causes
          evidence_refs:
            - ECO.attributes.effective_date
            - integrity_rules[2]
      unresolved_beyond_evidence: 실제 생산 오더 생성 시스템에 별도 effectivity resolver가 있는지는 경계 밖입니다.
domain_constraints_used: []
domain_context_assumptions:
  - PLM/MES 통합 기준 문서라면 BOM 구조, 라우팅, 작업장 능력, ECO 적용성은 외부 시스템 간 안정적인 매핑과 변경 이력 재현을
    지원해야 합니다.
  - evolution lens 관점상 현재 내부 모순 자체보다 새 작업장 유형, 새 변경관리 기준, 운영 파라미터 기준 변경을 수용할 때
    기존 구조 수정이 필요한지를 중심으로 판단했습니다.
validation:
  unaddressable_candidates: []
