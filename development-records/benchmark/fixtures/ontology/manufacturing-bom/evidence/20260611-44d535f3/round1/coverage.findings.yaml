domain_context_assumptions:
  - session_domain이 none이므로 별도 도메인 문서는 사용하지 않았다.
  - PLM/MES 통합 기준 문서는 변경 전후 기준정보를 생산 실행 시점별로 재구성할 수 있어야 한다는 일반 제조 기준정보 관점을 적용했다.
  - 통제가 필요한 승인, 동기화, 복사, 수기 입력, 대사 행위는 행위자·시각·근거 추적 개념을 가져야 한다는 coverage lens의
    관점을 적용했다.
