      대상 그래프에서 동시에 만족될 수 없습니다. PLM/MES 통합 기준 문서에서 이 모순은 BOM 검증기가 순환을 오류로 막아야
      하는지, 스크랩 재투입을 정상 구조로 받아야 하는지 결정할 수 없게 만듭니다. conflict_pair:
