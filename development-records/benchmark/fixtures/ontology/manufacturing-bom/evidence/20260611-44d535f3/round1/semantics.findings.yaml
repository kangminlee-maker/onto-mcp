  - candidate_id: semantics-candidate-002
    target: Part.rev / ECO effective revision semantics
    evidence_anchor: .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:14,
      .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:15,
