      .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:48
    claim: BomLine.scrap_rate는 BOM 구조 수량과 공정 불량률 의미를 섞어 독립 입력으로 둔다.
    what: BomLine은 상위 품목이 하위 품목을 얼마나 쓰는지를 표현하며 qty_per를 가진다. 여기에 scrap_rate가 '공정 불량
      감안 계수'로 추가되어 있고, 값은 생산계획팀 엑셀에서 복사한다고 되어 있다. 공정 불량은 Operation 또는 Routing 실행
      조건의 의미에 가깝지만 BOM 한 줄의 구조 수량 속성으로 들어가 있다.
    why: scrap_rate처럼 비율/율을 뜻하는 값은 원천 관측치나 공정 조건에서 파생되거나 특정 공정에 귀속되는 경우가 많다. 현재 모델은
      원천 공정·측정 기준 없이 BOM 라인에 복사본을 보관하므로, 동일 부품의 구조 소요량(qty_per)과 공정 수율
      보정값(scrap_rate)이 같은 수준의 독립 입력처럼 보인다.
    how_to_fix: BOM 구조에는 qty_per와 적용 조건만 두고, scrap_rate는 Routing/Operation별 yield 또는
      planning_factor로 분리한다. 반드시 BOM 라인에 노출해야 한다면 원천 공정, 기준 기간, authority, 계산식
      또는 복사본 여부를 명시해 파생값임을 드러낸다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM과 라우팅/공정 개념의 의미 경계를 통합 기준 문서에서 분명히 하는 목적.
      failure_condition: PLM/MES 또는 생산계획 연동이 BomLine.scrap_rate를 BOM의 원천 구조 데이터로 취급하면,
        공정 조건에서 온 불량 보정값과 제품 구조 수량이 동일 authority의 입력으로 혼동된다.
      impact: 공정 불량 보정값의 출처와 적용 범위가 불명확해져 자재 소요량, 계획 수량, 원가 계산에서 원천 드리프트와 중복 보정 위험이
        생긴다.
