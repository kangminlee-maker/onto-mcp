      .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:45,
      .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:91
    claim: AlternatePart는 대체 관계의 방향 의미를 서로 모순되게 정의한다.
    what: 정의는 'A의 대체가 B이면 B의 대체도 A'라고 하여 대체 관계를 항상 대칭 관계로 설명하지만, 같은 엔티티의 direction
      속성은 one_way와 bidirectional을 허용하고 기본값을 one_way로 둔다. 또한 Part-to-Part
      alternate_of 단축 관계는 방향 의미를 드러내지 않는다.
    why: 대체 가능 부품은 제조 실행에서 투입 가능 품목을 결정하는 개념이므로, 대칭 대체와 단방향 대체는 의미가 다르다. 현재 정의는 사용자가
      관계를 대칭으로 해석하게 만들고, 속성은 단방향을 기본으로 하므로 같은 AlternatePart 인스턴스가 어느 방향으로 유효한지
      개념 기준 문서만으로 일관되게 판단할 수 없다.
    how_to_fix: AlternatePart 정의를 'primary_ref 품목을 alternate_ref 품목으로 대체할 수 있는 관계'처럼
      방향성을 기본 의미로 고치고, bidirectional일 때만 역방향도 허용한다고 명시한다. 단축 관계 alternate_of도
      directed_alternate_of와 mutual_alternate_of처럼 방향 의미가 보존되도록 분리하거나 direction을
      필수 조건으로 참조하게 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 대체 부품 사용 가능성을 일관되게 해석하게 하는 목적.
      failure_condition: MES나 계획 시스템이 AlternatePart 정의의 대칭 문장을 따르거나 alternate_of 단축
        표기를 사용하면서 one_way 기본 방향을 무시할 때, 역방향 대체가 허용되는지 잘못 판단될 수 있다.
      impact: 대체 투입 가능성이 잘못 해석되면 승인되지 않은 부품 투입, 자재 가용성 판단 오류, BOM 대체 정책의 실행 불일치로 이어져
        제조 운영 신뢰를 약화한다.
      evidence_refs:
        - materialized-input.md:37
        - materialized-input.md:38
        - materialized-input.md:42
        - materialized-input.md:44
        - materialized-input.md:45
        - materialized-input.md:91
    causal_path:
      root_cause_candidate: 대체 관계의 기본 의미를 대칭 관계로 서술하면서 별도 속성에서는 단방향을 기본값으로 둔 의미 모델링 불일치.
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
