      .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:81,
      .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:82
    claim: InspectionPlan을 Operation의 하위 유형으로 둔 것은 계획/파라미터 문서와 공정 실행 단계를 혼동한다.
    what: Operation은 라우팅의 한 공정 단계로 work_center와 std_time_min을 가진다. InspectionPlan은
      검사 계획이며 Operation의 검사 파라미터 확장이라고 정의되어 sampling_rule과 acceptance_criteria를
      가진다. 그러나 검사 계획 자체는 라우팅 단계가 아니라 검사 Operation에 적용되는 계획 또는 사양이다.
    why: Operation의 인스턴스는 수행되는 단계여야 하지만 InspectionPlan의 인스턴스는 기준과 규칙을 담은 제도적/문서적
      구성물에 가깝다. is_a 관계를 두면 모든 InspectionPlan이 Operation의 필수 속성과 실행 의미를 상속하게 되어,
      검사 계획을 작업장과 표준시간이 있는 공정 단계로 오인할 수 있다.
    how_to_fix: InspectionPlan을 Operation의 하위 유형이 아니라 InspectionOperation 또는
      Operation에 연결되는 plan/spec 엔티티로 모델링한다. 검사 공정 단계가 필요하면 InspectionOperation
      is_a Operation을 두고, InspectionOperation이 InspectionPlan을 참조하게 분리한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 라우팅과 검사 계획의 의미를 PLM/MES 통합에서 실행 가능한 개념 기준으로 구분하는 목적.
      failure_condition: 라우팅 operations 목록 또는 Operation 상속 속성을 기준으로 InspectionPlan을 실행
        공정 단계로 처리할 때, 검사 기준 문서가 작업 단계로 잘못 해석된다.
      impact: 검사 계획과 검사 공정의 경계가 흐려져 MES 라우팅, 작업장 배정, 표준시간 산정, 품질 기준 적용의 의미 계약이 불안정해진다.
      evidence_refs:
