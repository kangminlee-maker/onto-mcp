  - candidate_id: semantics-candidate-004
    target: BomLine.scrap_rate
    evidence_anchor: .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:29,
      .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:30,
