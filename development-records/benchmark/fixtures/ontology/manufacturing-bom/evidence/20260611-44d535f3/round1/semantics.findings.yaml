      .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:70,
      .onto/review/20260611-44d535f3/execution-preparation/materialized-input.md:96
    claim: Part.rev가 품목 리비전과 도면 리비전을 혼동한다.
    what: Part는 구매 또는 제조되는 최소 관리 단위 품목으로 정의되어 있는데 rev 속성은 '도면 리비전'이라고 설명된다. 반면 ECO
      규칙은 effective_date 이후 생산분이 신규 rev를 따른다고 하여 rev를 생산 적용 기준이 되는 품목/설계 리비전처럼
      사용한다.
    why: 도면 리비전은 문서 원본의 버전이고, 생산 적용 rev는 품목 또는 설계 변경의 유효 버전이다. 둘을 하나의 Part.rev로 합치면
      PLM의 설계 변경 적용 기준과 MES의 생산 주문 기준이 같은 속성에 묶여, 도면 관리대장 동기화 지연이 생산 rev 의미까지
      지연시키는 것처럼 해석된다.
    how_to_fix: Part에는 생산과 변경관리 기준이 되는 item_rev 또는 design_rev를 별도 정의하고, 도면 문서의
      revision은 drawing_rev 또는 drawing_ref.rev로 분리한다. ECO 규칙은 어떤 revision 개념을
      갱신하고 MES가 어느 revision authority를 따라야 하는지 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품목·BOM·라우팅·변경관리 개념을 PLM/MES 통합 기준으로 정합하게 정의하는 목적.
      failure_condition: ECO effective_date 이후 MES 생산분의 rev 판단이 Part.rev를 참조하는데, 해당
        속성이 도면 리비전이자 주간 배치 동기화 대상일 때 변경 유효성의 의미가 문서 동기화 상태와 혼동된다.
      impact: 변경 적용 시점과 생산 기준 revision의 의미가 불명확해져, 신규 설계 적용 대상 생산분을 구분하는 통합 계약의 신뢰가
        낮아진다.
      evidence_refs:
        - materialized-input.md:14
        - materialized-input.md:15
        - materialized-input.md:20
        - materialized-input.md:69
        - materialized-input.md:70
        - materialized-input.md:96
    causal_path:
      root_cause_candidate: Part.rev라는 단일 속성에 도면 문서 리비전과 생산 적용 설계/품목 리비전의 의미를 함께 부여했다.
      root_cause_step_id: semantics-candidate-002.cause-003
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: Part는 구매 또는 제조되는 최소 관리 단위 품목으로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:14
            - materialized-input.md:15
        - cause_id: semantics-candidate-002.cause-002
          claim: Part.rev는 도면 리비전이며 도면 관리대장이 원본이라고 정의된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:20
        - cause_id: semantics-candidate-002.cause-003
          claim: ECO 규칙은 effective_date 이후 생산분이 신규 rev를 따른다고 하여 rev를 생산 적용 기준으로 사용한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:96
      unresolved_beyond_evidence: null
