      from_cause_ref: finding-001.cause-003
      to_cause_ref: finding-002.cause-002
    rationale: finding-001은 ECO가 어떤 BOM·Routing 버전을 생성·종료하는지 연결되지 않는다고 하고,
      finding-002는 생산오더 엔티티가 없어 어떤 기준 BOM·Routing으로 오더가 생성되었는지 추적할 수 없다고 한다. 둘은
      변경 기준이 MES 실행 단위에 고정되는 개념 부재를 공유한다.
    confidence: medium
  - relation_id: rel-004
    from_finding_id: finding-003
    to_finding_id: finding-005
    relation: shared_cause_candidate
    root_hypothesis: 외부 원본에서 복사·수동 반영되는 운영 값을 감사 가능한 이벤트/출처/유효기간 개념으로 승격하지 않아 증거
      추적성과 변경 연속성이 함께 약해진다.
    shared_cause:
      cause_claim: 복사·수동·대사 행위를 값 속성으로만 남기고 source, actor, timestamp,
        version/effectivity를 갖는 감사 이벤트나 정책 개념으로 모델링하지 않았다.
      from_cause_ref: finding-003.cause-002
      to_cause_ref: finding-005.cause-002
    rationale: finding-003은 Part.rev 동기화, scrap_rate 복사, 표준원가 수기 입력/대사 행위의 감사 증거가
      없다고 보고, finding-005는 scrap_rate가 외부 엑셀 복사값으로 BomLine에 고정되어
      원본·적용범위·유효기간·버전을 표현하지 못한다고 본다. 특히 scrap_rate 복사값 문제에서 원인이 직접 겹친다.
