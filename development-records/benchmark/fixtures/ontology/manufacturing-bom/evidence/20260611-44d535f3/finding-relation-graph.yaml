  - relation_id: rel-005
    from_finding_id: finding-005
    to_finding_id: finding-012
    relation: duplicates
    root_hypothesis: BomLine.scrap_rate를 공정/계획 파라미터가 아니라 BOM 라인의 단일 복사 속성으로 둔 것이
      확장성과 의미 경계 문제를 동시에 만든다.
    shared_cause: null
    rationale: finding-005와 finding-012는 모두 BomLine.scrap_rate가 생산계획팀 엑셀 복사값이며 원천
      공정, 적용 범위, 기준 기간, authority 없이 BOM 라인 독립 속성으로 놓인 점을 문제 삼는다. 차이는 evolution은
      변경 연속성, semantics는 의미 경계와 원천 혼동을 강조한다는 정도다.
    confidence: high
  - relation_id: rel-006
