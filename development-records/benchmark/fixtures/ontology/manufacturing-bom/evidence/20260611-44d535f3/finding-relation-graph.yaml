      ECO 적용성이 단일 날짜와 Part.rev 동기화 규칙에 내장되어 날짜 외 적용 기준이나 BOM/Routing 동시 변경을 확장하기
      어렵다고 본다. 둘 다 변경 적용 결과를 별도 유효성/버전 객체로 해소하지 못한 같은 설계 결함을 가리킨다.
