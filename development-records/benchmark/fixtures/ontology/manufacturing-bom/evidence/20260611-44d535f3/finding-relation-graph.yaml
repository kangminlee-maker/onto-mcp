    root_hypothesis: 변경 적용성을 독립된 effectivity/version 개념으로 모델링하지 않고
      ECO.effective_date와 현재 rev 값에 묶어 둔 것이 BOM·Routing 이력 누락과 ECO 확장성 부족을 함께
      만든다.
