    root_hypothesis: Part.rev가 도면 리비전과 생산 적용 리비전을 겸하면 ECO 적용 판단이 Part.rev 동기화 상태에 의존하게 된다.
    shared_cause: null
    rationale: finding-010의 원인은 Part.rev 단일 속성이 도면 문서 리비전과 생산 적용 리비전을 함께 의미한다는 점이다.
      이 혼동은 finding-007에서 지적한 ECO.effective_date 이후 신규 rev 적용 판단과 주간 배치 동기화 지연
      문제가 발생할 수 있는 의미적 전제 조건이 된다.
    confidence: medium
  - relation_id: rel-003
    from_finding_id: finding-001
    to_finding_id: finding-002
    relation: shared_cause_candidate
    root_hypothesis: PLM 기준정보와 MES 실행 인스턴스 사이에 release/effectivity snapshot 개념이 없어서
      기준 버전 이력과 생산오더 고정 기준이 함께 비어 있다.
    shared_cause:
      cause_claim: 기준정보 마스터는 존재하지만 생산 실행 시점에 선택된 BOM·Routing·Part revision을 고정하는 실행
