        자동화 가능성을 약화한다.
      evidence_refs:
        - .onto/review/20260611-44d535f3/round1/logic.findings.yaml#logic-candidate-001
        - "Embedded Materialized Input: Assembly is_a Part and
          Assembly.bom_lines target BomLine"
        - "Embedded Materialized Input: BomLine.parent_ref target Assembly;
          BomLine.child_ref target Part"
        - "Embedded Materialized Input: integrity_rules[0]"
