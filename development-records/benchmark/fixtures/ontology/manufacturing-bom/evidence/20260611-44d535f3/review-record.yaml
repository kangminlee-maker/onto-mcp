        entities.AlternatePart / relations Source finding context:
        manufacturing-bom-ontology.yaml:32-40 defines AlternatePart with
        primary_ref, alternate_ref, and direction;
        manufacturing-bom-ontology.yaml:79-86 relation list contains Part ->
        Part alternate_of only, with a note that it is a shortcut through
        AlternatePart. Source finding context: AlternatePart is structurally
        disconnected from the relation graph that claims to represent it. Source
        finding context: For a PLM/MES integration concept baseline,
        substitute-part data must be traversable through the canonical structure
        that carries its properties. Here, the only relation involving
        alternates bypasses AlternatePart, so consumers following the relations
        list cannot reach primary_ref, alternate_ref, or direction through the
        declared entity. This weakens the structural completeness of the model
        for alternate-part integration even though the entity is present. Source
        finding context: Replace or complement the shortcut with explicit
        relations such as AlternatePart -> Part kind primary_part and
        AlternatePart -> Part kind alternate_part, and optionally keep Part ->
        Part alternate_of only as a derived/projection relation if needed.
        Source finding context:
        .onto/review/20260611-44d535f3/round1/structure.findings.yaml#structure\
        -candidate-001 Source finding context: Use this BOM/routing ontology as
        a PLM/MES integration concept baseline covering item, BOM, routing, and
        change-management concepts. Source finding context: When an integration
        consumer uses the declared relations graph as the structural contract,
        alternate-part records cannot be traversed as first-class records with
        their direction property. Source finding context: Alternate substitution
        is present in the ontology but not structurally connected through its
        own entity, making the concept baseline less actionable for systems that
        need to exchange or validate substitute-part records. Source finding
        context: The relations section models alternate substitution as a direct
        Part-to-Part shortcut while omitting relations from the AlternatePart
        entity to its referenced Part endpoints. Source finding context:
        AlternatePart is defined as an entity carrying primary_ref,
        alternate_ref, and direction. Source finding context: The relations list
        does not include AlternatePart as either from or to; it declares only
        Part -> Part alternate_of for alternates. Source finding context:
        Therefore the entity that carries alternate-part properties is
        disconnected from the explicit relation graph used as the ontology's
        structural contract."
