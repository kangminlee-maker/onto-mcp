      rationale: "deliberation은 내부 규칙 충돌과 recovery/rework 입력 누락이 결합된 문제로 확정했다. 같은 BOM을
        정상과 오류로 동시에 판정할 수 있어 검증·전개·생산오더 생성 기준의 correctness를 직접 깨므로 현재 대상에서 즉시
        닫아야 한다. Source finding context: manufacturing-bom-ontology.yaml
        integrity_rules[0] Source finding context: Embedded Materialized Input,
        integrity_rules[0]: \"BOM은 비순환이어야 한다. 단, 재생 원료 회수 공정(스크랩 재투입)은 Assembly가
        자기 하위에 자신을 포함하는 형태로 모델링한다.\" Source finding context: BOM 비순환 필수 규칙과 자기
        포함 모델링 허용 예외가 동일 규칙 안에서 충돌한다. Source finding context: `Assembly ->
        BomLine -> Part`와 `Assembly is_a Part` 구조에서는 Assembly가 자기 하위 Part로 자신을
        포함하면 BOM 경로상 자기 순환이 됩니다. 따라서 'BOM은 비순환이어야 한다'는 necessary 제약과 'Assembly가
        자기 하위에 자신을 포함하는 형태로 모델링한다'는 possible/required modeling 예외가 같은 대상 그래프에서
