        이후 생산분은 신규 rev를 따른다... 주간 배치로 동기화"
      - manufacturing-bom-ontology.yaml >
        entities.Part.attributes.rev/current_eco and integrity_rules ECO
        effective-date rule
    severity: medium
    domain_threshold_used: null
    singleton_reason: "Runtime completion: finding is not connected to another issue
