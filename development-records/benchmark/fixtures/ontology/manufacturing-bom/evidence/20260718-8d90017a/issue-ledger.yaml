  - issue_id: issue-004
    root_cause_hypothesis: Unit semantics are modeled as a closed Part.uom enum
      while item-specific conversion authority is absent from the ontology.
    root_confidence: medium
    surface_finding_ids:
      - finding-004
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: New units and deterministic cross-unit BOM/MES flows require
      schema change or external manual interpretation.
    proposed_action: Replace the closed UOM enum with a UnitOfMeasure
      reference/entity and add item-specific conversion-factor concepts with
      authority, effective dating, and validity constraints.
    affected_purpose: PLM/MES integration concept baseline for item, BOM, routing,
      and manufacturing operations.
    failure_condition: When a new unit or cross-unit BOM/MES flow requiring
      deterministic conversion is introduced.
    impact: Quantity semantics remain partly outside the ontology, making
      integrations brittle as item classes and operational units expand.
    evidence_refs:
