  - issue_id: issue-006
    root_cause_hypothesis: ECO applicability is modeled with affected parts plus a
      single effective date rather than a versioned effectivity scope.
    root_confidence: medium
    surface_finding_ids:
      - finding-006
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: The ECO model cannot represent phased, lot/serial, plant,
      BOM-line, routing, or scoped cutover effectivity without external
      exception logic or model changes.
    proposed_action: Introduce an Effectivity concept referenced by ECO that scopes
      applicability by relevant date/time, lot, serial, site, BOM, routing,
      operation, and revision-transition dimensions.
    affected_purpose: Change-management concept baseline for PLM/MES production applicability.
    failure_condition: When a change must apply by plant, lot, serial range,
      routing, BOM line, or phased cutover rather than a single date for all
      affected parts.
    impact: Existing change records would need reinterpretation or migration,
      undermining traceability between engineering change and MES production
      execution.
    evidence_refs:
