  - issue_id: issue-003
    root_cause_hypothesis: Operational measurement semantics for UOM conversion and
      work-center capacity are left to local practice instead of being
      standardized as ontology concepts.
    root_confidence: medium
    surface_finding_ids:
      - finding-003
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: The ontology accepts a hidden tradeoff where quantity and
      capacity interpretation depend on shop-floor or work-center practice.
    proposed_action: Introduce explicit UOM conversion and capacity unit/basis
      concepts so operational calculations have stable shared semantics.
    affected_purpose: PLM/MES integration concept baseline for common calculation
      rules across item, BOM, routing, and manufacturing operations.
    failure_condition: When different UOM items or differently based work-center
      capacities are used together in MES planning, BOM requirements, or routing
      capacity calculations.
    impact: The same quantity or capacity value can be interpreted differently by
      site or consumer, weakening the ontology as a stable operating baseline.
    evidence_refs:
      - .onto/review/20260718-8d90017a/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:19
