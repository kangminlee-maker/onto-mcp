  - issue_id: issue-007
    root_cause_hypothesis: Process recirculation is represented inside BOM
      containment rather than as a separate process/material-flow concept.
    root_confidence: medium
    surface_finding_ids:
      - finding-007
    relation_refs: []
    raised_by_lens_ids:
      - evolution
    issue_statement: The acyclic BOM rule is immediately overridden by modeling
      scrap reinsertion as self-containment, making future circular
      recovery/rework cases extension-hostile.
    proposed_action: Keep product BOM acyclic and introduce a separate
      material-recovery, rework, or process-output relationship for scrap
      reinsertion. Add explicit allowed cycle semantics there instead of
      weakening the BOM containment rule.
    affected_purpose: BOM and routing concept baseline for manufacturing operations
      and future process extensions.
    failure_condition: When more recovery, rework, by-product, or recirculation
      scenarios are introduced, the model either violates its own acyclicity
      invariant or requires ad hoc exceptions for each scenario.
    impact: This reduces extensibility because a core structural rule becomes
      exception-driven, making downstream BOM traversal, planning, and
      integration semantics unstable.
    evidence_refs:
      - .onto/review/20260718-8d90017a/round1/evolution.findings.yaml#evolution-candidate-004
      - manufacturing-bom-ontology.yaml:88-89
    severity: medium
    domain_threshold_used: null
