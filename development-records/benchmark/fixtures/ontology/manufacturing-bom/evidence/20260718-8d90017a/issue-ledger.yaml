  - issue_id: issue-010
    root_cause_hypothesis: The model assigns an externally maintained, rate-like
      process/yield value to the BOM-line concept without separating authority
      from visibility.
    root_confidence: medium
    surface_finding_ids:
      - finding-010
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: "`scrap_rate` is named as a derived rate but modeled as an
      independently copied input from a planning spreadsheet."
    proposed_action: Model scrap/yield as a separately governed process or planning
      parameter with its source authority and effective scope, or define
      `scrap_rate` as a derived projection from authoritative defect/yield
      inputs. If it remains visible on `BomLine`, mark it explicitly as
      non-authoritative cached data with synchronization semantics.
    affected_purpose: PLM/MES integration concept baseline for BOM and process concepts.
    failure_condition: When MES, planning, or costing consumes BOM lines as
      authoritative product structure, the copied `scrap_rate` can diverge from
      the planning source or be applied as if it were intrinsic BOM semantics.
    impact: This weakens trust in the ontology as an integration reference because a
      key manufacturing quantity can drift between systems and the model does
      not identify the authoritative semantic owner.
    evidence_refs:
      - .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics-candidate-001
      - "manufacturing-bom-ontology.yaml > BomLine.definition: BOM line
        describes parent-child quantity usage"
      - "manufacturing-bom-ontology.yaml > BomLine.attributes.scrap_rate.note:
        separately managed in production planning Excel and copied"
      - "manufacturing-bom-ontology.yaml > notes: standard cost also has manual
        reconciliation fields"
      - manufacturing-bom-ontology.yaml > entities.BomLine.attributes.scrap_rate
    severity: medium
    domain_threshold_used: null
    singleton_reason: "Runtime completion: finding is not connected to another issue
      by same_root_candidate relation refs."
  - issue_id: issue-011
    root_cause_hypothesis: The work-center capacity concept omits unit/basis from
      the modeled value while allowing multiple measurement dimensions.
    root_confidence: medium
    surface_finding_ids:
      - finding-011
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: "`capacity_per_shift` has a numeric name but no stable semantic
      unit, mixing count capacity and time capacity under one attribute."
    proposed_action: Split the measure into explicit concepts such as
      `capacity_quantity_per_shift` and `available_time_per_shift`, or add a
      required `capacity_unit`/`capacity_basis` enum and conversion rule so
      every value has a stable interpretation.
    affected_purpose: PLM/MES integration concept baseline for routing and
      manufacturing operations.
    failure_condition: When routing or scheduling logic consumes work-center
      capacity values across multiple work centers, identical numeric fields may
      represent incompatible dimensions.
    impact: The ontology cannot reliably support MES capacity planning semantics
      because a core capacity attribute lacks a consistent unit of measure.
    evidence_refs:
      - .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics-candidate-002
