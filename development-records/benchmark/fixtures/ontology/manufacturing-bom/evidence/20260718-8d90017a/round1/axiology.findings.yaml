findings:
  - candidate_id: axiology-candidate-001
    target: manufacturing-bom-ontology.yaml / BomLine.scrap_rate
    evidence_anchor: .onto/review/20260718-8d90017a/execution-preparation/materialized-input.md:29-35;
      .onto/review/20260718-8d90017a/execution-preparation/review-value-alignment-criteria.yaml:criteria[0].statement
    claim: 생산계획팀 엑셀 값을 복사해 둔 scrap_rate는 PLM/MES 통합 기준 문서라는 목적과 어긋난다.
    what: BomLine.scrap_rate가 BOM 소요량 계산에 직접 들어갈 수 있는 제조 운영 값인데, 온톨로지는 이를 통합 권한 원천으로
      모델링하지 않고 별도 엑셀에서 복사한 값으로 둔다.
    why: 리뷰 목적은 이 문서가 PLM/MES 통합의 개념 기준으로 적절한지, 특히 제조 운영 위험을 검토하는 것이다. 그런데
      scrap_rate는 공정 불량을 반영하는 핵심 운영 값임에도 별도 엑셀 복사본으로 정의되어 있어 MES/PLM 간 동일 개념 기준과
      최신성 신뢰를 약화한다.
    how_to_fix: scrap_rate의 authoritative source, 적용 범위, 유효일자, 갱신 책임을 온톨로지에 명시하고, 단순
      복사 필드라면 derived/cache 속성으로 낮추어 원본 계획 데이터와 동기화 계약을 분리한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM과 제조 운영 값의 신뢰 가능한 의미와 권한 경계를 제공하는 목적.
      failure_condition: BOM 소요량 또는 생산계획이 scrap_rate를 참조할 때 엑셀 원본과 온톨로지/MES 복사본이 어긋나는 경우.
      impact: BOM 기준 수량과 제조 운영 계획이 서로 다른 값을 기준으로 계산될 수 있어 통합 기준 문서로서의 실행 신뢰가 약화된다.
      evidence_refs:
        - materialized-input.md:29-35
        - review-value-alignment-criteria.yaml:criteria[0].statement
    causal_path:
      root_cause_candidate: 운영 핵심 값의 원본 권한과 동기화 계약을 온톨로지 개념으로 승격하지 않고 복사본 속성으로 수용한 설계 결정.
      root_cause_step_id: axiology-candidate-001.cause-003
      steps:
        - cause_id: axiology-candidate-001.cause-001
          claim: BomLine.scrap_rate는 공정 불량 감안 계수로 정의되어 BOM 사용량 판단에 영향을 준다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:29-35
        - cause_id: axiology-candidate-001.cause-002
          claim: 해당 값은 생산계획팀 엑셀에서 별도 관리되는 값을 복사해 둔다고 되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:35
        - cause_id: axiology-candidate-001.cause-003
          claim: 복사본 중심 모델은 PLM/MES 통합 기준 문서라는 리뷰 목적의 권한 일관성과 제조 운영 위험 통제를 약화한다.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:criteria[0].statement
            - materialized-input.md:6-7
      unresolved_beyond_evidence: null
  - candidate_id: axiology-candidate-002
    target: manufacturing-bom-ontology.yaml / ECO effective-date rule and Part.rev
    evidence_anchor: .onto/review/20260718-8d90017a/execution-preparation/materialized-input.md:14-21,69-76,93-96;
      .onto/review/20260718-8d90017a/execution-preparation/review-value-alignment-criteria.yaml:criteria[0].statement
    claim: ECO 적용일 이후 생산은 신규 rev를 따른다고 하면서 Part.rev는 주간 배치로 늦게 동기화해 변경관리 기준의 목적을 훼손한다.
    what: ECO.effective_date 이후 생산분은 신규 rev를 따른다는 운영 규칙과 Part.rev가 도면 관리대장 반영 후 주간
      배치로 동기화된다는 규칙이 함께 존재한다. 이 기간에는 생산 판단과 Part.rev 속성이 다른 변경 상태를 가리킬 수 있다.
    why: 변경관리 개념 정합성이 리뷰 목적의 중심인데, 생산 적용 기준과 품목 리비전 표시 기준이 시간적으로 분리되어 있다. 이 설계는 현장
      생산, MES 오더 생성, PLM 품목 기준이 같은 변경 상태를 공유한다는 통합 목적을 약화한다.
    how_to_fix: ECO 적용 상태와 Part.rev 표시 상태를 분리해 각각의 권한과 유효시점을 명시하거나, 생산 오더 생성 기준이
      Part.rev가 아니라 approved/applied ECO의 effective revision을 참조하도록 개념 계약을 명확히
      한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품목, BOM, 라우팅, 변경관리 개념의 정합성을 갖춘 PLM/MES 통합 기준 제공.
      failure_condition: ECO.effective_date는 지났지만 Part.rev 주간 배치 동기화가 아직 완료되지 않은 기간에
        생산 오더나 현장 기준 정보가 Part.rev를 참조하는 경우.
      impact: 동일 품목이 생산 기준으로는 신규 리비전, 품목 속성으로는 구 리비전처럼 보일 수 있어 변경 적용 추적과 생산 통제가 흔들린다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:69-76
        - materialized-input.md:96
        - review-value-alignment-criteria.yaml:criteria[0].statement
    causal_path:
      root_cause_candidate: 변경 적용의 권한 상태와 표시/동기화 상태를 같은 품목 리비전 개념 안에서 충분히 분리하지 않은 설계.
      root_cause_step_id: axiology-candidate-002.cause-004
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: Part.rev는 도면 리비전이며 도면 관리대장이 원본이라고 정의되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20
        - cause_id: axiology-candidate-002.cause-002
          claim: ECO는 affected_parts, effective_date, status를 가진 변경 지시로 모델링되어 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:69-76
        - cause_id: axiology-candidate-002.cause-003
          claim: 무결성 규칙은 effective_date 이후 생산분이 신규 rev를 따르지만 Part.rev 갱신은 주간 배치로 동기화된다고
            한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:96
        - cause_id: axiology-candidate-002.cause-004
          claim: 따라서 변경 적용 기준과 품목 리비전 속성의 최신성이 분리되어 PLM/MES 통합 기준 목적에 대한 신뢰를 낮춘다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:6-7
            - review-value-alignment-criteria.yaml:criteria[0].statement
      unresolved_beyond_evidence: null
  - candidate_id: axiology-candidate-003
    target: manufacturing-bom-ontology.yaml / UOM conversion and WorkCenter capacity
      units
    evidence_anchor: .onto/review/20260718-8d90017a/execution-preparation/materialized-input.md:19,63-67,98-100;
      .onto/review/20260718-8d90017a/execution-preparation/review-value-alignment-criteria.yaml:criteria[0].statement
    claim: 단위 환산과 작업장 용량 단위를 현장별 관행에 맡긴 것은 제조 운영 통합 기준이라는 목적에 맞지 않는 숨은 트레이드오프다.
    what: Part.uom은 ea/kg/m로 열거되어 있지만 품목별 환산계수 마스터가 없고 현장에서 필요 시 환산한다고 되어 있다.
      WorkCenter.capacity_per_shift도 작업장마다 단위가 개수 또는 시간으로 다르다고만 되어 있어 용량 의미가
      표준화되지 않는다.
    why: PLM/MES 통합 기준 문서는 수량, 소요량, 용량 계산의 공통 의미를 제공해야 한다. 현장 환산과 작업장별 암묵 단위를 허용하면
      통합 속도나 작성 편의는 얻지만, 생산 오더·BOM 소요량·능력 계획의 해석 일관성을 희생하는 트레이드오프가 명시적 정당화 없이
      수용된다.
    how_to_fix: 품목별 UOM 변환계수 마스터와 WorkCenter capacity 단위 속성을 명시하고, 수량/시간 기반 용량을 구분하는
      표준 속성 또는 타입을 도입한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 품목, BOM, 라우팅, 제조 운영 값의 공통 계산 기준을 제공하는 목적.
      failure_condition: 서로 다른 UOM 품목이나 서로 다른 단위의 작업장 capacity를 MES 계획, BOM 소요량, 라우팅
        능력 계산에서 함께 사용할 때.
      impact: 같은 수량 또는 용량 값이 현장별로 다르게 해석될 수 있어 통합 기준 문서가 운영 계산의 안정적 기준이 되지 못한다.
      evidence_refs:
        - materialized-input.md:19
        - materialized-input.md:63-67
        - materialized-input.md:100
        - review-value-alignment-criteria.yaml:criteria[0].statement
    causal_path:
      root_cause_candidate: 운영 계산에 필요한 단위 의미를 표준 개념으로 닫지 않고 현장 관행에 위임한 모델링 선택.
      root_cause_step_id: axiology-candidate-003.cause-003
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: Part.uom은 제한된 enum으로 있으나 환산계수 마스터는 없고 필요 시 현장에서 환산한다고 되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:19
            - materialized-input.md:100
        - cause_id: axiology-candidate-003.cause-002
          claim: WorkCenter.capacity_per_shift는 작업장마다 개수 또는 시간으로 단위가 다르다고 되어 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:63-67
        - cause_id: axiology-candidate-003.cause-003
          claim: 수량과 용량의 단위 의미가 온톨로지 안에서 표준화되지 않아 PLM/MES 통합 기준 목적과 제조 운영 위험 검토 기준을 약화한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:6-7
            - review-value-alignment-criteria.yaml:criteria[0].statement
      unresolved_beyond_evidence: null
