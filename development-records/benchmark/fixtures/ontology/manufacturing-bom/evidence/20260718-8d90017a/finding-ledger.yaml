  - finding_id: finding-014
    lens_id: semantics
    source_ref: .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics-candidate-005
    target: InspectionPlan
    evidence_anchor: manufacturing-bom-ontology.yaml >
      entities.InspectionPlan.definition and is_a Operation
    claim: "`InspectionPlan` is typed as an `Operation` even though its name and
      attributes describe a plan/specification rather than an executable routing
      step."
    lens_rationale_summary: "An inspection operation is an executable routing step,
      while an inspection plan is an institutional specification that can
      parameterize or govern that step. Treating the plan itself as an Operation
      creates an ontological type mismatch: plan/specification instances inherit
      operation identity and routing-step semantics even when they represent
      rules and criteria."
    proposed_action: Model `InspectionOperation` as an `Operation` subtype if
      needed, and model `InspectionPlan` as a separate specification referenced
      by the inspection operation. Keep `sampling_rule` and
      `acceptance_criteria` on the plan/specification or as parameters applied
      to the operation.
    affected_purpose: PLM/MES integration concept baseline for routing, operation,
      and quality inspection concepts.
    failure_condition: When routing consumers treat every `Operation` subtype as an
      executable ordered step, `InspectionPlan` instances may be scheduled or
      sequenced as operations instead of referenced as quality specifications.
    impact: This weakens semantic correctness for MES routing execution because a
      plan/specification is classified as a process step.
