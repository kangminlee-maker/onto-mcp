  - finding_id: finding-004
    lens_id: evolution
    source_ref: .onto/review/20260718-8d90017a/round1/evolution.findings.yaml#evolution-candidate-001
    target: Part.uom and unit conversion extensibility
    evidence_anchor: manufacturing-bom-ontology.yaml:14,95
    claim: Hard-coded item UOM values plus no conversion master make new units and
      cross-unit BOM/MES integration non-extensible.
    lens_rationale_summary: For a PLM/MES concept baseline, unit identity and
      conversion are shared integration concepts. With the allowed unit set
      embedded as an enum and conversion rules explicitly outside the model,
      adding normal manufacturing units or integrating systems that require
      deterministic cross-unit quantities requires changing the ontology and/or
      preserving manual interpretation outside the concept model.
    proposed_action: Replace the closed uom enum with a UnitOfMeasure
      reference/entity and add an item-specific conversion-factor concept with
      source authority, effective dating, and validity constraints for
      cross-unit BOM quantities.
    affected_purpose: PLM/MES integration concept baseline for item, BOM, routing,
      and manufacturing operations.
    failure_condition: When a new unit or a BOM/MES flow requiring deterministic
      unit conversion is introduced, the current concept model cannot represent
      it without schema/enum change or manual external conversion.
    impact: This weakens change tolerance because quantity semantics become partly
      outside the ontology, making integrations brittle as item classes and
      operational units expand.
    evidence_refs:
      - .onto/review/20260718-8d90017a/round1/evolution.findings.yaml#evolution-candidate-001
      - manufacturing-bom-ontology.yaml:14
      - manufacturing-bom-ontology.yaml:95
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES integration concept baseline for item, BOM, routing,
        and manufacturing operations.
      failure_condition: When a new unit or a BOM/MES flow requiring deterministic
        unit conversion is introduced, the current concept model cannot
        represent it without schema/enum change or manual external conversion.
      impact: This weakens change tolerance because quantity semantics become partly
        outside the ontology, making integrations brittle as item classes and
        operational units expand.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:14
        - manufacturing-bom-ontology.yaml:95
    causal_path:
      root_cause_candidate: Unit semantics are modeled as a closed enum and conversion
        authority is absent from the ontology.
      root_cause_step_id: finding-004.cause-003
      steps:
        - cause_id: finding-004.cause-001
          claim: Part.uom is restricted to the enum values ea, kg, and m.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:14
        - cause_id: finding-004.cause-002
          claim: The notes state that item-specific kg↔ea conversion factors do not exist
            and are converted at the shop floor when needed.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml:95
        - cause_id: finding-004.cause-003
          claim: Together, new units or cross-unit integrations require ontology
            modification or uncontrolled external interpretation.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:14
            - manufacturing-bom-ontology.yaml:95
      unresolved_beyond_evidence: The bounded target does not show downstream PLM/MES
        consumers, so the finding is limited to the ontology's declared
        concept-baseline role.
  - finding_id: finding-005
    lens_id: evolution
    source_ref: .onto/review/20260718-8d90017a/round1/evolution.findings.yaml#evolution-candidate-002
    target: WorkCenter.capacity_per_shift
    evidence_anchor: manufacturing-bom-ontology.yaml:58-62
    claim: Work-center capacity has no unit/dimension model, so adding heterogeneous
      work centers forces implicit reinterpretation of the same numeric field.
    lens_rationale_summary: Capacity is a scheduling and MES integration concept. If
      one field can mean pieces, hours, machine minutes, or another local
      measure depending on the work center, future work-center types cannot be
      added without out-of-band rules or schema change to disambiguate capacity
      semantics.
    proposed_action: Model capacity as a measured quantity with explicit unit,
      capacity basis/type, calendar or shift context, and optional
      conversion/normalization rules. Keep WorkCenter.capacity as a reference to
      that structured capacity concept rather than a bare number.
    affected_purpose: MES routing and production-order readiness concept baseline
      for work centers and operations.
    failure_condition: When heterogeneous work centers are integrated or a new
      capacity basis is introduced, consumers cannot know how to interpret
      capacity_per_shift from the ontology alone.
    impact: This reduces extensibility and integration safety because scheduling
      behavior depends on hidden local conventions instead of stable model
      semantics.
    evidence_refs:
      - .onto/review/20260718-8d90017a/round1/evolution.findings.yaml#evolution-candidate-002
      - manufacturing-bom-ontology.yaml:58
      - manufacturing-bom-ontology.yaml:62
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: MES routing and production-order readiness concept baseline
        for work centers and operations.
      failure_condition: When heterogeneous work centers are integrated or a new
        capacity basis is introduced, consumers cannot know how to interpret
        capacity_per_shift from the ontology alone.
      impact: This reduces extensibility and integration safety because scheduling
        behavior depends on hidden local conventions instead of stable model
        semantics.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:58
        - manufacturing-bom-ontology.yaml:62
    causal_path:
      root_cause_candidate: Work-center capacity is represented as an untyped number
        while its unit is declared variable by work center.
      root_cause_step_id: finding-005.cause-003
      steps:
        - cause_id: finding-005.cause-001
          claim: WorkCenter defines capacity_per_shift as type number.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:60-62
        - cause_id: finding-005.cause-002
          claim: The capacity note states that the unit differs by work center, including
            count or time.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml:62
        - cause_id: finding-005.cause-003
          claim: A bare number with variable units cannot safely absorb new capacity
            categories without external rules or model changes.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:62
      unresolved_beyond_evidence: The file does not include actual scheduler behavior;
        the risk is assessed from the declared ontology contract.
  - finding_id: finding-006
    lens_id: evolution
    source_ref: .onto/review/20260718-8d90017a/round1/evolution.findings.yaml#evolution-candidate-003
    target: ECO effectivity model
    evidence_anchor: manufacturing-bom-ontology.yaml:64-70,91
    claim: ECO effectivity is only date-based, so phased, lot/serial, plant, BOM, or
      routing-specific changes cannot be added while preserving change
      continuity.
    lens_rationale_summary: PLM/MES integration often needs change applicability to
      survive phased rollout and operational cutover conditions. This ontology
      has no explicit effectivity scope beyond date and affected parts, and no
      object-level link to BOM lines or routings, so future effectivity
      dimensions require changing the ECO concept or encoding exceptions
      elsewhere.
