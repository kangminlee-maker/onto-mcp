  - finding_id: finding-011
    lens_id: semantics
    source_ref: .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics-candidate-002
    target: WorkCenter.capacity_per_shift
    evidence_anchor: manufacturing-bom-ontology.yaml >
      entities.WorkCenter.attributes.capacity_per_shift
    claim: "`capacity_per_shift` has a numeric name but no stable semantic unit,
      mixing count capacity and time capacity under one attribute."
    lens_rationale_summary: "Capacity per shift is only meaningful with a unit and
      basis. A single numeric field whose meaning alternates between pieces and
      time is a semantic homonym: the same attribute name denotes different
      measures depending on the work center. For PLM/MES integration this can
      cause scheduling, routing, and capacity planning consumers to compare or
      aggregate incompatible values."
