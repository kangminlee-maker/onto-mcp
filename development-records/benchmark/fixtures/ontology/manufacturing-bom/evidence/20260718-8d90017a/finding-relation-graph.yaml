    to_finding_id: finding-010
    relation: duplicates
    root_hypothesis: BomLine.scrap_rate is a copied, externally maintained
      process/yield value without explicit source authority, synchronization
      semantics, or separation from BOM product-structure meaning.
    shared_cause: null
    rationale: "Both findings target BomLine.scrap_rate and identify the same
      failure mode: a production-planning Excel value is copied into the
      ontology/BOM line where PLM/MES consumers may treat it as authoritative,
      weakening trust and authority boundaries."
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-002
    to_finding_id: finding-013
    relation: duplicates
    root_hypothesis: Part revision/current-change fields are named or positioned as
      current item state while the authoritative production revision is governed
      by ECO effectivity and delayed asynchronous synchronization.
    shared_cause: null
    rationale: "Both findings describe the same ECO/Part.rev inconsistency: after
      ECO.effective_date and before weekly Part.rev synchronization, consumers
      may disagree on whether Part.rev or ECO effectivity determines the current
      production revision."
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-002
    to_finding_id: finding-006
    relation: shared_cause_candidate
    root_hypothesis: The change-management model lacks a separate authoritative
      effectivity concept that distinguishes applicability state from
      synchronized display or item attributes.
    shared_cause:
      cause_claim: ECO applicability is modeled through affected parts and an
        effective date, while production revision and Part.rev synchronization
        are not represented as separate effectivity/synchronization concepts.
      from_cause_ref: finding-002.cause-003
      to_cause_ref: finding-006.cause-002
    rationale: finding-002 focuses on the current lag between ECO effectivity and
      Part.rev synchronization; finding-006 generalizes the same modeling gap to
      future phased or scoped effectivity cases. Both depend on the absence of a
      first-class effectivity/synchronization authority.
    confidence: medium
  - relation_id: rel-004
    from_finding_id: finding-003
    to_finding_id: finding-004
    relation: shared_cause_candidate
    root_hypothesis: Unit-of-measure semantics are not modeled as authoritative,
