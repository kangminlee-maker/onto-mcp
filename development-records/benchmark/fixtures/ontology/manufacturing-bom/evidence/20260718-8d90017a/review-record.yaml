    - issue_id: issue-010
      severity: medium
      material: true
      affected_purpose: PLM/MES integration concept baseline for BOM and process concepts.
      failure_condition: When MES, planning, or costing consumes BOM lines as
        authoritative product structure, the copied `scrap_rate` can diverge
        from the planning source or be applied as if it were intrinsic BOM
        semantics.
      impact: This weakens trust in the ontology as an integration reference because a
        key manufacturing quantity can drift between systems and the model does
        not identify the authoritative semantic owner.
      evidence_refs:
        - .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics-candidate-001
        - "manufacturing-bom-ontology.yaml > BomLine.definition: BOM line
          describes parent-child quantity usage"
        - "manufacturing-bom-ontology.yaml > BomLine.attributes.scrap_rate.note:
          separately managed in production planning Excel and copied"
        - "manufacturing-bom-ontology.yaml > notes: standard cost also has
          manual reconciliation fields"
        - manufacturing-bom-ontology.yaml >
          entities.BomLine.attributes.scrap_rate
      source_lens_ids:
        - semantics
      action_candidates: &a11
        - fix_before_release
        - follow_up
      rationale: "issue-001과 같은 scrap_rate 권한 문제의 의미론적 표현으로, BomLine에 노출된 외부 관리값이
        권위값처럼 소비될 위험을 만든다. Source finding context: BomLine.scrap_rate Source
        finding context: manufacturing-bom-ontology.yaml >
        entities.BomLine.attributes.scrap_rate Source finding context:
        `scrap_rate` is named as a derived rate but modeled as an independently
        copied input from a planning spreadsheet. Source finding context: A rate
        such as scrap rate is semantically a derived or authority-controlled
        manufacturing parameter, not an intrinsic property of the parent-child
        BOM relationship. Placing a copied rate directly on `BomLine` mixes
        product structure semantics with process/yield semantics and creates a
        source-drift risk: PLM/MES consumers may treat the BOM line value as
        authoritative even though the note says the planning spreadsheet is
        maintained separately. Source finding context: Model scrap/yield as a
        separately governed process or planning parameter with its source
        authority and effective scope, or define `scrap_rate` as a derived
        projection from authoritative defect/yield inputs. If it remains visible
        on `BomLine`, mark it explicitly as non-authoritative cached data with
        synchronization semantics. Source finding context:
        .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics\
        -candidate-001 Source finding context: PLM/MES integration concept
        baseline for BOM and process concepts. Source finding context: When MES,
        planning, or costing consumes BOM lines as authoritative product
        structure, the copied `scrap_rate` can diverge from the planning source
        or be applied as if it were intrinsic BOM semantics. Source finding
        context: This weakens trust in the ontology as an integration reference
        because a key manufacturing quantity can drift between systems and the
        model does not identify the authoritative semantic owner. Source finding
        context: The model assigns an externally maintained, rate-like
        process/yield value to the BOM-line concept without separating authority
        from visibility. Source finding context: `BomLine` is defined as the
        relation stating how much child item a parent item uses. Source finding
        context: `scrap_rate` is included as a direct numeric attribute on that
        BOM-line relation while its note identifies a different external source
        maintained by production planning. Source finding context: The ontology
        therefore gives one concept both product-structure meaning and copied
        process/yield meaning, enabling divergent authoritative interpretations
        across PLM/MES integration."
      problem_definition: scrap_rate가 파생 rate처럼 명명되었지만 외부 계획 스프레드시트에서 독립 복사된 입력으로
