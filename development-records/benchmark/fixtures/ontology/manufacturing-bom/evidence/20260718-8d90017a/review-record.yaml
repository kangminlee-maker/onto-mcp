    - issue_id: issue-010
      candidates: *a11
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "issue-001과 같은 scrap_rate 권한 문제의 의미론적 표현으로, BomLine에 노출된 외부 관리값이
        권위값처럼 소비될 위험을 만든다. Source finding context: BomLine.scrap_rate Source
        finding context: manufacturing-bom-ontology.yaml >
        entities.BomLine.attributes.scrap_rate Source finding context:
        `scrap_rate` is named as a derived rate but modeled as an independently
        copied input from a planning spreadsheet. Source finding context: A rate
        such as scrap rate is semantically a derived or authority-controlled
        manufacturing parameter, not an intrinsic property of the parent-child
        BOM relationship. Placing a copied rate directly on `BomLine` mixes
        product structure semantics with process/yield semantics and creates a
        source-drift risk: PLM/MES consumers may treat the BOM line value as
        authoritative even though the note says the planning spreadsheet is
        maintained separately. Source finding context: Model scrap/yield as a
        separately governed process or planning parameter with its source
        authority and effective scope, or define `scrap_rate` as a derived
        projection from authoritative defect/yield inputs. If it remains visible
        on `BomLine`, mark it explicitly as non-authoritative cached data with
        synchronization semantics. Source finding context:
        .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics\
        -candidate-001 Source finding context: PLM/MES integration concept
        baseline for BOM and process concepts. Source finding context: When MES,
        planning, or costing consumes BOM lines as authoritative product
        structure, the copied `scrap_rate` can diverge from the planning source
        or be applied as if it were intrinsic BOM semantics. Source finding
        context: This weakens trust in the ontology as an integration reference
        because a key manufacturing quantity can drift between systems and the
        model does not identify the authoritative semantic owner. Source finding
        context: The model assigns an externally maintained, rate-like
        process/yield value to the BOM-line concept without separating authority
        from visibility. Source finding context: `BomLine` is defined as the
        relation stating how much child item a parent item uses. Source finding
        context: `scrap_rate` is included as a direct numeric attribute on that
        BOM-line relation while its note identifies a different external source
        maintained by production planning. Source finding context: The ontology
        therefore gives one concept both product-structure meaning and copied
        process/yield meaning, enabling divergent authoritative interpretations
        across PLM/MES integration."
    - issue_id: issue-011
      candidates: *a12
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "issue-005와 같은 capacity 측정 의미 문제의 의미론적 표현이며, 라우팅과 스케줄링 소비자가 같은 숫자 필드를
        서로 다른 차원으로 해석할 수 있다. Source finding context:
        WorkCenter.capacity_per_shift Source finding context:
        manufacturing-bom-ontology.yaml >
        entities.WorkCenter.attributes.capacity_per_shift Source finding
        context: `capacity_per_shift` has a numeric name but no stable semantic
        unit, mixing count capacity and time capacity under one attribute.
        Source finding context: Capacity per shift is only meaningful with a
        unit and basis. A single numeric field whose meaning alternates between
        pieces and time is a semantic homonym: the same attribute name denotes
        different measures depending on the work center. For PLM/MES integration
        this can cause scheduling, routing, and capacity planning consumers to
        compare or aggregate incompatible values. Source finding context: Split
        the measure into explicit concepts such as `capacity_quantity_per_shift`
        and `available_time_per_shift`, or add a required
        `capacity_unit`/`capacity_basis` enum and conversion rule so every value
        has a stable interpretation. Source finding context:
        .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics\
        -candidate-002 Source finding context: PLM/MES integration concept
        baseline for routing and manufacturing operations. Source finding
        context: When routing or scheduling logic consumes work-center capacity
        values across multiple work centers, identical numeric fields may
        represent incompatible dimensions. Source finding context: The ontology
        cannot reliably support MES capacity planning semantics because a core
        capacity attribute lacks a consistent unit of measure. Source finding
        context: The work-center capacity concept omits unit/basis from the
        modeled value while allowing multiple measurement dimensions. Source
        finding context: Operations are performed at work centers, making
        work-center attributes relevant to routing execution semantics. Source
        finding context: `capacity_per_shift` is modeled as a bare number with a
        note that the unit varies by work center between count and time. Source
        finding context: The same attribute therefore carries different measure
        meanings under one name, which can produce incompatible capacity
        interpretation in MES integration."
    - issue_id: issue-012
      candidates: *a13
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "숙의 결과 issue-012는 issue-015의 relation traversal 문제와 분리된 개념 정의·속성 의미
        충돌로 확정되었고, production substitution 기준에 직접 영향을 준다. Source finding
        context: AlternatePart Source finding context:
        manufacturing-bom-ontology.yaml > entities.AlternatePart.definition and
        attributes.direction Source finding context: `AlternatePart` defines
        alternates as symmetric while also modeling one-way direction, so the
        concept name/definition conflicts with its attribute semantics. Source
        finding context: Alternate/substitute relationships in manufacturing
        often differ between allowed replacement directions. This ontology
        states symmetric meaning in the definition but encodes asymmetric
        meaning in attributes, so consumers cannot know whether `primary_ref`
        and `alternate_ref` represent a symmetric equivalence relation or an
        approved one-way substitution rule. Source finding context: Revise the
        definition to describe an approved substitution relationship with
        explicit direction, or remove `one_way` and make the relation truly
        symmetric. Rename fields if needed, for example `source_part_ref` and
        `substitute_part_ref` for directed substitution. Source finding context:
        .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics\
        -candidate-003 Source finding context: PLM/MES integration concept
        baseline for BOM substitution and change-controlled manufacturing
        execution. Source finding context: When a substitution is one-way, a
        consumer following the entity definition may permit the reverse
        substitution even though the modeled direction defaults to one-way.
        Source finding context: This can cause incorrect part substitution
        decisions in BOM consumption or MES execution because the semantic
        contract of alternates is internally contradictory. Source finding
        context: The alternate-part concept conflates symmetric equivalence with
        directed substitution approval. Source finding context: The
        `AlternatePart` definition asserts reciprocal substitutability. Source
        finding context: The same entity models a `direction` attribute with
        `one_way` and `bidirectional`, defaulting to `one_way`. Source finding
        context: The relation-level shorthand `alternate_of` further hides
        whether the relationship is directed or symmetric."
    - issue_id: issue-013
      candidates: *a14
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "ECO effectivity와 Part 표시값 사이의 temporal authority가 닫히지 않아 issue-002와
        같은 변경관리 정합성 위험을 만든다. Source finding context: Part.rev and
        Part.current_eco Source finding context: manufacturing-bom-ontology.yaml
        > entities.Part.attributes.rev/current_eco and integrity_rules ECO
        effective-date rule Source finding context: `Part.rev` and `current_eco`
        are named like current authoritative item state but defined as delayed
        or external projections. Source finding context: The names `rev` and
        `current_eco` suggest current item-state fields on Part, but the notes
        define them as externally sourced and potentially lagging projections.
        In a PLM/MES baseline, this makes the semantics of effective revision
        ambiguous: manufacturing effectivity is governed by ECO effective date,
        while the visible Part revision may lag. Source finding context:
        Separate authoritative effectivity from cached/display fields. For
        example, model `effective_revision` or `revision_effectivity` as
        ECO-governed, and mark `drawing_rev_snapshot`/`latest_eco_snapshot` as
        synchronized projections with freshness metadata. Source finding
        context:
        .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics\
        -candidate-004 Source finding context: PLM/MES integration concept
        baseline for item revision and engineering change management. Source
        finding context: During the interval after `ECO.effective_date` and
        before weekly `Part.rev` synchronization, consumers may choose different
        revisions depending on whether they trust `Part.rev` or ECO effectivity.
        Source finding context: This undermines change-management semantics and
        creates manufacturing execution risk because the ontology does not
        clearly name the authoritative current revision for production. Source
        finding context: The Part concept uses current-state naming for
        externally governed, asynchronously synchronized change-management
        projections. Source finding context: `Part.rev` and `current_eco` are
        attributes on Part, but both notes identify external source systems as
        authoritative. Source finding context: The ECO rule defines production
        revision by `ECO.effective_date`, while `Part.rev` updates only after a
        weekly batch sync. Source finding context: The ontology therefore has
        competing semantic cues for the current manufacturing revision: a Part
        field name and ECO effectivity rule."
    - issue_id: issue-014
      candidates: *a15
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "검사 실행 활동과 이를 지배하는 specification의 lifecycle과 소비 방식이 다르므로, 현재 타입 구조는
        MES routing 소비자에게 잘못된 실행 의미를 줄 수 있다. Source finding context:
        InspectionPlan Source finding context: manufacturing-bom-ontology.yaml >
        entities.InspectionPlan.definition and is_a Operation Source finding
        context: `InspectionPlan` is typed as an `Operation` even though its
        name and attributes describe a plan/specification rather than an
        executable routing step. Source finding context: An inspection operation
        is an executable routing step, while an inspection plan is an
        institutional specification that can parameterize or govern that step.
        Treating the plan itself as an Operation creates an ontological type
        mismatch: plan/specification instances inherit operation identity and
        routing-step semantics even when they represent rules and criteria.
        Source finding context: Model `InspectionOperation` as an `Operation`
        subtype if needed, and model `InspectionPlan` as a separate
        specification referenced by the inspection operation. Keep
        `sampling_rule` and `acceptance_criteria` on the plan/specification or
        as parameters applied to the operation. Source finding context:
        .onto/review/20260718-8d90017a/round1/semantics.findings.yaml#semantics\
        -candidate-005 Source finding context: PLM/MES integration concept
        baseline for routing, operation, and quality inspection concepts. Source
        finding context: When routing consumers treat every `Operation` subtype
        as an executable ordered step, `InspectionPlan` instances may be
        scheduled or sequenced as operations instead of referenced as quality
        specifications. Source finding context: This weakens semantic
        correctness for MES routing execution because a plan/specification is
        classified as a process step. Source finding context: The ontology
        conflates executable inspection activity with the inspection
        specification that governs it. Source finding context: `Operation` is
        defined as a routing process step and Routing contains an ordered list
        of Operations. Source finding context: `InspectionPlan` is named and
        attributed as a plan with sampling and acceptance criteria, but declared
        `is_a: Operation`. Source finding context: The subclassing makes
        plan/specification instances inherit operation semantics, causing a
        semantic type mismatch for routing integration."
    - issue_id: issue-015
      candidates: *a16
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: '숙의상 issue-012와 별개로 보존된 relation-path metadata 문제이며, 관계 객체가 가진
        direction 권위가 canonical traversal 경로에서 유지되지 않아 통합 매핑 신뢰를 약화시킨다. Source
        finding context: manufacturing-bom-ontology.yaml entities.AlternatePart
        / relations Source finding context: materialized-input.md:
        entities.AlternatePart declares primary_ref, alternate_ref, and
        direction; relations only declares Part -> Part alternate_of with note
        "AlternatePart를 통해 표현되는 관계의 단축 표기". Source finding context:
        AlternatePart is structurally bypassed by the relation graph. Source
        finding context: From a structure lens, this leaves the entity that is
        supposed to hold the relationship metadata disconnected from the
        canonical relation graph. Consumers traversing relations for PLM/MES
        integration can see that Parts are alternates, but cannot structurally
        reach the AlternatePart record or its direction field through that
        relation path. Source finding context: Model AlternatePart explicitly in
        relations, for example Part -> AlternatePart for primary, AlternatePart
        -> Part for alternate, and make the Part -> Part shortcut either derived
        or remove it from the canonical relation list. Source finding context:
        .onto/review/20260718-8d90017a/round1/structure.findings.yaml#structure-candidate-001
        Source finding context: Use the ontology as a concept baseline for
        PLM/MES integration across items, BOM, routing, and change-management
        concepts. Source finding context: When substitute-part relationships are
        consumed from the relations section, the AlternatePart entity and its
        direction metadata are not reachable from the declared alternate_of
        path. Source finding context: This weakens integration trust because a
        structurally important relationship object can be skipped, causing
        directionality and relationship-level metadata to be lost in downstream
        mappings. Source finding context: The ontology defines AlternatePart as
        an entity but represents its relation path as a direct Part-to-Part
        relation instead of connecting the entity in the relation graph. Source
        finding context: AlternatePart carries primary_ref, alternate_ref, and
        direction attributes. Source finding context: The relations list omits
        AlternatePart and uses Part -> Part alternate_of as a shortcut. Source
        finding context: The declared relation graph cannot structurally
        traverse from alternate_of to the AlternatePart entity or its direction
        metadata.'
