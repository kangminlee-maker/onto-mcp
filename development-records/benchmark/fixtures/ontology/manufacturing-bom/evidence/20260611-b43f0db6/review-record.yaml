        problem also captured by issue-010. It should be carried forward with
        that related capacity-contract work. Source finding context:
        manufacturing-bom-ontology.yaml WorkCenter capacity semantics Source
        finding context: manufacturing-bom-ontology.yaml:58-62 Source finding
        context: WorkCenter capacity trades local convenience for cross-routing
        comparability without justification, drifting from the PLM/MES
        integration purpose. Source finding context: A PLM/MES baseline should
        allow routing and capacity concepts to be interpreted consistently
        across work centers. A unitless capacity number that changes meaning per
        work center makes scheduling and capacity comparison depend on local
        knowledge outside the ontology, which undermines the declared
        integration role. Source finding context: Split capacity into explicit
        quantity and unit/basis fields, such as capacity_value, capacity_uom,
        capacity_basis, and valid operation unit compatibility rules. If mixed
        capacity types are required, model them as typed capacity records rather
        than a single unitless number. Source finding context:
        .onto/review/20260611-b43f0db6/round1/axiology.findings.yaml#axiology-c\
        andidate-003 Source finding context: PLM/MES routing and manufacturing
        operation concept baseline. Source finding context: When two work
        centers use different implicit capacity units, consumers cannot compare
        or schedule operations consistently from the ontology alone. Source
        finding context: This weakens review trust because capacity is a
        production-planning decision input; unclear units can produce invalid
        schedules or misleading bottleneck analysis while satisfying the current
        schema. Source finding context: Capacity is represented as a single
        numeric attribute while its measurement basis is allowed to vary by work
        center. Source finding context: Operation.std_time_min is explicitly in
        minutes, giving routing time a defined unit. Source finding context:
        WorkCenter.capacity_per_shift is numeric but its unit varies by work
        center between count and time. Source finding context: The ontology
        lacks an explicit compatibility or conversion rule connecting operation
        time to work-center capacity basis."
