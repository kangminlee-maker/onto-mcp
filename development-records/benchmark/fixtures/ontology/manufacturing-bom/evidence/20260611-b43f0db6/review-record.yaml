        ECO, 특정 생산일자에 유효한 ECO는 같은 의미가 아니다. current_eco라는 단일 참조가 최신 변경을 뜻하면 생산일자
        기준 적용 변경을 판단할 수 없고, effective_date 및 status 의미와 충돌할 수 있다. PLM/MES 통합에서는
