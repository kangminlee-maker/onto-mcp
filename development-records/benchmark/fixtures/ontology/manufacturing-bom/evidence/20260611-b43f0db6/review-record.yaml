        ECO effective-date control is value-misaligned with the PLM/MES
        integration purpose because production-facing revision truth can lag
        behind the declared change rule. Source finding context: The target
        declares itself a PLM/MES integration concept baseline, and the request
        focuses on part, BOM, routing, and change-management consistency plus
        manufacturing operations risk. Under that purpose, a weekly lag between
        ECO effectivity and Part.rev weakens the model's ability to serve as a
        safe production-order reference: MES could see a released/effective ECO
        while the Part revision still reflects the prior drawing-ledger batch
        state. Source finding context: Model effectivity as a
