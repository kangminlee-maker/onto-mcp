        finding context: When ECO.effective_date has passed but Part.rev has not
        yet been updated by the weekly drawing-ledger batch, the ontology gives
        production-facing consumers a stale or ambiguous revision state. Source
        finding context: This changes review trust because change effectivity is
        a manufacturing execution gate; stale revision authority can cause MES
        orders after the effective date to be planned or executed against the
        wrong design revision. Source finding context: Revision and ECO truth
