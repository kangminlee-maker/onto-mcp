  - relation_id: rel-011
    from_finding_id: finding-011
    to_finding_id: finding-018
    relation: same_root_candidate
    root_hypothesis: The BOM graph contract is under-specified, mixing semantic
      exceptions and relation/attribute projections without a single canonical
      graph for validation.
    shared_cause: null
    rationale: Finding-011 exposes a direct conflict in BOM acyclicity when
      self-inclusion is allowed; finding-018 shows the parent edge is not
