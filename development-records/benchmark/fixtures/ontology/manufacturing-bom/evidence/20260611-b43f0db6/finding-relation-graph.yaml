relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-009
    relation: same_root_candidate
    root_hypothesis: Change effectivity is modeled as a current Part revision plus a
      date rule rather than as an independent production-time authority that can
      reconcile ECO status, effective date, and revision synchronization.
    shared_cause: null
    rationale: "Both findings point to the same ECO/Part.rev authority gap:
      finding-001 focuses on the production risk when ECO.effective_date has
      passed but Part.rev lags, while finding-009 focuses on the same coupling
      as an evolution risk when effectivity needs to expand beyond a date rule."
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-009
    to_finding_id: finding-016
    relation: shared_cause_candidate
    root_hypothesis: The ontology conflates latest change references with
      production-effective change authority.
    shared_cause:
      cause_claim: The model does not separate latest/current ECO pointers from
        immutable production-effective effectivity records tied to status, date,
        and revision selection.
      from_cause_ref: finding-009.cause-003
      to_cause_ref: finding-016.cause-004
    rationale: Finding-009 says effectivity is coupled to ECO.effective_date and
      delayed Part.rev, while finding-016 says current_eco mixes latest ECO with
      production-effective ECO. The common cause is the absence of a separate
      effectivity concept that decides what production should use.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-004
    to_finding_id: finding-009
    relation: same_root_candidate
    root_hypothesis: Time-varying manufacturing truth is represented as current
      scalar attributes and date notes rather than versioned/effective
      production baselines.
    shared_cause: null
    rationale: Finding-004 identifies missing effective periods and history for
      BOM/routing values; finding-009 identifies missing effectivity modeling
      for ECO-to-revision application. Both would be falsified by explicit
      immutable revision/effectivity records that production orders can
      reference for the applicable point in time.
    confidence: medium
  - relation_id: rel-004
    from_finding_id: finding-004
    to_finding_id: finding-005
    relation: enables
    root_hypothesis: Without a production-order execution concept, the ontology has
      no stable object on which to freeze the applicable BOM/routing/effectivity
      baseline.
    shared_cause: null
    rationale: Finding-004 calls for reconstructing the BOM/routing values used at a
      production time. Finding-005 shows that ProductionOrder or WorkOrder is
      missing, which is the natural execution object that would carry a snapshot
      or references to BOM/routing revisions. The execution coverage gap
      therefore enables the historical reconstruction gap.
    confidence: medium
  - relation_id: rel-005
    from_finding_id: finding-002
    to_finding_id: finding-008
    relation: shared_cause_candidate
    root_hypothesis: Operational quantity governance is outside the ontology, so
      unit-sensitive values depend on local or manual practices.
    shared_cause:
      cause_claim: The ontology records UOM conversion as an unmanaged site practice
        instead of a governed conversion master with precedence and
        invalid-input behavior.
      from_cause_ref: finding-002.cause-003
      to_cause_ref: finding-008.cause-002
    rationale: Finding-002 treats missing UOM conversion authority as part of
      broader operational shadow data governance; finding-008 isolates the same
      unmanaged conversion practice as the reason UOM evolution is brittle. The
      referenced causes are substantively the same local-conversion gap.
    confidence: high
  - relation_id: rel-006
    from_finding_id: finding-002
    to_finding_id: finding-006
    relation: same_root_candidate
    root_hypothesis: Manual and external-source operational data movements are
      documented as accepted practices without modeling the governing control
      event, authority, or reconciliation evidence.
    shared_cause: null
    rationale: Finding-002 focuses on missing canonical authority and validation for
      copied/manual operational values; finding-006 focuses on missing
