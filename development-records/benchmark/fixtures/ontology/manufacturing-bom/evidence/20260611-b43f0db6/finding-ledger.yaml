    claim: BOM·라우팅의 시점 의존 값에 유효기간·이력 개념이 누락되어 과거 생산 기준을 재구성할 수 없다.
    lens_rationale_summary: 대상 문서는 PLM/MES 통합의 개념 기준 문서라고 선언되어 있고,
      ECO.effective_date 이후 생산분은 신규 rev를 따른다고 규칙화한다. 그러나 실제 변경 대상인 BOM 라인과 라우팅
      파라미터에는 적용기간과 이력 개념이 없어 특정 생산일의 기준 BOM·공정조건을 재현할 근거가 부족하다. 이는 생산 실적, 품질 문제,
      원가 재계산, 변경 적용 경계 검증에서 같은 품목이라도 어느 기준값을 써야 하는지 판단을 약화시킨다.
    proposed_action: BomLine, Routing, Operation 또는 별도 BOMRevision/RoutingRevision
      개념에 effective_from/effective_to, revision_id, superseded_by,
      change_ref(ECO)와 변경 이력 속성을 추가한다. 생산오더 생성 시 참조되는 기준 BOM·라우팅 버전을 고정하는
      snapshot/baseline 개념도 함께 정의한다.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서 ECO 적용 시점과 생산 기준 BOM·라우팅을 일관되게 해석하는 목적.
    failure_condition: ECO 적용 전후, 주간 배치 동기화 전후, 또는 스크랩률·표준시간 변경 후의 과거 생산분을 재검토해야 할 때
