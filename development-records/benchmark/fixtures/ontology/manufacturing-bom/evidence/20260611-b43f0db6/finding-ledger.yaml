      판단을 약화합니다.
    proposed_action: 둘 중 하나로 정규화하십시오. 대체 관계가 항상 대칭이면 direction 속성과 one_way 값을 제거하거나
      bidirectional로 고정합니다. 단방향 대체를 지원해야 하면 정의를 '대체 가능 부품 관계는 direction에 따라 단방향
      또는 양방향일 수 있다'로 바꾸고, bidirectional일 때만 역방향 대체가 성립한다고 규칙을 분리합니다.
