lens_id: semantics
human_output_ref: null
findings:
  - candidate_id: semantics-candidate-001
    target: AlternatePart
    evidence_anchor: manufacturing-bom-ontology.yaml >
      entities.AlternatePart.definition /
      entities.AlternatePart.attributes.direction
    claim: AlternatePart의 정의는 대체 관계를 대칭으로 말하지만 속성은 비대칭 대체를 허용한다.
    what: 정의는 "A의 대체가 B이면 B의 대체도 A"라고 하여 항상 양방향 관계로 설명한다. 그러나 같은 엔티티의 direction은
      one_way와 bidirectional을 모두 허용하고, note는 기본을 one_way라고 한다.
    why: 대체품 관계는 PLM/MES에서 구매·생산 대체 가능성 판단에 직접 쓰이는 의미 계약이다. 정의상 양방향이라고 믿으면 B를 A로
      역대체할 수 있다고 해석되지만, 속성 계약상 기본은 단방향이다. 이 이름/정의/속성 불일치는 대체 가능성 의미를 뒤집어 제조 투입
      품목을 잘못 선택하게 만들 수 있다.
    how_to_fix: AlternatePart 정의를 방향성 있는 대체 관계로 고치고, bidirectional일 때만 상호 대체라고 명시한다.
      또는 실제 도메인 의도가 항상 상호 대체라면 direction 속성에서 one_way를 제거한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합의 품목·BOM 변경 및 대체품 개념 기준 문서
      failure_condition: 단방향 대체가 존재하거나 기본값 one_way가 적용되는 경우에도 정의를 따라 양방향 대체로 해석할 때
      impact: MES나 구매/생산 계획 쪽에서 허용되지 않은 역방향 대체를 사용할 수 있어 품목 적합성, 품질 승인, 변경 적용 기준에 대한
        신뢰가 약해진다.
      evidence_refs:
        - 'manufacturing-bom-ontology.yaml > AlternatePart.definition: "A의 대체가
          B이면 B의 대체도 A다."'
        - "manufacturing-bom-ontology.yaml > AlternatePart.direction.values:
          [one_way, bidirectional]"
        - 'manufacturing-bom-ontology.yaml > AlternatePart.direction.note: "기본은
          one_way."'
    causal_path:
      root_cause_candidate: AlternatePart 개념에서 관계의 대칭성 의미를 정의와 direction 속성이 서로 다르게 부여한다.
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: 정의는 대체 관계를 항상 대칭 관계로 설명한다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > AlternatePart.definition
        - cause_id: semantics-candidate-001.cause-002
          claim: direction 속성은 one_way를 허용하고 기본도 one_way라고 설명한다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              AlternatePart.attributes.direction
        - cause_id: semantics-candidate-001.cause-003
          claim: 따라서 같은 AlternatePart 인스턴스의 의미가 정의 기준으로는 양방향, 속성 기준으로는 단방향일 수 있다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml > AlternatePart.definition
            - manufacturing-bom-ontology.yaml >
              AlternatePart.attributes.direction
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: InspectionPlan
    evidence_anchor: manufacturing-bom-ontology.yaml >
      entities.InspectionPlan.definition / entities.InspectionPlan.is_a
    claim: InspectionPlan을 Operation의 하위 유형으로 둔 것은 검사 계획과 공정 실행 단계의 존재론적 유형을 혼동한다.
    what: "InspectionPlan은 이름과 속성상 sampling_rule, acceptance_criteria를 담는 검사 기준/계획
      문서에 가깝다. 하지만 is_a: Operation으로 모델링되어 Operation의 공정 단계 의미와 work_center,
      std_time_min 의미를 상속한다."
    why: 검사 Operation은 라우팅에서 수행되는 단계이고, InspectionPlan은 그 검사 단계에 적용되는 기준 또는 파라미터
      집합이다. 계획을 단계 자체로 분류하면 라우팅 순서에 들어가는 실행 단위와 품질 기준 문서가 같은 종류로 취급되어, MES가 검사
      기준을 공정 단계처럼 스케줄링하거나 Operation 필수 속성의 의미를 잘못 해석할 수 있다.
    how_to_fix: InspectionPlan을 Operation의 하위 유형이 아니라 InspectionOperation 또는
      Operation에 연결되는 검사 기준 엔티티로 분리한다. 검사 공정 단계가 필요하면 Operation subtype은
      InspectionOperation으로 두고 InspectionPlan은 그 subtype이 참조하도록 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 라우팅·공정·검사 계획 개념을 PLM/MES 통합 기준으로 맞추는 목적
      failure_condition: InspectionPlan 인스턴스를 Routing.operations의 Operation처럼 해석하거나
        Operation의 work_center/std_time_min 의미를 그대로 요구할 때
      impact: 품질 기준 문서와 실행 공정 단계가 혼재되어 라우팅 순서, 작업장 배정, 표준시간, 검사 기준 적용의 의미가 흐려진다.
      evidence_refs:
        - 'manufacturing-bom-ontology.yaml > Operation.definition: "라우팅의 한 공정
          단계"'
        - 'manufacturing-bom-ontology.yaml > InspectionPlan.definition: "검사
          계획... Operation의 검사 파라미터 확장"'
        - "manufacturing-bom-ontology.yaml > InspectionPlan.is_a: Operation"
        - "manufacturing-bom-ontology.yaml > InspectionPlan.attributes:
          sampling_rule, acceptance_criteria"
    causal_path:
      root_cause_candidate: 검사 실행 단계와 검사 기준 계획을 하나의 is_a 계층으로 압축했다.
      root_cause_step_id: semantics-candidate-002.cause-003
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: Operation은 라우팅 안에서 수행되는 공정 단계로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > Operation.definition
            - manufacturing-bom-ontology.yaml > Routing.operations
        - cause_id: semantics-candidate-002.cause-002
          claim: InspectionPlan은 검사 계획과 합격 기준 속성을 담는 검사 파라미터 확장으로 정의된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml > InspectionPlan.definition
            - manufacturing-bom-ontology.yaml >
              InspectionPlan.attributes.acceptance_criteria
        - cause_id: semantics-candidate-002.cause-003
          claim: InspectionPlan이 Operation을 상속하면서 기준/계획 문서가 실행 단계와 같은 유형으로 취급된다.
          relation_to_previous: causes
          evidence_refs:
            - "manufacturing-bom-ontology.yaml > InspectionPlan.is_a: Operation"
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-003
    target: WorkCenter.capacity_per_shift
    evidence_anchor: manufacturing-bom-ontology.yaml >
      entities.WorkCenter.attributes.capacity_per_shift
    claim: capacity_per_shift가 개수와 시간을 같은 속성명 아래 혼용해 용량의 의미 단위를 구분하지 못한다.
    what: capacity_per_shift는 number 하나로 정의되며 note는 단위가 작업장마다 다르고 개수 또는 시간이라고 말한다.
    why: 개수/교대와 시간/교대는 서로 다른 차원의 용량이다. 같은 capacity_per_shift 값이 어떤 WorkCenter에서는 산출
      수량, 다른 WorkCenter에서는 가용 시간으로 해석되면 라우팅의 std_time_min과 결합할 때 의미적으로 같은 계산에
      투입할 수 없다. 이는 MES 부하·능력 판단의 기준 문서로서 치명적인 의미 모호성을 만든다.
    how_to_fix: capacity_quantity_per_shift와 available_time_min_per_shift처럼 의미 차원이
      다른 속성을 분리하거나, capacity_value와 capacity_uom/capacity_basis enum을 함께 둬 단위와
      계산 기준을 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: MES 공정 라우팅과 작업장 능력 기준의 의미 정합성
      failure_condition: 서로 다른 단위의 WorkCenter.capacity_per_shift 값을 동일한 capacity 속성으로
        비교·합산·부하계산에 사용할 때
      impact: 작업장 능력 값이 수량인지 시간인지 불분명해 생산 가능량, 병목, 생산오더 생성 가능성 판단을 잘못 만들 수 있다.
      evidence_refs:
        - 'manufacturing-bom-ontology.yaml > WorkCenter.capacity_per_shift.note:
          "단위는 작업장마다 다르다(개수 또는 시간)."'
        - manufacturing-bom-ontology.yaml > Operation.std_time_min
        - manufacturing-bom-ontology.yaml > Operation.work_center
    causal_path:
      root_cause_candidate: 서로 다른 측정 차원의 용량 개념을 단일 number 속성으로 명명했다.
      root_cause_step_id: semantics-candidate-003.cause-003
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: capacity_per_shift는 number로만 정의된다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              WorkCenter.capacity_per_shift.type
        - cause_id: semantics-candidate-003.cause-002
          claim: 해당 속성의 단위는 작업장마다 개수 또는 시간으로 달라질 수 있다고 명시된다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              WorkCenter.capacity_per_shift.note
        - cause_id: semantics-candidate-003.cause-003
          claim: Operation은 작업장과 표준 작업시간을 연결하므로 용량 단위가 불명확하면 공정 능력 의미가 흔들린다.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml > Operation.work_center
            - manufacturing-bom-ontology.yaml > Operation.std_time_min
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-004
    target: Part.current_eco
    evidence_anchor: manufacturing-bom-ontology.yaml >
      entities.Part.attributes.current_eco / integrity_rules ECO.effective_date
      rule
    claim: current_eco가 '최신 설계변경'과 생산에 적용되는 유효 ECO를 혼동한다.
    what: Part.current_eco는 최신 설계변경을 가리킨다고 되어 있고 ECO 시스템이 원본이라고 한다. 그러나 무결성 규칙은
      ECO.effective_date 이후 생산분은 신규 rev를 따르며, Part.rev는 도면 관리대장 반영 후 주간 배치로
      동기화된다고 한다.
    why: 최신 ECO, 승인된 ECO, 적용 완료 ECO, 특정 생산일자에 유효한 ECO는 같은 의미가 아니다. current_eco라는 단일
      참조가 최신 변경을 뜻하면 생산일자 기준 적용 변경을 판단할 수 없고, effective_date 및 status 의미와 충돌할 수
      있다. PLM/MES 통합에서는 변경 적용 시점이 제조 품목과 BOM 해석의 핵심 의미다.
    how_to_fix: current_eco를 latest_eco_ref처럼 단순 최신 변경 참조로 제한하거나,
      production_effective_eco 또는 effective_rev_by_date 같은 날짜 기준 적용 개념을 별도
      모델링한다. ECO.status와 effective_date가 어떤 조건에서 생산 적용 의미를 갖는지도 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 변경관리와 생산 적용 기준을 PLM/MES 통합 개념으로 정합화하는 목적
      failure_condition: Part.current_eco를 생산 시점에 적용할 ECO 또는 현재 유효 rev의 근거로 사용할 때
      impact: 최신 변경과 유효 변경이 어긋나는 기간에 생산 오더가 잘못된 rev 또는 변경 기준을 따를 수 있다.
      evidence_refs:
        - 'manufacturing-bom-ontology.yaml > Part.current_eco.note: "최신 설계변경.
          ECO 시스템이 원본."'
        - manufacturing-bom-ontology.yaml > ECO.attributes.effective_date
        - "manufacturing-bom-ontology.yaml > ECO.attributes.status values:
          [open, approved, applied]"
        - 'manufacturing-bom-ontology.yaml > integrity_rules:
          "ECO.effective_date 이후 생산분은 신규 rev를 따른다... 주간 배치로 동기화"'
    causal_path:
      root_cause_candidate: 변경관리에서 '최신'과 '생산일자 기준 유효'라는 서로 다른 의미를 current_eco 하나로 표현했다.
      root_cause_step_id: semantics-candidate-004.cause-004
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: Part.current_eco는 최신 설계변경으로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > Part.current_eco.note
        - cause_id: semantics-candidate-004.cause-002
          claim: ECO에는 effective_date와 status가 있어 변경의 적용 시점과 상태가 별도 의미로 존재한다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml > ECO.attributes.effective_date
            - manufacturing-bom-ontology.yaml > ECO.attributes.status
        - cause_id: semantics-candidate-004.cause-003
          claim: 무결성 규칙은 생산분이 ECO.effective_date 이후 신규 rev를 따르지만 Part.rev는 주간 배치로 늦게
            동기화된다고 한다.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml > integrity_rules
              ECO.effective_date rule
        - cause_id: semantics-candidate-004.cause-004
          claim: 따라서 current_eco를 현재 생산 적용 변경으로 해석하면 최신성, 상태, 유효일, rev 동기화의 의미가 뒤섞인다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml > Part.current_eco.note
            - manufacturing-bom-ontology.yaml > ECO.attributes
            - manufacturing-bom-ontology.yaml > integrity_rules
              ECO.effective_date rule
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - session_domain이 none이므로 별도 도메인 문서는 사용하지 않았다.
  - BOM/라우팅/변경관리 용어는 입력 파일 자체가 PLM/MES 통합 개념 기준 문서라고 선언한 범위 안에서 해석했다.
  - 외부 표준 매핑 검증은 웹 연구와 추가 표준 문서 접근이 denied인 경계 때문에 수행하지 않았다.
validation:
  unaddressable_candidates: []
