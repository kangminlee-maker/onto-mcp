classifications:
  - issue_id: issue-001
    problem_definition: Production-effective truth is not anchored to immutable
      effectivity and baseline records, so ECO, revision, BOM, and routing
      values can diverge by production date.
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: The resolved issue identifies a shared underlying modeling cause
      across ECO effectivity, Part revision, and BOM/routing parameters. Because
      the target is a PLM/MES concept baseline, unresolved production-date
      authority would undermine downstream integration decisions.
    related_surface_finding_ids:
      - finding-001
      - finding-004
      - finding-009
  - issue_id: issue-002
    problem_definition: Operational authority, reconciliation, audit evidence, and
      lifecycle-transition validity are under-modeled for copied/manual values
      and lifecycle states.
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: governance_value
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: Controlled deliberation narrowed the problem to governed authority
      and validity predicates rather than a broad governance theme. It is a root
      framing issue because it defines the missing authority layer needed before
      operational values can be trusted.
    related_surface_finding_ids:
      - finding-002
      - finding-006
      - finding-007
  - issue_id: issue-003
    problem_definition: WorkCenter capacity has no explicit unit or measurement
      basis, leaving cross-center scheduling semantics dependent on local
      interpretation.
    issue_role: symptom
    judgment_state: observed
    impact_kind: correctness
    timing_class: planned_follow_up
    closure_class: carry_forward
    closure_obligation: may_close_during_next_stage
    domain_axes: {}
    rationale: The issue is directly observed in the capacity attribute semantics,
      but it is a narrower manifestation of the broader capacity-dimension
      problem also captured by issue-010. It should be carried forward with that
      related capacity-contract work.
    related_surface_finding_ids:
      - finding-003
  - issue_id: issue-004
    problem_definition: The model references production-order creation without
      modeling the execution object that would consume released BOM/routing
      baselines.
    issue_role: independent_issue
    judgment_state: observed
    impact_kind: completeness
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: This is a concrete missing concept in the PLM/MES integration
      baseline. It is independent of the effectivity problems because even
      corrected baselines still need an execution object for traceability.
    related_surface_finding_ids:
      - finding-005
  - issue_id: issue-005
    problem_definition: Units and item-specific conversions are not governed
