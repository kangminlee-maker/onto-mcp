  - finding_id: finding-001
    lens_id: axiology
    source_ref: .onto/review/20260610-9ced06aa/round1/axiology.findings.yaml#axiology-candidate-001
    target: manufacturing-bom-ontology.yaml / BomLine.scrap_rate, std_time cost
      note, uom conversion note
    evidence_anchor: .onto/review/20260610-9ced06aa/execution-preparation/materialized-input.md:7,35,99,100
    claim: 수기·현장 보정 값을 기준 모델 안에 수용해 PLM/MES 통합 기준 문서라는 목적을 약화한다.
    lens_rationale_summary: PLM/MES 통합의 개념 기준 문서는 운영상 중요한 수량, 공정 손실, 시간, 단위 변환의 원본과
      precedence를 닫아야 한다. 그런데 대상은 핵심 제조·계획 값의 권위를 엑셀, 수기 입력, 현장 환산에 남겨 두어 동일
      품목/BOM/라우팅을 시스템마다 다르게 해석할 수 있게 한다. 이는 단순 누락이 아니라 통합 기준 문서가 제공해야 할 기준성 자체를
      국소 운영 편의에 양보하는 목적 drift다.
    proposed_action: scrap_rate, std_time, uom conversion을 각각 authoritative source,
      적용 범위, 동기화 방식, precedence, 검증 실패 시 처리를 가진 별도 master/reference로 모델링한다.
      복사·수기·현장 환산은 기준값이 아니라 예외적 입력 경로로 격하하고, PLM/MES/원가 시스템 간 대사 규칙을 온톨로지 계약에
      포함한다.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목·BOM·라우팅이 동일한 운영 의미와 기준값을 제공해야 한다는 목적.
    failure_condition: 생산계획 엑셀, MES 계산, 표준원가 수기 입력, 현장 uom 환산이 서로 다른 값을 보유하거나 갱신 시점이 어긋나는 경우.
    impact: 생산오더 수량, 자재 소요량, capacity/cost 계산이 시스템별로 달라져 통합 기준 문서에 대한 신뢰와 제조 운영
      의사결정의 재현성이 손상된다.
    evidence_refs:
      - .onto/review/20260610-9ced06aa/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:7
      - materialized-input.md:35
      - materialized-input.md:99
      - materialized-input.md:100
    severity: high
    domain_threshold_used: null
