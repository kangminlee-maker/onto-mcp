  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260610-9ced06aa/round1/axiology.findings.yaml#axiology-candidate-002
    target: manufacturing-bom-ontology.yaml / ECO effectivity and Part.rev
      synchronization
    evidence_anchor: .onto/review/20260610-9ced06aa/execution-preparation/materialized-input.md:20,21,69-75,96
    claim: ECO 효력일과 Part.rev 주간 배치 동기화를 병존시켜 변경관리 기준성이 생산 시점에서 깨질 수 있다.
    lens_rationale_summary: 변경관리의 목적은 특정 생산 시점에 어떤 revision이 유효한지 운영 시스템이 일관되게 결정하게
      하는 것이다. 그러나 effectivity는 즉시 생산 기준으로 선언되고, Part.rev는 주간 배치 이후에야 반영되므로, 같은
      날짜의 생산오더가 ECO 기준과 Part.rev 기준 중 무엇을 따라야 하는지 불안정해진다. PLM/MES 통합 기준 문서가
      precedence를 닫아야 하는 지점에서 외부 원본과 지연 동기화를 정당화 없이 받아들인 셈이다.
    proposed_action: ECO, drawing revision, Part revision을 effectivity-aware
      revision/effectivity entity로 연결하고 생산오더 생성·release 시점의 판정 기준을 명시한다.
      Part.rev 배치 동기화는 표시용 projection으로 낮추고, 운영 판단은 ECO 상태, effective_date, 적용
      rev의 승인 상태를 함께 검증하도록 precedence를 정의한다.
    affected_purpose: PLM/MES 통합에서 변경관리 개념이 생산 실행 시점의 유효 revision을 일관되게 결정해야 한다는 목적.
    failure_condition: ECO.effective_date는 도래했지만 Part.rev 주간 배치가 아직 반영되지 않은 기간에 생산오더
      또는 라우팅/BOM 판단이 이루어지는 경우.
    impact: 구 rev와 신규 rev 중 어느 기준으로 생산해야 하는지 시스템별 판정이 갈릴 수 있어 변경 적용 누락, 잘못된 자재·공정
      사용, 추적성 약화로 이어진다.
    evidence_refs:
      - .onto/review/20260610-9ced06aa/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:20
      - materialized-input.md:21
      - materialized-input.md:69-75
      - materialized-input.md:96
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 변경관리 개념이 생산 실행 시점의 유효 revision을 일관되게 결정해야 한다는 목적.
      failure_condition: ECO.effective_date는 도래했지만 Part.rev 주간 배치가 아직 반영되지 않은 기간에 생산오더
        또는 라우팅/BOM 판단이 이루어지는 경우.
      impact: 구 rev와 신규 rev 중 어느 기준으로 생산해야 하는지 시스템별 판정이 갈릴 수 있어 변경 적용 누락, 잘못된 자재·공정
        사용, 추적성 약화로 이어진다.
      evidence_refs:
        - materialized-input.md:20
        - materialized-input.md:21
        - materialized-input.md:69-75
        - materialized-input.md:96
    causal_path:
      root_cause_candidate: 변경 효력의 운영 기준과 Part.rev 동기화 projection의 권위·시점 차이를 명시적으로 분리하지 않았다.
      root_cause_step_id: finding-002.cause-005
      steps:
        - cause_id: finding-002.cause-001
          claim: Part.rev는 도면 리비전이며 도면 관리대장을 원본으로 둔다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20
        - cause_id: finding-002.cause-002
          claim: Part.current_eco는 최신 설계변경이며 ECO 시스템을 원본으로 둔다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:21
        - cause_id: finding-002.cause-003
          claim: ECO는 effective_date와 status를 가지며 affected_parts를 가진다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:69-75
        - cause_id: finding-002.cause-004
          claim: integrity rule은 effective_date 이후 생산분은 신규 rev를 따르지만 Part.rev 갱신은 도면 관리대장
            반영 후 주간 배치로 동기화한다고 둔다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:96
        - cause_id: finding-002.cause-005
          claim: 따라서 생산 시점의 변경 적용 기준이 ECO effectivity와 지연된 Part.rev projection 사이에서 갈릴 수
            있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:20
            - materialized-input.md:21
            - materialized-input.md:96
      unresolved_beyond_evidence: null
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260610-9ced06aa/round1/axiology.findings.yaml#axiology-candidate-003
    target: manufacturing-bom-ontology.yaml / BOM acyclicity exception for scrap
      reinput
    evidence_anchor: .onto/review/20260610-9ced06aa/execution-preparation/materialized-input.md:23-35,55-61,93-95
    claim: 재생 원료 회수 공정을 자기참조 BOM으로 모델링해 공정 흐름을 BOM 구조에 섞는 숨은 트레이드오프가 있다.
    lens_rationale_summary: PLM/MES 통합 기준에서 BOM은 제품 구조와 소요량 기준, Routing은 제조 흐름 기준을
      안정적으로 나누어야 한다. 스크랩 재투입이라는 공정/물류 흐름을 자기참조 BOM으로 표현하면 재귀 BOM 전개, 소요량 산정, 변경
      영향 분석에서 제품 구조와 공정 순환이 혼재된다. 국소적으로 예외 모델링은 쉬워지지만, 통합 기준 문서의 구조적 기준성과 운영 해석
      가능성을 약화하는 트레이드오프가 정당화 없이 수용되어 있다.
    proposed_action: BOM의 비순환 원칙은 유지하고, 스크랩 재투입은 routing operation의 input/output,
      byproduct/recovered-material, recycle-flow 같은 별도 공정 흐름 개념으로 모델링한다. 예외가
      필요하다면 engineering BOM이 아닌 manufacturing flow relation으로 범위와 계산 규칙을 분리한다.
    affected_purpose: 품목·BOM·라우팅 개념이 PLM/MES 통합의 기준 문서로서 서로 다른 운영 의미를 안정적으로 제공해야 한다는 목적.
    failure_condition: BOM 전개, 자재 소요량 계산, 변경 영향 분석, 생산오더 생성이 자기참조 BOM을 일반 BOM 구조와 같은 방식으로 처리하는 경우.
    impact: 제품 구조 기준과 공정 순환 기준이 섞여 BOM 비순환 가정에 의존하는 통합 로직의 신뢰가 낮아지고, 예외 처리 없이는 제조 운영
      산출물이 왜곡될 수 있다.
    evidence_refs:
      - .onto/review/20260610-9ced06aa/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:23-35
      - materialized-input.md:55-61
      - materialized-input.md:93-95
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 품목·BOM·라우팅 개념이 PLM/MES 통합의 기준 문서로서 서로 다른 운영 의미를 안정적으로 제공해야 한다는 목적.
      failure_condition: BOM 전개, 자재 소요량 계산, 변경 영향 분석, 생산오더 생성이 자기참조 BOM을 일반 BOM 구조와 같은
        방식으로 처리하는 경우.
      impact: 제품 구조 기준과 공정 순환 기준이 섞여 BOM 비순환 가정에 의존하는 통합 로직의 신뢰가 낮아지고, 예외 처리 없이는 제조 운영
        산출물이 왜곡될 수 있다.
      evidence_refs:
        - materialized-input.md:23-35
        - materialized-input.md:55-61
        - materialized-input.md:93-95
    causal_path:
      root_cause_candidate: 공정 재투입 흐름을 표현할 별도 개념 없이 BOM 구조 예외로 흡수했다.
      root_cause_step_id: finding-003.cause-004
      steps:
        - cause_id: finding-003.cause-001
          claim: Assembly는 하위 Part들로 구성되는 조립품이며 BomLine은 parent_ref, child_ref, qty_per를
            통해 상위 품목이 하위 품목을 얼마나 쓰는지 표현한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:23-35
        - cause_id: finding-003.cause-002
          claim: Routing은 품목 제조의 공정 순서로 별도 정의되어 operations ordered_list를 가진다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:55-61
        - cause_id: finding-003.cause-003
          claim: integrity rule은 BOM 비순환을 선언하면서도 스크랩 재투입은 Assembly가 자기 하위에 자신을 포함하는 형태로
            모델링한다고 예외를 둔다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:93-95
        - cause_id: finding-003.cause-004
          claim: 이 예외는 공정 재투입 흐름을 제품 구조인 BOM에 섞어 PLM/MES 기준 문서의 개념 분리를 약화한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:23-35
            - materialized-input.md:55-61
            - materialized-input.md:93-95
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260610-9ced06aa/round1/coverage.findings.yaml#coverage-candidate-001
    target: manufacturing-bom-ontology.yaml PLM/MES integration coverage
    evidence_anchor: manufacturing-bom-ontology.yaml:1-2, 50-56, 64-70, 88-91
    claim: MES 실행 주문/작업지시 개념이 표현되어 있지 않다.
    lens_rationale_summary: 현재 엔티티 범위는 Part, Assembly, BomLine, AlternatePart,
      Operation, Routing, WorkCenter, ECO, InspectionPlan에 머물며, 생산 오더는 무결성 규칙의
      문장 안에만 등장한다. PLM/MES 통합에서 라우팅 릴리즈와 ECO 적용 결과가 실제 MES 실행 단위로 전달되는 기준 객체가
      없으면 어느 품목/리비전/라우팅으로 어떤 주문을 생성해야 하는지 온톨로지 안에서 닫히지 않는다.
    proposed_action: ProductionOrder 또는 WorkOrder 개념을 추가하고 최소한 order_no, part_ref,
      routing_ref, planned_qty, due/start date, status, effective_rev 또는
      applied_eco_ref를 두어 Routing.status, ECO.effective_date, Part.rev와 연결되는 실행
      주문 생성 기준을 명시한다.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목, 라우팅, 변경관리 기준을 MES 생산 실행으로 넘기는 범위.
    failure_condition: 라우팅이 released이고 ECO effective_date가 지난 상황에서 MES 생산 오더를 생성해야 할
      때, 온톨로지 안에 생성 대상 주문과 적용 revision/routing을 담는 개념이 없다.
    impact: 통합 기준 문서가 master data와 실행 데이터 사이의 핵심 접점을 비워 두어, 시스템 간 구현자가 주문 생성·변경 반영
      기준을 각자 해석하게 된다.
    evidence_refs:
      - .onto/review/20260610-9ced06aa/round1/coverage.findings.yaml#coverage-candidate-001
      - manufacturing-bom-ontology.yaml:1-2
      - manufacturing-bom-ontology.yaml:50-56
      - manufacturing-bom-ontology.yaml:64-70
      - manufacturing-bom-ontology.yaml:88-91
    severity: medium
    domain_threshold_used: null
