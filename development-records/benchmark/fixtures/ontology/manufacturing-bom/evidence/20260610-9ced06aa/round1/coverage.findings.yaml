findings:
  - candidate_id: coverage-candidate-001
    target: manufacturing-bom-ontology.yaml PLM/MES integration coverage
    evidence_anchor: manufacturing-bom-ontology.yaml:1-2, 50-56, 64-70, 88-91
    claim: MES 실행 주문/작업지시 개념이 표현되어 있지 않다.
    what: 문서는 PLM/MES 통합 기준 문서라고 선언하고 `Routing.status`가 released인 품목만 생산 오더를 생성할 수
      있다고 규칙까지 두지만, 정작 ProductionOrder/WorkOrder 같은 실행 주문 엔티티와 그 주문이 Part,
      Routing, ECO effective revision을 참조하는 개념 범주가 없다.
    why: 현재 엔티티 범위는 Part, Assembly, BomLine, AlternatePart, Operation, Routing,
      WorkCenter, ECO, InspectionPlan에 머물며, 생산 오더는 무결성 규칙의 문장 안에만 등장한다. PLM/MES
      통합에서 라우팅 릴리즈와 ECO 적용 결과가 실제 MES 실행 단위로 전달되는 기준 객체가 없으면 어느 품목/리비전/라우팅으로 어떤
      주문을 생성해야 하는지 온톨로지 안에서 닫히지 않는다.
    how_to_fix: ProductionOrder 또는 WorkOrder 개념을 추가하고 최소한 order_no, part_ref,
      routing_ref, planned_qty, due/start date, status, effective_rev 또는
      applied_eco_ref를 두어 Routing.status, ECO.effective_date, Part.rev와 연결되는 실행
      주문 생성 기준을 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목, 라우팅, 변경관리 기준을 MES 생산 실행으로 넘기는 범위.
      failure_condition: 라우팅이 released이고 ECO effective_date가 지난 상황에서 MES 생산 오더를 생성해야 할
        때, 온톨로지 안에 생성 대상 주문과 적용 revision/routing을 담는 개념이 없다.
      impact: 통합 기준 문서가 master data와 실행 데이터 사이의 핵심 접점을 비워 두어, 시스템 간 구현자가 주문 생성·변경 반영
        기준을 각자 해석하게 된다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:1-2
        - manufacturing-bom-ontology.yaml:50-56
        - manufacturing-bom-ontology.yaml:64-70
        - manufacturing-bom-ontology.yaml:88-91
    causal_path:
      root_cause_candidate: 온톨로지 범위가 BOM/라우팅/ECO master data 중심으로 구성되었지만, 선언된 PLM/MES
        통합 목적에서 필요한 MES 실행 주문 개념을 같은 범위 안에 포함하지 않았다.
      root_cause_step_id: coverage-candidate-001.cause-002
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: 생산 오더는 `Routing.status` 무결성 규칙에 등장하지만 엔티티나 관계로 정의되어 있지 않다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:7-77
            - manufacturing-bom-ontology.yaml:88-91
        - cause_id: coverage-candidate-001.cause-002
          claim: 정의된 라우팅은 Part와 Operation 및 status만 포함하고, ECO는
            affected_parts/effective_date/status만 포함하므로 실행 주문이 어떤 라우팅과 변경 적용 상태를
            기준으로 생성되는지 담을 객체가 없다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:50-56
            - manufacturing-bom-ontology.yaml:64-70
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-002
    target: manufacturing-bom-ontology.yaml BOM and change-management coverage
    evidence_anchor: manufacturing-bom-ontology.yaml:18-30, 50-56, 64-70, 88-91
    claim: BOM 자체의 버전·상태·효력 범위 개념이 누락되어 있다.
    what: "Routing에는 `status: [draft, released]`가 있고 ECO에는 effective_date가 있지만,
      Assembly/BomLine에는 BOM revision, BOM status, line-level effectivity,
      valid-from/to, plant/model/variant 같은 BOM 적용 범위를 표현하는 하위 개념이 없다."
    why: BOM은 단순히 Assembly의 `bom_lines`와 BomLine의 parent/child/qty/scrap_rate로만
      표현된다. 변경관리 규칙은 ECO effective_date 이후 생산분이 신규 rev를 따른다고 하지만, 어떤 BOM 구조나 BOM
      line이 해당 rev/effectivity에 속하는지 표현할 범주가 없어 변경된 BOM의 릴리즈·적용 범위를 개념 문서 안에서
      커버하지 못한다.
    how_to_fix: BOMHeader 또는 BomRevision 개념을 분리하고 status, revision,
      effective_from/effective_to, plant/model/variant 적용 범위를 추가한다. BomLine에도
      line revision/effectivity 또는 owning BOM revision 참조를 두어 ECO가 BOM 구조 변경까지
      적용할 수 있게 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품목·BOM·라우팅·변경관리 정합성을 제공하는 PLM/MES 통합 기준.
      failure_condition: 동일 Assembly에 대해 변경 전후 BOM, 공장별 BOM, 모델/옵션별 BOM,
        released/draft BOM을 구분해야 하는 경우 현재 모델은 하나의 `bom_lines` 목록밖에 제공하지 않는다.
      impact: BOM 변경 적용 범위가 누락되면 MES가 올바른 자재 구조를 선택하는 기준이 문서에 없고, ECO effective_date
        규칙도 Part.rev 수준에만 머물러 BOM 구조 변경을 닫지 못한다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:18-30
        - manufacturing-bom-ontology.yaml:50-56
        - manufacturing-bom-ontology.yaml:64-70
        - manufacturing-bom-ontology.yaml:88-91
    causal_path:
      root_cause_candidate: BOM을 독립 수명주기를 가진 기준 객체가 아니라 Assembly의 라인 목록 속성으로만 모델링했다.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: Assembly는 `bom_lines` 속성만 갖고 BomLine은 parent, child, qty, scrap_rate만
            갖는다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:18-30
        - cause_id: coverage-candidate-002.cause-002
          claim: Routing에는 released/draft 상태가 있지만 BOM에는 대응되는 release 상태나
            revision/effectivity 범주가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml:50-56
            - manufacturing-bom-ontology.yaml:18-30
        - cause_id: coverage-candidate-002.cause-003
          claim: ECO 규칙은 effective_date 이후 신규 rev를 따른다고 하지만, BOM 구조나 BomLine이 어떤 변경 효력에
            속하는지 표현하지 않는다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:64-70
            - manufacturing-bom-ontology.yaml:88-91
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: manufacturing-bom-ontology.yaml manufacturing traceability coverage
    evidence_anchor: manufacturing-bom-ontology.yaml:9-16, 24-30, 42-48, 72-77, 93-95
    claim: 제조 운영 위험을 다루는 lot/serial/batch 추적 범주가 없다.
    what: Part, BomLine, Operation, InspectionPlan은 정의되어 있지만 실제 생산·검사·자재 투입 결과를 lot,
      serial, batch, material issue/consumption, inspection result로 추적하는 개념 범주가
      없다.
    why: 문서는 제조 운영 위험을 검토 대상으로 삼고 검사 계획과 스크랩률까지 포함하지만, 계획된 품목·공정·검사 파라미터와 실제 제조 이력
      사이를 연결하는 추적성 개념이 없다. 이 상태에서는 품질 문제나 변경 적용 오류가 발생했을 때 어떤 lot/serial이 어떤
      BOM/라우팅/검사 기준으로 생산되었는지 온톨로지 범위 안에서 표현할 수 없다.
    how_to_fix: Lot/Serial 또는 Batch, MaterialConsumption, OperationExecution,
      InspectionResult 같은 최소 추적성 개념을 추가하고
      ProductionOrder/Operation/Part/BomLine/InspectionPlan과 연결한다. 범위를 작게 유지하려면
      우선 LotTraceRecord 하나로 생산 lot, 투입 part lot, operation, inspection result
      참조를 묶는 방식도 가능하다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 제조 운영 위험 중심의 PLM/MES 통합 기준 문서.
      failure_condition: 불량, 리콜, ECO 적용 오류, 스크랩률 이상을 특정 생산 단위와 투입 자재 단위까지 추적해야 하는 경우,
        현재 온톨로지는 계획 master data만 있고 실행 이력·lot/serial 범주가 없다.
      impact: 운영 위험 분석과 MES 통합에서 핵심인 추적성 범위가 비어 있어 품질·변경·자재 사용 이력을 기준 문서로 검증하기 어렵다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:9-16
        - manufacturing-bom-ontology.yaml:24-30
        - manufacturing-bom-ontology.yaml:42-48
        - manufacturing-bom-ontology.yaml:72-77
        - manufacturing-bom-ontology.yaml:93-95
    causal_path:
      root_cause_candidate: 온톨로지가 계획 기준 데이터인 Part/BOM/Routing/InspectionPlan에는 범위를
        할당했지만, 제조 실행 결과와 물리적 추적 단위에는 범위를 할당하지 않았다.
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: 현재 품목과 BOM은 Part 및 BomLine의 기준 속성으로만 표현되고 lot, serial, batch 속성이나 엔티티가
            없다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:9-16
            - manufacturing-bom-ontology.yaml:24-30
        - cause_id: coverage-candidate-003.cause-002
          claim: 공정과 검사는 Operation 및 InspectionPlan의 계획 속성으로 표현되지만 operation execution이나
            inspection result 범주는 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml:42-48
            - manufacturing-bom-ontology.yaml:72-77
        - cause_id: coverage-candidate-003.cause-003
          claim: 스크랩률과 uom 현장 환산 같은 운영 위험은 언급되지만, 실제 투입·산출·검사 이력을 연결할 추적성 하위 영역이 없다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:24-30
            - manufacturing-bom-ontology.yaml:93-95
      unresolved_beyond_evidence: null
