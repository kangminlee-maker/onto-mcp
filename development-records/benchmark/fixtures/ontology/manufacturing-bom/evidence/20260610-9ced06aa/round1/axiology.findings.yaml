  - candidate_id: axiology-candidate-001
    target: manufacturing-bom-ontology.yaml / BomLine.scrap_rate, std_time cost
      note, uom conversion note
    evidence_anchor: .onto/review/20260610-9ced06aa/execution-preparation/materialized-input.md:7,35,99,100
    claim: 수기·현장 보정 값을 기준 모델 안에 수용해 PLM/MES 통합 기준 문서라는 목적을 약화한다.
    what: BOM/라우팅 통합 기준 문서라고 선언하면서도 scrap_rate는 생산계획팀 엑셀에서 복사하고, 누적 std_time은 MES
      계산과 표준원가 수기 입력을 병행하며, uom 변환은 품목별 환산계수 마스터 없이 현장에서 처리한다고 둔다.
    why: PLM/MES 통합의 개념 기준 문서는 운영상 중요한 수량, 공정 손실, 시간, 단위 변환의 원본과 precedence를 닫아야 한다.
      그런데 대상은 핵심 제조·계획 값의 권위를 엑셀, 수기 입력, 현장 환산에 남겨 두어 동일 품목/BOM/라우팅을 시스템마다 다르게
      해석할 수 있게 한다. 이는 단순 누락이 아니라 통합 기준 문서가 제공해야 할 기준성 자체를 국소 운영 편의에 양보하는 목적
      drift다.
    how_to_fix: scrap_rate, std_time, uom conversion을 각각 authoritative source, 적용
      범위, 동기화 방식, precedence, 검증 실패 시 처리를 가진 별도 master/reference로 모델링한다.
      복사·수기·현장 환산은 기준값이 아니라 예외적 입력 경로로 격하하고, PLM/MES/원가 시스템 간 대사 규칙을 온톨로지 계약에
      포함한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목·BOM·라우팅이 동일한 운영 의미와 기준값을 제공해야 한다는 목적.
      failure_condition: 생산계획 엑셀, MES 계산, 표준원가 수기 입력, 현장 uom 환산이 서로 다른 값을 보유하거나 갱신 시점이 어긋나는 경우.
      impact: 생산오더 수량, 자재 소요량, capacity/cost 계산이 시스템별로 달라져 통합 기준 문서에 대한 신뢰와 제조 운영
        의사결정의 재현성이 손상된다.
      evidence_refs:
        - materialized-input.md:7
        - materialized-input.md:35
        - materialized-input.md:99
        - materialized-input.md:100
    causal_path:
      root_cause_candidate: 대상이 제조 운영 핵심값의 source-of-truth와 precedence를 온톨로지 안에서 닫지 않고
        외부 수기/현장 경로를 기준 모델의 일부로 수용한다.
      root_cause_step_id: axiology-candidate-001.cause-004
      steps:
        - cause_id: axiology-candidate-001.cause-001
          claim: scrap_rate는 BomLine 속성이지만 생산계획팀 엑셀 값을 복사해 둔다고 정의되어 있다.
