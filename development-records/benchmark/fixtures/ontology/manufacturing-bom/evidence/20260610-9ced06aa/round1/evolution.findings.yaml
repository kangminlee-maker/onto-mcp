findings:
  - candidate_id: evolution-candidate-001
    target: manufacturing-bom-ontology.yaml / Part.uom, BomLine.scrap_rate,
      WorkCenter.capacity_per_shift, notes.uom conversion
    evidence_anchor: materialized-input.md:19, materialized-input.md:35,
      materialized-input.md:67, materialized-input.md:100
    claim: 단위와 환산 기준이 확장 가능한 마스터 개념이 아니라 고정 enum·자유 숫자·현장 환산으로 분산되어 새 단위나 설비 용량 범주
      추가 시 기존 구조 수정과 해석 단절이 필요하다.
    what: Part.uom은 [ea, kg, m]으로 고정되어 있고, WorkCenter.capacity_per_shift는 작업장마다 단위가
      다르다고만 되어 있으며, uom 변환은 품목별 환산계수 마스터 없이 현장에서 처리한다고 적혀 있다. scrap_rate도 생산계획팀
      엑셀 값을 복사하는 수치 속성으로만 존재한다.
    why: PLM/MES 통합 기준 문서라면 품목 단위, 설비 능력 단위, 수율·스크랩 계수는 새 품목군·공정·외부 시스템이 들어올 때 계속
      확장되는 기준값이다. 현재 모델은 새 단위가 필요할 때 Part.uom enum 자체를 바꿔야 하고,
      capacity_per_shift의 의미는 WorkCenter별 암묵 관행에 의존한다. 이 상태에서는 기존 데이터의 수량, 능력,
      환산 의미를 보존한 채 다른 시스템과 통합하거나 새 단위 체계를 추가하기 어렵다.
    how_to_fix: UnitOfMeasure, ConversionFactor, CapacityMeasure 같은 기준 개념을 추가하고
      Part.uom·WorkCenter.capacity_per_shift·BomLine.scrap_rate가 단위, 적용 범위, 원본
      권한, 유효기간을 참조하도록 바꾼다. enum은 내부 식별자나 참조값으로 축소하고, 새 단위는 마스터 데이터 추가로 수용되게 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목·BOM·라우팅 수량과 작업장 능력을 일관되게 교환·확장하는 목적.
      failure_condition: 새 품목군이 다른 UOM을 쓰거나, 설비 용량을 시간/수량/중량 등 다른 기준으로 통합해야 하거나, kg↔ea
        환산이 필요한 생산·원가 흐름이 자동화될 때 실패한다.
      impact: 수량과 능력의 의미가 구조적으로 보존되지 않아 기존 데이터 재해석, enum 마이그레이션, 현장별 수기 규칙 반영이 필요해지고
        PLM/MES 간 계획·원가·능력 계산 신뢰가 약해진다.
      evidence_refs:
        - materialized-input.md:19
        - materialized-input.md:35
        - materialized-input.md:67
        - materialized-input.md:100
    causal_path:
      root_cause_candidate: 변경 가능성이 높은 측정 기준을 독립 기준 개념이 아니라 고정 enum 또는 단위 없는 숫자 속성으로 모델링했다.
      root_cause_step_id: evolution-candidate-001.cause-004
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: Part.uom은 ea/kg/m 세 값으로 고정된 enum이다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:19
        - cause_id: evolution-candidate-001.cause-002
          claim: WorkCenter.capacity_per_shift는 숫자 하나지만 단위가 작업장마다 다르다고 명시되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:67
        - cause_id: evolution-candidate-001.cause-003
          claim: uom 변환은 품목별 환산계수 마스터 없이 현장 환산에 맡겨져 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:100
        - cause_id: evolution-candidate-001.cause-004
          claim: 따라서 새 단위·환산·능력 기준을 추가할 때 기존 속성의 의미를 유지한 채 확장하기보다 enum 수정과 외부 관행 해석이
            필요해진다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:19
            - materialized-input.md:67
            - materialized-input.md:100
      unresolved_beyond_evidence: 실제 현장에 별도 단위 마스터가 존재하는지는 이 경계 안에서 확인하지 않았다. 다만 대상 문서 자체는 없다고 명시한다.
  - candidate_id: evolution-candidate-002
    target: manufacturing-bom-ontology.yaml / Part.rev, Part.current_eco, ECO,
      Routing.status, ECO integrity rule
    evidence_anchor: materialized-input.md:20-21, materialized-input.md:61,
      materialized-input.md:69-75, materialized-input.md:96
    claim: 변경 이력과 적용성(effectivity)이 Part의 최신 rev/current_eco와 ECO.effective_date
      중심으로만 표현되어, 동시 리비전·BOM/라우팅 변경·주간 동기화 지연을 견디는 버전 연속성이 부족하다.
    what: Part는 rev와 current_eco만 갖고, ECO는 affected_parts와 effective_date/status만
      갖는다. Routing은 draft/released 상태만 있고 BOM 라인·라우팅·Operation에는 별도 revision,
      effective-from/to, change set 연결이 없다. 규칙은 effective_date 이후 생산분은 신규 rev를
      따른다고 하면서 Part.rev 갱신은 도면 관리대장 반영 후 주간 배치로 동기화한다고 한다.
    why: 변경관리 확장성 관점에서 PLM/MES 통합은 과거·현재·미래 리비전, 특정 생산오더의 적용 기준, BOM과 라우팅의 동시 변경을 함께
      보존해야 한다. 현재 구조는 '최신 ECO'와 Part.rev 동기화 상태에 의존하므로, ECO 적용일과 배치 반영일 사이 또는 여러
      ECO가 겹치는 상황에서 기존 생산분이 어느 BOM/라우팅/검사 기준을 따라야 하는지 구조적으로 계속 추적하기 어렵다.
    how_to_fix: PartVersion 또는 RevisionedItem, BomVersion, RoutingVersion,
      Effectivity 범위를 도입한다. ECO는 affected_parts뿐 아니라 변경 대상 버전, 변경 전/후, 적용
      범위(날짜·로트·오더), BOM/라우팅/검사계획 변경 세트를 참조하게 하고, 생산오더는 생성 시점의 유효 버전을 고정 참조하게 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품목·BOM·라우팅·변경관리 개념을 PLM/MES 사이에서 연속적으로 유지하는 기준 문서 목적.
      failure_condition: ECO effective_date와 Part.rev 주간 동기화 사이에 생산오더가 생성되거나,
        BOM/라우팅/검사 계획이 함께 바뀌거나, 여러 리비전이 병행 생산될 때 실패한다.
      impact: 기존 데이터의 적용 기준이 최신 rev/current_eco에 덮여 보일 수 있어 MES 생산오더, 품질 검사, 원가 산정이 과거
        기준을 재현하거나 미래 변경을 안전하게 예약하기 어렵다.
      evidence_refs:
        - materialized-input.md:20
        - materialized-input.md:21
        - materialized-input.md:61
        - materialized-input.md:69-75
        - materialized-input.md:96
    causal_path:
      root_cause_candidate: 변경관리의 권한과 이력을 버전 개념이 아니라 현재값 속성과 단일 적용일 규칙에 집중시켰다.
      root_cause_step_id: evolution-candidate-002.cause-005
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: Part에는 rev와 current_eco만 있고 둘 다 외부 원본 시스템의 현재값 또는 최신 변경 참조로 설명된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20
            - materialized-input.md:21
        - cause_id: evolution-candidate-002.cause-002
          claim: ECO는 affected_parts, effective_date, status만 제공하며 BOM 라인·라우팅·작업·검사계획 버전
            변경을 직접 연결하지 않는다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:69-75
        - cause_id: evolution-candidate-002.cause-003
          claim: 무엇을 생산할 수 있는지는 Routing.status draft/released와 ECO.effective_date 이후 신규
            rev 규칙으로만 제한된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:61
            - materialized-input.md:95-96
        - cause_id: evolution-candidate-002.cause-004
          claim: Part.rev 갱신이 주간 배치로 지연된다고 명시되어 적용일과 구조상 현재 rev 사이에 불일치 구간이 생긴다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:96
        - cause_id: evolution-candidate-002.cause-005
          claim: 따라서 변경 시나리오가 늘어날수록 기존 생산·BOM·라우팅 기준을 구조적으로 보존하기보다 외부 시스템 상태와 시점 해석에 의존하게
            된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:20-21
            - materialized-input.md:69-75
            - materialized-input.md:96
      unresolved_beyond_evidence: 생산오더 엔티티가 대상 파일에 없으므로 오더 고정 버전 정책은 이 경계 안에서 확인할 수 없다.
  - candidate_id: evolution-candidate-003
    target: manufacturing-bom-ontology.yaml / BOM acyclicity rule and scrap reinput
      exception
    evidence_anchor: materialized-input.md:29-35, materialized-input.md:93-94
    claim: 스크랩 재투입을 Assembly 자기참조 예외로 모델링해 BOM의 비순환 확장 규칙이 공정 회수 시나리오를 추가할 때마다 깨지거나
      특수분기화될 위험이 있다.
    what: BomLine은 parent Assembly와 child Part 및 qty/scrap_rate만 표현한다. 무결성 규칙은 BOM은
      비순환이어야 한다고 하면서, 재생 원료 회수 공정은 Assembly가 자기 하위에 자신을 포함하는 형태로 모델링한다고 예외를 둔다.
    why: evolution 관점에서 비순환 BOM은 확장 가능한 기본 불변식이어야 한다. 그런데 회수·재작업·부산물·폐기물 재투입 같은 공정
      흐름을 BOM 자기참조로 표현하면, 새 순환형 제조 시나리오가 추가될 때마다 BOM 검증기가 예외를 늘리거나 비순환 가정을 포기해야
      한다. 이는 기존 BOM 탐색, 소요량 전개, 원가 누적 규칙의 연속성을 약화한다.
    how_to_fix: BOM은 제품 구조의 비순환 불변식으로 유지하고, 스크랩 회수·재투입은 MaterialFlow, Byproduct,
      ReworkRoute, RecoveryOperation 같은 별도 공정/흐름 개념으로 분리한다. 필요한 경우 flow line에
      source operation, target operation, yield/scrap factor, effectivity를 둔다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM·라우팅 기준을 확장 가능한 PLM/MES 통합 개념으로 유지하는 목적.
      failure_condition: 재생 원료 회수 외에 재작업, 부산물 재투입, 순환 공정, 폐기물 회수 등 유사 흐름이 추가될 때 실패한다.
      impact: BOM의 비순환성이라는 기본 계약이 예외 기반으로 약해져 소요량 전개, 원가 누적, 라우팅 연계 검증이 새 제조 흐름마다 특수
        처리에 의존하게 된다.
      evidence_refs:
        - materialized-input.md:29-35
        - materialized-input.md:93-94
    causal_path:
      root_cause_candidate: 제품 구조(BOM)와 공정 물질 흐름(스크랩 재투입)을 같은 BomLine 자기참조 구조로 합쳤다.
      root_cause_step_id: evolution-candidate-003.cause-004
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: BomLine은 parent_ref, child_ref, qty_per, scrap_rate로 상하위 품목 사용량을 표현한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:29-35
        - cause_id: evolution-candidate-003.cause-002
          claim: 무결성 규칙은 BOM 비순환을 요구한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:93-94
        - cause_id: evolution-candidate-003.cause-003
          claim: 같은 규칙 안에서 스크랩 재투입은 Assembly가 자기 하위에 자신을 포함하는 형태라고 예외를 둔다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:94
        - cause_id: evolution-candidate-003.cause-004
          claim: 따라서 회수성 제조 흐름 확장 시 BOM 비순환 검증과 소요량 전개가 일반 규칙 대신 예외 해석에 의존하게 된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:93-94
      unresolved_beyond_evidence: 대상 파일 밖의 MES 소요량 전개 알고리즘은 확인하지 않았다. 판단은 이 온톨로지가 제공하는 개념 계약에 한정한다.
