      및 제조 운영 위험 검토). 대상 근거: `BomLine.scrap_rate` note, `notes`의 누적 std_time 수기
      입력·분기 대사 및 현장 uom 환산."
    claim: 복사·수기 입력·현장 환산을 권위와 동기화 계약 없이 정상 경로로 수용하여 PLM/MES 공통 개념 기준이라는 목적에서 이탈한다.
    lens_rationale_summary: 동일한 생산 수량·시간·원가 개념이 시스템과 현장별로 달라질 수 있다. 공통 기준 문서가 이런 분기를
      정규화하지 않으면 통합 소비자는 일관된 계획·실적·원가 의미를 얻지 못한다.
    proposed_action: 각 값의 권위 시스템, 단위, 유효기간, 동기화 방식, 불일치 시 우선순위를 명시하고, 복사·수기 필드는 권위
      값의 추적 가능한 파생값으로만 정의한다. 품목별 UOM 환산계수 마스터와 변환 규칙도 기준 개념에 포함한다.
    affected_purpose: PLM/MES 통합에서 품목·BOM·라우팅 데이터를 동일한 의미로 해석하게 하는 개념 기준 제공
    failure_condition: scrap_rate, 표준시간 또는 UOM이 복사·수기 입력·현장 판단 경로에서 원본과 달라질 때
    impact: 생산계획 수량, 능력 산정 및 원가 계산이 시스템별로 달라져 기준 문서에 대한 운영 신뢰가 훼손된다.
    evidence_refs:
