    target: manufacturing-bom-ontology.yaml — AlternatePart definition and direction
      attribute
    evidence_anchor: materialized-input.md:37-45 — definition requires reciprocal
      substitution, while direction permits and defaults to one_way
    claim: The AlternatePart symmetry rule and its one-way direction state are
      jointly unsatisfiable for a default instance.
    lens_rationale_summary: "Conflict pair: materialized-input.md:38 and
      materialized-input.md:42-45. This is an inter-claim, mixed-modality
      conflict: the necessary reciprocity definition excludes the explicitly
      possible/default one-way state. PLM and MES consumers can therefore derive
      different substitution eligibility from the same valid record."
    proposed_action: "Choose one canonical contract: either remove `one_way` and
      make all alternates bidirectional, or redefine the relation conditionally
      so reciprocity applies only when `direction: bidirectional`; also state
      the exact semantics of each direction value."
    affected_purpose: Use of the ontology as a shared PLM/MES conceptual standard
      for part substitution.
    failure_condition: An AlternatePart record uses the permitted or default `one_way` value.
    impact: The same conforming record simultaneously requires and forbids the
      reverse substitution, so interoperating systems cannot apply a
      deterministic eligibility rule.
    evidence_refs:
      - .onto/review/20260718-e047c9c7/round1/logic.findings.yaml#logic-candidate-001
      - materialized-input.md:38
      - materialized-input.md:42-45
    severity: medium
    domain_threshold_used: null
    materiality_basis:
