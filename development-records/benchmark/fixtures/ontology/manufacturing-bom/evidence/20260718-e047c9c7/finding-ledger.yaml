            - "materialized-input.md: notes — 분기 대사 및 현장 환산"
      unresolved_beyond_evidence: 실제 시스템에 별도 동기화·대사 통제가 존재하는지는 현재 경계에서 확인할 수 없으나, 개념 기준 문서 자체에는 그 계약이 없다.
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260718-e047c9c7/round1/axiology.findings.yaml#axiology-candidate-002
    target: manufacturing-bom-ontology.yaml — ECO 효력과 Part 리비전 동기화
    evidence_anchor: "가치 기준: review-value-alignment-criteria.yaml criterion
      `user-request-intent`의 변경관리 정합성 및 제조 운영 위험. 대상 근거: integrity rule
      `ECO.effective_date 이후 생산분은 신규 rev를 따른다`와 `Part.rev 갱신은 ... 주간 배치로
      동기화한다`."
    claim: 즉시 적용되는 ECO 효력 규칙과 지연 갱신되는 Part.rev 사이의 공백을 허용해 변경관리 기준의 목적을 훼손한다.
    lens_rationale_summary: 효력일과 표시 리비전이 어긋난 기간에 생산 오더가 구 리비전으로 생성되거나 실행될 수 있다. 이는
      변경관리의 핵심 가치인 적용 시점의 일관성과 추적성을 직접 약화한다.
    proposed_action: 생산 시점의 유효 리비전을 ECO 효력 구간에서 직접 결정하도록 모델링하고, `Part.rev` 배치 갱신 여부와
      무관하게 오더 생성·실행이 같은 유효 리비전을 사용하도록 한다. 동기화 지연 중에는 불일치를 차단하거나 명시적인 예외 승인 상태를
      요구한다.
    affected_purpose: PLM의 설계변경을 MES 생산 실행에 일관되게 전달하는 변경관리 개념 기준
    failure_condition: ECO 효력일은 지났지만 주간 배치가 아직 Part.rev를 갱신하지 않은 기간
    impact: 구 리비전 생산, 잘못된 자재·공정 적용 및 변경 이력 추적 실패가 가능해진다.
    evidence_refs:
      - .onto/review/20260718-e047c9c7/round1/axiology.findings.yaml#axiology-candidate-002
      - "review-value-alignment-criteria.yaml: criterion user-request-intent"
      - "materialized-input.md: ECO effective-date integrity rule"
      - "materialized-input.md: Part.rev authority note"
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM의 설계변경을 MES 생산 실행에 일관되게 전달하는 변경관리 개념 기준
      failure_condition: ECO 효력일은 지났지만 주간 배치가 아직 Part.rev를 갱신하지 않은 기간
      impact: 구 리비전 생산, 잘못된 자재·공정 적용 및 변경 이력 추적 실패가 가능해진다.
      evidence_refs:
        - "review-value-alignment-criteria.yaml: criterion user-request-intent"
        - "materialized-input.md: ECO effective-date integrity rule"
        - "materialized-input.md: Part.rev authority note"
    causal_path:
      root_cause_candidate: ECO 효력 시점과 Part 리비전 표현을 하나의 유효기간 기반 권위로 결합하지 않고 비동기 복제값에 의존한다.
      root_cause_step_id: finding-002.cause-002
      steps:
        - cause_id: finding-002.cause-001
          claim: 효력일 이후 신규 rev를 요구하면서 Part.rev는 주간 배치로 늦게 갱신한다.
          relation_to_previous: null
          evidence_refs:
            - "materialized-input.md: ECO effective-date integrity rule"
        - cause_id: finding-002.cause-002
          claim: 동기화 공백에서 생산이 사용할 유효 리비전 결정 또는 차단 규칙이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "materialized-input.md: Routing release integrity rule"
            - "materialized-input.md: ECO effective-date integrity rule"
      unresolved_beyond_evidence: 생산 오더 시스템이 ECO를 직접 조회하는지는 경계 내 자료로 확인되지 않는다.
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260718-e047c9c7/round1/axiology.findings.yaml#axiology-candidate-003
    target: manufacturing-bom-ontology.yaml — 스크랩 재투입의 자기참조 BOM 모델링
    evidence_anchor: "가치 기준: review-value-alignment-criteria.yaml criterion
      `user-request-intent`의 BOM 개념 정합성과 제조 운영 위험. 대상 근거: integrity rule `BOM은
      비순환이어야 한다. 단, 재생 원료 회수 공정... Assembly가 자기 하위에 자신을 포함`."
    claim: 공정상의 재투입 흐름을 제품 구조의 자기참조로 표현하는 국소 편의가 BOM 기준의 비순환성과 전개 가능성을 훼손한다.
    lens_rationale_summary: BOM 전개, 소요량 계산, 원가 롤업 및 순환 검증은 일반적으로 종료 가능한 제품 구조를 전제로
      한다. 공정 재순환을 같은 관계에 넣으면 통합 소비자마다 예외 해석이 달라지고 무한 전개나 중복 수량 계산 위험이 생긴다.
    proposed_action: 제품 구성 BOM은 비순환 규칙을 유지하고, 스크랩 발생·회수·재투입은 Routing/Operation에 연결된
      별도 자재 흐름 또는 회수 관계로 모델링한다. 투입률·회수율과 계산 경계를 명시한다.
    affected_purpose: PLM 제품 구조와 MES 공정 흐름을 구분하면서 연결하는 일관된 BOM/라우팅 개념 기준
    failure_condition: 스크랩 재투입이 있는 Assembly를 BOM 전개·소요량·원가 계산에 사용할 때
    impact: 제품 구조와 공정 순환의 의미가 혼합되어 통합 시스템별 계산 결과와 예외 처리가 달라질 수 있다.
    evidence_refs:
      - .onto/review/20260718-e047c9c7/round1/axiology.findings.yaml#axiology-candidate-003
      - "review-value-alignment-criteria.yaml: criterion user-request-intent"
      - "materialized-input.md: BOM acyclicity integrity rule and self-cycle
        exception"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM 제품 구조와 MES 공정 흐름을 구분하면서 연결하는 일관된 BOM/라우팅 개념 기준
      failure_condition: 스크랩 재투입이 있는 Assembly를 BOM 전개·소요량·원가 계산에 사용할 때
      impact: 제품 구조와 공정 순환의 의미가 혼합되어 통합 시스템별 계산 결과와 예외 처리가 달라질 수 있다.
      evidence_refs:
        - "review-value-alignment-criteria.yaml: criterion user-request-intent"
        - "materialized-input.md: BOM acyclicity integrity rule and self-cycle
          exception"
    causal_path:
      root_cause_candidate: 제품 구성 관계와 공정 자재 회수 흐름을 별도 개념으로 분리하지 않았다.
      root_cause_step_id: finding-003.cause-002
      steps:
        - cause_id: finding-003.cause-001
          claim: 비순환 BOM에 자기참조 예외를 도입해 스크랩 재투입을 표현한다.
          relation_to_previous: null
          evidence_refs:
            - "materialized-input.md: BOM acyclicity integrity rule"
        - cause_id: finding-003.cause-002
          claim: 공정 흐름을 표현할 독립적인 투입·산출·회수 관계가 대상 모델에 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "materialized-input.md: entities and relations"
            - "materialized-input.md: BOM acyclicity integrity rule"
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260718-e047c9c7/round1/coverage.findings.yaml#coverage-candidate-001
    target: BomLine·Routing·Part/ECO의 시점별 구성 모델
    evidence_anchor: materialized-input.md — Part.attributes.rev/current_eco,
      BomLine.attributes, Routing.attributes, ECO.attributes.effective_date 및 세
      번째 integrity_rule
    claim: BOM과 라우팅에 리비전·유효구간·구성 기준선이 없어 특정 시점의 생산 구성을 재구성할 수 없다.
    lens_rationale_summary: ECO 발효와 Part.rev 주간 배치 동기화 사이에 시간차가 명시되어 있으므로, 날짜별로 어떤
      BOM·라우팅·리비전을 적용해야 하는지 단일하게 판정할 수 없다. 과거 생산분의 설계·공정 구성 추적도 불가능하다.
    proposed_action: PartRevision과 유효기간이 있는 BOMRevision/RoutingRevision 또는
      ConfigurationBaseline을 추가하고, 각 기준선을 ECO 및 effective_from/effective_to와
      연결한다. 생산 적용 규칙은 현재 Part.rev가 아니라 발효된 기준선을 참조하게 한다.
    affected_purpose: PLM/MES 통합에서 품목·BOM·라우팅·변경의 일관된 시점별 기준을 제공하는 목적
    failure_condition: ECO 발효 후 Part.rev 배치 동기화 전이거나 과거 생산 시점의 구성을 조회할 때
    impact: MES가 서로 다른 시점의 품목 리비전, BOM, 라우팅을 조합할 수 있어 오생산 위험이 생기며 생산 이력 감사도 신뢰할 수 없다.
    evidence_refs:
      - .onto/review/20260718-e047c9c7/round1/coverage.findings.yaml#coverage-candidate-001
      - "materialized-input.md: Part.rev/current_eco"
      - "materialized-input.md: BomLine.attributes 및 Routing.attributes"
      - "materialized-input.md: ECO.effective_date와 주간 배치 동기화 integrity_rule"
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 품목·BOM·라우팅·변경의 일관된 시점별 기준을 제공하는 목적
      failure_condition: ECO 발효 후 Part.rev 배치 동기화 전이거나 과거 생산 시점의 구성을 조회할 때
      impact: MES가 서로 다른 시점의 품목 리비전, BOM, 라우팅을 조합할 수 있어 오생산 위험이 생기며 생산 이력 감사도 신뢰할 수 없다.
      evidence_refs:
        - "materialized-input.md: Part.rev/current_eco"
        - "materialized-input.md: BomLine.attributes 및 Routing.attributes"
        - "materialized-input.md: ECO.effective_date와 주간 배치 동기화 integrity_rule"
    causal_path:
      root_cause_candidate: 온톨로지가 변경 가능한 제조 정의를 현재값 중심으로만 모델링하고, 구성 단위의 시간성과 기준선 개념을 두지 않았다.
      root_cause_step_id: finding-004.cause-002
      steps:
        - cause_id: finding-004.cause-001
          claim: BomLine과 Routing에 리비전 또는 유효구간이 없고 Part.rev는 현재 문자열 값만 보유한다.
