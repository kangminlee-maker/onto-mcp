      unresolved_beyond_evidence: null
  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260718-e047c9c7/round1/coverage.findings.yaml#coverage-candidate-002
    target: MES 생산 실행 및 추적성 개념 범위
    evidence_anchor: materialized-input.md — 두 번째 integrity_rule의 '생산 오더' 참조와 전체 entities 목록
    claim: 규칙에서 생산 오더를 사용하지만 ProductionOrder와 실행 구성·실적·계보 개념이 존재하지 않는다.
    lens_rationale_summary: PLM 정의를 MES 실행에 전달하고 결과를 다시 추적하려면 실행 인스턴스가 설계·공정 기준선에
      결박되어야 한다. 현재 모델에서는 released 상태 확인 이후의 실제 생산 구성을 표현하거나 검증할 수 없다.
    proposed_action: 최소한 ProductionOrder를 추가해 품목 리비전, BOM/Routing 기준선, 계획 수량 및 발효
      ECO를 참조하게 한다. 필요한 추적 수준에 맞춰 MaterialConsumption, OperationExecution,
