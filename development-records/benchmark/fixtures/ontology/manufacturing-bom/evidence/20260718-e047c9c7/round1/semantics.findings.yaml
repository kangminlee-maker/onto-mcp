findings:
  - candidate_id: semantics-candidate-001
    target: AlternatePart 의미 정의와 direction 속성
    evidence_anchor: materialized-input.md:37-45; materialized-input.md:91
    claim: AlternatePart는 정의상 대칭 관계이지만 기본 방향은 one_way로 선언되어 의미가 모순된다.
    what: 정의는 A를 B로 대체할 수 있으면 B도 A로 대체할 수 있다고 단정하지만, direction은 one_way와
      bidirectional을 구분하며 기본값도 one_way이다.
    why: 동일한 대체 관계를 대칭 관계와 방향성 관계로 동시에 정의한다. PLM과 MES가 서로 다른 선언을 기준으로 해석하면 역방향 대체의
      허용 여부가 달라져 승인되지 않은 부품 대체 또는 유효한 대체의 거부로 이어질 수 있다.
    how_to_fix: 대체 가능성을 기본적으로 방향성 있는 관계로 정의하고, bidirectional은 양방향 대체가 각각 승인된 경우의 명시적
      값으로 규정한다. 단축 관계 alternate_of에도 같은 방향 의미를 적용한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 부품 대체 가능성의 공통 의미 기준 제공
      failure_condition: 한 시스템이 정의문의 대칭성을 따르고 다른 시스템이 direction=one_way를 따를 때
      impact: 동일한 대체 마스터가 시스템별로 반대되는 실행 권한을 만들 수 있어 제조 투입 판단을 신뢰할 수 없다.
      evidence_refs:
        - materialized-input.md:37-45
        - materialized-input.md:91
    causal_path:
      root_cause_candidate: AlternatePart의 정준 의미를 대칭 관계와 방향성 관계 중 하나로 확정하지 않았다.
      root_cause_step_id: semantics-candidate-001.cause-002
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: 정의문은 대체 관계가 항상 대칭이라고 선언하지만 direction은 one_way를 허용하고 이를 기본값으로 둔다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37-45
        - cause_id: semantics-candidate-001.cause-002
          claim: 동일 개념에 상호 배타적인 의미 규칙이 공존한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:37-45
            - materialized-input.md:91
      unresolved_beyond_evidence: 각 시스템이 현재 어느 선언을 우선하는지는 경계 내 증거로 확인할 수 없다.
  - candidate_id: semantics-candidate-002
    target: InspectionPlan의 Operation 상속
    evidence_anchor: materialized-input.md:47-53; materialized-input.md:77-82
    claim: 검사 계획이라는 정보·규격 객체를 실제 공정 단계인 Operation의 하위 유형으로 분류했다.
    what: Operation은 라우팅에서 수행되는 공정 단계로 정의되지만 InspectionPlan은 샘플링 규칙과 합격 기준을 담는 계획이다.
      계획과 실행 단계는 동일한 존재론적 유형이 아니다.
    why: 상속 때문에 InspectionPlan 인스턴스가 op_code, 작업장, 표준시간을 가진 실행 단계로 해석되고 라우팅에 직접 배치될
      수 있다. 반대로 하나의 검사 공정이 적용 조건별 여러 계획을 참조하는 의미도 표현하기 어렵다.
    how_to_fix: InspectionOperation을 Operation의 하위 유형으로 두고, InspectionPlan은 별도의
      규격/계획 엔티티로 분리하여 InspectionOperation이 적용 계획을 참조하도록 한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM의 검사 규격과 MES의 실행 공정을 일관된 개념으로 통합
      failure_condition: 검사 계획 레코드를 라우팅 공정으로 전달하거나 공정 속성을 계획에 강제할 때
      impact: 계획 버전과 실제 실행 단계가 혼동되어 검사 지시, 작업장 배정 및 기준 적용의 의미가 달라질 수 있다.
      evidence_refs:
        - materialized-input.md:47-53
        - materialized-input.md:77-82
    causal_path:
      root_cause_candidate: 검사 행위와 그 행위를 규정하는 검사 계획을 하나의 유형으로 취급했다.
      root_cause_step_id: semantics-candidate-002.cause-002
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: InspectionPlan은 계획·규칙·합격 기준을 나타내면서 Operation을 상속한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:77-82
        - cause_id: semantics-candidate-002.cause-002
          claim: Operation은 라우팅에서 수행되는 공정 단계로 정의되어 계획 객체와 존재론적 범주가 다르다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:47-53
            - materialized-input.md:77-82
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-003
    target: BOM 비순환 규칙의 스크랩 재투입 예외
    evidence_anchor: materialized-input.md:29-35; materialized-input.md:93-96
    claim: 재생 원료의 공정 재투입 흐름을 Assembly의 자기 구성 관계로 모델링하여 BOM 구성 의미를 훼손한다.
    what: BomLine은 상위 품목이 하위 품목을 소비하는 구성 관계인데, 규칙은 스크랩 재투입을 같은 Assembly가 자기 하위에 자신을
      포함하는 관계로 표현한다.
    why: 재투입은 공정에서 발생한 부산물·스크랩의 회수 및 투입 흐름이지 완성 Assembly가 자기 자신을 구성품으로 소비한다는 뜻이 아니다.
      이를 BOM에 넣으면 구성 전개와 자재 소요 계산에서 자기 의존이 실제 제품 구조로 해석될 수 있다.
    how_to_fix: BOM은 비순환 구성 관계로 유지하고, 스크랩 발생물과 재투입량을 별도의 material-flow 또는
      byproduct/recovery 관계로 모델링하여 해당 Operation이나 Routing에 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM 제품구조와 MES 자재 흐름을 구분하면서 공유 가능한 BOM 의미 제공
      failure_condition: 자기 참조 BomLine을 일반 BOM 전개나 자재 소요 계산에 포함할 때
      impact: 순환 전개, 중복 소요 또는 잘못된 제품 구성 해석을 유발할 수 있어 BOM을 제조 기준으로 사용할 수 없다.
      evidence_refs:
        - materialized-input.md:29-35
        - materialized-input.md:93-94
    causal_path:
      root_cause_candidate: 제품 구성 관계와 공정 중 자재 회수·재투입 관계를 동일한 BomLine 의미로 표현했다.
      root_cause_step_id: semantics-candidate-003.cause-002
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: 무순환이어야 하는 BOM에 스크랩 재투입을 위한 Assembly 자기 포함을 허용한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:93-94
        - cause_id: semantics-candidate-003.cause-002
          claim: BomLine의 선언된 의미는 상위 품목이 하위 품목을 얼마나 사용하는지에 관한 제품 구성이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:29-35
      unresolved_beyond_evidence: 실제 BOM 전개 엔진의 순환 처리 방식은 경계 내에서 확인할 수 없다.
  - candidate_id: semantics-candidate-004
    target: Part.rev와 ECO 효력 규칙
    evidence_anchor: materialized-input.md:14-21; materialized-input.md:69-75;
      materialized-input.md:96
    claim: 도면 리비전인 Part.rev를 생산에 적용되는 품목 리비전처럼 사용하여 문서 개정과 제조 구성 효력의 의미를 혼동한다.
    what: Part.rev는 도면 관리대장이 원본인 도면 리비전으로 정의되지만, 무결성 규칙은 ECO 효력일 이후 생산분이 신규 rev를
      따른다고 선언한다. 같은 값이 문서 개정과 생산 구성 버전을 동시에 의미한다.
    why: ECO의 효력 발생과 도면대장 주간 동기화 사이에는 의도된 시차가 있다. MES가 Part.rev를 생산 적용 기준으로 해석하면
      effective_date 이후에도 이전 도면 리비전이 보이거나, 도면 개정만으로 제조 구성 변경이 발생한 것처럼 보일 수 있다.
    how_to_fix: 도면 리비전과 품목/제조 리비전을 별도 개념으로 구분한다. ECO는 적용 대상 리비전 또는 유효 구성과 명시적으로
      연결하고, 생산 적용 판단은 current 필드가 아니라 승인 상태와 효력 조건으로 결정하도록 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM 변경 승인과 MES 생산 적용 시점의 공통 변경관리 의미 제공
      failure_condition: ECO.effective_date 이후 생산 판단에 주간 동기화되는 Part.rev를 사용할 때
      impact: 변경 효력일과 실행 리비전이 불일치하여 구 리비전 생산 또는 잘못된 변경 적용이 발생할 수 있다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:69-75
        - materialized-input.md:96
    causal_path:
      root_cause_candidate: 도면 문서 리비전과 제조 품목의 유효 구성 리비전을 하나의 Part.rev로 합쳤다.
      root_cause_step_id: semantics-candidate-004.cause-003
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: Part.rev는 도면 리비전이며 도면 관리대장이 원본이라고 선언된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20
        - cause_id: semantics-candidate-004.cause-002
          claim: 동일한 rev가 ECO 효력일 이후 생산분이 따라야 하는 제조 리비전으로 사용된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:69-75
            - materialized-input.md:96
        - cause_id: semantics-candidate-004.cause-003
          claim: 두 의미의 동기화 주기가 달라 효력 상태와 rev 표시가 일시적으로 불일치한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:20
            - materialized-input.md:96
      unresolved_beyond_evidence: 도면 리비전과 실제 제조 구성 리비전이 현행 원본 시스템에서 항상 함께 변경되는지는 확인할 수 없다.
  - candidate_id: semantics-candidate-005
    target: BomLine.scrap_rate
    evidence_anchor: materialized-input.md:29-35
    claim: scrap_rate라는 비율 이름과 '공정 불량 감안 계수'라는 설명이 서로 다른 수치 의미를 허용한다.
    what: 속성명은 폐기 비율을 뜻하지만 설명은 계산에 곱하는 계수로 표현하며, 허용 범위·분모·산식이 없다. 예를 들어 5%를 0.05로
      넣는지 소요량 보정계수 1.05로 넣는지 구별할 수 없다.
    why: 복사된 동일 숫자를 PLM/MES 또는 계획 시스템이 비율과 승수로 다르게 해석하면 BOM 소요량과 생산계획 결과가 달라진다. 독립
      입력 값이어서 원천 값과의 드리프트도 의미적으로 식별되지 않는다.
    how_to_fix: 원천 의미를 expected_scrap_fraction처럼 명시하고 범위와 분모를 정의한다. 총소요 보정계수는 해당 비율과
      qty_per에서 산식으로 파생하며 독립 입력으로 두지 않는다. 값의 원본 식별자와 효력도 함께 규정한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM 수량과 공정 손실을 시스템 간 동일하게 해석하는 개념 기준 제공
      failure_condition: 소비 시스템이 scrap_rate를 손실 비율 또는 소요량 승수로 각각 해석할 때
      impact: 동일 BOM에서 계획 소요량이 달라져 과소·과다 조달과 생산계획 오차가 발생할 수 있다.
      evidence_refs:
        - materialized-input.md:29-35
    causal_path:
      root_cause_candidate: 손실 비율과 소요량 보정계수를 구분하지 않고 단일 number 속성에 결합했다.
      root_cause_step_id: semantics-candidate-005.cause-002
      steps:
        - cause_id: semantics-candidate-005.cause-001
          claim: 속성명은 rate지만 설명은 계수이며 수치 범위와 산식이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:35
        - cause_id: semantics-candidate-005.cause-002
          claim: 원천 값을 복사한 독립 숫자가 비율인지 승수인지 판별할 의미 제약이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:35
      unresolved_beyond_evidence: 생산계획팀 원본 엑셀에서 사용하는 실제 단위와 산식은 경계 밖이므로 확인되지 않았다.
  - candidate_id: semantics-candidate-006
    target: WorkCenter.capacity_per_shift
    evidence_anchor: materialized-input.md:63-67
    claim: capacity_per_shift가 수량 능력과 가용 시간이라는 서로 다른 차원의 값을 같은 속성으로 표현한다.
    what: 작업장별 단위가 개수 또는 시간이라고 명시되어 있지만 값에는 단위나 용량 기준 품목·공정이 없다. '교대당 처리 능력'이라는 이름도
      시간 값일 때는 처리량이 아니라 가용시간을 나타낸다.
    why: 수량/교대와 시간/교대는 직접 비교하거나 동일 산식에 넣을 수 없는 값이다. PLM/MES가 숫자만 교환하면 생산능력인지 가용시간인지
      판별할 수 없어 부하율과 일정 계산의 의미가 달라진다.
    how_to_fix: available_time_per_shift와 throughput_capacity를 분리하거나, 최소한 dimension,
      unit, 기준 Operation/Part 및 산정 기간을 포함하는 명시적 용량 측정값으로 모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: MES 작업장 능력과 라우팅 부하를 일관된 단위로 통합
      failure_condition: 단위 메타데이터 없이 capacity_per_shift 숫자를 작업장 간 또는 계산식에서 사용할 때
      impact: 차원이 다른 값을 같은 용량으로 취급하여 부하율, 병목 판단 및 생산 일정이 잘못될 수 있다.
      evidence_refs:
        - materialized-input.md:63-67
    causal_path:
      root_cause_candidate: 처리량과 가용시간을 하나의 무차원 capacity 속성으로 합쳤다.
      root_cause_step_id: semantics-candidate-006.cause-002
      steps:
        - cause_id: semantics-candidate-006.cause-001
          claim: capacity_per_shift는 number 하나이며 단위가 개수 또는 시간으로 달라질 수 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:67
        - cause_id: semantics-candidate-006.cause-002
          claim: 서로 다른 물리 차원을 구별하는 속성이나 단위가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:63-67
      unresolved_beyond_evidence: 각 작업장의 실제 용량 계산 방식은 경계 내에서 확인할 수 없다.
domain_constraints_used: []
domain_context_assumptions:
  - BOM의 parent-child 관계는 제품 구성 또는 기준 소요 관계이며, 공정 중 스크랩 회수 흐름과는 의미적으로 구분된다고 가정했다.
  - 대체 가능성은 방향에 따라 안전·승인 의미가 달라질 수 있으므로 one_way와 bidirectional은 상호 대체할 수 없는 의미라고
    가정했다.
  - 검사 계획은 실행 행위가 아니라 실행 행위를 규정하는 정보 객체라고 가정했다.
  - 도면 리비전과 생산에 유효한 품목/구성 리비전은 서로 연계될 수 있지만 동일 개념일 필요는 없다고 가정했다.
  - 비율, 승수, 수량/교대 및 시간/교대는 계산에서 구분되어야 하는 수치 의미라고 가정했다.
validation:
  unaddressable_candidates: []
