per_lens_provenance:
  axiology:
    domain_constraints_used: []
    domain_context_assumptions:
      - 별도 도메인 문서는 사용하지 않았다.
      - ‘PLM/MES 통합의 개념 기준 문서’는 모든 값을 직접 소유해야 한다는 뜻이 아니라, 외부 권위·파생·동기화·충돌 처리 의미를
        일관되게 규정해야 한다는 목적을 포함한다고 해석했다.
      - 제조 운영 위험 평가는 제공된 온톨로지의 선언된 계산·생산 규칙이 실제 통합 소비자에게 사용된다는 범위로 한정했다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합 기준은 제조 정의가 실제 생산 오더와 어떤 구성으로 실행되었는지 연결할 수 있어야 한다.
      - 생산 허용과 변경 승인은 행위자·시각·근거를 추적해야 하는 통제 행위로 간주했다.
      - BOM 전개와 생산능력 계산에 사용되는 시점 의존 값은 과거 시점 재구성과 충돌 판정을 지원해야 한다.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합 기준은 생산 시점별 품목·BOM·라우팅 구성을 재현하고 구·신 리비전의 전환을 표현할 수 있어야 한다.
      - 통합 대상의 단위 집합은 ea, kg, m보다 확장될 수 있고 품목 의존적인 단위 변환이 필요할 수 있다.
      - 향후 MES 라우팅에는 선형 순서 외에 병렬, 조건부 대체, 반복 또는 재작업 흐름이 추가될 수 있다.
  logic:
    domain_constraints_used: []
    domain_context_assumptions: []
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - BOM의 parent-child 관계는 제품 구성 또는 기준 소요 관계이며, 공정 중 스크랩 회수 흐름과는 의미적으로 구분된다고
        가정했다.
      - 대체 가능성은 방향에 따라 안전·승인 의미가 달라질 수 있으므로 one_way와 bidirectional은 상호 대체할 수 없는
        의미라고 가정했다.
      - 검사 계획은 실행 행위가 아니라 실행 행위를 규정하는 정보 객체라고 가정했다.
      - 도면 리비전과 생산에 유효한 품목/구성 리비전은 서로 연계될 수 있지만 동일 개념일 필요는 없다고 가정했다.
      - 비율, 승수, 수량/교대 및 시간/교대는 계산에서 구분되어야 하는 수치 의미라고 가정했다.
  structure:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 소비자는 이 문서의 entities, ref 속성, relations, integrity_rules를 통합 개념
        계약으로 사용한다고 가정했다.
