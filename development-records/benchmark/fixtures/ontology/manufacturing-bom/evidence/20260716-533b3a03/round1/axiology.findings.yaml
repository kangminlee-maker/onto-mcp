  - candidate_id: axiology-candidate-002
    target: manufacturing-bom-ontology.yaml ECO and Part revision precedence
    evidence_anchor: manufacturing-bom-ontology.yaml:15-16,64-70,91;
      .onto/review/20260716-533b3a03/execution-preparation/review-value-alignment-criteria.yaml
      criterion_id=user-request-intent
    claim: ECO effective_date와 Part.rev 주간 동기화 예외가 변경관리 기준 문서의 목적을 약화한다.
    what: 무결성 규칙은 ECO.effective_date 이후 생산분은 신규 rev를 따른다고 하면서도 Part.rev 갱신은 도면 관리대장
      반영 후 주간 배치로 동기화한다고 둔다. Part.rev의 원본은 도면 관리대장, current_eco의 원본은 ECO 시스템으로
      나뉜다.
    why: 요청된 목적은 PLM/MES 통합 기준으로 변경관리 개념의 정합성과 제조 운영 위험을 검토하는 것이다. effective_date 기준
      생산 적용과 Part.rev의 지연 동기화를 동시에 수용하면 같은 품목의 생산 적용 rev를 ECO와 Part 속성이 서로 다르게
      말할 수 있다. 이는 변경관리의 핵심 가치인 적용 시점 기준의 명확성을 통합 기준 안에서 닫지 못한다.
    how_to_fix: 생산 적용 rev의 authoritative source를 ECO effective effectivity로 단일화하거나,
      Part.rev를 표시용/동기화 지연 projection으로 명시하고 MES 생산오더가 참조해야 할 released/effective
      revision relation을 별도로 둔다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합 기준 문서로서 변경관리 개념의 정합성과 생산 적용 위험을 줄이는 목적.
      failure_condition: ECO.effective_date는 도래했지만 Part.rev 주간 배치가 아직 반영되지 않은 기간에 MES
        또는 하위 소비자가 Part.rev를 생산 적용 기준으로 사용할 때.
      impact: 변경 적용 기준이 이중화되어 신구 리비전 혼용, 생산오더 기준 불일치, 변경관리 신뢰 저하가 발생할 수 있다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:15
        - manufacturing-bom-ontology.yaml:16
        - manufacturing-bom-ontology.yaml:64-70
        - manufacturing-bom-ontology.yaml:91
        - .onto/review/20260716-533b3a03/execution-preparation/review-value-alignment-criteria.yaml:criteria[0].statement
    causal_path:
      root_cause_candidate: 변경관리 원천과 표시 속성의 lifecycle 차이를 통합 기준에서 분리하지 않고 동일 운영 의미처럼 노출함.
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: Part.rev는 도면 관리대장 원본 속성이고 current_eco는 ECO 시스템 원본 속성으로 모델링되어 있다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:15
            - manufacturing-bom-ontology.yaml:16
        - cause_id: axiology-candidate-002.cause-002
          claim: ECO effective_date 이후 생산분은 신규 rev를 따른다고 하면서 Part.rev 갱신은 주간 배치로 지연된다고
            규정한다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:91
        - cause_id: axiology-candidate-002.cause-003
          claim: 그 결과 변경관리 적용 시점 기준이 PLM/MES 통합 목적에서 요구되는 개념 정합성을 충분히 보장하지 못한다.
          relation_to_previous: causes
          evidence_refs:
            - .onto/review/20260716-533b3a03/execution-preparation/review-value-alignment-criteria.yaml:criteria[0].statement
            - manufacturing-bom-ontology.yaml:2
      unresolved_beyond_evidence: 경계 내에는 MES 생산오더가 실제로 어떤 필드를 읽는지에 대한 소비자 구현이 없으므로,
        위험은 개념 기준 문서의 소비 가능성에 한정된다.
  - candidate_id: axiology-candidate-003
    target: manufacturing-bom-ontology.yaml BOM acyclicity exception for scrap reinput
    evidence_anchor: manufacturing-bom-ontology.yaml:24-30,88-89;
      .onto/review/20260716-533b3a03/execution-preparation/review-value-alignment-criteria.yaml
      criterion_id=user-request-intent
    claim: 스크랩 재투입을 Assembly 자기 하위 포함으로 모델링하는 예외는 BOM 정합성보다 표현 편의를 우선하는 목적 drift다.
    what: 무결성 규칙은 BOM은 비순환이어야 한다고 선언한 뒤, 재생 원료 회수 공정은 Assembly가 자기 하위에 자신을 포함하는 형태로
      모델링한다고 예외를 둔다.
    why: 검토 목적은 PLM/MES 통합 기준 문서로서 BOM 개념 정합성과 제조 운영 위험을 다루는 것이다. 스크랩 재투입은
      공정/수율/재고흐름 개념으로 분리될 수 있는 운영 현상인데, 이를 BOM 자기 참조 예외로 수용하면 BOM의 기본 가치 약속인 구성
      계층의 안정성을 훼손한다. 이는 특정 공정 표현을 쉽게 하기 위해 전체 BOM 소비자의 순환 금지 기대를 약화하는 tradeoff다.
    how_to_fix: BOM 비순환 규칙은 유지하고, 스크랩 재투입은 별도 Rework/RecycledInput/ProcessYield
      relation 또는 Operation input/output 흐름으로 모델링해 BOM 계층과 공정 순환을 분리한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합 기준 문서로서 BOM 개념 정합성과 제조 운영 위험을 관리하는 목적.
      failure_condition: BOM 폭발, 자재소요량 계산, 변경 영향 분석 같은 소비자가 BOM 비순환성을 전제로 동작하는데 이 예외
        자기참조를 일반 BOM line으로 받는 경우.
      impact: 하나의 공정 예외 때문에 BOM 전체의 계층 신뢰가 약해지고, 통합 소비자가 순환 처리 예외를 각자 해석해야 하므로 기준 문서의
        가치가 감소한다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:24-30
        - manufacturing-bom-ontology.yaml:88-89
        - .onto/review/20260716-533b3a03/execution-preparation/review-value-alignment-criteria.yaml:criteria[0].statement
    causal_path:
      root_cause_candidate: 공정 재투입 현상을 BOM 구성관계 안에 예외로 압축해 표현함.
      root_cause_step_id: axiology-candidate-003.cause-003
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: BomLine은 상위 Assembly가 하위 Part를 얼마나 쓰는지 나타내는 BOM 구성 행이다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:24-30
        - cause_id: axiology-candidate-003.cause-002
          claim: 무결성 규칙은 BOM 비순환을 선언하면서 스크랩 재투입은 Assembly 자기 하위 포함으로 모델링한다고 예외를 둔다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:88-89
        - cause_id: axiology-candidate-003.cause-003
          claim: 이 예외는 BOM 개념 정합성과 제조 운영 위험 중심의 통합 기준 목적을 약화한다.
          relation_to_previous: causes
          evidence_refs:
            - .onto/review/20260716-533b3a03/execution-preparation/review-value-alignment-criteria.yaml:criteria[0].statement
            - manufacturing-bom-ontology.yaml:2
      unresolved_beyond_evidence: 경계 내에는 BOM 소비 알고리즘이 없으므로 실제 런타임 장애가 아니라 통합 기준으로 채택될
        때의 가치/목적 정렬 위험으로 한정한다.
