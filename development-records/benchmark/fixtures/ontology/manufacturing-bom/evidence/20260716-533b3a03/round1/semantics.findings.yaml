findings:
  - candidate_id: semantics-candidate-001
    target: BomLine.scrap_rate
    evidence_anchor: 'manufacturing-bom-ontology.yaml >
      entities.BomLine.attributes.scrap_rate note: "공정 불량 감안 계수. 생산계획팀 엑셀로 별도
      관리되는 값을 복사해 둔다."'
    claim: scrap_rate가 독립 원천값처럼 모델링되어 공정 불량률이라는 파생/운영 의미와 충돌한다.
    what: BOM 라인의 scrap_rate는 공정 불량을 감안하는 값이라고 정의되어 있지만, 생산계획팀 엑셀 값을 복사해 둔다고 되어 있어
      온톨로지 안에서 원천 의미와 책임 소재가 불명확한 중복 입력값이 된다.
    why: scrap_rate라는 이름은 제조 운영에서 공정·품목·기간·작업조건에 따라 계산 또는 관리되는 불량/스크랩 계수를 뜻하는데, 현재
      모델은 BomLine의 정적 속성으로 두면서 별도 엑셀 원본을 복사한다고만 한다. PLM/MES 통합 기준 문서에서 이 값이 BOM
      구조 의미인지, 공정 실적/계획 파라미터인지, 외부 계획계 원천값인지 구분되지 않으면 생산 소요량 계산과 MES 실행 기준이 서로
      다른 값을 참조할 수 있다.
    how_to_fix: scrap_rate를 BOM 구조의 고정 속성으로 둘지, 공정/라우팅 단계의 yield 또는 scrap factor로
      둘지, 외부 계획계 원천의 참조값으로 둘지 의미를 하나로 정한다. 외부 원천을 유지한다면 BomLine에는 원천 참조와 적용
      범위/유효일자를 두고 복사본을 기준값처럼 쓰지 않도록 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 BOM과 공정 기준값의 의미를 일관되게 제공하는 목적.
      failure_condition: BOM 구성 수량과 공정 불량 보정값이 함께 소요량 산정에 쓰이는 상황에서, BomLine.scrap_rate
        복사값과 생산계획팀 엑셀 원본 또는 공정 기준값이 달라지는 경우.
      impact: 동일 품목/BOM에 대해 PLM, MES, 생산계획 엑셀이 서로 다른 스크랩 의미와 값을 기준으로 삼아 자재 소요량, 생산오더
        수량, 원가 산정의 신뢰를 약화시킨다.
      evidence_refs:
        - 'manufacturing-bom-ontology.yaml > BomLine.definition: "BOM 한 줄: 상위
          품목이 하위 품목을 얼마나 쓰는지."'
        - manufacturing-bom-ontology.yaml > BomLine.attributes.qty_per
        - manufacturing-bom-ontology.yaml > BomLine.attributes.scrap_rate note
    causal_path:
      root_cause_candidate: scrap_rate의 의미 권위가 BOM 구조, 공정 불량 기준, 외부 생산계획 엑셀 복사값 사이에서 하나로 정해지지 않았다.
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: BomLine은 상위 품목이 하위 품목을 얼마나 쓰는지 나타내는 BOM 구조 단위로 정의되어 있다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > BomLine.definition
            - manufacturing-bom-ontology.yaml > BomLine.attributes.parent_ref
            - manufacturing-bom-ontology.yaml > BomLine.attributes.child_ref
            - manufacturing-bom-ontology.yaml > BomLine.attributes.qty_per
        - cause_id: semantics-candidate-001.cause-002
          claim: 같은 BomLine에 공정 불량 감안 계수인 scrap_rate가 포함되어 있다.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml > BomLine.attributes.scrap_rate
              note
        - cause_id: semantics-candidate-001.cause-003
          claim: scrap_rate 값은 생산계획팀 엑셀로 별도 관리되는 값을 복사한다고 되어 있어 이 온톨로지 내 원천 의미가 복사본으로
            표현된다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml > BomLine.attributes.scrap_rate
              note
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: AlternatePart
    evidence_anchor: manufacturing-bom-ontology.yaml >
      entities.AlternatePart.definition and attributes.direction note
    claim: AlternatePart의 정의는 대체 관계를 대칭으로 말하지만 direction 속성은 기본 one_way를 허용해 같은 개념
      안에서 의미가 충돌한다.
    what: 정의에는 'A의 대체가 B이면 B의 대체도 A'라고 되어 있어 대체 가능 관계를 양방향 관계로 설명한다. 그러나 direction
      속성은 one_way와 bidirectional 값을 가지며 기본은 one_way라고 되어 있다.
    why: 대체품 관계는 단방향 승인 대체와 상호 호환 대체가 운영상 다른 의미를 갖는다. 현재 이름과 정의는 양방향 대체를 뜻하는데 속성은
      단방향 대체를 기본으로 하므로, PLM의 승인 대체와 MES의 실제 투입 허용 판단에서 서로 다른 의미로 해석될 수 있다.
    how_to_fix: 개념을 `PartSubstitution`처럼 방향성이 있는 대체 승인으로 재정의하거나, 정말 `AlternatePart`가
      상호 호환 관계라면 direction을 제거하고 양방향 의미만 허용한다. 두 의미가 모두 필요하면 단방향
      `SubstitutionRule`과 양방향 `InterchangeablePart`를 구분한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 품목 대체 개념을 PLM/MES 통합 기준으로 일관되게 해석하게 하는 목적.
      failure_condition: 대체품 승인이나 생산 투입 가능 여부를 판단할 때 한 시스템은 AlternatePart 정의를 양방향으로
        해석하고 다른 시스템은 direction 기본값 one_way를 적용하는 경우.
      impact: 승인되지 않은 역방향 대체 투입 또는 허용되어야 할 대체 투입 차단으로 제조 실행과 변경관리 기준의 신뢰가 약화된다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml > AlternatePart.definition
        - manufacturing-bom-ontology.yaml > AlternatePart.attributes.direction
          values
        - manufacturing-bom-ontology.yaml > AlternatePart.attributes.direction
          note
    causal_path:
      root_cause_candidate: 상호 호환 대체와 방향성 있는 대체 승인이라는 서로 다른 의미를 AlternatePart 하나에 섞었다.
      root_cause_step_id: semantics-candidate-002.cause-003
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: AlternatePart 정의는 A와 B의 대체 관계를 대칭 관계로 설명한다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > AlternatePart.definition
        - cause_id: semantics-candidate-002.cause-002
          claim: AlternatePart.direction은 one_way와 bidirectional을 모두 허용하고 기본값을 one_way로
            둔다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              AlternatePart.attributes.direction
        - cause_id: semantics-candidate-002.cause-003
          claim: 따라서 같은 AlternatePart 인스턴스가 정의상 양방향 대체인지, 속성상 단방향 대체 승인인지 불명확하다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml > AlternatePart.definition
            - manufacturing-bom-ontology.yaml >
              AlternatePart.attributes.direction note
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-003
    target: InspectionPlan
    evidence_anchor: 'manufacturing-bom-ontology.yaml >
      entities.InspectionPlan.definition: "검사 계획. 검사도 하나의 Operation으로 라우팅에
      포함되므로, 본 엔티티는 Operation의 검사 파라미터 확장이다." and is_a: Operation'
    claim: InspectionPlan은 계획/파라미터 집합인데 Operation의 하위 유형으로 모델링되어 존재론적 유형이 맞지 않는다.
    what: "InspectionPlan은 검사 계획과 검사 파라미터 확장으로 정의되어 있다. 하지만 is_a: Operation으로 되어 있어
      실제 수행 단계인 Operation의 한 종류처럼 분류된다."
    why: Operation은 라우팅의 한 공정 단계이고 작업장 및 표준시간을 가진 실행 단계로 정의된다. InspectionPlan은
      sampling_rule과 acceptance_criteria 같은 검사 기준을 담는 계획/규칙 묶음이다. 검사 작업 자체는
      Operation일 수 있지만 검사 계획은 Operation 인스턴스에 필수적인 실행 단계가 아니므로 상속 관계가 의미적으로
      부정확하다.
    how_to_fix: "InspectionPlan을 Operation의 하위 유형이 아니라 검사 Operation에 연결되는 계획/기준 엔티티로
      분리한다. 예: `InspectionOperation is_a Operation`과 `InspectionPlan`을 분리하고,
      InspectionOperation이 InspectionPlan을 참조하게 한다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 라우팅·공정·검사 개념을 PLM/MES 통합 기준으로 정확히 구분하는 목적.
      failure_condition: MES 라우팅에서 Operation 공통 속성(work_center, std_time_min)을
        InspectionPlan에도 실행 단계처럼 요구하거나, 검사 기준 변경을 라우팅 공정 변경으로 오인하는 경우.
      impact: 검사 기준 문서/품질 SOP와 제조 실행 단계가 혼동되어 변경관리와 라우팅 릴리즈 판단의 의미적 신뢰가 떨어진다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml > Operation.definition
        - manufacturing-bom-ontology.yaml > Operation.attributes.work_center
        - manufacturing-bom-ontology.yaml > Operation.attributes.std_time_min
        - manufacturing-bom-ontology.yaml > InspectionPlan.definition
        - manufacturing-bom-ontology.yaml > InspectionPlan.is_a
        - manufacturing-bom-ontology.yaml >
          InspectionPlan.attributes.sampling_rule
        - manufacturing-bom-ontology.yaml >
          InspectionPlan.attributes.acceptance_criteria
    causal_path:
      root_cause_candidate: 검사 작업 단계와 검사 계획/기준 문서라는 다른 존재론적 유형을 `InspectionPlan is_a
        Operation`으로 합쳤다.
      root_cause_step_id: semantics-candidate-003.cause-003
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: Operation은 라우팅의 한 공정 단계로 정의되며 work_center와 std_time_min 같은 실행 속성을 가진다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > Operation.definition
            - manufacturing-bom-ontology.yaml > Operation.attributes.work_center
            - manufacturing-bom-ontology.yaml > Operation.attributes.std_time_min
        - cause_id: semantics-candidate-003.cause-002
          claim: InspectionPlan은 검사 계획 및 검사 파라미터 확장으로 정의되고 sampling_rule,
            acceptance_criteria를 가진다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml > InspectionPlan.definition
            - manufacturing-bom-ontology.yaml >
              InspectionPlan.attributes.sampling_rule
            - manufacturing-bom-ontology.yaml >
              InspectionPlan.attributes.acceptance_criteria
        - cause_id: semantics-candidate-003.cause-003
          claim: 그럼에도 InspectionPlan은 Operation의 하위 유형으로 선언되어 계획/기준이 실행 단계로 분류된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - manufacturing-bom-ontology.yaml > InspectionPlan.is_a
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-004
    target: WorkCenter.capacity_per_shift
    evidence_anchor: 'manufacturing-bom-ontology.yaml >
      entities.WorkCenter.attributes.capacity_per_shift note: "교대당 처리 능력. 단위는
      작업장마다 다르다(개수 또는 시간)."'
    claim: capacity_per_shift가 단위 의미를 포함하지 않아 서로 다른 물리량을 같은 속성명으로 섞는다.
    what: capacity_per_shift는 숫자 하나로 정의되어 있는데, 단위가 작업장마다 개수 또는 시간으로 달라진다고 되어 있다.
    why: 개수/교대와 시간/교대는 같은 'capacity'라는 말로 묶일 수는 있어도 계산 의미가 다른 물리량이다. 단위가 속성 의미에 포함되지
      않으면 같은 필드의 값끼리 비교, 합산, 병목 판단을 할 때 의미적으로 동등하지 않은 값이 섞인다.
    how_to_fix: capacity_per_shift에 명시적 단위 또는 capacity_type을 추가하거나,
      `unit_capacity_per_shift`와 `available_time_per_shift_min`처럼 서로 다른 의미의 능력을
      분리한다. 가능한 경우 Operation.std_time_min과 호환되는 시간 기반 능력으로 기준 단위를 정한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: MES 라우팅과 작업장 능력 기준을 통합 운영 계산에 일관되게 제공하는 목적.
      failure_condition: 작업장별 capacity_per_shift를 사용해 생산 가능량, 병목, 부하를 계산하거나 비교할 때 일부
        값은 개수이고 일부 값은 시간인 경우.
      impact: 동일 속성의 숫자가 서로 다른 의미를 가져 생산계획·MES 부하 계산에서 잘못된 비교와 산정이 발생할 수 있다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml > WorkCenter.definition
        - manufacturing-bom-ontology.yaml >
          WorkCenter.attributes.capacity_per_shift note
        - manufacturing-bom-ontology.yaml > Operation.attributes.work_center
        - manufacturing-bom-ontology.yaml > Operation.attributes.std_time_min
    causal_path:
      root_cause_candidate: 작업장 처리 능력의 측정 차원과 단위가 capacity_per_shift 속성 의미에 포함되지 않았다.
      root_cause_step_id: semantics-candidate-004.cause-003
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: WorkCenter는 공정이 수행되는 작업장/설비 그룹으로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml > WorkCenter.definition
        - cause_id: semantics-candidate-004.cause-002
          claim: Operation은 WorkCenter에서 수행되고 std_time_min을 가진다.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml > Operation.attributes.work_center
            - manufacturing-bom-ontology.yaml > Operation.attributes.std_time_min
        - cause_id: semantics-candidate-004.cause-003
          claim: WorkCenter.capacity_per_shift는 단위가 작업장마다 개수 또는 시간으로 다르다고 명시한다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml >
              WorkCenter.attributes.capacity_per_shift note
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - 일반 제조 PLM/MES 통합에서 BOM 구성 수량, 라우팅 공정, 작업장 능력, 대체품 승인, 검사 계획은 서로 다른 운영 의미와 원천
    권위를 가져야 한다는 상식적 도메인 전제를 사용했다.
  - session_domain이 none이므로 별도 도메인 문서나 외부 표준은 사용하지 않았다.
validation:
