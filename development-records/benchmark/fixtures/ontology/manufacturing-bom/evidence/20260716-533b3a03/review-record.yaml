        작업장마다 다르다(개수 또는 시간).\" Source finding context: capacity_per_shift가 단위
        의미를 포함하지 않아 서로 다른 물리량을 같은 속성명으로 섞는다. Source finding context: 개수/교대와
        시간/교대는 같은 'capacity'라는 말로 묶일 수는 있어도 계산 의미가 다른 물리량이다. 단위가 속성 의미에 포함되지 않으면
        같은 필드의 값끼리 비교, 합산, 병목 판단을 할 때 의미적으로 동등하지 않은 값이 섞인다. Source finding
        context: capacity_per_shift에 명시적 단위 또는 capacity_type을 추가하거나,
        `unit_capacity_per_shift`와 `available_time_per_shift_min`처럼 서로 다른 의미의
        능력을 분리한다. 가능한 경우 Operation.std_time_min과 호환되는 시간 기반 능력으로 기준 단위를 정한다.
