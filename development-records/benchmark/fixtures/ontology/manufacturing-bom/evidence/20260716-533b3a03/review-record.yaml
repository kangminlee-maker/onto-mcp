      rationale: "Applicable lenses consistently support this missing unit/basis
        semantics issue. The attribute can represent different physical
        quantities, which can make planning, comparison, bottleneck analysis,
        and load calculations incorrect unless resolved before downstream
        operational use. Source finding context: WorkCenter.capacity_per_shift
