      problem_definition: The ontology lacks a reusable governed operational-value
        contract for cross-system manufacturing values, including source
        authority, precedence, unit and quantity basis, synchronization or
        reconciliation responsibility, and control/action evidence.
      issue_statement: "Shared-root issue across finding-001, finding-007,
        finding-006, finding-011, finding-005: The ontology lacks a reusable
        source-authority and precedence contract for operational values, so
        cross-system values are left as ad hoc notes, copies, or manual
        reconciliations instead of governed integration concepts. / The
        integration baseline treats production quantity semantics as local
        attributes or field practice rather than canonical governed value
        contracts. / The ontology represents operational planning capacities as
        bare numbers without canonical unit/basis authority, forcing consumers
        to infer meaning from local practice. / The ontology omits a governed
        control/action layer for cross-system values, so approvals, copies,
        reconciliations, and authority precedence are only described as outcomes
        or notes. Source finding context: manufacturing-bom-ontology.yaml
