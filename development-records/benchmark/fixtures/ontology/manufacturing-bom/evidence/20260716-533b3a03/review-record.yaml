        불량률이라는 파생/운영 의미와 충돌한다. Source finding context: scrap_rate라는 이름은 제조 운영에서
        공정·품목·기간·작업조건에 따라 계산 또는 관리되는 불량/스크랩 계수를 뜻하는데, 현재 모델은 BomLine의 정적 속성으로
        두면서 별도 엑셀 원본을 복사한다고만 한다. PLM/MES 통합 기준 문서에서 이 값이 BOM 구조 의미인지, 공정 실적/계획
        파라미터인지, 외부 계획계 원천값인지 구분되지 않으면 생산 소요량 계산과 MES 실행 기준이 서로 다른 값을 참조할 수 있다.
        Source finding context: scrap_rate를 BOM 구조의 고정 속성으로 둘지, 공정/라우팅 단계의 yield
