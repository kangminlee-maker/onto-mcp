    - issue_id: issue-008
      candidates: *a9
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "The issue is primarily a semantic concept-split problem: one concept
        carries two incompatible meanings. Because unauthorized reverse
        substitutions or blocked valid substitutions can affect manufacturing
        execution and change-control decisions, the contradiction should be
        corrected in the target. Source finding context: AlternatePart Source
        finding context: manufacturing-bom-ontology.yaml >
        entities.AlternatePart.definition and attributes.direction note Source
        finding context: AlternatePart의 정의는 대체 관계를 대칭으로 말하지만 direction 속성은 기본
        one_way를 허용해 같은 개념 안에서 의미가 충돌한다. Source finding context: 대체품 관계는 단방향 승인
        대체와 상호 호환 대체가 운영상 다른 의미를 갖는다. 현재 이름과 정의는 양방향 대체를 뜻하는데 속성은 단방향 대체를 기본으로
        하므로, PLM의 승인 대체와 MES의 실제 투입 허용 판단에서 서로 다른 의미로 해석될 수 있다. Source finding
        context: 개념을 `PartSubstitution`처럼 방향성이 있는 대체 승인으로 재정의하거나, 정말
        `AlternatePart`가 상호 호환 관계라면 direction을 제거하고 양방향 의미만 허용한다. 두 의미가 모두 필요하면
        단방향 `SubstitutionRule`과 양방향 `InterchangeablePart`를 구분한다. Source finding
        context:
        .onto/review/20260716-533b3a03/round1/semantics.findings.yaml#semantics\
        -candidate-002 Source finding context: 품목 대체 개념을 PLM/MES 통합 기준으로 일관되게
        해석하게 하는 목적. Source finding context: 대체품 승인이나 생산 투입 가능 여부를 판단할 때 한 시스템은
        AlternatePart 정의를 양방향으로 해석하고 다른 시스템은 direction 기본값 one_way를 적용하는 경우.
        Source finding context: 승인되지 않은 역방향 대체 투입 또는 허용되어야 할 대체 투입 차단으로 제조 실행과
        변경관리 기준의 신뢰가 약화된다. Source finding context: 상호 호환 대체와 방향성 있는 대체 승인이라는 서로
        다른 의미를 AlternatePart 하나에 섞었다. Source finding context: AlternatePart 정의는
        A와 B의 대체 관계를 대칭 관계로 설명한다. Source finding context:
        AlternatePart.direction은 one_way와 bidirectional을 모두 허용하고 기본값을 one_way로
        둔다. Source finding context: 따라서 같은 AlternatePart 인스턴스가 정의상 양방향 대체인지, 속성상
        단방향 대체 승인인지 불명확하다."
