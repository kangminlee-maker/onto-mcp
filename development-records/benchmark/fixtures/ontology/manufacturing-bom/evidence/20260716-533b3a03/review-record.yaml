        PLM/MES integration concept baseline for parts, BOM, process, routing,
        and change concepts. Source finding context: When an integration or
        validator treats the relations section as the authoritative structural
        graph, alternate-part substitutions are represented without a path to
        the AlternatePart entity that holds directionality. Source finding
        context: This weakens review trust and actionability because a
        manufacturing substitution concept can be present in entities but absent
        from the navigable relation structure, making one-way versus
        bidirectional substitution easy to lose in downstream mappings. Source
        finding context: The relation section models alternate parts as a
        Part-to-Part shortcut instead of connecting the declared AlternatePart
        relationship entity. Source finding context: AlternatePart is declared
        as the structural carrier for primary_ref, alternate_ref, and direction.
        Source finding context: The explicit relations list does not include
        AlternatePart as either a from or to endpoint. Source finding context:
        The only alternate relation is a Part-to-Part shortcut noted as being
        expressed through AlternatePart, leaving the carrier entity outside the
        relation graph."
