        finding context: These two claims cannot both govern the same
        AlternatePart instance without an extra precedence rule: a one_way
        alternate is not symmetric, while the definition makes symmetry
        necessary for all alternate relationships. This creates an inter-claim
        satisfiability conflict inside the model's substitution concept. Source
