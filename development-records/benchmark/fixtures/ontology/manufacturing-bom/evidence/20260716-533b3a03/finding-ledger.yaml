  - finding_id: finding-012
    lens_id: logic
    source_ref: .onto/review/20260716-533b3a03/round1/logic.findings.yaml#logic-candidate-001
    target: manufacturing-bom-ontology.yaml / entities.AlternatePart
    evidence_anchor: .onto/review/20260716-533b3a03/execution-preparation/materialized-input.md:37-45
    claim: AlternatePart is defined as symmetric, while its direction attribute
      permits and defaults to one_way.
    lens_rationale_summary: "These two claims cannot both govern the same
      AlternatePart instance without an extra precedence rule: a one_way
      alternate is not symmetric, while the definition makes symmetry necessary
      for all alternate relationships. This creates an inter-claim
      satisfiability conflict inside the model's substitution concept."
    proposed_action: "Choose one authority: either make AlternatePart inherently
      bidirectional and remove direction/one_way, or redefine the entity as
      directional by default and state that symmetry applies only when
      direction=bidirectional."
    affected_purpose: PLM/MES integration concept baseline for item substitution and
      alternate-part behavior.
    failure_condition: When an alternate part is modeled with direction=one_way, the
      same ontology also requires the reverse alternate relationship to hold.
    impact: Consumers cannot determine whether substitution is reversible, which
      weakens integration trust for manufacturing execution, planning, and
      change-control decisions that depend on valid substitute-part direction.
    evidence_refs:
      - .onto/review/20260716-533b3a03/round1/logic.findings.yaml#logic-candidate-001
      - .onto/review/20260716-533b3a03/execution-preparation/materialized-input.md:37-45
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES integration concept baseline for item substitution and
        alternate-part behavior.
      failure_condition: When an alternate part is modeled with direction=one_way, the
        same ontology also requires the reverse alternate relationship to hold.
      impact: Consumers cannot determine whether substitution is reversible, which
        weakens integration trust for manufacturing execution, planning, and
        change-control decisions that depend on valid substitute-part direction.
      evidence_refs:
        - .onto/review/20260716-533b3a03/execution-preparation/materialized-input.md:37-45
    causal_path:
      root_cause_candidate: "The ontology assigns two incompatible modalities to
        alternate-part direction: necessary symmetry in the definition and
        possible one-way direction in the attribute contract."
      root_cause_step_id: finding-012.cause-003
      steps:
        - cause_id: finding-012.cause-001
          claim: AlternatePart's definition makes the alternate relation symmetric for
            every A/B pair.
          relation_to_previous: null
          evidence_refs:
            - .onto/review/20260716-533b3a03/execution-preparation/materialized-input.md:37-38
        - cause_id: finding-012.cause-002
          claim: AlternatePart.direction permits one_way and notes that one_way is the
            default.
          relation_to_previous: causes
          evidence_refs:
            - .onto/review/20260716-533b3a03/execution-preparation/materialized-input.md:42-45
        - cause_id: finding-012.cause-003
          claim: A default one_way alternate instance cannot satisfy the necessary
            symmetric alternate definition unless an unstated precedence or
            exception rule overrides one of the claims.
          relation_to_previous: causes
          evidence_refs:
            - .onto/review/20260716-533b3a03/execution-preparation/materialized-input.md:37-45
      unresolved_beyond_evidence: No domain document was available; this finding is
        limited to the explicit claim set and does not judge which substitution
        semantics is operationally preferable.
