    evidence_anchor: manufacturing-bom-ontology.yaml:30,62,94-95;
      .onto/review/20260716-533b3a03/execution-preparation/review-value-alignment-criteria.yaml
      criterion_id=user-request-intent
    claim: PLM/MES 통합 기준 문서가 생산 핵심 수량·능력·원가 값을 현장/엑셀/수기 입력에 맡기는 전제를 수용해 목적 정렬이 약해진다.
    lens_rationale_summary: 권위 기준은 이 산출물의 목적을 'PLM/MES 통합의 개념 기준 문서' 및
      '품목·BOM·라우팅·변경관리 개념의 정합성과 제조 운영 위험' 검토로 확정한다. 그런데 대상은 통합 기준이 되어야 할 제조 핵심
      값들을 통합 모델의 원천/단위/환산 규칙으로 닫지 않고 외부 수기 관행에 위임한다. 이는 개념 기준 문서가 운영 위험을 줄이는 대신
      기존 단절을 정당화하는 hidden tradeoff를 만든다.
    proposed_action: scrap_rate, capacity_per_shift, std_time, uom conversion에 대해 원천
      시스템, 단위, 적용 시점, 대사/동기화 책임을 온톨로지 안에서 명시하고, 수기/현장 환산은 예외 상태로 모델링한다.
    affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목·BOM·라우팅 개념 정합성과 제조 운영 위험을 관리하는 목적.
    failure_condition: 생산계획, MES, 표준원가, 현장 환산이 서로 다른 원천과 단위를 유지한 채 이 온톨로지를 기준으로 통합할 때.
    impact: 통합 기준이 핵심 운영 값을 표준화하지 못해 생산수량, 능력계획, 원가계산의 해석 차이가 그대로 남고, 리뷰 목적상 중요한 제조
      운영 위험을 닫지 못한다.
