  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260716-533b3a03/round1/axiology.findings.yaml#axiology-candidate-002
    target: manufacturing-bom-ontology.yaml ECO and Part revision precedence
    evidence_anchor: manufacturing-bom-ontology.yaml:15-16,64-70,91;
      .onto/review/20260716-533b3a03/execution-preparation/review-value-alignment-criteria.yaml
      criterion_id=user-request-intent
    claim: ECO effective_date와 Part.rev 주간 동기화 예외가 변경관리 기준 문서의 목적을 약화한다.
    lens_rationale_summary: 요청된 목적은 PLM/MES 통합 기준으로 변경관리 개념의 정합성과 제조 운영 위험을 검토하는
      것이다. effective_date 기준 생산 적용과 Part.rev의 지연 동기화를 동시에 수용하면 같은 품목의 생산 적용 rev를
      ECO와 Part 속성이 서로 다르게 말할 수 있다. 이는 변경관리의 핵심 가치인 적용 시점 기준의 명확성을 통합 기준 안에서 닫지
      못한다.
    proposed_action: 생산 적용 rev의 authoritative source를 ECO effective effectivity로
      단일화하거나, Part.rev를 표시용/동기화 지연 projection으로 명시하고 MES 생산오더가 참조해야 할
      released/effective revision relation을 별도로 둔다.
    affected_purpose: PLM/MES 통합 기준 문서로서 변경관리 개념의 정합성과 생산 적용 위험을 줄이는 목적.
    failure_condition: ECO.effective_date는 도래했지만 Part.rev 주간 배치가 아직 반영되지 않은 기간에 MES
      또는 하위 소비자가 Part.rev를 생산 적용 기준으로 사용할 때.
    impact: 변경 적용 기준이 이중화되어 신구 리비전 혼용, 생산오더 기준 불일치, 변경관리 신뢰 저하가 발생할 수 있다.
    evidence_refs:
      - .onto/review/20260716-533b3a03/round1/axiology.findings.yaml#axiology-candidate-002
      - manufacturing-bom-ontology.yaml:15
      - manufacturing-bom-ontology.yaml:16
      - manufacturing-bom-ontology.yaml:64-70
      - manufacturing-bom-ontology.yaml:91
      - .onto/review/20260716-533b3a03/execution-preparation/review-value-alignment-criteria.yaml:criteria[0].statement
    severity: medium
    domain_threshold_used: null
