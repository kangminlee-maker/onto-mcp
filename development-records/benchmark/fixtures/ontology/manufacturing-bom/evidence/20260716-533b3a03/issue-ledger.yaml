  - issue_id: issue-007
    root_cause_hypothesis: BomLine.scrap_rate has no settled semantic authority
      among BOM structure, process scrap/yield, and an external
      production-planning Excel copy.
    root_confidence: medium
    surface_finding_ids:
      - finding-013
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: scrap_rate is placed on BomLine as if it were a stable BOM
      value, but its note describes a process-defect factor copied from a
      separately managed production-planning Excel source.
    proposed_action: Decide whether scrap_rate belongs to BOM structure,
      routing/process yield, or an external planning reference; if external
      authority remains, model source reference, scope, and validity rather than
      treating the copy as canonical.
    affected_purpose: PLM/MES integration concept baseline for consistent BOM and
      process calculation semantics.
    failure_condition: When BOM quantity and process scrap adjustments are both used
      for material requirement, production-order quantity, or costing, and the
