  - issue_id: issue-002
    root_cause_hypothesis: The ontology localizes change applicability in Part
      current state and ECO effective_date instead of modeling
      effectivity/history as a shared dimension of BOM, routing, operation, and
      inspection-related production definitions.
    root_confidence: medium
    surface_finding_ids:
      - finding-002
      - finding-008
      - finding-004
      - finding-015
    relation_refs:
      - rel-006
      - rel-007
      - rel-017
    raised_by_lens_ids:
      - axiology
      - evolution
      - coverage
      - semantics
    issue_statement: Production change applicability cannot be reconstructed
      reliably because ECO and Part revision timing do not propagate into
      date-effective BOM/routing state, and inspection definitions are not
      cleanly separated for versioned production changes.
    proposed_action: Model effectivity/history as an independent
      production-definition concept covering Part, BomLine, Routing, Operation,
      and inspection criteria, with Part.current_eco or Part.rev treated as
      current views rather than sole authority.
    affected_purpose: PLM/MES integration concept baseline for item, BOM, routing,
      inspection, and change-management alignment across production dates.
    failure_condition: When ECOs overlap, apply only to BOM lines or
      routing/inspection steps, or when production records must be interpreted
      during the period after ECO.effective_date but before weekly Part.rev
      synchronization.
    impact: PLM and MES consumers can disagree about which revision, BOM, routing
      parameter, or inspection criterion applied to a production order,
      weakening traceability, costing, quality investigation, and change-control
      trust.
    evidence_refs:
