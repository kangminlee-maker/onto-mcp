  - issue_id: issue-006
    root_cause_hypothesis: Alternate-part substitution is split between an entity
      that carries direction semantics and a Part-to-Part shortcut relation,
      leaving no single authoritative structural representation of substitution
      behavior.
    root_confidence: medium
    surface_finding_ids:
      - finding-012
      - finding-017
    relation_refs:
      - rel-015
    raised_by_lens_ids:
      - logic
      - structure
    issue_statement: "Shared-root issue across finding-012, finding-017:
      Alternate-part substitution is split between an entity that carries
      direction semantics and a Part-to-Part shortcut relation, leaving no
      single authoritative structural representation of substitution behavior."
    proposed_action: "Choose one authority: either make AlternatePart inherently
      bidirectional and remove direction/one_way, or redefine the entity as
      directional by default and state that symmetry applies only when
      direction=bidirectional. / Add explicit relations such as AlternatePart ->
      Part primary_part and AlternatePart -> Part alternate_part, and either
      remove the Part -> Part shortcut or mark it as a derived projection of
      those two relations so the carrier entity remains connected."
    affected_purpose: PLM/MES integration concept baseline for item substitution and
      alternate-part behavior. / The ontology is declared as a PLM/MES
      integration concept baseline for parts, BOM, process, routing, and change
      concepts.
    failure_condition: When an alternate part is modeled with direction=one_way, the
      same ontology also requires the reverse alternate relationship to hold. /
      When an integration or validator treats the relations section as the
      authoritative structural graph, alternate-part substitutions are
      represented without a path to the AlternatePart entity that holds
      directionality.
    impact: Consumers cannot determine whether substitution is reversible, which
      weakens integration trust for manufacturing execution, planning, and
      change-control decisions that depend on valid substitute-part direction. /
      This weakens review trust and actionability because a manufacturing
      substitution concept can be present in entities but absent from the
      navigable relation structure, making one-way versus bidirectional
      substitution easy to lose in downstream mappings.
    evidence_refs:
      - .onto/review/20260716-533b3a03/round1/logic.findings.yaml#logic-candidate-001
