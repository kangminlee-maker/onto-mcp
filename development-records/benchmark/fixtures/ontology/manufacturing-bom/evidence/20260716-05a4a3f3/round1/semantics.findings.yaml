domain_context_assumptions:
  - 제품구조의 구성 관계와 제조공정의 스크랩·재작업 환류 관계는 서로 다른 의미를 가진다.
  - 일방향 승인 대체와 상호 호환은 제조 운영에서 구별되어야 한다.
  - 검사 계획은 검사 활동을 규정하는 정보 객체이며 검사 활동 자체와 동일하지 않다.
  - 처리량과 가용시간은 단위 차원이 다른 작업장 능력 측정값이다.
