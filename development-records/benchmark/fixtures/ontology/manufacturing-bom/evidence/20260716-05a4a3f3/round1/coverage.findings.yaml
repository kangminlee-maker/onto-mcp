domain_context_assumptions:
  - PLM/MES 통합의 개념 기준 문서는 특정 생산 시점에 적용된 품목·BOM·라우팅 구성을 재구성할 수 있어야 한다.
  - 생산 오더 생성 규칙을 포함한 모델은 최소한 설계·공정 기준에서 MES 실행 객체로 이어지는 인계 개념을 포함해야 한다.
  - 수량·표준시간·스크랩률처럼 운영 계산에 쓰이는 값은 단위, 시점, 권위 출처와 감사 가능한 변경 근거가 필요하다.
