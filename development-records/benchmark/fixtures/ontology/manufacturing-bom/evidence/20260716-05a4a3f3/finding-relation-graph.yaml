relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-008
    relation: shared_cause_candidate
    root_hypothesis: 스크랩률과 표준시간의 복사·수기·대사 경로를 권위 출처, 유효기간, 조정 이력을 가진 기준값 계약으로 바꾸면 두
      finding의 불일치 및 감사 문제도 함께 해소되어야 한다.
    shared_cause:
      cause_claim: 병행 관리되는 제조 기준값에 권위 출처, 유효기간, 조정·대사 계약이 모델링되지 않았다.
      from_cause_ref: finding-001.cause-003
      to_cause_ref: finding-008.cause-002
    rationale: finding-001은 스크랩률·표준시간·UOM을 포함한 공유 제조 값의 권위 부재를 지적하고, finding-008은 그중
      스크랩률과 표준시간의 복수 장부·수기 조정 문제를 구체화한다. 두 causal path 모두 운영 값의 권위와 시간·감사 계약 부재를
      직접 원인으로 제시한다.
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-002
    to_finding_id: finding-004
    relation: symptom_of
    root_hypothesis: 독립된 리비전 및 effectivity 모델을 도입해 생산 시점의 유효 Part·BOM·Routing을 단일하게
      판정할 수 있게 하면 ECO 유효일과 Part.rev 배치 갱신 사이의 상충도 제거되어야 한다.
    shared_cause: null
    rationale: finding-002의 잘못된 현재 리비전 판단은 finding-004가 지적한 버전·유효기간 부재가 변경 경계에서 드러난
      운영 증상이다. finding-004의 causal path는 ECO의 단일 effective_date, 지연되는 Part.rev,
      BomLine·Routing 이력 부재를 직접 근거로 든다.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-004
    to_finding_id: finding-009
    relation: duplicates
    root_hypothesis: 두 finding을 하나의 BOM·Routing 버전/effectivity 결함으로 통합해도 각각의 실패 조건과
      제안 조치가 손실 없이 보존되어야 한다.
    shared_cause: null
    rationale: 두 finding 모두 현재 Part에 직접 연결된 BOM·Routing에 리비전, 유효기간, 변경 근거가 없어 ECO 전후
      구성을 재구성하거나 과거 생산을 재현할 수 없다고 판단한다. 하나는 coverage, 다른 하나는 evolution 관점이지만 결함과
      해결 방향이 실질적으로 같다.
    confidence: high
  - relation_id: rel-004
