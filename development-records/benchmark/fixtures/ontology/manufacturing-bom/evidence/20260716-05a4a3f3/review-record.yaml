  axiology:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합의 개념 기준 문서는 두 시스템이 동일한 권위 값, 유효시점, 단위 및 관계 의미를 결정할 수 있어야 한다는
        사용자 목적을 적용했다.
      - BOM 전개·소요량 계산·원가 롤업과 생산 오더의 리비전 선택은 이 문서가 명시적으로 언급한 제조 운영 소비 경로로 보았다.
      - session_domain이 none이므로 외부 제조 표준이나 도메인 규정은 사용하지 않았다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합의 개념 기준 문서는 특정 생산 시점에 적용된 품목·BOM·라우팅 구성을 재구성할 수 있어야 한다.
      - 생산 오더 생성 규칙을 포함한 모델은 최소한 설계·공정 기준에서 MES 실행 객체로 이어지는 인계 개념을 포함해야 한다.
      - 수량·표준시간·스크랩률처럼 운영 계산에 쓰이는 값은 단위, 시점, 권위 출처와 감사 가능한 변경 근거가 필요하다.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합 기준은 변경 전후의 BOM·라우팅을 함께 식별하고 과거 생산 상태를 재현할 수 있어야 한다.
      - 제조 라우팅은 향후 분기, 병렬, 합류 또는 재작업 흐름으로 확장될 수 있다.
      - 통합 대상 시스템이나 사업장이 늘어나면 현재 열거되지 않은 측정 단위와 용량 기준이 유입될 수 있다.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - ‘A의 대체가 B이면 B의 대체도 A다’를 모든 AlternatePart 관계에 적용되는 필수 대칭성 명제로 해석했다.
      - ‘one_way’를 역방향 관계를 함의하지 않는 비대칭 상태로 해석했다.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - 제품구조의 구성 관계와 제조공정의 스크랩·재작업 환류 관계는 서로 다른 의미를 가진다.
      - 일방향 승인 대체와 상호 호환은 제조 운영에서 구별되어야 한다.
      - 검사 계획은 검사 활동을 규정하는 정보 객체이며 검사 활동 자체와 동일하지 않다.
      - 처리량과 가용시간은 단위 차원이 다른 작업장 능력 측정값이다.
  structure:
