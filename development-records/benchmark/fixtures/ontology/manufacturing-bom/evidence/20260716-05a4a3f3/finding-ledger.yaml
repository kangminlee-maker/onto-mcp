  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260716-05a4a3f3/round1/axiology.findings.yaml#axiology-candidate-002
    target: manufacturing-bom-ontology.yaml — ECO 유효일과 Part.rev 동기화 규칙
    evidence_anchor: "review-value-alignment-criteria.yaml criterion
      `user-request-intent`: “변경관리 개념의 정합성과 제조 운영 위험”; target integrity rule:
      “ECO.effective_date 이후 생산분은 신규 rev를 따른다. 단 Part.rev 갱신은 … 주간 배치로 동기화한다.”"
    claim: "[value_type=commitment; alignment_direction=misaligned;
      value_authority_anchor={source:
      .onto/review/20260716-05a4a3f3/execution-preparation/review-value-alignme\
      nt-criteria.yaml, anchor: criterion user-request-intent, excerpt: “변경관리
      개념의 정합성과 제조 운영 위험을 중심으로”}] 신규 리비전 적용 약속과 주간 지연 동기화를 함께 허용하면서 생산 판단의 권위 기준을
      정하지 않아 변경관리 목적을 훼손한다."
    lens_rationale_summary: 유효일과 배치 갱신 사이에는 `ECO.effective_date`가 신규 리비전을 요구하면서
      `Part.rev`는 구 리비전을 표시할 수 있다. 통합 소비자가 `Part.rev`를 기준으로 삼으면 유효하지 않은 설계로 생산할
      위험이 있고, ECO를 직접 따르면 Part 기준정보와 불일치한다.
    proposed_action: 변경 적용의 권위를 유효 리비전 레코드로 단일화하고 `part_ref`, `revision`,
      `effective_from/to`, ECO 승인·적용 상태를 연결한다. 생산 오더 생성 시점에는 유효 리비전이 동기화·승인되지
      않았으면 명시적으로 차단하거나 예외 승인 경로를 요구한다.
    affected_purpose: PLM/MES 통합에서 변경관리 개념을 일관되게 적용하고 잘못된 리비전 생산을 방지하는 목적
    failure_condition: ECO 유효일이 지났지만 주간 배치가 아직 `Part.rev`를 갱신하지 않은 기간에 생산 오더 또는 작업 지시가 생성될 때
    impact: 두 시스템이 서로 다른 유효 리비전을 판단할 수 있으며, 잘못된 도면·BOM·공정 기준으로 생산하는 직접적인 운영 위험이 생긴다.
    evidence_refs:
