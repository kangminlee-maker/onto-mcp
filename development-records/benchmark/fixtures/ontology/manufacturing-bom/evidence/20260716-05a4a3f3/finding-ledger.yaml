    source_ref: .onto/review/20260716-05a4a3f3/round1/coverage.findings.yaml#coverage-candidate-001
    target: manufacturing-bom-ontology.yaml — BOM·라우팅·품목 리비전의 시간성
    evidence_anchor: materialized-input.md:20-35, 55-61, 69-75, 93-96
    claim: 적용 시점별 제품 구성을 재구성할 BOM·라우팅 버전 및 유효기간 개념이 없다.
    lens_rationale_summary: ECO 적용일과 Part.rev 주간 동기화 사이에 시차가 명시되어 있으므로 현재값만 조회하면 특정
      생산 시점에 어떤 부품 구성과 공정 순서가 유효했는지 결정할 수 없다. 이는 PLM 설계 기준과 MES 생산 실행 기준의 시점
      정합성을 약화시킨다.
    proposed_action: PartRevision, BomRevision, RoutingRevision 또는 공통
      ConfigurationRevision 개념을 도입하고 각 버전에 유효 시작·종료, 변경 근거 ECO, 상태, 적용 범위를 연결한다.
      현재값은 유효 버전에서 파생되는 투영으로 정의한다.
