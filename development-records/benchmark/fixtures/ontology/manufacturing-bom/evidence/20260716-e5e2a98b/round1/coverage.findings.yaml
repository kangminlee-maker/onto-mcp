findings:
  - candidate_id: coverage-candidate-001
    target: manufacturing-bom-ontology.yaml — BOM/routing/engineering-change
      effectivity coverage
    evidence_anchor: manufacturing-bom-ontology.yaml:24-30, 42-56, 64-70, 88-91
    claim: 시점별 BOM·라우팅 구성을 재구성할 유효기간/이력 개념이 누락되어 있다.
    what: BomLine에는 parent/child/qty/scrap_rate만 있고 유효 시작·종료, 개정, 대체 이력, 적용 조건이 없다.
      Operation/Routing도 현재 공정 순서와 released 상태만 표현하며, ECO는 effective_date 하나만
      둔다. 따라서 특정 생산일·오더·ECO 적용 시점의 BOM, 라우팅, 수량, 불량률, 표준시간을 온톨로지 자체로 재구성할 수 없다.
    why: 문서는 PLM/MES 통합의 개념 기준을 표방하고, 무결성 규칙은 ECO.effective_date 이후 생산분이 신규 rev를
      따른다고 선언한다. 그러나 BOM 라인과 라우팅이 적용기간 및 이력 버전을 갖지 않으면 ECO 전후 생산분을 서로 다른 구조/공정으로
      분리할 개념 공간이 없다. 특히 Part.rev가 도면 관리대장 반영 후 주간 배치로 동기화된다고 되어 있어, 단일 current
      값만으로는 배치 지연 구간의 실제 적용 상태를 판정하기 어렵다.
    how_to_fix: BOMLine, Routing, Operation 또는 별도 Effectivity/RevisionedStructure
      개념에 valid_from, valid_to, supersedes/superseded_by, applicable_rev/ECO, 적용
      조건(일자·로트·공장 등 필요한 범위)을 추가하고, as-of 시점의 BOM/라우팅을 산출하는 권위 규칙을 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서로서 품목·BOM·라우팅·변경관리의 운영 기준을 제공하는 목적
      failure_condition: ECO 적용 전후, 주간 배치 동기화 지연, 과거 생산오더 재추적처럼 특정 시점의 구조와 공정을 재구성해야 하는 경우
      impact: MES 생산오더, 원가/시간 계산, 품질 추적이 어떤 BOM·라우팅 버전을 기준으로 했는지 판정할 수 없어 통합 기준의 신뢰와
        감사 가능성이 약해진다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:24-30
        - manufacturing-bom-ontology.yaml:42-56
        - manufacturing-bom-ontology.yaml:64-70
        - manufacturing-bom-ontology.yaml:88-91
    causal_path:
      root_cause_candidate: 온톨로지가 BOM/라우팅/변경관리의 현재 구조와 단일 effective_date를 표현하지만, 시점 의존
        구조를 독립 개념으로 모델링하지 않는다.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: BomLine은 parent_ref, child_ref, qty_per, scrap_rate만 정의하며 적용기간이나 이력 속성이
            없다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:24-30
        - cause_id: coverage-candidate-001.cause-002
          claim: Routing은 part_ref, operations, status만 정의하며 공정 순서의 버전 또는 적용기간을 갖지 않는다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:50-56
        - cause_id: coverage-candidate-001.cause-003
          claim: ECO 무결성 규칙은 effective_date 이후 생산분이 신규 rev를 따른다고 하지만 Part.rev 동기화가 주간 배치라고
            하여 current 값과 실제 적용 시점이 어긋날 수 있다.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml:64-70
            - manufacturing-bom-ontology.yaml:88-91
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-002
    target: manufacturing-bom-ontology.yaml — lifecycle coverage for
      released/change-controlled objects
    evidence_anchor: manufacturing-bom-ontology.yaml:50-56, 64-70, 88-91
    claim: 상태를 갖는 주요 객체의 lifecycle이 도입부터 종료·정정까지 포괄하지 못한다.
    what: Routing.status는 draft와 released만 있고 obsolete, superseded, archived,
      suspended 같은 종료/통제 상태가 없다. ECO.status도 open, approved, applied까지만 있어
      rejected, cancelled, superseded, reverted, corrected 같은 변경관리 종료 및 정정 사건을
      수용하지 못한다.
    why: 라우팅은 released 상태만 생산오더 생성 조건으로 사용되고 ECO는 생산 적용 시점까지 통제한다. 그런데 종결·폐기·대체·정정
      상태가 없으면 더 이상 사용하면 안 되는 라우팅이나 잘못 적용된 ECO를 상태 모델 안에서 표현할 수 없다. 이는 범위 누락이며,
      존재하는 상태값의 정확성보다 상태 lifecycle의 빈 구간이 문제다.
    how_to_fix: Routing과 ECO에 최소한 폐기/대체/보류/취소/반려/정정 또는 재발행 상태를 추가하고, 각 상태가 생산오더 생성,
      rev 적용, 감사 추적에 미치는 의미를 무결성 규칙으로 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합 기준에서 라우팅 릴리스와 변경관리 상태가 운영 행위를 통제하는 목적
      failure_condition: 릴리스된 라우팅이 단종·대체되거나 승인된 ECO가 취소/정정/재발행되는 경우
      impact: 상태 모델이 운영상 금지 또는 예외 처리해야 할 종료 이후 상황을 표현하지 못해 MES 생산 가능 여부와 변경 적용 판단이
        모호해진다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:50-56
        - manufacturing-bom-ontology.yaml:64-70
        - manufacturing-bom-ontology.yaml:88-91
    causal_path:
      root_cause_candidate: 상태 enum이 초기 작성과 릴리스/적용까지만 정의되어 있고 종료 및 정정 사건을 별도 개념으로 포함하지 않는다.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: Routing.status는 draft와 released만 허용한다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:50-56
        - cause_id: coverage-candidate-002.cause-002
          claim: ECO.status는 open, approved, applied만 허용한다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:64-70
        - cause_id: coverage-candidate-002.cause-003
          claim: 생산오더 생성과 rev 적용 규칙이 이 제한된 상태값에 의존한다.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml:88-91
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: manufacturing-bom-ontology.yaml — audit evidence for controlled actions
      and manual values
    evidence_anchor: manufacturing-bom-ontology.yaml:64-70, 72-77, 93-95
    claim: 승인·수기입력·현장환산 같은 통제 행위의 행위자·시각·근거 증거 개념이 누락되어 있다.
    what: ECO에는 approved 상태가 있지만 승인자, 승인시각, 승인근거가 없다.
      InspectionPlan.acceptance_criteria는 품질팀 SOP가 원본이라고만 하며 해당 근거 문서/버전/승인 이력을
      담지 않는다. 원가 계산용 누적 std_time은 표준원가 시스템에 수기 입력 필드가 있고, uom 변환은 현장에서 환산한다고 되어
      있지만 수기 조정 또는 환산 행위의 증거 엔티티가 없다.
    why: PLM/MES 통합에서는 승인과 수동 조정이 생산 가능 여부, 검사 합격 기준, 원가/시간 계산에 영향을 준다. 현재 모델은 결과값이나
      상태만 담고 그 값을 만든 통제 행위의 actor/time/rationale를 담지 않아 사후 감사와 오류 원인 추적 범위가 비어
      있다.
    how_to_fix: ApprovalRecord, ManualOverride/Adjustment, ConversionEvent 또는
      SourceEvidence 같은 공통 증거 개념을 추가하고 actor, timestamp, source_doc/version,
      rationale, affected_field, previous_value/new_value를 연결한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 제조 운영 위험을 줄이는 PLM/MES 통합 기준으로서 승인·검사·원가/시간 값의 추적성을 제공하는 목적
      failure_condition: ECO 승인, 검사 기준 변경, 표준시간 수기 입력, 현장 단위 환산이 생산/품질/원가 판단에 영향을 준 뒤
        감사나 원인 분석이 필요한 경우
      impact: 누가 언제 어떤 근거로 값을 승인하거나 바꾸었는지 알 수 없어 통합 데이터의 통제성과 책임 추적이 약해진다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:64-70
        - manufacturing-bom-ontology.yaml:72-77
        - manufacturing-bom-ontology.yaml:93-95
    causal_path:
      root_cause_candidate: 통제 행위가 상태나 메모로만 표현되고, 행위 증거를 담는 별도 개념이 없다.
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: ECO는 approved 상태를 갖지만 승인 행위의 행위자·시각·근거 속성이 없다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:64-70
        - cause_id: coverage-candidate-003.cause-002
          claim: InspectionPlan의 acceptance_criteria는 품질팀 SOP가 원본이라고만 기록하고 SOP 버전 또는 승인
            증거를 연결하지 않는다.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml:72-77
        - cause_id: coverage-candidate-003.cause-003
          claim: 표준원가 시스템 수기 입력과 현장 uom 환산이 notes에 언급되지만 수기 조정/환산 증거 개념은 없다.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml:93-95
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: manufacturing-bom-ontology.yaml — unit conversion and source authority
      coverage
    evidence_anchor: manufacturing-bom-ontology.yaml:14, 58-62, 93-95
    claim: 단위 변환과 능력 단위의 기준 마스터/권위 개념이 누락되어 있다.
    what: Part.uom은 ea, kg, m enum만 제공하고 품목별 환산계수 마스터가 없다고 명시한다.
      WorkCenter.capacity_per_shift도 단위가 작업장마다 개수 또는 시간으로 다르다고만 되어 있다. 단위 변환이 현장
      환산에 맡겨져 있어 PLM/MES 간 수량, 능력, 계획 계산에 필요한 단일 원본 개념이 없다.
    why: BOM qty_per, 작업장 capacity, 생산계획은 단위 해석이 일치해야 한다. 그런데 변환 기준과 단위 권위가 빠져 있으면
      같은 품목/공정 수량이 시스템마다 다르게 계산될 수 있으며, 이는 단순 속성 누락을 넘어 통합 기준 문서의 범위 빈 영역이다.
    how_to_fix: ItemUomConversion 또는 UnitOfMeasureMaster 개념을 추가해 source_uom,
      target_uom, factor, valid_from/to, owning_system, approval/source
      evidence를 정의하고, WorkCenter capacity 단위도 명시적 uom_ref로 모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 BOM 수량, 생산능력, 계획 계산의 공통 기준을 제공하는 목적
      failure_condition: kg↔ea 등 변환이 필요한 품목이나 작업장별 capacity 단위가 혼재된 생산계획/오더 계산을 수행하는 경우
      impact: 동일 수량과 능력 값이 시스템 또는 현장 판단마다 다르게 해석되어 계획, 자재소요, 원가 계산의 기준성이 깨질 수 있다.
      evidence_refs:
        - manufacturing-bom-ontology.yaml:14
        - manufacturing-bom-ontology.yaml:58-62
        - manufacturing-bom-ontology.yaml:93-95
    causal_path:
      root_cause_candidate: 온톨로지가 단위 enum과 단위가 섞인 capacity 값은 표현하지만 변환 기준과 원본 권위를 별도 개념으로 두지 않는다.
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: Part.uom은 고정 enum만 정의한다.
          relation_to_previous: null
          evidence_refs:
            - manufacturing-bom-ontology.yaml:14
        - cause_id: coverage-candidate-004.cause-002
          claim: WorkCenter.capacity_per_shift의 단위는 작업장마다 개수 또는 시간으로 다르다고 되어 있지만 단위 속성이나
            참조가 없다.
          relation_to_previous: enables
          evidence_refs:
            - manufacturing-bom-ontology.yaml:58-62
        - cause_id: coverage-candidate-004.cause-003
          claim: notes는 품목별 환산계수 마스터가 없고 필요 시 현장에서 환산한다고 명시한다.
          relation_to_previous: causes
          evidence_refs:
            - manufacturing-bom-ontology.yaml:93-95
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - 세션 도메인이 none이라 외부 도메인 문서나 표준은 사용하지 않았고, PLM/MES 통합 기준 문서라는 대상 파일의 자기 선언과
    coverage lens의 일반 질문만 기준으로 삼았다.
  - 제조 운영에서 BOM, 라우팅, ECO, 검사, 원가/시간, 단위 변환은 생산오더와 추적성에 영향을 주는 통제 대상이라는 일반 맥락을
    사용했다.
validation:
