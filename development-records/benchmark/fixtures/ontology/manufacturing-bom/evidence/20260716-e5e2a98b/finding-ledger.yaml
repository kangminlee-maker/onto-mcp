  - finding_id: finding-016
    lens_id: structure
    source_ref: .onto/review/20260716-e5e2a98b/round1/structure.findings.yaml#structure-candidate-001
    target: manufacturing-bom-ontology.yaml / entities.AlternatePart and relations
    evidence_anchor: .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input.md:37
      and
      .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input.md:84
    claim: AlternatePart is declared as an entity but is not connected by any formal
      relation.
    lens_rationale_summary: "Within the structural relation graph, `AlternatePart`
      is effectively orphaned: graph consumers can traverse `Part -> Part
      alternate_of`, but cannot reach the entity that carries the alternate
      relationship's own attributes, especially `direction`. For a PLM/MES
      integration concept baseline, this weakens the completeness of the
      declared alternate-part structure because the relationship entity exists
      in `entities` but is absent from the formal connectivity surface."
    proposed_action: Make `AlternatePart` the explicit relationship node in
      `relations`, for example add relations from `AlternatePart` to `Part` for
      `primary_ref` and `alternate_ref`, and either remove the shorthand `Part
      -> Part alternate_of` relation or define it as a derived projection that
      preserves linkage to `AlternatePart.direction`.
    affected_purpose: Use the ontology as a PLM/MES integration concept baseline for
      BOM, routing, and related manufacturing master-data structures.
    failure_condition: When integration or validation logic relies on the formal
      `relations` list to discover connected ontology concepts, `AlternatePart`
      is not reachable as a relationship entity despite carrying the
      alternate-part fields.
    impact: The alternate-part concept is split between an entity and an unconnected
      shorthand relation, so downstream consumers can miss the entity attributes
      that qualify the relationship. This reduces trust in the ontology as a
      structurally complete concept baseline.
