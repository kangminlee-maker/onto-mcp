  - finding_id: finding-014
    lens_id: semantics
    source_ref: .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics-candidate-003
    target: WorkCenter.capacity_per_shift
    evidence_anchor: .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input.md:63-67
    claim: "`capacity_per_shift` has a single numeric field while its note says the
      unit differs by work center."
    lens_rationale_summary: Capacity expressed as pieces per shift and capacity
      expressed as time per shift are not the same measure. A PLM/MES concept
      baseline needs capacity semantics to be explicit enough for scheduling,
      load calculation, and routing interpretation.
    proposed_action: Add an explicit capacity unit or split the field into typed
      measures, such as quantity capacity and time capacity, with clear units
      and conversion rules.
    affected_purpose: PLM/MES routing and manufacturing operation concept baseline.
    failure_condition: Consumers aggregate, compare, or schedule work centers using
      `capacity_per_shift` without knowing whether the number is a count or a
      time value.
    impact: The ontology permits semantically incompatible values in the same
      attribute, undermining capacity planning and MES scheduling mappings.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics-candidate-003
      - materialized-input.md:63-67
