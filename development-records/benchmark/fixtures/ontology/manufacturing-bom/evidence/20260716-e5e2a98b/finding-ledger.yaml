  - finding_id: finding-012
    lens_id: semantics
    source_ref: .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics-candidate-001
    target: AlternatePart entity and alternate_of shortcut relation
    evidence_anchor: .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input.md:37-45,91
    claim: AlternatePart is defined as symmetric while its attributes model a
      directional substitution by default.
    lens_rationale_summary: A symmetric definition and a default one-way attribute
      describe different meanings. In PLM/MES use, interchangeable substitutes,
      engineering-approved alternates, and one-way supersessions are materially
      different because they control whether production may replace one part
      with another in either direction.
    proposed_action: "Split the concepts or definitions: model symmetric
      interchangeability separately from directional substitution/supersession,
      or change the definition to explicitly say `AlternatePart` can be
      directional and require the shortcut `alternate_of` to preserve
      direction."
    affected_purpose: PLM/MES integration concept baseline for item/BOM/change concepts.
    failure_condition: A downstream consumer interprets `alternate_of` or the entity
      definition as bidirectional while the data defaults to `one_way`, or vice
      versa.
    impact: Part substitution rules can be applied in the wrong direction, weakening
      production planning, procurement substitution, and change-control trust in
      the ontology.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics-candidate-001
      - materialized-input.md:37-45
      - materialized-input.md:91
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: PLM/MES integration concept baseline for item/BOM/change concepts.
      failure_condition: A downstream consumer interprets `alternate_of` or the entity
        definition as bidirectional while the data defaults to `one_way`, or
        vice versa.
      impact: Part substitution rules can be applied in the wrong direction, weakening
        production planning, procurement substitution, and change-control trust
        in the ontology.
      evidence_refs:
        - materialized-input.md:37-45
        - materialized-input.md:91
    causal_path:
      root_cause_candidate: The ontology assigns one concept name,
        `AlternatePart`/`alternate_of`, to both symmetric alternates and
        directional substitution relationships.
      root_cause_step_id: finding-012.cause-003
      steps:
        - cause_id: finding-012.cause-001
          claim: The entity definition states the alternate relationship is reciprocal.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37-38
        - cause_id: finding-012.cause-002
          claim: The entity attributes then encode direction and default it to `one_way`.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:42-45
        - cause_id: finding-012.cause-003
          claim: The shortcut `alternate_of` relation hides that direction semantics
            unless consumers inspect the `AlternatePart` entity.
          relation_to_previous: enables
          evidence_refs:
