  - finding_id: finding-015
    lens_id: semantics
    source_ref: .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics-candidate-004
    target: Part to Routing relation `manufactured_by`
    evidence_anchor: .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input.md:14-21,55-61,87
    claim: The `manufactured_by` relation is attached to all Parts although Part
      includes purchased items.
    lens_rationale_summary: A purchased part and a manufactured part have different
      routing semantics. If every `Part` is related to a manufacturing routing
      by `manufactured_by`, the ontology blurs item identity with make/buy
      behavior.
    proposed_action: Restrict routing relations to manufactured parts or add an
      explicit make/buy/manufacturing applicability concept so purchased parts
      are not semantically implied to have manufacturing routings.
    affected_purpose: Concept baseline for item, BOM, and routing integration
      between PLM and MES.
    failure_condition: The integration treats all `Part` records as candidates for
      manufacturing routing because the relation is declared at the parent
      `Part` level.
    impact: Purchased items can be misclassified as manufacturable in downstream
      routing and production-order logic, reducing trust in the ontology as an
      integration reference.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics-candidate-004
      - materialized-input.md:14-21
