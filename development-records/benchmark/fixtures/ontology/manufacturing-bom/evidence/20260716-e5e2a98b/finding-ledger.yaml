        execution risk.
      evidence_refs:
        - materialized-input.md:35
        - materialized-input.md:100
        - review-value-alignment-criteria.yaml criterion_id=user-request-intent
    causal_path:
      root_cause_candidate: The ontology treats operationally critical quantity data
        as attributes while leaving their authority and conversion governance
        outside the concept baseline.
      root_cause_step_id: finding-001.cause-003
      steps:
        - cause_id: finding-001.cause-001
          claim: "`BomLine.scrap_rate` is included as a canonical BOM-line attribute, but
            its note says the value is copied from a production-planning Excel
            file."
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:35
        - cause_id: finding-001.cause-002
          claim: The ontology also states that UOM conversion lacks an item
            conversion-factor master and is performed on the shop floor as
