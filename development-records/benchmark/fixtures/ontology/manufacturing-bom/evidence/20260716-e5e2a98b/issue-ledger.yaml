  - issue_id: issue-004
    root_cause_hypothesis: Controlled operational changes are represented as states
      or notes without first-class action evidence for actor, time, rationale,
      source, and before/after values.
    root_confidence: medium
    surface_finding_ids:
      - finding-006
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: Approval, manual input, and shop-floor conversion actions lack
      evidence concepts needed for audit and root-cause traceability.
    proposed_action: Add ApprovalRecord, ManualOverride/Adjustment, ConversionEvent,
      or SourceEvidence concepts that connect actor, timestamp, source
      document/version, rationale, affected field, and previous/new values to
      controlled actions.
    affected_purpose: 제조 운영 위험을 줄이는 PLM/MES 통합 기준으로서 승인·검사·원가/시간 값의 추적성을 제공하는 목적
    failure_condition: ECO 승인, 검사 기준 변경, 표준시간 수기 입력, 현장 단위 환산이 생산/품질/원가 판단에 영향을 준 뒤
