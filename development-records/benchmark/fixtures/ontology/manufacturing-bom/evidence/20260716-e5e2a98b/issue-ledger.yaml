  - issue_id: issue-006
    root_cause_hypothesis: Production-order-relevant routing capacity is not modeled
      with explicit comparable capacity measures separating value,
      unit/dimension, basis period, and capacity type.
    root_confidence: high
    surface_finding_ids:
      - finding-003
      - finding-009
      - finding-014
    relation_refs:
      - rel-010
      - rel-009
    raised_by_lens_ids:
      - axiology
      - evolution
      - semantics
    issue_statement: WorkCenter capacity is modeled as one numeric field whose unit
      varies by work center, making routing capacity semantically ambiguous for
      scheduling and production-order use.
    proposed_action: Split capacity into explicit typed measures or a
      CapacityMeasure structure with value, unit, basis period, capacity type,
      source/effectivity, and comparability rules for released routing and
      production-order creation.
    affected_purpose: PLM/MES routing and manufacturing operation concept baseline,
      especially routing consistency and manufacturing operating risk.
    failure_condition: When released routings are used to create or schedule
      production orders, or when consumers aggregate, compare, or add work
      centers with count-based and time-based capacity values, capacity cannot
      be safely interpreted without out-of-band unit knowledge.
    impact: MES consumers can misread capacity as count or time while still
      conforming to the ontology, undermining capacity planning, scheduling
      mappings, and routing model actionability.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:53
      - materialized-input.md:55-61
      - materialized-input.md:67
      - materialized-input.md:95
      - review-value-alignment-criteria.yaml criterion_id=user-request-intent
      - .onto/review/20260716-e5e2a98b/round1/evolution.findings.yaml#evolution-candidate-002
      - materialized-input.md:63
      - .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics-candidate-003
      - materialized-input.md:63-67
    severity: medium
    domain_threshold_used: null
    singleton_reason: null
  - issue_id: issue-007
    root_cause_hypothesis: The same integrity rule uses the BOM parent-child graph
      for both product structure and scrap re-input process flow without
      separating their invariants.
    root_confidence: high
    surface_finding_ids:
      - finding-011
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: The BOM acyclicity rule is internally unsatisfiable for the
      stated scrap re-input modeling case.
    proposed_action: Separate normal BOM acyclicity from scrap/rework flow modeling,
      either by keeping product BOM strictly acyclic and modeling scrap re-input
      through a distinct process/recovery relation or by defining a separate
      graph scope where self-reference is allowed.
    affected_purpose: Use the ontology as a PLM/MES concept baseline for BOM and
      routing validation.
    failure_condition: A scrap re-input Assembly is modeled as its own child while
      the BOM invariant still says BOMs must be acyclic.
    impact: Validators or integrations cannot consistently decide whether the
      self-referential BOM is valid, creating invalid-input and precedence
      ambiguity at the BOM/MES boundary.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/logic.findings.yaml#logic-candidate-001
      - .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input.md:93-95
    severity: medium
    domain_threshold_used: null
    singleton_reason: Runtime relation graph lists this as a singleton finding with
      no accepted semantic relation covering it.
  - issue_id: issue-008
    root_cause_hypothesis: The ontology assigns one concept name,
      AlternatePart/alternate_of, to both symmetric alternates and directional
      substitution relationships.
    root_confidence: high
    surface_finding_ids:
      - finding-012
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: AlternatePart is defined as symmetric while its attributes and
      shortcut relation can encode a directional substitution by default.
    proposed_action: Split symmetric interchangeability from directional
      substitution/supersession, or redefine AlternatePart as directional and
      require any alternate_of projection to preserve direction semantics.
    affected_purpose: PLM/MES integration concept baseline for item/BOM/change concepts.
    failure_condition: A downstream consumer interprets alternate_of or the entity
      definition as bidirectional while the data defaults to one_way, or vice
      versa.
    impact: Part substitution rules can be applied in the wrong direction, weakening
      production planning, procurement substitution, and change-control trust in
      the ontology.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics-candidate-001
      - materialized-input.md:37-45
      - materialized-input.md:91
    severity: medium
    domain_threshold_used: null
    singleton_reason: Only a shared_cause_candidate relation connects this finding
      to another AlternatePart finding; the task forbids merging solely on
      shared cause.
  - issue_id: issue-009
    root_cause_hypothesis: The ontology uses subtype inheritance where a reference
      or extension relation would better preserve the plan-versus-operation type
      distinction.
    root_confidence: high
    surface_finding_ids:
      - finding-013
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: InspectionPlan is classified as a subtype of Operation even
      though its definition describes a plan/specification rather than an
      executable routing step.
    proposed_action: Model inspection as an Operation subtype only if the entity
      represents the executable inspection step; otherwise keep InspectionPlan
      as a separate specification entity referenced by an inspection Operation.
    affected_purpose: Concept baseline for routing and manufacturing operation
      semantics in PLM/MES integration.
    failure_condition: MES/routing consumers treat quality inspection specifications
      as executable routing operations or require operation fields for plan
      records.
    impact: The ontology weakens the distinction between work execution and
      quality-control specification, which can produce ambiguous routing,
      scheduling, and inspection master-data mappings.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics-candidate-002
      - materialized-input.md:47-53
      - materialized-input.md:77-82
    severity: medium
    domain_threshold_used: null
    singleton_reason: Runtime relation graph lists this as a singleton finding with
      no accepted semantic relation covering it.
  - issue_id: issue-010
    root_cause_hypothesis: The ontology places manufacturing-specific semantics on
      the broad Part concept rather than on a manufactured-part subset or
      applicability condition.
    root_confidence: high
    surface_finding_ids:
      - finding-015
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: The manufactured_by relation is attached to all Parts even
      though Part includes purchased items.
    proposed_action: Restrict routing relations to manufactured parts or add an
      explicit make/buy/manufacturing applicability concept so purchased parts
      are not semantically implied to have manufacturing routings.
    affected_purpose: Concept baseline for item, BOM, and routing integration
      between PLM and MES.
    failure_condition: The integration treats all Part records as candidates for
      manufacturing routing because the relation is declared at the parent Part
      level.
    impact: Purchased items can be misclassified as manufacturable in downstream
      routing and production-order logic, reducing trust in the ontology as an
      integration reference.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics-candidate-004
      - materialized-input.md:14-21
      - materialized-input.md:55-61
      - materialized-input.md:87
    severity: medium
    domain_threshold_used: null
    singleton_reason: Runtime relation graph lists this as a singleton finding with
      no accepted semantic relation covering it.
  - issue_id: issue-011
    root_cause_hypothesis: The formal relation list models alternates as a direct
      Part-to-Part shorthand instead of connecting the declared AlternatePart
      entity into the graph.
    root_confidence: high
    surface_finding_ids:
      - finding-016
    relation_refs: []
    raised_by_lens_ids:
      - structure
    issue_statement: AlternatePart is declared as an entity but is not connected by
      any formal relation, so graph consumers cannot reach the attributes that
      qualify alternate-part relationships.
    proposed_action: Make AlternatePart the explicit relationship node in relations,
      add primary_ref and alternate_ref links to Part, and either remove the
      shorthand Part-to-Part alternate_of relation or define it as a derived
      projection preserving linkage to AlternatePart.direction.
    affected_purpose: Use the ontology as a PLM/MES integration concept baseline for
      BOM, routing, and related manufacturing master-data structures.
    failure_condition: When integration or validation logic relies on the formal
      relations list to discover connected ontology concepts, AlternatePart is
      not reachable as a relationship entity despite carrying alternate-part
      fields.
    impact: The alternate-part concept is split between an entity and an unconnected
      shorthand relation, so downstream consumers can miss the entity attributes
      that qualify the relationship, reducing trust in structural completeness.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/structure.findings.yaml#structure-candidate-001
      - .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input.md:37
      - .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input.md:40
