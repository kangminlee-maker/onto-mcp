  - issue_id: issue-005
    root_cause_hypothesis: The unit system is modeled as a fixed enum plus unmapped
      field practice rather than an extensible UnitOfMeasure and conversion
      authority model.
    root_confidence: high
    surface_finding_ids:
      - finding-007
      - finding-008
    relation_refs:
      - rel-002
    raised_by_lens_ids:
      - coverage
      - evolution
    issue_statement: Unit conversion and source authority are missing as first-class
      concepts, so new units or item-specific conversions require schema
      changes, external correction, or local interpretation.
    proposed_action: Replace fixed UOM-only modeling with UnitOfMeasure and
      UomConversion or ItemUomConversion concepts that include source_uom,
      target_uom, factor, validity, ownership, source evidence, and explicit
      references from BOM, production, inventory, and capacity quantities.
    affected_purpose: PLM/MES 통합에서 BOM 수량, 생산능력, 계획 계산 및 품목·생산·재고 수량을 일관되게 연결하는 목적.
    failure_condition: kg↔ea 등 변환이 필요한 품목, 새 단위, 품목별 환산, 또는 PLM/MES/원가 시스템이 같은 수량을
      서로 다른 단위로 교환하는 경우.
    impact: 동일 수량과 능력 값이 시스템 또는 현장 판단마다 다르게 해석되고, 새 단위 추가마다 스키마/규칙 수정 또는 수기 보정이 필요해져
      통합 기준성과 변경 내성이 약해진다.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/coverage.findings.yaml#coverage-candidate-004
      - manufacturing-bom-ontology.yaml:14
      - manufacturing-bom-ontology.yaml:58-62
