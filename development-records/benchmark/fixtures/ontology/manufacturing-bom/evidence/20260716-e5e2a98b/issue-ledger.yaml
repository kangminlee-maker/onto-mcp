issues:
  - issue_id: issue-001
    root_cause_hypothesis: The ontology treats operationally critical quantity data
      as attributes while leaving scrap/yield authority and UOM conversion
      governance outside the PLM/MES concept baseline.
    root_confidence: high
    surface_finding_ids:
      - finding-001
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: Operational quantity semantics are accepted outside the PLM/MES
      integration baseline, allowing scrap/yield and UOM conversion to depend on
      copied or local practices.
    proposed_action: Add authoritative concepts for scrap/yield and item-specific
      UOM conversion, including source ownership, unit basis, effective
      scope/date, and consumer system responsibilities; remove or demote
      copied/manual conversion assumptions from the canonical ontology.
    affected_purpose: Review intent asks whether this BOM/process ontology is
      suitable as a PLM/MES integration concept standard, focused on item, BOM,
      routing, change-management consistency and manufacturing operating risk.
    failure_condition: When production planning, BOM explosion, inventory
      consumption, costing, or MES order generation depends on scrap/yield or
      UOM conversion, the integration baseline lacks authoritative, stable
      quantity semantics.
    impact: Cross-system trust is weakened because two systems can conform to the
      ontology while still using divergent spreadsheet-copied scrap values or
      local UOM conversions, creating manufacturing planning and execution risk.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:35
      - materialized-input.md:100
      - review-value-alignment-criteria.yaml criterion_id=user-request-intent
    severity: high
    domain_threshold_used: null
    singleton_reason: Only shared_cause_candidate relations connect this finding to
      others; no same_root_candidate relation supports merging it into a
      multi-finding issue.
  - issue_id: issue-002
    root_cause_hypothesis: The ontology separates ECO effectivity authority from
      part revision synchronization without modeling the precedence and
      transition state as a controlled integration concept.
    root_confidence: high
    surface_finding_ids:
      - finding-002
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: ECO effectivity can outrun the part revision identity exposed
      to integrated systems, leaving a hidden transition window in the concept
      baseline.
    proposed_action: Represent ECO effectivity and revision applicability as
      first-class versioned/effective-dated relationships, and require
      production orders to resolve applicable revision from ECO state plus
      effectivity rather than from a potentially stale Part.rev batch copy.
    affected_purpose: The declared review purpose is PLM/MES integration suitability
      with emphasis on change-management consistency and manufacturing operating
      risk.
    failure_condition: During the period after an ECO effective date but before
      weekly Part.rev synchronization, MES or downstream consumers may see a
      stale revision while the integrity rule says production must follow the
      new revision.
    impact: The concept baseline can permit wrong-revision manufacturing or
      ambiguous revision traceability, which is material to manufacturing
      execution and change-control trust.
    evidence_refs:
      - .onto/review/20260716-e5e2a98b/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:20
      - materialized-input.md:21
      - materialized-input.md:69-75
      - materialized-input.md:96
      - review-value-alignment-criteria.yaml criterion_id=user-request-intent
    severity: high
    domain_threshold_used: null
    singleton_reason: The finding has duplicate/shared-cause links but no
      same_root_candidate relation in the relation graph; it is kept separate so
      runtime dependency projection can preserve the shared cause context.
  - issue_id: issue-003
    root_cause_hypothesis: The ontology lacks an as-of revision/effectivity model
      that binds BOM, routing, ECO, lifecycle state, and production history to
      valid intervals or applicability conditions.
    root_confidence: high
    surface_finding_ids:
      - finding-004
      - finding-010
      - finding-005
    relation_refs:
      - rel-005
      - rel-007
    raised_by_lens_ids:
      - coverage
      - evolution
    issue_statement: BOM/routing structures, engineering revision continuity, and
      lifecycle states are compressed into current-state fields and limited
      status enums, so the model cannot reliably reconstruct or govern
      change-controlled manufacturing states over time.
    proposed_action: Introduce versioned/effective-dated revisioned artifact
      concepts for BOM, Routing, Operation/InspectionPlan, and ECO
      applicability, with valid intervals, applicable revisions/ECOs,
      terminal/correction states, and authority rules for as-of resolution.
    affected_purpose: 품목·BOM·라우팅·변경관리 개념의 정합성을 PLM/MES 통합 기준으로 제공하는 목적.
    failure_condition: ECO 적용 전후, 주간 배치 동기화 지연, 다중 또는 단계적 ECO, 취소/정정/재발행, 또는 과거 생산오더
      재추적처럼 특정 시점의 구조·공정·revision·상태를 재구성해야 하는 경우.
    impact: MES 생산오더, PLM 도면 리비전, BOM/라우팅 적용 상태, 원가/시간 계산, 품질 추적이 서로 다른 current 값을
      기준으로 판단될 수 있어 변경관리 신뢰와 감사 가능성이 약해진다.
    evidence_refs:
