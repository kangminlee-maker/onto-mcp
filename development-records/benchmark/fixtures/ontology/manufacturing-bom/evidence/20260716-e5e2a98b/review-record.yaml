        - problem-framing.yaml
      rationale: "The issue is a type-semantics conflict that can confuse routing and
        quality mappings. It is material but narrower than the core
        BOM/change-control blockers, so it can be carried into the next modeling
        stage. Source finding context: InspectionPlan is_a Operation Source
        finding context:
        .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input\
        .md:47-53,77-82 Source finding context: InspectionPlan is classified as
        a subtype of Operation even though its definition describes a
        plan/specification, not a routing step. Source finding context: The
        inheritance says every inspection plan is an operation. That forces
        plan-level attributes such as sampling rules and acceptance criteria
        into the same ontological type as executable routing steps, which can
        confuse whether the ontology is referring to a manufacturing action or
        the quality specification governing that action. Source finding context:
        Model inspection as an `Operation` subtype only if the entity represents
        the executable inspection step. Otherwise, keep `InspectionPlan` as a
        separate specification entity referenced by an inspection `Operation`.
        Source finding context:
        .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics\
        -candidate-002 Source finding context: Concept baseline for routing and
        manufacturing operation semantics in PLM/MES integration. Source finding
        context: MES/routing consumers treat quality inspection specifications
        as executable routing operations or require operation fields for plan
        records. Source finding context: The ontology weakens the distinction
        between work execution and quality-control specification, which can
        produce ambiguous routing, scheduling, and inspection master-data
        mappings. Source finding context: The ontology uses subtype inheritance
        where a reference/extension relation would better preserve the
        plan-versus-operation type distinction. Source finding context:
        `Operation` denotes an executable routing step with work center and
        standard time. Source finding context: `InspectionPlan` is named and
        defined as a plan and parameter extension, then declared `is_a:
        Operation`."
    - issue_id: issue-010
      candidates: *a11
      derivation_refs:
