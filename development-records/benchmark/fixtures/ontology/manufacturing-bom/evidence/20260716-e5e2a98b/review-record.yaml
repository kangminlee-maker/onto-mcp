        ment-criteria.yaml criterion user-request-intent Source finding context:
        The ontology accepts a hidden tradeoff where ECO effectivity can outrun
        the part revision identity used by integrated systems. Source finding
        context: For PLM/MES integration, change effectivity is not just
        descriptive metadata; it controls which design revision production
        should build. The ontology’s stated rule creates a time window in which
        production should follow a new revision while the part revision field
        may still show the old one. Accepting that delay without a first-class
        effectivity model or release gate prioritizes batch synchronization
        convenience over the document’s purpose of providing a safe shared
        concept baseline. Source finding context: Represent ECO effectivity and
        revision applicability as first-class versioned/effective-dated
        relationships, and require released production orders to resolve the
        applicable revision from ECO state plus effectivity rather than from a
        potentially stale `Part.rev` batch copy. Make the source-of-truth
        precedence explicit for the transition window. Source finding context:
