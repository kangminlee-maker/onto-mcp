    - issue_id: issue-007
      candidates: *a8
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "This is an explicit conflict between an invariant and a stated
        modeling case. It blocks validation semantics for the target ontology
        itself, so it should be fixed in the target rather than deferred. Source
        finding context: manufacturing-bom-ontology.yaml integrity_rules BOM
        acyclicity rule Source finding context:
        .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input\
        .md:93-95 Source finding context: The BOM acyclicity rule is internally
        unsatisfiable for the stated scrap re-input modeling case. Source
        finding context: Conflict pair: materialized-input.md:94 vs
        materialized-input.md:94. Satisfiability: intra-claim conflict.
        Modality: mixed necessary/possible exception; the same rule makes
        acyclicity mandatory while permitting a modeling pattern that
        necessarily violates acyclicity. For a PLM/MES concept baseline, this
        weakens validation because the same target graph can be both forbidden
        as cyclic and required as the representation of scrap re-input. Source
        finding context: Separate normal BOM acyclicity from scrap/rework flow
        modeling. For example, keep product BOM strictly acyclic and represent
        scrap re-input through a distinct process/recovery relation, or
        explicitly define a different graph scope where self-reference is
        allowed and excluded from the BOM acyclicity invariant. Source finding
        context:
        .onto/review/20260716-e5e2a98b/round1/logic.findings.yaml#logic-candida\
        te-001 Source finding context: Use the ontology as a PLM/MES concept
        baseline for BOM and routing validation. Source finding context: A scrap
        re-input Assembly is modeled as its own child while the BOM invariant
        still says BOMs must be acyclic. Source finding context: Validators or
        integrations cannot consistently decide whether the self-referential BOM
        is valid, creating invalid-input and precedence ambiguity at the BOM/MES
        boundary. Source finding context: The same integrity rule uses the BOM
        parent-child graph for both product structure and scrap re-input process
        flow without separating their invariants. Source finding context: The
        ontology declares BOMs must be acyclic. Source finding context: The same
        rule permits scrap re-input to be modeled as an Assembly containing
        itself as a child. Source finding context: An Assembly containing itself
        creates a one-edge cycle in the BOM graph, contradicting the mandatory
        acyclicity rule."
    - issue_id: issue-008
      candidates: *a9
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "The core problem is competing meanings assigned to the same
        alternate-part concept. It materially affects item and substitution
        interpretation, so the distinction should be resolved before integration
        consumers rely on it. Source finding context: AlternatePart entity and
        alternate_of shortcut relation Source finding context:
        .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input\
        .md:37-45,91 Source finding context: AlternatePart is defined as
        symmetric while its attributes model a directional substitution by
        default. Source finding context: A symmetric definition and a default
        one-way attribute describe different meanings. In PLM/MES use,
        interchangeable substitutes, engineering-approved alternates, and
        one-way supersessions are materially different because they control
        whether production may replace one part with another in either
        direction. Source finding context: Split the concepts or definitions:
        model symmetric interchangeability separately from directional
        substitution/supersession, or change the definition to explicitly say
        `AlternatePart` can be directional and require the shortcut
        `alternate_of` to preserve direction. Source finding context:
        .onto/review/20260716-e5e2a98b/round1/semantics.findings.yaml#semantics\
        -candidate-001 Source finding context: PLM/MES integration concept
        baseline for item/BOM/change concepts. Source finding context: A
        downstream consumer interprets `alternate_of` or the entity definition
        as bidirectional while the data defaults to `one_way`, or vice versa.
        Source finding context: Part substitution rules can be applied in the
        wrong direction, weakening production planning, procurement
        substitution, and change-control trust in the ontology. Source finding
        context: The ontology assigns one concept name,
        `AlternatePart`/`alternate_of`, to both symmetric alternates and
        directional substitution relationships. Source finding context: The
        entity definition states the alternate relationship is reciprocal.
        Source finding context: The entity attributes then encode direction and
        default it to `one_way`. Source finding context: The shortcut
        `alternate_of` relation hides that direction semantics unless consumers
        inspect the `AlternatePart` entity."
    - issue_id: issue-009
      candidates: *a10
      derivation_refs:
