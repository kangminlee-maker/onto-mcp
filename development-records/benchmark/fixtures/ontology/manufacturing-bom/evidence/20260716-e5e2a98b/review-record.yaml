        ment-criteria.yaml criterion user-request-intent Source finding context:
        The ontology accepts a hidden tradeoff where ECO effectivity can outrun
        the part revision identity used by integrated systems. Source finding
        context: For PLM/MES integration, change effectivity is not just
        descriptive metadata; it controls which design revision production
        should build. The ontology’s stated rule creates a time window in which
        production should follow a new revision while the part revision field
        may still show the old one. Accepting that delay without a first-class
        effectivity model or release gate prioritizes batch synchronization
        convenience over the document’s purpose of providing a safe shared
        concept baseline. Source finding context: Represent ECO effectivity and
        revision applicability as first-class versioned/effective-dated
        relationships, and require released production orders to resolve the
        applicable revision from ECO state plus effectivity rather than from a
        potentially stale `Part.rev` batch copy. Make the source-of-truth
        precedence explicit for the transition window. Source finding context:
        .onto/review/20260716-e5e2a98b/round1/axiology.findings.yaml#axiology-c\
        andidate-002 Source finding context: The declared review purpose is
        PLM/MES integration suitability with emphasis on change-management
        consistency and manufacturing operating risk. Source finding context:
        During the period after an ECO effective date but before weekly
        `Part.rev` synchronization, MES or downstream consumers may see a stale
        revision while the integrity rule says production must follow the new
        revision. Source finding context: The concept baseline can permit
        wrong-revision manufacturing or ambiguous revision traceability, which
        is material to manufacturing execution and change-control trust. Source
        finding context: The ontology separates change effectivity authority
        from part revision synchronization without modeling the precedence and
        transition state as a controlled integration concept. Source finding
        context: `Part.rev` is present as the part revision field, with the
        drawing ledger named as its source of truth. Source finding context:
        `ECO` carries affected parts, effective date, and status, and
        `Part.current_eco` separately points to the latest ECO. Source finding
        context: The integrity rule says production after `ECO.effective_date`
        follows the new revision, but `Part.rev` is synchronized later by weekly
        batch after drawing-ledger reflection. Source finding context: This
        creates a bounded transition where the integration baseline can expose
        stale revision identity while requiring new-revision production
        behavior."
