      rationale: "This is a structural completeness defect in the formal graph
        surface. Because the ontology is intended as an integration baseline,
        graph consumers must be able to traverse to the relationship entity and
        its qualifiers before relying on alternate-part semantics. Source
        finding context: manufacturing-bom-ontology.yaml /
        entities.AlternatePart and relations Source finding context:
        .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input\
        .md:37 and
        .onto/review/20260716-e5e2a98b/execution-preparation/materialized-input\
        .md:84 Source finding context: AlternatePart is declared as an entity
        but is not connected by any formal relation. Source finding context:
        Within the structural relation graph, `AlternatePart` is effectively
        orphaned: graph consumers can traverse `Part -> Part alternate_of`, but
        cannot reach the entity that carries the alternate relationship's own
        attributes, especially `direction`. For a PLM/MES integration concept
        baseline, this weakens the completeness of the declared alternate-part
        structure because the relationship entity exists in `entities` but is
        absent from the formal connectivity surface. Source finding context:
        Make `AlternatePart` the explicit relationship node in `relations`, for
        example add relations from `AlternatePart` to `Part` for `primary_ref`
        and `alternate_ref`, and either remove the shorthand `Part -> Part
        alternate_of` relation or define it as a derived projection that
        preserves linkage to `AlternatePart.direction`. Source finding context:
        .onto/review/20260716-e5e2a98b/round1/structure.findings.yaml#structure\
        -candidate-001 Source finding context: Use the ontology as a PLM/MES
        integration concept baseline for BOM, routing, and related manufacturing
        master-data structures. Source finding context: When integration or
        validation logic relies on the formal `relations` list to discover
        connected ontology concepts, `AlternatePart` is not reachable as a
        relationship entity despite carrying the alternate-part fields. Source
        finding context: The alternate-part concept is split between an entity
        and an unconnected shorthand relation, so downstream consumers can miss
        the entity attributes that qualify the relationship. This reduces trust
        in the ontology as a structurally complete concept baseline. Source
        finding context: The formal relation list models alternates as a direct
        `Part -> Part` shorthand instead of connecting the declared
        `AlternatePart` entity into the graph. Source finding context:
        `AlternatePart` is declared as an entity with references to two `Part`
        endpoints and a `direction` attribute. Source finding context: The
        `relations` list does not include any edge whose `from` or `to` endpoint
        is `AlternatePart`; it includes only `Part -> Part alternate_of`. Source
        finding context: Because the relationship entity is absent from the
        formal relation graph, its qualifying field `direction` is not
