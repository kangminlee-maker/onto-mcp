findings:
  - candidate_id: axiology-candidate-001
    target: manufacturing-bom-ontology.yaml — ECO/Part revision effectivity contract
    evidence_anchor: ".onto/review/20260718-ca026909/execution-preparation/review-v\
      alue-alignment-criteria.yaml, criterion_id=user-request-intent: “PLM/MES
      통합의 개념 기준 문서”; materialized-input.md, Part.rev/current_eco and
      integrity_rules: “ECO.effective_date 이후 생산분은 신규 rev를 따른다. 단 Part.rev 갱신은 …
      주간 배치로 동기화한다.”"
    claim: 설계변경 효력 발생과 품목 리비전 반영 사이의 의도적 지연은 PLM/MES 통합 기준이라는 목적에 정렬되지 않는다.
    what: ECO 효력일 이후에는 신규 리비전을 사용해야 하지만, MES가 참조할 수 있는 Part.rev는 도면 관리대장의 주간 배치 이후에야
      갱신된다. 이 기간에 어떤 값이 생산 판단의 우선 권한인지 정의되지 않는다.
    why: 효력일과 동기화 시점 사이에 생산 오더가 생성되면 동일 품목에 대해 ECO와 Part.rev가 서로 다른 상태를 나타낼 수 있다. 통합
      기준 문서가 이 충돌의 우선순위나 차단 조건을 제공하지 않으므로, 변경관리의 단일한 운영 기준을 제공한다는 선언된 목적이 실패한다.
    how_to_fix: 설계 효력성을 Part.rev의 복사값이 아니라 버전·효력구간을 가진 명시적 변경 적용 관계로 모델링하고, 신규 리비전
      동기화가 확인되기 전에는 관련 생산 릴리스를 차단하거나 명시적인 예외 승인을 요구한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 품목·변경관리 정합성을 갖춘 PLM/MES 통합 개념 기준 제공
      failure_condition: ECO.effective_date 이후이지만 도면 관리대장의 주간 Part.rev 동기화 이전에 생산 판단이 수행되는 경우
      impact: 동일 생산분에 대해 PLM 변경 효력과 MES 품목 리비전이 달라져 구 리비전 생산 또는 추적 불가능한 예외가 발생할 수 있다.
      evidence_refs:
        - review-value-alignment-criteria.yaml#criterion_id=user-request-intent
        - materialized-input.md#entities.Part.attributes.rev
        - materialized-input.md#entities.Part.attributes.current_eco
        - materialized-input.md#integrity_rules[2]
    causal_path:
      root_cause_candidate: 변경 효력성과 품목 리비전을 하나의 일관된 시간·권한 모델로 결합하지 않고, 서로 다른 원본과 지연 배치에 맡겼다.
      root_cause_step_id: axiology-candidate-001.cause-003
      steps:
        - cause_id: axiology-candidate-001.cause-001
          claim: ECO 효력일 이후 생산분은 신규 rev를 따라야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md#integrity_rules[2]
        - cause_id: axiology-candidate-001.cause-002
          claim: Part.rev는 별도 도면 관리대장이 원본이며 주간 배치 후에만 갱신된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md#entities.Part.attributes.rev
            - materialized-input.md#integrity_rules[2]
        - cause_id: axiology-candidate-001.cause-003
          claim: 충돌 기간의 우선 권한, 동기화 확인 상태, 생산 차단 조건이 모델에 없다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md#entities.Part
            - materialized-input.md#entities.ECO
            - materialized-input.md#integrity_rules
      unresolved_beyond_evidence: 실제 PLM/MES가 별도 차단 로직을 갖는지는 경계 내 증거로 확인할 수 없지만, 이 문서
        자체가 개념 기준 역할을 완결하지 못한다는 판단에는 영향을 주지 않는다.
  - candidate_id: axiology-candidate-002
    target: manufacturing-bom-ontology.yaml — cross-system operational values and
      authority
    evidence_anchor: ".onto/review/20260718-ca026909/execution-preparation/review-v\
      alue-alignment-criteria.yaml, criterion_id=user-request-intent: “PLM/MES
      통합의 개념 기준 문서”; materialized-input.md, BomLine.scrap_rate,
      WorkCenter.capacity_per_shift, notes on std_time and uom conversion"
    claim: 문서는 핵심 운영값의 수기 복사·현장 환산·분기 대사를 정상 상태로 수용하여 통합 기준이라는 목적을 약화한다.
    what: 스크랩률은 엑셀에서 복사되고, 표준시간 누계는 두 시스템에 중복 유지되며, 작업장 용량 단위는 작업장마다 다르고, 품목별 UOM
      환산계수는 아예 없어 현장에서 환산한다.
    why: BOM 수량, 생산능력, 원가의 계산 결과가 시스템별 또는 작업자별 해석에 의존한다. 문서가 각 값의 권한, 단위 차원, 변환 규칙,
      파생 규칙을 통합 개념으로 만들지 않고 수기 우회로를 보존하므로 PLM/MES 간 공유 기준으로 사용할 때 재현성과 책임 소재가
      약해진다.
    how_to_fix: 스크랩률·표준시간·용량·환산계수를 단위, 적용 범위, 버전/효력일, 권한 시스템과 함께 모델링한다. 중복 저장값은
      권한값에서 계산되는 파생 projection으로 명시하고 동기화 상태와 대사 실패를 표현한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM·라우팅 및 제조 운영값에 대한 PLM/MES 공통 개념 기준 제공
      failure_condition: BOM 전개, 용량 계획, 원가 계산 또는 단위 변환이 복사값·수기 입력·현장 환산에 의존하는 경우
      impact: 동일 기준 문서를 사용해도 시스템과 작업자에 따라 서로 다른 자재 소요량, 능력 또는 원가가 산출되어 통합 결과를 신뢰하기 어렵다.
      evidence_refs:
        - review-value-alignment-criteria.yaml#criterion_id=user-request-intent
        - materialized-input.md#entities.BomLine.attributes.scrap_rate
        - materialized-input.md#entities.WorkCenter.attributes.capacity_per_shift
        - materialized-input.md#notes[0]
        - materialized-input.md#notes[1]
    causal_path:
      root_cause_candidate: 통합 대상의 핵심 운영값을 권한·단위·파생 규칙이 있는 공유 개념으로 승격하지 않고 기존 수기 우회 절차를 주석으로 유지했다.
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: 핵심 제조 계산 입력이 엑셀 복사, 중복 수기 입력, 현장 환산에 의존한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md#entities.BomLine.attributes.scrap_rate
            - materialized-input.md#notes
        - cause_id: axiology-candidate-002.cause-002
          claim: capacity_per_shift는 하나의 수치 필드이지만 단위가 개수 또는 시간으로 달라진다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md#entities.WorkCenter.attributes.capacity_per_shift
        - cause_id: axiology-candidate-002.cause-003
          claim: 이 값들에 공통 단위, 환산계수, 효력성 및 권한/파생 관계가 정의되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md#entities
            - materialized-input.md#notes
      unresolved_beyond_evidence: 외부 시스템에 별도 마스터가 존재하는지는 확인할 수 없으나, 문서는 환산계수 부재와 수기
        절차를 명시하므로 개념 기준 내부의 목적 불일치는 경계 내에서 성립한다.
  - candidate_id: axiology-candidate-003
    target: manufacturing-bom-ontology.yaml — cyclic BOM exception for scrap re-input
    evidence_anchor: ".onto/review/20260718-ca026909/execution-preparation/review-v\
      alue-alignment-criteria.yaml, criterion_id=user-request-intent:
      “품목·BOM·라우팅 … 개념의 정합성과 제조 운영 위험”; materialized-input.md,
      integrity_rules[0]: “BOM은 비순환이어야 한다. 단, 재생 원료 회수 공정… Assembly가 자기 하위에 자신을
      포함”"
    claim: 공정상 스크랩 재투입을 품목 구조의 자기 포함으로 표현하는 국소적 편의가 BOM 기준의 의미와 운영 안정성을 훼손한다.
    what: 문서는 BOM 비순환을 요구하면서 재생 원료 회수 공정은 Assembly가 자기 자신을 하위 품목으로 포함하도록 예외를 둔다.
    why: 공정 흐름 또는 물질 회수라는 별도 의미를 BOM 구성 관계에 적재하면, 일반 BOM 전개 소비자는 동일 관계를 구성 수량과 재순환
      흐름 중 무엇으로 해석해야 하는지 결정할 수 없다. 이는 통합 개념 기준의 명료성을 희생해 특정 공정을 간단히 표현하는 정당화되지
      않은 트레이드오프다.
    how_to_fix: BOM 구성 관계는 비순환으로 유지하고, 스크랩 발생·회수·재투입을 Routing/Operation에 연결된 별도 물질흐름
      또는 부산물/회수 관계로 모델링한다. 해당 관계에 회수율, 투입 지점과 효력 조건을 둔다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 정합적인 BOM·라우팅 개념을 PLM/MES 공통 기준으로 제공
      failure_condition: 스크랩 재투입이 있는 품목의 BOM을 일반 전개, 소요량 계산 또는 순환 검증에 사용하는 경우
      impact: 동일한 자기 참조가 허용된 공정 예외인지 잘못된 순환 BOM인지 구분되지 않아 전개 실패, 무한 계산 또는 잘못된 자재 소요량으로
        이어질 수 있다.
      evidence_refs:
        - review-value-alignment-criteria.yaml#criterion_id=user-request-intent
        - materialized-input.md#integrity_rules[0]
        - materialized-input.md#entities.BomLine
    causal_path:
      root_cause_candidate: 공정의 재순환 물질흐름을 표현할 별도 개념 없이 BOM 구성 관계를 재사용했다.
      root_cause_step_id: axiology-candidate-003.cause-003
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: BOM은 비순환이어야 한다는 원칙과 자기 포함 예외가 같은 규칙에 공존한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md#integrity_rules[0]
        - cause_id: axiology-candidate-003.cause-002
          claim: 예외는 재생 원료 회수라는 공정 현상을 Assembly-BomLine-Part 구성 구조로 표현한다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md#integrity_rules[0]
            - materialized-input.md#entities.BomLine
        - cause_id: axiology-candidate-003.cause-003
          claim: 재투입 흐름을 표현하는 독립 관계나 엔티티가 대상 모델에 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md#entities
            - materialized-input.md#relations
      unresolved_beyond_evidence: 실제 소비자가 순환 전개를 방지하는 별도 규칙을 가졌는지는 확인할 수 없지만, 개념 기준
        자체에서 두 의미를 분리하지 않은 문제는 남는다.
