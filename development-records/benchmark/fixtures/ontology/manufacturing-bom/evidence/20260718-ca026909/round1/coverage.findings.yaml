  - candidate_id: coverage-candidate-006
    target: 단위 및 환산 개념
    evidence_anchor: materialized-input.md:19, 34, 66-67, 100
    claim: 수량과 능력의 단위·환산 모델이 없어 이종 단위 계산을 안전하게 수행할 수 없다.
    what: Part.uom은 ea/kg/m 열거만 제공하고 BomLine.qty_per에는 별도 단위가 없다.
      WorkCenter.capacity_per_shift의 단위는 작업장마다 개수 또는 시간으로 달라지며, 품목별 환산계수 마스터가 없고
      현장에서 환산한다고 명시한다.
    why: BOM 소요량, 스크랩 보정 및 작업장 능력을 시스템 간 전달하거나 계산할 때 값의 차원과 환산 기준이 불명확해 자재 부족·과다 투입
      또는 잘못된 능력 계획으로 이어질 수 있다.
    how_to_fix: UOM을 독립된 기준 개념으로 만들고 각 quantity/capacity 값에 단위를 필수 연결한다. 품목·유효기간별
      ConversionFactor, 기준 수량, 반올림 규칙과 권위 시스템을 추가하며 환산 불가 시 처리 규칙을 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
