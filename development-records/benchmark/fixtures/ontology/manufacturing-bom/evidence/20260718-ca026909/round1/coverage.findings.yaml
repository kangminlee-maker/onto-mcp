  - candidate_id: coverage-candidate-002
    target: MES 생산 실행 범위
    evidence_anchor: materialized-input.md:12-91, 95
    claim: 생산 오더를 규칙에서 사용하지만 생산 실행과 추적을 표현하는 개념이 없다.
    what: 무결성 규칙은 생산 오더 생성을 통제하지만 ProductionOrder 엔티티가 없고, 투입 자재, 실행 공정, 작업 실적,
      lot/serial, 실제 소비 및 생산 계보를 표현할 개념도 없다.
    why: 라우팅 release에서 MES 실행으로 넘어가는 핵심 통합 경계가 정의되지 않아 어떤 BOM·라우팅·revision이 실제 오더와
      생산분에 고정되었는지 표현할 수 없다.
    how_to_fix: 최소한 ProductionOrder, 생산 대상 revision/BOM/Routing 스냅샷,
      OperationExecution, MaterialConsumption 및 Lot/Serial genealogy 개념과 핵심 관계를
      추가하거나, 별도 MES 실행 온톨로지의 정식 경계와 연결 계약을 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합의 개념 기준 문서
      failure_condition: released 라우팅으로 생산 오더를 생성하고 실제 생산 결과를 설계·공정 기준과 연결할 때
      impact: 문서가 마스터 데이터까지만 포괄하여 PLM 설계 기준과 MES 실행 사실 사이의 추적 계약을 제공하지 못한다.
      evidence_refs:
        - materialized-input.md:6-7
        - materialized-input.md:12-91
        - materialized-input.md:95
    causal_path:
      root_cause_candidate: 온톨로지 범위가 제조 마스터 정의에서 끝나고 MES 실행 하위 영역은 모델링되지 않았다.
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
