    evidence_anchor: materialized-input.md:20-21, 27-35, 53-61, 69-75, 96
    claim: 변경 가능한 BOM·라우팅 값의 버전과 유효기간이 없어 과거 시점 구성을 재현할 수 없다.
    what: Part에는 현재 rev와 current_eco만 있고, BomLine·Routing·Operation·AlternatePart에는
      버전, 유효 시작·종료 시점, 변경 이력이 없다. ECO의 effective_date도 변경 전후 BOM·라우팅 버전에 연결되지
      않는다.
    why: ECO 적용 전후의 정확한 자재 구성, 대체품, 표준시간과 공정 순서를 특정 생산 시점 기준으로 판정할 수 없다. 주간 배치 지연까지
      명시되어 PLM과 MES가 서로 다른 구성을 사용할 위험이 있다.
    how_to_fix: 버전이 있는 BOM/Routing 헤더와 revision 또는 effectivity 개념을 추가하고, 각
      BomLine·Operation·대체 관계를 유효 시작·종료 시점 및 ECO에 연결한다. 특정 시점의 유효 구성을 결정하는 규칙도
      명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 품목·BOM·라우팅·변경관리의 공통 개념 기준 제공
      failure_condition: ECO 발효 전후 생산분, 지연 동기화 기간 또는 과거 생산분의 적용 구성을 판정할 때
      impact: 동일 생산분에 PLM과 MES가 다른 BOM 또는 라우팅을 적용할 수 있고 과거 기준 구성을 감사·재현할 수 없다.
