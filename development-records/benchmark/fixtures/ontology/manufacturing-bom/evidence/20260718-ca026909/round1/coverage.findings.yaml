  - candidate_id: coverage-candidate-003
    target: Routing 및 ECO lifecycle
    evidence_anchor: materialized-input.md:55-61, 69-75
    claim: 상태 lifecycle이 정상 진행 단계에만 머물러 종료·철회·정정 사건을 수용하지 못한다.
    what: Routing은 draft/released만, ECO는 open/approved/applied만 정의한다. obsolete,
      superseded, cancelled, rejected, archived 같은 종결 상태와 승인 취소·정정·재발행 사건이 없다.
    why: 잘못 승인된 ECO의 철회, 단종 라우팅의 사용 중지, 적용 후 정정 같은 운영 사건을 기존 상태 의미를 훼손하지 않고 기록할 수
      없다.
    how_to_fix: 각 상태 보유 엔티티에 명시적 상태 전이 모델을 두고 취소·거절·대체·폐기 상태와 correction,
      withdrawal, reissue 사건을 정의한다. 종결 후 허용되는 전이도 구분한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 라우팅 및 변경관리 개념의 운영상 일관성
      failure_condition: 승인 또는 release 이후 철회, 단종, 대체, 정정이 발생할 때
      impact: 현실의 종결·예외 사건이 현재 상태값에 덮어써지거나 비정형 외부 기록으로 빠져 변경 이력의 신뢰가 약해진다.
      evidence_refs:
        - materialized-input.md:55-61
        - materialized-input.md:69-75
    causal_path:
      root_cause_candidate: 상태 열거가 정상적인 전진 흐름만 표현하고 lifecycle 사건과 전이 규칙을 별도 개념화하지 않았다.
      root_cause_step_id: coverage-candidate-003.cause-002
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: Routing과 ECO 상태 목록에 종료·철회·정정 상태가 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:61
            - materialized-input.md:75
        - cause_id: coverage-candidate-003.cause-002
          claim: 상태 전이 및 종결 후 사건 모델의 부재가 불완전한 상태 열거로 나타난다.
