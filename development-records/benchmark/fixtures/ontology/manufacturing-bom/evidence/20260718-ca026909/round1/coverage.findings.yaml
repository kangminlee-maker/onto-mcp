  - BOM 수량, 대체품, 표준시간, 라우팅 순서와 불량률은 시점에 따라 변경될 수 있는 제조 마스터 값으로 보았다.
  - session_domain이 none이므로 외부 산업 표준을 권위 규칙으로 사용하지 않고 대상의 선언 목적과 내부 서술만으로 포괄 범위를
    판단했다.
