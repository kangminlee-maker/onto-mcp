      failure_condition: 복사본·계산값·수기값이 서로 다르거나 동기화 및 대사 사이에 지연이 있을 때
      impact: 단일 원본을 결정할 수 없어 동일 개념에 대한 계획, 실행, 원가 계산 결과가 시스템별로 달라질 수 있다.
      evidence_refs:
