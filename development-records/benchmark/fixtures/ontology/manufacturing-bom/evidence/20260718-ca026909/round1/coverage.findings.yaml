      failure_condition: 상·하위 품목 단위가 다르거나 작업장별 capacity 단위가 다른 생산계획을 계산할 때
      impact: 숫자는 전달되지만 의미 단위와 환산 근거가 없어 계산 결과의 정확성을 보장할 수 없다.
