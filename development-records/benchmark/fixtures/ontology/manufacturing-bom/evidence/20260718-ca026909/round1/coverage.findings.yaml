  - candidate_id: coverage-candidate-005
    target: 병행 관리 값의 권위와 데이터 계보
    evidence_anchor: materialized-input.md:35, 53, 99
    claim: 여러 시스템에서 관리되는 불량률·표준시간/원가 값에 단일 권위와 파생 관계가 지정되지 않았다.
    what: scrap_rate는 생산계획팀 엑셀 값을 복사한다고만 되어 있고, 누적 std_time은 MES 계산값과 표준원가 시스템 수기값이
      병존한다. 어느 값이 충돌 시 우선하는지, 복사본인지 파생값인지, 대사 결과가 어디에 귀속되는지 정의되지 않는다.
    why: PLM/MES/원가 시스템 간 값이 달라졌을 때 통합 소비자가 어떤 값을 신뢰해야 하는지 결정할 수 없고, 분기 대사 전까지 계획·원가
      결과가 비일관적일 수 있다.
