  axiology:
    domain_constraints_used: []
    domain_context_assumptions:
      - 외부 제조 도메인 규칙은 사용하지 않았다. PLM/MES 통합 기준은 시스템 간 공유되는 값의 의미·권한·효력성을 결정 가능하게
        해야 한다는 판단은 확인된 user-request-intent와 대상 문서의 선언된 목적에서 직접 도출했다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합의 개념 기준 문서는 설계·제조 마스터뿐 아니라 release된 기준이 생산 실행에 적용된 사실까지 추적할 수
        있어야 한다.
      - BOM 수량, 대체품, 표준시간, 라우팅 순서와 불량률은 시점에 따라 변경될 수 있는 제조 마스터 값으로 보았다.
      - session_domain이 none이므로 외부 산업 표준을 권위 규칙으로 사용하지 않고 대상의 선언 목적과 내부 서술만으로 포괄
        범위를 판단했다.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합 기준은 생산 오더가 사용한 품목·BOM·라우팅 구성을 사후 재현할 수 있어야 한다.
      - 품목 단위와 대체 가능성은 연계 시스템, 사업장 또는 효력 시점에 따라 확장될 수 있다.
      - 명시적인 불변성 또는 버전 관계가 없는 엔티티 속성은 현재 상태로 갱신될 수 있다고 가정했다.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - direction의 one_way는 note의 '대체 방향'이라는 명시대로 역방향 대체를 보장하지 않는 상태를 뜻한다고 해석했다.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - 제품 BOM은 제품을 구성하거나 소모되는 품목 구조를 나타내고, 공정 중 스크랩 회수·재투입 흐름과는 의미적으로 구분된다고
        가정했다.
      - 검사 계획은 검사 활동을 규정하는 정보 객체이고 Operation은 수행되는 제조 활동 유형이라고 가정했다.
      - PLM 통합에서는 품목 개정과 도면 문서 개정이 별도 식별·효력 대상을 가질 수 있다고 가정했다.
      - 작업장 산출 수량과 가용 시간은 서로 다른 측정 차원이며 명시적 단위 없이 동일 값으로 비교할 수 없다고 가정했다.
  structure:
    domain_constraints_used: []
    domain_context_assumptions:
      - relations 섹션은 통합 소비자가 사용할 명시적 관계 그래프이며, attributes의 ref 선언과 구조적으로 일치해야
        한다.
      - integrity_rules에 선언된 규칙은 온톨로지의 개념과 관계를 통해 필요한 대상을 식별할 수 있어야 한다.
