    evidence_anchor: ".onto/review/20260718-ca026909/execution-preparation/review-v\
      alue-alignment-criteria.yaml, criterion_id=user-request-intent: “PLM/MES
      통합의 개념 기준 문서”; materialized-input.md, Part.rev/current_eco and
      integrity_rules: “ECO.effective_date 이후 생산분은 신규 rev를 따른다. 단 Part.rev 갱신은 …
      주간 배치로 동기화한다.”"
    claim: 설계변경 효력 발생과 품목 리비전 반영 사이의 의도적 지연은 PLM/MES 통합 기준이라는 목적에 정렬되지 않는다.
    lens_rationale_summary: 효력일과 동기화 시점 사이에 생산 오더가 생성되면 동일 품목에 대해 ECO와 Part.rev가 서로
      다른 상태를 나타낼 수 있다. 통합 기준 문서가 이 충돌의 우선순위나 차단 조건을 제공하지 않으므로, 변경관리의 단일한 운영 기준을
      제공한다는 선언된 목적이 실패한다.
    proposed_action: 설계 효력성을 Part.rev의 복사값이 아니라 버전·효력구간을 가진 명시적 변경 적용 관계로 모델링하고, 신규
      리비전 동기화가 확인되기 전에는 관련 생산 릴리스를 차단하거나 명시적인 예외 승인을 요구한다.
    affected_purpose: 품목·변경관리 정합성을 갖춘 PLM/MES 통합 개념 기준 제공
    failure_condition: ECO.effective_date 이후이지만 도면 관리대장의 주간 Part.rev 동기화 이전에 생산 판단이 수행되는 경우
    impact: 동일 생산분에 대해 PLM 변경 효력과 MES 품목 리비전이 달라져 구 리비전 생산 또는 추적 불가능한 예외가 발생할 수 있다.
    evidence_refs:
      - .onto/review/20260718-ca026909/round1/axiology.findings.yaml#axiology-candidate-001
      - review-value-alignment-criteria.yaml#criterion_id=user-request-intent
