    causal_path:
      root_cause_candidate: 변경 효력성과 품목 리비전을 하나의 일관된 시간·권한 모델로 결합하지 않고, 서로 다른 원본과 지연 배치에 맡겼다.
      root_cause_step_id: finding-001.cause-003
      steps:
        - cause_id: finding-001.cause-001
          claim: ECO 효력일 이후 생산분은 신규 rev를 따라야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md#integrity_rules[2]
        - cause_id: finding-001.cause-002
          claim: Part.rev는 별도 도면 관리대장이 원본이며 주간 배치 후에만 갱신된다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md#entities.Part.attributes.rev
            - materialized-input.md#integrity_rules[2]
        - cause_id: finding-001.cause-003
          claim: 충돌 기간의 우선 권한, 동기화 확인 상태, 생산 차단 조건이 모델에 없다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md#entities.Part
            - materialized-input.md#entities.ECO
            - materialized-input.md#integrity_rules
      unresolved_beyond_evidence: 실제 PLM/MES가 별도 차단 로직을 갖는지는 경계 내 증거로 확인할 수 없지만, 이 문서
        자체가 개념 기준 역할을 완결하지 못한다는 판단에는 영향을 주지 않는다.
