findings:
  - candidate_id: axiology-candidate-001
    target: manufacturing-bom-ontology.yaml — ECO/Part/Routing 변경 적용 규칙
    evidence_anchor: '대상: materialized-input.md:20-21, 61, 69-75, 93-96. 가치 근거:
      value_type=purpose; alignment_direction=misaligned;
      value_authority_anchor={source:
      .onto/review/20260718-ddf66b5d/execution-preparation/review-value-alignment-criteria.yaml,
      anchor: criterion user-request-intent (lines 6-8), excerpt: "PLM/MES 통합의
      개념 기준 문서로 적절한지…변경관리 개념의 정합성과 제조 운영 위험을 중심으로."}'
    claim: ECO 발효 시점과 Part.rev 주간 동기화가 분리되어, 변경 발효 후에도 구 리비전으로 생산을 허용할 수 있는 기준 모델이다.
    what: 신규 리비전 적용 의무는 ECO.effective_date에 발생하지만 Part.rev는 도면 관리대장 반영 후 주간 배치로
      갱신된다. 생산 오더 생성 조건은 Routing.status=released뿐이며, 발효 ECO와 실제 사용할 BOM·라우팅·리비전의
      일치 조건이 없다.
    why: PLM/MES 통합 기준은 어느 제품 구성이 특정 생산분에 유효한지 일관되게 판정해야 한다. 현재 규칙은 발효일부터 배치 동기화까지의
      구간에 상충하는 두 상태를 정당한 것으로 남겨 변경관리 정합성과 제조 실행 안전이라는 선언 목적을 훼손한다.
    how_to_fix: ECO 적용 단위를 불변 구성 리비전으로 모델링하고, effective_date/lot 또는 serial 범위에 따라
      유효한 Part·BOM·Routing 버전을 원자적으로 선택하게 한다. 생산 오더 생성 조건에도 승인·발효된 구성 버전과의 일치
      검증을 추가한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM과 MES가 동일한 변경 발효 상태와 제조 구성을 사용하는 개념 기준 제공
      failure_condition: ECO가 발효됐지만 주간 배치가 Part.rev를 아직 갱신하지 않은 기간에 생산 오더가 생성되는 경우
      impact: 동일 생산분을 PLM은 신규 리비전, MES는 구 리비전으로 해석할 수 있어 잘못된 자재·공정·검사 기준으로 생산될 위험이 생긴다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:61
        - materialized-input.md:69-75
        - materialized-input.md:93-96
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 변경의 권위 단위를 발효된 구성 버전으로 모델링하지 않고, 지연 동기화되는 mutable
        Part.rev와 독립적인 Routing.release 상태에 분산했다.
      root_cause_step_id: axiology-candidate-001.cause-003
      steps:
        - cause_id: axiology-candidate-001.cause-001
          claim: ECO.effective_date 이후 신규 rev를 따라야 하지만 Part.rev는 주간 배치로 늦게 갱신된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:20-21
            - materialized-input.md:69-75
            - materialized-input.md:96
        - cause_id: axiology-candidate-001.cause-002
          claim: 생산 오더 게이트는 Routing.status=released만 검사하며 발효 ECO 또는 구성 리비전 일치를 요구하지 않는다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:55-61
            - materialized-input.md:95
        - cause_id: axiology-candidate-001.cause-003
          claim: 변경 권위가 발효 구성 버전 하나로 결속되지 않고 ECO, Part.rev, Routing 상태에 분산되어 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:20-21
            - materialized-input.md:55-61
            - materialized-input.md:69-75
            - materialized-input.md:95-96
      unresolved_beyond_evidence: 실제 PLM/MES가 별도 차단 로직을 갖는지는 경계 내에서 확인할 수 없지만, 이 문서 자체에는 그 통합 계약이 없다.
  - candidate_id: axiology-candidate-002
    target: manufacturing-bom-ontology.yaml — 수율·표준시간·단위 데이터 권위
    evidence_anchor: '대상: materialized-input.md:35, 53, 67, 98-100. 가치 근거:
      value_type=tradeoff; alignment_direction=misaligned;
      value_authority_anchor={source:
      .onto/review/20260718-ddf66b5d/execution-preparation/review-value-alignment-criteria.yaml,
      anchor: criterion user-request-intent (lines 6-8), excerpt: "PLM/MES 통합의
      개념 기준 문서…제조 운영 위험을 중심으로."}'
    claim: 온톨로지가 핵심 계획·원가·능력 값을 복사·수기 입력·현장 환산에 맡겨 통합 기준보다 부서별 편의를 우선한다.
    what: scrap_rate는 생산계획팀 엑셀 값을 복사하고, 누적 표준시간은 MES 계산값과 표준원가 시스템 수기값을 분기마다 대사하며,
      WorkCenter 능력 단위는 작업장별로 다르고 품목별 UOM 환산 마스터도 없다.
    why: 이 선택은 당장의 시스템 연결 비용을 줄이는 대신 BOM 소요량, 원가, 능력계획에 서로 다른 값과 단위를 허용한다. 그런
      트레이드오프의 허용 범위·권위·동기화 실패 처리가 없어 PLM/MES의 공통 개념 기준이라는 목적과 정렬되지 않는다.
    how_to_fix: scrap_rate, 표준시간, 능력, UOM 환산 각각에 단일 권위 소스와 단위 포함 타입을 지정하고, 복사 필드 대신
      출처 참조·유효기간·동기화 상태를 모델링한다. 파생값은 원천에서 계산하고 수기 재입력 대신 자동 대사와 불일치 차단/공개 규칙을
      둔다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM·라우팅 정보를 PLM/MES가 동일한 의미와 값으로 교환하는 통합 개념 기준 제공
      failure_condition: 엑셀 복사값, MES 계산값, 원가 시스템 수기값 또는 현장 환산값이 서로 달라지는 경우
      impact: 자재 소요량, 표준원가, 작업장 능력 계산이 시스템별로 달라져 기준 문서가 통합 판정 기준 역할을 하지 못한다.
      evidence_refs:
        - materialized-input.md:35
        - materialized-input.md:53
        - materialized-input.md:67
        - materialized-input.md:98-100
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 핵심 제조 수치의 소유권·단위·파생 규칙을 통합 계약으로 확정하지 않고 기존 수기 운영을 정상 경로로 수용했다.
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: 수율, 표준시간, 능력 및 환산값이 복사·수기 입력·현장 판단의 여러 경로에서 관리된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:35
            - materialized-input.md:67
            - materialized-input.md:98-100
        - cause_id: axiology-candidate-002.cause-002
          claim: 이 경로들의 단일 권위, 단위 계약, 유효기간 또는 불일치 처리 규칙이 모델에 없다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:47-67
            - materialized-input.md:98-100
        - cause_id: axiology-candidate-002.cause-003
          claim: 통합 의미를 확정하기보다 기존 부서별 수기 운영 방식을 개념 모델에 그대로 수용했다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:35
            - materialized-input.md:98-100
      unresolved_beyond_evidence: 각 외부 시스템에 보완 통제가 있는지는 경계 밖이지만, 기준 문서에는 그 통제나 권위 관계가 명시되지 않았다.
  - candidate_id: axiology-candidate-003
    target: manufacturing-bom-ontology.yaml — BOM 비순환 원칙과 스크랩 재투입 예외
    evidence_anchor: '대상: materialized-input.md:29-35, 93-94. 가치 근거:
      value_type=principle; alignment_direction=misaligned;
      value_authority_anchor={source:
      .onto/review/20260718-ddf66b5d/execution-preparation/review-value-alignment-criteria.yaml,
      anchor: criterion user-request-intent (lines 6-8), excerpt:
      "품목·BOM·라우팅·변경관리 개념의 정합성과 제조 운영 위험을 중심으로."}'
    claim: 재생 원료 회수라는 공정 흐름을 자기참조 BOM으로 표현해, 국소적인 모델 단순화가 BOM 비순환성과 제조 계산 안전을 훼손한다.
    what: 무결성 규칙은 BOM 비순환을 요구하면서 동시에 스크랩 재투입을 Assembly가 자기 하위에 자신을 포함하는 형태로 모델링하도록
      허용한다.
    why: 스크랩 회수는 투입·산출·수율의 공정 흐름인데 이를 부품 구성 관계로 재사용하면 일반 BOM 전개가 종료된다는 핵심 전제를 깨뜨린다.
      별도 개념을 만들지 않는 편의가 소요량 계산과 PLM/MES 교환의 예측 가능성보다 우선된 정당화되지 않은 트레이드오프다.
    how_to_fix: BomLine은 엄격히 비순환으로 유지하고, 회수·재투입은 Operation의 부산물/회수 산출과 후속 투입을 연결하는
      별도 material-flow 또는 recycle-flow 관계로 모델링한다. 계산 소비자가 두 그래프를 구분하도록 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 정합적인 BOM·공정 개념을 통해 PLM/MES가 동일하고 안전하게 제품 구조와 제조 흐름을 해석하도록 하는 것
      failure_condition: 스크랩 재투입 자기참조가 일반 BOM 전개, 소요량 계산 또는 순환 검증에 입력되는 경우
      impact: BOM 전개가 무한 반복되거나 예외 처리에 따라 시스템별 결과가 달라져 개념 기준의 예측 가능성과 운영 안전이 약화된다.
      evidence_refs:
        - materialized-input.md:29-35
        - materialized-input.md:93-94
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 제품 구성 그래프와 제조 물질 흐름을 분리하지 않고 BomLine 하나에 두 목적을 부여했다.
      root_cause_step_id: axiology-candidate-003.cause-003
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: 비순환이어야 하는 BOM에 Assembly 자기참조 예외가 허용된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:93-94
        - cause_id: axiology-candidate-003.cause-002
          claim: 스크랩 재투입 공정이 구성 부품 관계인 BomLine으로 표현된다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:94
        - cause_id: axiology-candidate-003.cause-003
          claim: 제품 구성과 공정 물질 흐름이 별도 개념으로 분리되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:47-60
            - materialized-input.md:93-94
      unresolved_beyond_evidence: 실제 BOM 전개기가 이 예외를 특별 처리하는지는 경계 내 증거가 없으나, 개념 기준 자체는
        소비자가 따라야 할 종료 의미를 제공하지 않는다.
