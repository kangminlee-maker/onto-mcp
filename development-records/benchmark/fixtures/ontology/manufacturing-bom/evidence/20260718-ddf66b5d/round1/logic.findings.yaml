    what: 동일 규칙이 모든 BOM을 비순환으로 요구하면서, 스크랩 재투입은 Assembly가 자기 자신을 하위에 포함하도록 규정한다.
    why: 자기 참조 간선은 길이 1의 순환이므로 비순환 조건을 위반한다. conflict_pair는
      materialized-input.md:94의 두 문장이며, intra-claim·mixed modality 충돌이다.
    how_to_fix: 기본 비순환 규칙에서 명시적으로 제외되는 별도 재투입 관계를 만들거나, 허용 가능한 순환을 타입과 조건으로 한정한 검증
      규칙으로 교체한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
