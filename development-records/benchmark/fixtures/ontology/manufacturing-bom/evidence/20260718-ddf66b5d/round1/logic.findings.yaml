  - candidate_id: logic-candidate-002
    target: manufacturing-bom-ontology.yaml — AlternatePart 정의와 direction 속성
    evidence_anchor: .onto/review/20260718-ddf66b5d/execution-preparation/materialized-input.md:37-45
    claim: fail — 대체 관계의 필수 대칭성 정의와 one_way 허용·기본값은 양립할 수 없다.
    what: AlternatePart 정의는 A가 B의 대체이면 B도 A의 대체라고 선언하지만, direction은 one_way를 허용하고 이를
      기본값으로 둔다.
    why: one_way 인스턴스는 역방향 대체가 성립하지 않으므로 정의가 요구하는 대칭성을 만족하지 못한다. conflict_pair는
      materialized-input.md:38과 :42-45이며, inter-claim·mixed modality 충돌이다. 만약
      one_way가 비대칭을 뜻하지 않는다면 용어 의미 문제로 semantics lens에 이관해야 한다.
    how_to_fix: 대칭 관계만 지원한다면 direction을 제거하고 bidirectional로 고정한다. 단방향도 필요하다면 정의를 방향성
      관계로 수정하고 bidirectional일 때만 역관계를 의무화한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 간 대체 품목 관계의 일관된 해석
      failure_condition: 기본값 one_way인 AlternatePart가 생성되거나 교환될 때
      impact: 수신 시스템이 정의에 따라 역대체까지 허용하거나 direction에 따라 금지할 수 있어 자재 대체 판정이 달라진다.
      evidence_refs:
        - .onto/review/20260718-ddf66b5d/execution-preparation/materialized-input.md:37-45
    causal_path:
      root_cause_candidate: 대체 관계의 대칭성을 엔티티 불변조건으로 선언하면서 동일 엔티티에 비대칭 상태를 도입했다.
      root_cause_step_id: logic-candidate-002.cause-002
      steps:
