    shared_cause: null
    rationale: finding-002의 수기·복사 기반 권위 부재와 finding-018의 scrap_rate 수치 의미 부재는 모두
      scrap 값을 출처와 계산 계약이 있는 통합 개념으로 정의하지 않은 선택에서 발생한다.
