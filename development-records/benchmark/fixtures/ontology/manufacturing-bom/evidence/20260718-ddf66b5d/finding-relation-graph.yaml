    rationale: finding-002는 여러 핵심 수치를 복사·수기 입력에 맡기는 광범위한 권위 결함을 지적하고, finding-008은 그
      결함이 scrap rate와 표준시간 복제본에서 나타나는 구체적 증상이다.
