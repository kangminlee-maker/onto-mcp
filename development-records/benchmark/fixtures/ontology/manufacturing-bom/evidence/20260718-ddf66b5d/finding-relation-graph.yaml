    root_hypothesis: 두 finding은 모두 BOM·라우팅을 불변 버전과 효력 구간으로 모델링하지 않은 결함을 지적하며, 버전별 구성
      기준선을 도입하면 두 실패 조건이 함께 해소되어야 한다.
    shared_cause: null
    rationale: finding-005는 시점별 구성 재구성 불가를 coverage 관점에서, finding-009는 변경 전후 데이터 연속성
      단절을 evolution 관점에서 기술한다. 증거 범위와 제안 조치가 실질적으로 동일하다.
