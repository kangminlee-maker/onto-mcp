    to_finding_id: finding-005
    relation: symptom_of
    root_hypothesis: 생산오더가 효력 있는 불변 구성 버전을 고정 참조했다면 주간 Part.rev 동기화 지연만으로 구 리비전 생산이 허용되지 않아야 한다.
    shared_cause: null
    rationale: finding-001의 ECO 발효 후 구 리비전 생산 위험은 finding-005가 지적한 버전별 BOM·라우팅 기준선과
      효력 구간 부재가 운영 게이트에서 드러난 현상이다.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-017
    to_finding_id: finding-005
    relation: same_root_candidate
    root_hypothesis: 품목·도면·ECO·생산 효력을 구분하는 불변 revision/effectivity 모델을 도입하면
      finding-017의 용어 혼합과 finding-005의 과거 구성 재구성 실패가 함께 사라져야 한다.
    shared_cause: null
    rationale: finding-017은 서로 다른 revision 의미의 통합을, finding-005는 그 결과인 시간별 구성 기준선
      부재를 지적한다. 둘 다 현재 scalar 상태로 변경 효력을 표현한 구조를 공통 근원으로 가진다.
    confidence: high
  - relation_id: rel-004
    from_finding_id: finding-005
    to_finding_id: finding-006
    relation: shared_cause_candidate
    root_hypothesis: 제어 대상의 변경을 현재 status/scalar가 아니라 불변 버전과 lifecycle event로 기록하면
      구성 이력과 승인·정정 이력이 모두 재구성 가능해야 한다.
    shared_cause:
      cause_claim: 통제되는 제조 정의를 불변 버전·수명주기 사건으로 모델링하지 않고 현재값 속성과 짧은 상태 열거로 표현했다.
      from_cause_ref: finding-005.cause-002
      to_cause_ref: finding-006.cause-002
    rationale: finding-005의 시점별 구성 부재와 finding-006의 종료·정정·감사 경로 부재는 모두 이력을 독립 객체로
      보존하지 않는 현재상태 중심 모델링에서 발생한다. 다만 버전 기준선과 승인 증거는 별도 하위 개념이므로 중복으로 보지는 않는다.
    confidence: medium
  - relation_id: rel-005
    from_finding_id: finding-003
    to_finding_id: finding-016
    relation: duplicates
    root_hypothesis: 스크랩 회수를 BomLine이 아닌 별도 material-flow 관계로 옮기면 두 finding의 자기참조·전개
      안전성 문제가 같은 변경으로 해소되어야 한다.
    shared_cause: null
    rationale: 두 finding 모두 제품 구성 관계를 스크랩 재투입 공정 흐름에 재사용하여 BOM 의미와 전개 종료성을 훼손한다는 동일
      결함을 각각 가치·의미 관점에서 기술한다.
    confidence: high
  - relation_id: rel-006
    from_finding_id: finding-012
    to_finding_id: finding-016
    relation: symptom_of
    root_hypothesis: 스크랩 재투입을 BOM part-whole 관계에서 분리하면 전역 비순환 규칙과 자기포함 허용 사이의 논리 충돌도 제거되어야 한다.
    shared_cause: null
    rationale: finding-012의 직접 모순은 finding-016이 지적한 의미적으로 다른 공정 흐름을 BomLine으로 표현한
      결과다. 별도 관계라면 BOM 비순환 규칙을 유지하면서 재투입을 표현할 수 있다.
