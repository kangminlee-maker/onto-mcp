    to_finding_id: finding-011
    relation: duplicates
    root_hypothesis: 확장 가능한 UnitOfMeasure와 단위가 결합된 Quantity 및 유효한 변환 규칙을 도입하면 현재 계산
      불일치와 향후 스키마 변경 요구가 함께 해소되어야 한다.
    shared_cause: null
    rationale: finding-007은 현재 단위·환산 통제 부재를 coverage 관점에서, finding-011은 같은 폐쇄형·무차원
