  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260718-ddf66b5d/round1/coverage.findings.yaml#coverage-candidate-001
    target: PLM/MES integration concept coverage
    evidence_anchor: materialized-input.md:7,12-82,95
    claim: MES execution and traceability concepts are absent despite the declared
      PLM/MES integration purpose.
    lens_rationale_summary: A reference model cannot define the PLM-to-MES handoff
      or relate released engineering data to what was actually produced.
      Implementations must invent incompatible execution and traceability
      semantics outside the shared ontology.
    proposed_action: Add a minimal execution model covering ManufacturingOrder,
      OperationExecution, MaterialConsumption, produced/consumed Lot or Serial,
      actual results, and deviation/nonconformance links. Alternatively,
      explicitly narrow the document's declared purpose and identify the
      separate authoritative MES model.
    affected_purpose: Serving as the conceptual baseline for PLM/MES integration.
    failure_condition: When released BOM and routing data must be handed to MES or
      reconciled with actual production.
    impact: The shared model ends before the MES execution boundary, so integration
      mappings and traceability cannot be derived from the baseline.
    evidence_refs:
      - .onto/review/20260718-ddf66b5d/round1/coverage.findings.yaml#coverage-candidate-001
      - materialized-input.md:7
      - materialized-input.md:12-82
      - materialized-input.md:95
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Serving as the conceptual baseline for PLM/MES integration.
      failure_condition: When released BOM and routing data must be handed to MES or
        reconciled with actual production.
      impact: The shared model ends before the MES execution boundary, so integration
        mappings and traceability cannot be derived from the baseline.
      evidence_refs:
