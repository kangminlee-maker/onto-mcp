    claim: ECO 발효 시점과 Part.rev 주간 동기화가 분리되어, 변경 발효 후에도 구 리비전으로 생산을 허용할 수 있는 기준 모델이다.
    lens_rationale_summary: PLM/MES 통합 기준은 어느 제품 구성이 특정 생산분에 유효한지 일관되게 판정해야 한다. 현재
      규칙은 발효일부터 배치 동기화까지의 구간에 상충하는 두 상태를 정당한 것으로 남겨 변경관리 정합성과 제조 실행 안전이라는 선언 목적을
      훼손한다.
    proposed_action: ECO 적용 단위를 불변 구성 리비전으로 모델링하고, effective_date/lot 또는 serial 범위에
      따라 유효한 Part·BOM·Routing 버전을 원자적으로 선택하게 한다. 생산 오더 생성 조건에도 승인·발효된 구성 버전과의 일치
      검증을 추가한다.
    affected_purpose: PLM과 MES가 동일한 변경 발효 상태와 제조 구성을 사용하는 개념 기준 제공
    failure_condition: ECO가 발효됐지만 주간 배치가 Part.rev를 아직 갱신하지 않은 기간에 생산 오더가 생성되는 경우
    impact: 동일 생산분을 PLM은 신규 리비전, MES는 구 리비전으로 해석할 수 있어 잘못된 자재·공정·검사 기준으로 생산될 위험이 생긴다.
