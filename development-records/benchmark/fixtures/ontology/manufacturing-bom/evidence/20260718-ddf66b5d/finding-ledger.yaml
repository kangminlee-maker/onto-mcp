  - finding_id: finding-014
    lens_id: semantics
    source_ref: .onto/review/20260718-ddf66b5d/round1/semantics.findings.yaml#semantics-candidate-001
    target: AlternatePart definition and direction semantics
    evidence_anchor: materialized-input.md:37-45,84-91
    claim: AlternatePart is simultaneously defined as symmetric and modeled as
      direction-sensitive, so the same relation has incompatible meanings.
    lens_rationale_summary: Mutual interchangeability and directed substitution are
      different authorization semantics. A PLM/MES consumer cannot determine
      whether reverse substitution is permitted, which can allow an unapproved
      component or reject an approved one.
    proposed_action: Define one canonical directed substitution relation with
      explicit source and target; represent mutual interchangeability as two
      directed assertions or an explicit bidirectional property, and require the
      shortcut projection to preserve that meaning.
    affected_purpose: Provide a semantically reliable PLM/MES reference model for
      part substitution.
    failure_condition: A consumer interprets the symmetric definition or
      `alternate_of` shortcut while another follows the default `one_way` value.
    impact: Systems can disagree about which component substitutions are authorized
      during planning or execution.
    evidence_refs:
      - .onto/review/20260718-ddf66b5d/round1/semantics.findings.yaml#semantics-candidate-001
      - materialized-input.md:37-45
      - materialized-input.md:84-91
    severity: high
    domain_threshold_used: null
    materiality_basis:
