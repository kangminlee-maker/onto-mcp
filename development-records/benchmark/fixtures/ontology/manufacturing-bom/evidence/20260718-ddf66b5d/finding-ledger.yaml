  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260718-ddf66b5d/round1/coverage.findings.yaml#coverage-candidate-002
    target: Part, BOM, routing, and ECO temporal configuration model
    evidence_anchor: materialized-input.md:20-21,29-35,55-61,69-75,96
    claim: The model lacks versioned BOM/routing baselines and interval-based
      effectivity needed to reconstruct historical configurations.
    lens_rationale_summary: The rule selecting a new revision after an ECO date
      cannot determine the complete effective product/process configuration,
      especially during the stated weekly synchronization lag. Past production
      cannot reliably be evaluated against the BOM and routing effective at its
      manufacturing time.
    proposed_action: Introduce explicit PartRevision, BomRevision, and
      RoutingRevision concepts or a common versioned-definition pattern; add
      effectivity intervals and supersession; and have ECO applicability bind
      exact old and new configuration baselines.
    affected_purpose: Providing a consistent item, BOM, routing, and
      change-management baseline across PLM and MES.
    failure_condition: When systems need an as-of configuration, an ECO overlaps the
      synchronization lag, or historical production must be reconstructed.
    impact: Different systems can resolve different BOM or routing content for the
      same effective date, weakening configuration control and manufacturing
      traceability.
    evidence_refs:
      - .onto/review/20260718-ddf66b5d/round1/coverage.findings.yaml#coverage-candidate-002
      - materialized-input.md:20-21
      - materialized-input.md:29-35
      - materialized-input.md:55-61
      - materialized-input.md:69-75
      - materialized-input.md:96
    severity: high
    domain_threshold_used: null
