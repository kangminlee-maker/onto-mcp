    target: InspectionPlan classification
    evidence_anchor: materialized-input.md:47-53,77-82
    claim: InspectionPlan is incorrectly classified as an Operation even though its
      name, definition, and attributes describe an inspection specification.
    lens_rationale_summary: A routing consumer may treat the plan itself as an
      executable operation, while inspection parameters cannot be independently
      versioned or attached to the intended inspection operation without
      changing the meaning of inheritance.
    proposed_action: Model `InspectionOperation` as an Operation and link it to a
      separate `InspectionPlan` or `InspectionSpecification`; alternatively
      rename the current subtype to `InspectionOperation` if it is intended to
      denote the executable step.
    affected_purpose: Provide consistent routing and inspection concepts across PLM and MES.
    failure_condition: Consumers use `is_a Operation` to dispatch every
      InspectionPlan as an executable routing step.
    impact: Execution semantics and quality-specification semantics become
      indistinguishable, weakening routing interoperability.
    evidence_refs:
