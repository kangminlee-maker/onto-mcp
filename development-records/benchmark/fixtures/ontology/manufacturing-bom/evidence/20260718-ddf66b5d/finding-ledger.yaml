  - finding_id: finding-017
    lens_id: semantics
    source_ref: .onto/review/20260718-ddf66b5d/round1/semantics.findings.yaml#semantics-candidate-004
    target: Part revision and ECO effectivity semantics
    evidence_anchor: materialized-input.md:14-21,69-75,93-96
    claim: The model conflates item revision, drawing revision, latest ECO, and
      effective production revision.
    lens_rationale_summary: Drawing revision, item revision, change-order lifecycle,
      and production effectivity are not interchangeable. At an ECO effective
      date, MES cannot reliably identify the authorized production configuration
      from these fields.
    proposed_action: Separate item revision from drawing revision; model ECO
      lifecycle and effectivity explicitly; link affected revision transitions
      to the ECO; and define a single effective-revision projection whose
      authority and synchronization semantics are unambiguous.
    affected_purpose: Provide a consistent change-management vocabulary for PLM/MES integration.
    failure_condition: An ECO becomes effective before the weekly `Part.rev`
      synchronization, or multiple ECO statuses compete for `current_eco`.
    impact: Production can select a stale or unauthorized revision despite following
      the ontology's named fields and rule.
