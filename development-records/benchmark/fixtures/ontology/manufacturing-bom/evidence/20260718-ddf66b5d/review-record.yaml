per_lens_provenance:
  axiology:
    domain_constraints_used: []
    domain_context_assumptions:
      - 문서가 스스로 선언한 대로 PLM/MES 통합의 개념 기준이며, 생산 오더·소요량·원가·능력 계산의 공통 의미를 제공해야 한다고
        보았다.
      - 제조 운영상 영향은 대상에 명시된 생산 오더, MES 계산, 표준원가, 생산계획 및 현장 환산 경로에 한정해 평가했다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - The declared role as a PLM/MES integration conceptual baseline places
        both controlled engineering definitions and core manufacturing-execution
        handoff concepts within scope.
      - Because the artifact defines ECO effectivity and a delayed revision
        synchronization process, reconstructing the effective BOM and routing at
        a historical production time is operationally required.
      - Quantities and capacities shared across PLM and MES require governed
        units and conversions to retain consistent meaning.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - PLM/MES 통합의 개념 기준은 설계변경 이후에도 과거 생산에 적용된 BOM과 라우팅 버전을 식별할 수 있어야 한다.
      - 제조 라우팅은 향후 병렬·분기·대체·재작업 또는 라우팅별 공정 파라미터로 확장될 수 있다.
      - 통합 대상에는 현재 열거된 ea, kg, m 이외의 단위와 서로 다른 차원의 작업장 용량이 추가될 수 있다.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - 비순환 그래프에서 자기 참조 간선은 길이 1의 순환으로 취급한다.
      - direction 값 one_way는 역방향 관계를 자동으로 성립시키지 않는 단방향을 뜻한다.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - Directed substitution authorizes replacement from a source part to a
        target part; mutual interchangeability requires authorization in both
        directions.
      - A product BOM expresses component or material composition, while scrap
        recovery and re-entry express manufacturing material flow.
      - An inspection plan or specification is an information object governing
        an executable inspection operation, not the operation itself.
      - Item revision, drawing revision, ECO lifecycle status, and production
        effectivity may change independently and therefore require distinct
        semantics.
      - Capacity values require an explicit dimension and basis; count
        throughput and available processing time are not interchangeable.
      - A scrap or yield rate used for planning requires a defined scale and
        formula.
  structure:
    domain_constraints_used: []
    domain_context_assumptions:
      - "`relations` 목록을 통합 소비자가 사용하는 명시적 관계 그래프로 해석했다."
