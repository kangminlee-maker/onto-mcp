    target: manufacturing-bom-ontology.yaml — ECO 효력과 Part 리비전 적용 규칙
    evidence_anchor: "materialized-input.md:7; materialized-input.md:20-21;
      materialized-input.md:69-75; materialized-input.md:96;
      review-value-alignment-criteria.yaml:6-18 (value_type=purpose,
      alignment_direction=misaligned; authority excerpt: “PLM/MES 통합의 개념 기준
      문서…변경관리 개념의 정합성과 제조 운영 위험을 중심으로”)"
    claim: ECO 효력일과 주간 리비전 동기화의 불일치가 통합 기준의 변경 적용 시점을 모호하게 만든다.
    lens_rationale_summary: 효력일 이후부터 다음 동기화까지 ECO와 Part.rev가 서로 다른 답을 줄 수 있다. 이
      상태에서는 PLM과 MES가 동일 생산분에 서로 다른 설계 리비전을 적용할 수 있어 변경관리 정합성과 제조 실행 안전이라는 선언
      목적을 직접 약화한다.
    proposed_action: 유효기간을 가진 PartRevision과 ECO 적용 관계를 모델링하고, 생산 오더가 생성 시점의 적용 리비전을
      명시적으로 고정하도록 한다. 배치 동기화 상태와 무관하게 effective_date 기준 조회가 단일 결과를 반환하도록 우선순위와
      실패 규칙도 정의한다.
    affected_purpose: PLM/MES 통합의 개념 기준으로서 변경관리 정합성과 제조 운영 위험 통제
    failure_condition: ECO effective_date가 지났지만 Part.rev 주간 동기화가 아직 수행되지 않은 기간에 생산 오더가 생성되는 경우
    impact: 동일 생산분의 적용 설계 리비전이 시스템별로 달라져 구형 설계 생산, 추적성 상실 또는 재작업 판단 오류가 가능하다.
    evidence_refs:
