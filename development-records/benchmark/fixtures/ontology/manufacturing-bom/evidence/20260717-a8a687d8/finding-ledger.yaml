    claim: 환산계수 없이 현장 판단에 맡긴 단위 변환은 BOM 수량을 시스템 간 공통 의미로 만들지 못한다.
    lens_rationale_summary: 동일 qty_per가 어느 단위를 기준으로 해석되는지와 변환 근거가 통합 데이터로 재현되지 않는다.
      특히 개수와 질량 간 환산은 품목별 물성에 의존하므로 현장별 계산 차이가 자재 소요량, 불출량 및 재고 정합성을 훼손할 수 있다.
    proposed_action: BomLine 수량에 명시적 UOM을 부여하고, 품목별 기준 UOM 및 유효기간·출처를 가진 변환 규칙을 권위
      있는 마스터로 모델링한다. 필요한 변환이 없거나 차원이 맞지 않으면 생산 또는 인터페이스 처리를 실패시키도록 규정한다.
    affected_purpose: PLM/MES 간 품목·BOM 수량의 일관된 의미와 제조 운영 위험 통제
    failure_condition: BOM 수량 단위와 실행·재고 단위가 다르거나 ea와 kg처럼 품목별 환산이 필요한 경우
    impact: 시스템이나 작업자별 환산 결과가 달라져 과소·과다 불출, 계획 오차 및 재고 불일치로 이어질 수 있다.
