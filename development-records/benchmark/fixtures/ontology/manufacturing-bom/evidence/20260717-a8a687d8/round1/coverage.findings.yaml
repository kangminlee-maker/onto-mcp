findings:
  - candidate_id: coverage-candidate-001
    target: BOM·라우팅 구성의 시점별 형상 관리
    evidence_anchor: materialized-input.md:14-35, 55-61, 69-75, 93-96
    claim: BOM과 라우팅에 개정·유효기간·형상 기준선 개념이 없어 과거 또는 특정 생산일의 제조 구성을 재구성할 수 없다.
    what: Part에는 현재 rev만 있고, BomLine에는 수량과 스크랩률만 있으며, Routing에는 draft/released 상태만
      있다. ECO.effective_date가 존재하지만 해당 변경이 어떤 BOM 라인과 라우팅 버전에 적용되는지 표현하는 형상·효력
      모델이 없다.
    why: ECO 적용 전후의 BOM 및 공정 순서를 같은 Part에서 구분할 수 없으므로, 주간 rev 동기화 지연 중 어느 구성을 생산에
      사용해야 하는지 개념 모델만으로 결정하거나 사후 재현할 수 없다. 이는 PLM 설계 형상과 MES 생산 형상을 연결하는 기준 문서의
      핵심 목적을 약화한다.
    how_to_fix: PartRevision 또는 ConfigurationBaseline을 도입하고 BomLine 및 Routing 버전에
      effective_from/effective_to 또는 적용 일련·로트 범위를 부여한다. ECO가 변경 전후 형상과 해당 유효 구간을
      명시적으로 연결하도록 한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM/MES 통합에서 품목·BOM·라우팅·변경의 공통 형상 기준 제공
      failure_condition: 동일 품목에 ECO 전후 구성이나 복수 라우팅 개정이 존재하거나 Part.rev 동기화가 지연되는 경우
      impact: 생산 시점의 유효 BOM/라우팅 선택과 과거 생산 형상 재구성이 불가능해 잘못된 부품 또는 공정 사용 위험이 생긴다.
      evidence_refs:
        - materialized-input.md:20-21
        - materialized-input.md:29-35
        - materialized-input.md:55-61
        - materialized-input.md:69-75
        - materialized-input.md:96
    causal_path:
      root_cause_candidate: 온톨로지가 품목·BOM·라우팅을 현재값 중심으로 표현하고, 제조 형상의 버전과 시간 효력을 독립 개념으로 모델링하지 않았다.
      root_cause_step_id: coverage-candidate-001.cause-002
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: BomLine과 Routing에 개정 식별자나 유효 시작·종료 구간이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:29-35
            - materialized-input.md:55-61
        - cause_id: coverage-candidate-001.cause-002
          claim: ECO의 단일 effective_date와 Part의 현재 rev만으로는 변경 전후 BOM·라우팅 형상을 식별할 수 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:20-21
            - materialized-input.md:69-75
            - materialized-input.md:96
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-002
    target: ECO 변경관리 lifecycle 및 감사 증거
    evidence_anchor: materialized-input.md:69-75
    claim: ECO가 정상 적용 경로만 표현하며 승인·적용 행위의 행위자, 시각, 근거와 거절·취소·대체·정정 경로가 누락되어 있다.
    what: ECO 속성은 번호, 영향 품목, 유효일, open/approved/applied 상태뿐이다. 승인자·승인시각·변경 사유·증빙·적용
      확인 기록이 없고, rejected, cancelled, superseded 같은 종결 및 후속 정정 상태도 없다.
    why: 누가 어떤 근거로 변경을 승인·적용했는지 추적할 수 없고, 철회되거나 잘못 적용된 ECO를 기존 상태 의미와 충돌 없이 처리할 수
      없다. 변경 통제의 책임성과 재현성이 기준 모델 밖에 남는다.
    how_to_fix: ECO 상태 전이 전체를 정의하고 ChangeEvent 또는 ApprovalDecision을 추가해 actor,
      occurred_at, rationale/evidence_ref, from_status, to_status를 기록한다.
      취소·거절·대체·정정/재발행 관계도 포함한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 간 설계변경의 통제된 전달과 변경 이력 추적
      failure_condition: ECO가 거절·취소·대체되거나 승인 및 적용 근거를 감사·조사해야 하는 경우
      impact: 상태값만으로 변경의 정당성이나 실제 적용 경위를 입증할 수 없어 제조 변경 통제에 대한 신뢰가 약화된다.
      evidence_refs:
        - materialized-input.md:69-75
    causal_path:
      root_cause_candidate: ECO가 변경 통제 과정이 아니라 현재 상태를 가진 단순 지시 객체로 축약되어 있다.
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: ECO에 승인·적용 행위의 actor, timestamp, rationale 또는 evidence 속성이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-75
        - cause_id: coverage-candidate-002.cause-002
          claim: ECO 상태 열거형이 open, approved, applied만 포함하여 예외 종결 및 사후 정정 lifecycle을 수용하지
            못한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:75
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: 수량 단위·환산 및 설비능력 단위 모델
    evidence_anchor: materialized-input.md:19, 34-35, 63-67, 98-100
    claim: BOM 수량과 작업장 능력을 계산 가능한 공통 단위로 해석할 단위 차원과 품목별 환산계수 마스터가 없다.
    what: Part.uom은 ea/kg/m만 선택하지만 BomLine.qty_per에는 단위가 연결되지 않는다.
      WorkCenter.capacity_per_shift는 작업장마다 개수 또는 시간이라는 상이한 의미를 한 숫자로 담고, 문서는 품목별
      환산계수 마스터가 없고 현장에서 환산한다고 명시한다.
    why: PLM의 BOM 수량과 MES의 투입량·능력 값을 일관되게 변환하거나 검증할 수 없다. 특히 kg↔ea 환산이나 개수 기반·시간 기반
      능력 비교가 사람의 현장 판단에 의존해 자재 소요량과 생산능력 계산 오류로 이어질 수 있다.
    how_to_fix: Quantity와 UnitOfMeasure를 명시적으로 모델링하고 qty_per 및 capacity에 단위·분모·시간기준을
      연결한다. 품목별 UomConversion에 factor, from_uom, to_uom, valid_from/to, 근거와 권위
      시스템을 둔다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: PLM BOM과 MES 계획·실적 사이의 수량 및 생산능력 의미 통합
      failure_condition: 상·하위 품목 단위가 다르거나 작업장별 능력 기준이 개수와 시간으로 혼재하는 경우
      impact: 필요 자재량과 작업장 부하를 결정적으로 계산할 수 없어 부족·과다 투입 및 잘못된 일정 산정 위험이 생긴다.
      evidence_refs:
        - materialized-input.md:19
        - materialized-input.md:34-35
        - materialized-input.md:63-67
        - materialized-input.md:100
    causal_path:
      root_cause_candidate: 단위가 계산 대상 값의 속성이 아니라 품목의 제한된 코드로만 표현되고, 단위 간 변환 개념이 모델에서 제외되어 있다.
      root_cause_step_id: coverage-candidate-003.cause-002
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: qty_per와 capacity_per_shift에 단위 또는 단위 기준을 연결하는 속성이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:34-35
            - materialized-input.md:66-67
        - cause_id: coverage-candidate-003.cause-002
          claim: 품목별 환산계수 마스터가 없고 필요한 환산을 현장에서 수행한다고 명시한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: 병행 관리 제조 기준값의 권위와 대사
    evidence_anchor: materialized-input.md:35, 53, 98-99
    claim: 복수 시스템에서 병행 관리되는 scrap_rate와 표준시간 계열 값에 단일 권위 및 대사 이력 개념이 없다.
    what: scrap_rate는 생산계획팀 엑셀 값을 복사한다고만 되어 있고 권위 원본과 복사 시점이 명시되지 않는다. 누적 std_time은
      MES 계산값과 표준원가 시스템 수기값이 병존하며 분기 대사하지만 어느 값이 기준인지와 대사 결과를 표현하지 않는다.
    why: 서로 다른 값이 존재할 때 어느 값을 계획·원가·실행에 사용해야 하는지 온톨로지가 결정하지 못한다. 오래된 복사본이나 수기값이
      사용되어도 그 차이와 조정 근거를 추적할 수 없다.
    how_to_fix: 각 관리값에 authoritative_system, value_as_of, valid_from/to를 지정하고, 복제본은
      원본 참조와 동기화 시각을 갖게 한다. ReconciliationEvent로 비교값, 차이, 조정 주체·시각·근거를 기록한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM/MES 및 연계 장부 사이 제조 기준값의 일관된 해석
      failure_condition: 엑셀·MES·표준원가 시스템 값이 다르거나 동기화·대사 주기 사이에 값이 변경되는 경우
      impact: 기준값 선택이 시스템별 또는 사용자별로 달라져 계획·원가 결과를 신뢰하거나 재현하기 어렵다.
      evidence_refs:
        - materialized-input.md:35
        - materialized-input.md:53
        - materialized-input.md:99
    causal_path:
      root_cause_candidate: 병행 관리 사실은 주석으로만 서술되고 권위·복제·대사를 나타내는 공통 개념이 정의되지 않았다.
      root_cause_step_id: coverage-candidate-004.cause-002
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: scrap_rate 복사본에 원본 권위, 동기화 시점, 유효기간이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:35
        - cause_id: coverage-candidate-004.cause-002
          claim: MES 계산값과 표준원가 수기값의 대사에 기준값과 대사 사건을 기록할 모델이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:99
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-005
    target: MES 생산 실행·실적·추적성 개념 범위
    evidence_anchor: materialized-input.md:12-82, 93-96
    claim: 생산 오더 생성 규칙을 선언하면서도 생산 오더, 적용 형상 스냅샷, 실제 투입·공정 실적 및 로트 계보 개념이 전혀 정의되어 있지
      않다.
    what: 엔티티 집합은 마스터 성격의 Part, BOM, Routing, WorkCenter, ECO, InspectionPlan에 한정된다.
      그러나 integrity rule은 생산 오더 생성을 직접 규정하며, 그 오더가 어떤 BOM·라우팅을 사용했는지 또는 실제 무엇이
      투입·처리되었는지를 담을 엔티티가 없다.
    why: MES 통합에서 계획 마스터가 실제 제조 기록으로 이어지는 접점이 비어 있다. released 라우팅 검사는 표현되어도 생성된 오더가
      그 형상을 고정했는지, 실제 자재·공정·검사 결과가 무엇인지 추적할 수 없어 변경 영향 분석과 제조 계보 확인이 불가능하다.
    how_to_fix: 최소 범위로 ProductionOrder, OrderConfigurationSnapshot,
      MaterialConsumption, OperationExecution 및 Lot/SerialGenealogy를 추가하고
      PartRevision·BOM·Routing 버전과 연결한다. 실행 영역을 의도적으로 제외한다면 생산 오더 규칙을 제거하거나 별도
      실행 온톨로지와의 명시적 경계·계약을 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: PLM 마스터와 MES 제조 실행 사이의 개념 기준 제공
      failure_condition: 생산 오더를 생성하거나 변경 전후 생산분의 실제 사용 자재·공정을 확인해야 하는 경우
      impact: 마스터 데이터에서 실행 기록으로 이어지는 통합 계약이 없어 생산 형상 고정, 실적 대조 및 추적성 검증을 수행할 수 없다.
      evidence_refs:
        - materialized-input.md:12-82
        - materialized-input.md:95
    causal_path:
      root_cause_candidate: 온톨로지가 제조 마스터 구조에 집중하면서도 그 범위를 명시적으로 한정하지 않은 채 MES 실행 규칙까지 포함했다.
      root_cause_step_id: coverage-candidate-005.cause-002
      steps:
        - cause_id: coverage-candidate-005.cause-001
          claim: 생산 오더 생성 조건이 integrity rule로 선언되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:95
        - cause_id: coverage-candidate-005.cause-002
          claim: 정의된 엔티티에는 ProductionOrder나 실제 투입·공정 실행·계보 기록이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:12-82
      unresolved_beyond_evidence: 상위 아키텍처에서 별도 MES 실행 온톨로지가 존재하는지는 현재 경계에서 확인할 수 없지만,
        대상 문서에는 그 경계나 연결 계약이 없다.
  - candidate_id: coverage-candidate-006
    target: 대체부품의 적용 조건과 승인 통제
    evidence_anchor: materialized-input.md:37-45, 91
    claim: 대체부품 관계에 유효기간, 적용 대상 형상·공장·공정, 수량/단위 조건 및 승인 근거가 없어 실제 대체 가능 범위를 표현할 수 없다.
    what: AlternatePart는 primary_ref, alternate_ref, direction만 가진다. 대체 관계 단축 표기도
      존재하지만 언제, 어디서, 어떤 개정과 수량 조건으로 대체할 수 있는지 또는 누가 승인했는지는 모델에 없다.
    why: 대체 가능성은 단순 품목 쌍보다 조건 의존적인 제조 결정인데, 현재 모델에서는 한 번 등록된 관계가 모든 생산 상황에 적용되는 것으로
      해석될 수 있다. 이는 승인되지 않은 대체품 사용이나 품질·조달 조건 위반 위험을 만든다.
    how_to_fix: AlternatePart에 applicable_revision/configuration, site 또는
      work_center, quantity/uom constraint, effective_from/to, approval_ref 및
      substitution_reason을 추가하고 생산 오더에서 실제 대체 사용 사건을 기록하도록 연결한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: BOM 대체품을 PLM과 MES가 동일한 조건으로 해석하는 기준 제공
      failure_condition: 대체품 승인이 특정 개정, 기간, 공장, 공정 또는 수량 조건에 한정되는 경우
      impact: 조건을 표현할 수 없어 MES가 과도하게 넓은 대체 권한으로 해석하거나 승인 근거를 확인하지 못할 수 있다.
      evidence_refs:
        - materialized-input.md:37-45
