schema_version: 1
session_id: 20260716-7f1c6ba1
relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-006
    relation: duplicates
    root_hypothesis: Result.status와 Report.result_status를 동일 정보의 독립 저장값으로 유지하고 정정
      동기화를 야간 배치에 맡긴 것이 두 finding의 공통 결함이며, 두 필드의 권위·매핑·동기화 계약을 비교해 검증할 수 있다.
    shared_cause: null
    rationale: 두 finding 모두 정정 후 Result와 임상의가 신뢰하는 Report 상태가 불일치하는 동일 조건, 동일 필드, 동일
      권위 결손을 지적한다.
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-001
    to_finding_id: finding-015
    relation: conflicts_with
    root_hypothesis: Result의 corrected와 Report의 amended가 하나의 상태를 중복 표현하는지, 서로 다른
      엔티티의 별도 상태인지가 결정되지 않았으며 각 상태의 독립 전이 가능성을 명세하면 어느 해석이 맞는지 검증할 수 있다.
    shared_cause: null
    rationale: finding-001은 Result.status를 단일 권위로 두고 Report 상태를 파생하자고 전제하지만,
      finding-015는 corrected와 amended가 동의어가 아닌 결과 수정 상태와 보고서 수정 상태라고 판단한다. 불일치
      위험에는 동의하지만 정규화할 개념 경계에는 실질적 견해차가 있다.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-006
    to_finding_id: finding-012
    relation: same_root_candidate
    root_hypothesis: 공통 상태 권위와 완전한 버전형 투영 계약 없이 두 상태 enum을 병행 저장한 설계가 현재 불일치와 향후 변경
      드리프트를 함께 만든다.
    shared_cause: null
    rationale: finding-006은 현재 권위·대응 결손을, finding-012는 새 상태나 전이 변경 시의 장기 호환성 결손을
      다루지만 둘 다 독립 enum과 불완전한 동기화 계약을 근거로 한다.
    confidence: high
  - relation_id: rel-004
    from_finding_id: finding-006
    to_finding_id: finding-014
    relation: enables
    root_hypothesis: Result와 Report 상태를 별도 저장하면서 전체 매핑, 우선순위, 즉시성 계약을 두지 않은 것이
      release와 correction 규칙이 한 필드에 상충 값을 요구하도록 허용한다.
    shared_cause: null
    rationale: finding-006의 분할 권위와 불완전한 변환 규칙이 없었다면 finding-014의 finalized/amended
      동시 의무는 단일 전이표나 명시적 투영으로 판정될 수 있다. 다만 규칙 중첩 자체도 별도 원인이므로 직접 원인보다는 enabling
      관계가 적절하다.
    confidence: medium
  - relation_id: rel-005
    from_finding_id: finding-002
    to_finding_id: finding-016
    relation: duplicates
    root_hypothesis: 재사용 임계값 정책과 결과별 통보 사건을 하나의 CriticalValue에 결합한 것이 결과별 통보 판정 불능의 공통 원인이다.
    shared_cause: null
    rationale: 두 finding 모두 threshold 범위와 notified boolean의 결합, Result·시각·수신자 부재,
      결과별 통보 사건 분리 필요성을 동일하게 지적한다.
    confidence: high
  - relation_id: rel-006
    from_finding_id: finding-007
    to_finding_id: finding-023
    relation: duplicates
    root_hypothesis: Result에 귀속되는 통보 사건과 증거 관계가 없고 notified가 연결되지 않은 CriticalValue에
      놓인 것이 감사 경로 단절의 공통 원인이다.
    shared_cause: null
    rationale: finding-007의 감사 속성 부재와 finding-023의 구조적 Result 연결 부재는 동일한 결과별 통보 기록
      결손을 각각 속성과 관계 관점에서 기술한다.
    confidence: high
  - relation_id: rel-007
    from_finding_id: finding-002
    to_finding_id: finding-007
    relation: shared_cause_candidate
    root_hypothesis: 결과별 통보 사건을 독립 개념으로 모델링하지 않고 핵심 사건 증거를 외부 대장에 맡긴 설계가 통합 권위 결손과
      감사 추적 결손을 함께 발생시킨다.
    shared_cause:
      cause_claim: 결과별 CriticalNotification 사건 대신 threshold와 notified boolean을 결합하고
        시각·수신자 증거를 식별 관계 없이 외부화했다.
      from_cause_ref: finding-002.cause-002
      to_cause_ref: finding-007.cause-002
    rationale: 두 causal path는 각각 혼합된 CriticalValue 개념과 연결되지 않은 외부 전화 기록을 직접 근거로 하며,
      결과별 사건을 추가하면 양쪽 결손을 함께 해소할 수 있다.
    confidence: high
  - relation_id: rel-008
    from_finding_id: finding-003
    to_finding_id: finding-010
    relation: duplicates
    root_hypothesis: Test와 Assay를 병행 등록하면서 단일 권위, 식별 매핑, 변경 규칙을 정의하지 않은 것이 현재 이중 등록
      의존과 확장 시 드리프트의 공통 원인이다.
    shared_cause: null
    rationale: 두 finding은 동일한 두 카탈로그, 신규 항목 이중 등록 메모, 관계·권위 부재를 근거로 하며 현재 운영 위험과 진화
      위험만 달리 강조한다.
    confidence: high
  - relation_id: rel-009
    from_finding_id: finding-022
    to_finding_id: finding-005
    relation: symptom_of
    root_hypothesis: Assay가 relations에서 고립된 현상은 주문 카탈로그 변환과 실제 분석 수행을 독립 개념 및 관계로
      모델링하지 않은 더 넓은 결손의 구조적 증상이다.
    shared_cause: null
    rationale: finding-022의 고아 Assay는 finding-005가 지적한 Test–Assay 매핑 및 AssayRun 계열
      수행 개념 부재의 직접 관찰 결과다. finding-005는 추가로 수행 이력까지 포함하므로 단순 중복보다 symptom 관계가
      적절하다.
    confidence: high
  - relation_id: rel-010
    from_finding_id: finding-003
    to_finding_id: finding-017
    relation: same_root_candidate
    root_hypothesis: Test와 Assay의 동일성·역할·대응 다중성을 결정하지 않은 채 두 카탈로그의 동시 등록을 요구한 것이 운영상
      이중 등록 문제와 의미 정체성 모호성을 함께 만든다.
    shared_cause: null
    rationale: finding-003은 통합 권위와 운영 절차를, finding-017은 synonym·일대일·합성 관계의 의미 경계를
      강조하지만 동일한 미결정 매핑과 이중 등록 증거를 사용한다.
    confidence: high
  - relation_id: rel-011
    from_finding_id: finding-005
    to_finding_id: finding-021
    relation: shared_cause_candidate
    root_hypothesis: 주문 항목을 수행 단위와 생성 결과에 귀속시키는 명시적 중간 개념 및 관계가 없어서 카탈로그 변환 추적과 주문
      완료 집합 계산이 모두 닫히지 않는다.
    shared_cause:
      cause_claim: Order의 주문 항목에서 실제 Assay 수행과 Result까지 이어지는 권위 있는 소유·실현 경로가 모델에 없다.
      from_cause_ref: finding-005.cause-002
      to_cause_ref: finding-021.cause-002
    rationale: finding-005는 Test–Assay 변환 및 실행 모델 부재를, finding-021은
      Order–Test–Result 소유 경로 부재를 지적한다. 주문 항목/수행 개념을 도입하면 두 경로를 함께 닫을 수 있지만 각
      finding의 직접 표면은 달라 shared cause로 유지한다.
    confidence: medium
  - relation_id: rel-012
    from_finding_id: finding-009
    to_finding_id: finding-013
    relation: symptom_of
    root_hypothesis: 카탈로그와 중요값 기준의 유효기간·버전 결손은 문서 전체 버전만 존재하고 개별 개념의 수명주기와 호환 매핑이 없는
      온톨로지 전역 설계의 영역별 증상이다.
    shared_cause: null
    rationale: finding-009는 Test·Assay·CriticalValue에 한정된 시간축 결손이고, finding-013은
      enum과 lifecycle 전반의 동일한 버전 권위 결손을 포괄한다.
    confidence: high
  - relation_id: rel-013
    from_finding_id: finding-011
    to_finding_id: finding-019
    relation: duplicates
    root_hypothesis: 공통 SpecimenType 개념 없이 검체 의미를 두 폐쇄 enum과 Assay 자유 문자열에 중복 내장한 것이
      확장 드리프트와 현재 호환성 모호성의 공통 원인이다.
    shared_cause: null
    rationale: 두 finding은 동일한 세 속성, 어휘 불일치, 공통 계층·매핑 부재를 근거로 하며 진화 가능성과 현재 의미 상호운용성을
      각각 강조한다.
    confidence: high
  - relation_id: rel-014
    from_finding_id: finding-004
    to_finding_id: finding-018
    relation: duplicates
    root_hypothesis: 하나의 가변적인 주문 긴급성을 priority enum, is_stat boolean, StatOrder
      subtype으로 독립 표현하고 등가·파생 불변식을 두지 않은 것이 모순 가능성의 공통 원인이다.
    shared_cause: null
    rationale: 두 finding은 동일한 세 표현과 동일한 충돌 조건을 지적하고 priority를 권위 값으로 정규화하는 같은 조치를 제안한다.
    confidence: high
