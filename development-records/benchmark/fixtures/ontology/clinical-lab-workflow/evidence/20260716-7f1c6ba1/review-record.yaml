  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - 이 문서가 선언한 대로 Order부터 Report까지의 EMR/LIS 통합 개념 권위 문서라면 주문 항목과 실제 수행 항목 사이의
        변환 및 추적이 범위에 포함된다고 가정했다.
      - 중요값 통보, 검체 처분, 결과 정정처럼 문서에 명시된 운영 행위는 외부 시스템에 저장되더라도 온톨로지 안에서 식별·연결 가능한
        증거 개념이 필요하다고 가정했다.
      - 카탈로그 정의와 중요값 경계는 운영 중 변경될 수 있는 시점 의존 값이라고 가정했다.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - EMR과 LIS는 서로 다른 배포 주기로 카탈로그·코드·상태 정의를 갱신할 수 있다.
      - 개념 권위 문서는 현재 정의뿐 아니라 기존 기록을 신규 정의와 연결할 수 있는 변경 연속성을 제공해야 한다.
  logic:
