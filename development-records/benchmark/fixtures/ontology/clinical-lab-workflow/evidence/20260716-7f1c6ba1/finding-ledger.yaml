  - finding_id: finding-019
    lens_id: semantics
    source_ref: .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-005
    target: Specimen terminology in Test.requires_specimen_type and Assay.specimen_kind
    evidence_anchor: materialized-input.md:37-60
    claim: The ontology uses incompatible specimen vocabularies and abstraction
      levels for ordering and execution concepts.
    lens_rationale_summary: Broad source categories and more specific
      preparation/material terms are not interchangeable labels. Without a
      common hierarchy or mapping, compatibility between an ordered Test, a
      collected Specimen, and an executable Assay cannot be interpreted
      consistently.
    proposed_action: Create one canonical SpecimenType concept with stable codes,
      aliases, and broader/narrower relationships. Reference it from Specimen,
      Test, and Assay, and model collection material versus processed specimen
      when that distinction matters.
