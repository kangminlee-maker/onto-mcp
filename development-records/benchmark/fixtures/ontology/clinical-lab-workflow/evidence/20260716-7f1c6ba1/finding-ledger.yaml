          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100-106
      unresolved_beyond_evidence: null
  - finding_id: finding-017
    lens_id: semantics
    source_ref: .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-003
    target: Test and Assay concepts
    evidence_anchor: materialized-input.md:46-60,126-127
    claim: The semantic identity boundary between Test and Assay is underdefined
      despite both being maintained as catalog entries.
    lens_rationale_summary: Orderable clinical intent and executable laboratory
      procedure can legitimately be distinct, but dual registration without a
      declared distinction or mapping leaves integrations unable to determine
      whether records are synonyms, one-to-one counterparts, or
      panel-to-component relationships.
    proposed_action: Define Test as the canonical orderable service and Assay as the
      canonical executable procedure, then declare the allowed mapping
      cardinalities and identity rules. If they are intended as synonyms, select
      one canonical concept and represent the other as an alias rather than
      independent registration.
    affected_purpose: Shared EMR/LIS interpretation of ordered and performed laboratory services.
    failure_condition: An EMR sends a Test identifier while the LIS records one or
      more Assay identifiers under the mandated dual-registration practice.
    impact: Implementers cannot derive stable identity or mapping semantics from the
      purported authority document, risking duplicate catalog records and
      incorrect result association.
    evidence_refs:
      - .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-003
      - materialized-input.md:46-60
      - materialized-input.md:126-127
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Shared EMR/LIS interpretation of ordered and performed
        laboratory services.
      failure_condition: An EMR sends a Test identifier while the LIS records one or
        more Assay identifiers under the mandated dual-registration practice.
      impact: Implementers cannot derive stable identity or mapping semantics from the
        purported authority document, risking duplicate catalog records and
        incorrect result association.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: The ontology postpones the synonymy-versus-distinction
        decision while simultaneously requiring both concepts to be populated.
      root_cause_step_id: finding-017.cause-002
      steps:
        - cause_id: finding-017.cause-001
