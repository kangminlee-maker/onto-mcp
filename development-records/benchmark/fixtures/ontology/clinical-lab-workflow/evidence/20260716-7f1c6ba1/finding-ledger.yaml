      order entry and LIS execution.
    failure_condition: An order requires blood while the LIS assay requires WB or
      Serum and consumers must decide compatibility without a declared mapping.
    impact: Equivalent terms may be rejected and non-equivalent materials may be
      accepted, undermining execution safety and integration consistency.
    evidence_refs:
      - .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-005
