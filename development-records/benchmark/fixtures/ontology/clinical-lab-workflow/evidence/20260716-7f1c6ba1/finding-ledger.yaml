    lens_rationale_summary: 모델은 corrected가 release 이전이나 같은 시점에 발생하는 경로를 금지하지 않는다.
      따라서 두 조건이 겹치는 허용 경로에서 값 하나만 가질 수 있는 result_status가 서로 다른 두 값을 동시에 만족해야 한다.
      또한 'amended가 되어야 한다'는 의무와 야간 1회 동기화는 즉시성 또는 허용 지연 시간이 정의되지 않아 배치 전 상태의 계약
      준수 여부도 결정할 수 없다. 임상의가 신뢰한다고 명시된 권위 값이므로 EMR/LIS가 서로 다른 상태를 선택할 수 있다.
    proposed_action: Report 상태 전이표에 조건 우선순위와 시점을 명시한다. 예를 들어 corrected 결과가 있으면
      release 시 amended로 설정하고, release 후 correction은 finalized→amended로 전이하도록
      정의하며, 배치 지연이 허용된다면 최대 지연 시간과 그동안의 표시 상태를 별도로 규정한다.
