  - finding_id: finding-001
    lens_id: axiology
    source_ref: .onto/review/20260716-7f1c6ba1/round1/axiology.findings.yaml#axiology-candidate-001
    target: Result.status, Report.result_status 및 correction 동기화 규칙
    evidence_anchor: "가치 권위:
      .onto/review/20260716-7f1c6ba1/execution-preparation/review-value-alignme\
      nt-criteria.yaml:6-8(EMR/LIS 통합의 개념 권위 문서 적합성과 운영 위험 검토). 대상 증거:
      materialized-input.md:69-83,121-123(Result와 Report가 서로 다른 상태 열거형을 유지하고
      Report 값을 임상의가 신뢰하며 corrected 반영은 야간 배치). value_type=purpose;
      alignment_direction=misaligned."
    claim: 임상의가 신뢰하는 결과 상태를 별도 권위 값으로 복제하고 correction 반영을 야간 배치에 맡긴 결정은 EMR/LIS 통합의
      개념 권위 문서라는 목적에서 벗어난다.
    lens_rationale_summary: 개념 권위 문서는 통합 시스템이 어느 상태를 언제 신뢰할지 단일하고 즉시 판정할 수 있게 해야 한다.
      현재 모델은 임상의용 권위 값이 원천 결과보다 늦게 갱신되는 트레이드오프를 정당화하지 않아, 정상 동작 중에도 임상의가 오래된 상태를
      신뢰하게 할 수 있다.
    proposed_action: Result.status를 결과 상태의 단일 권위로 지정하고 Report 상태는 동기 저장값이 아닌 명시적
      파생값으로 정의한다. 별도 저장이 불가피하면 corrected→amended를 원자적·즉시 적용하고 불일치 상태를 금지하는 불변식을
      추가한다.
    affected_purpose: EMR/LIS 통합에서 엔티티·상태 모델의 개념 권위를 제공한다는 선언된 목적.
    failure_condition: Result가 corrected로 바뀐 뒤 야간 동기화 전까지 Report.result_status가 기존 값을 유지할 때.
    impact: 임상의가 신뢰한다고 명시된 상태가 원천 결과와 달라져 권위 문서의 신뢰성과 통합 동작의 판정 가능성이 직접 훼손된다.
    evidence_refs:
      - .onto/review/20260716-7f1c6ba1/round1/axiology.findings.yaml#axiology-candidate-001
      - review-value-alignment-criteria.yaml:6-8
      - materialized-input.md:69-83
      - materialized-input.md:121-123
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 엔티티·상태 모델의 개념 권위를 제공한다는 선언된 목적.
      failure_condition: Result가 corrected로 바뀐 뒤 야간 동기화 전까지 Report.result_status가 기존 값을 유지할 때.
      impact: 임상의가 신뢰한다고 명시된 상태가 원천 결과와 달라져 권위 문서의 신뢰성과 통합 동작의 판정 가능성이 직접 훼손된다.
      evidence_refs:
        - review-value-alignment-criteria.yaml:6-8
        - materialized-input.md:69-83
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: 동일한 결과 상태를 두 권위 후보에 중복 저장하면서 일관성을 비동기 배치에 위임한 설계.
      root_cause_step_id: finding-001.cause-002
      steps:
        - cause_id: finding-001.cause-001
          claim: corrected 결과가 Report의 amended 상태에 반영되기 전까지 불일치 창이 존재한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:121-123
        - cause_id: finding-001.cause-002
          claim: 이 불일치 창은 Result.status와 임상의가 신뢰하는 Report.result_status를 별도 열거형으로 유지한 것의
            증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-83
      unresolved_beyond_evidence: null
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260716-7f1c6ba1/round1/axiology.findings.yaml#axiology-candidate-002
    target: CriticalValue 통보 모델과 통합 경계
    evidence_anchor: "가치 권위: review-value-alignment-criteria.yaml:6-8(개념 권위와 운영 위험).
      대상 증거: materialized-input.md:100-106,108-119(CriticalValue는 즉시 통보 대상이라고
      정의되지만 통보는 boolean이고 시각·수신자는 외부 전화 기록 대장에 있으며 Result와의 관계가 없음).
      value_type=boundary; alignment_direction=misaligned."
    claim: 즉시 통보 워크플로의 핵심 증거를 외부 전화 기록 대장에 맡긴 경계 결정은 EMR/LIS 통합 권위 모델의 목적을 훼손한다.
    lens_rationale_summary: 통합 시스템은 특정 위험 결과의 통보 상태를 공통 개념으로 교환·추적해야 한다. boolean만으로는
      결과별 통보, 실패·재시도, 수신자와 시각을 식별할 수 없어 시스템 간 상태 합의와 운영 감사가 외부 대장에 종속된다.
    proposed_action: 임계값 정책과 실제 통보 사건을 분리한다. Result를 참조하는 CriticalNotification 엔티티를
      두고 status, notified_at, recipient, notifier 및 실패·재시도 상태를 모델링하며 외부 전화 기록은 그
      사건의 증거 링크로 취급한다.
    affected_purpose: EMR/LIS 통합에서 운영상 중요한 엔티티·관계·상태의 공통 권위를 제공하는 목적.
    failure_condition: 위험 결과가 발생했으나 시스템이 notified boolean과 별도 전화 기록을 서로 결합해야 통보 사실을 판정할 수 있을 때.
    impact: 통합 경계 안에서 결과별 통보 책임과 완료 상태를 판정할 수 없어 개념 권위와 운영 추적성이 동시에 약화된다.
    evidence_refs:
      - .onto/review/20260716-7f1c6ba1/round1/axiology.findings.yaml#axiology-candidate-002
      - review-value-alignment-criteria.yaml:6-8
      - materialized-input.md:100-106
      - materialized-input.md:108-119
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 운영상 중요한 엔티티·관계·상태의 공통 권위를 제공하는 목적.
      failure_condition: 위험 결과가 발생했으나 시스템이 notified boolean과 별도 전화 기록을 서로 결합해야 통보 사실을 판정할 수 있을 때.
      impact: 통합 경계 안에서 결과별 통보 책임과 완료 상태를 판정할 수 없어 개념 권위와 운영 추적성이 동시에 약화된다.
      evidence_refs:
        - review-value-alignment-criteria.yaml:6-8
        - materialized-input.md:100-106
        - materialized-input.md:108-119
    causal_path:
      root_cause_candidate: 임계값 정책과 결과별 통보 사건을 하나의 CriticalValue 개념에 결합하고 핵심 사건 속성을 모델
        경계 밖으로 외부화한 설계.
      root_cause_step_id: finding-002.cause-002
      steps:
        - cause_id: finding-002.cause-001
          claim: 통보 완료 여부만 모델에 남고 시각과 수신자는 외부 전화 기록에 존재한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: finding-002.cause-002
          claim: 이는 CriticalValue가 Result와 연결된 통보 사건이 아니라 Test별 범위와 boolean을 함께 가진 개념으로
            모델링된 것의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100-106
            - materialized-input.md:108-119
      unresolved_beyond_evidence: 외부 전화 기록 대장의 식별자와 결합 보장은 현재 경계에서 확인할 수 없으나, 대상 모델
        자체에 결합 관계가 없다는 사실은 확정적이다.
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260716-7f1c6ba1/round1/axiology.findings.yaml#axiology-candidate-003
    target: Test와 Assay의 이중 카탈로그 운영
    evidence_anchor: "가치 권위: review-value-alignment-criteria.yaml:6-8(EMR/LIS 통합의 개념
      권위). 대상 증거: materialized-input.md:46-60,126-127(Test와 Assay가 별도 코드·검체 어휘를
      사용하며 신규 항목을 양쪽에 등록). value_type=tradeoff; alignment_direction=misaligned."
    claim: 카탈로그 통합 결정을 미룬 채 신규 항목의 이중 등록을 요구하는 국소적 이행 편의가 통합 개념 권위의 목적을 훼손한다.
    lens_rationale_summary: 개념 권위 문서가 두 시스템의 카탈로그 대응을 판정하지 못한 채 운영자에게 이중 등록을 요구하면 항목
      누락·불일치가 사람의 절차로 전가된다. 이는 임시 호환성 비용을 감수하더라도 권위와 매핑 규칙을 명시해야 한다는 통합 목적과 맞지
      않는다.
    proposed_action: Test와 Assay를 성급히 합치기보다 각각 주문 개념과 수행 개념으로 유지하되, 명시적
      realizes/implemented_by 매핑과 공통 검체 개념을 추가한다. 신규 등록은 하나의 권위 카탈로그에서 파생되도록 한다.
    affected_purpose: EMR과 LIS 사이 카탈로그 개념을 권위 있게 연결하는 목적.
    failure_condition: 신규 또는 변경 항목이 두 카탈로그에 독립 등록되거나 서로 다른 검체 어휘로 표현될 때.
    impact: 동일 검사에 대한 시스템 간 대응이 문서로 결정되지 않아 통합 구현과 운영자의 해석에 의존한다.
    evidence_refs:
      - .onto/review/20260716-7f1c6ba1/round1/axiology.findings.yaml#axiology-candidate-003
      - review-value-alignment-criteria.yaml:6-8
      - materialized-input.md:46-60
      - materialized-input.md:126-127
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR과 LIS 사이 카탈로그 개념을 권위 있게 연결하는 목적.
      failure_condition: 신규 또는 변경 항목이 두 카탈로그에 독립 등록되거나 서로 다른 검체 어휘로 표현될 때.
      impact: 동일 검사에 대한 시스템 간 대응이 문서로 결정되지 않아 통합 구현과 운영자의 해석에 의존한다.
      evidence_refs:
        - review-value-alignment-criteria.yaml:6-8
        - materialized-input.md:46-60
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: Test–Assay의 역할 분리를 유지하면서도 두 개념을 연결할 권위 매핑과 공통 검체 어휘를 정의하지 않은 채 결정을 연기한 것.
      root_cause_step_id: finding-003.cause-002
      steps:
        - cause_id: finding-003.cause-001
          claim: 신규 항목은 Test와 Assay 양쪽에 등록해야 하며 각 모델은 서로 다른 코드와 검체 표현을 사용한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:126-127
        - cause_id: finding-003.cause-002
          claim: 이중 등록 의존은 Test와 Assay의 통합 여부만 나중으로 미루고 현재의 권위 매핑을 정의하지 않은 결정의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:126-127
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: axiology
    source_ref: .onto/review/20260716-7f1c6ba1/round1/axiology.findings.yaml#axiology-candidate-004
    target: STAT 주문의 중복 표현
    evidence_anchor: "가치 권위: review-value-alignment-criteria.yaml:6-8(상태 모델의 개념적
      타당성과 운영 위험). 대상 증거: materialized-input.md:15-29,121-124(STAT가 priority 값,
      is_stat boolean, StatOrder 하위 타입으로 각각 표현되지만 일관성 규칙이 없음).
      value_type=principle; alignment_direction=misaligned."
    claim: 하나의 긴급성 결정을 세 독립 표현으로 남긴 모델은 통합 권위가 제공해야 할 단일 판정 기준과 정렬되지 않는다.
    lens_rationale_summary: EMR과 LIS가 서로 다른 표현을 갱신하면 동일 주문이 STAT이면서 비-STAT인 상태가 될 수
      있다. 이는 긴급성 판정을 통합 구현자의 임의 우선순위에 맡겨 개념 권위 문서의 역할을 약화한다.
    proposed_action: priority를 단일 권위 속성으로 두고 is_stat은 priority==stat의 파생값으로 만든다.
      StatOrder가 별도 행위를 가져야 한다면 priority=stat을 필수 불변식으로 정의하고, 그렇지 않으면 하위 타입을
      제거한다.
    affected_purpose: EMR/LIS가 주문 긴급성을 동일하게 판정하도록 하는 상태·엔티티 개념 권위.
    failure_condition: 세 STAT 표현 중 일부만 설정되거나 서로 모순되게 전달될 때.
    impact: 긴급 주문 분류가 시스템별 우선순위 규칙에 따라 달라져 통합 동작과 운영 대응의 신뢰가 약화된다.
    evidence_refs:
      - .onto/review/20260716-7f1c6ba1/round1/axiology.findings.yaml#axiology-candidate-004
      - review-value-alignment-criteria.yaml:6-8
      - materialized-input.md:15-29
      - materialized-input.md:121-124
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS가 주문 긴급성을 동일하게 판정하도록 하는 상태·엔티티 개념 권위.
      failure_condition: 세 STAT 표현 중 일부만 설정되거나 서로 모순되게 전달될 때.
      impact: 긴급 주문 분류가 시스템별 우선순위 규칙에 따라 달라져 통합 동작과 운영 대응의 신뢰가 약화된다.
      evidence_refs:
        - review-value-alignment-criteria.yaml:6-8
        - materialized-input.md:15-29
        - materialized-input.md:121-124
    causal_path:
      root_cause_candidate: STAT 여부를 단일 권위 개념의 속성·파생값으로 정규화하지 않고 enum, boolean,
        subtype으로 각각 독립 모델링한 것.
      root_cause_step_id: finding-004.cause-002
      steps:
        - cause_id: finding-004.cause-001
          claim: 동일한 STAT 의미가 priority, is_stat, StatOrder의 세 위치에 존재하며 상태 규칙에는 이들의 일관성 조건이
            없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:15-29
            - materialized-input.md:121-124
        - cause_id: finding-004.cause-002
          claim: 불일치 가능성은 세 표현 사이에 권위와 파생 관계를 지정하지 않은 중복 모델의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:15-29
      unresolved_beyond_evidence: null
  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260716-7f1c6ba1/round1/coverage.findings.yaml#coverage-candidate-001
    target: clinical-lab-ontology.yaml — Test/Assay 및 분석 수행 모델
    evidence_anchor: materialized-input.md:46-60,108-119,127
    claim: 주문 카탈로그(Test)와 수행 카탈로그(Assay)를 연결하는 대응 관계와 실제 분석 수행 개념이 누락되어 있다.
    lens_rationale_summary: EMR의 주문 항목이 LIS/분석기의 수행 항목으로 어떻게 변환되고 어떤 실행에서 결과가 생성됐는지
      재구성할 수 없다. 따라서 이 문서는 EMR/LIS 통합의 개념 권위 문서로서 핵심 주문-수행 경계를 닫지 못한다.
    proposed_action: Test–Assay 간 명시적 매핑 엔티티를 추가하고 유효기간·버전·권위 시스템을 정의한다. AssayRun 같은
      수행 엔티티를 두어 Assay, Specimen, Result, 장비·방법, 수행 시각을 연결한다.
