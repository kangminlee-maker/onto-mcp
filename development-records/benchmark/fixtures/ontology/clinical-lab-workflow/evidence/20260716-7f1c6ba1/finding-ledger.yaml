  - finding_id: finding-015
    lens_id: semantics
    source_ref: .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-001
    target: Result.status, Report.result_status, and their synchronization rule
    evidence_anchor: materialized-input.md:69-84,121-123
    claim: The ontology labels result-level and report-level states as the same
      information while assigning them incompatible vocabularies, meanings, and
      authorities.
    lens_rationale_summary: Corrected describes a result revision, whereas amended
      describes a report revision; they are related but not synonymous. Treating
      them as duplicated copies makes authority and mapping ambiguous and
      explicitly permits clinician-visible divergence after a correction.
    proposed_action: Define separate ResultStatus and ReportStatus concepts, specify
      the total mapping and transition rules between them, and name one
      authoritative source for each concept. Require correction propagation
      before a corrected result is presented as current.
    affected_purpose: Use of the ontology as the conceptual authority for EMR/LIS
      result reporting.
    failure_condition: A finalized report contains a Result whose status changes to
      corrected before the nightly synchronization updates Report.result_status
      to amended.
    impact: The ontology permits two systems to expose conflicting current-state
      claims, including a stale status explicitly designated as
      clinician-trusted.
    evidence_refs:
      - .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-001
      - materialized-input.md:69-84
      - materialized-input.md:121-123
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use of the ontology as the conceptual authority for EMR/LIS
        result reporting.
      failure_condition: A finalized report contains a Result whose status changes to
        corrected before the nightly synchronization updates
        Report.result_status to amended.
      impact: The ontology permits two systems to expose conflicting current-state
        claims, including a stale status explicitly designated as
        clinician-trusted.
      evidence_refs:
        - materialized-input.md:69-84
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: Result revision state and report publication state are
        conflated as duplicated information while authority is split across two
        fields.
      root_cause_step_id: finding-015.cause-003
      steps:
        - cause_id: finding-015.cause-001
          claim: A corrected Result can coexist temporarily with a Report still marked
            finalized.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:121-123
        - cause_id: finding-015.cause-002
          claim: This divergence is enabled by maintaining two differently coded state
            fields with delayed synchronization.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-84
            - materialized-input.md:121-123
        - cause_id: finding-015.cause-003
          claim: The duplicated fields are described as the same information even though
            corrected and amended denote states of different entities.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-84
      unresolved_beyond_evidence: null
  - finding_id: finding-016
    lens_id: semantics
    source_ref: .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-002
    target: CriticalValue entity
    evidence_anchor: materialized-input.md:100-106
    claim: CriticalValue conflates a reusable threshold definition with a
      result-specific notification occurrence.
    lens_rationale_summary: A threshold policy can apply to many results, whereas
      notification completion is true only for one detected occurrence and
      recipient interaction. Attaching notified to the range makes it unclear
      whether one notification marks the threshold globally notified and
      prevents reliable event-level interpretation.
    proposed_action: Keep CriticalValueThreshold as test-specific policy data.
      Introduce a result-bound CriticalValueOccurrence or Notification event
      containing result_ref, threshold_ref, status, notified_at, recipient, and
      channel.
    affected_purpose: Reliable conceptual authority for critical-result exchange and
      operational notification tracking.
    failure_condition: Multiple results match the same test threshold and
      integrations interpret the threshold-level notified Boolean as the
      notification state of each occurrence.
    impact: Systems can suppress required notifications, duplicate them, or disagree
      about which critical result was communicated.
    evidence_refs:
      - .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-002
      - materialized-input.md:100-106
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Reliable conceptual authority for critical-result exchange and
        operational notification tracking.
      failure_condition: Multiple results match the same test threshold and
        integrations interpret the threshold-level notified Boolean as the
        notification state of each occurrence.
      impact: Systems can suppress required notifications, duplicate them, or disagree
        about which critical result was communicated.
      evidence_refs:
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: Policy configuration and event occurrence are modeled as
        one ontological type.
      root_cause_step_id: finding-016.cause-003
      steps:
        - cause_id: finding-016.cause-001
          claim: A notification-completion flag is attached to an entity defined as a
            value range.
          relation_to_previous: null
          evidence_refs:
