  - finding_id: finding-020
    lens_id: semantics
    source_ref: .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-006
    target: turnaround_time (TAT) definition
    evidence_anchor: materialized-input.md:37-44,75-84,108-128
    claim: TAT is declared as a derived measure without defining which specimen and
      report timestamps govern when an order has multiple related records.
    lens_rationale_summary: A derived measure is not semantically determined merely
      by naming two timestamp fields when either endpoint may have multiple
      candidates. Independent dashboard logic can select different timestamps
      and drift from the ontology while still claiming conformance.
    proposed_action: Model TAT as a derived metric with an explicit subject and
      selection rule, such as per specimen-result-report chain or order-level
      earliest collection to final report release. Declare exclusions,
      correction behavior, and the ontology-owned formula or versioned metric
      definition.
    affected_purpose: Use of the ontology as the shared conceptual authority for
      operational laboratory metrics.
    failure_condition: An Order has multiple specimens or reports and separate
      consumers choose different collected_at or released_at values.
    impact: EMR, LIS, and dashboard implementations can produce incompatible TAT
      values from the same workflow data with no authoritative resolution.
    evidence_refs:
      - .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-006
      - materialized-input.md:37-44
      - materialized-input.md:75-84
      - materialized-input.md:108-128
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use of the ontology as the shared conceptual authority for
        operational laboratory metrics.
      failure_condition: An Order has multiple specimens or reports and separate
        consumers choose different collected_at or released_at values.
      impact: EMR, LIS, and dashboard implementations can produce incompatible TAT
        values from the same workflow data with no authoritative resolution.
      evidence_refs:
        - materialized-input.md:37-44
        - materialized-input.md:75-84
        - materialized-input.md:108-128
    causal_path:
