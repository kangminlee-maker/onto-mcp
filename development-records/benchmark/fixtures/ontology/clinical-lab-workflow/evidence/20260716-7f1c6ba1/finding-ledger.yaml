          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:126-127
      unresolved_beyond_evidence: The bounded artifact does not establish whether the
        intended mapping is synonymous, one-to-one, or compositional.
  - finding_id: finding-018
    lens_id: semantics
    source_ref: .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-004
    target: Order priority, is_stat, and StatOrder
    evidence_anchor: materialized-input.md:15-29
    claim: STAT ordering is modeled simultaneously as an enum value, a Boolean, and
      a subtype, without equivalence constraints.
    lens_rationale_summary: STAT is presented as an order's urgency classification,
      which is contingent state rather than an essential kind of order. Three
      independent representations permit semantically contradictory instances
      and inconsistent classification across EMR/LIS implementations.
    proposed_action: Make priority the canonical representation and derive is_stat
      and any StatOrder view from priority=stat. If StatOrder has genuinely
      distinct identity or lifecycle semantics, define those semantics and
      enforce equivalence constraints explicitly.
    affected_purpose: Consistent interpretation and routing of urgent orders across
      EMR/LIS boundaries.
    failure_condition: An Order carries conflicting subtype, priority, and Boolean
      values, such as priority=routine with is_stat=true or StatOrder
      membership.
    impact: Different consumers can classify and route the same order differently
      because the authority document provides no canonical interpretation.
    evidence_refs:
      - .onto/review/20260716-7f1c6ba1/round1/semantics.findings.yaml#semantics-candidate-004
      - materialized-input.md:15-29
    severity: medium
