findings:
  - candidate_id: coverage-candidate-001
    target: clinical-lab-ontology.yaml — Test/Assay 및 분석 수행 모델
    evidence_anchor: materialized-input.md:46-60,108-119,127
    claim: 주문 카탈로그(Test)와 수행 카탈로그(Assay)를 연결하는 대응 관계와 실제 분석 수행 개념이 누락되어 있다.
    what: Order와 Result는 Test를 참조하지만 Assay는 어떤 엔티티와도 관계가 없고, 신규 항목을 두 카탈로그에 중복 등록한다는
      메모만 있다. Assay 실행, 장비·방법, 실행 시각 및 수행 결과를 표현할 개념도 없다.
    why: EMR의 주문 항목이 LIS/분석기의 수행 항목으로 어떻게 변환되고 어떤 실행에서 결과가 생성됐는지 재구성할 수 없다. 따라서 이
      문서는 EMR/LIS 통합의 개념 권위 문서로서 핵심 주문-수행 경계를 닫지 못한다.
    how_to_fix: Test–Assay 간 명시적 매핑 엔티티를 추가하고 유효기간·버전·권위 시스템을 정의한다. AssayRun 같은 수행
      엔티티를 두어 Assay, Specimen, Result, 장비·방법, 수행 시각을 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 주문부터 보고까지의 워크플로를 정의하는 목적
      failure_condition: EMR의 Test 주문을 LIS의 Assay 수행 및 Result 생성으로 변환하거나 과거 수행 근거를 추적할 때
      impact: 통합 구현자가 별도 매핑과 실행 모델을 임의로 만들게 되어 시스템별 의미 불일치와 추적 불가능성이 발생한다.
      evidence_refs:
        - materialized-input.md:20
        - materialized-input.md:46-73
        - materialized-input.md:108-119
        - materialized-input.md:127
    causal_path:
      root_cause_candidate: 온톨로지가 주문 단위와 결과 단위만 연결하고, 카탈로그 간 변환 및 분석 실행을 독립된 개념으로 모델링하지 않았다.
      root_cause_step_id: coverage-candidate-001.cause-002
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: Assay는 정의되어 있지만 relations에 전혀 참여하지 않으며 Result는 Test만 참조한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:54-73
            - materialized-input.md:108-119
        - cause_id: coverage-candidate-001.cause-002
          claim: Test와 Assay의 신규 항목을 양쪽에 등록한다는 운영 메모만 있고 대응 관계나 권위가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:127
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-002
    target: clinical-lab-ontology.yaml — Result/Report 상태 권위
    evidence_anchor: materialized-input.md:62-84,121-123
    claim: 두 상태 값의 단일 원본, 정식 대응 규칙 및 변경 이력이 완결되어 있지 않다.
    what: Result.status는 LIS가 기록하고 Report.result_status에도 같은 정보를 유지한다고 설명하지만, Report
      쪽은 별도의 열거값을 사용하며 임상의가 신뢰하는 권위 값이라고도 한다. 동기화는 야간 배치에 의존하고 상태 변경 사건이나 버전은
      없다.
    why: 어느 값이 원천인지, 서로 다른 열거값이 어떻게 대응하는지, 배치 전 불일치 시 어떤 값을 따라야 하는지를 온톨로지로 결정할 수 없다.
      정정 결과가 발생하면 임상의가 보는 상태와 LIS 상태가 장시간 달라질 수 있다.
    how_to_fix: 하나의 canonical ResultStatus와 권위 시스템을 지정하고 Report 상태는 명시적 projection으로
      정의한다. 상태 전이 사건에 이전값·새값·발생시각·행위자·근거를 기록하고 동기화 지연 중의 소비 규칙을 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 간 결과 상태 의미와 권위를 일관되게 전달하는 목적
      failure_condition: preliminary/final/corrected 결과가 prelim/finalized/amended 보고
        상태로 변환되거나 정정 후 배치가 실행되기 전
      impact: 동일 결과에 상충하는 상태가 노출되고 소비 시스템별로 최종성 또는 정정 여부를 다르게 판단할 수 있다.
      evidence_refs:
        - materialized-input.md:69-84
        - materialized-input.md:123
    causal_path:
      root_cause_candidate: 공유 상태를 단일 권위 개념과 파생 투영으로 모델링하지 않고 두 저장 필드로 병행 관리했다.
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: Result.status와 Report.result_status가 서로 다른 열거값으로 동일 정보를 유지한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-83
        - cause_id: coverage-candidate-002.cause-002
          claim: 정정 상태의 일치는 즉시 전이가 아니라 야간 동기화 배치에 맡겨져 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:123
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: clinical-lab-ontology.yaml — CriticalValue 통보 감사 추적
    evidence_anchor: materialized-input.md:100-106
    claim: 중요 결과 통보를 증명할 행위자·시각·수신자·근거의 감사 개념이 온톨로지에 없다.
    what: CriticalValue에는 notified 불리언만 있고 통보 시각과 수신자는 외부 전화 기록 대장에 있다고만 서술된다. 통보
      사건, 통보자, 수신자, 시각, 방법, 실패·재시도 또는 확인 근거를 표현할 엔티티와 관계가 없다.
    why: 불리언만으로는 누가 누구에게 언제 무엇을 통보했는지 검증하거나 실패·재통보를 구분할 수 없다. 외부 대장이 온톨로지와 연결되지 않아
      통합 문서가 통제 행위의 증거 범위를 포괄하지 못한다.
    how_to_fix: CriticalNotification 엔티티를 추가하여 해당 Result/CriticalValue, 발신자, 수신자,
      발생·확인 시각, 채널, 상태, 근거 및 재시도 관계를 모델링하고 외부 대장의 권위와 식별자를 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 중요 결과의 안전한 전달을 포함하는 임상검사 워크플로의 개념 권위 제공
      failure_condition: 통보 완료 여부를 감사하거나 미수신·재시도·대리 수신을 판별할 때
      impact: 환자 안전 관련 통제의 수행 여부를 재구성할 수 없고 EMR/LIS가 서로 다른 통보 증거를 유지할 위험이 있다.
      evidence_refs:
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: 통제를 독립된 사건과 증거로 모델링하지 않고 결과 불리언과 외부 대장 메모로 축약했다.
      root_cause_step_id: coverage-candidate-003.cause-002
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: CriticalValue의 통보 정보는 notified 불리언 하나뿐이다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: coverage-candidate-003.cause-002
          claim: 시각과 수신자 정보는 식별 관계 없이 전화 기록 대장에 있다고만 기술된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:106
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: clinical-lab-ontology.yaml — Specimen lifecycle
    evidence_anchor: materialized-input.md:37-44,121-124
    claim: 검체 lifecycle이 분석 완료에서 끝나며 보관·반출·폐기와 예외 종결 상태를 포괄하지 않는다.
    what: Specimen 상태는 collected, received, in_analysis, analyzed만 정의한다. 분석 후 보관·폐기는
      부서 내규에 위임되어 있고, 거부·분실·오염·부적합·재채취 같은 비정상 종결도 표현되지 않는다.
    why: 분석 후 검체의 현재 상태와 처분 시각을 통합 시스템에서 재구성할 수 없고, 정상 분석에 이르지 못한 검체도 lifecycle에
      수용되지 않는다.
    how_to_fix: 보관, 보류, 폐기 및 필요한 예외 종결 상태를 추가하고 상태 전이 사건에 시각·행위자·사유를 둔다. 부서별 보존 규칙은
      버전된 정책 개념으로 연결한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문부터 보고까지 검체 흐름을 공통 개념으로 정의하는 목적
      failure_condition: 분석 후 검체를 조회·재검하거나 부적합 검체가 정상 분석 전에 종료될 때
      impact: EMR/LIS가 검체의 종결 상태를 공통으로 해석할 수 없고 보존·폐기 이력을 재구성할 수 없다.
      evidence_refs:
        - materialized-input.md:37-44
        - materialized-input.md:124
    causal_path:
      root_cause_candidate: 검체 lifecycle의 범위를 분석 처리 단계까지만 모델링하고 종결 및 예외 처리 영역을 외부 내규에 위임했다.
      root_cause_step_id: coverage-candidate-004.cause-002
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: Specimen lifecycle의 마지막 상태는 analyzed이다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:44
        - cause_id: coverage-candidate-004.cause-002
          claim: 그 이후 보관과 폐기는 온톨로지 개념 없이 부서 내규에 맡겨져 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:124
      unresolved_beyond_evidence: 구체적으로 필요한 예외 상태의 목록과 보존 기간은 부서 정책 증거가 경계 안에 없어 확정할 수 없다.
  - candidate_id: coverage-candidate-005
    target: clinical-lab-ontology.yaml — 시점 의존 기준과 카탈로그 이력
    evidence_anchor: materialized-input.md:46-60,100-106,126-128
    claim: 검사 카탈로그와 중요값 기준에 유효기간·버전·변경 이력 차원이 누락되어 있다.
    what: Test, Assay 및 CriticalValue는 현재 코드·명칭·검체 종류·경계값만 가지며
      effective_from/effective_to, 버전, 변경 근거 또는 대체 관계가 없다.
    why: 검사 정의나 중요값 임계치가 변경된 뒤 과거 주문과 결과에 당시 어떤 정의와 기준이 적용됐는지 재구성할 수 없다. 이 결손은 정정,
      감사 및 시스템 간 재처리 시 판정 일관성을 약화한다.
    how_to_fix: 카탈로그 항목과 CriticalValue 정책을 버전된 개념으로 만들고 유효기간, 상태, 변경 근거, 선후 버전 관계 및
      각 Order/Result가 사용한 버전 참조를 추가한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS가 공통 검사 정의와 판정 기준을 장기간 권위 있게 공유하는 목적
      failure_condition: 카탈로그 정의 또는 중요값 경계가 변경된 후 과거 결과를 재해석·감사·재처리할 때
      impact: 현재 값이 과거 사건에 소급 적용되어 당시 판정과 통보 의무를 정확히 재구성할 수 없다.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:100-106
        - materialized-input.md:127
    causal_path:
      root_cause_candidate: 시점 의존하는 카탈로그 및 판정 정책을 불변 속성 집합으로만 모델링했다.
      root_cause_step_id: coverage-candidate-005.cause-002
      steps:
        - cause_id: coverage-candidate-005.cause-001
          claim: Test, Assay, CriticalValue에 유효기간이나 버전 속성이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:100-106
        - cause_id: coverage-candidate-005.cause-002
          claim: 두 카탈로그의 정비와 중복 등록이 예정되어 있어 정의 변경 가능성이 문서 자체에 드러난다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:127
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - 이 문서가 선언한 대로 Order부터 Report까지의 EMR/LIS 통합 개념 권위 문서라면 주문 항목과 실제 수행 항목 사이의 변환
    및 추적이 범위에 포함된다고 가정했다.
  - 중요값 통보, 검체 처분, 결과 정정처럼 문서에 명시된 운영 행위는 외부 시스템에 저장되더라도 온톨로지 안에서 식별·연결 가능한 증거
    개념이 필요하다고 가정했다.
  - 카탈로그 정의와 중요값 경계는 운영 중 변경될 수 있는 시점 의존 값이라고 가정했다.
validation:
  unaddressable_candidates: []
