        corresponding Order state rule for later corrections. Source finding
        context: The ontology allows Result.status to be `corrected`. Source
        finding context: The ontology explicitly allows Result.status to change
        to corrected after report finalization. Source finding context: Order
        completion is triggered by all Results being final, but no rule
        preserves or revises Order.completed when a Result later becomes
