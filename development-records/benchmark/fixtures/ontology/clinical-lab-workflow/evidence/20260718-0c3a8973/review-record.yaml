    - issue_id: issue-009
      candidates: *a5
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "The logic evidence directly shows that a later corrected result can
        invalidate the predicate that made an order completed. This is a
        high-severity state-correctness defect in the authority model and must
        be closed in the target. Source finding context:
        clinical-lab-ontology.yaml state_rules Source finding context: Embedded
        Materialized Input, state_rules[0] and Result.status enum values Source
        finding context: Order completion rule requires every Result to be
        `final`, but Result statuses can later become `corrected`, making a
        completed Order incompatible with an allowed result state transition.
        Source finding context: The contradiction is temporal: at completion
        time all Results may be `final`, but the model later allows
        `Result.status=corrected`. If `completed` continues to mean the rule
        condition remains true, the same instance would have
        `Order.lifecycle=completed` while not all associated Results are
        `final`. This weakens the ontology as an EMR/LIS authority document
        because downstream systems cannot know whether `completed` is a stable
        terminal state or a snapshot transition marker. Logic-specific verdict:
        fail. conflict_pair: `state_rules[0]` vs
        `state_rules[1]`/`Result.attributes.status.values`. satisfiability_note:
        inter-claim; the completion rule interacts with a later correction rule
        that makes the completion predicate false after it has been used.
        modality_note: mixed necessary/possible; a necessary completion
        condition is defined over a possible later mutable status.
        boundary_handoff_note: This is primarily logic because the conflict
        remains after term meanings are fixed; evolution may also review whether
        correction/reopen events are modeled adequately. Source finding context:
        Define `completed` as either a historical transition snapshot or a
        current invariant. If it is a current invariant, add a reopen/amended
        lifecycle transition for Order when any Result becomes `corrected`; if
        it is historical, change the rule to record completion based on a
        timestamped snapshot and avoid requiring current Result statuses to
        remain `final`. Source finding context:
        .onto/review/20260718-0c3a8973/round1/logic.findings.yaml#logic-candida\
        te-001 Source finding context: Use the ontology as the EMR/LIS
        integration concept authority for entity, relationship, and state
        behavior. Source finding context: A Result is final when the Order
        transitions to completed, then later changes to corrected as explicitly
        allowed by the Report correction rule. Source finding context: The
        integration contract cannot consistently interpret completed Orders:
        EMR/LIS consumers may treat completion as terminal while LIS corrections
        make the completion predicate false. Source finding context: Order
        completion is defined over mutable Result.status values without a
        corresponding Order state rule for later corrections. Source finding
        context: The ontology allows Result.status to be `corrected`. Source
        finding context: The ontology explicitly allows Result.status to change
        to corrected after report finalization. Source finding context: Order
        completion is triggered by all Results being final, but no rule
        preserves or revises Order.completed when a Result later becomes
        corrected."
    - issue_id: issue-010
      candidates: *a6
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "The logic evidence directly supports a mutually exclusive status
        assignment risk for one report status field. Because this affects
        authoritative displayed report status after correction, it is a current
        correctness blocker for the target ontology. Source finding context:
        clinical-lab-ontology.yaml Report.result_status and state_rules Source
        finding context: Embedded Materialized Input, Report.result_status enum
        values and state_rules[1] Source finding context: The Report
        finalization rule assigns `finalized` when `released_at` is recorded and
        also requires `amended` after a Result correction, but the model has no
        temporal rule resolving whether a corrected result can coexist with the
        original `released_at` finalization condition. Source finding context:
        As written, the rule conditions are not mutually exclusive. A corrected
        post-release report still has a `released_at` timestamp, so the same
        Report can satisfy the condition for `finalized` and the condition for
        `amended`. This is a formal state-rule conflict because `result_status`
        is a single enum value and cannot simultaneously be `finalized` and
        `amended`. Logic-specific verdict: fail. conflict_pair: `state_rules[1]`
        internal finalized clause vs corrected/amended clause.
        satisfiability_note: intra-claim; one state rule contains two state
        assignments whose predicates can overlap over time. modality_note: mixed
        necessary/obligatory; a necessary finalization assignment conflicts with
        an obligatory amendment assignment when both predicates hold.
        boundary_handoff_note: Evolution may separately assess whether report
        versioning should exist, but the immediate issue is the lack of logical
        precedence between two explicit assignments. Source finding context:
        Make the finalization condition snapshot-scoped, for example
        `Report.result_status becomes finalized when released_at is first
        recorded and no later correction is pending`, or define precedence so
        correction supersedes finalization: `corrected Result after release sets
        Report.result_status=amended until a new released_at/version is issued`.
        Source finding context:
        .onto/review/20260718-0c3a8973/round1/logic.findings.yaml#logic-candida\
        te-002 Source finding context: Use the ontology as a state authority for
        EMR/LIS report synchronization. Source finding context: A Report has
        `released_at` recorded and a linked Result later changes to `corrected`.
        Source finding context: Consumers cannot determine the authoritative
        displayed report status because one enum field is required to be both
        `finalized` and `amended` under overlapping conditions. Source finding
        context: Report.result_status assignments are defined by overlapping
        predicates without precedence, versioning, or snapshot scoping. Source
        finding context: Report.result_status is a single enum field with
        mutually exclusive values. Source finding context: Recording released_at
        assigns the Report to finalized. Source finding context: A later
        corrected Result assigns the same Report.result_status to amended while
        released_at remains recorded."
