      information.
    lens_rationale_summary: "The ontology asserts semantic sameness but uses
      different terms: `preliminary` versus `prelim`, `final` versus
      `finalized`, and `corrected` versus `amended`. Without an explicit value
      mapping and authority rule, corrected results may be interpreted as
      amended reports or final results may be interpreted as finalized reports
      even though those terms can refer to different workflow layers."
    proposed_action: Define one canonical status vocabulary or add a formal mapping
      table between result-level and report-level statuses, including authority,
      timing, and whether `corrected` and `amended` are synonyms or distinct
      events.
