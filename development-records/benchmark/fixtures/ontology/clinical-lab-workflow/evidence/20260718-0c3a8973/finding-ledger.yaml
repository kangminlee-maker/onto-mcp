  - finding_id: finding-019
    lens_id: structure
    source_ref: .onto/review/20260718-0c3a8973/round1/structure.findings.yaml#structure-candidate-002
    target: clinical-lab-ontology.yaml Assay structure
    evidence_anchor: .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:46,54,108,127
    claim: Assay lacks the required structural connection to Test despite being
      maintained alongside Test.
    lens_rationale_summary: "This is a structural gap rather than only a naming
      issue: the document declares two catalog-like entities that must be
      co-maintained, but provides no graph edge that lets an integration
      determine which executable assay realizes a requested test."
    proposed_action: Add an explicit mapping relation such as `Test -> Assay` with a
      clear kind like `realized_by`, `maps_to`, or `performed_as`, or define a
      join entity if one Test can map to multiple assays by specimen type or
      analyzer.
    affected_purpose: EMR/LIS integration design from orderable tests to
      LIS/analyzer execution units.
    failure_condition: A workflow needs to route an ordered Test to the
      corresponding Assay, but the ontology provides no explicit relation
      connecting the two.
    impact: Implementers may create local, incompatible mappings outside the concept
      authority, weakening traceability from orders to executed assays and
      produced results.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/structure.findings.yaml#structure-candidate-002
