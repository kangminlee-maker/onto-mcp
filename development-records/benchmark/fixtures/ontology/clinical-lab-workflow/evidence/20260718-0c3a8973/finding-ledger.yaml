        finalized 상태가 된다`"
      - "Embedded Materialized Input: state_rules[1] `Result.status가 corrected로
        바뀌면 Report.result_status는 amended가 되어야 한다`"
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology as a state authority for EMR/LIS report synchronization.
      failure_condition: A Report has `released_at` recorded and a linked Result later
