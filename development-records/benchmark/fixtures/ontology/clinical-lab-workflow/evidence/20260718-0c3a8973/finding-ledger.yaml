      declaring which representation wins. It also treats STAT as a rigid
      subtype even though the target itself presents it as a priority/flag on an
      order."
    proposed_action: "Choose one canonical STAT concept. Prefer making STAT a
      priority value with optional `stat_reason`, or define an explicit
