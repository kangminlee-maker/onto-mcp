        책임 소재 판단을 약화시킨다.
      evidence_refs:
        - materialized-input.md:100-106
        - materialized-input.md:6-8
    causal_path:
      root_cause_candidate: 통제가 필요한 행위를 별도 사건/증거 개념으로 모델링하지 않고 상태성 boolean으로 축약했다.
      root_cause_step_id: finding-004.cause-003
