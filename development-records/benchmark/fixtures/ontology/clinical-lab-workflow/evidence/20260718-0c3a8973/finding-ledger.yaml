  - finding_id: finding-016
    lens_id: semantics
    source_ref: .onto/review/20260718-0c3a8973/round1/semantics.findings.yaml#semantics-candidate-004
    target: CriticalValue
    evidence_anchor: .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:100,
      .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:106
    claim: "`CriticalValue` mixes a threshold/range concept with a
      notification-event state."
    lens_rationale_summary: A critical-value range is a definitional rule for
      identifying dangerous results, while notification completion is an
      operational event about a specific patient/result occurrence. Placing
      `notified` on the range concept makes the range appear to become notified,
      which is semantically wrong and can hide which result, clinician, time, or
      recipient was actually notified.
    proposed_action: Separate `CriticalValueThreshold` from a
      `CriticalValueNotification` or `CriticalResultEvent`. Keep bounds on the
      threshold concept and move notification status, time, recipient, and
      linked result/order/patient to the event concept.
    affected_purpose: Use as an operationally safe concept authority for clinical
      lab workflow integration.
    failure_condition: When critical value handling is implemented, notification
      state is attached to the threshold/range rather than to the specific
      result event requiring notification.
    impact: Systems may record or interpret notification as a property of the rule
      rather than of an actual critical result, weakening auditability and
      clinical follow-up semantics.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/semantics.findings.yaml#semantics-candidate-004
      - materialized-input.md:100-106
    severity: medium
    domain_threshold_used: null
    materiality_basis:
