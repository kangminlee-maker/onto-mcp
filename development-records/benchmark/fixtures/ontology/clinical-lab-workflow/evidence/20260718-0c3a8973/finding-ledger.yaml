  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260718-0c3a8973/round1/coverage.findings.yaml#coverage-candidate-002
    target: Specimen lifecycle coverage
    evidence_anchor: .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:37-44,121-124
    claim: Specimen lifecycle이 분석 이후의 보관·폐기 구간을 온톨로지 범위에 포함하지 않는다.
    lens_rationale_summary: 대상 문서는 주문부터 보고까지의 파이프라인을 다룬다고 하지만 검체는 결과 산출의 근거이며, 분석
      후에도 재검·추가검사·감사·폐기 책임에 영향을 준다. 종료 구간을 외부 내규로만 남기면 EMR/LIS 통합 설계에서 검체가 더 이상
      사용 가능하지 않은 시점, 보관 권한, 폐기 완료 상태를 공통 개념으로 판단할 수 없다.
    proposed_action: Specimen lifecycle에 stored/retained/disposed/returned/rejected
      같은 종결 및 예외 상태를 추가하거나, SpecimenDisposition/SpecimenRetentionPolicy 엔티티를 두어
      보관 위치, 보존 기한, 처분 시각, 처분자, 근거 정책을 모델링한다.
    affected_purpose: 검체 기반 임상검사 워크플로를 EMR/LIS 통합의 개념 권위로 닫는 목적
    failure_condition: 분석 완료 뒤 검체 보관, 재검 가능성, 폐기 완료, 부서별 내규 차이를 시스템 간 공통 상태로 판정해야 하는 경우
    impact: 검체 lifecycle의 종료 구간이 빠져 운영 상태 판단이 부서별 외부 규칙에 흩어지고, 결과 재검·감사·폐기 책임에 대한 통합
      권위가 약해진다.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/coverage.findings.yaml#coverage-candidate-002
      - materialized-input.md:37-44
      - materialized-input.md:121-124
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 검체 기반 임상검사 워크플로를 EMR/LIS 통합의 개념 권위로 닫는 목적
      failure_condition: 분석 완료 뒤 검체 보관, 재검 가능성, 폐기 완료, 부서별 내규 차이를 시스템 간 공통 상태로 판정해야 하는 경우
      impact: 검체 lifecycle의 종료 구간이 빠져 운영 상태 판단이 부서별 외부 규칙에 흩어지고, 결과 재검·감사·폐기 책임에 대한 통합
        권위가 약해진다.
      evidence_refs:
        - materialized-input.md:37-44
        - materialized-input.md:121-124
    causal_path:
      root_cause_candidate: 검체 개념의 lifecycle 범위를 결과 생성까지만 모델링하고 분석 후 처분 영역을 온톨로지 밖 정책으로 위임했다.
      root_cause_step_id: finding-005.cause-003
      steps:
        - cause_id: finding-005.cause-001
          claim: Specimen lifecycle은 analyzed에서 종료된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37-44
        - cause_id: finding-005.cause-002
          claim: 분석 후 보관/폐기 처리는 상태나 엔티티가 아니라 부서 내규 위임 문장으로만 존재한다.
