  - finding_id: finding-006
    lens_id: coverage
    source_ref: .onto/review/20260718-0c3a8973/round1/coverage.findings.yaml#coverage-candidate-003
    target: Catalog, threshold, and TAT temporal-authority coverage
    evidence_anchor: .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:46-60,100-106,126-128
    claim: 시점 의존 값과 병행 관리 값에 유효기간·이력·단일 권위 개념이 부족하다.
    lens_rationale_summary: 검사 카탈로그, 중요값 기준, TAT 계산은 시간이 지나며 변경될 수 있는 운영 기준이다. 현재
      모델은 현재값만 담고 언제 어떤 기준이 적용되었는지 재구성할 수 없으며, Test/Assay 및 TAT처럼 여러 시스템이 병행
      관리하는 값의 단일 권위를 지정하지 않는다. 과거 결과 해석이나 통합 데이터 불일치 처리에서 권위 문서 역할이 약해진다.
    proposed_action: TestCatalogEntry/AssayMapping/CriticalValueRule/TatDefinition
      같은 버전 가능 개념을 추가하고 effective_from/effective_to, version,
      source_system/authority, supersedes, mapping status를 둔다. TAT는 계산 시작/종료
      이벤트와 예외 규칙을 권위 정의로 모델링하고 대시보드 계산식은 그 정의의 소비자로 위치시킨다.
    affected_purpose: EMR/LIS 통합에서 검사 카탈로그, 중요값 기준, 성과 지표의 개념 권위를 제공하는 목적
    failure_condition: 카탈로그 항목, 중요값 임계치, TAT 계산 규칙이 변경된 뒤 과거 시점의 결과·알림·지표를 재현하거나 두
      시스템의 값 충돌을 해소해야 하는 경우
    impact: 유효기간·이력·권위 원본이 없으면 통합 시스템이 현재값으로 과거 기록을 오해하거나, Test/Assay 및 대시보드 계산식 간
