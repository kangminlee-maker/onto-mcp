    source_ref: .onto/review/20260718-0c3a8973/round1/semantics.findings.yaml#semantics-candidate-005
    target: Specimen-to-Result relation naming
    evidence_anchor: .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:118,
      .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:119
    claim: The relation `Specimen produces Result` gives a physical specimen the
      semantic role of producing a result.
    lens_rationale_summary: A specimen is the physical source material; the analysis
      process, assay, instrument, or lab workflow produces the result. Calling
      the specimen the producer blurs source material with operational
      actor/process. This is a semantic naming mismatch, even if a derived-from
      relation is appropriate.
    proposed_action: Keep `Result derived_from Specimen` for material provenance and
      replace `Specimen produces Result` with a relation from `Assay` or an
      analysis event/process to `Result`, if that process concept is in scope.
    affected_purpose: declared review purpose
    failure_condition: no material failure condition is shown by the current bounded lens evidence
    impact: A specimen is the physical source material; the analysis process, assay,
      instrument, or lab workflow produces the result. Calling the specimen the
      producer blurs source material with operational actor/process. This is a
      semantic naming mismatch, even if a derived-from relation is appropriate.
