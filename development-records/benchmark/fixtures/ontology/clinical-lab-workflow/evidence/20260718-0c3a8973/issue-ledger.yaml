issues:
  - issue_id: issue-001
    root_cause_hypothesis: Result and report status authority is split across
      duplicated vocabularies and delayed synchronization rather than a single
      current authoritative state contract.
    root_confidence: high
    surface_finding_ids:
      - finding-001
      - finding-009
      - finding-014
    relation_refs:
      - rel-010
      - rel-011
    raised_by_lens_ids:
      - axiology
      - evolution
      - semantics
    issue_statement: The ontology makes Result.status and Report.result_status both
      authoritative or duplicated status surfaces without precise mapping,
      timing, and correction-propagation rules.
    proposed_action: Define one canonical status vocabulary or an explicit versioned
      mapping between result-level and report-level statuses, including
      authority, timing, correction/amendment semantics, and clinician-visible
      propagation expectations.
    affected_purpose: Use the ontology as the concept authority document for EMR/LIS
      integration and clinician-facing report semantics.
    failure_condition: A result is corrected after release, or LIS/report status
      vocabularies change, while Report.result_status remains separately
      maintained and synchronized by nightly batch.
    impact: Clinicians and EMR/LIS consumers can see stale or ambiguously mapped
      report states, weakening trust in the ontology as the authority for
      result/report status.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:69-83
      - materialized-input.md:121-123
      - review-value-alignment-criteria.yaml:6-8
      - .onto/review/20260718-0c3a8973/round1/evolution.findings.yaml#evolution-candidate-003
