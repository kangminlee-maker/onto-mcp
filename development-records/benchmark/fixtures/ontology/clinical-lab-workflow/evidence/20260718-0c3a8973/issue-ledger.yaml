      - materialized-input.md:42
      - materialized-input.md:52
      - materialized-input.md:60
    severity: high
    domain_threshold_used: null
    singleton_reason: null
  - issue_id: issue-006
    root_cause_hypothesis: Test and Assay are split as catalog concepts without an
      explicit semantic boundary, mapping relation, or registration authority.
    root_confidence: high
    surface_finding_ids:
      - finding-007
      - finding-015
      - finding-019
    relation_refs:
      - rel-006
      - rel-008
    raised_by_lens_ids:
      - evolution
      - semantics
      - structure
    issue_statement: The ontology requires Test and Assay co-maintenance but does
      not define whether they are synonyms, variants, mapped concepts, or
      orderable versus executable units.
    proposed_action: Either merge Test and Assay if they are intended as synonyms,
      or define the canonical distinction and add an explicit Test-to-Assay
      mapping relation with ownership, mapping status, specimen/analyzer
      variants, and registration authority.
    affected_purpose: Use as the shared concept authority for order-to-analysis
      EMR/LIS integration.
    failure_condition: A new lab item, assay variant, or order-to-execution mapping
      change must be represented, but Test and Assay must be updated
      independently without a modeled relationship.
    impact: Implementers may create local mappings outside the concept authority,
      weakening traceability from EMR orders to LIS/analyzer execution and
      produced results.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/evolution.findings.yaml#evolution-candidate-001
      - materialized-input.md:46
      - materialized-input.md:54
