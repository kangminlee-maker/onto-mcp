    domain_threshold_used: null
    singleton_reason: Only a duplicates relation to finding-002 and a
      shared_cause_candidate relation to finding-018 are available; the unit
      contract requires same_root_candidate support for multi-finding issues.
  - issue_id: issue-004
    root_cause_hypothesis: TAT is named in the ontology but its authoritative
      calculation formula and ownership are delegated outside the ontology.
    root_confidence: high
    surface_finding_ids:
      - finding-003
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: Turnaround-time semantics remain prose-level while the
      calculation authority is maintained by a dashboard team.
    proposed_action: Define TAT as a derived metric in the ontology with source
      fields, calculation start/end events, inclusion/exclusion rules,
      ownership, and named projections for dashboard variants.
    affected_purpose: Use the ontology as a concept authority for EMR/LIS
      integration across entities, relations, and states.
    failure_condition: Operational dashboards, LIS, or EMR integrations compute TAT
      differently because the authoritative formula is maintained outside the
      ontology.
    impact: A key workflow metric becomes locally governed, reducing trust in the
      ontology as the integration authority and increasing risk of conflicting
      operational interpretations.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:6-8
      - materialized-input.md:126-128
      - review-value-alignment-criteria.yaml:6-8
    severity: medium
    domain_threshold_used: null
    singleton_reason: Only a shared_cause_candidate relation to finding-006 is
      available; shared-cause relations are preserved as dependency context
      rather than merged.
  - issue_id: issue-005
    root_cause_hypothesis: Mutable operational classification values are modeled as
      local current fields instead of shared, versionable authority concepts.
    root_confidence: medium
    surface_finding_ids:
      - finding-006
      - finding-008
    relation_refs:
      - rel-017
    raised_by_lens_ids:
      - coverage
      - evolution
    issue_statement: The ontology lacks governed code-set/version concepts for
      changing catalog, threshold, TAT, and specimen-kind values, with specimen
      type split between closed enums and free strings.
    proposed_action: Promote mutable operational values to versionable authority
      concepts such as TestCatalogEntry, AssayMapping, CriticalValueRule,
      TatDefinition, and SpecimenType/SpecimenKind with effective dates, source
      authority, aliases, and external codes.
    affected_purpose: EMR/LIS integration에서 검사 카탈로그, 중요값 기준, 성과 지표, 주문/수행 검체를 안정적으로
      연결하는 개념 권위를 제공하는 목적
    failure_condition: Mutable standards or specimen categories change and systems
      must reconstruct historical interpretation or reconcile enum values with
      free-string/local representations.
    impact: Without versioning and common authority concepts, integrations can
      misread historical records, diverge on current values, or depend on
      implementation-specific string/enum mappings.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/coverage.findings.yaml#coverage-candidate-003
      - materialized-input.md:46-60
      - materialized-input.md:100-106
