      - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:100
      - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:108
    severity: medium
    domain_threshold_used: null
    singleton_reason: Only shared_cause_candidate relations are available;
      shared-cause relations are preserved as dependency context rather than
      merged.
  - issue_id: issue-013
    root_cause_hypothesis: The Specimen-to-Result relation name assigns production
      agency to source material rather than to an analysis process or assay.
    root_confidence: medium
    surface_finding_ids:
      - finding-017
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: The relation Specimen produces Result blurs material provenance
      with operational production.
    proposed_action: Use Result derived_from Specimen for material provenance and,
      if in scope, model Assay or an analysis event/process as producing Result.
    affected_purpose: declared review purpose
    failure_condition: no material failure condition is shown by the current bounded lens evidence
    impact: The naming mismatch can confuse source material with the process that
      produces results, but the bounded evidence does not show material failure
      for the declared purpose.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/semantics.findings.yaml#semantics-candidate-005
    severity: low
    domain_threshold_used: null
    singleton_reason: No relation in the finding-relation graph connects this
      finding to another finding.
