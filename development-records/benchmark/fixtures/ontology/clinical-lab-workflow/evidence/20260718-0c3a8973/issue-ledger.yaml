  - issue_id: issue-009
    root_cause_hypothesis: Order completion is defined over mutable Result.status
      values without a corresponding temporal snapshot or correction/reopen
      rule.
    root_confidence: high
    surface_finding_ids:
      - finding-011
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: A completed Order can become incompatible with a later allowed
      Result.status=corrected transition because completion depends on all
      results currently being final.
    proposed_action: Define completed as either a timestamped historical snapshot or
      a current invariant; if current, add reopen/amended lifecycle behavior
      when any Result becomes corrected.
    affected_purpose: Use the ontology as the EMR/LIS integration concept authority
      for entity, relationship, and state behavior.
    failure_condition: A Result is final when the Order transitions to completed,
      then later changes to corrected as explicitly allowed by the Report
      correction rule.
    impact: EMR/LIS consumers cannot consistently interpret whether completed Orders
      are terminal or snapshot markers after LIS corrections.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/logic.findings.yaml#logic-candidate-001
      - "Embedded Materialized Input: Result.status values [preliminary, final,
        corrected]"
      - "Embedded Materialized Input: state_rules[0] `Order는 모든 Result가 final일 때
        completed로 전이한다.`"
      - "Embedded Materialized Input: state_rules[1] `Result.status가 corrected로
        바뀌면 Report.result_status는 amended가 되어야 한다`"
    severity: high
    domain_threshold_used: null
    singleton_reason: Only a shared_cause_candidate relation to finding-012 is
      available; shared-cause relations are preserved as dependency context
      rather than merged.
  - issue_id: issue-010
    root_cause_hypothesis: Report.result_status assignments are defined by
      overlapping predicates without precedence, versioning, or snapshot
      scoping.
    root_confidence: high
    surface_finding_ids:
      - finding-012
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: A post-release corrected result can require one report status
      field to be both finalized and amended because released_at remains present
      while correction also applies.
    proposed_action: Make finalization snapshot-scoped or define correction
      precedence, such as corrected Result after release superseding finalized
      until a new report version or release is issued.
    affected_purpose: Use the ontology as a state authority for EMR/LIS report synchronization.
    failure_condition: A Report has released_at recorded and a linked Result later
      changes to corrected.
    impact: Consumers cannot determine the authoritative displayed report status
      because overlapping conditions assign mutually exclusive enum values.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/logic.findings.yaml#logic-candidate-002
      - "Embedded Materialized Input: Report.result_status values [prelim,
        finalized, amended]"
      - "Embedded Materialized Input: state_rules[1] `Report는 released_at 기록 시점에
        finalized 상태가 된다`"
      - "Embedded Materialized Input: state_rules[1] `Result.status가 corrected로
        바뀌면 Report.result_status는 amended가 되어야 한다`"
    severity: high
    domain_threshold_used: null
    singleton_reason: Only shared_cause_candidate/enables relations are available;
      the unit contract does not permit merging on these relation types.
  - issue_id: issue-011
    root_cause_hypothesis: STAT is not normalized into one canonical representation
      or explicitly mapped across priority, boolean flag, and subtype forms.
    root_confidence: high
    surface_finding_ids:
      - finding-013
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: "STAT ordering has three competing authorities: priority: stat,
      is_stat, and StatOrder."
    proposed_action: "Choose one canonical STAT concept or define an explicit
      invariant equating StatOrder, priority: stat, and is_stat: true, with one
      source of authority."
    affected_purpose: Use as the concept authority document for EMR/LIS integration design.
    failure_condition: When EMR and LIS exchange or interpret STAT orders, the
      artifact provides multiple independent representations of the same STAT
      meaning without a precedence rule.
    impact: Different systems can implement different STAT authorities and disagree
      about urgent handling, making the ontology unsafe as the shared semantic
      contract.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/semantics.findings.yaml#semantics-candidate-001
      - materialized-input.md:21
      - materialized-input.md:22
      - materialized-input.md:25-29
    severity: medium
    domain_threshold_used: null
    singleton_reason: Only a shared_cause_candidate relation to finding-018 is
      available; shared-cause relations are preserved as dependency context
      rather than merged.
  - issue_id: issue-012
    root_cause_hypothesis: The relation graph omits several declared entities
      because the ontology mixes attribute references, subtype declarations, and
      explicit relations without defining which edges are authoritative.
    root_confidence: high
    surface_finding_ids:
      - finding-018
    relation_refs: []
    raised_by_lens_ids:
      - structure
    issue_statement: Patient, StatOrder, Assay, and CriticalValue are declared but
      absent from the explicit relations graph, leaving relation-based consumers
      without traversal paths.
    proposed_action: Define type refs and is_a entries as first-class graph edges or
      add explicit relations for Order-Patient, StatOrder-Order, Test-Assay, and
      CriticalValue-to-result/notification paths.
    affected_purpose: Use of the ontology as the EMR/LIS integration concept
      authority for entities, relationships, and states.
    failure_condition: A downstream consumer treats the relations section as the
      authoritative relationship graph and therefore sees no structural path for
      Patient, StatOrder, Assay, or CriticalValue.
    impact: Integration design can omit or inconsistently implement patient
      association, STAT subtype handling, assay execution mapping, or
      critical-value handling because those concepts are not connected in the
      explicit graph.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/structure.findings.yaml#structure-candidate-001
      - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:7
      - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:25
