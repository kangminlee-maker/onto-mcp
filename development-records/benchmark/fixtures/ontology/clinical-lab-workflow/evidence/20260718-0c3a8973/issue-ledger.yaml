      - materialized-input.md:123
      - .onto/review/20260718-0c3a8973/round1/semantics.findings.yaml#semantics-candidate-002
      - materialized-input.md:123
    severity: high
    domain_threshold_used: null
    singleton_reason: null
  - issue_id: issue-002
    root_cause_hypothesis: Critical-value threshold definition is conflated with
      per-occurrence notification workflow instead of modeling notification as a
      separate event tied to a specific result.
    root_confidence: high
    surface_finding_ids:
      - finding-002
      - finding-016
    relation_refs:
      - rel-002
    raised_by_lens_ids:
      - axiology
      - semantics
    issue_statement: CriticalValue carries notification state while decisive
      notification details remain outside the ontology, mixing a threshold/range
      concept with a result-specific communication event.
    proposed_action: Separate CriticalValueThreshold from CriticalValueNotification
      or CriticalResultEvent, linking notification status, recipient, time,
      notifier, result/order/patient, and external phone-log authority to the
      event concept.
    affected_purpose: Support operationally safe EMR/LIS integration using the
      ontology as the shared conceptual authority.
    failure_condition: A critical value exists and downstream systems need to
      coordinate, audit, or display notification state beyond a
      completed/not-completed flag for the specific result occurrence.
    impact: Systems may treat notification as a property of a rule or external log
      rather than an auditable patient/result event, weakening clinical
      follow-up semantics and operational responsibility.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:100-106
      - review-value-alignment-criteria.yaml:6-8
      - .onto/review/20260718-0c3a8973/round1/semantics.findings.yaml#semantics-candidate-004
    severity: medium
    domain_threshold_used: null
    singleton_reason: null
  - issue_id: issue-003
    root_cause_hypothesis: CriticalValue notification audit evidence is reduced to a
      boolean and external phone log rather than a first-class evidence-bearing
      concept inside ontology scope.
    root_confidence: high
    surface_finding_ids:
      - finding-004
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: The ontology lacks an internal concept for critical-value
      notification actors, times, recipients, evidence, and authority source.
    proposed_action: Add a CriticalValueNotification action/evidence entity linked
      to CriticalValue or Result, with notifier, recipient, timestamp, channel,
      acknowledgement/status, and external-record authority where applicable.
    affected_purpose: EMR/LIS 통합의 개념 권위 문서로서 엔티티·관계·상태와 운영 위험을 설명하는 목적
    failure_condition: 중요값 통보가 발생하거나 누락/지연/정정되었을 때, 온톨로지 내부에서 통보 행위의
      행위자·시각·수신자·근거·권위 원본을 식별해야 하는 경우
    impact: 중요값 통보는 환자 안전과 운영 책임에 직접 연결되는 통제 행위인데, 현재 모델은 boolean만 남겨 통합 시스템의 감사 추적과
      책임 소재 판단을 약화시킨다.
    evidence_refs:
      - .onto/review/20260718-0c3a8973/round1/coverage.findings.yaml#coverage-candidate-001
      - materialized-input.md:100-106
      - materialized-input.md:6-8
