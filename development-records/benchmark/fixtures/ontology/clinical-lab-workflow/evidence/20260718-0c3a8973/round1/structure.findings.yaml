  - candidate_id: structure-candidate-002
    target: clinical-lab-ontology.yaml Assay structure
    evidence_anchor: .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:46,54,108,127
    claim: Assay lacks the required structural connection to Test despite being
      maintained alongside Test.
    what: "`Test` is defined as the orderable catalog unit and `Assay` as the
      analyzer execution unit, and the notes say new items are currently
      registered in both places. However, the relation list has no
      `Test`-to-`Assay` or equivalent mapping relation."
    why: "This is a structural gap rather than only a naming issue: the document
      declares two catalog-like entities that must be co-maintained, but
      provides no graph edge that lets an integration determine which executable
      assay realizes a requested test."
    how_to_fix: Add an explicit mapping relation such as `Test -> Assay` with a
      clear kind like `realized_by`, `maps_to`, or `performed_as`, or define a
      join entity if one Test can map to multiple assays by specimen type or
      analyzer.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS integration design from orderable tests to
        LIS/analyzer execution units.
      failure_condition: A workflow needs to route an ordered Test to the
        corresponding Assay, but the ontology provides no explicit relation
        connecting the two.
      impact: Implementers may create local, incompatible mappings outside the concept
        authority, weakening traceability from orders to executed assays and
        produced results.
      evidence_refs:
        - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:46
        - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:54
        - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:108
        - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:127
    causal_path:
      root_cause_candidate: The model introduces `Assay` as a separate execution
        concept but leaves its relationship to `Test` as an unresolved note
        instead of an explicit relation.
      root_cause_step_id: structure-candidate-002.cause-003
      steps:
        - cause_id: structure-candidate-002.cause-001
          claim: "`Test` and `Assay` are separate declared entities with catalog/execution
            roles."
          relation_to_previous: null
