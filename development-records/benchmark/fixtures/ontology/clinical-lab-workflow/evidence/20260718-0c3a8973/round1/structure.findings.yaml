findings:
  - candidate_id: structure-candidate-001
    target: clinical-lab-ontology.yaml relations graph
    evidence_anchor: .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:25,31,54,100,108
    claim: Several declared entities are structurally absent from the explicit
      relations graph.
    what: "`Patient`, `StatOrder`, `Assay`, and `CriticalValue` are declared as
      entities, but none appears as `from` or `to` in the explicit `relations:`
      list. Some are referenced through attributes or `is_a`, but the relation
      graph itself cannot show their required connections."
    why: The ontology is intended as a concept authority for EMR/LIS integration,
      and the relations section is the visible structural graph. If core
      entities are omitted from that graph, consumers relying on relations
      cannot traverse Order-to-Patient, Test-to-Assay execution, or
      CriticalValue-to-result/notification paths, and subtype participation for
      STAT orders is implicit rather than structurally visible.
    how_to_fix: "Either define that `type: ref` and `is_a` entries are first-class
      graph edges, or add explicit relations for these entities, such as `Order
      -> Patient`, `StatOrder -> Order`, `Test -> Assay` or an equivalent
      catalog/execution mapping, and `CriticalValue -> Test/Result` plus its
      notification target if that concept remains in scope."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: Use of the ontology as the EMR/LIS integration concept
        authority for entities, relationships, and states.
      failure_condition: A downstream consumer treats the `relations:` section as the
        authoritative relationship graph and therefore sees no structural path
        for Patient, StatOrder, Assay, or CriticalValue.
      impact: The integration design can omit or inconsistently implement patient
        association, STAT subtype handling, assay execution mapping, or
        critical-value handling because those concepts are not connected in the
        explicit graph.
      evidence_refs:
        - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:7
        - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:25
        - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:31
        - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:54
        - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:100
        - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:108
    causal_path:
      root_cause_candidate: The ontology mixes attribute references, subtype
        declarations, and explicit relations without making all declared entity
        connections available in the explicit `relations:` graph.
      root_cause_step_id: structure-candidate-001.cause-003
      steps:
        - cause_id: structure-candidate-001.cause-001
          claim: The explicit relation list starts at `relations:` and contains no
            relation whose `from` or `to` is Patient, StatOrder, Assay, or
            CriticalValue.
          relation_to_previous: null
          evidence_refs:
