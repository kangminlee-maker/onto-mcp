            - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:109
            - .onto/review/20260718-0c3a8973/execution-preparation/materialized-input.md:119
        - cause_id: structure-candidate-001.cause-002
          claim: Those omitted names are declared entities, so their absence from the
            relation list creates graph-orphan behavior for relation-based
