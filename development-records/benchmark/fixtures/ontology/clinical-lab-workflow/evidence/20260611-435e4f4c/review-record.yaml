      rationale: "The projection preserves high severity because Order.completed can
        remain true after the condition that justified completion is no longer
        true. That undermines state correctness for the intended authority
        document. Source finding context: clinical-lab-ontology.yaml state_rules
        / Order lifecycle Source finding context: clinical-lab-ontology.yaml:12,
        clinical-lab-ontology.yaml:100, clinical-lab-ontology.yaml:101 Source
        finding context: Order completion is defined by all Result values being
        final, while the same model permits later correction of Result.status
        after report finalization. Source finding context: The completion
        predicate depends on a reversible state (`Result.status=final`). Because
        the model also allows a subsequent `corrected` state, a workflow path
        can satisfy `Order.completed` at time T and later invalidate the
        condition that caused completion at time T+1. Within the declared rules,
        the model cannot keep both 'completed because all results are final' and
        'a result is now corrected' logically stable unless completion is
        explicitly snapshot-based or an Order can leave/revise `completed`. This
        matters for an EMR/LIS authority document because downstream systems may
        treat Order completion as closed while Report/Result state continues to
        change. Source finding context: Define whether `Order.completed` is a
        snapshot release milestone or a live invariant. If it is live, add
        reopening/amended-order transitions for corrected results. If it is a
        milestone, rewrite the rule to say completion is based on all reportable
        results being final at release time and is not invalidated by later
        corrections, with separate amendment tracking. Source finding context:
        .onto/review/20260611-435e4f4c/round1/logic.findings.yaml#logic-candida\
        te-001 Source finding context: Use of the ontology as the concept
        authority for EMR/LIS integration state behavior. Source finding
        context: A Result changes from `final` to `corrected` after the Order
        has transitioned to `completed` under the 'all Result final' rule.
        Source finding context: Systems consuming the ontology can derive
        incompatible closure states for the same order: the Order remains
        completed while its defining completion condition is no longer true,
        weakening trust in state synchronization and closure semantics. Source
        finding context: The completion rule uses a mutable Result status as an
        invariant-like condition without specifying whether completion is
        snapshot-based or reversible. Source finding context: `Order` includes
        `completed` in its lifecycle. Source finding context: The ontology
        states that an Order transitions to completed when all Results are
        final. Source finding context: The ontology also states that a
        Result.status can later change to corrected and then requires
        Report.result_status to become amended. Source finding context: Because
        no Order reopening or amendment transition is defined, a later corrected
        result can invalidate the condition used to justify completed while the
        Order lifecycle still remains completed."
