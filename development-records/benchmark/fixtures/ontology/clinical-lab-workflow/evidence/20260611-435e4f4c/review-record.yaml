        - problem-framing.yaml
      rationale: "The projection preserves high severity and broad lens support for a
        safety-relevant lifecycle gap. Because the ontology is intended as
        EMR/LIS status authority, stale trusted report status and missing
        versioned correction evidence must be resolved in the target artifact.
        Source finding context: clinical-lab-ontology.yaml /
        Report.result_status synchronization rule Source finding context:
        materialized-input.md:69-72, 75-84, 121-123;
        review-value-alignment-criteria.yaml:6-11 Source finding context:
        Nightly synchronization of corrected results undermines the ontology's
        stated clinician-trust purpose for Report.result_status. Source finding
        context: The review purpose is to judge whether this file is suitable as
        the EMR/LIS integration concept authority document, especially
        operational risks. Within that purpose, an authoritative status that
        clinicians are expected to trust should not knowingly lag behind the LIS
        result correction state without an explicit safety boundary, warning
        state, or precedence rule. The current model accepts a hidden tradeoff:
        batch simplicity over timely clinical status authority. Source finding
        context: Make the correction propagation contract explicit and
        safety-preserving: either require synchronous/near-real-time
        Report.result_status amendment when Result.status becomes corrected, or
        introduce an explicit pending-correction/stale-report state with
        clinician-facing visibility, precedence rules, and maximum propagation
        latency. Source finding context:
        .onto/review/20260611-435e4f4c/round1/axiology.findings.yaml#axiology-c\
        andidate-001 Source finding context: Use as the conceptual authority
        document for EMR/LIS integration and operational-risk review. Source
        finding context: A Result.status changes to corrected after report
        release, while Report.result_status remains finalized until the nightly
        batch. Source finding context: The authority document tells integrators
        and clinicians that Report.result_status is trusted, yet permits a
        bounded stale state that can misrepresent corrected results during
        clinical use. Source finding context: The ontology assigns
        clinician-trusted authority to Report.result_status while delegating
        correction propagation to a delayed batch without modeling stale/pending
        authority states. Source finding context: Report.result_status is
        described as the authoritative displayed value trusted by clinicians.
        Source finding context: Corrected LIS Result.status changes are
        propagated to Report.result_status only by a once-nightly
        synchronization batch. Source finding context: That delayed propagation
        weakens the review intent of using the ontology as an EMR/LIS
        integration authority for operational risk. Source finding context:
        clinical-lab-ontology.yaml / Result and Report correction lifecycle
        Source finding context:
        .onto/review/20260611-435e4f4c/execution-preparation/materialized-input\
        .md:62-84,121-123 Source finding context: Final-result correction and
        report amendment are represented as statuses but not as versioned
        correction events. Source finding context: Correcting a finalized lab
        result changes a clinically consumed record. A coverage-complete
        lifecycle must support post-final correction without losing the previous
        released fact or the reason and authority for the amendment. The current
        model covers the status label but not the operational evidence needed to
        reconstruct what changed and when. Source finding context: Introduce
        ResultCorrection and ReportAmendment/version concepts, including
        previous value/status, new value/status, reason, corrected_by,
        corrected_at, amended_report_version, released_at/released_by, and links
        back to the affected Result and Report. Source finding context:
        .onto/review/20260611-435e4f4c/round1/coverage.findings.yaml#coverage-c\
        andidate-003 Source finding context: Use the ontology as the
        authoritative model for result/report states in EMR/LIS integration.
        Source finding context: A final result is corrected after release and
        systems need to exchange, audit, or display the amendment history, but
        only current status fields exist. Source finding context: The model
        cannot reconstruct post-final changes or preserve the clinical meaning
        of prior released reports, reducing trust in report-state authority.
        Source finding context: The ontology models correction/amendment as
        terminal-looking status values without separate lifecycle event/version
        concepts. Source finding context: Result status includes `corrected` and
        Report result_status includes `amended`. Source finding context: The
        state rule states that when Result.status changes to corrected,
        Report.result_status should become amended. Source finding context: No
        correction event, amendment version, prior value, reason, actor, or
        correction timestamp is defined."
