      rationale: "The issue affects patient-safety notification, audit, and
        reconciliation for critical values. All stances converge on the need for
        authoritative notification evidence, making it a present blocker for
        using the ontology as operational-risk authority. Source finding
        context: clinical-lab-ontology.yaml / CriticalValue notification
        authority Source finding context: materialized-input.md:100-106;
        review-value-alignment-criteria.yaml:6-11 Source finding context:
        CriticalValue models only a notification boolean while placing
        notification time and recipient outside the ontology, weakening its
        operational authority for immediate-risk handling. Source finding
        context: For an EMR/LIS integration concept authority document,
        immediate critical-value notification is a purpose-critical operational
        workflow. A boolean alone cannot represent who was notified, when,
        through what channel, or how EMR/LIS should reconcile the external phone
        log. The model therefore accepts an unexamined tradeoff that leaves a
        safety-critical commitment outside the conceptual authority surface.
        Source finding context: Promote notification evidence into the ontology:
        add a CriticalValueNotification or NotificationEvent entity with
        notified_at, recipient, notifier, channel, acknowledgement/status, and
        relations to CriticalValue/Result/Order. If the phone log remains
        authoritative, model it as an external authority with reconciliation and
        precedence rules. Source finding context:
