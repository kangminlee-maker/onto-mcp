      impact: "Systems consuming the ontology can derive incompatible closure states
        for the same order, weakening trust in state synchronization and closure
        semantics. Source finding context: Systems consuming the ontology can
        derive incompatible closure states for the same order: the Order remains
        completed while its defining completion condition is no longer true,
        weakening trust in state synchronization and closure semantics."
      evidence_refs:
