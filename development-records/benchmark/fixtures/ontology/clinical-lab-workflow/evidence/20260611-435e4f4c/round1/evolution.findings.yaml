findings:
  - candidate_id: evolution-candidate-001
    target: clinical-lab-ontology.yaml entities.Test / entities.Assay catalog model
    evidence_anchor: clinical-lab-ontology.yaml:41, clinical-lab-ontology.yaml:49,
      clinical-lab-ontology.yaml:121
    claim: 신규 검사 항목 추가 시 Test와 Assay를 이중 등록해야 해 카탈로그 확장 내성이 낮다.
    what: 주문 가능한 카탈로그 단위인 Test와 분석기 수행 단위인 Assay가 별도 엔티티로 존재하지만 둘 사이의 관계나 매핑 권위가
      정의되어 있지 않고, note는 현재 신규 항목을 두 곳 모두에 등록한다고 명시한다.
    why: EMR/LIS 통합의 개념 권위 문서라면 주문 카탈로그와 수행 카탈로그 사이의 확장 경로가 안정적이어야 한다. 현재 구조에서는 새
      검사, 패널 분해, 장비별 assay 변경이 생길 때 두 카탈로그를 동시에 수정해야 하며 어느 쪽이 권위인지 판단할 수 없어 기존
      주문/결과 연결의 연속성이 깨질 수 있다.
    how_to_fix: "Test와 Assay를 즉시 통합하지 않더라도 canonical catalog item 또는 explicit
      mapping relation을 추가하고, 신규 항목 등록의 단일 권위와 버전/유효기간을 정의한다. 예: Test has_many
      AssayMapping, Assay performs Test 또는 CatalogItem을 부모 개념으로 두고 주문/수행
      projection을 분리한다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 검사 주문 카탈로그와 LIS 수행 단위의 안정적 연결을 제공하는 목적.
      failure_condition: 새 검사 항목, 장비별 assay, 패널 구성 변경을 추가할 때 Test와 Assay를 각각 수정해야 하지만
        두 개념 사이의 권위 매핑이 없다.
      impact: 통합 구현자가 주문 코드와 수행 코드를 독립 카탈로그로 해석하거나 중복 등록 누락을 만들 수 있어, 확장 시 기존 주문/결과
        데이터의 추적성과 호환성이 약해진다.
      evidence_refs:
        - clinical-lab-ontology.yaml:41
        - clinical-lab-ontology.yaml:49
        - clinical-lab-ontology.yaml:121
    causal_path:
      root_cause_candidate: 주문 카탈로그(Test)와 수행 카탈로그(Assay)의 분리 여부는 명시했지만 두 개념 사이의
        canonical mapping/authority concept를 모델에 두지 않았다.
      root_cause_step_id: evolution-candidate-001.cause-004
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: Test는 주문 가능한 카탈로그 단위로 정의되어 있다.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:41
        - cause_id: evolution-candidate-001.cause-002
          claim: Assay는 분석기에서 수행되는 검사 카탈로그의 수행 단위로 별도 정의되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:49
        - cause_id: evolution-candidate-001.cause-003
          claim: 현재 신규 항목은 두 곳 모두에 등록한다고 note가 명시한다.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:121
        - cause_id: evolution-candidate-001.cause-004
          claim: relations에는 Test와 Assay 사이의 연결이 없어 이중 등록된 항목의 연속성을 모델 내부에서 검증하거나 확장할 수
            없다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:103
            - clinical-lab-ontology.yaml:106
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-002
    target: clinical-lab-ontology.yaml specimen type modeling
    evidence_anchor: clinical-lab-ontology.yaml:37, clinical-lab-ontology.yaml:47,
      clinical-lab-ontology.yaml:55
    claim: 검체 종류가 폐쇄 enum과 자유 문자열로 갈라져 새 검체/용기 유형 수용 시 기존 구조 수정과 매핑 충돌이 발생한다.
    what: Specimen.specimen_type과 Test.requires_specimen_type은 [blood, urine,
      tissue, swab] enum을 사용하지만 Assay.specimen_kind는 'WB', 'Serum',
      'Urine-random' 같은 문자열을 사용한다. 같은 검체 개념이 서로 다른 확장 방식으로 표현된다.
    why: 새 검체 유형이나 LIS 장비의 세부 specimen kind가 추가되면 enum에는 스키마 수정이 필요하고 Assay에는 임의
      문자열이 누적된다. EMR 주문 요건, 실제 채취 검체, 분석기 수행 검체가 같은 개념 체계로 진화하지 못해 통합 시 호환성 경계가
      불명확해진다.
    how_to_fix: SpecimenKind 또는 SpecimenTypeCode 같은 독립 코드셋 엔티티를 두고 broad category,
      LIS code, display label, aliases, active period를 속성으로 관리한다. Test와
      Specimen과 Assay는 모두 이 코드셋을 참조하게 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 주문 가능 검체, 채취 검체, 분석기 검체 표현을 변경에 견디게 연결하는 목적.
      failure_condition: 새 검체 유형이나 장비별 세분 코드가 추가될 때 enum 수정과 자유 문자열 매핑이 동시에 필요하다.
      impact: 기존 데이터의 검체 의미를 안정적으로 변환하기 어렵고, 새 코드 도입 시 통합 규칙이 문서 밖의 임의 매핑에 의존하게 된다.
      evidence_refs:
        - clinical-lab-ontology.yaml:37
        - clinical-lab-ontology.yaml:47
        - clinical-lab-ontology.yaml:55
    causal_path:
      root_cause_candidate: 검체 종류를 공유 코드셋/개념으로 분리하지 않고, 각 엔티티 속성에 서로 다른 표현 방식으로 내장했다.
      root_cause_step_id: evolution-candidate-002.cause-004
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: Specimen.specimen_type은 네 값으로 닫힌 enum이다.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:37
        - cause_id: evolution-candidate-002.cause-002
          claim: Test.requires_specimen_type도 같은 네 값의 enum에 묶여 있다.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:47
        - cause_id: evolution-candidate-002.cause-003
          claim: Assay.specimen_kind는 예시상 더 세분화된 자유 문자열이다.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:55
        - cause_id: evolution-candidate-002.cause-004
          claim: 따라서 검체 개념 확장은 일부 위치에서는 스키마 변경, 다른 위치에서는 문자열 규약 추가로 흩어진다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:37
            - clinical-lab-ontology.yaml:47
            - clinical-lab-ontology.yaml:55
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-003
    target: clinical-lab-ontology.yaml Result.status and Report.result_status
      evolution path
    evidence_anchor: clinical-lab-ontology.yaml:64, clinical-lab-ontology.yaml:75,
      clinical-lab-ontology.yaml:117
    claim: 결과 상태와 보고 상태가 별도 enum으로 중복되어 상태 변경 또는 외부 표준 변경 시 연속성이 깨지기 쉽다.
    what: Result.status는 preliminary/final/corrected를 사용하고 Report.result_status는
      prelim/finalized/amended를 사용한다. 주석은 동일 정보가 유지된다고 하면서도 보고서 상태를 임상의가 신뢰하는 권위
      값으로 둔다.
    why: 상태 값이 추가되거나 외부 LIS/EMR 표준의 결과 상태가 바뀌면 두 enum과 동기화 규칙을 동시에 수정해야 한다. 같은 상태
      개념을 서로 다른 이름으로 중복 보존하므로 변경 시 매핑 누락이나 지연 동기화가 기존 보고 신뢰를 손상시킬 수 있다.
    how_to_fix: ResultStatus를 canonical 상태 코드셋으로 분리하고 Report에는 canonical status 참조
      또는 derived projection을 명시한다. Report 표시명이 필요하면 display mapping으로 두되, 권위와
      동기화 지연 정책을 상태 모델 안에 포함한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 결과/보고 상태가 EMR/LIS 간에 일관되게 진화하고 임상의에게 신뢰 가능한 상태를 제공하는 목적.
      failure_condition: 새 결과 상태 또는 외부 상태 코드가 도입될 때 Result.status와
        Report.result_status 및 동기화 규칙을 함께 변경해야 한다.
      impact: 상태 의미의 연속성이 코드명 매핑과 배치 동기화에 의존하게 되어, 확장 시 보고서 권위 값과 LIS 기록 값이 분기할 수 있다.
      evidence_refs:
        - clinical-lab-ontology.yaml:64
        - clinical-lab-ontology.yaml:75
        - clinical-lab-ontology.yaml:117
    causal_path:
      root_cause_candidate: 결과 상태를 단일 권위 개념으로 분리하지 않고 Result와 Report에 다른 enum으로 중복 저장한다.
      root_cause_step_id: evolution-candidate-003.cause-004
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: Result.status는 preliminary/final/corrected enum으로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:64
            - clinical-lab-ontology.yaml:66
        - cause_id: evolution-candidate-003.cause-002
          claim: Report.result_status는 prelim/finalized/amended enum으로 별도 정의된다.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:75
            - clinical-lab-ontology.yaml:77
        - cause_id: evolution-candidate-003.cause-003
          claim: 주석은 Report.result_status를 임상의가 신뢰하는 권위 값이라고 둔다.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:78
        - cause_id: evolution-candidate-003.cause-004
          claim: 상태 규칙은 corrected 변경 시 amended로 동기화해야 하며 야간 1회 배치라고 명시해, 두 상태 값이 독립적으로 움직일
            수 있음을 보여준다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:117
      unresolved_beyond_evidence: null
domain_constraints_used: []
