    자체만 근거로 판단했다.
  - EMR/LIS 통합의 개념 권위 문서는 주문 카탈로그, 수행 카탈로그, 검체 코드, 결과/보고 상태의 변경과 버전 확장을 안정적으로
    수용해야 한다고 보았다.
