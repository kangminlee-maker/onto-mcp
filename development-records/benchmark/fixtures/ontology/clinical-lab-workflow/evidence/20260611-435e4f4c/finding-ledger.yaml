schema_version: 1
session_id: 20260611-435e4f4c
findings:
  - finding_id: finding-001
    lens_id: axiology
    source_ref: .onto/review/20260611-435e4f4c/round1/axiology.findings.yaml#axiology-candidate-001
    target: clinical-lab-ontology.yaml / Report.result_status synchronization rule
    evidence_anchor: materialized-input.md:69-72, 75-84, 121-123;
      review-value-alignment-criteria.yaml:6-11
    claim: Nightly synchronization of corrected results undermines the ontology's
      stated clinician-trust purpose for Report.result_status.
    lens_rationale_summary: "The review purpose is to judge whether this file is
      suitable as the EMR/LIS integration concept authority document, especially
      operational risks. Within that purpose, an authoritative status that
      clinicians are expected to trust should not knowingly lag behind the LIS
      result correction state without an explicit safety boundary, warning
      state, or precedence rule. The current model accepts a hidden tradeoff:
      batch simplicity over timely clinical status authority."
    proposed_action: "Make the correction propagation contract explicit and
      safety-preserving: either require synchronous/near-real-time
      Report.result_status amendment when Result.status becomes corrected, or
      introduce an explicit pending-correction/stale-report state with
      clinician-facing visibility, precedence rules, and maximum propagation
      latency."
    affected_purpose: Use as the conceptual authority document for EMR/LIS
      integration and operational-risk review.
    failure_condition: A Result.status changes to corrected after report release,
      while Report.result_status remains finalized until the nightly batch.
    impact: The authority document tells integrators and clinicians that
      Report.result_status is trusted, yet permits a bounded stale state that
      can misrepresent corrected results during clinical use.
    evidence_refs:
      - .onto/review/20260611-435e4f4c/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:69-72
      - materialized-input.md:80-83
      - materialized-input.md:121-123
      - review-value-alignment-criteria.yaml:6-11
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use as the conceptual authority document for EMR/LIS
        integration and operational-risk review.
      failure_condition: A Result.status changes to corrected after report release,
        while Report.result_status remains finalized until the nightly batch.
      impact: The authority document tells integrators and clinicians that
        Report.result_status is trusted, yet permits a bounded stale state that
        can misrepresent corrected results during clinical use.
      evidence_refs:
        - materialized-input.md:69-72
        - materialized-input.md:80-83
        - materialized-input.md:121-123
        - review-value-alignment-criteria.yaml:6-11
    causal_path:
      root_cause_candidate: The ontology assigns clinician-trusted authority to
        Report.result_status while delegating correction propagation to a
        delayed batch without modeling stale/pending authority states.
      root_cause_step_id: finding-001.cause-003
      steps:
        - cause_id: finding-001.cause-001
          claim: Report.result_status is described as the authoritative displayed value
            trusted by clinicians.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:80-83
        - cause_id: finding-001.cause-002
          claim: Corrected LIS Result.status changes are propagated to
            Report.result_status only by a once-nightly synchronization batch.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:121-123
        - cause_id: finding-001.cause-003
          claim: That delayed propagation weakens the review intent of using the ontology
            as an EMR/LIS integration authority for operational risk.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:6-11
      unresolved_beyond_evidence: The packet provides no clinical SLA or domain rule
        defining acceptable correction latency, so the finding is limited to the
        contradiction between declared trust and modeled delayed propagation.
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260611-435e4f4c/round1/axiology.findings.yaml#axiology-candidate-002
    target: clinical-lab-ontology.yaml / CriticalValue notification authority
    evidence_anchor: materialized-input.md:100-106; review-value-alignment-criteria.yaml:6-11
    claim: CriticalValue models only a notification boolean while placing
      notification time and recipient outside the ontology, weakening its
      operational authority for immediate-risk handling.
    lens_rationale_summary: For an EMR/LIS integration concept authority document,
      immediate critical-value notification is a purpose-critical operational
      workflow. A boolean alone cannot represent who was notified, when, through
      what channel, or how EMR/LIS should reconcile the external phone log. The
      model therefore accepts an unexamined tradeoff that leaves a
      safety-critical commitment outside the conceptual authority surface.
    proposed_action: "Promote notification evidence into the ontology: add a
      CriticalValueNotification or NotificationEvent entity with notified_at,
      recipient, notifier, channel, acknowledgement/status, and relations to
      CriticalValue/Result/Order. If the phone log remains authoritative, model
      it as an external authority with reconciliation and precedence rules."
    affected_purpose: Conceptual authority for EMR/LIS integration with emphasis on
      operational risks.
    failure_condition: A critical value is marked notified=true while the
      integration model has no authoritative notification time, recipient,
      acknowledgement, or reconciliation path to the external phone log.
    impact: Integrators cannot derive a reliable operational contract for immediate
      notification, audit, or cross-system consistency from the authority
      document.
    evidence_refs:
      - .onto/review/20260611-435e4f4c/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:100-106
      - review-value-alignment-criteria.yaml:6-11
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Conceptual authority for EMR/LIS integration with emphasis on
        operational risks.
      failure_condition: A critical value is marked notified=true while the
        integration model has no authoritative notification time, recipient,
        acknowledgement, or reconciliation path to the external phone log.
      impact: Integrators cannot derive a reliable operational contract for immediate
        notification, audit, or cross-system consistency from the authority
        document.
      evidence_refs:
        - materialized-input.md:100-106
        - review-value-alignment-criteria.yaml:6-11
    causal_path:
      root_cause_candidate: The ontology treats critical-value notification evidence
        as external to the model while retaining only a lossy boolean inside the
        authority document.
      root_cause_step_id: finding-002.cause-003
      steps:
        - cause_id: finding-002.cause-001
          claim: CriticalValue is explicitly an immediate-notification risk concept.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-101
        - cause_id: finding-002.cause-002
          claim: The ontology records only notified:boolean and states the actual
            notification time and recipient are in a separate telephone log.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:102-106
        - cause_id: finding-002.cause-003
          claim: This prevents the file from fully serving as EMR/LIS integration concept
            authority for that operational-risk workflow.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:6-11
      unresolved_beyond_evidence: The external phone log's schema and governance are
        outside the allowed packet, so this finding does not judge that system;
        it only flags the missing authority boundary in the ontology.
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260611-435e4f4c/round1/axiology.findings.yaml#axiology-candidate-003
    target: clinical-lab-ontology.yaml / TAT ownership note
    evidence_anchor: materialized-input.md:126-128; review-value-alignment-criteria.yaml:6-11
    claim: Delegating turnaround-time calculation to a dashboard-owned formula
      creates purpose drift away from a shared EMR/LIS concept authority.
    lens_rationale_summary: "A concept authority document for EMR/LIS integration
      should make shared operational metrics traceable to canonical source
      concepts. Allowing a downstream dashboard team to maintain its own
      calculation formula without an explicit derivation contract creates a
      hidden tradeoff: local reporting flexibility over cross-system metric
      consistency."
    proposed_action: Define TAT as a derived concept in the ontology with source
      fields, inclusions/exclusions, null/late-release handling, and allowed
      projections. If dashboards may override it, model those overrides as
      non-authoritative views with clear naming and precedence.
    affected_purpose: Shared conceptual authority for EMR/LIS integration and
      operational-risk review.
    failure_condition: Different consumers compute TAT from local formulas while the
      ontology remains the supposed authority for the workflow concepts.
    impact: Operational reporting can diverge from the canonical workflow model,
      reducing trust in the ontology as the integration source of truth.
    evidence_refs:
      - .onto/review/20260611-435e4f4c/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:126-128
      - review-value-alignment-criteria.yaml:6-11
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Shared conceptual authority for EMR/LIS integration and
        operational-risk review.
      failure_condition: Different consumers compute TAT from local formulas while the
        ontology remains the supposed authority for the workflow concepts.
      impact: Operational reporting can diverge from the canonical workflow model,
        reducing trust in the ontology as the integration source of truth.
      evidence_refs:
        - materialized-input.md:126-128
        - review-value-alignment-criteria.yaml:6-11
    causal_path:
      root_cause_candidate: The ontology declares a metric boundary but leaves the
        executable calculation authority with a downstream dashboard team.
      root_cause_step_id: finding-003.cause-003
      steps:
        - cause_id: finding-003.cause-001
          claim: The notes define TAT from collected_at to released_at.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:126-128
        - cause_id: finding-003.cause-002
          claim: The same note says the dashboard team maintains its own calculation
            formula.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:126-128
        - cause_id: finding-003.cause-003
          claim: That split weakens the document's role as the EMR/LIS integration concept
            authority for operational metrics.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:6-11
      unresolved_beyond_evidence: No dashboard formula is available within the
        boundary, so the finding is about missing authority and precedence, not
        about a proven numeric mismatch.
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260611-435e4f4c/round1/coverage.findings.yaml#coverage-candidate-001
    target: clinical-lab-ontology.yaml / Specimen lifecycle
    evidence_anchor: .onto/review/20260611-435e4f4c/execution-preparation/materialized-input.md:37-44,121-124
    claim: Specimen lifecycle omits post-analysis retention and disposal states.
    lens_rationale_summary: For a document intended as the EMR/LIS integration
      concept authority, specimen state must remain interpretable after analysis
      when reports are amended, audits occur, or recollection/discard decisions
      are needed. The target itself acknowledges post-analysis handling exists
      but leaves it outside the ontology, so the lifecycle is incomplete from
      coverage perspective.
    proposed_action: Extend Specimen with explicit post-analysis states such as
      `stored`, `retained`, `disposed`, `transferred`, or `rejected/discarded`
      as appropriate, and add attributes/events for disposition time,
      responsible actor, retention policy, and reason.
    affected_purpose: Use the ontology as the EMR/LIS integration concept authority
      for clinical lab workflow entities, relations, and states.
    failure_condition: After a specimen reaches `analyzed`, downstream systems need
      to exchange or reason about storage, retention, disposal, or later
      audit/rework, but the ontology has no concept for those states.
    impact: The authority document cannot close the specimen lifecycle it explicitly
      references, weakening integration scope control and leaving operationally
      important states to undocumented departmental interpretations.
    evidence_refs:
      - .onto/review/20260611-435e4f4c/round1/coverage.findings.yaml#coverage-candidate-001
      - materialized-input.md:37-44
      - materialized-input.md:121-124
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology as the EMR/LIS integration concept authority
        for clinical lab workflow entities, relations, and states.
      failure_condition: After a specimen reaches `analyzed`, downstream systems need
        to exchange or reason about storage, retention, disposal, or later
        audit/rework, but the ontology has no concept for those states.
      impact: The authority document cannot close the specimen lifecycle it explicitly
        references, weakening integration scope control and leaving
        operationally important states to undocumented departmental
        interpretations.
      evidence_refs:
        - materialized-input.md:37-44
        - materialized-input.md:121-124
    causal_path:
      root_cause_candidate: The ontology stops Specimen lifecycle at `analyzed` and
        delegates post-analysis handling to external departmental policy instead
        of modeling it.
      root_cause_step_id: finding-004.cause-003
      steps:
        - cause_id: finding-004.cause-001
          claim: Specimen lifecycle is declared as `[collected, received, in_analysis,
            analyzed]`.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37-44
        - cause_id: finding-004.cause-002
          claim: The state rules state that handling after `analyzed` follows each
            department's internal policy.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:121-124
        - cause_id: finding-004.cause-003
          claim: Because no post-analysis states or disposition evidence concepts are
            present, retention/disposal cannot be represented in the authority
            ontology.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:37-44
            - materialized-input.md:121-124
      unresolved_beyond_evidence: null
  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260611-435e4f4c/round1/coverage.findings.yaml#coverage-candidate-002
    target: clinical-lab-ontology.yaml / CriticalValue notification model
    evidence_anchor: .onto/review/20260611-435e4f4c/execution-preparation/materialized-input.md:100-106
    claim: Critical value notification lacks an in-ontology evidence concept for
      actor, time, recipient, and basis.
    lens_rationale_summary: Critical value notification is a controlled safety
      action, not just a flag. Coverage guidance asks whether actions needing
      control have actor/time/basis evidence concepts. By keeping evidence
      outside the ontology, EMR/LIS integrations can disagree on whether
      notification was performed, who received it, and what proof supports it.
    proposed_action: Add a critical-value notification event/entity linked to
      CriticalValue/Result/Order/Staff, with notified_at, notified_by,
      recipient, recipient_role/contact, method, acknowledgement status/time,
      escalation path, and evidence/source reference.
    affected_purpose: Use the ontology as a concept authority for EMR/LIS
      integration and operational risk around lab reporting.
    failure_condition: A critical result is generated and notification status must
      be exchanged, audited, reconciled, or escalated across systems, but the
      ontology exposes only a boolean and externalizes the evidence.
    impact: Patient-safety-critical communication becomes under-specified; systems
      may treat a flag as sufficient without shared evidence for recipient,
      timing, responsibility, or acknowledgement.
    evidence_refs:
      - .onto/review/20260611-435e4f4c/round1/coverage.findings.yaml#coverage-candidate-002
      - materialized-input.md:100-106
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology as a concept authority for EMR/LIS
        integration and operational risk around lab reporting.
      failure_condition: A critical result is generated and notification status must
        be exchanged, audited, reconciled, or escalated across systems, but the
        ontology exposes only a boolean and externalizes the evidence.
      impact: Patient-safety-critical communication becomes under-specified; systems
        may treat a flag as sufficient without shared evidence for recipient,
        timing, responsibility, or acknowledgement.
      evidence_refs:
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: The CriticalValue model represents notification as a
        boolean and places notification evidence in an external phone log not
        modeled by the ontology.
      root_cause_step_id: finding-005.cause-003
      steps:
        - cause_id: finding-005.cause-001
          claim: CriticalValue defines `notified` as a boolean.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: finding-005.cause-002
          claim: The note says notification time and recipient are in a phone record
            ledger, not in the ontology.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: finding-005.cause-003
          claim: No in-ontology notification event or acknowledgement evidence concept
            exists for actor, time, recipient, method, or basis.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:100-106
      unresolved_beyond_evidence: null
  - finding_id: finding-006
    lens_id: coverage
    source_ref: .onto/review/20260611-435e4f4c/round1/coverage.findings.yaml#coverage-candidate-003
    target: clinical-lab-ontology.yaml / Result and Report correction lifecycle
    evidence_anchor: .onto/review/20260611-435e4f4c/execution-preparation/materialized-input.md:62-84,121-123
    claim: Final-result correction and report amendment are represented as statuses
      but not as versioned correction events.
    lens_rationale_summary: Correcting a finalized lab result changes a clinically
      consumed record. A coverage-complete lifecycle must support post-final
      correction without losing the previous released fact or the reason and
      authority for the amendment. The current model covers the status label but
      not the operational evidence needed to reconstruct what changed and when.
    proposed_action: Introduce ResultCorrection and ReportAmendment/version
      concepts, including previous value/status, new value/status, reason,
      corrected_by, corrected_at, amended_report_version,
      released_at/released_by, and links back to the affected Result and Report.
    affected_purpose: Use the ontology as the authoritative model for result/report
      states in EMR/LIS integration.
    failure_condition: A final result is corrected after release and systems need to
      exchange, audit, or display the amendment history, but only current status
      fields exist.
    impact: The model cannot reconstruct post-final changes or preserve the clinical
      meaning of prior released reports, reducing trust in report-state
      authority.
    evidence_refs:
      - .onto/review/20260611-435e4f4c/round1/coverage.findings.yaml#coverage-candidate-003
      - materialized-input.md:62-84
      - materialized-input.md:121-123
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology as the authoritative model for result/report
        states in EMR/LIS integration.
      failure_condition: A final result is corrected after release and systems need to
        exchange, audit, or display the amendment history, but only current
        status fields exist.
      impact: The model cannot reconstruct post-final changes or preserve the clinical
        meaning of prior released reports, reducing trust in report-state
        authority.
      evidence_refs:
        - materialized-input.md:62-84
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: The ontology models correction/amendment as
        terminal-looking status values without separate lifecycle event/version
        concepts.
      root_cause_step_id: finding-006.cause-003
      steps:
        - cause_id: finding-006.cause-001
          claim: Result status includes `corrected` and Report result_status includes
            `amended`.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:62-84
        - cause_id: finding-006.cause-002
          claim: The state rule states that when Result.status changes to corrected,
            Report.result_status should become amended.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:121-123
        - cause_id: finding-006.cause-003
          claim: No correction event, amendment version, prior value, reason, actor, or
            correction timestamp is defined.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:62-84
            - materialized-input.md:121-123
      unresolved_beyond_evidence: null
  - finding_id: finding-007
    lens_id: coverage
    source_ref: .onto/review/20260611-435e4f4c/round1/coverage.findings.yaml#coverage-candidate-004
    target: clinical-lab-ontology.yaml / Test, Assay, and turnaround-time authority
    evidence_anchor: .onto/review/20260611-435e4f4c/execution-preparation/materialized-input.md:46-60,126-128
    claim: Parallel catalog and metric definitions lack single authority and
      effective-history concepts.
    lens_rationale_summary: Coverage guidance calls out missing single authority for
      values managed across multiple systems or ledgers, and missing history for
      time-dependent values. Catalog mappings and operational metrics are
      exactly the kind of integration concepts that drift when there is no
      authority or validity period. As an EMR/LIS concept authority, the
      ontology should make those boundaries explicit rather than leave them as
      later cleanup.
    proposed_action: "Define catalog authority and mapping concepts:
      TestCatalogEntry, AssayCatalogEntry, TestAssayMapping,
      source_system/owner, effective_from/effective_to, version/status, and
      deprecation rules. Define TATMetricDefinition with formula authority,
      version, validity period, and consuming systems."
    affected_purpose: Use the ontology to control EMR/LIS integration scope,
      precedence, and authoritative concepts.
    failure_condition: A new test/assay or TAT calculation changes and multiple
      systems must reconcile catalog entries or metric results, but the ontology
      lacks authority, mapping, and validity concepts.
    impact: Parallel registration and dashboard-owned formulas can produce
      conflicting operational truth without a modeled source of authority or
      history for reconstruction.
    evidence_refs:
      - .onto/review/20260611-435e4f4c/round1/coverage.findings.yaml#coverage-candidate-004
      - materialized-input.md:46-60
      - materialized-input.md:126-128
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology to control EMR/LIS integration scope,
        precedence, and authoritative concepts.
      failure_condition: A new test/assay or TAT calculation changes and multiple
        systems must reconcile catalog entries or metric results, but the
        ontology lacks authority, mapping, and validity concepts.
      impact: Parallel registration and dashboard-owned formulas can produce
        conflicting operational truth without a modeled source of authority or
        history for reconstruction.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:126-128
    causal_path:
      root_cause_candidate: The ontology acknowledges parallel catalog registration
        and externally maintained TAT calculation but does not model authority,
        mapping, or effective history.
      root_cause_step_id: finding-007.cause-004
      steps:
        - cause_id: finding-007.cause-001
          claim: Test and Assay are separate catalog/performance concepts with overlapping
            department and specimen-kind attributes.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:46-60
        - cause_id: finding-007.cause-002
          claim: The notes say new items are currently registered in both Test and Assay
            while consolidation is deferred.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:126-127
        - cause_id: finding-007.cause-003
          claim: The notes say TAT has a formula but the dashboard team maintains its own
            calculation.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:128
        - cause_id: finding-007.cause-004
          claim: No source-of-authority, version, effective period, ownership, or mapping
            concept is defined for these parallel values.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:126-128
      unresolved_beyond_evidence: null
  - finding_id: finding-008
    lens_id: evolution
    source_ref: .onto/review/20260611-435e4f4c/round1/evolution.findings.yaml#evolution-candidate-001
    target: clinical-lab-ontology.yaml entities.Test / entities.Assay catalog model
    evidence_anchor: clinical-lab-ontology.yaml:41, clinical-lab-ontology.yaml:49,
      clinical-lab-ontology.yaml:121
    claim: 신규 검사 항목 추가 시 Test와 Assay를 이중 등록해야 해 카탈로그 확장 내성이 낮다.
    lens_rationale_summary: EMR/LIS 통합의 개념 권위 문서라면 주문 카탈로그와 수행 카탈로그 사이의 확장 경로가
      안정적이어야 한다. 현재 구조에서는 새 검사, 패널 분해, 장비별 assay 변경이 생길 때 두 카탈로그를 동시에 수정해야 하며 어느
      쪽이 권위인지 판단할 수 없어 기존 주문/결과 연결의 연속성이 깨질 수 있다.
    proposed_action: "Test와 Assay를 즉시 통합하지 않더라도 canonical catalog item 또는 explicit
      mapping relation을 추가하고, 신규 항목 등록의 단일 권위와 버전/유효기간을 정의한다. 예: Test has_many
      AssayMapping, Assay performs Test 또는 CatalogItem을 부모 개념으로 두고 주문/수행
      projection을 분리한다."
    affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 검사 주문 카탈로그와 LIS 수행 단위의 안정적 연결을 제공하는 목적.
    failure_condition: 새 검사 항목, 장비별 assay, 패널 구성 변경을 추가할 때 Test와 Assay를 각각 수정해야 하지만
      두 개념 사이의 권위 매핑이 없다.
    impact: 통합 구현자가 주문 코드와 수행 코드를 독립 카탈로그로 해석하거나 중복 등록 누락을 만들 수 있어, 확장 시 기존 주문/결과
