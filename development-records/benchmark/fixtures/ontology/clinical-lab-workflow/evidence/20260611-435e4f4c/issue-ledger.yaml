    issue_statement: Turnaround-time calculation authority is split from the
      ontology, creating metric drift risk for EMR/LIS operational reporting.
    proposed_action: Define TAT as a derived ontology concept with source fields,
      inclusion/exclusion rules, null/late-release handling, formula authority,
