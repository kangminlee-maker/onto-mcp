issues:
  - issue_id: issue-001
    root_cause_hypothesis: The ontology treats corrected results and amended reports
      as mutable status labels with delayed propagation, without a
      safety-preserving amendment lifecycle, stale-state boundary, or versioned
      correction evidence.
    root_confidence: medium
    surface_finding_ids:
      - finding-001
      - finding-006
    relation_refs:
      - rel-008
    raised_by_lens_ids:
      - axiology
      - coverage
    issue_statement: "Post-release correction handling is under-modeled:
      Report.result_status can remain clinician-trusted while stale, and the
      model cannot reconstruct correction/amendment history."
    proposed_action: Define an explicit correction/amendment lifecycle that covers
      propagation timing, stale or pending states, versioned amendment evidence,
      prior values, reason, actor, and report visibility.
    affected_purpose: Use the ontology as the EMR/LIS integration concept authority
      for result/report states, clinician-facing status trust, and
      operational-risk review.
    failure_condition: A final result is corrected after report release and systems
      need to display, exchange, audit, or trust the report status before or
      during amendment propagation.
    impact: Clinician-facing report status can appear authoritative while lagging
      the LIS correction state, and downstream systems cannot reconstruct the
      amendment event or preserve the meaning of previously released reports.
    evidence_refs:
      - .onto/review/20260611-435e4f4c/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:69-72
