  - issue_id: issue-009
    root_cause_hypothesis: Order completion is defined over mutable Result.status
      values without specifying whether completion is a snapshot milestone, a
      live invariant, or a reversible/amendable lifecycle state.
    root_confidence: medium
    surface_finding_ids:
      - finding-011
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: Order.completed can remain true after the Result.status
      condition that caused completion is no longer true.
    proposed_action: Define Order completion as either a release-time snapshot
      milestone or a live invariant, and add reopening/amended-order or
      amendment tracking semantics accordingly.
    affected_purpose: Use of the ontology as the concept authority for EMR/LIS
      integration state behavior.
    failure_condition: A Result changes from final to corrected after the Order has
      transitioned to completed under the all-Result-final rule.
    impact: Systems consuming the ontology can derive incompatible closure states
