    issue_statement: CriticalValue notification authority is too thin for
      immediate-risk handling because notification time, recipient,
      acknowledgement, and reconciliation are outside the ontology.
    proposed_action: Promote critical-value notification evidence into the ontology
      or explicitly model the external phone log as an authority with
      reconciliation and precedence rules.
