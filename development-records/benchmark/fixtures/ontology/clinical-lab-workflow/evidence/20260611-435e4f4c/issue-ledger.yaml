  - issue_id: issue-007
    root_cause_hypothesis: Test and Assay are maintained as separate
      order/performance catalog concepts, but the ontology lacks an explicit
      mapping, authority, and execution relation connecting Assay into the
      order-to-result path.
    root_confidence: high
    surface_finding_ids:
      - finding-008
      - finding-013
      - finding-017
    relation_refs:
      - rel-010
      - rel-011
    raised_by_lens_ids:
      - evolution
      - semantics
      - structure
    issue_statement: The Test-Assay catalog split is not closed by a canonical
      mapping or execution relation, so orderable tests, performed assays, and
      results cannot be reliably connected.
    proposed_action: Add a canonical Test-Assay mapping or parent catalog concept
      with authority, version/effective-period semantics, and explicit
      execution-path relations from orderable Test through performed Assay to
      Result.
    affected_purpose: Provide a concept authority for EMR/LIS integration from test
      ordering through assay execution and result reporting.
    failure_condition: New tests, analyzer-specific assays, panel changes, or result
      mappings require deciding whether Test and Assay are the same item,
      separate units, or linked codes.
    impact: Implementers can diverge on order-code to assay-code mapping, omit
      double registration, or lose traceability between ordered tests, actual
      performed assays, and produced results.
