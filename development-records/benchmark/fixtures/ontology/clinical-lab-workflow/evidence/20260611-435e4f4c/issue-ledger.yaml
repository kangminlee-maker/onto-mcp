  - issue_id: issue-004
    root_cause_hypothesis: The ontology stops the Specimen lifecycle at analyzed and
      delegates post-analysis handling to departmental policy instead of
      modeling disposition states.
    root_confidence: medium
    surface_finding_ids:
      - finding-004
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: Specimen lifecycle omits post-analysis retention, storage,
      transfer, and disposal states despite referencing external post-analysis
      handling.
    proposed_action: Extend Specimen with explicit post-analysis disposition states
      and evidence such as disposition time, responsible actor, retention
      policy, and reason.
    affected_purpose: Use the ontology as the EMR/LIS integration concept authority
      for clinical lab workflow entities, relations, and states.
    failure_condition: After a specimen reaches analyzed, downstream systems need to
      exchange or reason about storage, retention, disposal, or later
      audit/rework, but the ontology has no concept for those states.
    impact: The authority document cannot close the specimen lifecycle it explicitly
      references, weakening integration scope control and leaving operationally
      important states to undocumented departmental interpretations.
    evidence_refs:
