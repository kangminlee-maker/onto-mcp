      root_cause_candidate: 동일 의미의 상태를 Result와 Report에 중복 권위로 저장하고 정합성을 야간 배치에 맡긴 설계
      root_cause_step_id: finding-001.cause-002
      steps:
        - cause_id: finding-001.cause-001
          claim: 정정된 Result와 finalized Report가 야간 배치 전까지 공존할 수 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:121-123
        - cause_id: finding-001.cause-002
          claim: 이 불일치는 Result.status와 Report.result_status가 같은 정보를 별도 값으로 유지하면서 Report 값을
            권위로 선언한 구조의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-83
      unresolved_beyond_evidence: 실제 최대 불일치 시간과 동기화 실패율은 경계 내 증거로 확인할 수 없지만, 불일치 가능성 자체는 명시된 규칙으로 확정된다.
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260716-db88504e/round1/axiology.findings.yaml#axiology-candidate-002
    target: clinical-lab-ontology.yaml — CriticalValue 통보 모델
    evidence_anchor: 'materialized-input.md:100-106; value_authority_anchor={source:
      .onto/review/20260716-db88504e/execution-preparation/review-value-alignment-criteria.yaml,
      anchor: criterion user-request-intent (lines 6-18), excerpt: "EMR/LIS 통합의
      개념 권위 문서로 쓰기에 적절한지 ... 운영 시 생길 위험을 중심으로"}; value_type=commitment;
      alignment_direction=misaligned'
    claim: 즉시 통보라는 핵심 운영 약속의 권위를 불리언과 외부 전화 대장으로 분할해 통합 문서가 통보 사실을 완결적으로 설명하지 못한다.
    lens_rationale_summary: 즉시 통보 여부를 판단하려면 완료 여부뿐 아니라 언제 누구에게 통보했는지가 함께 식별되어야 한다.
      현재 모델만으로는 notified=true의 근거를 추적하거나 외부 대장과 불일치를 해결할 수 없어, bounded-closed 개념
      권위 문서라는 목적과 중요한 운영 약속이 정렬되지 않는다.
    proposed_action: Notification 또는 CriticalValueNotification 개념을 추가해 결과/임계값, 발생·통보
      시각, 수신자, 채널, 상태를 연결하고 단일 권위와 불일치·재통보 규칙을 정의한다. 외부 대장이 권위라면 그 식별자와 참조 계약을 이
      문서에 포함한다.
    affected_purpose: EMR/LIS 통합의 bounded-closed 개념 권위 문서에서 즉시 통보 흐름을 신뢰 가능하게 표현
    failure_condition: notified 값의 근거, 통보 시각 또는 수신자를 통합 시스템이 확인하거나 두 저장소의 불일치를 해결해야 하는 경우
    impact: 핵심 운영 약속의 일부가 모델 밖의 연결되지 않은 권위에 남아 통합 구현과 감사 판단이 문서만으로 결정되지 않는다.
    evidence_refs:
      - .onto/review/20260716-db88504e/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:100-106
      - review-value-alignment-criteria.yaml:6-18
    severity: medium
