      failure_condition: notified 값의 근거, 통보 시각 또는 수신자를 통합 시스템이 확인하거나 두 저장소의 불일치를 해결해야 하는 경우
      impact: 핵심 운영 약속의 일부가 모델 밖의 연결되지 않은 권위에 남아 통합 구현과 감사 판단이 문서만으로 결정되지 않는다.
      evidence_refs:
        - materialized-input.md:100-106
        - review-value-alignment-criteria.yaml:6-18
    causal_path:
      root_cause_candidate: 통보라는 하나의 운영 개념을 온톨로지의 불리언과 연결되지 않은 외부 전화 대장으로 분할한 설계
      root_cause_step_id: finding-002.cause-002
      steps:
        - cause_id: finding-002.cause-001
          claim: CriticalValue의 notified 값만으로는 통보 시각과 수신자를 확인할 수 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: finding-002.cause-002
          claim: 이 추적성 공백은 시각과 수신자의 권위를 외부 대장에 두면서 연결 관계와 정합성 계약을 모델링하지 않은 구조의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100-106
      unresolved_beyond_evidence: 외부 전화 기록 대장의 실제 스키마와 품질은 허용 경계 밖이지만, 현재 온톨로지에 연결 계약이 없다는 사실은 경계 내에서 확인된다.
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260716-db88504e/round1/axiology.findings.yaml#axiology-candidate-003
    target: clinical-lab-ontology.yaml — Test/Assay 카탈로그 권위
    evidence_anchor: 'materialized-input.md:46-60,126-127;
      value_authority_anchor={source:
      .onto/review/20260716-db88504e/execution-preparation/review-value-alignment-criteria.yaml,
