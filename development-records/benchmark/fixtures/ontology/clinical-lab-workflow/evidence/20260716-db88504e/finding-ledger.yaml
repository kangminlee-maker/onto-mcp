      개념 권위 문서로 쓰기에 적절한지"}; value_type=tradeoff; alignment_direction=misaligned'
    claim: Test와 Assay의 이중 등록을 허용하면서 대응 관계를 정의하지 않아 단기 카탈로그 편의가 통합 개념 권위를 훼손한다.
    lens_rationale_summary: 두 개념을 구분할 수는 있지만, 중복 등록 항목의 동일성·다대다 대응·변경 권위를 정하지 않으면
      소비자마다 다른 코드와 검체 표현을 기준으로 삼을 수 있다. 통합을 나중으로 미루는 트레이드오프가 정당화나 정합성 장치 없이 수용되어
      현재 문서의 개념 권위 목적과 충돌한다.
    proposed_action: Test와 Assay를 성급히 합치기보다 주문 단위와 수행 단위를 유지하고 명시적
      realizes/mapped_to 관계, 대응 카디널리티, 코드 권위, 버전·변경 규칙을 정의한다. 이중 등록은 해당 매핑의 원자적
      생성으로 제한한다.
    affected_purpose: EMR/LIS가 공통으로 해석할 수 있는 검사 카탈로그 개념 권위 제공
    failure_condition: 동일 신규 항목의 Test와 Assay 기록이 서로 다르게 생성·변경되거나 소비자가 둘 중 하나만 기준으로 삼는 경우
    impact: 주문 개념과 수행 개념의 대응이 결정 불가능해 통합 매핑이 각 구현체의 로컬 판단으로 이동하고 문서의 권위가 약화된다.
    evidence_refs:
