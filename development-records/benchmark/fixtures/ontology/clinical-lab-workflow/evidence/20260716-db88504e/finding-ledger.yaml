    evidence_anchor: 'materialized-input.md:69-83,121-123;
      value_authority_anchor={source:
      .onto/review/20260716-db88504e/execution-preparation/review-value-alignment-criteria.yaml,
      anchor: criterion user-request-intent (lines 6-18), excerpt: "EMR/LIS 통합의
      개념 권위 문서로 쓰기에 적절한지 ... 운영 시 생길 위험을 중심으로"}; value_type=stakeholder;
      alignment_direction=misaligned'
    claim: 임상의가 신뢰하도록 선언된 보고 상태를 야간 배치로 뒤늦게 정정하는 설계는 개념 권위와 운영 신뢰를 훼손한다.
    lens_rationale_summary: 문서는 Report.result_status를 임상의가 신뢰하는 권위 값이라고 선언하면서도 최신
      Result 상태와의 불일치를 의도적으로 허용한다. 따라서 정정 후 배치 전 구간에는 권위 값이 사실과 어긋나 EMR/LIS 통합의
      단일하고 신뢰 가능한 개념 기준이라는 목적이 실패한다.
    proposed_action: Result 상태를 단일 권위로 정하고 Report 상태를 즉시 파생하거나, 정정 이벤트와 원자적으로
      Report를 갱신한다. 비동기 처리가 불가피하면 stale/pending-amendment 상태와 최대 지연, 실패·재처리 규칙을
      명시한다.
    affected_purpose: EMR/LIS 통합에서 임상의가 신뢰할 수 있는 개념 권위 문서 제공
    failure_condition: Result가 corrected로 전이한 뒤 야간 동기화가 실행되기 전까지
      Report.result_status가 finalized로 유지되는 경우
    impact: 통합 소비자가 권위 값으로 안내된 보고 상태를 읽어도 최신 임상 결과 상태를 얻지 못하므로 문서의 권위성과 운영 의사결정 신뢰가
      직접 약화된다.
    evidence_refs:
      - .onto/review/20260716-db88504e/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:69-83
      - materialized-input.md:121-123
      - review-value-alignment-criteria.yaml:6-18
