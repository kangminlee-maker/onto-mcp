per_lens_provenance:
  axiology:
    domain_constraints_used: []
    domain_context_assumptions:
      - EMR/LIS 통합의 개념 권위 문서는 동일한 운영 사실에 대해 소비자가 결정적으로 식별할 수 있는 권위와 정합성 규칙을 제공해야
        한다는 판단은 확인된 review intent에 근거한다.
      - 실제 병원별 규정이나 외부 전화 기록 대장의 세부 요건은 사용하지 않았다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - 임상검사 통합의 개념 권위 문서는 검사 전·분석·검사 후 단계에서 환자 안전에 영향을 주는 사건과 provenance를 표현할 수
        있어야 한다.
      - 검사 카탈로그, 기준범위와 임계값은 시간에 따라 변경될 수 있으므로 과거 시점의 정의를 재구성할 필요가 있다.
      - 최종 검사 결과는 운영상 정정·철회·대체될 수 있으며, 이전에 전달된 버전을 감사 가능하게 보존해야 한다.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - EMR/LIS 통합의 개념 권위 문서는 신규 검사·검체·상태 추가와 코드 변경 후에도 기존 기록의 의미를 보존해야 한다.
      - 외부 시스템의 카탈로그, 상태 어휘, 임계값 정책은 시간에 따라 변경될 수 있다.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - enum 속성은 한 시점에 하나의 열거값만 갖는 단일값 속성으로 해석했다.
      - 모델에 금지 조건이 없으므로 Result correction이 Report release 이전 또는 같은 시점에 발생하는 경로도
        허용된다고 해석했다.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - 검사 주문의 우선순위는 주문의 본질적 정체성보다는 운영 중 변경 가능한 분류로 해석했다.
      - 하나의 임계값 규칙은 여러 환자 또는 반복 검사 결과에 적용될 수 있다고 해석했다.
      - CBC와 BMP는 문서 자체가 제시한 주문 가능 예시이며, 복수 Result 관계와 함께 단일 결과 산출 단위가 아닌 묶음일 수
        있다고 해석했다.
      - WB는 whole blood를 뜻하고 Serum은 혈액에서 분리된 분석 재료를 뜻한다고 해석했다.
  structure:
    domain_constraints_used: []
    domain_context_assumptions:
      - 속성의 ref와 is_a도 구조적 연결로 인정했으며 relations 목록에 중복 선언되지 않았다는 이유만으로는 결함으로 보지
        않았다.
      - 대상 문서가 스스로 선언한 EMR/LIS 개념 권위 역할에는 주문 가능한 Test와 LIS 수행 단위 Assay 사이의 추적
        가능한 연결이 필요하다고 판단했다.
      - CriticalValue의 notified는 임계 범위 자체가 아니라 개별 위험 결과 발생에 대한 통보 완료를 나타내려는 값으로
        해석했다.
