domain_context_assumptions:
  - 속성의 ref와 is_a도 구조적 연결로 인정했으며 relations 목록에 중복 선언되지 않았다는 이유만으로는 결함으로 보지 않았다.
  - 대상 문서가 스스로 선언한 EMR/LIS 개념 권위 역할에는 주문 가능한 Test와 LIS 수행 단위 Assay 사이의 추적 가능한
    연결이 필요하다고 판단했다.
  - CriticalValue의 notified는 임계 범위 자체가 아니라 개별 위험 결과 발생에 대한 통보 완료를 나타내려는 값으로 해석했다.
