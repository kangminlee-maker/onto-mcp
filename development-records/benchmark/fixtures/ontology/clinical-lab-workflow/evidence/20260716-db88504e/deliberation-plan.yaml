    resolution_question: 현재 표현들은 동일 의미 수준의 중복 권위인가, 아니면 원천 검체와 분석 재료라는 서로 다른 분류
      수준인가; 이에 따라 단일 공유 개념과 분리된 버전형 개념 중 어느 모델이 타당한가?
  - issue_id: issue-014
    priority: 8
