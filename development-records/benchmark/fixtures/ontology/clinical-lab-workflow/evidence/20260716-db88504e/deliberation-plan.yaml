      유지하고 coverage와 semantics 렌즈는 핵심 환자별 통보 경로 실패를 이유로 high로 상향한다.
    resolution_question: 결과별 임계 통보 귀속 경로의 부재가 신뢰성과 추적성을 약화하는 medium 문제인가, 아니면 지원되는
      핵심 임계 통보 경로를 달성할 수 없게 하는 high 문제인가?
  - issue_id: issue-002
