      medium으로 낮추고 semantics를 포함한 통합 평가는 high를 유지한다.
    resolution_question: 결과별 통보 사건과 증거 연결의 부재는 감사성과 신뢰를 약화하는 medium 문제인가, 아니면 지원되는
      임계 결과 통보 목적을 달성할 수 없게 하는 high 문제인가?
