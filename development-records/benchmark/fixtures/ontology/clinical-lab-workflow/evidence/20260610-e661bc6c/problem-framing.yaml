    judgment_state: observed
    impact_kind: maintainability_evolvability
    timing_class: planned_follow_up
    closure_class: carry_forward
    closure_obligation: may_close_during_next_stage
    domain_axes: {}
    rationale: The issue is a stable reference-data gap that affects future specimen
      kinds, external codes, and historical interpretation. It is material but
      less immediately blocking than safety or core workflow authority issues,
      so it can be carried into the next modeling pass if explicitly tracked.
    related_surface_finding_ids:
      - finding-009
  - issue_id: issue-009
    problem_definition: STAT order meaning is represented as priority value, is_stat
      boolean, and StatOrder subtype without canonical source, precedence,
      derivation invariant, transition rule, or synchronization rule.
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: The resolved issue preserves materiality while narrowing away from a
      formal contradiction claim. Because STAT semantics can affect routing,
      urgency, notification, and metric interpretation, the target needs one
      canonical representation with bounded projections.
    related_surface_finding_ids:
      - finding-012
  - issue_id: issue-010
    problem_definition: Pairwise Order, Specimen, Result, and Report edges omit
      lifecycle or membership invariants binding Report contents back to the
      same order, tests, and specimens.
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: correctness
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: "The issue is a structural correctness gap: implementations could
      accept cross-order results while remaining graph-compliant. Since the
      review purpose includes validating Order-to-Report workflow structure,
      same-order/test/specimen membership constraints should be closed in the
      target."
    related_surface_finding_ids:
      - finding-017
