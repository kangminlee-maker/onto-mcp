      the target needs a modeling decision before it can function as a shared
      authority.
    related_surface_finding_ids:
      - finding-006
      - finding-013
      - finding-015
      - finding-014
  - issue_id: issue-007
    problem_definition: Missing authoritative Test-to-Assay mapping causes double
