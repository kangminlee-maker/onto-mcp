findings:
  - candidate_id: semantics-candidate-001
    target: clinical-lab-ontology.yaml / Result.status and Report.result_status
    evidence_anchor: clinical-lab-ontology.yaml:64-78, clinical-lab-ontology.yaml:118
    claim: 동일한 결과 상태 의미가 서로 다른 enum과 권위 설명으로 중복 정의되어 있습니다.
    what: Result.status는 [preliminary, final, corrected]를 쓰며 LIS가 기록하고
      Report.result_status에도 동일 정보가 유지된다고 설명합니다. 그런데 Report.result_status는
      [prelim, finalized, amended]를 쓰고, 동시에 임상의가 신뢰하는 권위 값이라고 설명합니다.
    why: 두 필드는 같은 의미라고 선언되어 있지만 값 이름과 권위 위치가 다릅니다. 특히 final/finalized,
      corrected/amended는 상태 이름이 비슷하지만 정확히 같은 사건인지, 보고서 릴리스 이후 수정 상태인지가 분리되어 있지
      않습니다. EMR/LIS 통합의 개념 권위 문서로 쓰면 결과 상태 매핑, 임상의 표시 상태, 동기화 배치 후 정정 상태가 서로 다른
      의미로 해석될 수 있습니다.
    how_to_fix: 결과 상태의 canonical concept을 하나로 정하고 enum 값을 단일화하세요. 보고서 표시용 별도 상태가
      필요하면 Result.status와 Report.result_status의 의미 차이, 변환 규칙, 권위 소스, 지연 동기화 중 임시
      상태를 명시하세요.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 통합의 개념 권위 문서로 결과 상태의 의미와 권위 값을 안정적으로 정의하는 목적.
      failure_condition: LIS Result.status와 Report.result_status가 같은 정보로 취급되지만 서로 다른
        enum과 권위 설명을 유지할 때.
      impact: 임상의가 신뢰하는 상태와 LIS 원천 상태가 다르게 매핑되어 preliminary/final/corrected 계열 상태의 표시,
        완료 판단, 정정 보고 처리가 엇갈릴 수 있습니다.
      evidence_refs:
        - clinical-lab-ontology.yaml:64-78
        - clinical-lab-ontology.yaml:118
    causal_path:
      root_cause_candidate: 동일한 결과 상태 개념을 Result와 Report 양쪽에 중복 배치하면서 canonical 상태 어휘와
        권위 소스를 하나로 정하지 않았습니다.
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: Result.status는 LIS가 기록하며 Report.result_status에도 동일 정보가 유지된다고 설명됩니다.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:64-68
        - cause_id: semantics-candidate-001.cause-002
          claim: Report.result_status는 다른 enum 값을 사용하면서 보고서에 표시되는 권위 값이라고 설명됩니다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:75-78
        - cause_id: semantics-candidate-001.cause-003
          claim: 상태 규칙은 corrected가 amended로 동기화되어야 하며 배치가 야간 1회라고 해, 두 상태 필드가 일정 시간 불일치할 수
            있음을 전제합니다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:118
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: clinical-lab-ontology.yaml / Order STAT modeling
    evidence_anchor: clinical-lab-ontology.yaml:16-24
    claim: STAT 주문 의미가 priority 값, is_stat boolean, StatOrder 하위 타입으로 동시에 모델링되어 있습니다.
    what: Order.priority에는 stat 값이 있고, Order.is_stat도 STAT 여부를 기록하며, StatOrder는
      Order의 하위 타입으로 별도 정의됩니다.
    why: 세 표현은 모두 STAT 주문 여부라는 같은 의미를 가리키지만 서로의 우선순위와 동기화 규칙이 없습니다. 한 주문이
      priority=urgent, is_stat=true, 일반 Order 타입처럼 표현되는 식의 의미 충돌이 가능하며,
      StatOrder가 필수 하위 타입인지 단순 우선순위 상태인지도 불명확합니다.
    how_to_fix: STAT 여부의 canonical 표현을 하나로 정하세요. 보통 priority enum의 stat 값만 권위로 두고
      is_stat은 파생값으로 제거하거나 명시적 projection으로 표시합니다. 별도 StatOrder가 필요하면 생성 조건,
      priority와의 불변식, 일반 Order로 되돌릴 수 있는지 여부를 정의하세요.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문 우선순위와 응급 주문 의미를 EMR/LIS 양쪽에서 일관되게 해석하게 하는 목적.
      failure_condition: STAT 의미가 세 필드/타입으로 표현되지만 우선순위와 불변식이 정의되지 않을 때.
      impact: 주문 라우팅, TAT 계산, 응급 알림 같은 운영 로직이 서로 다른 STAT 판정을 사용할 수 있습니다.
      evidence_refs:
        - clinical-lab-ontology.yaml:16-24
    causal_path:
      root_cause_candidate: STAT을 독립 개념으로 승격할지 Order의 priority 값으로 둘지 결정하지 않은 채 세 표현을 병행했습니다.
      root_cause_step_id: semantics-candidate-002.cause-003
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: Order.priority enum은 stat 값을 포함합니다.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:16
        - cause_id: semantics-candidate-002.cause-002
          claim: Order.is_stat boolean도 같은 STAT 여부를 기록한다고 설명됩니다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:17
        - cause_id: semantics-candidate-002.cause-003
          claim: StatOrder는 응급(STAT) 검사 주문이라는 Order 하위 타입으로 추가 정의됩니다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:20-24
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-003
    target: clinical-lab-ontology.yaml / Test and Assay catalog concepts
    evidence_anchor: clinical-lab-ontology.yaml:41-55, clinical-lab-ontology.yaml:121-122
    claim: Test와 Assay가 구분되어야 할 개념처럼 보이지만 둘 다 '검사 항목'으로 정의되어 의미 경계가 흐립니다.
    what: Test는 주문 가능한 카탈로그 단위이고 Assay는 분석기에서 수행되는 검사 카탈로그의 수행 단위라고 되어 있습니다. 그러나 둘 다
      검사 항목으로 불리며, 신규 항목을 두 곳 모두 등록한다고 되어 있고, 검체 종류도 Test는 제한 enum, Assay는 자유
      문자열로 표현합니다.
    why: 주문 가능한 임상 카탈로그 항목과 분석기 수행 항목은 통합에서 서로 다른 책임을 가질 수 있는데, 현재 문서는 둘을 같은 이름 계열로
      설명하면서 매핑 관계나 의미 차이를 닫지 않습니다. 신규 항목 이중 등록은 같은 개념의 동의어인지, 1:N 수행 매핑인지, 장비별
      구현인지 판단하기 어렵게 만듭니다.
    how_to_fix: Test와 Assay의 canonical 관계를 명시하세요. 예를 들어 Test는 orderable catalog
      item, Assay는 executable analytical procedure로 정의하고 Test-to-Assay 매핑 카디널리티와
      검체 종류 코드 체계를 맞추세요. 실제로 동의어라면 하나의 개념으로 통합하고 alias만 남기세요.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR 주문 카탈로그와 LIS/분석기 수행 카탈로그의 의미를 연결하는 개념 권위 문서 목적.
      failure_condition: Test와 Assay가 별도 엔티티로 유지되지만 의미 경계와 매핑이 정의되지 않고 신규 항목이 양쪽에 등록될 때.
      impact: 주문 코드, 장비 수행 코드, 결과 귀속, 검체 요구사항이 서로 다른 기준으로 관리되어 통합 매핑 오류와 카탈로그 드리프트가
        발생할 수 있습니다.
      evidence_refs:
        - clinical-lab-ontology.yaml:41-55
        - clinical-lab-ontology.yaml:121-122
    causal_path:
      root_cause_candidate: 주문 가능한 검사와 분석기 수행 단위의 개념 분리를 결정하지 않은 채 두 카탈로그를 병행했습니다.
      root_cause_step_id: semantics-candidate-003.cause-003
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: Test는 주문 가능한 카탈로그 단위인 단일 검사 항목으로 정의됩니다.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:41-47
        - cause_id: semantics-candidate-003.cause-002
          claim: Assay도 분석기에서 수행되는 검사 항목이자 검사 카탈로그의 수행 단위로 정의됩니다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:49-55
        - cause_id: semantics-candidate-003.cause-003
          claim: 노트는 신규 항목을 두 곳 모두 등록한다고 해 두 개념 사이의 권위 분리가 아직 닫히지 않았음을 보여줍니다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:121-122
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-004
    target: clinical-lab-ontology.yaml / Specimen to Result relation semantics
    evidence_anchor: clinical-lab-ontology.yaml:113-114
    claim: Specimen이 Result를 'produces'한다는 관계명은 실제 의미를 잘못 귀속합니다.
    what: Result는 Specimen에서 derived_from된다고도 정의되어 있고, 바로 다음 줄에서 Specimen이 Result를
      produces한다고 설명합니다. note도 '검체가 결과를 생산한다'고 되어 있습니다.
    why: 검체는 결과의 출처 또는 대상 물질이지 결과를 생성하는 행위자나 수행 단위가 아닙니다. 결과를 산출하는 의미 주체는 검사 수행,
      Assay, 분석기, 또는 검사실 프로세스에 가깝습니다. 현재 이름은 출처(provenance)와 생산(production)을 섞어
      결과 생성 책임을 검체에 잘못 부여합니다.
    how_to_fix: Specimen→Result 관계를 source_for 또는 specimen_for_result처럼 출처 관계로 바꾸고,
      결과 생성 관계는 Assay/Test execution 같은 수행 개념에서 Result로 연결하세요. 중복되는
      Result→Specimen derived_from과 하나로 정합화하세요.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 검체, 수행 행위, 결과 사이의 의미 관계를 정확히 정의해 LIS 워크플로 권위를 세우는 목적.
      failure_condition: 검체가 결과를 생산한다는 관계명이 통합 설계에서 결과 생성 책임 또는 provenance로 해석될 때.
      impact: 결과 산출의 행위자, 감사 추적, 장비/검사 수행 매핑이 검체 자체로 잘못 귀속되어 운영 모델이 부정확해질 수 있습니다.
      evidence_refs:
        - clinical-lab-ontology.yaml:113-114
    causal_path:
      root_cause_candidate: 결과의 출처 관계와 결과 생성 행위 관계를 같은 Specimen-Result 연결에 섞었습니다.
      root_cause_step_id: semantics-candidate-004.cause-002
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: Result→Specimen은 derived_from으로 출처 관계를 나타냅니다.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:113
        - cause_id: semantics-candidate-004.cause-002
          claim: Specimen→Result는 produces로 되어 있고 note는 검체가 결과를 생산한다고 설명합니다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:114
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - 외부 도메인 문서는 session_domain none 및 web research denied 조건 때문에 사용하지 않았습니다.
  - 임상검사 일반 의미상 검체는 결과의 원천 물질이고, 결과 생성은 검사 수행/분석 행위에 의해 일어난다는 기본 도메인 해석을 사용했습니다.
  - STAT은 주문 우선순위 또는 주문 상태 성격의 표현일 수 있으며, 별도 하위 타입으로 둘 경우 priority/is_stat과의
    불변식이 필요하다고 보았습니다.
validation:
