  - issue_id: issue-001
    root_cause_hypothesis: Result.status and Report.result_status duplicate one
      status authority across LIS and clinician-facing report surfaces without a
      canonical status model, explicit mapping, or bounded synchronization rule.
    root_confidence: high
    surface_finding_ids:
      - finding-001
      - finding-010
      - finding-011
    relation_refs:
      - rel-008
      - rel-009
    raised_by_lens_ids:
      - axiology
      - evolution
      - semantics
    issue_statement: Duplicated result/report status authority allows stale or
      divergent clinician-facing state during corrections and future status
      expansion.
    proposed_action: Define a canonical result status concept or explicit status
      mapping table covering Result status, Report display status, authority
      source, transition conditions, synchronization SLA, and pending/failure
      states.
    affected_purpose: Use the ontology as the concept authority for EMR/LIS result
      status and clinician-trusted report state.
    failure_condition: When Result.status changes to corrected, or when new
      result/report states are introduced, Report.result_status may remain
      finalized until nightly synchronization or map through implicit enum
      conventions.
    impact: The ontology appears to authorize clinician-facing status while allowing
      it to lag or diverge from LIS truth, weakening clinical trust and future
      evolution safety.
