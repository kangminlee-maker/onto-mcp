  - issue_id: issue-005
    root_cause_hypothesis: Specimen lifecycle is scoped only through analysis and
      leaves post-analysis retention, transfer, and disposal outside the
      ontology state model.
    root_confidence: medium
    surface_finding_ids:
      - finding-005
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: The ontology cannot represent post-analysis specimen
      availability or disposal state needed for retest, correction, and audit
      workflows.
    proposed_action: Extend Specimen lifecycle with storage, retention,
      transfer/release, disposal, and discard-blocked states or events,
      including location, timing, approval, and policy references.
    affected_purpose: Allow EMR/LIS systems to share specimen state for result
      correction, retesting, and audit beyond the initial analysis workflow.
    failure_condition: After Specimen reaches analyzed, storage and disposal are
      handled only by departmental rules without ontology states or relations.
    impact: Retest feasibility, disposal responsibility, and audit reconstruction
      can diverge between systems because the authority model stops before
      operationally relevant terminal states.
