    issue_statement: Specimen type representation is split across Specimen, Test,
      and Assay fields, making new specimen kinds and external codes hard to
      integrate consistently.
    proposed_action: Introduce a shared SpecimenKind catalog/reference concept with
      local/analyzer/external codes, labels, synonyms, active periods, and
