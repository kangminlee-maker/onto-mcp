  - issue_id: issue-009
    root_cause_hypothesis: STAT order meaning is represented simultaneously as
      priority value, is_stat boolean, and StatOrder subtype without a canonical
      source or invariants.
    root_confidence: medium
    surface_finding_ids:
      - finding-012
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: STAT order semantics can diverge across routing, urgency, and
      TAT logic because the ontology does not choose one authoritative
      representation.
    proposed_action: Select one canonical STAT representation, such as
      priority=stat, and define any boolean or subtype as a derived projection
      with explicit invariants and transition rules.
    affected_purpose: Ensure EMR/LIS consumers interpret order priority and
      emergency routing consistently.
    failure_condition: An Order can carry conflicting or incomplete STAT signals
      across priority, is_stat, and StatOrder without stated precedence or
      synchronization rules.
    impact: Routing, urgent notification, and operational metrics may use different
      STAT predicates while each appears compliant with the ontology.
    evidence_refs:
      - .onto/review/20260610-e661bc6c/round1/semantics.findings.yaml#semantics-candidate-002
      - clinical-lab-ontology.yaml:16-24
    severity: medium
    domain_threshold_used: null
    singleton_reason: No same_root_candidate relation links finding-012 to another
      finding; rel-014 is shared_cause_candidate and is preserved for runtime
      dependency context only.
  - issue_id: issue-010
    root_cause_hypothesis: The ontology declares pairwise Order, Specimen, Result,
      and Report edges but omits a lifecycle/membership invariant that binds
      Report contents back to the same order, tests, and specimens.
    root_confidence: medium
    surface_finding_ids:
      - finding-017
    relation_refs: []
    raised_by_lens_ids:
      - structure
    issue_statement: Report-to-Result membership is underconstrained, so the graph
      cannot prove that reported results belong to the report's order.
    proposed_action: Add structural invariants tying Report.contains Result to
      Report.order_ref.ordered_tests and same-order Specimen membership, or
      introduce canonical joins such as Order has_many Result where appropriate.
    affected_purpose: Use the ontology as the concept authority for validating
      Order-to-Report workflow structure.
    failure_condition: When validating report contents, a contained Result's
      test_ref and derived Specimen are not required to match the Report's
      order_ref and ordered_tests.
    impact: EMR/LIS implementations could aggregate or accept cross-order results
      without violating the published graph contract, reducing integration
      trust.
    evidence_refs:
      - .onto/review/20260610-e661bc6c/round1/structure.findings.yaml#structure-candidate-003
