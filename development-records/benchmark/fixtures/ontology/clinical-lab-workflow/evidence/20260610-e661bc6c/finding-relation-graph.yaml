  - relation_id: rel-012
    from_finding_id: finding-009
    to_finding_id: finding-013
    relation: shared_cause_candidate
    root_hypothesis: Catalog-related concepts are encoded locally in entity fields
      instead of being normalized into shared reference concepts and relations.
    shared_cause:
      cause_claim: Test and Assay model overlapping catalog/specimen dimensions
        without a shared canonical reference model, causing field-level drift
        across entities.
      from_cause_ref: finding-009.cause-003
      to_cause_ref: finding-013.cause-003
    rationale: finding-009 identifies that specimen kind is not promoted into a
      reusable SpecimenKind concept across Specimen/Test/Assay. finding-013
