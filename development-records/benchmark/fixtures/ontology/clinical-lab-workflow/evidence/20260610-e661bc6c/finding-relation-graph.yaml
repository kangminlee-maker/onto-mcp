      or parallel entities.
    confidence: medium
  - relation_id: rel-013
    from_finding_id: finding-005
    to_finding_id: finding-017
    relation: shared_cause_candidate
    root_hypothesis: The ontology models the Order-to-Report workflow as pairwise
      edges but omits lifecycle and invariant constraints needed to validate
      downstream operational state.
    shared_cause:
      cause_claim: Workflow state is represented with local status/edge fragments
        rather than end-to-end lifecycle constraints that preserve auditability
        and same-order traceability.
      from_cause_ref: finding-005.cause-003
      to_cause_ref: finding-017.cause-004
    rationale: finding-005 concerns missing post-analysis Specimen lifecycle needed
      for retest/correction/audit decisions, while finding-017 concerns missing
      invariants tying report contents back to the same order, tests, and
      specimens. They are not duplicates, but both arise from an
      underconstrained workflow graph that cannot reconstruct operational
      validity across later lifecycle steps.
    confidence: medium
  - relation_id: rel-014
