  - relation_id: rel-008
    from_finding_id: finding-008
    to_finding_id: finding-014
    relation: duplicates
    root_hypothesis: 두 finding을 버전·유효기간 없는 CriticalValue 정책 이슈 하나로 합쳐도 과거 판정 재현성에 관한
