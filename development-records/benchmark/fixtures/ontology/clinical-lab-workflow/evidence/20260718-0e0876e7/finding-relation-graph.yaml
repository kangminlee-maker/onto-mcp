    shared_cause: null
    rationale: finding-012는 중복 표현을 하나의 공유 SpecimenType 권위로 통합하도록 제안하지만, finding-020은
      두 속성이 서로 다른 분류축이므로 분리해야 한다고 판단한다. 어느 해석이 맞는지 확정하지 않으면 통합 조치가 의미를 손상할 수 있다.
