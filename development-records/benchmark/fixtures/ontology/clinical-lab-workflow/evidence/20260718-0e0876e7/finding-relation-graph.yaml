  - relation_id: rel-011
    from_finding_id: finding-019
    to_finding_id: finding-023
    relation: same_root_candidate
    root_hypothesis: Test와 Assay 사이에 cardinality가 명시된 realization 관계를 추가하면 의미적 동일성
      결손과 워크플로 구조 단절이 동시에 해소된다.
