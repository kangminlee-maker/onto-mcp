relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-015
    relation: shared_cause_candidate
    root_hypothesis: Report 상태를 correction-aware 단일 전이로 계산하지 않고 독립 저장·지연 동기화한 설계를
      제거하면 상태 지연과 동시 의무 충돌이 함께 사라진다.
    shared_cause:
      cause_claim: 정정 상태 전파에 원자적이고 우선순위가 명확한 전이가 없다.
      from_cause_ref: finding-001.cause-003
      to_cause_ref: finding-015.cause-002
    rationale: 두 finding 모두 corrected 이후 Report.result_status를 언제 어떤 우선순위로 amended로
      바꿀지 정의하지 않은 동일 상태 전이 결손을 지적한다.
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-015
    to_finding_id: finding-016
    relation: shared_cause_candidate
    root_hypothesis: correction 이후 Order와 Report를 재평가하는 명시적 전이표를 추가하면 두 상태 안정성 문제를 함께 해소할 수 있다.
    shared_cause:
      cause_claim: 후속 correction에 대한 상위 객체의 상태 전이와 완료 의미가 정의되지 않았다.
      from_cause_ref: finding-015.cause-002
      to_cause_ref: finding-016.cause-002
    rationale: 하나는 Report의 충돌 상태를, 다른 하나는 Order의 불안정한 완료 상태를 보이지만 둘 다 후속 correction
      처리 규칙 부재에서 발생한다.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-001
    to_finding_id: finding-018
    relation: same_root_candidate
    root_hypothesis: Result 검증 상태와 Report 발행 상태의 권위·집계 규칙을 분리해 단일화하면 야간 동기화 불일치와 의미 혼합이 함께 제거된다.
    shared_cause: null
    rationale: finding-001의 지연된 중복 권위는 finding-018이 지적한 서로 다른 상태 의미를 동일 정보처럼 취급한 설계의
      운영상 발현이다.
    confidence: high
  - relation_id: rel-004
