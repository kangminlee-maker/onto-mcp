    rationale: finding-019는 대응 의미의 부재를, finding-023은 대응 edge의 부재를 지적하며 둘 다 정식
      Test–Assay 관계 없이 병행 카탈로그를 유지한 결정에 근거한다.
    confidence: high
  - relation_id: rel-012
    from_finding_id: finding-022
    to_finding_id: finding-023
    relation: shared_cause_candidate
    root_hypothesis: Assay 수행 사건과 그 workflow edge를 모델에 추가하면 Specimen을 생산 주체로 오인하는
