    root_hypothesis: 상태 변경과 매핑을 버전·유효기간이 있는 사건/규칙으로 모델링하면 정정 이력 결손과 향후 상태 어휘 변경의 소급
      해석 문제가 함께 해소된다.
    shared_cause:
      cause_claim: 변경 가능한 상태와 전이 규칙을 버전 없는 현재값 구조로만 표현했다.
      from_cause_ref: finding-006.cause-002
      to_cause_ref: finding-013.cause-002
    rationale: finding-006은 인스턴스 변경 이력, finding-013은 상태 규칙의 진화 이력을 다루지만 양쪽 모두 시간·버전
      경계 부재를 원인으로 한다.
    confidence: medium
  - relation_id: rel-005
    from_finding_id: finding-002
    to_finding_id: finding-007
    relation: duplicates
    root_hypothesis: 두 finding을 하나의 CriticalValueNotification 사건·증거 결손 이슈로 합쳐도 고유한
      실패 조건이나 조치가 소실되지 않는다.
