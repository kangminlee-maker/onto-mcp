findings:
  - candidate_id: coverage-candidate-001
    target: Specimen lifecycle
    evidence_anchor: materialized-input.md:37-44,121-124
    claim: 검체 lifecycle이 채취 후 분석까지만 표현되어 접수 거부·재채취와 보관·폐기 구간을 수용하지 못한다.
    what: Specimen 상태는 collected, received, in_analysis, analyzed뿐이며, analyzed 이후
      처리는 부서 내규로 넘긴다. 부적합 검체의 rejected, recollection_requested 같은 예외 종결 상태와
      retained/disposed 같은 최종 상태도 없다.
    why: 주문부터 보고까지의 권위 모델에서 검체의 예외 처리와 최종 처분을 표현하지 못하면 EMR/LIS가 검체 실패, 재채취 필요성, 보관
      여부를 동일한 상태 의미로 교환할 수 없다.
    how_to_fix: Specimen lifecycle에 운송·접수 판정·거부/취소·재채취·보관·폐기 상태와 전이 사건을 추가하고, 각 종결
      상태의 허용 전이를 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문부터 보고까지 임상검사 파이프라인의 엔티티·관계·상태를 정의하는 EMR/LIS 개념 권위 문서
      failure_condition: 검체가 부적합 판정되거나 분석 후 보관·폐기될 때 해당 운영 상태를 통합 모델로 교환해야 하는 경우
      impact: 실제 검체 lifecycle의 정상·예외·종결 구간이 권위 모델 밖에 남아 시스템별 비호환 상태와 수동 해석을 유발한다.
      evidence_refs:
        - materialized-input.md:37-44
        - materialized-input.md:121-124
    causal_path:
      root_cause_candidate: Specimen lifecycle의 모델 범위가 collected부터 analyzed까지로 한정되고 후속
        처리가 외부 내규에 위임되어 있다.
      root_cause_step_id: coverage-candidate-001.cause-002
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: 검체 거부·재채취·보관·폐기 상태가 정의되어 있지 않다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:44
            - materialized-input.md:124
        - cause_id: coverage-candidate-001.cause-002
          claim: 정상 분석 경로만 lifecycle에 포함하고 예외 및 최종 처분 구간은 모델 밖에 둔 범위 설정의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:37-44
            - materialized-input.md:124
      unresolved_beyond_evidence: 부서별 실제 보관·폐기 정책과 필요한 세부 상태는 경계 내 자료로 확정할 수 없다.
  - candidate_id: coverage-candidate-002
    target: Result 및 Report의 정정·재발행 이력
    evidence_anchor: materialized-input.md:62-84,121-123
    claim: 최종 결과의 정정과 보고서 개정은 현재 상태만 남기며 버전, 행위자, 시각, 사유를 보존하는 사건 개념이 없다.
    what: Result에는 status와 verified_by만 있고 검증 시각, 정정자, 정정 시각·사유, 이전 값이 없다. Report에도
      released_at과 현재 result_status만 있으며 재발행 버전이나 개정 행위가 없다.
    why: corrected/amended 상태가 있어도 정정 전 결과와 정정 행위를 재구성할 수 없다. 따라서 임상의가 어떤 보고 버전을 언제
      받았는지와 누가 무엇을 왜 변경했는지 추적할 수 없어 권위 문서로서 감사·환자안전 요구를 충족하지 못한다.
    how_to_fix: ResultVersion 또는 ResultAmendment와 ReportRelease 같은 사건 개념을 추가해 이전/새
      값, 버전, 행위자, 발생·유효 시각, 사유, 관련 보고서 배포를 기록하고 현재 상태를 이 이력에서 도출한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 임상의가 신뢰할 결과·보고 상태를 EMR/LIS 간 권위 있게 정의하는 것
      failure_condition: final 결과가 corrected로 변경되거나 이미 배포된 보고서가 amended로 재발행되는 경우
      impact: 현재 값만으로 과거 임상 판단의 근거와 정정 책임을 재구성할 수 없어 결과의 신뢰성과 감사 가능성이 손상된다.
      evidence_refs:
        - materialized-input.md:62-84
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: 결과와 보고를 버전 있는 기록/사건이 아니라 가변 상태 속성으로만 모델링했다.
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: 정정·개정 상태는 존재하지만 정정 전 값, 버전, 정정자·시각·사유가 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:62-84
        - cause_id: coverage-candidate-002.cause-002
          claim: 상태 변경을 별도 사건과 이력으로 표현하지 않는 모델링의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-84
            - materialized-input.md:123
      unresolved_beyond_evidence: 실제 LIS가 별도 감사 로그를 보유하는지는 경계 내에서 확인할 수 있으나, 온톨로지 자체에는 그 개념이나 연결이 없다.
  - candidate_id: coverage-candidate-003
    target: CriticalValue 통보 증거
    evidence_anchor: materialized-input.md:100-106
    claim: 중대결과 통보를 boolean으로만 표현하고 통보 행위의 감사 증거를 온톨로지 밖 전화 기록 대장에 맡겼다.
    what: CriticalValue에는 notified만 있으며 통보자, 통보 시각, 수신자, 통보 방법, 확인/재시도, 근거 결과와의 연결이
      없다.
    why: 통보 완료 여부만으로는 실제 전달과 수신 확인을 검증할 수 없고, 외부 대장과의 식별 관계도 없어 EMR/LIS 통합 모델에서 통보
      책임과 증거가 단절된다.
    how_to_fix: CriticalValueNotification 사건을 추가해 대상 Result, 통보자·수신자, 발생 시각, 방법,
      성공/확인 상태, 재시도, 근거를 기록하고 notified는 사건으로부터 도출한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 임상검사 파이프라인의 안전 관련 행위를 EMR/LIS가 공통 개념으로 교환하고 신뢰하게 하는 것
      failure_condition: 중대결과 통보의 완료 여부나 책임 이력을 확인해야 하는 경우
      impact: 환자안전상 핵심 통제 행위의 실행 증거를 통합 모델에서 검증할 수 없고 외부 대장과의 불일치도 판별할 수 없다.
      evidence_refs:
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: 통보를 행위와 증거가 있는 사건이 아니라 단일 완료 플래그로 축약했다.
      root_cause_step_id: coverage-candidate-003.cause-002
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: CriticalValue는 notified boolean만 보유하고 통보 시각과 수신자는 외부 대장에 둔다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: coverage-candidate-003.cause-002
          claim: 통보 사건 자체가 엔티티로 모델링되지 않은 축약의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100-106
      unresolved_beyond_evidence: 외부 전화 기록 대장의 스키마와 식별자는 허용된 자료에 없어 온톨로지와의 결합 가능성을 평가할 수 없다.
  - candidate_id: coverage-candidate-004
    target: CriticalValue 기준의 시간성
    evidence_anchor: materialized-input.md:100-106
    claim: 중대결과 임계값에 버전과 유효기간이 없어 과거 판정 기준을 재구성할 수 없다.
    what: lower_bound와 upper_bound는 현재 숫자만 보유하며 적용 시작·종료 시각, 기준 버전, 승인자, 환자군 또는 검사
      방법별 적용 범위가 없다.
    why: 임계값이 변경되면 과거 Result가 당시 기준으로 중대결과였는지 판정할 수 없다. 동일 test_ref에 적용되는 기준의 변경 이력도
      표현되지 않아 통합 시스템 간 판정 불일치가 생길 수 있다.
    how_to_fix: CriticalValueCriterion을 버전형 개념으로 만들고 effective_from/effective_to, 승인
      정보, 적용 대상·방법 범위와 기준 버전을 추가한다. 판정은 Result 시점에 유효한 기준을 참조하게 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS가 중대결과 판정 의미를 공통 권위 기준으로 해석하는 것
      failure_condition: 임계값이 변경되거나 과거 결과·통보를 재검토하는 경우
      impact: 과거 시점의 판정 근거를 복원할 수 없어 시스템별 재계산 결과와 감사 결론이 달라질 수 있다.
      evidence_refs:
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: 시점 의존 정책 값인 임계값을 유효기간 없는 현재값 속성으로 모델링했다.
      root_cause_step_id: coverage-candidate-004.cause-002
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: CriticalValue 임계값에는 유효기간·버전·승인 이력이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: coverage-candidate-004.cause-002
          claim: 변경 가능한 판정 기준을 정적 속성으로 표현한 모델링의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:103-106
      unresolved_beyond_evidence: 기관별 임계값 세분화 차원은 경계 내 자료만으로 확정할 수 없다.
  - candidate_id: coverage-candidate-005
    target: Test와 Assay 병행 카탈로그
    evidence_anchor: materialized-input.md:46-60,126-127
    claim: 두 카탈로그를 병행 관리하면서 대응 관계, 단일 권위, 변경 이력 개념이 없다.
    what: 주문 단위 Test와 수행 단위 Assay가 각각 존재하지만 두 엔티티 사이 관계가 없고, 신규 항목을 양쪽에 등록한다고만 한다.
      어느 시스템·개념이 코드, 명칭, 부서, 검체 요건의 권위 원본인지도 지정하지 않는다.
    why: 동일 신규 항목을 이중 등록하면 항목 매핑과 속성 불일치를 판정할 공통 근거가 없다. 주문된 Test가 어떤 Assay로 수행되었는지도
      표현할 수 없어 EMR 주문과 LIS 수행 결과의 추적성이 끊긴다.
    how_to_fix: Test-to-Assay 매핑을 명시적이고 버전 있는 관계로 추가하고 일대다·대체·패널 규칙과 유효기간을 정의한다. 각
      병행 속성의 권위 시스템과 동기화 방향을 지정한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR 주문 카탈로그와 LIS 수행 카탈로그의 공통 개념 권위를 제공하는 것
      failure_condition: 신규 항목 등록, 카탈로그 변경 또는 주문 Test를 실제 Assay 수행과 연결하는 경우
      impact: 이중 등록 값의 불일치와 잘못된 검사 매핑을 권위 문서로 판정할 수 없어 주문-수행-결과 추적성이 약화된다.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: Test와 Assay의 병행 관리가 선언됐지만 두 개념을 통합하는 매핑 및 권위 모델을 후속 과제로 유보했다.
      root_cause_step_id: coverage-candidate-005.cause-002
      steps:
        - cause_id: coverage-candidate-005.cause-001
          claim: Test와 Assay 사이의 관계 및 속성별 권위 지정이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:108-119
        - cause_id: coverage-candidate-005.cause-002
          claim: 양쪽에 신규 항목을 등록하면서 통합 여부를 나중에 결정하는 병행 관리 정책의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:126-127
      unresolved_beyond_evidence: 현재 EMR/LIS의 실제 카탈로그 소유권과 매핑 규칙은 경계 내 자료에 없다.
  - candidate_id: coverage-candidate-006
    target: Result 임상 표현 범위
    evidence_anchor: materialized-input.md:62-73
    claim: Result가 문자열 값과 단위만 제공해 검사 결과의 주요 표현·해석 차원을 포괄하지 못한다.
    what: Result.value는 항상 string이며 정량·정성·코드형·서술형 구분, 기준범위, 비정상 플래그, 검출한계, 수행
      Assay·방법·장비, 관찰 시각이 없다.
    why: 서로 다른 결과 형식과 해석 맥락을 구조적으로 구별하지 못하면 EMR이 표시·의사결정 지원에 필요한 의미를 안정적으로 소비할 수 없고,
      동일 Test 결과의 방법별 비교도 불가능하다.
    how_to_fix: ResultValue를 자료형별 구조로 세분화하고 observation_at, reference_range,
      interpretation/abnormal_flag, method 또는 performed_assay 참조, 필요 시 검출한계·장비
      맥락을 추가한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 임상검사 결과를 EMR/LIS 사이에서 의미 보존적으로 교환하는 개념 권위 제공
      failure_condition: 정량 외 결과, 기준범위 해석 또는 검사 방법에 의존하는 결과를 전달하는 경우
      impact: 핵심 결과 의미가 비구조 문자열이나 시스템별 확장으로 밀려 통합 계약의 포괄성과 상호운용성이 약화된다.
      evidence_refs:
        - materialized-input.md:62-73
    causal_path:
      root_cause_candidate: Result를 임상 관찰 모델이 아니라 최소 문자열 값 레코드로 한정했다.
      root_cause_step_id: coverage-candidate-006.cause-002
      steps:
        - cause_id: coverage-candidate-006.cause-001
          claim: Result에는 string value, unit, status, verified_by만 있고 해석·방법·관찰 시점 차원이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:62-73
        - cause_id: coverage-candidate-006.cause-002
          claim: 다양한 검사 결과 유형과 임상 해석 맥락을 하나의 최소 레코드로 축약한 모델링의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:62-73
      unresolved_beyond_evidence: 지원해야 할 구체적 결과 자료형과 방법 메타데이터 범위는 기관 요구사항 없이 확정할 수 없다.
domain_constraints_used: []
domain_context_assumptions:
  - 임상검사 검체 workflow에는 정상 분석 경로뿐 아니라 부적합 판정·재채취와 분석 후 보관·폐기 구간이 포함된다.
  - 최종 결과 정정과 중대결과 통보는 과거 상태, 행위자, 시각, 사유를 재구성할 수 있어야 하는 통제 행위다.
  - 중대결과 임계값과 검사 카탈로그 매핑은 운영 중 변경될 수 있는 시점 의존 값이다.
  - EMR/LIS 통합에서 주문 카탈로그와 수행 카탈로그를 병행 관리한다면 대응 관계와 단일 권위 또는 동기화 방향이 필요하다.
  - 임상검사 결과에는 문자열 값 외에도 자료형, 기준범위·해석, 관찰 시점, 수행 방법 맥락이 필요할 수 있다.
