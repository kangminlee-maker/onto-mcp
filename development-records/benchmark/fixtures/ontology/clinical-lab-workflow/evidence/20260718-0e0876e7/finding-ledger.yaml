  - finding_id: finding-023
    lens_id: structure
    source_ref: .onto/review/20260718-0e0876e7/round1/structure.findings.yaml#structure-candidate-001
    target: clinical-lab-ontology.yaml — Test/Assay execution structure
    evidence_anchor: materialized-input.md lines 46-60, 108-119, 126-127
    claim: Assay has no workflow relationship to Test or any order-to-result
      execution entity.
    lens_rationale_summary: Without a mapping edge, the model cannot represent which
      analyzer assay realizes an ordered Test or produces its Result. EMR/LIS
      integrations would have to maintain that mapping outside the intended
      conceptual authority, breaking traceability across the declared
      Order-to-Report workflow.
    proposed_action: Add an explicit, cardinality-defined Test-to-Assay realization
      relationship, including its inverse or canonical navigation rule. If
      mappings vary by specimen or analyzer, model that mapping as an
      association entity rather than leaving the catalogs parallel.
    affected_purpose: Use of the ontology as the conceptual authority for EMR/LIS
      integration across the Order-to-Report workflow.
    failure_condition: An ordered Test must be translated to an analyzer Assay,
      especially when their codes or cardinalities are not identical.
    impact: The authoritative model cannot supply the execution mapping, so
      integrations must invent non-authoritative mappings and cannot reliably
      trace results back through the execution unit.
    evidence_refs:
      - .onto/review/20260718-0e0876e7/round1/structure.findings.yaml#structure-candidate-001
      - materialized-input.md:6-8
      - materialized-input.md:46-60
