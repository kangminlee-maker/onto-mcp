  - finding_id: finding-024
    lens_id: structure
    source_ref: .onto/review/20260718-0e0876e7/round1/structure.findings.yaml#structure-candidate-002
    target: clinical-lab-ontology.yaml — CriticalValue notification structure
    evidence_anchor: materialized-input.md lines 100-106 and 108-119
    claim: CriticalValue.notified is not connected to the concrete Result or
      notification participants to which the completion state applies.
    lens_rationale_summary: A catalog-level threshold can be reused by many results,
      so its boolean cannot structurally identify which critical result was
      communicated, to whom, or under which order. The ontology therefore cannot
      represent or reconcile the immediate-notification event it declares.
    proposed_action: Separate the reusable critical-value threshold from a
      result-specific notification event. Link that event to the triggering
      Result, recipient Staff or external-recipient reference, notification
      timestamp, and status; include a stable external-ledger reference if the
      telephone ledger remains authoritative.
    affected_purpose: Use of the ontology as an operational conceptual authority for
      laboratory workflow and EMR/LIS integration.
    failure_condition: A Result falls within a CriticalValue range and its required
      immediate notification must be recorded or reconciled.
    impact: The model can mark a reusable threshold as notified without identifying
      the affected result or recipient, weakening operational traceability for
      an explicitly immediate action.
    evidence_refs:
      - .onto/review/20260718-0e0876e7/round1/structure.findings.yaml#structure-candidate-002
      - materialized-input.md:6-8
      - materialized-input.md:100-106
      - materialized-input.md:108-119
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use of the ontology as an operational conceptual authority for
        laboratory workflow and EMR/LIS integration.
      failure_condition: A Result falls within a CriticalValue range and its required
        immediate notification must be recorded or reconciled.
      impact: The model can mark a reusable threshold as notified without identifying
        the affected result or recipient, weakening operational traceability for
        an explicitly immediate action.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:100-106
        - materialized-input.md:108-119
    causal_path:
      root_cause_candidate: A result-specific notification event was collapsed into a
        boolean property of the reusable CriticalValue threshold while its
        supporting facts were placed in an unlinked external ledger.
      root_cause_step_id: finding-024.cause-002
      steps:
        - cause_id: finding-024.cause-001
          claim: CriticalValue.notified has no structural edge to the Result instance,
            report/order context, notification recipient, or external record.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
            - materialized-input.md:108-119
        - cause_id: finding-024.cause-002
          claim: The artifact places notification time and recipient in a telephone ledger
            but defines no identifier or relationship joining that ledger record
