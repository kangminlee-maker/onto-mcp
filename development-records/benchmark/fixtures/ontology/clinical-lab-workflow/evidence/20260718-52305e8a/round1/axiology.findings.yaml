findings:
  - candidate_id: axiology-candidate-001
    target: clinical-lab-ontology.yaml — Result/Report 상태 권위와 정정 동기화 규칙
    evidence_anchor: "review-value-alignment-criteria.yaml criterion
      `user-request-intent`의 목적: “EMR/LIS 통합의 개념 권위 문서”; materialized-input.md
      `Result.status`, `Report.result_status`, state_rules 두 번째 항목: 임상의는 Report
      값을 신뢰하지만 corrected 결과의 amended 반영은 야간 배치로 수행됨."
    claim: 임상의가 신뢰하는 보고 상태를 비동기 복제본으로 운영하는 결정은 개념 권위 문서라는 목적과 어긋난다.
    what: Result의 정정 상태와 Report의 권위 상태가 별도로 저장되고, 정정 후 최대 다음 야간 배치까지 서로 불일치할 수 있다.
    why: EMR 소비자는 Report.result_status를 권위 값으로 신뢰하도록 명시되어 있다. 그런데 LIS의
      Result.status가 먼저 corrected가 되면 통합 경계에서 오래된 finalized 상태가 정상적인 권위 값처럼
      노출된다. 이는 단순 명칭 문제가 아니라 최신 상태의 권위와 임상의 신뢰 사이의 숨은 트레이드오프다.
    how_to_fix: 정정 상태의 단일 권위 원천을 지정하고 Report 상태를 동기 파생하거나 원자적으로 갱신한다. 비동기 전파가 불가피하면
      pending-correction 같은 명시적 중간 상태, 전파 기한, 실패 처리 및 소비자 가시성 규칙을 계약에 포함한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 임상의가 신뢰할 수 있는 개념·상태 권위를 제공하는 목적
      failure_condition: Result가 corrected로 변경된 뒤 야간 동기화 전까지 EMR이
        Report.result_status=finalized를 읽는 경우
      impact: 정정된 결과가 존재해도 통합 소비자가 이전 최종 상태를 권위 있는 현재 상태로 판단하게 되어 문서의 상태 권위와 운영 신뢰가 함께
        약화된다.
      evidence_refs:
        - materialized-input.md — Result.status note
        - materialized-input.md — Report.result_status note
        - materialized-input.md — state_rules[1]
        - review-value-alignment-criteria.yaml — criterion user-request-intent
    causal_path:
      root_cause_candidate: 동일한 임상 결과 상태를 Result와 Report에 중복 저장하면서 정합성을 야간 배치에 맡긴 권위 설계
      root_cause_step_id: axiology-candidate-001.cause-002
      steps:
        - cause_id: axiology-candidate-001.cause-001
          claim: 정정 후 야간 배치 전까지 Report가 finalized인 채 남을 수 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md — state_rules[1]
        - cause_id: axiology-candidate-001.cause-002
          claim: 이 노출은 임상의가 신뢰하는 Report.result_status와 LIS가 기록하는 Result.status가 별도 권위 값처럼
            유지되는 설계의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md — Result.status note
            - materialized-input.md — Report.result_status note
      unresolved_beyond_evidence: 실제 배치 지연 시간과 EMR의 소비 방식은 경계 내 증거에 없지만, 선언된 규칙만으로 불일치 가능성은 확정된다.
  - candidate_id: axiology-candidate-002
    target: clinical-lab-ontology.yaml — CriticalValue 통보 모델
    evidence_anchor: "review-value-alignment-criteria.yaml criterion
      `user-request-intent`의 운영 위험 검토 목적; materialized-input.md
      `CriticalValue.definition` 및 `notified` note: 즉시 통보가 필요한 값이지만 시각과 수신자는 외부
      전화 기록 대장에 있음."
    claim: 중요 통보의 증거를 불리언과 외부 대장으로 분리한 모델은 통합 권위와 이해관계자 안전 약속을 약화한다.
    what: 온톨로지는 통보 여부만 보유하고, 언제 누구에게 어떤 방식으로 통보했는지는 개념 모델 밖의 전화 기록 대장에 둔다.
    why: "`notified=true`만으로는 즉시 통보가 실제로 완료되었는지, 적절한 수신자가 확인했는지, 재시도나 실패가 있었는지 구분할 수
      없다. EMR/LIS가 이 문서를 권위로 사용할 때 가장 시간 민감한 워크플로의 책임성과 추적성이 외부 비정형 권위에 의존한다."
    how_to_fix: CriticalValue와 별도의 Notification 또는 Acknowledgement 사건을 모델링해
      발생·시도·전달·수신확인 시각, 수신자, 채널, 상태, 실패 및 재시도를 표현하고, 그 사건을 통보 완료 여부의 권위 원천으로
      삼는다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 운영 위험을 통제할 수 있는 EMR/LIS 통합 개념 권위 제공
      failure_condition: 중요 결과에 대해 notified 값과 외부 전화 대장의 내용이 불일치하거나 통보 실패·지연을 구분해야 하는 경우
      impact: 통합 시스템이 실제 통보 완료와 단순 플래그 설정을 구분할 수 없어 즉시 통보 책임, 감사 가능성, 후속 조치의 신뢰가 훼손된다.
      evidence_refs:
        - materialized-input.md — CriticalValue.definition
        - materialized-input.md — CriticalValue.notified note
        - review-value-alignment-criteria.yaml — criterion user-request-intent
    causal_path:
      root_cause_candidate: 통보를 시간·수신자·확인 상태를 가진 사건이 아니라 파생 불리언으로 축약하고 핵심 증거를 외부 대장에 둔 경계 결정
      root_cause_step_id: axiology-candidate-002.cause-002
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: CriticalValue에는 notified 불리언만 있어 통보 시각과 수신자를 표현하지 못한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md — CriticalValue.notified note
        - cause_id: axiology-candidate-002.cause-002
          claim: 이 정보 손실은 통보의 권위 증거를 온톨로지 밖 전화 기록 대장에 분산한 결정의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md — CriticalValue.notified note
      unresolved_beyond_evidence: 전화 기록 대장의 구조와 연계 가능성은 허용된 증거에 없으므로, 현재 모델 밖에서 정합성이 보장되는지는 판단할 수 없다.
  - candidate_id: axiology-candidate-003
    target: clinical-lab-ontology.yaml — 병행 개념과 외부 계산 권위
    evidence_anchor: review-value-alignment-criteria.yaml criterion
      `user-request-intent`의 “개념 권위 문서” 목적; materialized-input.md
      `Order.priority`/`is_stat`/`StatOrder`, notes의 Test·Assay 이중 등록 및 대시보드 팀
      자체 TAT 계산식.
    claim: 이행 편의와 팀별 자율성을 위해 병행 권위를 허용한 결정이 단일 개념 권위라는 전체 목적을 침식한다.
    what: STAT 여부가 세 표현으로 존재하고, 신규 검사 항목은 Test와 Assay에 모두 등록되며, TAT 계산식은 온톨로지가 아니라
      대시보드 팀이 별도로 유지한다.
    why: 각 소비자가 어떤 표현이나 계산을 우선할지 선택해야 하므로 EMR, LIS, 분석기, 대시보드가 서로 다른 사실을 정당하게 산출할 수
      있다. 임시 이행이나 지역 최적화의 비용·종료 조건·우선순위가 명시되지 않아 초안의 중복이 장기 권위 구조로 굳을 위험이 있다.
    how_to_fix: 각 개념의 단일 정규 표현을 지정한다. STAT 하위 타입과 파생 필드는 priority에서 결정적으로 도출하고,
      Test–Assay 매핑의 권위·카디널리티·마이그레이션 종료 조건을 정의하며, TAT 계산식과 시간 경계의 권위 좌석을 온톨로지
      계약에 포함한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 여러 시스템이 동일한 개념과 계산을 공유하도록 하는 EMR/LIS 통합 권위 문서
      failure_condition: 병행 필드·카탈로그·계산식이 서로 다른 값이나 매핑을 갖는 경우
      impact: 소비자별 우선순위 판단이 필요해져 문서가 권위를 제공하지 못하고, 통합 불일치의 책임도 특정할 수 없게 된다.
      evidence_refs:
        - materialized-input.md — Order.priority
        - materialized-input.md — Order.is_stat
        - materialized-input.md — StatOrder
        - materialized-input.md — notes[0]
        - materialized-input.md — notes[1]
        - review-value-alignment-criteria.yaml — criterion user-request-intent
    causal_path:
      root_cause_candidate: 임시 이행 편의와 팀별 계산 소유권을 허용하면서 정규 권위, 파생 규칙, 종료 조건을 지정하지 않은 설계
      root_cause_step_id: axiology-candidate-003.cause-002
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: STAT, 검사 카탈로그, TAT가 각각 복수 표현 또는 외부 계산 좌석을 가진다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md — Order attributes and StatOrder
            - materialized-input.md — notes[0]
            - materialized-input.md — notes[1]
        - cause_id: axiology-candidate-003.cause-002
          claim: 이 병행 표현은 중복 등록과 팀별 계산을 허용하면서 우선순위와 종료 조건을 닫지 않은 결정의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md — notes[0]
            - materialized-input.md — notes[1]
      unresolved_beyond_evidence: 실제 시스템에 별도 정합성 통제가 존재하는지는 경계 내 자료로 확인할 수 없다.
  - candidate_id: axiology-candidate-004
    target: axiology review authority binding
    evidence_anchor: "context-candidate-assembly.yaml `system_purpose_refs: []`,
      `role_definition_refs: []`, `execution_rule_refs: []`;
      review-value-alignment-criteria.yaml에는 invocation 기반
      `user-request-intent`만 존재함."
    claim: 명시적 사용자 목적에 대한 정렬은 평가할 수 있지만, canonical authority chain 전체에 대한 가치 정렬 판단은
      현재 경계에서 불충분하다.
    what: axiology 역할이 요구하는 core lexicon과 제품·OaC·LLM-native·product-locality 원칙이 실행
      컨텍스트에 바인딩되지 않았고, 사용자 요청 목적만 제공되었다.
    why: 현재 finding은 “EMR/LIS 개념 권위와 운영 위험”이라는 확인된 목적에는 근거할 수 있지만, 대상이 상위 제품 원칙이나
      canonical 개념 SSOT와 충돌하는지는 검증할 수 없다. 이를 생략한 채 완전한 가치 정렬 판정을 내리면 리뷰 신뢰를
      과장한다.
    how_to_fix: 후속 axiology 실행 전에 packet이 선언한 순위 1~3 authority 문서를 허용 컨텍스트로 물질화하고
      정확한 앵커와 함께 바인딩한다. 불가능하면 최종 종합에서 이번 판단 범위를 사용자 요청 목적에 한정했다고 명시한다.
    upstream_evidence_required: true
    severity_hint: medium
    materiality_basis:
      affected_purpose: canonical authority에 근거한 가치·목적 정렬 검토
      failure_condition: 상위 제품 원칙 또는 core lexicon과 대상 온톨로지의 정렬 여부를 결론 내려야 하는 경우
      impact: 필수 권위 입력 없이 전체 가치 정렬을 주장하면 clean 또는 misaligned 판정 모두 근거 범위를 넘어 리뷰 신뢰를
        약화한다.
      evidence_refs:
        - context-candidate-assembly.yaml — system_purpose_refs
        - context-candidate-assembly.yaml — role_definition_refs
        - context-candidate-assembly.yaml — execution_rule_refs
        - review-value-alignment-criteria.yaml — criteria
    causal_path:
      root_cause_candidate: axiology 준비 단계에서 필수 canonical authority source set이 컨텍스트로 물질화되지 않은 상태
      root_cause_step_id: axiology-candidate-004.cause-002
      steps:
        - cause_id: axiology-candidate-004.cause-001
          claim: 현재 가치 정렬 기준에는 사용자 요청 목적 하나만 존재한다.
          relation_to_previous: null
          evidence_refs:
            - review-value-alignment-criteria.yaml — criteria[0]
        - cause_id: axiology-candidate-004.cause-002
          claim: 이 제한은 system purpose, role definition, execution rule 참조가 모두 빈 컨텍스트 조립
            상태의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - context-candidate-assembly.yaml — system_purpose_refs
            - context-candidate-assembly.yaml — role_definition_refs
            - context-candidate-assembly.yaml — execution_rule_refs
      unresolved_beyond_evidence: 필수 authority 파일의 실제 내용과 대상과의 정렬 여부는 unit boundary 밖의 추가 증거가 필요하다.
