findings:
  - candidate_id: coverage-candidate-001
    target: clinical-lab-ontology.yaml — analytical execution coverage
    evidence_anchor: materialized-input.md:54-60, 108-119
    claim: Assay가 정의되어 있지만 실제 분석 수행을 나타내는 개념과 관계가 없다.
    what: Assay는 카탈로그 항목으로만 존재하고 Test, Specimen, Result와 연결되지 않는다. 분석 실행, 장비, 방법, 수행
      시각, 수행자, 재검사도 표현되지 않는다.
    why: 주문부터 보고까지의 권위 모델에서 분석 수행 구간이 비어 있으므로, EMR/LIS가 결과가 어떤 검사 방법과 실행에서 생성되었는지
      공통으로 추적할 수 없다.
    how_to_fix: Test와 Assay의 매핑을 정의하고, AssayRun 같은 수행 엔티티에 specimen, assay,
      instrument/method, performed_at, performer, run status를 연결한 뒤 Result의 생성
      근거로 지정한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 주문부터 보고까지의 임상검사 파이프라인을 EMR/LIS 연동의 개념 권위 문서로 제공하는 목적
      failure_condition: 결과 생성 경로 또는 검사 방법·실행 이력을 시스템 간 교환하거나 추적해야 할 때
      impact: 핵심 분석 단계의 공통 표현이 없어 동일 결과의 수행 근거와 추적 가능성을 통합 계약으로 보장할 수 없다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:54-60
        - materialized-input.md:108-119
    causal_path:
      root_cause_candidate: 모델이 분석 카탈로그와 실제 분석 수행 사건을 구분해 표현하지 않았다.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: Assay가 어떤 Test, Specimen, Result와도 관계를 맺지 않는다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:54-60
            - materialized-input.md:108-119
        - cause_id: coverage-candidate-001.cause-002
          claim: 분석 실행을 담을 엔티티와 수행 시각·장비·방법·수행자 속성이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:13-107
        - cause_id: coverage-candidate-001.cause-003
          claim: 분석 카탈로그와 실제 분석 수행 사건을 구분해 표현하지 않았다.
          relation_to_previous: symptom_of
