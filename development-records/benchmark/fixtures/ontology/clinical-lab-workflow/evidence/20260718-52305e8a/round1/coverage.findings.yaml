  - candidate_id: coverage-candidate-004
    target: clinical-lab-ontology.yaml — catalog authority and temporal validity
    evidence_anchor: materialized-input.md:46-60, 126-128
    claim: Test와 Assay의 병행 카탈로그에 단일 권위와 버전·유효기간이 없다.
    what: 신규 항목을 Test와 Assay 양쪽에 등록한다고 명시하지만 어느 쪽이 원본인지, 두 항목이 어떻게 대응되는지, 변경 효력일과
      폐기·단종 이력을 어떻게 보존하는지 정의하지 않는다.
    why: 두 시스템의 코드·명칭·검체 요건이 다르게 변경될 수 있고, 과거 주문과 결과에 당시 적용된 카탈로그 정의를 재구성할 수 없다.
    how_to_fix: 하나의 canonical catalog concept와 소유 시스템을 지정하고 Test–Assay 매핑, 버전,
      valid_from/valid_to, 활성·폐기 lifecycle 및 변경 이력을 추가한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동에서 검사 카탈로그의 공통 개념 권위를 제공하는 목적
      failure_condition: 신규 항목 등록, 코드 변경, 검체 요건 변경 또는 단종이 두 카탈로그에서 서로 다른 시점에 반영될 때
      impact: 통합 계약이 어느 값을 신뢰해야 하는지 결정하지 못하며 과거 결과의 의미도 안정적으로 복원할 수 없다.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:126-128
    causal_path:
      root_cause_candidate: 병행 카탈로그에 대한 canonical source, 매핑, 시간 차원을 모델링하지 않았다.
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: Test와 Assay를 모두 갱신하지만 양자 간 관계와 단일 원본 지정이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:126-128
        - cause_id: coverage-candidate-004.cause-002
          claim: 두 카탈로그 모두 버전, 유효기간, 변경 이력 및 lifecycle이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:46-60
        - cause_id: coverage-candidate-004.cause-003
          claim: 병행 카탈로그에 대한 canonical source, 매핑, 시간 차원을 모델링하지 않았다.
