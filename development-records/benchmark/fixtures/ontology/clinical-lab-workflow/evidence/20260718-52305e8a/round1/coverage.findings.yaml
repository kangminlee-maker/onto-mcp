  - candidate_id: coverage-candidate-002
    target: clinical-lab-ontology.yaml — Result/Report correction lifecycle
    evidence_anchor: materialized-input.md:62-84, 121-124
    claim: 최종 결과의 정정·재발행을 보존할 이력 및 사건 개념이 없다.
    what: Result에는 현재 value와 status만 있고 Report에는 현재 result_status와 released_at만 있다.
      corrected/amended 상태는 있으나 이전 값, 정정 사유, 정정자, 정정 시각, 대체 관계와 재발행 이력이 없다.
    why: 정정이 현재 레코드 덮어쓰기로 구현되면 어느 값이 언제 누구에 의해 왜 변경되었는지 재구성할 수 없고, 야간 동기화 전후에 임상의가 본
      보고서 버전도 식별할 수 없다.
    how_to_fix: 불변 ResultVersion 또는 ResultAmendment/ReportRelease 사건을 추가해 이전 버전, 새
      값, 사유, 행위자, 발생 시각, supersedes 관계와 각 보고서 배포 시점을 기록한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 결과와 보고 상태를 EMR/LIS 간 권위 있게 공유하는 목적
      failure_condition: 최종 결과가 정정되거나 보고서가 개정·재발행될 때
      impact: 과거 임상 의사결정에 사용된 값과 변경 책임을 재구성할 수 없어 상태 계약과 감사 신뢰가 약화된다.
      evidence_refs:
        - materialized-input.md:62-84
        - materialized-input.md:121-124
    causal_path:
      root_cause_candidate: 결과와 보고서를 버전 또는 사건이 아닌 현재 상태 스냅샷으로만 모델링했다.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: corrected/amended 이후의 이전 값, 사유, 행위자, 시각 및 대체 관계가 표현되지 않는다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:62-84
        - cause_id: coverage-candidate-002.cause-002
          claim: 정정 규칙은 현재 상태의 변경과 야간 동기화만 규정한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:121-124
        - cause_id: coverage-candidate-002.cause-003
          claim: 결과와 보고서를 버전 또는 사건이 아닌 현재 상태 스냅샷으로만 모델링했다.
          relation_to_previous: symptom_of
          evidence_refs:
