  - candidate_id: coverage-candidate-005
    target: clinical-lab-ontology.yaml — Specimen lifecycle
    evidence_anchor: materialized-input.md:37-44, 121-124
    claim: Specimen lifecycle이 정상 분석 완료까지만 있고 예외 및 종결 구간이 빠져 있다.
    what: Specimen 상태는 collected, received, in_analysis, analyzed뿐이다. 채취 실패, 미수령,
      부적합·거부, 분실, 재채취, 보관, 폐기 상태는 없고 analyzed 이후 처리는 부서 내규에 위임된다.
    why: 실제 검체가 정상 경로를 벗어나거나 분석 후 보관·폐기될 때 공통 상태로 교환할 수 없어 Order와 Result의 진행 상태 및
      재채취 요구를 일관되게 판단할 수 없다.
    how_to_fix: requested/collection_failed/in_transit/rejected/lost/recollection_required/stored/disposed
      등 필요한 상태 또는 사건을 추가하고, 사유·시각·행위자와 허용 전이를 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문부터 보고까지 검체 흐름을 포함한 임상검사 파이프라인의 개념 권위를 제공하는 목적
      failure_condition: 검체 부적합·분실·재채취 또는 분석 후 보관·폐기가 발생할 때
      impact: 정상 경로 밖의 운영 상태를 EMR/LIS가 공통으로 표현하지 못해 진행·취소·재주문 판단이 시스템별 규칙으로 분기된다.
      evidence_refs:
        - materialized-input.md:37-44
        - materialized-input.md:121-124
    causal_path:
      root_cause_candidate: Specimen lifecycle을 정상 분석 완료 경로로만 한정하고 예외·종결 상태를 모델 밖 정책에 위임했다.
      root_cause_step_id: coverage-candidate-005.cause-003
      steps:
        - cause_id: coverage-candidate-005.cause-001
          claim: Specimen lifecycle에 예외 상태와 analyzed 이후 보관·폐기 상태가 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37-44
            - materialized-input.md:121-124
        - cause_id: coverage-candidate-005.cause-002
          claim: analyzed 이후 처리는 구조화된 개념 없이 부서 내규에 위임된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:121-124
        - cause_id: coverage-candidate-005.cause-003
          claim: Specimen lifecycle을 정상 분석 완료 경로로만 한정하고 예외·종결 상태를 모델 밖 정책에 위임했다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:37-44
            - materialized-input.md:121-124
      unresolved_beyond_evidence: null
