      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: clinical-lab-ontology.yaml — critical-value notification evidence
    evidence_anchor: materialized-input.md:100-106
    claim: CriticalValue 통보의 행위자·시각·수신자·근거가 온톨로지 밖에 있다.
    what: CriticalValue는 notified 불리언만 보유하며 통보 시각과 수신자는 별도 전화 기록 대장에 있다고 서술한다. 통보자,
      통보 방식, 시도·확인·에스컬레이션도 표현되지 않는다.
    why: EMR/LIS 권위 모델만으로는 위험 결과가 실제로 적절한 사람에게 전달되고 확인되었는지 입증하거나 실패·재시도를 구분할 수 없다.
    how_to_fix: CriticalValueNotification 사건을 추가해 관련 Result, 통보자, 수신자, 시각, 방식, 상태,
      확인 시각, 실패/재시도 및 에스컬레이션 근거를 기록하고 전화 대장의 권위·매핑을 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 임상검사 운영의 핵심 통제 행위를 EMR/LIS 통합 권위 모델로 표현하는 목적
      failure_condition: 위험 결과 통보의 완료 여부나 책임·시점을 검증해야 할 때
      impact: 단일 불리언은 통제 수행의 증거가 아니므로 환자안전 관련 통보 상태를 시스템 간 신뢰할 수 없다.
      evidence_refs:
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: 통보를 감사 가능한 사건이 아니라 현재 완료 여부 속성으로만 축약했다.
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: 통보 증거가 notified 불리언과 온톨로지 외부 전화 기록으로 분리되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: coverage-candidate-003.cause-002
          claim: 온톨로지에는 통보 행위자·시각·수신자·확인·재시도 개념이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: coverage-candidate-003.cause-003
          claim: 통보를 감사 가능한 사건이 아니라 현재 완료 여부 속성으로만 축약했다.
