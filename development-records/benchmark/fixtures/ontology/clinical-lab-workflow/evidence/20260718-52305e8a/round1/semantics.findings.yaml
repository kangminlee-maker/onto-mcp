  - candidate_id: semantics-candidate-001
    target: clinical-lab-ontology.yaml — Order/StatOrder 모델
    evidence_anchor: materialized-input.md:15-29 — Order.priority, Order.is_stat,
      StatOrder is_a Order
    claim: STAT가 우선순위·불리언·하위 타입이라는 세 가지 서로 다른 존재론적 방식으로 동시에 표현된다.
    what: 동일한 STAT 의미가 `priority=stat`, `is_stat=true`, `StatOrder` 인스턴스 여부로 중복되며,
      이들 사이의 동치 조건이나 권위가 정의되지 않았다. 특히 변경 가능한 주문 우선순위를 Order의 본질적 하위 유형처럼 모델링했다.
    why: 세 표현이 독립적으로 기록되면 서로 모순될 수 있다. EMR과 LIS가 서로 다른 표현을 권위로 사용하면 긴급 라우팅, SLA 및 화면
      표시가 달라질 수 있다.
    how_to_fix: "`priority`를 STAT 여부의 단일 권위로 정하고 `is_stat`은 파생값으로 정의하거나 제거한다.
      `StatOrder`가 필요하다면 별도 하위 타입이 아니라 `priority=stat`인 Order의 명명된 뷰/제약으로 정의하고
      `stat_reason`의 적용 조건을 명시한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동의 주문 우선순위에 대한 개념 권위 제공
      failure_condition: 연동 시스템이 STAT의 세 표현 중 서로 다른 값을 읽거나 일부만 갱신할 때
      impact: 동일 주문의 긴급성이 시스템별로 달라져 운영 우선순위와 임상 대응을 신뢰할 수 없게 된다.
      evidence_refs:
        - materialized-input.md:21-29
    causal_path:
      root_cause_candidate: STAT라는 하나의 상태성 분류에 복수의 독립 권위 표현을 부여하고 동치 제약을 정의하지 않았다.
      root_cause_step_id: semantics-candidate-001.cause-002
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: Order에 `priority=stat`와 `is_stat`가 함께 저장되고 StatOrder 하위 타입도 존재한다.
