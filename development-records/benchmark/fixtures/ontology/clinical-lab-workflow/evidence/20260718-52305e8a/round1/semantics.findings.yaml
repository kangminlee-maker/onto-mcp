  - candidate_id: semantics-candidate-002
    target: clinical-lab-ontology.yaml — Test/Assay 개념
    evidence_anchor: materialized-input.md:46-60,126-127 — 주문 가능 Test, 수행 단위 Assay, 신규 항목 이중 등록
    claim: 서로 다른 추상화 수준인 Test와 Assay의 의미적 대응을 정하지 않은 채 이중 등록을 요구한다.
    what: Test는 주문 가능한 카탈로그 단위, Assay는 분석기 수행 단위로 정의되어 서로 구별되지만, 관계나 대응 cardinality
      없이 신규 항목을 양쪽에 등록한다. 동시에 향후 ‘통합 여부’를 검토한다고 하여 두 개념이 동의어인지 별개인지도 확정되지 않았다.
    why: 주문 항목과 실제 수행 항목은 일대일이라고 보장되지 않는다. 명시적 매핑 없이 코드가 양쪽에 생성되면 EMR 주문이 어떤 LIS 수행
      단위 및 결과와 대응하는지 시스템별 해석이 달라질 수 있다.
    how_to_fix: Test를 orderable, Assay를 executable procedure로 명확히 유지하고 둘 사이의 명시적 매핑
      관계와 cardinality를 정의한다. 실제로 동의어인 로컬 항목만 별칭/동일성 매핑으로 처리하고 전면 이중 등록 정책은 제거한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문 카탈로그와 LIS 수행 카탈로그 사이의 개념 권위 제공
      failure_condition: 하나의 주문 가능 항목이 여러 assay로 수행되거나 여러 Test가 같은 assay를 공유할 때
      impact: 주문·수행·결과 코드의 대응이 비결정적이 되어 연동 매핑이 개별 구현 관행에 의존한다.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: Orderable 개념과 executable 개념의 동일성 여부 및 대응 관계를 결정하지 않았다.
      root_cause_step_id: semantics-candidate-002.cause-002
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: Test와 Assay가 각각 주문 단위와 수행 단위로 다르게 정의되지만 신규 항목은 모두 양쪽에 등록된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:126-127
        - cause_id: semantics-candidate-002.cause-002
          claim: 두 개념 사이의 의미적 매핑 없이 통합 가능성만 미결정 상태로 남아 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:126-127
      unresolved_beyond_evidence: 실제 로컬 카탈로그에서 Test와 Assay가 일대일인지 여부는 현재 경계의 증거로 확인할 수 없다.
  - candidate_id: semantics-candidate-003
    target: clinical-lab-ontology.yaml — 검체 종류 어휘
    evidence_anchor: materialized-input.md:37-60 —
      Specimen.specimen_type/Test.requires_specimen_type enum과
      Assay.specimen_kind 자유 문자열
    claim: 검체의 상위 물질 유형과 세부 검체 종류를 같은 의미처럼 사용하면서 호환되지 않는 값 체계를 둔다.
    what: Specimen과 Test는 `blood/urine/tissue/swab` 열거형을 사용하지만 Assay는
      `WB/Serum/Urine-random` 같은 자유 문자열을 사용한다. `blood`와 `WB` 또는 `Serum`은 동일한 분류
      수준이 아니며 명시적 매핑도 없다.
    why: 이 값들을 직접 비교하면 유효한 조합이 불일치로 판정되거나 부적합한 검체가 허용될 수 있다. EMR의 상위 분류와 LIS의 세부
      specimen matrix가 동일 필드처럼 취급될 위험이 있다.
    how_to_fix: 상위 specimen material/category와 세부 specimen matrix를 별도 개념으로 정의하고 통제
      어휘를 사용한다. Assay 요구사항이 참조할 canonical specimen concept 및 로컬 코드 매핑을 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR 주문 검체 요건과 LIS assay 검체 요건의 일관된 교환
      failure_condition: 연동 로직이 서로 다른 수준과 형식의 검체 값을 동등 비교할 때
      impact: 검체 적합성 판단과 주문-수행 매핑이 시스템별 문자열 해석에 따라 달라진다.
      evidence_refs:
        - materialized-input.md:37-60
    causal_path:
      root_cause_candidate: 검체의 상위 분류와 세부 처리·매트릭스 개념을 분리하지 않고 서로 다른 어휘로 표현했다.
      root_cause_step_id: semantics-candidate-003.cause-002
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: 동일 워크플로의 검체 관련 속성이 열거형과 자유 문자열로 나뉘며 값의 추상화 수준도 다르다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:42-60
        - cause_id: semantics-candidate-003.cause-002
          claim: 두 값 체계 사이의 canonical 의미와 매핑 관계가 정의되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:42-60
      unresolved_beyond_evidence: 실제 EMR/LIS 로컬 검체 코드셋은 현재 경계에서 확인할 수 없다.
  - candidate_id: semantics-candidate-004
    target: clinical-lab-ontology.yaml — Result.status와 Report.result_status
    evidence_anchor: materialized-input.md:62-84,121-123 — 동일 정보라는 설명, 상이한 상태 어휘, 야간 동기화
    claim: 결과 상태와 보고서 상태를 ‘동일 정보’라고 선언하면서 서로 다른 의미와 지연된 권위를 부여한다.
    what: Result는 `preliminary/final/corrected`, Report는 `prelim/finalized/amended`를
      사용한다. 개별 결과의 correction과 보고서 전체의 amendment는 범위가 다른 사건인데 동일 정보로 설명되며,
      Report 값은 임상의가 신뢰하는 권위 값이면서 야간에만 동기화된다.
    why: 한 보고서에 여러 결과가 포함될 때 일부 결과의 corrected 상태를 보고서 단일 상태로 투영하는 의미가 불명확하다. 야간 전까지
      Report가 finalized인 채 corrected Result를 포함할 수 있어 권위 문서 자체가 상충 상태를 허용한다.
    how_to_fix: Result 상태와 Report 상태를 별도 개념으로 유지하고 의미·전이·집계 규칙을 각각 정의한다. Report 상태가
      파생된다면 contained Result 및 amendment event에서 즉시 계산되는 단일 규칙으로 만들고, 임상 표시의 권위가
      어느 개념인지 하나로 정한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 임상의에게 전달되는 결과 최종성·정정 여부의 개념 권위 제공
      failure_condition: Result가 corrected된 뒤 야간 배치 전이거나 여러 Result 상태가 혼재할 때
      impact: 임상의가 권위 값으로 신뢰하도록 정의된 Report가 실제 결과 정정 상태를 반영하지 않아 환자 진료 판단에 오래된 의미를 제공할
        수 있다.
      evidence_refs:
        - materialized-input.md:69-84
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: 서로 다른 집계 범위의 Result 상태와 Report 상태를 별개 개념이 아닌 복제된 동일 정보로 취급했다.
      root_cause_step_id: semantics-candidate-004.cause-002
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: Result와 Report가 서로 다른 상태 어휘를 가지면서 동일 정보를 유지한다고 설명된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-84
        - cause_id: semantics-candidate-004.cause-002
          claim: 복제된 Report 상태가 임상 권위로 지정되고 정정 반영은 야간 배치에 의존한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:80-84
            - materialized-input.md:121-123
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-005
    target: clinical-lab-ontology.yaml — CriticalValue 엔티티
    evidence_anchor: materialized-input.md:100-106 — 위험 범위와 notified 상태의 결합
    claim: CriticalValue가 임계값 규칙과 개별 통보 사건을 하나의 엔티티로 혼합한다.
    what: 정의와 lower/upper bound는 Test별 위험 임계값 규칙을 뜻하지만 `notified`는 특정 환자 결과에 대한 통보
      완료 상태를 뜻한다. 엔티티에는 Result, 환자, 발생 시각 또는 수신자 참조가 없어 `notified`가 어느 사건에 대한
      것인지 식별할 수 없다.
    why: 공유 임계값 규칙의 불리언을 변경하면 모든 환자 결과에 통보된 것처럼 해석될 수 있다. 반대로 환자별 통보 이력을 독립적으로 표현할 수
      없어 운영 감사와 미통보 탐지가 왜곡된다.
    how_to_fix: Test별 `CriticalThreshold` 규칙과 특정 Result에 대한
      `CriticalResult/Notification` 사건을 분리한다. 통보 사건에는 Result 참조, 발생·통보 시각, 수신자 및
      상태를 두고 임계값 규칙은 판정 기준만 보유하게 한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 위험 결과 판정과 즉시 통보 상태의 개념 권위 제공
      failure_condition: 같은 Test의 임계값이 여러 환자 Result에 적용되거나 통보가 결과별로 발생할 때
      impact: 임계 규칙과 환자별 통보 완료 여부를 구별할 수 없어 미통보 위험 관리 및 감사 기록을 신뢰할 수 없다.
      evidence_refs:
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: 재사용되는 판정 규칙과 시간에 발생하는 개별 통보 사건을 하나의 존재론적 유형으로 모델링했다.
      root_cause_step_id: semantics-candidate-005.cause-002
      steps:
        - cause_id: semantics-candidate-005.cause-001
          claim: CriticalValue는 범위 경계를 가지면서 동시에 단일 `notified` 불리언을 가진다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: semantics-candidate-005.cause-002
          claim: 통보 상태를 귀속할 Result 또는 통보 사건 식별자가 엔티티에 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100-106
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-006
    target: clinical-lab-ontology.yaml — Specimen/Result 관계
    evidence_anchor: materialized-input.md:118-119 — Result derived_from Specimen과
      Specimen produces Result
    claim: Specimen을 Result의 생산자로 명명해 검체와 검사 수행 행위의 의미를 혼동한다.
    what: Result가 Specimen에서 유래한다는 관계의 역방향을 `Specimen produces Result`로 표현했다. 그러나 대상
      자체는 Assay를 분석기에서 수행되는 단위로 정의하므로 Specimen은 수행 주체가 아니라 분석 입력물에 가깝다.
    why: "`produces`를 문자 그대로 권위 관계로 사용하면 결과 생성 행위와 책임이 Specimen에 귀속되고, Assay/Test
      수행과 Result 사이의 의미적 연결이 흐려진다. 이벤트·추적성 모델을 구현할 때 잘못된 원인 관계가 확산될 수 있다."
    how_to_fix: Specimen→Result는 `is_source_for` 또는 `has_derived_result`처럼
      provenance 의미로 명명한다. 결과 생성은 별도의 Test/Assay execution 개념에 귀속하고 그 실행이
      Specimen을 입력으로 사용해 Result를 산출하도록 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 검체·수행·결과 provenance의 개념 권위 제공
      failure_condition: 연동 또는 감사 모델이 `produces` 관계를 결과 생성 행위의 권위로 해석할 때
      impact: 실제 수행 단위가 빠진 채 검체가 결과 생성자로 취급되어 추적성과 책임 의미가 왜곡된다.
      evidence_refs:
        - materialized-input.md:54-60
        - materialized-input.md:118-119
    causal_path:
      root_cause_candidate: provenance의 역관계를 행위적 생산 관계로 치환하고 검사 실행 개념을 결과 생성 관계에서 생략했다.
      root_cause_step_id: semantics-candidate-006.cause-002
      steps:
        - cause_id: semantics-candidate-006.cause-001
          claim: Result→Specimen은 `derived_from`인데 역방향은 `produces`로 명명된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:118-119
        - cause_id: semantics-candidate-006.cause-002
          claim: 분석 수행 단위로 정의된 Assay가 Result 생성 관계에 참여하지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:54-60
            - materialized-input.md:108-119
      unresolved_beyond_evidence: null
