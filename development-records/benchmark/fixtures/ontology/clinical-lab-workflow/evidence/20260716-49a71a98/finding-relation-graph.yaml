    confidence: high
  - relation_id: rel-009
    from_finding_id: finding-010
    to_finding_id: finding-013
    relation: same_root_candidate
    root_hypothesis: The status vocabulary mismatch is the same underlying concept
      split that causes both semantic ambiguity and future evolution burden.
    shared_cause: null
    rationale: Finding-010 frames the duplicate enums as an extensibility problem;
      finding-013 frames them as a semantic authority problem. Both depend on
      different status enum names, separate authority wording, and only partial
      synchronization semantics.
    confidence: high
  - relation_id: rel-010
    from_finding_id: finding-011
    to_finding_id: finding-019
    relation: shared_cause_candidate
    root_hypothesis: "Order completion is under-modeled because the rule depends on
      Results without a stable, explicit completion basis: both the result set
      and the result terminal-state semantics are insufficiently specified."
    shared_cause:
      cause_claim: The ontology defines Order.completed by an aggregate over
        Result.status while omitting the structural or state semantics needed to
        evaluate that aggregate unambiguously over time.
      from_cause_ref: finding-011.cause-001
      to_cause_ref: finding-019.cause-001
    rationale: Finding-011 shows the aggregate predicate can become false after a
      permitted correction; finding-019 shows the aggregate's Result set is not
      structurally scoped to Order. Both attack the same completion rule from
      temporal/state and graph-scope angles.
    confidence: medium
  - relation_id: rel-011
    from_finding_id: finding-001
    to_finding_id: finding-011
    relation: shared_cause_candidate
    root_hypothesis: Correction is modeled as a late mutation to Result.status
      without a full post-release amendment workflow, producing both stale
      report authority and inconsistent completed-order semantics.
    shared_cause:
      cause_claim: The ontology permits Result.status to change to corrected after
        release/completion without modeling all downstream state transitions
        immediately and explicitly.
      from_cause_ref: finding-001.cause-002
      to_cause_ref: finding-011.cause-002
    rationale: Finding-001 concerns the delayed Report.result_status update after
      correction; finding-011 concerns the effect of the same correction on an
      already completed Order. Both rely on the correction event being
      under-specified downstream.
    confidence: medium
  - relation_id: rel-012
    from_finding_id: finding-003
    to_finding_id: finding-006
    relation: shared_cause_candidate
    root_hypothesis: TAT is defined as a cross-system metric but left outside the
      ontology's authoritative, versioned rule model, causing both authority
      drift and historical reconstruction risk.
    shared_cause:
      cause_claim: TAT is described in notes while its executable calculation formula
        is maintained externally by the dashboard team, with no ontology-owned
        calculation-rule concept or version.
      from_cause_ref: finding-003.cause-002
      to_cause_ref: finding-006.cause-003
    rationale: Finding-003 focuses on shared-authority drift from dashboard-owned
      TAT calculation. Finding-006 includes TAT among time-dependent concepts
      lacking effective-period/history coverage. Both cite the same external
      formula ownership.
    confidence: high
  - relation_id: rel-013
