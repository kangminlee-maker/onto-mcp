relations:
  - relation_id: rel-001
    from_finding_id: finding-002
    to_finding_id: finding-004
    relation: duplicates
    root_hypothesis: The critical-value notification issue is the same defect if the
      ontology's only in-scope notification representation is a boolean while
      recipient/time/acknowledgement evidence is outside the authority model.
    shared_cause: null
    rationale: Both findings target CriticalValue notification modeling, cite the
      modeled `notified` boolean and external phone log evidence, and conclude
      that EMR/LIS consumers lack authoritative notification evidence for audit
      and safety-critical workflow handling.
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-004
    to_finding_id: finding-018
    relation: same_root_candidate
    root_hypothesis: CriticalValue was modeled as a threshold/flag object without an
      attached notification/result workflow event, causing both evidence
      coverage loss and graph disconnection.
    shared_cause: null
    rationale: "Finding-004 identifies the missing notification evidence concept;
      finding-018 identifies that CriticalValue is omitted from workflow
      relations. Both follow from the same modeling choice: keeping
      CriticalValue and notification state outside the result/report workflow
      graph."
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-002
    to_finding_id: finding-016
    relation: same_root_candidate
    root_hypothesis: The model conflates critical threshold, actual critical result,
      and notification completion in one CriticalValue concept, making
      notification evidence insufficient and the concept semantically ambiguous.
    shared_cause: null
    rationale: Finding-002 focuses on the lossy notification boolean and external
      evidence; finding-016 explains why the CriticalValue concept itself mixes
      threshold range, patient-result criticality, and notified state. The
      semantic conflation plausibly produces the auditability gap.
    confidence: high
  - relation_id: rel-004
    from_finding_id: finding-016
    to_finding_id: finding-018
    relation: enables
    root_hypothesis: If CriticalValue combines threshold and workflow notification
      state without a separate critical-result or notification-event concept,
      the relation graph has no clear entity to connect to Result/Report.
    shared_cause: null
    rationale: Finding-016's root cause is the merged CriticalValue concept.
      Finding-018's structural gap is enabled by that merge because the model
      lacks a distinct workflow event or critical-result instance that could
      naturally attach to Result, Report, Staff, or notification records.
    confidence: medium
  - relation_id: rel-005
    from_finding_id: finding-001
    to_finding_id: finding-007
    relation: symptom_of
    root_hypothesis: The stale clinician-facing report-status window is a symptom of
      the broader missing canonical status authority/projection model between
      Result.status and Report.result_status.
    shared_cause: null
    rationale: "Finding-001 describes the operational failure during nightly
      correction synchronization. Finding-007 generalizes the cause: duplicated
      status carriers without explicit authority, freshness, or synchronization
      event semantics."
    confidence: high
  - relation_id: rel-006
    from_finding_id: finding-007
    to_finding_id: finding-010
    relation: same_root_candidate
    root_hypothesis: Result and Report status are duplicated as separate enum
      carriers without a canonical mapping/projection model, so both current
      synchronization safety and future status evolution break.
    shared_cause: null
    rationale: Finding-007 is a coverage/status-authority issue and finding-010 is
      an evolution/status-continuity issue. Both cite the two status enum
      domains and nightly corrected-to-amended synchronization rule as the
      source of integration risk.
    confidence: high
  - relation_id: rel-007
    from_finding_id: finding-012
    to_finding_id: finding-013
    relation: duplicates
    root_hypothesis: The two findings report the same defect if Result.status and
      Report.result_status are claimed to maintain the same information but use
      non-identical enums without a total equivalence mapping.
    shared_cause: null
    rationale: Both findings center on non-identical status vocabularies, the
      same-information claim, clinician-facing authority wording, and the
      partial corrected-to-amended synchronization rule. The lens framing
      differs, but the defect and remedy are effectively the same.
    confidence: high
  - relation_id: rel-008
    from_finding_id: finding-007
    to_finding_id: finding-012
    relation: shared_cause_candidate
    root_hypothesis: The status authority coverage gap and formal synchronization
