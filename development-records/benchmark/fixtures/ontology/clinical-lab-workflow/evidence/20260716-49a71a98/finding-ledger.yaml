      Result.status가 corrected로 바뀌면 Report.result_status는 amended가 되어야 한다(동기화
      배치는 야간 1회)."'
    claim: The rule obligates Report.result_status to be amended when any
      Result.status becomes corrected, but the ontology also records the same
      status information in two non-identical enum domains, leaving
      same-information synchronization under-specified as a formal constraint.
    lens_rationale_summary: "This is not merely naming preference: the ontology
      asserts duplicate maintenance of the same information while declaring two
      different enum domains. A model instance can satisfy each enum locally,
      but the cross-field sameness claim lacks the explicit equivalence relation
      needed to satisfy the synchronization obligation for all allowed states.
      For an authority document, that creates conflicting implementer
      interpretations about which field is authoritative and when mismatched
      statuses are valid."
    proposed_action: "Add a total status mapping table or unify the enum. For
      example: preliminary <-> prelim, final <-> finalized, corrected <->
      amended, plus rules for multiple Results in one Report. Also clarify
      whether Report.result_status is derived from Result.status or is the
      authority with an explicit propagation rule."
    affected_purpose: Conceptual authority for EMR/LIS status synchronization
      between LIS result state and clinician-facing report state.
    failure_condition: Any implementation must decide whether and how Result.status
      and Report.result_status represent the same status information outside the
      single corrected -> amended case.
    impact: Because the ontology gives two enum sets for the same maintained
      information without a total equivalence relation, different systems can
      satisfy local enum constraints while disagreeing on valid cross-system
      state, undermining integration precedence and invalid-input behavior.
