findings:
  - finding_id: finding-001
    lens_id: axiology
    source_ref: .onto/review/20260716-49a71a98/round1/axiology.findings.yaml#axiology-candidate-001
    target: clinical-lab-ontology.yaml / Report.result_status correction propagation
    evidence_anchor: .onto/review/20260716-49a71a98/execution-preparation/materialized-input.md:80-83,121-123;
      .onto/review/20260716-49a71a98/execution-preparation/review-value-alignment-criteria.yaml:5-7
    claim: Nightly correction synchronization is misaligned with the ontology's
      stated clinician-trust commitment for report status.
    lens_rationale_summary: The review purpose is to judge suitability as an EMR/LIS
      conceptual authority document. Within the target itself, the report status
      is explicitly presented as the trusted authority for clinicians, so
      accepting delayed propagation of corrected results without modeling the
      delay as a risk, pending state, or notification obligation weakens that
      purpose-critical commitment.
    proposed_action: "Make correction propagation part of the authoritative
      workflow: define an immediate or bounded transition from
      `Result.status=corrected` to `Report.result_status=amended`, add a visible
      pending-correction state if batch delay is intentional, and specify
      clinician-facing notification/visibility requirements during the delay."
    affected_purpose: Use the ontology as the concept authority document for EMR/LIS
      integration, especially entity, relation, and state-model validity and
      operational risk.
    failure_condition: A corrected LIS result exists after report release, but the
      clinician-facing authoritative `Report.result_status` remains `finalized`
      until the nightly batch runs.
    impact: The document's own trust promise for report status is weakened at the
      exact point where EMR/LIS consumers need a reliable authority for
      corrected clinical information.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:80-83
      - materialized-input.md:121-123
      - review-value-alignment-criteria.yaml:5-7
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology as the concept authority document for EMR/LIS
        integration, especially entity, relation, and state-model validity and
        operational risk.
      failure_condition: A corrected LIS result exists after report release, but the
        clinician-facing authoritative `Report.result_status` remains
        `finalized` until the nightly batch runs.
      impact: The document's own trust promise for report status is weakened at the
        exact point where EMR/LIS consumers need a reliable authority for
        corrected clinical information.
      evidence_refs:
        - materialized-input.md:80-83
        - materialized-input.md:121-123
        - review-value-alignment-criteria.yaml:5-7
    causal_path:
      root_cause_candidate: The ontology accepts an unstated operational tradeoff that
        lets batch synchronization lag behind the clinician-trusted report
        authority.
      root_cause_step_id: finding-001.cause-003
      steps:
        - cause_id: finding-001.cause-001
          claim: The target declares `Report.result_status` to be the authoritative report
            status trusted by clinicians.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:80-83
        - cause_id: finding-001.cause-002
          claim: The state rule allows corrected result status to update the report status
            only via a nightly synchronization batch.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:121-123
        - cause_id: finding-001.cause-003
          claim: That delay can leave the clinician-facing authority stale during the
            correction window, contradicting the declared EMR/LIS authority
            purpose.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:5-7
            - materialized-input.md:80-83
            - materialized-input.md:121-123
      unresolved_beyond_evidence: The bounded material does not state the maximum
        nightly delay, escalation process, or whether another production control
        compensates for the stale status window.
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260716-49a71a98/round1/axiology.findings.yaml#axiology-candidate-002
    target: clinical-lab-ontology.yaml / CriticalValue notification model
    evidence_anchor: .onto/review/20260716-49a71a98/execution-preparation/materialized-input.md:100-106;
      .onto/review/20260716-49a71a98/execution-preparation/review-value-alignment-criteria.yaml:5-7
    claim: Critical-value handling is reduced to a boolean while the notification
      evidence is externalized, misaligning the model with its operational-risk
      purpose.
    lens_rationale_summary: For an EMR/LIS integration authority document, the
      operationally important commitment is not merely whether notification
      happened but whether it happened immediately, to whom, and with traceable
      evidence. The current model treats that evidence as outside the authority
      boundary while still modeling the boolean, creating an under-justified
      tradeoff against auditability and handoff reliability.
    proposed_action: Model critical-value notification as an explicit entity or
      relation with timestamp, recipient, notifier, channel, acknowledgement,
      and status; if a phone log remains authoritative, add a named relation and
      synchronization/ownership rule instead of a standalone boolean.
    affected_purpose: Use the ontology to guide EMR/LIS integration around
      operational risks in the clinical lab workflow.
    failure_condition: A consuming system sees `notified=true` without authoritative
      recipient/time/acknowledgement data or a governed link to the phone log.
    impact: The ontology can certify the surface completion of a critical
      notification while omitting the evidence needed to operate, audit, or
      reconcile the safety-critical workflow across EMR/LIS boundaries.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:100-106
      - review-value-alignment-criteria.yaml:5-7
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology to guide EMR/LIS integration around
        operational risks in the clinical lab workflow.
      failure_condition: A consuming system sees `notified=true` without authoritative
        recipient/time/acknowledgement data or a governed link to the phone log.
      impact: The ontology can certify the surface completion of a critical
        notification while omitting the evidence needed to operate, audit, or
        reconcile the safety-critical workflow across EMR/LIS boundaries.
      evidence_refs:
        - materialized-input.md:100-106
        - review-value-alignment-criteria.yaml:5-7
    causal_path:
      root_cause_candidate: The ontology places the evidence-bearing notification
        record outside the modeled authority while retaining only a lossy
        completion flag.
      root_cause_step_id: finding-002.cause-003
      steps:
        - cause_id: finding-002.cause-001
          claim: The target defines `CriticalValue` as requiring immediate notification.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-101
        - cause_id: finding-002.cause-002
          claim: "The only modeled notification attribute is `notified: boolean`;
            notification time and recipient are stated to reside in a separate
            phone record ledger."
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:102-106
        - cause_id: finding-002.cause-003
          claim: This prevents the ontology from acting as a sufficient EMR/LIS authority
            for critical-value notification state and accountability.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:5-7
            - materialized-input.md:100-106
      unresolved_beyond_evidence: The bounded material does not show the external
        phone log schema or any integration contract that would restore
        authority for notification evidence.
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260716-49a71a98/round1/axiology.findings.yaml#axiology-candidate-003
    target: clinical-lab-ontology.yaml / turnaround_time ownership
    evidence_anchor: .onto/review/20260716-49a71a98/execution-preparation/materialized-input.md:6-8,126-128;
      .onto/review/20260716-49a71a98/execution-preparation/review-value-alignment-criteria.yaml:5-7
    claim: Delegating TAT calculation to a dashboard-owned formula drifts from the
      ontology's concept-authority purpose.
    lens_rationale_summary: "TAT is defined in the target as `collected_at` to
      `released_at`, so letting another consumer maintain its own calculation
      creates a hidden local optimization: dashboards can evolve a metric
      separately from the concept authority that integrations are supposed to
      share."
    proposed_action: Promote TAT to an authoritative derived concept or metric rule
      in the ontology, name the owning timestamps and edge cases, and require
      downstream dashboards to consume or mirror that rule with explicit
      versioning.
    affected_purpose: Use the ontology as a shared conceptual authority for EMR/LIS integration.
    failure_condition: Dashboard, EMR, and LIS consumers compute TAT differently
      because the ontology defines the metric informally while ownership remains
      local to the dashboard team.
    impact: A key workflow metric can diverge across systems, reducing the
      ontology's usefulness as a shared authority for operational
      interpretation.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:6-8
      - materialized-input.md:126-128
      - review-value-alignment-criteria.yaml:5-7
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology as a shared conceptual authority for EMR/LIS
        integration.
      failure_condition: Dashboard, EMR, and LIS consumers compute TAT differently
        because the ontology defines the metric informally while ownership
        remains local to the dashboard team.
      impact: A key workflow metric can diverge across systems, reducing the
        ontology's usefulness as a shared authority for operational
        interpretation.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:126-128
        - review-value-alignment-criteria.yaml:5-7
    causal_path:
      root_cause_candidate: The ontology defines a cross-system metric but leaves its
        executable ownership outside the authority document.
      root_cause_step_id: finding-003.cause-003
      steps:
        - cause_id: finding-003.cause-001
          claim: The target declares itself intended as the EMR/LIS integration concept
            authority document.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:6-8
        - cause_id: finding-003.cause-002
          claim: The notes define TAT but state the dashboard team maintains its own
            calculation formula.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:126-128
        - cause_id: finding-003.cause-003
          claim: External metric ownership enables divergent local calculations, weakening
            shared concept authority.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:5-7
            - materialized-input.md:126-128
      unresolved_beyond_evidence: The bounded material does not provide the dashboard
        formula, so the finding is about authority drift risk rather than a
        proven numerical mismatch.
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260716-49a71a98/round1/coverage.findings.yaml#coverage-candidate-001
    target: clinical-lab-ontology.yaml / CriticalValue notification model
    evidence_anchor: 'CriticalValue.attributes.notified note: "통보 완료 여부. 통보 시각과 수신자는
      전화 기록 대장에 있다."'
    claim: Critical-value notification is modeled only as a boolean and omits the
      notification evidence concept needed for EMR/LIS authority.
    lens_rationale_summary: Critical-value notification is a controlled clinical
      action. A boolean cannot reconstruct who notified whom, when, on what
      basis, and whether the notice was acknowledged. For a concept authority
      document used in EMR/LIS integration, leaving that evidence concept
      outside the model weakens downstream auditability and patient-safety
      workflows.
    proposed_action: Add a CriticalValueNotification or NotificationEvent entity
      related to CriticalValue/Result/Order, with notifier, recipient,
      notified_at, channel, acknowledgement status/time, escalation fields, and
      source-system authority. Replace or derive notified from that event
      instead of making it the only modeled fact.
    affected_purpose: Use as the conceptual authority document for EMR/LIS
      integration from order through report, including operational risk
      concepts.
    failure_condition: When a critical result must be communicated or audited, the
      ontology can only represent a completed/not-completed flag while the
      actor, time, recipient, and acknowledgement evidence are outside the
      modeled concept space.
    impact: Implementers may integrate only a lossy boolean status, making
      critical-result communication non-reconstructable and weakening clinical
      audit, escalation, and dispute handling.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/coverage.findings.yaml#coverage-candidate-001
      - CriticalValue.attributes.notified note
      - CriticalValue entity lacks notification event attributes or relations
      - Request summary asks for operational risks around entity, relation, and
        state model
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use as the conceptual authority document for EMR/LIS
        integration from order through report, including operational risk
        concepts.
      failure_condition: When a critical result must be communicated or audited, the
        ontology can only represent a completed/not-completed flag while the
        actor, time, recipient, and acknowledgement evidence are outside the
        modeled concept space.
      impact: Implementers may integrate only a lossy boolean status, making
        critical-result communication non-reconstructable and weakening clinical
        audit, escalation, and dispute handling.
      evidence_refs:
        - CriticalValue.attributes.notified note
        - CriticalValue entity lacks notification event attributes or relations
        - Request summary asks for operational risks around entity, relation,
          and state model
    causal_path:
      root_cause_candidate: The ontology treats critical-value notification as an
        attribute of the threshold concept instead of modeling the controlled
        notification action as its own evidence-bearing event.
      root_cause_step_id: finding-004.cause-003
      steps:
        - cause_id: finding-004.cause-001
          claim: CriticalValue contains threshold fields and a boolean notified flag, but
            no notification event or relation to Staff/clinician/recipient.
          relation_to_previous: null
          evidence_refs:
            - CriticalValue.attributes.test_ref/lower_bound/upper_bound/notified
        - cause_id: finding-004.cause-002
          claim: The only mentioned notification details, time and recipient, are
            described as existing in a separate phone log outside the ontology.
          relation_to_previous: symptom_of
          evidence_refs:
            - "CriticalValue.attributes.notified note: 통보 시각과 수신자는 전화 기록 대장에 있다."
        - cause_id: finding-004.cause-003
          claim: Because the evidence-bearing action is outside the concept model, the
            ontology cannot serve as the integration authority for
            critical-value notification audit semantics.
          relation_to_previous: causes
          evidence_refs:
            - "Ontology header: EMR/LIS 연동 설계의 개념 권위 문서로 사용 예정"
            - CriticalValue notification evidence omission
      unresolved_beyond_evidence: null
  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260716-49a71a98/round1/coverage.findings.yaml#coverage-candidate-002
    target: clinical-lab-ontology.yaml / Specimen lifecycle
    evidence_anchor: 'Specimen.lifecycle: [collected, received, in_analysis,
      analyzed]; state_rules: "Specimen이 analyzed가 된 뒤의 보관/폐기 처리는 각 부서 내규를
      따른다."'
    claim: Specimen lifecycle stops at analyzed and omits post-analysis storage,
      retention, disposal, and exception states.
    lens_rationale_summary: Specimen handling does not end at analysis in
      operational workflows. Post-analysis storage, retention, disposal, and
      possible retrieval/retest are lifecycle concepts that EMR/LIS integration
      may need to coordinate or audit. Delegating them to local policy leaves a
      coverage gap in the concept authority document.
    proposed_action: Extend Specimen lifecycle with post-analysis states such as
      stored, retained, disposed, rejected, lost, or recalled as appropriate,
      and add retention/disposal event concepts with actor, time, reason, and
      department policy reference if policy variability must remain.
    affected_purpose: A complete clinical lab workflow ontology from order to report
      that can guide operational EMR/LIS integration.
    failure_condition: After Specimen reaches analyzed, the model has no canonical
      state or event vocabulary for storage, retention, disposal, or
      post-analysis exceptions.
    impact: Systems using the ontology may diverge on specimen end-of-life
      semantics, making retention, disposal audit, retesting, and exception
      handling inconsistent across departments.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/coverage.findings.yaml#coverage-candidate-002
      - "Specimen.lifecycle: [collected, received, in_analysis, analyzed]"
      - state_rules post-analysis storage/disposal delegated to department policy
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: A complete clinical lab workflow ontology from order to report
        that can guide operational EMR/LIS integration.
      failure_condition: After Specimen reaches analyzed, the model has no canonical
        state or event vocabulary for storage, retention, disposal, or
        post-analysis exceptions.
      impact: Systems using the ontology may diverge on specimen end-of-life
        semantics, making retention, disposal audit, retesting, and exception
        handling inconsistent across departments.
      evidence_refs:
        - "Specimen.lifecycle: [collected, received, in_analysis, analyzed]"
        - state_rules post-analysis storage/disposal delegated to department
          policy
    causal_path:
      root_cause_candidate: The ontology bounds Specimen lifecycle to the analytical
        phase and leaves end-of-life handling outside the shared concept model.
      root_cause_step_id: finding-005.cause-003
      steps:
        - cause_id: finding-005.cause-001
          claim: Specimen lifecycle enumerates only collected, received, in_analysis, and
            analyzed.
          relation_to_previous: null
          evidence_refs:
            - Specimen.lifecycle
        - cause_id: finding-005.cause-002
          claim: The only post-analyzed handling rule says storage/disposal follows each
            department's internal rules, without modeling shared states or
            events.
          relation_to_previous: causes
          evidence_refs:
            - state_rules post-analysis storage/disposal sentence
        - cause_id: finding-005.cause-003
          claim: This leaves the integration authority without canonical post-analysis
            lifecycle concepts for specimen end-of-life operations.
          relation_to_previous: causes
          evidence_refs:
            - Ontology header declares concept model for hospital lab pipeline
              and EMR/LIS integration authority
      unresolved_beyond_evidence: null
  - finding_id: finding-006
    lens_id: coverage
    source_ref: .onto/review/20260716-49a71a98/round1/coverage.findings.yaml#coverage-candidate-003
    target: clinical-lab-ontology.yaml / Test, Assay, CriticalValue, and TAT
      reference data
    evidence_anchor: 'Test and Assay catalog attributes lack effective
      dates/history; CriticalValue has bounds but no effective period; notes:
      "현재 신규 항목은 두 곳 모두에 등록한다" and "대시보드 팀이 자체 계산식을 유지한다."'
    claim: Time-dependent catalog, threshold, and calculation concepts lack
      effective-period and history coverage.
    lens_rationale_summary: Catalog definitions, assay mappings, critical
      thresholds, units, and TAT formulas are time-dependent operational facts.
      Without validity intervals or history, a past result/report cannot be
      reliably interpreted under the rules and thresholds that were in force
      when it was produced.
    proposed_action: Add versioned/effective-dated concepts for Test, Assay,
      CriticalValue thresholds, units/reference metadata, and TAT calculation
      rules. Relate Result/Report to the effective catalog or rule version used
      at verification/release time.
    affected_purpose: Conceptual authority for EMR/LIS integration that supports
      reliable historical reconstruction of lab results and operational metrics.
    failure_condition: When catalog mappings, thresholds, units, or TAT formulas
      change, the ontology has no concept for the value version that applied at
      a past collection, verification, or release time.
    impact: Historical reports, corrected results, audits, and dashboard metrics may
      be reinterpreted using current definitions rather than the definitions in
      force at the event time.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/coverage.findings.yaml#coverage-candidate-003
      - Test attributes lack validity/version fields
      - Assay attributes lack validity/version fields
      - CriticalValue lower_bound/upper_bound lack effective period
      - notes mention dual Test/Assay registration and external TAT calculation
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Conceptual authority for EMR/LIS integration that supports
        reliable historical reconstruction of lab results and operational
        metrics.
      failure_condition: When catalog mappings, thresholds, units, or TAT formulas
        change, the ontology has no concept for the value version that applied
        at a past collection, verification, or release time.
      impact: Historical reports, corrected results, audits, and dashboard metrics may
        be reinterpreted using current definitions rather than the definitions
        in force at the event time.
      evidence_refs:
        - Test attributes lack validity/version fields
        - Assay attributes lack validity/version fields
        - CriticalValue lower_bound/upper_bound lack effective period
        - notes mention dual Test/Assay registration and external TAT calculation
    causal_path:
      root_cause_candidate: The model represents mutable reference data as unversioned
        current-state entities and leaves at least one derived calculation
        outside the authority model.
      root_cause_step_id: finding-006.cause-004
      steps:
        - cause_id: finding-006.cause-001
          claim: Test and Assay are modeled as catalog/current execution units without
            effective dates, version, or history attributes.
          relation_to_previous: null
          evidence_refs:
            - Test.attributes
            - Assay.attributes
        - cause_id: finding-006.cause-002
          claim: CriticalValue thresholds are modeled as bounds for a Test but without an
            effective period or threshold version.
          relation_to_previous: causes
          evidence_refs:
            - CriticalValue.attributes.lower_bound/upper_bound/test_ref
        - cause_id: finding-006.cause-003
          claim: TAT is described as a value calculated by a dashboard team's own formula,
            with no calculation-rule concept or version in the ontology.
          relation_to_previous: causes
          evidence_refs:
            - "notes: turnaround_time(TAT)은 collected_at부터 released_at까지로 계산하며,
              대시보드 팀이 자체 계산식을 유지한다."
        - cause_id: finding-006.cause-004
          claim: Therefore past results and metrics cannot be reconstructed against the
            catalog, threshold, and formula state that existed at the relevant
            time.
          relation_to_previous: causes
          evidence_refs:
            - absence of effective/history fields across these entities and notes
      unresolved_beyond_evidence: null
  - finding_id: finding-007
    lens_id: coverage
    source_ref: .onto/review/20260716-49a71a98/round1/coverage.findings.yaml#coverage-candidate-004
    target: clinical-lab-ontology.yaml / Result.status and Report.result_status
      authority coverage
    evidence_anchor: 'Result.status note: "LIS가 기록하며, Report.result_status에도 동일 정보가
      유지된다."; Report.result_status note: "보고서에 표시되는 결과 상태의 권위 값. 임상의는 이 값을
      신뢰한다."'
    claim: Duplicated result-status concepts lack a single source-of-truth coverage
      model across LIS and report-facing values.
    lens_rationale_summary: The ontology explicitly describes the same status
      information being maintained in two places and synchronized nightly after
      corrections. Without a single authority concept and a modeled
      projection/update event, EMR and LIS implementers lack a complete concept
      for status precedence, staleness, and reconciliation.
    proposed_action: Introduce a canonical ResultStatus concept or designate one
      existing field as authoritative, then model Report.result_status as a
      derived projection with mapping, freshness, last_synced_at, and
      correction/amendment event semantics. Include who/what may update the
      canonical status.
    affected_purpose: EMR/LIS integration concept authority with clear precedence
      and operationally safe status interpretation.
    failure_condition: During the interval between Result.status correction and the
      nightly report-status sync, the ontology contains two status carriers but
      no canonical authority/staleness concept that consumers can use
      consistently.
    impact: Clinicians or integrated systems may trust a report-facing status that
      is stale relative to LIS correction state, or implementations may choose
      different precedence rules.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/coverage.findings.yaml#coverage-candidate-004
      - Result.status note says LIS records and same information is maintained
        in Report.result_status
      - Report.result_status note says report status is the authority value
        clinicians trust
      - state_rules say corrected Result.status changes Report.result_status via
        nightly batch
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS integration concept authority with clear precedence
        and operationally safe status interpretation.
      failure_condition: During the interval between Result.status correction and the
        nightly report-status sync, the ontology contains two status carriers
        but no canonical authority/staleness concept that consumers can use
        consistently.
      impact: Clinicians or integrated systems may trust a report-facing status that
        is stale relative to LIS correction state, or implementations may choose
        different precedence rules.
      evidence_refs:
        - Result.status note says LIS records and same information is maintained
          in Report.result_status
        - Report.result_status note says report status is the authority value
          clinicians trust
        - state_rules say corrected Result.status changes Report.result_status
          via nightly batch
    causal_path:
      root_cause_candidate: The ontology duplicates a status fact across Result and
        Report without covering the single authority/projection model needed for
        multi-system integration.
      root_cause_step_id: finding-007.cause-004
      steps:
        - cause_id: finding-007.cause-001
          claim: Result.status is recorded by LIS and includes preliminary, final,
            corrected.
          relation_to_previous: null
          evidence_refs:
            - Result.status values and note
        - cause_id: finding-007.cause-002
          claim: Report.result_status contains corresponding but different values and is
            described as the authority value clinicians trust.
          relation_to_previous: causes
          evidence_refs:
            - Report.result_status values and note
        - cause_id: finding-007.cause-003
          claim: The synchronization rule updates Report.result_status to amended only
            through a nightly batch after Result.status becomes corrected.
          relation_to_previous: causes
          evidence_refs:
            - state_rules second rule
        - cause_id: finding-007.cause-004
          claim: The model lacks an explicit canonical status source, staleness marker, or
            synchronization event to cover this duplicated multi-system value.
          relation_to_previous: causes
          evidence_refs:
            - absence of status authority/projection/sync event entity in
              entities and relations
      unresolved_beyond_evidence: null
