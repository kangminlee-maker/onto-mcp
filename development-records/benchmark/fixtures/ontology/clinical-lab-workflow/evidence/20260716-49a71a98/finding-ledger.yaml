  - finding_id: finding-018
    lens_id: structure
    source_ref: .onto/review/20260716-49a71a98/round1/structure.findings.yaml#structure-candidate-002
    target: clinical-lab-ontology.yaml entities.CriticalValue
    evidence_anchor: "Embedded Materialized Input: entities.CriticalValue has
      test_ref to Test and notified boolean, but no relation connects
      CriticalValue to Result, Report, Staff, Order, or notification records;
      relations list omits CriticalValue."
    claim: CriticalValue is structurally disconnected from the result/report workflow.
    lens_rationale_summary: The structure lens checks whether necessary connections
      exist among declared elements. CriticalValue is not just a static catalog
      annotation in its definition; it includes a workflow state, notified, and
      says notification evidence exists in another log. Without any relation to
      Result or Report, the model cannot express which actual result breached a
      critical range or how that condition enters the order-to-report workflow.
      This is operationally material because critical notification is a
      high-risk exception path in EMR/LIS integration.
    proposed_action: Connect CriticalValue to the actual workflow with relations
      such as Result triggers CriticalValue, CriticalValue applies_to Test,
      CriticalValue notified_by Staff, and optionally CriticalValue
      documented_in NotificationRecord if notification records are in scope;
      otherwise remove workflow state like notified from this ontology and keep
      it as a pure reference range.
    affected_purpose: Use the ontology as a concept authority for operational
      EMR/LIS workflow integration.
    failure_condition: When a result falls in a critical range and requires
      immediate communication, the ontology has no structural path from the
      Result/Report workflow to CriticalValue or notification handling.
    impact: A critical exception process can be implemented outside the authority
      graph, undermining traceability and consistent integration behavior for
      urgent clinical notifications.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/structure.findings.yaml#structure-candidate-002
      - "Embedded Materialized Input: entities.CriticalValue definition and
        attributes"
      - "Embedded Materialized Input: relations list omits CriticalValue"
      - "Embedded Materialized Input: CriticalValue.notified note references
        notification records outside the graph"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
