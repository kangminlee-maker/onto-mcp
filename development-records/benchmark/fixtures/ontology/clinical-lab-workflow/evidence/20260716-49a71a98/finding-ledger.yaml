  - finding_id: finding-017
    lens_id: structure
    source_ref: .onto/review/20260716-49a71a98/round1/structure.findings.yaml#structure-candidate-001
    target: clinical-lab-ontology.yaml entities.Assay
    evidence_anchor: "Embedded Materialized Input: entities.Assay defines department
      ref to Department and specimen_kind, but no relation includes Assay;
      relations list connects Order, Specimen, Test, Result, Report, Department,
      Staff only."
    claim: Assay is structurally orphaned from the workflow graph.
    lens_rationale_summary: From the structure lens, an entity intended to represent
      the performed laboratory unit should be reachable from the order-to-report
      graph. In the current relation set, Test connects to Result, Result
      connects to Report and Specimen, and Department connects to Staff, while
      Assay is only connected through an attribute reference to Department. That
      leaves no structural path that says which catalog Test maps to which
      analyzer Assay or which Result came from an Assay. As a concept-authority
      document for EMR/LIS integration, this weakens the model because a key
      LIS-side execution concept cannot be traversed from ordered tests or
      produced results.
    proposed_action: Add explicit relations such as Test maps_to/realized_by Assay
      and Result produced_by Assay, or merge Assay into Test if they are not
      meant to be separate authority concepts yet.
    affected_purpose: Use the ontology as the concept authority for EMR/LIS
      integration from Order through Report.
    failure_condition: When implementers need to map ordered catalog tests to
      LIS/analyzer execution units or trace a result back to the performed
      assay, the graph has no declared Test-Assay or Result-Assay connection.
    impact: The integration contract becomes structurally incomplete for a central
      cross-system mapping, so different teams may create incompatible local
      joins outside the authority document.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/structure.findings.yaml#structure-candidate-001
      - "Embedded Materialized Input: entities.Assay definition and attributes"
      - "Embedded Materialized Input: relations list has no Assay relation"
      - "Embedded Materialized Input: notes says new items are registered in
        both Test and Assay"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology as the concept authority for EMR/LIS
        integration from Order through Report.
      failure_condition: When implementers need to map ordered catalog tests to
        LIS/analyzer execution units or trace a result back to the performed
        assay, the graph has no declared Test-Assay or Result-Assay connection.
      impact: The integration contract becomes structurally incomplete for a central
        cross-system mapping, so different teams may create incompatible local
        joins outside the authority document.
      evidence_refs:
        - "Embedded Materialized Input: entities.Assay definition and attributes"
        - "Embedded Materialized Input: relations list has no Assay relation"
        - "Embedded Materialized Input: notes says new items are registered in
          both Test and Assay"
    causal_path:
      root_cause_candidate: Assay was introduced as a separate execution/catalog
        concept without a declared structural relation to the existing
        order-result-report graph.
      root_cause_step_id: finding-017.cause-003
