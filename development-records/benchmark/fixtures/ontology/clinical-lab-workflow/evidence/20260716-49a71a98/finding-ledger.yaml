              be reconsidered; new items registered in both"
        - cause_id: finding-017.cause-002
          claim: The relations section does not include Assay as either a from or to
            endpoint.
          relation_to_previous: causes
          evidence_refs:
            - "Embedded Materialized Input: relations list"
        - cause_id: finding-017.cause-003
          claim: Therefore Assay cannot be traversed from Order, Test, Specimen, Result,
