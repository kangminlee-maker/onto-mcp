  - finding_id: finding-019
    lens_id: structure
    source_ref: .onto/review/20260716-49a71a98/round1/structure.findings.yaml#structure-candidate-003
    target: clinical-lab-ontology.yaml state_rules
    evidence_anchor: "Embedded Materialized Input: Order lifecycle includes
      completed; Result.status values include preliminary/final/corrected;
      relations include Test->Result, Result->Report, Report->Order, but no
      Order->Result relation; state_rules says Order completes when all Result
      are final."
    claim: The Order completion rule depends on Results that are not structurally
      scoped to an Order.
    lens_rationale_summary: "A lifecycle rule that quantifies over 'all Result'
      needs a structural boundary for the result set. The current graph has
      Order to Report and Report to Result, plus Order to Specimen and Specimen
      to Result, but neither path is declared as the authoritative result scope
      for Order completion. In a concept authority document, that makes the
      completion transition structurally under-specified: different consumers
      could choose Report.contains Result, Specimen.produces Result, or
      Test.has_many Result as the source set."
    proposed_action: Declare the authoritative scoping relation for order
      completion, for example Order has_many Result via Report.contains or
      Specimen.produces, and update the state rule to reference that relation
      explicitly.
    affected_purpose: Use the ontology as an authority for state behavior in the
      Order-to-Report workflow.
    failure_condition: When computing or implementing Order.completed, consumers
      must determine the set of Results for an Order without an explicit
      structural scope.
    impact: Completion behavior may diverge across EMR/LIS components because the
      state rule depends on an unstated traversal choice.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/structure.findings.yaml#structure-candidate-003
      - "Embedded Materialized Input: entities.Order.lifecycle"
      - "Embedded Materialized Input: entities.Result.attributes.status"
      - "Embedded Materialized Input: relations list"
      - "Embedded Materialized Input: state_rules first item"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
