findings:
  - candidate_id: semantics-candidate-001
    target: Result.status / Report.result_status 상태 의미 모델
    evidence_anchor: clinical-lab-ontology.yaml:64-78, clinical-lab-ontology.yaml:117-118
    claim: 동일 결과 상태를 두 권위 값으로 중복 정의하면서 enum 어휘가 서로 맞지 않는다.
    what: "`Result.status`는 `[preliminary, final, corrected]`이고
      `Report.result_status`는 `[prelim, finalized, amended]`입니다. 두 필드 설명은 동일 정보가
      유지되거나 보고서 권위 값이라고 말하지만, 상태 이름이 1:1로 정의되지 않았고 `final`/`finalized`,
      `corrected`/`amended`, `preliminary`/`prelim`의 의미 차이도 문서 안에서 확정되지 않습니다."
    why: 이 온톨로지는 EMR/LIS 연동의 개념 권위 문서로 쓰일 예정인데, 결과 상태와 보고 상태가 서로 다른 이름으로 같은 정보를 주장하면
      어느 값이 원천 권위인지와 상태 변환 의미가 흐려집니다. 특히 state rule은 `Result.status=corrected`일
      때 `Report.result_status=amended`가 되어야 한다고만 말하므로, corrected result와 amended
      report가 같은 상태인지, 보고서 수정 상태인지, 결과 정정 상태인지가 섞입니다.
    how_to_fix: 상태 개념을 하나의 canonical enum으로 정하거나, `ResultStatus`와 `ReportStatus`를
      분리하되 명시적인 mapping 표를 둡니다. 각 상태의 의미, 원천 권위, 전이 조건을 같은 어휘로 맞추고
      `prelim/preliminary`, `final/finalized`, `corrected/amended`를 alias인지 별도
      상태인지 선언하세요.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 통합의 결과 상태와 보고 상태에 대한 개념 권위 문서 역할
      failure_condition: LIS가 `Result.status`를 쓰고 EMR/임상의가 `Report.result_status`를
        신뢰하는 경로에서 두 enum 간 의미 대응이 명시되지 않을 때
      impact: 상태 권위와 상태 의미가 달라져 preliminary/final/corrected 결과의 표시, 완료 판정, 정정 보고 전파가
        시스템마다 다르게 해석될 수 있다.
      evidence_refs:
        - clinical-lab-ontology.yaml:64-78
        - clinical-lab-ontology.yaml:117-118
    causal_path:
      root_cause_candidate: 결과 상태와 보고 상태를 같은 정보로 설명하면서도 별도 enum과 별도 권위 문구로 모델링했다.
      root_cause_step_id: semantics-candidate-001.cause-004
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: "`Result.status` 설명은 `Report.result_status`에도 동일 정보가 유지된다고 한다."
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:64-68
        - cause_id: semantics-candidate-001.cause-002
          claim: "`Report.result_status` 설명은 보고서에 표시되는 결과 상태의 권위 값이라고 한다."
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:75-78
        - cause_id: semantics-candidate-001.cause-003
          claim: 두 필드의 enum 값은 서로 다른 어휘를 사용한다.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:64-78
        - cause_id: semantics-candidate-001.cause-004
          claim: state rule은 `corrected`에서 `amended`로의 동기화만 언급해 상태 의미와 원천 권위의 차이를 닫지 못한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - clinical-lab-ontology.yaml:117-118
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: Order.priority / Order.is_stat / StatOrder
    evidence_anchor: clinical-lab-ontology.yaml:16-24
    claim: STAT 주문 의미가 enum 값, boolean, 하위 타입으로 세 번 표현되어 동일 개념의 권위가 갈라진다.
    what: "`Order.priority`에는 `stat` 값이 있고, 같은 `Order`에 `is_stat` boolean이 있으며, 별도
      `StatOrder` 하위 타입도 있습니다. 셋 모두 STAT 주문 여부를 표현하지만 어느 표현이 authoritative인지,
      불일치 시 어느 값을 믿는지, subtype과 priority 값의 관계가 무엇인지 정의되어 있지 않습니다."
    why: STAT은 주문의 우선순위/긴급도 의미인데, 이를 값·플래그·타입으로 동시에 두면 동일 주문이 `priority=stat`,
      `is_stat=false`, 비-`StatOrder`처럼 모순된 상태를 가질 수 있습니다. 개념 권위 문서가 이런 중복 표현을
      허용하면 EMR/LIS 간 STAT 처리, 우선순위 큐, 알림 조건의 의미가 흔들립니다.
    how_to_fix: STAT 표현을 하나의 원천으로 통합하세요. 예를 들어 `priority` enum만 권위로 두고 `is_stat`와
      `StatOrder`를 제거하거나 파생 alias로 명시합니다. `StatOrder`를 유지한다면 `priority=stat` 및
      `is_stat=true`와의 불변조건을 문서화하세요.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문 우선순위와 STAT 주문의 EMR/LIS 공통 의미 정의
      failure_condition: 통합 시스템이나 규칙이 STAT 여부를 서로 다른 필드 또는 subtype에서 읽을 때
      impact: 동일 STAT 개념의 해석이 갈라져 긴급 검사 라우팅, SLA/TAT 계산, 알림 정책이 서로 다른 기준으로 작동할 수 있다.
      evidence_refs:
        - clinical-lab-ontology.yaml:16-24
    causal_path:
      root_cause_candidate: STAT을 Order의 속성값, boolean 파생값, subtype으로 동시에 모델링했다.
      root_cause_step_id: semantics-candidate-002.cause-004
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: "`priority` enum에 `stat` 값이 포함되어 있다."
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:16
        - cause_id: semantics-candidate-002.cause-002
          claim: "`is_stat`도 STAT 주문 여부라고 설명한다."
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:17
        - cause_id: semantics-candidate-002.cause-003
          claim: "`StatOrder` 역시 응급(STAT) 검사 주문인 `Order` 하위 타입으로 정의된다."
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:20-24
        - cause_id: semantics-candidate-002.cause-004
          claim: 세 표현 간 동치성, 우선순위, 불일치 처리 규칙이 없다.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:16-24
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-003
    target: Specimen-to-Result 관계 의미
    evidence_anchor: clinical-lab-ontology.yaml:113-114
    claim: "`Specimen produces Result`는 검체의 의미를 결과 생산 주체로 잘못 표현한다."
    what: 관계 목록에는 `Result -> Specimen derived_from`과 함께 `Specimen -> Result
      produces`가 있고, 주석은 '검체가 결과를 생산한다'고 합니다. 그러나 파일 내부에서도 `Assay`는 분석기에서 수행되는
      검사 항목이고 `Result`는 Test 수행 결과 값으로 정의되어 있어, 검체는 결과의 원천/대상이지 결과를 생산하는 행위 주체가
      아닙니다.
    why: "`produces`는 Order가 Report를 산출하는 관계에도 쓰입니다. 같은 동사를 검체에 적용하면 검체, 검사 수행,
      분석기/assay, 결과 생성의 의미 역할이 섞입니다. EMR/LIS 통합 권위 문서에서는 검체 추적과 결과 생성 주체가 구분되어야
      하므로 이 관계명은 운영 해석을 흐립니다."
    how_to_fix: "`Specimen -> Result produces`를 제거하거나 `source_for`, `used_for`,
      `has_result`처럼 검체의 원천 역할을 드러내는 관계로 바꾸세요. 결과 생성 주체는 `Test`/`Assay` 수행 또는 분석
      이벤트 개념에 연결하는 편이 의미적으로 더 정확합니다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 검체 추적과 결과 산출 관계의 개념 권위
      failure_condition: 검체-결과 lineage, 분석 수행 주체, 결과 생성 이벤트를 이 관계명에 의존해 설계할 때
      impact: 검체가 행위 주체처럼 모델링되어 assay/test 수행, 장비 분석, 결과 provenance의 의미 경계가 흐려진다.
      evidence_refs:
        - clinical-lab-ontology.yaml:49-58
        - clinical-lab-ontology.yaml:111-114
    causal_path:
      root_cause_candidate: 결과의 원천인 검체에 결과 산출 행위 동사 `produces`를 부여했다.
      root_cause_step_id: semantics-candidate-003.cause-004
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: "`Result`는 Test 수행 결과 값으로 정의된다."
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:57-58
        - cause_id: semantics-candidate-003.cause-002
          claim: "`Assay`는 분석기에서 수행되는 검사 항목으로 정의된다."
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:49-55
        - cause_id: semantics-candidate-003.cause-003
          claim: 그런데 관계는 `Specimen -> Result produces`와 '검체가 결과를 생산한다'는 주석을 둔다.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:113-114
        - cause_id: semantics-candidate-003.cause-004
          claim: 같은 `produces` 관계가 `Order -> Report`에도 쓰여 산출 주체 의미를 갖는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - clinical-lab-ontology.yaml:111
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-004
    target: CriticalValue 엔티티
    evidence_anchor: clinical-lab-ontology.yaml:95-101
    claim: "`CriticalValue`라는 이름이 실제 모델인 위험 임계 범위 및 통보 상태와 의미적으로 맞지 않는다."
    what: 엔티티 이름은 `CriticalValue`이지만 정의는 '위험 결과 값 범위'이고 속성은 `lower_bound`,
      `upper_bound`, `notified`입니다. 즉 실제로는 개별 결과 값이 아니라 검사별 critical
      threshold/rule와 통보 완료 여부를 섞어 모델링합니다.
    why: 개별 환자 결과의 critical value와 검사별 임계 범위는 서로 다른 개념입니다. 여기에 `notified`까지 붙이면 임계
      규칙, 발생한 위험 결과, 통보 이벤트가 한 엔티티 안에서 같은 의미처럼 보입니다. 전화 기록 대장에 통보 시각과 수신자가 있다는
      주석도 통보가 별도 이벤트임을 시사합니다.
    how_to_fix: 검사별 임계 범위는 `CriticalValueRange` 또는 `CriticalResultThreshold`로 명명하고,
      실제 위험 결과는 `Result`를 참조하는 별도 `CriticalResult`/`CriticalAlert`로 분리하세요.
      `notified`는 통보 이벤트나 통보 기록 개념의 상태로 옮기고 수신자·시각 권위 위치를 명시하세요.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 위험 결과 판정 및 통보 워크플로의 개념 권위
      failure_condition: EMR/LIS가 이 엔티티를 critical result 인스턴스, threshold 설정, 통보 완료 상태
        중 하나로 해석해야 할 때
      impact: 위험 결과 알림의 대상과 규칙, 통보 상태가 섞여 환자별 critical result 추적과 통보 감사 의미가 불명확해진다.
      evidence_refs:
        - clinical-lab-ontology.yaml:95-101
    causal_path:
      root_cause_candidate: 임계 범위, 실제 위험 결과, 통보 상태를 `CriticalValue` 하나에 합쳤다.
      root_cause_step_id: semantics-candidate-004.cause-004
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: "`CriticalValue`의 정의는 값 자체가 아니라 위험 결과 값 범위라고 한다."
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:95-96
        - cause_id: semantics-candidate-004.cause-002
          claim: 속성은 검사 참조와 하한/상한으로 임계 범위를 표현한다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:97-100
        - cause_id: semantics-candidate-004.cause-003
          claim: 같은 엔티티에 `notified` boolean을 두고 통보 시각과 수신자는 별도 전화 기록 대장에 있다고 설명한다.
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml:101
        - cause_id: semantics-candidate-004.cause-004
          claim: 따라서 이름은 개별 critical value처럼 보이지만 실제 모델은 threshold와 notification state의
            결합이다.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:95-101
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - 임상검사 워크플로에서 STAT은 주문의 긴급도/우선순위 의미로 쓰이며, 같은 주문 안에서 값·플래그·하위 타입으로 중복 표현되면 의미
    권위가 갈라진다고 보았다.
  - 결과 상태와 보고 상태는 서로 다를 수 있지만, 서로 다른 경우에는 explicit mapping과 원천 권위가 필요하다고 보았다.
  - 검체는 결과의 원천 또는 분석 대상이지 결과 생성 행위 주체 자체는 아니라고 보았다.
  - Critical value라는 용어는 환자 결과가 위험 기준을 만족한 사건/값으로 해석될 수 있고, 검사별 임계 범위와 통보 이벤트는
    구분되어야 한다고 보았다.
validation:
