        Report. Source finding context: A Result that was final at Order
        completion is later changed to corrected under the ontology's own Report
        correction rule. Source finding context: Integrations can observe or
        propagate an Order.completed state whose stated predicate is false,
        weakening trust in closure, downstream billing/reporting triggers, and
        clinician-facing workflow state. Source finding context: The completion
        rule uses the mutable Result.status value final as the necessary
        condition for a durable Order.completed lifecycle state while the same
