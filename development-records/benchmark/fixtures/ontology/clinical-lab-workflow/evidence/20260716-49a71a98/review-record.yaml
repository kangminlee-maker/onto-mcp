        Assay or which Result came from an Assay. As a concept-authority
        document for EMR/LIS integration, this weakens the model because a key
        LIS-side execution concept cannot be traversed from ordered tests or
        produced results. Source finding context: Add explicit relations such as
        Test maps_to/realized_by Assay and Result produced_by Assay, or merge
        Assay into Test if they are not meant to be separate authority concepts
        yet. Source finding context:
        .onto/review/20260716-49a71a98/round1/structure.findings.yaml#structure\
        -candidate-001 Source finding context: Use the ontology as the concept
        authority for EMR/LIS integration from Order through Report. Source
        finding context: When implementers need to map ordered catalog tests to
        LIS/analyzer execution units or trace a result back to the performed
        assay, the graph has no declared Test-Assay or Result-Assay connection.
        Source finding context: The integration contract becomes structurally
        incomplete for a central cross-system mapping, so different teams may
        create incompatible local joins outside the authority document. Source
        finding context: Assay was introduced as a separate execution/catalog
        concept without a declared structural relation to the existing
        order-result-report graph. Source finding context: Assay is defined as
