        amendment transition, a permitted later status change can leave an Order
        simultaneously treated as completed and no longer satisfying its
        declared completion condition. This matters for an EMR/LIS conceptual
        authority document because downstream integration can derive closure
        from Order.completed while report/result state has moved beyond the
        condition that justified closure. Source finding context: Define
