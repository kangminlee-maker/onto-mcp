        context: When computing or implementing Order.completed, consumers must
        determine the set of Results for an Order without an explicit structural
        scope. Source finding context: Completion behavior may diverge across
        EMR/LIS components because the state rule depends on an unstated
        traversal choice. Source finding context: The lifecycle rule uses an
        aggregate over Result without declaring the result-set ownership path
        from Order. Source finding context: Order.completed is defined by all
