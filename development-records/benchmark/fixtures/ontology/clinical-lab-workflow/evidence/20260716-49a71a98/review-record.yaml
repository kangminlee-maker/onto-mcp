      rationale: "The missing result-set scope can cause divergent completion
        computation across consumers. It is a material medium-severity
        state-rule correctness issue, but can be carried with the related
        completion and correction-state modeling work. Source finding context:
        clinical-lab-ontology.yaml state_rules Source finding context: Embedded
        Materialized Input: Order lifecycle includes completed; Result.status
        values include preliminary/final/corrected; relations include
        Test->Result, Result->Report, Report->Order, but no Order->Result
        relation; state_rules says Order completes when all Result are final.
        Source finding context: The Order completion rule depends on Results
        that are not structurally scoped to an Order. Source finding context: A
        lifecycle rule that quantifies over 'all Result' needs a structural
        boundary for the result set. The current graph has Order to Report and
        Report to Result, plus Order to Specimen and Specimen to Result, but
        neither path is declared as the authoritative result scope for Order
        completion. In a concept authority document, that makes the completion
        transition structurally under-specified: different consumers could
        choose Report.contains Result, Specimen.produces Result, or
        Test.has_many Result as the source set. Source finding context: Declare
        the authoritative scoping relation for order completion, for example
        Order has_many Result via Report.contains or Specimen.produces, and
        update the state rule to reference that relation explicitly. Source
        finding context:
