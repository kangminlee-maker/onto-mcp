  - issue_id: issue-013
    root_cause_hypothesis: The model assigns the result-producing action verb to
      Specimen, conflating source material lineage with assay/result generation.
    root_confidence: high
    surface_finding_ids:
      - finding-015
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: Specimen produces Result misstates specimen semantics as if the
      specimen were the result-producing actor.
    proposed_action: Rename or replace the relation with source_for, used_for, or
      has_result, and connect result generation to Test, Assay, or an analysis
      event where appropriate.
    affected_purpose: Concept authority for specimen traceability and result
      production relationships.
    failure_condition: Designers rely on the Specimen produces Result relation for
      lineage, analysis actor, or result provenance semantics.
    impact: Specimen source, assay/test execution, analyzer action, and result
      provenance boundaries become ambiguous.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/semantics.findings.yaml#semantics-candidate-003
      - clinical-lab-ontology.yaml:49-58
      - clinical-lab-ontology.yaml:111-114
    severity: medium
    domain_threshold_used: null
    singleton_reason: No same_root_candidate relation connects this finding to
      another finding; it only enables a separate completion-scope ambiguity.
  - issue_id: issue-014
    root_cause_hypothesis: Assay was introduced as a separate execution/catalog
      concept without structural relations to the order-result-report graph.
    root_confidence: high
    surface_finding_ids:
      - finding-017
    relation_refs: []
    raised_by_lens_ids:
      - structure
    issue_statement: Assay is structurally orphaned from ordered tests and produced results.
    proposed_action: Add Test-to-Assay and Result-to-Assay relations, or merge Assay
      into Test if no separate authority concept is intended.
    affected_purpose: Use the ontology as the concept authority for EMR/LIS
      integration from Order through Report.
    failure_condition: Implementers need to map ordered catalog tests to
      LIS/analyzer execution units or trace a result back to the performed
      assay.
    impact: The integration contract is structurally incomplete for a central
      cross-system mapping, pushing teams toward incompatible local joins.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/structure.findings.yaml#structure-candidate-001
      - "Embedded Materialized Input: entities.Assay definition and attributes"
      - "Embedded Materialized Input: relations list has no Assay relation"
      - "Embedded Materialized Input: notes says new items are registered in
        both Test and Assay"
    severity: medium
    domain_threshold_used: null
    singleton_reason: No same_root_candidate relation connects this finding to
      another finding; duplicate/shared-cause relations are not admissible merge
      edges for this artifact.
  - issue_id: issue-015
    root_cause_hypothesis: The lifecycle rule aggregates over Result without
      declaring the authoritative result-set ownership path from Order.
    root_confidence: high
    surface_finding_ids:
      - finding-019
    relation_refs: []
    raised_by_lens_ids:
      - structure
    issue_statement: Order completion depends on all Results but the model does not
      structurally scope which Results belong to an Order.
    proposed_action: Declare the authoritative scoping relation for order completion
      and reference that relation explicitly in the state rule.
    affected_purpose: Use the ontology as an authority for state behavior in the
      Order-to-Report workflow.
    failure_condition: Consumers must compute Order.completed and choose among
      indirect paths such as Report.contains Result, Specimen.produces Result,
      or Test.has_many Result.
    impact: Completion behavior may diverge across EMR/LIS components because the
      state rule depends on an unstated traversal choice.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/structure.findings.yaml#structure-candidate-003
      - "Embedded Materialized Input: entities.Order.lifecycle"
      - "Embedded Materialized Input: entities.Result.attributes.status"
      - "Embedded Materialized Input: relations list"
      - "Embedded Materialized Input: state_rules first item"
    severity: medium
    domain_threshold_used: null
    singleton_reason: No same_root_candidate relation connects this finding to
      another finding; relation to finding-011 is shared_cause_candidate
      dependency context.
