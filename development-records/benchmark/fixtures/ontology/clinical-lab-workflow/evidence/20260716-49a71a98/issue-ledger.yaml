  - issue_id: issue-010
    root_cause_hypothesis: The durable Order.completed lifecycle state is derived
      from mutable Result.status values without post-completion correction
      semantics.
    root_confidence: high
    surface_finding_ids:
      - finding-011
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: Order.completed can remain true after a later allowed
      correction makes the stated completion predicate false.
    proposed_action: Define completion against a stable milestone or versioned
      snapshot, or add explicit corrected/amended/reopened semantics and
      terminal-state rules.
    affected_purpose: Use of the ontology as the conceptual authority for EMR/LIS
      integration state behavior from Order through Report.
    failure_condition: A Result that was final at Order completion is later changed
      to corrected under the ontology's own correction rule.
    impact: Integrations can observe or propagate an Order.completed state whose
      stated predicate is false, weakening closure, billing/reporting triggers,
      and workflow trust.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/logic.findings.yaml#logic-candidate-001
      - "clinical-lab-ontology.yaml Order.lifecycle: [draft, placed,
        in_progress, completed, cancelled]"
      - "clinical-lab-ontology.yaml Result.status values: [preliminary, final,
        corrected]"
      - 'clinical-lab-ontology.yaml state_rules: "Order는 모든 Result가 final일 때
        completed로 전이한다."'
      - 'clinical-lab-ontology.yaml state_rules: "Result.status가 corrected로 바뀌면
        Report.result_status는 amended가 되어야 한다"'
    severity: high
    domain_threshold_used: null
    singleton_reason: No same_root_candidate relation connects this finding to
      another finding; related completion/correction relations are
      shared_cause_candidate dependency context.
  - issue_id: issue-011
    root_cause_hypothesis: The ontology splits one declared status information
      concept into two enum domains and only partially constrains equivalence.
    root_confidence: high
    surface_finding_ids:
      - finding-012
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: Result.status and Report.result_status claim to maintain the
      same information but lack a total equivalence rule.
    proposed_action: Add a total status mapping table or unify the enum, and clarify
      whether Report.result_status is derived or authoritative.
    affected_purpose: Conceptual authority for EMR/LIS status synchronization
      between LIS result state and clinician-facing report state.
    failure_condition: An implementation must decide whether and how Result.status
      and Report.result_status represent the same status information outside the
      corrected-to-amended case.
    impact: Different systems can satisfy local enum constraints while disagreeing
      on valid cross-system state, undermining integration precedence and
      invalid-input behavior.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/logic.findings.yaml#logic-candidate-002
      - 'clinical-lab-ontology.yaml Result.status note: "Report.result_status에도
        동일 정보가 유지된다."'
      - "clinical-lab-ontology.yaml Result.status values: [preliminary, final,
        corrected]"
      - "clinical-lab-ontology.yaml Report.result_status values: [prelim,
        finalized, amended]"
      - 'clinical-lab-ontology.yaml Report.result_status note: "보고서에 표시되는 결과 상태의
        권위 값."'
      - clinical-lab-ontology.yaml state_rules correction sentence
    severity: medium
    domain_threshold_used: null
    singleton_reason: No same_root_candidate relation connects this finding directly
      to another finding; duplicate/shared-cause relations are not admissible
      merge edges for this artifact.
  - issue_id: issue-012
    root_cause_hypothesis: STAT is modeled simultaneously as an Order priority
      value, boolean flag, and subtype without an authority or invariant rule.
    root_confidence: high
    surface_finding_ids:
      - finding-014
    relation_refs: []
    raised_by_lens_ids:
      - semantics
    issue_statement: STAT order meaning can conflict across priority, is_stat, and
      StatOrder representations.
    proposed_action: Choose one authoritative STAT representation and make any
      retained alternate forms explicit derived aliases with invariants.
    affected_purpose: Shared EMR/LIS meaning for order priority and STAT orders.
    failure_condition: Integrated systems or rules read STAT status from different
      fields or subtype membership.
    impact: Urgent test routing, SLA/TAT calculation, and notification policy may
      operate on different STAT criteria.
    evidence_refs:
      - .onto/review/20260716-49a71a98/round1/semantics.findings.yaml#semantics-candidate-002
      - clinical-lab-ontology.yaml:16-24
    severity: medium
    domain_threshold_used: null
    singleton_reason: Runtime relation graph marks this as a singleton finding with
