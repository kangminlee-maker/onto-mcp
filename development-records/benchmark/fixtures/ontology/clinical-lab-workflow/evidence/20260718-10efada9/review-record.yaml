  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - EMR/LIS integration must represent non-happy-path specimen handling, not
        only successful analysis.
      - Verification, report release or amendment, and critical-value
        notification are controlled clinical actions requiring attributable
        evidence.
      - Laboratory catalogs, assay implementations, thresholds, and
        interpretation rules can change over time, so historical reconstruction
        requires temporal versions.
      - Clinically meaningful result exchange requires interpretation and
        analytic provenance beyond an untyped value and unit.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - EMR/LIS integrations must accommodate additions and revisions to local
        or external catalogs without changing the meaning of historical records.
      - Ordering concepts and analyzer execution concepts may evolve
        independently and can require non-one-to-one mappings.
      - Status vocabularies may be deployed asynchronously across integrated
        systems.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - Order.completed는 단순 이력 표식이 아니라 통합 시스템이 현재 주문의 종결 여부를 판단하는 상태로 사용된다고 보았다.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - 하위 타입은 인스턴스의 정체성에 관한 분류이고, 우선순위 속성은 별도 규정이 없으면 운영상 상태 또는 역할로 해석했다.
      - 개별 결과 상태와 여러 결과를 묶는 보고서 상태는 집계 수준이 다른 개념이며, 동일하다고 하려면 명시적인 파생 규칙이 필요하다고
        보았다.
      - 재사용되는 임계값 규칙과 특정 환자 결과에 대한 통보 사건은 서로 다른 정체성과 수명주기를 가진다고 보았다.
      - 검체는 결과의 물질적 출처이고 실제 분석 수행 과정과는 의미적으로 구분된다고 보았다.
