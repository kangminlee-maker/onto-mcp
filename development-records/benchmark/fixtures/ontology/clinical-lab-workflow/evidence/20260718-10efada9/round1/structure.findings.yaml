findings:
  - candidate_id: structure-candidate-001
    target: clinical-lab-ontology.yaml — Assay 연결 구조
    evidence_anchor: materialized-input.md:46-66,108-119,126-127
    claim: Assay가 주문-검체-결과-보고 워크플로와 연결되지 않아 LIS 수행 단위가 구조적으로 분리되어 있다.
    what: Assay는 Department 참조만 가지며, 주문 가능한 Test나 이를 수행해 생성되는 Result·Specimen과의 관계가
      없다.
    why: 문서는 Test를 주문 단위, Assay를 분석기 수행 단위로 정의하고 양쪽에 신규 항목을 등록하도록 하지만 둘 사이의 대응 관계를
      정의하지 않는다. 따라서 EMR의 Test 주문을 LIS의 Assay 수행으로 추적하거나 Assay 기반 결과의 출처를 표현할 수
      없다.
    how_to_fix: Test와 Assay 사이에 명시적 수행 매핑 관계를 추가하고 필요한 다중성·필수성을 정의한다. 실제 결과가 Assay
      수행에서 생성된다면 Result에도 assay_ref 또는 동등한 관계를 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: Order부터 Report까지의 임상검사 파이프라인을 EMR/LIS 연동 설계의 개념 권위 문서로 제공하는 목적
      failure_condition: EMR의 Test 주문을 LIS의 Assay 수행 단위로 변환하거나 수행 결과를 원래 주문에 추적해야 할 때
      impact: 핵심 시스템 경계를 잇는 개념 경로가 없으므로 통합 구현마다 별도 매핑을 발명하게 되고 문서가 개념 권위 역할을 수행하지 못한다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:46-66
        - materialized-input.md:108-119
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: Test와 Assay 또는 Assay와 Result 사이의 수행 관계가 선언되지 않았다.
      root_cause_step_id: structure-candidate-001.cause-002
      steps:
        - cause_id: structure-candidate-001.cause-001
          claim: Assay는 Department 외에는 주문-결과 워크플로의 어떤 엔티티에도 연결되지 않는다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:54-60
            - materialized-input.md:108-119
        - cause_id: structure-candidate-001.cause-002
          claim: 주문 단위인 Test와 수행 단위인 Assay를 연결하는 관계가 누락되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:126-127
      unresolved_beyond_evidence: null
  - candidate_id: structure-candidate-002
    target: clinical-lab-ontology.yaml — CriticalValue 통보 연결 구조
    evidence_anchor: materialized-input.md:62-84,100-119
    claim: CriticalValue의 통보 상태가 실제 Result 및 통보 기록과 연결되지 않아 위험 결과의 통보 이력을 워크플로에서 추적할
      수 없다.
    what: CriticalValue는 Test만 참조하고 `notified` 불리언을 보유하지만, 어떤 Result가 임계 범위를 충족했는지
      또는 통보 시각·수신자가 담긴 기록과의 관계가 없다.
    why: 즉시 통보 대상이라는 정의에도 불구하고 통보 여부를 특정 결과 인스턴스에 귀속할 구조가 없다. 전화 기록 대장을 언급할 뿐 해당 기록을
      나타내는 엔티티나 참조도 없어 Result부터 통보 증거까지의 경로가 끊긴다.
    how_to_fix: 임계치 정의와 임계치 발생/통보 기록을 분리하고, 발생 기록을 Result에 연결한다. 통보 기록에는 시각과 수신자 참조를
      포함해 Result→임계치 발생→통보의 추적 경로를 선언한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 임상검사 결과와 운영 상태를 연결된 개념 모델로 정의하여 EMR/LIS 통합의 권위 문서로 사용하는 목적
      failure_condition: 특정 위험 Result에 대해 즉시 통보가 수행되었는지 통합 시스템이 판별하거나 감사해야 할 때
      impact: 통보 여부가 결과 인스턴스와 결합되지 않아 시스템 간 상태 교환과 추적의 기준이 될 수 없고, 동일 Test의 여러 결과 사이에서
        통보 상태가 모호해진다.
      evidence_refs:
        - materialized-input.md:62-84
        - materialized-input.md:100-106
        - materialized-input.md:108-119
    causal_path:
      root_cause_candidate: CriticalValue에 Result 및 통보 기록으로 이어지는 관계가 선언되지 않았다.
      root_cause_step_id: structure-candidate-002.cause-002
      steps:
        - cause_id: structure-candidate-002.cause-001
          claim: "`notified` 상태를 특정 Result나 수신자·시각 기록에 귀속할 구조적 경로가 없다."
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
            - materialized-input.md:108-119
        - cause_id: structure-candidate-002.cause-002
          claim: CriticalValue는 Test만 참조하며 Result 또는 별도 통보 기록 엔티티와의 관계가 누락되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:100-119
      unresolved_beyond_evidence: 전화 기록 대장의 외부 스키마와 연동 방식은 현재 경계에 포함되지 않아 확인할 수 없다.
