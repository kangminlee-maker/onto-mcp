findings:
  - candidate_id: semantics-candidate-001
    target: Test 및 Assay 개념
    evidence_anchor: materialized-input.md:46-66,126-127
    claim: Test와 Assay의 의미적 경계와 대응 관계가 결정되지 않은 채 두 카탈로그가 함께 권위 모델에 노출되어 있다.
    what: 두 엔티티가 모두 검사 카탈로그의 수행 단위로 정의되고 신규 항목을 양쪽에 등록하지만, 동의어인지 상하위 개념인지 또는 다대다
      대응인지 명시되지 않는다. Result는 Test만 참조한다.
    why: EMR의 주문 항목과 LIS의 실제 수행 항목을 번역할 때 어느 코드가 동일한 검사를 뜻하는지 결정할 수 없다. 패널·개별 분석 항목
      또는 주문 가능 항목·수행 항목의 차이가 소실되면 결과가 잘못된 주문 항목에 귀속될 수 있다.
    how_to_fix: Test를 주문 가능 서비스, Assay를 실제 수행 분석 항목 등으로 각각 엄밀히 정의하고 명시적인 대응 관계와
      카디널리티를 추가한다. 실제로 동의어라면 하나를 정식 개념으로 정하고 다른 이름과 코드는 별칭으로 매핑한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서
      failure_condition: 주문 코드와 수행·결과 코드를 교환하거나 매핑할 때 Test와 Assay 중 어느 개념과 식별자를 사용해야
        하는지 결정해야 하는 경우
      impact: 핵심 통합 경계에서 코드 동일성 및 결과 귀속을 일관되게 판정할 수 없어 권위 문서로서의 실행 가능성이 약화된다.
      evidence_refs:
        - materialized-input.md:46-66
        - materialized-input.md:126-127
        - materialized-input.md:6-8
    causal_path:
      root_cause_candidate: Test와 Assay의 정체성 및 대응 모델 결정을 카탈로그 정비 이후로 유예한 것
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: Test와 Assay가 모두 검사 카탈로그 단위로 정의되어 의미 영역이 겹친다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:46-60
        - cause_id: semantics-candidate-001.cause-002
          claim: 신규 항목을 양쪽에 등록하지만 두 개념 사이의 관계는 정의되어 있지 않다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:108-119
            - materialized-input.md:126-127
        - cause_id: semantics-candidate-001.cause-003
          claim: 통합 여부를 미래 검토 사항으로 남겼다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:126-127
      unresolved_beyond_evidence: 실제 운영 카탈로그에서 Test와 Assay가 일대일, 일대다 또는 다대다인지 여부는 현재 경계의 자료만으로 확정할 수 없다.
  - candidate_id: semantics-candidate-002
    target: Result.status와 Report.result_status
    evidence_anchor: materialized-input.md:62-84,121-123
    claim: 서로 다른 집계 수준의 상태를 '동일 정보'라고 선언하면서 다른 어휘와 지연 동기화를 사용해 의미와 권위가 충돌한다.
    what: 개별 Result는 preliminary/final/corrected를 사용하고 Report는
      prelim/finalized/amended를 사용한다. 전자는 LIS 기록값이지만 후자는 임상의가 신뢰하는 권위 값이며,
      corrected에서 amended로의 반영은 야간 배치까지 지연된다.
    why: 개별 결과 상태와 보고서 전체의 공개·개정 상태는 동일 개념이라고 단정할 수 없다. 현재 모델에서는 같은 시점에 LIS 원천값은
      corrected이고 임상의 권위값은 finalized일 수 있어, 어느 상태가 환자 진료에 유효한지 일관되게 해석할 수 없다.
    how_to_fix: 개별 결과 상태와 보고서 생명주기를 별도 개념으로 명명한다. 보고서 상태가 결과 상태에서 파생된다면 다중 결과의 집계
      규칙, 전체 상태 매핑, 갱신 시점 및 충돌 시 우선권을 하나의 권위 규칙으로 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 임상의가 신뢰할 수 있는 EMR/LIS 결과 상태의 개념 권위 제공
      failure_condition: 결과가 정정된 뒤 야간 동기화가 수행되기 전 또는 여러 Result가 서로 다른 상태를 가진 경우
      impact: 임상의에게 노출되는 권위 상태가 LIS의 실제 결과 상태와 모순될 수 있어 정정 결과의 해석과 후속 조치가 지연될 위험이 있다.
      evidence_refs:
        - materialized-input.md:69-83
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: 개별 결과 상태와 집계 보고서 상태를 하나의 정보로 취급하면서 단일한 의미·파생·권위 규칙을 두지 않은 것
      root_cause_step_id: semantics-candidate-002.cause-003
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: Result.status와 Report.result_status가 동일 정보라고 기술되지만 값 집합이 다르다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-83
        - cause_id: semantics-candidate-002.cause-002
          claim: Report 필드는 임상의가 신뢰하는 권위 값인데 정정 반영은 야간 배치로 지연된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:80-83
            - materialized-input.md:121-123
        - cause_id: semantics-candidate-002.cause-003
          claim: 개별 상태와 보고서 집계 상태를 구분하거나 즉시 파생하는 의미 규칙이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:62-84
            - materialized-input.md:121-123
      unresolved_beyond_evidence: 야간 배치 이전에 별도의 긴급 정정 통지 경로가 있는지는 현재 경계에서 확인할 수 없다.
  - candidate_id: semantics-candidate-003
    target: STAT 주문 모델
    evidence_anchor: materialized-input.md:15-29
    claim: STAT이라는 하나의 의미가 priority 값, is_stat 불리언, StatOrder 하위 타입으로 중복 표현되며 동치 조건이
      없다.
    what: Order가 priority=stat와 is_stat을 동시에 보유하고, 별도로 StatOrder가 Order의 하위 타입으로
      선언된다.
    why: 같은 주문이 세 표현에서 서로 다른 판정을 가질 수 있다. 또한 긴급도라는 운영상 분류를 필수적 정체성을 나타내는 하위 타입으로
      사용하면 일반 Order가 언제 StatOrder가 되는지와 다시 일반 주문으로 바뀔 수 있는지가 불명확하다.
    how_to_fix: priority를 정식 권위 속성으로 정하고 is_stat과 StatOrder를 파생 뷰로 정의하거나 제거한다. 하위
      타입을 유지한다면 priority=stat, is_stat=true, StatOrder 소속의 필요충분조건과 변경 가능성을 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS 간 주문 긴급도의 일관된 의미 전달
      failure_condition: 세 STAT 표현 중 일부만 갱신되거나 시스템별로 서로 다른 표현을 권위값으로 선택하는 경우
      impact: 주문 우선순위 해석이 갈려 긴급 검사의 라우팅과 처리 기준에 대한 통합 계약이 불명확해진다.
      evidence_refs:
        - materialized-input.md:15-29
    causal_path:
      root_cause_candidate: 긴급도라는 단일 분류 의미에 대해 정식 권위 표현과 파생 규칙을 선택하지 않은 것
      root_cause_step_id: semantics-candidate-003.cause-002
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: STAT 여부가 enum, boolean, subtype 세 방식으로 동시에 표현된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:21-29
        - cause_id: semantics-candidate-003.cause-002
          claim: 세 표현 사이의 동치 조건이나 파생 방향이 정의되지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:15-29
      unresolved_beyond_evidence: STAT 우선순위가 주문 발행 후 변경 가능한지 여부는 현재 자료에 명시되지 않았다.
  - candidate_id: semantics-candidate-004
    target: CriticalValue 엔티티
    evidence_anchor: materialized-input.md:100-106
    claim: CriticalValue가 임계값 규칙과 실제 통보 사건이라는 서로 다른 존재론적 유형을 한 엔티티에 혼합한다.
    what: 정의와 lower_bound/upper_bound는 검사별 위험 범위 규칙을 나타내지만 notified는 특정 위험 결과 발생 후의
      통보 완료 상태를 나타낸다. 어떤 Result에 대한 통보인지 연결도 없다.
    why: 반복 사용되는 기준 설정과 환자별 발생·통보 기록은 서로 다른 정체성과 수명주기를 가진다. 이를 한 개념으로 취급하면 임계값 변경이
      과거 통보의 의미를 바꾸거나, 여러 위험 결과가 하나의 notified 값으로 축약될 수 있다.
    how_to_fix: 검사별 CriticalValueRule 또는 CriticalThreshold와, 특정 Result를 참조하는
      CriticalValueEvent/Notification을 분리한다. 통보 여부·시각·수신자는 사건 쪽에 두고 사건이 적용한 규칙
      버전도 추적한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 위험 결과와 통보 상태를 EMR/LIS에서 동일하게 해석하는 개념 권위 제공
      failure_condition: 동일 검사에서 여러 위험 결과가 발생하거나 임계값 규칙이 변경되는 경우
      impact: 기준 설정과 실제 환자 통보 기록을 구별할 수 없어 통보 여부와 적용 기준의 의미가 모호해진다.
      evidence_refs:
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: 재사용 가능한 판정 규칙과 개별 결과에 대한 통보 사건을 하나의 CriticalValue 개념으로 모델링한 것
      root_cause_step_id: semantics-candidate-004.cause-002
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: CriticalValue의 정의와 경계값은 규칙을 나타내지만 notified는 사건 상태를 나타낸다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: semantics-candidate-004.cause-002
          claim: 통보 상태를 귀속할 Result 참조가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100-106
      unresolved_beyond_evidence: 외부 전화 기록 대장이 결과 식별자와 임계값 버전을 보존하는지는 현재 경계에서 확인할 수 없다.
  - candidate_id: semantics-candidate-005
    target: Specimen-Result 관계 의미
    evidence_anchor: materialized-input.md:37-44,62-73,108-119
    claim: 물리적 검체를 결과의 생산 행위자로 표현한 produces 관계가 이미 선언된 derived_from 의미와 충돌한다.
    what: Result→Specimen은 derived_from으로 정의되지만 역방향 Specimen→Result는 produces로 명명된다.
      Result 정의는 Test 수행의 결과라고 설명한다.
    why: 검체는 결과의 물질적 원천이지 분석 행위를 수행하는 주체가 아니다. produces는 검사 수행 과정이나 실행 주체의 인과 의미를
      검체에 부여해, 통합 구현자가 단순 출처 관계를 실행·생성 관계로 오해할 수 있다.
    how_to_fix: 역관계가 필요하면 is_source_of 또는 has_derived_result처럼 derived_from의 정확한
      역의미로 명명한다. 실제 생산 행위를 표현해야 한다면 Test/Assay 실행 같은 과정 개념을 생산 주체로 둔다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 검체, 검사 수행, 결과 사이의 의미적으로 정확한 통합 관계 제공
      failure_condition: 관계 이름을 이용해 결과 생성 이벤트, 계보 또는 책임 주체를 해석하는 경우
      impact: 물질적 출처와 수행 과정이 혼동되어 결과 계보 및 이벤트 매핑이 잘못 구현될 수 있다.
      evidence_refs:
        - materialized-input.md:37-44
        - materialized-input.md:62-73
        - materialized-input.md:108-119
    causal_path:
      root_cause_candidate: 결과의 물질적 출처와 결과를 산출하는 분석 행위를 구분하지 않은 것
      root_cause_step_id: semantics-candidate-005.cause-002
      steps:
        - cause_id: semantics-candidate-005.cause-001
          claim: 같은 Specimen-Result 연결이 derived_from과 produces라는 비대칭 의미로 표현된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:118-119
        - cause_id: semantics-candidate-005.cause-002
          claim: Result 자체는 Test 수행의 결과로 정의되어 검체가 수행 주체라는 해석과 맞지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:62-66
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-006
    target: 검체 유형 어휘
    evidence_anchor: materialized-input.md:37-60
    claim: Test와 Assay가 검체 요구사항을 서로 다른 타입·값 체계로 표현하지만 의미적 대응이 정의되지 않는다.
    what: Test.requires_specimen_type은 blood/urine/tissue/swab 열거형인 반면
      Assay.specimen_kind는 WB/Serum/Urine-random 같은 자유 문자열을 사용한다.
    why: 두 필드가 같은 개념의 다른 코드 체계인지, 상하위 분류인지, 서로 다른 개념인지 판단할 수 없다. EMR의 주문 적합성 값과 LIS
      분석기의 검체 값을 직접 비교하면 거짓 일치 또는 거짓 불일치가 발생할 수 있다.
    how_to_fix: 두 필드의 의미와 분류 수준을 구분해 이름을 정하고, 정식 검체 개념 또는 코드 체계를 참조하도록 한다. 서로 다른
      분류라면 명시적인 대응 관계와 허용 변환 규칙을 제공한다.
