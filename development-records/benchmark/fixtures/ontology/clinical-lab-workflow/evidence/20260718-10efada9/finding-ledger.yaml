  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260718-10efada9/round1/coverage.findings.yaml#coverage-candidate-001
    target: Specimen lifecycle and pre-analytic workflow coverage
    evidence_anchor: materialized-input.md:37-44,108-110,118-124
    claim: Specimen lifecycle omits exception handling and terminal custody states.
    lens_rationale_summary: When a specimen is unsuitable, lost, recollected,
      retained, or destroyed, EMR and LIS cannot express the event or determine
      whether an order may proceed. A conceptual authority spanning order
      through report therefore leaves a material workflow segment undefined.
    proposed_action: Extend Specimen with pre-analytic and terminal states and
      events, including collection/accession, transport and receipt, rejection
      reason, recollection linkage, storage location and retention period,
      disposal actor/time/reason, and explicit allowed transitions.
    affected_purpose: Using the ontology as the conceptual authority for EMR/LIS
      laboratory workflow integration.
    failure_condition: A specimen is rejected, recollected, lost, stored, or
      disposed rather than following the collected-to-analyzed happy path.
    impact: Systems cannot exchange or consistently interpret the specimen's
      operational state, blocking reliable order progression and audit
      reconstruction.
    evidence_refs:
      - .onto/review/20260718-10efada9/round1/coverage.findings.yaml#coverage-candidate-001
      - materialized-input.md:37-44
      - materialized-input.md:121-124
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Using the ontology as the conceptual authority for EMR/LIS
        laboratory workflow integration.
      failure_condition: A specimen is rejected, recollected, lost, stored, or
        disposed rather than following the collected-to-analyzed happy path.
      impact: Systems cannot exchange or consistently interpret the specimen's
        operational state, blocking reliable order progression and audit
        reconstruction.
      evidence_refs:
        - materialized-input.md:37-44
        - materialized-input.md:121-124
    causal_path:
      root_cause_candidate: The bounded ontology models only the specimen happy path
        and delegates post-analysis lifecycle semantics outside its authority.
      root_cause_step_id: finding-004.cause-002
      steps:
        - cause_id: finding-004.cause-001
          claim: The declared Specimen lifecycle contains only collected, received,
            in_analysis, and analyzed.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37-44
        - cause_id: finding-004.cause-002
          claim: Post-analysis storage and disposal are not modeled and are delegated to
            departmental rules.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:121-124
      unresolved_beyond_evidence: The contents of departmental rules are outside the
        allowed evidence, but their existence would not close the ontology's
        role as the shared conceptual authority.
  - finding_id: finding-005
    lens_id: coverage
    source_ref: .onto/review/20260718-10efada9/round1/coverage.findings.yaml#coverage-candidate-002
    target: Audit evidence for verification, release, correction, and critical-value
      notification
    evidence_anchor: materialized-input.md:62-84,100-106,121-124
    claim: Controlled clinical actions lack a first-class audit-evidence model.
    lens_rationale_summary: Verification, release, amendment, and critical
      notification are safety-relevant acts. Without complete evidence concepts,
      EMR/LIS integration cannot reconstruct who performed an act, when, why, or
      against which result/report version.
    proposed_action: Introduce a shared auditable event concept and specialized
      verification, release, correction/amendment, and notification events.
      Require actor, timestamp, reason/basis, affected version, and—where
      applicable—recipient, channel, acknowledgement, and escalation outcome.
    affected_purpose: Providing an operationally trustworthy conceptual authority
      for laboratory result exchange and reporting.
    failure_condition: A result is verified or corrected, a report is released or
      amended, or a critical value is communicated or escalated.
    impact: The integrated workflow cannot prove or reliably reconcile
      safety-relevant actions, weakening accountability and incident
      investigation.
    evidence_refs:
      - .onto/review/20260718-10efada9/round1/coverage.findings.yaml#coverage-candidate-002
      - materialized-input.md:62-84
      - materialized-input.md:100-106
      - materialized-input.md:121-124
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Providing an operationally trustworthy conceptual authority
        for laboratory result exchange and reporting.
      failure_condition: A result is verified or corrected, a report is released or
        amended, or a critical value is communicated or escalated.
      impact: The integrated workflow cannot prove or reliably reconcile
