  - finding_id: finding-007
    lens_id: coverage
    source_ref: .onto/review/20260718-10efada9/round1/coverage.findings.yaml#coverage-candidate-004
    target: Cross-system authority for duplicated catalogs, statuses, and TAT
    evidence_anchor: materialized-input.md:46-60,69-84,121-128
    claim: Several shared concepts are maintained in parallel without one declared
      source of truth and deterministic projection rule.
    lens_rationale_summary: Parallel representations without one authority permit
      drift. EMR, LIS, analyzer catalogs, reports, and dashboards can produce
      incompatible answers for the same test, status, or turnaround time.
    proposed_action: For each duplicated concept, designate a single authoritative
      entity/system and define versioned mappings or derived projections. Make
      Report status and TAT deterministic derivations from authoritative events,
      and replace dual Test/Assay registration with an explicit versioned
      mapping and ownership model.
    affected_purpose: Establishing precedence and shared meaning across EMR/LIS
      integration boundaries.
    failure_condition: The duplicated catalog entries, status fields, or dashboard
      calculation diverge or synchronize late.
    impact: Consumers receive conflicting operational truth, directly defeating the
      authority and precedence expected from this ontology.
    evidence_refs:
      - .onto/review/20260718-10efada9/round1/coverage.findings.yaml#coverage-candidate-004
      - materialized-input.md:46-60
      - materialized-input.md:69-84
      - materialized-input.md:121-128
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Establishing precedence and shared meaning across EMR/LIS
        integration boundaries.
      failure_condition: The duplicated catalog entries, status fields, or dashboard
        calculation diverge or synchronize late.
      impact: Consumers receive conflicting operational truth, directly defeating the
        authority and precedence expected from this ontology.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:69-84
        - materialized-input.md:121-128
    causal_path:
      root_cause_candidate: The ontology permits parallel maintenance of shared values
        without consistently assigning authority and derivation ownership.
      root_cause_step_id: finding-007.cause-003
      steps:
        - cause_id: finding-007.cause-001
          claim: Test and Assay require duplicate registration, Result and Report retain
            parallel status values, and TAT logic is maintained outside the
            ontology.
          relation_to_previous: null
          evidence_refs:
