  - finding_id: finding-006
    lens_id: coverage
    source_ref: .onto/review/20260718-10efada9/round1/coverage.findings.yaml#coverage-candidate-003
    target: Temporal validity and historical versioning of laboratory definitions
    evidence_anchor: materialized-input.md:46-60,100-106,126-128
    claim: Time-dependent catalog and critical-threshold concepts have no validity
      or history dimensions.
    lens_rationale_summary: Catalog definitions, assay mappings, and critical
      thresholds can change. Without temporal versions, a historical Result
      cannot be interpreted against the definitions and alert policy effective
      when it was produced.
    proposed_action: Add immutable versions or effective_from/effective_to to Test,
      Assay, their mapping, and CriticalValue; include retirement/replacement
      lineage and bind each Result to the exact applicable definition and
      threshold version.
    affected_purpose: Serving as a durable conceptual authority for EMR/LIS
      interpretation of current and historical laboratory data.
    failure_condition: A test definition, assay implementation, specimen
      requirement, or critical-value threshold changes after results have been
      issued.
    impact: Historical results and past notification decisions cannot be
      reconstructed consistently, making audits and longitudinal interpretation
      unreliable.
    evidence_refs:
      - .onto/review/20260718-10efada9/round1/coverage.findings.yaml#coverage-candidate-003
      - materialized-input.md:46-60
      - materialized-input.md:100-106
      - materialized-input.md:126-128
    severity: high
    domain_threshold_used: null
    materiality_basis:
