    claim: Result is too coarse to represent clinically interpretable and
      reproducible laboratory observations.
    lens_rationale_summary: The same textual value and unit can have different
      meanings depending on method, interval, timing, and qualifiers. EMR/LIS
      consumers cannot reliably display, trend, compare, or reproduce the result
      from the current concept set.
