      # Onto

      이 skill은 `onto-mcp`의 MCP-native tool surface를 사용하는 host adapter 지침입니다.

      ## Active Boundary

      Codex/host 설정에서 MCP 서버는 아래 command로 시작됩니다.

      ```bash
      onto mcp
      ```

      `onto mcp`는 단발성 review 명령이 아니라 stdio MCP 서버입니다. 실제 작업은 host에 노출된 MCP tool call로 수행합니다.

      ## Tool Use

      현재 주요 tool:

      - `onto_review`: review 실행
      - `onto_prepare_review`: 실행 전 review session과 prompt packet 준비
      - `onto_review_status`: review session 상태 조회
      - `onto_review_result`: 완료된 review 결과 조회
      - `onto_list_lenses`: lens 목록 조회
      - `onto_list_domains`: domain 목록 조회
      - `onto_observe_source`, `onto_reconstruct`, `onto_reconstruct_status`, `onto_reconstruct_result`: reconstruct 경로

      사용자가 review를 요청하면:

      1. target과 intent를 해석합니다.
      2. 현재 tool 목록에 `onto_review`가 있으면 shell command 대신 `onto_review` MCP tool을 호출합니다.
      3. 준비만 요청했거나 실행 전 확인이 필요하면 `onto_prepare_review`를 호출합니다.
      4. 진행/결과 확인은 `onto_review_status`와 `onto_review_result`를 사용합니다.

      ## Missing Tool Surface

      현재 세션에 `onto_*` MCP tools가 노출되어 있지 않으면, review를 임의의 shell command로 대체하지 않습니다. 대신 MCP 서버가 현재 Codex 세션에 아직 로드되지 않았다고 알리고, 새 세션/앱 재시작 후 다시 확인하도록 안내합니다.

      로컬 서버 readiness만 확인해야 할 때는 아래처럼 MCP 서버 시작 가능성과 `tools/list` 응답을 검증할 수 있습니다.

      ```bash
      onto mcp
      ```

