findings:
  - candidate_id: semantics-candidate-001
    target: Result.status, Report.result_status 및 관련 state_rules
    evidence_anchor: materialized-input.md:62-84,121-123
    claim: 동일 정보라고 선언된 결과 상태가 서로 다른 어휘·권위·갱신 주기로 이중 모델링되어 있다.
    what: Result는 preliminary/final/corrected를 사용하고 Report는
      prelim/finalized/amended를 권위 값으로 사용한다. corrected 결과는 야간 배치 전까지 finalized
      보고서와 공존할 수 있으며, Order 완료 규칙은 corrected를 최종 결과로 인정하는지도 정의하지 않는다.
    why: 두 상태 집합은 단순 동의어가 아니다. corrected는 결과의 정정 이력이고 amended는 보고서 변경 상태이므로 일대일 동일
      정보로 취급할 수 없다. 독립 저장과 지연 동기화는 EMR과 LIS가 서로 다른 임상 상태를 권위 값으로 해석하게 만든다.
    how_to_fix: 결과 검증 상태와 보고서 발행·개정 상태를 별도 개념으로 정의하고 각각 단일 권위를 지정한다. 두 상태 사이의 명시적
      전이·투영 규칙을 두며, Order 완료 조건은 final 또는 corrected처럼 임상적으로 최종인 상태 집합을 이름 있는
      판정으로 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동의 상태 의미와 권위를 일관되게 정의하는 개념 권위 문서 역할
      failure_condition: 결과가 정정되었지만 야간 동기화 전이거나, 소비자가 서로 다른 상태 열거형을 직접 해석할 때
      impact: 임상의에게 노출되는 보고 상태가 LIS의 실제 결과 상태와 달라질 수 있고, 주문 완료 여부도 소비자별로 달라진다.
      evidence_refs:
        - materialized-input.md:69-83
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: 결과 검증 상태와 보고서 발행 상태를 ‘동일 정보’로 간주하면서 두 독립 권위 필드로 저장한 개념 혼합
      root_cause_step_id: semantics-candidate-001.cause-003
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: Result와 Report가 서로 다른 상태 어휘를 사용하면서 모두 같은 결과 상태를 나타낸다고 선언한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-83
        - cause_id: semantics-candidate-001.cause-002
          claim: Report 상태를 야간 배치로 갱신하도록 해 두 표현의 불일치 구간을 허용한다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:123
        - cause_id: semantics-candidate-001.cause-003
          claim: 결과 검증과 보고서 발행·개정이라는 서로 다른 생명주기를 하나의 상태 의미로 혼합했다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:72-83
            - materialized-input.md:123
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: Order.priority, Order.is_stat 및 StatOrder
    evidence_anchor: materialized-input.md:15-29
    claim: STAT라는 주문의 가변 우선순위 역할을 Order의 하위 존재론적 유형이자 두 개의 독립 속성으로 동시에 표현한다.
    what: 동일한 STAT 여부가 priority=stat, is_stat=true, StatOrder 인스턴스 여부로 세 번 표현된다.
      StatOrder는 Order의 하위 타입이지만 STAT는 주문이 평생 필수적으로 가지는 본질적 유형인지 정의되지 않는다.
    why: 우선순위가 변경되면 동일 주문이 하위 타입을 얻거나 잃어야 하며 세 표현이 서로 어긋날 수 있다. 이는 일시적 역할을 고정 유형으로
      취급하는 rigidity 문제이며 시스템별 주문 분류를 불일치시킨다.
    how_to_fix: Order.priority를 STAT 여부의 단일 권위로 사용하고 is_stat은 파생값으로만 노출한다.
      stat_reason은 priority=stat일 때 적용되는 조건부 속성으로 둔다. 별도 StatOrder가 반드시 필요하다면 타입
      정체성과 전환 규칙을 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR과 LIS가 같은 주문 우선순위와 주문 유형을 해석하도록 하는 개념 계약
      failure_condition: STAT 지정 또는 해제가 발생하거나 세 표현 중 일부만 전달·갱신될 때
      impact: 한 시스템은 일반 주문, 다른 시스템은 STAT 주문으로 처리하여 큐 우선순위와 알림 동작이 달라질 수 있다.
      evidence_refs:
        - materialized-input.md:21-29
    causal_path:
      root_cause_candidate: 가변 우선순위 역할을 본질적 하위 타입과 중복 플래그로 동시에 모델링함
      root_cause_step_id: semantics-candidate-002.cause-002
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: STAT 여부가 priority, is_stat, StatOrder 타입으로 중복 표현된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:21-29
        - cause_id: semantics-candidate-002.cause-002
          claim: StatOrder가 Order의 하위 타입으로 선언되어 가변 상태를 고정 분류처럼 만든다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:25-29
      unresolved_beyond_evidence: 실제 운영에서 주문 우선순위 변경을 허용하는지는 경계 내 자료에 명시되지 않았다.
  - candidate_id: semantics-candidate-003
    target: Test, Assay, Result 사이의 의미 경계
    evidence_anchor: materialized-input.md:46-73,108-119,126-127
    claim: 주문 가능 단위 Test와 수행 단위 Assay를 별도 개념으로 선언했지만 상호 매핑과 결과 귀속 의미가 정의되지 않았다.
    what: Test는 주문 가능한 단일 검사 항목, Assay는 분석기 수행 단위라고 정의된다. 그러나 Result는 Test만 참조하고
      Test-Assay 관계는 없으며, 신규 항목은 두 카탈로그에 모두 등록하도록 한다.
    why: 두 개념이 동의어인지, 하나의 Test가 여러 Assay로 실현되는지, 하나의 Assay가 여러 Test를 지원하는지 판정할 수 없다.
      따라서 EMR 주문 코드와 LIS 수행·결과 코드의 의미 보존 매핑을 이 문서에서 도출할 수 없다.
    how_to_fix: Test를 orderable catalog concept, Assay를 executable measurement
      concept처럼 구분하고 명시적인 realizes/implemented_by 관계와 카디널리티를 정의한다. Result가 어느 수행
      인스턴스와 주문 항목을 각각 참조하는지도 분리한다. 통합 여부는 그 의미 판정 후 결정한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR 주문 단위와 LIS 수행·결과 단위 사이의 개념 권위 제공
      failure_condition: 한 주문 항목이 수행 코드로 변환되거나 수행 결과가 EMR 주문 항목으로 환원될 때
      impact: 인터페이스 구현자가 임의의 1:1 매핑을 만들거나 이중 등록된 카탈로그가 서로 드리프트할 수 있다.
      evidence_refs:
        - materialized-input.md:46-73
        - materialized-input.md:127
    causal_path:
      root_cause_candidate: 주문 가능 개념과 수행 가능 개념을 분리했지만 둘 사이의 의미적 실현 관계를 모델링하지 않음
      root_cause_step_id: semantics-candidate-003.cause-003
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: Result는 Test만 참조하고 Assay는 어떤 결과·주문 관계에도 참여하지 않는다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:62-73
            - materialized-input.md:108-119
        - cause_id: semantics-candidate-003.cause-002
          claim: 신규 항목을 두 카탈로그에 모두 등록하도록 해 매핑 없는 병렬 권위를 유지한다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:127
        - cause_id: semantics-candidate-003.cause-003
          claim: Test와 Assay의 실현 관계 및 카디널리티가 정의되지 않았다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:108-119
      unresolved_beyond_evidence: CBC와 BMP 예시가 이 기관에서 패널인지 단일 보고 항목인지는 경계 내 자료만으로 확정할 수 없다.
  - candidate_id: semantics-candidate-004
    target: CriticalValue 엔티티
    evidence_anchor: materialized-input.md:100-106
    claim: 임계값 정책과 개별 통보 사건을 하나의 CriticalValue 유형으로 혼합한다.
    what: 정의와 lower_bound/upper_bound는 검사별 위험 범위 규칙을 나타내지만 notified는 특정 결과에 대한 통보 완료
      상태를 나타낸다. 엔티티에는 result_ref, 통보 시각, 수신자 같은 사건 식별 정보가 없다.
    why: 재사용되는 임계값 규칙 하나에 notified를 기록하면 어떤 환자·결과의 통보인지 의미가 성립하지 않는다. 반대로 개별 사건이라면
      경계값을 매 사건마다 복제하게 되어 정책과 사건의 정체성이 혼동된다.
    how_to_fix: 검사별 CriticalLimit 또는 CriticalRange 정책과, 특정 Result에 연결되는
      CriticalResult/Notification 사건을 분리한다. notified는 통보 사건의 상태로 두고 시각·수신자 또는 권위
      기록 참조를 같은 사건에 연결한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 위험 결과의 판정과 즉시 통보 상태를 EMR/LIS가 동일하게 해석하는 것
      failure_condition: 같은 검사에서 여러 환자의 위험 결과가 발생하거나 임계값 정책이 변경될 때
      impact: 통보 완료 여부가 특정 결과에 귀속되지 않아 중복 통보 또는 미통보를 구분할 수 없다.
      evidence_refs:
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: 지속되는 판정 정책과 일회성 통보 사건을 하나의 존재론적 유형으로 모델링함
      root_cause_step_id: semantics-candidate-004.cause-003
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: 범위 규칙을 나타내는 엔티티에 통보 완료 boolean이 직접 배치되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: semantics-candidate-004.cause-002
          claim: 통보 상태를 귀속할 Result 또는 환자별 사건 관계가 없다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: semantics-candidate-004.cause-003
          claim: 임계값 정책과 개별 임상 사건의 정체성을 구분하지 않았다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:100-106
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-005
    target: Specimen-Result produces 관계
    evidence_anchor: materialized-input.md:54-73,118-119
    claim: 물리적 입력물인 Specimen을 Result의 생산 주체로 명명해 수행 행위와 재료 기원을 혼동한다.
    what: Result→Specimen은 이미 derived_from으로 표현되지만 역방향에는 Specimen produces Result가
      추가된다. 동시에 Assay는 분석기에서 수행되는 단위로 정의되어 있으나 결과 생산 관계에는 참여하지 않는다.
    why: 검체는 결과의 재료적 출처이고, 결과를 생성하는 것은 검사 수행 또는 분석 행위다. produces라는 인과 술어는 분석 수행 주체를
      검체로 오인하게 하여 결과 provenance를 왜곡한다.
    how_to_fix: Specimen과 Result 사이에는 derived_from 또는 has_result처럼 재료 기원 관계를 사용한다.
      별도의 AssayExecution/TestExecution을 두고 Result generated_by 실행 관계를 연결한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 검체에서 검사 수행과 결과 생성까지의 provenance를 정확히 전달하는 개념 문서 역할
      failure_condition: LIS 수행 이력, 재검, 장비 추적 또는 결과 계보를 관계 의미로 해석할 때
      impact: 소비자가 검체 자체를 결과 생성 행위로 취급하여 실제 수행 단위와 결과의 연결을 잃는다.
      evidence_refs:
        - materialized-input.md:54-73
        - materialized-input.md:118-119
    causal_path:
      root_cause_candidate: 재료적 기원과 수행 행위의 인과 역할을 구분하는 실행 개념이 없음
      root_cause_step_id: semantics-candidate-005.cause-003
      steps:
        - cause_id: semantics-candidate-005.cause-001
          claim: Specimen이 Result를 produces한다고 선언되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:119
        - cause_id: semantics-candidate-005.cause-002
          claim: 결과의 재료적 기원은 별도의 derived_from 관계로 이미 표현된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:118-119
        - cause_id: semantics-candidate-005.cause-003
          claim: Assay는 수행 단위로 정의되지만 Result와 연결되지 않아 생산 행위의 자리가 비어 있다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:54-73
            - materialized-input.md:108-119
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - 검토 대상의 명시대로 이 온톨로지가 EMR/LIS 통합의 개념 권위 문서로 소비된다고 가정했다.
  - session_domain이 none이므로 외부 임상 표준이나 기관별 업무 규칙은 사용하지 않고 대상 문서 내부의 정의·관계·상태
    선언만으로 판정했다.
