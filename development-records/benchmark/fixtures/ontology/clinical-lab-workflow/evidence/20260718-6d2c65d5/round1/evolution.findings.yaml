findings:
  - candidate_id: evolution-candidate-001
    target: Test–Assay catalog model
    evidence_anchor: materialized-input.md:46-60,126-127
    claim: 신규 검사 항목을 두 독립 카탈로그에 중복 등록해야 하므로 확장 시 개념 정합성이 보존되지 않는다.
    what: Test와 Assay가 별도 코드·이름·부서·검체 필드를 가지지만 두 개념 사이의 식별·매핑·버전 관계가 없고, 신규 항목은 양쪽에
      모두 등록하도록 명시되어 있다.
    why: 한쪽 등록 누락이나 코드 변경이 생기면 주문 가능한 Test와 실제 수행 Assay가 서로 다른 항목을 가리킬 수 있다. 신규
      장비·수행법·검사 패널을 추가할 때마다 양쪽 구조와 운영 데이터를 함께 수정해야 하므로 EMR/LIS 통합의 개념 권위가 분기된다.
    how_to_fix: 주문 개념인 Test를 기준 권위로 두고 Assay를 명시적으로 연결하는 관계를 추가하라. 매핑에는 안정 식별자, 유효
      기간, 버전, 대체 관계를 두고 신규 항목이 단일 등록 후 하나 이상의 수행 Assay로 확장되도록 모델링하라.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 검사 카탈로그의 단일하고 확장 가능한 의미를 제공하는 목적
      failure_condition: 신규 검사나 분석기별 수행 항목을 추가하거나 기존 코드·수행법을 변경할 때 Test와 Assay를 독립적으로 갱신하는 경우
      impact: 주문과 수행의 식별 연속성이 깨져 두 시스템이 서로 다른 카탈로그 의미를 구현할 수 있다.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: 주문 카탈로그와 수행 카탈로그 사이의 권위·매핑·버전 관계가 모델에 없다.
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 신규 항목은 Test와 Assay 두 곳에 모두 등록해야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:126-127
        - cause_id: evolution-candidate-001.cause-002
          claim: 두 엔티티는 유사한 코드·명칭·부서·검체 속성을 독립적으로 보유하고 직접 관계는 정의되지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
