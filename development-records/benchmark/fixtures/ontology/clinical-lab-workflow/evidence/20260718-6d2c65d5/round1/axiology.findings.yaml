      명시한다. 따라서 임상검사 온톨로지에서 관찰되는 상태 중복, 야간 동기화, 검체 폐기 외부화 등의 선택이 선언된 가치와 정렬되는지
      판단할 근거가 없으며, 이 lens의 핵심 목적 전체가 수행되지 않는다.
    how_to_fix: execution preparation 단계에서 지정된 순위 1~3 권위 자료의 관련 조항을 허용 컨텍스트와 prompt
      packet에 명시적으로 바인딩한 뒤 axiology unit을 다시 실행한다. 각 finding이 요구하는
