    what: axiology 역할 계약은 core lexicon, 제품화 헌장 및 원칙, 활성 review contract를 가치 판단의 근거로
      주입하도록 요구하지만, 허용된 컨텍스트에는 사용자 요청 의도만 있고 해당 권위 자료나 그 발췌가 없다.
