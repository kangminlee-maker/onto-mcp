per_lens_provenance:
  axiology:
    domain_constraints_used: []
    domain_context_assumptions:
      - 외부 임상 규정은 사용하지 않았으며, `임상의는 이 값을 신뢰한다`, `즉시 통보가 필요한`, `EMR/LIS 연동 설계의 개념
        권위 문서`라는 대상 자체의 선언을 가치 판단의 맥락으로 사용했다.
      - session_domain이 none이므로 특정 병원·지역의 보존기간, 통보 기한 또는 의료 규제 요건은 가정하지 않았다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - The declared Order-to-Report scope is interpreted as requiring shared
        concepts for workflow stages that EMR and LIS must exchange or
        reconcile, not every department-specific implementation detail.
      - Absence claims are bounded to the complete materialized target artifact;
        no external clinical standard or domain document was used.
      - Verification, report release, result correction, and critical-value
        notification are treated as controlled actions because the target itself
        models them as clinically meaningful workflow state or communication.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - EMR and LIS may evolve their orderable-test and executable-assay
        catalogs independently.
      - Specimen vocabularies, result statuses, identifiers, and critical-value
        policies can change over the lifetime of an integration.
      - The ontology is expected to preserve historical interpretability and
        mixed-version interoperability because it is intended as the conceptual
        authority for EMR/LIS integration.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - Scalar enum attributes are interpreted as holding one value at a time.
      - The explicit phrase that Result.status changes to `corrected` is treated
        as permitting correction after a previously final result.
      - An unqualified conditional obligation is treated as requiring its
        consequent whenever its antecedent holds unless a delay or exception is
        explicitly modeled.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - 주문 가능한 검사 정의와 분석기 수행 정의는 일대일 동의어가 아닐 수 있으며 패널 주문은 복수 수행 단위로 실현될 수 있다.
      - 개별 결과의 검증·정정 상태와 보고서의 발행·개정 상태는 별개의 의미 차원이다.
      - 검체 재료, 가공 형태, 채취 맥락은 적합성 판단에서 구별되어야 한다.
      - 임계값 설정은 지속되는 규칙이고 위험 결과 및 통보는 시간에 발생하는 사건이다.
      - 물리적 검체는 결과의 원천 재료이며 결과 생성 행위의 수행 주체는 아니다.
  structure:
    domain_constraints_used: []
    domain_context_assumptions:
      - 속성의 ref와 is_a도 엔티티 간 구조적 연결로 간주했다.
      - EMR/LIS 통합의 개념 권위 문서는 주문 단위에서 수행 단위까지의 경로와 상태 간 허용 전이를 명시적으로 표현해야 한다고
        보았다.
