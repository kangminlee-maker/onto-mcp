        conflict concerns mixed modality: a necessary completion trigger depends
        on a reversible state, but the permitted later event has no defined
        effect on the resulting terminal state. Source finding context: Define
        correction-aware precedence explicitly: either treat `corrected` as
        completion-satisfying, transition the Order out of `completed`, or model
        completion as a versioned snapshot tied to the report/result version.
