        허용해 high 영향을 낳는다. Source finding context: clinical-lab-ontology.yaml —
        Order completion rule Source finding context: materialized-input.md:23,
        69-72, 121-123 Source finding context: Result correction after Order
        completion leaves the lifecycle rules without a simultaneously coherent
        completion state. Source finding context: This is an inter-claim
        temporal conflict between the completion rule at line 122 and the
        correction path at line 123. Once correction makes the completion
