      - 환자 위해의 발생 확률이나 특정 규제 위반은 경계 내 증거가 없어 주장하지 않았다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - 문서가 선언한 '주문부터 보고까지' 범위는 정상 흐름뿐 아니라 결과 생성에 영향을 주는 검체 예외와 분석 수행
        provenance를 포함해야 한다.
