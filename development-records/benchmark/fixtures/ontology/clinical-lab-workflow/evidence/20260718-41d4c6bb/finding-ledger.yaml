      위험") and materialized-input.md:6-8 ("EMR/LIS 연동 설계의 개념 권위 문서")'
    claim: 서로 다른 결과 상태 표현과 야간 동기화가 임상의가 신뢰한다고 선언된 권위 값을 의도적으로 지연·분기시킨다.
    lens_rationale_summary: 교정 결과가 발생한 뒤 배치 전까지 Report가 finalized로 남을 수 있다. 이는
      EMR/LIS 통합의 개념 권위 문서라는 목적에 필요한 단일하고 현재적인 상태 의미를 훼손하며, 지연 일관성이라는 임상 사용자 대상
      트레이드오프도 정당화하지 않는다.
    proposed_action: 결과 상태의 단일 canonical lifecycle과 명시적 매핑을 정의하고 Report 상태를 그 상태에서
      즉시 파생하거나 원자적 이벤트로 갱신한다. 지연 동기화가 불가피하면 pending-amendment 상태, 최대 지연, 실패 처리와
      사용자 표시 계약을 모델에 포함한다.
    affected_purpose: EMR/LIS 통합에서 엔티티·상태 의미를 정하는 개념 권위 문서로 사용되는 목적
    failure_condition: Result가 corrected로 변경된 뒤 야간 동기화 전까지 Report.result_status가
      finalized로 유지되는 경우
    impact: 두 시스템과 임상의가 서로 다른 현재 상태를 권위 값으로 받아들일 수 있어 문서의 상태 권위와 운영 의사결정 신뢰가 동시에 약화된다.
