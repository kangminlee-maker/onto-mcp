findings:
  - candidate_id: semantics-candidate-001
    target: Result.status 및 Report.result_status
    evidence_anchor: "clinical-lab-ontology.yaml: entities.Result.attributes.status,
      entities.Report.attributes.result_status, state_rules[1]"
    claim: 동일한 결과 상태를 서로 다른 어휘와 권위 규칙으로 이중 표현해 의미적 단일 권위가 없다.
    what: Result는 preliminary/final/corrected를 사용하고 Report는
      prelim/finalized/amended를 사용한다. 두 필드는 동일 정보라고 설명되지만 Report 값을 권위 값으로 선언하고,
      corrected 반영은 야간 배치로 지연한다.
    why: 명시적인 상태 대응표와 집계 규칙이 없으며, 야간 배치 전에는 Result가 corrected인데 Report는 finalized일 수
      있다. 임상의가 신뢰한다고 선언된 값이 실제 결과 상태와 어긋나 EMR/LIS 간 상태 해석과 정정 결과 전달을 훼손한다.
    how_to_fix: 항목 상태의 단일 권위를 Result.status로 정하고 Report 상태를 명시적 집계 파생값으로 정의하거나, 하나의
      공통 상태 어휘를 사용한다. 모든 상태의 완전한 대응표와 정정 시 동기화·공개 규칙도 함께 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 결과 상태의 일관된 해석과 전달
      failure_condition: Result가 corrected로 변경된 뒤 야간 동기화 전이거나, 서로 다른 상태 어휘를 대응표 없이 교환할 때
      impact: 동일 검사 결과에 대해 LIS와 EMR이 서로 다른 최종성·정정 여부를 표시하여 임상적 신뢰와 연동 계약의 실행 가능성이 약화된다.
      evidence_refs:
        - entities.Result.attributes.status
        - entities.Report.attributes.result_status
        - state_rules[1]
    causal_path:
      root_cause_candidate: 동일한 상태 개념을 Result와 Report에 별도 권위 값으로 두면서 공통 어휘와 파생 규칙을 정의하지 않았다.
      root_cause_step_id: semantics-candidate-001.cause-002
      steps:
        - cause_id: semantics-candidate-001.cause-001
          claim: Result와 Report가 서로 다른 상태 어휘로 동일 정보를 유지하며 정정 반영은 야간 배치로 지연된다.
          relation_to_previous: null
          evidence_refs:
            - entities.Result.attributes.status
            - entities.Report.attributes.result_status
            - state_rules[1]
        - cause_id: semantics-candidate-001.cause-002
          claim: 이는 단일 상태 개념이 두 독립 표현과 상충하는 권위 설명으로 분할된 결과다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.Result.attributes.status.note
            - entities.Report.attributes.result_status.note
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-002
    target: Test 및 Assay 엔티티
    evidence_anchor: "clinical-lab-ontology.yaml: entities.Test, entities.Assay,
      notes[0], entities.Result.attributes.test_ref"
    claim: 주문 가능 항목과 수행 단위의 구분이 관계로 정의되지 않아 Test와 Assay의 의미 경계가 불명확하다.
    what: Test는 주문 가능한 카탈로그 단위, Assay는 분석기 수행 단위라고 정의하지만 양자의 대응 관계가 없다. 신규 항목을 두 곳에
      모두 등록하며 향후 통합 여부를 검토한다고만 적혀 있다.
    why: 두 개념이 동의어인지, 하나의 Test가 여러 Assay로 실현되는지, 또는 조건별 대체 수행인지 판별할 수 없다. Result는
      Test만 참조하므로 실제 수행법의 의미도 결과에 보존되지 않는다.
    how_to_fix: Test를 주문 의미, Assay를 실제 수행법으로 유지할지 먼저 확정하고 명시적 realizes/performs 관계와
      cardinality를 정의한다. 동의어라면 정규화된 단일 개념과 호환 별칭을 사용하고, 구별한다면 Result가 수행 Assay를
      참조하도록 한다.
    upstream_evidence_required: true
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문 카탈로그와 검사실 수행 카탈로그 사이의 EMR/LIS 개념 매핑
      failure_condition: 하나의 주문 항목에 여러 수행법이 있거나 양 시스템이 Test와 Assay를 서로 다른 단위로 취급할 때
      impact: 주문, 수행 및 결과의 의미적 추적이 끊겨 코드 매핑과 결과 해석이 구현자별 추측에 의존한다.
      evidence_refs:
        - entities.Test.definition
        - entities.Assay.definition
        - notes[0]
        - entities.Result.attributes.test_ref
    causal_path:
      root_cause_candidate: 주문 개념과 수행 개념의 정체성 및 대응 관계 결정을 문서가 유보했다.
      root_cause_step_id: semantics-candidate-002.cause-002
      steps:
        - cause_id: semantics-candidate-002.cause-001
          claim: Test와 Assay가 유사한 검사 항목으로 병존하지만 상호 관계가 없고 이중 등록된다.
          relation_to_previous: null
          evidence_refs:
            - entities.Test
            - entities.Assay
            - notes[0]
        - cause_id: semantics-candidate-002.cause-002
          claim: 이는 두 카탈로그 개념의 의미 경계와 정규화 정책이 확정되지 않은 상태의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - notes[0]
      unresolved_beyond_evidence: 실제 카탈로그에서 Test와 Assay가 일대일, 일대다 또는 조건부 관계인지는 허용된 자료만으로 확정할 수 없다.
  - candidate_id: semantics-candidate-003
    target: 검체 종류 표현
    evidence_anchor: "clinical-lab-ontology.yaml:
      entities.Specimen.attributes.specimen_type,
      entities.Test.attributes.requires_specimen_type,
      entities.Assay.attributes.specimen_kind"
    claim: 동일한 검체 종류 개념이 상이한 분류 수준과 자료형으로 표현되어 의미적으로 호환되지 않는다.
    what: Specimen과 Test는 blood/urine/tissue/swab 폐쇄형 열거를 쓰지만 Assay는 WB, Serum,
      Urine-random 같은 더 세분된 자유 문자열을 사용한다.
    why: blood와 WB 또는 Serum의 관계, urine과 Urine-random의 관계가 정의되지 않아 주문 적합성 검사와 실제 수행
      적합성 검사가 서로 다른 의미를 사용할 수 있다.
    how_to_fix: 하나의 정규 검체·물질 코드 체계를 권위로 정하고 모든 세 필드가 이를 참조하게 한다. 상위 종류와 세부 물질·채취 유형을
      구분해야 한다면 별도 속성과 명시적 계층·매핑을 정의한다.
    upstream_evidence_required: true
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR 주문 요구 검체와 LIS 실제 검체·수행 조건의 의미 보존
      failure_condition: 자유 문자열의 세부 검체 표현을 상위 열거값과 비교하거나 시스템 간 변환할 때
      impact: 유효한 검체가 거부되거나 부적합 검체가 허용될 수 있고, 연동 구현마다 임의 매핑이 생긴다.
      evidence_refs:
        - entities.Specimen.attributes.specimen_type
        - entities.Test.attributes.requires_specimen_type
        - entities.Assay.attributes.specimen_kind
    causal_path:
      root_cause_candidate: 검체의 상위 유형과 분석용 세부 물질을 하나의 공통 개념처럼 사용하면서 정규 코드와 계층을 두지 않았다.
      root_cause_step_id: semantics-candidate-003.cause-002
      steps:
        - cause_id: semantics-candidate-003.cause-001
          claim: 같은 검체 의미 영역에 폐쇄형 상위 열거와 자유형 세부 문자열이 병존한다.
          relation_to_previous: null
          evidence_refs:
            - entities.Specimen.attributes.specimen_type
            - entities.Test.attributes.requires_specimen_type
            - entities.Assay.attributes.specimen_kind
        - cause_id: semantics-candidate-003.cause-002
          claim: 이는 검체 유형과 검체 물질·채취 맥락의 의미 수준이 분리되지 않은 결과다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.Assay.attributes.specimen_kind.note
      unresolved_beyond_evidence: 채택해야 할 코드 체계와 필요한 세분화 수준은 기관 카탈로그 및 연동 표준 근거가 추가로 필요하다.
  - candidate_id: semantics-candidate-004
    target: CriticalValue 엔티티
    evidence_anchor: "clinical-lab-ontology.yaml: entities.CriticalValue.definition
      및 attributes"
    claim: 위험 임계값 규칙과 개별 통보 사건을 하나의 CriticalValue 엔티티로 혼합했다.
    what: CriticalValue는 test_ref와 lower_bound/upper_bound로 재사용되는 임계값 범위를 나타내면서, 동시에
      notified라는 건별 완료 상태를 가진다. 그러나 어떤 Result의 통보인지 연결되지 않는다.
    why: 임계값은 카탈로그·정책 성격의 구성물이고 통보 여부는 특정 환자 결과에 대한 사건 상태다. 두 존재론적 유형을 합치면 임계값 변경과
      개별 통보 이력의 생명주기 및 식별자가 충돌한다.
    how_to_fix: CriticalValueRule 같은 임계값 정책과 CriticalResultNotification 같은 결과별 통보
      사건을 분리한다. 통보 사건은 Result, 발생 시각, 수신자와 상태를 참조하고 적용된 규칙 버전을 보존한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 위험 결과 판정과 통보를 EMR/LIS가 동일하게 해석할 수 있는 개념 모델
      failure_condition: 동일 임계값이 여러 결과에 적용되거나 임계값 변경 후 과거 통보 상태를 조회할 때
      impact: 어떤 결과가 판정·통보되었는지 권위 있게 표현할 수 없어 안전 관련 추적성과 연동의 행동 계약이 약화된다.
      evidence_refs:
        - entities.CriticalValue.definition
        - entities.CriticalValue.attributes.test_ref
        - entities.CriticalValue.attributes.lower_bound
        - entities.CriticalValue.attributes.upper_bound
        - entities.CriticalValue.attributes.notified
    causal_path:
      root_cause_candidate: 정책성 임계값과 사건성 통보 기록을 별도 존재론적 유형으로 구분하지 않았다.
      root_cause_step_id: semantics-candidate-004.cause-002
      steps:
        - cause_id: semantics-candidate-004.cause-001
          claim: 하나의 엔티티에 임계값 범위와 통보 완료 여부가 함께 있으나 특정 Result 참조는 없다.
          relation_to_previous: null
          evidence_refs:
            - entities.CriticalValue.attributes
        - cause_id: semantics-candidate-004.cause-002
          claim: 이는 재사용 가능한 판정 규칙과 개별 결과 통보 사건을 동일 개념으로 모델링한 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.CriticalValue.definition
            - entities.CriticalValue.attributes.notified.note
      unresolved_beyond_evidence: null
  - candidate_id: semantics-candidate-005
    target: Order의 STAT 표현
    evidence_anchor: "clinical-lab-ontology.yaml:
      entities.Order.attributes.priority, entities.Order.attributes.is_stat,
      entities.StatOrder"
    claim: STAT라는 하나의 우선순위 의미를 열거값, 불리언, 하위 타입으로 동시에 표현해 개념 정체성이 불명확하다.
    what: Order.priority에 stat이 있고 is_stat도 별도로 저장하며, StatOrder를 Order의 하위 타입으로
      정의한다. 세 표현의 동치 조건과 갱신 권위가 없다.
    why: STAT가 주문의 본질적 유형인지 일시적 우선순위인지 정의되지 않았다. 같은 주문이 서로 모순되는 세 표현을 가질 수 있고, 우선순위
      변경 시 엔티티 타입까지 바뀌어야 하는지 판단할 수 없다.
    how_to_fix: STAT를 Order.priority의 한 값으로 정규화하고 is_stat는 파생값으로 만들며 별도 타입을 제거하는 방안을
      기본으로 한다. stat_reason이 필요하면 STAT 우선순위 조건부 속성으로 정의한다. 실제로 별도 타입이어야 한다면 불변성,
      생성 조건 및 다른 표현과의 강제 동치 규칙을 명시한다.
    upstream_evidence_required: true
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS 사이에서 주문 우선순위와 STAT 처리 의미를 일관되게 교환하는 계약
      failure_condition: 세 STAT 표현 중 일부만 설정·변경되거나 시스템별로 서로 다른 표현을 권위로 사용할 때
      impact: 긴급 주문 라우팅과 처리 우선순위가 구현자별 해석에 따라 달라질 수 있다.
      evidence_refs:
        - entities.Order.attributes.priority
        - entities.Order.attributes.is_stat
        - entities.StatOrder.definition
        - entities.StatOrder.is_a
    causal_path:
      root_cause_candidate: STAT를 하나의 정규 우선순위 개념으로 두지 않고 속성 값, 파생 불리언 및 존재론적 하위 타입으로 중복 승격했다.
      root_cause_step_id: semantics-candidate-005.cause-002
      steps:
        - cause_id: semantics-candidate-005.cause-001
          claim: STAT 의미가 priority=stat, is_stat=true 및 StatOrder 인스턴스라는 세 표현에 분산되어 있다.
          relation_to_previous: null
          evidence_refs:
            - entities.Order.attributes.priority
            - entities.Order.attributes.is_stat
            - entities.StatOrder
        - cause_id: semantics-candidate-005.cause-002
          claim: 이는 우선순위 상태와 주문의 본질적 유형을 구분하지 않은 모델링의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.StatOrder.definition
            - entities.StatOrder.is_a
      unresolved_beyond_evidence: 기관 업무에서 STAT 지정이 주문 후 변경 가능한지 여부는 허용된 자료에 없으므로, 하위
        타입의 rigidity 위반 여부를 최종 확정하려면 추가 정책 근거가 필요하다.
domain_constraints_used: []
domain_context_assumptions:
  - EMR/LIS 통합의 개념 권위 문서는 동일 임상 개념에 단일 권위 표현 또는 완전한 명시적 매핑을 제공해야 한다.
  - 검사 결과 정정과 위험 결과 통보는 특정 결과에 귀속되어 추적 가능해야 한다.
  - STAT는 별도 근거가 없는 한 주문 정체성보다 처리 우선순위를 나타내는 것으로 해석했다.
validation:
  unaddressable_candidates: []
