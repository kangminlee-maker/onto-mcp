findings:
  - candidate_id: structure-candidate-001
    target: Assay와 주문-검체-결과 워크플로의 연결 구조
    evidence_anchor: materialized-input.md:54-60, 108-119, 126-127
    claim: Assay가 수행 단위로 정의되지만 Test·Specimen·Result 중 어느 것과도 연결되지 않아 핵심 워크플로에서 구조적으로
      고립되어 있다.
    what: Assay에는 Department 참조만 있고, 전체 relations 목록에도 Assay가 등장하지 않는다. 동시에 Test와
      Assay를 모두 신규 등록한다고 명시하지만 두 카탈로그 사이의 대응 관계가 없다.
    why: 주문은 Test를 참조하고 결과도 Test에 귀속되는 반면 실제 수행 단위인 Assay로 이어지는 경로가 없다. 따라서 Assay를
      사용하는 경우 어떤 주문 항목이 어떤 분석 수행과 결과를 낳았는지 이 권위 문서만으로 연결할 수 없다.
    how_to_fix: Test와 Assay 사이에 명시적인 수행 매핑 관계와 카디널리티를 추가하고, 필요하면 Assay를 Specimen 또는
      Result와 연결해 Order→Test→Assay→Result 경로를 닫는다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동에서 주문부터 수행·결과까지의 개념 권위와 추적 가능한 연결 구조
      failure_condition: 주문된 Test가 하나 이상의 Assay를 통해 수행되는 경우
      impact: 통합 구현체가 Test–Assay 대응을 문서 밖에서 임의로 정의해야 하므로 시스템 간 추적성과 개념 권위가 깨진다.
      evidence_refs:
        - materialized-input.md:20
        - materialized-input.md:54-60
        - materialized-input.md:63-66
        - materialized-input.md:108-119
        - materialized-input.md:127
    causal_path:
      root_cause_candidate: Test와 Assay를 병존시키면서 두 수행 카탈로그를 잇는 정식 관계를 모델에 포함하지 않았다.
      root_cause_step_id: structure-candidate-001.cause-002
      steps:
        - cause_id: structure-candidate-001.cause-001
          claim: Assay는 Department 참조 외에는 다른 엔티티와 연결되지 않고 relations 목록에도 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:54-60
            - materialized-input.md:108-119
        - cause_id: structure-candidate-001.cause-002
          claim: 신규 항목을 Test와 Assay 양쪽에 등록하도록 하면서도 상호 대응 관계가 정의되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:127
      unresolved_beyond_evidence: 실제 LIS에 별도 Test–Assay 매핑이 존재하는지는 경계 밖이지만, 해당 매핑은 현재 권위 문서의 구조를 닫지 못한다.
  - candidate_id: structure-candidate-002
    target: Order·Specimen·Result·Report 상태 모델
    evidence_anchor: materialized-input.md:23, 44, 69-72, 80-83, 121-124
    claim: 상태 값은 선언되어 있지만 대부분의 상태 사이에 허용 전이 관계가 없어 상태 그래프가 구조적으로 완결되지 않았다.
    what: Order의 다섯 상태 중 completed 전이만 조건부로 언급되고, Specimen의 네 상태에는 전이 순서·분기·취소 경로가
      없다. Result와 Report도 일부 동기화 규칙만 있고 각 상태의 허용 전이가 연결되어 있지 않다.
    why: 상태 이름의 목록만으로는 현재 상태에서 가능한 다음 상태나 금지된 역전이를 판별할 수 없다. EMR과 LIS가 서로 다른 전이 그래프를
      구현해도 이 문서로 적합성을 판단할 수 없다.
    how_to_fix: 각 상태 보유 엔티티별로 시작 상태, 허용 전이, 전이 조건, 종결 상태를 명시적인 전이 구조로 정의하고 기존
      state_rules를 그 전이의 조건에 연결한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS가 공유할 상태 모델의 구조적 권위
      failure_condition: 시스템이 completed 외의 Order 전이, Specimen 진행 전이, 또는 Result·Report 상태 변경을 처리할 때
      impact: 허용·금지 전이를 문서에서 결정할 수 없어 구현 간 상태 불일치와 상호운용성 판단 불능이 발생한다.
      evidence_refs:
        - materialized-input.md:23
        - materialized-input.md:44
        - materialized-input.md:69-72
        - materialized-input.md:80-83
        - materialized-input.md:121-124
    causal_path:
      root_cause_candidate: 상태 집합과 일부 조건만 선언하고 상태들을 잇는 전이 관계를 모델링하지 않았다.
      root_cause_step_id: structure-candidate-002.cause-002
      steps:
        - cause_id: structure-candidate-002.cause-001
          claim: 여러 엔티티에 상태 값이 존재하지만 state_rules는 completed, finalized, amended에 관한 일부 전이만
            연결한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:23
            - materialized-input.md:44
            - materialized-input.md:69-72
            - materialized-input.md:80-83
            - materialized-input.md:121-124
        - cause_id: structure-candidate-002.cause-002
          claim: 시작·중간·종결 상태 사이의 허용 전이 그래프가 정의되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:23
            - materialized-input.md:44
            - materialized-input.md:121-124
      unresolved_beyond_evidence: null
  - candidate_id: structure-candidate-003
    target: CriticalValue 통보 연결 구조
    evidence_anchor: materialized-input.md:100-106, 108-119
    claim: CriticalValue가 Test에만 연결되고 실제 Result 및 통보 기록과의 필수 관계가 누락되어 있다.
    what: CriticalValue는 test_ref와 notified 불리언만 가진다. 즉시 통보의 근거가 되는 Result, 통보 시각,
      수신자 또는 전화 기록 대장과의 참조 관계는 없으며 relations 목록에도 CriticalValue가 없다.
    why: 어떤 구체적 결과가 임계값을 충족했고 누구에게 언제 통보되었는지를 CriticalValue에서 따라갈 수 없다. notified 값의
      근거가 되는 구조적 경로가 없으므로 통보 완료 상태가 고립된 주장으로 남는다.
    how_to_fix: 임계 판정된 Result와 CriticalValue를 연결하고, 통보 이벤트 엔티티 또는 명시적 외부 기록 참조를 추가해
      Result→CriticalValue 판정→통보 이벤트→수신자 경로를 정의한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 위험 결과의 즉시 통보를 포함하는 임상검사 워크플로의 추적 가능한 개념 구조
      failure_condition: CriticalValue에 해당하는 Result의 통보 여부와 근거를 EMR/LIS 사이에서 확인할 때
      impact: 통보 완료 여부를 해당 결과·시각·수신자와 연결해 검증할 수 없어 운영 추적성과 통합 계약의 신뢰가 약화된다.
      evidence_refs:
        - materialized-input.md:100-106
        - materialized-input.md:108-119
    causal_path:
      root_cause_candidate: 통보를 독립 이벤트나 참조 가능한 기록으로 모델링하지 않고 CriticalValue의 불리언 속성으로만 축약했다.
      root_cause_step_id: structure-candidate-003.cause-002
      steps:
        - cause_id: structure-candidate-003.cause-001
          claim: CriticalValue는 Test만 참조하며 Result 또는 통보 기록과 연결되지 않는다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
            - materialized-input.md:108-119
        - cause_id: structure-candidate-003.cause-002
          claim: 통보 시각과 수신자를 외부 전화 기록 대장에 둔다고 서술하지만 그 대장을 가리키는 관계나 식별자가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:106
      unresolved_beyond_evidence: 전화 기록 대장의 실제 스키마는 경계 밖이지만, 현재 모델에는 그 외부 권위와 연결할 참조 자체가 없다.
domain_constraints_used: []
domain_context_assumptions:
  - 엔티티 속성의 ref와 is_a도 명시적 relations와 함께 유효한 구조적 연결로 간주했다.
  - ‘수행 단위’, ‘즉시 통보’, ‘개념 권위 문서’가 요구하는 연결은 대상 문서 자체의 정의와 목적에서 도출했으며 별도 임상 도메인
    규칙은 사용하지 않았다.
