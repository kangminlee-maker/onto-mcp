findings:
  - candidate_id: evolution-candidate-001
    target: Test/Assay 카탈로그 모델
    evidence_anchor: materialized-input.md:46-60,108-119,126-127
    claim: 신규 검사 항목을 Test와 Assay에 중복 등록해야 하지만 두 카탈로그 사이의 대응 관계와 개념 권위가 정의되어 있지 않다.
    what: 주문 단위인 Test와 수행 단위인 Assay가 별도 코드 체계로 존재하며, 신규 항목을 양쪽에 등록하도록 요구하면서도 둘을 연결하는
      관계나 정합성 규칙이 없다.
    why: 카탈로그 확장 때마다 두 구조를 함께 수정해야 하고 한쪽의 누락·분기·통합 시 기존 주문과 결과의 의미를 안정적으로 추적할 수 없다.
      이는 EMR/LIS 연동의 개념 권위 문서라는 목적을 직접 약화한다.
    how_to_fix: Test를 권위 있는 주문 카탈로그 개념으로 정하고 Assay를 버전·유효기간이 있는 수행 매핑으로 연결하거나, 공통
      CatalogItem 아래에서 두 역할을 명시적으로 분리한다. 신규 항목 등록과 폐기 시 대응 관계의 정합성 규칙도 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계에서 검사 카탈로그의 개념 권위를 제공하는 목적
      failure_condition: 신규 검사 추가, 수행법 분화 또는 Test/Assay 통합 시 두 카탈로그가 독립적으로 변경되는 경우
      impact: 주문 코드와 실제 수행 항목의 대응이 분기되어 과거 및 신규 결과의 해석과 연동 규칙을 신뢰할 수 없게 된다.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:108-119
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: Test와 Assay를 병렬 카탈로그로 유지하면서 권위 소유자와 명시적 대응 관계를 모델링하지 않았다.
      root_cause_step_id: evolution-candidate-001.cause-002
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 신규 항목은 Test와 Assay 두 곳에 모두 등록해야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:126-127
        - cause_id: evolution-candidate-001.cause-002
          claim: 두 엔티티는 서로 다른 코드와 검체 표현을 가지지만 둘을 연결하는 관계가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:108-119
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-002
    target: Specimen/Test/Assay 검체 유형 모델
    evidence_anchor: materialized-input.md:37-60
    claim: 검체 유형이 두 개의 폐쇄형 enum과 하나의 자유 문자열로 분산되어 새 검체 유형이나 LIS 표현을 기존 구조 수정 없이 수용할
      수 없다.
    what: Specimen.specimen_type과 Test.requires_specimen_type은 동일한 네 값 enum을 각각
      내장하지만 Assay.specimen_kind는 WB, Serum 같은 별도 문자열을 사용한다.
    why: 새 검체, 세부 재료 유형 또는 외부 LIS 코드가 도입되면 두 enum 정의와 데이터 변환 규칙을 함께 변경해야 한다. 자유 문자열과
      enum 사이의 안정적인 대응이 없어 시스템별 확장 시 의미 충돌과 기존 데이터 단절이 발생한다.
    how_to_fix: 검체 유형을 별도의 권위 있는 코드 개념으로 승격하고 Specimen, Test, Assay가 이를 참조하게 한다. 외부
      코드 체계별 매핑, 상·하위 유형, 버전과 유효기간을 표현한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 서로 다른 EMR/LIS 검체 표현을 지속적으로 통합할 수 있는 개념 모델 제공
      failure_condition: 현재 네 범주 밖의 검체나 WB·Serum 같은 더 세분화된 외부 표현을 추가하는 경우
      impact: 기존 엔티티 정의를 반복 수정하고 임의 문자열 매핑에 의존하게 되어 연동 데이터의 의미 연속성이 약화된다.
      evidence_refs:
        - materialized-input.md:37-60
    causal_path:
      root_cause_candidate: 공유되어야 할 검체 분류를 독립 속성들의 enum 또는 문자열 값으로 내장했다.
      root_cause_step_id: evolution-candidate-002.cause-002
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: 새 검체 범주는 Specimen과 Test의 enum을 각각 수정해야 하며 Assay 문자열과의 별도 변환도 필요하다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37-60
        - cause_id: evolution-candidate-002.cause-002
          claim: 세 속성이 하나의 참조 가능한 검체 분류 개념을 공유하지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:42
            - materialized-input.md:52
            - materialized-input.md:60
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-003
    target: 코드·규칙의 버전 및 유효기간 모델
    evidence_anchor: materialized-input.md:10-11,46-60,100-106
    claim: 온톨로지 문서 버전만 존재하고 검사 코드, 분석 코드, 임계값의 코드체계·버전·유효기간이 없어 변경 전후 데이터의 의미를 보존할 수
      없다.
    what: Test와 Assay는 단순 문자열 코드만 가지며 CriticalValue는 Test 참조와 경계값만 가진다. 개념 또는 규칙의 적용
      버전과 유효기간은 표현되지 않는다.
    why: 검사 코드의 재사용·폐기, 분석법 변경, 임계값 개정이 발생하면 과거 결과에 어떤 정의와 규칙이 적용되었는지 판별할 수 없다. 최상위
      ontology version은 개별 카탈로그 항목과 규칙의 독립적인 변경 이력을 대체하지 못한다.
    how_to_fix: 카탈로그 항목과 CriticalValue에 안정 식별자, 코드체계, 버전, valid_from/valid_to 및 대체
      관계를 추가하고 Result가 적용된 버전 또는 규칙을 참조하도록 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 외부 표준과 검사 규칙이 바뀌어도 EMR/LIS 데이터의 역사적 해석 연속성을 유지하는 목적
      failure_condition: 검사 코드, 분석법 또는 critical-value 임계값이 개정되거나 폐기되는 경우
      impact: 과거 결과와 현재 정의를 구분할 수 없어 재처리, 감사, 연동 변환에서 잘못된 의미를 적용할 위험이 생긴다.
      evidence_refs:
        - materialized-input.md:10-11
        - materialized-input.md:46-60
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: 변경 가능한 카탈로그 항목과 임계 규칙을 시간에 따라 버전 관리되는 개념으로 모델링하지 않았다.
      root_cause_step_id: evolution-candidate-003.cause-002
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 코드나 임계값 변경 후 과거 데이터에 적용된 정의를 식별할 속성이 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:100-106
        - cause_id: evolution-candidate-003.cause-002
          claim: 개별 개념에는 버전·유효기간이 없고 문서 전체에만 단일 version 값이 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:10-11
            - materialized-input.md:46-60
            - materialized-input.md:100-106
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-004
    target: Order의 긴급도 표현
    evidence_anchor: materialized-input.md:15-29
    claim: STAT 의미가 priority 값, is_stat 불리언, StatOrder 하위 타입으로 삼중 표현되어 긴급도 체계 확장 시
      기존 구조 여러 곳을 동시 수정해야 한다.
    what: 동일한 STAT 성격을 Order.priority=stat, Order.is_stat=true, StatOrder 인스턴스 여부로
      각각 기록한다.
    why: 새 긴급 분류나 STAT 정책 변경 때 세 표현의 규칙과 소비자를 함께 변경해야 하며, 기존 데이터 조합 중 어느 표현이 권위인지
      정해져 있지 않아 확장 과정에서 분기가 누적될 수 있다.
    how_to_fix: priority를 긴급도의 단일 권위 속성으로 사용하고 stat_reason을 priority=stat일 때 적용되는
      조건부 속성 또는 별도 PriorityAssignment 개념으로 모델링한다. 호환성이 필요하면 나머지 표현은 권위 값에서 파생되는
      명시적 projection으로 둔다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS가 주문 긴급도를 일관되게 확장하고 교환할 수 있는 개념 권위 제공
      failure_condition: 긴급도 종류 추가, STAT 정책 변경 또는 서로 다른 세 표현이 불일치하는 데이터가 유입되는 경우
      impact: 기존 스키마와 변환 규칙을 여러 곳에서 수정해야 하고 시스템별로 서로 다른 긴급도 해석이 고착될 수 있다.
      evidence_refs:
        - materialized-input.md:15-29
    causal_path:
      root_cause_candidate: 하나의 긴급도 개념을 단일 권위로 두지 않고 enum, boolean, subtype으로 중복 모델링했다.
      root_cause_step_id: evolution-candidate-004.cause-002
      steps:
        - cause_id: evolution-candidate-004.cause-001
          claim: 긴급도 확장 또는 정책 변경이 priority, is_stat, StatOrder에 동시에 영향을 준다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:15-29
        - cause_id: evolution-candidate-004.cause-002
          claim: STAT가 세 독립적인 구조로 표현되며 파생 또는 일치 규칙이 정의되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:21-29
      unresolved_beyond_evidence: null
domain_constraints_used: []
domain_context_assumptions:
  - EMR과 LIS의 검사 코드, 검체 표현, 긴급도 값은 서로 독립적으로 확장될 수 있다.
  - 검사 카탈로그와 critical-value 임계값은 운영 중 개정될 수 있으며 과거 결과의 당시 의미를 보존해야 한다.
