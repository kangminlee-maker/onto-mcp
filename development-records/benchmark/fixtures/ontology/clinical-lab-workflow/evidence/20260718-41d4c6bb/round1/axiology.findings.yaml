findings:
  - candidate_id: axiology-candidate-001
    target: clinical-lab-ontology.yaml — Result.status, Report.result_status,
      state_rules
    evidence_anchor: 'materialized-input.md:69-83,121-123; value authority:
      review-value-alignment-criteria.yaml:6-8 ("EMR/LIS 통합의 개념 권위 문서...운영 시 생길
      위험") and materialized-input.md:6-8 ("EMR/LIS 연동 설계의 개념 권위 문서")'
    claim: 서로 다른 결과 상태 표현과 야간 동기화가 임상의가 신뢰한다고 선언된 권위 값을 의도적으로 지연·분기시킨다.
    what: LIS 권위인 Result.status와 임상의가 신뢰하는 Report.result_status가 서로 다른 열거값으로 동일 정보를
      중복 보유하며, corrected→amended 반영은 야간 배치에 의존한다.
    why: 교정 결과가 발생한 뒤 배치 전까지 Report가 finalized로 남을 수 있다. 이는 EMR/LIS 통합의 개념 권위 문서라는
      목적에 필요한 단일하고 현재적인 상태 의미를 훼손하며, 지연 일관성이라는 임상 사용자 대상 트레이드오프도 정당화하지 않는다.
    how_to_fix: 결과 상태의 단일 canonical lifecycle과 명시적 매핑을 정의하고 Report 상태를 그 상태에서 즉시
      파생하거나 원자적 이벤트로 갱신한다. 지연 동기화가 불가피하면 pending-amendment 상태, 최대 지연, 실패 처리와 사용자
      표시 계약을 모델에 포함한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 엔티티·상태 의미를 정하는 개념 권위 문서로 사용되는 목적
      failure_condition: Result가 corrected로 변경된 뒤 야간 동기화 전까지 Report.result_status가
        finalized로 유지되는 경우
      impact: 두 시스템과 임상의가 서로 다른 현재 상태를 권위 값으로 받아들일 수 있어 문서의 상태 권위와 운영 의사결정 신뢰가 동시에
        약화된다.
      evidence_refs:
        - materialized-input.md:69-83
        - materialized-input.md:121-123
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 동일한 결과 상태 의미를 두 속성에 별도 어휘로 저장하면서 동기화 권위를 야간 배치에 둔 설계
      root_cause_step_id: axiology-candidate-001.cause-003
      steps:
        - cause_id: axiology-candidate-001.cause-001
          claim: 교정 후 배치 전에는 Result.status와 Report.result_status가 서로 다른 임상 상태를 나타낼 수 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:121-123
        - cause_id: axiology-candidate-001.cause-002
          claim: 불일치는 동일 정보를 두 속성에 유지하고 서로 다른 enum으로 표현한 구조의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-83
        - cause_id: axiology-candidate-001.cause-003
          claim: 그 중 하나를 임상의가 신뢰하는 권위 값으로 선언하면서도 갱신을 야간 배치에 맡겼다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:83
            - materialized-input.md:123
      unresolved_beyond_evidence: 실제 배치 지연 시간과 교정 결과 소비자의 완화 장치는 경계 내 자료에 없다.
  - candidate_id: axiology-candidate-002
    target: clinical-lab-ontology.yaml — Test, Assay, catalog registration note
    evidence_anchor: "materialized-input.md:46-60,126-127; value authority:
      review-value-alignment-criteria.yaml:6-8 and materialized-input.md:6-8"
    claim: 주문 단위와 수행 단위의 구분을 미결 상태로 둔 채 이중 등록을 요구하여 통합 권위 문서가 카탈로그 분기를 제도화한다.
    what: Test와 Assay는 구별되어 있지만 둘 사이의 canonical 관계나 식별 매핑이 없고, 검체 유형도 제한 enum과 자유
      문자열로 다르다. 신규 항목은 두 카탈로그에 모두 등록하도록 한다.
    why: 이중 등록은 어느 개념이 주문·수행·결과 연결의 권위인지 결정하지 않는다. EMR과 LIS가 각각 다른 항목 또는 검체 어휘를 선택하면
      매핑 드리프트와 누락이 발생할 수 있어, 향후 정비 편의를 위해 현재 통합 목적을 희생하는 정당화되지 않은 트레이드오프가 된다.
    how_to_fix: Test를 주문 가능 개념, Assay를 수행 가능 개념으로 유지할지 명시적으로 결정하고 둘 사이의 버전된
      realizes/mapped_to 관계와 cardinality를 정의한다. 검체 유형은 하나의 canonical vocabulary를
      공유하게 하고 이중 등록 대신 한 권위 카탈로그에서 파생한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS가 공유할 검사 카탈로그 개념과 관계의 권위 제공
      failure_condition: 신규 검사 항목이 두 카탈로그에 별도 등록되거나 자유 문자열 Assay 검체 유형이 Test enum과 다르게 표현되는 경우
      impact: 주문, 수행, 결과가 동일 검사 개념을 참조한다는 보장이 없어 통합 매핑의 신뢰성과 변경 관리가 약화된다.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:126-127
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: Test–Assay의 장기 개념 경계를 결정하지 않고 중복 등록을 임시 운영 정책으로 채택한 것
      root_cause_step_id: axiology-candidate-002.cause-003
      steps:
        - cause_id: axiology-candidate-002.cause-001
          claim: 신규 항목이 Test와 Assay 양쪽에 독립 등록된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:126-127
        - cause_id: axiology-candidate-002.cause-002
          claim: 두 엔티티 사이에 매핑 관계가 없고 검체 유형 표현도 enum과 자유 문자열로 분기되어 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:108-119
        - cause_id: axiology-candidate-002.cause-003
          claim: 이는 두 개념의 통합 여부와 권위 경계를 미래 정비로 유예한 결정의 결과다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:126-127
      unresolved_beyond_evidence: 기존 EMR/LIS 카탈로그의 실제 매핑 및 코드체계는 경계 내 자료에 없다.
  - candidate_id: axiology-candidate-003
    target: clinical-lab-ontology.yaml — CriticalValue notification record
    evidence_anchor: "materialized-input.md:100-106; value authority:
      review-value-alignment-criteria.yaml:6-8 and materialized-input.md:6-8"
    claim: 즉시 통보 워크플로의 핵심 증거를 외부 전화 기록 대장으로 밀어내어 온톨로지의 운영 권위 경계를 불완전하게 만든다.
    what: CriticalValue는 notified boolean만 보유하고 통보 시각과 수신자는 모델 밖 전화 기록 대장에 둔다. 그 외부
      기록과의 식별 관계, 상태 전이 또는 실패 상태는 정의하지 않는다.
    why: 통보 완료의 근거와 책임 당사자를 ontology 내부 개념에서 추적할 수 없으므로 EMR/LIS가 동일한 완료 의미를 재현하거나
      검증하기 어렵다. 운영상 중요한 경계를 외부 기록에 위임하면서 연결 계약을 두지 않은 숨겨진 트레이드오프다.
    how_to_fix: Notification 또는 CriticalValueNotification 개념을 두고 critical result,
      recipient, notified_at, acknowledgement, delivery status와 외부 기록 식별자를
      모델링한다. 외부 전화 대장이 권위라면 그 권위와 동기화·실패 경계를 명시한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 임상검사 워크플로의 엔티티·관계·상태를 EMR/LIS 통합의 개념 권위로 제공하는 목적
      failure_condition: notified=true의 수신자·시각·근거를 통합 시스템이 확인하거나 외부 전화 기록과 연결해야 하는 경우
      impact: 통보 완료 상태의 의미와 감사 가능성이 시스템마다 달라져 운영 위험을 통제하는 권위 문서 역할이 약화된다.
      evidence_refs:
        - materialized-input.md:100-106
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 통보 행위를 독립 워크플로 개념으로 모델링하지 않고 boolean과 연결되지 않은 외부 기록으로 분할한 것
      root_cause_step_id: axiology-candidate-003.cause-003
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: CriticalValue의 통보 완료는 boolean만으로 표현되고 상세 증거는 외부 대장에 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: axiology-candidate-003.cause-002
          claim: 외부 대장과 연결하는 엔티티·관계·식별자 또는 통보 실패 상태가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100-119
        - cause_id: axiology-candidate-003.cause-003
          claim: 이는 통보 행위를 ontology의 권위 범위 밖으로 분할한 모델링 결정에서 비롯된다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:106
      unresolved_beyond_evidence: 전화 기록 대장의 실제 스키마와 별도 통합 계약 존재 여부는 경계 내 자료에 없다.
  - candidate_id: axiology-candidate-004
    target: clinical-lab-ontology.yaml — turnaround_time note
    evidence_anchor: "materialized-input.md:126-128; value authority:
      review-value-alignment-criteria.yaml:6-8 and materialized-input.md:6-8"
    claim: TAT 의미를 선언하면서 계산 권위를 대시보드 팀에 별도로 두어 개념 권위가 소비자별 구현으로 분산된다.
    what: TAT의 시작·종료 시점은 문서가 정의하지만 계산식은 대시보드 팀이 자체 유지한다고 명시한다.
    why: 동일 지표가 다른 소비자에서 재계산될 때 예외, 누락값, 시간대 처리 등이 달라질 수 있다. 통합 개념의 의미를 정하면서 계산 계약을
      외부 소유로 남기는 것은 문서의 권위 목적과 어긋난다.
    how_to_fix: TAT를 collected_at과 released_at에서 파생되는 canonical projection으로 정의하고
      null, 재채취, 정정 보고, 시간대 처리 규칙과 소유자를 이 문서 또는 명시적으로 연결된 계약에 둔다.
    upstream_evidence_required: false
    severity_hint: low
    materiality_basis: null
    causal_path: null
