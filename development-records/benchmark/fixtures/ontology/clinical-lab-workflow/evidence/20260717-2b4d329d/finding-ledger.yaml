    target: clinical-lab-ontology.yaml — Test/Assay 이중 카탈로그
    evidence_anchor: "review-value-alignment-criteria.yaml
      criterion_id=user-request-intent: “EMR/LIS 통합의 개념 권위 문서”;
      materialized-input.md notes[0]: “통합 여부를 재검토한다. 현재 신규 항목은 두 곳 모두에 등록한다”;
      entities.Test와 entities.Assay는 각각 주문 단위와 수행 단위로 정의되지만 연결 관계가 없다.
      [value_type=tradeoff, alignment_direction=misaligned]"
    claim: 미정인 Test/Assay 경계를 이중 등록으로 운용하는 선택은 개념 권위 문서가 해결해야 할 식별·매핑 책임을 사용자에게 전가한다.
    lens_rationale_summary: 신규 항목을 두 곳에 등록하는 국소적 임시방편은 두 카탈로그의 불일치 가능성을 구조화한다. EMR
      주문과 LIS 수행 단위를 연결하는 문서에서 이 매핑이 없으면 시스템별 해석이 갈라져 문서의 통합 권위 목적을 훼손한다.
    proposed_action: 두 개념을 성급히 통합하지 말고, Test와 Assay의 서로 다른 역할을 유지하면서 명시적
      `performed_by` 또는 매핑 엔티티, 다중성, 유효기간, 매핑 권위자와 불일치 처리 규칙을 정의한다.
    affected_purpose: EMR의 주문 단위와 LIS의 수행 단위를 연결하는 개념 권위를 제공하는 목적.
    failure_condition: 동일 신규 항목의 Test·Assay 등록이 불일치하거나 한 Test가 여러 Assay로 수행되는 경우처럼
      단순 동일성 가정이 깨질 때.
    impact: 통합 구현마다 독자 매핑이 생겨 상호운용성과 권위 문서의 결정력이 약화된다.
