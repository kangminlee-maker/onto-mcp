    source_ref: .onto/review/20260717-2b4d329d/round1/axiology.findings.yaml#axiology-candidate-004
    target: clinical-lab-ontology.yaml — TAT 정의의 권위와 계산 소유권
    evidence_anchor: "review-value-alignment-criteria.yaml
      criterion_id=user-request-intent: “EMR/LIS 통합의 개념 권위 문서”;
      materialized-input.md notes[1]: “TAT은 collected_at부터 released_at까지로 계산하며,
      대시보드 팀이 자체 계산식을 유지한다”. [value_type=boundary,
      alignment_direction=misaligned]"
    claim: TAT 의미는 온톨로지에 선언하면서 실제 계산식 권위는 대시보드 팀에 맡겨 동일 지표의 의미가 분기될 수 있다.
    lens_rationale_summary: 개념 권위 문서와 소비자 계산식이 독립적으로 진화하면 같은 `turnaround_time` 이름이
      다른 값을 나타낼 수 있다. 통합 문서가 의미를 정하고 소비자가 그 의미를 구현해야 한다는 목적 대신, 소비자별 정의가 권위를 갖게
      된다.
    proposed_action: TAT 정의와 예외 규칙을 온톨로지의 파생 지표 계약으로 승격하고, 대시보드는 그 canonical 규칙을
      참조·검증하는 소비자로 둔다. 별도 변형이 필요하면 이름과 목적을 분리한다.
    affected_purpose: EMR/LIS 및 후속 소비자가 공유하는 개념과 파생 의미의 권위를 제공하는 목적.
    failure_condition: 대시보드 자체 계산식이 온톨로지의 collected_at-to-released_at 정의와 다르거나 독립적으로 변경될 때.
    impact: 동일 지표명이 시스템마다 다른 의미를 가져 운영 측정과 통합 검증의 신뢰가 약화된다.
