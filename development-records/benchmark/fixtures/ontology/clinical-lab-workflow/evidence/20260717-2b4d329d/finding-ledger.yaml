  - finding_id: finding-023
    lens_id: structure
    source_ref: .onto/review/20260717-2b4d329d/round1/structure.findings.yaml#structure-candidate-001
    target: clinical-lab-ontology.yaml — Test/Assay execution chain
    evidence_anchor: materialized-input.md lines 46-73, 108-119, 126-127
    claim: Assay is not connected to the order-to-result workflow by any declared
      relationship.
    lens_rationale_summary: The only Assay reference is its Department attribute.
      Consequently, an integration consumer cannot traverse from an ordered Test
      to the Assay that performs it or from that Assay to the resulting Result.
      EMR/LIS implementations must invent this mapping outside the purported
      authority document.
    proposed_action: Declare the canonical Test-to-Assay mapping with cardinality
      and connect Assay to the performed Result or specimen execution path;
      specify which link is authoritative when multiple assays implement one
      test.
