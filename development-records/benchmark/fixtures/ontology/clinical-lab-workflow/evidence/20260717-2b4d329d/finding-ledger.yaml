    claim: Lifecycle states are listed without a structurally complete transition
      graph.
    lens_rationale_summary: A list of states does not connect those states into an
      enforceable lifecycle. Consumers cannot determine, for example, which
      Order states may transition to cancelled, how Specimen progresses or
      fails, or which Report transitions are valid. This prevents consistent
      validation across EMR and LIS.
    proposed_action: Represent each lifecycle as explicit transition edges with
      source, target, trigger/guard, and terminal-state semantics. Add Report
      transitions using the same state-model structure and define rejection
      behavior for undeclared transitions.
