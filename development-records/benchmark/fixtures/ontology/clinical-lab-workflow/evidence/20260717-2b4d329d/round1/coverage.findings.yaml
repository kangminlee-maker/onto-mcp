  - candidate_id: coverage-candidate-005
    target: Result clinical context
    evidence_anchor: materialized-input.md — entities.Result.attributes
    claim: Result가 문자열 값과 단위 중심으로만 정의되어 임상 결과 해석에 필요한 관찰 맥락을 포괄하지 못한다.
    what: Result에는 value:string과 unit만 있으며 관찰 시각, 값 유형(수치·정성·코드·텍스트), reference
      interval, abnormal flag, 해석, 검사 방법/장비, 검출한계, 무효·취소 또는 측정 불가 표현이 없다.
    why: 동일한 문자열 값도 단위, 방법, 검체, 기준구간과 관찰 시점에 따라 의미가 달라진다. 공통 모델이 이 차원을 제공하지 않으면 EMR이
      LIS 결과를 안전하게 표시·정렬·경고하거나 의미를 보존해 교환하기 어렵다.
    how_to_fix: Result에 observed_at, typed value choice, unit coding, reference
      interval, interpretation/abnormal flags, method 또는 assay 수행 참조,
      validity/status reason을 추가하고 측정 불가·취소 결과를 명시적으로 표현한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 검사 결과를 EMR/LIS 사이에서 의미 보존하여 전달하는 개념 권위
      failure_condition: 정성·코드형 결과, 기준구간 기반 경고, 방법 의존 결과 또는 측정 불가 결과를 교환할 때
      impact: 문자열 값만으로는 결과의 임상 의미와 표시 동작을 결정할 수 없어 수신 시스템이 비표준 추론이나 별도 매핑에 의존하게 된다.
      evidence_refs:
        - entities.Result.definition
        - entities.Result.attributes.value
        - entities.Result.attributes.unit
        - entities.Result.attributes
    causal_path:
      root_cause_candidate: Result를 임상 관찰 개념이 아니라 최소 표시 값 레코드로 축약했다.
      root_cause_step_id: coverage-candidate-005.cause-003
      steps:
        - cause_id: coverage-candidate-005.cause-001
          claim: Result의 임상 값 표현은 value:string과 unit으로 제한된다.
          relation_to_previous: null
          evidence_refs:
            - entities.Result.attributes.value
            - entities.Result.attributes.unit
        - cause_id: coverage-candidate-005.cause-002
          claim: 관찰 시각·유형·기준구간·해석·방법 차원의 부재는 관찰 맥락이 모델 범위에서 제외된 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.Result.attributes
        - cause_id: coverage-candidate-005.cause-003
          claim: Result 정의가 Test 수행 결과 값으로만 서술되고 수행·해석 맥락을 별도 개념으로 두지 않은 것이 시작 원인이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.Result.definition
            - entities.Result.attributes
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-006
    target: Test/Assay catalog authority
    evidence_anchor: materialized-input.md — entities.Test, entities.Assay, notes[0]
    claim: 병행 관리되는 Test와 Assay에 단일 권위, 매핑, 일관성 상태가 없다.
    what: 주문 카탈로그 단위 Test와 수행 단위 Assay가 별도로 존재하지만 둘 사이 관계가 없고, 신규 항목을 두 곳 모두 등록한다고만
      규정한다. 어느 쪽이 코드·명칭·부서·검체 요구의 원본인지, 한 Test가 어떤 Assay로 수행되는지 정의되지 않는다.
    why: 이중 등록 과정에서 두 카탈로그가 달라져도 온톨로지가 이를 탐지하거나 어느 값을 채택할지 결정할 수 없다. 주문된 Test를 실제 수행
      Assay와 연결하지 못해 결과의 수행 근거도 단절된다.
    how_to_fix: Test를 주문 권위, Assay를 수행 정의로 명시하고 performs/implemented_by 같은 버전된 매핑을
      추가한다. 공유 속성별 소유 권위와 불일치 처리 규칙도 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR 주문 카탈로그와 LIS 수행 카탈로그 사이의 개념 권위 및 매핑
      failure_condition: 신규·변경 검사 항목이 두 카탈로그에 서로 다르게 등록되거나 한 주문 검사가 여러 수행법을 가질 때
      impact: 단일 원본과 매핑이 없어 잘못된 검체 요구, 부서 라우팅 또는 수행법으로 주문·결과가 연결될 수 있다.
      evidence_refs:
        - entities.Test
        - entities.Assay
        - notes[0]
