  - candidate_id: axiology-candidate-002
    target: clinical-lab-ontology.yaml — CriticalValue 통보 책임과 증적 경계
    evidence_anchor: "review-value-alignment-criteria.yaml
      criterion_id=user-request-intent: “운영 시 생길 위험”; materialized-input.md
      entities.CriticalValue.definition: “즉시 통보가 필요한 위험 결과 값 범위”;
      attributes.notified note: “통보 시각과 수신자는 전화 기록 대장에 있다”.
      [value_type=commitment, alignment_direction=misaligned]"
    claim: 즉시 통보라는 핵심 약속을 불리언과 외부 전화 대장으로 분리한 모델은 통보 책임의 추적 가능성을 희생한다.
    what: 온톨로지에는 통보 여부만 있고 통보 시각, 수신자, 시도·실패·확인 상태 및 해당 Result와의 직접 관계가 없다.
    why: "`notified=true`의 의미를 입증하는 정보가 권위 문서 밖의 대장에 있으므로 EMR/LIS는 통보 완료 여부를 동일한
      개념·식별자·수명주기로 검증할 수 없다. 즉시 통보 약속이 단순 표시값으로 축소되어 운영 실패와 감사 불가능성을 구분하지 못한다."
    how_to_fix: CriticalValue 범위 정의와 실제 CriticalResult/Notification 사건을 분리하고,
      Notification에 result_ref, occurred_at, recipient, channel, acknowledgement
      및 실패·재시도 상태를 두어 동일 권위 흐름에서 추적하도록 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 위험 결과의 즉시 통보를 EMR/LIS 통합에서 일관되게 표현하고 운영 위험을 통제하는 목적.
      failure_condition: notified 값과 외부 전화 대장의 기록이 누락·불일치하거나 두 기록을 동일 결과에 결합할 수 없을 때.
      impact: 통합 시스템이 통보 완료를 검증하거나 실패를 식별할 수 없어, 문서가 선언한 즉시 통보 약속의 실행 가능성과 감사 신뢰가 무너진다.
      evidence_refs:
        - review-value-alignment-criteria.yaml#criterion_id=user-request-intent
        - .onto/review/20260717-2b4d329d/execution-preparation/materialized-input.md#entities.CriticalValue
