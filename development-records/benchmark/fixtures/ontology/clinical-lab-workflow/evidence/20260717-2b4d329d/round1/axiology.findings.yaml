    target: clinical-lab-ontology.yaml — Report/Result 상태 권위와 정정 동기화 정책
    evidence_anchor: "review-value-alignment-criteria.yaml
      criterion_id=user-request-intent: “EMR/LIS 통합의 개념 권위 문서로 쓰기에 적절한지”;
      materialized-input.md entities.Result.status note: “Report.result_status에도
      동일 정보가 유지된다”; entities.Report.result_status note: “권위 값. 임상의는 이 값을 신뢰한다”;
      state_rules[1]: corrected 결과의 amended 반영은 “동기화 배치는 야간 1회”.
      [value_type=stakeholder, alignment_direction=misaligned]"
    claim: 임상의가 신뢰하는 권위 상태를 야간 배치로 갱신하는 결정은 EMR/LIS 통합 권위 문서의 최신성 목적과 어긋난다.
    what: Result가 corrected로 바뀐 뒤에도 Report.result_status가 다음 야간 배치까지 finalized로 남을 수
      있다.
    why: 문서는 Result와 Report에 동일한 상태 정보를 중복 보유시키면서 Report를 임상의의 권위 값으로 선언한다. 정정 전파를
      지연하면 권위 화면이 LIS의 최신 결과와 의도적으로 불일치하여 통합 소비자가 오래된 상태를 신뢰할 수 있다.
    how_to_fix: Result 정정과 Report amended 전이를 하나의 원자적 또는 이벤트 기반 권위 흐름으로 정의하고, 실패 시
      finalized 상태를 계속 노출하지 않는 보류·오류 상태와 재처리 규칙을 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 결과 상태의 단일하고 신뢰 가능한 개념 권위를 제공하는 목적.
      failure_condition: Result.status가 corrected로 변경된 후 야간 동기화 전까지
        Report.result_status가 finalized로 유지될 때.
      impact: 서로 다른 시스템과 임상의가 같은 검사에 대해 상충하는 상태를 관찰하므로 권위 문서로서의 신뢰와 운영 안전성이 직접 약화된다.
