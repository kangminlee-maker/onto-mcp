      alignment_direction=misaligned]"
    claim: TAT 의미는 온톨로지에 선언하면서 실제 계산식 권위는 대시보드 팀에 맡겨 동일 지표의 의미가 분기될 수 있다.
    what: TAT의 시작·종료 의미가 문서에 적혀 있지만 계산 규칙, 예외 및 버전의 실질적 소유권은 외부 팀의 자체 공식에 있다.
    why: 개념 권위 문서와 소비자 계산식이 독립적으로 진화하면 같은 `turnaround_time` 이름이 다른 값을 나타낼 수 있다. 통합
      문서가 의미를 정하고 소비자가 그 의미를 구현해야 한다는 목적 대신, 소비자별 정의가 권위를 갖게 된다.
    how_to_fix: TAT 정의와 예외 규칙을 온톨로지의 파생 지표 계약으로 승격하고, 대시보드는 그 canonical 규칙을 참조·검증하는
      소비자로 둔다. 별도 변형이 필요하면 이름과 목적을 분리한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
