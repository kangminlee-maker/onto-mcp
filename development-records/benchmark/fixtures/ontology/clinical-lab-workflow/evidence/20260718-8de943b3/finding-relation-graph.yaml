    rationale: finding-003의 감사 증거 부재와 finding-004의 정정 계보 부재는 모두 행위와 이력을 first-class
      event/version으로 보존하지 않은 모델링 선택에서 발생한다. 다만 finding-003은 정정 외 검증·통보까지 포함하므로
