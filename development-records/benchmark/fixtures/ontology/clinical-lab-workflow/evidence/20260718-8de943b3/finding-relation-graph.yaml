    to_finding_id: finding-015
    relation: shared_cause_candidate
    root_hypothesis: Critical notification을 특정 Result에 귀속되는 독립 사건으로 모델링하면 통보 감사 증거
      부재와 규칙·통보 상태 혼합 문제가 동시에 해소된다.
