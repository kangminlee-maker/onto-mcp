      from_cause_ref: finding-003.cause-003
      to_cause_ref: finding-015.cause-002
    rationale: finding-003은 통제 행위 전반의 감사 증거를 다루고 finding-015는 CriticalValue에서 규칙과 통보
      사건이 혼합된 의미 결함을 다룬다. Critical notification 부분에서는 동일한 사건 모델 부재가 양쪽을 직접 설명한다.
