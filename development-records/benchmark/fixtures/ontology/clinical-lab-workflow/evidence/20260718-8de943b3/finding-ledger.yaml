    target: .onto/review/20260718-8de943b3/execution-preparation authority binding
    evidence_anchor: "axiology role §Authoritative alignment input/§Finding evidence
      requirements; context-candidate-assembly.yaml:1 (`system_purpose_refs:
      []`); review-value-alignment-criteria.yaml:criteria[0]"
    claim: 필수 가치 권위 문서가 바인딩되지 않아 온톨로지의 목적·가치 정렬 여부를 판단할 근거가 부족하다.
    lens_rationale_summary: 사용자 요청은 검토 목적을 설명하지만 canonical 개념 의미와 제품 원칙을 대신하지 못한다.
      따라서 현재 경계에서 특정 모델링 결정을 aligned 또는 misaligned로 판정하면 개인 해석이 되며, 이 렌즈 결과의
      신뢰성이 약화된다.
    proposed_action: 필수 순위 1~2 authority 문서를 실행 준비 단계에 명시적으로 바인딩하고 axiology 패킷에 주입한
      뒤 이 렌즈를 다시 실행한다. 읽기 권한을 부여할 수 없다면 axiology 결과를 indeterminate로 표시한다.
    affected_purpose: EMR/LIS 통합의 개념 권위 문서로서 온톨로지의 목적·가치 정렬을 검증하는 axiology 리뷰
    failure_condition: 필수 canonical authority chain 없이 사용자 요청과 대상 문서만으로 가치 판단을 수행할 때
    impact: 정렬·위반 판단을 권위 근거에 추적할 수 없어 axiology 결과를 승인 또는 개선 결정의 근거로 신뢰하기 어렵다.
