  - finding_id: finding-019
    lens_id: structure
    source_ref: .onto/review/20260718-8de943b3/round1/structure.findings.yaml#structure-candidate-001
    target: clinical-lab-ontology.yaml — Test/Assay execution path
    evidence_anchor: materialized-input.md:46-60, 108-119, 126-127
    claim: Assay is disconnected from the order-to-result workflow because no
      Test–Assay or Result–Assay relationship exists.
    lens_rationale_summary: An ordered Test cannot be structurally resolved to the
      Assay that performs it, and a Result cannot identify its executing Assay.
      EMR/LIS implementations therefore need an undocumented mapping outside the
      purported conceptual authority.
    proposed_action: Add a canonical Test-to-Assay execution mapping with
      cardinality and, where execution traceability is required, link Result to
      the performed Assay. Replace the dual-registration note with an explicit
      synchronization or ownership rule.
    affected_purpose: Using the ontology as the conceptual authority for EMR/LIS
      integration from Order through Report.
    failure_condition: Whenever an ordered Test must be translated into an analyzer
      execution unit or an emitted Result must be traced to that unit.
    impact: The core order-to-execution path cannot be derived from the authority
      document, forcing divergent out-of-band mappings between systems.
    evidence_refs:
      - .onto/review/20260718-8de943b3/round1/structure.findings.yaml#structure-candidate-001
      - materialized-input.md:46-60
      - materialized-input.md:108-119
      - materialized-input.md:126-127
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Using the ontology as the conceptual authority for EMR/LIS
        integration from Order through Report.
      failure_condition: Whenever an ordered Test must be translated into an analyzer
        execution unit or an emitted Result must be traced to that unit.
      impact: The core order-to-execution path cannot be derived from the authority
        document, forcing divergent out-of-band mappings between systems.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:108-119
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: The ontology declares separate orderable and executable
        catalog concepts without defining their canonical connecting
        relationship.
      root_cause_step_id: finding-019.cause-002
      steps:
        - cause_id: finding-019.cause-001
          claim: Assay has only a Department reference and no edge into the
            Order–Test–Specimen–Result–Report graph.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:54-60
            - materialized-input.md:108-119
        - cause_id: finding-019.cause-002
          claim: The document postpones Test/Assay consolidation and requires duplicate
            registration without defining a mapping between them.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:126-127
      unresolved_beyond_evidence: The target does not establish whether one Test maps
        to one or multiple Assays; that cardinality requires an explicit design
        decision.
  - finding_id: finding-020
    lens_id: structure
    source_ref: .onto/review/20260718-8de943b3/round1/structure.findings.yaml#structure-candidate-002
    target: clinical-lab-ontology.yaml — CriticalValue notification structure
    evidence_anchor: materialized-input.md:100-106, 108-119
    claim: CriticalValue lacks the relationships needed to connect a critical
      threshold to the Result occurrence and its notification record.
    lens_rationale_summary: The model cannot identify which result triggered
      notification or substantiate who was notified and when. A single boolean
      on a threshold-range concept cannot structurally represent multiple
      result-specific notification events.
    proposed_action: Keep CriticalValue as threshold configuration and add a
      result-specific notification occurrence linked to Result, the applicable
      threshold, notifier, recipient, and timestamp; represent any external
      telephone log with an explicit reference.
    affected_purpose: Serving as an operational EMR/LIS conceptual authority,
      including the declared immediate-notification workflow.
    failure_condition: When multiple Results are evaluated against the same critical
      range or systems must exchange or audit a notification.
    impact: The integration contract cannot associate notification state with a
      particular clinical result or its actors, making the declared workflow
      non-actionable and non-traceable.
    evidence_refs:
      - .onto/review/20260718-8de943b3/round1/structure.findings.yaml#structure-candidate-002
      - materialized-input.md:100-106
      - materialized-input.md:108-119
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Serving as an operational EMR/LIS conceptual authority,
        including the declared immediate-notification workflow.
      failure_condition: When multiple Results are evaluated against the same critical
        range or systems must exchange or audit a notification.
      impact: The integration contract cannot associate notification state with a
        particular clinical result or its actors, making the declared workflow
        non-actionable and non-traceable.
      evidence_refs:
        - materialized-input.md:100-106
        - materialized-input.md:108-119
    causal_path:
      root_cause_candidate: A result-specific notification occurrence and its required
        relations are absent from the ontology.
      root_cause_step_id: finding-020.cause-002
      steps:
        - cause_id: finding-020.cause-001
          claim: CriticalValue contains only a Test reference, numeric bounds, and a
            notified boolean, with no Result or notification-party link.
          relation_to_previous: null
          evidence_refs:
