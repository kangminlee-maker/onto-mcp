  - finding_id: finding-002
    lens_id: coverage
    source_ref: .onto/review/20260718-8de943b3/round1/coverage.findings.yaml#coverage-candidate-001
    target: clinical-lab-ontology.yaml — Specimen lifecycle and state_rules
    evidence_anchor: materialized-input.md:37-44,121-124
    claim: 검체 lifecycle이 채취 완료에서 시작해 분석 완료에서 끝나므로 채취 실패·접수 거부·재채취와 보관·폐기 단계를 표현하지 못한다.
    lens_rationale_summary: 문서는 Order부터 Report까지의 통합 권위를 표방하지만, 검체 예외와 종결 상태를 공통 모델로
      전달할 수 없다. 해당 상황에서 EMR과 LIS가 서로 다른 자체 상태를 만들 가능성이 커진다.
    proposed_action: Specimen lifecycle에 pending_collection, collection_failed,
      rejected, recollection_requested, retained, disposed 같은 필요한 상태를 추가하고 전이
      사유·시각을 표현하는 SpecimenEvent를 정의한다.
    affected_purpose: Order부터 Report까지의 EMR/LIS 통합 상태 모델을 개념 권위로 제공하는 목적
    failure_condition: 채취 실패, 검체 부적합, 재채취 또는 분석 후 보관·폐기가 발생할 때
    impact: 통합 시스템이 공통 상태와 종결 의미를 교환할 수 없어 주문 진행 여부와 검체 처리 결과를 일관되게 판단할 수 없다.
    evidence_refs:
      - .onto/review/20260718-8de943b3/round1/coverage.findings.yaml#coverage-candidate-001
      - materialized-input.md:6-8
      - materialized-input.md:37-44
      - materialized-input.md:121-124
