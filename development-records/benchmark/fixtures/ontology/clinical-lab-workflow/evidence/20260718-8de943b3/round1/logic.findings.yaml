findings:
  - candidate_id: logic-candidate-001
    target: clinical-lab-ontology.yaml의 Order 완료 상태 규칙
    evidence_anchor: materialized-input.md:23, 71-72, 122-123
    claim: 가역적인 Result.status를 Order의 종결 조건으로 사용하면서 corrected 이후의 재개방·재판정 규칙이 없어 시간
      전개상 완료 상태와 완료 조건이 충돌할 수 있다.
    what: 모든 Result가 final이면 Order가 completed로 전이하지만, 이후 Result가 corrected로 바뀌는 경로도
      허용됩니다. Order lifecycle에는 completed 이후 상태를 재평가하거나 되돌리는 규칙이 없습니다.
    why: 충돌 쌍은 clinical-lab-ontology.yaml:122와 :123이며 lifecycle 폐쇄성 증거는 :23입니다.
      completed가 지속되는 상태라면, corrected 사건 뒤에는 Order=completed와 ‘모든 Result=final’
      조건의 부정이 동시에 성립합니다. 이는 여러 claim 사이의 시간적 inter-claim 충돌이며 modality는
      necessary 완료 조건과 possible 후속 정정 사건이 섞인 mixed입니다. 상태 전이 구조의 미정의도 원인에 포함되므로
      structure lens와 경계가 맞닿지만, 명시된 완료 규칙과 정정 규칙의 시간적 충돌 자체는 logic 범위입니다.
    how_to_fix: 완료 의미를 명시적으로 선택하십시오. corrected도 완료를 유지하는 종결 결과 상태로 포함하거나, 정정 발생 시
      Order를 in_progress/reopened로 되돌린 뒤 재완료하도록 전이 규칙을 추가하고 허용 전이표를 정의하십시오.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 Order 상태를 일관된 개념 권위로 사용하는 목적
      failure_condition: completed 전이 후 포함 Result 중 하나가 corrected로 변경되는 경우
      impact: 두 시스템이 동일 사건 뒤에도 Order 완료 여부를 다르게 계산할 수 있어 상태 기반 처리와 감사 결과의 신뢰가 약화됩니다.
      evidence_refs:
        - materialized-input.md:23
        - materialized-input.md:71-72
        - materialized-input.md:122-123
    causal_path:
      root_cause_candidate: Order 완료 판정이 변경 가능한 Result.status에 의존하지만 후속 정정에 대한 Order 전이 정책이 정의되지 않았다.
      root_cause_step_id: logic-candidate-001.cause-003
      steps:
        - cause_id: logic-candidate-001.cause-001
          claim: Result가 corrected로 변경된 후에도 Order는 completed 상태로 남을 수 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:23
            - materialized-input.md:122-123
        - cause_id: logic-candidate-001.cause-002
          claim: 이 상태는 완료 판정에 사용된 ‘모든 Result가 final’ 조건이 후속 사건으로 거짓이 될 수 있는 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:71-72
            - materialized-input.md:122-123
        - cause_id: logic-candidate-001.cause-003
          claim: 가역 상태를 종결 조건으로 사용하면서 재개방 또는 corrected를 포함하는 안정된 종결 조건을 정의하지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:23
            - materialized-input.md:122-123
      unresolved_beyond_evidence: completed가 역사적 전이 사실인지 현재 조건을 보장하는 지속 상태인지는 명시되지
        않았다. 어느 해석을 권위로 삼더라도 대상 문서 안에서 확정해야 한다.
  - candidate_id: logic-candidate-002
    target: clinical-lab-ontology.yaml의 Result–Report 상태 동기화 규칙
    evidence_anchor: materialized-input.md:69-72, 80-84, 123
    claim: Result와 Report가 동일 상태 정보를 유지해야 한다는 불변 조건은 corrected 후 야간 배치 전까지의 비동기 상태를
      허용하는 규칙과 동시에 만족되지 않는다.
    what: Result.status가 corrected가 되면 Report.result_status가 amended여야 하지만 동기화는 야간
      1회로 규정되어 있습니다. 따라서 정정 시점과 다음 배치 사이에는 Result는 corrected이고 Report는
      finalized인 상태가 가능합니다.
    why: 충돌 쌍은 clinical-lab-ontology.yaml:72의 ‘동일 정보가 유지된다’는 claim과 :123의
      corrected→amended 의무 및 야간 1회 동기화 claim입니다. 이는 다중 claim 간 inter-claim
      충돌입니다. modality는 지속적으로 동일 정보를 유지해야 한다는 necessary 조건과 지연된 obligatory 갱신이
      충돌하는 mixed입니다. 특히 Report.result_status가 임상의가 신뢰하는 권위 값이라고 명시되어 있어 일시적 불일치도
      소비자에게 노출됩니다. ‘유지’가 단지 최종적 일치를 뜻한다면 모순은 사라지므로 그 해석 문제는 semantics lens에도 인계될
      수 있으나, 현재 문언을 지속 불변 조건으로 읽으면 논리 충돌이 남습니다.
    how_to_fix: 상태 권위를 하나로 통합하고 Report 상태를 Result에서 실시간으로 파생하거나, 비동기 복제를 유지한다면
      ‘eventual consistency’와 최대 지연시간을 명시하고 정정 대기 상태를 별도로 모델링하십시오. 임상의에게 노출되는 권위
      상태는 배치 전에도 corrected/amended 사실을 반영해야 합니다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 임상의와 EMR/LIS가 신뢰할 수 있는 단일 결과 상태 권위를 제공하는 목적
      failure_condition: Result가 야간 동기화 이후 다음 배치 전에 corrected로 변경되는 경우
      impact: 권위로 선언된 Report가 실제 Result 정정을 반영하지 않아 소비 시스템과 임상의가 상반된 상태를 관찰할 수 있습니다.
      evidence_refs:
        - materialized-input.md:69-72
        - materialized-input.md:80-84
        - materialized-input.md:123
    causal_path:
      root_cause_candidate: 하나의 결과 상태 사실을 Result와 Report에 중복 저장하면서 동기화 지연과 일관성 양상을 정의하지 않았다.
      root_cause_step_id: logic-candidate-002.cause-003
      steps:
        - cause_id: logic-candidate-002.cause-001
          claim: 정정 후 다음 야간 배치까지 Result.status와 Report.result_status가 서로 다른 의미 상태를 나타낼 수
            있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-72
            - materialized-input.md:80-84
            - materialized-input.md:123
        - cause_id: logic-candidate-002.cause-002
          claim: 이 불일치는 즉시 동일 정보 유지 의무와 야간 배치 갱신 방식이 함께 선언된 결과다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:72
            - materialized-input.md:123
        - cause_id: logic-candidate-002.cause-003
          claim: 동일 사실을 두 속성에 권위성 있게 복제하면서 원자적 갱신 또는 명시적 eventual-consistency 계약을 두지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:72
            - materialized-input.md:80-84
            - materialized-input.md:123
      unresolved_beyond_evidence: 야간 배치 외에 실시간 동기화 경로가 존재하는지는 경계 내 문서에 제시되지 않았다.
domain_constraints_used: []
domain_context_assumptions:
  - completed와 finalized는 후속 전이가 명시되지 않는 한 지속되는 lifecycle 상태로 해석했다.
  - ‘동일 정보가 유지된다’는 문구를 특정 시점의 우연한 일치가 아니라 상태 간 일관성 불변 조건으로 해석했다.
  - 임상 도메인의 외부 규칙이나 관행은 사용하지 않았다.
