domain_context_assumptions:
  - session_domain이 none이므로 외부 임상 표준이나 기관별 규정을 규범 근거로 사용하지 않았다.
  - 문서가 스스로 선언한 Order부터 Report까지의 범위에는 검체 처리, 검사 수행, 결과 검증·정정 및 보고·통보에 필요한 공통 운영
    개념이 포함되어야 한다고 보았다.
