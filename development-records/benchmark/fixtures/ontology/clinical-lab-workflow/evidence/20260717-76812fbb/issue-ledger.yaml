    proposed_action: "Test와 Assay를 성급히 통합하기보다 서로 다른 생명주기를 유지하되 명시적인
      performs/implements 매핑과 cardinality, 검체 타입의 공통 코드 체계, 등록 권위와 동기화 검증 규칙을
      정의한다. 이중 수동 등록은 파생 또는 검증된 동기화로 대체한다. / TestAssayMapping 또는 명시적 relation을
      추가하고 카디널리티, authoritative_system, effective_from/effective_to, version 및
      폐기 상태를 정의한다. / Retain distinct canonical concepts for the orderable
      service and executable assay unless evidence establishes identity. Add an
      explicit realizes/is_performed_by mapping with cardinality and code-system
      ownership; represent panels or batteries separately when an orderable item
      expands into multiple performed measurements. / Test와 Assay 사이에 명시적인 수행 매핑
      관계를 추가하고 다대다 여부와 필수 cardinality를 정의한다. 예: Test `performed_by` Assay 및
      Assay `implements` Test. / Use a source relation such as Result
      has_specimen/derived_from Specimen, and assign production to a performed
      Test/Assay execution. Introduce the execution concept or relation needed
      to connect the ordered test, assay, specimen, and result without treating
      the specimen as the causal actor."
