  - relation_id: rel-013
    from_finding_id: finding-012
    to_finding_id: finding-022
    relation: same_root_candidate
    root_hypothesis: 검체 원천, 처리된 재료, 채취 한정자를 공통 식별자·계층·버전이 있는 개념으로 분리하지 않고 enum과 문자열에
      내장한 것이 확장성 및 의미 호환성 문제를 함께 만든다.
