relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-008
    relation: duplicates
    root_hypothesis: Result와 Report에 동일한 임상 상태를 중복 저장하고 비동기 동기화하면서 단일 권위와 충돌 판정 규칙을
      두지 않은 것이 두 finding의 공통 결함이다.
    shared_cause: null
    rationale: 두 finding 모두 corrected 발생 후 야간 배치 전 Report가 finalized로 남는 동일 실패 조건과
      동일 상태 권위 결함을 지적한다.
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-008
    to_finding_id: finding-017
    relation: duplicates
    root_hypothesis: 서로 다른 Result·Report lifecycle 의미를 하나의 정보로 간주해 별도 권위 필드로 저장한 의미적
      혼동이 두 finding을 동시에 설명한다.
    shared_cause: null
    rationale: 두 finding은 같은 필드, 같은 비동기 corrected→amended 처리, 같은 stale
      clinician-facing 상태 위험을 서로 다른 렌즈에서 기술한다.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-008
    to_finding_id: finding-013
    relation: shared_cause_candidate
    root_hypothesis: 공통 상태 권위와 완전하고 버전 가능한 Result→Report 투영 계약이 없기 때문에 현재 동기화 충돌과 향후
      상태 확장 실패가 함께 발생한다.
    shared_cause:
      cause_claim: Result와 Report의 중복 상태 어휘 사이에 단일 권위, 완전한 매핑, 버전 및 충돌 처리 계약이 없다.
      from_cause_ref: finding-008.cause-003
      to_cause_ref: finding-013.cause-003
    rationale: finding-008은 현재 corrected 동기화 창의 불일치를, finding-013은 새 상태 도입 시 호환성 붕괴를
      다루지만 두 causal path가 동일한 권위·투영 계약 부재를 명시한다.
    confidence: high
  - relation_id: rel-004
    from_finding_id: finding-002
    to_finding_id: finding-005
    relation: same_root_candidate
    root_hypothesis: 중요값 통보를 Result별 독립 사건으로 모델링하지 않고 boolean과 외부 전화 대장에 분산한 설계가 운영
      권위와 감사 증거의 결손을 함께 만든다.
    shared_cause: null
    rationale: finding-002의 즉시 통보 운영 계약 부재와 finding-005의 감사 재구성 불가능성은 모두 notified
      boolean, 외부 기록, 연결 식별자 부재에서 발생한다.
    confidence: high
  - relation_id: rel-005
    from_finding_id: finding-002
    to_finding_id: finding-018
    relation: same_root_candidate
    root_hypothesis: 재사용 임계값 정책과 결과별 통보 실행 상태를 하나의 CriticalValue 개념에 결합한 것이 즉시 통보
      계약의 분산과 의미적 모호성을 함께 유발한다.
    shared_cause: null
    rationale: finding-002는 운영·추적성 결과를, finding-018은 type-level 규칙과 token-level 사건의
      혼합을 지적하며 모두 CriticalValue의 range와 notified 결합을 근거로 한다.
    confidence: high
  - relation_id: rel-006
    from_finding_id: finding-018
    to_finding_id: finding-025
    relation: shared_cause_candidate
    root_hypothesis: 임계값 정의와 발생별 통보 사건을 분리하면 두 finding의 모호한 notified 소유권과 Result 연결
      부재가 함께 해소되어야 한다.
    shared_cause:
      cause_claim: 재사용되는 임계값 정의와 개별 결과의 통보 발생 상태가 하나의 CriticalValue 엔티티에 결합되어 있다.
      from_cause_ref: finding-018.cause-002
      to_cause_ref: finding-025.cause-002
    rationale: 두 causal path 모두 threshold 정의가 occurrence-specific notification
      state를 소유하도록 한 동일 모델링 결정을 직접 지목한다.
    confidence: high
  - relation_id: rel-007
