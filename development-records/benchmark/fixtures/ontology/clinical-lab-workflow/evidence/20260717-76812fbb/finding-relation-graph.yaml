    confidence: high
  - relation_id: rel-008
    from_finding_id: finding-007
    to_finding_id: finding-011
    relation: duplicates
    root_hypothesis: Test·Assay 병행 카탈로그에 단일 권위와 버전 가능한 매핑이 없다는 하나의 결함이 배포 시점 불일치와 진화
