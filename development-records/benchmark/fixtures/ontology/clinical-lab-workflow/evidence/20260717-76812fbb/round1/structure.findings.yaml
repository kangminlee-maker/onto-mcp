findings:
  - candidate_id: structure-candidate-001
    target: clinical-lab-ontology.yaml — Test/Assay workflow connection
    evidence_anchor: entities.Test, entities.Assay, relations, notes[0]
    claim: 주문 가능한 Test와 분석 수행 단위인 Assay 사이의 필수 연결이 없다.
    what: Test는 주문 카탈로그 단위이고 Assay는 분석기 수행 단위로 정의되지만, 두 엔티티를 연결하는 관계나 참조 속성이 없다.
      Assay는 Department에만 연결되어 주문-검체-결과 워크플로에서 격리되어 있다.
    why: EMR의 주문 항목에서 LIS의 실제 수행 항목으로 이어지는 구조적 경로가 없으므로, 두 시스템이 어떤 Assay를 실행해야 하는지 이
      권위 문서만으로 결정할 수 없다. 두 카탈로그에 신규 항목을 모두 등록한다는 노트도 항목 간 대응 관계를 만들지 않는다.
    how_to_fix: "Test와 Assay 사이에 명시적인 수행 매핑 관계를 추가하고 다대다 여부와 필수 cardinality를 정의한다.
      예: Test `performed_by` Assay 및 Assay `implements` Test."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계에서 주문 카탈로그와 분석기 수행 단위를 연결하는 개념 권위 제공
      failure_condition: 주문된 Test를 LIS의 실행 가능한 Assay로 변환해야 하는 모든 통합 흐름
      impact: 핵심 실행 매핑을 문서 밖의 암묵적 규칙이나 별도 테이블에 의존하게 하여 권위 문서의 완결성과 구현 일관성을 훼손한다.
      evidence_refs:
        - entities.Test.definition
        - entities.Assay.definition
        - relations 전체에 Test-Assay 연결 부재
        - notes[0]
    causal_path:
      root_cause_candidate: Test와 Assay를 별도 카탈로그로 유지하면서 대응 관계의 구조화를 카탈로그 통합 검토 이후로 미뤘다.
      root_cause_step_id: structure-candidate-001.cause-002
      steps:
        - cause_id: structure-candidate-001.cause-001
          claim: 주문된 Test에서 실행할 Assay로 도달하는 관계가 없다.
          relation_to_previous: null
          evidence_refs:
            - entities.Test
            - entities.Assay
            - relations
        - cause_id: structure-candidate-001.cause-002
          claim: 이는 두 카탈로그를 병행 등록하지만 통합 여부만 추후 검토한다고 한 설계의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - notes[0]
      unresolved_beyond_evidence: Test-Assay 대응 cardinality와 실제 매핑 규칙은 현재 경계 내 자료로 확정할 수 없다.
  - candidate_id: structure-candidate-002
    target: clinical-lab-ontology.yaml — lifecycle/state_rules
    evidence_anchor: entities.Order.lifecycle, entities.Specimen.lifecycle,
      entities.Report.attributes.result_status, state_rules
    claim: 선언된 상태 대부분에 전이 연결이 없어 상태 모델이 구조적으로 완결되지 않았다.
    what: Order와 Specimen은 상태 목록만 가지며, 전이 출발점·도착점·조건이 연결된 그래프가 없다. Order의 completed
      전이와 Report 상태 변경 일부만 서술되고, Order의 draft/placed/in_progress/cancelled 및
      Specimen의 collected/received/in_analysis/analyzed 사이 전이는 정의되지 않는다.
    why: EMR과 LIS가 동일한 상태 진행을 구현하려면 허용 전이와 조건을 공유해야 한다. 현재 구조에서는 각 시스템이 상태 순서, 취소 가능
      시점, 검체 진행 조건을 독자적으로 보완해야 하므로 이 파일이 상태 모델의 개념 권위 역할을 수행하지 못한다.
    how_to_fix: 각 lifecycle에 명시적인 transition 구조를 추가해 from, to, trigger/guard를 연결하고,
      모든 선언 상태가 적어도 하나의 진입 또는 진출 경로를 갖는지 검증한다. Report의 상태도 같은 상태 모델 구조로 통합한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS가 공유할 주문·검체·보고 상태 모델의 개념 권위 제공
      failure_condition: 시스템이 주문 또는 검체의 다음 허용 상태와 전이 조건을 결정해야 할 때
      impact: 상태 목록은 공유되지만 전이 계약은 공유되지 않아 시스템별 구현이 분기되고 잘못된 상태 조합을 구조적으로 거부할 수 없다.
      evidence_refs:
        - entities.Order.lifecycle
        - entities.Specimen.lifecycle
        - state_rules[0]
        - state_rules[1]
        - state_rules[2]
    causal_path:
      root_cause_candidate: 상태 모델이 전이 그래프가 아니라 상태 열거와 일부 자연어 규칙으로만 표현되었다.
      root_cause_step_id: structure-candidate-002.cause-002
      steps:
        - cause_id: structure-candidate-002.cause-001
          claim: Order와 Specimen의 여러 상태 노드에 대응하는 전이 연결이 없다.
          relation_to_previous: null
          evidence_refs:
            - entities.Order.lifecycle
            - entities.Specimen.lifecycle
            - state_rules
        - cause_id: structure-candidate-002.cause-002
          claim: 이는 전이 구조 없이 lifecycle 배열과 부분적 자연어 규칙만 사용한 모델링 방식의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.Order.lifecycle
            - entities.Specimen.lifecycle
            - state_rules
      unresolved_beyond_evidence: 각 전이의 실제 업무 조건과 책임 시스템은 현재 경계 내 자료로 확정할 수 없다.
  - candidate_id: structure-candidate-003
    target: clinical-lab-ontology.yaml — CriticalValue notification linkage
    evidence_anchor: entities.CriticalValue, entities.Result, relations
    claim: CriticalValue의 통보 완료 상태를 실제 Result 발생 건에 연결하는 관계가 없다.
    what: CriticalValue는 Test별 위험 범위를 나타내면서 `notified` Boolean도 보유하지만, 어떤 Result가 임계
      범위를 충족했고 그 결과 건의 통보가 완료되었는지를 연결하는 Result 참조나 통보 사건 관계가 없다.
    why: 하나의 Test와 임계 범위는 여러 Result에 반복 적용될 수 있다. 범위 정의 자체에 통보 상태를 두고 발생 결과와 연결하지
      않으면 EMR/LIS가 통보 상태의 대상 결과를 식별하거나 교환할 수 없다.
    how_to_fix: CriticalValue는 임계값 정의로 유지하고, Result에 연결되는 별도의 통보 발생 엔티티 또는 관계를 추가한다.
      최소한 Result 참조, 통보 시각, 수신자 및 완료 상태를 동일 발생 건에 연결한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 위험 결과와 통보 상태를 EMR/LIS 간 일관되게 연결하는 운영 개념 모델
      failure_condition: 동일 Test에서 여러 환자 또는 여러 시점의 Result가 발생하고 개별 통보 여부를 추적할 때
      impact: 통보 완료 상태가 결과 발생 건과 분리되어 대상 식별과 감사 가능한 상태 교환이 불가능하다.
      evidence_refs:
        - entities.CriticalValue.definition
        - entities.CriticalValue.attributes.test_ref
        - entities.CriticalValue.attributes.notified
        - entities.Result
        - relations 전체에 CriticalValue-Result 연결 부재
    causal_path:
      root_cause_candidate: 재사용되는 임계값 정의와 결과별 통보 발생 상태를 하나의 CriticalValue 엔티티에 결합했다.
      root_cause_step_id: structure-candidate-003.cause-002
      steps:
        - cause_id: structure-candidate-003.cause-001
          claim: "`notified` 상태를 특정 Result에 귀속시키는 연결이 없다."
          relation_to_previous: null
          evidence_refs:
            - entities.CriticalValue.attributes.notified
            - relations
        - cause_id: structure-candidate-003.cause-002
          claim: 이는 임계값 정의 엔티티가 발생별 통보 상태까지 직접 보유한 모델링의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - entities.CriticalValue.definition
            - entities.CriticalValue.attributes.lower_bound
            - entities.CriticalValue.attributes.upper_bound
            - entities.CriticalValue.attributes.notified
      unresolved_beyond_evidence: 전화 기록 대장의 외부 데이터 구조와 연동 방식은 현재 경계 밖이므로 검증할 수 없다.
domain_constraints_used: []
domain_context_assumptions:
  - 속성의 ref도 엔티티 간 구조적 연결로 간주했다.
  - 문서 자체의 Test와 Assay 정의에 따라 주문 단위에서 수행 단위로 추적 가능한 연결이 필요하다고 보았다.
  - CriticalValue의 임계 범위는 반복 사용되는 정의이고 `notified`는 개별 결과 발생에 대한 상태라고 해석했다.
validation:
  unaddressable_candidates: []
