          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-72
            - materialized-input.md:80-83
            - materialized-input.md:123
      unresolved_beyond_evidence: 야간 배치의 정확한 최대 지연과 장애 복구 방식은 경계 내 자료에 없다.
  - candidate_id: axiology-candidate-002
    target: clinical-lab-ontology.yaml — CriticalValue 통보 모델
    evidence_anchor: 'value_type=commitment; alignment_direction=misaligned;
      value_authority_anchor={source:
      .onto/review/20260717-76812fbb/execution-preparation/review-value-alignment-criteria.yaml,
      anchor: criterion user-request-intent, lines 6-8, excerpt: "개념적 타당성과 운영 시
      생길 위험"}; target evidence: materialized-input.md lines 100-106, 108-119'
    claim: 즉시 통보라는 핵심 약속을 boolean과 외부 전화 기록에 분산한 모델은 EMR/LIS 통합의 운영 권위가 되기에 부족하다.
    what: CriticalValue에는 특정 Result와의 관계, 통보 시각, 수신자, 통보 시도·확인 상태가 없고 notified
      boolean만 있으며 나머지 증거는 별도 전화 기록 대장에 둔다.
    why: 문서가 즉시 통보 필요성을 직접 선언하지만, 통합 시스템이 어떤 결과가 임계값을 충족했고 누구에게 언제 전달·확인됐는지 이 권위
      문서만으로 표현하거나 검증할 수 없다. 단순 저장 편의가 즉시성·추적성 약속보다 우선된 숨은 트레이드오프다.
    how_to_fix: CriticalValue를 임계값 정책으로 명확히 구분하고, Result와 연결된 CriticalNotification
      이벤트를 추가해 발생·시도·전달·확인 시각, 수신자, 채널, 상태와 재시도/에스컬레이션 규칙을 권위 모델에 포함한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 통합의 개념 권위 문서가 즉시 통보가 필요한 위험 결과의 운영 계약을 일관되게 제공하는 목적
      failure_condition: 임계 결과가 발생했지만 notified boolean이 지연·오류·중복 갱신되거나 외부 전화 기록과 불일치하는 경우
      impact: 통합 구현이 즉시 통보의 발생, 전달, 확인을 판정하거나 감사할 공통 권위를 갖지 못해 환자 안전 관련 운영이 시스템별 관행으로
        분열된다.
      evidence_refs:
        - materialized-input.md:100-106
        - materialized-input.md:108-119
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 임계값 정책과 통보 실행·증거를 하나의 CriticalValue 레코드와 외부 전화 대장에 분산한 개념 모델
      root_cause_step_id: axiology-candidate-002.cause-002
      steps:
