    target: clinical-lab-ontology.yaml — Result/Report 상태 권위와 corrected 전파 규칙
    evidence_anchor: 'value_type=stakeholder; alignment_direction=misaligned;
      value_authority_anchor={source:
      .onto/review/20260717-76812fbb/execution-preparation/review-value-alignment-criteria.yaml,
      anchor: criterion user-request-intent, lines 6-8, excerpt: "EMR/LIS 통합의 개념
      권위 문서로 쓰기에 적절한지…운영 시 생길 위험"}; target evidence: materialized-input.md lines
      69-83, 121-123'
    claim: 임상의가 신뢰하는 보고 상태를 별도 권위 값으로 두고 corrected 반영을 야간 배치에 맡긴 결정은 통합 권위 문서의 신뢰성
      목적과 어긋난다.
    what: Result.status가 corrected여도 Report.result_status는 다음 야간 동기화 전까지 finalized로
      남을 수 있다.
    why: 문서는 Report.result_status를 임상의가 신뢰하는 권위 값이라고 선언한다. 동시에 동일 의미를 두 상태 필드에 중복하고
      정정 전파를 최대 하루 지연하므로, 임상의에게 노출되는 권위 값이 LIS의 최신 결과 상태와 의도적으로 불일치할 수 있다.
    how_to_fix: 결과 상태의 단일 권위 원천과 명시적 상태 매핑을 정의하고, corrected 전이는 동일 트랜잭션 또는 신뢰 가능한 즉시
      이벤트로 Report에 반영되도록 계약화한다. 실패 시 보고서를 stale/blocked로 표시하는 규칙도 포함한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 엔티티·상태의 개념 권위를 제공하고 임상의가 신뢰할 수 있는 최신 보고 상태를 정의하는 목적
      failure_condition: Result.status가 corrected로 변경된 뒤 야간 배치가 실행되기 전까지
        Report.result_status가 finalized로 유지되는 경우
      impact: 권위 문서 자체가 상충하는 최신 상태를 허용하여 임상 소비자와 통합 구현이 잘못된 최종 상태를 신뢰하게 만든다.
      evidence_refs:
        - materialized-input.md:69-83
        - materialized-input.md:121-123
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 동일한 결과 상태를 Result와 Report에 각각 권위 값으로 저장하면서 정합성을 비동기 야간 배치에 맡긴 설계
      root_cause_step_id: axiology-candidate-001.cause-002
      steps:
