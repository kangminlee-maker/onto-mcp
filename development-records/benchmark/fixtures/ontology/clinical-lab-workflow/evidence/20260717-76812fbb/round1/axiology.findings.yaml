      unresolved_beyond_evidence: 전화 기록 대장의 스키마, 정합성 및 장애 처리 계약은 경계 내 자료에 없다.
  - candidate_id: axiology-candidate-003
    target: clinical-lab-ontology.yaml — Test/Assay 카탈로그 운영
    evidence_anchor: 'value_type=purpose; alignment_direction=misaligned;
      value_authority_anchor={source:
      .onto/review/20260717-76812fbb/execution-preparation/review-value-alignment-criteria.yaml,
      anchor: criterion user-request-intent, lines 6-8, excerpt: "EMR/LIS 통합의 개념
      권위 문서"}; target evidence: materialized-input.md lines 46-60, 126-127'
    claim: 매핑 없는 Test/Assay 이중 등록을 정상 운영으로 허용한 결정은 단일 개념 권위를 제공하려는 목적에서 벗어난다.
    what: 주문 단위 Test와 수행 단위 Assay가 별도 코드·명칭·검체 표현을 가지지만 둘 사이 관계나 매핑이 없고, 신규 항목을 두
      카탈로그에 모두 수동 등록한다.
    why: EMR의 주문 개념과 LIS의 수행 개념을 연결하는 것이 통합 문서의 핵심인데, 현재 정책은 그 대응 관계를 명시하지 않은 채 이중
      입력을 요구한다. 양쪽 값이 달라져도 어느 표현이 권위인지 또는 어떤 Assay가 주문된 Test를 수행하는지 판정할 수 없다.
    how_to_fix: Test와 Assay를 성급히 통합하기보다 서로 다른 생명주기를 유지하되 명시적인 performs/implements
      매핑과 cardinality, 검체 타입의 공통 코드 체계, 등록 권위와 동기화 검증 규칙을 정의한다. 이중 수동 등록은 파생 또는
      검증된 동기화로 대체한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR 주문 카탈로그와 LIS 수행 카탈로그 사이의 공통 개념 권위를 제공하는 목적
      failure_condition: 신규 항목의 Test와 Assay 코드, 명칭, 부서 또는 검체 표현이 서로 다르게 등록되거나 매핑이 누락되는 경우
      impact: 통합 소비자가 주문과 실제 수행 항목의 대응을 권위 문서에서 결정할 수 없어 시스템별 사설 매핑과 불일치가 생긴다.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:126-127
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: Test와 Assay를 별도 개념으로 두면서 둘 사이의 권위 있는 매핑 대신 이중 수동 등록을 채택한 정책
      root_cause_step_id: axiology-candidate-003.cause-002
      steps:
        - cause_id: axiology-candidate-003.cause-001
          claim: 신규 검사 항목은 서로 다른 스키마의 Test와 Assay 양쪽에 등록되어야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:127
        - cause_id: axiology-candidate-003.cause-002
          claim: 이중 등록 부담과 불일치 가능성은 주문 단위와 수행 단위 사이의 명시적 매핑 부재의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:108-119
            - materialized-input.md:127
      unresolved_beyond_evidence: 현재 EMR/LIS에 존재하는 실제 카탈로그 매핑과 불일치 규모는 경계 내 자료에 없다.
  - candidate_id: axiology-candidate-004
    target: clinical-lab-ontology.yaml — turnaround_time(TAT) 권위
    evidence_anchor: 'value_type=boundary; alignment_direction=misaligned;
      value_authority_anchor={source:
      .onto/review/20260717-76812fbb/execution-preparation/review-value-alignment-criteria.yaml,
      anchor: criterion user-request-intent, lines 6-8, excerpt: "EMR/LIS 통합의 개념
      권위 문서"}; target evidence: materialized-input.md lines 37-44, 75-84,
      126-128'
    claim: 공유 운영 지표인 TAT의 계산 권위를 대시보드 팀의 자체 식으로 위임한 것은 개념 권위 문서의 경계를 훼손한다.
    what: TAT 시작·종료 필드는 온톨로지에 있지만 계산 의미와 예외 규칙은 권위 모델이 아니라 대시보드 팀이 자체 유지한다.
    why: 이 문서를 기준으로 여러 EMR/LIS 소비자가 통합되더라도 취소, 재채취, 수정 보고, 누락 시각 같은 경우의 TAT 의미가 공통
      계약으로 고정되지 않는다. 국소적인 대시보드 구현 편의 때문에 동일 업무의 성과 지표가 소비자별로 달라질 수 있다.
    how_to_fix: TAT를 collected_at과 released_at에서 파생되는 명명된 projection으로 정의하고 포함·제외
      조건, 재채취·수정·취소·누락 처리, 시간대와 버전 규칙을 온톨로지 또는 연결된 권위 계약에 명시한다. 대시보드는 이를 구현하는
      소비자로 둔다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 공통 워크플로 개념과 운영 의미를 권위 있게 제공하는 목적
      failure_condition: 대시보드나 다른 소비자가 경계 사례를 서로 다른 자체 계산식으로 처리하는 경우
      impact: 동일한 검사 흐름에서 TAT 값이 시스템별로 달라져 운영 비교, SLA 판단 및 개선 의사결정의 신뢰가 약화된다.
      evidence_refs:
