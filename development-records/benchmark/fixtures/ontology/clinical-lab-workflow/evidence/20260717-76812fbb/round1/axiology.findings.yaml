        - cause_id: axiology-candidate-002.cause-002
          claim: 통보 시각과 수신자를 외부 대장에 두고 CriticalValue를 Result에 연결하지 않은 분산 권위의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
