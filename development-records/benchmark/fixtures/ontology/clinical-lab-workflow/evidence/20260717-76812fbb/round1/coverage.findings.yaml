  - candidate_id: coverage-candidate-004
    target: Result·Report 상태 권위
    evidence_anchor: materialized-input.md:62-84,121-123 — Result.status와
      Report.result_status가 동일 정보를 유지하고, Report 값은 임상의가 신뢰하는 권위 값이지만 corrected
      반영은 야간 배치다.
    claim: 중복 상태의 단일 원본과 동기화 시점별 판정 규칙이 완결되지 않았다.
    what: Result와 Report에 서로 다른 enum으로 상태를 중복 보관하면서 정식 매핑, 충돌 시 우선순위, 배치 전 유효 상태 및
      동기화 실패 상태가 없다.
    why: Result가 corrected된 뒤 Report가 amended되기 전까지 두 권위 후보가 의도적으로 불일치하는데, 소비자가 어느
      값을 언제 신뢰해야 하는지 온톨로지가 결정하지 못한다.
    how_to_fix: 결과 상태의 단일 권위 개념을 지정하고 Report 상태를 파생 투영으로 정의하거나, 두 lifecycle을 분리한 뒤
      명시적 매핑·유효시각·동기화 상태·충돌 처리 규칙을 추가한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS가 결과의 현재 임상 상태를 동일하게 해석하도록 하는 개념 권위 목적
      failure_condition: Result 정정 후 야간 동기화 전 또는 배치 실패 중 EMR이 Report.result_status를 조회할 때
      impact: 임상의에게 이미 정정된 결과가 finalized로 보일 수 있고, 통합 소비자가 어느 상태를 권위로 삼을지 일관되게 결정할 수
        없다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:62-84
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: 하나의 결과 상태 정보를 두 엔티티에 물리적으로 유지하면서 단일 권위와 시간성 있는 투영 계약을 정의하지 않았다.
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: Result.status와 Report.result_status가 같은 정보를 서로 다른 enum으로 보유한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-83
        - cause_id: coverage-candidate-004.cause-002
          claim: 정정 상태는 야간 배치 전까지 Report에 반영되지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:121-123
        - cause_id: coverage-candidate-004.cause-003
          claim: 중복 상태의 단일 원본, 매핑 및 충돌 처리 개념이 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:62-84
            - materialized-input.md:121-123
      unresolved_beyond_evidence: 실제 인터페이스가 배치 전 불일치를 별도 방식으로 차단하는지는 현재 경계에서 확인할 수 없다.
  - candidate_id: coverage-candidate-005
    target: 결과 정정·재발행 lifecycle과 감사 이력
    evidence_anchor: materialized-input.md:62-84,121-123 — corrected/amended 상태는 있으나
      Result에는 verified_by만 있고 Report에는 released_at만 있으며 정정 사건·사유·버전·대체 관계가 없다.
    claim: 종결 결과 이후의 정정·재발행을 재구성할 lifecycle 및 감사 차원이 누락되었다.
    what: 최종 결과의 이전 값, 정정 사유, 정정자·정정시각, 재검증, 보고서 버전, supersedes 관계와 재발행·통지 증거가 표현되지
      않는다.
    why: corrected와 amended는 현재 상태만 나타내므로 어떤 내용이 언제 누구에 의해 변경되어 어느 보고서를 대체했는지 권위
      문서만으로 재구성할 수 없다.
    how_to_fix: ResultRevision/ReportRevision 또는 Amendment 사건을 추가하고 이전 버전 관계, 변경 전후
      값, 사유, 행위자, 발생·검증·재발행 시각 및 수신 통지를 모델링한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 최종·정정 결과와 보고의 lifecycle을 임상적으로 추적 가능한 권위 모델로 제공하는 목적
      failure_condition: 최종 보고 후 결과가 정정되어 과거 보고 내용과 변경 경위를 감사하거나 임상의 통지를 입증해야 할 때
      impact: 현재 상태만 남아 정정 계보와 책임 증거를 복원할 수 없으며, 이전 보고를 현재 결과로 오인할 위험이 있다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:62-84
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: 정정을 버전 있는 사건이 아니라 상태 enum의 최종 값으로만 모델링했다.
      root_cause_step_id: coverage-candidate-005.cause-003
      steps:
        - cause_id: coverage-candidate-005.cause-001
          claim: Result와 Report에는 corrected/amended 상태가 존재하지만 정정 사건이나 버전 관계가 없다.
          relation_to_previous: null
          evidence_refs:
