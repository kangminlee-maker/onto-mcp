          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37-44
        - cause_id: coverage-candidate-006.cause-002
          claim: 채취·인계·품질 판정 및 거부·재채취를 나타내는 엔티티나 relation이 없다.
