      failure_condition: 채취 실패, 운송 문제, 부적합 검체 거부 또는 재채취로 주문 진행이 중단·재개될 때
      impact: 예외 원인과 재채취 계보가 공통 개념으로 전달되지 않아 주문 상태, TAT 및 사용자 안내가 시스템별로 달라질 수 있다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:37-44
        - materialized-input.md:108-119
    causal_path:
      root_cause_candidate: Specimen을 정상 분석 경로 중심의 상태 목록으로만 모델링하고 전처리 사건과 예외 분기를 포함하지 않았다.
