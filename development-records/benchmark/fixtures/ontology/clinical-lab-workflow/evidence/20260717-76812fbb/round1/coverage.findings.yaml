  - candidate_id: coverage-candidate-001
    target: CriticalValue 통보 모델
    evidence_anchor: materialized-input.md:100-106 — CriticalValue는 임계 범위와 notified
      불리언만 가지며 통보 시각·수신자는 외부 전화 기록 대장에 있다고 명시한다.
    claim: 중요값 통보를 재구성할 감사 증거 개념이 온톨로지에 없다.
    what: 통보 행위자, 수신자, 발생·확인 시각, 통보 수단, 근거 및 확인 결과를 나타내는 통보 사건이 없고 완료 여부만 남는다.
    why: 외부 전화 기록 대장에 핵심 증거를 맡기면서 그 기록과 CriticalValue를 연결하는 식별자나 관계도 정의하지 않아 EMR/LIS
      통합 모델만으로 통보 이행을 검증할 수 없다.
    how_to_fix: CriticalValueNotification 같은 사건 엔티티를 추가하고 Result/CriticalValue, 통보자,
      수신자, 통보·확인 시각, 수단, 근거, 결과 및 외부 기록 참조를 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 중요값 통보 통제와 운영 증거를 일관되게 표현하는 목적
      failure_condition: 중요값 발생 후 통보 여부나 지연·실패를 두 시스템 사이에서 감사 또는 재구성해야 할 때
      impact: 불리언만으로는 실제 통보의 주체·시점·수신 확인을 증명할 수 없어 환자안전 통제와 장애 분석의 신뢰가 약화된다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:100-106
    causal_path:
      root_cause_candidate: 통보가 독립된 감사 가능 사건이 아니라 CriticalValue의 불리언 속성과 외부 장부로 분리되어 있다.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: 온톨로지 내부에는 notified 값 외에 통보 증거가 없다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-106
        - cause_id: coverage-candidate-001.cause-002
          claim: 통보 시각과 수신자는 외부 전화 기록 대장에만 존재하며 연결 관계가 정의되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:106
        - cause_id: coverage-candidate-001.cause-003
          claim: 통보 행위를 독립 사건으로 모델링하지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:100-119
      unresolved_beyond_evidence: 외부 전화 기록 대장의 실제 필드와 보존 정책은 현재 경계에서 확인할 수 없다.
  - candidate_id: coverage-candidate-002
    target: Specimen lifecycle
    evidence_anchor: materialized-input.md:37-44,121-124 — Specimen lifecycle은
      analyzed에서 끝나며 이후 보관·폐기는 부서 내규에 위임된다.
    claim: 검체 lifecycle이 분석 이후 보관·폐기까지 닫히지 않는다.
    what: 보관, 반출, 폐기, 보존기간 만료 같은 종결 상태와 전이 증거가 온톨로지에 없다.
    why: 검체가 analyzed 이후 어떤 상태인지 공통 모델로 표현할 수 없으므로 부서별 운영과 LIS 기록을 EMR 통합 관점에서 일관되게
      해석하거나 추적할 수 없다.
    how_to_fix: Specimen lifecycle에 retained/stored/disposed 등 종결 상태를 추가하고 상태 전이
      시각·행위자·근거 및 적용 보존정책 참조를 모델링한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문부터 보고까지의 임상검사 엔티티·관계·상태를 통합 권위 모델로 제공하는 목적
      failure_condition: 분석 완료 검체의 보관 위치, 재검 가능 여부 또는 폐기 이력을 시스템 간 확인해야 할 때
      impact: 공통 lifecycle이 중간 상태에서 끝나 검체 책임과 종결 처리를 권위 문서로 판정할 수 없다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:37-44
        - materialized-input.md:121-124
    causal_path:
      root_cause_candidate: 분석 후 검체 처리를 온톨로지 상태 모델이 아니라 부서별 내규에 위임했다.
      root_cause_step_id: coverage-candidate-002.cause-002
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: Specimen lifecycle의 마지막 상태는 analyzed이다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:37-44
        - cause_id: coverage-candidate-002.cause-002
          claim: 보관·폐기 처리가 lifecycle 밖의 부서 내규로 빠져 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:121-124
      unresolved_beyond_evidence: 부서 내규의 실제 상태와 보존기간은 현재 경계에서 확인할 수 없다.
  - candidate_id: coverage-candidate-003
    target: Test·Assay 카탈로그 권위와 이력
    evidence_anchor: materialized-input.md:46-60,126-127 — Test와 Assay가 별도 카탈로그 단위로
      존재하고 신규 항목을 두 곳 모두 등록하지만 두 엔티티 간 관계와 권위 지정이 없다.
    claim: 병행 카탈로그의 단일 권위, 대응 관계, 유효기간 및 변경 이력이 누락되었다.
    what: 주문 단위 Test와 수행 단위 Assay를 연결하는 매핑, 어느 쪽이 코드·명칭·검체 요구사항의 원본인지, 매핑의 유효기간과 버전이
      정의되지 않았다.
    why: 같은 신규 항목을 두 곳에 중복 등록하도록 하면서 일치 판정과 과거 시점 매핑을 표현할 수 없어 EMR 주문 코드와 LIS 수행 코드가
      어긋날 수 있다.
    how_to_fix: TestAssayMapping 또는 명시적 relation을 추가하고 카디널리티, authoritative_system,
      effective_from/effective_to, version 및 폐기 상태를 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR 주문 카탈로그와 LIS 수행 카탈로그 사이의 개념 권위를 제공하는 목적
      failure_condition: 신규·변경·폐기된 검사 항목을 양 시스템에 배포하거나 과거 주문을 당시 Assay로 재구성할 때
      impact: 중복 등록값의 원본과 시점별 대응을 결정할 수 없어 잘못된 검사 수행 또는 인터페이스 매핑 드리프트가 발생할 수 있다.
      evidence_refs:
        - materialized-input.md:6-8
        - materialized-input.md:46-60
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: Test와 Assay를 병행 관리하면서 이를 하나의 권위 있는 카탈로그 개념 또는 시간 유효 매핑으로 묶지 않았다.
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: Test와 Assay는 별도 엔티티이지만 서로를 연결하는 속성이나 relation이 없다.
