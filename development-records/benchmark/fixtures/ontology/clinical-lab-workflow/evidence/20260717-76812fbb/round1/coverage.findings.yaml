  - candidate_id: coverage-candidate-006
    target: 검체 전처리·예외 lifecycle
    evidence_anchor: materialized-input.md:37-44 — Specimen lifecycle은 collected에서
      시작해 received, in_analysis, analyzed만 포함한다.
    claim: 채취 전후의 검체 인계와 부적합·거부·재채취 예외 영역이 표현되지 않는다.
    what: 채취 요청·시도, 채취자, 라벨링, 운송·인계, 접수시각, 검체 품질 판정, 거부 사유, 재채취 연결을 나타내는 상태나 사건이 없다.
    why: 정상적으로 수집되어 분석된 검체만 표현할 수 있어 주문이 결과로 이어지지 않는 대표적인 검체 예외를 EMR과 LIS가 공통 원인 및
      후속조치로 교환할 수 없다.
    how_to_fix: SpecimenCollection 및 SpecimenHandling 사건이나 lifecycle 상태를 추가하고
      collector, collected/received timestamps, custody transfer, accept/reject
      reason, quality condition 및 replacement_specimen 관계를 정의한다.
