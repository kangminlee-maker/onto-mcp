      - issue-stance-matrix.yaml#stances.issue-008.structure
    conflict_summary: Evolution supports an independent high-severity
      change-coupling issue, axiology treats it as an evolutionary manifestation
      of issue-003, and structure supports only the narrower mapping defect.
    resolution_question: Does issue-008 add a materially independent evolution
      failure, or should its versioning and change-cost consequences be
      incorporated into issue-003?
  - issue_id: issue-010
    priority: 5
    conflict_type: root_hypothesis
    participating_lens_ids:
      - evolution
      - semantics
      - structure
    source_stance_refs:
      - issue-stance-matrix.yaml#stances.issue-010.evolution
      - issue-stance-matrix.yaml#stances.issue-010.semantics
      - issue-stance-matrix.yaml#stances.issue-010.structure
    conflict_summary: Evolution frames the root as separate closed vocabularies
      lacking a versioned complete projection, while semantics rejects treating
      the vocabularies as copies and requires transitions between distinct
      lifecycles; structure supports only mapping completeness.
    resolution_question: Must the repair define a projection between equivalent
      status vocabularies or a transition contract between distinct Result and
      Report lifecycle concepts?
  - issue_id: issue-013
