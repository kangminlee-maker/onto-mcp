    conflict_summary: Semantics supports issue-013 as the conceptual root, axiology
      considers its value impact subsumed by issue-001, and evolution narrows
      its support to change coupling rather than the precise
      corrected-versus-amended distinction.
    resolution_question: Should issue-013 remain the canonical semantic issue, be
      merged into issue-001, or retain only a distinct lifecycle-evolution
