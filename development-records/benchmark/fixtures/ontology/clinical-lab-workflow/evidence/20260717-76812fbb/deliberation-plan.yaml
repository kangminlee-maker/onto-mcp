planned_issues:
  - issue_id: issue-001
    priority: 10
    conflict_type: root_hypothesis
    participating_lens_ids:
      - axiology
      - semantics
    source_stance_refs:
      - issue-stance-matrix.yaml#stances.issue-001.axiology
      - issue-stance-matrix.yaml#stances.issue-001.semantics
    conflict_summary: Axiology attributes the stale clinician-facing status to
      duplicated authority and delayed synchronization, while semantics argues
      that Result and Report represent distinct lifecycles whose concepts were
      incorrectly declared equivalent and independently authoritative.
    resolution_question: Is the primary defect duplicated storage of one
      authoritative status, or conflation of distinct Result and Report
      lifecycle concepts, and what authority and transition contract follows
      from that choice?
  - issue_id: issue-003
    priority: 9
    conflict_type: partial_overlap_or_cluster_scope
    participating_lens_ids:
      - axiology
      - coverage
      - semantics
      - structure
    source_stance_refs:
      - issue-stance-matrix.yaml#stances.issue-003.axiology
      - issue-stance-matrix.yaml#stances.issue-003.coverage
      - issue-stance-matrix.yaml#stances.issue-003.semantics
      - issue-stance-matrix.yaml#stances.issue-003.structure
    conflict_summary: The lenses agree that the composite issue is too broad but
      differ on whether catalog authority, temporal Test–Assay mapping,
      performed-execution structure, and Result provenance belong to one causal
      issue or require separate issues.
    resolution_question: Which findings share one root cause, and which must be
      split into distinct catalog-mapping, execution, and provenance issues?
  - issue_id: issue-006
    priority: 8
    conflict_type: root_hypothesis
    participating_lens_ids:
      - coverage
      - axiology
      - semantics
    source_stance_refs:
      - issue-stance-matrix.yaml#stances.issue-006.coverage
      - issue-stance-matrix.yaml#stances.issue-006.axiology
      - issue-stance-matrix.yaml#stances.issue-006.semantics
    conflict_summary: Coverage treats the defect as duplicate status storage without
      a temporal projection contract; semantics treats the fields as distinct
      lifecycle concepts incorrectly equated, while axiology argues the issue
      may be only a narrower expression of issue-001.
    resolution_question: Should issue-006 remain an independent duplicate-authority
      issue, be reframed around distinct lifecycle concepts, or be absorbed into
      issue-001?
  - issue_id: issue-007
    priority: 7
    conflict_type: action_or_severity
    participating_lens_ids:
      - coverage
      - logic
      - axiology
    source_stance_refs:
      - issue-stance-matrix.yaml#stances.issue-007.coverage
      - issue-stance-matrix.yaml#stances.issue-007.logic
      - issue-stance-matrix.yaml#stances.issue-007.axiology
    conflict_summary: Coverage limits its support to auditable correction lineage,
      logic limits the root to missing downstream Order reevaluation and lowers
      its directly supported severity to medium, while axiology supports the
      combined high-severity issue.
    resolution_question: Should correction lineage and downstream Order reevaluation
      remain one high-severity issue, or be split with separate scopes and
      severity judgments?
  - issue_id: issue-008
    priority: 6
    conflict_type: partial_overlap_or_cluster_scope
    participating_lens_ids:
      - evolution
