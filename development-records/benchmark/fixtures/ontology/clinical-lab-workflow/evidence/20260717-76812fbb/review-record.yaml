per_lens_provenance:
  axiology:
    domain_constraints_used: []
    domain_context_assumptions:
      - 대상 문서가 직접 선언한 '임상의는 Report.result_status를 신뢰한다'는 문장을 임상의 이해관계자에 대한 가치
        약속으로 해석했다.
      - 대상 문서가 직접 선언한 CriticalValue의 '즉시 통보'를 외부 임상 규정이 아닌 이 문서 자체의 운영 약속으로 사용했다.
      - session_domain이 none이므로 외부 임상 표준이나 법규는 적용하지 않았다.
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - 임상검사 통합 권위 모델은 정상 주문-분석-보고 경로뿐 아니라 검체 부적합·재채취, 분석 후 검체 처분, 최종 결과 정정 및
        중요값 통보의 운영 증거를 표현해야 한다.
      - EMR의 주문 가능한 Test와 LIS의 수행 가능한 Assay가 병행 관리될 경우 두 카탈로그 사이의 권위와 시점별 대응을 공통
        모델이 명시해야 한다.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - 검사 카탈로그, 검체 분류, 결과 상태와 주문 우선순위는 EMR/LIS 운영 중 신규 항목·코드·상태가 추가되거나 개정될 수 있다.
      - 개념 권위 문서는 중복 저장된 표현 사이의 권위, 매핑, 버전 연속성을 문서 자체에서 정의해야 한다.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - "`모든 Result`는 형식화 시 표준적인 보편양화로 해석하며, 별도의 존재 전제가 없으면 빈 집합에서도 참이다."
      - enum 상태 속성은 한 시점에 하나의 값만 갖는 단일값 속성으로 해석한다.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - Individual laboratory-result status and report lifecycle/amendment
        status are distinct concepts even when one triggers the other.
      - Notification completion belongs to a particular critical-result
        communication occurrence, not to a reusable threshold definition.
      - An orderable test and an executable assay may have non-identity and
        non-1:1 mappings unless the catalog explicitly establishes equivalence.
      - STAT ordinarily denotes an order-priority classification unless the
        system defines a subtype with distinct identity or lifecycle semantics.
      - A recorded result is produced by performed examination work using a
        specimen; the specimen is the material source rather than the performing
        agent.
      - Whole blood, serum, and collection-qualified urine are more specific
        material concepts than the broad categories blood and urine.
  structure:
    domain_constraints_used: []
    domain_context_assumptions:
      - 속성의 ref도 엔티티 간 구조적 연결로 간주했다.
      - 문서 자체의 Test와 Assay 정의에 따라 주문 단위에서 수행 단위로 추적 가능한 연결이 필요하다고 보았다.
      - CriticalValue의 임계 범위는 반복 사용되는 정의이고 `notified`는 개별 결과 발생에 대한 상태라고 해석했다.
