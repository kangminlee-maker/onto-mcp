    - issue_id: issue-013
      severity: high
      material: true
      affected_purpose: Use of the ontology as the conceptual authority for EMR/LIS
        status integration.
      failure_condition: An LIS result is corrected while the report still exposes
        finalized until the nightly synchronization runs, or an integrator
        assumes the two enum sets are synonymous.
      impact: Consumers can display a stale or semantically incorrect clinician-facing
        status despite following the declared authority document.
      evidence_refs:
        - .onto/review/20260717-76812fbb/round1/semantics.findings.yaml#semantics-candidate-001
        - materialized-input.md:69-83
        - materialized-input.md:121-123
        - materialized-input.md:69-83,121-123
      source_lens_ids:
        - semantics
      action_candidates: &a8
        - fix_now
      rationale: "심의에서 lifecycle 의미 혼동의 canonical semantic issue로 유지하기로 합의했다.
        Issue-001은 이 원인이 임상 신뢰성에 미치는 영향을 다루므로 양쪽의 역할은 구별된다. Source finding
        context: Result.status, Report.result_status, and their synchronization
        rule Source finding context: materialized-input.md:69-83,121-123 Source
        finding context: Individual-result status and report status are declared
        to be the same information but modeled as separate authorities with
        non-equivalent vocabularies. Source finding context: Corrected is a
        status of an individual result, whereas amended describes a report-level
        consequence. Treating them as the same value obscures their meanings and
        permits the clinician-facing authority to disagree with its alleged
        source for up to one synchronization cycle. Source finding context:
        Define ResultStatus and ReportStatus as distinct concepts, document an
        explicit transition/mapping such as corrected result causing an amended
        report, and identify one authoritative field for each concept. Propagate
        the report transition as part of correction handling rather than
        describing both fields as the same information. Source finding context:
        .onto/review/20260717-76812fbb/round1/semantics.findings.yaml#semantics\
        -candidate-001 Source finding context: Use of the ontology as the
        conceptual authority for EMR/LIS status integration. Source finding
        context: An LIS result is corrected while the report still exposes
        finalized until the nightly synchronization runs, or an integrator
        assumes the two enum sets are synonymous. Source finding context:
        Consumers can display a stale or semantically incorrect clinician-facing
        status despite following the declared authority document. Source finding
        context: The model conflates result-instance status with report
        lifecycle/amendment status while assigning both independent authority.
        Source finding context: The two fields use different status vocabularies
        and are synchronized only by a stated mapping from corrected to amended.
        Source finding context: This is a symptom of treating distinct
        result-level and report-level concepts as duplicated representations of
        one fact."
