findings:
  - candidate_id: logic-candidate-001
    target: clinical-lab-ontology.yaml — Result.status와 Report.result_status 계약
    evidence_anchor: .onto/review/20260718-958e001f/execution-preparation/materialized-input.md:69-83
    claim: 동일 정보를 유지해야 하는 두 상태 속성의 허용값 집합이 서로소라서 값 동일성 계약을 만족할 수 없다.
    what: Result.status는 [preliminary, final, corrected], Report.result_status는
      [prelim, finalized, amended]만 허용하면서 전자의 정보가 후자에도 동일하게 유지된다고 선언한다.
    why: 두 enum의 공통 리터럴이 없으므로 '동일 정보 유지'를 값 동일성으로 구현하면 어떤 상태도 양쪽 타입을 동시에 만족하지 못한다.
      이는 materialized-input.md:72와 :81-83 사이의 inter-claim 충돌이며 modality는
      necessary이다. 다만 '동일'이 의미적 대응을 뜻했다면 모순은 사라지므로 그 해석 문제는 semantics lens로 넘겨야
      한다.
    how_to_fix: 하나의 정규 상태 enum을 양쪽에서 재사용하거나, 두 enum을 유지해야 한다면 preliminary↔prelim,
      final↔finalized, corrected↔amended의 전단사 매핑과 권위·동기화 규칙을 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 결과 상태의 개념 권위와 교환 계약을 제공하는 목적
      failure_condition: 통합 구현이 '동일 정보 유지'를 값 복제 또는 동일 enum 계약으로 해석하는 경우
      impact: 유효한 Result 상태를 Report 상태에 그대로 기록할 수 없어 시스템별 변환이 임의로 달라지고 권위 상태 판정이 불일치한다.
      evidence_refs:
        - materialized-input.md:69-72
        - materialized-input.md:80-83
    causal_path:
      root_cause_candidate: 하나의 상태 개념을 서로 다른 enum으로 선언하면서 정규 매핑 또는 동일성의 의미를 정의하지 않았다.
      root_cause_step_id: logic-candidate-001.cause-003
      steps:
        - cause_id: logic-candidate-001.cause-001
          claim: Result와 Report가 동일 상태 정보를 유지한다고 선언되어 있다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:72
        - cause_id: logic-candidate-001.cause-002
          claim: 두 속성의 허용 enum 값 집합에는 공통 원소가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-72
            - materialized-input.md:80-82
        - cause_id: logic-candidate-001.cause-003
          claim: 상이한 상태 어휘 사이의 정규 매핑이 선언되어 있지 않다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-83
            - materialized-input.md:121-124
      unresolved_beyond_evidence: "'동일 정보'가 리터럴 동일성인지 의미적 동등성인지 명시되지 않았다."
  - candidate_id: logic-candidate-002
    target: clinical-lab-ontology.yaml — Report 상태 전이 규칙
    evidence_anchor: .onto/review/20260718-958e001f/execution-preparation/materialized-input.md:80-84,121-123
    claim: corrected가 release보다 먼저 발생할 수 있는 허용 경로에서 단일 Report.result_status에
      amended와 finalized 의무가 충돌한다.
    what: released_at 기록은 Report를 finalized로 만들고, Result.status가 corrected이면 같은
      Report.result_status를 amended로 만들도록 요구하지만 두 사건의 순서나 우선순위를 제한하지 않는다.
    why: corrected 후 야간 동기화로 amended가 된 Report에 released_at이 나중에 기록되면 release 규칙은
      finalized를 요구하는 반면 corrected 조건은 계속 amended를 요구한다. result_status는 단일 enum
      속성이므로 두 값을 동시에 가질 수 없다. 이는 materialized-input.md:123 내부의 temporal
      inter-claim 충돌이고 modality는 mixed(조건부 necessary와 obligatory)이다. '단'을 명시적
      override로 의도했다면 우선순위를 구조화해야 한다.
    how_to_fix: 허용 전이 순서와 우선순위를 명시한다. 예를 들어 corrected는 released/finalized 이후에만 허용하고
      amended를 종결 우선 상태로 두거나, corrected가 release 전에 발생하면 release 후에도 amended를
      유지하도록 결정표와 불변식을 정의한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS가 동일한 보고서 상태 전이와 최종 임상 표시 상태를 결정하게 하는 개념 권위
      failure_condition: Result가 corrected로 전이하고 amended 동기화가 수행된 뒤 해당 Report에
        released_at이 기록되는 경우
      impact: 동일 사건 이력에서 finalized와 amended가 모두 요구되어 구현마다 다른 우선순위를 택할 수 있고 임상의가 신뢰하는
        권위 상태가 불안정해진다.
      evidence_refs:
        - materialized-input.md:80-84
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: 서로 독립적으로 상태를 강제하는 두 전이 규칙에 사건 순서, 우선순위, 또는 종결 불변식이 없다.
      root_cause_step_id: logic-candidate-002.cause-003
      steps:
        - cause_id: logic-candidate-002.cause-001
          claim: released_at과 corrected 조건이 각각 단일 result_status에 서로 다른 값을 요구한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:123
        - cause_id: logic-candidate-002.cause-002
          claim: result_status는 finalized와 amended 중 하나만 담는 단일 enum 속성이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:80-83
        - cause_id: logic-candidate-002.cause-003
          claim: corrected와 release의 허용 순서 및 충돌 시 우선순위가 정의되지 않았다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:121-124
      unresolved_beyond_evidence: 실제 업무 규칙이 corrected-before-release를 금지하는지는 domain
        문서가 없어 확인할 수 없지만, 현재 모델 자체는 그 경로를 금지하지 않는다.
domain_constraints_used: []
domain_context_assumptions:
  - enum 속성은 한 시점에 선언된 값 중 하나만 갖는 단일값 속성으로 해석했다.
  - 명시적으로 금지되지 않은 corrected와 released_at의 사건 순서는 모델이 허용하는 것으로 해석했다.
