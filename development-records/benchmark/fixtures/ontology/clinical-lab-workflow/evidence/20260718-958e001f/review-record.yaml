per_lens_provenance:
  axiology:
    domain_constraints_used: []
    domain_context_assumptions: []
  coverage:
    domain_constraints_used: []
    domain_context_assumptions:
      - EMR/LIS 통합의 개념 권위 문서는 정상 경로뿐 아니라 검체 예외·종결 경로와 통제 행위의 추적성을 표현해야 한다.
      - 검사 카탈로그, 분석법, 참고·중대 임계값은 운영 중 변경될 수 있으므로 과거 시점 재구성이 필요하다.
      - 한 주문 검사 항목은 실제 운영에서 복수 검체, 반복 수행 또는 재검과 연결될 수 있다.
      - 임상검사 결과에는 수치 외 정성·패널 결과와 판정 맥락이 존재할 수 있다.
  evolution:
    domain_constraints_used: []
    domain_context_assumptions:
      - 검사 카탈로그, 검체 분류 및 결과 상태 어휘는 장비·기관·외부 표준 변화에 따라 추가되거나 개정될 수 있다.
      - EMR/LIS 통합 범위가 확장되면 서로 독립적으로 관리되는 식별자 또는 코드 namespace를 구분해야 할 수 있다.
  logic:
    domain_constraints_used: []
    domain_context_assumptions:
      - enum 속성은 한 시점에 선언된 값 중 하나만 갖는 단일값 속성으로 해석했다.
      - 명시적으로 금지되지 않은 corrected와 released_at의 사건 순서는 모델이 허용하는 것으로 해석했다.
  semantics:
    domain_constraints_used: []
    domain_context_assumptions:
      - STAT denotes a mutable operational priority of an order rather than an
        identity-essential entity type.
      - A corrected laboratory result is a revision of a previously final result
        and remains clinically reportable as a final-version result.
      - Critical-value bounds define reusable criteria, while notification
        completion applies to a particular result occurrence.
      - An orderable catalog item, an analytical procedure, the specimen it
        consumes, and the observation it produces are semantically distinct
        roles unless an explicit identity mapping states otherwise.
  structure:
    domain_constraints_used: []
    domain_context_assumptions:
      - "Fields declared as type: ref and is_a declarations are treated as
        structural links in addition to entries under relations."
      - CriticalValue.notified is interpreted as occurrence-specific because it
        denotes completion of a notification, while test_ref identifies only a
        reusable catalog item.
