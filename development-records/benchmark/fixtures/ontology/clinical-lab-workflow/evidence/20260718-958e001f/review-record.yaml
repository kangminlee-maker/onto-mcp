        - problem-framing.yaml
      rationale: "주문 가능 개념과 실행 절차의 의미 경계를 먼저 결정해야 일대다 매핑과 실제 수행 provenance를 완전하게 표현할 수
        있다. Source finding context: Test, Assay, Result, and specimen-to-result
        production semantics Source finding context:
        .onto/review/20260718-958e001f/execution-preparation/materialized-input\
        .md:46-66,108-119,126-127 Source finding context: The ontology does not
        resolve the semantic boundary between an orderable Test and an
        executable Assay, yet attributes results directly to Test and says a
        Specimen produces them. Source finding context: Ordering, analytical
        execution, source material, and resulting observation are different
        roles. Without an explicit Test-to-Assay realization and execution
        provenance, identical dual registration cannot state whether the
        concepts are synonymous, one-to-many mappings, or different abstraction
        levels. A specimen is input material rather than the performing process.
        Source finding context: Define the concepts explicitly, such as
        OrderableTest realized_by one or more Assays, and introduce an
        AssayExecution or equivalent event that uses Specimen and produces
        Result. Link Result to that execution and retain specimen provenance as
        derived_from; replace dual registration with an explicit mapping or
        declared synonym policy. Source finding context:
        .onto/review/20260718-958e001f/round1/semantics.findings.yaml#semantics\
        -candidate-004 Source finding context: Serve as the concept authority
        for translating EMR orders into LIS execution and results. Source
        finding context: An orderable catalog item maps to multiple analyzer
        procedures, an assay changes independently, or consumers need to
        identify which procedure produced a result. Source finding context:
        EMR/LIS mappings can incorrectly equate catalog items, procedures,
        specimens, and observations, losing execution provenance and making
        result interpretation ambiguous. Source finding context: The ontology
        has not chosen whether Test and Assay are synonyms or distinct
        abstraction levels and therefore lacks a canonical realization relation.
        Source finding context: Result references Test, Assay has no workflow
        relation, and Specimen is declared to produce Result. Source finding
        context: New catalog items are duplicated in Test and Assay despite
        their different definitions. Source finding context: The semantic
        distinction and mapping between orderable service and executable
        analytical procedure remain unresolved."
    - issue_id: issue-019
      candidates: *a21
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "상태 전이와 종결 의미 부재가 완료 규칙에서 드러난 구체적 lifecycle 증상으로, 소비자별 상반된 주문 상태를
        허용한다. Source finding context: Order completion rule and Result status
        semantics Source finding context:
        .onto/review/20260718-958e001f/execution-preparation/materialized-input\
        .md:69-72,121-123 Source finding context: The completion rule treats
        final as the only qualifying result state even though corrected is
        modeled as a later reportable state. Source finding context: The labels
        imply corrected is a revision of a previously final result, not a return
        to a non-final state. Literal equality to final therefore makes
        completion semantics unstable or prevents corrected results from
        satisfying completion. Source finding context: Define an explicit
        result-state transition model and a finality predicate, for example
        is_reportable_final for final and corrected. Base Order completion on
        that semantic predicate or on completion of all required result
        versions, rather than equality to one enum label. Source finding
        context:
        .onto/review/20260718-958e001f/round1/semantics.findings.yaml#semantics\
        -candidate-005 Source finding context: Provide coherent lifecycle
        semantics for orders, results, and reports across integrated systems.
        Source finding context: A final Result is corrected before or after
        Order completion and the completion rule is evaluated literally. Source
        finding context: Different consumers may reopen, block, or retain
        completion for the same corrected result, so lifecycle behavior is not
        determined by the authority document. Source finding context:
        Result.status is modeled as a flat enum without defining transition
        order or the semantic property of finality. Source finding context:
        Order completion requires every Result to equal final, while corrected
        is a separate Result status that triggers report amendment. Source
        finding context: The model provides no rule stating whether corrected is
        final for completion purposes. Source finding context: A flat status
        vocabulary is being used where lifecycle transition and finality
        semantics are required."
    - issue_id: issue-021
      candidates: *a22
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "규칙과 통보 사건 혼합이 드러난 구체적 표면으로, 다수 결과 환경에서 다른 결과의 통보 완료로 잘못 재사용될 수 있다.
        Source finding context: clinical-lab-ontology.yaml — CriticalValue
        occurrence linkage Source finding context: materialized-input.md:100-119
        — CriticalValue has test_ref and a notified flag, but no relation to
        Result, Report, Order, Patient, or a notification record. Source finding
        context: CriticalValue notification state is not connected to the result
        occurrence that triggered it. Source finding context: A test can produce
        many results across patients and orders. A Test-level path cannot
        distinguish the specific result whose notification was completed, so the
        notification state can become detached from the operational event it
        purports to describe. Source finding context: Separate the threshold
        definition from a critical-result occurrence, then link the occurrence
        to Result and to a notification record or bounded external-record
        reference carrying completion, time, and recipient. Source finding
        context:
        .onto/review/20260718-958e001f/round1/structure.findings.yaml#structure\
        -candidate-002 Source finding context: Providing an operationally usable
        Order-to-Report concept model for EMR/LIS integration. Source finding
        context: The same Test produces more than one Result and one or more
        results cross the critical threshold. Source finding context: Consumers
        cannot associate notified status with a unique result, weakening
        auditability and allowing notification state to be incorrectly reused
        across result occurrences. Source finding context: A reusable
        critical-value threshold and an occurrence-specific notification state
        are placed on one entity without an occurrence relationship. Source
        finding context: CriticalValue contains notified but has no structural
        link to a concrete Result. Source finding context: Result is the modeled
        entity representing an individual Test result, whereas CriticalValue
        points only to the reusable Test."
    - issue_id: issue-022
      candidates: *a23
      derivation_refs:
        - issue-ledger.yaml
        - problem-framing.yaml
      rationale: "구조 차이는 관찰됐으나 relations가 완전한 권위인지 제한된 projection인지와 실제 실패 경로가 경계 내
        증거로 입증되지 않았다. Source finding context: clinical-lab-ontology.yaml —
        relation inventory completeness Source finding context:
        materialized-input.md:15-20,46-103,108-119 — several ref attributes are
        absent from relations, while other ref attributes are duplicated there.
        Source finding context: The explicit relations inventory is not closed
        over the ontology's declared reference links. Source finding context:
        The artifact exposes two inconsistent structural representations. A
        consumer traversing ref attributes sees a different graph from one
        traversing the relations list, causing some entities or paths to appear
        disconnected depending on the ingestion route. Source finding context:
        Declare one canonical relationship authority and deterministically
        derive the other representation, or add all missing reference edges to
        relations and validate that every ref/is_a link is represented
        consistently. Source finding context:
        .onto/review/20260718-958e001f/round1/structure.findings.yaml#structure\
        -candidate-003"
