        - problem-framing.yaml
      rationale: "세 표현 사이에 단일 권위나 동치 제약이 없어 시스템별 라우팅과 처리 우선순위가 달라질 수 있다. Source
        finding context: StatOrder subtype and Order priority attributes Source
        finding context:
        .onto/review/20260718-958e001f/execution-preparation/materialized-input\
        .md:15-29 Source finding context: STAT is modeled simultaneously as a
        subtype, an enum value, and a boolean, although it denotes a contingent
        order priority. Source finding context: An order can acquire or lose
        urgency without changing what kind of entity it is. Treating that
        contingent classification as a subtype creates ambiguous identity and
        permits StatOrder, priority, and is_stat to disagree. Source finding
        context: Use Order.priority as the canonical classification and make
        stat_reason conditionally required when priority=stat. If StatOrder must
        remain as a projection, declare exact equivalence and consistency
        constraints rather than treating it as an independent subtype identity.
        Source finding context:
        .onto/review/20260718-958e001f/round1/semantics.findings.yaml#semantics\
        -candidate-003 Source finding context: Provide unambiguous order
        semantics for EMR/LIS integration. Source finding context: An integrated
        record sets only one or two of StatOrder membership, priority=stat, and
        is_stat=true, or priority changes after placement. Source finding
        context: Systems can route or prioritize the same order differently
        because the conceptual authority permits contradictory STAT
        classifications. Source finding context: A mutable priority role has
        been promoted to an ontological subtype while duplicate projections
        remain independently writable. Source finding context: STAT
        classification appears as subtype membership, an enum value, and a
        boolean without declared equivalence. Source finding context: These
        independent representations allow contradictory classifications of one
        Order. Source finding context: The model does not distinguish an
        identity-essential subtype from a contingent operational priority."
    - issue_id: issue-018
      candidates: *a20
      derivation_refs:
