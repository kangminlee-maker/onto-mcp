        - cause_id: finding-019.cause-002
          claim: These independent representations allow contradictory classifications of
            one Order.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:21-29
        - cause_id: finding-019.cause-003
          claim: The model does not distinguish an identity-essential subtype from a
            contingent operational priority.
          relation_to_previous: symptom_of
          evidence_refs:
