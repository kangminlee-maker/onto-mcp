  - finding_id: finding-021
    lens_id: semantics
    source_ref: .onto/review/20260718-958e001f/round1/semantics.findings.yaml#semantics-candidate-005
    target: Order completion rule and Result status semantics
    evidence_anchor: .onto/review/20260718-958e001f/execution-preparation/materialized-input.md:69-72,121-123
    claim: The completion rule treats final as the only qualifying result state even
      though corrected is modeled as a later reportable state.
    lens_rationale_summary: The labels imply corrected is a revision of a previously
      final result, not a return to a non-final state. Literal equality to final
      therefore makes completion semantics unstable or prevents corrected
      results from satisfying completion.
    proposed_action: Define an explicit result-state transition model and a finality
      predicate, for example is_reportable_final for final and corrected. Base
      Order completion on that semantic predicate or on completion of all
      required result versions, rather than equality to one enum label.
    affected_purpose: Provide coherent lifecycle semantics for orders, results, and
      reports across integrated systems.
    failure_condition: A final Result is corrected before or after Order completion
      and the completion rule is evaluated literally.
    impact: Different consumers may reopen, block, or retain completion for the same
      corrected result, so lifecycle behavior is not determined by the authority
      document.
    evidence_refs:
