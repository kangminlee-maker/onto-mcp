  - finding_id: finding-022
    lens_id: structure
    source_ref: .onto/review/20260718-958e001f/round1/structure.findings.yaml#structure-candidate-001
    target: clinical-lab-ontology.yaml — Assay workflow integration
    evidence_anchor: materialized-input.md:46-60,108-119,126-127 — Test is the
      orderable unit, Assay is the execution unit, but Assay appears in no
      workflow relation; the note requires dual catalog registration.
    claim: The ontology lacks a relationship connecting an ordered Test to the Assay
      that performs it.
    lens_rationale_summary: The document distinguishes the EMR-facing orderable Test
      from the LIS/analyzer-facing Assay and says new items are registered in
      both catalogs. Without a mapping relationship, an integration consumer
      cannot determine which assay realizes an ordered test, including cases
      where codes or cardinalities differ.
    proposed_action: Add an explicit Test-to-Assay realization/mapping relationship
      with defined cardinality and identifiers, or merge the concepts and make
      Test the single catalog authority. Connect Result to the chosen execution
      unit if assay-level traceability is required.
    affected_purpose: Serving as the conceptual authority for EMR/LIS integration
      from Order through Report.
    failure_condition: An ordered Test and its executable Assay are distinct records
      or have non-identical codes, especially for one-to-many or many-to-one
      catalog mappings.
    impact: The core handoff from EMR ordering semantics to LIS execution semantics
      is undefined, so implementations must invent mappings outside the
      authority document and may execute or report the wrong item.
    evidence_refs:
