      unresolved_beyond_evidence: null
  - finding_id: finding-020
    lens_id: semantics
    source_ref: .onto/review/20260718-958e001f/round1/semantics.findings.yaml#semantics-candidate-004
    target: Test, Assay, Result, and specimen-to-result production semantics
    evidence_anchor: .onto/review/20260718-958e001f/execution-preparation/materialized-input.md:46-66,108-119,126-127
    claim: The ontology does not resolve the semantic boundary between an orderable
      Test and an executable Assay, yet attributes results directly to Test and
      says a Specimen produces them.
    lens_rationale_summary: Ordering, analytical execution, source material, and
      resulting observation are different roles. Without an explicit
      Test-to-Assay realization and execution provenance, identical dual
      registration cannot state whether the concepts are synonymous, one-to-many
      mappings, or different abstraction levels. A specimen is input material
      rather than the performing process.
    proposed_action: Define the concepts explicitly, such as OrderableTest
      realized_by one or more Assays, and introduce an AssayExecution or
      equivalent event that uses Specimen and produces Result. Link Result to
      that execution and retain specimen provenance as derived_from; replace
      dual registration with an explicit mapping or declared synonym policy.
    affected_purpose: Serve as the concept authority for translating EMR orders into
      LIS execution and results.
    failure_condition: An orderable catalog item maps to multiple analyzer
      procedures, an assay changes independently, or consumers need to identify
      which procedure produced a result.
    impact: EMR/LIS mappings can incorrectly equate catalog items, procedures,
      specimens, and observations, losing execution provenance and making result
      interpretation ambiguous.
    evidence_refs:
      - .onto/review/20260718-958e001f/round1/semantics.findings.yaml#semantics-candidate-004
      - materialized-input.md:46-66
      - materialized-input.md:108-119
      - materialized-input.md:126-127
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Serve as the concept authority for translating EMR orders into
        LIS execution and results.
      failure_condition: An orderable catalog item maps to multiple analyzer
        procedures, an assay changes independently, or consumers need to
        identify which procedure produced a result.
      impact: EMR/LIS mappings can incorrectly equate catalog items, procedures,
        specimens, and observations, losing execution provenance and making
        result interpretation ambiguous.
      evidence_refs:
        - materialized-input.md:46-66
        - materialized-input.md:108-119
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: The ontology has not chosen whether Test and Assay are
