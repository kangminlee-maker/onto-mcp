      impact: Systems can route or prioritize the same order differently because the
        conceptual authority permits contradictory STAT classifications.
      evidence_refs:
        - materialized-input.md:15-29
    causal_path:
      root_cause_candidate: A mutable priority role has been promoted to an
        ontological subtype while duplicate projections remain independently
        writable.
      root_cause_step_id: finding-019.cause-003
      steps:
        - cause_id: finding-019.cause-001
          claim: STAT classification appears as subtype membership, an enum value, and a
            boolean without declared equivalence.
          relation_to_previous: null
          evidence_refs:
