    target: clinical-lab-ontology.yaml — CriticalValue occurrence linkage
    evidence_anchor: materialized-input.md:100-119 — CriticalValue has test_ref and
      a notified flag, but no relation to Result, Report, Order, Patient, or a
      notification record.
    claim: CriticalValue notification state is not connected to the result
      occurrence that triggered it.
    lens_rationale_summary: A test can produce many results across patients and
      orders. A Test-level path cannot distinguish the specific result whose
      notification was completed, so the notification state can become detached
      from the operational event it purports to describe.
    proposed_action: Separate the threshold definition from a critical-result
      occurrence, then link the occurrence to Result and to a notification
      record or bounded external-record reference carrying completion, time, and
      recipient.
    affected_purpose: Providing an operationally usable Order-to-Report concept
      model for EMR/LIS integration.
    failure_condition: The same Test produces more than one Result and one or more
      results cross the critical threshold.
    impact: Consumers cannot associate notified status with a unique result,
      weakening auditability and allowing notification state to be incorrectly
      reused across result occurrences.
