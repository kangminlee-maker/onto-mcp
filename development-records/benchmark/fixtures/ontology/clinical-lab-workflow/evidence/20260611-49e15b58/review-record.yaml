        Order.is_stat note(\"priority와 함께 기록\"), StatOrder(is_a: Order,
        stat_reason) Source finding context: 응급(STAT)이라는 단일 개념이 enum 값·boolean
        속성·하위 타입의 세 가지 독립 표현으로 존재하며 우선순위 규칙이 없어, 권위 문서가 가장 시간 민감한 워크플로에서 단일 진실을
        제공하지 못한다. Source finding context: STAT 주문은 임상검사 워크플로에서 환자 안전상 가장 시간 민감한
        경로이며, EMR/LIS 통합 설계자가 이 문서를 권위로 삼을 때 STAT 판정 로직이 시스템마다 다른 필드를 참조하게 될 위험을
        문서 자체가 만들어낸다(예: priority=stat이지만 is_stat=false인 인스턴스의 의미가 미정의). 이는 표현
        편의(기존 필드 유지 + 하위 타입 추가)라는 국소 선택이 '개념 권위'라는 전체 목적을 훼손하는 사례다. 가치 유형:
