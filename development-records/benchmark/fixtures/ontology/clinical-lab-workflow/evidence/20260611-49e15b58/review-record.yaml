        타입은 stat_reason이 별도 lifecycle·검증·권한을 요구할 때만 유지하고 그렇지 않으면 stat_reason을
        Order의 조건부 속성으로 흡수한다. 유지하는 경우 세 표현 간 일관성 제약을 명문화한다. Source finding
