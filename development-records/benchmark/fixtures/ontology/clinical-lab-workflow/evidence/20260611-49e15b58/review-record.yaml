issue_resolution_summary:
  - issue_id: issue-001
    problem_definition: 결과 상태의 권위 좌석이 Result.status와 Report.result_status 두 곳에 선언되고
      야간 배치 동기화 지연이 정상 동작으로 명문화되어, 정정된 결과가 최대 24시간 권위 값으로 미반영되는 동작을 권위 문서가
      제도화한다.
    issue_role: symptom
    judgment_state: observed
    impact_kind: safety_risk
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 여섯 렌즈 만장일치로 high가 확정된 결과 상태 이중 권위 계열의 axiology 표면이다. 공유 설계 결정(권위 좌석
      미단일화 + 동기화의 운영 절차 위임)은 issue-025가 정본 뿌리로 다루므로 본 이슈는 그 증상으로 분류한다. 정정 결과 미표시
      구간이 임상 신뢰·환자 안전에 직결되므로 safety_risk이고, 개념 권위 문서라는 선언된 용도 자체를 막는 결함이므로 대상 문서
      내에서 즉시 시정되어야 한다.
    related_surface_finding_ids:
      - finding-001
  - issue_id: issue-002
    problem_definition: STAT 응급 여부가 priority enum, is_stat boolean, StatOrder 하위 타입
      세 표현으로 canonical 지정 없이 중복 인코딩되어 모순 인스턴스(priority=stat ∧ is_stat=false ∧
      ¬StatOrder)가 스키마상 유효하다.
    issue_role: root_cause
    judgment_state: contested
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: STAT 삼중 표현 클러스터(issue-008/014/022/026/032)의 정본 심의가 이루어진 canonical 이슈로
      root_cause로 분류한다. 결함 실재와 근본 원인은 전원 합의이나 심의 후에도 axiology·evolution이 high
      입장을 유지해 disagreement가 명시 보존되었으므로 judgment_state는 contested로 기록한다. 정본
      medium(조건부 발현 모순)이되 클러스터 내 최상위 수정 우선순위가 부여되었으므로, 문서가 통합 단계로 넘어가기 전 동치
      제약·단일 권위 선언으로 닫혀야 한다.
    related_surface_finding_ids:
      - finding-002
  - issue_id: issue-003
    problem_definition: CriticalValue가 카탈로그 수준 임계 규칙과 결과 수준 통보 사건이라는 서로 다른 존재론적 유형을
      한 엔티티에 혼합해 결과별 통보 상태를 표현할 자리가 구조적으로 없고, 안전-critical 통보 증적(시각·수신자)이 모델 밖 종이
      대장에 위임되어 있다.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: completeness
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 네 렌즈가 공동 제기하고 여섯 렌즈 전원이 high와 근본 원인(규칙/사건 분리, root_confidence high)에
      합의한 공유 뿌리 이슈다. notified boolean의 referent 결정 불가능성과 CriticalValue의 관계 그래프
      미등장이 문서 자체에서 직접 관찰된다. 위험치 통보라는 환자 안전 감사 질문에 답할 구조적 자리가 없는 표현 능력 결손이 핵심이므로
      completeness로 분류하며, CriticalRange/CriticalValueNotification 분리는 권위 문서 채택 전
      대상 내에서 닫혀야 한다.
    related_surface_finding_ids:
      - finding-003
      - finding-011
      - finding-038
      - finding-030
  - issue_id: issue-004
    problem_definition: 검사 카탈로그를 Test와 Assay로 이중 유지하고 신규 항목 이중 등록을 표준 운영으로 명문화하면서,
      연기 기간의 권위 규칙(canonical 지정·매핑·어휘 변환·불일치 처리 주체)을 정의하지 않아 드리프트 비용이 권위 문서에
      전가되어 있다.
    issue_role: symptom
    judgment_state: observed
    impact_kind: consistency
    timing_class: current_blocker
    closure_class: needs_decision
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: Test/Assay 이중 카탈로그 클러스터의 거울 이슈로, 정본 심의는 issue-024에서 이루어졌고 그 high 등급이
      일괄 적용되었으므로 symptom으로 분류한다. 임시 권위 규칙 부재 자체는 notes[0]과 매핑 관계 부재로 직접 관찰된다. 시정
      경로(단일 개념 통합 vs implemented_by 매핑)는 Test/Assay 동의어 여부에 대한 도메인 권위 판정에 종속되므로
      needs_decision이며, 그 판정 후 권위 규칙 명시가 대상 문서 내에서 닫혀야 한다.
    related_surface_finding_ids:
      - finding-004
  - issue_id: issue-005
    problem_definition: notes[1]이 TAT 정의를 선언하면서 대시보드 팀의 자체 계산식 유지를 동격으로 인정해, 운영 핵심
      지표의 정의 권위 드리프트를 권위 문서 스스로 허용한다.
    issue_role: independent_issue
    judgment_state: observed
    impact_kind: governance_value
    timing_class: defer_watch
    closure_class: document_only
    closure_obligation: planned_later
    domain_axes: {}
    rationale: severity low의 표면 수준 사안으로 전원 합의되었고 관계 그래프상 다른 발견과 same_root 연결이 없는 단독
      이슈다. 즉시 깨지는 구조가 아닌 단일 권위 원칙의 형식화 문제이므로 governance_value이며, TAT 정의의
      canonical 선언 또는 명시적 범위 제외라는 문서화 수준 시정으로 닫히는 사안이라
      document_only/planned_later로 분류한다.
    related_surface_finding_ids:
      - finding-005
  - issue_id: issue-006
    problem_definition: 임상검사라는 안전-규제 도메인의 대상물을 도메인 authority 바인딩
      없이(session_domain=none) 검토하고 있어, 통보 증적·정정 전파 등 안전 관련 판정의 신뢰도가 리뷰 구조 차원에서
      제한된다는 경계 관찰이다.
    issue_role: evidence_gap
    judgment_state: outside_boundary
    impact_kind: governance_value
    timing_class: defer_watch
    closure_class: document_only
    closure_obligation: out_of_scope
    domain_axes: {}
    rationale: 대상 문서의 결함이 아니라 리뷰 세션 구성에 대한 New Perspectives 거버넌스 제안(severity
      info)이다. 안전 판정의 도메인 규범 근거가 현 리뷰 경계 안에 없다는 증거 공백을 지적하므로 evidence_gap이고, 판정
      대상이 본 리뷰 경계 밖의 세션 governance이므로 outside_boundary다. synthesize 단계에서 보존하고 후속
      governance에서 도메인 바인딩을 검토하는 것이 처리 경로이므로 대상 문서 기준으로는 out_of_scope다.
    related_surface_finding_ids:
      - finding-006
  - issue_id: issue-007
    problem_definition: 결과 상태가 Result와 Report에 병행 표현되는데 단일 권위 지정이 없고 두 enum
      어휘(final/finalized, corrected/amended)마저 분리되어, 야간 배치 전 구간에서 권위 선언 값과 실제
      상태가 불일치한다.
    issue_role: symptom
    judgment_state: observed
    impact_kind: consistency
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 결과 상태 이중 권위 계열의 coverage 표면으로, 공유 설계 결정은 issue-025(정본 뿌리)가 소유하므로
      symptom으로 분류한다. 두 note의 권위 주장과 state_rules[1]의 야간 배치 단서가 문서에서 직접 관찰되며 여섯
      렌즈 전원이 high에 수렴했다. 권위 값과 원천 값의 구조화된 불일치 창이 핵심이므로 consistency이고, 단일 권위 선언 +
      파생 투영 재정의로 대상 내에서 닫혀야 한다.
    related_surface_finding_ids:
      - finding-007
  - issue_id: issue-008
    problem_definition: STAT 응급 여부가 priority enum, is_stat 불리언, StatOrder 하위타입 세 경로로
      표현되며 STAT 판정의 권위 경로가 지정되지 않아 구현 시스템 간 판정 분기가 가능하다.
    issue_role: symptom
    judgment_state: contested
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: STAT 삼중 표현 클러스터의 coverage 거울 이슈로, 정본 심의(issue-002)의 medium 결론이 일괄
      적용되었으므로 symptom으로 분류한다. axiology·evolution의 high 측 disagreement가 클러스터 전체에
      보존되었으므로 contested로 기록한다. 시정은 issue-002의 단일 권위 선언과 동일 작업으로 닫히며, 통합 다음 단계 전
      완료가 요구된다.
    related_surface_finding_ids:
      - finding-008
