        이슈로 root_cause로 분류한다. 결함 실재와 근본 원인은 전원 합의이나 심의 후에도 axiology·evolution이
        high 입장을 유지해 disagreement가 명시 보존되었으므로 judgment_state는 contested로 기록한다.
        정본 medium(조건부 발현 모순)이되 클러스터 내 최상위 수정 우선순위가 부여되었으므로, 문서가 통합 단계로 넘어가기 전 동치
