findings:
  - candidate_id: evolution-candidate-001
    target: clinical-lab-ontology.yaml entities.Test / entities.Assay / notes[0]
    evidence_anchor: 'Test (test_code, requires_specimen_type enum) vs Assay
      (assay_code, specimen_kind free string); notes: "현재 신규 항목은 두 곳 모두에 등록한다"'
    claim: 검사 카탈로그가 Test/Assay 이중 구조여서 새 검사 항목 추가마다 두 곳 수정이 필요하고, 두 구조의 검체 타입 표현이 달라
      통합 시 데이터 연속성이 깨진다.
    what: "동일한 '검사 항목' 개념이 Test와 Assay 두 엔티티로 분리되어 있고, notes가 신규 항목의 이중 등록을 명시한다.
      Test는 닫힌 enum(requires_specimen_type)을, Assay는 자유 문자열(specimen_kind: 'WB',
      'Serum', 'Urine-random')을 쓴다."
    why: 확장 단위(신규 검사 추가)가 단일 변경이 아니라 두 카탈로그의 동기 변경을 요구한다. 두 곳의 검체 타입 어휘가 이미 분기되어
      있어(enum 4종 vs 임의 문자열) 시간이 지날수록 매핑 불가능한 항목이 누적되고, notes[0]이 예고한 '카탈로그 통합'
      시점에 기존 데이터의 연속성이 깨진다. EMR/LIS 연동의 개념 권위 문서라면 주문 단위와 수행 단위의 관계(1:N 매핑인지 동일
      개념인지)가 정의되어야 외부 시스템이 어느 코드를 권위로 쓸지 결정할 수 있다.
    how_to_fix: Test를 권위 카탈로그 개념으로 두고 Assay를 Test의 수행 프로파일(Test에 대한 ref + 분석기별 속성)로
      재정의하거나, 최소한 Assay에 test_ref를 추가해 두 카탈로그 간 매핑 관계를 온톨로지 안에서 명시한다. 검체 타입 어휘는
      하나의 공유 enum/코드 체계로 통일한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: "EMR/LIS 연동 설계의 개념 권위 문서 역할 (헤더 주석: '개념 권위 문서로 사용 예정')"
      failure_condition: 신규 검사 항목 추가 또는 카탈로그 통합 시, 두 카탈로그 간 매핑 규칙이 온톨로지에 없어 연동 시스템마다
        자체 매핑을 만들고 기존 데이터의 항목 식별 연속성이 끊어진다.
      impact: 권위 문서가 가장 빈번한 확장 시나리오(검사 항목 추가)에서 단일 진실을 제공하지 못하므로, 이 문서를 기준으로 만든 인터페이스가
        통합 시점에 일괄 재작업된다.
      evidence_refs:
        - "clinical-lab-ontology.yaml: entities.Test"
        - "clinical-lab-ontology.yaml: entities.Assay.specimen_kind note"
        - "clinical-lab-ontology.yaml: notes[0]"
    causal_path:
      root_cause_candidate: 주문 가능 단위(Test)와 분석기 수행 단위(Assay)를 별도 엔티티로 도입하면서 둘 사이의 관계를
        온톨로지에 정의하지 않고 운영 관행(이중 등록 노트)으로 미룬 것.
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 신규 검사 추가는 Test와 Assay 양쪽 등록을 요구하며, 두 레코드를 잇는 구조적 링크가 없다.
          relation_to_previous: null
          evidence_refs:
            - "clinical-lab-ontology.yaml: notes[0]"
            - "clinical-lab-ontology.yaml: relations (Test↔Assay 관계 부재)"
        - cause_id: evolution-candidate-001.cause-002
          claim: 링크 부재는 Test/Assay 간 관계 미정의에서 비롯되며, 검체 타입 표현까지 서로 다른 체계(enum vs 자유 문자열)로
            분기시켰다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "clinical-lab-ontology.yaml: entities.Test.requires_specimen_type"
            - "clinical-lab-ontology.yaml: entities.Assay.specimen_kind"
        - cause_id: evolution-candidate-001.cause-003
          claim: 관계 미정의는 통합을 '카탈로그 정비 후 재검토'로 연기한 설계 결정이 원인이며, 그 사이 비호환 데이터가 누적되도록 허용한다.
          relation_to_previous: causes
          evidence_refs:
            - "clinical-lab-ontology.yaml: notes[0]"
      unresolved_beyond_evidence: 실제 LIS에서 Test와 Assay가 1:1인지 1:N인지(한 주문 항목이 여러 assay로
        분해되는지)는 대상 파일만으로 확인 불가.
  - candidate_id: evolution-candidate-002
    target: clinical-lab-ontology.yaml entities.Order (priority, is_stat) /
      entities.StatOrder
    evidence_anchor: Order.priority enum [routine, urgent, stat], Order.is_stat
      boolean, StatOrder is_a Order
    claim: 긴급도가 enum 값, boolean 플래그, 하위 타입 세 가지 메커니즘으로 중복 인코딩되어 있어, 긴급도 체계 확장 시 세 곳을
      동시 수정해야 하고 표현 간 모순 상태가 가능하다.
    what: 동일한 'STAT 여부' 개념이 priority=stat, is_stat=true, StatOrder 타입 세 군데에 존재한다. 어느
      것이 권위인지 규칙이 없다.
    why: "새 긴급 등급(예: ASAP, timed) 추가 시 enum 수정 + boolean 의미 재해석 + 하위 타입 추가 여부 결정이 모두
      필요하다. 또한 is_stat=true이면서 priority=routine인 인스턴스, StatOrder가 아니면서
      priority=stat인 인스턴스를 막을 제약이 없어, 연동 시스템마다 다른 필드를 읽으면 동작이 갈라진다. 변경 내성 관점에서
      '한 개념 한 표현' 원칙 위반은 모든 긴급도 관련 확장의 비용을 3배로 만든다."
    how_to_fix: priority enum을 단일 권위로 지정하고 is_stat을 priority의 파생 투영(derived)으로 강등하거나
      제거한다. StatOrder는 stat_reason 한 속성만 추가하므로 하위 타입을 없애고 stat_reason을 Order의
      조건부 속성(priority=stat일 때 필수)으로 흡수한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 시 긴급도 판정의 단일 기준 제공
      failure_condition: 긴급도 등급을 추가·변경하는 순간 세 표현 중 일부만 갱신되어, STAT 처리 경로(즉시 검사)가 시스템별로 다르게 트리거된다.
      impact: 임상 워크플로에서 긴급도 오판은 STAT 검사 지연이라는 환자 안전 결과로 직결되며, 권위 문서가 모순 상태를 구조적으로 허용하면
        연동 검증으로도 잡을 수 없다.
      evidence_refs:
        - "clinical-lab-ontology.yaml: entities.Order.attributes.priority"
        - "clinical-lab-ontology.yaml: entities.Order.attributes.is_stat note"
        - "clinical-lab-ontology.yaml: entities.StatOrder"
    causal_path:
      root_cause_candidate: 긴급도라는 단일 개념을 권위 지정 없이 속성(enum), 플래그(boolean), 타입 계층(is_a)
        세 모델링 수단에 병렬로 인코딩한 설계 결정.
      root_cause_step_id: evolution-candidate-002.cause-002
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: 긴급도 확장(새 등급 추가)은 priority enum, is_stat 의미, StatOrder 타입 체계 세 곳의 동기 수정을
            요구한다.
          relation_to_previous: null
          evidence_refs:
            - "clinical-lab-ontology.yaml: entities.Order.attributes"
            - "clinical-lab-ontology.yaml: entities.StatOrder"
        - cause_id: evolution-candidate-002.cause-002
          claim: 세 곳 수정 필요성은 동일 개념의 삼중 인코딩에서 비롯되며, is_stat의 note('priority와 함께 기록')는 중복을
            인지하면서도 권위를 지정하지 않았음을 보여준다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "clinical-lab-ontology.yaml: entities.Order.attributes.is_stat
              note"
      unresolved_beyond_evidence: 기존 EMR/LIS 구현이 세 표현 중 무엇을 실제로 읽는지는 대상 파일 범위 밖.
  - candidate_id: evolution-candidate-003
    target: clinical-lab-ontology.yaml entities.Result.status /
      entities.Report.result_status / state_rules[1]
    evidence_anchor: "Result.status [preliminary, final, corrected] vs
      Report.result_status [prelim, finalized, amended]; state_rules: '동기화 배치는
      야간 1회'"
    claim: 결과 상태가 서로 다른 두 어휘로 이중 관리되고 야간 배치로만 동기화되므로, 상태 어휘 확장 시 두 enum과 매핑 규칙을 모두
      수정해야 하고 변경 사이의 연속성 공백이 구조화되어 있다.
    what: 같은 상태 개념이 Result.status(preliminary/final/corrected)와
      Report.result_status(prelim/finalized/amended)로 철자가 다른 두 enum에 존재한다.
      Result note는 'Report에도 동일 정보가 유지된다'고 하고, Report note는 자신을 '권위 값'이라 한다.
      동기화는 야간 1회 배치다.
    why: "새 결과 상태(예: cancelled, entered-in-error — HL7/FHIR 표준 결과 상태에 존재)를 수용하려면 두
      enum 추가 + 암묵적 매핑(preliminary↔prelim 등) 갱신 + 배치 로직 수정이 모두 필요하다. 외부 표준(HL7
      OBX-11, FHIR DiagnosticReport.status) 채택 시 어느 어휘를 매핑 기준으로 삼을지 결정 불가하다. 또한
      corrected→amended 전파가 최대 하루 지연되는 동안 임상의가 '신뢰하라'고 명시된 Report 값이 구식이 되는 연속성
      단절이 모델 자체에 내장되어 있다."
    how_to_fix: 하나의 상태 어휘를 권위로 선언하고(Result.status 권장), Report.result_status를 그 파생
      투영으로 정의하며 두 어휘를 단일 enum으로 통일한다. 동기화 지연이 불가피하면 Report에 status_as_of(동기화 기준
      시각)를 추가해 지연을 모델에 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 임상의에게 전달되는 결과 상태의 신뢰성과 외부 표준(HL7/FHIR) 연동 시 상태 매핑의 단일 기준
      failure_condition: Result.status가 corrected로 바뀐 뒤 다음 야간 배치까지, '임상의는 이 값을 신뢰한다'고
        선언된 Report.result_status가 finalized로 남아 수정 전 값을 신뢰하게 된다. 상태 어휘 확장 시 두
        enum 중 한쪽만 갱신되면 매핑 불능 상태가 생긴다.
      impact: 수정된 검사 결과의 전달 지연은 임상 의사결정 오류로 직결되는 환자 안전 문제이며, 권위 문서가 이 지연을 정상 동작으로
        명문화하고 있어 연동 설계자가 위험을 인지하지 못한 채 그대로 구현하게 된다.
      evidence_refs:
        - "clinical-lab-ontology.yaml: entities.Result.attributes.status note"
        - "clinical-lab-ontology.yaml: entities.Report.attributes.result_status
          note"
        - "clinical-lab-ontology.yaml: state_rules[1]"
    causal_path:
      root_cause_candidate: 결과 상태의 권위 위치를 Result(LIS 기록)와 Report(임상의 신뢰 값) 양쪽에 동시에
        부여하고, 정합성을 모델 제약이 아닌 야간 배치라는 운영 절차에 위임한 설계 결정.
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 상태 어휘가 두 enum으로 분기되어 있고 값 이름까지 달라(final vs finalized) 확장 시 두 곳 수정과 매핑 갱신이
            필요하다.
          relation_to_previous: null
          evidence_refs:
            - "clinical-lab-ontology.yaml: entities.Result.attributes.status"
            - "clinical-lab-ontology.yaml:
              entities.Report.attributes.result_status"
        - cause_id: evolution-candidate-003.cause-002
          claim: 이중 어휘는 Result note('동일 정보 유지')와 Report note('권위 값')가 서로 권위를 주장하는 이중 권위
            선언의 증상이다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "clinical-lab-ontology.yaml: entities.Result.attributes.status
              note"
            - "clinical-lab-ontology.yaml:
              entities.Report.attributes.result_status note"
        - cause_id: evolution-candidate-003.cause-003
          claim: 이중 권위는 동기화를 야간 배치로 처리하는 운영 결정과 결합해, 최대 24시간의 상태 불일치 창을 모델이 허용하게 만든다.
          relation_to_previous: enables
          evidence_refs:
            - "clinical-lab-ontology.yaml: state_rules[1]"
      unresolved_beyond_evidence: 실제 배치 주기와 corrected 발생 빈도는 대상 파일 범위 밖이므로 불일치 창의 실측 위험도는 확인 불가.
  - candidate_id: evolution-candidate-004
    target: clinical-lab-ontology.yaml entities.Specimen.specimen_type /
      entities.Test.requires_specimen_type
    evidence_anchor: specimen_type enum [blood, urine, tissue, swab] (Specimen과
      Test에 각각 닫힌 enum으로 중복 정의)
    claim: 검체 타입이 두 엔티티에 각각 하드코딩된 닫힌 enum이어서, 새 검체 유형(CSF, 대변, 타액 등) 추가 시 최소 두 곳의
      스키마 수정이 필요하고 Assay의 자유 문자열과는 매핑조차 없다.
    what: "[blood, urine, tissue, swab] 4값 enum이 Specimen.specimen_type과
      Test.requires_specimen_type에 별도로 정의되어 있고, 공유 타입이나 코드 체계 참조가 없다."
    why: 임상검사실은 CSF, 대변, 객담, 골수 등 검체 유형이 일상적으로 추가되는 도메인이다. 닫힌 enum의 중복 정의는 새 유형 수용 시
      두 정의의 동기 수정을 강제하고, 한쪽만 수정되면 Test가 요구하는 검체 타입을 Specimen이 표현할 수 없는 비대칭이 생긴다.
      Assay.specimen_kind(자유 문자열)까지 합치면 같은 개념의 세 번째 표현이며 SNOMED/HL7 specimen
      type 코드 채택 시 세 곳 모두 마이그레이션 대상이 된다.
    how_to_fix: SpecimenType을 독립 카탈로그 개념(코드 + 표시명, 필요 시 외부 코드 체계 매핑 필드 포함)으로 승격하고
      Specimen, Test, Assay가 모두 이를 ref로 참조하게 한다. 그러면 새 검체 유형 추가가 카탈로그 행 추가로 끝난다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: "새 검사·검체 유형을 기존 구조 수정 없이 수용하는 확장성 (검토 목표: scope_control)"
      failure_condition: "4값 enum에 없는 검체(예: CSF)를 쓰는 검사를 카탈로그에 추가하는 순간, Specimen과 Test
        양쪽의 enum 정의 변경 없이는 해당 주문·검체를 표현할 수 없다."
      impact: 검체 유형 추가는 임상검사실의 통상 확장 시나리오인데 매번 권위 문서의 스키마 변경(및 이를 따르는 EMR/LIS 인터페이스
        변경)을 유발하므로, 인스턴스 수준 확장이어야 할 작업이 스키마 마이그레이션이 된다.
      evidence_refs:
        - "clinical-lab-ontology.yaml:
          entities.Specimen.attributes.specimen_type"
        - "clinical-lab-ontology.yaml:
          entities.Test.attributes.requires_specimen_type"
        - "clinical-lab-ontology.yaml: entities.Assay.attributes.specimen_kind"
    causal_path:
      root_cause_candidate: 검체 타입을 참조 가능한 카탈로그 개념이 아니라 인라인 enum 리터럴로 모델링하고, 그 리터럴을 엔티티마다 복사한 것.
      root_cause_step_id: evolution-candidate-004.cause-002
      steps:
        - cause_id: evolution-candidate-004.cause-001
          claim: 새 검체 유형 수용에 Specimen·Test 두 enum의 동기 스키마 수정이 필요하다.
          relation_to_previous: null
          evidence_refs:
            - "clinical-lab-ontology.yaml:
              entities.Specimen.attributes.specimen_type"
            - "clinical-lab-ontology.yaml:
