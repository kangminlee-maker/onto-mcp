domain_constraints_used: []
domain_context_assumptions:
  - 임상검사 도메인에서 혈청(Serum)과 전혈(WB)은 둘 다 혈액 유래지만 검사 적합성 관점에서 호환 불가능한 별개 검체로 취급된다.
  - 임상 결과 보고 관행(HL7 v2 OBX-11 등 일반 관행)에서 preliminary/final/corrected는 결과 상태의 표준적
    구분이며, corrected 결과의 표시 지연은 환자안전 위험으로 간주된다.
  - critical value(위험치) 통보는 검사실 환자안전 핵심 워크플로로, 통보 시각·수신자·확인 여부의 추적이 요구된다.
  - STAT(응급) 지정은 일반적으로 운영 중 변경 가능한 비본질적 속성으로 간주된다(rigidity 판정의 작업 가정).
