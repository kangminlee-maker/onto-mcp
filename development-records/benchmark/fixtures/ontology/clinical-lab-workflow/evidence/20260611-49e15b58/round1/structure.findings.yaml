findings:
  - candidate_id: structure-candidate-001
    target: clinical-lab-ontology.yaml entities.Patient / relations
    evidence_anchor: "clinical-lab-ontology.yaml: relations 목록(11개 항목)에 Patient가
      from/to 어디에도 등장하지 않음; Patient 연결은 Order.patient_ref 속성 한 곳뿐이며 Specimen에는
      환자 참조가 전혀 없음"
    claim: Patient가 관계 그래프에서 고아이며, 특히 Specimen→Patient 필수 연결이 누락되어 있다.
    what: Patient 엔티티는 relations 섹션의 어떤 관계에도 연결되지 않는다. Order.patient_ref 속성으로만 간접
      연결되며, Specimen은 정의상 '환자에게서 채취한 검체'임에도 환자를 직접 참조하는 속성·관계가 없어
      Specimen→Order→Patient의 단일 경유 경로에만 의존한다.
    why: EMR/LIS 통합의 개념 권위 문서에서 검체-환자 식별은 핵심 무결성 경로다. 검체 식별은 채취 시점에 환자 단위로 이루어지는데(용기
      바코드 라벨링), 온톨로지가 이 연결을 Order 경유로만 허용하면 주문 변경·취소·재라벨링 시 검체의 환자 귀속을 검증할 구조적
      근거가 사라진다. 검체 뒤바뀜(specimen mix-up)을 모델 차원에서 탐지할 수 없게 된다.
    how_to_fix: "Specimen에 patient_ref 속성 또는 relations에 { from: Specimen, to:
      Patient, kind: collected_from } 관계를 추가하고, Patient를 relations 그래프에 명시적으로
      연결한다(예: Patient→Order has_many)."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 검체-환자 식별 무결성 보장
      failure_condition: 주문이 수정·취소되거나 한 환자의 검체가 다른 주문으로 재배정될 때, Specimen의 환자 귀속을 Order
        경유 외에는 검증할 수 없는 경우
      impact: 환자 식별이 단일 간접 경로에 의존하므로 LIS 구현이 이 모델을 따르면 검체-환자 교차 검증 로직을 만들 개념적 근거가 없고,
        검체 뒤바뀜 위험이 모델 수준에서 비가시화된다.
      evidence_refs:
        - clinical-lab-ontology.yaml entities.Specimen attributes (patient 참조 부재)
        - clinical-lab-ontology.yaml relations (Patient 미등장)
        - clinical-lab-ontology.yaml entities.Order.attributes.patient_ref
    causal_path:
      root_cause_candidate: 관계 그래프가 Order 중심으로만 작성되어 Patient가 속성 참조(patient_ref)로만
        표현되고 relations 섹션의 1급 노드로 승격되지 않음
      root_cause_step_id: structure-candidate-001.cause-003
      steps:
        - cause_id: structure-candidate-001.cause-001
          claim: Patient는 relations 섹션의 어떤 관계에도 등장하지 않고, Specimen에는 환자 참조 속성이 없다
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml relations
            - clinical-lab-ontology.yaml entities.Specimen
        - cause_id: structure-candidate-001.cause-002
          claim: 그 결과 Specimen의 환자 귀속은 Specimen→Order→Patient 단일 간접 경로에만 의존한다
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml entities.Order.attributes.patient_ref
            - "clinical-lab-ontology.yaml relations: Specimen belongs_to Order"
        - cause_id: structure-candidate-001.cause-003
          claim: 이 구조는 관계 그래프를 Order 중심으로만 설계하고 Patient 연결을 속성 수준에 남겨둔 설계 선택의 증상이다
          relation_to_previous: symptom_of
          evidence_refs:
            - clinical-lab-ontology.yaml relations 전체(주문-검체-결과-보고 축만 존재)
      unresolved_beyond_evidence: 실제 LIS 구현이 검체-환자 검증을 별도 시스템에서 수행하는지는 이 파일 범위 밖이다.
  - candidate_id: structure-candidate-002
    target: clinical-lab-ontology.yaml entities.Assay
    evidence_anchor: "clinical-lab-ontology.yaml: Assay 정의는 존재하나 relations 섹션과 다른
      엔티티의 ref 속성 어디에서도 Assay를 참조하지 않음; notes 첫 항목이 Test/Assay 이중 등록을 인정"
    claim: Assay는 어떤 관계·참조에도 연결되지 않은 고아 엔티티다.
    what: Assay는 entities에 정의되어 있지만 relations 섹션에 등장하지 않고,
      Order.ordered_tests·Result.test_ref·CriticalValue.test_ref 등 모든 ref가 Test만
      가리킨다. Test↔Assay 간 대응 관계도 정의되어 있지 않다.
    why: notes에 '신규 항목은 두 곳 모두에 등록한다'고 명시되어 있어 Assay가 실제 운영 카탈로그임은 분명한데, 온톨로지 그래프상
      Assay는 주문→결과→보고 경로 어디에도 도달할 수 없다. 분석기 결과(Assay 단위)를 Result(Test 단위)로 매핑하는
      연결이 모델에 없으므로, LIS 통합 시 이 매핑이 각 구현체의 암묵 규칙으로 흩어지게 된다.
    how_to_fix: "최소 수정으로 { from: Test, to: Assay, kind: realized_by } 관계(또는
      Test.assay_ref 속성)를 추가해 Assay를 그래프에 연결하거나, 통합 재검토 전까지 Assay를 온톨로지 본문에서
      제외하고 notes로 강등한다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 검사 카탈로그의 주문 단위(Test)와 수행 단위(Assay) 간 대응을 개념 권위 문서가 정의하는 것
      failure_condition: 분석기 인터페이스가 Assay 코드로 결과를 보내고 EMR이 Test 코드로 결과를 받을 때, 둘 사이 매핑을
        온톨로지가 답하지 못하는 경우
      impact: 수행 단위와 주문 단위의 매핑이 모델 밖 암묵 지식이 되어, 통합 구현마다 다른 매핑 테이블이 생기고 권위 문서로서의 효력이
        깨진다.
      evidence_refs:
        - clinical-lab-ontology.yaml entities.Assay
        - clinical-lab-ontology.yaml relations (Assay 미등장)
        - clinical-lab-ontology.yaml notes[0]
    causal_path:
      root_cause_candidate: Test/Assay 통합 결정을 보류한 상태(notes[0])에서 Assay를 그래프에 연결하지 않은 채 엔티티만 선등록함
      root_cause_step_id: structure-candidate-002.cause-002
      steps:
        - cause_id: structure-candidate-002.cause-001
          claim: Assay는 relations와 모든 ref 속성에서 참조되지 않는 고아 엔티티다
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml relations
            - "clinical-lab-ontology.yaml entities (ref 속성 전수: 모두
              Test/Patient/Department/Staff/Order/Report 대상)"
        - cause_id: structure-candidate-002.cause-002
          claim: 이는 Test/Assay 통합 여부 결정을 보류하면서 연결 관계 정의도 함께 보류한 결과다
          relation_to_previous: symptom_of
          evidence_refs:
            - "clinical-lab-ontology.yaml notes[0]: '카탈로그 정비 후 통합 여부를 재검토한다'"
      unresolved_beyond_evidence: 운영 중인 실제 Test↔Assay 매핑 테이블이 별도 시스템에 존재하는지는 이 파일 범위 밖이다.
  - candidate_id: structure-candidate-003
    target: clinical-lab-ontology.yaml entities.CriticalValue
    evidence_anchor: "clinical-lab-ontology.yaml: CriticalValue는 test_ref 속성만 있고
      relations에 미등장; Result·Staff·Report와의 관계 없음; notified 속성 note가 '통보 시각과
      수신자는 전화 기록 대장에 있다'고 모델 외부를 지시"
    claim: CriticalValue가 평가 대상(Result)과 통보 경로(Staff/임상의)에 구조적으로 연결되어 있지 않다.
    what: CriticalValue는 relations 섹션에 등장하지 않고, Test로의 속성 참조 하나만 가진다. 어떤 Result가
      임계값에 해당하는지 판정하는 관계(CriticalValue↔Result), 그리고 통보 수신자·통보 행위를 나타내는 관계가 모두
      없다. notified는 boolean 하나이며 수신자·시각은 모델 밖 '전화 기록 대장'에 있다고 명시한다.
    why: 임계값 통보는 임상검사에서 환자 안전과 규제(인증 심사) 모두에 걸리는 필수 경로다. 권위 문서가 이 경로를 Test 참조 하나와
      boolean으로만 표현하면, EMR/LIS 통합 시 임계값 판정·통보 추적을 시스템 간 누구가 소유하는지 모델이 답하지 못하고,
      통보 증적은 영구히 모델 밖 종이 대장에 남는다.
    how_to_fix: "{ from: Result, to: CriticalValue, kind: flagged_by } 관계와 통보
      이벤트(최소한 notified_to: ref→Staff, notified_at: datetime 속성)를 추가해 판정 대상과 통보
      경로를 그래프 안으로 끌어들인다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 임계값(critical value) 판정과 통보 추적을 EMR/LIS 통합이 의존할 수 있는 개념 경로로 정의하는 것
      failure_condition: 위험 결과가 발생했을 때 어떤 Result가 어떤 CriticalValue 규칙에 걸렸고 누구에게 언제
        통보됐는지를 모델 기반 시스템이 표현·조회할 수 없는 경우
      impact: 환자 안전 직결 경로가 모델 밖(전화 기록 대장)에 존재하므로, 이 온톨로지를 권위로 삼는 통합 설계는 임계값 통보 감사 추적을
        구현할 개념적 근거가 없다.
      evidence_refs:
        - clinical-lab-ontology.yaml
          entities.CriticalValue.attributes.notified.note
        - clinical-lab-ontology.yaml relations (CriticalValue 미등장)
    causal_path:
      root_cause_candidate: 기존 수기 운영 절차(전화 기록 대장)를 그대로 둔 채 CriticalValue를 범위 정의 엔티티로만
        모델링하고, 판정·통보를 관계로 승격하지 않음
      root_cause_step_id: structure-candidate-003.cause-003
      steps:
        - cause_id: structure-candidate-003.cause-001
          claim: CriticalValue는 Result·Staff와 어떤 관계도 없고 notified boolean만 가진다
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml entities.CriticalValue
            - clinical-lab-ontology.yaml relations
        - cause_id: structure-candidate-003.cause-002
          claim: 그 결과 임계값 판정 대상과 통보 수신자·시각이 모델에서 표현 불가능하다
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml entities.CriticalValue.attributes
              (notified_to/notified_at 부재)
        - cause_id: structure-candidate-003.cause-003
          claim: 이는 통보 증적을 전화 기록 대장이라는 모델 외부 시스템에 두기로 한 기존 운영 관행을 온톨로지가 그대로 수용한 증상이다
          relation_to_previous: symptom_of
          evidence_refs:
            - clinical-lab-ontology.yaml
              entities.CriticalValue.attributes.notified.note
      unresolved_beyond_evidence: 전화 기록 대장을 전산화할 계획이 있는지는 이 파일 범위 밖이다.
  - candidate_id: structure-candidate-004
    target: clinical-lab-ontology.yaml entities.StatOrder
    evidence_anchor: "clinical-lab-ontology.yaml: StatOrder는 is_a Order 외에 어떤
      관계·ref에서도 참조되지 않으며, Order에 priority enum(stat 포함)과 is_stat boolean이 별도로
      존재"
    claim: StatOrder 하위 타입이 그래프에서 참조되지 않는 미사용 분기이며, STAT 표현이 세 곳(StatOrder,
      priority, is_stat)으로 분산되어 있다.
    what: "StatOrder는 is_a로 Order에 붙어 있지만 어떤 relations 항목이나 ref 속성도 StatOrder를 대상으로
      하지 않는다. 동시에 Order 자체에 priority: [routine, urgent, stat]과 is_stat boolean이
      있어 STAT 여부를 표현하는 구조적 경로가 세 개다."
    why: 세 경로 중 어느 것이 권위인지 구조가 답하지 못한다. 통합 구현체 A는 StatOrder 타입 검사로, B는 priority로, C는
      is_stat으로 STAT을 판정하면 동일 주문이 시스템마다 다르게 분류될 수 있다. 미참조 하위 타입은 설계 의도(서브타이핑)와
      실제 연결 구조(enum/boolean 사용)의 불일치다.
    how_to_fix: "하나를 권위로 선언하고 나머지를 제거하거나 파생값으로 강등한다. 최소 수정: StatOrder를 제거하고
      stat_reason을 Order의 선택 속성으로 옮긴 뒤 priority를 단일 권위로 선언, is_stat은
      priority=stat의 파생 투영으로 명시."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: STAT(응급) 주문 판정의 단일 권위 경로를 권위 문서가 제공하는 것
      failure_condition: 통합되는 시스템들이 서로 다른 STAT 판정 경로(타입/priority/is_stat)를 선택해 동일 주문의
        응급 여부가 시스템 간 불일치하는 경우
      impact: 응급 검사 우선처리 누락 또는 비응급 검사의 오분류로 이어질 수 있는 판정 분기이며, 권위 문서가 분기를 만들어낸 당사자가 된다.
      evidence_refs:
        - clinical-lab-ontology.yaml entities.StatOrder
        - clinical-lab-ontology.yaml entities.Order.attributes.priority
        - clinical-lab-ontology.yaml entities.Order.attributes.is_stat
    causal_path:
      root_cause_candidate: STAT 개념을 서브타입으로 분리하려는 시도와 속성(enum/boolean)으로 표현하려는 시도가 정리되지 않고 셋 다 잔존함
      root_cause_step_id: structure-candidate-004.cause-002
      steps:
        - cause_id: structure-candidate-004.cause-001
          claim: StatOrder는 어떤 관계·참조에서도 사용되지 않고, Order에 priority(stat)와 is_stat이 병존한다
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml entities.StatOrder
            - clinical-lab-ontology.yaml entities.Order.attributes
        - cause_id: structure-candidate-004.cause-002
          claim: 이 병존은 STAT 판정 권위를 셋 중 어디에도 확정하지 않은 모델링 미결정의 증상이다
          relation_to_previous: symptom_of
          evidence_refs:
            - "clinical-lab-ontology.yaml
              entities.Order.attributes.is_stat.note: 'priority와 함께 기록'(권위 미선언)"
      unresolved_beyond_evidence: null
  - candidate_id: structure-candidate-005
    target: clinical-lab-ontology.yaml relations / entities.Test.requires_specimen_type
    evidence_anchor: "clinical-lab-ontology.yaml: relations에 Specimen↔Test 관계가 없고,
      Order.ordered_tests는 속성으로만 존재하며 relations 섹션에 Order→Test 관계도 없음"
    claim: Specimen과 Test를 잇는 관계가 누락되어 Test.requires_specimen_type 제약을 검증할 구조적 경로가 없다.
    what: Test에는 requires_specimen_type이, Specimen에는 specimen_type이 있지만, 어떤
      Specimen이 어떤 Test를 위한 것인지 잇는 관계가 없다. 검체와 검사의 연결은
      Specimen→Order(belongs_to)와 Order.ordered_tests를 거치는 간접 경로뿐인데, 주문에 검체 여러
      개와 검사 여러 개가 묶이면 어느 검체가 어느 검사용인지 결정 불가능하다.
    why: requires_specimen_type은 검체 적합성 검증을 위해 존재하는 제약인데, 검증을 수행할 조인 경로가 그래프에 없으면 죽은
      제약이 된다. 혈액+소변이 한 주문에 묶인 경우(흔한 사례) 모델상 어떤 검체-검사 짝도 적합성 판정을 할 수 없다.
    how_to_fix: "{ from: Specimen, to: Test, kind: collected_for } 관계(또는
      Specimen.intended_tests 속성)를 추가해 검체-검사 적합성 검증이 가능한 경로를 만든다."
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 검체 적합성(specimen suitability) 검증을 가능하게 하는 검체-검사 연결 정의
      failure_condition: 하나의 Order에 복수 검체와 복수 검사가 묶였을 때 검체-검사 대응이 모델상 비결정적이 되는 경우
      impact: requires_specimen_type 제약이 실행 불가능한 장식이 되고, 부적합 검체로 검사가 진행되는 것을 모델 기반으로
        막을 수 없다.
      evidence_refs:
        - clinical-lab-ontology.yaml
          entities.Test.attributes.requires_specimen_type
        - "clinical-lab-ontology.yaml relations: Order has_many Specimen"
        - clinical-lab-ontology.yaml entities.Order.attributes.ordered_tests
    causal_path:
