      값. 임상의는 이 값을 신뢰한다"), state_rules[1]("동기화 배치는 야간 1회")'
    claim: 결과 상태의 권위 좌석이 둘로 선언되어 있고 야간 배치 동기화 지연이 정상 동작으로 명문화되어 있어, '개념 권위 문서'라는 선언된
      목적과 임상의 신뢰 약속을 동시에 위반한다.
    what: Result.status(preliminary/final/corrected)와
      Report.result_status(prelim/finalized/amended)가 같은 사실을 서로 다른 enum 어휘로 이중
      보관하며, Report 쪽 note는 자신을 '권위 값'으로 선언하고 Result 쪽 note는 LIS 기록을 원천으로 선언한다.
      state_rules[1]은 corrected→amended 반영이 야간 1회 배치임을 명시한다.
    why: "이 문서의 선언된 목적은 EMR/LIS 통합의 개념 권위 문서이다(파일 헤더 주석). 권위 문서가 동일 사실에 대해 두 개의
      truth seat를 선언하고 그 사이에 최대 24시간의 비동기 창을 정상 규칙으로 수용하면, '임상의는 이 값을 신뢰한다'는 명시적
      이해관계자 약속이 구조적으로 깨진다. corrected 결과가 나온 뒤에도 임상의가 보는 보고서는 하루 동안 finalized로
      표시될 수 있는데, 이 트레이드오프(배치 비용 절감 vs 임상 신뢰)는 어떤 정당화도 없이 note와 state_rule에 암묵
      수용되어 있다. 가치 유형: purpose+commitment, 정렬 방향: misaligned. 권위 앵커: 대상 문서 헤더의 목적
      선언 및 review-value-alignment-criteria.yaml criterion user-request-intent."
    how_to_fix: "결과 상태의 권위 좌석을 하나로 선언하고(권장: Result.status를 원천으로,
      Report.result_status는 파생 projection으로 명시), enum 어휘를 단일화하며, corrected 발생 시
      보고서 상태 반영의 허용 지연 한계를 임상 신뢰 약속에 맞게 명시적으로 정당화하거나 즉시 전파로 규정한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 통합의 개념 권위 문서로서 결과 상태의 단일 진실을 제공하고 임상의 신뢰를 보장한다는 선언된 목적
      failure_condition: Result.status가 corrected로 변경된 후 야간 배치 실행 전까지의 구간에서 EMR이
