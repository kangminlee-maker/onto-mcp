      impact: 통합 설계자가 이 문서를 그대로 따르면 정정된 결과가 임상의에게 최대 24시간 미표시되는 동작이 '사양대로'가 되어, 권위 문서
        자체가 환자 안전 관련 신뢰 약속 위반을 제도화한다.
      evidence_refs:
        - clinical-lab-ontology.yaml Result.status note
        - clinical-lab-ontology.yaml Report.result_status note
        - clinical-lab-ontology.yaml state_rules[1]
