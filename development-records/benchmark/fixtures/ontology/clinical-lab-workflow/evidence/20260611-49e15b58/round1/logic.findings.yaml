    claim: Order의 종결 판정 규칙이 가역적 상태(Result.status)에 의존하여, 모델이 스스로 허용하는 후속
      사건(corrected 전이)과 시간 전개 경로상 모순을 형성한다.
    what: 'state_rules[0]은 "모든 Result가 final"을 Order→completed 전이 조건으로 선언한다. 그러나
      Result.status enum은 final 이후의 corrected 값을 명시적으로 허용한다(state_rules[1]도
      corrected 전이를 정상 사건으로 전제). Result가 corrected로 바뀌는 순간 completed 판정의 전제(모든
      Result가 final)는 거짓이 되는데, Order lifecycle [draft, placed, in_progress,
      completed, cancelled]에는 completed에서의 복귀 전이나 재개 상태가 정의되어 있지 않다. 스냅숏 시점에는 각
      규칙이 개별 만족 가능하지만, 상태 전개 경로 위에서는 {completed 판정 규칙, corrected 허용, 복귀 전이 부재}가
      동시 만족 불가능하다. [logic 보충:
      conflict_pair=state_rules[0]↔entities.Result.status;
      satisfiability_note=inter-claim(종결 규칙과 결과 정정 허용의 시간적 상호작용);
      modality_note=necessary 조건처럼 쓰인 전이 규칙이 가역적 possible 사건과 충돌 — modality 축
      mixed; boundary_handoff_note=completed 이후 재개/정정 전이의 구조적 부재 자체는 structure
      lens 범위와 겹침(전이 그래프 누락), 그러나 명시 claim 간 모순이 잔존하므로 logic primary.]'
    why: 이 문서는 EMR/LIS 연동의 개념 권위 문서로 선언되어 있다(파일 헤더 주석). EMR/LIS 통합에서 결과
      정정(corrected)은 모델 자신이 1급 사건으로 선언한 정상 경로인데, 종결 규칙이 그 사건과 양립 불가능하면 구현 팀마다 임의
      해석(completed 고정 vs in_progress 복귀 vs 별도 amended 상태)을 하게 되어 권위 문서 역할이 무너진다.
      이는 명시된 claim 집합의 동시 만족 불가능 문제이므로 logic 소유이다.
    how_to_fix: "종결 규칙의 시점 의존성을 명시한다: (a) completed를 '판정 시점에 모든 Result가 final 또는
      corrected'로 재정의하고 corrected 발생 시 Order 상태 처리 규칙(유지+amended 플래그, 또는 재개 전이)을
      1문장 추가하거나, (b) lifecycle에 completed→(정정 발생 시) 전이를 명시한다. 둘 중 하나만 선택해도 모순은
      해소된다."
