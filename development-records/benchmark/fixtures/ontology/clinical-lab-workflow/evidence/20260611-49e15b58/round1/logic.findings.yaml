        - cause_id: logic-candidate-002.cause-002
          claim: 같은 규칙이 이행 수단을 야간 1회 배치로 한정하여, 의무가 충족되지 않는 구간(최대 약 24시간)을 구조적으로 보장한다.
          relation_to_previous: causes
