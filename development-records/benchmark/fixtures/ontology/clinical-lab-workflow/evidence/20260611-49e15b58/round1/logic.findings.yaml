    claim: completed 전이 규칙이 보편 양화의 공허 충족과 cancelled 상태에 대한 예외를 정의하지 않아, 취소된(또는 결과가
      0건인) Order에 대해 completed 전이가 형식적으로 성립하여 cancelled 상태와 충돌한다.
    what: "state_rules[0]은 전이 규칙의 적용 조건에 Order의 현재 상태 제약이 없다. (1) Result가 0건인
      Order(draft 단계, 채취 전 취소 등)는 '모든 Result가 final'을 공허하게 충족하므로 규칙 문면상
      completed 전이 대상이 된다. (2) 일부 결과가 final이 된 뒤 잔여 검사가 취소된 Order에서, 존재하는 모든
      Result가 final이면 규칙은 completed 전이를 지시하지만 lifecycle은 그 주문을 cancelled로 두려 한다
      — 한 인스턴스에 두 상태가 동시에 지시되며 completed와 cancelled는 단일 lifecycle 값으로 상호 배타적이다.
      [logic 보충:
