  - candidate_id: logic-candidate-002
    target: "clinical-lab-ontology.yaml: state_rules[1] ×
      entities.Report.attributes.result_status.note ×
      entities.Result.attributes.status.note"
    evidence_anchor: state_rules[1] "Result.status가 corrected로 바뀌면
      Report.result_status는 amended가 되어야 한다(동기화 배치는 야간 1회)";
      Report.result_status.note "권위 값. 임상의는 이 값을 신뢰한다"; Result.status.note
      "Report.result_status에도 동일 정보가 유지된다"
    claim: state_rules[1]은 즉시형 의무(amended가 되어야 한다)와 그 의무를 매번 위반하게 만드는 이행 메커니즘(야간 1회
      배치)을 한 규칙 안에 선언하여, '동일 정보 유지'·'권위 값' claim들과 함께 동시 만족 불가능한 집합을 이룬다.
    what: "세 claim이 동시에 선언되어 있다: (1) corrected 발생 시 Report.result_status는 amended\"가
      되어야 한다\"(즉시형 의무), (2) 그 의무의 이행 메커니즘은 야간 1회 배치(최대 약 24시간 지연을 구조적으로 허용), (3)
      Report.result_status는 임상의가 신뢰하는 권위 값이며 Result.status와 \"동일 정보가 유지된다\".
      corrected 발생 시점부터 다음 배치까지의 구간에서는 (1)의 의무가 충족되지 않은 상태가 모델 자체에 의해 보장되므로, '동일
      정보 유지' claim과 '권위 값' claim은 그 구간 동안 거짓이다. 즉 이 claim 집합은 시간 전개 경로 위에서 동시 만족
      불가능하며, 모순이 예외 상황이 아니라 설계된 정상 경로에서 매번 발생한다. [logic 보충:
      conflict_pair=state_rules[1] 전반부(즉시 의무)↔state_rules[1] 괄호(야간 배치) 및
      ↔Result.status.note(동일 정보 유지);
      satisfiability_note=intra-claim(state_rules[1] 단일 규칙 내부에 의무와 그 의무를 위반하는
      메커니즘이 공존) + inter-claim(권위/동일성 note들과의 충돌); modality_note=obligatory(\"되어야
      한다\")를 충족 불가능하게 만드는 메커니즘이 같은 문장에 선언됨 — obligatory vs possible 구분 오류;
      boundary_handoff_note=enum 어휘 불일치(final/finalized, corrected/amended,
      preliminary/prelim)로 '동일 정보'의 의미 자체가 모호한 부분은 semantics lens 소유 — 다만 어휘를
      통일해도 배치 지연으로 인한 의무 위반 구간 모순은 잔존하므로 logic primary.]"
    why: 문서가 스스로 Report.result_status를 임상의가 신뢰하는 권위 값으로 선언했기 때문에, 권위 값이
      원천(Result.status)과 정의상 불일치하는 구간을 모델이 보장한다는 것은 권위 선언 자체와의 형식 모순이다. 이는 단일 규칙
      내부의 modality 구분 오류(의무를 선언하면서 충족 가능 조건을 제거)이므로 logic 소유이며, EMR/LIS 통합 시
      임상의가 stale finalized를 신뢰하는 위험이 모델 수준에서 정당화된다.
    how_to_fix: "의무의 modality를 메커니즘과 일치시킨다: (a) 즉시 동기화를 요구한다면 '야간 배치' 단서를 제거하고
      corrected 이벤트 기반 즉시 갱신을 규칙으로 선언하거나, (b) 지연을 허용한다면 '되어야 한다'를 '다음 동기화 주기 내에
      amended가 된다'로 바꾸고 그 지연 구간 동안의 권위를 Result.status로 명시 이전한다(권위 값 note 수정 동반).
      두 경로 모두 '동일 정보가 유지된다' note를 '주기적으로 동기화된다'로 수정해야 한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: 임상의에게 전달되는 결과 상태의 단일 권위(Report.result_status "임상의는 이 값을
        신뢰한다")와 Result↔Report 상태 동일성 계약.
      failure_condition: Result.status가 corrected로 전이된 시점부터 다음 야간 배치까지의 모든 구간 — 모델이
        명시한 정상 경로상 매 정정 사건마다 발생.
      impact: 권위 문서가 '신뢰하라'고 선언한 값이 원천과 불일치하는 구간을 문서 자신이 보장하므로, 이 문서를 계약으로 삼는 EMR/LIS
        구현은 검증 기준 자체가 자기모순이 되고, 임상의가 정정 전 값을 최종으로 오신뢰하는 경로가 개념 모델 수준에서 승인된다.
      evidence_refs:
        - clinical-lab-ontology.yaml state_rules[1]
        - clinical-lab-ontology.yaml
          entities.Report.attributes.result_status.note
        - clinical-lab-ontology.yaml entities.Result.attributes.status.note
    causal_path:
      root_cause_candidate: 동기화 의무의 modality(즉시 obligatory)와 이행 메커니즘의 능력(야간 1회 배치)을
        구분하지 않고 한 규칙에 합쳐 선언한 것 — obligatory/possible 구분 오류.
      root_cause_step_id: logic-candidate-002.cause-003
      steps:
