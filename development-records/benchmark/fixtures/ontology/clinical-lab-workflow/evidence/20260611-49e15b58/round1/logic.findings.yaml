      충돌의 직접 원인 — mixed; boundary_handoff_note=부분 취소·검사별 취소 개념의 부재는
      coverage/structure 범위와 겹치지만, 현재 명시된 두 claim만으로 모순이 형성되므로 logic primary.]"
    why: 권위 문서의 상태 규칙은 통합 구현에서 자동 전이 로직으로 직역될 가능성이 높다. 공허 충족과 cancelled 예외 부재는 문면
      그대로 구현하면 취소 주문이 completed로 보고되는 결함을 낳고, 구현자가 암묵 보정하면 문서와 구현이 갈라진다 — 어느 쪽이든
      권위 문서 목적이 손상된다.
    how_to_fix: '규칙에 적용 전제 두 가지를 추가한다: "in_progress 상태이고 Result가 1건 이상 존재하며 모든
      Result가 final일 때 completed로 전이한다. cancelled 상태에서는 이 규칙을 적용하지 않는다." 부분 취소
      시의 우선순위(cancelled가 completed에 우선하는지)도 1문장으로 명시한다.'
