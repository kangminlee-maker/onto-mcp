      failure_condition: 결과 0건 주문 또는 부분 취소 후 잔여 결과가 모두 final인 주문이 존재하는 경우 — 임상검사 운영에서
        통상적으로 발생 가능한 인스턴스 형상.
      impact: 동일 인스턴스에 completed와 cancelled가 동시에 지시되어 상태 모델의 단일 값 전제가 깨지고, 구현별 임의 보정으로
