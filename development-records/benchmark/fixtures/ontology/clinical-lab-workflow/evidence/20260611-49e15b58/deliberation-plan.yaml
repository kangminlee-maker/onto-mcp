      - issue-stance-matrix.yaml#stances.issue-002.semantics
      - issue-stance-matrix.yaml#stances.issue-002.structure
    conflict_summary: STAT 삼중 표현(priority enum / is_stat boolean / StatOrder 하위 타입)
      결함의 심각도에 대해 렌즈 간 실질 분기가 있다. axiology와 evolution은 환자 안전 직결 경로(응급 검사
      오분류·지연)와 확장 시 동기 수정 강제를 근거로 high를 주장하고,
      coverage·logic·semantics·structure는 모순 인스턴스 생성이라는 발현 전제 조건이 필요한 조건부 결함이며
      동치 제약 1줄로 형식 모순이 해소 가능하다는 근거로 medium을 주장한다. 모든 렌즈가 결함 실재와 근본 원인(canonical
      표현 미선언)에는 합의했으므로 분쟁 축은 순수하게 심각도 등급이다. 이 분쟁은 동일 STAT 결함의 렌즈별 중복 이슈인
      issue-008, issue-014, issue-022, issue-026, issue-032에도 동일하게 존재하므로, 본 심의의
      결론이 해당 클러스터 전체의 정본 심각도가 된다.
    resolution_question: STAT 삼중 표현 결함의 정본 심각도는 high인가 medium인가 — 구체적으로, '모순 인스턴스가
      생성되어야 발현되는 조건부 결함'이라는 완화 논거가 '권위 문서가 환자 안전상 가장 시간 민감한 판정의 분기를 스스로 내장하며 스키마
      검증으로 걸러지지 않는다'는 가중 논거를 누르는가? 그리고 결정된 등급을 동일 결함
      클러스터(issue-008/014/022/026/032)에 일괄 적용하는 것이 타당한가?
  - issue_id: issue-024
    priority: 8
    conflict_type: action_or_severity
    participating_lens_ids:
      - semantics
      - axiology
      - coverage
      - evolution
    source_stance_refs:
      - issue-stance-matrix.yaml#stances.issue-024.semantics
      - issue-stance-matrix.yaml#stances.issue-024.axiology
      - issue-stance-matrix.yaml#stances.issue-024.coverage
      - issue-stance-matrix.yaml#stances.issue-024.evolution
    conflict_summary: Test/Assay 이중 카탈로그(동의어 미판정·매핑 부재) 결함의 심각도에 대해 렌즈 간 실질 분기가 있다.
      semantics와 evolution은 가장 빈번한 확장 시나리오(검사 항목 추가)에서 권위 문서가 단일 진실을 제공하지 못하고
      주문-수행-결과 의미 연결이 통합 시점에 구조적으로 끊긴다는 근거로 high를 주장하고, axiology와 coverage는 누적형
      어휘 드리프트 위험으로서 명문화된 동기화 지연 창을 가진 결과 상태 계열의 직접 안전 경로와 동급으로 둘 수 없다는 근거로
      medium을 주장한다. 결함 실재와 근본 원인(동의어 판정·매핑 연기 상태의 이중 등록 공식화)에는 전원 합의했다. 같은 심각도
      분쟁이 동일 카탈로그 결함의 거울 이슈인 issue-004(evolution이 medium→high 상향 요구)와
      issue-013(axiology·coverage가 high→medium 하향 요구)에도 존재하므로, 본 심의의 결론이 카탈로그
      클러스터 전체의 정본 심각도가 된다.
    resolution_question: Test/Assay 이중 카탈로그 결함의 정본 심각도는 high인가 medium인가 — 구체적으로, '즉시
      발생하는 안전 사건 경로가 아닌 누적형 드리프트'라는 하향 논거가 '가장 빈번한 확장 단위에서 권위 기능이 정지하고 형식적으로 이행
      불가능한 이중 등록 의무가 명문화되어 있다'는 유지 논거를 누르는가? 그리고 결정된 등급을 거울 이슈(issue-004,
      issue-013)에 일괄 적용하는 것이 타당한가?
