  - issue_id: issue-002
    root_cause_hypothesis: 기존 필드(priority, is_stat)를 정리하지 않은 채 StatOrder 하위 타입을 추가하는
      누적식 모델 진화를 수용하고 canonical 표현 선언을 생략한 결정
    root_confidence: medium
