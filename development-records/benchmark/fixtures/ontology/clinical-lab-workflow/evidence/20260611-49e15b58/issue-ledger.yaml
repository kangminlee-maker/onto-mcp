  - issue_id: issue-003
    root_cause_hypothesis: 위험치 통보라는 결과 수준 사건(결과당 0~N회)을 행위자·시각·수신자를 갖는 독립 사건 개념으로
      모델링하지 않고, 카탈로그 수준 임계 규칙 엔티티(CriticalValue)의 boolean 속성으로 축약한 채 증적을 종이 전화
      기록 대장에 위임한 결정이 근본 원인이며, 같은 플래그 축약 패턴이 검증·취소·정정 행위에도 반복된다.
      CriticalRange(규칙)와 CriticalValueNotification(사건) 분리 및 감사 이벤트 개념 도입으로 네 발견이
      모두 해소되면 참이다.
    root_confidence: high
    surface_finding_ids:
      - finding-003
      - finding-011
      - finding-038
      - finding-030
    relation_refs:
      - rel-021
      - rel-022
      - rel-023
    raised_by_lens_ids:
      - axiology
      - coverage
      - structure
      - semantics
    issue_statement: CriticalValue가 임계 범위 규칙과 통보 사건이라는 서로 다른 존재론적 유형을 한 엔티티에 혼합하고 있어
      결과별 통보 상태를 표현할 자리가 구조적으로 없으며, 환자 안전상 가장 중요한 추적 정보(통보 시각·수신자)가 모델 밖 종이 대장에
      정당화 없이 위임되어 있고, 통제 행위(검증·취소·정정) 전반에 행위자·시각·근거 감사 차원이 결손되어 있다.
    proposed_action: "CriticalValue를 임계 범위 정의(카탈로그 수준 CriticalRange)와 통보 사건(결과 수준
      CriticalValueNotification: result_ref, notified_at, notified_to)으로 분리하고,
      Result→CriticalValue 판정 관계(flagged_by)를 그래프에 추가하며, 검증·취소·정정 등 통제 행위에도
      actor·timestamp·reason을 담는 감사 이벤트 개념을 도입해 notified boolean을 파생 상태로 강등한다."
    affected_purpose: 위험치 통보 등 안전-critical 통제 행위의 행위자·시각·근거를 EMR/LIS 통합 시스템이 결과 단위로
      추적·감사 가능하게 하는 개념 권위 제공
    failure_condition: 동일 검사에서 두 번째 이상의 위험치 결과가 발생하거나, 특정 결과에 대한 통보 여부·시각·수신자를 사후
      입증·조회·감사해야 하는 모든 경우
