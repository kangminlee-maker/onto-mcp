      수렴했다(logic 소관 외). relations 어디에도 Patient가 등장하지 않는다는 구조 증거가 직접 관찰된다. 검체
      뒤바뀜이라는 가장 직접적인 환자 안전 위험이 모델 수준에서 비가시화되므로 safety_risk이며, collected_from 직접
      관계 추가라는 합의 시정으로 대상 내에서 즉시 닫혀야 한다.
