    problem_definition: 결과 상태의 권위 좌석이 Result.status와 Report.result_status 두 곳에 선언되고
      야간 배치 동기화 지연이 정상 동작으로 명문화되어, 정정된 결과가 최대 24시간 권위 값으로 미반영되는 동작을 권위 문서가
      제도화한다.
