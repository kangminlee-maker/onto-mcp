      구조에서 표준 코드를 도입하려면 test_code의 의미를 재정의(로컬→표준)하거나 속성을 추가해야 하고, 전자는 기존
      Result.test_ref 데이터의 해석 연속성을 깨며 후자는 스키마 변경이다. 다기관 통합 시 동일 test_code 문자열이
