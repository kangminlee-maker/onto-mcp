    claim: 검체 타입이 두 엔티티에 각각 하드코딩된 닫힌 enum이어서, 새 검체 유형(CSF, 대변, 타액 등) 추가 시 최소 두 곳의
      스키마 수정이 필요하고 Assay의 자유 문자열과는 매핑조차 없다.
    lens_rationale_summary: 임상검사실은 CSF, 대변, 객담, 골수 등 검체 유형이 일상적으로 추가되는 도메인이다. 닫힌
      enum의 중복 정의는 새 유형 수용 시 두 정의의 동기 수정을 강제하고, 한쪽만 수정되면 Test가 요구하는 검체 타입을
      Specimen이 표현할 수 없는 비대칭이 생긴다. Assay.specimen_kind(자유 문자열)까지 합치면 같은 개념의 세 번째
      표현이며 SNOMED/HL7 specimen type 코드 채택 시 세 곳 모두 마이그레이션 대상이 된다.
    proposed_action: SpecimenType을 독립 카탈로그 개념(코드 + 표시명, 필요 시 외부 코드 체계 매핑 필드 포함)으로
      승격하고 Specimen, Test, Assay가 모두 이를 ref로 참조하게 한다. 그러면 새 검체 유형 추가가 카탈로그 행 추가로
      끝난다.
    affected_purpose: "새 검사·검체 유형을 기존 구조 수정 없이 수용하는 확장성 (검토 목표: scope_control)"
