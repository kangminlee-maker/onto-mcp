  - finding_id: finding-015
    lens_id: evolution
    source_ref: .onto/review/20260611-49e15b58/round1/evolution.findings.yaml#evolution-candidate-002
    target: clinical-lab-ontology.yaml entities.Order (priority, is_stat) /
      entities.StatOrder
    evidence_anchor: Order.priority enum [routine, urgent, stat], Order.is_stat
      boolean, StatOrder is_a Order
    claim: 긴급도가 enum 값, boolean 플래그, 하위 타입 세 가지 메커니즘으로 중복 인코딩되어 있어, 긴급도 체계 확장 시 세 곳을
      동시 수정해야 하고 표현 간 모순 상태가 가능하다.
    lens_rationale_summary: "새 긴급 등급(예: ASAP, timed) 추가 시 enum 수정 + boolean 의미 재해석 +
      하위 타입 추가 여부 결정이 모두 필요하다. 또한 is_stat=true이면서 priority=routine인 인스턴스,
      StatOrder가 아니면서 priority=stat인 인스턴스를 막을 제약이 없어, 연동 시스템마다 다른 필드를 읽으면 동작이
      갈라진다. 변경 내성 관점에서 '한 개념 한 표현' 원칙 위반은 모든 긴급도 관련 확장의 비용을 3배로 만든다."
    proposed_action: priority enum을 단일 권위로 지정하고 is_stat을 priority의 파생 투영(derived)으로
      강등하거나 제거한다. StatOrder는 stat_reason 한 속성만 추가하므로 하위 타입을 없애고 stat_reason을
      Order의 조건부 속성(priority=stat일 때 필수)으로 흡수한다.
