    evidence_anchor: "Result.status [preliminary, final, corrected] vs
      Report.result_status [prelim, finalized, amended]; state_rules: '동기화 배치는
      야간 1회'"
    claim: 결과 상태가 서로 다른 두 어휘로 이중 관리되고 야간 배치로만 동기화되므로, 상태 어휘 확장 시 두 enum과 매핑 규칙을 모두
      수정해야 하고 변경 사이의 연속성 공백이 구조화되어 있다.
    lens_rationale_summary: "새 결과 상태(예: cancelled, entered-in-error — HL7/FHIR 표준 결과
      상태에 존재)를 수용하려면 두 enum 추가 + 암묵적 매핑(preliminary↔prelim 등) 갱신 + 배치 로직 수정이 모두
      필요하다. 외부 표준(HL7 OBX-11, FHIR DiagnosticReport.status) 채택 시 어느 어휘를 매핑 기준으로
      삼을지 결정 불가하다. 또한 corrected→amended 전파가 최대 하루 지연되는 동안 임상의가 '신뢰하라'고 명시된
      Report 값이 구식이 되는 연속성 단절이 모델 자체에 내장되어 있다."
    proposed_action: 하나의 상태 어휘를 권위로 선언하고(Result.status 권장), Report.result_status를 그
