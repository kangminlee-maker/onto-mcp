  - finding_id: finding-017
    lens_id: evolution
    source_ref: .onto/review/20260611-49e15b58/round1/evolution.findings.yaml#evolution-candidate-004
    target: clinical-lab-ontology.yaml entities.Specimen.specimen_type /
