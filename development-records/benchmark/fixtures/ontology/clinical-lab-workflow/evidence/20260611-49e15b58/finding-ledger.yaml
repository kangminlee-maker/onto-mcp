findings:
  - finding_id: finding-001
    lens_id: axiology
    source_ref: .onto/review/20260611-49e15b58/round1/axiology.findings.yaml#axiology-candidate-001
    target: clinical-lab-ontology.yaml — Result.status / Report.result_status /
      state_rules[1]
    evidence_anchor: 'clinical-lab-ontology.yaml: Result.status
      note("Report.result_status에도 동일 정보가 유지된다"), Report.result_status note("권위
      값. 임상의는 이 값을 신뢰한다"), state_rules[1]("동기화 배치는 야간 1회")'
    claim: 결과 상태의 권위 좌석이 둘로 선언되어 있고 야간 배치 동기화 지연이 정상 동작으로 명문화되어 있어, '개념 권위 문서'라는 선언된
      목적과 임상의 신뢰 약속을 동시에 위반한다.
    lens_rationale_summary: "이 문서의 선언된 목적은 EMR/LIS 통합의 개념 권위 문서이다(파일 헤더 주석). 권위 문서가
      동일 사실에 대해 두 개의 truth seat를 선언하고 그 사이에 최대 24시간의 비동기 창을 정상 규칙으로 수용하면, '임상의는
      이 값을 신뢰한다'는 명시적 이해관계자 약속이 구조적으로 깨진다. corrected 결과가 나온 뒤에도 임상의가 보는 보고서는 하루
      동안 finalized로 표시될 수 있는데, 이 트레이드오프(배치 비용 절감 vs 임상 신뢰)는 어떤 정당화도 없이 note와
      state_rule에 암묵 수용되어 있다. 가치 유형: purpose+commitment, 정렬 방향: misaligned. 권위
      앵커: 대상 문서 헤더의 목적 선언 및 review-value-alignment-criteria.yaml criterion
      user-request-intent."
    proposed_action: "결과 상태의 권위 좌석을 하나로 선언하고(권장: Result.status를 원천으로,
      Report.result_status는 파생 projection으로 명시), enum 어휘를 단일화하며, corrected 발생 시
      보고서 상태 반영의 허용 지연 한계를 임상 신뢰 약속에 맞게 명시적으로 정당화하거나 즉시 전파로 규정한다."
    affected_purpose: EMR/LIS 통합의 개념 권위 문서로서 결과 상태의 단일 진실을 제공하고 임상의 신뢰를 보장한다는 선언된 목적
    failure_condition: Result.status가 corrected로 변경된 후 야간 배치 실행 전까지의 구간에서 EMR이
      Report.result_status(권위 값으로 선언됨)를 조회하는 모든 경우
    impact: 통합 설계자가 이 문서를 그대로 따르면 정정된 결과가 임상의에게 최대 24시간 미표시되는 동작이 '사양대로'가 되어, 권위 문서
      자체가 환자 안전 관련 신뢰 약속 위반을 제도화한다.
    evidence_refs:
      - .onto/review/20260611-49e15b58/round1/axiology.findings.yaml#axiology-candidate-001
      - clinical-lab-ontology.yaml Result.status note
      - clinical-lab-ontology.yaml Report.result_status note
      - clinical-lab-ontology.yaml state_rules[1]
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS 통합의 개념 권위 문서로서 결과 상태의 단일 진실을 제공하고 임상의 신뢰를 보장한다는 선언된 목적
      failure_condition: Result.status가 corrected로 변경된 후 야간 배치 실행 전까지의 구간에서 EMR이
        Report.result_status(권위 값으로 선언됨)를 조회하는 모든 경우
      impact: 통합 설계자가 이 문서를 그대로 따르면 정정된 결과가 임상의에게 최대 24시간 미표시되는 동작이 '사양대로'가 되어, 권위 문서
        자체가 환자 안전 관련 신뢰 약속 위반을 제도화한다.
      evidence_refs:
        - clinical-lab-ontology.yaml Result.status note
        - clinical-lab-ontology.yaml Report.result_status note
        - clinical-lab-ontology.yaml state_rules[1]
    causal_path:
      root_cause_candidate: 결과 상태라는 단일 개념의 권위 좌석을 정하지 않은 채 LIS 기록 관행(Result)과 임상의 노출
        관행(Report)을 각각 그대로 모델에 옮긴 설계 결정
      root_cause_step_id: finding-001.cause-003
      steps:
        - cause_id: finding-001.cause-001
          claim: 임상의가 신뢰한다고 선언된 Report.result_status가 원천 상태(corrected)와 최대 24시간 불일치할 수 있다
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml state_rules[1]
        - cause_id: finding-001.cause-002
          claim: 불일치는 동일 사실이 두 entity에 서로 다른 enum으로 이중 보관되고 동기화가 배치에 위임되었기 때문에 발생한다
          relation_to_previous: symptom_of
          evidence_refs:
            - clinical-lab-ontology.yaml Result.status note
            - clinical-lab-ontology.yaml Report.result_status note
        - cause_id: finding-001.cause-003
          claim: 이중 보관은 권위 좌석 단일화 없이 기존 운영 관행을 병기한 모델링 결정이 가능하게 했다
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml Result.status note("LIS가 기록하며"),
              Report.result_status note("권위 값")
      unresolved_beyond_evidence: 야간 배치라는 운영 제약이 외부 시스템의 실제 한계인지, 단순 관행인지는 본 경계 내 증거로 확인 불가
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260611-49e15b58/round1/axiology.findings.yaml#axiology-candidate-002
    target: clinical-lab-ontology.yaml — Order.priority / Order.is_stat / StatOrder
    evidence_anchor: 'clinical-lab-ontology.yaml: Order.priority enum [routine,
      urgent, stat], Order.is_stat note("priority와 함께 기록"), StatOrder(is_a:
      Order, stat_reason)'
    claim: 응급(STAT)이라는 단일 개념이 enum 값·boolean 속성·하위 타입의 세 가지 독립 표현으로 존재하며 우선순위 규칙이
      없어, 권위 문서가 가장 시간 민감한 워크플로에서 단일 진실을 제공하지 못한다.
    lens_rationale_summary: "STAT 주문은 임상검사 워크플로에서 환자 안전상 가장 시간 민감한 경로이며, EMR/LIS 통합
      설계자가 이 문서를 권위로 삼을 때 STAT 판정 로직이 시스템마다 다른 필드를 참조하게 될 위험을 문서 자체가 만들어낸다(예:
      priority=stat이지만 is_stat=false인 인스턴스의 의미가 미정의). 이는 표현 편의(기존 필드 유지 + 하위 타입
      추가)라는 국소 선택이 '개념 권위'라는 전체 목적을 훼손하는 사례다. 가치 유형: purpose, 정렬 방향: misaligned.
      권위 앵커: 대상 문서 헤더의 목적 선언 및 user-request-intent criterion."
    proposed_action: "STAT의 canonical 표현을 하나로 선언하고(권장: priority enum 단일 표현),
      is_stat은 파생 projection으로 강등하거나 제거하며, StatOrder 하위 타입은 stat_reason이 별도
      lifecycle·검증·권한을 요구할 때만 유지하고 그렇지 않으면 stat_reason을 Order의 조건부 속성으로 흡수한다.
      유지하는 경우 세 표현 간 일관성 제약을 명문화한다."
    affected_purpose: EMR/LIS 통합 시스템들이 STAT 주문을 일관되게 식별·우선처리하도록 하는 개념 권위 제공
    failure_condition: 통합되는 두 시스템이 STAT 판정에 서로 다른 표현(priority vs is_stat vs 타입)을
      기준으로 채택하고, 세 표현이 불일치하는 인스턴스가 생성되는 경우
    impact: 응급 검사가 일반 경로로 처리되거나 그 역이 발생할 수 있는 분기점을 권위 문서가 스스로 내장하므로, 문서의 적합성 판단(사용자
      요청의 핵심)에 직접 영향을 준다.
    evidence_refs:
      - .onto/review/20260611-49e15b58/round1/axiology.findings.yaml#axiology-candidate-002
      - clinical-lab-ontology.yaml Order.priority
      - clinical-lab-ontology.yaml Order.is_stat
      - clinical-lab-ontology.yaml StatOrder
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS 통합 시스템들이 STAT 주문을 일관되게 식별·우선처리하도록 하는 개념 권위 제공
      failure_condition: 통합되는 두 시스템이 STAT 판정에 서로 다른 표현(priority vs is_stat vs 타입)을
        기준으로 채택하고, 세 표현이 불일치하는 인스턴스가 생성되는 경우
      impact: 응급 검사가 일반 경로로 처리되거나 그 역이 발생할 수 있는 분기점을 권위 문서가 스스로 내장하므로, 문서의 적합성 판단(사용자
        요청의 핵심)에 직접 영향을 준다.
      evidence_refs:
        - clinical-lab-ontology.yaml Order.priority
        - clinical-lab-ontology.yaml Order.is_stat
        - clinical-lab-ontology.yaml StatOrder
    causal_path:
      root_cause_candidate: 기존 필드(priority, is_stat)를 정리하지 않은 채 StatOrder 하위 타입을 추가하는
        누적식 모델 진화를 수용하고 canonical 표현 선언을 생략한 결정
      root_cause_step_id: finding-002.cause-003
      steps:
        - cause_id: finding-002.cause-001
          claim: STAT 여부의 판정 기준이 세 표현 중 무엇인지 미정의여서 통합 시스템 간 판정 분기가 가능하다
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml Order.priority/is_stat/StatOrder 정의
        - cause_id: finding-002.cause-002
          claim: 분기 가능성은 세 표현 사이에 일관성 제약과 우선순위 규칙이 전혀 규정되지 않았기 때문에 발생한다
          relation_to_previous: symptom_of
          evidence_refs:
            - clinical-lab-ontology.yaml relations/state_rules에 STAT 표현 간 제약 부재
        - cause_id: finding-002.cause-003
          claim: 제약 부재는 표현을 추가만 하고 통합하지 않는 모델 관리 방식이 가능하게 했다
          relation_to_previous: enables
          evidence_refs:
            - clinical-lab-ontology.yaml is_stat note("priority와 함께 기록")
      unresolved_beyond_evidence: "세 표현이 서로 다른 소스 시스템의 제약(예: 레거시 EMR 필드)을 반영한 것인지는 본 경계 내 증거로 확인 불가"
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260611-49e15b58/round1/axiology.findings.yaml#axiology-candidate-003
    target: clinical-lab-ontology.yaml — CriticalValue.notified
    evidence_anchor: 'clinical-lab-ontology.yaml: CriticalValue.notified note("통보 완료
      여부. 통보 시각과 수신자는 전화 기록 대장에 있다")'
    claim: 환자 안전상 가장 중요한 추적 정보(위험치 통보의 시각·수신자)를 모델 경계 밖 종이 대장에 두는 트레이드오프가 정당화 없이
      수용되어, EMR/LIS 통합 권위 문서로서의 목적과 환자 안전 이해관계자 약속을 불리하게 한다.
    lens_rationale_summary: "이 온톨로지의 목적은 EMR/LIS '통합'의 개념 권위인데, 위험치 통보는 그 통합이 디지털로
      추적해야 할 가장 안전-critical한 흐름이다. boolean 단순화라는 국소 최적화가 '누가 언제 통보받았는가'라는 질문을 통합
      시스템에서 영구히 답할 수 없게 만들며, 이 배제는 어떤 명시적 정당화나 후속 계획(notes 섹션에도 없음) 없이 note 한 줄로
      수용되어 있다. 또한 CriticalValue가 '값 범위'(카탈로그 개념)와 '통보 사건'(인스턴스 개념)을 한 entity에 섞고
      있어 통보 사건을 모델링할 자리 자체가 없다. 가치 유형: stakeholder+tradeoff, 정렬 방향: misaligned.
      권위 앵커: 대상 문서 헤더의 목적 선언 및 user-request-intent criterion(운영 시 생길 위험 중심 검토
      요청)."
    proposed_action: CriticalValue를 임계 범위 정의(카탈로그)와 CriticalValueNotification
      사건(notified_at, notified_to, acknowledged 등)으로 분리하고, 전화 대장 위임을 유지하더라도 그것이
      의도적 out-of-scope 결정임을 근거와 함께 notes에 명시한다.
    affected_purpose: 운영 위험을 드러내고 안전-critical 흐름을 통합 시스템이 추적 가능하게 하는 개념 권위 제공
    failure_condition: 위험치 통보의 증적(시각·수신자)을 EMR/LIS 통합 시스템에서 조회·감사해야 하는 모든 경우
    impact: 권위 문서를 따르는 통합 설계는 안전-critical 감사 질문에 답할 수 없는 시스템을 만들게 되며, 이 배제가 의도적 결정인지
      누락인지조차 문서로 판별할 수 없다.
    evidence_refs:
      - .onto/review/20260611-49e15b58/round1/axiology.findings.yaml#axiology-candidate-003
      - clinical-lab-ontology.yaml CriticalValue.notified note
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 운영 위험을 드러내고 안전-critical 흐름을 통합 시스템이 추적 가능하게 하는 개념 권위 제공
      failure_condition: 위험치 통보의 증적(시각·수신자)을 EMR/LIS 통합 시스템에서 조회·감사해야 하는 모든 경우
      impact: 권위 문서를 따르는 통합 설계는 안전-critical 감사 질문에 답할 수 없는 시스템을 만들게 되며, 이 배제가 의도적 결정인지
        누락인지조차 문서로 판별할 수 없다.
      evidence_refs:
        - clinical-lab-ontology.yaml CriticalValue.notified note
    causal_path:
      root_cause_candidate: 기존 종이 기반 운영 관행(전화 기록 대장)을 디지털 통합 목적에 맞게 재설계하지 않고 모델 경계 밖으로
        그대로 둔 채 boolean 플래그만 도입한 결정
      root_cause_step_id: finding-003.cause-002
      steps:
        - cause_id: finding-003.cause-001
          claim: 통보 시각·수신자가 모델에 없어 통합 시스템이 위험치 통보 증적을 추적할 수 없다
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml CriticalValue attributes
        - cause_id: finding-003.cause-002
          claim: 추적 불가는 통보를 사건이 아닌 boolean 속성으로 축약하고 증적을 종이 대장에 위임한 모델링 선택의 결과다
          relation_to_previous: symptom_of
          evidence_refs:
            - clinical-lab-ontology.yaml CriticalValue.notified note
      unresolved_beyond_evidence: 전화 대장 유지가 규제·운영상 불가피한 제약인지 여부는 본 경계 내 증거로 확인 불가
  - finding_id: finding-004
    lens_id: axiology
    source_ref: .onto/review/20260611-49e15b58/round1/axiology.findings.yaml#axiology-candidate-004
    target: clinical-lab-ontology.yaml — Test/Assay 이중 카탈로그 및 notes[0]
    evidence_anchor: "clinical-lab-ontology.yaml: Test(requires_specimen_type enum)
      vs Assay(specimen_kind 자유 문자열 'WB','Serum','Urine-random'), notes[0](\"현재
      신규 항목은 두 곳 모두 등록\")"
    claim: 검사 카탈로그라는 단일 개념을 Test와 Assay로 이중 유지하고 신규 항목 이중 등록을 표준 운영으로 명문화한 것은, 통합 여부
      재검토라는 연기 결정의 비용(어휘 분기·드리프트)을 정당화 없이 권위 문서에 전가한 숨은 트레이드오프다.
    lens_rationale_summary: "권위 문서의 존재 이유는 통합 대상 시스템들에 단일 개념 어휘를 제공하는 것인데, 문서 스스로 동일
      개념의 평행 어휘 두 벌과 그 사이의 매핑 부재를 표준으로 선언하면 권위 기능이 그 지점에서 정지한다. '카탈로그 정비 후 재검토'는
