  - finding_id: finding-031
    lens_id: semantics
    source_ref: .onto/review/20260611-49e15b58/round1/semantics.findings.yaml#semantics-candidate-004
    target: clinical-lab-ontology.yaml Order.priority / Order.is_stat / StatOrder
    evidence_anchor: "clinical-lab-ontology.yaml:
      entities.Order.attributes.priority, entities.Order.attributes.is_stat,
      entities.StatOrder"
    claim: "'응급(STAT)'이라는 하나의 의미가 priority enum 값, is_stat boolean, StatOrder 하위 타입의
      세 가지 표현으로 중복 인코딩되어 있고, 하위 타입화는 OntoClean Rigidity 관점에서도 부적절하다."
    lens_rationale_summary: 긴급도는 주문의 속성이지 주문 인스턴스의 본질(rigid property)이 아니다. 운영상 STAT
      주문이 routine으로 하향 조정될 수 있다면 StatOrder 타입 소속은 인스턴스에 필수적이지 않아 rigid subtype으로
      부적절하다(OntoClean anti-rigidity). 또한 같은 의미의 세 표현은 EMR/LIS 통합 시 어떤 필드를 STAT
      판정 기준으로 쓸지에 대한 비결정성을 만들고, 세 값이 어긋난 레코드의 의미를 해석할 규칙이 없다.
    proposed_action: priority enum을 STAT 여부의 단일 권위로 선언하고, is_stat은 제거하거나
      priority=stat의 파생 투영으로 명시한다. StatOrder는 rigid 하위 타입 대신 stat_reason을 Order의
