    issue_statement: Test, Assay, and specimen-kind representations lack a governed
      mapping authority for orderable, performable, and code-set meanings.
    proposed_action: Clarify Test/Assay roles or consolidate them, and introduce
      explicit mapping/code-set authority with cardinality, ownership, aliases,
      version/effective dates, active/retired status, and specimen-kind
      inheritance or override rules.
