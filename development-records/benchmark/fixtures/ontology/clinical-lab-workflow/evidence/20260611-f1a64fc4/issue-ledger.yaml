  - issue_id: issue-009
    root_cause_hypothesis: One mutable Report.result_status field is used both for
      release-time finalization and later amendment obligations after corrected
      results.
    root_confidence: high
    surface_finding_ids:
      - finding-011
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: Finalized and amended semantics are not separated, so a
      released report can later be required to leave its finalized state.
    proposed_action: Separate immutable release/finalization facts from mutable
      amendment/display lifecycle, or define finalized as non-terminal with
      explicit corrected/amended precedence rules.
    affected_purpose: EMR/LIS status integration authority for completion semantics
      and invalid/edge-case behavior.
    failure_condition: A result is corrected after the report has already been
      released or finalized.
    impact: Consumers cannot know whether finalized is stable completion or mutable
      display state, leading to incompatible caching, closure, and display
      assumptions.
    evidence_refs:
      - .onto/review/20260611-f1a64fc4/round1/logic.findings.yaml#logic-candidate-001
      - "clinical-lab-ontology.yaml: Report.result_status enum values [prelim,
        finalized, amended]"
      - "clinical-lab-ontology.yaml: state_rules second rule"
      - "clinical-lab-ontology.yaml: Report.result_status values [prelim,
        finalized, amended]; state_rules second rule: released_at makes Report
        finalized, but corrected Result requires Report.result_status amended
        via nightly batch"
