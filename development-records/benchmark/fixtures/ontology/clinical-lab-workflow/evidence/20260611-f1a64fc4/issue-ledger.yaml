  - issue_id: issue-004
    root_cause_hypothesis: The CriticalValue model collapses threshold/range
      definition and patient-specific notification-event state into one entity,
      producing both semantic ambiguity and missing notification audit coverage.
    root_confidence: medium
    surface_finding_ids:
      - finding-004
      - finding-015
    relation_refs:
      - rel-002
    raised_by_lens_ids:
      - coverage
      - semantics
    issue_statement: "Shared-root issue across finding-004, finding-015: The
      CriticalValue model collapses threshold/range definition and
      patient-specific notification-event state into one entity, producing both
      semantic ambiguity and missing notification audit coverage."
    proposed_action: Add a `CriticalValueNotification` or equivalent event entity
      related to `CriticalValue`, `Result`, `Order`/`Patient`, notifying
      `Staff`, recipient/clinician, timestamp, channel, acknowledgement
      status/time, and evidence/source reference. Replace or derive `notified`
      from this event rather than making it the only concept. /
      CriticalValueRange 또는 CriticalThreshold를 기준 정의로 두고, 특정 Result가 기준을 위반한 사건은
      CriticalResultNotification 같은 별도 개념으로 분리합니다. notified는 사건/통보 엔티티에 두고
      시각·수신자 등 권위 기록과의 참조를 모델링합니다.
    affected_purpose: Use as the EMR/LIS integration concept authority for entities,
      relations, and states from order through report. / 위험 결과와 통보 상태의 의미를 안전하게
      교환하기 위한 EMR/LIS 개념 권위 목적.
    failure_condition: When a critical result must be communicated or audited, the
      authoritative ontology cannot represent the notification event or its
      evidence beyond a boolean flag. / 검사별 임계 범위 설정과 특정 결과의 통보 완료 상태가 같은
      CriticalValue 인스턴스로 해석되는 경우.
    impact: Downstream systems can diverge on notification evidence,
      acknowledgement, and audit requirements, weakening clinical safety and
      operational accountability for a safety-critical workflow. / 위험 결과 통보가 기준
      설정인지 환자별 이벤트인지 구분되지 않아 통보 누락, 중복 통보, 감사 추적 불능 같은 운영 위험이 생길 수 있습니다.
