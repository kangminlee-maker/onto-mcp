  - issue_id: issue-002
    root_cause_hypothesis: The ontology models critical notification as a boolean
      attribute while delegating notification evidence to an external phone log
      that is not represented as an authority boundary or relation.
    root_confidence: medium
    surface_finding_ids:
      - finding-002
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: CriticalValue를 즉시 통보가 필요한 값으로 정의하면서 통보 권위를 외부 전화 기록 대장으로 밀어 개념
      권위 문서의 목적을 약화합니다.
    proposed_action: "`CriticalNotification` 또는 유사 개념을 도입해 `CriticalValue`/`Result`와
      연결하고 notified_at, notified_to, notified_by, acknowledgement/status,
      failure/retry 상태를 모델링하십시오. 외부 전화 기록 대장이 계속 권위라면 해당 대장을 명시적 external
      authority로 선언하고 EMR/LIS가 소비할 최소 동기화 계약을 적으십시오."
    affected_purpose: EMR/LIS 통합에서 임상적으로 위험한 결과의 즉시 통보 책임과 상태를 개념적으로 정렬하는 목적.
    failure_condition: CriticalValue 발생 후 통보의 시각·수신자·책임자·실패 상태가 온톨로지 권위 안에서 표현되거나 검증되지 않는 경우.
    impact: 즉시 통보라는 핵심 이해관계자 약속이 단순 불리언과 외부 메모로 축소되어 운영 감사와 시스템 연동 설계의 신뢰성이 약해집니다.
