      rationale: "finalized가 stable completion인지 mutable display state인지 소비자가 다르게 해석할
        수 있습니다. corrected-after-release path에서 completion predicate correctness가
        약해집니다. Source finding context: clinical-lab-ontology.yaml state_rules /
        Report.result_status synchronization Source finding context:
        clinical-lab-ontology.yaml: Report.result_status values [prelim,
        finalized, amended]; state_rules second rule: released_at makes Report
        finalized, but corrected Result requires Report.result_status amended
        via nightly batch Source finding context: A report can be required to be
        both finalized and amended after a corrected result, so the completion
        status depends on a later reversible result state. Source finding
        context: The conflict is temporal rather than only a naming issue: the
        rule set first makes finalized true at `released_at`, then permits a
        later `Result.status=corrected` event that requires the report status to
        become amended. That makes a completion/terminal interpretation of
        `finalized` unstable on an allowed state path, weakening the ontology as
        an EMR/LIS authority document for status precedence and caller-facing
        state contracts. Logic-specific verdict: fail. conflict_pair:
        `clinical-lab-ontology.yaml: Report.result_status enum values [prelim,
        finalized, amended]` vs `clinical-lab-ontology.yaml: state_rules[2]`.
        satisfiability_note: inter-claim; the release rule and correction rule
        can both apply to the same Report over time. modality_note: mixed
        necessary/obligatory; finalized is assigned necessarily at release while
        amended is obligatory after correction. boundary_handoff_note: semantics
        may need to decide whether `finalized` means terminal finality or merely
        released-final display, but the temporal contradiction remains unless
        that meaning is explicitly constrained. Source finding context: Separate
        immutable release/finalization facts from mutable amendment display
        state, for example keep `released_at`/`finalized_at` as release facts
        and model `report_status` as a lifecycle that allows `finalized ->
        amended`; or define `finalized` as non-terminal and add explicit
        precedence rules for corrected/amended states. Source finding context:
        .onto/review/20260611-f1a64fc4/round1/logic.findings.yaml#logic-candida\
        te-001 Source finding context: Use the ontology as the conceptual
        authority for EMR/LIS status integration and invalid/edge-case behavior.
        Source finding context: A result is corrected after a report has already
        been released/finalized, which the ontology explicitly allows by
        requiring a later amended status update. Source finding context:
        Consumers cannot know whether finalized is a stable completion state or
        a mutable display status, so EMR/LIS integrations may cache, close, or
        display reports under mutually incompatible status assumptions. Source
        finding context: The ontology uses one mutable Report.result_status
        field for both release-time finalization and later amendment
        obligations. Source finding context: Report.result_status is the
        authority value clinicians trust and has values `prelim`, `finalized`,
        and `amended`. Source finding context: The state rule assigns finalized
        at the time `released_at` is recorded. Source finding context: The same
        rule requires a later corrected Result.status to make
        Report.result_status amended, with synchronization delayed to a nightly
        batch. Source finding context: Therefore a report that was already
        finalized can later be obligated to stop being finalized and become
        amended, unless finalization is explicitly non-terminal or split from
        amendment status."
