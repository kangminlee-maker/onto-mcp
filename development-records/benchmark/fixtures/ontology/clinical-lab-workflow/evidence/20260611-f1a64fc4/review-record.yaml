    judgment_state: observed
    impact_kind: maintainability_evolvability
    timing_class: planned_follow_up
    closure_class: carry_forward
    closure_obligation: may_close_during_next_stage
    domain_axes: {}
    rationale: issue-001의 status-authority 문제가 future state/code 추가 시 드러나는 확장성
      증상입니다. medium severity로 추적하되 핵심 권위 모델 정리와 함께 해소될 수 있습니다.
    related_surface_finding_ids:
      - finding-009
  - issue_id: issue-008
    problem_definition: TAT 변경 권위가 ontology 내부 규칙이 아니라 외부 dashboard formula에 남아
      metric versioning과 예외 처리가 분산됩니다.
    issue_role: symptom
    judgment_state: observed
    impact_kind: maintainability_evolvability
    timing_class: planned_follow_up
    closure_class: carry_forward
    closure_obligation: may_close_during_next_stage
    domain_axes: {}
    rationale: issue-003의 metric governance 결함이 change/evolution 상황에서 나타나는 증상입니다.
      medium severity이나 source timestamps가 있어 governed derived metric으로 carrying
      forward 가능합니다.
    related_surface_finding_ids:
      - finding-010
  - issue_id: issue-009
    problem_definition: Report.result_status 하나가 release-time finalization과 later
      amendment lifecycle을 동시에 담아 finalized 의미가 불안정합니다.
    issue_role: conflicting_interpretation
    judgment_state: observed
    impact_kind: correctness
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: finalized가 stable completion인지 mutable display state인지 소비자가 다르게 해석할 수
      있습니다. corrected-after-release path에서 completion predicate correctness가
      약해집니다.
    related_surface_finding_ids:
      - finding-011
  - issue_id: issue-010
    problem_definition: STAT urgent-order 의미가 priority enum, boolean flag, subtype에
      동시에 존재해 canonical authority가 갈라집니다.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: urgent routing과 invalid-input behavior에 직접 영향을 주는 medium authority
      split입니다. 서로 다른 시스템이 다른 STAT 표면을 권위로 삼을 수 있으므로 target에서 canonical
      representation을 정해야 합니다.
    related_surface_finding_ids:
      - finding-013
  - issue_id: issue-011
    problem_definition: Specimen produces Result 관계명이 specimen에 생산 agency를 부여해 graph
      해석을 혼동시킬 수 있습니다.
    issue_role: independent_issue
    judgment_state: observed
    impact_kind: usability
    timing_class: defer_watch
    closure_class: document_only
    closure_obligation: planned_later
    domain_axes: {}
    rationale: bounded evidence상 material workflow failure가 아니라 low severity
      relation-label clarity 문제입니다. 별도 독립 개선 항목으로 기록하되 핵심 closure를 막지는 않습니다.
    related_surface_finding_ids:
      - finding-016
  - issue_id: issue-012
    problem_definition: 운영 workflow 표면이 명시 authority model 밖 attributes나 notes에 남아
      relation projection과 specimen lifecycle closure가 불명확합니다.
    issue_role: root_cause
    judgment_state: contested
    impact_kind: completeness
    timing_class: next_step_blocker
    closure_class: needs_decision
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: 하나의 shared-root issue로 유지되었지만 coverage, logic, semantics는 relation
      graph projection과 specimen lifecycle sub-concern으로 좁혔습니다. authority
      closure 방식을 결정해야 합니다.
    related_surface_finding_ids:
      - finding-017
      - finding-005
  - issue_id: issue-013
    problem_definition: Order completion rule이 어떤 Result 집합을 평가하는지 ordered Test와
      Result membership 구조로 닫히지 않았습니다.
    issue_role: root_cause
    judgment_state: observed
    impact_kind: correctness
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: completion 상태는 EMR/LIS workflow의 핵심 predicate인데 bounded Result set이
      없어 구현별 평가 집합이 달라질 수 있습니다. medium severity지만 target 안에서 구조적 path를 닫아야 합니다.
    related_surface_finding_ids:
      - finding-018
