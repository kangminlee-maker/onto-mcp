        Source finding context: Declared entities and ref attributes are not
        consistently represented in the top-level relations graph. Source
        finding context: The artifact is intended as the concept authority for
        EMR/LIS integration, and its explicit relations section is the
        structural graph consumers are likely to traverse. Because several
        declared concepts are absent from that graph, a consumer using relations
        as the canonical topology can miss patient ownership, ordered-test
        membership, assay execution linkage, and critical-value routing even
