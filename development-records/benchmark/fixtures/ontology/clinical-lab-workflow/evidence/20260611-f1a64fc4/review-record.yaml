        topology and therefore omits declared concepts that are only connected
        through attributes or notes. Source finding context: The ontology can
        produce incomplete integration mappings and graph validations even
        though the missing links are already implied by declared attributes.
        This weakens trust in the artifact as a bounded concept authority.
        Source finding context: The ontology has two unmerged relationship
        surfaces: typed ref attributes and the top-level relations list, without
        a rule that projects refs into relations. Source finding context:
        Several entity references are declared as attributes: Order.patient_ref
        targets Patient, Order.ordered_tests targets Test, Assay.department
        targets Department, and CriticalValue.test_ref targets Test. Source
        finding context: The top-level relations list omits Patient, Assay, and
        CriticalValue entirely, and it does not include Order-to-Test despite
        Order.ordered_tests. Source finding context: The declared relationship
        topology is therefore incomplete for consumers that use relations as the
        structural authority. Source finding context:
        clinical-lab-ontology.yaml: Specimen lifecycle Source finding context:
