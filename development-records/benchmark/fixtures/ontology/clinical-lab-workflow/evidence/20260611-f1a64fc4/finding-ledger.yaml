    lens_rationale_summary: STAT은 주문의 긴급도 상태 또는 우선순위 값으로 해석되는 속성인데, 이를 Order의 하위
      타입으로도 모델링하면 동일 주문이 priority=stat인지, is_stat=true인지, StatOrder 인스턴스인지 중 어느
      표현이 권위인지 불명확합니다. 또한 하위 타입은 더 고정적인 분류처럼 보이지만 STAT 여부는 운영상 주문 우선순위 속성으로 취급될
      가능성이 높아 존재론적 유형이 어긋납니다.
