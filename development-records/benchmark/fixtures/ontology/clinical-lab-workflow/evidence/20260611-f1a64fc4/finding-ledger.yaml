  - finding_id: finding-006
    lens_id: coverage
    source_ref: .onto/review/20260611-f1a64fc4/round1/coverage.findings.yaml#coverage-candidate-003
    target: "clinical-lab-ontology.yaml: Test and Assay catalog coverage"
    evidence_anchor: materialized-input.md:46-60; materialized-input.md:126-128
    claim: The model has parallel Test and Assay catalog concepts but lacks
      authority, mapping, versioning, and effective-period concepts for
      maintaining them.
    lens_rationale_summary: Catalog definitions and mappings are time-dependent and
      integration-critical. Without authority and lifecycle coverage, EMR
      orderables and LIS analyzer assays can drift while still appearing valid
      in the concept authority document.
    proposed_action: Introduce an explicit `TestAssayMapping` or catalog authority
      model with source-of-truth ownership, version/effective date range,
      active/retired status, and cardinality rules. Clarify whether `Test`
      orderables, `Assay` performables, or a separate catalog service owns each
      shared attribute.
    affected_purpose: Use as EMR/LIS integration authority for ordering and
      laboratory execution concepts.
    failure_condition: When a test orderable changes, maps to multiple assays, or is
      retired/replaced, the ontology cannot determine which catalog value is
      authoritative or valid for a given date.
    impact: Integrations may maintain duplicate or inconsistent catalog definitions,
      leading to wrong orderability, specimen requirements, or result mapping
      across EMR and LIS.
