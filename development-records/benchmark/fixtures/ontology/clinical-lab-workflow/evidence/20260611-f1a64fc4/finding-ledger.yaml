  - finding_id: finding-011
    lens_id: logic
    source_ref: .onto/review/20260611-f1a64fc4/round1/logic.findings.yaml#logic-candidate-001
    target: clinical-lab-ontology.yaml state_rules / Report.result_status
      synchronization
    evidence_anchor: "clinical-lab-ontology.yaml: Report.result_status values
      [prelim, finalized, amended]; state_rules second rule: released_at makes
      Report finalized, but corrected Result requires Report.result_status
      amended via nightly batch"
    claim: A report can be required to be both finalized and amended after a
      corrected result, so the completion status depends on a later reversible
      result state.
    lens_rationale_summary: "The conflict is temporal rather than only a naming
      issue: the rule set first makes finalized true at `released_at`, then
      permits a later `Result.status=corrected` event that requires the report
      status to become amended. That makes a completion/terminal interpretation
      of `finalized` unstable on an allowed state path, weakening the ontology
      as an EMR/LIS authority document for status precedence and caller-facing
      state contracts. Logic-specific verdict: fail. conflict_pair:
      `clinical-lab-ontology.yaml: Report.result_status enum values [prelim,
      finalized, amended]` vs `clinical-lab-ontology.yaml: state_rules[2]`.
      satisfiability_note: inter-claim; the release rule and correction rule can
      both apply to the same Report over time. modality_note: mixed
      necessary/obligatory; finalized is assigned necessarily at release while
      amended is obligatory after correction. boundary_handoff_note: semantics
      may need to decide whether `finalized` means terminal finality or merely
      released-final display, but the temporal contradiction remains unless that
      meaning is explicitly constrained."
    proposed_action: Separate immutable release/finalization facts from mutable
      amendment display state, for example keep `released_at`/`finalized_at` as
      release facts and model `report_status` as a lifecycle that allows
      `finalized -> amended`; or define `finalized` as non-terminal and add
      explicit precedence rules for corrected/amended states.
    affected_purpose: Use the ontology as the conceptual authority for EMR/LIS
      status integration and invalid/edge-case behavior.
    failure_condition: A result is corrected after a report has already been
      released/finalized, which the ontology explicitly allows by requiring a
      later amended status update.
    impact: Consumers cannot know whether finalized is a stable completion state or
      a mutable display status, so EMR/LIS integrations may cache, close, or
      display reports under mutually incompatible status assumptions.
    evidence_refs:
      - .onto/review/20260611-f1a64fc4/round1/logic.findings.yaml#logic-candidate-001
      - "clinical-lab-ontology.yaml: Report.result_status enum values [prelim,
        finalized, amended]"
      - "clinical-lab-ontology.yaml: state_rules second rule"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use the ontology as the conceptual authority for EMR/LIS
        status integration and invalid/edge-case behavior.
      failure_condition: A result is corrected after a report has already been
        released/finalized, which the ontology explicitly allows by requiring a
        later amended status update.
      impact: Consumers cannot know whether finalized is a stable completion state or
        a mutable display status, so EMR/LIS integrations may cache, close, or
        display reports under mutually incompatible status assumptions.
      evidence_refs:
        - "clinical-lab-ontology.yaml: Report.result_status enum values [prelim,
          finalized, amended]"
        - "clinical-lab-ontology.yaml: state_rules second rule"
    causal_path:
      root_cause_candidate: The ontology uses one mutable Report.result_status field
        for both release-time finalization and later amendment obligations.
      root_cause_step_id: finding-011.cause-004
      steps:
        - cause_id: finding-011.cause-001
          claim: Report.result_status is the authority value clinicians trust and has
            values `prelim`, `finalized`, and `amended`.
          relation_to_previous: null
          evidence_refs:
            - "clinical-lab-ontology.yaml: Report.result_status attribute note
              and values"
        - cause_id: finding-011.cause-002
          claim: The state rule assigns finalized at the time `released_at` is recorded.
          relation_to_previous: causes
          evidence_refs:
            - "clinical-lab-ontology.yaml: state_rules second rule"
        - cause_id: finding-011.cause-003
          claim: The same rule requires a later corrected Result.status to make
            Report.result_status amended, with synchronization delayed to a
            nightly batch.
          relation_to_previous: causes
          evidence_refs:
            - "clinical-lab-ontology.yaml: state_rules second rule"
        - cause_id: finding-011.cause-004
          claim: Therefore a report that was already finalized can later be obligated to
            stop being finalized and become amended, unless finalization is
            explicitly non-terminal or split from amendment status.
          relation_to_previous: causes
          evidence_refs:
            - "clinical-lab-ontology.yaml: Report.result_status values"
            - "clinical-lab-ontology.yaml: state_rules second rule"
      unresolved_beyond_evidence: The target does not formally state whether
        `finalized` is terminal; materiality is based on the rule wording that
        uses finalized as the release-time report state and authority display
        value.
  - finding_id: finding-012
    lens_id: semantics
    source_ref: .onto/review/20260611-f1a64fc4/round1/semantics.findings.yaml#semantics-candidate-001
    target: "clinical-lab-ontology.yaml: Result.status / Report.result_status"
    evidence_anchor: materialized-input.md:69-83, materialized-input.md:121-123
    claim: Result.status와 Report.result_status가 같은 정보라고 설명되지만 서로 다른 상태 어휘와 권위 주장을
      사용한다.
    lens_rationale_summary: 동일 정보라면 상태 값의 의미와 이름이 일관되어야 하는데 preliminary/prelim,
      final/finalized, corrected/amended가 서로 다른 어휘로 모델링되어 있습니다. 특히 corrected와
      amended는 결과 자체의 정정 상태와 보고서의 수정 보고 상태를 구분할 수도 있는 용어인데, 현재 문서는 이를 같은 정보라고
      하면서도 별도 권위 값으로 둡니다. EMR/LIS 통합의 개념 권위 문서에서는 이 상태가 임상의에게 표시되는 값이라고 선언되어 있어,
      상태 매핑·동기화·신뢰 경계가 흔들립니다.
    proposed_action: 하나의 권위 상태 개념을 정하고 Result와 Report가 같은 상태를 공유하는지, 아니면 결과 상태와 보고서
      공개/수정 상태가 다른 개념인지 분리해 명명합니다. 분리한다면 명시적 매핑표와 전이 규칙을 두고 corrected/amended 같은
      값의 의미 차이를 정의합니다.
    affected_purpose: EMR/LIS 통합의 개념 권위 문서로서 결과 상태와 보고 상태의 의미·권위·전이 기준을 제공하는 목적.
    failure_condition: Result.status와 Report.result_status 사이에서 같은 임상 상태가 서로 다른 라벨과
      권위 주장으로 전달되거나 야간 동기화 전후에 의미가 달라지는 경우.
    impact: 임상의가 신뢰한다고 선언된 Report.result_status가 LIS 기록 상태와 의미적으로 같은지 다른지 불명확해져 통합
      구현자가 임의 매핑을 만들게 되고, 정정 결과·최종 보고 상태의 임상적 해석 오류로 이어질 수 있습니다.
