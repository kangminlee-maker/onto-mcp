      immediate notification but the ontology only stores notified=true/false
      and leaves time/recipient evidence in a phone log, with no modeled
      notification event, relation, acknowledgement, or audit lifecycle. The
      axiology finding frames stakeholder/accountability harm while coverage
      frames missing concept coverage, but the underlying issue and proposed
      action are materially the same."
