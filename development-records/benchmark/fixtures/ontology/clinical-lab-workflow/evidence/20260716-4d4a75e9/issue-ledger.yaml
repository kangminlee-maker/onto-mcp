    issue_statement: TAT is mentioned as an ontology concept but its calculation
      authority is left to an external dashboard formula without governed metric
      semantics.
    proposed_action: Model TAT as a governed derived metric with source timestamps,
      owner, versioning, exclusions, and amendment behavior, or explicitly
      declare the dashboard metric outside the authority boundary.
    affected_purpose: Use the ontology as a concept authority for EMR/LIS
      integration and operational values derived across workflow timestamps.
    failure_condition: EMR, LIS, or dashboard consumers need a canonical or
      reproducible TAT definition after formula changes or report amendments.
    impact: Consumers can implement divergent operational metrics while still
      appearing to follow the authority document.
