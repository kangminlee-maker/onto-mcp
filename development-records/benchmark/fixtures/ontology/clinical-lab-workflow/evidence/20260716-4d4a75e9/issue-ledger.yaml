    issue_statement: STAT meaning is split across three representations that can
      diverge under policy or interface changes.
    proposed_action: Choose one canonical priority/STAT authority and make other
      representations derived, removed, or governed by explicit invariants.
    affected_purpose: Support consistent order priority and STAT policy changes in
      the EMR/LIS integration model.
    failure_condition: New priority categories, institutional STAT reason policies,
