  - issue_id: issue-002
    root_cause_hypothesis: The model treats critical-value communication evidence as
      external operational bookkeeping instead of a first-class integration
      concept.
    root_confidence: medium
    surface_finding_ids:
      - finding-002
    relation_refs: []
    raised_by_lens_ids:
      - axiology
    issue_statement: Critical-value notification is represented as a boolean while
      recipient, time, acknowledgement, and authority evidence remain outside
      the ontology.
    proposed_action: Promote critical-value notification into an explicit event or
      entity linked to CriticalValue, Result, Staff, and the EMR/LIS release
      workflow.
    affected_purpose: Use the ontology as the concept authority for EMR/LIS
      integration while identifying operational risks in entities, relations,
      and states.
    failure_condition: A critical value is reported or audited and the integration
      needs notification timing, recipient, acknowledgement, or authoritative
      source semantics.
    impact: Downstream systems may treat a bare boolean as sufficient evidence of
      completed risk handling, weakening auditability and clinical communication
      traceability.
