  - issue_id: issue-006
    root_cause_hypothesis: Catalog extension relies on dual Test and Assay
      registration because the ontology lacks a governed Test-Assay mapping,
      source of truth, and effective-history concept.
    root_confidence: high
    surface_finding_ids:
      - finding-006
      - finding-008
      - finding-016
    relation_refs:
      - rel-009
      - rel-010
    raised_by_lens_ids:
      - coverage
      - evolution
      - semantics
    issue_statement: Orderable Test and executable Assay are parallel catalog-like
      structures without clear boundary, mapping authority, or effective
      history.
    proposed_action: Define the canonical catalog authority and Test-Assay mapping
      with cardinality, effective dates or versions, shared-attribute ownership,
      and activation or retirement lifecycle.
    affected_purpose: Use as the concept authority for EMR/LIS integration where
      orderable tests must map to LIS/analyzer execution units.
    failure_condition: A new or changed lab item must be registered in both Test and
      Assay, or the two carry differing specimen kind, department, name, or code
      semantics.
    impact: Catalog reconciliation is deferred to manual dual maintenance, allowing
      EMR, LIS, analyzer, and dashboard consumers to diverge.
    evidence_refs:
