    issue_statement: Specimen lifecycle omits post-analysis custody, retention,
      retrieval, storage, and disposal states or events.
    proposed_action: Add explicit post-analysis specimen lifecycle concepts or a
      governed extension point visible in the authority model.
    affected_purpose: Use as the concept authority document for EMR/LIS integration
