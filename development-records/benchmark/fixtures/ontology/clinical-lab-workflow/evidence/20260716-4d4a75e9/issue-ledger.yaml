  - issue_id: issue-009
    root_cause_hypothesis: The model defines order completion against a reversible
      Result.status value but does not define how order lifecycle responds when
      that value changes after completion.
    root_confidence: medium
    surface_finding_ids:
      - finding-013
    relation_refs: []
    raised_by_lens_ids:
      - logic
    issue_statement: Order.completed can be reached when all results are final, but
      later result corrections are allowed without an order transition rule.
    proposed_action: Define completed as either a historical event or a maintained
      invariant, and add reopened/corrected/amended order behavior or a separate
      current-result-finality predicate.
    affected_purpose: Use as an EMR/LIS integration authority for lifecycle and
      state interpretation.
    failure_condition: An Order reaches completed after all Results are final, then
      a Result is later corrected.
    impact: Integrations can observe Order.completed alongside a corrected or
      non-final Result, undermining lifecycle precedence and invalid-input
      handling.
    evidence_refs:
