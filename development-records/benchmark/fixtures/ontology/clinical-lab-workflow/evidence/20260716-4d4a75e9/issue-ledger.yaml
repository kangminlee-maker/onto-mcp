  - issue_id: issue-005
    root_cause_hypothesis: The model fails to separate critical threshold
      definitions from patient/result-specific notification events.
    root_confidence: high
    surface_finding_ids:
      - finding-005
      - finding-017
    relation_refs:
      - rel-006
    raised_by_lens_ids:
      - coverage
      - semantics
    issue_statement: CriticalValue mixes dangerous range thresholds with
      notification state, so notification evidence and threshold rules are not
      cleanly separated.
    proposed_action: Split threshold/range rules from critical notification or
      critical result event concepts, and place actor, recipient, time,
      acknowledgement, and evidence on the event concept.
    affected_purpose: Use as an EMR/LIS integration concept authority for
      operationally risky lab workflow states and controlled actions.
    failure_condition: A critical result requires proof of notification, threshold
      interpretation, or reconciliation between LIS, EMR, and a phone log.
    impact: A single notified flag can be read as either threshold state or
      patient-result event state, weakening auditability and semantic clarity.
    evidence_refs:
      - .onto/review/20260716-4d4a75e9/round1/coverage.findings.yaml#coverage-candidate-002
      - clinical-lab-ontology.yaml:1-3
