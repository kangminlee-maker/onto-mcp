issues:
  - issue_id: issue-001
    root_cause_hypothesis: The model duplicates result and report status authority
      while allowing delayed reconciliation, leaving the authoritative state
      undefined during the correction window.
    root_confidence: high
    surface_finding_ids:
      - finding-001
      - finding-012
    relation_refs:
      - rel-001
    raised_by_lens_ids:
      - axiology
      - logic
    issue_statement: Corrected LIS results can coexist with clinician-facing report
      status that still appears finalized or preliminary until nightly
      synchronization runs.
    proposed_action: Define a single authoritative status or an explicit
      eventual-consistency contract with freshness, bounded stale interval, and
      authority rules during the correction window.
    affected_purpose: Use the ontology as the concept authority document for EMR/LIS
      integration, especially status precedence and operational risk.
    failure_condition: A Result changes to corrected between nightly synchronization
      runs while Report.result_status has not yet become amended.
    impact: Downstream EMR/LIS consumers and clinicians can trust a stale report
      status while the result has already been corrected, making status
      authority ambiguous.
    evidence_refs:
