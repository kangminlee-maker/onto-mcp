relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-012
    relation: same_root_candidate
    root_hypothesis: The model duplicates result/report status authority while
      allowing delayed reconciliation without defining the authoritative state
      during the correction window.
    shared_cause: null
    rationale: Both findings depend on Result.status becoming corrected while
      Report.result_status is updated only by a nightly batch. finding-001
      frames the operational trust risk for clinician-facing status, while
      finding-012 frames the same delayed synchronization as a temporal
      satisfiability and precedence conflict.
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-012
    to_finding_id: finding-014
    relation: shared_cause_candidate
    root_hypothesis: The result/report status model lacks an explicit status
      authority and mapping contract between Result.status and
      Report.result_status.
    shared_cause:
      cause_claim: Result.status and Report.result_status are asserted to carry the
        same information, but use separate vocabularies and an implicit
        corrected-to-amended synchronization rule.
      from_cause_ref: finding-012.cause-001
      to_cause_ref: finding-014.cause-003
    rationale: finding-012 focuses on the delayed synchronization conflict;
      finding-014 focuses on the semantic mismatch between the two status
      vocabularies. Both arise from treating two separate status fields as
      equivalent without an explicit mapping and authority rule.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-011
    to_finding_id: finding-014
    relation: same_root_candidate
    root_hypothesis: Status lifecycle extensibility is weakened because result and
      report states are duplicated as separate enums without a governed mapping,
      version, or transition model.
    shared_cause: null
    rationale: finding-011 identifies future evolution risk from duplicated
      result/report enums and natural-language sync rules. finding-014
      identifies the current semantic ambiguity of the same duplicated status
      vocabulary. The common root is the absence of a first-class status
      mapping/lifecycle concept.
    confidence: high
  - relation_id: rel-004
    from_finding_id: finding-013
    to_finding_id: finding-012
    relation: shared_cause_candidate
    root_hypothesis: Correction events are modeled as allowed after finalization
      without defining all downstream lifecycle transitions that depend on
      finality.
    shared_cause:
      cause_claim: Result.status can change to corrected after final/finalized
        workflow states have already been reached, but the model does not define
        a complete current-state transition contract for dependent statuses.
      from_cause_ref: finding-013.cause-003
      to_cause_ref: finding-012.cause-003
    rationale: finding-013 concerns Order.completed after a later corrected Result;
      finding-012 concerns Report.result_status during delayed correction
      propagation. Both are symptoms of mutable result finality without a
      complete transition model for dependent workflow states.
    confidence: medium
  - relation_id: rel-005
    from_finding_id: finding-002
    to_finding_id: finding-005
    relation: duplicates
    root_hypothesis: Critical-value notification evidence is collapsed to a boolean,
      leaving actor, time, recipient, channel, and acknowledgement outside the
      authority model.
    shared_cause: null
    rationale: "The two findings make the same material claim from axiology and
      coverage perspectives: notified:boolean is insufficient for EMR/LIS
      operational risk and auditability because notification evidence is
      external to the modeled ontology."
    confidence: high
  - relation_id: rel-006
    from_finding_id: finding-005
    to_finding_id: finding-017
