        .md:122,
        .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input\
        .md:123 Source finding context: Order.completed is triggered by all
        Results being final, but later corrected Results are explicitly allowed
        without a corresponding Order state transition rule. Source finding
        context: This is a temporal inter-claim conflict if completed is used as
        the current completion predicate for the order. A completion judgment
        based on mutable Result.status can be made true and later invalidated by
        an allowed correction event, but the lifecycle has no state that
        represents that invalidation. That makes the state model unsafe as an
        authority for integration behavior that relies on completed meaning all
        results are final. Source finding context: Define whether
        Order.completed is a historical transition event or a maintained
        invariant. If it is maintained, add a correction/reopened/amended state
        or transition on Result.status=corrected. If it is historical, rename or
        document completed as release-completed and add a separate
        current-result-finality predicate. Source finding context:
        .onto/review/20260716-4d4a75e9/round1/logic.findings.yaml#logic-candida\
        te-002 Source finding context: Use as an EMR/LIS integration authority
        for lifecycle and state interpretation. Source finding context: An Order
        reaches completed after all Results are final, then a Result is later
        corrected as allowed by the report correction rule. Source finding
        context: Integrations can see Order.completed and a corrected/non-final
        Result at the same time, undermining invalid-input handling and
        lifecycle precedence for downstream consumers. Source finding context:
        The model defines order completion against a reversible Result.status
        value but does not define how order lifecycle responds when that value
        changes after completion. Source finding context: Order has a completed
        lifecycle state but no reopened, corrected, or amended order state.
        Source finding context: Order completion is triggered when all Results
        are final. Source finding context: Result.status can later become
        corrected, so the all-final condition can stop holding after
        completion."
