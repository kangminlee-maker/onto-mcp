        .md:69-83,121-123;
        .onto/review/20260716-4d4a75e9/execution-preparation/review-value-align\
        ment-criteria.yaml:5-11 Source finding context: Clinician-trusted report
        status is allowed to lag corrected LIS results, which misaligns the
        ontology with its purpose as an EMR/LIS concept authority. Source
        finding context: The declared review value is suitability as the concept
        authority for EMR/LIS integration, especially operational risk. A
        concept authority that explicitly lets a clinician-facing authority
        value remain `finalized` until a nightly batch after a result is
        corrected accepts a hidden tradeoff against timely clinical truth
        propagation. That is not merely an implementation detail: the target
        itself assigns trust to `Report.result_status`, so the delayed
        propagation weakens the document's purpose as an authority for
        integration behavior. Source finding context: Make the corrected/amended
        status a single authoritative state or require event-driven/synchronous
        propagation from `Result.status=corrected` to
        `Report.result_status=amended`. If delayed processing is unavoidable,
        model an explicit interim state such as `amendment_pending`, with
        timestamp, source result, and EMR-facing trust rules. Source finding
        context:
