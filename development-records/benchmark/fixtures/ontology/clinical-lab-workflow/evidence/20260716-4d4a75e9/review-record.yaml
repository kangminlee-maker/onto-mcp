        andidate-001 Source finding context: Use the ontology as the concept
        authority document for EMR/LIS integration, with attention to
        operational risk. Source finding context: A LIS result changes to
        `corrected` after report release but before the nightly synchronization
        batch updates the report status. Source finding context: The EMR-facing
        status that clinicians are told to trust can remain stale, so downstream
        integration can present corrected clinical information as finalized
        during the lag window. Source finding context: The model duplicates
        result status authority across LIS `Result.status` and clinician-facing
        `Report.result_status`, then permits asynchronous reconciliation for a
        trust-critical correction path. Source finding context:
        `Report.result_status` is described as the authority value shown on the
        report and trusted by clinicians. Source finding context: The same
        status meaning is also retained on `Result.status`, which is recorded by
        LIS. Source finding context: When `Result.status` becomes corrected,
        `Report.result_status` must become amended, but the synchronization
        batch runs only once nightly. Source finding context: The requested
        purpose is to judge whether this ontology is suitable as an EMR/LIS
        integration concept authority with operational-risk awareness. Source
        finding context: clinical-lab-ontology.yaml state_rules /
