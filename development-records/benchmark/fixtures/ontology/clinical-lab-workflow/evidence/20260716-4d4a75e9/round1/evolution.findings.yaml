    target: clinical-lab-ontology.yaml / Test and Assay catalog model
    evidence_anchor: 'Embedded Materialized Input: `Test` has `test_code`,
      `department`, and enum `requires_specimen_type`; `Assay` has separate
      `assay_code`, `department`, and free-string `specimen_kind`; notes state
      "현재 신규 항목은 두 곳 모두에 등록한다."'
    claim: 신규 검사 항목 추가 시 `Test`와 `Assay`를 모두 수정해야 하므로 카탈로그 확장이 이중 등록에 의존한다.
    what: 주문 가능한 검사(`Test`)와 분석기 수행 단위(`Assay`)가 별도 엔티티로 존재하지만 두 엔티티 사이의 관계나 단일 카탈로그
      권위가 없다. 문서 자체가 신규 항목을 두 곳 모두에 등록한다고 선언한다.
    why: EMR/LIS 통합의 개념 권위 문서라면 새 검사 항목, 장비별 수행 단위, 패널/반사검사 같은 카탈로그 변화가 누락 없이 확장되어야
      한다. 현재 모델은 `Test`와 `Assay`의 연속성을 관계로 보존하지 않고 병렬 속성(`department`, 검체 종류)을
      중복 보유하므로 새 항목 추가 또는 카탈로그 정비 때 기존 구조와 데이터를 함께 고쳐야 하며, 두 목록이 어긋나도 어떤 쪽이 권위인지
      판단할 수 없다.
    how_to_fix: "`Test`를 주문 카탈로그 권위로 둘지, 별도 `CatalogItem`/`Procedure` 같은 상위 개념을 둘지
      정한 뒤 `Assay`가 그 권위를 참조하도록 관계를 추가한다. 검체 종류와 부서 같은 공유 속성은 한 권위 위치에서 파생되게 하고,
      장비/방법/버전별 확장은 `Assay` 변형으로 추가되도록 모델링한다."
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 검사 카탈로그와 수행 단위의 변경을 안정적으로 수용하는 목적.
      failure_condition: 신규 검사, 장비 수행 항목, 검체별 변형을 추가할 때 `Test`와 `Assay` 양쪽을 수동 등록하거나
        기존 속성/관계를 재정비해야 하는 경우.
      impact: 통합 설계에서 주문 코드와 수행 코드의 매핑 권위가 사라져 카탈로그 확장 때 데이터 불일치, 누락 등록, 기존 주문/결과 연결
        단절 위험이 커진다.
      evidence_refs:
        - "Embedded Materialized Input: `Test` entity attributes"
        - "Embedded Materialized Input: `Assay` entity attributes"
        - 'Embedded Materialized Input: notes: "Test와 Assay는 카탈로그 정비 후 통합 여부를
          재검토한다. 현재 신규 항목은 두 곳 모두에 등록한다."'
    causal_path:
      root_cause_candidate: 검사 카탈로그 권위와 수행 단위 권위가 분리되어 있으나 둘을 잇는 명시 관계나 버전/매핑 개념이 없다.
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: "`Test`와 `Assay`가 각각 코드, 표시명/이름, 부서, 검체 관련 속성을 별도로 가진다."
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: `Test` entity attributes"
            - "Embedded Materialized Input: `Assay` entity attributes"
        - cause_id: evolution-candidate-001.cause-002
          claim: 문서의 현재 운영 규칙은 신규 항목을 두 곳 모두에 등록하게 한다.
          relation_to_previous: causes
          evidence_refs:
            - 'Embedded Materialized Input: notes: "현재 신규 항목은 두 곳 모두에 등록한다."'
        - cause_id: evolution-candidate-001.cause-003
          claim: 따라서 새 검사 항목이나 수행 변형 추가는 단일 확장 지점이 아니라 기존 두 구조의 동시 수정과 정합성 유지에 의존한다.
          relation_to_previous: causes
          evidence_refs:
