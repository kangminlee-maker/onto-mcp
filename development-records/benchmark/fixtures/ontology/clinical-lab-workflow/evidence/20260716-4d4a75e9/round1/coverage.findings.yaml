findings:
  - candidate_id: coverage-candidate-001
    target: clinical-lab-ontology.yaml / Specimen lifecycle
    evidence_anchor: clinical-lab-ontology.yaml:32-39, clinical-lab-ontology.yaml:116-119
    claim: Specimen lifecycle omits the post-analysis custody, retention, and
      disposal domain segment.
    what: The ontology models Specimen only through collected, received,
      in_analysis, and analyzed, then states that storage/disposal after
      analysis follows departmental internal rules without representing those
      states or events in the authority model.
    why: For an EMR/LIS integration concept authority, specimen traceability does
      not end at analysis. Retention, storage location, disposal, and exception
      states are operationally relevant after result production, and the target
      itself acknowledges the post-analyzed segment while leaving it outside the
      ontology.
    how_to_fix: Add explicit post-analysis specimen lifecycle concepts such as
      retained/stored, retrieved, disposed, and disposal/retention events with
      timestamp, responsible department/staff, location, and policy basis, or
      define a governed extension point that is still visible in the authority
      model.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: Use as the concept authority document for EMR/LIS integration
        from order through report, including entity, relationship, and state
        modeling.
      failure_condition: When downstream systems need to reconcile specimen retention,
        retrieval, disposal, or post-analysis custody after analyzed, the
        authority model has no canonical states or events to map to.
      impact: Integrations may treat analyzed as terminal even though the artifact
        states post-analysis handling exists, weakening traceability and making
        department-specific implementations the de facto authority.
      evidence_refs:
        - clinical-lab-ontology.yaml:1-3
        - clinical-lab-ontology.yaml:32-39
        - clinical-lab-ontology.yaml:116-119
    causal_path:
      root_cause_candidate: The target delegates post-analyzed specimen handling to
        departmental rules instead of modeling it as part of the shared
        ontology.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: Specimen lifecycle terminates at analyzed.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:32-39
        - cause_id: coverage-candidate-001.cause-002
          claim: The ontology nevertheless acknowledges storage/disposal after analyzed as
            an operational process.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:116-119
        - cause_id: coverage-candidate-001.cause-003
          claim: Because no shared post-analysis lifecycle concepts are defined, EMR/LIS
            integrations lack a canonical representation for specimen custody
            after analysis.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:1-3
            - clinical-lab-ontology.yaml:116-119
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-002
    target: clinical-lab-ontology.yaml / CriticalValue notification coverage
    evidence_anchor: clinical-lab-ontology.yaml:95-101
    claim: Critical-value notification is represented only as a boolean and excludes
      notification evidence concepts.
    what: CriticalValue has bounds and a notified boolean, while the note says
      notification time and recipient are in a separate phone log. The ontology
      does not define a notification event, notifier, recipient, timestamp,
      channel, acknowledgement, or rationale/evidence object.
    why: Critical-value communication is a controlled action in the target domain
      because the entity is defined as requiring immediate notification. A
      boolean cannot reconstruct who notified whom, when, through what channel,
      and with what acknowledgement, so the authority model does not cover the
      audit dimension needed for operational trust.
    how_to_fix: Replace or supplement notified with a CriticalValueNotification
      event/entity containing critical_value/result reference, notifier,
      recipient, notified_at, channel, acknowledgement/status, escalation
      fields, and evidence/source-log linkage.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: Use as an EMR/LIS integration concept authority for
        operationally risky lab workflow states and controlled actions.
      failure_condition: When a critical result requires proof of notification or
        reconciliation between LIS, EMR, and a phone log, the model exposes only
        a true/false flag and no auditable event structure.
      impact: Systems can disagree or overwrite the notification flag without
        preserving the evidence needed to establish clinical communication
        history.
      evidence_refs:
        - clinical-lab-ontology.yaml:1-3
        - clinical-lab-ontology.yaml:95-101
    causal_path:
      root_cause_candidate: The ontology keeps critical-value notification evidence
        outside the modeled concept set and collapses notification into a
        boolean.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: CriticalValue is defined as a result range requiring immediate
            notification.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:95-101
        - cause_id: coverage-candidate-002.cause-002
          claim: "The only in-model notification attribute is notified: boolean, with time
            and recipient delegated to a phone log."
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:97-101
        - cause_id: coverage-candidate-002.cause-003
          claim: The model therefore lacks the actor/time/recipient/evidence concepts
            needed to cover the controlled notification action inside the
            EMR/LIS authority model.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:1-3
            - clinical-lab-ontology.yaml:95-101
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: clinical-lab-ontology.yaml / Test and Assay catalog authority
    evidence_anchor: clinical-lab-ontology.yaml:41-55, clinical-lab-ontology.yaml:121-123
    claim: Parallel Test and Assay catalogs are present without a single authority,
      mapping, or effective-history concept.
    what: The ontology defines Test as the orderable catalog unit and Assay as the
      analyzer execution unit, and notes that new items are registered in both
      until later catalog cleanup. It does not define a mapping relation,
      version/effective period, or which catalog is authoritative for shared
      properties such as department and specimen requirements.
    why: Orderable and executable catalog concepts are both central to EMR/LIS
      integration. Without a canonical mapping and authority rule, the model
      covers the two catalog areas as parallel lists but not the cross-system
      reconciliation concepts needed when the same lab item is ordered,
      performed, renamed, versioned, or retired.
    how_to_fix: Add a governed Test-Assay mapping concept with cardinality,
      effective_from/effective_to or version, authoritative source for shared
      attributes, lifecycle for catalog activation/retirement, and migration
      rules for items registered in both catalogs.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: Use as the concept authority for EMR/LIS integration where
        orderable tests must map to LIS/analyzer execution units.
      failure_condition: When a new or changed lab item exists in both Test and Assay
        with differing specimen kind, department, or name, the ontology lacks a
        canonical mapping and source of truth to decide integration behavior.
      impact: The intended authority document leaves catalog reconciliation to future
        cleanup, allowing duplicate registration and divergent interpretations
        across EMR, LIS, analyzer, and dashboard consumers.
      evidence_refs:
        - clinical-lab-ontology.yaml:1-3
        - clinical-lab-ontology.yaml:41-55
        - clinical-lab-ontology.yaml:121-123
    causal_path:
      root_cause_candidate: The ontology intentionally maintains separate Test and
        Assay registrations without modeling the authority and history that make
        the parallel catalogs governable.
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: Test and Assay both carry catalog-like attributes including
            code/name/display name, department, and specimen type/kind.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:41-55
        - cause_id: coverage-candidate-003.cause-002
          claim: The notes state new items are currently registered in both and catalog
            consolidation is deferred.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:121-122
        - cause_id: coverage-candidate-003.cause-003
          claim: No mapping, effective dating, lifecycle, or source-of-truth concept is
            defined for reconciling the parallel catalogs.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:41-55
            - clinical-lab-ontology.yaml:103-114
            - clinical-lab-ontology.yaml:121-123
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: clinical-lab-ontology.yaml / TAT calculation authority
    evidence_anchor: clinical-lab-ontology.yaml:32-39,
      clinical-lab-ontology.yaml:70-79, clinical-lab-ontology.yaml:121-123
    claim: Turnaround-time coverage is reduced to an external dashboard formula
      without a governed metric concept or authority.
    what: The ontology states that TAT is calculated from collected_at to
      released_at and that the dashboard team maintains its own calculation
      formula. It does not define TAT as a metric entity/attribute, its
      calculation authority, exclusions, recalculation behavior after
      correction/amendment, or effective history of formula changes.
    why: TAT is an operational performance value spanning specimen collection and
      report release. Because the artifact positions itself as the EMR/LIS
      authority model, leaving a cross-system metric to an external team-owned
      formula creates a coverage gap for a time-dependent value that consumers
      are likely to compare or report.
    how_to_fix: Model TAT as a governed derived metric with source timestamps,
      calculation owner, inclusion/exclusion rules, effective versioning, and
      behavior for amended/corrected reports; alternatively declare the
      dashboard metric explicitly out of scope with a canonical integration
      boundary.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: Use as a concept authority for EMR/LIS integration, including
        operational values derived across workflow timestamps.
      failure_condition: When EMR, LIS, or dashboard consumers need the canonical TAT
        definition or need to reproduce historical TAT after formula changes or
        report amendments, the ontology points to an external team-owned
        calculation rather than a governed concept.
      impact: A key operational metric can diverge across consumers and cannot be
        reconstructed from the ontology's own authority model beyond the two raw
        timestamps.
      evidence_refs:
        - clinical-lab-ontology.yaml:1-3
        - clinical-lab-ontology.yaml:32-39
        - clinical-lab-ontology.yaml:70-79
        - clinical-lab-ontology.yaml:121-123
    causal_path:
      root_cause_candidate: The ontology delegates TAT calculation authority to a
        dashboard-maintained formula instead of modeling TAT as a governed
        derived concept.
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: The model includes collected_at on Specimen and released_at on Report.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:32-39
            - clinical-lab-ontology.yaml:70-79
        - cause_id: coverage-candidate-004.cause-002
          claim: The notes define TAT using those timestamps but say the dashboard team
            maintains its own calculation formula.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:121-123
        - cause_id: coverage-candidate-004.cause-003
          claim: No ontology concept captures TAT formula ownership, version/effective
            period, exclusions, or recalculation behavior.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml:8-123
      unresolved_beyond_evidence: null
