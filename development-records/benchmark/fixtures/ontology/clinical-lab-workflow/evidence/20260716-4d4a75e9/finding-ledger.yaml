    claim: Assay is not connected to the orderable Test or result-production path.
    lens_rationale_summary: Structurally, the model connects Test to Result and
      Specimen to Result, but leaves the analyzer execution concept outside that
      path. That makes the declared dual catalog maintenance rule hard to
      operationalize from the ontology.
    proposed_action: Add the minimal execution mapping, such as Test -> Assay
      maps_to/implemented_by and Assay -> Result produces, or explicitly
      de-scope Assay from the authoritative workflow graph until catalog
      consolidation is complete.
