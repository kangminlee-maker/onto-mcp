            - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:83
        - cause_id: finding-012.cause-002
          claim: The correction rule requires Report.result_status to become amended when
            Result.status becomes corrected.
          relation_to_previous: causes
          evidence_refs:
            - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:123
        - cause_id: finding-012.cause-003
