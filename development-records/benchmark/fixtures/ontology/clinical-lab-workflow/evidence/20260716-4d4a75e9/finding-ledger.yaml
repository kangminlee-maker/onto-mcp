  - finding_id: finding-013
    lens_id: logic
    source_ref: .onto/review/20260716-4d4a75e9/round1/logic.findings.yaml#logic-candidate-002
    target: clinical-lab-ontology.yaml Order completion rule
    evidence_anchor: .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:23,
      .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:69,
      .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:71,
      .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:122,
      .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:123
    claim: Order.completed is triggered by all Results being final, but later
      corrected Results are explicitly allowed without a corresponding Order
      state transition rule.
    lens_rationale_summary: This is a temporal inter-claim conflict if completed is
      used as the current completion predicate for the order. A completion
      judgment based on mutable Result.status can be made true and later
      invalidated by an allowed correction event, but the lifecycle has no state
      that represents that invalidation. That makes the state model unsafe as an
      authority for integration behavior that relies on completed meaning all
      results are final.
    proposed_action: Define whether Order.completed is a historical transition event
      or a maintained invariant. If it is maintained, add a
      correction/reopened/amended state or transition on
      Result.status=corrected. If it is historical, rename or document completed
      as release-completed and add a separate current-result-finality predicate.
    affected_purpose: Use as an EMR/LIS integration authority for lifecycle and
      state interpretation.
    failure_condition: An Order reaches completed after all Results are final, then
      a Result is later corrected as allowed by the report correction rule.
    impact: Integrations can see Order.completed and a corrected/non-final Result at
      the same time, undermining invalid-input handling and lifecycle precedence
      for downstream consumers.
    evidence_refs:
      - .onto/review/20260716-4d4a75e9/round1/logic.findings.yaml#logic-candidate-002
      - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:23
      - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:71
      - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:122
      - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:123
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: Use as an EMR/LIS integration authority for lifecycle and
        state interpretation.
      failure_condition: An Order reaches completed after all Results are final, then
        a Result is later corrected as allowed by the report correction rule.
      impact: Integrations can see Order.completed and a corrected/non-final Result at
        the same time, undermining invalid-input handling and lifecycle
        precedence for downstream consumers.
      evidence_refs:
        - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:23
        - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:71
        - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:122
        - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:123
    causal_path:
      root_cause_candidate: The model defines order completion against a reversible
        Result.status value but does not define how order lifecycle responds
        when that value changes after completion.
      root_cause_step_id: finding-013.cause-003
      steps:
        - cause_id: finding-013.cause-001
          claim: Order has a completed lifecycle state but no reopened, corrected, or
            amended order state.
          relation_to_previous: null
          evidence_refs:
            - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:23
        - cause_id: finding-013.cause-002
          claim: Order completion is triggered when all Results are final.
          relation_to_previous: causes
          evidence_refs:
            - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:122
        - cause_id: finding-013.cause-003
          claim: Result.status can later become corrected, so the all-final condition can
            stop holding after completion.
          relation_to_previous: enables
          evidence_refs:
            - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:71
            - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:123
      unresolved_beyond_evidence: The target does not explicitly state that completed
        is terminal or invariant; the finding applies when completed is consumed
        as the current order-finality predicate, which is the natural reading of
        the state rule in this bounded artifact.
