    evidence_anchor: .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:15-20,31-35,108-119
    claim: Patient is only present as an Order attribute target and is absent from
      the explicit relations graph.
    lens_rationale_summary: The file says it is intended as the EMR/LIS integration
      concept authority and defines the lab pipeline from Order to Report. If
      the explicit relations graph is the structural contract, the patient
      dimension is not traversable from the workflow relations even though
      orders are issued for patients.
    proposed_action: Add explicit patient relations, for example Order -> Patient
      belongs_to and Patient -> Order has_many, or document that attribute refs
      are the authoritative relationship surface and keep relations consistent
      with that rule.
    affected_purpose: Using the ontology as the concept authority for EMR/LIS
      integration from Order through Report.
    failure_condition: Consumers that rely on the relations section to derive
      integration paths cannot connect lab orders, specimens, results, or
      reports to Patient.
    impact: This weakens trust in the model as an integration authority because a
      core workflow participant is structurally outside the declared relation
