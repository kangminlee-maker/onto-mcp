  - finding_id: finding-012
    lens_id: logic
    source_ref: .onto/review/20260716-4d4a75e9/round1/logic.findings.yaml#logic-candidate-001
    target: clinical-lab-ontology.yaml state_rules / Report.result_status consistency
    evidence_anchor: .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:69,
      .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:72,
      .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:80,
      .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:123
    claim: Report.result_status must both maintain the same Result.status
      information and be updated only by a nightly batch after correction,
      creating a temporal satisfiability conflict.
    lens_rationale_summary: "This is an inter-claim conflict on mixed modality: the
      attribute note states a maintained equivalence, the state rule states an
      obligation when corrected, and the same sentence also permits delayed
      synchronization. As a concept authority document for EMR/LIS integration,
      this weakens precedence and invalid-input behavior because consumers
      cannot tell whether Report.result_status is an immediate authority value
      or an eventually consistent projection."
    proposed_action: "Make the modality explicit: either define Report.result_status
      as eventually consistent with a bounded stale interval and freshness
      timestamp, or require synchronous update/transactional amendment when
      Result.status changes to corrected. Also specify which value is
      authoritative during the sync window."
    affected_purpose: Use as the concept authority document for EMR/LIS integration,
      especially precedence and status interpretation.
    failure_condition: A Result changes to corrected between nightly synchronization
      runs while Report.result_status remains finalized or prelim.
    impact: Downstream EMR/LIS consumers can simultaneously satisfy the batch rule
      and violate the maintained-same-information/amended obligation, making
      report status authority ambiguous for clinicians and integrations.
    evidence_refs:
      - .onto/review/20260716-4d4a75e9/round1/logic.findings.yaml#logic-candidate-001
      - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:72
      - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:83
      - .onto/review/20260716-4d4a75e9/execution-preparation/materialized-input.md:123
    severity: medium
    domain_threshold_used: null
    materiality_basis:
