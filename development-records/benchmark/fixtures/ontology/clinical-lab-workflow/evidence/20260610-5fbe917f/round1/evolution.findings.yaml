findings:
  - candidate_id: evolution-candidate-001
    target: clinical-lab-ontology.yaml entities.Test/Assay and related notes
    evidence_anchor: 'entities.Test.attributes.requires_specimen_type values [blood,
      urine, tissue, swab]; entities.Assay.attributes.specimen_kind type string;
      notes: "Test와 Assay는 카탈로그 정비 후 통합 여부를 재검토한다. 현재 신규 항목은 두 곳 모두에 등록한다."'
    claim: 신규 검사 항목을 추가할 때 Test와 Assay를 동시에 수정해야 하며 검체 타입 체계가 달라 확장 시 불일치가 누적될 수 있다.
    what: 주문 가능한 카탈로그 단위인 Test와 분석 수행 단위인 Assay가 별도 엔티티로 존재하지만 둘 사이의 관계나 단일 권위가 없다.
      신규 항목은 두 곳 모두에 등록한다고 되어 있고, Test는 고정 enum 검체 타입을 쓰는 반면 Assay는 자유 문자열
      specimen_kind를 쓴다.
    why: EMR/LIS 통합의 개념 권위 문서라면 신규 검사, 장비별 assay, 외부 코드체계 변경을 기존 구조 수정 없이 수용해야 한다.
      현재 모델은 새 카탈로그 항목마다 두 권위 표면을 수동 동기화해야 하고, 같은 검체 개념이 enum과 string으로 갈라져
      확장될수록 매핑 누락이나 코드 불일치가 발생한다. 특히 새로운 검체 종류가 추가되면 Test enum 확장과 Assay 문자열 규칙
      정비가 함께 필요해 기존 데이터/규칙의 연속성이 약해진다.
    how_to_fix: Test를 주문 카탈로그의 권위 엔티티로 두고 Assay를 Test에 명시적으로 매핑하는 관계를 추가하거나, 별도
      CatalogItem/SpecimenType 권위 개념을 만들어 Test.requires_specimen_type과
      Assay.specimen_kind가 같은 참조를 사용하게 한다. 신규 항목 등록 절차는 한 권위 위치에서 파생/매핑되도록 정리한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로 신규 검사 항목과 분석 수행 단위를 안정적으로 확장하는 목적.
      failure_condition: 신규 검사나 신규 검체 종류가 추가될 때 Test와 Assay 양쪽 등록 및 서로 다른 검체 표현을 동시에 갱신해야 하는 경우.
      impact: 개념 권위가 둘로 나뉘어 EMR 주문 카탈로그와 LIS 분석 카탈로그가 서로 다른 상태로 진화할 수 있으며, 통합 설계에서 어떤
        값이 기준인지 판단하기 어렵다.
      evidence_refs:
        - "entities.Test.definition: 주문 가능한 카탈로그 단위"
        - entities.Test.attributes.requires_specimen_type enum values [blood,
          urine, tissue, swab]
        - "entities.Assay.definition: 분석기에서 수행되는 검사 항목"
        - entities.Assay.attributes.specimen_kind type string note examples
          'WB', 'Serum', 'Urine-random'
        - "notes: 현재 신규 항목은 두 곳 모두에 등록한다"
    causal_path:
      root_cause_candidate: 카탈로그 권위와 검체 타입 권위가 Test/Assay 사이에 통합 관계 없이 중복 표현되어 있다.
      root_cause_step_id: evolution-candidate-001.cause-004
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: Test와 Assay가 모두 검사 항목을 표현하지만 두 엔티티 사이의 관계가 정의되어 있지 않다.
          relation_to_previous: null
          evidence_refs:
            - entities.Test.definition
            - entities.Assay.definition
            - relations list lacks Test-to-Assay or Assay-to-Test relation
        - cause_id: evolution-candidate-001.cause-002
          claim: 신규 항목 등록은 두 곳 모두에서 이루어진다.
          relation_to_previous: causes
          evidence_refs:
            - "notes: 현재 신규 항목은 두 곳 모두에 등록한다"
        - cause_id: evolution-candidate-001.cause-003
          claim: 검체 타입은 Test에서는 닫힌 enum이고 Assay에서는 자유 문자열이어서 같은 변경을 다른 방식으로 반영해야 한다.
          relation_to_previous: causes
          evidence_refs:
            - entities.Test.attributes.requires_specimen_type enum values
              [blood, urine, tissue, swab]
            - entities.Assay.attributes.specimen_kind type string
        - cause_id: evolution-candidate-001.cause-004
          claim: 따라서 신규 검사/검체 확장 시 기존 구조 수정과 수동 동기화가 필요해 연속성이 약해진다.
          relation_to_previous: causes
          evidence_refs:
            - "notes: 신규 항목은 두 곳 모두에 등록"
            - Test.requires_specimen_type enum
            - Assay.specimen_kind string
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-002
    target: clinical-lab-ontology.yaml state model for Result.status and
      Report.result_status
    evidence_anchor: "entities.Result.attributes.status values [preliminary, final,
      corrected]; entities.Report.attributes.result_status values [prelim,
      finalized, amended]; state_rules: Report finalized at released_at,
      corrected Result makes Report amended, synchronization batch nightly once"
    claim: 결과 상태와 보고 상태가 별도 enum으로 중복되어 새 상태나 보정 흐름 추가 시 상태 매핑과 동기화 규칙을 계속 수정해야 한다.
    what: Result.status와 Report.result_status가 같은 의미권의 상태를 다른 값 집합으로 보관한다.
      state_rules는 corrected에서 amended로 바꾸는 특정 매핑만 기술하고, 동기화는 야간 1회 배치에 의존한다.
    why: 검사 워크플로는 partial release, retraction, cancellation after release, addendum,
      verified-but-not-released 같은 상태가 생길 수 있다. 현재 구조는 새 상태가 추가될 때 Result enum,
      Report enum, 전이 규칙, 배치 동기화 규칙을 모두 함께 바꿔야 하며, 이미 preliminary/prelim 및
      final/finalized처럼 값 이름도 다르다. 외부 LIS나 EMR 상태 코드가 바뀌면 과거 Result와 Report의 연속된
      해석을 보장하기 어렵다.
    how_to_fix: Result 상태를 원천 상태로 명시하고 Report에는 파생된 표시 상태를 두거나, 공통
      ResultLifecycle/ReportLifecycle 상태 모델과 명시적 매핑 테이블을 둔다. 새 상태 추가 시 필요한 매핑,
      우선순위, 동기화 지연 허용 범위, 과거 상태 보존 규칙을 개념 모델에 포함한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 결과/보고 상태의 개념 권위와 상태 변화 연속성을 제공하는 목적.
      failure_condition: 새 결과 상태나 보고 상태가 추가되거나 LIS/EMR 상태 코드가 변경되는 경우.
      impact: 두 enum과 동기화 규칙을 함께 수정해야 하므로 상태 권위가 불명확해지고, 임상의가 신뢰하는
        Report.result_status가 Result.status 변화와 어긋날 수 있다.
      evidence_refs:
        - Result.status values [preliminary, final, corrected]
        - Report.result_status values [prelim, finalized, amended]
        - "state_rules: corrected Result.status changes Report.result_status to
          amended"
        - "state_rules: synchronization batch nightly once"
        - "Report.result_status note: 임상의는 이 값을 신뢰한다"
    causal_path:
      root_cause_candidate: 상태 권위가 Result.status와 Report.result_status로 중복되어 있고 공통 상태
        모델이나 완전한 매핑 규칙이 없다.
      root_cause_step_id: evolution-candidate-002.cause-004
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: Result와 Report가 결과 상태 정보를 별도 enum으로 유지한다.
          relation_to_previous: null
          evidence_refs:
            - "Result.status note: Report.result_status에도 동일 정보가 유지된다"
            - "Report.result_status note: 보고서에 표시되는 결과 상태의 권위 값"
        - cause_id: evolution-candidate-002.cause-002
          claim: 두 enum의 값 집합과 명칭이 서로 다르다.
          relation_to_previous: causes
          evidence_refs:
            - Result.status values [preliminary, final, corrected]
            - Report.result_status values [prelim, finalized, amended]
        - cause_id: evolution-candidate-002.cause-003
          claim: 상태 동기화 규칙은 corrected-to-amended 사례와 야간 배치만 명시한다.
          relation_to_previous: causes
          evidence_refs:
            - "state_rules: Result.status가 corrected로 바뀌면 Report.result_status는
              amended가 되어야 한다"
            - "state_rules: 동기화 배치는 야간 1회"
        - cause_id: evolution-candidate-002.cause-004
          claim: 새 상태나 외부 상태 코드 변경 시 enum과 동기화 규칙을 다중 수정해야 하며 기존 상태 해석의 연속성이 약해진다.
          relation_to_previous: causes
          evidence_refs:
            - Result.status enum
            - Report.result_status enum
            - state_rules corrected/amended synchronization
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-003
    target: clinical-lab-ontology.yaml CriticalValue notification model
    evidence_anchor: 'entities.CriticalValue.attributes.notified boolean note: "통보
      완료 여부. 통보 시각과 수신자는 전화 기록 대장에 있다."'
    claim: CriticalValue 통보를 boolean과 외부 전화 기록 대장으로 분리해 통보 채널이나 감사 요구가 늘어날 때 모델 확장이
      어렵다.
    what: CriticalValue는 통보 필요 범위와 notified 여부만 포함하고, 통보 시각과 수신자는 온톨로지 밖의 전화 기록 대장에
      있다고 한다. 통보 이벤트, 수신자, 채널, 재시도, 에스컬레이션을 담는 개념이 없다.
    why: 운영 환경에서 critical value 통보는 전화 외 채널, 복수 수신자, 실패 후 재시도, 에스컬레이션, 감사 추적 요구로 확장될
      수 있다. 현재 boolean은 한 번 통보되었는지만 나타내므로 새 운영 요구가 생길 때 CriticalValue 자체를 크게
      바꾸거나 외부 장부와 비정형 결합해야 한다. EMR/LIS 통합의 권위 문서 안에서 통보 상태의 연속성과 감사 가능성을 설명하기
      부족하다.
    how_to_fix: CriticalNotification 또는 NotificationEvent 엔티티를 추가해
      CriticalValue/Result와 연결하고 timestamp, recipient, channel, acknowledgement,
      attempt_status, escalation 같은 확장 가능한 속성을 둔다. CriticalValue.notified는 필요하면
      NotificationEvent에서 파생되는 표시 값으로 낮춘다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 위험 결과 통보 워크플로를 EMR/LIS 통합 개념 모델 안에서 확장 가능하고 감사 가능한 방식으로 표현하는 목적.
      failure_condition: 전화 외 통보 채널, 복수 통보 시도, 수신 확인, 에스컬레이션, 감사 요구가 추가되는 경우.
      impact: 현재 boolean은 이벤트 이력과 관계를 수용하지 못해 모델 외부 장부에 권위가 흩어지고, 이후 운영 요구를 반영하려면 기존
        CriticalValue 구조를 재작업해야 한다.
      evidence_refs:
        - "CriticalValue.definition: 즉시 통보가 필요한 위험 결과 값 범위"
        - "CriticalValue.attributes.notified boolean note: 통보 완료 여부"
        - "CriticalValue.attributes.notified note: 통보 시각과 수신자는 전화 기록 대장에 있다"
    causal_path:
      root_cause_candidate: CriticalValue가 통보 이벤트를 독립 개념으로 모델링하지 않고 완료 여부 boolean만 보유한다.
      root_cause_step_id: evolution-candidate-003.cause-004
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: CriticalValue에는 notified boolean만 있고 통보 이벤트 엔티티나 관계가 없다.
          relation_to_previous: null
          evidence_refs:
            - CriticalValue.attributes.notified boolean
            - relations list has no CriticalValue-to-notification relation
        - cause_id: evolution-candidate-003.cause-002
          claim: 통보 시각과 수신자 권위는 온톨로지 밖 전화 기록 대장에 있다.
          relation_to_previous: causes
          evidence_refs:
            - "CriticalValue.attributes.notified note: 통보 시각과 수신자는 전화 기록 대장에 있다"
        - cause_id: evolution-candidate-003.cause-003
          claim: 채널, 수신자, 시도 횟수 같은 새 통보 요구는 기존 boolean에 자연스럽게 추가될 수 없다.
          relation_to_previous: causes
          evidence_refs:
            - CriticalValue.attributes.notified boolean
            - absence of NotificationEvent entity in entities
        - cause_id: evolution-candidate-003.cause-004
          claim: 따라서 통보 운영 확장 시 외부 장부 의존 또는 CriticalValue 재구조화가 필요하다.
          relation_to_previous: causes
          evidence_refs:
            - CriticalValue.notified note
            - entities list lacks notification event concept
      unresolved_beyond_evidence: 구체적인 통보 규정이나 병원 내 전화 기록 대장 스키마는 경계 내 증거에 없으므로, 채널/감사
        요구의 세부 항목은 일반적인 확장 시나리오로만 판단했다.
  - candidate_id: evolution-candidate-004
    target: clinical-lab-ontology.yaml Specimen lifecycle
    evidence_anchor: 'entities.Specimen.lifecycle [collected, received, in_analysis,
      analyzed]; state_rules: "Specimen이 analyzed가 된 뒤의 보관/폐기 처리는 각 부서 내규를
      따른다."'
    claim: 검체 보관/폐기 이후 상태를 부서 내규로만 남겨 부서 추가나 정책 변경 시 공통 수명주기 확장이 끊긴다.
    what: Specimen lifecycle은 analyzed에서 끝나며, 이후 보관/폐기 처리는 각 부서 내규를 따른다고만 한다. 보관,
      폐기, 이관, 재검 가능 여부 같은 상태나 부서별 정책을 연결하는 확장 지점이 없다.
    why: 검체 생애주기는 결과 보고 이후에도 재검, 보관 기간, 폐기 승인, 규정 변경에 영향을 받는다. 현재 모델은 analyzed 이후를
      공통 상태 모델 밖으로 빼기 때문에 새 부서나 새 보관 정책이 생길 때 각 부서 내규를 별도로 해석해야 한다. EMR/LIS 통합
      권위 문서로는 검체 추적과 정책 변경의 연속성을 유지하기 어렵다.
    how_to_fix: Specimen lifecycle에 post-analysis 상태를 추가하거나
      SpecimenDisposition/RetentionPolicy 엔티티를 만들어 부서별 정책을 참조하게 한다. 공통 상태 전이와
      부서별 예외를 분리해 새 부서가 정책 인스턴스를 추가하는 방식으로 확장되게 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 검체의 전체 생애주기와 부서별 운영 정책을 통합 설계에서 안정적으로 확장하는 목적.
      failure_condition: 새 부서, 새 보관/폐기 규정, 재검 또는 추적 요구가 추가되는 경우.
      impact: 공통 온톨로지 밖의 부서 내규가 상태 권위가 되어 통합 시스템이 검체 후속 상태를 일관되게 처리하기 어렵다.
      evidence_refs:
        - Specimen.lifecycle [collected, received, in_analysis, analyzed]
        - "state_rules: analyzed 이후 보관/폐기 처리는 각 부서 내규를 따른다"
        - "Department.definition: 검사 수행 부서"
    causal_path:
      root_cause_candidate: Specimen의 공통 lifecycle이 analyzed에서 종료되고 이후 정책을 모델 내부 개념으로 연결하지 않는다.
      root_cause_step_id: evolution-candidate-004.cause-004
      steps:
        - cause_id: evolution-candidate-004.cause-001
          claim: Specimen lifecycle은 analyzed 이후 상태를 포함하지 않는다.
          relation_to_previous: null
          evidence_refs:
            - Specimen.lifecycle [collected, received, in_analysis, analyzed]
        - cause_id: evolution-candidate-004.cause-002
          claim: 보관/폐기 처리는 각 부서 내규로 위임되어 있다.
          relation_to_previous: causes
          evidence_refs:
            - "state_rules: Specimen이 analyzed가 된 뒤의 보관/폐기 처리는 각 부서 내규를 따른다"
        - cause_id: evolution-candidate-004.cause-003
          claim: 부서별 정책을 표현하는 RetentionPolicy나 disposition 관계가 없다.
