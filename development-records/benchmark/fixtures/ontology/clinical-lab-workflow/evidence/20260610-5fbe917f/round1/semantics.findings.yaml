    의미 구분에 한정했다.
  - 외부 표준 매핑 정확성은 웹/외부 문서 접근이 금지되어 검증하지 않았다.
  - 역할 정의 파일은 허용 참조로 선언되었으나 실행 환경에서 해당 상대 경로를 읽을 수 없어, prompt packet에 포함된
    semantics 역할 정의 텍스트를 기준으로 수행했다.
