findings:
  - candidate_id: coverage-candidate-001
    target: clinical-lab-ontology.yaml / entities
    evidence_anchor: "Embedded Materialized Input: entities list includes Order,
      StatOrder, Patient, Specimen, Test, Assay, Result, Report, Department,
      Staff, CriticalValue"
    claim: EMR/LIS 통합 권위 문서에 필요한 검사 주문-검체 연결의 하위 영역이 누락되어 있다.
    what: 온톨로지는 Order가 여러 Specimen을 가진다는 관계만 두고, 개별 Test 또는 ordered_tests가 어떤
      Specimen과 어떤 수행 단위에 배정되는지 표현하는 OrderItem, SpecimenRequirement, Accession
      또는 TestSpecimenAssignment 같은 중간 개념을 제공하지 않는다.
    why: 주문 가능한 카탈로그 단위(Test), 검체(Specimen), 분석 수행 단위(Assay), 결과(Result)는 존재하지만 이들을
      케이스별로 결합하는 주문 라인/접수/배정 개념이 없다. EMR/LIS 통합에서는 하나의 Order 안에 여러
      ordered_tests와 여러 Specimen이 공존할 수 있으므로, 어떤 검사 항목이 어떤 검체에서 수행되고 어떤 결과로
      이어지는지의 권위 범위가 비어 있게 된다.
    how_to_fix: Order와 Test 사이에 주문 라인 개념(OrderItem 또는 OrderedTest)을 추가하고, 각 라인이
      required specimen, collected/received specimen, assay mapping,
      result_refs를 갖도록 세분화한다. 필요하면 LIS 접수번호 기반 Accession/AccessionItem을 별도 개념으로
      두어 Order, Specimen, Test/Assay, Result를 연결한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 주문부터 보고까지의 엔티티·관계·상태를 정의하는 목적
      failure_condition: 한 주문에 여러 ordered_tests와 여러 Specimen이 있을 때 특정 검사 항목이 어떤 검체·분석
        수행·결과와 연결되는지 결정해야 하는 경우
      impact: 핵심 연동 단위가 누락되어 EMR 주문, LIS 접수/수행, 결과 반환 사이의 매핑 권위가 문서 밖으로 밀려나며 구현마다 다른
        연결 규칙을 만들 위험이 크다.
      evidence_refs:
        - "Embedded Materialized Input: Order.attributes.ordered_tests"
        - "Embedded Materialized Input: Order-Specimen relation has_many"
        - "Embedded Materialized Input: Result.test_ref and
          Result-derived_from-Specimen"
        - "Embedded Materialized Input: Test and Assay entities"
    causal_path:
      root_cause_candidate: 온톨로지가 주문·검체·결과의 상위 엔티티는 포함했지만, 다중 검사/다중 검체 상황에서 쓰이는 중간 실행
        단위를 개념 범위에 포함하지 않았다.
      root_cause_step_id: coverage-candidate-001.cause-003
      steps:
        - cause_id: coverage-candidate-001.cause-001
          claim: Order는 ordered_tests 목록과 여러 Specimen 관계를 동시에 가진다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Order.attributes.ordered_tests"
            - "Embedded Materialized Input: relations Order to Specimen has_many"
        - cause_id: coverage-candidate-001.cause-002
          claim: Result는 Test와 Specimen을 참조하지만 Order 내부의 특정 주문 라인이나 접수 항목을 참조하지 않는다.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: Result.attributes.test_ref"
            - "Embedded Materialized Input: relations Result to Specimen
              derived_from"
        - cause_id: coverage-candidate-001.cause-003
          claim: Test와 Assay는 별도 엔티티로 존재하나 주문된 Test가 수행 Assay로 배정되는 개념은 없다.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: Test entity"
            - "Embedded Materialized Input: Assay entity"
            - "Embedded Materialized Input: notes Test와 Assay는 카탈로그 정비 후 통합 여부를
              재검토한다"
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-002
    target: clinical-lab-ontology.yaml / entities and state_rules
    evidence_anchor: "Embedded Materialized Input: Specimen.lifecycle [collected,
      received, in_analysis, analyzed]; state_rules mention post-analyzed
      storage/disposal follows departmental rules"
    claim: 검체 전처리·품질부적합·거절·재채취 영역이 개념 모델에 표현되어 있지 않다.
    what: Specimen에는 collected, received, in_analysis, analyzed만 있고 rejected,
      compromised, insufficient, recollect_requested, cancelled/disposed 같은 상태나
      rejection reason, collection site, collector, received_at, condition,
      volume 등 운영 판단에 필요한 하위 개념이 없다.
    why: 임상검사 워크플로에서 검체가 분석으로 바로 진행되지 못하는 경우는 주문-결과 경로의 핵심 예외 영역이다. 현재 모델은 정상 경로와 분석
      후 내규 위임만 표현하므로, 부적합 검체 처리, 재채취 요청, EMR 통보, 결과 미생성 사유 같은 연동 책임 범위가 비어 있다.
    how_to_fix: Specimen 상태를 수집/접수/검수/거절/재채취/분석/보관/폐기까지 확장하고, SpecimenQuality 또는
      SpecimenRejection 개념을 추가해 reject_reason, condition_at_receipt,
      received_at, requested_recollection, notifying party를 표현한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 주문부터 보고까지의 임상검사 파이프라인 상태 모델을 EMR/LIS 통합 권위로 제공하는 목적
      failure_condition: 검체가 부적합하거나 부족하거나 잘못 채취되어 분석/보고로 진행되지 못하고 EMR에 상태 또는 재채취 요청을 전달해야 하는 경우
      impact: 정상 분석 경로 밖의 주요 운영 상태가 문서에 없어 시스템이 검사 지연, 취소, 재채취, 미보고 사유를 일관되게 교환하기 어렵다.
      evidence_refs:
        - "Embedded Materialized Input: Specimen.lifecycle"
        - "Embedded Materialized Input: state_rules third rule"
        - "Embedded Materialized Input: Specimen.attributes"
    causal_path:
      root_cause_candidate: Specimen 개념 범위가 정상 흐름의 수집-접수-분석 상태에 집중되어 예외/품질 관리 하위 영역을 포함하지 않았다.
      root_cause_step_id: coverage-candidate-002.cause-003
      steps:
        - cause_id: coverage-candidate-002.cause-001
          claim: Specimen lifecycle은 collected, received, in_analysis, analyzed만 정의한다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Specimen.lifecycle"
        - cause_id: coverage-candidate-002.cause-002
          claim: 분석 후 보관/폐기만 부서 내규로 위임되어 있고, 분석 전 부적합/거절/재채취 경로는 정의되어 있지 않다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: state_rules third rule"
        - cause_id: coverage-candidate-002.cause-003
          claim: Specimen 속성은 collected_at, type, barcode 중심이며 접수 시각, 상태 판정, 거절 사유 같은 품질
            하위 개념을 담지 않는다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: Specimen.attributes"
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-003
    target: clinical-lab-ontology.yaml / CriticalValue and notification coverage
    evidence_anchor: "Embedded Materialized Input: CriticalValue.attributes notified
      boolean note says notification time and recipient are in phone log ledger"
    claim: 위험 결과 통보 워크플로의 개념 범위가 boolean 플래그에 그쳐 운영 하위 영역을 충분히 커버하지 못한다.
    what: CriticalValue는 test_ref, bounds, notified만 정의하고, 실제 위험 결과 발생 인스턴스, 통보 시각,
      수신자, read-back/acknowledgement, escalation, failed contact, 담당자 등 통보 워크플로
      개념이 없다. 오히려 통보 시각과 수신자는 외부 전화 기록 대장에 있다고만 적혀 있다.
    why: 위험 결과 통보는 결과 보고와 별개의 운영 책임과 감사 추적이 필요한 하위 영역이다. 현재 모델은 기준 범위와 완료 여부만 포함하므로,
      EMR/LIS 통합 권위 문서로는 어떤 결과가 언제 누구에게 어떻게 통보·확인·재시도되었는지의 개념 범위를 닫지 못한다.
    how_to_fix: CriticalValueDefinition과 CriticalResultEvent를 분리하고,
      CriticalNotification 또는 NotificationAttempt 엔티티를 추가한다. 각 통보 기록에
      result_ref, triggered_at, recipient, notifier, channel,
      acknowledged_at/read_back, escalation_status, failure_reason을 포함한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 운영 시 생길 위험을 고려한 EMR/LIS 통합 개념 권위 문서로서 위험 결과 통보 상태와 책임을 표현하는 목적
      failure_condition: critical value가 발생해 LIS에서 EMR/임상의에게 통보 상태, 수신 확인, 실패/재시도 정보를
        공유하거나 감사해야 하는 경우
      impact: 통보 완료 여부 외의 하위 워크플로가 외부 대장에 의존해 통합 모델 밖으로 빠지며, 환자 안전 관련 운영 증거와 시스템 상태가
        불일치할 수 있다.
      evidence_refs:
        - "Embedded Materialized Input: CriticalValue.attributes"
        - "Embedded Materialized Input: CriticalValue.notified note"
    causal_path:
      root_cause_candidate: CriticalValue가 기준 정의와 통보 완료 여부만 담고, 발생 이벤트와 통보 시도/확인 개념을
        온톨로지 범위에 포함하지 않았다.
      root_cause_step_id: coverage-candidate-003.cause-003
      steps:
        - cause_id: coverage-candidate-003.cause-001
          claim: CriticalValue는 test_ref, lower_bound, upper_bound, notified만 가진다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: CriticalValue.attributes"
        - cause_id: coverage-candidate-003.cause-002
          claim: 통보 시각과 수신자는 온톨로지 안의 엔티티가 아니라 전화 기록 대장에 있다고 명시되어 있다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: CriticalValue.notified note"
        - cause_id: coverage-candidate-003.cause-003
          claim: Result와 CriticalValue 사이에 특정 결과가 위험 결과 이벤트를 발생시킨다는 관계가 없다.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: relations list"
            - "Embedded Materialized Input: Result entity"
            - "Embedded Materialized Input: CriticalValue entity"
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-004
    target: clinical-lab-ontology.yaml / Report and Result status coverage
    evidence_anchor: "Embedded Materialized Input: Result.status [preliminary,
      final, corrected]; Report.result_status [prelim, finalized, amended];
      state_rules mention corrected -> amended with nightly sync"
    claim: 결과 수정·정정의 감사 및 버전 하위 영역이 누락되어 있다.
    what: Result와 Report는 corrected/amended 상태를 갖지만, 원 결과 버전, 수정 사유, 수정자, 수정 시각,
      대체/취소 여부, 임상의 재통보 같은 correction/amendment 이벤트 개념은 없다.
    why: 보고 후 결과 정정은 임상 의사결정과 법적 감사에 직접 영향을 주는 영역이다. 상태 값만 존재하면 어떤 값이 무엇에서 무엇으로 바뀌었고
      누가 왜 승인했는지의 권위 개념이 부족해 EMR/LIS 통합에서 변경 이력과 재보고 책임을 일관되게 구현하기 어렵다.
    how_to_fix: ResultAmendment 또는 ReportAmendment 엔티티를 추가해
      prior_result_ref/prior_value, new_value, reason, amended_by, amended_at,
      approval, clinician_notification_status를 표현한다. Result/Report 상태는 최신 상태 표시로
      두고 amendment event를 권위 이력으로 삼는다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: 결과 보고 상태 모델을 EMR/LIS 통합의 개념 권위로 쓰는 목적
      failure_condition: final 보고 이후 corrected/amended가 발생하여 변경 이력, 사유, 승인, 재통보를 교환하거나 감사해야 하는 경우
      impact: 상태 전이만으로는 정정의 내용과 책임을 보존할 수 없어 결과 신뢰성과 운영 감사성이 약해진다.
      evidence_refs:
        - "Embedded Materialized Input: Result.status"
        - "Embedded Materialized Input: Report.result_status"
        - "Embedded Materialized Input: state_rules second rule"
    causal_path:
      root_cause_candidate: 정정/수정 상태는 모델링했지만 그 상태를 발생시키는 이력 이벤트와 감사 속성을 별도 하위 영역으로 포함하지 않았다.
      root_cause_step_id: coverage-candidate-004.cause-003
      steps:
        - cause_id: coverage-candidate-004.cause-001
          claim: Result.status에는 corrected가 있고 Report.result_status에는 amended가 있다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Result.status"
            - "Embedded Materialized Input: Report.result_status"
        - cause_id: coverage-candidate-004.cause-002
          claim: 상태 규칙은 corrected 발생 시 Report.result_status가 amended가 되어야 한다고만 정의한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - "Embedded Materialized Input: state_rules second rule"
        - cause_id: coverage-candidate-004.cause-003
          claim: 엔티티 목록에는 amendment/correction event, prior version, reason, approval,
            notification을 표현하는 개념이 없다.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: entities list"
      unresolved_beyond_evidence: null
  - candidate_id: coverage-candidate-005
    target: clinical-lab-ontology.yaml / notes and operational metrics
    evidence_anchor: "Embedded Materialized Input: notes turnaround_time(TAT) is
      calculated from collected_at to released_at and dashboard team maintains
      its own formula"
    claim: TAT 및 운영 지표 영역이 권위 모델 밖으로 빠져 있다.
    what: TAT는 notes에서 collected_at부터 released_at까지 계산한다고만 쓰고, 단계별 시간표지(received_at,
      analysis_started_at, verified_at 등), TAT policy, SLA breach,
      pause/exclusion reason, dashboard formula authority를 온톨로지로 모델링하지 않는다.
    why: EMR/LIS 통합의 운영 위험 관점에서 TAT는 주문 지연, 검체 지연, 분석 지연, 보고 지연을 나누어 관리하는 핵심 영역이다.
      현재는 대시보드 팀의 자체 계산식으로 남아 있어 권위 문서가 운영 지표의 개념 범위를 통제하지 못한다.
    how_to_fix: WorkflowEvent 또는 LabMilestone 엔티티를 추가해 ordered/placed, collected,
      received, analysis_started, verified, released 같은 시각을 표준화하고,
      TATMetric/TATPolicy로 start/end milestone, exclusions, priority별 목표, breach
      상태를 정의한다.
    upstream_evidence_required: false
    severity_hint: low
    materiality_basis: null
    causal_path: null
domain_constraints_used: []
domain_context_assumptions:
  - session_domain이 none이므로 별도 도메인 문서나 외부 표준은 사용하지 않았다.
  - 임상검사 워크플로의 일반적 하위 영역 판단은 제공된 요청 문구(EMR/LIS 통합, 주문부터 보고까지, 운영 위험 중심)와 온톨로지
    자체의 정의·노트에서 파생했다.
  - 웹 리서치가 금지되어 있어 업계 표준 대비 정밀 비교가 아니라 경계 내 자료에서 확인되는 포괄 범위 공백만 지적했다.
validation:
  unaddressable_candidates: []
