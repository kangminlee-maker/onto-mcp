  - finding_id: finding-017
    lens_id: semantics
    source_ref: .onto/review/20260610-5fbe917f/round1/semantics.findings.yaml#semantics-candidate-004
    target: Specimen -> Result produces 관계
    evidence_anchor: clinical-lab-ontology.yaml:49-55, clinical-lab-ontology.yaml:111-114
    claim: 검체가 결과를 생산한다는 관계명은 물리적 검체와 분석 수행 행위의 의미를 혼동한다.
    lens_rationale_summary: Specimen은 환자에게서 채취한 물리적 대상이고, 결과는 그 검체에 대해 수행된 검사/분석에서
      나온 값이다. `Specimen produces Result`라고 이름 붙이면 물리적 검체가 능동적으로 결과를 생성하는 것처럼
      모델링되어 결과 발생의 의미 주체가 흐려진다. 이는 결과 provenance에서 검체, 검사 항목, 분석 수행 행위의 역할을 구분해야
      하는 통합 문서의 의미 정확성을 떨어뜨린다.
    proposed_action: "`Specimen -> Result` 관계는 `source_for`, `used_for`,
      `has_result`처럼 provenance 의미로 바꾸거나, `Assay`/수행 이벤트 개념을 통해 `AssayExecution
      produces Result`와 `Result derived_from Specimen`으로 분리한다."
    affected_purpose: 검체, 분석 수행, 결과 생성의 의미 주체를 정확히 구분하는 목적.
    failure_condition: 결과 provenance, 장비/부서 책임, 재검/수정 결과 추적을 관계 의미에 따라 구현할 때.
    impact: 결과를 생성한 수행 행위와 결과가 유래한 검체가 같은 의미처럼 취급되어 감사, 재검, 장비별 결과 추적의 개념 기반이 약해진다.
    evidence_refs:
      - .onto/review/20260610-5fbe917f/round1/semantics.findings.yaml#semantics-candidate-004
      - clinical-lab-ontology.yaml:49-55
      - clinical-lab-ontology.yaml:111-114
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 검체, 분석 수행, 결과 생성의 의미 주체를 정확히 구분하는 목적.
      failure_condition: 결과 provenance, 장비/부서 책임, 재검/수정 결과 추적을 관계 의미에 따라 구현할 때.
      impact: 결과를 생성한 수행 행위와 결과가 유래한 검체가 같은 의미처럼 취급되어 감사, 재검, 장비별 결과 추적의 개념 기반이 약해진다.
      evidence_refs:
        - clinical-lab-ontology.yaml:49-55
        - clinical-lab-ontology.yaml:111-114
    causal_path:
      root_cause_candidate: 결과의 유래 물체와 결과 생성 행위를 별도 개념 관계로 분리하지 않고 `produces` 관계를 검체에 부여했다.
      root_cause_step_id: finding-017.cause-002
      steps:
        - cause_id: finding-017.cause-001
          claim: "`Assay`는 분석기에서 수행되는 검사 항목으로 정의된다."
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml:49-55
        - cause_id: finding-017.cause-002
          claim: 관계 모델은 `Result`가 `Specimen`에서 유래한다고 하면서 동시에 `Specimen`이 `Result`를 생산한다고
            한다.
          relation_to_previous: causes
