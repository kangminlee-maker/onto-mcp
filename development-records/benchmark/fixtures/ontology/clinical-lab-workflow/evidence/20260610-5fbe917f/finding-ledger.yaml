findings:
  - finding_id: finding-001
    lens_id: axiology
    source_ref: .onto/review/20260610-5fbe917f/round1/axiology.findings.yaml#axiology-candidate-001
    target: clinical-lab-ontology.yaml / Result.status, Report.result_status, and
      report state rule
    evidence_anchor: .onto/review/20260610-5fbe917f/execution-preparation/materialized-input.md:69-83,121-123;
      .onto/review/20260610-5fbe917f/execution-preparation/review-value-alignment-criteria.yaml:6-8
    claim: 보고 상태 권위를 Report에 중복 배치하고 야간 동기화를 허용해 EMR/LIS 통합용 개념 권위 문서라는 목적과 어긋난다.
    lens_rationale_summary: 리뷰 기준은 이 파일이 EMR/LIS 통합의 개념 권위 문서로 적절한지, 엔티티·관계·상태 모델과
      운영 위험을 보라는 것이다. 그런데 임상의가 신뢰하는 보고 상태가 결과 상태와 다른 enum/권위/동기화 주기를 갖기 때문에
      corrected 결과가 발생한 뒤 다음 배치 전까지 EMR이 outdated finalized 상태를 신뢰할 수 있다. 이는 단순
      구조 문제가 아니라 '권위 문서'가 권위 원천과 최신성 약속을 흐리게 만드는 목적 drift다.
    proposed_action: 결과 상태의 단일 canonical 상태 모델을 정하고 Report.result_status는 그 상태의
      projection인지, 별도 임상 보고 상태인지 명시한다. corrected/amended 전이는 야간 배치가 아니라 통합 계약상
      즉시성 또는 허용 지연 SLA를 포함한 상태 전이 규칙으로 닫는다.
    affected_purpose: EMR/LIS 통합의 개념 권위 문서로 사용하기 위한 상태 권위와 운영 위험 판단.
    failure_condition: Result.status가 corrected로 바뀐 뒤 Report.result_status가 야간 배치
      전까지 finalized로 남아 임상의 또는 EMR 소비자가 stale 보고 상태를 신뢰하는 경우.
    impact: 권위 문서가 상태의 source of truth와 동기화 신뢰 조건을 모호하게 만들어 통합 설계자가 안전한 precedence와
      invalid-input/stale-state 처리를 결정할 수 없다.
    evidence_refs:
      - .onto/review/20260610-5fbe917f/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:69-83
      - materialized-input.md:121-123
      - review-value-alignment-criteria.yaml:6-8
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS 통합의 개념 권위 문서로 사용하기 위한 상태 권위와 운영 위험 판단.
      failure_condition: Result.status가 corrected로 바뀐 뒤 Report.result_status가 야간 배치
        전까지 finalized로 남아 임상의 또는 EMR 소비자가 stale 보고 상태를 신뢰하는 경우.
      impact: 권위 문서가 상태의 source of truth와 동기화 신뢰 조건을 모호하게 만들어 통합 설계자가 안전한 precedence와
        invalid-input/stale-state 처리를 결정할 수 없다.
      evidence_refs:
        - materialized-input.md:69-83
        - materialized-input.md:121-123
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 보고 상태를 단일 canonical 상태로 닫지 않고 Result와 Report 양쪽에 다른 enum과
        권위 문구로 중복 모델링했다.
      root_cause_step_id: finding-001.cause-004
      steps:
        - cause_id: finding-001.cause-001
          claim: Result.status는 preliminary/final/corrected이고 Report.result_status는
            prelim/finalized/amended로 별도 enum이다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-83
        - cause_id: finding-001.cause-002
          claim: Report.result_status는 임상의가 신뢰하는 권위 값이라고 선언되어 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:80-83
        - cause_id: finding-001.cause-003
          claim: corrected 발생 시 amended 반영은 야간 1회 동기화 배치에 맡겨져 즉시 일관성을 보장하지 않는다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:121-123
        - cause_id: finding-001.cause-004
          claim: EMR/LIS 통합 권위 문서 검토 목적에서는 이런 stale authority window가 상태 precedence와 운영 위험
            판단을 약화한다.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:6-8
            - review-target-profile.yaml:17-20
      unresolved_beyond_evidence: null
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260610-5fbe917f/round1/axiology.findings.yaml#axiology-candidate-002
    target: clinical-lab-ontology.yaml / CriticalValue notification model
    evidence_anchor: .onto/review/20260610-5fbe917f/execution-preparation/materialized-input.md:100-106;
      .onto/review/20260610-5fbe917f/execution-preparation/review-value-alignment-criteria.yaml:6-8
    claim: CriticalValue의 즉시 통보 책임을 boolean과 외부 전화 기록 대장으로 밀어내 운영 위험 중심 검토 목적을 충족하지
      못한다.
    lens_rationale_summary: 사용자 요청의 기준은 EMR/LIS 통합 권위 문서로서 운영 시 생길 위험까지 검토하는 것이다. 즉시
      통보가 필요한 결과는 EMR/LIS 사이의 책임 경계와 auditability가 중요한 상태인데, 핵심 증거를 외부 대장으로만 남기면
      통합 소비자가 통보 완료의 의미, 지연, 실패, 중복 통보를 개념적으로 구분할 수 없다.
    proposed_action: CriticalValueNotification 또는 NotificationEvent 같은 별도 개념을 추가해
      critical value, recipient, notified_at, channel, acknowledgement,
      failure/retry 상태를 모델링한다. notified boolean은 해당 이벤트의 파생 projection으로 낮추거나
      제거한다.
    affected_purpose: EMR/LIS 통합 권위 문서가 운영 위험과 상태 모델의 개념적 타당성을 설명해야 한다는 목적.
    failure_condition: 위험 결과가 발생했지만 전화 기록 대장과 LIS/EMR 상태가 불일치하거나 통보 실패/지연이 boolean 하나로 덮이는 경우.
    impact: 통합 설계자가 critical value 통보의 책임 경계, 감사 가능성, 실패 처리를 문서에서 도출할 수 없어 운영상 위험한
      상태를 정상 완료처럼 취급할 수 있다.
    evidence_refs:
      - .onto/review/20260610-5fbe917f/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:100-106
      - review-value-alignment-criteria.yaml:6-8
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS 통합 권위 문서가 운영 위험과 상태 모델의 개념적 타당성을 설명해야 한다는 목적.
      failure_condition: 위험 결과가 발생했지만 전화 기록 대장과 LIS/EMR 상태가 불일치하거나 통보 실패/지연이 boolean 하나로 덮이는 경우.
      impact: 통합 설계자가 critical value 통보의 책임 경계, 감사 가능성, 실패 처리를 문서에서 도출할 수 없어 운영상 위험한
        상태를 정상 완료처럼 취급할 수 있다.
      evidence_refs:
        - materialized-input.md:100-106
        - review-value-alignment-criteria.yaml:6-8
    causal_path:
      root_cause_candidate: 즉시 통보라는 목적상 핵심 이벤트를 온톨로지의 상태/관계 개념으로 승격하지 않고 boolean 속성과 외부 기록으로 축소했다.
      root_cause_step_id: finding-002.cause-003
      steps:
        - cause_id: finding-002.cause-001
          claim: CriticalValue는 즉시 통보가 필요한 위험 결과 값 범위로 정의된다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-101
        - cause_id: finding-002.cause-002
          claim: 온톨로지 내부 통보 모델은 notified boolean뿐이고 시각과 수신자는 외부 전화 기록 대장에 있다고 되어 있다.
          relation_to_previous: enables
          evidence_refs:
            - materialized-input.md:102-106
        - cause_id: finding-002.cause-003
          claim: 운영 위험 중심의 EMR/LIS 통합 권위 문서 목적에서는 통보 이벤트의 책임과 실패 상태를 도출할 수 있어야 한다.
          relation_to_previous: causes
          evidence_refs:
            - review-value-alignment-criteria.yaml:6-8
      unresolved_beyond_evidence: null
  - finding_id: finding-003
    lens_id: coverage
    source_ref: .onto/review/20260610-5fbe917f/round1/coverage.findings.yaml#coverage-candidate-001
    target: clinical-lab-ontology.yaml / entities
    evidence_anchor: "Embedded Materialized Input: entities list includes Order,
      StatOrder, Patient, Specimen, Test, Assay, Result, Report, Department,
      Staff, CriticalValue"
    claim: EMR/LIS 통합 권위 문서에 필요한 검사 주문-검체 연결의 하위 영역이 누락되어 있다.
    lens_rationale_summary: 주문 가능한 카탈로그 단위(Test), 검체(Specimen), 분석 수행 단위(Assay),
      결과(Result)는 존재하지만 이들을 케이스별로 결합하는 주문 라인/접수/배정 개념이 없다. EMR/LIS 통합에서는 하나의
      Order 안에 여러 ordered_tests와 여러 Specimen이 공존할 수 있으므로, 어떤 검사 항목이 어떤 검체에서 수행되고
      어떤 결과로 이어지는지의 권위 범위가 비어 있게 된다.
    proposed_action: Order와 Test 사이에 주문 라인 개념(OrderItem 또는 OrderedTest)을 추가하고, 각 라인이
      required specimen, collected/received specimen, assay mapping,
      result_refs를 갖도록 세분화한다. 필요하면 LIS 접수번호 기반 Accession/AccessionItem을 별도 개념으로
      두어 Order, Specimen, Test/Assay, Result를 연결한다.
    affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 주문부터 보고까지의 엔티티·관계·상태를 정의하는 목적
    failure_condition: 한 주문에 여러 ordered_tests와 여러 Specimen이 있을 때 특정 검사 항목이 어떤 검체·분석
      수행·결과와 연결되는지 결정해야 하는 경우
    impact: 핵심 연동 단위가 누락되어 EMR 주문, LIS 접수/수행, 결과 반환 사이의 매핑 권위가 문서 밖으로 밀려나며 구현마다 다른
      연결 규칙을 만들 위험이 크다.
    evidence_refs:
      - .onto/review/20260610-5fbe917f/round1/coverage.findings.yaml#coverage-candidate-001
      - "Embedded Materialized Input: Order.attributes.ordered_tests"
      - "Embedded Materialized Input: Order-Specimen relation has_many"
      - "Embedded Materialized Input: Result.test_ref and
        Result-derived_from-Specimen"
      - "Embedded Materialized Input: Test and Assay entities"
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 주문부터 보고까지의 엔티티·관계·상태를 정의하는 목적
      failure_condition: 한 주문에 여러 ordered_tests와 여러 Specimen이 있을 때 특정 검사 항목이 어떤 검체·분석
        수행·결과와 연결되는지 결정해야 하는 경우
      impact: 핵심 연동 단위가 누락되어 EMR 주문, LIS 접수/수행, 결과 반환 사이의 매핑 권위가 문서 밖으로 밀려나며 구현마다 다른
        연결 규칙을 만들 위험이 크다.
      evidence_refs:
        - "Embedded Materialized Input: Order.attributes.ordered_tests"
        - "Embedded Materialized Input: Order-Specimen relation has_many"
        - "Embedded Materialized Input: Result.test_ref and
          Result-derived_from-Specimen"
        - "Embedded Materialized Input: Test and Assay entities"
    causal_path:
      root_cause_candidate: 온톨로지가 주문·검체·결과의 상위 엔티티는 포함했지만, 다중 검사/다중 검체 상황에서 쓰이는 중간 실행
        단위를 개념 범위에 포함하지 않았다.
      root_cause_step_id: finding-003.cause-003
      steps:
        - cause_id: finding-003.cause-001
          claim: Order는 ordered_tests 목록과 여러 Specimen 관계를 동시에 가진다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Order.attributes.ordered_tests"
            - "Embedded Materialized Input: relations Order to Specimen has_many"
        - cause_id: finding-003.cause-002
          claim: Result는 Test와 Specimen을 참조하지만 Order 내부의 특정 주문 라인이나 접수 항목을 참조하지 않는다.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: Result.attributes.test_ref"
            - "Embedded Materialized Input: relations Result to Specimen
              derived_from"
        - cause_id: finding-003.cause-003
          claim: Test와 Assay는 별도 엔티티로 존재하나 주문된 Test가 수행 Assay로 배정되는 개념은 없다.
          relation_to_previous: enables
          evidence_refs:
            - "Embedded Materialized Input: Test entity"
            - "Embedded Materialized Input: Assay entity"
            - "Embedded Materialized Input: notes Test와 Assay는 카탈로그 정비 후 통합 여부를
              재검토한다"
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260610-5fbe917f/round1/coverage.findings.yaml#coverage-candidate-002
    target: clinical-lab-ontology.yaml / entities and state_rules
    evidence_anchor: "Embedded Materialized Input: Specimen.lifecycle [collected,
      received, in_analysis, analyzed]; state_rules mention post-analyzed
      storage/disposal follows departmental rules"
    claim: 검체 전처리·품질부적합·거절·재채취 영역이 개념 모델에 표현되어 있지 않다.
    lens_rationale_summary: 임상검사 워크플로에서 검체가 분석으로 바로 진행되지 못하는 경우는 주문-결과 경로의 핵심 예외
      영역이다. 현재 모델은 정상 경로와 분석 후 내규 위임만 표현하므로, 부적합 검체 처리, 재채취 요청, EMR 통보, 결과 미생성
      사유 같은 연동 책임 범위가 비어 있다.
    proposed_action: Specimen 상태를 수집/접수/검수/거절/재채취/분석/보관/폐기까지 확장하고, SpecimenQuality
      또는 SpecimenRejection 개념을 추가해 reject_reason, condition_at_receipt,
      received_at, requested_recollection, notifying party를 표현한다.
    affected_purpose: 주문부터 보고까지의 임상검사 파이프라인 상태 모델을 EMR/LIS 통합 권위로 제공하는 목적
    failure_condition: 검체가 부적합하거나 부족하거나 잘못 채취되어 분석/보고로 진행되지 못하고 EMR에 상태 또는 재채취 요청을 전달해야 하는 경우
    impact: 정상 분석 경로 밖의 주요 운영 상태가 문서에 없어 시스템이 검사 지연, 취소, 재채취, 미보고 사유를 일관되게 교환하기 어렵다.
    evidence_refs:
      - .onto/review/20260610-5fbe917f/round1/coverage.findings.yaml#coverage-candidate-002
      - "Embedded Materialized Input: Specimen.lifecycle"
      - "Embedded Materialized Input: state_rules third rule"
      - "Embedded Materialized Input: Specimen.attributes"
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 주문부터 보고까지의 임상검사 파이프라인 상태 모델을 EMR/LIS 통합 권위로 제공하는 목적
      failure_condition: 검체가 부적합하거나 부족하거나 잘못 채취되어 분석/보고로 진행되지 못하고 EMR에 상태 또는 재채취 요청을 전달해야 하는 경우
      impact: 정상 분석 경로 밖의 주요 운영 상태가 문서에 없어 시스템이 검사 지연, 취소, 재채취, 미보고 사유를 일관되게 교환하기 어렵다.
      evidence_refs:
        - "Embedded Materialized Input: Specimen.lifecycle"
        - "Embedded Materialized Input: state_rules third rule"
        - "Embedded Materialized Input: Specimen.attributes"
    causal_path:
      root_cause_candidate: Specimen 개념 범위가 정상 흐름의 수집-접수-분석 상태에 집중되어 예외/품질 관리 하위 영역을 포함하지 않았다.
      root_cause_step_id: finding-004.cause-003
      steps:
        - cause_id: finding-004.cause-001
          claim: Specimen lifecycle은 collected, received, in_analysis, analyzed만 정의한다.
          relation_to_previous: null
          evidence_refs:
            - "Embedded Materialized Input: Specimen.lifecycle"
        - cause_id: finding-004.cause-002
          claim: 분석 후 보관/폐기만 부서 내규로 위임되어 있고, 분석 전 부적합/거절/재채취 경로는 정의되어 있지 않다.
          relation_to_previous: symptom_of
          evidence_refs:
