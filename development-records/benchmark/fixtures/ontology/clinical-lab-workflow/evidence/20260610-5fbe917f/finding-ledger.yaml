        behavior and integration risk around reportable results.
      failure_condition: When a result falls into a critical range, the ontology
        provides no structural route from the Result to the applicable
        CriticalValue or notification handling.
      impact: Implementations may treat critical notification as an ungoverned side
        process even though the ontology declares it as part of the result
        concept space, weakening operational completeness and auditability.
      evidence_refs:
        - clinical-lab-ontology.yaml:95
        - clinical-lab-ontology.yaml:101
        - clinical-lab-ontology.yaml:103
    causal_path:
      root_cause_candidate: CriticalValue is modeled as an entity with only a Test
        reference and is omitted from the relation graph.
      root_cause_step_id: finding-019.cause-003
      steps:
        - cause_id: finding-019.cause-001
          claim: CriticalValue is declared as the range requiring immediate notification.
          relation_to_previous: null
          evidence_refs:
