      - finding-001
      - finding-009
      - finding-012
    relation_refs:
      - rel-001
      - rel-003
    raised_by_lens_ids:
      - axiology
      - evolution
      - logic
    issue_statement: 결과 상태와 보고 상태가 서로 다른 enum과 권위 선언으로 중복되어 EMR/LIS 통합자가 어떤 상태를
      canonical authority로 삼아야 하는지 결정할 수 없다.
    proposed_action: 결과 상태의 단일 canonical 상태 모델을 정하고 Report.result_status가 그
      projection인지 별도 임상 보고 상태인지 명시하며, 전체 enum 매핑과 동기화 지연 허용 범위를 상태 전이 규칙에 포함한다.
