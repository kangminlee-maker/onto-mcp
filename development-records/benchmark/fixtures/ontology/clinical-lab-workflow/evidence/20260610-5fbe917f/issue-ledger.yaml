    failure_condition: Result.status가 corrected로 바뀐 뒤 Report.result_status가 야간 배치
      전까지 finalized로 남거나, 신규 상태나 외부 상태 코드 변경 시 Result와 Report 상태 대응을 문서 안에서 결정해야
      하는 경우.
    impact: 권위 문서가 상태 source of truth, enum 대응, 동기화 신뢰 조건을 닫지 못해 EMR, LIS, 대시보드 소비자가
