schema_version: 1
session_id: 20260610-5fbe917f
relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-009
    relation: same_root_candidate
    root_hypothesis: Result.status와 Report.result_status가 동일 결과 상태 정보를 두 권위 표면에 중복
      모델링하고 완전한 매핑/권위 방향을 닫지 않았기 때문에 stale authority와 확장 시 다중 수정 문제가 함께 발생한다.
    shared_cause: null
    rationale: finding-001은 corrected 이후 Report.result_status가 야간 배치 전까지 finalized로
      남는 stale 권위 문제를 지적하고, finding-009는 같은 두 상태 enum과 야간 동기화 규칙이 새 상태 추가 때 계속
      함께 수정되어야 한다고 지적한다. 두 causal path 모두 Result/Report 상태 중복과 불완전한 동기화 규칙을 핵심
      원인으로 둔다.
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-001
    to_finding_id: finding-013
    relation: shared_cause_candidate
    root_hypothesis: Report.result_status를 임상의가 신뢰하는 권위 값으로 선언하면서 corrected->amended
      전이를 야간 배치에 맡긴 시간 계약이 닫히지 않아 stale authority window가 생긴다.
    shared_cause:
      cause_claim: 정정 상태 전이 규칙이 즉시 의무와 배치 기반 지연 가능성을 하나의 선언에 섞고 허용 시간 구간을 정의하지 않는다.
      from_cause_ref: finding-001.cause-003
      to_cause_ref: finding-013.cause-004
    rationale: finding-001의 운영 위험은 corrected 발생 후 amended 반영이 야간 배치에 맡겨져 즉시 일관성이
      보장되지 않는다는 점이고, finding-013은 같은 문장을 형식적으로 즉시 의무와 eventual batch guarantee가
      섞인 규칙으로 해석한다. 하나는 목적 drift, 하나는 논리 modality 충돌이지만 같은 시간 조건 미정의에서 파생된다.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-009
    to_finding_id: finding-012
    relation: same_root_candidate
    root_hypothesis: Result.status와 Report.result_status가 서로 다른 enum 값 공간을 가지면서 동일
      정보 유지 claim의 전체 대응 규칙을 제공하지 않아 상태 권위와 전이 규칙이 닫히지 않는다.
    shared_cause: null
    rationale: finding-009는 중복 enum과 동기화 규칙이 확장성/연속성을 약화한다고 보고, finding-012는 같은 enum
      불일치가 형식적으로 총체적 매핑 부재를 만든다고 본다. 둘 다 Result.status와 Report.result_status의 값
      집합 차이와 corrected/amended만 명시된 규칙을 원인으로 삼는다.
    confidence: high
  - relation_id: rel-004
    from_finding_id: finding-012
    to_finding_id: finding-014
    relation: duplicates
    root_hypothesis: 동일 결과 상태 의미가 Result.status와 Report.result_status에 서로 다른 enum
      어휘와 권위 선언으로 중복 표현되어 canonical 상태와 표시/투영 상태의 경계가 없다.
    shared_cause: null
    rationale: finding-012는 논리 lens에서 동일 정보 유지 claim과 다른 enum 값 공간의 충돌을 지적하고,
      finding-014는 의미 lens에서 동일 상태 의미의 중복 어휘와 권위 선언을 지적한다. 표현 축은 다르지만 대상 필드, 증거,
      제안 조치가 사실상 같은 결함을 가리킨다.
    confidence: high
  - relation_id: rel-005
    from_finding_id: finding-001
    to_finding_id: finding-006
    relation: shared_cause_candidate
    root_hypothesis: 결과 정정/수정이 상태값 전이 중심으로만 모델링되고 amendment event와 권위 이력 개념이 없어서 보고
      상태 최신성 및 감사 가능성이 모두 약해진다.
    shared_cause:
      cause_claim: 정정/수정 상태는 모델링했지만 그 상태를 발생시키는 이력 이벤트와 감사 속성을 별도 하위 영역으로 포함하지 않았다.
      from_cause_ref: finding-001.cause-003
      to_cause_ref: finding-006.cause-003
    rationale: finding-001은 corrected 후 Report 상태가 stale할 수 있는 권위/동기화 문제이고,
      finding-006은 corrected/amended 발생 시 변경 내용, 사유, 승인, 재통보 같은 amendment 이력이
      없다는 문제다. 둘 다 정정을 독립 이벤트가 아니라 상태값 변화와 배치 동기화로만 다룬 데서 발생한다.
    confidence: medium
  - relation_id: rel-006
    from_finding_id: finding-002
    to_finding_id: finding-005
    relation: same_root_candidate
    root_hypothesis: CriticalValue 통보를 NotificationEvent 같은 독립 상태/관계 개념으로 승격하지 않고
      notified boolean과 외부 전화 기록 대장으로 축소해 운영 책임과 감사 범위가 닫히지 않는다.
    shared_cause: null
    rationale: finding-002는 axiology 관점에서 즉시 통보 책임과 실패 처리가 boolean/외부 대장으로 밀려난다고 보고,
      finding-005는 coverage 관점에서 통보 워크플로 범위가 boolean에 그친다고 본다. 두 finding 모두
      CriticalValue.notified와 외부 전화 기록 대장을 같은 핵심 원인으로 든다.
    confidence: high
  - relation_id: rel-007
    from_finding_id: finding-002
    to_finding_id: finding-010
    relation: same_root_candidate
    root_hypothesis: CriticalValue가 통보 이벤트 이력을 내부 개념으로 갖지 않고 완료 여부 boolean만 보유해 현재
      운영 책임과 미래 채널/감사 확장 요구를 모두 수용하지 못한다.
    shared_cause: null
    rationale: finding-002는 현재 EMR/LIS 통합에서 통보 완료, 지연, 실패, 중복 통보를 구분할 수 없다는 문제이고,
      finding-010은 전화 외 채널, 복수 수신자, 재시도, 감사 요구가 늘어날 때 확장이 어렵다는 문제다. 둘 다 통보 이벤트
      부재와 notified boolean 의존을 원인으로 둔다.
    confidence: high
  - relation_id: rel-008
    from_finding_id: finding-005
    to_finding_id: finding-019
    relation: shared_cause_candidate
    root_hypothesis: CriticalValue가 Result 및 notification handling과 구조적으로 연결되지 않아 위험
      결과 발생 이벤트와 통보 워크플로가 온톨로지 범위 밖으로 빠진다.
    shared_cause:
      cause_claim: CriticalValue가 기준 정의와 통보 완료 여부만 담고, 발생 이벤트와 통보 시도/확인 개념을 온톨로지 범위에
        포함하지 않았다.
      from_cause_ref: finding-005.cause-003
      to_cause_ref: finding-019.cause-003
    rationale: finding-005는 Result와 CriticalValue 사이에 특정 결과가 위험 결과 이벤트를 발생시킨다는 관계가
      없다고 지적하고, finding-019는 CriticalValue가 Result, Report, Staff, notification
      record와 연결되지 않아 구조 경로가 없다고 지적한다. coverage와 structure의 표현은 다르지만 같은 누락된
      result-to-critical-notification path를 다룬다.
    confidence: high
  - relation_id: rel-009
    from_finding_id: finding-003
    to_finding_id: finding-018
    relation: shared_cause_candidate
    root_hypothesis: 주문된 Test가 실제 수행 Assay 및 Result provenance로 이어지는 중간 실행/매핑 개념이 없어
      order-to-result workflow의 핵심 연결 경로가 끊긴다.
    shared_cause:
      cause_claim: Test와 Assay는 별도 엔티티로 존재하나 주문된 Test가 수행 Assay로 배정되는 개념은 없다.
      from_cause_ref: finding-003.cause-003
      to_cause_ref: finding-018.cause-002
    rationale: finding-003은 다중 ordered_tests/Specimen 상황에서 주문 라인이나 접수 항목이 없어
      Test-Assay-Result 연결 권위가 비어 있다고 보고, finding-018은 Assay가 relation graph에
      포함되지 않아 analyzer execution mapping이 끊긴다고 본다. 둘은 같은 workflow bridge 부재를 다른
      범위에서 포착한다.
    confidence: medium
  - relation_id: rel-010
    from_finding_id: finding-008
    to_finding_id: finding-016
    relation: same_root_candidate
    root_hypothesis: Test와 Assay의 의미 경계와 매핑 계약이 정의되지 않아 신규 항목 등록과 검사 코드 권위가 두 카탈로그
      사이에서 수동 동기화된다.
    shared_cause: null
    rationale: finding-008은 신규 검사/검체 확장 시 Test와 Assay를 동시에 수정해야 하는 진화 문제이고,
      finding-016은 Test와 Assay가 모두 검사 항목으로 정의되지만 의미 경계와 매핑 관계가 닫히지 않았다는 의미 문제다.
      두 causal path 모두 Test/Assay 관계 부재와 신규 항목 양쪽 등록 노트를 근거로 한다.
    confidence: high
  - relation_id: rel-011
    from_finding_id: finding-008
    to_finding_id: finding-018
    relation: shared_cause_candidate
    root_hypothesis: Assay를 실행 단위로 정의하고 신규 항목 등록에 포함하면서도 Test/Result workflow와 연결하지
      않아 카탈로그 동기화와 구조 추적이 모두 약해진다.
    shared_cause:
      cause_claim: Test와 Assay가 모두 검사 항목을 표현하지만 두 엔티티 사이의 관계가 정의되어 있지 않다.
      from_cause_ref: finding-008.cause-001
      to_cause_ref: finding-018.cause-002
    rationale: finding-008은 Test/Assay 관계 부재가 신규 항목 확장 시 양쪽 권위 표면 동기화를 요구한다고 보고,
      finding-018은 같은 관계 부재가 Assay를 order-to-result workflow에서 구조적으로 단절시킨다고 본다.
      두 finding 모두 Assay가 정의되어 있지만 relation graph에 연결되지 않는다는 사실에 기대고 있다.
    confidence: high
  - relation_id: rel-012
    from_finding_id: finding-016
    to_finding_id: finding-018
    relation: same_root_candidate
    root_hypothesis: Assay가 주문 가능한 Test와 구분되는 실행 단위라면 그 의미 차이와 관계 edge가 필요하지만, 현재
      문서는 둘의 경계와 구조 연결을 모두 생략한다.
    shared_cause: null
    rationale: finding-016은 Test/Assay 정의와 노트만으로 의미 경계와 매핑 계약을 알 수 없다고 하고,
      finding-018은 relation graph에서 Assay가 연결되지 않아 workflow 추적이 불가능하다고 한다. 의미 경계
      미정의와 구조 연결 부재는 같은 Test-Assay 계약 누락의 두 증상이다.
    confidence: high
  - relation_id: rel-013
    from_finding_id: finding-017
    to_finding_id: finding-018
    relation: shared_cause_candidate
    root_hypothesis: 결과 생성 주체인 분석 수행 행위/AssayExecution을 모델링하지 않아 Assay는 workflow에서
      단절되고 Specimen이 Result를 produces한다는 부정확한 provenance 관계가 생긴다.
    shared_cause:
      cause_claim: 결과의 유래 물체와 결과 생성 행위를 별도 개념 관계로 분리하지 않고 `produces` 관계를 검체에 부여했다.
      from_cause_ref: finding-017.cause-002
      to_cause_ref: finding-018.cause-002
    rationale: finding-017은 물리적 Specimen과 분석 수행 행위가 혼동되어 Specimen produces Result
      관계가 의미적으로 부정확하다고 지적한다. finding-018은 Assay가 실행 단위로 정의되어도 relation graph에
      없다고 지적한다. 둘 다 Assay/AssayExecution 같은 수행 행위 개념을 결과 provenance에 연결하지 않은 데서
      발생한다.
    confidence: medium
  - relation_id: rel-014
    from_finding_id: finding-004
    to_finding_id: finding-011
    relation: shared_cause_candidate
    root_hypothesis: Specimen lifecycle이 정상 분석 흐름의
      collected-received-in_analysis-analyzed에 머물고 예외/품질/처분 정책을 내부 상태 개념으로 확장하지
      않아 전처리 거절과 사후 보관/폐기 모두 외부 규칙으로 밀린다.
    shared_cause:
      cause_claim: Specimen 개념 범위가 정상 흐름의 수집-접수-분석 상태에 집중되어 예외/품질 관리 하위 영역을 포함하지 않았다.
      from_cause_ref: finding-004.cause-003
      to_cause_ref: finding-011.cause-001
    rationale: finding-004는 분석 전 부적합/거절/재채취 경로가 빠졌다고 보고, finding-011은 analyzed 이후
      보관/폐기 상태가 부서 내규로 빠졌다고 본다. 둘은 lifecycle의 다른 끝을 다루지만 공통적으로 Specimen 상태 모델이
      정상 흐름에만 닫혀 있다는 원인을 공유한다.
    confidence: high
  - relation_id: rel-015
    from_finding_id: finding-015
    to_finding_id: finding-003
    relation: enables
    root_hypothesis: Order 내부의 의미 단위가 priority/is_stat/StatOrder 및 ordered_tests 목록
      수준에 머물고 주문 라인 같은 canonical execution unit이 없으면 STAT 처리와 ordered
      Test-Specimen-Result 매핑이 서로 다른 필드/관행으로 갈라질 수 있다.
    shared_cause: null
    rationale: finding-015는 STAT 주문 의미가 subtype, enum, boolean으로 중복되어 canonical 표현이
      없다고 지적한다. finding-003은 Order 안의 여러 ordered_tests와 여러 Specimen을 케이스별로 결합하는
      주문 라인/접수/배정 개념이 없다고 지적한다. STAT 중복 자체가 주문-검체 연결 누락을 직접 일으키지는 않지만, Order의 실행
      단위를 명확히 세분화하지 않은 모델링이 주문 의미와 downstream 매핑 분기를 가능하게 한다.
    confidence: low
singleton_findings: []
