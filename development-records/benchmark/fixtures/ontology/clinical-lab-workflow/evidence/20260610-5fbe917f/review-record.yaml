        not connected to Result, Report, Staff, or any notification record in
        the ontology graph, a produced Result cannot be structurally traced to
        the critical-value rule that applied or to the notification obligation
        indicated by CriticalValue.notified. For a workflow authority document,
        this leaves an operationally important path disconnected. Source finding
