  - finding_id: finding-015
    lens_id: evolution
    source_ref: .onto/review/20260718-f461553b/round1/evolution.findings.yaml#evolution-candidate-005
    target: clinical-lab-ontology.yaml — CriticalValue rule lifecycle
    evidence_anchor: entities.CriticalValue.attributes
    claim: Critical-value thresholds have no identity, context, or effective
      version, so rule changes overwrite historical meaning instead of evolving
      alongside it.
    lens_rationale_summary: When a threshold changes, the model cannot retain both
      the old rule for prior results and the new rule for current evaluation.
      Adding context-specific thresholds would require changing the entity shape
      or creating indistinguishable duplicate records.
    proposed_action: Give CriticalValue rules stable identities and versions, bind
      bounds to units and applicable context, add effective-from/effective-to
      and status fields, and define supersession so historical evaluations
      retain the rule version used.
    affected_purpose: Continuous and auditable operation of laboratory alert rules
      as policies and catalog definitions evolve.
    failure_condition: A critical threshold changes or different thresholds must
      coexist by context or effective period.
    impact: Historical alerts cannot be reconstructed from the authority model, and
      new rule variants require ambiguous duplication or structural redesign.
    evidence_refs:
