  - finding_id: finding-012
    lens_id: evolution
    source_ref: .onto/review/20260718-f461553b/round1/evolution.findings.yaml#evolution-candidate-002
    target: clinical-lab-ontology.yaml — Result and Report status evolution
    evidence_anchor: entities.Result.attributes.status;
      entities.Report.attributes.result_status; state_rules[1]
    claim: Parallel status vocabularies and delayed synchronization make every
      status extension a coordinated breaking change across LIS and EMR-facing
      representations.
    lens_rationale_summary: Adding a status or changing transition semantics
      requires modifying two enums, their mapping, the synchronization process,
      and consumers. During migration or batch delay, the clinician-facing
      authoritative Report status can lag or fail to represent a new Result
      state.
    proposed_action: Define one canonical, extensible result-publication state model
      with explicit mappings or projections for system-specific labels. Version
      the mapping and transitions, specify behavior for unmapped states, and
      make Report status deterministically derived or event-synchronized with
      correction provenance.
    affected_purpose: Stable status semantics across EMR/LIS integration as the workflow evolves.
    failure_condition: A new result/report state is introduced, an existing state is
      renamed, or corrected results must be reflected before the nightly
      synchronization run.
    impact: The two systems can expose incompatible interpretations of the same
      result, and the declared clinician-facing authority can become stale
      during evolution.
    evidence_refs:
      - .onto/review/20260718-f461553b/round1/evolution.findings.yaml#evolution-candidate-002
      - clinical-lab-ontology.yaml entities.Result.attributes.status
