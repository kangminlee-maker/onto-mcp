        않습니다. Source finding context: 완료 규칙은 전이 시점 조건만 제시하고 조건 소실 시 Order 상태를
        어떻게 처리할지 제시하지 않습니다. Source finding context: clinical-lab-ontology.yaml —
        Order completion state rule and Result ownership Source finding context:
        state_rules[0] says an Order becomes completed when all Result values
        are final, while Result has no order_ref and relations provide only
        separate Result→Specimen→Order and Result→Report→Order paths. Source
        finding context: The result set governing Order completion is not
        structurally scoped to a single Order. Source finding context: Result
        can reach Order through both Specimen and Report, but the ontology does
        not require those paths to resolve to the same Order. Consequently, the
        completion rule lacks a determinate subject set and different EMR/LIS
        consumers may calculate completion differently. Source finding context:
        Define one canonical Order–Result membership path, or an explicitly
        derived relationship with a constraint that the specimen and report
        paths resolve to the same Order; rewrite the completion rule against
        that bounded set. Source finding context:
        .onto/review/20260718-f461553b/round1/structure.findings.yaml#structure\
        -candidate-002 Source finding context: A shared and operationally
        reliable Order lifecycle contract for EMR/LIS integration. Source
        finding context: When an Order has multiple specimens/reports or a
        Result is associated through paths that do not unambiguously identify
        the same Order. Source finding context: Consumers can mark orders
        completed over different result sets, causing lifecycle divergence
        across systems. Source finding context: Result ownership was modeled
        through multiple transitive paths without a canonical Order-scoping
        relationship or consistency constraint. Source finding context: The
        completion rule quantifies over Result without defining which Results
        belong to the Order. Source finding context: That undefined set is
