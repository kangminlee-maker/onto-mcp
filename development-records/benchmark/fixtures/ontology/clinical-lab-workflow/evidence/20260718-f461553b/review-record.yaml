        - problem-framing.yaml
      rationale: "증거 연결 결함 자체와 필요한 관계에는 합의가 있지만 issue-003에 편입할지 독립 유지할지를 결정할 명시적
        relation ref가 없다. 추가 관계 근거를 확보하되 통보 감사 계약은 다음 단계 전에 닫아야 한다. Source
        finding context: clinical-lab-ontology.yaml — entities.CriticalValue
        notification structure Source finding context: CriticalValue.notified is
        a boolean whose note says notification time and recipient exist in a
        telephone log, but no notification record entity or relationship appears
        in the ontology. Source finding context: Critical-value notification
        completion is disconnected from the record that substantiates it. Source
        finding context: A consumer can observe that notification is claimed but
        cannot navigate to evidence of who was notified or when. Because the
        file is intended as the integration authority, leaving the supporting
        record outside its relationship graph makes the operational state
        unauditable across systems. Source finding context: Model a
        CriticalValueNotification record, or at minimum an authoritative
        external-record reference, and link it to CriticalValue, recipient,
        notification time, and responsible staff; derive notified from the
        existence/status of that record. Source finding context:
        .onto/review/20260718-f461553b/round1/structure.findings.yaml#structure\
        -candidate-003 Source finding context: Use of the ontology as an
        operational integration authority for critical-result handling. Source
        finding context: When EMR or LIS consumers must verify, reconcile, or
        audit a CriticalValue marked notified. Source finding context: The
        notification flag cannot be structurally reconciled with its evidence,
        allowing inconsistent or unsupported completion states between systems.
        Source finding context: Notification evidence is delegated to an
        external telephone log without representing that log or a reference to
        it in the ontology. Source finding context: CriticalValue.notified has
        no link to the notification record that supports the boolean. Source
        finding context: The missing link is a symptom of placing time and
        recipient data in an external log without modeling its identity or
        relationship."
