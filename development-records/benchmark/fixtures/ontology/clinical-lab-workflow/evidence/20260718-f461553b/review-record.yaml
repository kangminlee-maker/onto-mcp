      - EMR/LIS 통합의 개념 권위 문서는 복수 시스템에 중복되는 값의 원본·우선순위와 시간에 따른 변경 이력을 명시해야 한다고
        보았다.
      - 승인, 결과 정정 및 중대값 통보는 행위자·시각·근거를 추적해야 하는 통제 행위로 보았다.
  evolution:
