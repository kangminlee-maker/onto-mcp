        te-001 Source finding context: EMR/LIS 통합에서 Order 상태를 동일하게 판정하는 개념 권위 계약
        Source finding context: completed 이후 Result가 corrected로 전이하고 양 시스템이 완료
        상태의 지속 여부를 다르게 해석할 때 Source finding context: 동일 사건 경로에서 시스템별 Order 상태와
        후속 처리 조건이 달라질 수 있어 상태 모델의 권위성과 실행 가능성이 약화됩니다. Source finding context: 완료
        조건의 시간 양상과 corrected 발생 후 전이 규칙이 명시되지 않았습니다. Source finding context:
