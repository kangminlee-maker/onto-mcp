      to_cause_ref: finding-008.cause-003
    rationale: finding-007은 행위자·시각·근거의 감사 이력을, finding-008은 이전 값·대체 관계·유효기간의 버전 이력을
      다루며 두 causal path가 상태 중심 모델의 시간성 누락을 공통 원인으로 제시한다.
    confidence: medium
  - relation_id: rel-012
    from_finding_id: finding-010
    to_finding_id: finding-015
    relation: same_root_candidate
    root_hypothesis: CriticalValue를 문맥과 유효 버전을 가진 판정 규칙이 아니라 변경 가능한 현재 숫자 범위로 모델링한
      것이 적용 문맥 모호성과 과거 규칙 소실을 함께 유발한다.
    shared_cause: null
    rationale: finding-010은 단위·방법·검체·환자군과 유효 이력 부재를, finding-015는 안정적
