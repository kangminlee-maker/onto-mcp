    shared_cause:
      cause_claim: 검체 분류 수준과 처리 형태를 구분하는 공유 taxonomy 없이 specimen 의미를 여러 비호환 필드에 중복 표현했다.
      from_cause_ref: finding-013.cause-003
      to_cause_ref: finding-021.cause-002
    rationale: finding-013은 새 분류 추가 시 다중 구조 변경 문제를, finding-021은 blood와 serum/WB 같은
      분류 수준 혼용 문제를 다루며 두 causal path가 단일 검체 권위 부재를 지목한다.
    confidence: high
  - relation_id: rel-014
    from_finding_id: finding-013
    to_finding_id: finding-014
    relation: symptom_of
    root_hypothesis: 검체 taxonomy를 비호환 enum과 문자열로 복제한 것은 외부 지배 코드와 용어를
      system·version·validity를 가진 first-class 개념으로 모델링하지 않은 일반 결함의 한 사례다.
    shared_cause: null
    rationale: finding-014는 코드와 용어 전반의 출처·버전 문맥 부재를 다루며, finding-013의 검체 분류 중복과 자유
