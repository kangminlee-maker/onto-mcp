    confidence: medium
  - relation_id: rel-015
    from_finding_id: finding-005
    to_finding_id: finding-023
    relation: enables
    root_hypothesis: AnalysisExecution 같은 실제 분석 사건이 없기 때문에 결과 생성의 인과 역할을 수행 과정에 귀속할
      수 없고 Specimen에 produces 관계를 잘못 부여하게 된다.
    shared_cause: null
    rationale: finding-005는 분석 수행 사건과 provenance 근거의 구조적 공백을 확인하고, finding-023은 바로 그
      공백 때문에 물질적 원천인 Specimen이 결과 생산 주체로 표현되는 의미 오류를 지적한다.
    confidence: high
  - relation_id: rel-016
    from_finding_id: finding-016
    to_finding_id: finding-025
    relation: same_root_candidate
    root_hypothesis: Order completed 규칙이 대상 Result 집합과 corrected 이후의 시간적 지속 조건을 모두
