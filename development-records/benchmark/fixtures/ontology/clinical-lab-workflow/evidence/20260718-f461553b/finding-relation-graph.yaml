  - relation_id: rel-013
    from_finding_id: finding-013
    to_finding_id: finding-021
    relation: shared_cause_candidate
    root_hypothesis: 검체 분류의 축과 계층을 하나의 공유 권위 개념으로 만들지 않고 여러 enum과 자유 문자열에 평탄화·복제한 것이
