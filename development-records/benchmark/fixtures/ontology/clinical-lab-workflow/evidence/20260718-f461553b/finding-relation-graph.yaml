relations:
  - relation_id: rel-001
    from_finding_id: finding-001
    to_finding_id: finding-018
    relation: duplicates
    root_hypothesis: Result 상태와 Report 상태를 별도 권위 값으로 중복 저장하고 야간 동기화하는 설계가 정정 직후
      임상의에게 오래된 상태를 노출한다.
    shared_cause: null
    rationale: 두 finding은 각각 가치 정렬과 의미론 관점에서 서로 다른 상태 어휘, 이중 권위, corrected 반영 지연으로
      발생하는 동일한 임상 신뢰 문제를 기술한다.
    confidence: high
  - relation_id: rel-002
    from_finding_id: finding-017
    to_finding_id: finding-018
    relation: duplicates
    root_hypothesis: Result.status와 Report.result_status 사이에 단일 canonical 상태 또는 명시적
      의미 매핑이 없어서 ‘동일 정보’ 계약을 판정할 수 없다.
    shared_cause: null
    rationale: finding-017의 논리적 대응 불충분과 finding-018의 의미·권위 이중화는 같은 두 필드와 야간 정정 동기화
      계약을 대상으로 한 실질적으로 동일한 결함이다.
    confidence: high
  - relation_id: rel-003
    from_finding_id: finding-012
    to_finding_id: finding-018
    relation: same_root_candidate
    root_hypothesis: 하나의 공개 상태 개념을 서로 다른 폐쇄 어휘로 중복 모델링하고 canonical mapping을 두지 않은 것이
      현재 불일치와 향후 상태 확장 파손을 함께 유발한다.
    shared_cause: null
    rationale: finding-012는 진화 시 coordinated breaking change를, finding-018은 현재 의미·권위
      충돌을 다루지만 두 causal path 모두 canonical 상태와 매핑이 없는 중복 모델을 지목한다.
    confidence: high
  - relation_id: rel-004
    from_finding_id: finding-002
    to_finding_id: finding-020
    relation: duplicates
    root_hypothesis: 주문 단위 Test와 수행 단위 Assay의 정체성과 관계를 결정하지 않은 채 신규 항목을 양쪽에 등록하는 운영
      규칙이 카탈로그 권위를 모호하게 한다.
    shared_cause: null
    rationale: 두 finding은 가치 및 의미론 관점에서 Test/Assay의 미결정 경계, 무매핑 이중 등록, 시스템별 임의 해석이라는
      같은 결함을 기술한다.
    confidence: high
  - relation_id: rel-005
    from_finding_id: finding-002
    to_finding_id: finding-009
    relation: same_root_candidate
    root_hypothesis: Test와 Assay를 병행 카탈로그로 유지하면서 권위·매핑 계약을 정의하지 않은 결정이 현재 상호운용 모호성과
      시간에 따른 추적성 손실을 함께 만든다.
    shared_cause: null
    rationale: finding-002는 현재의 단일 기준 부재를, finding-009는 매핑의 버전·유효기간 부재까지 다루며 공통 근원은
      무권위 이중 카탈로그이다.
    confidence: high
  - relation_id: rel-006
    from_finding_id: finding-009
    to_finding_id: finding-011
    relation: duplicates
    root_hypothesis: 독립적으로 유지되는 Test/Assay 카탈로그에 authoritative versioned mapping이 없어
      변경 과정에서 항목 동일성이 끊긴다.
    shared_cause: null
    rationale: 두 finding 모두 추가·변경·폐기되는 Test와 Assay의 대응, 권위, 버전 이력이 없어서 역사적 정체성을 판정할
      수 없다는 동일한 진화 결함을 제시한다.
    confidence: high
  - relation_id: rel-007
    from_finding_id: finding-024
    to_finding_id: finding-009
    relation: symptom_of
    root_hypothesis: 구조상 Test↔Assay 실행 관계가 없는 것은 병행 카탈로그의 권위·매핑 lifecycle을 정의하지 않은 더
      넓은 결함의 직접적인 구조 증상이다.
    shared_cause: null
    rationale: finding-024의 누락된 realization 관계는 finding-009가 요구하는 canonical mapping
      계약의 핵심 구조 요소이며, 양쪽 causal path가 이중 등록과 대응 관계 부재를 명시한다.
    confidence: high
  - relation_id: rel-008
    from_finding_id: finding-003
    to_finding_id: finding-026
    relation: duplicates
    root_hypothesis: CriticalValue 통보를 외부 전화 기록에 맡기고 온톨로지에는 근거와 연결되지 않은 boolean만 남긴
      설계가 통보 완료를 검증 불가능하게 한다.
    shared_cause: null
    rationale: 두 finding은 각각 가치와 구조 관점에서 통보 시각·수신자 기록의 외부 분리, 권위 불명확성, notified 근거
      링크 부재라는 동일한 문제를 기술한다.
    confidence: high
  - relation_id: rel-009
    from_finding_id: finding-003
    to_finding_id: finding-007
    relation: same_root_candidate
    root_hypothesis: 통제 행위를 행위자·시각·근거를 가진 감사 사건으로 모델링하지 않고 현재 속성이나 boolean으로 축약한 결정이
      통보와 기타 통제 이력의 재구성을 막는다.
    shared_cause: null
    rationale: finding-003은 중대값 통보에 초점을 맞추고 finding-007은 검증·공개·정정까지 일반화하지만, 모두 독립 사건
      대신 불완전한 현재 속성을 사용한 모델링 선택을 지목한다.
    confidence: high
  - relation_id: rel-010
    from_finding_id: finding-003
    to_finding_id: finding-022
    relation: shared_cause_candidate
    root_hypothesis: 통보를 Result에 귀속되는 독립 사건으로 모델링하지 않고 CriticalValue의 boolean 속성으로
      축약한 것이 증거 단절과 결과별 통보 상태 혼합을 함께 발생시킨다.
    shared_cause:
      cause_claim: 통보 사건을 독립된 권위 기록으로 분리하지 않고 임계값을 나타내는 CriticalValue 개념의 boolean 속성으로 축약했다.
      from_cause_ref: finding-003.cause-002
      to_cause_ref: finding-022.cause-002
    rationale: finding-003은 통보 증거가 외부로 분리되는 문제를, finding-022는 재사용 규칙과 결과별 사건이 혼합되는
      문제를 보이며 두 causal step 모두 CriticalValue에 통보 상태를 축약한 결정을 근거로 든다.
    confidence: high
  - relation_id: rel-011
    from_finding_id: finding-007
    to_finding_id: finding-008
    relation: shared_cause_candidate
    root_hypothesis: 시간에 따라 발생하는 통제 행위와 임상 변경을 불변 사건·버전 이력 대신 덮어쓰는 현재 속성으로 표현한 것이 감사
      흔적과 과거 공개 상태를 모두 소실시킨다.
    shared_cause:
