    shared_cause: null
    rationale: finding-016은 완료 후 corrected가 발생하는 시간 경로를, finding-025는 완료 조건이 양화하는
      Result 집합의 범위를 다룬다. 둘은 동일한 Order completion 계약이 실행 가능할 정도로 닫히지 않은 독립적인 두
      증상이다.
    confidence: medium
