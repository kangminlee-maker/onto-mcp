          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml entities.Specimen.attributes
            - clinical-lab-ontology.yaml entities.Test.attributes
            - clinical-lab-ontology.yaml entities.Assay.attributes
      unresolved_beyond_evidence: null
  - candidate_id: evolution-candidate-004
    target: clinical-lab-ontology.yaml — identifiers and coded values
    evidence_anchor: entities.Patient.attributes.patient_id/mrn;
      entities.Test.attributes.test_code; entities.Assay.attributes.assay_code;
      entities.Department.attributes.dept_code; entities.Result.attributes.unit
    claim: Identifiers and coded values lack assigning-system and version context,
      so multi-system integration or code revisions cannot preserve unambiguous
      continuity.
    what: Patient, test, assay, department, and unit values are plain strings with
      no namespace, issuing organization, code system, version, validity period,
      or replacement relation.
    why: When another facility or LIS introduces the same local code with a
      different meaning, or a code/unit definition changes, the ontology cannot
      distinguish identities or retain the interpretation that applied to
      historical records. Consumers would need out-of-model conventions or
      schema changes.
    how_to_fix: Model reusable Identifier and CodedConcept structures with
      system/issuer, code, display, version, effective interval, and
      supersession or equivalence mappings. Apply them consistently while
      retaining immutable internal identifiers for historical references.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: Use of the ontology as a durable conceptual authority across
        EMR/LIS systems and future participating domains.
      failure_condition: Two integrated systems reuse a local identifier, or a
        catalog/unit/code meaning changes over time.
      impact: Current and historical records can no longer be resolved unambiguously,
        undermining cross-system identity and semantic continuity.
      evidence_refs:
        - clinical-lab-ontology.yaml entities.Patient.attributes
        - clinical-lab-ontology.yaml entities.Test.attributes.test_code
        - clinical-lab-ontology.yaml entities.Assay.attributes.assay_code
        - clinical-lab-ontology.yaml entities.Department.attributes.dept_code
        - clinical-lab-ontology.yaml entities.Result.attributes.unit
    causal_path:
      root_cause_candidate: The ontology represents externally governed identities and
        codes as context-free strings without provenance or temporal versioning.
      root_cause_step_id: evolution-candidate-004.cause-003
      steps:
        - cause_id: evolution-candidate-004.cause-001
          claim: The model cannot disambiguate equal local codes from different systems or
            retain earlier meanings after a revision.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml entities.Patient.attributes.patient_id
            - clinical-lab-ontology.yaml entities.Patient.attributes.mrn
            - clinical-lab-ontology.yaml entities.Test.attributes.test_code
            - clinical-lab-ontology.yaml entities.Assay.attributes.assay_code
            - clinical-lab-ontology.yaml entities.Result.attributes.unit
        - cause_id: evolution-candidate-004.cause-002
          claim: The relevant attributes contain only string values and define no issuer,
            code system, version, or validity metadata.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml entities.Patient.attributes
            - clinical-lab-ontology.yaml entities.Test.attributes
            - clinical-lab-ontology.yaml entities.Assay.attributes
            - clinical-lab-ontology.yaml entities.Department.attributes
            - clinical-lab-ontology.yaml entities.Result.attributes
        - cause_id: evolution-candidate-004.cause-003
          claim: Identity and terminology evolution are not represented as first-class
            concepts.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml entities
            - clinical-lab-ontology.yaml relations
      unresolved_beyond_evidence: The bounded artifact does not show whether external
        master-data services provide namespaces or version mappings, but this
        authority document neither references nor constrains such a source.
  - candidate_id: evolution-candidate-005
    target: clinical-lab-ontology.yaml — CriticalValue rule lifecycle
    evidence_anchor: entities.CriticalValue.attributes
    claim: Critical-value thresholds have no identity, context, or effective
      version, so rule changes overwrite historical meaning instead of evolving
      alongside it.
    what: CriticalValue contains a Test reference, two bounds, and a notification
      boolean, but no rule identifier, unit linkage, applicability context,
      effective interval, revision, or supersession relation.
    why: When a threshold changes, the model cannot retain both the old rule for
      prior results and the new rule for current evaluation. Adding
      context-specific thresholds would require changing the entity shape or
      creating indistinguishable duplicate records.
    how_to_fix: Give CriticalValue rules stable identities and versions, bind bounds
      to units and applicable context, add effective-from/effective-to and
      status fields, and define supersession so historical evaluations retain
      the rule version used.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: Continuous and auditable operation of laboratory alert rules
        as policies and catalog definitions evolve.
      failure_condition: A critical threshold changes or different thresholds must
        coexist by context or effective period.
      impact: Historical alerts cannot be reconstructed from the authority model, and
        new rule variants require ambiguous duplication or structural redesign.
      evidence_refs:
        - clinical-lab-ontology.yaml entities.CriticalValue.attributes
        - clinical-lab-ontology.yaml entities.Result.attributes.unit
    causal_path:
      root_cause_candidate: CriticalValue is modeled as mutable current-state bounds
        rather than a versioned rule concept.
      root_cause_step_id: evolution-candidate-005.cause-003
      steps:
        - cause_id: evolution-candidate-005.cause-001
          claim: Old and new threshold interpretations cannot coexist or be linked to the
            results evaluated under them.
          relation_to_previous: null
          evidence_refs:
            - clinical-lab-ontology.yaml entities.CriticalValue.attributes
        - cause_id: evolution-candidate-005.cause-002
          claim: The entity lacks stable rule identity, effective dates, version, unit
            binding, and supersession metadata.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml entities.CriticalValue.attributes
            - clinical-lab-ontology.yaml entities.Result.attributes.unit
        - cause_id: evolution-candidate-005.cause-003
          claim: Threshold evolution and historical rule provenance are absent from the
            model.
          relation_to_previous: causes
          evidence_refs:
            - clinical-lab-ontology.yaml entities.CriticalValue
            - clinical-lab-ontology.yaml relations
      unresolved_beyond_evidence: null
