    rationale: 통보 evidence 외부화 자체는 지지되지만, issue-005로 흡수할지와 high로 올릴지에 대한 남은
      disagreement가 있습니다. 안전·감사 흐름에 걸리므로 다음 단계 전 결정 근거가 필요합니다.
