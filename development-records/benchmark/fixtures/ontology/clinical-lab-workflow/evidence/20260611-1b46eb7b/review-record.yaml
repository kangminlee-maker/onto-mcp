      rationale: "완료 상태 계약의 직접 logical contradiction입니다. issue-004와 상태 event/history
        맥락을 공유하지만 Order 완료 의미 실패는 별도 고심각도 correctness 문제로 대상 안에서 닫아야 합니다. Source
        finding context: clinical-lab-ontology.yaml state_rules Source finding
        context: Embedded Materialized Input: state_rules[0] `Order는 모든 Result가
        final일 때 completed로 전이한다.`; Result.status enum values `[preliminary,
        final, corrected]`; state_rules[1] allows `Result.status` to change to
        `corrected` after report release Source finding context: Order
        completion is defined by a reversible Result status, so later correction
        can make an already completed Order no longer satisfy its own completion
        condition. Source finding context: These claims are jointly satisfiable
        at a snapshot where all Results are `final`, but not stable across the
        lifecycle path explicitly allowed by the second rule. The model has no
        rule saying whether `completed` is irreversible, reopened, amended, or
        still completed after a correction, so the state machine can contain a
        completed Order whose required completion condition is false. For an
        EMR/LIS authority document, this weakens downstream trust in completion
        as a contract state. Source finding context: Define completion against
        an immutable event/snapshot, or add an explicit post-completion
        correction transition such as `completed -> amended/reopened` with rules
        for how corrected Results affect Order state. If completed is intended
        to remain true after correction, state that completion means initial
        finalization and separate it from amendment status. Source finding
        context:
        .onto/review/20260611-1b46eb7b/round1/logic.findings.yaml#logic-candida\
        te-001 Source finding context: Use of the ontology as the conceptual
        authority for EMR/LIS integration state contracts. Source finding
        context: A Result reaches `final`, Order becomes `completed`, and the
        Result is later changed to `corrected` under the Report amendment rule.
        Source finding context: Integrations relying on `Order.completed` cannot
        determine whether completion means all current Results are final or
        merely that finalization occurred once, causing contradictory lifecycle
        interpretations around corrected lab results. Source finding context:
        Completion is specified as a state transition predicate over mutable
        current Result.status values without an accompanying correction/reopen
        rule for Order. Source finding context: The target defines Result.status
        as an enum including both `final` and `corrected`. Source finding
        context: The target defines Order completion as occurring when all
        Results are `final`. Source finding context: The target explicitly
        permits a Result status to change to `corrected` after report release
        and requires Report.result_status to become amended. Source finding
        context: After such a correction, an already completed Order can have a
        non-final current Result and no declared Order transition resolves the
        mismatch."
