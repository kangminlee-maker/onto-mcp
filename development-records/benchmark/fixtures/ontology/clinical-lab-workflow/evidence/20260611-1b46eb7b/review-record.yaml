      Test/Result/Specimen 경로와 연결되지 않습니다.
    issue_role: symptom
    judgment_state: observed
    impact_kind: completeness
    timing_class: planned_follow_up
    closure_class: carry_forward
    closure_obligation: may_close_during_next_stage
    domain_axes: {}
