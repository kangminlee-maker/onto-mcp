    related_surface_finding_ids:
      - finding-019
  - issue_id: issue-018
    problem_definition: Order-to-Test edge가 explicit relation graph에 없어 주문에 속한
      tests와 completion 대상 results를 그래프만으로 추적하기 어렵습니다.
