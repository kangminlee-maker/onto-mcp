        delayed synchronization. If the report status is the value clinicians
        trust, the ontology allows a period where the authoritative
        Report.result_status is necessarily stale relative to its required
        condition. Source finding context: Separate the immediate semantic state
        from the materialized synchronized field. For example, define
        `Report.amendment_required` immediately when a Result is corrected, and
        define `Report.result_status` as updated by the nightly batch with an
        explicit stale/pending state or SLA. Alternatively require immediate
        update when clinician-facing authority must never lag. Source finding
        context:
