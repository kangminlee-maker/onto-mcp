        context: A Result.status is corrected after release before the nightly
        synchronization batch updates Report.result_status. Source finding
        context: The ontology simultaneously requires the report to be amended
        and allows the trusted displayed field to remain finalized, making the
        status contract ambiguous for consumers during the delay window. Source
        finding context: The model collapses an immediate derived obligation and
        a delayed materialized synchronization field into the same authoritative
        Report.result_status concept. Source finding context:
        Report.result_status is declared as the authority value shown on the
        report and trusted by clinicians. Source finding context: The state rule
        requires Report.result_status to become `amended` when Result.status
        changes to `corrected`. Source finding context: The same rule states the
        synchronization batch runs only once nightly. Source finding context:
