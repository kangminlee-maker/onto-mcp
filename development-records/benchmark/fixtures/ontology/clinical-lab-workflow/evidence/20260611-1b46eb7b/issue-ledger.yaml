    issue_statement: "Shared-root issue across finding-007, finding-015: The
      ontology separates order catalog and execution catalog concepts without
      defining their semantic boundary, cardinality, authority, or lifecycle
      mapping."
    proposed_action: TestAssayMapping 또는 CatalogItemVersion 개념을 추가하고, Test와 Assay의
      authority/source_system, effective_from/effective_to, active/deprecated
      상태, one-to-one/one-to-many 매핑 cardinality, migration/alias를 명시하세요. 신규 등록
      절차도 두 곳 수동 등록이 아니라 권위 카탈로그에서 파생되는 흐름으로 정리하세요. / Test와 Assay를 분리 유지하려면
      'Test는 주문/청구/임상 표시 단위, Assay는 장비/분석 수행 단위'처럼 의미 기준을 명시하고 Test-to-Assay 매핑
      관계와 cardinality를 추가하십시오. 같은 개념으로 쓰려는 의도라면 canonical 카탈로그 엔티티 하나와 수행 세부
      속성으로 정리하십시오.
    affected_purpose: EMR 주문 카탈로그와 LIS/분석기 수행 카탈로그 간 통합 precedence 및 scope control.
      / EMR 주문 카탈로그와 LIS 수행 카탈로그를 연결하는 개념 권위 제공
    failure_condition: 신규 검사 항목, assay 변경, 장비별 수행 코드 변경, 과거 결과 재조회에서 Test와 Assay 정의가
