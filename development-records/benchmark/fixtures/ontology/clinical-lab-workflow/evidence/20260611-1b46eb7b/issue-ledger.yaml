  - issue_id: issue-006
    root_cause_hypothesis: Specimen lifecycle is bounded at analysis completion and
      delegates retention/disposal states to external departmental policy rather
      than ontology concepts.
    root_confidence: medium
    surface_finding_ids:
      - finding-006
    relation_refs: []
    raised_by_lens_ids:
      - coverage
    issue_statement: 검체의 보관·폐기 lifecycle 구간이 표현되지 않아 분석 후 운영 책임 범위가 닫히지 않습니다.
    proposed_action: Specimen retention/disposal states or events and their policy
      references should be represented in the ontology rather than left only to
      departmental rules.
    affected_purpose: 주문부터 보고까지뿐 아니라 검체가 생성한 결과의 재검·감사·폐기 책임을 포함하는 임상검사 워크플로 개념 권위.
    failure_condition: 분석 완료 후 검체 보관, 재검 가능성 판단, 보관 만료, 폐기 승인/실행을 EMR/LIS가 공통 상태로 해석해야 하는 경우.
    impact: 분석 후 lifecycle이 비어 있으면 운영 시스템 간 검체의 현재 책임 상태를 합의할 수 없고, 재검/폐기 관련 의사결정이
