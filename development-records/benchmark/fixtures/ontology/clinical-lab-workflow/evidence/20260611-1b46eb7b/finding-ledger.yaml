  - finding_id: finding-001
    lens_id: axiology
    source_ref: .onto/review/20260611-1b46eb7b/round1/axiology.findings.yaml#axiology-candidate-001
    target: clinical-lab-ontology.yaml Report.result_status / Result.status
      synchronization rule
    evidence_anchor: .onto/review/20260611-1b46eb7b/execution-preparation/materialized-input.md:69-83,121-123;
      .onto/review/20260611-1b46eb7b/execution-preparation/review-value-alignment-criteria.yaml:user-request-intent
    claim: 임상의가 신뢰하는 보고 상태를 야간 배치로 동기화하도록 둔 결정은 EMR/LIS 통합 권위 문서 목적과 어긋납니다.
    lens_rationale_summary: 검토 목적은 이 파일이 EMR/LIS 통합의 개념 권위 문서로 적절한지 판단하는 것입니다. 이
      목적에서는 임상의가 보는 보고 상태의 권위와 LIS 결과 상태의 권위가 즉시 일관되어야 하는지가 핵심 가치입니다. 현재 모델은
      clinician-facing 상태를 권위 값으로 만들면서도 corrected 상태 반영 지연을 정상 운영 전제로 수용하므로, 정정
      결과가 생긴 당일에는 Report.result_status가 임상의 신뢰 대상이라는 약속을 약화시킬 수 있습니다.
    proposed_action: Report.result_status의 권위 원천을 Result.status로 명확히 낮추거나, corrected
      전이를 Report.result_status에 동기적으로 반영해야 하는 불변식으로 올리십시오. 배치가 필요하다면 그 동안
      Report를 stale/pending_amendment 같은 명시 상태로 표시하고 임상의 신뢰 가능 범위를 문서화하십시오.
    affected_purpose: EMR/LIS 통합 설계의 개념 권위 문서로서 임상의가 신뢰할 결과·보고 상태의 권위를 정렬하는 목적.
    failure_condition: Result.status가 corrected로 바뀐 뒤 야간 배치 전까지
      Report.result_status가 아직 finalized/prelim 계열 값으로 남는 경우.
    impact: 권위 문서가 stale clinician-facing 상태를 허용하면 통합 구현자는 지연 동기화를 정상 계약으로 받아들일 수
      있고, 임상의가 신뢰한다고 선언된 보고 상태의 의미가 약해집니다.
    evidence_refs:
      - .onto/review/20260611-1b46eb7b/round1/axiology.findings.yaml#axiology-candidate-001
      - materialized-input.md:69-83
      - materialized-input.md:121-123
      - review-value-alignment-criteria.yaml:user-request-intent
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS 통합 설계의 개념 권위 문서로서 임상의가 신뢰할 결과·보고 상태의 권위를 정렬하는 목적.
      failure_condition: Result.status가 corrected로 바뀐 뒤 야간 배치 전까지
        Report.result_status가 아직 finalized/prelim 계열 값으로 남는 경우.
      impact: 권위 문서가 stale clinician-facing 상태를 허용하면 통합 구현자는 지연 동기화를 정상 계약으로 받아들일 수
        있고, 임상의가 신뢰한다고 선언된 보고 상태의 의미가 약해집니다.
      evidence_refs:
        - materialized-input.md:69-83
        - materialized-input.md:121-123
        - review-value-alignment-criteria.yaml:user-request-intent
    causal_path:
      root_cause_candidate: 보고 상태의 신뢰 가치와 운영 편의성인 야간 배치 동기화가 같은 계약 안에서 조정 없이 병존합니다.
      root_cause_step_id: finding-001.cause-003
      steps:
        - cause_id: finding-001.cause-001
          claim: Report.result_status는 임상의가 신뢰하는 권위 값으로 선언되어 있습니다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:80-83
        - cause_id: finding-001.cause-002
          claim: Result.status가 corrected로 바뀌면 Report.result_status는 amended가 되어야 하지만 동기화는
            야간 1회로 제한됩니다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:121-123
        - cause_id: finding-001.cause-003
          claim: 따라서 corrected 발생 시점과 야간 배치 사이에 임상의가 신뢰하는 상태가 LIS 결과 상태와 불일치할 수 있습니다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:69-83
            - materialized-input.md:121-123
      unresolved_beyond_evidence: null
  - finding_id: finding-002
    lens_id: axiology
    source_ref: .onto/review/20260611-1b46eb7b/round1/axiology.findings.yaml#axiology-candidate-002
    target: clinical-lab-ontology.yaml CriticalValue notification model
    evidence_anchor: .onto/review/20260611-1b46eb7b/execution-preparation/materialized-input.md:100-106;
      .onto/review/20260611-1b46eb7b/execution-preparation/review-value-alignment-criteria.yaml:user-request-intent
    claim: 즉시 통보가 필요한 CriticalValue의 핵심 증거를 외부 전화 기록 대장으로 밀어낸 것은 권위 문서 목적을 약화합니다.
    lens_rationale_summary: 이 파일의 선언 목적은 EMR/LIS 통합에서 엔티티·관계·상태의 개념 권위가 되는 것입니다. 즉시
      통보가 CriticalValue의 본질이라면 통보 완료 여부뿐 아니라 누가 언제 누구에게 통보했는지가 운영 신뢰의 핵심입니다. 이를
      외부 장부에 두면 EMR/LIS 통합 계약은 가장 위험한 결과 흐름의 책임 추적과 상태 전이를 권위 있게 설명하지 못합니다.
    proposed_action: CriticalValueNotification 같은 개념을 추가하거나 CriticalValue에
      notified_at, notified_to, notified_by, acknowledgement/status를 포함해
      Result/Report/Staff/Order와 연결하십시오. 최소한 외부 전화 기록 대장이 canonical authority인지,
      EMR/LIS가 어떤 키로 이를 참조하는지 명시하십시오.
    affected_purpose: 운영 위험을 포함해 EMR/LIS 통합의 개념 권위를 제공하는 목적.
    failure_condition: 위험 결과가 발생했지만 notified boolean 외 통보 시각·수신자·이행 주체가 온톨로지 권위 안에서 추적되지 않는 경우.
    impact: 통합 구현자가 critical-value 통보를 외부 장부의 비정형 부속 절차로 취급할 수 있어, 위험 결과 워크플로의 책임성과
      감사 가능성이 약해집니다.
    evidence_refs:
      - .onto/review/20260611-1b46eb7b/round1/axiology.findings.yaml#axiology-candidate-002
      - materialized-input.md:100-106
      - review-value-alignment-criteria.yaml:user-request-intent
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: 운영 위험을 포함해 EMR/LIS 통합의 개념 권위를 제공하는 목적.
      failure_condition: 위험 결과가 발생했지만 notified boolean 외 통보 시각·수신자·이행 주체가 온톨로지 권위 안에서 추적되지 않는 경우.
      impact: 통합 구현자가 critical-value 통보를 외부 장부의 비정형 부속 절차로 취급할 수 있어, 위험 결과 워크플로의 책임성과
        감사 가능성이 약해집니다.
      evidence_refs:
        - materialized-input.md:100-106
        - review-value-alignment-criteria.yaml:user-request-intent
    causal_path:
      root_cause_candidate: CriticalValue의 purpose-critical 행위인 즉시 통보가 온톨로지 내부 상태·관계
        모델이 아니라 외부 기록 전제로 축소되어 있습니다.
      root_cause_step_id: finding-002.cause-003
      steps:
        - cause_id: finding-002.cause-001
          claim: CriticalValue는 즉시 통보가 필요한 위험 결과 값 범위로 정의됩니다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:100-101
        - cause_id: finding-002.cause-002
          claim: 모델은 통보 완료 여부를 boolean으로만 두고 통보 시각과 수신자는 전화 기록 대장에 있다고 둡니다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:102-106
        - cause_id: finding-002.cause-003
          claim: 그 결과 EMR/LIS 통합 권위 문서 안에서는 critical-value 통보 이행과 감사에 필요한 개념 관계가 닫히지 않습니다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:100-106
            - review-value-alignment-criteria.yaml:user-request-intent
      unresolved_beyond_evidence: null
  - finding_id: finding-003
    lens_id: axiology
    source_ref: .onto/review/20260611-1b46eb7b/round1/axiology.findings.yaml#axiology-candidate-003
    target: clinical-lab-ontology.yaml turnaround_time note
    evidence_anchor: .onto/review/20260611-1b46eb7b/execution-preparation/materialized-input.md:41,84,126-128;
      .onto/review/20260611-1b46eb7b/execution-preparation/review-value-alignment-criteria.yaml:user-request-intent
    claim: TAT 계산식을 대시보드 팀의 자체 권위로 남겨 둔 것은 통합 개념 권위 문서의 목적과 맞지 않는 국소 최적화입니다.
    lens_rationale_summary: EMR/LIS 통합 권위 문서는 시스템 간 해석 차이를 줄이는 데 가치가 있습니다. TAT는 운영
      성과와 우선순위 판단에 쓰일 가능성이 큰 파생 지표인데, 권위 문서가 canonical formula와 예외를 닫지 않고 대시보드
      로컬 계산을 허용하면 같은 워크플로를 서로 다른 숫자로 해석할 여지를 남깁니다.
    proposed_action: turnaround_time을 파생 속성 또는 명시된 projection으로 정의하고 source fields,
      timezone, missing timestamp, corrected/amended report 처리 기준을 온톨로지에 포함하십시오.
      대시보드 계산식은 이 canonical rule의 구현체로 표현하십시오.
    affected_purpose: EMR/LIS 통합에서 공통 개념과 파생 지표의 권위를 제공하는 목적.
    failure_condition: 대시보드 팀의 자체 TAT 계산식이 온톨로지의 collected_at-to-released_at 정의와
      다르거나 예외 처리를 다르게 하는 경우.
    impact: 운영자는 동일 검사 흐름에 대해 서로 다른 TAT 값을 보게 되고, 통합 권위 문서가 지표 해석의 분쟁을 해소하지 못합니다.
    evidence_refs:
      - .onto/review/20260611-1b46eb7b/round1/axiology.findings.yaml#axiology-candidate-003
      - materialized-input.md:41
      - materialized-input.md:84
      - materialized-input.md:126-128
      - review-value-alignment-criteria.yaml:user-request-intent
    severity: medium
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS 통합에서 공통 개념과 파생 지표의 권위를 제공하는 목적.
      failure_condition: 대시보드 팀의 자체 TAT 계산식이 온톨로지의 collected_at-to-released_at 정의와
        다르거나 예외 처리를 다르게 하는 경우.
      impact: 운영자는 동일 검사 흐름에 대해 서로 다른 TAT 값을 보게 되고, 통합 권위 문서가 지표 해석의 분쟁을 해소하지 못합니다.
      evidence_refs:
        - materialized-input.md:41
        - materialized-input.md:84
        - materialized-input.md:126-128
        - review-value-alignment-criteria.yaml:user-request-intent
    causal_path:
      root_cause_candidate: 권위 문서가 파생 지표의 canonical authority를 닫지 않고 downstream 팀의 자체 계산식을 허용합니다.
      root_cause_step_id: finding-003.cause-003
      steps:
        - cause_id: finding-003.cause-001
          claim: TAT의 원천 필드인 collected_at과 released_at은 온톨로지 안에 정의되어 있습니다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:41
            - materialized-input.md:84
        - cause_id: finding-003.cause-002
          claim: 노트는 TAT를 collected_at부터 released_at까지로 계산한다고 하면서도 대시보드 팀이 자체 계산식을 유지한다고
            선언합니다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:126-128
        - cause_id: finding-003.cause-003
          claim: 따라서 통합 권위 문서가 공통 지표 의미를 확정하지 못하고 팀별 해석 차이를 허용합니다.
          relation_to_previous: causes
          evidence_refs:
            - materialized-input.md:126-128
            - review-value-alignment-criteria.yaml:user-request-intent
      unresolved_beyond_evidence: null
  - finding_id: finding-004
    lens_id: coverage
    source_ref: .onto/review/20260611-1b46eb7b/round1/coverage.findings.yaml#coverage-candidate-001
    target: clinical-lab-ontology.yaml
    evidence_anchor: "materialized input: Result.status note; Report.result_status
      note; state_rules[1]"
    claim: 결과 상태의 단일 권위와 이력 축이 누락되어 EMR/LIS 통합 권위 문서로는 상태 커버리지가 부족하다.
    lens_rationale_summary: coverage lens 기준에서 복수 시스템·장부에 걸친 값에는 단일 원본 지정이 필요하고, 상태
      값에는 과거 시점 재구성을 위한 이력/유효기간 차원이 필요합니다. 현재 모델은 상태 값이 Result와 Report에 병행 저장된다는
      사실과 지연 동기화만 포함하므로, 낮 동안 LIS의 corrected와 EMR 보고서의 finalized가 동시에 존재하는 구간에서
      어떤 상태가 권위인지와 과거 특정 시점의 임상의 노출 상태를 설명하지 못합니다.
    proposed_action: ResultStatusAuthority 또는 ResultStatusEvent/ReportReleaseEvent
      같은 상태 권위 및 이벤트 개념을 추가하고, 각 상태 변화에 effective_at, recorded_at,
      source_system, supersedes/replaces, released_version을 두어 Report가 보여주는 상태가
      어떤 Result 상태 이벤트에서 파생되었는지 명시하세요.
    affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 결과 상태와 보고 상태의 precedence 및 운영 위험을 닫는 목적.
    failure_condition: Result.status가 corrected로 바뀐 뒤 야간 배치 전까지 Result와 Report가 다른
      상태를 보유하거나, 정정/재발행 후 특정 시점에 임상의가 본 상태를 재구성해야 하는 경우.
    impact: 상태 권위와 이력이 없으면 통합 설계가 동기화 지연 구간의 신뢰 기준, 정정 보고의 추적성, 과거 보고 상태 재현을 결정할 수
      없어 핵심 운영 계약이 불완전해집니다.
    evidence_refs:
      - .onto/review/20260611-1b46eb7b/round1/coverage.findings.yaml#coverage-candidate-001
      - "materialized input: Result.status note = LIS가 기록하며
        Report.result_status에도 동일 정보가 유지된다"
      - "materialized input: Report.result_status note = 보고서에 표시되는 결과 상태의 권위 값.
        임상의는 이 값을 신뢰한다"
      - "materialized input: state_rules[1] = corrected 변경 시
        Report.result_status는 amended가 되어야 하며 동기화 배치는 야간 1회"
    severity: high
    domain_threshold_used: null
    materiality_basis:
      affected_purpose: EMR/LIS 연동 설계의 개념 권위 문서로서 결과 상태와 보고 상태의 precedence 및 운영 위험을 닫는 목적.
      failure_condition: Result.status가 corrected로 바뀐 뒤 야간 배치 전까지 Result와 Report가 다른
        상태를 보유하거나, 정정/재발행 후 특정 시점에 임상의가 본 상태를 재구성해야 하는 경우.
      impact: 상태 권위와 이력이 없으면 통합 설계가 동기화 지연 구간의 신뢰 기준, 정정 보고의 추적성, 과거 보고 상태 재현을 결정할 수
        없어 핵심 운영 계약이 불완전해집니다.
      evidence_refs:
        - "materialized input: Result.status note = LIS가 기록하며
          Report.result_status에도 동일 정보가 유지된다"
        - "materialized input: Report.result_status note = 보고서에 표시되는 결과 상태의 권위
