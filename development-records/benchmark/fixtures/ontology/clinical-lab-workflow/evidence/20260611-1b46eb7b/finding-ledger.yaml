    claim: The explicit relation graph omits the Order-to-Test ordering edge.
    lens_rationale_summary: For a workflow authority document, the ordered tests are
      the structural basis for expected lab work. Without an explicit
      Order-to-Test relation, the relation graph cannot directly express which
      Test items were ordered, which makes downstream traversal from Order to
      expected Test/Result behavior depend on an attribute that is not mirrored
      in the formal relation model.
    proposed_action: Add an explicit `Order -> Test` relation such as `orders` or
      `includes_ordered_test`, and if needed define the expected Result path
      from ordered Test to Result so the completion rule can be evaluated from
      the same graph.
    affected_purpose: Use the ontology as the concept authority for EMR/LIS
      order-to-result workflow integration.
    failure_condition: When a consumer relies on the relation graph to determine
      which tests belong to an order, the formal graph lacks the required
      Order-Test edge even though the attribute model declares `ordered_tests`.
    impact: "The graph is structurally incomplete for a central workflow question:
      what tests an order contains and which results complete those ordered
      tests."
