    claim: Assay is omitted from the explicit workflow relation graph.
    lens_rationale_summary: The ontology says Test and Assay are both currently
      registered, but the explicit relation graph has no Test-Assay,
      Assay-Result, or Assay-Specimen edge. As a result, the execution unit
      cannot be traversed from the order/test/result workflow except through a
      generic department reference, weakening the document as a concept
      authority for EMR/LIS integration paths.
    proposed_action: Add an explicit relation that connects Assay to the core
      workflow, preferably through the catalog concept it realizes, such as
      `Test -> Assay` / `Assay -> Test` with a clear kind, and add any required
      execution-result edge if Result is produced by Assay rather than directly
      by Test or Specimen.
