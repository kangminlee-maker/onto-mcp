    rationale: 두 상태 차원의 혼합이 여러 불일치 현상을 설명하는 합의된 상위 원인이다. 핵심 상태 권위가 불명확하므로 목표 산출물 안에서
      해소해야 한다.
    related_surface_finding_ids:
      - finding-006
      - finding-015
  - issue_id: issue-007
    problem_definition: Test–Assay 매핑과 검사·임계값 정의에 버전·유효기간·적용 버전 참조가 없어 과거 의미를 재구성할 수 없다.
