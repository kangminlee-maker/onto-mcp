    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 핵심 임상 통제의 감사 추적 결손을 만드는 독립 사건 모델 부재에 모든 렌즈가 합의했다. 권위 문서 자체에서 통제 증거를
      표현할 수 있어야 한다.
    related_surface_finding_ids:
      - finding-005
  - issue_id: issue-006
    problem_definition: Result 검증 상태와 Report 발행·개정 상태를 분리하지 않고 복제 상태처럼 취급해 의미와 권위가 충돌한다.
