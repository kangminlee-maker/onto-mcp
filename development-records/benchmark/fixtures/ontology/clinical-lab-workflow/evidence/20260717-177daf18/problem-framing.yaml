    judgment_state: inferred
    impact_kind: completeness
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: 실제 검체 흐름의 필수 예외와 종결 구간이 누락됐다는 데 일관된 지지가 있다. 운영 통합을 시작하기 전에 lifecycle
      범위를 완결해야 한다.
    related_surface_finding_ids:
      - finding-008
  - issue_id: issue-009
    problem_definition: Result가 문자열 중심 최소 레코드로 축약되어 자료형·참고범위·판정·검사법·적용 정책을 보존하지 못한다.
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: correctness
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 임상 결과의 해석 근거가 누락되어 값이 전달돼도 동일 의미를 보장할 수 없다는 데 합의가 있다. 결과 의미는 개념 권위의
      핵심 계약이다.
    related_surface_finding_ids:
      - finding-009
  - issue_id: issue-010
    problem_definition: 버전 가능한 Test–Assay 매핑과 대체 이력이 없어 카탈로그 변경 전후의 항목 정체성이 단절된다.
    issue_role: symptom
    judgment_state: inferred
