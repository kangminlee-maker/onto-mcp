    rationale: 권위 충돌과 high 영향은 합의됐지만 두 상태가 복제인지 독립 차원인지 경계 내 증거로 확정되지 않았다. 개념 권위 문서로
      사용하기 전에 공식 의미와 전이 규칙을 확인해야 한다.
