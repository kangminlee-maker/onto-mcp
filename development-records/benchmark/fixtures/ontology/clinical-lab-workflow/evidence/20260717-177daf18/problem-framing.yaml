  - issue_id: issue-016
    problem_definition: STAT 긴급도가 priority, boolean, 하위 타입의 세 독립 표현으로 중복되어 복수 권위를 형성한다.
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: 하나의 비본질적 분류를 삼중 표현한 것이 상충 가능한 긴급도 해석을 만든다는 데 합의가 있다. 통합 매핑 전에 단일 권위를
      정해야 한다.
    related_surface_finding_ids:
      - finding-017
  - issue_id: issue-017
    problem_definition: 주문 개념 Test와 수행 개념 Assay의 관계를 모델링하지 않고 이중 등록으로 대체해 비동의어를 동일 항목처럼 취급한다.
