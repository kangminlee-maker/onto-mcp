    judgment_state: inferred
    impact_kind: governance_value
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: 모든 렌즈가 주문 개념과 수행 개념 사이의 정식 권위 매핑 부재를 원인으로 지지한다. 통합 구현에 앞서 대응 권위를 모델에
      확립해야 한다.
    related_surface_finding_ids:
      - finding-002
  - issue_id: issue-003
    problem_definition: TAT의 의미와 계산 규칙이 권위 모델에 없고 소비자별 구현에 위임되어 있다.
