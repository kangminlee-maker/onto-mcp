    related_surface_finding_ids:
      - finding-012
  - issue_id: issue-013
    problem_definition: 불명확한 상태 차원에 지속적 동일성과 복수 권위를 선언하고 야간 동기화해 정정 후 필연적 불일치 구간을 만든다.
