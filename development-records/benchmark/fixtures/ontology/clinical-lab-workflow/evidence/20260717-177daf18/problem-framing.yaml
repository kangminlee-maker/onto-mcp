    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 변경 시 정체성 단절은 issue-007의 버전 권위 결손이 진화 경로에서 드러난 결과다. 과거 수행 정의의 재구성을 위해
      목표 모델에서 함께 닫아야 한다.
    related_surface_finding_ids:
      - finding-010
  - issue_id: issue-011
    problem_definition: 검체 분류가 중복 폐쇄형 enum과 자유 문자열에 분산되어 새 유형마다 복수 위치의 동시 변경이 필요하다.
    issue_role: root_cause
    judgment_state: inferred
    impact_kind: maintainability_evolvability
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: 단일 버전형 SpecimenType 권위 부재가 확장 누락과 분류 충돌을 만든다는 데 합의가 있다. 새 검체 범주를 수용하기
      전에 정규화해야 한다.
    related_surface_finding_ids:
      - finding-011
  - issue_id: issue-012
    problem_definition: 독립적인 Result와 Report 상태 차원에 안정 어휘와 차원 간 버전형 전이·투영·미인식 값 처리 계약이 없다.
    issue_role: enabler
    judgment_state: inferred
    impact_kind: maintainability_evolvability
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: 숙의에서 독립 상태 차원 해석으로 원인이 해결됐으며, 계약 부재는 향후 상태 추가와 혼재 버전에서 권위 분기를 가능하게
