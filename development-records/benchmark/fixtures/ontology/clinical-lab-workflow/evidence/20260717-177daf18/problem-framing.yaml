    judgment_state: inferred
    impact_kind: maintainability_evolvability
    timing_class: current_blocker
    closure_class: fix_now
    closure_obligation: must_close_in_target
    domain_axes: {}
    rationale: 버전 있는 카탈로그 권위 부재가 시간적 재현성 결손의 합의된 원인이다. 현재 문서를 지속 가능한 개념 권위로 쓰려면 버전
      경계를 포함해야 한다.
    related_surface_finding_ids:
      - finding-007
  - issue_id: issue-008
    problem_definition: Specimen lifecycle이 정상 분석 경로에서 끝나 예외·재채취·보관·폐기 경로를 표현하지 못한다.
