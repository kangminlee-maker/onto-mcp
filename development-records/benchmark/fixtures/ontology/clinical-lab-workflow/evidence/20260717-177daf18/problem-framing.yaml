    impact_kind: consistency
    timing_class: next_step_blocker
    closure_class: fix_now
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: 계산 경계·결측 처리·버전의 권위 부재가 동일 입력의 상이한 TAT를 허용한다는 데 합의가 있다. 지표 소비 단계 전에 공통
      규칙이 필요하다.
    related_surface_finding_ids:
      - finding-003
  - issue_id: issue-004
    problem_definition: 임계값 정책과 결과별 통보 사건이 공유 boolean으로 축약되고 상세 증거가 외부 장부에 분산되어 있다.
    issue_role: symptom
    judgment_state: contested
    impact_kind: safety_risk
    timing_class: next_step_blocker
    closure_class: needs_evidence
    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: 정책과 사건의 분리 필요성은 합의됐으나 실제 소비 경로에서 교차 결과 오적용이 발생하는지 없어 medium과 high 판단이
      미해결이다. 지원 경로 증거를 확보해야 한다.
    related_surface_finding_ids:
