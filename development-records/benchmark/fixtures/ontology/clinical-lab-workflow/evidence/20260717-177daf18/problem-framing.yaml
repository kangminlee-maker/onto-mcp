    closure_obligation: must_close_before_next_stage
    domain_axes: {}
    rationale: 비동의어 개념의 잘못된 동일시와 카디널리티 있는 실현 관계의 필요성에 합의가 있다. 비일대일 수행을 통합하기 전에 의미
