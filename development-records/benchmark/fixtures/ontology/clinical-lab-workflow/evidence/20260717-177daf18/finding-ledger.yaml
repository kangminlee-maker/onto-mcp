  - finding_id: finding-020
    lens_id: structure
    source_ref: .onto/review/20260717-177daf18/round1/structure.findings.yaml#structure-candidate-001
    target: clinical-lab-ontology.yaml — Assay entity and workflow relations
    evidence_anchor: materialized-input.md lines 54-60, 108-119, 126-127
    claim: Assay is operationally disconnected from the Order–Test–Specimen–Result
      workflow.
    lens_rationale_summary: Assay is declared as the analyzer execution unit, while
      Test is the orderable catalog unit. The note requires new items to be
      registered in both catalogs but supplies no structural mapping between
      them. Consequently, an EMR/LIS integration cannot traverse the ontology
      from an ordered Test to the Assay that executes it or verify which Assay
      produced a Result.
    proposed_action: Add a canonical Test–Assay mapping with explicit cardinality
      and connect assay execution to the relevant Specimen and/or Result. If
      Assay is not authoritative yet, remove it from the active workflow
      ontology and isolate it as a planned extension instead of requiring dual
      registration.
    affected_purpose: Use of the ontology as the conceptual authority for EMR/LIS
      integration from Order through Report.
    failure_condition: Whenever an ordered Test must be translated to an analyzer
      execution unit or an analyzer-produced result must be traced back to its
      ordered catalog item.
    impact: The integration graph has no executable path across the Test/Assay
      boundary, forcing implementers to invent an external mapping and weakening
      the ontology's authority and traceability.
    evidence_refs:
      - .onto/review/20260717-177daf18/round1/structure.findings.yaml#structure-candidate-001
      - materialized-input.md:54-60
