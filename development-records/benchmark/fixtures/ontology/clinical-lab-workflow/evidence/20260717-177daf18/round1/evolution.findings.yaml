findings:
  - candidate_id: evolution-candidate-001
    target: clinical-lab-ontology.yaml — Test/Assay catalog model
    evidence_anchor: materialized-input.md:46-60, 111-112, 126-127
    claim: 검사 카탈로그 확장 시 Test와 Assay의 동시 수정이 필요하며 기존 항목의 정체성 연속성을 보장할 수 없다.
    what: 주문 단위인 Test와 수행 단위인 Assay가 별도 엔티티로 정의되지만 둘 사이의 관계, 식별자 매핑, 버전 또는 유효기간이 없다.
      문서는 신규 항목을 두 곳 모두에 등록하도록 요구한다.
    why: 새 검사나 장비별 수행 항목을 추가할 때 두 카탈로그를 수동으로 함께 변경해야 한다. 이후 두 카탈로그를 통합하거나 코드가 교체되면
      어떤 Assay가 어떤 Test를 어느 기간에 수행했는지 복원할 권위 정보가 없어 기존 주문·결과의 의미가 끊길 수 있다. 이는
      EMR/LIS 통합의 개념 권위 문서라는 목적을 직접 약화한다.
    how_to_fix: Test를 주문 가능한 임상 개념으로 유지하고 Assay를 버전 가능한 수행 정의로 분리하되, Test–Assay 매핑
      엔티티에 유효기간, 상태, 매핑 버전과 대체 관계를 둔다. 신규 등록의 단일 권위 지점과 과거 매핑 보존 규칙도 명시한다.
    upstream_evidence_required: false
    severity_hint: high
    materiality_basis:
      affected_purpose: EMR/LIS 연동에서 주문 개념과 실제 수행 항목의 권위 있는 대응 및 변경 이력을 제공하는 목적
      failure_condition: 신규 검사·장비 Assay 추가, 코드 교체 또는 Test/Assay 카탈로그 통합이 발생할 때
      impact: 양쪽 시스템이 동일 주문과 결과를 서로 다른 항목으로 해석하거나 과거 결과의 수행 정의를 재구성하지 못할 수 있다.
      evidence_refs:
        - materialized-input.md:46-60
        - materialized-input.md:111-112
        - materialized-input.md:126-127
    causal_path:
      root_cause_candidate: Test와 Assay를 별도 등록 대상으로 두면서 둘 사이의 버전 가능한 권위 매핑을 모델링하지 않았다.
      root_cause_step_id: evolution-candidate-001.cause-003
      steps:
        - cause_id: evolution-candidate-001.cause-001
          claim: 신규 항목은 Test와 Assay 양쪽에 등록해야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:126-127
        - cause_id: evolution-candidate-001.cause-002
          claim: Test와 Assay 사이의 관계가 relations에 없고 각자 독립 코드만 가진다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:46-60
            - materialized-input.md:108-119
        - cause_id: evolution-candidate-001.cause-003
          claim: 대응 관계의 버전, 유효기간 또는 대체 이력을 담을 구조가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:46-60
      unresolved_beyond_evidence: 실제 LIS와 EMR이 별도 매핑 테이블을 운영하는지는 경계 내 자료로 확인할 수 없으나, 이 문서 자체에는 해당 권위가 없다.
  - candidate_id: evolution-candidate-002
    target: clinical-lab-ontology.yaml — specimen type vocabulary
    evidence_anchor: materialized-input.md:37-60
    claim: 새 검체 유형 추가가 폐쇄형 enum 두 곳의 수정과 Assay 문자열 매핑의 별도 정비를 요구한다.
    what: Specimen.specimen_type과 Test.requires_specimen_type은 동일한 네 값의 enum을 각각
      복제하지만, Assay.specimen_kind는 WB, Serum 같은 별도 자유 문자열을 사용한다. 세 표현을 연결하는 공통
      개념이나 매핑이 없다.
    why: 새 검체 유형이나 더 세분화된 재료 구분을 도입하면 기존 스키마의 두 enum을 함께 수정하고 모든 Assay 문자열과의 대응도 별도로
      관리해야 한다. 한 위치가 누락되면 신규 유형을 주문·채취·수행 계층 전체에서 일관되게 수용할 수 없으며, 기존 자유 문자열의 의미도
      버전 변경 후 보존하기 어렵다.
    how_to_fix: 버전 가능한 SpecimenType 개념을 단일 권위로 정의하고 Specimen과 Test가 이를 참조하게 한다.
      Assay의 장비별 표기는 별칭 또는 유효기간이 있는 매핑으로 연결해 새 유형을 기존 엔티티 구조 수정 없이 추가할 수 있게 한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: EMR/LIS 전 구간에서 검체 의미를 공유하고 새 검체 범주를 안정적으로 수용하는 목적
      failure_condition: 기존 네 범주 밖의 검체, 세부 재료 또는 장비별 표기를 추가할 때
      impact: 여러 위치의 동시 변경과 수동 문자열 매핑이 필요해 확장 누락과 시스템 간 분류 충돌 가능성이 커진다.
      evidence_refs:
        - materialized-input.md:37-44
        - materialized-input.md:46-60
    causal_path:
      root_cause_candidate: 검체 분류를 재사용 가능한 버전형 개념으로 만들지 않고 중복 enum과 자유 문자열로 분산했다.
      root_cause_step_id: evolution-candidate-002.cause-003
      steps:
        - cause_id: evolution-candidate-002.cause-001
          claim: 신규 검체 범주는 Specimen과 Test의 enum 양쪽을 수정해야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:42
            - materialized-input.md:52
        - cause_id: evolution-candidate-002.cause-002
          claim: Assay는 같은 의미 영역을 통제되지 않은 별도 문자열로 표현한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:54-60
        - cause_id: evolution-candidate-002.cause-003
          claim: 세 표현 사이에 공통 식별자나 매핑 관계가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:37-60
            - materialized-input.md:108-119
      unresolved_beyond_evidence: 실제 장비 코드 집합의 범위와 변경 빈도는 경계 내 자료에 없다.
  - candidate_id: evolution-candidate-003
    target: clinical-lab-ontology.yaml — Result/Report status evolution
    evidence_anchor: materialized-input.md:62-84, 121-123
    claim: 결과 상태 어휘가 두 개의 폐쇄형 enum과 배치 동기화 규칙으로 결합되어 상태 확장 시 호환성이 깨진다.
    what: Result.status와 Report.result_status가 서로 다른 값 집합을 가지며 같은 정보를 유지한다고 선언된다.
      대응은 일부 상태에 대한 문장형 규칙뿐이고, 매핑 버전·이력·미인식 상태 처리 규칙이 없다.
    why: LIS가 새 결과 상태를 도입하거나 상태 의미를 변경하면 두 enum과 동기화 로직을 동시에 수정해야 한다. 구버전 소비자가 새 상태를
      받거나 야간 배치 전에 데이터를 읽을 때 사용할 안정된 투영 규칙이 없어, 기존 데이터와 규칙의 연속성이 보장되지 않는다.
    how_to_fix: Result.status를 단일 권위 상태로 두고 Report 상태는 명시적이고 버전 가능한 투영으로 정의한다. 상태
      코드의 안정 식별자, 유효기간·대체 관계, 알 수 없는 신규 상태의 처리, 구버전 소비자용 호환 매핑을 추가한다.
    upstream_evidence_required: false
    severity_hint: medium
    materiality_basis:
      affected_purpose: LIS 결과 상태를 EMR 보고 상태로 지속적이고 예측 가능하게 전달하는 목적
      failure_condition: 새 상태 추가, 상태 의미 변경 또는 서로 다른 온톨로지 버전을 사용하는 시스템이 공존할 때
      impact: 상태 값이 거부되거나 잘못 투영되어 임상의에게 보이는 보고 상태와 LIS 권위 상태가 장기적으로 분기할 수 있다.
      evidence_refs:
        - materialized-input.md:62-84
        - materialized-input.md:121-123
    causal_path:
      root_cause_candidate: 동일 의미의 상태를 두 폐쇄형 어휘에 중복 저장하면서 버전 가능한 매핑 계약을 두지 않았다.
      root_cause_step_id: evolution-candidate-003.cause-003
      steps:
        - cause_id: evolution-candidate-003.cause-001
          claim: 새 결과 상태를 수용하려면 Result와 Report의 폐쇄형 값 집합 및 동기화 규칙을 함께 변경해야 한다.
          relation_to_previous: null
          evidence_refs:
            - materialized-input.md:69-83
            - materialized-input.md:121-123
        - cause_id: evolution-candidate-003.cause-002
          claim: 두 상태 집합은 값 이름이 다르고 문서는 동일 정보를 유지한다고 요구한다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:69-83
        - cause_id: evolution-candidate-003.cause-003
          claim: 상태 대응의 버전, 이력 및 미인식 값 처리 구조가 없다.
          relation_to_previous: symptom_of
          evidence_refs:
            - materialized-input.md:62-84
            - materialized-input.md:121-123
      unresolved_beyond_evidence: 연동 구현이 별도의 호환 매핑을 제공하는지는 경계 내 자료로 확인할 수 없으며, 온톨로지 자체에는 그 계약이 없다.
domain_constraints_used: []
domain_context_assumptions:
  - EMR과 LIS의 카탈로그 및 상태 어휘는 온톨로지 수명 동안 추가되거나 개정될 수 있다.
  - 개념 권위 문서는 현재 값뿐 아니라 코드·매핑 변경 후에도 과거 주문과 결과의 의미를 식별할 수 있어야 한다.
