        clinical-lab-ontology.yaml — CriticalValue notification structure Source
        finding context: materialized-input.md lines 100-106 and 108-119 Source
        finding context: CriticalValue notification state lacks the
        relationships needed to identify the triggering result and notification
        participants. Source finding context: A threshold-level Test reference
        can identify which catalog item a range applies to, but it cannot
        identify which concrete result triggered notification or who was
        notified. Thus the declared notified state cannot be traced through the
        EMR/LIS workflow and may be interpreted as a shared property of the
        threshold rather than an event tied to one result. Source finding
        context: Separate the threshold definition from a result-specific
        critical-notification record. Relate that record at minimum to the
        triggering Result and notification recipient, and model time/status and
        responsible Staff as attributes or references; alternatively, add an
        explicit authoritative relation to the external notification-log
        concept. Source finding context:
        .onto/review/20260717-177daf18/round1/structure.findings.yaml#structure\
        -candidate-002 Source finding context: Use of the ontology as an
        operationally reliable conceptual authority for EMR/LIS workflow
        integration. Source finding context: When a concrete critical result is
        detected and systems must exchange or reconcile whether its required
        notification occurred. Source finding context: The ontology cannot
        structurally associate notification completion with the triggering
        result or participants, so integrations may update or interpret the
        boolean against the wrong scope. Source finding context: A
        result-specific notification event is represented only as a boolean on
        the threshold entity, with its detailed record left outside the ontology
        graph. Source finding context: CriticalValue.notified has no reference
        or relation to a concrete Result or notification participant. Source
        finding context: The missing links are a symptom of notification details
        being delegated to a prose-only telephone-log reference that is not
        modeled as an entity or relation."
