  - 'v0.38.0 corrective (repo layout migration Phase 7 — legacy fallback 전면 제거, 2026-04-21): 8-phase repo layout migration 의 **종결 phase**. Phase 0-6 에서 누적된 dual-path (canonical `.onto/` + legacy top-level) 수용 로직을 전량 제거, canonical-only 로 확정. (1) `src/core-runtime/discovery/installation-paths.ts` — `LEGACY_DIR_OVERRIDES` 제거, legacy fallback branch 제거, Phase 6 의 `ONTO_DEBUG_LAYOUT=1` both_present 감지 제거 (정의상 both 발생 불가). Error message 는 `.onto/kind/ not found` + migration script 안내로 단순화. (2) `src/core-runtime/discovery/path-normalization.ts` — `LAYOUT_ALIASES` + `canonicalizeLayoutPath` 제거. `startsWithDirPrefix` 는 범용 segment-bound util 이라 유지. (3) `src/core-runtime/govern/drift-engine.ts` — `GOVERNANCE_CORE_DIR_PREFIXES` 에서 `authority/` / `design-principles/` 제거, `GOVERNANCE_CORE_FILES` 에서 `processes/govern.md` (legacy) 제거. Error message 는 canonical paths 만. (4) `src/core-runtime/govern/promote-principle.ts` — validation 의 legacy dir 분기 제거, canonical `.onto/principles/` 또는 `.onto/processes/` 만 수용. Queue persist 시 `canonicalizeLayoutPath` 호출 제거 (identity — validation 이 이미 canonical 만 허용). `PromotePrincipleProposal.target` JSDoc 에서 legacy 언급 제거. (5) `src/core-runtime/discovery/onto-home.ts` — `isOntoRoot` 의 dual-marker 제거, canonical `.onto/roles/` + `.onto/authority/` 둘 다 필수. Error message canonical-only. (6) `render-for-user.ts` / `error-messages.ts` 는 이미 Phase 0 공유 resolver 에 delegation (Phase 6 review 해소 시) — resolver 가 canonical-only 로 바뀌면서 자동 적응, 코드 변경 없음 (docstring 만 갱신). (7) Tests: `installation-paths.test.ts` 전면 재작성 (canonical-only matrix, near-miss legacy 잔존 dir 는 무시됨을 pin), `promote-principle.test.ts` 의 legacy 수용 테스트 2 건을 "canonical-only fail" 로 전환, legacy persist 테스트 2 건을 canonical-only persist 로 전환, `drift-engine.test.ts` 의 legacy target_files 테스트를 canonical 또는 "self_apply 로 분기" 로 갱신, `lens-registry.test.ts` helper 의 dual-check 제거, `e2e-start-review-session.test.ts` 의 `RolesLayout` / `AuthorityLayout` 에서 `legacy` 제거 — phase3/phase6 만 지원. describe.each 에서도 legacy 반복 제거. (8) `path-normalization.test.ts` 는 startsWithDirPrefix util 중심으로 축소. Migration 도구 (`scripts/repo-layout-migration-replace.py`) 는 미래의 유사 migration 재사용 가능성을 위해 보존 (DEFAULT_EXCLUDE_FILES 에 dual-path SSOT 파일들 유지). Allowlist guard 는 Phase 6 시점에 canonical-only — 추가 변경 없음. 검증: 99 test files / 1999 pass + 5 skip / tsc clean / lint clean (461 files) / allowlist-guard 0 violations (159 tracked). 8-phase migration **완전 종결** — Phase 0 (2026-04-20) → Phase 7 (2026-04-21), 소요 2 일. **Review amendment (Codex CLI core-axis session 20260421-4ba3bb94)**: 동일 PR 내에서 6 lens review 결과 C1 + C2 + 5 UNIQ 를 전수 해소. (R1) C1 — `src/core-runtime/cli/materialize-review-prompt-packets.ts` 의 custom-role lookup 이 .onto/roles/ + roles/ mixed-layout + onto_* prefix fallback 을 유지하던 residual legacy 를 제거. 단일 canonical seat 로 수렴 (project `.onto/roles/*.md` 우선, ontoHome fallback). (R2) C2 — `resolveOntoHome` 실패 시 legacy-shape 감지 (`isPreMigrationOntoRoot`) 후 migration script 안내 메시지 포함. `--onto-home` / `ONTO_HOME` 양쪽 entry point. (R3) UNIQ-logic traversal 방어 — `promote-principle.ts` target validation 을 2-stage 로 강화: (1) lexical segment-bound check, (2) path.resolve 후 canonical membership check. `.onto/principles/../../etc/passwd` 같은 traversal-shaped input 거부. (R4) UNIQ-logic docblock cardinality — "3 axes" → "4 gate" (Completeness / Quality / Frequency / Principal). (R5) UNIQ-semantics `design_principle` → `principle` rename — category label 을 실제 referent set (principle + guideline + charter) 에 맞춤. 기존 `design_principle` 은 completeness gate 에서 rejected + hint 제공 ("renamed to principle in Phase 7"). (R6) UNIQ-semantics phase label drift — "pre-Phase-6 legacy layout" → "pre-migration legacy layout" 로 phase-agnostic 화. (R7) UNIQ-coverage — `scripts/repo-layout-migration-replace.py` smoke test 신설 (`src/core-runtime/cli/repo-layout-migration-replace.smoke.test.ts`): 5 invariant — trailing-slash contract, marker guard idempotency (Phase 6 패턴), --dry-run 불변, .onto/review/ exclude. 미래 migration 재사용 가능성을 executable evidence 로 보증. 재검증: 100 test files / 2004 pass + 5 skip (신규 +5) / tsc clean / lint clean (462 files) / allowlist-guard 0 violations. canonical-advancing.'
  - 'v0.37.0 corrective (repo layout migration Phase 6 — authority/ → .onto/authority/, 2026-04-21): 6 authority-layer YAML 파일 + translation-glossary/ 서브디렉토리 를 `authority/` 에서 `.onto/authority/` 로 이동 (core-lens-registry, core-lexicon (본 파일), diagnostic-codes, external-render-points, translation-reference, translation-glossary/ko.yaml). 이번 migration 은 **substring collision 조건 load-bearing** — `.onto/authority/` (new) 가 `authority/` (old) 를 substring 으로 포함, Python 스크립트의 marker-based double-prefix prevention 이 실제로 작동. Phase 0 `resolveInstallationPath("authority", ...)` 는 이미 default mapping 으로 kind=="authority" → legacy dir name "authority" 를 지원 (LEGACY_DIR_OVERRIDES 추가 불요). `isOntoRoot` 는 이미 dual-marker (`path.join(dir, "authority")` OR `path.join(dir, ".onto", "authority")`) 구현 — Phase 0 완성 시점에 선행. 비-authority refs 갱신 범위 (Python 스크립트 bulk + 수동 혼합): 75 files / 198 occurrences script 로 일괄 처리 (`--changelog-preserve-file .onto/authority/core-lexicon.yaml:40`). 3 dual-path fallback consumers 는 `--exclude-file` 로 제외 후 수동 dual-path 유지 (installation-paths / path-normalization 은 이미 DEFAULT_EXCLUDE_FILES, drift-engine / drift-engine.test / onto-home 추가). Infrastructure 수동 갱신 — package.json `files` (`authority/` → `.onto/authority/`), `.github/workflows/lint-output-language-boundary.yml` path filter, `scripts/lint-output-language-boundary.ts` R2_REGISTRY_PATH / SCAN_ROOTS / LEXICON_PATH / GLOSSARY_DIR + 4 docstring ref. Loader 경로 갱신 — `src/core-runtime/evolve/commands/error-messages.ts` resolveRegistryPath canonical-first + legacy fallback, `src/core-runtime/translate/render-for-user.ts` DEFAULT_REGISTRY_PATH 양쪽 체크, `src/core-runtime/discovery/lens-registry.test.ts` helper 양쪽 체크, `src/core-runtime/discovery/onto-home.ts` error message 를 dual-path 형식 (`.onto/authority/ (or legacy authority/)`) 로 갱신. Allowlist guard 확장 — `.onto/authority` ALLOWED + self-test Case 1 (7 → 8 pass paths). Script 개선 — `DEFAULT_EXCLUDE_FILES` 에 drift-engine / drift-engine.test / onto-home 추가해 Phase 7 이전 legacy 보존. Phase 0 `resolveInstallationPath("authority", ...)` 가 이제 `.onto/authority/` 우선, legacy `authority/` fallback. Phase 7 까지 유지. **Review amendment (Codex CLI core-axis session 20260421-570f9adf)**: 동일 PR 내에서 6 lens review 결과 C1 + C2 + CC1 + CC2 + U1 를 전수 해소. (R1) C1+CC1 — 2 loaders (render-for-user.ts / error-messages.ts) 가 각자 구현하던 canonical-first dual-path 로직 제거. Phase 0 공유 resolver (`resolveInstallationPath("authority", ...)`) 로 delegation, 두 loader 모두 call-time 에 위임 (time-of-binding divergence 제거, import-time freeze 해소). (R2) authority kind 의 4-state matrix test 를 installation-paths.test.ts 에 명시적으로 추가 (canonical-only / legacy-only / both-present / neither-present). render-for-user.test.ts 에 delegation contract smoke 추가. (R3) U1 — E2E fixture (e2e-start-review-session.test.ts) 의 makeFakeOntoHome 에 `authorityLayout: "legacy" | "phase6"` 옵션 추가 + E-SRS-11 canonical authority 수용 smoke. (R4) scripts/check-onto-allowlist.sh self-test Case 2 에 `.onto/authorityish/` collision-adjacent negative path 추가 (segment-bound 보장 pinning, Case 2 fail paths 3 → 4, violations assertion 갱신). (R5) CC2 — `resolveInstallationPath` 에 `ONTO_DEBUG_LAYOUT=1` gate observability 추가. both_present 상태를 stderr 로 진단 출력 (canonical-first 행동 불변, Phase 7 cleanup readiness 측정 가능). 3 신규 observability test. 재검증: 95 test files / 1970 pass + 5 skip (신규 +9) / tsc clean / lint clean / allowlist-guard 0 violations. canonical-advancing.'
  - 'v0.36.0 corrective (Phase 5 review findings 전수 해소, 2026-04-21): Codex CLI core-axis 리뷰 (session 20260421-d4e3d70c) 가 발견한 CONS-1 / CONS-2 / UNIQ-COV-1/2 / UNIQ-EVO-1 / UNIQ-SEM-1/2 를 머지 전 해소. (1) CONS-1 `promote-principle.ts` target validation 3 결함: existsSync bypass 제거 (validation 항상 수행), `startsWith` → `startsWithDirPrefix` (segment-bound, `.onto/principlesABC/` 같은 near-miss 차단), queue persist 시 `canonicalizeLayoutPath` 적용 (legacy → canonical 변환 후 저장). (2) CONS-2 공용 layout-alias helper 추출: 신규 `src/core-runtime/discovery/path-normalization.ts` (LAYOUT_ALIASES + startsWithDirPrefix + canonicalizeLayoutPath). `promote-principle.ts` 와 `drift-engine.ts` 가 함께 소비. `installation-paths.ts` 의 LEGACY_DIR_OVERRIDES 와 일관성 테스트로 보호. `drift-engine.ts` GOVERNANCE_CORE_PREFIXES 를 dir-prefix / file-path 로 분리, `.onto/authority/` + `design-principles/` 추가 수용 (Phase 6 대비). (3) UNIQ-COV-1 `bin/onto:7` 주석의 legacy `design-principles/project-locality-principle.md` → `.onto/principles/product-locality-principle.md`. script 에 `DEFAULT_INCLUDE_FILES` + `--include-file` flag 신설 — extensionless tracked entrypoint 도 bulk run 에서 rewrite 가능. (4) UNIQ-COV-2 `promote-principle.test.ts` 에 process 분기 + edge case 11 test 추가 (canonical/legacy dual-path × segment-bound rejection × canonicalize persist). (5) UNIQ-EVO-1 migration script 의 `DEFAULT_EXCLUDE_PATH_PREFIXES` 에 `.onto/review/` 추가 + `--exclude-path-prefix` flag. Phase 6/7 bulk rerun 이 과거 review audit artifact 를 rewrite 하지 않도록 방어. (6) UNIQ-SEM-1 `design_principle` category label vs 실제 referent set (`.onto/principles/*` 전체, principle + guideline + charter) 불일치를 `PromotePrincipleProposal.target` JSDoc 에 명시 — 라벨은 proposal-schema compatibility 를 위해 유지. (7) UNIQ-SEM-2 migration script docstring: marker guard 가 load-bearing 인 조건 (new ⊃ old as substring) 을 phase 별로 명시 — Phase 1-5 는 no-op, Phase 6 만 load-bearing. Self-referential SSOT guard 강화: installation-paths + path-normalization 파일들을 DEFAULT_EXCLUDE_FILES 에 추가해 bulk rerun 이 legacy mapping 자체를 파괴하