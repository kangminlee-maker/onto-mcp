findings:
  - finding_id: "finding-001"
    lens_id: "logic"
    source_ref: "round1/logic.md#LOGIC-001"
    target: ".onto/processes/reconstruct/top-level-concept-discovery-contract.md"
    evidence_anchor: "LOGIC-001 — Answerability question ID uniqueness conflicts with declared question inventory reuse"
    claim: "The answerability contract requires each declared handoff question to appear in exactly one supported, deferred, or unsupported status bucket, but the uniqueness wording can be read as forbidding the same question_id from appearing both in the declared inventory and in a status bucket."
    proposed_action: "Change the status-bucket uniqueness rule so it applies across the three status bucket arrays only, while requiring every such question_id to be a member of declared_handoff_questions[].question_id."
    affected_purpose: "Deterministic Seed answerability validation and closed handoff question inventory semantics."
    failure_condition: "For any non-empty declared_handoff_questions set, a validator or reader interprets uniqueness across answerability_scope as including both the declared inventory and the status buckets."
    impact: "The contract can become formally unsatisfiable while appearing to define deterministic validation, weakening trust in Seed handoff answerability and final review correctness."
    evidence_refs: ["round1/logic.md#LOGIC-001", ".onto/processes/reconstruct/top-level-concept-discovery-contract.md:184", ".onto/processes/reconstruct/top-level-concept-discovery-contract.md:185", ".onto/processes/reconstruct/top-level-concept-discovery-contract.md:188", ".onto/processes/reconstruct/top-level-concept-discovery-contract.md:207"]
    severity: "medium"
    domain_threshold_used: null
  - finding_id: "finding-002"
    lens_id: "dependency"
    source_ref: "round1/dependency.md#DEP-1"
    target: ".onto/processes/reconstruct/top-level-concept-discovery-contract.md"
    evidence_anchor: "Finding DEP-1 — Material"
    claim: "answerability_scope encodes the question-to-action support relation in both supported_questions[].action_readiness_refs[] and supported_actions[].supported_by_question_ids[], but validation only checks referenced IDs exist and does not enforce inverse consistency."
    proposed_action: "Prefer one canonical direction, likely supported_actions[].supported_by_question_ids[], and mark the other as derived; or add deterministic validation that both projections are exact inverses when both are present."
    affected_purpose: "Answerability dependency graph integrity and handoff readiness evidence."
    failure_condition: "A supported question lists an action that omits the question, or an action claims support from a question that does not list the action, while validation still passes because all IDs exist."
    impact: "The handoff readiness relation can diverge across two writable paths, weakening auditability and dependency trust for the declared review purpose."
    evidence_refs: ["round1/dependency.md#DEP-1", ".onto/review/20260528-e8c8b240/execution-preparation/materialized-input.md#Seed Answerability Contract", ".onto/domains/software-engineering/dependency_rules.md#Direction Rules / Dependency Direction Vocabulary"]
    severity: "medium"
    domain_threshold_used: ".onto/domains/software-engineering/dependency_rules.md#Direction Rules / Dependency Direction Vocabulary"
  - finding_id: "finding-003"
    lens_id: "conciseness"
    source_ref: "round1/conciseness.md#C-1"
    target: ".onto/processes/reconstruct/top-level-concept-discovery-contract.md"
    evidence_anchor: "C-1 Duplicate singular/plural lifecycle mapping fields"
    claim: "The lifecycle schema carries singular and array forms for the same mapping relationship, such as prior_concept_id plus prior_concept_ids and current_relation_id plus current_relation_ids, even though array fields are later declared authoritative for split and merge continuity."
    proposed_action: "Remove singular ID fields from the canonical lifecycle schema, or move them explicitly to the legacy or compatibility section as optional derived projections, with validation treating only array fields as authoritative."
    affected_purpose: "Ontology-level parsimony, lifecycle continuity authority, and deterministic migration validation."
    failure_condition: "One-to-one, split, or merge lifecycle mappings are represented through both singular and array fields that can diverge or be treated as competing active paths."
    impact: "Multiple active paths for the same lifecycle relationship weaken concept economy, reproducibility, and authority clarity in the reviewed design contract."
    evidence_refs: ["round1/conciseness.md#C-1", ".onto/processes/reconstruct/top-level-concept-discovery-contract.md#lifecycle.prior_concept_mappings", ".onto/processes/reconstruct/top-level-concept-discovery-contract.md#lifecycle.prior_relation_mappings"]
    severity: "medium"
    domain_threshold_used: ".onto/domains/software-engineering/conciseness_rules.md#2. Removal Target Patterns; 3. Minimum Granularity Criteria"
  - finding_id: "finding-004"
    lens_id: "conciseness"
    source_ref: "round1/conciseness.md#C-2"
    target: ".onto/processes/reconstruct/top-level-concept-discovery-contract.md"
    evidence_anchor: "C-2 Relation participation exception status is over-split"
    claim: "relation_participation_exceptions[].status distinguishes provisionally_isolated from boundary_isolated, but the diff does not define distinct validation, consumer behavior, lifecycle transition, or dependency consequence for the two values."
    proposed_action: "Collapse the field to a single exception marker such as isolated, or remove status and rely on isolation_reason plus isolation_pressure_ids; if both statuses remain, define their distinct validation and handoff consequences."
    affected_purpose: "Concise relation exception modeling and reader confidence in status enum semantics."
    failure_condition: "Consumers must choose between two status values that classify the same structural condition without a demonstrated behavioral difference."
    impact: "The over-split enum can reduce clarity and maintainability, though the surrounding contract still constrains relation authority sufficiently for the declared purpose."
    evidence_refs: ["round1/conciseness.md#C-2", ".onto/processes/reconstruct/top-level-concept-discovery-contract.md#relation_participation_exceptions.status"]
    severity: "low"
    domain_threshold_used: ".onto/domains/software-engineering/conciseness_rules.md#2. Removal Target Patterns; 3. Minimum Granularity Criteria"
  - finding_id: "finding-005"
    lens_id: "conciseness"
    source_ref: "round1/conciseness.md#C-3"
    target: ".onto/processes/reconstruct/top-level-concept-discovery-contract.md"
    evidence_anchor: "C-3 Source snapshot refs may duplicate transition current refs"
    claim: "lifecycle.source_snapshot_refs and lifecycle.source_snapshot_transition.current_snapshot_refs both appear to carry the current Seed source snapshot set, without stating whether one is authoritative, derived, historical, or repeated."
    proposed_action: "Define source_snapshot_refs as the current canonical snapshot authority and make transition refs derived, or make source_snapshot_transition.current_snapshot_refs the authority and label source_snapshot_refs as a derived summary."
    affected_purpose: "Source snapshot authority clarity and lifecycle traceability."
    failure_condition: "Both fields are interpreted as authoritative carriers for the same current snapshot identity and drift apart."
    impact: "This is a minor duplication risk that may weaken maintainability and source-of-truth clarity but does not make the reviewed result unsafe for its declared purpose."
    evidence_refs: ["round1/conciseness.md#C-3", ".onto/processes/reconstruct/top-level-concept-discovery-contract.md#lifecycle.source_snapshot_refs", ".onto/processes/reconstruct/top-level-concept-discovery-contract.md#lifecycle.source_snapshot_transition.current_snapshot_refs"]
    severity: "low"
    domain_threshold_used: ".onto/domains/software-engineering/conciseness_rules.md#2. Removal Target Patterns; 3. Minimum Granularity Criteria"
