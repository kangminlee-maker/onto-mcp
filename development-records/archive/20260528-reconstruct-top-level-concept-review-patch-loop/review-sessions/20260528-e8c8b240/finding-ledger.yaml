    evidence_anchor: "Non-Blocking Notes — boundary_isolated"
    claim: "boundary_isolated is understandable in context but semantically denser than provisionally_isolated and could be confused with the concept boundary object by future readers."
    proposed_action: "If future readers confuse the term, add a short phrase clarifying that the concept is isolated because its current concept boundary intentionally has no Seed-level relation."
    affected_purpose: "Semantic clarity for relation participation exception status interpretation."
    failure_condition: "A reader interprets boundary_isolated as referring to a separate boundary object rather than an isolated Seed-level relation condition."
    impact: "The surrounding text already constrains the meaning, so this is a non-material clarity observation rather than a trust-breaking issue."
    evidence_refs: ["round1/semantics.md#non-blocking-notes"]
