    evidence_anchor: ".onto/review/20260528-d4633121/execution-preparation/materialized-input.md:322-329,1075-1077"
    claim: "lifecycle pressure_events carries both pressure_ids[] and current_pressure_id without defining a distinct bulk-event meaning that separates the two authorities."
    proposed_action: "Collapse to one canonical affected-pressure field, or explicitly define multi-pressure event semantics and when current_pressure_id differs from pressure_ids[]."
    affected_purpose: "documentation/design-contract conciseness, lifecycle authority clarity, deterministic validation, and auditability for pressure transitions"
    failure_condition: "When a pressure transition event includes both pressure_ids[] and current_pressure_id, future records or validators may encode the affected pressure through two overlapping paths."
    impact: "This weakens reproducibility and audit trust because the pressure lifecycle event model does not make the canonical pressure reference unambiguous."
    evidence_refs: ["round1/conciseness.md#c-2"]
    severity: "medium"
    domain_threshold_used: null
