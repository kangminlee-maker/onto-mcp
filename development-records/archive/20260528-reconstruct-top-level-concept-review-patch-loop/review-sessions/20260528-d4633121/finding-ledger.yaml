  - finding_id: "finding-001"
    lens_id: "conciseness"
    source_ref: "round1/conciseness.md#c-1"
    target: ".onto/processes/reconstruct/top-level-concept-discovery-contract.md"
    evidence_anchor: ".onto/review/20260528-d4633121/execution-preparation/materialized-input.md:426-466,846-848,1110-1111"
    claim: "top_level_relations stores relation_kind and relation_axis as field-level relation authority even though the design-local relation kind table maps each relation_kind to exactly one relation_axis."
    proposed_action: "Make relation_kind the stored authority and derive relation_axis for display, grouping, validation reports, or explicitly mark relation_axis as a non-authoritative derived projection."
    affected_purpose: "documentation/design-contract conciseness, artifact truth, auditability, and regression-risk control for reconstruct top-level relation authority"
    failure_condition: "When relation_kind and relation_axis diverge in a Seed record or future migration, consumers can observe two stored classifications for the same relation fact."
    impact: "This creates a duplicate authority path for relation classification, weakening trust that the Seed has one canonical source for relation semantics and increasing drift risk in validators and downstream consumers."
    evidence_refs: ["round1/conciseness.md#c-1"]
    severity: "medium"
    domain_threshold_used: null
  - finding_id: "finding-002"
    lens_id: "conciseness"
