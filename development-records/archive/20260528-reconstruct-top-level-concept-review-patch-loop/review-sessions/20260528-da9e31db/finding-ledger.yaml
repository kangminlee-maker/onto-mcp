  - finding_id: "structure-001"
    lens_id: "structure"
    source_ref: "round1/structure.md#structure-001"
    target: ".onto/processes/reconstruct/top-level-concept-discovery-contract.md"
    evidence_anchor: "contract lines 799, 935, and 997 as cited by structure lens"
    claim: "The legacy compatibility table maps retired boundary_notes to top_level_concepts[].boundary_statement, but the Seed output shape does not define top_level_concepts[].boundary_statement and instead defines top_level_concepts[].boundary with included_summary, excluded_summary, and deferred_summary."
    proposed_action: "Either add boundary_statement to top_level_concepts[] as a canonical or derived field, or change the migration and validation language to target the existing top_level_concepts[].boundary object while keeping final-output summaries explicitly derived."
    affected_purpose: "Fresh verification of the reconstruct top-level concept discovery design patch, especially retired-seat legacy migration mappings and artifact truth."
    failure_condition: "A migration implementer or deterministic validator follows the retired boundary_notes mapping and cannot find the declared target authority field in the Seed shape."
    impact: "The migration path points to a missing authority seat, making deterministic migration and validation ambiguous and weakening trust in the design contract."
    evidence_refs: ["round1/structure.md#structure-001"]
    severity: "medium"
    domain_threshold_used: null
  - finding_id: "structure-002"
    lens_id: "structure"
    source_ref: "round1/structure.md#structure-002"
    target: ".onto/processes/reconstruct/top-level-concept-discovery-contract.md"
    evidence_anchor: "contract lines 795, 345-355, and 1082 as cited by structure lens"
    claim: "The Seed output shape adds top_level_concepts[].aliases and says concept lifecycle must cover aliasing, but the lifecycle schema has no alias-specific event type or prior/current alias fields."
    proposed_action: "Add alias lifecycle coverage, such as alias_added, alias_removed, or alias_changed events with prior_aliases and current_aliases, or explicitly state that alias changes are covered by renamed and add alias fields to that event."
    affected_purpose: "Fresh verification of complete concept-centered lifecycle implementation guidance and provenance."
    failure_condition: "A concept alias changes across Seed lifecycle or migration, but the lifecycle/provenance artifact has no explicit seat to record that change."
    impact: "Aliases become an orphan artifact property, so future runtime or review could preserve concept IDs while silently changing aliases without traceable provenance."
    evidence_refs: ["round1/structure.md#structure-002"]
    severity: "medium"
    domain_threshold_used: null
