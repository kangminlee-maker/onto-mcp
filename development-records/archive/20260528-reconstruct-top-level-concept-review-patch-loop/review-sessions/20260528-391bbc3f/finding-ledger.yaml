    affected_purpose: "Self-contained agent execution and reviewability for the reconstruct top-level concept discovery design contract."
    failure_condition: "A developer or runtime builder follows the recommended implementation order as the practical execution path and cannot determine whether pressure events, answerability events, detail placement events, and material coverage/source-authority events are in scope for the same implementation step or deferred."
    impact: "The happy path remains possible, but practical implementation and review trust are weakened because the contract body and execution checklist can be read as different lifecycle targets."
