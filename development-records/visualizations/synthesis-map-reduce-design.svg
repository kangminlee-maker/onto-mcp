<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img" aria-labelledby="title desc">
  <title id="title">Review synthesis Map-Reduce design</title>
  <desc id="desc">Shows the proposed issue-scoped parallel synthesis pipeline, runtime merge, optional global pass, and final runtime-rendered artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .runtime { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 8; }
      .llm { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.8; rx: 8; }
      .artifact { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 8; }
      .optional { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.6; rx: 8; }
      .guard { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; rx: 8; }
      .title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .h { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .t { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #334155; }
      .small { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #475569; }
      .tag { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .line { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .parallel { stroke: #4f46e5; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1480" height="900" />
  <text class="title" x="42" y="46">Proposed Boundary: Issue-Scoped Parallel Synthesis + Runtime Merge</text>
  <text class="t" x="42" y="74">Blue = LLM semantic work, green = runtime deterministic work, orange = canonical artifacts, purple = optional global pass, red = validation gate.</text>

  <rect class="panel" x="42" y="120" width="270" height="610" />
  <text class="h" x="66" y="150">Upstream authorities</text>
  <text class="small" x="66" y="172">already decide issue identity and conflict</text>

  <rect class="artifact" x="72" y="202" width="220" height="62" />
  <text class="h" x="92" y="228">finding-ledger.yaml</text>
  <text class="small" x="92" y="248">surface findings + causal paths</text>

  <rect class="artifact" x="72" y="282" width="220" height="70" />
  <text class="h" x="92" y="308">relation graph</text>
  <text class="small" x="92" y="328">same root, shared cause</text>
  <text class="small" x="92" y="344">dependency candidates</text>

  <rect class="artifact" x="72" y="370" width="220" height="70" />
  <text class="h" x="92" y="396">issue-ledger.yaml</text>
  <text class="small" x="92" y="416">root-cause issue clusters</text>
  <text class="small" x="92" y="432">severity + materiality</text>

  <rect class="artifact" x="72" y="458" width="220" height="82" />
  <text class="h" x="92" y="484">stance + deliberation</text>
  <text class="small" x="92" y="506">issue-stance-matrix</text>
  <text class="small" x="92" y="524">deliberation-resolution</text>

  <rect class="artifact" x="72" y="558" width="220" height="74" />
  <text class="h" x="92" y="584">problem-framing.yaml</text>
  <text class="small" x="92" y="606">timing, closure, domain axes</text>
  <text class="small" x="92" y="622">actionability framing</text>

  <rect class="runtime" x="380" y="225" width="250" height="150" />
  <text class="tag" x="404" y="254">RUNTIME</text>
  <text class="h" x="404" y="278">create work items</text>
  <text class="small" x="404" y="304">material issues only</text>
  <text class="small" x="404" y="324">bounded issue projections</text>
  <text class="small" x="404" y="344">explicit evidence refs</text>

  <rect class="artifact" x="380" y="430" width="250" height="92" />
  <text class="h" x="404" y="460">synthesis-work-items.yaml</text>
  <text class="small" x="404" y="486">one work item per material issue</text>
  <text class="small" x="404" y="506">non-material rows stay runtime-owned</text>

  <path class="line" d="M292 232 C340 232, 350 250, 380 268" />
  <path class="line" d="M292 318 C340 318, 350 304, 380 304" />
  <path class="line" d="M292 404 C340 404, 350 348, 380 344" />
  <path class="line" d="M292 500 C340 500, 350 370, 380 360" />
  <path class="line" d="M292 594 C340 594, 350 502, 380 486" />
  <path class="line" d="M505 375 L505 430" />

  <rect class="panel" x="700" y="120" width="300" height="610" />
  <text class="h" x="724" y="150">Map: parallel issue synthesis</text>
  <text class="small" x="724" y="172">small context, deep semantic explanation</text>

  <rect class="llm" x="730" y="210" width="240" height="94" />
  <text class="tag" x="752" y="238">LLM</text>
  <text class="h" x="752" y="260">issue-001 synthesis</text>
  <text class="small" x="752" y="282">root cause + action explanation</text>

  <rect class="llm" x="730" y="338" width="240" height="94" />
  <text class="tag" x="752" y="366">LLM</text>
  <text class="h" x="752" y="388">issue-002 synthesis</text>
  <text class="small" x="752" y="410">materiality + causal path</text>

  <rect class="llm" x="730" y="466" width="240" height="94" />
  <text class="tag" x="752" y="494">LLM</text>
  <text class="h" x="752" y="516">issue-N synthesis</text>
  <text class="small" x="752" y="538">bounded response YAML</text>

  <rect class="artifact" x="730" y="608" width="240" height="78" />
  <text class="h" x="752" y="634">synthesis/responses/*.yaml</text>
  <text class="small" x="752" y="656">structured issue responses</text>
  <text class="small" x="752" y="674">no id/severity/ref authority</text>

  <path class="parallel" d="M630 476 C670 396, 684 264, 730 256" />
  <path class="parallel" d="M630 476 C676 466, 694 394, 730 386" />
  <path class="parallel" d="M630 476 C674 494, 694 514, 730 516" />
  <path class="line" d="M850 304 L850 338" />
  <path class="line" d="M850 432 L850 466" />
  <path class="line" d="M850 560 L850 608" />

  <rect class="runtime" x="1080" y="210" width="260" height="126" />
  <text class="tag" x="1104" y="238">RUNTIME</text>
  <text class="h" x="1104" y="262">merge + validate</text>
  <text class="small" x="1104" y="288">coverage, refs, severity drift</text>
  <text class="small" x="1104" y="308">unresolved disagreement honesty</text>
  <text class="small" x="1104" y="326">boundary-note limits</text>

  <rect class="artifact" x="1080" y="374" width="260" height="96" />
  <text class="h" x="1104" y="404">synthesis-ledger.yaml</text>
  <text class="small" x="1104" y="430">canonical synthesis truth</text>
  <text class="small" x="1104" y="450">material + non-material preserved</text>

  <rect class="optional" x="1080" y="510" width="260" height="102" />
  <text class="tag" x="1104" y="538">OPTIONAL LLM</text>
  <text class="h" x="1104" y="562">global consistency pass</text>
  <text class="small" x="1104" y="586">reads ledger only</text>
  <text class="small" x="1104" y="604">no new findings or severity changes</text>

  <rect class="runtime" x="1080" y="650" width="260" height="100" />
  <text class="tag" x="1104" y="678">RUNTIME</text>
  <text class="h" x="1104" y="702">render final artifacts</text>
  <text class="small" x="1104" y="724">synthesis.md, final-output.md</text>
  <text class="small" x="1104" y="742">review-record.yaml refs ledger</text>

  <path class="line" d="M970 648 C1026 648, 1032 276, 1080 276" />
  <path class="line" d="M1210 336 L1210 374" />
  <path class="dash" d="M1210 470 L1210 510" />
  <path class="line" d="M1210 612 L1210 650" />
  <path class="line" d="M1340 422 C1386 474, 1386 684, 1340 700" />

  <rect class="guard" x="380" y="610" width="250" height="100" />
  <text class="h" x="404" y="638">Fail-loud gates</text>
  <text class="small" x="404" y="664">missing/duplicate material issue</text>
  <text class="small" x="404" y="682">unknown refs or severity drift</text>
  <text class="small" x="404" y="700">non-material omission</text>
  <path class="dash" d="M630 650 C690 690, 1010 700, 1080 700" />

  <rect class="artifact" x="72" y="760" width="1268" height="70" />
  <text class="h" x="96" y="790">Resulting authority</text>
  <text class="small" x="96" y="814">Issue identity, consensus, relation, materiality, and deliberation resolution remain upstream artifact truth. LLM synthesis explains each material issue; runtime owns merge, validation, and final publication artifacts.</text>
</svg>
