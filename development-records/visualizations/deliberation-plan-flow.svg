<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1040" viewBox="0 0 1760 1040" role="img" aria-labelledby="title desc">
  <title id="title">Deliberation plan input and output flow</title>
  <desc id="desc">A process diagram showing how review issue artifacts and supplemental lens outputs flow into the deliberation-plan unit, which stages are runtime deterministic work, LLM semantic work, or LLM work using deterministic file tools, and how the resulting deliberation-plan artifact controls downstream deliberation dispatch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .artifact { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .runtime { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .llm { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .toolllm { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .note { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .group-dash { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow-soft); }
      .dash { stroke-dasharray: 6 5; }
      .badge-text { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1760" height="1040"/>

  <text class="title" x="48" y="54">Deliberation Plan Flow</text>
  <text class="subtitle" x="48" y="82">Current active path: runtime builds a bounded prompt packet, an LLM artifact builder uses deterministic file tools to produce YAML, then runtime validates coverage and drives controlled deliberation.</text>

  <g transform="translate(1010 34)">
    <rect class="runtime" x="0" y="0" width="128" height="34" rx="8"/>
    <text class="small" x="23" y="22">Runtime</text>
    <rect class="llm" x="145" y="0" width="128" height="34" rx="8"/>
    <text class="small" x="181" y="22">LLM</text>
    <rect class="toolllm" x="290" y="0" width="188" height="34" rx="8"/>
    <text class="small" x="309" y="22">LLM + file tools</text>
    <rect class="artifact" x="495" y="0" width="128" height="34" rx="8"/>
    <text class="small" x="526" y="22">Artifact</text>
  </g>

  <g id="inputs">
    <rect class="group" x="40" y="135" width="385" height="475" rx="16"/>
    <text class="label" x="68" y="166">Inputs Open To Deliberation Plan</text>
    <text class="tiny" x="68" y="187">Read authority is generated by runtime; issue artifacts are the primary input.</text>

    <rect class="artifact" x="68" y="218" width="320" height="50" rx="8"/>
    <text class="label" x="88" y="240">review-target-profile.yaml</text>
    <text class="tiny" x="88" y="258">target purpose and boundary profile</text>

    <rect class="artifact" x="68" y="288" width="320" height="50" rx="8"/>
    <text class="label" x="88" y="310">finding-ledger.yaml</text>
    <text class="tiny" x="88" y="328">finding rows, materiality, causal paths</text>

    <rect class="artifact" x="68" y="358" width="320" height="50" rx="8"/>
    <text class="label" x="88" y="380">finding-relation-graph.yaml</text>
    <text class="tiny" x="88" y="398">same-root and shared-cause relations</text>

    <rect class="artifact" x="68" y="428" width="320" height="50" rx="8"/>
    <text class="label" x="88" y="450">issue-ledger.yaml</text>
    <text class="tiny" x="88" y="468">root-cause issues and dependencies</text>

    <rect class="artifact" x="68" y="498" width="320" height="50" rx="8"/>
    <text class="label" x="88" y="520">issue-stance-matrix.yaml</text>
    <text class="tiny" x="88" y="538">per-lens stance, root/severity positions</text>

    <rect class="artifact" x="68" y="568" width="320" height="50" rx="8"/>
    <text class="label" x="88" y="590">round1/{lens}.md or .findings.yaml</text>
    <text class="tiny" x="88" y="608">supplemental source refs, not main planning input</text>
  </g>

  <g id="packet">
    <rect class="runtime" x="505" y="228" width="300" height="155" rx="12"/>
    <text class="label" x="530" y="258">1. Prompt Packet Builder</text>
    <text class="small" x="530" y="283">buildIssueArtifactPrompt()</text>
    <text class="small" x="530" y="305">declares prior artifacts and output ref</text>
    <text class="small" x="530" y="327">adds Unit Boundary Details</text>
    <text class="tiny" x="530" y="353">Runtime deterministic work</text>
  </g>

  <path class="line" d="M425 383 C460 383 465 306 505 306"/>

  <g id="boundary">
    <rect class="runtime" x="505" y="455" width="300" height="155" rx="12"/>
    <text class="label" x="530" y="485">2. Boundary Policy</text>
    <text class="small" x="530" y="510">Tools: required</text>
    <text class="small" x="530" y="532">repo exploration: denied</text>
    <text class="small" x="530" y="554">allowed output: deliberation-plan.yaml</text>
    <text class="tiny" x="530" y="582">Runtime deterministic guard</text>
  </g>

  <path class="thin" d="M655 383 V455"/>

  <g id="llm-builder">
    <rect class="toolllm" x="905" y="275" width="365" height="235" rx="14"/>
    <text class="label" x="932" y="306">3. Deliberation-Plan Artifact Builder</text>
    <text class="small" x="932" y="332">LLM semantic task with deterministic file tools</text>
    <text class="small" x="932" y="358">reads allowed refs through bounded tools</text>
    <text class="small" x="932" y="382">detects material conflicts from stance matrix</text>
    <text class="small" x="932" y="404">chooses participants and resolution questions</text>
    <text class="small" x="932" y="426">writes YAML only to declared output path</text>
    <rect class="note" x="932" y="452" width="310" height="40" rx="8"/>
    <text class="tiny" x="952" y="475">Semantic judgment remains LLM-owned today</text>
  </g>

  <path class="line" d="M805 306 H905"/>
  <path class="thin" d="M805 533 C840 533 850 480 905 480"/>

  <g id="decision-detail">
    <rect class="group-dash" x="905" y="565" width="365" height="165" rx="14"/>
    <text class="label" x="932" y="596">Material Conflict Rules Used</text>
    <text class="small" x="932" y="622">support vs oppose</text>
    <text class="small" x="932" y="644">alternative_root or surface_only</text>
    <text class="small" x="932" y="666">narrow changes action/severity/scope/root</text>
    <text class="small" x="932" y="688">domain/value/actionability conflict</text>
    <text class="tiny" x="932" y="712">Rules are semantic; no runtime classifier yet</text>
  </g>

  <path class="thin dash" d="M1088 510 V565"/>

  <g id="output">
    <rect class="artifact" x="1395" y="287" width="295" height="170" rx="12"/>
    <text class="label" x="1420" y="318">Output Artifact</text>
    <text class="small" x="1420" y="344">deliberation-plan.yaml</text>
    <text class="small" x="1420" y="372">planned_issues[]</text>
    <text class="small" x="1420" y="394">skipped_issues[]</text>
    <text class="small" x="1420" y="416">participating_lens_ids</text>
    <text class="tiny" x="1420" y="438">Plan, not final resolution</text>
  </g>

  <path class="line" d="M1270 390 H1395"/>

  <g id="validator">
    <rect class="runtime" x="1395" y="528" width="295" height="170" rx="12"/>
    <text class="label" x="1420" y="558">4. Runtime Validator</text>
    <text class="small" x="1420" y="584">validateIssueArtifactOnDisk()</text>
    <text class="small" x="1420" y="608">checks schema/session</text>
    <text class="small" x="1420" y="630">known issue ids</text>
    <text class="small" x="1420" y="652">all issues planned or skipped</text>
    <text class="tiny" x="1420" y="676">Shape/coverage validation, not full semantic proof</text>
  </g>

  <path class="thin" d="M1542 457 V528"/>

  <g id="downstream">
    <rect class="group" x="290" y="810" width="1260" height="150" rx="16"/>
    <text class="label" x="320" y="840">Downstream Output Flow</text>

    <rect class="runtime" x="320" y="865" width="235" height="72" rx="10"/>
    <text class="label" x="342" y="892">5. Dispatch Controller</text>
    <text class="tiny" x="342" y="914">planned_issues create issue-scoped units</text>

    <rect class="toolllm" x="630" y="865" width="255" height="72" rx="10"/>
    <text class="label" x="652" y="892">6. Lens Deliberation</text>
    <text class="tiny" x="652" y="914">LLM + bounded context/tools per lens</text>

    <rect class="toolllm" x="960" y="865" width="250" height="72" rx="10"/>
    <text class="label" x="982" y="892">7. Teamlead Resolution</text>
    <text class="tiny" x="982" y="914">LLM + responses and issue artifacts</text>

    <rect class="artifact" x="1285" y="865" width="225" height="72" rx="10"/>
    <text class="label" x="1307" y="892">deliberation.md</text>
    <text class="tiny" x="1307" y="914">resolved / narrowed / unresolved</text>

    <path class="line" d="M555 901 H630"/>
    <path class="line" d="M885 901 H960"/>
    <path class="line" d="M1210 901 H1285"/>
  </g>

  <path class="line" d="M1542 698 C1542 772 438 760 438 865"/>

  <g id="side-notes">
    <rect class="note" x="40" y="690" width="380" height="130" rx="12"/>
    <text class="label" x="66" y="720">Current Optimization Reading</text>
    <text class="small" x="66" y="746">Main input should be issue artifacts.</text>
    <text class="small" x="66" y="768">Round1 refs are still open as supplemental reads.</text>
    <text class="small" x="66" y="790">Next tuning target: runtime conflict projection.</text>

    <rect class="note" x="1320" y="725" width="370" height="100" rx="12"/>
    <text class="label" x="1346" y="755">Output Contract Today</text>
    <text class="small" x="1346" y="781">YAML only: planned_issues + skipped_issues.</text>
    <text class="small" x="1346" y="803">Runtime validates coverage of every known issue.</text>
  </g>

  <path class="thin dash" d="M388 593 C470 640 725 660 905 665"/>
</svg>
