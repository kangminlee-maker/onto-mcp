<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220" role="img" aria-labelledby="title desc">
  <title id="title">Problem framing input and output boundary before and after</title>
  <desc id="desc">Before and after diagram for reducing the problem-framing.yaml input and output boundary. The before side shows broad issue artifact, lens, deliberation, target, and domain refs opened to one LLM artifact builder. The after side shows runtime-generated issue classification projections, compact domain-axis projection, submit-tool structured output, and runtime-owned serialization and validation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 10 8; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .h2 { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .artifact { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .runtime { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .llm { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .toolllm { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .note { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .risk { fill: #fee2e2; stroke: #ef4444; stroke-width: 1.7; }
      .gain { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.7; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .group-dash { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; }
      .line { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow-soft); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1220"/>

  <text class="title" x="48" y="54">Problem Framing Boundary Optimization: Before and After</text>
  <text class="subtitle" x="48" y="82">Goal: preserve classification quality while shrinking LLM-visible context and structured output surface for problem-framing.yaml.</text>

  <g transform="translate(1095 34)">
    <rect class="runtime" x="0" y="0" width="124" height="34" rx="8"/>
    <text class="small" x="21" y="22">Runtime</text>
    <rect class="llm" x="140" y="0" width="124" height="34" rx="8"/>
    <text class="small" x="175" y="22">LLM</text>
    <rect class="toolllm" x="280" y="0" width="188" height="34" rx="8"/>
    <text class="small" x="299" y="22">LLM + submit tool</text>
    <rect class="artifact" x="484" y="0" width="124" height="34" rx="8"/>
    <text class="small" x="515" y="22">Artifact</text>
  </g>

  <line class="divider" x1="950" y1="112" x2="950" y2="1160"/>

  <text class="h2" x="72" y="135">Before: Broad Artifact Builder Boundary</text>
  <text class="subtitle" x="72" y="160">One structured-output LLM unit can reopen many upstream refs to classify issues.</text>

  <g id="before-inputs">
    <rect class="group" x="55" y="198" width="342" height="520" rx="16"/>
    <text class="label" x="82" y="228">LLM-Visible Read Refs</text>
    <text class="tiny" x="82" y="249">Allowed to the problem-framing unit today</text>

    <rect class="artifact" x="82" y="278" width="276" height="42" rx="8"/>
    <text class="small" x="102" y="304">review-target-profile.yaml</text>

    <rect class="artifact" x="82" y="334" width="276" height="42" rx="8"/>
    <text class="small" x="102" y="360">finding-ledger.yaml</text>

    <rect class="artifact" x="82" y="390" width="276" height="42" rx="8"/>
    <text class="small" x="102" y="416">finding-relation-graph.yaml</text>

    <rect class="artifact" x="82" y="446" width="276" height="42" rx="8"/>
    <text class="small" x="102" y="472">issue-ledger.yaml</text>

    <rect class="artifact" x="82" y="502" width="276" height="42" rx="8"/>
    <text class="small" x="102" y="528">issue-stance-matrix.yaml</text>

    <rect class="artifact" x="82" y="558" width="276" height="42" rx="8"/>
    <text class="small" x="102" y="584">deliberation-plan.yaml</text>

    <rect class="artifact" x="82" y="614" width="276" height="42" rx="8"/>
    <text class="small" x="102" y="640">deliberation result + responses</text>

    <rect class="note" x="82" y="672" width="276" height="32" rx="8"/>
    <text class="tiny" x="102" y="693">all round1 lens outputs + raw domain profile</text>
  </g>

  <g id="before-packet">
    <rect class="runtime" x="462" y="230" width="326" height="132" rx="12"/>
    <text class="label" x="490" y="260">1. Runtime Packet</text>
    <text class="small" x="490" y="286">lists broad allowed read refs</text>
    <text class="small" x="490" y="308">includes common spine enum guide</text>
    <text class="small" x="490" y="330">points at domain profile doc</text>
  </g>

  <path class="line" d="M397 458 C430 458 428 296 462 296"/>

  <g id="before-llm">
    <rect class="toolllm" x="462" y="430" width="370" height="236" rx="14"/>
    <text class="label" x="490" y="460">2. Problem-Framing LLM Unit</text>
    <text class="small" x="490" y="486">may read raw lens output again</text>
    <text class="small" x="490" y="508">may read deliberation response details</text>
    <text class="small" x="490" y="530">interprets target timing and closure</text>
    <text class="small" x="490" y="552">parses domain axes from markdown</text>
    <text class="small" x="490" y="574">submits classification_context</text>
    <text class="small" x="490" y="596">submits every classification row</text>
    <text class="tiny" x="490" y="628">semantic judgment and extraction are bundled</text>
  </g>

  <path class="thin" d="M625 362 V430"/>

  <g id="before-output">
    <rect class="artifact" x="462" y="742" width="310" height="106" rx="12"/>
    <text class="label" x="490" y="772">3. Durable Output</text>
    <text class="small" x="490" y="798">problem-framing.yaml</text>
    <text class="tiny" x="490" y="820">context plus classifications</text>
    <text class="tiny" x="490" y="838">schema/session serialized by runtime</text>
  </g>

  <path class="line" d="M647 666 V742"/>

  <g id="before-validate">
    <rect class="runtime" x="462" y="918" width="310" height="126" rx="12"/>
    <text class="label" x="490" y="948">4. Runtime Validation</text>
    <text class="small" x="490" y="974">known issue coverage</text>
    <text class="small" x="490" y="996">common spine enum tokens</text>
    <text class="small" x="490" y="1018">classification_context shape</text>
  </g>

  <path class="line" d="M617 848 V918"/>

  <g id="before-risk">
    <rect class="risk" x="70" y="792" width="327" height="220" rx="12"/>
    <text class="label" x="96" y="822">Cost / Risk</text>
    <text class="small" x="96" y="848">Input can grow with lens count and</text>
    <text class="small" x="96" y="870">deliberation participant count.</text>
    <text class="small" x="96" y="896">Raw lens refs reopen earlier reasoning.</text>
    <text class="small" x="96" y="922">Domain-axis parsing is repeated by LLM.</text>
    <text class="small" x="96" y="948">Output includes runtime-derivable context.</text>
    <text class="small" x="96" y="974">Validator sees shape, but not whether the</text>
    <text class="small" x="96" y="996">minimal classification evidence was used.</text>
  </g>

  <text class="h2" x="1002" y="135">After: Projection-First Classification Boundary</text>
  <text class="subtitle" x="1002" y="160">Runtime builds the issue classification input; LLM submits only structured classification decisions.</text>

  <g id="after-source-artifacts">
    <rect class="group" x="985" y="198" width="342" height="462" rx="16"/>
    <text class="label" x="1012" y="228">Runtime-Parsed Sources</text>
    <text class="tiny" x="1012" y="249">Artifact truth remains unchanged</text>

    <rect class="artifact" x="1012" y="278" width="276" height="42" rx="8"/>
    <text class="small" x="1032" y="304">issue-ledger.yaml</text>

    <rect class="artifact" x="1012" y="334" width="276" height="42" rx="8"/>
    <text class="small" x="1032" y="360">finding-ledger.yaml</text>

    <rect class="artifact" x="1012" y="390" width="276" height="42" rx="8"/>
    <text class="small" x="1032" y="416">finding-relation-graph.yaml</text>

    <rect class="artifact" x="1012" y="446" width="276" height="42" rx="8"/>
    <text class="small" x="1032" y="472">stance matrix + resolution truth</text>

    <rect class="artifact" x="1012" y="502" width="276" height="42" rx="8"/>
    <text class="small" x="1032" y="528">review-target-profile.yaml</text>

    <rect class="artifact" x="1012" y="558" width="276" height="42" rx="8"/>
    <text class="small" x="1032" y="584">problem_framing_profile.md</text>

    <rect class="note" x="1012" y="616" width="276" height="30" rx="8"/>
    <text class="tiny" x="1032" y="636">round1 refs are not default LLM input</text>
  </g>

  <g id="after-projection">
    <rect class="runtime" x="1378" y="208" width="372" height="248" rx="14"/>
    <text class="label" x="1405" y="238">1. Runtime Classification Projection</text>
    <text class="small" x="1405" y="266">one compact slice per issue</text>
    <text class="small" x="1405" y="288">issue statement and root hypothesis</text>
    <text class="small" x="1405" y="310">severity, purpose, failure condition</text>
    <text class="small" x="1405" y="332">final deliberation status if present</text>
    <text class="small" x="1405" y="354">surface finding ids and evidence refs</text>
    <text class="small" x="1405" y="376">target timing and closure hints</text>
    <text class="small" x="1405" y="398">domain axis catalog with allowed values</text>
    <rect class="artifact" x="1405" y="414" width="316" height="30" rx="7"/>
    <text class="tiny" x="1422" y="434">embedded in problem-framing.prompt.md</text>
  </g>

  <path class="line" d="M1327 429 C1352 429 1348 332 1378 332"/>

  <g id="after-packet">
    <rect class="runtime" x="1378" y="518" width="372" height="134" rx="12"/>
    <text class="label" x="1405" y="548">2. Narrow Runtime Packet</text>
    <text class="small" x="1405" y="574">embeds projection as primary input</text>
    <text class="small" x="1405" y="596">filesystem read refs denied by default</text>
    <text class="small" x="1405" y="618">submit schema excludes context envelope</text>
  </g>

  <path class="thin" d="M1564 456 V518"/>

  <g id="after-llm">
    <rect class="toolllm" x="1005" y="720" width="370" height="200" rx="14"/>
    <text class="label" x="1032" y="750">3. Bounded LLM Classification</text>
    <text class="small" x="1032" y="776">reads only compact projection</text>
    <text class="small" x="1032" y="798">chooses common spine enum tokens</text>
    <text class="small" x="1032" y="820">chooses domain axis values</text>
    <text class="small" x="1032" y="842">writes concise rationale</text>
    <text class="small" x="1032" y="864">calls submit_issue_artifact once</text>
    <text class="tiny" x="1032" y="894">semantic judgment stays in LLM</text>
  </g>

  <path class="line" d="M1564 652 C1564 702 1190 688 1190 720"/>

  <g id="after-runtime-write">
    <rect class="runtime" x="1438" y="720" width="315" height="200" rx="14"/>
    <text class="label" x="1465" y="750">4. Runtime Fill And Write</text>
    <text class="small" x="1465" y="776">fills schema_version and session_id</text>
    <text class="small" x="1465" y="798">fills classification_context</text>
    <text class="small" x="1465" y="820">derives related_surface_finding_ids</text>
    <text class="small" x="1465" y="842">serializes problem-framing.yaml</text>
    <text class="tiny" x="1465" y="872">artifact truth shape is preserved</text>
  </g>

  <path class="line" d="M1375 820 H1438"/>

  <g id="after-output">
    <rect class="artifact" x="1438" y="982" width="315" height="104" rx="12"/>
    <text class="label" x="1465" y="1012">5. Same Durable Artifact</text>
    <text class="small" x="1465" y="1038">problem-framing.yaml</text>
    <text class="tiny" x="1465" y="1060">same meaning, smaller authoring boundary</text>
  </g>

  <path class="line" d="M1596 920 V982"/>

  <g id="after-validation">
    <rect class="runtime" x="1005" y="982" width="370" height="142" rx="12"/>
    <text class="label" x="1032" y="1012">6. Stronger Runtime Validation</text>
    <text class="small" x="1032" y="1038">every issue exactly classified</text>
    <text class="small" x="1032" y="1060">enum and domain axis values known</text>
    <text class="small" x="1032" y="1082">finding ids derive from issue-ledger</text>
    <text class="tiny" x="1032" y="1104">fail-loud if projection or output drifts</text>
  </g>

  <path class="line" d="M1438 1034 H1375"/>

  <g id="after-gain">
    <rect class="gain" x="1378" y="1110" width="372" height="72" rx="12"/>
    <text class="label" x="1405" y="1140">Expected Gain</text>
    <text class="small" x="1405" y="1164">Less context, less serialization drift, same classification quality target.</text>
  </g>

  <g id="implementation-notes">
    <rect class="group-dash" x="70" y="1066" width="800" height="106" rx="16"/>
    <text class="label" x="96" y="1096">Implementation Delta</text>
    <text class="small" x="96" y="1122">A. Add runtime problem-framing input projection builder.</text>
    <text class="small" x="96" y="1144">B. Narrow problem-framing submit schema to classification rows.</text>
    <text class="small" x="96" y="1166">C. Remove raw round1 and deliberation-response refs from normal LLM read boundary.</text>
  </g>
</svg>
