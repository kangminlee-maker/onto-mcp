<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="985" viewBox="0 0 1560 985" role="img" aria-labelledby="title desc" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title id="title">갭-타이핑의 경계: 구현 경계로 개념 경계 정하기</title>
  <desc id="desc">온톨로지가 없는 상황에서 갭 방향(divergence/absence)을 런타임이 ref-집합/enum 읽기로 결정론적으로 판정하는 슬라이스와, 의미 동치 매칭이 필요해 LLM에 남는 잔여를 수평 캡 경계로 구분한 다이어그램.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5f6368"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#137333"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c5221f"/>
    </marker>
    <style>
      .title{font-size:29px;font-weight:700;fill:#202124}
      .subtitle{font-size:16px;fill:#5f6368}
      .lg{font-size:13px;fill:#202124}
      .boxt{font-size:16px;font-weight:700;fill:#202124}
      .line{font-size:13.5px;fill:#202124}
      .bold{font-size:13.5px;font-weight:700;fill:#202124}
      .small{font-size:12px;fill:#5f6368}
      .id{font-size:12px;fill:#5f6368;font-family:'SFMono-Regular',Menlo,Consolas,monospace}
      .cap{font-size:14.5px;font-weight:700;fill:#c5221f}
      .foot{font-size:13.5px;fill:#444}
      .rlabel{font-size:12px;font-weight:700;fill:#c5221f}
    </style>
  </defs>
  <rect width="1560" height="985" fill="#ffffff"/>

  <!-- header -->
  <text class="title" x="40" y="50">갭-타이핑의 경계 — 구현 경계로 개념 경계 정하기</text>
  <text class="subtitle" x="40" y="82">온톨로지 없이, 갭 방향(divergence/absence)을 런타임이 어디까지 결정론으로 정하고 어디서부터 LLM 의미 매칭이 시작되나?</text>

  <!-- legend -->
  <rect x="40" y="103" width="16" height="16" fill="#e8f0fe" stroke="#1a73e8"/>
  <text class="lg" x="62" y="116">입력(소스)</text>
  <rect x="185" y="103" width="16" height="16" fill="#e6f4ea" stroke="#137333"/>
  <text class="lg" x="207" y="116">런타임 결정론</text>
  <rect x="350" y="103" width="16" height="16" fill="#fef7e0" stroke="#b06000"/>
  <text class="lg" x="372" y="116">LLM 의미 매칭</text>
  <rect x="520" y="103" width="16" height="16" fill="#f1f3f4" stroke="#5f6368"/>
  <text class="lg" x="542" y="116">관측 아티팩트</text>
  <rect x="690" y="103" width="16" height="16" fill="#fce8e6" stroke="#c5221f"/>
  <text class="lg" x="712" y="116">정지 권위</text>
  <line x1="882" y1="101" x2="882" y2="121" stroke="#c5221f" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text class="lg" x="896" y="116">결정론 경계(캡)</text>
  <line x1="40" y1="138" x2="1520" y2="138" stroke="#dadce0" stroke-width="1"/>

  <!-- ===== deterministic slice (above cap) ===== -->

  <!-- INPUT -->
  <rect x="40" y="298" width="235" height="150" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text class="boxt" x="56" y="330">사용자 소스 자료</text>
  <text class="line" x="56" y="360">온톨로지 아직 없음</text>
  <text class="line" x="56" y="390">→ 도메인 온톨로지로</text>
  <text class="line" x="56" y="412">　 갭 근거 불가</text>
  <text class="small" x="44" y="478">grounding을 구현 표면 위로</text>
  <text class="small" x="44" y="496">강제 (권위분리상 옳은 수)</text>

  <!-- ARTIFACTS -->
  <text class="small" x="315" y="222">관측된 것(observed) vs 선언된 것(declared) · 둘 다 런타임 아티팩트</text>
  <rect x="315" y="235" width="305" height="115" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text class="boxt" x="330" y="265">소스 쪽</text>
  <text class="id" x="330" y="288">source-observation-delta.yaml</text>
  <text class="line" x="330" y="314">added_observation_ids</text>
  <text class="line" x="330" y="336">frontier_kind · lineage</text>

  <rect x="315" y="400" width="305" height="130" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text class="boxt" x="330" y="430">씨앗 쪽</text>
  <text class="id" x="330" y="453">matrix rows / seed elements</text>
  <text class="line" x="330" y="479">supporting_refs (관측 id 인용)</text>
  <text class="line" x="330" y="501">closure_status ·</text>
  <text class="line" x="330" y="521">purpose_source_status</text>

  <!-- RUNTIME determinism -->
  <rect x="665" y="235" width="345" height="300" rx="6" fill="#e6f4ea" stroke="#137333" stroke-width="1.5"/>
  <text class="boxt" x="680" y="265">런타임 결정론</text>
  <text class="small" x="680" y="286">ref-집합 / enum 읽기 — 외부 진리 불필요</text>
  <rect x="680" y="300" width="315" height="100" rx="5" fill="#ffffff" stroke="#137333" stroke-width="1.2"/>
  <text class="bold" x="692" y="326">divergence (소스 &gt; 씨앗)</text>
  <text class="line" x="692" y="350">observation_id 있음 &amp;</text>
  <text class="line" x="692" y="372">인용하는 row 없음</text>
  <rect x="680" y="415" width="315" height="110" rx="5" fill="#ffffff" stroke="#137333" stroke-width="1.2"/>
  <text class="bold" x="692" y="441">absence (씨앗 &gt; 소스)</text>
  <text class="line" x="692" y="465">closure_status ∈</text>
  <text class="line" x="692" y="485">{frontier_required, unresolved}</text>
  <text class="line" x="692" y="507">또는 받쳐주는 ref 없음</text>

  <!-- ROUTING -->
  <rect x="1055" y="250" width="445" height="95" rx="6" fill="#e6f4ea" stroke="#137333" stroke-width="1.5"/>
  <text class="bold" x="1070" y="282">→ 새 frontier / expansion</text>
  <text class="line" x="1070" y="306">소스를 더 관측해 흡수</text>
  <text class="small" x="1070" y="328">(계속 신호에 기여)</text>

  <rect x="1055" y="370" width="445" height="95" rx="6" fill="#e6f4ea" stroke="#137333" stroke-width="1.5"/>
  <text class="bold" x="1070" y="402">→ limitation 기록</text>
  <text class="line" x="1070" y="426">소스에 없음 → 그만 찾음</text>
  <text class="small" x="1070" y="448">(정지 신호에 기여)</text>

  <rect x="1055" y="500" width="445" height="95" rx="6" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/>
  <text class="boxt" x="1070" y="530">MaturationContinuationDecision</text>
  <text class="line" x="1070" y="556">정지 / 계속 판정 — 기존 정지 권위</text>
  <text class="small" x="1070" y="578">신규 개념 아님 · 갭-타이핑은 그 입력을 굳힘</text>

  <!-- arrows: deterministic flow -->
  <line x1="275" y1="338" x2="312" y2="294" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="275" y1="408" x2="312" y2="462" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="620" y1="292" x2="662" y2="305" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="620" y1="465" x2="662" y2="468" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1010" y1="350" x2="1052" y2="297" stroke="#137333" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <line x1="1010" y1="470" x2="1052" y2="417" stroke="#137333" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <line x1="1277" y1="465" x2="1277" y2="497" stroke="#137333" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <polyline points="1500,297 1528,297 1528,547 1503,547" fill="none" stroke="#137333" stroke-width="1.8" marker-end="url(#arrowG)"/>

  <!-- ===== CAP boundary ===== -->
  <line x1="40" y1="690" x2="1520" y2="690" stroke="#c5221f" stroke-width="2.5" stroke-dasharray="9 5"/>
  <rect x="560" y="673" width="440" height="24" fill="#ffffff"/>
  <text class="cap" x="780" y="690" text-anchor="middle">구현 경계 = 개념 경계 캡  ·  위: 런타임 결정론   아래: LLM 의미 매칭</text>

  <!-- residue crossing arrow -->
  <line x1="835" y1="535" x2="835" y2="718" stroke="#c5221f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowR)"/>
  <rect x="846" y="640" width="170" height="20" fill="#ffffff"/>
  <text class="rlabel" x="852" y="655">의미 동치가 필요해지는 지점</text>

  <!-- ===== semantic residue (below cap) ===== -->
  <rect x="40" y="720" width="1480" height="158" rx="6" fill="#fef7e0" stroke="#b06000" stroke-width="1.5"/>
  <text class="boxt" x="58" y="752">의미 매칭 잔여 — 캡 바깥 (LLM author + validator)</text>
  <text class="line" x="58" y="784">인용 안 된 관측이 *정말* 미커버인가, 아니면 인용만 안 됐나?  → 의미 동치 판정</text>
  <text class="line" x="58" y="812">coverage가 ‘명시적 ref 인용’으로 정의된 한, 런타임은 의미 동치를 결정하지 못함</text>
  <text class="line" x="58" y="840">→ 이 잔여는 semantic으로 남기고 *명시적 한계*로 선언 (materiality 의존 한계와 같은 선)</text>

  <!-- footnote -->
  <text class="foot" x="40" y="935">주의 — ‘구현 경계’ = 현재 코드가 하는 것 ❌    관측 아티팩트로 *원리적으로* 결정 가능한 것(capability 경계) ✓ : 이 방법의 유일한 함정</text>
</svg>
